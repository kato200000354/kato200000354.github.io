name: 回数とプレイ時間を集計

on:
  schedule:
    - cron: '17 * * * *'   # 毎時17分（日本時間でも毎時）
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-counts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-counts.mjs
      - name: 変化があれば保存してサイトを更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- counts.json counts-history.json && git ls-files --error-unmatch counts.json counts-history.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counts.json counts-history.json
          git commit -m "回数とプレイ時間を集計"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
