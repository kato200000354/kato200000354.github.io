<meta name="description" content="反重力マシンで時速400kmオーバーの世界へ！3Dの宙に浮かぶコースをドリフト、ミニターボ、ダッシュ板、スリップストリームで駆け抜けて、最後尾から8台をごぼう抜きしよう。ネオンシティ・夕焼けキャニオン・スペースリングの3コース。">

[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05010f;color:#fff;font-family:'M PLUS Rounded 1c',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.orb{font-family:'Orbitron','M PLUS Rounded 1c',sans-serif}
#boostfx{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(25,240,255,.18) 75%,rgba(255,47,208,.35) 100%);transition:opacity .1s}
#hud{position:fixed;inset:0;pointer-events:none}
#pos{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));font-weight:900;line-height:1;text-shadow:0 0 12px rgba(25,240,255,.8),0 2px 0 #000}
#pos b{font-size:56px}#pos span{font-size:20px;margin-left:2px}#pos i{font-style:normal;font-size:18px;opacity:.7;margin-left:4px}
#laps{position:absolute;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));text-align:center;text-shadow:0 2px 0 #000}
#lap{font-size:20px;font-weight:900;letter-spacing:1px}
#time{font-size:16px;opacity:.95;margin-top:2px}
#bestlap{font-size:11px;opacity:.7;margin-top:2px}
#mini{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(52px,calc(env(safe-area-inset-top) + 46px));width:118px;height:118px;opacity:.9}
#pauseBtn{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));width:38px;height:38px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font-size:16px;font-weight:900;pointer-events:auto}
#meter{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));text-align:center;width:min(300px,46vw)}
#spd{font-size:40px;font-weight:900;line-height:1;text-shadow:0 0 14px rgba(25,240,255,.7),0 2px 0 #000}
#spd small{font-size:13px;opacity:.8;margin-left:4px}
#tier{height:16px;font-size:13px;font-weight:900;letter-spacing:2px;margin-bottom:2px}
#ebar{position:relative;height:12px;border-radius:7px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.5);overflow:hidden;margin-top:6px}
#efill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#19f0ff,#ff2fd0)}
#ebar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(34% - 1px),rgba(255,255,255,.8) 34%,transparent calc(34% + 2px),transparent calc(68% - 1px),rgba(255,255,255,.8) 68%,transparent calc(68% + 2px))}
#elabel{font-size:10px;letter-spacing:2px;opacity:.8;margin-top:3px}
#ebar.ready{box-shadow:0 0 12px #ff2fd0}
#cd{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);font-size:120px;font-weight:900;text-shadow:0 0 30px #ff2fd0,0 4px 0 #000}
#pops{position:absolute;left:0;right:0;top:22%;display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.pop{font-weight:900;font-size:28px;text-shadow:0 0 14px currentColor,0 3px 0 #000;animation:pop 1.2s ease-out forwards;white-space:nowrap}
.pop.big{font-size:48px}.pop.s{font-size:20px}
@keyframes pop{0%{transform:scale(2.2);opacity:0}12%{transform:scale(1);opacity:1}75%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
#guide{position:absolute;left:50%;top:max(80px,13%);transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:rgba(5,1,20,.72);border:2px solid rgba(25,240,255,.6);border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.7;transition:opacity .6s}
#guide b{color:#19f0ff}
#touch{position:fixed;inset:0;pointer-events:none}
.tb{position:absolute;pointer-events:auto;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(10,10,30,.35);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb.on{background:rgba(25,240,255,.45);border-color:#fff}
#tL{left:max(14px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:78px;height:78px;font-size:30px}
#tR{left:calc(max(14px,env(safe-area-inset-left)) + 90px);bottom:max(18px,env(safe-area-inset-bottom));width:78px;height:78px;font-size:30px}
#tD{right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:92px;height:92px;font-size:15px}
#tB{right:calc(max(14px,env(safe-area-inset-right)) + 104px);bottom:max(30px,calc(env(safe-area-inset-bottom) + 12px));width:72px;height:72px;font-size:13px;border-color:#ff2fd0}
#tB.on{background:rgba(255,47,208,.5)}
@media (max-width:600px){#meter{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 96px);width:60vw}#spd{font-size:32px}}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;overflow-y:auto}
#title{background:linear-gradient(180deg,rgba(5,1,15,.55),rgba(5,1,15,.15) 40%,rgba(5,1,15,.75))}
.logo{font-size:clamp(38px,9vw,76px);font-weight:900;font-style:italic;letter-spacing:2px;background:linear-gradient(90deg,#19f0ff,#fff 50%,#ff2fd0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(25,240,255,.6));text-align:center;line-height:1.05}
.logo-jp{font-size:18px;letter-spacing:6px;margin-top:4px;text-shadow:0 0 10px #ff2fd0}
.tag{margin-top:6px;font-size:14px;opacity:.9}
#cards{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center;max-width:720px}
.card{width:200px;max-width:calc(50vw - 24px);min-width:150px;padding:10px 12px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(10,6,30,.65);cursor:pointer;text-align:left;color:#fff;font-family:inherit}
.card.sel{border-color:#19f0ff;box-shadow:0 0 18px rgba(25,240,255,.6)}
.card.lock{opacity:.5;cursor:default}
.card h3{font-size:16px}.card .en{font-size:10px;letter-spacing:2px;opacity:.7}
.card .rec{font-size:12px;margin-top:6px;opacity:.9;line-height:1.5}
.btn{margin-top:18px;padding:14px 44px;border-radius:40px;border:none;font-family:'Orbitron','M PLUS Rounded 1c',sans-serif;font-weight:900;font-size:22px;color:#05010f;background:linear-gradient(90deg,#19f0ff,#ff2fd0);box-shadow:0 0 24px rgba(255,47,208,.6);cursor:pointer;letter-spacing:2px}
.btn.sub{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.5);font-size:16px;padding:10px 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.how{margin-top:14px;font-size:12px;line-height:1.8;opacity:.85;text-align:center;max-width:520px}
#snd{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));padding:8px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font-family:inherit;font-weight:800;font-size:13px}
#result,#pause{background:rgba(5,1,15,.8)}
#rRank{font-size:96px;font-weight:900;line-height:1;text-shadow:0 0 30px currentColor}
#rRank small{font-size:36px}
#rMsg{font-size:20px;font-weight:800;margin-top:4px}
#rTimes{margin-top:10px;font-size:15px;text-align:center;line-height:1.7}
.nr{color:#ffd23f;font-weight:900;margin-left:6px}
#rList{margin-top:10px;font-size:13px;width:min(320px,100%);line-height:1.65}
#rList div{display:flex;justify-content:space-between;padding:0 10px;border-radius:6px}
#rList .me{background:rgba(25,240,255,.25);font-weight:900}
#rUnlock{margin-top:8px;color:#3dffa8;font-weight:900;font-size:17px;text-shadow:0 0 10px #3dffa8}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05010f;font-size:18px;letter-spacing:4px}
</style>

<canvas id="gl"></canvas>
<div id="boostfx"></div>

<div id="hud" hidden>
  <div id="pos" class="orb"><b>8</b><span>位</span><i>/8</i></div>
  <div id="laps" class="orb"><div id="lap">LAP 1/3</div><div id="time">0:00.00</div><div id="bestlap"></div></div>
  <canvas id="mini" width="236" height="236"></canvas>
  <button id="pauseBtn">II</button>
  <div id="meter" class="orb">
    <div id="tier"></div>
    <div id="spd">0<small>km/h</small></div>
    <div id="ebar"><div id="efill"></div></div>
    <div id="elabel">BOOST ENERGY</div>
  </div>
  <div id="cd" class="orb" hidden></div>
  <div id="pops"></div>
  <div id="guide" hidden></div>
</div>

<div id="touch" hidden>
  <div class="tb" id="tL">◀</div>
  <div class="tb" id="tR">▶</div>
  <div class="tb orb" id="tB">BOOST</div>
  <div class="tb orb" id="tD">DRIFT</div>
</div>

<div id="title" class="screen" hidden>
  <div class="logo orb">ZERO-G LINER</div>
  <div class="logo-jp">ゼロG ライナー</div>
  <div class="tag">反重力マシンで、音速の向こうへ。最後尾から全員ぶち抜け！</div>
  <div id="cards"></div>
  <button class="btn" id="startBtn">START</button>
  <div class="how" id="how"></div>
</div>

<div id="result" class="screen" hidden>
  <div id="rRank" class="orb"></div>
  <div id="rMsg"></div>
  <div id="rTimes" class="orb"></div>
  <div id="rUnlock" hidden></div>
  <div id="rList" class="orb"></div>
  <div class="row">
    <button class="btn" id="againBtn">もう一回</button>
  </div>
  <div class="row">
    <button class="btn sub" id="nextBtn">次のコースへ</button>
    <button class="btn sub" id="titleBtn">タイトルへ</button>
  </div>
</div>

<div id="pause" class="screen" hidden>
  <div class="logo orb" style="font-size:44px">PAUSE</div>
  <button class="btn" id="resumeBtn">再開</button>
  <div class="row"><button class="btn sub" id="retryBtn">最初から</button><button class="btn sub" id="quitBtn">リタイア</button></div>
</div>

<button id="snd" hidden>🔊 音あり</button>
<div id="loading" class="orb">LOADING…</div>
