<title>好きすぎて滅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kurenaido&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  color-scheme: light;
  --page:#ece3f2;
  --ink:#4b3d63;
  --ink-soft:#85779c;
  --pink:#ec6897;
  --pink-2:#ffa2c2;
  --pink-soft:#ffe3ee;
  --blue:#6f8fe6;
  --blue-2:#a9bdf5;
  --card:rgba(255,255,255,.9);
  --card-line:rgba(236,104,151,.2);
  --panel:#fbf6fb;
  --nav:rgba(255,255,255,.96);
  --shadow:0 6px 18px rgba(110,70,140,.14);
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-hand:"Zen Kurenaido","Klee One","Yu Mincho","Hiragino Mincho ProN",serif;
  --f-dot:"DotGothic16","MS Gothic","Osaka-Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:14px;
  display:grid;place-items:center;padding-block:16px;padding-inline:16px;min-height:600px;
  background-image:radial-gradient(circle at 20% 10%,#f8dcea 0,transparent 40%),radial-gradient(circle at 85% 90%,#dcd9f6 0,transparent 45%)}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.phone{position:relative;width:min(100%,400px);height:min(100%,820px);min-height:580px;border-radius:28px;overflow:hidden;
  box-shadow:0 24px 60px rgba(90,60,130,.28),0 0 0 1px rgba(255,255,255,.6) inset;background:#f6d6e6;isolation:isolate}
.phone[data-stage="2"]{--ink:#352c66;--ink-soft:#6c63a0;--card:rgba(244,240,255,.9);--card-line:rgba(111,95,210,.25);--panel:#f3f0fb}
.phone[data-stage="3"]{--ink:#ffd9ea;--ink-soft:#d98cb3;--pink-soft:#3a0a28;--card:rgba(24,5,19,.88);--card-line:rgba(255,47,125,.45);--panel:#10030c;--nav:rgba(16,3,12,.96);--shadow:0 0 18px rgba(255,47,125,.25)}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.scr{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column}

/* ---------- title ---------- */
#scr-title{align-items:center;justify-content:space-between;padding:12% 24px 12%}
.logo{margin:0;position:relative;transform:rotate(-7deg);display:flex;align-items:flex-end;gap:2px;padding:18px 18px 12px;color:#43325f;font-family:var(--f-hand);font-weight:400;line-height:1}
.logo .ribbon{position:absolute;inset:14px -26px 0 -30px;background:rgba(255,255,255,.88);z-index:-1;
  clip-path:polygon(0 18%,6% 10%,14% 16%,30% 6%,52% 12%,70% 4%,86% 10%,100% 0,97% 50%,100% 86%,82% 96%,60% 88%,40% 98%,20% 90%,4% 100%,2% 60%)}
.logo .l1{font-size:clamp(38px,11vw,52px);letter-spacing:.02em}
.logo .l2{font-size:clamp(66px,19vw,92px);margin-bottom:-6px;position:relative}
.logo .lh{position:absolute;right:-18px;bottom:-14px;width:30px;height:30px;color:var(--pink);transform:rotate(12deg)}
.tag{font-family:var(--f-hand);color:#5b4a7c;font-size:15px;text-align:center;margin:26px 0 0;letter-spacing:.06em;background:rgba(255,255,255,.55);padding:4px 12px;border-radius:99px}
.menu{display:flex;flex-direction:column;gap:12px;width:min(240px,100%)}
.btn{border:0;border-radius:99px;padding:13px 20px;font-weight:700;font-size:15px;letter-spacing:.08em;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ff8db3,#ec6897);color:#fff;box-shadow:0 6px 16px rgba(236,104,151,.4)}
.btn.ghost{background:rgba(255,255,255,.9);color:#6b5690;box-shadow:0 3px 10px rgba(110,70,140,.12)}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:0;color:#6b5690;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:center;padding:4px}

/* ---------- intro ---------- */
#scr-intro{padding:15% 26px 10%;justify-content:space-between;cursor:pointer;color:#fff;font-family:var(--f-hand)}
#scr-intro p{margin:0;font-size:22px;line-height:1.9;text-shadow:0 2px 12px rgba(30,20,70,.55);transition:opacity 1.2s}
#scr-intro .p2{font-size:18px;opacity:0}
#scr-intro.two .p2{opacity:1}
.taphint{text-align:center;font-family:var(--f-body);font-size:12px;letter-spacing:.3em;color:#fff;opacity:.85;animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- game ---------- */
#scr-game{padding-bottom:64px}
.hud{position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:14px 16px 12px;background:var(--card);border-bottom:1px solid var(--card-line);backdrop-filter:blur(6px)}
.meter{flex:1;min-width:0;display:grid;grid-template-columns:auto auto auto 1fr;align-items:center;column-gap:8px;row-gap:7px}
.meter svg{width:22px;height:22px;color:var(--pink)}
.meter .lbl{font-weight:700;color:var(--pink);font-size:15px}
.meter b{font-variant-numeric:tabular-nums;font-size:15px}
#hud-echo{font-family:var(--f-dot);color:#ff2f7d;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:rgba(236,104,151,.16);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--pink-2),var(--pink));transition:width .7s cubic-bezier(.3,.8,.3,1)}
.bar.blue{background:rgba(111,143,230,.16)}
.bar.blue i{background:linear-gradient(90deg,var(--blue-2),var(--blue))}
.phone[data-stage="3"] .bar i{box-shadow:0 0 12px #ff2f7d;background:linear-gradient(90deg,#ff7aa8,#ff2f7d)}
.day{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.ap{display:flex;gap:4px}
.ap i{width:9px;height:9px;border-radius:50%;background:var(--pink);opacity:.9}
.ap i.off{background:var(--card-line);opacity:1}
.float{position:absolute;left:52px;top:44px;z-index:4;font-size:12px;font-weight:700;display:flex;gap:8px;pointer-events:none;animation:floatup 1.5s ease-out forwards}
.float span{background:var(--card);padding:2px 8px;border-radius:99px;box-shadow:var(--shadow)}
.float .p{color:var(--pink)} .float .b{color:var(--blue)}
@keyframes floatup{from{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}to{opacity:0;transform:translateY(-14px)}}
.stagearea{flex:1;position:relative}
#daycard{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-hand);font-size:44px;color:#fff;text-shadow:0 2px 18px rgba(60,30,90,.6);letter-spacing:.1em;opacity:0;pointer-events:none}
#daycard.on{animation:dayin 1.6s ease forwards}
@keyframes dayin{0%{opacity:0;transform:scale(.96)}25%,70%{opacity:1;transform:none}100%{opacity:0}}

.dialog{position:relative;z-index:3;margin:0 14px 12px;background:var(--card);border:1px solid var(--card-line);border-radius:20px;padding:16px 18px 18px;min-height:92px;box-shadow:var(--shadow);cursor:pointer}
.dialog p{margin:0;font-size:15px;line-height:1.85;white-space:pre-wrap;min-height:2.2em}
.who{position:absolute;top:-11px;left:16px;background:var(--pink);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.08em}
.next{position:absolute;right:14px;bottom:8px;width:14px;height:14px;color:var(--pink);opacity:0}
.dialog.more .next{opacity:1;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.phone[data-stage="3"] .dialog{box-shadow:0 0 0 1px #ff2f7d,0 0 22px rgba(255,47,125,.35)}
.phone[data-stage="3"] .dialog p{font-family:var(--f-dot)}

.actions{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}
.act{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:16px;border:1px solid var(--card-line);background:var(--card);color:var(--ink);font-weight:500;font-size:14px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s}
.act:not(:disabled):active{transform:scale(.97)}
.act .ic{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center}
.act .ic svg{width:18px;height:18px}
.act small{display:block;font-size:10px;color:var(--ink-soft);font-weight:400}
.act:disabled{opacity:.45;cursor:default}
.actions.busy .act{pointer-events:none}

.choices{position:relative;z-index:3;display:flex;flex-direction:column;gap:8px;padding:0 14px 12px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--card-line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 16px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.choice b{display:block;font-size:14px;color:var(--pink)}
.choice small{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.choice svg{width:14px;height:14px;flex:none;color:var(--ink-soft)}

.nav{position:absolute;left:0;right:0;bottom:0;z-index:8;height:64px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--nav);border-top:1px solid var(--card-line)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--ink-soft);cursor:pointer;letter-spacing:.04em}
.nav svg{width:20px;height:20px}
.nav button[aria-current="true"]{color:var(--pink);font-weight:700}

/* ---------- panels ---------- */
.panel{position:absolute;left:0;right:0;top:0;bottom:64px;z-index:7;background:var(--panel);overflow-y:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:12px}
.panel.full{bottom:0}
.panel h2{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
.panel h2 svg{width:18px;height:18px;color:var(--pink)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.stat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 10px}
.stat svg{width:22px;height:22px}
.stat .nm{font-weight:700;font-size:15px}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px}
.stat .bar{height:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--card-line);color:var(--ink-soft)}
.chip.on{background:var(--pink-soft);color:var(--pink);border-color:transparent;font-weight:700}
.note{margin:0;font-family:var(--f-hand);font-size:15px;line-height:1.9;white-space:pre-line;background:rgba(255,255,255,.35);border:1px dashed var(--card-line);border-radius:12px;padding:10px 14px}
.phone[data-stage="3"] .note{font-family:var(--f-dot);color:#ff5c9a;background:transparent}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sec{font-size:12px;letter-spacing:.12em;color:var(--ink-soft);margin:6px 0 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.thumb{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 4px rgba(40,20,60,.6);position:relative;overflow:hidden}
.grid2 .thumb{aspect-ratio:4/3}
.thumb small{font-weight:400;opacity:.9;font-size:10px}
.thumb.lock{background:#8f86a6 !important;color:rgba(255,255,255,.85);align-items:center;justify-content:center;gap:4px;text-shadow:none}
.phone[data-stage="3"] .thumb.lock{background:#2a0a20 !important}
.thumb.lock svg{width:20px;height:20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--card-line)}
.row:last-child{border-bottom:0}
.row label,.row .lb{display:flex;align-items:center;gap:8px;font-size:14px}
.row input[type=range]{width:140px;accent-color:var(--pink)}
.seg{display:flex;border:1px solid var(--card-line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.tog{appearance:none;width:44px;height:24px;border-radius:99px;background:#d8cfe2;position:relative;cursor:pointer;transition:background .2s;margin:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tog:checked{background:var(--pink)}
.tog:checked::after{left:23px}
.danger{border:0;background:none;color:#d4486f;font-weight:700;cursor:pointer;padding:0}
.confirmrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.confirmrow .btn{padding:7px 14px;font-size:12px}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:20;background:rgba(25,6,22,.6);display:grid;place-items:center;padding:24px}
.modal .box{background:#fff;color:#4b3d63;border-radius:24px;padding:24px 22px 20px;width:100%;max-width:300px;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px rgba(255,47,125,.45)}
.modal .box svg{width:30px;height:30px;color:var(--pink);align-self:center}
.modal .box p{margin:0 0 8px;line-height:1.8;font-weight:500}

/* ---------- meltdown ---------- */
#scr-melt{background:#070107;overflow:hidden;cursor:pointer;justify-content:center;align-items:center}
.rows{position:absolute;inset:-10px;display:flex;flex-direction:column;justify-content:space-around;font-family:var(--f-dot);color:#ff2f7d;font-size:20px;white-space:nowrap;line-height:1}
.rows div{animation:slide 3s linear infinite alternate}
.rows div:nth-child(even){animation-direction:alternate-reverse}
@keyframes slide{to{transform:translateX(-120px)}}
.melttop{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:8px;color:#ffd9ea;font-weight:700}
.melttop .bar{flex:1;background:rgba(255,47,125,.2)}
.melttop .bar i{width:100%;background:#ff2f7d;box-shadow:0 0 12px #ff2f7d}
.meltlogo{position:relative;font-family:var(--f-hand);font-size:clamp(40px,12vw,56px);color:#ff4f93;padding:22px 16px;border:2px solid #ff2f7d;transform:rotate(-4deg);background:rgba(7,1,7,.82);
  text-shadow:0 0 14px #ff2f7d;animation:glitch 1.2s steps(2) infinite}
@keyframes glitch{0%{text-shadow:3px 0 #00e5ff,-3px 0 #ff2f7d}25%{text-shadow:-4px 1px #00e5ff,4px -1px #ff2f7d;transform:rotate(-4deg) translateX(2px)}50%{text-shadow:0 0 14px #ff2f7d}75%{text-shadow:5px 0 #ff2f7d,-2px 0 #fff;transform:rotate(-4deg) translateX(-3px)}}
.meltq{position:absolute;bottom:13%;left:0;right:0;text-align:center;color:#ffd9ea;font-size:13px;line-height:1.9;letter-spacing:.06em;text-shadow:0 0 8px #ff2f7d}

/* ---------- ending ---------- */
#scr-end{justify-content:space-between;padding:16px 14px 16px}
.endbadge{align-self:flex-start;display:flex;align-items:center;gap:10px;background:rgba(40,28,70,.55);color:#fff;border-radius:10px;padding:6px 12px;backdrop-filter:blur(4px)}
.endbadge span{font-size:12px;letter-spacing:.12em;border:1px solid rgba(255,255,255,.7);padding:1px 6px;border-radius:4px}
.endbadge b{font-size:15px;font-weight:500}
.endsheet{background:rgba(255,255,255,.93);color:#4b3d63;border-radius:20px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 30px rgba(70,40,100,.2)}
.endsheet p{margin:0;font-family:var(--f-hand);font-size:17px;line-height:2;text-align:center;white-space:pre-line}
.endsheet .meta{justify-content:center;color:#85779c}

/* ---------- illustrations ---------- */
.art{position:relative;width:100%;max-width:100%;border-radius:18px;overflow:hidden;border:3px solid rgba(255,255,255,.85);box-shadow:0 10px 28px rgba(70,40,110,.3);background:#d9c9ea;transition:opacity .25s}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.art.swap{opacity:0}
.stagearea{display:flex;align-items:center;justify-content:center;padding:12px 14px;min-height:0}
.stagearea .art{height:100%;max-height:250px}
.phone[data-stage="2"] .stagearea .art{border-color:rgba(185,169,255,.7)}
.phone[data-stage="3"] .stagearea .art{border-color:#ff2f7d;box-shadow:0 0 26px rgba(255,47,125,.55)}
.phone.fx[data-stage="3"] .stagearea .art img{animation:artglitch 2.4s steps(1) infinite}
@keyframes artglitch{0%,100%{transform:none;filter:none}88%{transform:translateX(3px) skewX(-2deg);filter:hue-rotate(-25deg) saturate(1.6)}92%{transform:translateX(-4px);filter:contrast(1.4)}95%{transform:none;filter:none}}
.title-art{width:88%;aspect-ratio:450/296;transform:rotate(-2deg)}
#scr-title .logo{margin-top:-34px}
#scr-intro .art{aspect-ratio:452/324;border-color:rgba(255,255,255,.6)}
.endart{aspect-ratio:16/9;align-self:stretch;height:auto}
.thumb.pic{background-size:cover;background-position:center}
.thumb.pic::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(40,20,60,.65))}
.thumb.pic > *{position:relative}
.thumb .tt{display:flex;flex-direction:column}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

<main class="phone" id="phone" data-stage="0">
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- タイトル -->
  <section class="scr" id="scr-title">
    <div style="display:flex;flex-direction:column;align-items:center;width:100%">
      <div class="art title-art"><img src="img/title.jpg" alt="机に頬をのせて微笑む女の子"></div>
      <h1 class="logo" aria-label="好きすぎて滅">
        <span class="ribbon"></span><span class="l1">好きすぎて</span><span class="l2">滅</span>
        <svg class="lh"><use href="#i-heart-o"/></svg>
      </h1>
      <p class="tag" id="title-tag" hidden>あなたは、どこまで好きでいられますか？</p>
    </div>
    <div class="menu">
      <button class="btn primary" id="b-start">はじめる</button>
      <button class="btn ghost" id="b-cont">つづきから</button>
      <button class="btn ghost" id="b-tset">設定</button>
      <button class="linkish" id="b-talbum">アルバムを見る</button>
    </div>
  </section>

  <!-- ストーリー導入 -->
  <section class="scr" id="scr-intro" hidden tabindex="0" aria-label="タップして進む">
    <p class="p1">好き、<br>それはきっと<br>幸せなはずだった。</p>
    <div class="art"><img src="img/intro.jpg" alt="夕暮れの街を見下ろす後ろ姿"></div>
    <div>
      <p class="p2">でも、<br>好きすぎるってことは、<br>時に、世界を壊すことだった——</p>
      <div class="taphint" style="margin-top:24px">TAP</div>
    </div>
  </section>

  <!-- 本編 -->
  <section class="scr" id="scr-game" hidden>
    <header class="hud" id="hud">
<script src="../../audio-pause.js"></script>
      <div class="meter">
        <svg><use href="#i-heart"/></svg><span class="lbl">好き</span><b id="hud-pct">0%</b><span id="hud-echo"></span>
        <div class="bar"><i id="hud-bar"></i></div>
      </div>
      <div class="day"><span id="hud-day">DAY 1/14</span><span class="ap" id="hud-ap" aria-label="残り行動"></span></div>
    </header>
    <div class="stagearea"><div class="art" id="art"><img id="art-img" src="img/normal.jpg" alt="あの人"></div><div id="daycard"></div></div>
    <div class="dialog" id="dlg" role="button" tabindex="0" aria-live="polite">
      <span class="who" id="dlg-who" hidden></span>
      <p id="dlg-text"></p>
      <svg class="next"><use href="#i-down"/></svg>
    </div>
    <div class="actions" id="actions">
      <button class="act" data-a="look"><span class="ic"><svg><use href="#i-eye"/></svg></span><span><span class="t">見つめる</span><small>好き↑↑</small></span></button>
      <button class="act" data-a="talk"><span class="ic"><svg><use href="#i-chat"/></svg></span><span><span class="t">話しかける</span><small>好き↑ 好感度↑</small></span></button>
      <button class="act" data-a="gift"><span class="ic"><svg><use href="#i-gift"/></svg></span><span><span class="t">プレゼント</span><small>1日1回</small></span></button>
      <button class="act" data-a="home"><span class="ic"><svg><use href="#i-door"/></svg></span><span><span class="t">帰る</span><small>次の日へ・好き↓</small></span></button>
    </div>
    <div class="choices" id="choices" hidden></div>
  </section>

  <!-- 100% 演出 -->
  <section class="scr" id="scr-melt" hidden tabindex="0">
    <div class="rows" id="melt-rows"></div>
    <div class="melttop"><svg style="width:22px;height:22px;color:#ff2f7d"><use href="#i-heart"/></svg>好き 100%<div class="bar"><i></i></div></div>
    <div class="meltlogo">好きすぎて滅</div>
    <p class="meltq">好きすぎると、<br>世界は、こんなにも美しい。</p>
  </section>

  <!-- エンディング -->
  <section class="scr" id="scr-end" hidden>
    <div class="endbadge"><span id="end-no">END 01</span><b id="end-title"></b></div>
    <div class="art endart"><img id="end-img" src="img/end1.jpg" alt=""></div>
    <div class="endsheet">
      <p id="end-text"></p>
      <div class="meta" id="end-count"></div>
      <button class="btn ghost" id="b-endback" style="border:1px solid var(--card-line)">タイトルに戻る</button>
    </div>
  </section>

  <!-- パネル -->
  <section class="panel" id="pn-status" hidden></section>
  <section class="panel" id="pn-album" hidden></section>
  <section class="panel" id="pn-settings" hidden>
    <h2><svg><use href="#i-gear"/></svg>設定</h2>
    <div class="card" style="padding-block:4px">
      <div class="row"><label for="set-vol">効果音の音量</label><input type="range" id="set-vol" min="0" max="1" step="0.1"></div>
      <div class="row"><label for="set-bgm">BGM</label><input type="checkbox" class="tog" id="set-bgm"></div>
      <div class="row"><span class="lb">テキスト速度</span><div class="seg" id="set-speed"><button data-v="slow">遅い</button><button data-v="normal">普通</button><button data-v="fast">速い</button></div></div>
      <div class="row"><label for="set-fx">演出（グロー・グリッチ）</label><input type="checkbox" class="tog" id="set-fx"></div>
      <div class="row" id="reset-row"><span class="lb">データのリセット</span><button class="danger" id="b-reset">リセット</button></div>
    </div>
    <p style="margin:0;font-size:12px;color:var(--ink-soft);line-height:1.7">セーブとアルバムはこのブラウザにだけ保存されます。</p>
    <button class="btn ghost" id="b-setback" hidden>タイトルへ戻る</button>
  </section>

  <nav class="nav" id="nav" hidden>
    <button data-tab="home" aria-current="true"><svg><use href="#i-home"/></svg>ホーム</button>
    <button data-tab="album"><svg><use href="#i-book"/></svg>アルバム</button>
    <button data-tab="status"><svg><use href="#i-user"/></svg>ステータス</button>
    <button data-tab="settings"><svg><use href="#i-gear"/></svg>設定</button>
  </nav>

  <div class="modal" id="confirm" hidden>
    <div class="box" role="dialog" aria-modal="true" aria-labelledby="confirm-q">
      <svg><use href="#i-heart-o"/></svg>
      <p id="confirm-q">好きが100%になりました。<br>このままでいいですか？</p>
      <button class="btn primary" id="b-yes">はい（世界を壊す）</button>
      <button class="btn ghost" id="b-no" style="border:1px solid var(--card-line)">いいえ（まだ好きでいたい）</button>
    </div>
  </div>
</main>
