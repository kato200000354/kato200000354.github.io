<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>すなば芸術祭</title>
<meta name="description" content="公園の砂場で3Dの砂の造形をつくり、きびしい審査員に芸術点をつけてもらうゲーム。">
<meta name="theme-color" content="#f3d9a4">
<style>
:root{
  --bg:#fdf3df; --ink:#4a3423; --sub:#8a6a4c; --card:#fffaf0; --line:#e6cfa6;
  --accent:#e2682f; --accent2:#3f8fd1; --gold:#e8b024; --wood:#a8703f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",system-ui,sans-serif;overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 16px 20px}
.btn{background:var(--accent);color:#fff;font-weight:700;font-size:18px;padding:14px 22px;border-radius:16px;box-shadow:0 4px 0 #b44c1c;width:100%;max-width:320px;margin:6px 0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b44c1c}
.btn.blue{background:var(--accent2);box-shadow:0 4px 0 #2a6aa3}
.btn.blue:active{box-shadow:0 1px 0 #2a6aa3}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%;max-width:420px;margin:8px 0}

#title h1{font-size:34px;margin:14px 0 2px;letter-spacing:2px;text-align:center;color:var(--accent);text-shadow:0 3px 0 #f6c58f}
#title .tag{color:var(--sub);margin:0 0 10px;text-align:center;font-size:14px}
.hero{width:100%;max-width:400px;height:220px;border-radius:18px;overflow:hidden;border:4px solid var(--wood);background:#bfe6ff;position:relative}
.hero canvas,.pit canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.rules{font-size:14px;line-height:1.7}
.rules b{color:var(--accent)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.pill.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.best{font-size:13px;color:var(--sub);margin-top:6px;text-align:center}

#game{padding:6px 8px 8px;height:100vh;height:100dvh;min-height:0}
.hud{display:flex;align-items:center;gap:8px;width:100%;max-width:520px;margin-bottom:6px;flex:0 0 auto}
.theme{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-size:12px;line-height:1.3;min-width:0}
.theme b{font-size:17px;color:var(--accent)}
.timer{font-size:22px;font-weight:800;min-width:62px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px 6px}
.timer.hurry{color:#d33;border-color:#f19a9a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.done{background:var(--gold);color:#4a3423;font-weight:800;border-radius:12px;padding:8px 10px;font-size:15px;box-shadow:0 3px 0 #b88710}
.done:disabled{opacity:.5}
.pit{position:relative;width:100%;max-width:520px;flex:1 1 auto;min-height:260px;border:5px solid var(--wood);border-radius:12px;overflow:hidden;background:#bfe6ff;touch-action:none}
.wind{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);line-height:1.3;text-align:center}
.camhint{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(255,255,255,.75);border-radius:8px;padding:3px 7px;pointer-events:none}
.rot{position:absolute;right:6px;bottom:6px;display:flex;gap:6px}
.rot button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);font-size:20px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.toolbar{width:100%;max-width:520px;margin-top:6px;flex:0 0 auto}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tool{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px 1px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2;white-space:nowrap}
.tool .ic{font-size:20px;line-height:1.2}
.tool.on{border-color:var(--accent);background:#ffe7d6;box-shadow:0 0 0 2px var(--accent) inset}
.sub{display:flex;gap:5px;margin-top:5px;align-items:center}
.sizes{display:flex;gap:4px}
.size{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.size i{display:block;border-radius:50%;background:var(--ink)}
.size.on{border-color:var(--accent);background:#ffe7d6}
.undo{flex:0 0 auto;padding:6px 9px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13px}
.decos{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px}
.deco{flex:0 0 auto;width:36px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:18px;display:flex;align-items:center;justify-content:center}
.deco.on{border-color:var(--accent);background:#ffe7d6}
.hint{font-size:12px;color:var(--sub);margin-top:4px;text-align:center;min-height:16px}

#turn{justify-content:center;text-align:center}
#turn .big{font-size:30px;font-weight:900;margin:8px 0;color:var(--accent)}

#result h2,#final h2{margin:6px 0 4px;font-size:24px}
.shot{width:100%;max-width:340px;border:5px solid var(--wood);border-radius:10px;display:block;background:#eaf8ff}
.judges{display:grid;gap:8px;width:100%;max-width:420px;margin-top:8px}
.judge{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px;opacity:0;transform:translateY(10px);transition:.4s}
.judge.show{opacity:1;transform:none}
.face{font-size:34px;width:46px;text-align:center;flex:0 0 auto}
.jtxt{flex:1;min-width:0;font-size:13px;line-height:1.45}
.jtxt b{font-size:14px}
.jscore{font-size:28px;font-weight:900;color:var(--accent);flex:0 0 auto;min-width:56px;text-align:right}
.total{font-size:44px;font-weight:900;text-align:center;margin:6px 0 0;color:var(--accent)}
.total small{font-size:18px;color:var(--sub)}
.award{text-align:center;font-weight:900;font-size:20px;margin-bottom:4px}
.bars{font-size:13px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar span{width:84px;flex:0 0 auto;font-size:12px;white-space:nowrap}
.bar .tr{flex:1;height:12px;border-radius:6px;background:#f0e2c6;overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,#f0a35e,var(--accent));border-radius:6px;width:0;transition:width .8s}
.bar em{width:30px;text-align:right;font-style:normal;font-weight:700}
.rank{list-style:none;padding:0;margin:4px 0}
.rank li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:15px}
.rank li.me{background:#fff0c9;border-radius:10px;font-weight:800}
.rank .no{width:30px;font-weight:900;text-align:center;font-size:18px}
.rank .nm{flex:1}
.rank img{width:56px;height:42px;border-radius:4px;border:2px solid var(--wood);object-fit:cover}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:420px}
.gallery figure{margin:0;text-align:center;font-size:13px;font-weight:700}
.gallery img{width:100%;border:3px solid var(--wood);border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#4a3423;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
input.nm{font:inherit;padding:6px 8px;border-radius:10px;border:2px solid var(--line);width:100%;margin:3px 0;background:#fff}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<body>

<section id="title" class="screen">
  <h1>すなば芸術祭</h1>
  <p class="tag">公園の砂場で、いちばん芸術的な作品をつくれ！</p>
  <div class="hero" id="hero"><div class="loading">砂場を準備中…</div></div>
  <div class="card rules">
    <b>しめった砂</b>は固まるので高く積める。<b>かわいた砂</b>はサラサラ崩れる。<br>
    積んだら<b>指</b>で彫って窓やトンネルを。<b>飾り</b>で仕上げよう。<br>
    制限時間のあとに<b>風</b>が吹くよ。かわいた砂は飛ばされる！<br>
    <b>2本指</b>で砂場を回したりズームしたりできる。<br>
    最後に3人の審査員が点数をつける（30点満点）。
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:6px;text-align:center">あそびかた</div>
    <div class="row" id="modeRow">
      <button class="pill on" data-mode="solo">ひとりで（ライバル3人と勝負）</button>
      <button class="pill" data-mode="multi">みんなで（2〜4人で交代）</button>
    </div>
    <div id="multiBox" hidden style="margin-top:8px">
      <div class="row" id="numRow">
        <button class="pill on" data-n="2">2人</button>
        <button class="pill" data-n="3">3人</button>
        <button class="pill" data-n="4">4人</button>
      </div>
      <div id="names" style="margin-top:6px"></div>
    </div>
    <div style="font-weight:700;margin:10px 0 6px;text-align:center">制限時間</div>
    <div class="row" id="timeRow">
      <button class="pill" data-t="90">90秒</button>
      <button class="pill on" data-t="150">150秒</button>
      <button class="pill" data-t="240">240秒</button>
    </div>
  </div>
  <button class="btn" id="startBtn">砂場へ行く</button>
  <div class="best" id="bestTxt"></div>
</section>

<section id="turn" class="screen" hidden>
  <div style="font-size:15px;color:var(--sub)">スマホを渡してね</div>
  <div class="big" id="turnName">○○さんの番</div>
  <div class="card" style="text-align:center">お題：<b id="turnTheme" style="font-size:22px;color:var(--accent)"></b></div>
  <button class="btn" id="turnGo">はじめる</button>
</section>

<section id="game" class="screen" hidden>
  <div class="hud">
    <div class="theme">お題<br><b id="themeTxt">お城</b></div>
    <div class="timer" id="timer">150</div>
    <button class="done" id="doneBtn">できた！</button>
  </div>
  <div class="pit" id="pit">
    <div class="wind" id="windMsg" hidden></div>
    <div class="camhint">2本指：回す・ズーム</div>
    <div class="rot"><button id="rotL" aria-label="左に回す">⟲</button><button id="rotR" aria-label="右に回す">⟳</button></div>
  </div>
  <div class="toolbar">
    <div class="tools" id="tools">
      <button class="tool on" data-tool="wet"><span class="ic">🟫</span>しめった砂</button>
      <button class="tool" data-tool="dry"><span class="ic">🟨</span>かわいた砂</button>
      <button class="tool" data-tool="water"><span class="ic">💧</span>水</button>
      <button class="tool" data-tool="carve"><span class="ic">☝️</span>指で彫る</button>
      <button class="tool" data-tool="shovel"><span class="ic">🥄</span>シャベル</button>
      <button class="tool" data-tool="cam"><span class="ic">👀</span>見回す</button>
    </div>
    <div class="sub">
      <div class="sizes" id="sizes">
        <button class="size" data-s="0"><i style="width:6px;height:6px"></i></button>
        <button class="size on" data-s="1"><i style="width:11px;height:11px"></i></button>
        <button class="size" data-s="2"><i style="width:17px;height:17px"></i></button>
      </div>
      <div class="decos" id="decos"></div>
      <button class="undo" id="undoBtn">↶戻す</button>
    </div>
    <div class="hint" id="hint">しめった砂を積んで、形をつくろう</div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <h2 id="resTitle">審査結果</h2>
  <img class="shot" id="resImg" alt="あなたの作品">
  <div class="judges" id="judges"></div>
  <div id="resTotalBox" hidden style="width:100%;max-width:420px">
    <div class="total" id="resTotal">0<small> / 30点</small></div>
    <div class="award" id="resAward"></div>
    <div class="card bars" id="bars"></div>
    <div class="card" id="rankCard" hidden>
      <div style="font-weight:800;text-align:center">今日の砂場ランキング</div>
      <ol class="rank" id="rank"></ol>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <button class="btn" id="nextBtn">もう一回つくる</button>
      <button class="btn blue" id="saveBtn">作品を画像で保存</button>
      <button class="btn ghost" id="toTitle">タイトルへ</button>
    </div>
  </div>
</section>

<section id="final" class="screen" hidden>
  <h2>🏆 最終結果</h2>
  <div class="card"><ol class="rank" id="finalRank"></ol></div>
  <div class="gallery" id="gallery"></div>
  <button class="btn" id="finalAgain">もう一回あそぶ</button>
  <button class="btn ghost" id="finalTitle">タイトルへ</button>
</section>

<div class="toast" id="toast"></div>
