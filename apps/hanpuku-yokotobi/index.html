<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f0;color:#222;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.dg{font-family:"Dela Gothic One","Hiragino Sans",sans-serif;font-weight:400}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;pointer-events:none;z-index:5}
#hudRow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
#timeBox{background:rgba(29,47,111,.88);color:#fff;border-radius:12px;padding:4px 10px;min-width:84px;text-align:center}
#timeBox small{display:block;font-size:10px;opacity:.8}
#time{font-size:24px;line-height:1.1}
#timeBox.hurry{background:rgba(220,30,40,.92);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#countBox{text-align:center;color:#fff;text-shadow:0 3px 0 #1d2f6f,0 0 12px rgba(0,0,0,.35)}
#count{font-size:52px;line-height:1}
#count small{font-size:20px}
#combo{font-size:13px;font-weight:800;min-height:18px}
#mute{pointer-events:auto;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.85);font-size:20px}
#meterWrap{margin:6px auto 0;max-width:330px;text-align:center}
#meter{height:10px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden}
#meterFill{height:100%;width:0;background:linear-gradient(90deg,#4cc3ff,#9b6bff,#ff4fa8,#ff8a1f,#ffde3b);transition:width .1s}
#lvName{font-size:15px;color:#fff;text-shadow:0 2px 0 #000;min-height:22px;margin-top:2px}
#speed{position:fixed;inset:-30%;pointer-events:none;z-index:2;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,0) 0deg 5deg,rgba(255,255,255,.55) 5deg 6deg);-webkit-mask-image:radial-gradient(circle,transparent 28%,#000 60%);mask-image:radial-gradient(circle,transparent 28%,#000 60%)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(circle,transparent 45%,rgba(255,70,0,.55) 100%)}
#center{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:6;pointer-events:none;font-size:46px;color:#fff;text-shadow:0 4px 0 #e02424,0 0 18px rgba(0,0,0,.4);transform:translateY(-50%)}
#center.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:translateY(-50%) scale(.3);opacity:0}25%{transform:translateY(-50%) scale(1.15);opacity:1}100%{transform:translateY(-50%) scale(1);opacity:1}}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bub{position:absolute;background:#fff;border:3px solid #222;border-radius:16px;padding:4px 10px;font-weight:900;font-size:15px;white-space:nowrap;animation:bub 1.5s ease-out forwards}
.bub::after{content:"";position:absolute;left:18px;bottom:-11px;border:8px solid transparent;border-top-color:#222}
@keyframes bub{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.float{position:fixed;z-index:6;pointer-events:none;font-weight:900;font-size:22px;color:#ffde3b;text-shadow:0 2px 0 #000,0 0 6px #000;animation:fl .9s ease-out forwards;transform:translateX(-50%)}
@keyframes fl{to{margin-top:-50px;opacity:0}}
#hints{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:3}
#hints div{background:rgba(255,255,255,.55);border-radius:14px;padding:10px 14px;font-weight:900;font-size:15px;color:#1d2f6f}
.panel{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,25,60,.45);overflow-y:auto;touch-action:pan-y}
.card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center;margin:auto}
.card h1{margin:0;font-size:34px;line-height:1.1;color:#1d2f6f}
.card h1 span{color:#e02424}
.sub{font-size:13px;color:#555;margin:6px 0 12px}
.rules{text-align:left;font-size:13px;line-height:1.65;background:#f2f5fb;border-radius:12px;padding:10px 12px;margin:0 0 12px}
.rules b{color:#e02424}
label.nm{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:12px;justify-content:center}
label.nm input{width:9em;font-size:16px;padding:8px 10px;border:2px solid #1d2f6f;border-radius:10px;text-align:center;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:20px;color:#fff;background:#e02424;box-shadow:0 5px 0 #8f1212;margin:8px 0;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1212}
.btn.x{background:#111;box-shadow:0 5px 0 #000;font-size:17px}
.btn.sv{background:#1d6fe0;box-shadow:0 5px 0 #0d3f8a;font-size:17px}
.btnRow{display:flex;gap:8px}.btnRow .btn{flex:1}
.best{font-size:13px;color:#1d2f6f;font-weight:800}
#cardImg{width:100%;border-radius:12px;display:block;margin:0 0 6px;background:#eee;aspect-ratio:1/1}
.newrec{display:inline-block;background:#ffde3b;color:#b30000;font-weight:900;border-radius:8px;padding:2px 10px;margin-bottom:4px;animation:pulse .4s infinite alternate}
#resTitle{font-size:22px;color:#e02424;margin:2px 0}
#resCom{font-size:13px;color:#444;margin-bottom:6px}
</style>

<body>
<div id="speed"></div><div id="vig"></div>
<div id="hud" hidden>
  <div id="hudRow">
    <div id="timeBox"><small>のこり</small><span id="time" class="dg">20.00</span></div>
    <div id="countBox"><div id="count" class="dg">0<small>回</small></div><div id="combo"></div></div>
    <button id="mute" aria-label="音の切り替え">🔊</button>
  </div>
  <div id="meterWrap"><div id="meter"><div id="meterFill"></div></div><div id="lvName" class="dg"></div></div>
</div>
<div id="bubbles"></div>
<div id="center" class="dg"></div>
<div id="hints" hidden><div>◀ 左タップ</div><div>右タップ ▶</div></div>

<div id="title" class="panel">
  <div class="card">
    <h1 class="dg">反復横跳び<span>王</span> 3D</h1>
    <p class="sub">体力テストの、あの20秒。<br>速すぎると、人は分身する。</p>
    <div class="rules">
      ・画面の<b>左半分</b>／<b>右半分</b>をタップでその方向へ跳ぶ（PCは ← → キー）<br>
      ・線をまたぐたびに<b>1回</b>。20秒で何回いける？<br>
      ・速くなると <b>残像 → 分身 → 床が燃える</b><br>
      ・<b>赤く光った線</b>にはドッジボールが飛んでくる。その線から逃げろ！
    </div>
    <label class="nm">ゼッケンの名前 <input id="nameIn" maxlength="6" placeholder="ななし"></label>
    <button id="startBtn" class="btn dg">よーい！</button>
    <div class="best" id="bestT"></div>
  </div>
</div>

<div id="result" class="panel" hidden>
  <div class="card">
    <div id="newRec" class="newrec" hidden>自己ベスト更新！</div>
    <img id="cardImg" alt="結果カード">
    <div id="resTitle" class="dg"></div>
    <div id="resCom"></div>
    <div class="btnRow">
      <button id="shareX" class="btn x">𝕏 でじまん</button>
      <button id="saveImg" class="btn sv">画像を保存</button>
    </div>
    <button id="retry" class="btn dg">もう一回！</button>
    <div class="best" id="bestR"></div>
  </div>
</div>
