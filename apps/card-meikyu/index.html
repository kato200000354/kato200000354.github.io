<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>カード迷宮クエスト</title>
<meta name="description" content="カードを集めてデッキを育て、3章の迷宮を攻略するデッキ構築ローグライト。3人のキャラ、90種のカード、50種のレリック、魔境Lv20、エンドレス、デイリー挑戦、図鑑と実績まで、やりこみ要素たっぷり。">
<meta name="theme-color" content="#16121f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#16121f; --panel:#231d33; --panel2:#30284a; --line:#4a3f6b;
  --gold:#ffd25e; --red:#ff5f6d; --green:#62d66f; --blue:#5cb8ff; --purple:#c58bff; --orange:#ff9d4a;
  --text:#f6f1ff; --muted:#a79cc6;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --cw:84px; --chh:118px;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0c0a12;color:var(--text);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
#app{position:fixed;inset:0;margin:0 auto;max-width:540px;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#main{position:relative;flex:1;min-height:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}

/* ===== top bar ===== */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 8px 5px;background:linear-gradient(#211a33,#191427);border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
#top .hp{color:#ff8a94;white-space:nowrap}
#top .gd{color:var(--gold);white-space:nowrap}
#top .fl{color:var(--muted);font-size:12px;white-space:nowrap}
#top .sp{flex:1}
#pots{display:flex;gap:3px}
.pot{width:28px;height:28px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:17px}
.pot.has{border:1px solid #7b6aa8;background:var(--panel2)}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:13px;font-weight:800;white-space:nowrap}
#relbar{display:flex;gap:2px;overflow-x:auto;padding:3px 6px;background:#130f1c;border-bottom:1px solid #2d2544;min-height:30px;scrollbar-width:none}
#relbar::-webkit-scrollbar{display:none}
.rel{flex:none;width:26px;height:26px;display:grid;place-items:center;font-size:18px;border-radius:6px;position:relative}
.rel i{position:absolute;right:-2px;bottom:-3px;font-style:normal;font-size:9px;font-weight:900;color:#fff;text-shadow:0 0 3px #000}

/* ===== common ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(#6b4fd0,#4a33a3);border:1px solid #9a84ff;border-radius:12px;padding:11px 18px;font-weight:900;font-size:16px;box-shadow:0 3px 0 #2a1d66;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1d66}
.btn.gold{background:linear-gradient(#ffcf4d,#e09a12);border-color:#ffe9a6;color:#3a2400;box-shadow:0 3px 0 #8a5a00}
.btn.red{background:linear-gradient(#e2505e,#a72a39);border-color:#ff9aa4;box-shadow:0 3px 0 #5e121b}
.btn.green{background:linear-gradient(#4fbf5d,#2d8a3a);border-color:#a6f0ae;box-shadow:0 3px 0 #164d1d}
.btn.gray{background:linear-gradient(#4a4360,#363049);border-color:#6d6390;box-shadow:0 3px 0 #1d1a29}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
h2{margin:6px 0 8px;font-size:20px;font-weight:900}
.muted{color:var(--muted)}
.page{padding:14px 14px calc(env(safe-area-inset-bottom) + 20px)}
.center{text-align:center}
.row{display:flex;gap:8px;align-items:center}
.wrapr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.kw{color:var(--gold);font-weight:900}

/* ===== cards ===== */
.card{position:relative;width:var(--cw);height:var(--chh);border-radius:10px;background:linear-gradient(#3a3156,#28213d);border:2px solid #7a6c9e;display:flex;flex-direction:column;align-items:center;padding:3px 4px 2px;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.45);transition:transform .14s, box-shadow .14s;overflow:hidden}
.card.tA{border-color:#e46a6a;background:linear-gradient(#4a2b35,#2c1d28)}
.card.tS{border-color:#5aa7e0;background:linear-gradient(#26384f,#1b2536)}
.card.tP{border-color:#b27dff;background:linear-gradient(#3d2b5c,#251c3a)}
.card.tX{border-color:#666;background:linear-gradient(#2b2b2b,#1c1c1c)}
.card .cc{position:absolute;left:2px;top:2px;width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e09a12);color:#3a2400;font-weight:900;font-size:13px;display:grid;place-items:center;border:1px solid #fff3c4;z-index:2}
.card .cc.cheap{background:radial-gradient(circle at 35% 30%,#b8ffbf,#2fae40);color:#06300c}
.card .cn{font-size:11px;font-weight:900;line-height:1.15;margin:1px 0 0 14px;align-self:stretch;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.up .cn{color:#8dffa0}
.card .ce{font-size:27px;line-height:1.1;margin:2px 0 1px}
.card .cd{font-size:9.5px;line-height:1.28;text-align:center;font-weight:700;flex:1;display:flex;align-items:center;color:#efe9ff}
.card .ct{font-size:8px;color:var(--muted);font-weight:800}
.card.rc .ct::before{content:"● ";color:#bbb}
.card.ru .ct::before{content:"● ";color:#5cb8ff}
.card.rr .ct::before{content:"● ";color:#ffd25e}
.card.rb .ct::before{content:"○ ";color:#888}
.card.big{--cw:150px;--chh:210px;padding:6px 8px 5px}
.card.big .cc{width:34px;height:34px;font-size:20px;left:4px;top:4px}
.card.big .cn{font-size:17px;margin-left:24px}
.card.big .ce{font-size:52px;margin:6px 0}
.card.big .cd{font-size:14px}
.card.big .ct{font-size:11px}
.card.locked{filter:grayscale(1) brightness(.5)}
.card.unseen .ce{filter:brightness(0)}
.cgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cgrid .card{cursor:pointer}
.cgrid .card.picked{outline:3px solid var(--gold);transform:translateY(-4px)}
.price{font-weight:900;color:var(--gold);font-size:14px;text-align:center;margin-top:3px}
.price.no{color:#776}

/* ===== battle ===== */
#field{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:radial-gradient(ellipse at 50% 30%,var(--fbg1,#2b2343),var(--fbg2,#16121f) 70%)}
#enemies{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:4px;padding:8px 4px 0;min-height:0}
.en{position:relative;display:flex;flex-direction:column;align-items:center;width:31%;max-width:150px;transition:opacity .5s,transform .3s;cursor:pointer;padding:3px;border-radius:12px}
.en.tgt{background:rgba(255,210,94,.12);outline:2px dashed var(--gold)}
.en.dead{opacity:0;transform:scale(.6);pointer-events:none}
.en .int{font-size:14px;font-weight:900;min-height:22px;white-space:nowrap;background:rgba(0,0,0,.35);border-radius:10px;padding:1px 7px}
.en .int.atk{color:#ffb0b0}
.en .emo{font-size:52px;line-height:1.1;transition:transform .12s;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.en.boss .emo{font-size:76px}
.en.elite .emo{font-size:62px}
.en.shiny .emo{filter:hue-rotate(160deg) saturate(1.6) drop-shadow(0 0 8px #fff8)}
.en .nm{font-size:11px;font-weight:800;color:#ddd;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.en.shiny .nm{color:#ffe98a}
.bar{position:relative;width:100%;height:14px;background:#000a;border-radius:7px;overflow:hidden;border:1px solid #0008}
.bar .f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff6b6b,#c9303d);transition:width .25s}
.bar .f.poi{background:linear-gradient(#96e36c,#4c9c26)}
.bar .t{position:absolute;inset:0;font-size:10px;font-weight:900;display:grid;place-items:center;text-shadow:0 0 3px #000}
.bar.hasblk{border-color:#5cb8ff}
.blk{position:absolute;left:-6px;top:-5px;font-size:10px;font-weight:900;background:#2f6db3;border:1px solid #9fd0ff;border-radius:6px;padding:0 4px;z-index:2}
.sts{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:17px;margin-top:2px}
.st{font-size:11px;font-weight:900;background:#0007;border-radius:6px;padding:0 3px;white-space:nowrap}
.hitfx{animation:hitfx .25s}
@keyframes hitfx{0%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-6deg)}60%{transform:translateX(6px)}100%{transform:none}}
.atkfx{animation:atkfx .3s}
@keyframes atkfx{50%{transform:translateY(16px) scale(1.12)}}
.pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 0 #000,0 0 6px #000;animation:pop .9s forwards;z-index:20;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.7)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px)}}
#player{display:flex;align-items:center;gap:10px;padding:4px 12px 4px;position:relative}
#player .emo{font-size:46px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5));transition:transform .12s}
#player .pinfo{flex:1;min-width:0}
#player .bar{height:16px}
#player .sts{justify-content:flex-start}
#hint{position:absolute;left:0;right:0;top:6px;font-size:13px;font-weight:800;text-align:center;color:var(--gold);padding:0 6px;pointer-events:none;text-shadow:0 1px 3px #000}
#enemies{padding-top:26px!important}
#hand{position:relative;height:calc(var(--chh) + 22px);flex:none}
#hand .card{position:absolute;bottom:4px;cursor:pointer}
#hand .card.sel{transform:translateY(-22px) scale(1.12);z-index:50!important;box-shadow:0 0 0 3px var(--gold),0 8px 18px #000}
#hand .card.no{filter:brightness(.6)}
#bbar{display:flex;align-items:center;gap:6px;padding:4px 8px calc(env(safe-area-inset-bottom) + 8px);background:#100c19;border-top:1px solid #2d2544}
#energy{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#e08d12 70%);color:#3a2400;font-weight:900;font-size:20px;display:grid;place-items:center;border:2px solid #fff3c4;box-shadow:0 0 12px #ffb33a88;flex:none}
#energy.zero{filter:grayscale(.8) brightness(.7);box-shadow:none}
.pile{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 7px;font-size:12px;font-weight:800;line-height:1.1;text-align:center}
.pile b{display:block;font-size:15px}
#endBtn{margin-left:auto}
.bbmsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;text-shadow:0 3px 0 #000,0 0 14px #000;pointer-events:none;animation:bbm 1.1s forwards;z-index:30;white-space:nowrap}
@keyframes bbm{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0}}

/* ===== map ===== */
#mapWrap{flex:1;overflow-y:auto;position:relative;background:radial-gradient(ellipse at 50% 0%,#2a2140,#16121f 70%)}
#mapSvg{display:block;width:100%}
.mnode{cursor:pointer}
.mnode circle{fill:#2a2340;stroke:#5a4e80;stroke-width:2}
.mnode.reach circle{fill:#3b2f62;stroke:var(--gold);stroke-width:3;animation:mpulse 1.2s infinite}
.mnode.done circle{fill:#1d1830;stroke:#3c3458}
.mnode.cur circle{stroke:#62d66f;stroke-width:4}
.mnode text{font-size:20px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mnode.done text{opacity:.4}
@keyframes mpulse{50%{stroke-width:5}}
#mapFoot{display:flex;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:#100c19;border-top:1px solid #2d2544;align-items:center}
#mapFoot .lg{font-size:11px;color:var(--muted);flex:1;line-height:1.35}

/* ===== title ===== */
#sTitle{background:radial-gradient(ellipse at 50% 20%,#3b2c63,#16121f 65%)}
.logo{font-size:36px;font-weight:900;text-align:center;line-height:1.1;margin-top:calc(env(safe-area-inset-top) + 26px);background:linear-gradient(#fff3c4,#ffb63a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5b3a00)}
.logo small{display:block;font-size:14px;color:var(--muted);-webkit-text-fill-color:var(--muted);filter:none;margin-top:6px;letter-spacing:.1em}
.heroes{font-size:52px;text-align:center;margin:16px 0 8px;letter-spacing:8px}
.heroes span{display:inline-block;animation:bob 2.4s infinite ease-in-out}
.heroes span:nth-child(2){animation-delay:.4s}.heroes span:nth-child(3){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-8px)}}
.menu{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(320px,86%);margin:10px auto}
.menu .sub{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prog{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.6}

/* char select */
.chlist{display:flex;flex-direction:column;gap:10px}
.ch{display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left}
.ch.on{border-color:var(--gold);background:#2f2547}
.ch.lock{opacity:.5}
.ch .ce{font-size:44px}
.ch .ci{flex:1;min-width:0}
.ch .cnm{font-size:18px;font-weight:900}
.ch .cds{font-size:12px;color:var(--muted);line-height:1.4}
.lvbar{height:6px;background:#0007;border-radius:3px;overflow:hidden;margin-top:4px}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#62d66f,#c8ff6b)}
.asc{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0 4px}
.asc .v{font-size:22px;font-weight:900;color:var(--purple);min-width:110px;text-align:center}
.asclist{font-size:12px;color:var(--muted);line-height:1.5;max-height:110px;overflow:auto;background:#0004;border-radius:10px;padding:6px 10px}

/* lists */
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-size:15px;font-weight:800}
.item .ie{font-size:28px;flex:none;width:36px;text-align:center}
.item .it{flex:1;min-width:0}
.item .it small{display:block;font-size:12px;color:var(--muted);font-weight:700;line-height:1.4}
.item.done{opacity:.4;pointer-events:none}
.item.dis{opacity:.5}
.tabs{display:flex;gap:4px;padding:8px 8px 0;flex-wrap:wrap}
.tab{flex:1;padding:8px 2px;border-radius:10px 10px 0 0;background:var(--panel);font-weight:900;font-size:13px;border:1px solid var(--line);border-bottom:0;min-width:60px}
.tab.on{background:var(--panel2);color:var(--gold)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.rcell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:10px;font-weight:800;cursor:pointer}
.rcell .re{font-size:28px;display:block}
.rcell.un .re{filter:brightness(0) opacity(.5)}
.stat{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #2d2544;font-size:14px;font-weight:700}
.stat b{color:var(--gold)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(5,3,10,.78);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:0 10px 40px #000}
.mbox h3{margin:0 0 8px;font-size:19px;font-weight:900;text-align:center}
.mbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 50px);transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:440px}
.toast{background:#2a2142ee;border:1px solid var(--gold);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;animation:toast 2.8s forwards;text-align:center;box-shadow:0 6px 20px #000a}
.toast.ach{background:linear-gradient(#5a3fb4ee,#35246fee)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.evemo{font-size:72px;text-align:center;margin:10px 0}
.evtxt{font-size:15px;line-height:1.7;text-align:center;margin-bottom:14px;font-weight:700}
.big-emo{font-size:64px;text-align:center}
.cmp{display:flex;align-items:center;justify-content:center;gap:8px}
.cmp .arr{font-size:24px;color:var(--gold)}
@media (max-width:370px){:root{--cw:76px;--chh:108px}.card .cd{font-size:9px}.card .ce{font-size:24px}.en .emo{font-size:44px}.en.boss .emo{font-size:64px}}
@media (max-height:640px){.en .emo{font-size:42px}.en.boss .emo{font-size:58px}#player .emo{font-size:36px}}
</style>
</head>
<body>
<div id="app">
  <div id="top" hidden>
    <span class="hp" id="tHp"></span><span class="gd" id="tGold"></span><span class="fl" id="tFloor"></span>
    <span class="sp"></span>
    <div id="pots"></div>
    <button class="tbtn" id="tDeck">🃏<span id="tDeckN"></span></button>
    <button class="tbtn" id="tMenu">⚙️</button>
  </div>
  <div id="relbar" hidden></div>
  <main id="main">
    <section id="sTitle" class="scr"></section>
    <section id="sMap" class="scr" hidden>
      <div id="mapWrap"><svg id="mapSvg"></svg></div>
      <div id="mapFoot"><div class="lg">⚔️戦闘 👹エリート ❓イベント 🛒ショップ<br>🔥休憩 🎁宝箱 💀ボス</div><button class="btn sm gray" id="mapDeck">デッキ</button></div>
    </section>
    <section id="sBattle" class="scr" hidden>
      <div id="field"><div id="enemies"></div>
        <div id="player"><div class="emo" id="pEmo"></div><div class="pinfo"><div class="bar" id="pBar"><div class="f"></div><div class="t"></div></div><div class="sts" id="pSts"></div></div></div>
        <div id="hint"></div>
      </div>
      <div id="hand"></div>
      <div id="bbar">
        <div id="energy">3/3</div>
        <button class="pile" id="pDraw">山札<b>0</b></button>
        <button class="pile" id="pDisc">捨札<b>0</b></button>
        <button class="pile" id="pExh">廃棄<b>0</b></button>
        <button class="btn red sm" id="endBtn">ターン終了</button>
      </div>
    </section>
    <section id="sPage" class="scr" hidden><div class="scroll" id="pageBody"></div></section>
  </main>
  <div id="modal" hidden><div class="mbox" id="mbox"></div></div>
  <div id="toasts"></div>
</div>
