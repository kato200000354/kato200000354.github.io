<!doctype html>
<html lang="ja">
<head>
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ネオン・チューブダッシュ</title>
<meta name="description" content="光るトンネルの中をボールで駆けぬける3Dランゲーム。左右に動くとトンネルの壁も天井も走れる！穴はジャンプでとびこえ、ブロックをよけ、ジェムを集めてどこまで行けるか挑戦しよう。">
<meta name="theme-color" content="#05040c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#05040c;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,.8)}
#dist{font-size:40px;font-weight:800;line-height:1;letter-spacing:.02em}
#dist small{font-size:18px;margin-left:2px;opacity:.8}
#best{font-size:13px;opacity:.75;margin-top:4px}
.right{text-align:right}
#gem{font-size:22px;font-weight:800;color:#7ff6ff}
#spd{font-size:13px;opacity:.75;margin-top:4px}
#combo{position:fixed;left:0;right:0;top:calc(70px + env(safe-area-inset-top));text-align:center;font-size:20px;font-weight:800;color:#ffe45c;text-shadow:0 0 12px #ff9d00;pointer-events:none;opacity:0;transition:opacity .2s}
#zone{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:30px;font-weight:800;letter-spacing:.1em;pointer-events:none;opacity:0;text-shadow:0 0 18px currentColor;transition:opacity .4s}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;background:radial-gradient(ellipse at center,rgba(20,10,50,.55),rgba(3,2,10,.9))}
.ttl{font-size:clamp(34px,9vw,60px);font-weight:800;line-height:1.05;background:linear-gradient(90deg,#ff5ad8,#7ff6ff,#ffe45c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,90,216,.5))}
.sub{font-size:15px;opacity:.85;line-height:1.7;max-width:420px}
.how{font-size:13px;opacity:.8;line-height:1.9;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;max-width:420px}
.how b{color:#7ff6ff}
.big{font-size:22px;font-weight:800;padding:14px 44px;border-radius:999px;background:linear-gradient(90deg,#ff5ad8,#8a5bff);box-shadow:0 0 24px rgba(255,90,216,.6),inset 0 2px 0 rgba(255,255,255,.3);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.res{font-size:16px;line-height:2;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 24px;min-width:240px}
.res b{font-size:24px;color:#ffe45c}
#newrec{color:#ff5ad8;font-weight:800;font-size:20px;animation:pulse .6s infinite}
#why{font-size:18px;font-weight:800;color:#ff7a7a}
#pad{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.touch #pad{display:flex}
.pb{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);font-size:28px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.pb.on{background:rgba(127,246,255,.35)}
#bj{width:96px;height:96px;font-size:17px;font-weight:800;background:rgba(255,90,216,.25);border-color:rgba(255,90,216,.6)}
.lr{display:flex;gap:10px}
#pause{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));font-size:13px;opacity:.6;pointer-events:none}
.touch #pause{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div><div id="dist">0<small>m</small></div><div id="best"></div></div>
  <div class="right"><div id="gem">◆ 0</div><div id="spd"></div></div>
</div>
<div id="combo"></div>
<div id="zone"></div>
<div id="pad" hidden>
  <div class="lr"><button class="pb" id="bl">◀</button><button class="pb" id="br">▶</button></div>
  <button class="pb" id="bj">ジャンプ</button>
</div>
<div id="pause" hidden>← → で移動 / スペースでジャンプ</div>

<div class="ov" id="title">
  <div class="ttl">ネオン・<br>チューブダッシュ</div>
  <div class="sub">光るトンネルを全速力で駆けぬけろ！<br>横に走れば、壁も天井も道になる。</div>
  <div class="how">
    <b>← →</b>（A D）… トンネルの中をぐるっと移動<br>
    <b>スペース / ↑</b> … ジャンプ（穴をとびこえる）<br>
    スマホは画面下のボタンで操作<br>
    ◆ジェムを続けて取るとコンボで得点アップ！
  </div>
  <button class="big" id="start">スタート</button>
  <div id="tbest" class="sub"></div>
</div>

<div class="ov" id="over" hidden>
  <div id="why"></div>
  <div id="newrec" hidden>★ 新記録！ ★</div>
  <div class="res">
    きょり <b id="rd">0</b> m<br>
    ジェム <b id="rg">0</b> 個<br>
    スコア <b id="rs">0</b><br>
    <span style="opacity:.7">ベスト <span id="rb">0</span></span>
  </div>
  <button class="big" id="retry">もういちど</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- 定数 ----------
const N = 16;              // 1周のタイル数
const K = 90;              // 先まで用意しておくリング数
const L = 2;               // リング1個の奥行き
const R = 5;               // トンネル半径
const SEG = Math.PI * 2 / N;
const GRAV = 26, JUMPV = 9.2;
const ZONES = [
  { name: 'ネオン ゾーン',   hue: 0.86 },
  { name: 'サイバー ゾーン', hue: 0.52 },
  { name: 'サンセット ゾーン', hue: 0.06 },
  { name: 'エメラルド ゾーン', hue: 0.38 },
  { name: 'ギャラクシー ゾーン', hue: 0.72 },
  { name: 'ゴールド ゾーン', hue: 0.13 },
];
const ZONE_LEN = 450; // m

// ---------- Three ----------
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040c);
scene.fog = new THREE.Fog(0x05040c, 25, 120);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x404060, 0.75));
const plight = new THREE.PointLight(0xffffff, 1.4, 40);
scene.add(plight);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 85 : 70;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const tileGeo = new THREE.BoxGeometry(2 * Math.PI * R / N * 0.94, 0.35, L * 0.94);
const tileMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
const tiles = new THREE.InstancedMesh(tileGeo, tileMat, K * N);
tiles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(tiles);

const blockGeo = new THREE.BoxGeometry(2 * Math.PI * R / N * 0.8, 1.3, L * 0.8);
const blockMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x330000 });
const blocks = new THREE.InstancedMesh(blockGeo, blockMat, K * N);
blocks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(blocks);

const gemGeo = new THREE.OctahedronGeometry(0.42);
const gemMat = new THREE.MeshLambertMaterial({ color: 0x7ff6ff, emissive: 0x1a8a99 });
const gems = new THREE.InstancedMesh(gemGeo, gemMat, K);
gems.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(gems);

// 色バッファを最初に作っておく（後から作るとシェーダーが切りかわらないため）
{ const w = new THREE.Color(0xffffff); for (let k = 0; k < K * N; k++) { tiles.setColorAt(k, w); blocks.setColorAt(k, w); } }

// ゾーン境界の光る輪
const ringGeo = new THREE.TorusGeometry(R + 0.1, 0.12, 6, 48);
const glowRings = [];
for (let i = 0; i < 3; i++) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  m.visible = false; scene.add(m); glowRings.push(m);
}

// プレイヤー
const ballGeo = new THREE.SphereGeometry(0.5, 24, 16);
const ballMat = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x555555 });
const ball = new THREE.Mesh(ballGeo, ballMat);
const stripe = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.06, 6, 24), new THREE.MeshBasicMaterial({ color: 0xff5ad8 }));
ball.add(stripe);
scene.add(ball);
// 残像
const trail = [];
for (let i = 0; i < 10; i++) {
  const m = new THREE.Mesh(ballGeo, new THREE.MeshBasicMaterial({ color: 0xff5ad8, transparent: true, opacity: 0.25 * (1 - i / 10), depthWrite: false }));
  m.scale.setScalar(0.85 - i * 0.06);
  scene.add(m); trail.push(m);
}
// 破片
const sparks = [];
const sparkGeo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
for (let i = 0; i < 40; i++) {
  const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
  m.visible = false; scene.add(m);
  sparks.push({ m, v: new THREE.Vector3(), life: 0 });
}
let sparkIdx = 0;
function burst(pos, color, n, power) {
  for (let i = 0; i < n; i++) {
    const s = sparks[sparkIdx++ % sparks.length];
    s.m.position.copy(pos); s.m.visible = true; s.m.material.color.set(color);
    s.v.set((Math.random() - .5), (Math.random() - .5), (Math.random() - .5)).normalize().multiplyScalar(power * (0.5 + Math.random()));
    s.life = 0.5 + Math.random() * 0.3;
  }
}

// ---------- 音 ----------
let ac = null;
function sfx(type) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    if (type === 'jump') { o.type = 'square'; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(700, t + .12); g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + .15); o.start(t); o.stop(t + .16); }
    else if (type === 'gem') { o.type = 'triangle'; const f = 880 * Math.pow(1.06, Math.min(combo, 12)); o.frequency.setValueAtTime(f, t); o.frequency.setValueAtTime(f * 1.5, t + .05); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .2); o.start(t); o.stop(t + .21); }
    else if (type === 'crash') { o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(40, t + .5); g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .55); o.start(t); o.stop(t + .56); }
    else if (type === 'fall') { o.type = 'sine'; o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(80, t + .8); g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .85); o.start(t); o.stop(t + .86); }
    else if (type === 'zone') { o.type = 'triangle'; [523, 659, 784, 1047].forEach((f, i) => o.frequency.setValueAtTime(f, t + i * .08)); g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + .45); o.start(t); o.stop(t + .46); }
  } catch (e) {}
}

// ---------- コース生成 ----------
// ring: { tiles: Uint8Array(N), blocks: Uint8Array(N), gem: -1|j, gemGot }
const rings = new Array(K);
let gen; // 生成の状態
function resetGen() {
  gen = { safe: 0, pattern: 'open', left: 18, sinceDrift: 0, gapCool: 0, gemLane: -1, gemLeft: 0 };
}
function mod(a, n) { return ((a % n) + n) % n; }
function pickPattern(i) {
  const d = i * L; // m
  const lv = Math.min(1, d / 2500);
  const list = [
    ['open', 2], ['holes', 2 + lv * 2], ['lane', 1 + lv * 3], ['gap', 1 + lv * 2],
    ['blocks', 1.5 + lv * 2], ['spiral', 0.6 + lv * 2], ['checker', 0.3 + lv * 2], ['halves', 0.5 + lv * 1.5],
  ];
  let sum = 0; list.forEach(p => sum += p[1]);
  let r = Math.random() * sum;
  for (const p of list) { if ((r -= p[1]) <= 0) return p[0]; }
  return 'open';
}
function genRing(i) {
  const d = i * L;
  const lv = Math.min(1, d / 2500);
  const t = new Uint8Array(N).fill(1), b = new Uint8Array(N);
  let gem = -1;
  if (gen.left <= 0) {
    gen.pattern = pickPattern(i);
    gen.left = gen.pattern === 'gap' ? 1 : 10 + Math.floor(Math.random() * 14);
    gen.spiralDir = Math.random() < .5 ? -1 : 1;
    gen.width = 3 + Math.floor(Math.random() * 3) - Math.round(lv);
    gen.gapLen = 1 + (Math.random() < 0.3 + lv * 0.5 ? 1 : 0) + (lv > 0.6 && Math.random() < 0.3 ? 1 : 0);
    gen.phase = Math.floor(Math.random() * N);
  }
  const p = i < 15 ? 'open' : gen.pattern;
  // 安全レーンのゆらぎ
  gen.sinceDrift++;
  if (p !== 'spiral' && gen.sinceDrift >= 3 && Math.random() < 0.25) { gen.safe = mod(gen.safe + (Math.random() < .5 ? -1 : 1), N); gen.sinceDrift = 0; }
  const S = gen.safe;
  switch (p) {
    case 'open': break;
    case 'holes':
      for (let j = 0; j < N; j++) if (j !== S && Math.random() < 0.18 + lv * 0.22) t[j] = 0;
      break;
    case 'lane': {
      t.fill(0);
      const w = Math.max(1, gen.width);
      for (let k = -Math.floor(w / 2); k <= Math.floor((w - 1) / 2); k++) t[mod(S + k, N)] = 1;
      // 反対側にもう1本
      if (lv > 0.2) for (let k = 0; k < 2; k++) t[mod(S + N / 2 + k, N)] = 1;
      break;
    }
    case 'spiral': {
      if (gen.sinceDrift >= 2) { gen.safe = mod(gen.safe + gen.spiralDir, N); gen.sinceDrift = 0; }
      t.fill(0);
      const w = Math.max(2, gen.width);
      for (let k = -1; k < w - 1; k++) t[mod(gen.safe + k, N)] = 1;
      break;
    }
    case 'gap':
      if (gen.gapCool <= 0 && i > 20) {
        // 1〜3リングぶん全部の床がない
        t.fill(0);
        gen.gapRun = (gen.gapRun || 0) + 1;
        if (gen.gapRun < gen.gapLen) gen.left = 2; // まだ続ける
        else { gen.gapRun = 0; gen.gapCool = 5; }
      }
      break;
    case 'blocks':
      for (let j = 0; j < N; j++) if (j !== S && Math.random() < 0.14 + lv * 0.18) b[j] = 1;
      if (i % 2) for (let j = 0; j < N; j++) b[j] = 0;
      break;
    case 'checker':
      if (i % 2) for (let j = 0; j < N; j++) if ((j + gen.phase) % 2 && j !== S) t[j] = 0;
      break;
    case 'halves':
      if (Math.floor(i / 4) % 2) for (let j = 0; j < N; j++) if (mod(j - gen.phase, N) < N / 2 && Math.abs(mod(j - S + N / 2, N) - N / 2) > 1) t[j] = 0;
      break;
  }
  if (p !== 'gap' || t[S]) { t[S] = 1; b[S] = 0; }
  gen.left--; gen.gapCool--;
  // ジェム：安全レーン上に列で並べる
  if (gen.gemLeft <= 0 && Math.random() < 0.06 && i > 10) gen.gemLeft = 4 + Math.floor(Math.random() * 5);
  if (gen.gemLeft > 0) {
    gen.gemLeft--;
    gem = t[S] ? S : S; // 穴の上でもジャンプで取れる
  }
  return { tiles: t, blocks: b, gem, gemGot: false, idx: i };
}

const dummy = new THREE.Object3D();
const col = new THREE.Color();
const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
function zoneOf(m) { return Math.floor(m / ZONE_LEN); }
function writeRing(i) {
  const slot = mod(i, K);
  const r = rings[slot];
  const z = -i * L;
  const zone = ZONES[zoneOf(i * L) % ZONES.length];
  for (let j = 0; j < N; j++) {
    const a = j * SEG, k = slot * N + j;
    if (r.tiles[j]) {
      dummy.position.set(R * Math.sin(a), -R * Math.cos(a), z);
      dummy.rotation.set(0, 0, a); dummy.scale.set(1, 1, 1);
      dummy.updateMatrix(); tiles.setMatrixAt(k, dummy.matrix);
      const lit = ((j + i) % 2 ? 0.45 : 0.55) + (i % 8 === 0 ? 0.15 : 0);
      col.setHSL((zone.hue + j * 0.004) % 1, 0.85, lit * 0.8);
      tiles.setColorAt(k, col);
    } else tiles.setMatrixAt(k, ZERO);
    if (r.blocks[j]) {
      const rr = R - 0.15 - 0.65;
      dummy.position.set(rr * Math.sin(a), -rr * Math.cos(a), z);
      dummy.rotation.set(0, 0, a); dummy.scale.set(1, 1, 1);
      dummy.updateMatrix(); blocks.setMatrixAt(k, dummy.matrix);
      col.setHSL((zone.hue + 0.5) % 1, 1, 0.6); blocks.setColorAt(k, col);
    } else blocks.setMatrixAt(k, ZERO);
  }
  tiles.instanceMatrix.needsUpdate = true; blocks.instanceMatrix.needsUpdate = true;
  if (tiles.instanceColor) tiles.instanceColor.needsUpdate = true;
  if (blocks.instanceColor) blocks.instanceColor.needsUpdate = true;
}
function ringAt(i) { const r = rings[mod(i, K)]; return r && r.idx === i ? r : null; }

// ---------- ゲーム状態 ----------
let state = 'title';
let deadDist = 0, theta, camTheta, h, vy, grounded, coyote, dist, speed, gems_n, score, combo, comboT, base, deadT, deadKind, roll, shake, lastZone, jumpBuf, fallR;
let best = store.get('tubedash-best', 0);

function reset() {
  resetGen();
  theta = 0; camTheta = 0; h = 0; vy = 0; grounded = true; coyote = 0; jumpBuf = 0;
  dist = 0; speed = 14; gems_n = 0; score = 0; combo = 0; comboT = 0; roll = 0; shake = 0; lastZone = 0; fallR = 0;
  base = 0;
  for (let i = 0; i < K; i++) { rings[i] = genRing(i); writeRing(i); }
  glowRings.forEach(g => g.visible = false);
  sparks.forEach(s => { s.m.visible = false; s.life = 0; });
}

function start() {
  reset();
  state = 'play';
  $('title').hidden = true; $('over').hidden = true;
  $('hud').hidden = false; $('pad').hidden = false; $('pause').hidden = false;
  $('best').textContent = best ? 'ベスト ' + best : '';
  showZone(0);
  sfx('zone');
}

function die(kind) {
  if (state !== 'play') return;
  state = 'dead'; deadT = 0; deadKind = kind; deadDist = dist;
  if (kind === 'crash') { sfx('crash'); shake = 0.6; burst(ball.position, 0xff5ad8, 30, 10); ball.visible = false; }
  else sfx('fall');
  combo = 0; $('combo').style.opacity = 0;
}
function showOver() {
  state = 'over';
  const d = Math.floor(deadDist);
  const sc = d + gems_n * 10 + score;
  const isNew = sc > best;
  if (isNew) { best = sc; store.set('tubedash-best', best); }
  $('why').textContent = deadKind === 'crash' ? 'ブロックにぶつかった！' : '穴に落ちた…';
  $('rd').textContent = d; $('rg').textContent = gems_n; $('rs').textContent = sc; $('rb').textContent = best;
  $('newrec').hidden = !isNew;
  $('over').hidden = false; $('pad').hidden = true; $('pause').hidden = true;
}

function showZone(z) {
  const zone = ZONES[z % ZONES.length];
  const el = $('zone');
  el.textContent = (z > 0 ? 'ZONE ' + (z + 1) + '\n' : '') + zone.name;
  el.style.whiteSpace = 'pre-line';
  col.setHSL(zone.hue, 1, 0.65); el.style.color = '#' + col.getHexString();
  el.style.opacity = 1;
  clearTimeout(showZone.t); showZone.t = setTimeout(() => el.style.opacity = 0, 1600);
}

// ---------- 入力 ----------
const keys = { l: false, r: false };
function jump() { jumpBuf = 0.12; }
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = true;
  else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    e.preventDefault();
    if (state === 'play') jump();
    else if ((state === 'title' || state === 'over') && !e.repeat) start();
  } else if (k === 'Enter' && (state === 'title' || state === 'over')) start();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.l = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.r = false;
});
addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true, passive: true });
function bindHold(id, key) {
  const el = $(id);
  const on = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); };
  const off = e => { e.preventDefault(); keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindHold('bl', 'l'); bindHold('br', 'r');
$('bj').addEventListener('pointerdown', e => { e.preventDefault(); jump(); $('bj').classList.add('on'); });
$('bj').addEventListener('pointerup', () => $('bj').classList.remove('on'));
$('bj').addEventListener('pointercancel', () => $('bj').classList.remove('on'));
// 画面の上の方を左右でタッチしても動ける・上スワイプでジャンプ
const touches = new Map();
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY, side: e.clientX < innerWidth / 2 ? 'l' : 'r' });
  updTouchKeys();
});
cv.addEventListener('pointermove', e => {
  const t = touches.get(e.pointerId); if (!t) return;
  if (t.y - e.clientY > 40 && !t.jumped) { t.jumped = true; jump(); }
});
const endT = e => { touches.delete(e.pointerId); updTouchKeys(); };
cv.addEventListener('pointerup', endT); cv.addEventListener('pointercancel', endT);
let touchKeys = { l: false, r: false };
function updTouchKeys() {
  touchKeys = { l: false, r: false };
  touches.forEach(t => touchKeys[t.side] = true);
}
$('start').addEventListener('click', start);
$('retry').addEventListener('click', start);
$('tbest').textContent = best ? 'ベストスコア ' + best : '';

let paused = false;
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });

// ---------- メインループ ----------
let last = performance.now();
const tmpV = new THREE.Vector3();
function update(dt) {
  if (state === 'play') {
    speed = Math.min(36, 14 + dist * 0.0055);
    const L_ = keys.l || touchKeys.l, R_ = keys.r || touchKeys.r;
    const dir = (R_ ? 1 : 0) - (L_ ? 1 : 0);
    theta += dir * (3.3 + speed * 0.03) * dt;
    dist += speed * dt;
    roll += speed * dt / 0.5;

    // ジャンプ
    jumpBuf -= dt;
    if (grounded) coyote = 0.09; else coyote -= dt;
    if (jumpBuf > 0 && coyote > 0) { vy = JUMPV; grounded = false; coyote = 0; jumpBuf = 0; sfx('jump'); }
    const ri = Math.round(dist / L);
    const j = mod(Math.round(theta / SEG), N);
    const ring = ringAt(ri);
    const support = ring ? ring.tiles[j] : 1;
    if (!grounded || !support) {
      vy -= GRAV * dt; h += vy * dt;
      grounded = false;
      if (h <= 0 && support && h > -0.4) { h = 0; vy = 0; grounded = true; }
      if (h < -0.4) die('fall');
    }
    if (ring) {
      if (ring.blocks[j] && h < 1.15 && h > -0.3) die('crash');
      if (ring.gem >= 0 && !ring.gemGot) {
        const gd = Math.abs(mod(theta - ring.gem * SEG + Math.PI, Math.PI * 2) - Math.PI);
        if (gd < SEG * 0.8 && h < 1.8) {
          ring.gemGot = true; gems_n++; combo++; comboT = 1.2;
          score += Math.min(combo, 10) * 5;
          burst(ball.position, 0x7ff6ff, 8, 5);
          sfx('gem');
          const c = $('combo');
          c.textContent = combo >= 2 ? combo + ' コンボ！ +' + (10 + Math.min(combo, 10) * 5) : '+15';
          c.style.opacity = 1;
        }
      }
    }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; $('combo').style.opacity = 0; } }

    // リングの入れかえ
    while (ri - base > 6) {
      const ni = base + K;
      rings[mod(ni, K)] = genRing(ni); writeRing(ni);
      base++;
    }
    // ゾーン
    const z = zoneOf(dist);
    if (z !== lastZone) { lastZone = z; showZone(z); sfx('zone'); }

    $('dist').innerHTML = Math.floor(dist) + '<small>m</small>';
    $('gem').textContent = '◆ ' + gems_n;
    $('spd').textContent = Math.round(speed * 3.6) + ' km/h';
  } else if (state === 'dead') {
    deadT += dt;
    if (deadKind === 'fall') { fallR += (6 + fallR * 4) * dt; dist += speed * dt * Math.max(0, 1 - deadT); }
    if (deadT > 1.1) showOver();
  } else if (state === 'title') {
    // タイトル画面ではゆっくり自動走行
    if (!gen) reset();
    dist += 10 * dt; theta += 0.25 * dt;
    while (Math.round(dist / L) - base > 6) {
      const ni = base + K; rings[mod(ni, K)] = genRing(ni); writeRing(ni); base++;
    }
    h = 0;
  }

  // ---- 描画位置 ----
  const pr = R - 0.175 - 0.5 - h + fallR;
  const pz = -dist;
  ball.position.set(pr * Math.sin(theta), -pr * Math.cos(theta), pz);
  ball.rotation.set(-roll, 0, theta);
  ball.visible = state !== 'over' && !(state === 'dead' && deadKind === 'crash');
  for (let i = 0; i < trail.length; i++) {
    const tz = pz + (i + 1) * 0.22 * (speed / 14);
    trail[i].position.set(pr * Math.sin(theta), -pr * Math.cos(theta), tz);
    trail[i].visible = state === 'play';
  }
  // カメラ（少しおくれてついてくる）
  let dth = mod(theta - camTheta + Math.PI, Math.PI * 2) - Math.PI;
  camTheta += dth * Math.min(1, dt * 9);
  const cr = R - 3.0, cz = pz + 5.5;
  const sx = shake > 0 ? (Math.random() - .5) * shake : 0, sy = shake > 0 ? (Math.random() - .5) * shake : 0;
  shake = Math.max(0, shake - dt);
  camera.position.set(cr * Math.sin(camTheta) + sx, -cr * Math.cos(camTheta) + sy, cz);
  camera.up.set(-Math.sin(camTheta), Math.cos(camTheta), 0);
  const lr = R - 1.6;
  camera.lookAt(lr * Math.sin(camTheta), -lr * Math.cos(camTheta), pz - 9);
  const fovBase = innerWidth < innerHeight ? 85 : 70;
  camera.fov += ((fovBase + (speed - 14) * 0.5) - camera.fov) * Math.min(1, dt * 3);
  camera.updateProjectionMatrix();
  plight.position.set(0, 0, pz - 4);

  // ジェムをくるくる
  const tnow = performance.now() / 1000;
  for (let i = 0; i < K; i++) {
    const r = rings[i];
    if (r && r.gem >= 0 && !r.gemGot) {
      const a = r.gem * SEG, rr = R - 0.175 - 1.0;
      dummy.position.set(rr * Math.sin(a), -rr * Math.cos(a), -r.idx * L);
      dummy.rotation.set(0, tnow * 3 + r.idx, a); dummy.scale.set(1, 1.3, 1);
      dummy.updateMatrix(); gems.setMatrixAt(i, dummy.matrix);
    } else gems.setMatrixAt(i, ZERO);
  }
  gems.instanceMatrix.needsUpdate = true;

  // ゾーン境界の輪
  const z0 = zoneOf(dist);
  for (let k = 0; k < glowRings.length; k++) {
    const zm = (z0 + k + 1) * ZONE_LEN;
    const g = glowRings[k];
    g.position.set(0, 0, -zm); g.visible = zm - dist < K * L;
    col.setHSL(ZONES[(z0 + k + 1) % ZONES.length].hue, 1, 0.6); g.material.color.copy(col);
  }
  // ボールの色をゾーンに合わせる
  col.setHSL((ZONES[z0 % ZONES.length].hue + 0.5) % 1, 1, 0.6);
  stripe.material.color.copy(col);
  trail.forEach(t => t.material.color.copy(col));

  // 破片
  for (const s of sparks) {
    if (s.life <= 0) continue;
    s.life -= dt;
    s.m.position.addScaledVector(s.v, dt);
    s.m.rotation.x += dt * 8; s.m.rotation.y += dt * 6;
    s.m.scale.setScalar(Math.max(0.01, s.life * 2));
    if (s.life <= 0) s.m.visible = false;
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  if (paused) return;
  dt = Math.min(dt, 1 / 30);
  // 速いときのすり抜け防止に分割
  const steps = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < steps; i++) update(dt / steps);
  renderer.render(scene, camera);
}
reset();
requestAnimationFrame(loop);
})();
</script>
<script src="../../playtime.js" defer></script>
