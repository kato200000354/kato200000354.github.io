<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ネオン・チューブダッシュ</title>
<meta name="description" content="光るトンネルの中をボールで駆けぬける3Dランゲーム。左右に動くとトンネルの壁も天井も走れる！穴はジャンプでとびこえ、ブロックをよけ、ジェムを集めてどこまで行けるか挑戦しよう。">
<meta name="theme-color" content="#05040c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#05040c;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,.8)}
#dist{font-size:40px;font-weight:800;line-height:1;letter-spacing:.02em}
#dist small{font-size:18px;margin-left:2px;opacity:.8}
#best{font-size:13px;opacity:.75;margin-top:4px}
.right{text-align:right}
#gem{font-size:22px;font-weight:800;color:#7ff6ff}
#spd{font-size:13px;opacity:.75;margin-top:4px}
#combo{position:fixed;left:0;right:0;top:calc(70px + env(safe-area-inset-top));text-align:center;font-size:20px;font-weight:800;color:#ffe45c;text-shadow:0 0 12px #ff9d00;pointer-events:none;opacity:0;transition:opacity .2s}
#zone{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:30px;font-weight:800;letter-spacing:.1em;pointer-events:none;opacity:0;text-shadow:0 0 18px currentColor;transition:opacity .4s}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;background:radial-gradient(ellipse at center,rgba(20,10,50,.55),rgba(3,2,10,.9))}
.ttl{font-size:clamp(34px,9vw,60px);font-weight:800;line-height:1.05;background:linear-gradient(90deg,#ff5ad8,#7ff6ff,#ffe45c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,90,216,.5))}
.sub{font-size:15px;opacity:.85;line-height:1.7;max-width:420px}
.how{font-size:13px;opacity:.8;line-height:1.9;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;max-width:420px}
.how b{color:#7ff6ff}
.big{font-size:22px;font-weight:800;padding:14px 44px;border-radius:999px;background:linear-gradient(90deg,#ff5ad8,#8a5bff);box-shadow:0 0 24px rgba(255,90,216,.6),inset 0 2px 0 rgba(255,255,255,.3);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.res{font-size:16px;line-height:2;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 24px;min-width:240px}
.res b{font-size:24px;color:#ffe45c}
#newrec{color:#ff5ad8;font-weight:800;font-size:20px;animation:pulse .6s infinite}
#why{font-size:18px;font-weight:800;color:#ff7a7a}
#pad{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.touch #pad{display:flex}
.pb{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);font-size:28px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.pb.on{background:rgba(127,246,255,.35)}
#bj{width:96px;height:96px;font-size:17px;font-weight:800;background:rgba(255,90,216,.25);border-color:rgba(255,90,216,.6)}
.lr{display:flex;gap:10px}
#pause{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));font-size:13px;opacity:.6;pointer-events:none}
.touch #pause{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div><div id="dist">0<small>m</small></div><div id="best"></div></div>
  <div class="right"><div id="gem">◆ 0</div><div id="spd"></div></div>
</div>
<div id="combo"></div>
<div id="zone"></div>
<div id="pad" hidden>
  <div class="lr"><button class="pb" id="bl">◀</button><button class="pb" id="br">▶</button></div>
  <button class="pb" id="bj">ジャンプ</button>
</div>
<div id="pause" hidden>← → で移動 / スペースでジャンプ</div>

<div class="ov" id="title">
  <div class="ttl">ネオン・<br>チューブダッシュ</div>
  <div class="sub">光るトンネルを全速力で駆けぬけろ！<br>横に走れば、壁も天井も道になる。</div>
  <div class="how">
    <b>← →</b>（A D）… トンネルの中をぐるっと移動<br>
    <b>スペース / ↑</b> … ジャンプ（穴をとびこえる）<br>
    スマホは画面下のボタンで操作<br>
    ◆ジェムを続けて取るとコンボで得点アップ！
  </div>
  <button class="big" id="start">スタート</button>
  <div id="tbest" class="sub"></div>
</div>

<div class="ov" id="over" hidden>
  <div id="why"></div>
  <div id="newrec" hidden>★ 新記録！ ★</div>
  <div class="res">
    きょり <b id="rd">0</b> m<br>
    ジェム <b id="rg">0</b> 個<br>
    スコア <b id="rs">0</b><br>
    <span style="opacity:.7">ベスト <span id="rb">0</span></span>
  </div>
  <button class="big" id="retry">もういちど</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
