<title>ちょっと月まで</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#151a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="忘れたお弁当を、ママが月の高校まで届けに行く。ママチャリで。">

<style>
:root{
  --ink:#3b2416; --paper:#fbf3e2; --paper2:#f3e3c3; --coral:#ef6a6a; --coral2:#d94f55;
  --pink:#f28ea4; --blue:#1f5fd6; --gold:#ffc23a; --night:#151a3d;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#0b0e24;color:var(--ink);overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#app{position:relative;margin:0 auto;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;overflow:hidden}
.bg-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- 吹き出し ---------- */
.bubble{position:absolute;background:#fff;color:#222;border:3px solid #222;border-radius:22px;padding:10px 16px;
  font-size:clamp(15px,4.4vw,20px);line-height:1.35;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap}
.bubble::after{content:"";position:absolute;width:16px;height:16px;background:#fff;border:3px solid #222;border-top:0;border-left:0;
  transform:rotate(45deg);bottom:-10px;left:28px}
.bubble.tail-r::after{left:auto;right:28px}
.bubble.tail-l::after{transform:rotate(135deg);bottom:auto;top:50%;left:-10px;margin-top:-8px}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- タイトル ---------- */
#title .logo{position:absolute;left:6%;top:3.5%;line-height:.95;pointer-events:none}
.logo span{display:block;font-weight:900;color:#ffd866;
  -webkit-text-stroke:7px #6b3b14;paint-order:stroke fill;filter:drop-shadow(0 5px 0 #3b1e08);letter-spacing:-.02em}
.logo .l1{font-size:clamp(46px,14vw,66px);transform:rotate(-4deg);transform-origin:left}
.logo .l2{font-size:clamp(70px,22vw,104px);margin-left:.35em;background:linear-gradient(#fff3b0,#ffc845 60%,#ffab2e);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#title .tb1{left:4%;top:33%}
#title .tb2{right:5%;top:41%}
.start-btn{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:76%;max-width:340px;height:76px;border-radius:40px;
  background:linear-gradient(#ff8b85,#e65a5f);color:#fff;font-size:34px;font-weight:900;letter-spacing:.06em;
  border:5px solid #fff;box-shadow:0 7px 0 #a8343d,0 10px 24px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;gap:14px;
  animation:breathe 1.8s ease-in-out infinite}
.start-btn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 2px 0 #a8343d}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.04)}}
.start-btn .tri{width:0;height:0;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
.menu{position:absolute;left:0;right:0;bottom:3.5%;display:flex;justify-content:space-around;padding:0 6%}
.menu button{width:74px;height:66px;border-radius:14px;background:var(--paper);border:3px solid #6b4a2a;
  box-shadow:0 4px 0 #6b4a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:#4a2f1a}
.menu button b{font-size:24px;line-height:1.1}
.menu button:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a2a}

/* ---------- 乗り物えらび ---------- */
#select{background:radial-gradient(circle at 50% 0,#2b2f63,#11142e)}
.parch{position:absolute;inset:max(14px,env(safe-area-inset-top)) 12px 14px;background:var(--paper);border-radius:22px;
  box-shadow:inset 0 0 0 3px #e2cfa5,inset 0 0 40px rgba(180,140,80,.25),0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;padding:16px 12px 12px}
.parch .sub{margin:-6px 0 12px;text-align:center;font-size:clamp(11px,3.3vw,13px);color:#5a4632;font-weight:500}
.parch .note{margin:6px 0 0;text-align:center;font-size:10px;color:#8a7558;font-weight:500}
.vrow.special{box-shadow:0 3px 0 #f0b45a,0 0 0 3px #ffb347}
.parch h2{margin:4px 0 12px;text-align:center;font-size:clamp(24px,7vw,30px);font-weight:900;color:#2b1a10;letter-spacing:.06em}
.back{position:absolute;left:12px;top:14px;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #6b4a2a;font-size:20px;color:#6b4a2a}
.vlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 8px}
.vrow{display:flex;align-items:center;gap:12px;background:#fffdf8;border-radius:18px;padding:10px 12px;text-align:left;
  box-shadow:0 3px 0 #e2cfa5,0 0 0 2px #efe2c4;transition:transform .1s}
.vrow:active{transform:scale(.98)}
.vrow .pic{flex:0 0 auto;width:clamp(76px,22vw,96px);aspect-ratio:1.2;border-radius:14px;display:grid;place-items:center;font-size:clamp(44px,13vw,56px)}
.vrow .pic span{filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.vrow .txt{flex:1;min-width:0}
.vrow .nm{font-size:clamp(16px,4.8vw,20px);font-weight:900;color:#1d1209}
.vrow .ds{font-size:clamp(11px,3.3vw,13px);color:#6b5642;font-weight:500;line-height:1.4;margin-top:3px}
.vrow .best{font-size:11px;color:#b07a2a;margin-top:2px}
.vrow .eta{flex:0 0 auto;text-align:right;padding-right:14px;position:relative}
.vrow .eta small{display:block;font-size:11px;color:#6b5642}
.vrow .eta b{font-size:clamp(28px,8.4vw,36px);color:#1f5fd6;font-weight:900;letter-spacing:-.02em}
.vrow .eta b i{font-style:normal;font-size:15px}
.vrow.hot .eta small,.vrow.hot .eta b{color:#e2402d}
.vrow .eta::after{content:"›";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:24px;color:#a08b70}

/* ---------- ゲーム ---------- */
#play{touch-action:none}
#cv{position:absolute;inset:0;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 14px 18px;color:#fff;pointer-events:none;
  background:linear-gradient(rgba(5,8,30,.55),rgba(5,8,30,0));text-shadow:0 2px 3px rgba(0,0,0,.6)}
.hud-top{display:flex;align-items:center;gap:10px;font-size:15px}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:5px}
#pauseBtn i{width:4px;height:14px;background:#fff;border-radius:2px}
.hud-title{flex:1;text-align:center;font-weight:900}
#hudTime{font-variant-numeric:tabular-nums;font-weight:900;min-width:76px;text-align:right}
.bar{display:flex;align-items:center;margin:10px 0 6px;gap:0}
.orb{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid #fff;position:relative;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.orb.earth{background:radial-gradient(circle at 35% 35%,#7fd0ff,#2a74d6 45%,#123a8a);overflow:hidden}
.orb.earth::before{content:"";position:absolute;width:16px;height:12px;background:#5bb35b;border-radius:50% 40% 60% 40%;left:6px;top:9px;box-shadow:12px 10px 0 -2px #5bb35b}
.orb.moon{background:radial-gradient(circle at 35% 35%,#fffbe8,#d8d2bd 55%,#9c977f)}
.orb.moon::before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#bdb69c;left:9px;top:16px;box-shadow:10px -6px 0 -1px #bdb69c,12px 8px 0 1px #c7c0a6}
.track{flex:1;height:16px;margin:0 -6px;background:rgba(255,255,255,.3);border:2px solid #fff;border-radius:10px;position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#7fe07f,#c9f5a0);width:0}
.track .vi{position:absolute;top:50%;transform:translate(-50%,-62%);font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.remain{text-align:center;font-size:15px;margin-top:4px}
.remain b{font-size:clamp(26px,8vw,34px);font-variant-numeric:tabular-nums;letter-spacing:.01em;margin:0 2px}
.rate{text-align:center;font-size:15px}
.meter{position:absolute;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 150px);display:flex;align-items:center;gap:6px;font-size:13px}
.meter .tm{width:70px;height:10px;border-radius:6px;border:2px solid #fff;background:rgba(0,0,0,.3);overflow:hidden}
.meter .tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5aa0ff,#ffb84a,#ff5a3a)}
.meter .hp{display:flex;gap:2px}
.meter .hp em{font-style:normal;font-size:13px}
#say{position:absolute;left:12px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;pointer-events:none;z-index:5}
#say .face{width:74px;height:74px;border-radius:50%;background:#fff6ea;border:3px solid #222;overflow:hidden;flex:0 0 auto;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#say .face svg{width:100%;height:100%}
#say .bubble{position:relative;white-space:normal;max-width:56vw}
#say .bubble::after{display:none}
#say .bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:12px solid #222;border-left:0}
#hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:18px;padding:14px 20px;text-align:center;
  font-size:15px;line-height:1.6;pointer-events:none;transition:opacity .6s;width:max-content;max-width:84%}
#hint b{color:#ffd866}
#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 30px rgba(255,40,40,.7);opacity:0;transition:opacity .3s}

/* ---------- モーダル ---------- */
.modal{position:absolute;inset:0;background:rgba(5,8,25,.6);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--paper);border-radius:22px;border:3px solid #6b4a2a;box-shadow:0 8px 0 #6b4a2a,0 20px 40px rgba(0,0,0,.5);
  width:100%;max-width:380px;max-height:84%;display:flex;flex-direction:column;padding:18px 16px 16px}
.card h3{margin:0 0 12px;text-align:center;font-size:22px;font-weight:900}
.card .body{overflow-y:auto;flex:1}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:16px;font-size:18px;font-weight:900;background:#fff;border:3px solid #6b4a2a;box-shadow:0 4px 0 #6b4a2a;color:#4a2f1a}
.btn.main{background:linear-gradient(#ff8b85,#e65a5f);color:#fff;border-color:#fff;box-shadow:0 4px 0 #a8343d}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a2a}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:2px dashed #e2cfa5;font-size:16px}
.tog{width:64px;height:34px;border-radius:20px;background:#ccc;position:relative;border:2px solid #6b4a2a}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:#7fd07f}.tog.on::after{left:32px}
.ach{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:2px dashed #e2cfa5}
.ach .ic{font-size:28px;width:40px;text-align:center}
.ach.lock{opacity:.4;filter:grayscale(1)}
.ach .t{font-size:15px}.ach .d{font-size:12px;color:#7a6550;font-weight:500}
.zk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zk div{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;box-shadow:0 2px 0 #e2cfa5}
.zk div span{display:block;font-size:30px;line-height:1.3}
.zk div.no{color:#b9a88f}.zk div.no span{filter:brightness(0);opacity:.2}
.zk-h{font-size:14px;margin:14px 0 8px;color:#7a5530}
.zk-h:first-child{margin-top:0}
#toast{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-140%);visibility:hidden;background:#fffbe8;border:3px solid #c48a20;color:#5a3a10;border-radius:16px;
  padding:9px 16px;font-size:15px;z-index:40;transition:transform .35s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#toast.show{transform:translate(-50%,0);visibility:visible}

/* ---------- エンディング ---------- */
#ending .eb1{left:5%;top:15%}
#ending .eb2{right:5%;top:25%}
.end-title{position:absolute;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;font-size:clamp(30px,9.5vw,44px);font-weight:900;color:#ffd866;
  -webkit-text-stroke:6px #6b3b14;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #3b1e08);animation:pop .5s .3s cubic-bezier(.3,1.6,.5,1) both}
.result{padding-top:6px!important;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 92px);width:88%;max-width:380px;
  background:var(--paper);border-radius:20px;border:3px solid #c9a96e;box-shadow:0 6px 0 #a88850,0 14px 30px rgba(0,0,0,.45);padding:12px 18px 12px}
.result h3{margin:0 0 6px;text-align:center;font-size:clamp(20px,6vw,25px);font-weight:900}
.result table{width:100%;border-collapse:collapse;font-size:clamp(13px,3.9vw,16px)}
.result td{padding:6px 4px;border-top:2px solid #eadbb8}
.result td:first-child{color:#6b5642;font-weight:500;width:44%}
.result td:last-child{font-weight:900}
.stars{color:#ffbe1a;font-size:clamp(20px,6vw,26px);letter-spacing:1px;-webkit-text-stroke:1px #c47f00;line-height:1}
.stars .off{color:#e2d6bd;-webkit-text-stroke:1px #c9b893}
.endbtns{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;padding:0 12px}
.endbtns button{flex:1;max-width:120px;height:72px;border-radius:16px;background:linear-gradient(#5a3e2a,#3c281a);color:#fff;border:3px solid #c9a96e;
  box-shadow:0 4px 0 #23160c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.endbtns button b{font-size:24px;line-height:1.2}
.endbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #23160c}
.fadein{animation:fadein .8s both}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(20px)}}
</style>
</head>

<div id="app">

  <!-- ============ タイトル ============ -->
  <section id="title" class="screen">
    <svg class="bg-svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
