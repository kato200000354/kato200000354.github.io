<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ちょっと月まで</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#151a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="忘れたお弁当を、ママが月の高校まで届けに行く。ママチャリで。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{
  --ink:#3b2416; --paper:#fbf3e2; --paper2:#f3e3c3; --coral:#ef6a6a; --coral2:#d94f55;
  --pink:#f28ea4; --blue:#1f5fd6; --gold:#ffc23a; --night:#151a3d;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:#0b0e24;color:var(--ink);overflow:hidden;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#app{position:relative;margin:0 auto;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;overflow:hidden}
.bg-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- 吹き出し ---------- */
.bubble{position:absolute;background:#fff;color:#222;border:3px solid #222;border-radius:22px;padding:10px 16px;
  font-size:clamp(15px,4.4vw,20px);line-height:1.35;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap}
.bubble::after{content:"";position:absolute;width:16px;height:16px;background:#fff;border:3px solid #222;border-top:0;border-left:0;
  transform:rotate(45deg);bottom:-10px;left:28px}
.bubble.tail-r::after{left:auto;right:28px}
.bubble.tail-l::after{transform:rotate(135deg);bottom:auto;top:50%;left:-10px;margin-top:-8px}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- タイトル ---------- */
#title .logo{position:absolute;left:6%;top:3.5%;line-height:.95;pointer-events:none}
.logo span{display:block;font-weight:900;color:#ffd866;
  -webkit-text-stroke:7px #6b3b14;paint-order:stroke fill;filter:drop-shadow(0 5px 0 #3b1e08);letter-spacing:-.02em}
.logo .l1{font-size:clamp(46px,14vw,66px);transform:rotate(-4deg);transform-origin:left}
.logo .l2{font-size:clamp(70px,22vw,104px);margin-left:.35em;background:linear-gradient(#fff3b0,#ffc845 60%,#ffab2e);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#title .tb1{left:4%;top:33%}
#title .tb2{right:5%;top:41%}
.start-btn{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:76%;max-width:340px;height:76px;border-radius:40px;
  background:linear-gradient(#ff8b85,#e65a5f);color:#fff;font-size:34px;font-weight:900;letter-spacing:.06em;
  border:5px solid #fff;box-shadow:0 7px 0 #a8343d,0 10px 24px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;gap:14px;
  animation:breathe 1.8s ease-in-out infinite}
.start-btn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 2px 0 #a8343d}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.04)}}
.start-btn .tri{width:0;height:0;border-left:24px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent}
.menu{position:absolute;left:0;right:0;bottom:3.5%;display:flex;justify-content:space-around;padding:0 6%}
.menu button{width:74px;height:66px;border-radius:14px;background:var(--paper);border:3px solid #6b4a2a;
  box-shadow:0 4px 0 #6b4a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:#4a2f1a}
.menu button b{font-size:24px;line-height:1.1}
.menu button:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a2a}

/* ---------- 乗り物えらび ---------- */
#select{background:radial-gradient(circle at 50% 0,#2b2f63,#11142e)}
.parch{position:absolute;inset:max(14px,env(safe-area-inset-top)) 12px 14px;background:var(--paper);border-radius:22px;
  box-shadow:inset 0 0 0 3px #e2cfa5,inset 0 0 40px rgba(180,140,80,.25),0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;padding:16px 12px 12px}
.parch .sub{margin:-6px 0 12px;text-align:center;font-size:clamp(11px,3.3vw,13px);color:#5a4632;font-weight:500}
.parch .note{margin:6px 0 0;text-align:center;font-size:10px;color:#8a7558;font-weight:500}
.vrow.special{box-shadow:0 3px 0 #f0b45a,0 0 0 3px #ffb347}
.parch h2{margin:4px 0 12px;text-align:center;font-size:clamp(24px,7vw,30px);font-weight:900;color:#2b1a10;letter-spacing:.06em}
.back{position:absolute;left:12px;top:14px;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #6b4a2a;font-size:20px;color:#6b4a2a}
.vlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 2px 8px}
.vrow{display:flex;align-items:center;gap:12px;background:#fffdf8;border-radius:18px;padding:10px 12px;text-align:left;
  box-shadow:0 3px 0 #e2cfa5,0 0 0 2px #efe2c4;transition:transform .1s}
.vrow:active{transform:scale(.98)}
.vrow .pic{flex:0 0 auto;width:clamp(76px,22vw,96px);aspect-ratio:1.2;border-radius:14px;display:grid;place-items:center;font-size:clamp(44px,13vw,56px)}
.vrow .pic span{filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.vrow .txt{flex:1;min-width:0}
.vrow .nm{font-size:clamp(16px,4.8vw,20px);font-weight:900;color:#1d1209}
.vrow .ds{font-size:clamp(11px,3.3vw,13px);color:#6b5642;font-weight:500;line-height:1.4;margin-top:3px}
.vrow .best{font-size:11px;color:#b07a2a;margin-top:2px}
.vrow .eta{flex:0 0 auto;text-align:right;padding-right:14px;position:relative}
.vrow .eta small{display:block;font-size:11px;color:#6b5642}
.vrow .eta b{font-size:clamp(28px,8.4vw,36px);color:#1f5fd6;font-weight:900;letter-spacing:-.02em}
.vrow .eta b i{font-style:normal;font-size:15px}
.vrow.hot .eta small,.vrow.hot .eta b{color:#e2402d}
.vrow .eta::after{content:"›";position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:24px;color:#a08b70}

/* ---------- ゲーム ---------- */
#play{touch-action:none}
#cv{position:absolute;inset:0;display:block}
#hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 14px 18px;color:#fff;pointer-events:none;
  background:linear-gradient(rgba(5,8,30,.55),rgba(5,8,30,0));text-shadow:0 2px 3px rgba(0,0,0,.6)}
.hud-top{display:flex;align-items:center;gap:10px;font-size:15px}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:5px}
#pauseBtn i{width:4px;height:14px;background:#fff;border-radius:2px}
.hud-title{flex:1;text-align:center;font-weight:900}
#hudTime{font-variant-numeric:tabular-nums;font-weight:900;min-width:76px;text-align:right}
.bar{display:flex;align-items:center;margin:10px 0 6px;gap:0}
.orb{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid #fff;position:relative;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.orb.earth{background:radial-gradient(circle at 35% 35%,#7fd0ff,#2a74d6 45%,#123a8a);overflow:hidden}
.orb.earth::before{content:"";position:absolute;width:16px;height:12px;background:#5bb35b;border-radius:50% 40% 60% 40%;left:6px;top:9px;box-shadow:12px 10px 0 -2px #5bb35b}
.orb.moon{background:radial-gradient(circle at 35% 35%,#fffbe8,#d8d2bd 55%,#9c977f)}
.orb.moon::before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#bdb69c;left:9px;top:16px;box-shadow:10px -6px 0 -1px #bdb69c,12px 8px 0 1px #c7c0a6}
.track{flex:1;height:16px;margin:0 -6px;background:rgba(255,255,255,.3);border:2px solid #fff;border-radius:10px;position:relative}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#7fe07f,#c9f5a0);width:0}
.track .vi{position:absolute;top:50%;transform:translate(-50%,-62%);font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.remain{text-align:center;font-size:15px;margin-top:4px}
.remain b{font-size:clamp(26px,8vw,34px);font-variant-numeric:tabular-nums;letter-spacing:.01em;margin:0 2px}
.rate{text-align:center;font-size:15px}
.meter{position:absolute;right:14px;top:calc(max(10px,env(safe-area-inset-top)) + 150px);display:flex;align-items:center;gap:6px;font-size:13px}
.meter .tm{width:70px;height:10px;border-radius:6px;border:2px solid #fff;background:rgba(0,0,0,.3);overflow:hidden}
.meter .tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#5aa0ff,#ffb84a,#ff5a3a)}
.meter .hp{display:flex;gap:2px}
.meter .hp em{font-style:normal;font-size:13px}
#say{position:absolute;left:12px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;pointer-events:none;z-index:5}
#say .face{width:74px;height:74px;border-radius:50%;background:#fff6ea;border:3px solid #222;overflow:hidden;flex:0 0 auto;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#say .face svg{width:100%;height:100%}
#say .bubble{position:relative;white-space:normal;max-width:56vw}
#say .bubble::after{display:none}
#say .bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-right:12px solid #222;border-left:0}
#hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:18px;padding:14px 20px;text-align:center;
  font-size:15px;line-height:1.6;pointer-events:none;transition:opacity .6s;width:max-content;max-width:84%}
#hint b{color:#ffd866}
#flash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px 30px rgba(255,40,40,.7);opacity:0;transition:opacity .3s}

/* ---------- モーダル ---------- */
.modal{position:absolute;inset:0;background:rgba(5,8,25,.6);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--paper);border-radius:22px;border:3px solid #6b4a2a;box-shadow:0 8px 0 #6b4a2a,0 20px 40px rgba(0,0,0,.5);
  width:100%;max-width:380px;max-height:84%;display:flex;flex-direction:column;padding:18px 16px 16px}
.card h3{margin:0 0 12px;text-align:center;font-size:22px;font-weight:900}
.card .body{overflow-y:auto;flex:1}
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:16px;font-size:18px;font-weight:900;background:#fff;border:3px solid #6b4a2a;box-shadow:0 4px 0 #6b4a2a;color:#4a2f1a}
.btn.main{background:linear-gradient(#ff8b85,#e65a5f);color:#fff;border-color:#fff;box-shadow:0 4px 0 #a8343d}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a2a}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:2px dashed #e2cfa5;font-size:16px}
.tog{width:64px;height:34px;border-radius:20px;background:#ccc;position:relative;border:2px solid #6b4a2a}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tog.on{background:#7fd07f}.tog.on::after{left:32px}
.ach{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:2px dashed #e2cfa5}
.ach .ic{font-size:28px;width:40px;text-align:center}
.ach.lock{opacity:.4;filter:grayscale(1)}
.ach .t{font-size:15px}.ach .d{font-size:12px;color:#7a6550;font-weight:500}
.zk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zk div{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;box-shadow:0 2px 0 #e2cfa5}
.zk div span{display:block;font-size:30px;line-height:1.3}
.zk div.no{color:#b9a88f}.zk div.no span{filter:brightness(0);opacity:.2}
.zk-h{font-size:14px;margin:14px 0 8px;color:#7a5530}
.zk-h:first-child{margin-top:0}
#toast{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translate(-50%,-140%);visibility:hidden;background:#fffbe8;border:3px solid #c48a20;color:#5a3a10;border-radius:16px;
  padding:9px 16px;font-size:15px;z-index:40;transition:transform .35s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#toast.show{transform:translate(-50%,0);visibility:visible}

/* ---------- エンディング ---------- */
#ending .eb1{left:5%;top:15%}
#ending .eb2{right:5%;top:25%}
.end-title{position:absolute;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;font-size:clamp(30px,9.5vw,44px);font-weight:900;color:#ffd866;
  -webkit-text-stroke:6px #6b3b14;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #3b1e08);animation:pop .5s .3s cubic-bezier(.3,1.6,.5,1) both}
.result{padding-top:6px!important;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(16px,env(safe-area-inset-bottom)) + 92px);width:88%;max-width:380px;
  background:var(--paper);border-radius:20px;border:3px solid #c9a96e;box-shadow:0 6px 0 #a88850,0 14px 30px rgba(0,0,0,.45);padding:12px 18px 12px}
.result h3{margin:0 0 6px;text-align:center;font-size:clamp(20px,6vw,25px);font-weight:900}
.result table{width:100%;border-collapse:collapse;font-size:clamp(13px,3.9vw,16px)}
.result td{padding:6px 4px;border-top:2px solid #eadbb8}
.result td:first-child{color:#6b5642;font-weight:500;width:44%}
.result td:last-child{font-weight:900}
.stars{color:#ffbe1a;font-size:clamp(20px,6vw,26px);letter-spacing:1px;-webkit-text-stroke:1px #c47f00;line-height:1}
.stars .off{color:#e2d6bd;-webkit-text-stroke:1px #c9b893}
.endbtns{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;padding:0 12px}
.endbtns button{flex:1;max-width:120px;height:72px;border-radius:16px;background:linear-gradient(#5a3e2a,#3c281a);color:#fff;border:3px solid #c9a96e;
  box-shadow:0 4px 0 #23160c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.endbtns button b{font-size:24px;line-height:1.2}
.endbtns button:active{transform:translateY(3px);box-shadow:0 1px 0 #23160c}
.fadein{animation:fadein .8s both}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(20px)}}
</style>
</head>

<div id="app">

  <!-- ============ タイトル ============ -->
  <section id="title" class="screen">
    <svg class="bg-svg" viewBox="0 0 360 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121638"/><stop offset=".55" stop-color="#2a2d66"/><stop offset="1" stop-color="#4a3f72"/></linearGradient>

const KEY = 'chotto-tsuki-made';
const defSave = () => ({ plays:0, best:{}, ach:{}, seen:{}, used:{}, sound:true, vib:true });

const see = name => { if (!save.seen[name]) { save.seen[name] = 1; } };

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
  if (!save.sound) return;
  const a = ac(); if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}

}

// ---------- 星（タイトル／エンディング） ----------
(function () {
  const put = (g, n, seed, maxY) => {
    const r = rng(seed); let h = '';
    for (let i = 0; i < n; i++) h += `<circle cx="${(r() * 360).toFixed(1)}" cy="${(r() * maxY).toFixed(1)}" r="${(r() * 1.3 + 0.3).toFixed(2)}" opacity="${(0.4 + r() * 0.6).toFixed(2)}"/>`;
    g.innerHTML = h;
  };
  put($('#tstars'), 70, 11, 380);
  put($('#estars'), 110, 23, 410);
})();
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b) { let h = Math.imul(a * 374761393 + b * 668265263, 1274126177); h ^= h >>> 13; h = Math.imul(h, 1103515245); return ((h ^ h >>> 16) >>> 0) / 4294967296; }

// ---------- タイトル／メニュー ----------
$('#startBtn').onclick = () => { sfx.click(); buildList(); show('select'); };
$('#selBack').onclick = () => { sfx.click(); show('title'); };
function fmtSec(t) { const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0'); }
function buildList() {

      <div class="eta"><small>月まで</small><b>${v.T}<i>秒</i></b></div>

}

$('#modal').onclick = e => { if (e.target.id === 'modal' && mode !== 'play') closeModal(); };

let toastTimer = 0;

// ======================================================================
//  ゲーム本体
// ======================================================================
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, S = 1, LW = 1, hy = 0, baseY = 0, DPR = 1;
function resize() {
  const r = $('#app').getBoundingClientRect();
  W = r.width; H = r.height; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.min(W / 400, H / 720); LW = Math.min(W, H * 0.62) * 0.42;
  hy = H * 0.45; baseY = H * 0.86;
}
addEventListener('resize', resize); resize();

// 事前に作る背景データ
const R0 = rng(7);
const STARS = Array.from({ length: 200 }, () => ({ x: R0(), y: R0(), r: R0() * 1.4 + 0.3, ph: R0() * 6 }));
const SKYLINE = []; { const r = rng(3); let x = -0.02; while (x < 1.05) { const w = 0.035 + r() * 0.05, h = 0.03 + r() * 0.11; const wins = []; for (let i = 0; i < 6; i++) if (r() < 0.7) wins.push([r(), r()]); SKYLINE.push({ x, w, h, wins }); x += w; } }
const CRATERS = Array.from({ length: 24 }, () => ({ a: R0() * TAU, d: Math.sqrt(R0()) * 0.85, r: 0.04 + R0() * 0.12 }));
const CONT = Array.from({ length: 16 }, () => ({ a: R0() * TAU, d: R0() * 0.85, rx: 0.07 + R0() * 0.14, ry: 0.04 + R0() * 0.08, rot: R0() * 3 }));

// 描画ヘルパー
const circ = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); };
const ell = (x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); ctx.fill(); };
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const rrf = (x, y, w, h, r) => { rr(x, y, w, h, r); ctx.fill(); };
function polyf(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';

// ---------- 状態 ----------
let G = null;
let camX = 0;
function proj(x, z) { const k = 1 / z; return { x: W / 2 + (x - camX) * LW * k, y: hy + (baseY - hy) * k, k, u: LW * k }; }

const SCENES = [[0.02, 'city', 'sky'], [0.2, 'sky', 'space'], [0.75, 'space', 'approach'], [0.97, 'approach', 'moon']];
function sceneAt(p) { return p < 0.02 ? 'city' : p < 0.2 ? 'sky' : p < 0.75 ? 'space' : p < 0.97 ? 'approach' : 'moon'; }

function startGame(veh, startP = 0) {
  closeModal();
  G = {
    veh, t: 0, dist: D_KM * startP, e: 0, hold: false, px: 0, tx: 0, ph: 0, mult: 1,
    temp: 100, shape: 100, hits: 0, karo: 0, objs: [], travel: 0, spawnT: 1.4, propT: 0, propSide: 1,
    stun: 0, boost: 0, shake: 0, done: false, arriveT: 0, flags: {}, keyDir: 0, lastScene: '', astro: false,
  };
  camX = 0; resize();
  $('#barVeh').textContent = veh.emoji;
  $('#hp').innerHTML = '';
  $('#hint').style.opacity = veh.T > 10 ? 1 : 0;
  $('#say').hidden = true;
  show('play');
  const first = { bike: 'よし！ 行くわよ〜！', kei: 'ちょっと飛ばすわよ〜！', train: '駅弁じゃないのよ〜！', plane: 'ちょっと急いでもらえる？', jet: 'しっかりつかまってるわよ〜！', rocket: '本気出すわよ〜！', light: 'いくわよー！！' }[veh.id];
  say(first, 2.4);
  last = performance.now();
}

// ---------- セリフ ----------
let sayT = 0;
function say(text, dur = 2.8) {
  $('#sayText').innerHTML = text.replace(/ /g, '<br>');
  const el = $('#say'); el.hidden = false;
  const b = $('#sayText'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  sayT = dur;
}

// ---------- 入力 ----------
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (!G || G.done || paused) return;
  ac();
  drag = { id: e.pointerId, x: e.clientX, tx: G.tx };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  G.hold = true; pedal();
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || !G) return;
  G.tx = clamp(drag.tx + (e.clientX - drag.x) / (W * 0.3), -0.9, 0.9);
});
const endDrag = e => { if (drag && drag.id === e.pointerId) { drag = null; if (G) G.hold = false; } };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
function pedal() {
  if (!G || G.done) return;
  G.e = Math.min(1, G.e + 0.12); G.ph += 0.9; sfx.tap();
  if (G.t > 1.2) $('#hint').style.opacity = 0;
}
const keys = {};
addEventListener('keydown', e => {
  if (mode !== 'play' || !G) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); return; }
  if (paused || G.done) return;
  if ((e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && !e.repeat) { pedal(); e.preventDefault(); }
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- 一時停止 ----------
let paused = false;
$('#pauseBtn').onclick = () => togglePause();
function togglePause() {
  if (!G || G.done) return;
  paused = !paused;
  if (paused) {
    modal('ひと休み', '<p style="text-align:center;font-weight:500;margin:4px 0">お弁当が冷めないうちにね。</p>', [
      ['再開する', () => { paused = false; closeModal(); last = performance.now(); }, 'main'],
      ['最初から', () => { paused = false; startGame(G.veh); }],
      ['タイトルへ', () => { paused = false; closeModal(); G = null; show('title'); }],
    ]);
  } else { closeModal(); last = performance.now(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play' && G && !G.done && !paused) togglePause(); });

// ---------- 更新 ----------
function update(dt) {
  const g = G, v = g.veh;
  if (!g.done) g.t += dt;

  // 加速：連打で上がり、長押しで中くらいを保つ
  if (!g.done) {
    if (g.hold && g.e < 0.55) g.e = Math.min(0.55, g.e + dt * 1.2);
    else if (!g.hold) g.e = Math.max(0, g.e - dt * 0.35);
    else g.e = Math.max(0.55, g.e - dt * 0.35);
  } else g.e = Math.max(0, g.e - dt * 2);
  if (g.boost > 0) { g.boost -= dt; g.e = 1; }
  let mult = 1 + 3 * g.e;
  if (g.stun > 0) { g.stun -= dt; mult = Math.min(mult, 0.4); }
  if (g.done) mult = g.e * 2;
  g.mult = mult;

  // ハンドル
  const kd = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  if (kd) g.tx = clamp(g.tx + kd * dt * 2.4, -0.9, 0.9);
  g.px += (g.tx - g.px) * Math.min(1, dt * 9);
  camX = g.px * 0.35;
  g.ph += dt * (3 + 9 * g.e);

  // 進む
  if (!g.done) {
    g.dist += D_KM / v.T * mult * dt;
    g.temp = Math.max(0, g.temp - dt * 0.3);
    if (g.dist >= D_KM) arrive();
  }
  const p = g.dist / D_KM;
  const vs = g.done ? 6 * g.e : 9 + 8 * mult;
  g.travel += vs * dt;

  // シーンが変わったとき
  const sc = sceneAt(p);
  if (sc !== g.lastScene) {
    g.lastScene = sc;
    if (sc === 'city') see('タワー');
    const talk = v.T >= 3 && v.id !== 'light';
    if (sc === 'sky') { see('富士山'); if (talk) say(v.id === 'plane' ? 'わぁ〜 富士山が見えるわ！ キレイねぇ〜' : v.id === 'bike' ? 'あら〜 キレイねぇ' : 'あら〜 雲の上って こんなにキレイなのね', 3); }
    if (sc === 'space') { see('地球'); if (talk) say(v.T <= 7 ? 'すごい速さね！ 地球がどんどん 小さくなっていくわ！' : 'わぁ〜！ 宇宙って こんなにキレイなのね！', 3.4); }
    if (sc === 'approach') { see('月'); if (talk) say(v.T <= 7 ? '見えてきたわ！ あと少しよ！' : '見えてきたわ！ もうすぐよ〜！'); }
  }
  if (sc === 'space' && p > 0.3 && p < 0.65) see('宇宙ステーション');
  if (!g.flags.mid && p > 0.5 && v.T > 30) { g.flags.mid = 1; setTimeout(() => G === g && !g.done && say(['あの子 ちゃんと授業受けてるかしら', 'お昼に間に合うかしら〜', '帰りに夕飯の買い物しなきゃ'][Math.floor(Math.random() * 3)], 3), 4000); }
  if (!g.astro && p > 0.42 && v.T > 10) { g.astro = true; g.objs.push({ kind: 'astro', x: 1.5, z: 40, lift: 0.9 }); }

  // 物を動かす
  for (const o of g.objs) o.z -= vs * dt;
  // 障害物・アイテムの出現
  if (!g.done && p < 0.993 && v.T > 5) {
    g.spawnT -= dt * (0.55 + 0.45 * mult / 2);
    if (g.spawnT <= 0 && g.t > 1.5) {
      g.spawnT = 1.0 + Math.random() * 1.1;
      const list = OBS[sc];
      const lanes = [-0.6, 0, 0.6];
      const x0 = Math.random() < 0.5 ? clamp(g.tx, -0.75, 0.75) : lanes[Math.floor(Math.random() * 3)];
      const r = Math.random();
      if (r < 0.16) g.objs.push({ kind: 'karo', x: x0, z: 46, lift: 0.15 });
      else if (r < 0.22) g.objs.push({ kind: 'star', x: x0, z: 46, lift: 0.2 });
      else {
        const [em, nm, lift] = list[Math.floor(Math.random() * list.length)];
        g.objs.push({ kind: 'ob', em, nm, x: x0, z: 46, lift, wob: Math.random() * 6 });
        if (Math.random() < 0.3 && g.t > 20) {
          const [em2, nm2, l2] = list[Math.floor(Math.random() * list.length)];
          const x2 = lanes.filter(l => Math.abs(l - x0) > 0.5)[Math.floor(Math.random() * 2)] ?? -x0;
          g.objs.push({ kind: 'ob', em: em2, nm: nm2, x: x2, z: 50, lift: l2, wob: Math.random() * 6 });
        }
      }
    }
  }
  // 道ばたの飾り
  g.propT -= vs * dt;
  while (g.propT <= 0) {
    g.propT += 2.6;
    for (const side of [-1, 1]) {
      const r = Math.random();
      let type, x;
      if (sc === 'city') { if (r < 0.45) { type = 'house'; x = 2.15 + Math.random() * 0.3; } else if (r < 0.75) { type = 'pole'; x = 1.4; } else { type = 'tree'; x = 1.75; } }
      else if (sc === 'sky') { type = 'cloud'; x = 1.6 + Math.random() * 1.6; }
      else if (sc === 'space' || sc === 'approach') { if (r < 0.5) continue; type = 'rock'; x = 1.6 + Math.random() * 2; }
      else { type = 'mrock'; x = 1.4 + Math.random() * 1.8; }
      g.objs.push({ kind: 'prop', type, x: side * x, z: 60, seed: Math.random() * 1000 | 0, lift: type === 'rock' ? 0.3 + Math.random() * 1.2 : type === 'cloud' ? -0.05 : 0 });
    }
  }

  // ぶつかる・ひろう
  for (const o of g.objs) {
    if (o.z < 1.5 && o.z > 0.6 && !o.used && (o.kind === 'ob' || o.kind === 'karo' || o.kind === 'star') && !g.done) {
      if (Math.abs(o.x - g.px) < v.w) {
        o.used = true;
        if (o.kind === 'ob') {
          see(o.nm); g.hits++; g.shape = Math.max(0, g.shape - (v.id === 'bike' ? 16 : 12));
          g.stun = 0.7; g.e = 0; g.shake = 0.45; sfx.hit(); vib(90);
          $('#flash').style.opacity = 1; setTimeout(() => $('#flash').style.opacity = 0, 160);
          say(['きゃっ！', 'あぶなっ！', 'ちょっと〜！', 'お弁当が〜！', 'ごめんなさいね〜！'][Math.floor(Math.random() * 5)], 1.6);
          o.fly = 1;
        } else if (o.kind === 'karo') {
          see('カイロ'); g.karo++; g.temp = Math.min(100, g.temp + 25); sfx.item(); o.gone = true;
          if (Math.random() < 0.5) say('あったか〜い♪', 1.5);
        } else {
          see('スター'); g.boost = 3; sfx.star(); o.gone = true; say('いくわよ〜！', 1.4);
        }
      }
    }
    if (o.kind === 'ob' && o.z < 8 && o.z > 1.5) see(o.nm);
    if (o.kind === 'astro' && o.z < 10 && !o.greet) { o.greet = true; see('宇宙飛行士'); say('お仕事 お疲れさまです〜！', 3); }
  }
  g.objs = g.objs.filter(o => o.z > 0.35 && !o.gone);

  if (g.t > 6 && !g.flags.hintOff) { g.flags.hintOff = 1; $('#hint').style.opacity = 0; }
  if (g.shake > 0) g.shake -= dt;
  if (sayT > 0) { sayT -= dt; if (sayT <= 0) $('#say').hidden = true; }
  if (g.done) { g.arriveT += dt; if (g.arriveT > 2.4 && !g.flags.ended) { g.flags.ended = 1; showEnding(); } }
}

function arrive() {
  const g = G;
  g.dist = D_KM; g.done = true; g.time = g.t; g.hold = false; drag = null;
  see('月面高等学校');
  sfx.arrive(); vib([60, 40, 60]);
  say('到着〜！', 3);
}

// ---------- HUD ----------
function hud() {
  const g = G, p = Math.min(1, g.dist / D_KM);
  const t = g.done ? g.time : g.t, s = Math.floor(t);
  $('#hudTime').textContent = [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':') + (g.veh.T < 10 ? '.' + Math.floor((t % 1) * 10) : '');
  $('#barFill').style.width = (p * 100) + '%';
  $('#barVeh').style.left = (p * 100) + '%';
  const rem = D_KM - g.dist;
  const shown = rem <= 0 ? 0 : rem > 10000 ? Math.round(rem / 1000) * 1000 : rem > 1000 ? Math.round(rem / 100) * 100 : Math.ceil(rem);
  $('#remain').textContent = shown.toLocaleString('ja-JP');
  $('#rate').textContent = p >= 1 ? '100' : (Math.floor(p * 1000) / 10).toFixed(1);
  $('#tempBar').style.width = g.temp + '%';
  const hp = '🍙'.repeat(Math.ceil(g.shape / 20));
  if ($('#hp').dataset.v !== hp) { $('#hp').dataset.v = hp; $('#hp').innerHTML = [...hp].map(c => `<em>${c}</em>`).join(''); }
}

// ======================================================================
//  描画
// ======================================================================
function draw() {
  const g = G, p = Math.min(1, g.dist / D_KM), now = performance.now() / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sh = g.shake > 0 ? g.shake * 14 * S : 0;
  ctx.save();
  if (sh) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

  // 背景（境目はふわっと切りかえ）
  const sc = sceneAt(p);
  drawBG(sc, p, now);
  for (const [b, from, to] of SCENES) {
    const fw = 0.012;
    if (p > b - fw && p < b + fw) {
      const other = sc === from ? to : from;
      ctx.globalAlpha = sc === from ? clamp((p - (b - fw)) / (2 * fw), 0, 1) : clamp(1 - (p - (b - fw)) / (2 * fw), 0, 1);
      drawBG(other, p, now);
      ctx.globalAlpha = 1;
    }
  }
  drawRoad(sc, now);
  speedLines();

  // 物とプレイヤーを奥から順に
  const list = g.objs.slice().sort((a, b) => b.z - a.z);
  let drawn = false;
  for (const o of list) {
    if (!drawn && o.z < 1) { drawPlayer(now); drawn = true; }
    drawObj(o, sc, now);
  }
  if (!drawn) drawPlayer(now);
  ctx.restore();
}

function stars(alpha, maxY, now) {
  ctx.fillStyle = '#fff';
  for (const s of STARS) {
    if (s.y > maxY) continue;
    ctx.globalAlpha = alpha * (0.55 + 0.45 * Math.sin(now * 2 + s.ph));

function cloudSea() {
  let gr = ctx.createLinearGradient(0, hy, 0, H);
  gr.addColorStop(0, '#ffe6d0'); gr.addColorStop(0.25, '#e4e9fb'); gr.addColorStop(1, '#a9bef0');
  ctx.fillStyle = gr; ctx.fillRect(0, hy, W, H - hy);
  const sp = 2.0, N = 16, span = sp * N, rows = [];
  for (let j = 0; j < N; j++) { const n = j * sp - G.travel; const cyc = Math.floor(n / span); rows.push({ z: n - cyc * span + 0.6, seed: j * 131 + cyc * 977 }); }
  rows.sort((a, b) => b.z - a.z);
  for (const row of rows) {
    const k = 1 / row.z, u = LW * k, y = hy + (baseY - hy) * k;
    const step = 0.6, x0 = Math.floor((camX - W / 2 / u - 1) / step), x1 = Math.ceil((camX + W / 2 / u + 1) / step);
    const fade = clamp(1.2 - row.z / span, 0, 1);
    for (let i = x0; i <= x1; i++) {
      const h1 = hash(row.seed, i), h2 = hash(i, row.seed + 7);
      const wx = i * step + (h1 - 0.5) * 0.4, r = (0.32 + h2 * 0.2) * u;
      const sx = W / 2 + (wx - camX) * u, syy = y - h1 * 0.15 * u;
      ctx.fillStyle = `rgba(185,198,238,${fade})`; circ(sx, syy + r * 0.28, r);
      ctx.fillStyle = `rgba(255,255,255,${fade})`; circ(sx, syy, r * 0.9);
    }
  }
}

function moonGround() {
  let gr = ctx.createLinearGradient(0, hy, 0, H);
  gr.addColorStop(0, '#9a9aa2'); gr.addColorStop(1, '#5d5d66');
  ctx.fillStyle = gr; ctx.fillRect(0, hy, W, H - hy);
  const sp = 1.6, N = 22, span = sp * N, rows = [];
  for (let j = 0; j < N; j++) { const n = j * sp - G.travel; const cyc = Math.floor(n / span); rows.push({ z: n - cyc * span + 0.6, seed: j * 53 + cyc * 311 }); }
  rows.sort((a, b) => b.z - a.z);
  for (const row of rows) {
    const k = 1 / row.z, u = LW * k, y = hy + (baseY - hy) * k;
    for (let i = 0; i < 4; i++) {
      const wx = (hash(row.seed, i) - 0.5) * 7, h2 = hash(i + 9, row.seed);
      const sx = W / 2 + (wx - camX) * u;
      if (h2 < 0.45) { ctx.fillStyle = 'rgba(70,70,80,.45)'; ell(sx, y, (0.25 + h2) * u, (0.06 + h2 * 0.1) * u); ctx.fillStyle = 'rgba(190,190,198,.5)'; ell(sx, y + 0.02 * u, (0.22 + h2) * u, (0.04 + h2 * 0.08) * u); }
      else { ctx.fillStyle = '#6f6f78'; ell(sx, y - 0.03 * u, 0.06 * u * (1 + h2), 0.04 * u * (1 + h2)); ctx.fillStyle = '#a4a4ac'; ell(sx - 0.015 * u, y - 0.045 * u, 0.035 * u * (1 + h2), 0.02 * u * (1 + h2)); }
    }
  }
}

function drawRoad(sc, now) {
  const near = 0.72, far = 220;
  const quad = (x1, x2, z1, z2) => { const a = proj(x1, z1), b = proj(x2, z1), c = proj(x2, z2), d = proj(x1, z2); polyf([a.x, a.y, b.x, b.y, c.x, c.y, d.x, d.y]); };

    ctx.fillStyle = '#48445a'; quad(-1.15, 1.15, near, far);

function speedLines() {

function drawObj(o, sc, now) {

    ctx.fillStyle = '#e8622a'; ctx.font = `900 ${0.09 * u}px "M PLUS Rounded 1c",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('カイロ', P.x, yy + h * 0.62);
    ctx.font = `${0.11 * u}px ${EMOJI_FONT}`; ctx.fillText('♨️', P.x, yy + h * 0.28);
  } else if (o.kind === 'star') {
    ctx.font = `${0.46 * u}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';

  }
  ctx.restore();
}

function drawProp(o, P, u) {

  } else if (o.type === 'rock') {
    const yy = y - o.lift * u, s = (0.1 + r * 0.15) * u;
    ctx.fillStyle = '#7d7468'; ell(x, yy, s, s * 0.8, r * 3);
    ctx.fillStyle = '#a49a8c'; ell(x - s * 0.25, yy - s * 0.25, s * 0.5, s * 0.35, r * 3);

    ctx.fillStyle = '#a8a8b2'; ell(x - s * 0.25, y - s * 0.6, s * 0.5, s * 0.3);

}

// ---------- プレイヤー ----------
function drawPlayer(now) {
  const g = G, P = proj(g.px, 1), s = S * 0.9;
  if (g.stun > 0 && Math.floor(now * 16) % 2) ctx.globalAlpha = 0.5;
  const lean = clamp((g.tx - g.px) * 0.7, -0.28, 0.28);
  const bob = g.veh.id === 'bike' ? Math.sin(g.ph * 2) * 1.5 * s : Math.sin(now * 9) * 0.8 * s;
  const ground = ['city', 'moon'].includes(sceneAt(g.dist / D_KM));
  ctx.fillStyle = ground ? 'rgba(0,0,0,.3)' : 'rgba(255,255,255,.2)';
  const sw = { bike: 30, kei: 70, train: 70, plane: 140, jet: 80, rocket: 40, light: 30 }[g.veh.id];
  ell(P.x, P.y + 2 * s, sw * s, 8 * s);
  ctx.save(); ctx.translate(P.x, P.y + bob); ctx.rotate(lean);
  ({ bike: drawBike, kei: drawKei, train: drawTrain, plane: drawPlane, jet: drawJet, rocket: drawRocket, light: drawLight })[g.veh.id](s, g.ph, now);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawHair(cx, cy, r, s) {
  ctx.fillStyle = '#7a4424'; circ(cx, cy, r);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    ctx.fillStyle = i % 2 ? '#8d5230' : '#7a4424';
    circ(cx + Math.cos(a) * r * 0.88, cy + Math.sin(a) * r * 0.88, r * 0.38);
  }
  ctx.fillStyle = '#8d5230';
  for (const [dx, dy] of [[-0.4, -0.3], [0.35, -0.35], [0, 0.1], [-0.35, 0.4], [0.4, 0.35], [0, -0.6]]) circ(cx + dx * r, cy + dy * r, r * 0.3);
  ctx.strokeStyle = '#5e3218'; ctx.lineWidth = 1.6 * s;
  for (const [dx, dy] of [[-0.4, -0.3], [0.35, -0.35], [0, 0.1], [-0.35, 0.4], [0.4, 0.35], [0, -0.6], [-0.85, 0], [0.85, 0.1]]) {
    ctx.beginPath(); ctx.arc(cx + dx * r, cy + dy * r, r * 0.16, 0.5, 5); ctx.stroke();
  }
}

function drawBike(s, ph) {
  // 後輪
  ctx.fillStyle = '#1d1d22'; ell(0, -30 * s, 6 * s, 30 * s);
  ctx.fillStyle = '#c4c9d0'; rrf(-3.5 * s, -62 * s, 7 * s, 30 * s, 3 * s);
  ctx.fillStyle = '#e53935'; ctx.fillRect(-4 * s, -50 * s, 8 * s, 6 * s);
  ctx.fillStyle = '#9aa0a8'; rrf(-17 * s, -68 * s, 34 * s, 6 * s, 2 * s);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(-2.5 * s, -100 * s, 5 * s, 36 * s);
  // ハンドルとお弁当袋
  ctx.strokeStyle = '#3a3a40'; ctx.lineWidth = 4 * s; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-36 * s, -108 * s); ctx.quadraticCurveTo(0, -116 * s, 36 * s, -108 * s); ctx.stroke();
  ctx.save(); ctx.translate(36 * s, -107 * s); ctx.rotate(Math.sin(ph) * 0.12);
  ctx.strokeStyle = '#c9a77a'; ctx.lineWidth = 2 * s; line(-4 * s, 0, -9 * s, 15 * s); line(2 * s, 0, 7 * s, 15 * s);
  ctx.fillStyle = '#f2e4c9'; rrf(-12 * s, 14 * s, 24 * s, 27 * s, 4 * s);
  ctx.fillStyle = '#d9483b'; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) circ((-7 + i * 7) * s, (19 + j * 8) * s, 1.6 * s);
  ctx.restore();
  // 足
  for (const side of [-1, 1]) {
    const o = Math.sin(ph + (side < 0 ? 0 : Math.PI));
    const hx = side * 9 * s, hyy = -102 * s, kx = side * 16 * s, ky = (-76 + o * 9) * s, fx = side * 13 * s, fy = (-46 + o * 13) * s;
    ctx.strokeStyle = '#3c5a8c'; ctx.lineWidth = 13 * s; line(hx, hyy, kx, ky);
    ctx.lineWidth = 10 * s; line(kx, ky, fx, fy);
    ctx.fillStyle = '#222'; ctx.fillRect(fx - 7 * s, fy + 6 * s, 14 * s, 3 * s);
    ctx.fillStyle = '#ee8fa3'; ell(fx, fy + 3 * s, 7 * s, 5 * s);
  }
  ctx.fillStyle = '#3a2a22'; ell(0, -101 * s, 12 * s, 5 * s);
  drawMomBack(s);
}

function drawMomBack(s, armsTo = 1) {
  // うで
  ctx.strokeStyle = '#f28ea4'; ctx.lineWidth = 11 * s; ctx.lineCap = 'round';
  for (const side of [-1, 1]) { ctx.beginPath(); ctx.moveTo(side * 22 * s, -152 * s); ctx.quadraticCurveTo(side * 38 * s, -132 * s, side * 35 * s * armsTo, -110 * s); ctx.stroke(); }
  ctx.fillStyle = '#f6d0b4'; circ(-36 * s * armsTo, -108 * s, 5 * s); circ(36 * s * armsTo, -108 * s, 5 * s);
  // パーカー
  ctx.fillStyle = '#f28ea4';
  ctx.beginPath(); ctx.moveTo(-21 * s, -100 * s); ctx.quadraticCurveTo(-31 * s, -135 * s, -25 * s, -160 * s);
  ctx.quadraticCurveTo(0, -172 * s, 25 * s, -160 * s); ctx.quadraticCurveTo(31 * s, -135 * s, 21 * s, -100 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e27891'; rrf(-22 * s, -108 * s, 44 * s, 8 * s, 4 * s);
  ctx.fillStyle = 'rgba(200,90,120,.25)';
  ctx.beginPath(); ctx.moveTo(14 * s, -102 * s); ctx.quadraticCurveTo(28 * s, -135 * s, 24 * s, -158 * s); ctx.quadraticCurveTo(31 * s, -135 * s, 21 * s, -100 * s); ctx.closePath(); ctx.fill();
  // リュック
  ctx.fillStyle = '#2b2b30'; rrf(-17 * s, -156 * s, 34 * s, 42 * s, 9 * s);
  ctx.fillStyle = '#3a3a42'; rrf(-17 * s, -156 * s, 34 * s, 15 * s, 8 * s);
  ctx.fillStyle = '#232327'; rrf(-11 * s, -132 * s, 22 * s, 14 * s, 5 * s);
  ctx.fillStyle = '#8a8a90'; ctx.fillRect(-3 * s, -144 * s, 6 * s, 5 * s);
  ctx.fillStyle = '#e27891'; ell(0, -160 * s, 15 * s, 6 * s);
  // 耳と髪
  ctx.fillStyle = '#f2c9a8'; ell(-21 * s, -177 * s, 3.5 * s, 5 * s); ell(21 * s, -177 * s, 3.5 * s, 5 * s);
  drawHair(0, -183 * s, 21 * s, s);
  ctx.fillStyle = '#8d5230'; circ(0, -208 * s, 10 * s);
  ctx.fillStyle = '#7a4424'; circ(-6 * s, -212 * s, 5 * s); circ(6 * s, -211 * s, 5 * s);
  ctx.fillStyle = '#fff'; ell(0, -200 * s, 9 * s, 3.5 * s);
}

function drawKei(s, ph, now) {
  ctx.fillStyle = '#222'; rrf(-50 * s, -18 * s, 20 * s, 18 * s, 4 * s); rrf(30 * s, -18 * s, 20 * s, 18 * s, 4 * s);
  ctx.fillStyle = '#f5a9be'; rrf(-58 * s, -96 * s, 116 * s, 82 * s, 16 * s);
  rrf(-50 * s, -150 * s, 100 * s, 64 * s, 18 * s);
  ctx.fillStyle = '#3a4a66'; rrf(-40 * s, -142 * s, 80 * s, 40 * s, 9 * s);
  ctx.save(); rr(-40 * s, -142 * s, 80 * s, 40 * s, 9 * s); ctx.clip();
  drawHair(-14 * s, -112 * s, 14 * s, s * 0.7); ctx.fillStyle = '#fff'; ell(-14 * s, -127 * s, 6 * s, 2.5 * s);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; polyf([10 * s, -142 * s, 26 * s, -142 * s, 0, -102 * s, -16 * s, -102 * s]);
  ctx.restore();
  ctx.fillStyle = '#e88aa3'; ctx.fillRect(-58 * s, -60 * s, 116 * s, 4 * s);
  ctx.fillStyle = '#e53935'; rrf(-55 * s, -88 * s, 12 * s, 22 * s, 3 * s); rrf(43 * s, -88 * s, 12 * s, 22 * s, 3 * s);
  ctx.fillStyle = '#fffbe6'; rrf(-17 * s, -52 * s, 34 * s, 16 * s, 2 * s);
  ctx.fillStyle = '#2a6a3a'; ctx.font = `900 ${9 * s}px "M PLUS Rounded 1c",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('月 55-55', 0, -44 * s);
  ctx.fillStyle = '#d8d8dc'; rrf(-60 * s, -30 * s, 120 * s, 12 * s, 5 * s);
  ctx.fillStyle = 'rgba(160,160,170,.6)';
  for (let i = 0; i < 3; i++) circ((-46 + Math.sin(now * 20 + i) * 3) * s, (-18 + i * 6) * s, (4 + i * 2 + Math.random() * 2) * s * G.e);
}

function drawTrain(s, ph, now) {
  ctx.fillStyle = '#555'; ctx.fillRect(-46 * s, -14 * s, 92 * s, 14 * s);
  ctx.fillStyle = '#f5f7fa';
  ctx.beginPath(); ctx.moveTo(-56 * s, -14 * s); ctx.lineTo(-56 * s, -120 * s); ctx.quadraticCurveTo(-56 * s, -170 * s, 0, -172 * s);
  ctx.quadraticCurveTo(56 * s, -170 * s, 56 * s, -120 * s); ctx.lineTo(56 * s, -14 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(28 * s, -150 * s, 28 * s, 136 * s);
  ctx.fillStyle = '#1f5fbf'; ctx.fillRect(-56 * s, -64 * s, 112 * s, 10 * s); ctx.fillStyle = '#5a8fe0'; ctx.fillRect(-56 * s, -52 * s, 112 * s, 3 * s);
  ctx.fillStyle = '#2a3550'; ell(0, -122 * s, 34 * s, 17 * s);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, -122 * s, 34 * s, 17 * s, 0, 0, TAU); ctx.clip();
  drawHair(-6 * s, -114 * s, 12 * s, s * 0.6); ctx.restore();
  ctx.fillStyle = '#ff5a4a'; ell(-40 * s, -84 * s, 7 * s, 4 * s); ell(40 * s, -84 * s, 7 * s, 4 * s);
  ctx.fillStyle = '#c9ced6'; ctx.fillRect(-56 * s, -24 * s, 112 * s, 10 * s);
}

function drawPlane(s, ph, now) {
  ctx.fillStyle = '#e8ecf2';
  polyf([-150 * s, -62 * s, 0, -84 * s, 150 * s, -62 * s, 150 * s, -56 * s, 0, -70 * s, -150 * s, -56 * s]);
  ctx.fillStyle = '#1f4fae'; ctx.fillRect(-152 * s, -66 * s, 6 * s, 12 * s); ctx.fillRect(146 * s, -66 * s, 6 * s, 12 * s);
  for (const x of [-62, 62]) { ctx.fillStyle = '#cfd6e0'; circ(x * s, -56 * s, 13 * s); ctx.fillStyle = '#3a4250'; circ(x * s, -56 * s, 8 * s); ctx.fillStyle = 'rgba(255,200,120,.5)'; circ(x * s, -56 * s, (4 + Math.random() * 3) * s); }
  ctx.fillStyle = '#fff'; polyf([-55 * s, -98 * s, 0, -108 * s, 55 * s, -98 * s, 55 * s, -94 * s, -55 * s, -94 * s]);
  ctx.fillStyle = '#f6f8fb'; circ(0, -82 * s, 32 * s);
  ctx.strokeStyle = '#cdd4de'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.arc(0, -82 * s, 32 * s, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#d8dde6'; circ(0, -82 * s, 12 * s);
  ctx.fillStyle = '#fff'; polyf([-6 * s, -110 * s, -3 * s, -178 * s, 3 * s, -178 * s, 6 * s, -110 * s]);
  ctx.fillStyle = '#1f4fae'; polyf([-4.5 * s, -150 * s, -3 * s, -178 * s, 3 * s, -178 * s, 4.5 * s, -150 * s]);
  ctx.fillStyle = '#ff4a4a'; circ(150 * s, -60 * s, 2.5 * s); ctx.fillStyle = '#4aff6a'; circ(-150 * s, -60 * s, 2.5 * s);
}

function drawRocket(s, ph, now) {
  const fl = 1 + G.e * 0.8;
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = ['rgba(255,120,40,.85)', 'rgba(255,200,60,.9)', 'rgba(255,255,220,.95)'][i];
    ell(0, (-6 + 14 * fl) * s, (16 - i * 4) * s, (30 - i * 8) * fl * s * (0.85 + Math.random() * 0.3));
  }
  ctx.fillStyle = '#7a8090'; polyf([-14 * s, -32 * s, 14 * s, -32 * s, 20 * s, -16 * s, -20 * s, -16 * s]);
  ctx.fillStyle = '#d93a2b'; polyf([-28 * s, -80 * s, -50 * s, -26 * s, -28 * s, -36 * s]); polyf([28 * s, -80 * s, 50 * s, -26 * s, 28 * s, -36 * s]);
  ctx.fillStyle = '#f7f7f4'; rrf(-28 * s, -170 * s, 56 * s, 140 * s, 10 * s);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(12 * s, -170 * s, 16 * s, 140 * s);
  ctx.fillStyle = '#222'; ctx.fillRect(-28 * s, -110 * s, 56 * s, 8 * s); ctx.fillRect(-28 * s, -66 * s, 56 * s, 5 * s);
  ctx.fillStyle = '#d93a2b'; polyf([-28 * s, -168 * s, 0, -222 * s, 28 * s, -168 * s]);
  ctx.fillStyle = '#1f4fae'; ctx.font = `900 ${10 * s}px "M PLUS Rounded 1c",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('MAMA', 0, -86 * s);
}

function drawJet(s, ph, now) {
  const ab = 1 + G.e;
  for (const x of [-12, 12]) {
    ctx.fillStyle = 'rgba(255,140,60,.8)'; ell(x * s, -40 * s, 9 * s * ab, 9 * s * ab);
    ctx.fillStyle = 'rgba(160,210,255,.95)'; ell(x * s, -40 * s, 5 * s * (0.8 + Math.random() * 0.4), 5 * s);
  }
  ctx.fillStyle = '#8d97a6'; polyf([-130 * s, -46 * s, -20 * s, -70 * s, 20 * s, -70 * s, 130 * s, -46 * s, 130 * s, -40 * s, -130 * s, -40 * s]);
  ctx.fillStyle = '#6f7a8a'; polyf([-60 * s, -60 * s, -20 * s, -62 * s, 20 * s, -62 * s, 60 * s, -60 * s, 60 * s, -56 * s, -60 * s, -56 * s]);
  ctx.fillStyle = '#a3adbb'; rrf(-28 * s, -78 * s, 56 * s, 44 * s, 14 * s);
  ctx.fillStyle = '#4a5260'; circ(-12 * s, -40 * s, 8 * s); circ(12 * s, -40 * s, 8 * s);
  ctx.fillStyle = '#8d97a6'; polyf([-22 * s, -74 * s, -40 * s, -138 * s, -32 * s, -140 * s, -12 * s, -76 * s]); polyf([22 * s, -74 * s, 40 * s, -138 * s, 32 * s, -140 * s, 12 * s, -76 * s]);
  ctx.fillStyle = '#d93a2b'; polyf([-38 * s, -128 * s, -40 * s, -138 * s, -32 * s, -140 * s, -30 * s, -128 * s]); polyf([38 * s, -128 * s, 40 * s, -138 * s, 32 * s, -140 * s, 30 * s, -128 * s]);
  ctx.fillStyle = '#5a7fb0'; ell(0, -86 * s, 14 * s, 12 * s);
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, -86 * s, 14 * s, 12 * s, 0, 0, TAU); ctx.clip(); drawHair(0, -84 * s, 10 * s, s * 0.5); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ell(-5 * s, -92 * s, 5 * s, 3 * s);
}

function rainbow() {
  const P = proj(G.px, 1), t = performance.now() / 1000;
  const cols = ['#ff5a5a', '#ffb347', '#fff36a', '#7dff7a', '#6ad0ff', '#b98aff'];
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  cols.forEach((c, i) => {
    ctx.strokeStyle = c; ctx.globalAlpha = 0.35; ctx.lineWidth = 9 * S;
    const off = (i - 2.5) * 9 * S;
    ctx.beginPath(); ctx.moveTo(P.x + off, P.y - 120 * S); ctx.quadraticCurveTo(P.x + off * 3 + Math.sin(t * 6 + i) * 8, (P.y + H) / 2, P.x + off * 8, H + 20); ctx.stroke();
  });
  ctx.restore();
}

// 光（オカン）：本人が光って飛んでいく
function drawLight(s, ph, now) {
  const y = -130 * s + Math.sin(now * 6) * 4 * s;
  const g = ctx.createRadialGradient(0, y, 4 * s, 0, y, 110 * s);
  g.addColorStop(0, 'rgba(255,255,230,1)'); g.addColorStop(0.3, 'rgba(255,220,120,.75)'); g.addColorStop(1, 'rgba(255,160,80,0)');
  ctx.fillStyle = g; circ(0, y, 110 * s);
  ctx.save(); ctx.translate(0, y + 120 * s); ctx.scale(0.8, 0.8);
  ctx.strokeStyle = '#f28ea4'; ctx.lineWidth = 11 * s; ctx.lineCap = 'round';
  line(-20 * s, -150 * s, -30 * s, -205 * s); line(20 * s, -150 * s, 30 * s, -205 * s);
  ctx.fillStyle = '#f6d0b4'; circ(-30 * s, -207 * s, 5 * s); circ(30 * s, -207 * s, 5 * s);
  ctx.fillStyle = '#f28ea4'; rrf(-22 * s, -165 * s, 44 * s, 60 * s, 16 * s);
  ctx.strokeStyle = '#3c5a8c'; ctx.lineWidth = 12 * s; line(-9 * s, -110 * s, -12 * s, -80 * s); line(9 * s, -110 * s, 12 * s, -80 * s);
  ctx.fillStyle = '#ee8fa3'; ell(-12 * s, -76 * s, 7 * s, 5 * s); ell(12 * s, -76 * s, 7 * s, 5 * s);
  drawHair(0, -180 * s, 24 * s, s);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < 6; i++) { const a = now * 3 + i; circ(Math.cos(a) * 60 * s, y + Math.sin(a * 1.3) * 50 * s, 2.5 * s); }
}

// ---------- ループ ----------
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode !== 'play' || !G) return;
  if (!paused) update(dt);
  if (mode === 'play' && G) { draw(); hud(); }
}
requestAnimationFrame(loop);

// ======================================================================
//  エンディング
// ======================================================================
let lastResult = null;
function showEnding() {
  const g = G, v = g.veh, t = g.time;
  const r = t / v.T;
  const timeScore = r <= 0.3 ? 2 : r <= 0.45 ? 1 : 0;
  const bentoScore = (g.temp >= 70 && g.shape >= 80) ? 2 : (g.temp >= 40 && g.shape >= 40) ? 1 : 0;
  const stars = Math.min(5, 1 + timeScore + bentoScore);
  let state;
  if (g.shape < 40) state = 'ぐちゃぐちゃ…';
  else if (g.temp >= 90) state = 'アツアツ！';
  else if (g.temp >= 70) state = g.shape >= 80 ? 'まだ温かい' : '温かいけど寄ってる';
  else if (g.temp >= 40) state = 'ほんのり温かい';
  else state = '冷めちゃった';
  const sonLine = g.shape < 40 ? '……ぐちゃぐちゃ<br>じゃん。ありがと' : g.temp < 40 ? '……冷めてるけど<br>ありがと' : '……<br>ありがと';

  // 記録
  save.plays++; save.used[v.id] = 1;
  const newBest = !save.best[v.id] || t < save.best[v.id];
  if (newBest) save.best[v.id] = t;
  const unlock = [];
  const ach = (id, cond) => { if (cond && !save.ach[id]) { save.ach[id] = 1; unlock.push(ACH.find(a => a[0] === id)[2]); } };
  ach('first', true); ach('five', save.plays >= 5); ach('hot', g.temp >= 90); ach('clean', g.hits === 0 && v.T > 10);
  ach('bike3', v.id === 'bike' && t <= 180); ach('karo3', g.karo >= 3); ach('star5', stars === 5);
  ach('all', VEH.every(x => save.used[x.id]));
  persist();
  lastResult = { v, t, stars };

  $('#rTime').textContent = fmtSec(t) + (newBest && save.plays > 1 ? '  🎉ベスト' : '');
  $('#rVeh').textContent = v.name;
  $('#rState').textContent = state;
  $('#rStars').innerHTML = '★'.repeat(stars) + `<span class="off">${'★'.repeat(5 - stars)}</span>`;
  $('#sonLine').innerHTML = sonLine;
  $('#result').hidden = true; $('#endBtns').hidden = true;
  show('ending');
  ['.eb1', '#sonLine'].forEach(sel => { const el = $(sel); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); });
  setTimeout(() => {
    $('#result').hidden = false; $('#result').classList.remove('fadein'); void $('#result').offsetWidth; $('#result').classList.add('fadein');
    $('#endBtns').hidden = false; sfx.star();
    unlock.forEach((n, i) => setTimeout(() => toast('🏆 実績解除：' + n), 600 + i * 2600));
  }, 2200);
}
$('#toTitle').onclick = () => { sfx.click(); G = null; show('title'); };
$('#again').onclick = () => { sfx.click(); buildList(); show('select'); };
$('#share').onclick = async () => {
  sfx.click();
  if (!lastResult) return;
  const { v, t, stars } = lastResult;
  const text = `${v.name}で月の高校までお弁当を届けた！ 到着時間 ${fmtSec(t)} 評価${'★'.repeat(stars)}${'☆'.repeat(5 - stars)} #ちょっと月まで`;
  const url = location.href.split('#')[0];
  try {
    if (navigator.share) { await navigator.share({ title: 'ちょっと月まで', text, url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + ' ' + url); toast('コピーしました！'); }
  catch (e) { toast('コピーできませんでした'); }
};
