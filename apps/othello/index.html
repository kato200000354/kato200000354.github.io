<!DOCTYPE html>
<!-- © kato200000354. 無断転載・複製・再配布を禁止します。 (kato200000354-protected) -->

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>オセロ</title>
<style>
:root{
  --bg:#0f1a14;--panel:#1a2a21;--line:#2f4a3a;--text:#eef5ef;--muted:#a9c2b1;
  --board:#1f8a4c;--board2:#1a7a43;--grid:#0d4a28;--accent:#ffd54f;--hint:rgba(255,255,255,.28);--last:#ff7043;
  --cell:min(11vw,62px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;padding:10px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:10px}
button{font-family:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:14px}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
header{width:100%;display:flex;align-items:center;gap:6px}
header h1{font-size:20px;margin:0;flex:1;letter-spacing:.08em}
header button{padding:6px 10px;font-size:13px}

.scores{width:100%;display:flex;gap:8px}
.score{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px;transition:border-color .2s,box-shadow .2s}
.score.turn{border-color:var(--accent);box-shadow:0 0 12px rgba(255,213,79,.35)}
.score .disc{width:26px;height:26px;flex:none}
.score .name{font-size:12px;color:var(--muted);flex:1;line-height:1.2}
.score .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
#status{width:100%;text-align:center;font-size:15px;min-height:22px;color:var(--muted)}
#status b{color:var(--text)}

#board{display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));
  gap:2px;padding:6px;background:var(--grid);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);position:relative;touch-action:manipulation}
.cell{background:var(--board);position:relative;display:flex;align-items:center;justify-content:center;border-radius:2px}
.cell:nth-child(odd){background:var(--board2)}
.cell.can{cursor:pointer}
.cell.can::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--hint)}
.cell.can:hover::after{background:rgba(255,255,255,.5)}
body.nohint .cell.can::after{display:none}
.cell.last::before{content:"";position:absolute;width:12%;height:12%;border-radius:50%;background:var(--last);z-index:3}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--grid);z-index:2;transform:translate(-50%,-50%)}

.disc{width:84%;height:84%;position:relative;transform-style:preserve-3d;transition:transform .35s ease}
.disc .f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.disc .b{background:radial-gradient(circle at 35% 30%,#555,#111 70%);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.disc .w{background:radial-gradient(circle at 35% 30%,#fff,#ccc 75%);box-shadow:0 2px 3px rgba(0,0,0,.4);transform:rotateY(180deg)}
.disc.white{transform:rotateY(180deg)}
.disc.pop{animation:pop .25s ease}
@keyframes pop{from{scale:.3;opacity:0}to{scale:1;opacity:1}}

.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-size:20px;text-align:center}
.row{display:flex;flex-direction:column;gap:6px}
.row label{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 6px}
.seg button.on{background:#2e6b45;border-color:var(--accent);color:#fff;font-weight:700}
.big{padding:12px;font-size:16px;font-weight:700;background:#2e8b57;border-color:#3fae6f}
.result{text-align:center;font-size:15px;line-height:1.7}
.result .big-num{font-size:32px;font-weight:800}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);padding:12px 22px;border-radius:12px;font-size:18px;font-weight:700;z-index:20;pointer-events:none;animation:fade 1.4s forwards}
@keyframes fade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>オセロ</h1>
    <button id="btnHint">ヒント:ON</button>
    <button id="btnMenu">メニュー</button>
  </header>

  <div class="scores">
    <div class="score" id="scB"><div class="disc"><div class="f b"></div><div class="f w"></div></div><div class="name" id="nmB">黒</div><div class="num" id="numB">2</div></div>
    <div class="score" id="scW"><div class="disc white"><div class="f b"></div><div class="f w"></div></div><div class="name" id="nmW">白</div><div class="num" id="numW">2</div></div>
  </div>
  <div id="status"></div>

  <div id="board"></div>

  <div class="controls">
    <button id="btnUndo">↶ まった</button>
    <button id="btnNew">はじめから</button>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="modal">
    <h2>オセロ</h2>
    <div class="row"><label>あいて</label>
      <div class="seg" id="segMode"><button data-v="cpu" class="on">コンピュータ</button><button data-v="pvp">ふたりで</button></div></div>
    <div class="row" id="rowLv"><label>つよさ</label>
      <div class="seg" id="segLv"><button data-v="1">よわい</button><button data-v="2" class="on">ふつう</button><button data-v="3">つよい</button></div></div>
    <div class="row" id="rowColor"><label>あなたの色</label>
      <div class="seg" id="segColor"><button data-v="1" class="on">● 黒（先手）</button><button data-v="2">○ 白（後手）</button></div></div>
    <button class="big" id="btnStart">スタート</button>
    <button id="btnClose" hidden>とじる</button>
  </div>
</div>

<div class="overlay" id="resultBox" hidden>
  <div class="modal">
    <h2 id="resTitle"></h2>
    <div class="result" id="resBody"></div>
    <button class="big" id="btnAgain">もう一回</button>
    <button id="btnResMenu">メニューへ</button>
    <button id="btnResBoard">盤面を見る</button>
  </div>
</div>
