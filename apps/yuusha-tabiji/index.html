<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ゆうしゃの旅路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: 4:3 の一枚画面。タッチ端末では画面の下（横持ちは左右）に十字キーとABボタン */
  --ground:#04060d; --panel:#10245a; --panel2:#081536; --line:#e9f0ff; --line2:#4a6ac0;
  --ink:#f5f7ff; --dim:#7f8cb0; --gold:#ffd24a; --hp:#46e070; --mp:#3fa2ff;
  --warn:#ffa040; --dead:#ff5a5a; --poison:#c890ff;
  --font:'DotGothic16','MS Gothic','Osaka-Mono',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#wrap{min-height:100%;display:grid;grid-template-areas:"screen" "bar";justify-content:center;align-content:center;justify-items:center;gap:10px;padding:10px 16px}
#screen{grid-area:screen;position:relative;width:min(calc(100vw - 32px),1100px,calc((100vh - 64px)*1.3077));width:min(calc(100vw - 32px),1100px,calc((100dvh - 64px)*1.3077));aspect-ratio:272/208;container-type:inline-size;overflow:hidden;background:#000;border-radius:6px;box-shadow:0 0 0 2px #1a2a55,0 12px 40px #000c;font-size:3.4cqw;line-height:1.45}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{position:absolute;inset:0}
#bar{grid-area:bar;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:13px}
#bar button{font-family:var(--font);background:#0c1a3e;color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer}
#bar button:focus-visible{outline:2px solid var(--gold)}
.keys b{color:var(--ink);font-weight:normal;border:1px solid #33416a;border-radius:4px;padding:0 4px;margin:0 2px}

/* windows */
.win{position:absolute;background:linear-gradient(180deg,#132a66f0,#0a1840f2);border:.42cqw solid var(--line);border-radius:1.3cqw;box-shadow:0 0 0 .3cqw #050b20,inset 0 0 0 .28cqw #2c4a9a;padding:1.1cqw 2cqw;color:var(--ink);overflow:hidden}
.wt{position:relative;margin:-.2cqw 0 .6cqw;padding:0 0 .5cqw 1.2em;border-bottom:.25cqw solid #3d5cae;color:var(--ink)}
.wt::before{content:'›';position:absolute;left:.15em;color:var(--gold)}
.menu .it{position:relative;padding-left:1.25em;display:flex;justify-content:space-between;gap:1em;white-space:nowrap;cursor:pointer}
.menu .it .l{overflow:hidden;text-overflow:ellipsis}
.menu .it .r{color:#dfe6ff;font-variant-numeric:tabular-nums}
.menu .it.sel::before{content:'▶';position:absolute;left:0;color:var(--gold);animation:blink .7s steps(2) infinite}
.menu .it.was::before{content:'▷';position:absolute;left:0;color:#9fb0e0}
.menu .it.dis{color:#6f7aa0}
.menu .more{text-align:center;font-size:.7em;color:var(--gold);line-height:1}
@keyframes blink{50%{opacity:.25}}
.msg{left:3%;top:66.5%;width:94%;height:31%;white-space:pre-wrap;padding:1.6cqw 3cqw;z-index:20}
.msg .arrow{position:absolute;left:50%;bottom:.4cqw;color:var(--gold);animation:blink .6s steps(2) infinite;font-size:.8em}
#bmsg{left:2%;top:66.5%;width:96%;height:31%;padding:1.4cqw 3cqw;z-index:15}
#blog div{white-space:pre-wrap}
.center{text-align:center}
.gold{color:var(--gold)}
.dimtxt{color:var(--dim)}
.small{font-size:.82em}

/* party status */
#status{position:absolute;left:1.5%;top:1.8%;width:97%;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2%;z-index:12}
.pbox{position:relative;background:linear-gradient(180deg,#132a66f2,#0a1840f5);border:.38cqw solid var(--line);border-radius:1.2cqw;box-shadow:0 0 0 .28cqw #050b20,inset 0 0 0 .26cqw #2c4a9a;padding:.7cqw 1.2cqw .9cqw;font-size:.74em;line-height:1.3;display:grid;grid-template-columns:auto 1fr;column-gap:1cqw;transition:transform .1s}
.pbox .face{grid-row:1/3;width:7.2cqw;height:7.2cqw;image-rendering:pixelated;background:#0a1430;border:.25cqw solid #6f88c8;border-radius:.8cqw}
.pbox .pn{white-space:nowrap;overflow:hidden}
.pbox .pn.long{font-size:.8em;letter-spacing:-.03em;line-height:1.62}
.pbox .plv{color:#cfd8f4}
.pbox .bar{grid-column:1/3;display:grid;grid-template-columns:1.6em 1fr 2.2em;align-items:center;gap:.6cqw}
.pbox .lb{color:#cfd8f4;font-size:.9em}
.pbox .v{text-align:right;font-variant-numeric:tabular-nums}
.pbox .g{display:block;height:1.1cqw;background:#050a1c;border:.2cqw solid #6377aa;border-radius:.4cqw;overflow:hidden}
.pbox .g b{display:block;height:100%;background:var(--hp)}
.pbox .g.mp b{background:var(--mp)}
.pbox.low .pn,.pbox.low .bar .v:first-of-type{color:var(--warn)}
.pbox.dead{border-color:#ff8a8a}
.pbox.dead .pn,.pbox.dead .v{color:var(--dead)}
.pbox.dead .face{filter:grayscale(1) brightness(.6)}
.pbox.act{transform:translateY(.8cqw);border-color:var(--gold)}
.pbox.hit{animation:hit .35s}
.ps{color:var(--poison);font-weight:normal;margin-right:.2em}
@keyframes hit{0%,100%{background:#0a1840}30%{background:#a01818}}

#coord{left:2.5%;top:3%;padding:.6cqw 2cqw;font-variant-numeric:tabular-nums}
#locname{left:2.5%;top:3%;padding:.8cqw 2.4cqw}

/* overlays */
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#screen.shake{animation:shake .32s}
#screen.shake2{animation:shake2 .45s}
@keyframes shake{20%{transform:translate(-1.2%,.6%)}40%{transform:translate(1.2%,-.6%)}60%{transform:translate(-.8%,0)}80%{transform:translate(.6%,.4%)}}
@keyframes shake2{10%{transform:translate(-2.4%,1%)}30%{transform:translate(2.4%,-1%)}50%{transform:translate(-1.8%,.6%)}70%{transform:translate(1.4%,-.4%)}90%{transform:translate(-.6%,.2%)}}

/* title & ending */
#title{position:absolute;left:0;right:0;top:12%;text-align:center;z-index:5;pointer-events:none}
#title .logo{font-size:2.9em;letter-spacing:.12em;color:#fff6d0;text-shadow:.4cqw .4cqw 0 #6a3a00,-.3cqw -.3cqw 0 #6a3a00,.3cqw -.3cqw 0 #6a3a00,-.3cqw .3cqw 0 #6a3a00,0 0 3cqw #ffb23a99}
#title .sub{margin-top:1.2cqw;font-size:.9em;letter-spacing:.3em;color:#cfe0ff;text-shadow:.3cqw .3cqw 0 #000}
#title .hint{position:absolute;left:0;right:0;top:52cqw;font-size:.7em;color:#cfd8f4;text-shadow:.25cqw .25cqw 0 #000}
#ending{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;background:radial-gradient(ellipse at 50% 40%,#1b2f6a,#03050c 75%);text-align:center}
#ending .big{font-size:2.6em;letter-spacing:.2em;color:#fff3c4;text-shadow:0 0 3cqw #ffbf4a}
#ending .lines{line-height:1.8}

/* touch pad */
#dpad,#ab{display:none}
@media (hover:none),(pointer:coarse){
  #wrap{grid-template-areas:"screen screen" "bar bar" "dpad ab";grid-template-columns:auto auto;justify-content:space-between;align-content:start;padding-top:max(10px,env(safe-area-inset-top))}
  #screen{width:min(calc(100vw - 32px),calc((100dvh - 250px)*1.3077))}
  #bar .keys{display:none}
  #dpad,#ab{display:block;touch-action:none}
  #dpad{grid-area:dpad;position:relative;width:150px;height:150px;justify-self:start}
  #dpad i{position:absolute;width:50px;height:50px;background:#16244e;border:2px solid #4a6ac0;display:flex;align-items:center;justify-content:center;color:#cfe0ff;font-style:normal;font-size:18px;border-radius:8px}
  #dpad i.on{background:#3a5cc0}
  #dpad .u{left:50px;top:0}#dpad .d{left:50px;top:100px}#dpad .l{left:0;top:50px}#dpad .r{left:100px;top:50px}
  #dpad .c{left:50px;top:50px;border-radius:0;background:#101a3a;border-color:#2a3c78}
  #ab{grid-area:ab;position:relative;width:150px;height:150px;justify-self:end}
  #ab button{position:absolute;width:66px;height:66px;border-radius:50%;font-family:var(--font);font-size:22px;color:#fff;border:3px solid #e9f0ff;touch-action:none}
  #ab .a{right:0;top:22px;background:#c0303a}
  #ab .b{left:0;top:70px;background:#30408a}
  #ab button:active{filter:brightness(1.4)}
}
@media ((hover:none),(pointer:coarse)) and (orientation:landscape){
  #wrap{grid-template-areas:"dpad screen ab" ". bar .";grid-template-columns:auto auto auto;align-content:center;justify-content:center;column-gap:18px}
  #screen{width:min(calc(100vw - 360px),calc((100dvh - 50px)*1.3077))}
  #dpad,#ab{align-self:center}
}
@media (prefers-reduced-motion:reduce){
  #screen.shake,#screen.shake2{animation:none}
  .menu .it.sel::before,.msg .arrow{animation:none}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="cv"></canvas>
    <div id="ui">
      <div id="title" hidden>
        <div class="logo">ゆうしゃの旅路</div>
        <div class="sub">～ ひかりを とりもどす 4にん ～</div>
        <div class="hint">Z・Enter / Aボタンで けってい</div>
      </div>
      <div id="status" hidden></div>
      <div id="coord" class="win" hidden></div>
      <div id="locname" class="win" hidden></div>
      <div id="bmsg" class="win" hidden><div id="blog"></div><div id="barrow" class="arrow" hidden style="position:absolute;left:50%;bottom:.4cqw;color:var(--gold);font-size:.8em">▼</div></div>
      <div id="msg" class="win msg" hidden><span id="msgText"></span><span id="msgArrow" class="arrow" hidden>▼</span></div>
      <div id="ending" hidden></div>
    </div>
    <div id="flash"></div>
    <div id="fade"></div>
  </div>
  <div id="bar">
    <button id="muteBtn" type="button">♪ 音：ON</button>
    <span class="keys">移動 <b>←↑↓→</b> けってい <b>Z</b><b>Enter</b> キャンセル・メニュー <b>X</b><b>Esc</b> 音 <b>M</b></span>
  </div>
  <div id="dpad"><i class="u">▲</i><i class="l">◀</i><i class="c"></i><i class="r">▶</i><i class="d">▼</i></div>
  <div id="ab"><button class="b" type="button">B</button><button class="a" type="button">A</button></div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const screenEl=$('#screen'), cv=$('#cv'), ctx=cv.getContext('2d'), uiEl=$('#ui');
const VW=17, VH=13, TS=16, CW=VW*TS, CH=VH*TS;
cv.width=CW; cv.height=CH; ctx.imageSmoothingEnabled=false;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const wpick=t=>{let s=t.reduce((a,e)=>a+e[1],0),r=Math.random()*s;for(const e of t){r-=e[1];if(r<0)return e}return t[t.length-1]};

/* ================= AUDIO ================= */
const AU={ctx:null,master:null,muted:false,want:null,noise:null};
try{AU.muted=localStorage.getItem('yt-mute')==='1'}catch(e){}
function audioInit(){
  if(AU.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  try{
    AU.ctx=new AC(); AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:0.22; AU.master.connect(AU.ctx.destination);
    const n=AU.ctx.sampleRate; AU.noise=AU.ctx.createBuffer(1,n,n); const d=AU.noise.getChannelData(0); for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    if(AU.want){const w=AU.want;AU.want=null;playBGM(w)}
  }catch(e){AU.ctx=null}
}
function setMute(m){AU.muted=m;try{localStorage.setItem('yt-mute',m?'1':'0')}catch(e){} if(AU.master)AU.master.gain.value=m?0:0.22; $('#muteBtn').textContent=m?'♪ 音：OFF':'♪ 音：ON'}
function osc(f,t,d,type,v,dest){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.008);g.gain.setValueAtTime(v,t+Math.max(0.012,d*0.6));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest||AU.master);o.start(t);o.stop(t+d+0.03);
}
function noiseHit(t,d,v,hp){
  const c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=AU.noise;f.type='highpass';f.frequency.value=hp||800;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+d+0.02);
}
const mf=n=>440*Math.pow(2,(n-69)/12);
function SE(name){
  if(!AU.ctx)return; const t=AU.ctx.currentTime+0.01;
  switch(name){
    case 'cur':osc(1320,t,0.035,'square',0.12);break;
    case 'ok':osc(880,t,0.045,'square',0.16);osc(1320,t+0.045,0.07,'square',0.16);break;
    case 'cancel':osc(660,t,0.045,'square',0.13);osc(440,t+0.045,0.06,'square',0.13);break;
    case 'buzz':osc(110,t,0.15,'square',0.2);break;
    case 'talk':osc(1100,t,0.015,'square',0.04);break;
    case 'attack':noiseHit(t,0.12,0.3,1800);break;
    case 'hit':noiseHit(t,0.16,0.5,500);osc(160,t,0.12,'square',0.2);break;
    case 'crit':noiseHit(t,0.35,0.7,300);osc(120,t,0.3,'sawtooth',0.3);break;
    case 'hurt':noiseHit(t,0.25,0.55,150);osc(90,t,0.2,'sawtooth',0.25);break;
    case 'miss':osc(300,t,0.07,'triangle',0.25);osc(200,t+0.07,0.08,'triangle',0.25);break;
    case 'kill':for(let i=0;i<6;i++)osc(700-i*90,t+i*0.035,0.05,'square',0.13);break;
    case 'spell':for(let i=0;i<9;i++)osc(400+i*130,t+i*0.028,0.05,'square',0.1);break;
    case 'fire':noiseHit(t,0.7,0.5,250);osc(70,t,0.6,'sawtooth',0.15);break;
    case 'heal':[72,76,79,84].forEach((n,i)=>osc(mf(n),t+i*0.07,0.13,'triangle',0.3));break;
    case 'enc':for(let i=0;i<12;i++)osc(i%2?700:250,t+i*0.04,0.035,'square',0.14);break;
    case 'chest':[72,79,84,91].forEach((n,i)=>osc(mf(n),t+i*0.07,0.1,'square',0.16));break;
    case 'stairs':[67,64,60,55].forEach((n,i)=>osc(mf(n),t+i*0.06,0.07,'square',0.15));break;
    case 'buy':osc(1568,t,0.06,'square',0.14);osc(2093,t+0.06,0.12,'square',0.14);break;
    case 'run':for(let i=0;i<7;i++)osc(300+i*90,t+i*0.03,0.04,'square',0.11);break;
    case 'bump':osc(70,t,0.06,'square',0.15);break;
    case 'open':osc(1046,t,0.04,'square',0.1);osc(1568,t+0.04,0.05,'square',0.1);break;
    case 'poison':osc(200,t,0.05,'square',0.12);osc(150,t+0.05,0.05,'square',0.12);break;
    case 'warp':for(let i=0;i<14;i++)osc(300+i*80,t+i*0.03,0.04,'triangle',0.2);break;
  }
}
const NOTE={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
function parseSeq(s){
  return s.replace(/\|/g,' ').trim().split(/\s+/).map(tok=>{
    const [n,l]=tok.split(':'),len=+l||1;
    const r=/^([a-g])([#b]?)(\d)$/.exec(n);
    if(!r)return {m:null,len};
    return {m:NOTE[r[1]]+(r[2]==='#'?1:r[2]==='b'?-1:0)+12*(+r[3]+1),len};
  });
}
// すべてオリジナル曲（8分音符=1）
const TRACKS={
  title:{tempo:112,v:[
    {t:'square',vol:0.14,s:'g4:2 c5:2 e5:2 g5:2 | f5:3 e5:1 d5:4 | e5:2 d5:2 c5:2 a4:2 | g4:6 -:2 | a4:2 c5:2 f5:2 a5:2 | g5:3 f5:1 e5:4 | f5:2 d5:2 b4:2 d5:2 | c5:6 -:2'},
    {t:'triangle',vol:0.32,s:'c3:4 e3:4 | f3:4 g3:4 | a2:4 f3:4 | g3:4 g2:4 | f3:4 a3:4 | c3:4 e3:4 | g2:4 g3:4 | c3:6 -:2'}]},
  field:{tempo:138,v:[
    {t:'square',vol:0.13,s:'e5:2 c5:1 d5:1 e5:2 g5:2 | f5:2 e5:1 d5:1 c5:4 | d5:2 b4:1 c5:1 d5:2 f5:2 | e5:6 -:2 | a5:2 g5:1 f5:1 e5:2 c5:2 | f5:2 a5:1 g5:1 f5:2 d5:2 | e5:2 d5:1 c5:1 b4:2 d5:2 | c5:6 -:2'},
    {t:'triangle',vol:0.3,s:'c3:2 g3:2 e3:2 g3:2 | f3:2 a3:2 c3:2 g3:2 | g3:2 b3:2 g3:2 d3:2 | c3:2 g3:2 c4:2 g3:2 | a2:2 e3:2 a3:2 e3:2 | d3:2 a3:2 f3:2 a3:2 | g2:2 d3:2 g3:2 b3:2 | c3:2 g3:2 c3:4'}]},
  town:{tempo:100,v:[
    {t:'square',vol:0.12,s:'c5:2 a4:1 bb4:1 c5:2 | d5:2 c5:2 a4:2 | bb4:2 g4:1 a4:1 bb4:2 | a4:4 -:2 | c5:2 a4:1 bb4:1 c5:2 | f5:2 e5:2 d5:2 | c5:2 bb4:2 g4:2 | f4:4 -:2'},
    {t:'triangle',vol:0.3,s:'f3:2 a3:2 c4:2 | bb2:2 d3:2 f3:2 | c3:2 e3:2 g3:2 | f3:2 a3:2 c4:2 | f3:2 a3:2 c4:2 | bb2:2 d3:2 f3:2 | c3:2 e3:2 bb3:2 | f3:2 c3:2 f2:2'}]},
  battle:{tempo:176,v:[
    {t:'square',vol:0.12,s:'a4:1 c5:1 e5:1 a5:1 g5:1 e5:1 c5:1 e5:1 | f5:2 e5:1 d5:1 e5:4 | g4:1 b4:1 d5:1 g5:1 f5:1 d5:1 b4:1 d5:1 | e5:2 d5:1 c5:1 b4:4 | a4:1 c5:1 e5:1 a5:1 g5:1 e5:1 c5:1 e5:1 | f5:2 a5:2 g5:2 f5:2 | e5:2 c5:2 b4:2 g#4:2 | a4:6 -:2'},
    {t:'triangle',vol:0.3,s:'a2:1 a3:1 a2:1 a3:1 a2:1 a3:1 a2:1 a3:1 | f2:1 f3:1 f2:1 f3:1 f2:1 f3:1 f2:1 f3:1 | g2:1 g3:1 g2:1 g3:1 g2:1 g3:1 g2:1 g3:1 | e2:1 e3:1 e2:1 e3:1 e2:1 e3:1 e2:1 e3:1 | a2:1 a3:1 a2:1 a3:1 a2:1 a3:1 a2:1 a3:1 | d3:1 d4:1 d3:1 d4:1 d3:1 d4:1 d3:1 d4:1 | e2:1 e3:1 e2:1 e3:1 e2:1 e3:1 e2:1 e3:1 | a2:1 a3:1 a2:1 a3:1 a2:2 -:2'}]},

const BGM={name:null,bus:null,timer:null,voices:null};
function playBGM(name){
  if(!AU.ctx){AU.want=name;return}
  if(BGM.name===name)return;
  stopBGM(); BGM.name=name; const tr=TRACKS[name]; if(!tr)return;
  const bus=AU.ctx.createGain(); bus.gain.value=1; bus.connect(AU.master); BGM.bus=bus;
  const spu=60/tr.tempo/2, t0=AU.ctx.currentTime+0.08;
  BGM.voices=tr.v.map(v=>({ev:parseSeq(v.s),i:0,next:t0,type:v.t,vol:v.vol}));
  const tick=()=>{
    const now=AU.ctx.currentTime;
    for(const v of BGM.voices){
      if(v.next<now-0.1)v.next=now+0.05;
      while(v.next<now+0.3){const e=v.ev[v.i],d=e.len*spu; if(e.m!=null)osc(mf(e.m),v.next,d*0.9,v.type,v.vol,bus); v.next+=d; v.i=(v.i+1)%v.ev.length}
    }
  };
  tick(); BGM.timer=setInterval(tick,60);
}
function stopBGM(){
  if(BGM.timer)clearInterval(BGM.timer); BGM.timer=null;
  if(BGM.bus){const b=BGM.bus;try{b.gain.setTargetAtTime(0,AU.ctx.currentTime,0.04)}catch(e){} setTimeout(()=>{try{b.disconnect()}catch(e){}},400)}
  BGM.bus=null; BGM.name=null; AU.want=null;
}
async function jingle(name){
  if(!AU.ctx){await sleep(250);return}
  stopBGM(); const tr=JINGLES[name], spu=60/tr.tempo/2, t0=AU.ctx.currentTime+0.05; let total=0;
  tr.v.forEach(v=>{let t=t0;parseSeq(v.s).forEach(e=>{const d=e.len*spu;if(e.m!=null)osc(mf(e.m),t,d*0.95,v.t,v.vol);t+=d});total=Math.max(total,t-t0)});
  await sleep(total*1000+120);
}

    if(!n.wander||busy)continue;

function applyEffect(kind,t,pow,stat){
  switch(kind){
    case 'heal':{if(!alive(t))return 'しかし なにも おこらなかった！';const b=t.hp;t.hp=Math.min(mhp(t),t.hp+rnd(pow[0],pow[1]));return t.hp>=mhp(t)?`${t.name}の キズが かいふくした！`:`${t.name}の HPが ${t.hp-b} かいふくした！`}
    case 'mp':{if(!alive(t))return 'しかし なにも おこらなかった！';const b=t.mp;t.mp=Math.min(mmp(t),t.mp+rnd(pow[0],pow[1]));return `${t.name}の MPが ${t.mp-b} かいふくした！`}
    case 'cure':if(!alive(t)||!t.poison)return 'しかし なにも おこらなかった！';t.poison=false;return `${t.name}の どくが きえた！`;
    case 'revive':if(alive(t))return 'しかし なにも おこらなかった！';t.hp=mhp(t);t.poison=false;return `なんと ${t.name}が いきかえった！`;
    case 'revive50':if(alive(t))return 'しかし なにも おこらなかった！';if(Math.random()<0.5){t.hp=Math.ceil(mhp(t)/2);t.poison=false;return `なんと ${t.name}が いきかえった！`}return `しかし ${t.name}は いきかえらなかった……`;
    case 'seed':{const n=stat==='hp'?rnd(3,6):rnd(1,3);t.seed[stat]=(t.seed[stat]||0)+n;if(stat==='hp')t.hp=Math.min(mhp(t),t.hp+n);return `${t.name}の ${{hp:'さいだいHP',str:'ちから',vit:'みのまもり'}[stat]}が ${n} あがった！`}
  }
  return 'しかし なにも おこらなかった！';
}
async function menuSpell(){
  let ci=0;
  for(;;){
    const mi=await chooseMember('だれが？',ci);if(mi<0)return;ci=mi;
    const m=G.party[mi],list=learned(m);
    if(!alive(m)){await say(`${m.name}は しんでいる。`);closeMsg();continue}
    if(!list.length){await say(`${m.name}は じゅもんを おぼえていない。`);closeMsg();continue}
    const desc=openWin(pos(31,76,67,21),'','small');
    const r=await pickMenu({pos:pos(31,26,40),title:'じゅもん',rows:7,items:list.map(s=>({label:SPELLS[s].name,right:SPELLS[s].mp,disabled:!SPELLS[s].field})),onMove:i=>desc.set(`${esc(SPELLS[list[i]].desc)}<br><span class="dimtxt">消費MP ${SPELLS[list[i]].mp}　のこり ${m.mp}</span>`)});
    desc.close();if(r<0)continue;
    const sid=list[r],sp=SPELLS[sid];
    if(m.mp<sp.mp){await say('MPが たりない！');closeMsg();continue}
    if(sp.kind==='warp'){
      if(G.map==='cave'){m.mp-=sp.mp;await say(`${m.name}は ルーラを となえた！`);shake();await say('てんじょうに あたまを ぶつけた！');closeMsg();renderStatus();continue}
      const ts=G.visited.filter(t=>TOWNS[t]);const w=await pickMenu({pos:pos(60,26,38),title:'どこへ？',items:ts.map(t=>TOWNS[t].name)});if(w<0)continue;
      m.mp-=sp.mp;await say(`${m.name}は ルーラを となえた！`);closeMsg();return {close:true,warp:ts[w]};
    }
    let targets;
    if(sp.tgt==='allies')targets=G.party;else{const t=await chooseTarget('だれに？');if(t<0)continue;targets=[G.party[t]]}
    m.mp-=sp.mp;SE('heal');renderStatus();
    const res=[];
    for(const t of targets){const kind=sp.kind==='revive'?'revive50':sp.kind;if(sp.tgt==='allies'&&!alive(t))continue;res.push(applyEffect(kind,t,sp.pow))}
    renderStatus();await say(`${m.name}は ${sp.name}を となえた！`+(res.length?'\n'+res.slice(0,2).join('\n'):''));
    for(let i=2;i<res.length;i+=3)await say(res.slice(i,i+3).join('\n'));
    closeMsg();
  }
}

function eqWinHtml(m,preview){
  const a=atkOf(m),d=defOf(m);let pa='',pd='';
  if(preview){const s=preview.slot,old=m.eq[s];m.eq[s]=preview.id;const na=atkOf(m),nd=defOf(m);m.eq[s]=old;pa=` → <span class="${na>a?'gold':''}">${na}</span>`;pd=` → <span class="${nd>d?'gold':''}">${nd}</span>`}
  return `<div style="display:flex;gap:2cqw;align-items:center"><img src="${FACE[m.cls]}" style="width:9cqw;height:9cqw;image-rendering:pixelated;border:.25cqw solid #6f88c8;border-radius:.8cqw;background:#0a1430" alt=""><div>${m.name}<br>Lv ${m.lv}</div></div><div style="margin-top:1cqw">こうげき力 ${a}${pa}<br>しゅび力　 ${d}${pd}</div>`;
}

        const desc=openWin(pos(3,66.5,94,31),'','small');desc.el.style.zIndex=21;
        const r=await pickMenu({pos:pos(3,3,66),title:'しなもの',rows:8,cur,items:list.map(id=>({label:ITEMS[id].name,right:ITEMS[id].price+'G'})),

async function inn(price){

  if(r!==0){await say('では また どうぞ。');closeMsg();gw.close();return}
  if(G.gold<total){SE('buzz');await say('おや、おかねが たりないようですね。');closeMsg();gw.close();return}
  G.gold-=total;gw.set(goldHtml());await say('では ごゆっくり おやすみください。');closeMsg();
  await fadeOut();const bg=BGM.name;await jingle('inn');

  await say('では いってらっしゃいませ。');closeMsg();gw.close();
}

const BG={};
function makeBg(kind){
  if(BG[kind])return BG[kind];
  const c=cnv(CW,CH),x=c.getContext('2d');
  if(kind==='cave'||kind==='boss'){
    const top=kind==='boss'?['#14051e','#2a0a3a','#3a1050','#4a1560']:['#120d0a','#1e1712','#2a2018','#362a1e'];
    top.forEach((col,i)=>px(x,0,i*25,col,CW,25));
    const r=srand(kind==='boss'?99:42);
    for(let i=0;i<26;i++){const X=Math.floor(r()*CW),h=10+Math.floor(r()*40);x.fillStyle=kind==='boss'?'#1a0828':'#0e0a08';x.beginPath();x.moveTo(X-8,0);x.lineTo(X+8,0);x.lineTo(X,h);x.fill()}
    px(x,0,100,kind==='boss'?'#2a0e3a':'#3e3024',CW,108);
    for(let y=100;y<CH;y+=6)px(x,0,y,kind==='boss'?'#34124a':'#4a3a2a',CW,2);
    if(kind==='boss'){const g=x.createRadialGradient(CW/2,95,4,CW/2,95,120);g.addColorStop(0,'#ff406088');g.addColorStop(1,'#ff406000');x.fillStyle=g;x.fillRect(0,0,CW,CH)}
  }else{
    const sky=['#3c7ee0','#4a8ee8','#5c9ef0','#74b0f4','#90c4f8','#acd6fa'];
    sky.forEach((col,i)=>px(x,0,i*16,col,CW,16));
    const r=srand(kind==='mount'?7:3);
    for(let i=0;i<5;i++){const X=r()*CW,Y=20+r()*40;disc(x,X,Y,6,'#ffffff');disc(x,X+7,Y+1,5,'#ffffff');disc(x,X-7,Y+2,4,'#f0f6ff')}
    const mcol=kind==='mount'?['#7a6a5a','#5a4a3e']:kind==='desert'?['#c8a878','#a88a60']:['#6a88b8','#5674a4'];
    for(let i=0;i<7;i++){const X=i*45-10+r()*20,h=22+r()*20;x.fillStyle=mcol[i%2];x.beginPath();x.moveTo(X-40,96);x.lineTo(X,96-h);x.lineTo(X+40,96);x.fill()}
    const gc=kind==='desert'?['#e0c88a','#d4ba7a']:kind==='mount'?['#5a9a44','#4e8a3a']:['#58b048','#4ca040'];
    for(let y=96,i=0;y<CH;y+=4+i,i++)px(x,0,y,gc[i%2],CW,4+i);
    if(kind!=='desert')for(let i=0;i<40;i++){const X=Math.floor(r()*CW),Y=100+Math.floor(r()*100);px(x,X,Y,'#3a8a30',1,2);px(x,X+1,Y+1,'#3a8a30',1,1)}
  }
  BG[kind]=c;return c;
}
function makeGroup(z){
  const t=ZONES[z],n=z===1?rnd(1,3):rnd(1,4),first=wpick(t)[0],out=[first];
  for(let i=1;i<n;i++)out.push(Math.random()<0.55?first:wpick(t)[0]);
  let metals=0;return out.filter(id=>id!=='metal'||++metals<=2);
}

async function battle(ids,opt){
  opt=opt||{};mode='battle';coordEl.hidden=true;showLoc(null);
  SE('enc');stopBGM();await flash('#fff',3,55);
  B={enemies:ids.map(id=>{const d=MON[id],hp=d.nohpvar?d.hp:Math.round(d.hp*(0.9+Math.random()*0.2));return {id,d,name:d.name,hp,mhp:hp,atk:d.atk,def:d.def,agi:d.agi,alive:true,fled:false,blink:0,die:0,heals:0}}),bg:makeBg(opt.bg||'field'),boss:!!opt.boss,cursor:-1,turn:0,fleeTry:0};
  enemyLabel();
  let tot=B.enemies.reduce((a,e)=>a+16*e.d.sc,0)+(B.enemies.length-1)*8,X=(CW-tot)/2;
  B.enemies.forEach(e=>{const w=16*e.d.sc;e.x=Math.round(X);e.y=134-w;X+=w+8});
  renderStatus();statusEl.hidden=false;blogClear();bmsgEl.hidden=false;
  playBGM(opt.boss?'boss':'battle');
  const kinds=new Set(ids);
  await blog(opt.boss?'まおう ヴォルガが おそいかかってきた！':kinds.size===1?(ids.length>1?`${B.enemies[0].name}たちが あらわれた！`:`${B.enemies[0].name}が あらわれた！`):'まものの むれが あらわれた！',{wait:true});
  let result=null;
  while(!result){
    B.turn++;
    const cmd=await inputCommands();
    blogClear();bmsgEl.hidden=false;
    const queue=[];
    if(cmd.flee){
      await blog(`${G.party[0].name}たちは にげだした！`);
      const pa=G.party.filter(alive).reduce((a,m)=>a+agiOf(m),0)/G.party.filter(alive).length;
      const ea=aliveEnemies().reduce((a,e)=>a+e.agi,0)/aliveEnemies().length;
      const ch=Math.min(0.92,Math.max(0.3,pa/(pa+ea)+0.1+B.fleeTry*0.12));B.fleeTry++;
      if(B.boss){await blog('しかし まわりこまれてしまった！')}
      else if(Math.random()<ch){SE('run');await sleep(300);result='flee';break}
      else await blog('しかし まわりこまれてしまった！');
    }else cmd.acts.forEach(a=>queue.push({p:a,spd:agiOf(G.party[a.who])*(0.55+Math.random()*0.45)}));
    B.enemies.forEach(e=>{if(e.alive)for(let i=0;i<(e.d.twice?2:1);i++)queue.push({e,spd:e.agi*(0.55+Math.random()*0.45)})});
    queue.sort((a,b)=>b.spd-a.spd);
    for(const q of queue){
      if(!aliveEnemies().length||!G.party.some(alive))break;
      blogClear();
      if(q.p)await partyAct(q.p);else await enemyAct(q.e);
      renderStatus();
    }
    if(!aliveEnemies().length){result='win';break}
    if(!G.party.some(alive)){result='lose';break}
    for(const m of G.party)if(alive(m)&&m.poison){const d=Math.max(1,Math.floor(mhp(m)/12));m.hp=Math.max(0,m.hp-d);SE('poison');renderStatus();await blog(`${m.name}は どくの ダメージを ${d} うけた！`);if(!alive(m)){m.poison=false;await blog(`${m.name}は しんでしまった！`)}}
    if(!G.party.some(alive)){result='lose';break}
  }
  B.cursor=-1;
  if(result==='win')await victory();
  if(result==='lose'){await gameOver();return 'lose'}
  for(const m of G.party){delete m.charge;delete m.sukara}
  bmsgEl.hidden=true;blogClear();statusEl.hidden=true;
  if(!(opt.boss&&result==='win')){mode='field';playBGM(MAPS[G.map].bgm);updateCoord()}
  B=null;return result;
}
async function inputCommands(){
  const order=G.party.map((m,i)=>i).filter(i=>alive(G.party[i]));
  const acts=[];let k=0;
  const ew=openWin(pos(34,66.5,64,31),groupText());
  bmsgEl.hidden=true;
  while(k<order.length){
    const mi=order[k],m=G.party[mi];renderStatus(mi);
    const r=await chooseCmd(m,mi,ew);
    if(r==='back'){if(k>0)k--;continue}
    if(r.flee){ew.close();renderStatus();return {flee:true}}
    r.who=mi;acts[k]=r;k++;
  }
  ew.close();renderStatus();return {acts:acts.slice(0,order.length)};
}
async function chooseCmd(m,mi,ew){
  const M=openMenu({pos:pos(2,66.5,30,31),title:m.name,items:['たたかう','じゅもん','どうぐ','にげる'],cancel:true});
  try{
    for(;;){
      ew.set(groupText());
      const c=await M.choose();
      if(c<0)return 'back';
      if(c===0){const t=await chooseEnemy();if(t<0)continue;return {type:'attack',target:t}}
      if(c===3)return {flee:true};
      if(c===1){
        const list=learned(m);if(!list.length){SE('buzz');continue}
        const desc=openWin(pos(34,30,64,14),'','small');
        const r=await pickMenu({pos:pos(34,46,40),title:'じゅもん',rows:5,items:list.map(s=>({label:SPELLS[s].name,right:SPELLS[s].mp,disabled:!!SPELLS[s].nobattle||m.mp<SPELLS[s].mp})),onMove:i=>desc.set(`${esc(SPELLS[list[i]].desc)}　<span class="dimtxt">MP ${SPELLS[list[i]].mp}/${m.mp}</span>`)});
        desc.close();if(r<0)continue;
        const sid=list[r],sp=SPELLS[sid];
        if(sp.tgt==='enemy'){const t=await chooseEnemy();if(t<0)continue;return {type:'spell',spell:sid,target:t}}
        if(sp.tgt==='ally'){const t=await pickMenu({pos:pos(34,46,40),title:'だれに？',items:partyPicker()});if(t<0)continue;return {type:'spell',spell:sid,target:t}}
        return {type:'spell',spell:sid};
      }
      if(c===2){
        const usable=G.bag.filter(b=>{const it=ITEMS[b.id];return !it.slot&&!it.nobattle});
        if(!usable.length){SE('buzz');continue}
        const desc=openWin(pos(34,30,64,14),'','small');
        const r=await pickMenu({pos:pos(34,46,46),title:'どうぐ',rows:5,items:usable.map(b=>({label:ITEMS[b.id].name,right:'×'+b.n})),onMove:i=>desc.set(esc(ITEMS[usable[i].id].desc))});
        desc.close();if(r<0)continue;
        const id=usable[r].id;
        if(ITEMS[id].eff==='fun')return {type:'item',item:id};
        const t=await pickMenu({pos:pos(34,46,40),title:'だれに？',items:partyPicker()});if(t<0)continue;
        return {type:'item',item:id,target:t};
      }
    }
  }finally{M.close()}
}

function dmgCalc(a,d){const base=(a-d/2)/2;if(base<1)return Math.random()<0.5?0:1;return Math.max(1,Math.floor(base*(0.875+Math.random()*0.25)))}
function retarget(i){const e=B.enemies[i];if(e&&e.alive)return e;const al=aliveEnemies();return al.length?pickOne(al):null}
async function hitEnemy(e,dmg){
  if(dmg<=0){SE('miss');await blog(`ミス！　${e.label}に ダメージを あたえられない！`);return}
  e.hp-=dmg;SE('hit');e.blink=performance.now()+380;

async function partyAct(a){
  const m=G.party[a.who];if(!alive(m))return;
  if(a.type==='attack'){
    const e=retarget(a.target);if(!e)return;
    await blog(`${m.name}の こうげき！`);SE('attack');
    let atk=atkOf(m);if(m.charge){atk=Math.floor(atk*2.2);m.charge=false}
    if(Math.random()<1/24){SE('miss');await blog(`ミス！　${e.label}に ダメージを あたえられない！`);return}
    if(Math.random()<1/32){SE('crit');shake(true);await flash('#fff',1,50);await blog('かいしんの いちげき！！');await hitEnemy(e,e.d.immune?rnd(1,3):Math.floor(atk*(0.95+Math.random()*0.1)));return}
    let d=dmgCalc(atk,e.def);if(e.d.immune)d=Math.random()<0.4?1:0;
    await hitEnemy(e,d);return;
  }
  if(a.type==='spell'){
    const sp=SPELLS[a.spell];
    if(m.mp<sp.mp){await blog(`${m.name}は ${sp.name}を となえようとした！`);await blog('しかし MPが たりない！');return}
    m.mp-=sp.mp;renderStatus();
    await blog(sp.verb?sp.verb.replace('%',m.name):`${m.name}は ${sp.name}を となえた！`);
    if(sp.kind==='dmg'){
      SE(sp.name==='メラ'||sp.name==='メラミ'?'fire':'spell');await flash(sp.fx,1,70);
      const ts=sp.tgt==='enemies'?aliveEnemies():[retarget(a.target)].filter(Boolean);
      for(const e of ts){if(!e.alive)continue;if(e.d.immune){SE('miss');await blog(`しかし ${e.label}には きかなかった！`);continue}await hitEnemy(e,rnd(sp.pow[0],sp.pow[1]))}
      return;
    }
    if(sp.kind==='charge'){m.charge=true;SE('spell');await blog('つぎの こうげきの いりょくが あがった！');return}
    if(sp.kind==='buff'){const t=G.party[a.target];SE('spell');if(!alive(t)){await blog('しかし なにも おこらなかった！');return}t.sukara=true;await blog(`${t.name}の しゅび力が あがった！`);return}
    SE('heal');
    const ts=sp.tgt==='allies'?G.party.filter(alive):[G.party[a.target]];
    for(const t of ts){renderStatus();await blog(applyEffect(sp.kind==='revive'?'revive50':sp.kind,t,sp.pow))}
    renderStatus();return;
  }
  if(a.type==='item'){
    const it=ITEMS[a.item];
    if(!G.bag.find(b=>b.id===a.item)){await blog(`${m.name}は どうぐを さがしたが みつからなかった！`);return}
    removeItem(a.item);await blog(`${m.name}は ${it.name}を つかった！`);
    if(it.eff==='fun'){
      if(!B.boss&&Math.random()<0.35){SE('run');await blog('まものたちは あまりの においに にげだした！');aliveEnemies().forEach(e=>{e.alive=false;e.fled=true;e.die=performance.now()});return}
      await blog('しかし なにも おこらなかった……');return;
    }
    SE(it.eff==='seed'?'chest':'heal');await blog(applyEffect(it.eff,G.party[a.target],it.pow,it.stat));renderStatus();
  }
}

async function enemyAct(e){
  if(!e.alive)return;
  let act=wpick(e.d.acts||[['attack',1]]);
  if(act[0]==='heal'){const t=aliveEnemies().filter(x=>x.hp<x.mhp*0.6);if(!t.length)act=['attack',1];else{const x=pickOne(t);await blog(`${e.label}は ホイミを となえた！`);SE('heal');x.hp=Math.min(x.mhp,x.hp+rnd(act[2],act[3]));await blog(`${x.label}の キズが かいふくした！`);return}}
  if(act[0]==='bheal'){if(e.hp>e.mhp*0.35||e.heals>=2)act=['attack',1];else{e.heals++;await blog(`${e.label}は ベホイミを となえた！`);SE('heal');await flash('#80ff80',1,80);e.hp=Math.min(e.mhp,e.hp+rnd(act[2],act[3]));await blog(`${e.label}の キズが かいふくした！`);return}}
  const t=pickTarget();if(!t)return;
  const def=m=>Math.floor(defOf(m)*(m.sukara?1.6:1));
  switch(act[0]){
    case 'attack':case 'strong':case 'poison':{
      if(act[0]==='strong')await blog(`${e.label}は おもいきり なぐりかかってきた！`);
      else if(act[0]==='poison')await blog(`${e.label}は ${t.name}に かみついてきた！`);
      else await blog(`${e.label}の こうげき！`);
      if(Math.random()<1/16){SE('miss');await blog(`しかし ${t.name}は ひらりと みをかわした！`);return}
      let d=dmgCalc(act[0]==='strong'?e.atk*1.5:e.atk,def(t));
      await hurt(t,d);
      if(act[0]==='poison'&&alive(t)&&!t.poison&&Math.random()<0.45){t.poison=true;SE('poison');renderStatus();await blog(`${t.name}は どくに おかされた！`)}
      return;
    }
    case 'mera':await blog(`${e.label}は メラを となえた！`);SE('fire');await flash('#ff8030',1,60);await hurt(t,rnd(act[2],act[3]));return;
    case 'gira':return groupHit(e,act[2],act[3],`${e.label}は ギラを となえた！`,'spell','#ffd040');
    case 'io':return groupHit(e,act[2],act[3],`${e.label}は イオを となえた！`,'spell','#ffffff');
    case 'fire':return groupHit(e,act[2],act[3],`${e.label}は はげしい ほのおを はいた！`,'fire','#ff6020');
    case 'thunder':return groupHit(e,act[2],act[3],`${e.label}は やみの いかずちを よびおこした！`,'crit','#c080ff');
    case 'roar':SE('hurt');shake(true);await blog(`${e.label}は おそろしい おたけびを あげた！`);await blog('ゆうしゃたちは すくみあがった……');return;
    case 'flee':await blog(`${e.label}は にげだした！`);SE('run');e.alive=false;e.fled=true;e.die=performance.now();return;
  }
}
function gainExp(m,e){
  const msgs=[];m.exp+=e;
  while(m.lv<MAXLV&&m.exp>=need(m.lv+1)){
    const before={hp:mhp(m),mp:mmp(m),str:stat(m,'str'),vit:stat(m,'vit'),agi:stat(m,'agi')},sp0=learned(m);
    m.lv++;const dh=mhp(m)-before.hp,dm=mmp(m)-before.mp;m.hp+=dh;m.mp+=dm;
    let s=`${m.name}は レベル ${m.lv}に あがった！\nHP+${dh}　MP+${dm}　ちから+${stat(m,'str')-before.str}　みのまもり+${stat(m,'vit')-before.vit}　すばやさ+${stat(m,'agi')-before.agi}`;
    msgs.push(s);
    learned(m).filter(x=>!sp0.includes(x)).forEach(x=>msgs.push(`${m.name}は ${SPELLS[x].name}を おぼえた！`));
  }
  return msgs;
}

function syncPos(){if(G){G.x=P.x;G.y=P.y;G.dir=P.dir}}

/* ================= DRAW ================= */
function drawChar(spr,rx,ry,camX,camY,t,phase){
  const fr=Math.floor(t*3.2+(phase||0))%2,x=Math.round(rx*TS-camX),y=Math.round(ry*TS-camY)-2;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(x+3,y+15,10,2);
  if(fr){ctx.save();ctx.translate(x+TS,y);ctx.scale(-1,1);ctx.drawImage(spr,0,0);ctx.restore()}else ctx.drawImage(spr,x,y);
}
function drawMap(def,gr,camX,camY,t){
  const f=Math.floor(t*1.6)%2,x0=Math.floor(camX/TS),y0=Math.floor(camY/TS);
  for(let ty=y0;ty<=y0+VH+1;ty++)for(let tx=x0;tx<=x0+VW+1;tx++){
    const ch=(tx<0||ty<0||tx>=gr.w||ty>=gr.h)?def.fill:gr.g[ty][tx];
    ctx.drawImage(tileImg(def,ch,f),tx*TS-camX,ty*TS-camY);
  }
}
function drawField(t){
  const def=MAPS[G.map],e=P.moving?P.t:1,rx=P.ox+(P.x-P.ox)*e,ry=P.oy+(P.y-P.oy)*e;
  const camX=Math.round(rx*TS-(CW-TS)/2),camY=Math.round(ry*TS-(CH-TS)/2);
  drawMap(def,grid,camX,camY,t);
  for(const c of chests)ctx.drawImage(CHEST[c.opened?1:0],c.x*TS-camX,c.y*TS-camY);
  const objs=npcs.map(n=>{const k=n.moving?n.t:1;return {spr:SPR[n.spr],x:n.ox+(n.x-n.ox)*k,y:n.oy+(n.y-n.oy)*k,ph:n.x*0.37}});
  objs.push({spr:SPR.hero,x:rx,y:ry,ph:0});
  objs.sort((a,b)=>a.y-b.y).forEach(o=>drawChar(o.spr,o.x,o.y,camX,camY,t,o.ph));
  if(def.dark){const cx=rx*TS-camX+8,cy=ry*TS-camY+8,g=ctx.createRadialGradient(cx,cy,26,cx,cy,96);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.93)');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH)}
}
function drawBattle(t){
  ctx.drawImage(B.bg,0,0);
  const now=performance.now();
  B.enemies.forEach((e,i)=>{
    const s=e.d.sc,w=16*s;let a=1;
    if(!e.alive){const k=(now-e.die)/350;if(k>=1)return;a=1-k}
    if(e.blink>now&&Math.floor(now/60)%2)return;
    const bob=B.boss?Math.round(Math.sin(t*2)*2):0;
    ctx.globalAlpha=a;ctx.drawImage(MONSPR[e.id],0,0,16,16,e.x,e.y+bob,w,w);ctx.globalAlpha=1;
    if(B.cursor===i&&Math.floor(t*4)%2===0){ctx.fillStyle='#ffd24a';const cx=e.x+w/2;ctx.beginPath();ctx.moveTo(cx-4,e.y-8);ctx.lineTo(cx+4,e.y-8);ctx.lineTo(cx,e.y-3);ctx.fill()}
  });
}
const TITLE_DEF={fill:'~'};
function drawTitle(t){
  titleT+=1/60;const camX=Math.round((Math.sin(titleT*0.05)*0.5+0.5)*(WORLD_GRID.w*TS-CW)),camY=Math.round(150+Math.sin(titleT*0.07)*120);
  drawMap(TITLE_DEF,WORLD_GRID,camX,camY,t);
  ctx.fillStyle='rgba(4,8,30,.45)';ctx.fillRect(0,0,CW,CH);
}
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  update(dt);syncPos();
  ctx.fillStyle='#000';ctx.fillRect(0,0,CW,CH);
  if(mode==='field'&&G)drawField(t);
  else if(mode==='battle'&&B)drawBattle(t);
  else if(mode==='title')drawTitle(t);
  requestAnimationFrame(frame);
}
setMute(AU.muted);
requestAnimationFrame(frame);
title();
})();
</script>
<script src="../../playtime.js" defer></script>
