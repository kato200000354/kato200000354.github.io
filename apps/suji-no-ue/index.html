<!doctype html>
<!-- © kato200000354. 無断転載・複製・再配布を禁止します。 (kato200000354-protected) -->

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>スウジノウエ</title>
<meta name="description" content="スコア、タイム、ジャンプ回数、ミス回数。画面の数字そのものが足場になる。数字を「書きかえて」道をつくる、デジタル数字のアクションパズル。">
<meta name="theme-color" content="#0b0f1a">
<style>
:root{
  --bg:#0b0f1a; --panel:#141b2b; --line:#2c3854; --ink:#e8eefc; --muted:#8a97b5;
  --score:#ffd23f; --time:#3fe0ff; --jump:#7dff6a; --miss:#ff5c8a;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box;background:rgba(8,11,20,.82);backdrop-filter:blur(3px);text-align:center;z-index:5}
.logo{font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:clamp(34px,9vw,74px);letter-spacing:.06em;color:var(--score);text-shadow:0 0 18px rgba(255,210,63,.55)}
.logo small{display:block;font-size:.32em;letter-spacing:.3em;color:var(--time);text-shadow:0 0 12px rgba(63,224,255,.6);margin-top:6px}
.lead{color:var(--muted);line-height:1.8;font-size:15px;max-width:520px;margin:0}
.lead b{color:var(--ink)}
.btn{appearance:none;border:2px solid var(--time);background:rgba(63,224,255,.08);color:var(--ink);font:inherit;font-weight:800;font-size:17px;padding:12px 28px;border-radius:12px;cursor:pointer;min-width:200px}
.btn:hover{background:rgba(63,224,255,.18)}
.btn.sub{border-color:var(--line);background:transparent;color:var(--muted);font-size:14px;padding:9px 20px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,150px));gap:10px;width:100%;max-width:480px}
.lv{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;border-radius:12px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.lv .n{font-family:ui-monospace,Consolas,monospace;font-size:30px;font-weight:900;color:var(--time)}
.lv .t{font-size:12px;color:var(--muted)}
.lv .c{font-size:11px;color:var(--jump);min-height:14px}
.lv.locked{opacity:.35;cursor:default}
.lv.done{border-color:rgba(125,255,106,.5)}
h2{margin:0;font-size:24px}
.big{font-family:ui-monospace,Consolas,monospace;font-size:clamp(40px,10vw,64px);font-weight:900;color:var(--jump);text-shadow:0 0 18px rgba(125,255,106,.5)}
.stats{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:16px;line-height:1.9}
.stats span{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));z-index:3;pointer-events:none}
#bar .name{font-weight:800;font-size:14px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{pointer-events:auto;appearance:none;border:1.5px solid var(--line);background:rgba(20,27,43,.85);color:var(--ink);font:inherit;font-size:13px;font-weight:700;border-radius:9px;padding:7px 11px;cursor:pointer}
#skip{border-color:var(--miss)!important;color:var(--miss)!important}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));z-index:3;pointer-events:none}
#pad .grp{display:flex;gap:12px}
#pad button{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:2px solid rgba(232,238,252,.35);background:rgba(20,27,43,.55);color:var(--ink);font-size:28px;font-weight:900;touch-action:none}
#pad button.on{background:rgba(63,224,255,.3);border-color:var(--time)}
#pad #bJ{width:92px;height:92px;font-size:18px}
.keys{font-size:12px;color:var(--muted)}
.portrait{display:none;color:var(--time)}
@media (orientation:portrait){.portrait{display:block}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="bar" hidden>
  <div class="name" id="lvName"></div>
  <button id="skip" hidden data-t="skip">スキップ</button>
  <button id="bRe" data-t="retry">やりなおす</button>
  <button id="bMenu" data-t="stages">ステージ</button>
</div>

<div id="pad" hidden>
  <div class="grp"><button id="bL">◀</button><button id="bR">▶</button></div>
  <button id="bJ">JUMP</button>
</div>

<div class="screen" id="title">
  <div class="logo">88:88<small data-t="sub">スウジノウエ</small></div>
  <p class="lead" data-t="lead">スコア、タイム、ジャンプ回数、ミス回数。<br>このゲームでは、<b>画面の数字そのものが足場</b>だ。<br>数字を書きかえて、道をつくれ。</p>
  <button class="btn" id="bStart" data-t="play">あそぶ</button>
  <div class="keys portrait" data-t="portrait">スマホは横向きにすると大きく遊べます</div>
  <div class="keys" data-t="keys">PC：← → で移動 ／ スペースか ↑ でジャンプ ／ R でやりなおし</div>
  <button class="btn sub" id="bLang">English</button>
</div>

<div class="screen" id="select" hidden>
  <h2 data-t="stages">ステージ</h2>
  <div class="grid" id="grid"></div>
  <button class="btn sub" id="bBack" data-t="toTitle">タイトルへ</button>
</div>

<div class="screen" id="clear" hidden>
  <div class="big">CLEAR</div>
  <div class="stats" id="stats"></div>
  <div class="row">
    <button class="btn" id="bNext" data-t="next">つぎへ</button>
    <button class="btn sub" id="bSel" data-t="stages">ステージ</button>
  </div>
</div>

<div class="screen" id="ending" hidden>
  <div class="big" style="color:var(--score)">ALL CLEAR</div>
  <p class="lead" data-t="ending">全ステージクリア！<br>もうあなたには、画面の数字がただの数字には見えないはず。<br><b>MISSが少ないほど上手</b>。最少ミスに挑戦してみよう。</p>
  <button class="btn" id="bEnd" data-t="toStages">ステージへ</button>
</div>
