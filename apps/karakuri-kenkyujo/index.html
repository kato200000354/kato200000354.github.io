<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1a24">
<title>からくり博士の研究室</title>
<meta name="description" content="ねこ博士の研究室に閉じこめられた！部屋をしらべてアイテムを集め、からくりを解いて脱出しよう。">
<style>
:root{--bg:#1d1a24;--panel:#2a2533;--line:#3d3647;--ink:#f4ecdc;--sub:#b9ad98;--gold:#f0c35a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);min-height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;min-height:100svh;display:flex;justify-content:center;
  user-select:none;-webkit-user-select:none;background:radial-gradient(ellipse at 50% -10%,#3a2f45 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{width:100%;max-width:600px;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:15px;color:var(--gold);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:6px;flex-shrink:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;color:var(--sub);background:var(--panel);white-space:nowrap}
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.stage svg{display:block;width:100%;height:100%}
.stage svg text{font-family:inherit}
.hs{cursor:pointer}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:60px;border-radius:10px;background:rgba(20,16,28,.35);color:#fff;font-size:18px}
.nav.l{left:4px}.nav.r{right:4px}
.back{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);padding:8px 22px;border-radius:999px;background:rgba(20,16,28,.75);color:#fff;font-size:15px;white-space:nowrap}
.dirlbl{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(20,16,28,.55);color:#eee;white-space:nowrap;pointer-events:none}
.msg{min-height:70px;background:var(--panel);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.65;white-space:pre-line;border:1px solid var(--line)}
.inv{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:10px;background:var(--panel);border:2px solid var(--line);font-size:clamp(18px,5.4vw,28px);display:flex;align-items:center;justify-content:center}
.slot.sel{border-color:var(--gold);background:#3a3222;box-shadow:0 0 12px rgba(240,195,90,.45)}
.slot.new{animation:pop .5s}
.help{font-size:12px;color:var(--sub);text-align:center}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1.4s linear infinite}
.spinr{animation:spin 1.4s linear infinite reverse}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}
@keyframes glow{50%{opacity:.55}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes zz{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.zz{animation:zz 2.4s ease-out infinite}

/* 画面 */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(14,11,20,.92);overflow:auto}
.card{width:min(420px,100%);background:#f6eedc;color:#2b2230;border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.card h2{font-size:24px;margin-bottom:8px;color:#5b3a1e}
.card p{font-size:15px;line-height:1.7;margin-bottom:12px;white-space:pre-line}
.logo-sub{font-size:13px;letter-spacing:.3em;color:#a0762b}
.logo{font-size:clamp(28px,8.5vw,40px);font-weight:900;color:#5b3a1e;margin:4px 0 6px;line-height:1.25}
.big{display:block;width:100%;margin:8px 0;padding:13px;border-radius:14px;font-weight:800;font-size:18px;background:linear-gradient(#f3c862,#d39a2e);color:#3a2408;box-shadow:0 4px 0 #8a5f1a}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5f1a}
.sub{display:block;width:100%;margin:6px 0;padding:10px;border-radius:12px;border:1px solid #c9b38d;color:#6b5238;font-size:15px}
.itembig{font-size:56px;line-height:1.2;margin:4px 0}
.stat{display:flex;justify-content:center;gap:18px;margin:6px 0 14px;font-size:15px}
.stat b{display:block;font-size:24px;color:#5b3a1e}
.white{position:fixed;inset:0;background:#fff;z-index:9;opacity:0;pointer-events:none;transition:opacity 1.2s}
.white.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>からくり博士の研究室</h1>
    <div class="tbtns">
      <button class="chip" id="bHint">💡 ヒント</button>
      <button class="chip" id="bSnd">🔊</button>
      <button class="chip" id="bMenu">≡</button>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="msg" id="msg"></div>
  <div class="inv" id="inv"></div>
  <div class="help">アイテムをタップで選択 → 使いたい場所をタップ（もう一度タップでくわしく見る）</div>
</div>

<div class="screen" id="title">
  <div class="card">
    <div class="logo-sub">ESCAPE GAME</div>
    <div class="logo">からくり博士の<br>研究室</div>
    <svg viewBox="0 0 200 110" width="200" height="110" aria-hidden="true" id="titleArt"></svg>
    <p>目をさますと、ねこ博士の研究室。
とびらには カギと 暗証番号のロックが…。
部屋をしらべて、からくりを ときあかし、
ここから だっしゅつしよう！</p>
    <button class="big" id="bStart">はじめる</button>
    <button class="sub" id="bNew" hidden>はじめから やりなおす</button>
    <p id="bestLine" style="font-size:13px;color:#7a6450;margin:8px 0 0"></p>
  </div>
</div>

<div class="screen" id="detail" hidden>
  <div class="card">
    <div class="itembig" id="dIcon"></div>
    <h2 id="dName"></h2>
    <p id="dText"></p>
    <button class="big" id="dClose">とじる</button>
  </div>
</div>

<div class="screen" id="clear" hidden>
  <div class="card">
    <div class="logo-sub">CLEAR!</div>
    <div class="logo">だっしゅつ成功！</div>
    <p>とびらの むこうでは、ねこ博士が
「よくぞ ときあかした！」と 拍手していた。</p>
    <div class="stat">
      <div>タイム<b id="cTime"></b></div>
      <div>ヒント<b id="cHint"></b></div>
    </div>
    <p id="cBest" style="font-size:14px"></p>
    <button class="big" id="cAgain">もう一度あそぶ</button>
  </div>
</div>
<div class="white" id="white"></div>
