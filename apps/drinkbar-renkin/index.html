<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff4e2;color:#3b2314;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.logo{font-family:"Reggae One","M PLUS Rounded 1c",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ヘッダー */
#top{position:fixed;left:0;right:0;top:0;z-index:10;height:46px;display:flex;align-items:center;gap:6px;padding:0 8px;
  padding-top:env(safe-area-inset-top);background:#d8262f;color:#fff;box-shadow:0 3px 0 #a3151d}
#top .t{flex:1;min-width:0;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backBtn{background:#fff;color:#d8262f;border-radius:999px;padding:5px 11px;font-weight:900;font-size:13px}
.coin{background:#ffd23f;color:#5a3500;border-radius:999px;padding:4px 10px;font-weight:900;font-size:13px;white-space:nowrap}

/* 注文カード */
#order{position:fixed;left:8px;right:8px;top:54px;z-index:9;background:#fff;border:3px solid #3b2314;border-radius:14px;padding:7px 10px;
  font-weight:900;font-size:14px;line-height:1.4;box-shadow:0 4px 0 #3b2314}
#order small{display:block;font-size:11px;color:#a3151d}

/* 下のパネル */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:4px solid #3b2314;border-radius:18px 18px 0 0;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;height:min(47vh,380px)}
#tasters{display:flex;gap:5px;overflow-x:auto;flex:0 0 auto;padding-bottom:2px;scrollbar-width:none}
#tasters::-webkit-scrollbar{display:none}
#tasters .lab{flex:0 0 auto;font-size:11px;font-weight:900;align-self:center;color:#8a6a50}
.tchip{flex:0 0 auto;border:2px solid #3b2314;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900;background:#fff}
.tchip.on{background:#3b2314;color:#fff}
.tchip.lock{opacity:.4}
#grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;align-content:start;touch-action:pan-y}
.noz{position:relative;border:2px solid #e2d3bf;border-radius:12px;background:#fffaf2;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;touch-action:pan-y;-webkit-touch-callout:none}
.noz i{width:30px;height:30px;border-radius:50%;border:3px solid #3b2314;display:block;box-shadow:inset -4px -5px 0 rgba(0,0,0,.18)}
.noz b{font-size:10.5px;line-height:1.15;text-align:center;font-weight:900;word-break:keep-all;overflow-wrap:anywhere}
.noz.on{border-color:#d8262f;background:#ffe1e1;transform:translateY(2px)}
.noz.new::after{content:"NEW";position:absolute;top:-6px;right:-3px;background:#d8262f;color:#fff;font-size:9px;border-radius:6px;padding:1px 4px;font-weight:900}
.noz.lockd{opacity:.35;pointer-events:none}
#acts{display:flex;gap:6px;flex:0 0 auto}
#acts button{flex:1;border-radius:14px;padding:11px 2px;font-weight:900;font-size:15px;border:3px solid #3b2314;box-shadow:0 4px 0 #3b2314}
#acts button:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2314}
#dumpBtn{background:#eee}
#stirBtn{background:#7fd3ff}
#drinkBtn{background:#ffd23f;flex:1.4!important}

/* タイトル */
#title{background:radial-gradient(circle at 50% 30%,#ffe9a8,#ffb36b 60%,#ff7c5a);display:flex;flex-direction:column;align-items:center;padding:24px 16px 30px;gap:10px}
#title h1{margin:8px 0 0;font-size:min(13vw,52px);line-height:1.05;text-align:center;color:#fff;letter-spacing:.02em;
  text-shadow:3px 0 0 #3b2314,-3px 0 0 #3b2314,0 3px 0 #3b2314,0 -3px 0 #3b2314,2px 2px 0 #3b2314,-2px 2px 0 #3b2314,2px -2px 0 #3b2314,-2px -2px 0 #3b2314,0 7px 0 #3b2314}
#title h1 span{display:block;font-size:.55em;color:#ffd23f}
#title .sub{font-weight:900;font-size:15px;color:#3b2314;text-align:center;margin:0}
#titleCv{width:220px;height:180px}
.big{width:100%;max-width:340px;border-radius:16px;padding:12px 6px;font-weight:900;font-size:18px;border:3px solid #3b2314;box-shadow:0 5px 0 #3b2314;background:#fff;line-height:1.25}
.big small{display:block;font-size:11.5px;font-weight:700;color:#8a4a20}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #3b2314}
#freeBtn{background:#ffd23f}
#orderBtn{background:#7fd3ff}
#dailyBtn{background:#9cf08a}
#tRow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:340px}
#tRow button{border:3px solid #3b2314;border-radius:12px;background:#fff;padding:7px 2px;font-weight:900;font-size:13px;box-shadow:0 3px 0 #3b2314;line-height:1.2}
#tRow small{display:block;font-size:10px;color:#8a4a20}
#friend{width:100%;max-width:340px;background:#3b2314;color:#fff;border-radius:16px;padding:10px;text-align:center;font-weight:900}
#friend button{margin-top:7px;background:#ffd23f;color:#3b2314;border-radius:999px;padding:8px 18px;font-weight:900}
#tip{font-size:12px;font-weight:700;color:#5a2a10;text-align:center;max-width:340px;min-height:2.6em}
#tCoins{font-weight:900}

/* 結果シート */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:66vh;overflow-y:auto;background:#fff;border-top:4px solid #3b2314;
  border-radius:20px 20px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.rar{display:inline-block;border-radius:8px;padding:2px 8px;font-weight:900;font-size:12px;color:#fff;background:#888}
.r1{background:#8a8a8a}.r2{background:#3b9ae0}.r3{background:#a24ae0}.r4{background:linear-gradient(90deg,#ff9a1a,#ff3f6e)}.r5{background:linear-gradient(90deg,#ff3f3f,#ffd23f,#3fd14a,#1f8bff,#a24ae0)}
.newb{display:inline-block;margin-left:5px;border-radius:8px;padding:2px 8px;font-weight:900;font-size:12px;background:#d8262f;color:#fff;animation:pop .6s infinite alternate}
@keyframes pop{to{transform:scale(1.12)}}
#rName{font-weight:900;font-size:24px;line-height:1.2;margin:5px 0 2px;overflow-wrap:anywhere}
#rCom{font-size:13px;font-weight:700;color:#7a5a40;margin:0 0 7px}
#rSay{background:#fff4e2;border-radius:12px;padding:8px 10px;font-weight:900;font-size:14px;margin-bottom:8px}
#rSay small{display:block;font-size:11.5px;color:#a3151d}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.scores div{background:#3b2314;color:#fff;border-radius:12px;padding:6px;text-align:center;font-weight:900;font-size:12px}
.scores b{display:block;font-size:24px;line-height:1.1;color:#ffd23f}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:8px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:900}
.bars span{display:block;width:100%;height:46px;background:#f0e4d2;border-radius:6px;position:relative;overflow:hidden}
.bars span i{position:absolute;left:0;right:0;bottom:0;background:#d8262f;border-radius:6px}
.bars span em{position:absolute;left:18%;right:18%;height:3px;background:#1f8bff;border-radius:2px}
.recipe{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.recipe span{border-radius:999px;padding:3px 8px;font-size:11.5px;font-weight:900;color:#fff;border:2px solid #3b2314}
.recipe span.lt{color:#3b2314}
#rGain{font-size:13px;font-weight:900;color:#a3151d;margin-bottom:8px;white-space:pre-line}
#rPaper{display:block;width:100%;border-radius:10px;border:2px solid #3b2314;margin-bottom:8px;aspect-ratio:1200/675;background:#eee}
.xb{display:block;width:100%;border-radius:14px;padding:12px;font-weight:900;font-size:16px;background:#111;color:#fff;margin-bottom:7px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.row2 button{border-radius:12px;padding:10px 4px;font-weight:900;font-size:14px;border:3px solid #3b2314;background:#ffd23f}
.row2 button.g{background:#eee}
.hd{font-weight:900;font-size:13px;margin:4px 0}

/* おすすめ */
#more{margin-top:12px;border-top:3px dashed #e2d3bf;padding-top:10px}
.moreFollow{display:block;margin-bottom:9px;padding:9px 4px;border-radius:12px;background:#0b6fc2;color:#fff;text-align:center;text-decoration:none;line-height:1.3}
.moreFollow b{display:block;font-weight:900;font-size:15px}
.moreFollow small{display:block;font-size:11.5px}
.moreHead{font-weight:900;font-size:13px;text-align:center;margin-bottom:6px}
.moreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.moreCard{display:block;min-width:0;border-radius:10px;overflow:hidden;background:#fff4e2;color:#3b2314;text-decoration:none}
.moreCard img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;background:#3b2314}
.moreCard b{display:block;font-weight:900;font-size:10.5px;line-height:1.25;padding:4px 3px 0}
.moreCard i{display:block;font-style:normal;font-size:10px;line-height:1.25;padding:1px 3px 4px}
.moreAll{display:block;margin-top:6px;border-radius:10px;font-weight:900;font-size:12.5px;text-align:center;text-decoration:none;background:#ffd23f;color:#4d2a05;padding:7px 2px}

/* パネル（図鑑など） */
#panel{background:#fff4e2;padding:56px 10px 24px}
#pHead{position:fixed;left:0;right:0;top:0;height:46px;background:#3b2314;color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px;z-index:2}
#pHead .t{flex:1;font-weight:900}
#pBack{background:#fff;color:#3b2314;border-radius:999px;padding:5px 12px;font-weight:900;font-size:13px}
.tabs{display:flex;gap:5px;margin-bottom:8px}
.tabs button{flex:1;border:2px solid #3b2314;border-radius:10px;padding:6px 2px;font-weight:900;font-size:13px;background:#fff}
.tabs button.on{background:#3b2314;color:#fff}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dx{background:#fff;border:2px solid #e2d3bf;border-radius:12px;padding:6px 7px;display:flex;gap:6px;align-items:center;min-width:0}
.dx i{flex:0 0 26px;height:34px;border-radius:3px 3px 9px 9px;border:2px solid #3b2314;background:#ddd}
.dx div{min-width:0;flex:1}
.dx b{display:block;font-size:12px;line-height:1.2;font-weight:900;overflow-wrap:anywhere}
.dx small{display:block;font-size:10.5px;color:#8a6a50;line-height:1.25}
.dx.no{background:#f3ece1}
.dx.no b{color:#a99}
.ach{background:#fff;border:2px solid #e2d3bf;border-radius:12px;padding:7px 9px;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:900}
.ach small{display:block;font-size:11px;color:#8a6a50;font-weight:700}
.ach.ok{border-color:#3fd14a;background:#effde9}
.ach em{font-style:normal;color:#a3151d;white-space:nowrap;align-self:center}

/* ガチャ */
#gacha{background:rgba(30,15,5,.82);display:flex;align-items:center;justify-content:center;padding:16px}
#gBox{background:#fff;border:4px solid #3b2314;border-radius:20px;padding:16px;width:100%;max-width:330px;text-align:center}
#gBall{width:120px;height:120px;margin:6px auto 10px;border-radius:50%;border:4px solid #3b2314;background:linear-gradient(#ff5a5a 50%,#fff 50%);position:relative}
#gBall.shake{animation:gs .18s infinite alternate}
@keyframes gs{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
#gBall.open{animation:go .4s forwards}
@keyframes go{to{transform:scale(1.25);opacity:0}}
#gItem{width:110px;height:110px;margin:0 auto 8px;border-radius:50%;border:5px solid #3b2314;animation:pop .5s infinite alternate}
#gName{font-weight:900;font-size:22px}
#gTxt{font-size:13px;font-weight:700;color:#7a5a40;margin:5px 0 12px;white-space:pre-line}

#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:40;background:#3b2314;color:#fff;font-weight:900;font-size:14px;
  border-radius:999px;padding:8px 16px;max-width:92vw;text-align:center;pointer-events:none;transition:opacity .3s}
</style>
</head>
