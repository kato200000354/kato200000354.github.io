<!doctype html>
<!-- © kato200000354. 無断転載・複製・再配布を禁止します。 (kato200000354-protected) -->

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>だるまさんがころんだ ―夜の屋敷―</title>
<meta name="description" content="真っ暗な屋敷で5枚のお札を集めて脱出する3Dホラー。ライトで照らしている間「それ」は動けない。目を離すと、近づいてくる。">
<style>
  :root{--fg:#e6dccb;--dim:rgba(230,220,203,.55);--red:#c8202a;--line:rgba(230,220,203,.18);--panel:rgba(6,4,4,.93)}
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #layer{position:fixed;inset:0;z-index:2}
  #grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.09;image-rendering:pixelated;z-index:3}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.8) 100%)}
  #danger{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(140,0,0,.9) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:#fff}
  #hud{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0;pointer-events:none;font-family:system-ui,sans-serif}
  #hTal{font-size:16px;letter-spacing:.05em;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  #hTal b{color:#ff6a5a;font-size:22px}
  .bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:5px}
  .bar i{display:block;width:90px;height:6px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .bar em{display:block;height:100%;width:100%;background:#d8c88c;transition:width .1s}
  #bSta{background:#8fb7c9}
  .hr{display:flex;gap:10px;align-items:center}
  #hTime{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
  .hb{pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer}
  #dot{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.35);z-index:4;pointer-events:none}
  #say{position:fixed;left:16px;right:16px;top:30%;text-align:center;z-index:5;pointer-events:none;color:#d4222c;font-size:clamp(22px,6vw,40px);
    letter-spacing:.3em;text-shadow:0 0 12px rgba(255,0,0,.5);opacity:0;transition:opacity .6s}
  #msg{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;z-index:5;pointer-events:none;font-size:16px;
    text-shadow:0 0 6px #000,0 0 2px #000;opacity:0;transition:opacity .4s}
  #mob{position:fixed;inset:0;z-index:5;pointer-events:none}
  #joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);opacity:.5}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.2)}
  .mb{position:absolute;right:calc(18px + env(safe-area-inset-right));width:78px;height:78px;border-radius:50%;pointer-events:auto;
    border:2px solid rgba(255,255,255,.25);background:rgba(20,16,12,.55);color:var(--fg);font-size:15px;font-family:inherit;touch-action:none}
  #bLight{bottom:calc(28px + env(safe-area-inset-bottom))}
  #bLight.on{background:rgba(220,200,140,.35);border-color:rgba(255,235,170,.7)}
  #bRun{bottom:calc(118px + env(safe-area-inset-bottom));right:calc(64px + env(safe-area-inset-right));width:66px;height:66px;font-size:14px}
  #bRun.on{background:rgba(140,180,200,.35)}
  .scr{position:fixed;inset:0;z-index:10;display:flex;overflow-y:auto;padding:24px 16px;background:radial-gradient(ellipse at 50% 35%,#1c0909 0%,#060303 60%,#000 100%)}
  .box{margin:auto;max-width:460px;width:100%;text-align:center}
  h1{font-size:clamp(30px,9vw,46px);letter-spacing:.12em;color:#e8dccb;text-shadow:0 0 18px rgba(200,20,30,.55);font-weight:700;line-height:1.3}
  h1 span{display:block;font-size:.42em;letter-spacing:.4em;color:#c8202a;margin-top:6px}
  .story{margin:20px 0 14px;line-height:1.9;font-size:15px;color:var(--dim)}
  .rules{text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.85;background:rgba(0,0,0,.35)}
  .rules b{color:#ff6a5a;font-weight:700}
  .ctl{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.7;font-family:system-ui,sans-serif}
  .btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:10px;border:1px solid #7a1a1e;background:linear-gradient(#5a0e12,#320709);
    color:#f3e6d4;font-size:19px;letter-spacing:.2em;font-family:inherit;cursor:pointer}
  .btn.sub{background:rgba(255,255,255,.05);border-color:var(--line);font-size:15px;letter-spacing:.1em}
  .opt{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--dim);font-family:system-ui,sans-serif}
  .opt input{width:18px;height:18px;accent-color:#c8202a}
  .best{margin-top:10px;font-size:13px;color:var(--dim);font-family:system-ui,sans-serif}
  .ver{margin-top:14px;font-size:11px;color:rgba(230,220,203,.3);font-family:system-ui,sans-serif}
  #over h2{font-size:clamp(36px,11vw,56px);color:#d4222c;letter-spacing:.3em;text-shadow:0 0 20px rgba(255,0,0,.6)}
  #win h2{font-size:clamp(30px,9vw,46px);color:#efe3cf;letter-spacing:.25em}
  .res{margin:18px 0;font-size:16px;line-height:2}
  .tip{font-size:13px;color:var(--dim);margin-bottom:6px;line-height:1.7}
  .creepy{color:#c8202a;letter-spacing:.3em;margin-top:16px;font-size:15px}
  #err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:20;background:#000;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="layer"></div>
<canvas id="grain" width="128" height="128"></canvas>
<div id="vig"></div>
<div id="danger"></div>
<div id="flash"></div>

<div id="hud" hidden>
  <div>
    <div id="hTal">お札 <b id="tCnt">0</b> / 5</div>
    <div class="bar"><span>電池</span><i><em id="bBat"></em></i></div>
    <div class="bar"><span>息　</span><i><em id="bSta"></em></i></div>
  </div>
  <div class="hr"><span id="hTime">0:00</span><button class="hb" id="btnPause">❚❚</button></div>
</div>
<div id="dot" hidden></div>
<div id="say"></div>
<div id="msg"></div>

<div id="mob" hidden>
  <div id="joy" style="left:90px;bottom:auto;top:calc(100% - 110px)"><div id="knob"></div></div>
  <button id="bRun" class="mb">走る</button>
  <button id="bLight" class="mb on">ライト</button>
</div>

<section id="title" class="scr">
  <div class="box">
    <h1>だるまさんが<br>ころんだ<span>― 夜の屋敷 ―</span></h1>
    <p class="story">祖母の屋敷に封じられた、五枚のお札。<br>すべて集めて玄関から出なければ、<br>あの子は あなたを帰してくれない。</p>
    <div class="rules">
      ・ライトで<b>照らしている間</b>、「それ」は動けない。<br>
      ・<b>目を離すと</b>、近づいてくる。<br>
      ・足音が聞こえたら、<b>振り返れ</b>。<br>
      ・電池には限りがある。赤い光がお札、黄色い光が電池。<br>
      ・お札を5枚集めたら、<b>玄関</b>へ戻れ。
    </div>
    <p class="ctl" id="ctlText"></p>
    <button class="btn" id="btnStart">はじめる</button>
    <label class="opt"><input type="checkbox" id="optVoice" checked>ささやき声（読み上げ）</label>
    <p class="best" id="bestText"></p>
    <p class="ver">イヤホン推奨 ／ ver 1.0</p>
  </div>
</section>

<section id="pause" class="scr" hidden>
  <div class="box">
    <h1 style="font-size:32px">一時停止</h1>
    <button class="btn" id="btnResume">つづける</button>
    <button class="btn sub" id="btnQuit">タイトルへ</button>
  </div>
</section>

<section id="over" class="scr" hidden>
  <div class="box">
    <h2>つかまった</h2>
    <p class="res" id="overRes"></p>
    <p class="tip" id="overTip"></p>
    <button class="btn" id="btnRetry">もう一度</button>
    <button class="btn sub" id="btnTitle1">タイトルへ</button>
  </div>
</section>

<section id="win" class="scr" hidden>
  <div class="box">
    <h2>脱出成功</h2>
    <p class="res" id="winRes"></p>
    <p class="creepy">……また あそぼうね</p>
    <button class="btn" id="btnAgain">もう一度</button>
    <button class="btn sub" id="btnTitle2">タイトルへ</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
