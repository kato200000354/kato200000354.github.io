<!doctype html>
<html lang="ja">
<head>
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>だるまさんがころんだ ―夜の屋敷―</title>
<meta name="description" content="真っ暗な屋敷で5枚のお札を集めて脱出する3Dホラー。ライトで照らしている間「それ」は動けない。目を離すと、近づいてくる。">
<style>
  :root{--fg:#e6dccb;--dim:rgba(230,220,203,.55);--red:#c8202a;--line:rgba(230,220,203,.18);--panel:rgba(6,4,4,.93)}
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #layer{position:fixed;inset:0;z-index:2}
  #grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.09;image-rendering:pixelated;z-index:3}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.8) 100%)}
  #danger{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(140,0,0,.9) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;background:#fff}
  #hud{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0;pointer-events:none;font-family:system-ui,sans-serif}
  #hTal{font-size:16px;letter-spacing:.05em;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
  #hTal b{color:#ff6a5a;font-size:22px}
  .bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:5px}
  .bar i{display:block;width:90px;height:6px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .bar em{display:block;height:100%;width:100%;background:#d8c88c;transition:width .1s}
  #bSta{background:#8fb7c9}
  .hr{display:flex;gap:10px;align-items:center}
  #hTime{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
  .hb{pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer}
  #dot{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.35);z-index:4;pointer-events:none}
  #say{position:fixed;left:16px;right:16px;top:30%;text-align:center;z-index:5;pointer-events:none;color:#d4222c;font-size:clamp(22px,6vw,40px);
    letter-spacing:.3em;text-shadow:0 0 12px rgba(255,0,0,.5);opacity:0;transition:opacity .6s}
  #msg{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;z-index:5;pointer-events:none;font-size:16px;
    text-shadow:0 0 6px #000,0 0 2px #000;opacity:0;transition:opacity .4s}
  #mob{position:fixed;inset:0;z-index:5;pointer-events:none}
  #joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);opacity:.5}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.2)}
  .mb{position:absolute;right:calc(18px + env(safe-area-inset-right));width:78px;height:78px;border-radius:50%;pointer-events:auto;
    border:2px solid rgba(255,255,255,.25);background:rgba(20,16,12,.55);color:var(--fg);font-size:15px;font-family:inherit;touch-action:none}
  #bLight{bottom:calc(28px + env(safe-area-inset-bottom))}
  #bLight.on{background:rgba(220,200,140,.35);border-color:rgba(255,235,170,.7)}
  #bRun{bottom:calc(118px + env(safe-area-inset-bottom));right:calc(64px + env(safe-area-inset-right));width:66px;height:66px;font-size:14px}
  #bRun.on{background:rgba(140,180,200,.35)}
  .scr{position:fixed;inset:0;z-index:10;display:flex;overflow-y:auto;padding:24px 16px;background:radial-gradient(ellipse at 50% 35%,#1c0909 0%,#060303 60%,#000 100%)}
  .box{margin:auto;max-width:460px;width:100%;text-align:center}
  h1{font-size:clamp(30px,9vw,46px);letter-spacing:.12em;color:#e8dccb;text-shadow:0 0 18px rgba(200,20,30,.55);font-weight:700;line-height:1.3}
  h1 span{display:block;font-size:.42em;letter-spacing:.4em;color:#c8202a;margin-top:6px}
  .story{margin:20px 0 14px;line-height:1.9;font-size:15px;color:var(--dim)}
  .rules{text-align:left;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.85;background:rgba(0,0,0,.35)}
  .rules b{color:#ff6a5a;font-weight:700}
  .ctl{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.7;font-family:system-ui,sans-serif}
  .btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:10px;border:1px solid #7a1a1e;background:linear-gradient(#5a0e12,#320709);
    color:#f3e6d4;font-size:19px;letter-spacing:.2em;font-family:inherit;cursor:pointer}
  .btn.sub{background:rgba(255,255,255,.05);border-color:var(--line);font-size:15px;letter-spacing:.1em}
  .opt{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--dim);font-family:system-ui,sans-serif}
  .opt input{width:18px;height:18px;accent-color:#c8202a}
  .best{margin-top:10px;font-size:13px;color:var(--dim);font-family:system-ui,sans-serif}
  .ver{margin-top:14px;font-size:11px;color:rgba(230,220,203,.3);font-family:system-ui,sans-serif}
  #over h2{font-size:clamp(36px,11vw,56px);color:#d4222c;letter-spacing:.3em;text-shadow:0 0 20px rgba(255,0,0,.6)}
  #win h2{font-size:clamp(30px,9vw,46px);color:#efe3cf;letter-spacing:.25em}
  .res{margin:18px 0;font-size:16px;line-height:2}
  .tip{font-size:13px;color:var(--dim);margin-bottom:6px;line-height:1.7}
  .creepy{color:#c8202a;letter-spacing:.3em;margin-top:16px;font-size:15px}
  #err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:20;background:#000;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="layer"></div>
<canvas id="grain" width="128" height="128"></canvas>
<div id="vig"></div>
<div id="danger"></div>
<div id="flash"></div>

<div id="hud" hidden>
  <div>
    <div id="hTal">お札 <b id="tCnt">0</b> / 5</div>
    <div class="bar"><span>電池</span><i><em id="bBat"></em></i></div>
    <div class="bar"><span>息　</span><i><em id="bSta"></em></i></div>
  </div>
  <div class="hr"><span id="hTime">0:00</span><button class="hb" id="btnPause">❚❚</button></div>
</div>
<div id="dot" hidden></div>
<div id="say"></div>
<div id="msg"></div>

<div id="mob" hidden>
  <div id="joy" style="left:90px;bottom:auto;top:calc(100% - 110px)"><div id="knob"></div></div>
  <button id="bRun" class="mb">走る</button>
  <button id="bLight" class="mb on">ライト</button>
</div>

<section id="title" class="scr">
  <div class="box">
    <h1>だるまさんが<br>ころんだ<span>― 夜の屋敷 ―</span></h1>
    <p class="story">祖母の屋敷に封じられた、五枚のお札。<br>すべて集めて玄関から出なければ、<br>あの子は あなたを帰してくれない。</p>
    <div class="rules">
      ・ライトで<b>照らしている間</b>、「それ」は動けない。<br>
      ・<b>目を離すと</b>、近づいてくる。<br>
      ・足音が聞こえたら、<b>振り返れ</b>。<br>
      ・電池には限りがある。赤い光がお札、黄色い光が電池。<br>
      ・お札を5枚集めたら、<b>玄関</b>へ戻れ。
    </div>
    <p class="ctl" id="ctlText"></p>
    <button class="btn" id="btnStart">はじめる</button>
    <label class="opt"><input type="checkbox" id="optVoice" checked>ささやき声（読み上げ）</label>
    <p class="best" id="bestText"></p>
    <p class="ver">イヤホン推奨 ／ ver 1.0</p>
  </div>
</section>

<section id="pause" class="scr" hidden>
  <div class="box">
    <h1 style="font-size:32px">一時停止</h1>
    <button class="btn" id="btnResume">つづける</button>
    <button class="btn sub" id="btnQuit">タイトルへ</button>
  </div>
</section>

<section id="over" class="scr" hidden>
  <div class="box">
    <h2>つかまった</h2>
    <p class="res" id="overRes"></p>
    <p class="tip" id="overTip"></p>
    <button class="btn" id="btnRetry">もう一度</button>
    <button class="btn sub" id="btnTitle1">タイトルへ</button>
  </div>
</section>

<section id="win" class="scr" hidden>
  <div class="box">
    <h2>脱出成功</h2>
    <p class="res" id="winRes"></p>
    <p class="creepy">……また あそぼうね</p>
    <button class="btn" id="btnAgain">もう一度</button>
    <button class="btn sub" id="btnTitle2">タイトルへ</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(function(){
const $ = id => document.getElementById(id);
if (!window.THREE) {
  const e = document.createElement('div'); e.id = 'err';
  e.innerHTML = '3D描画ライブラリを読み込めませんでした。<br>通信状況を確認して、ページを再読み込みしてください。';
  document.body.appendChild(e); return;
}

// ================= 定数・道具 =================
const S = 2, H = 2.6, N = 21, NEED = 5, EYE = 1.55;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const isTouch = matchMedia('(pointer:coarse)').matches;
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = n => Math.floor(Math.random()*n);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=ri(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const fmt = t => { t = Math.floor(t); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };

// ================= マップ生成 =================
let grid, rooms;
const wallAt = (tx,ty) => tx<0 || ty<0 || tx>=N || ty>=N || grid[ty][tx] === 1;
const isWallAt = (x,z) => wallAt(Math.floor(x/S), Math.floor(z/S));
const tc = t => t*S + S/2;

function genMap(){
  grid = []; for (let y=0;y<N;y++) grid.push(new Array(N).fill(1));
  const st = [[1,1]]; grid[1][1] = 0;
  while (st.length){
    const [x,y] = st[st.length-1];
    const nb = shuffle([[2,0],[-2,0],[0,2],[0,-2]]).filter(([dx,dy]) => {
      const nx=x+dx, ny=y+dy; return nx>0 && ny>0 && nx<N-1 && ny<N-1 && grid[ny][nx]===1; });
    if (!nb.length){ st.pop(); continue; }
    const [dx,dy] = nb[0]; grid[y+dy/2][x+dx/2] = 0; grid[y+dy][x+dx] = 0; st.push([x+dx,y+dy]);
  }
  // 回り道（ループ）を作る
  for (let y=1;y<N-1;y++) for (let x=1;x<N-1;x++){
    if (grid[y][x] !== 1) continue;
    const h = !grid[y][x-1] && !grid[y][x+1] && grid[y-1][x] && grid[y+1][x];
    const v = !grid[y-1][x] && !grid[y+1][x] && grid[y][x-1] && grid[y][x+1];
    if ((h||v) && Math.random() < .14) grid[y][x] = 0;
  }
  const carve = (rx,ry) => { for (let y=ry;y<ry+3;y++) for (let x=rx;x<rx+3;x++) grid[y][x] = 0; };
  carve(1,1); // 玄関
  rooms = []; let tries = 0;
  while (rooms.length < 4 && tries++ < 300){
    const rx = 1+2*ri(9), ry = 1+2*ri(9);
    if (rx < 6 && ry < 6) continue;
    if (rooms.some(r => Math.abs(r.x-rx) < 6 && Math.abs(r.y-ry) < 6)) continue;
    carve(rx,ry); rooms.push({x:rx,y:ry});
  }
}
function bfs(sx,sy){
  const d = new Int16Array(N*N).fill(-1); const q = [sx+sy*N]; d[q[0]] = 0; let h = 0;
  while (h < q.length){
    const i = q[h++], x = i%N, y = (i/N)|0;
    for (const [dx,dy] of DIRS){
      const nx=x+dx, ny=y+dy;
      if (!wallAt(nx,ny)){ const j = nx+ny*N; if (d[j] < 0){ d[j] = d[i]+1; q.push(j); } }
    }
  }
  return d;
}
const openN = (x,y) => DIRS.reduce((s,[dx,dy]) => s + (wallAt(x+dx,y+dy)?0:1), 0);
const inRoom = (x,y) => rooms.some(r => x>=r.x && x<r.x+3 && y>=r.y && y<r.y+3);

// ================= 描画準備 =================
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: !isTouch, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, isTouch ? 1.25 : 1.5));
renderer.setClearColor(0x000000);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.075);
const camera = new THREE.PerspectiveCamera(72, 1, 0.04, 80);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.AmbientLight(0x1c1c28, 1));
const spot = new THREE.SpotLight(0xfff0d4, 2.0, 22, 0.48, 0.55, 1.0);
spot.position.set(0.12,-0.12,0.05);
const spotT = new THREE.Object3D(); spotT.position.set(0,-0.1,-5);
camera.add(spot); camera.add(spotT); spot.target = spotT;
const near = new THREE.PointLight(0xffe2c4, 0.5, 5, 2);
camera.add(near);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.fov = w/h < 1 ? 82 : 70; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- 手描きテクスチャ ----------
function cvs(w,h,f){
  const c = document.createElement('canvas'); c.width=w; c.height=h; const g = c.getContext('2d'); f(g,w,h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function speckle(g,w,h,n,a){ for (let i=0;i<n;i++){ const v = Math.random()<.5?0:255; g.fillStyle=`rgba(${v},${v},${v},${a})`; g.fillRect(Math.random()*w,Math.random()*h,2,2); } }
function stains(g,w,h,n,col){
  for (let i=0;i<n;i++){ const x=Math.random()*w, y=Math.random()*h, r=rnd(15,70);
    const gr = g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,col); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,w,h); }
}
function wallBase(g,w,h){
  g.fillStyle='#857d68'; g.fillRect(0,0,w,h);
  for (let x=0;x<w;x+=16){ g.fillStyle = (x/16)%2 ? 'rgba(0,0,0,.06)' : 'rgba(255,255,240,.04)'; g.fillRect(x,0,8,h); }
  speckle(g,w,h,2600,.05);
  stains(g,w,h,6,'rgba(55,35,15,.4)');
  g.strokeStyle='rgba(45,28,15,.28)'; g.lineWidth=2;
  for (let i=0;i<5;i++){ const x=Math.random()*w; let y=rnd(0,h*.5); g.beginPath(); g.moveTo(x,y); y+=rnd(30,120); g.lineTo(x+rnd(-3,3),y); g.stroke(); }
  g.fillStyle='#2e2016'; g.fillRect(0,h-22,w,22); g.fillStyle='#1d140c'; g.fillRect(0,h-25,w,3);
  g.fillStyle='#2e2016'; g.fillRect(0,0,w,9);
}
const wallTex = cvs(256,256,wallBase);
const wallTex2 = cvs(256,256,(g,w,h) => {
  wallBase(g,w,h);
  g.save(); g.fillStyle='rgba(150,10,15,.75)'; g.font='bold 24px serif';
  const txt = ['だるまさんが','ころんだ','みてる','ふりむいて','あそぼ'];
  for (let i=0;i<7;i++){ g.setTransform(1,0,0,1,rnd(10,150),rnd(40,200)); g.rotate(rnd(-.35,.35)); g.fillText(txt[ri(txt.length)],0,0); }
  g.setTransform(1,0,0,1,0,0);
  for (let i=0;i<3;i++){ // 手形
    const x=rnd(40,210), y=rnd(60,190); g.fillStyle='rgba(110,5,10,.6)';
    g.beginPath(); g.ellipse(x,y,13,16,0,0,7); g.fill();
    for (let f=0;f<5;f++){ const a=-2.4+f*.42; g.beginPath(); g.ellipse(x+Math.cos(a)*22,y+Math.sin(a)*24,4,10,a+1.57,0,7); g.fill(); }
  }
  g.restore();
});
const floorTex = cvs(256,256,(g,w,h) => {
  for (let i=0;i<4;i++){
    const c = 72+ri(16); g.fillStyle=`rgb(${c+16},${c},${c-14})`; g.fillRect(0,i*64,w,64);
    g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=1;
    for (let k=0;k<14;k++){ const y=i*64+rnd(4,60); g.beginPath(); g.moveTo(0,y); for (let x=0;x<=w;x+=32) g.lineTo(x,y+rnd(-2,2)); g.stroke(); }
    g.fillStyle='rgba(0,0,0,.65)'; g.fillRect(0,i*64,w,2); g.fillRect(rnd(20,230),i*64,2,64);
  }
  stains(g,w,h,3,'rgba(10,5,0,.35)');
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(N,N);
const ceilTex = cvs(128,128,(g,w,h) => {
  g.fillStyle='#2a2119'; g.fillRect(0,0,w,h);
  g.fillStyle='rgba(0,0,0,.55)'; for (let x=0;x<w;x+=32) g.fillRect(x,0,2,h);
  speckle(g,w,h,400,.06);
});
ceilTex.wrapS = ceilTex.wrapT = THREE.RepeatWrapping; ceilTex.repeat.set(N,N);
const tatamiTex = cvs(128,256,(g,w,h) => {
  g.fillStyle='#6f6c40'; g.fillRect(0,0,w,h);
  for (let y=0;y<h;y+=3){ g.fillStyle=`rgba(0,0,0,${.05+Math.random()*.06})`; g.fillRect(0,y,w,1); }
  g.fillStyle='#25231a'; g.fillRect(0,0,9,h); g.fillRect(w-9,0,9,h);
  g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(0,0,w,2);
  stains(g,w,h,3,'rgba(40,25,10,.45)'); speckle(g,w,h,500,.05);
});
tatamiTex.wrapS = tatamiTex.wrapT = THREE.RepeatWrapping; tatamiTex.repeat.set(4,2);
const paperTex = cvs(64,192,(g,w,h) => {
  g.fillStyle='#e6d8b8'; g.fillRect(0,0,w,h); stains(g,w,h,3,'rgba(120,90,40,.3)');
  g.strokeStyle='#a3141c'; g.lineWidth=3; g.strokeRect(5,5,w-10,h-10);
  g.fillStyle='#a3141c'; g.font='bold 40px serif'; g.textAlign='center'; g.fillText('封',w/2,70);
  g.font='bold 15px serif'; '急急如律令'.split('').forEach((c,i) => g.fillText(c,w/2,98+i*17));
});
const kimTex = cvs(128,128,(g,w,h) => {
  g.fillStyle='#5e0c11'; g.fillRect(0,0,w,h);
  for (let i=0;i<9;i++){ const x=Math.random()*w, y=Math.random()*h, r=rnd(5,9);
    g.fillStyle='rgba(225,190,190,.55)';
    for (let p=0;p<5;p++){ const a=p*1.2566; g.beginPath(); g.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.6,0,7); g.fill(); }
    g.fillStyle='#c9a24a'; g.beginPath(); g.arc(x,y,r*.35,0,7); g.fill(); }
  stains(g,w,h,4,'rgba(10,0,0,.5)'); speckle(g,w,h,300,.06);
});
kimTex.wrapS = kimTex.wrapT = THREE.RepeatWrapping; kimTex.repeat.set(2,2);
const doorTex = cvs(256,256,(g,w,h) => {
  g.fillStyle='#120c08'; g.fillRect(0,0,w,h);
  g.fillStyle='#4a3420';

function hitCircle(x,z,r){
  const x0=Math.floor((x-r)/S), x1=Math.floor((x+r)/S), z0=Math.floor((z-r)/S), z1=Math.floor((z+r)/S);
  for (let ty=z0;ty<=z1;ty++) for (let tx=x0;tx<=x1;tx++) if (wallAt(tx,ty)){
    const cx = clamp(x,tx*S,tx*S+S), cz = clamp(z,ty*S,ty*S+S);
    if ((x-cx)*(x-cx)+(z-cz)*(z-cz) < r*r) return true;
  }
  return false;
}
function moveCircle(o,dx,dz,r){
  let m = 0;
  if (!hitCircle(o.x+dx,o.z,r)){ o.x += dx; m += Math.abs(dx); }
  if (!hitCircle(o.x,o.z+dz,r)){ o.z += dz; m += Math.abs(dz); }
  return m;
}

  for (let i=1;i<n;i++){ const t=i/n; if (isWallAt(ax+(bx-ax)*t, az+(bz-az)*t)) return false; }
  return true;
}

  knock(v,pan){ const t=A.ctx.currentTime, o=dest(pan); for (let i=0;i<3;i++){ nHit(t+i*0.28,0.12,v,'lowpass',260,2,o); tone(t+i*0.28,90,0.1,v*0.6,'sine',o,50); } },
  whisper(v,pan){ const t=A.ctx.currentTime, o=dest(pan); const s=A.ctx.createBufferSource(); s.buffer=A.noise;
    const f=A.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=3; const g=A.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.5); g.gain.linearRampToValueAtTime(v*0.4,t+0.9); g.gain.linearRampToValueAtTime(v,t+1.3); g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
    f.frequency.linearRampToValueAtTime(1500,t+2.2); s.connect(f); f.connect(g); g.connect(o); s.start(t); s.stop(t+2.3); },
  scream(){ const t=A.ctx.currentTime, o=A.master;
    const f = nHit(t,1.5,0.9,'bandpass',3200,1.5,o); f.frequency.exponentialRampToValueAtTime(700,t+1.5);
    tone(t,980,1.4,0.32,'sawtooth',o,190,0.01); tone(t,1040,1.4,0.28,'sawtooth',o,205,0.01); tone(t,60,1.2,0.6,'square',o,30,0.01); },
  door(){ const t=A.ctx.currentTime; nHit(t,0.6,0.3,'bandpass',500,2,A.master); [523,659,784].forEach((f,i)=>tone(t+0.3+i*0.15,f,2,0.08,'sine',A.master)); },
}, { get(o,k){ return (...a) => { if (A.ctx) try { o[k](...a); } catch(e){} }; } });

const keys = {};
let joyId = null, joyX0 = 0, joyY0 = 0, joyV = {x:0,y:0}, lookId = null, lookX = 0, lookY = 0, runHeld = false;
const layer = $('layer');
const locked = () => document.pointerLockElement === layer;
function lockPointer(){ if (!isTouch && layer.requestPointerLock) try { const p = layer.requestPointerLock(); if (p && p.catch) p.catch(()=>{}); } catch(e){} }
function look(dx,dy){ P.yaw -= dx; P.pitch = clamp(P.pitch - dy, -1.3, 1.3); }

layer.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse'){
    if (state !== 'play') return;

    return;
  }
  if (state !== 'play') return;

    joyId = e.pointerId; joyX0 = e.clientX; joyY0 = e.clientY;
    const j = $('joy'); j.style.left = joyX0+'px'; j.style.top = joyY0+'px'; j.style.opacity = 1;
  } else if (lookId === null){ lookId = e.pointerId; lookX = e.clientX; lookY = e.clientY; }
  try { layer.setPointerCapture(e.pointerId); } catch(err){}
});
layer.addEventListener('pointermove', e => {
  if (e.pointerId === joyId){
    let dx = e.clientX-joyX0, dy = e.clientY-joyY0; const m = Math.hypot(dx,dy), R = 50;
    if (m > R){ dx *= R/m; dy *= R/m; }

  } else if (e.pointerId === lookId){
    look((e.clientX-lookX)*0.0062, (e.clientY-lookY)*0.0062); lookX = e.clientX; lookY = e.clientY;
  }
});
function endPtr(e){

const TIPS = [
  'ヒント：足音が「こもって」聞こえたら、それは背後にいる。',

];
function caught(){
  state = 'caught'; ct = 0;
  catchYaw = Math.atan2(-(C.x-P.x), -(C.z-P.z));
  const u = C.mesh.userData; u.faceMat.map = FACE.scream; u.pose.rotation.set(0,0,0);
  u.arms[0].rotation.set(-1.5,0,-.15); u.arms[1].rotation.set(-1.5,0,.15);
  $('hud').hidden = true; $('mob').hidden = true; $('dot').hidden = true; $('danger').style.opacity = 0;

  if (document.exitPointerLock && locked()) document.exitPointerLock();

// ================= 更新 =================
function update(dt){
  elapsed += dt;
  // ---- 移動 ----
  let f = 0, r = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1; if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) r += 1; if (keys.KeyA || keys.ArrowLeft) r -= 1;
  f -= joyV.y; r += joyV.x;
  const m = Math.hypot(f,r); if (m > 1){ f /= m; r /= m; }
  const moving = m > 0.1;
  const running = (runHeld || keys.ShiftLeft || keys.ShiftRight) && moving && P.sta > 0 && f > 0;
  if (running) P.sta = Math.max(0, P.sta - 26*dt); else P.sta = Math.min(100, P.sta + 14*dt);
  const sp = running ? 4.2 : 2.35;
  const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
  const dx = (-sy*f + cy*r)*sp*dt, dz = (-cy*f - sy*r)*sp*dt;
  const mv = moveCircle(P,dx,dz,0.3);
  // 「それ」はぶつかると押し戻される
  { const ex = P.x-C.x, ez = P.z-C.z, ed = Math.hypot(ex,ez); if (ed < 0.62 && ed > 0.001) moveCircle(P,ex/ed*(0.62-ed),ez/ed*(0.62-ed),0.3); }
  if (mv > 0.001){
    P.bob += mv*(running ? 2.6 : 3.2); P.stepAcc += mv;
    if (P.stepAcc > (running ? 0.9 : 0.75)){ P.stepAcc = 0; sfx.step(running ? 0.9 : 0.6); }
  }
  camera.position.set(P.x, EYE + Math.sin(P.bob)*0.035, P.z);
  camera.rotation.set(P.pitch, P.yaw, Math.sin(P.bob*0.5)*0.006);

  // ---- ライト ----
  if (lightOn && battery > 0){ battery = Math.max(0, battery - 0.8*dt); if (battery <= 0){ lightOn = false; $('bLight').classList.remove('on'); showMsg('電池が切れた！ 黄色い光を探せ'); sfx.click(); } }
  const cd = Math.hypot(C.x-P.x, C.z-P.z);
  if (flickOff > 0) flickOff -= dt;
  else if ((C.active && cd < 7 && Math.random() < dt*1.1) || (battery < 15 && Math.random() < dt*0.9)) flickOff = rnd(0.06,0.24);
  spot.intensity = lightEff() ? 2.0*(battery < 15 ? 0.55 + 0.45*Math.random() : 1) : 0;

  // ---- 距離場（プレイヤーへの最短経路） ----
  const pt = Math.floor(P.x/S) + Math.floor(P.z/S)*N;
  if (pt !== pTile){ pTile = pt; dField = bfs(pt%N, (pt/N)|0); }

  updateCreature(dt, cd);
  if (state !== 'play') return;

  // ---- アイテム ----
  for (const t of talismans){
    if (t.taken) continue;
    if (Math.hypot(t.g.position.x-P.x, t.g.position.z-P.z) < 0.9){
      t.taken = true; world.remove(t.g); talCount++; sfx.pick();
      if (talCount >= NEED){
        showMsg('すべて集めた！ 玄関へ戻れ', 3500);
        setTimeout(() => { if (state === 'play') speak('かえさない'); }, 900);
      } else {
        showMsg(`お札を手に入れた（あと ${NEED-talCount} 枚）`);
        const lines = ['みーつけた','どこにいくの','あそぼうよ','ふりむいて'];
        setTimeout(() => { if (state === 'play') speak(lines[ri(lines.length)]); }, 900);
      }
      if (C.active && dField[ctile()] > 9) teleportNear();
      if (!C.active) C.wait = Math.min(C.wait, 1.5);
    }
  }
  for (const b of batteries){
    if (b.taken) continue;
    if (Math.hypot(b.g.position.x-P.x, b.g.position.z-P.z) < 0.85){
      b.taken = true; world.remove(b.g); battery = Math.min(100, battery + 45); sfx.bat(); showMsg('電池を手に入れた');
    }
  }
  // ---- 出口 ----
  if (P.x < S+1.1 && Math.abs(P.z - tc(2)) < 1.3){
    if (talCount >= NEED){ win(); return; }
    if (doorWarn <= 0){ showMsg(`戸が開かない……お札があと ${NEED-talCount} 枚`); doorWarn = 4; }
  }
  if (doorWarn > 0) doorWarn -= dt;

  // ---- 方角の鈴 ----
  bellT -= dt;
  if (bellT <= 0){
    bellT = 7;
    let tx = null, tz = null, bd = 1e9;
    if (talCount >= NEED){ tx = S; tz = tc(2); }
    else for (const t of talismans){ if (t.taken) continue; const d = Math.hypot(t.g.position.x-P.x, t.g.position.z-P.z); if (d < bd){ bd = d; tx = t.g.position.x; tz = t.g.position.z; } }
    if (tx !== null){ const rd = relDir(tx,tz); sfx.bell(clamp(0.16 - rd.d*0.004, 0.04, 0.16), rd.pan); }
  }
  // ---- 環境音 ----
  ambT -= dt;
  if (ambT <= 0){
    ambT = rnd(12,26); const pan = rnd(-1,1), k = ri(3);
    if (k === 0) sfx.knock(0.35,pan); else if (k === 1) sfx.creak(0.12,pan); else sfx.whisper(0.06,pan);
  }
  // ---- 音の緊張感 ----
  if (A.ctx) A.drone.gain.setTargetAtTime(C.active ? 0.05 + clamp(1-cd/12,0,1)*0.12 : 0.04, A.ctx.currentTime, 0.4);
  // ---- HUD ----
  $('tCnt').textContent = talCount;
  $('bBat').style.width = battery + '%'; $('bBat').style.background = battery < 20 ? '#d0503a' : '#d8c88c';
  $('bSta').style.width = P.sta + '%';
  $('hTime').textContent = fmt(elapsed);
}

const ctile = () => Math.floor(C.x/S) + Math.floor(C.z/S)*N;
function teleportNear(){
  const opts = [];
  for (let y=0;y<N;y++) for (let x=0;x<N;x++){
    const d = dField[x+y*N]; if (d < 7 || d > 10 || grid[y][x]) continue;
    if (los(P.x,P.z,tc(x),tc(y))) continue;
    opts.push([x,y]);
  }
  if (!opts.length) return;
  const [x,y] = opts[ri(opts.length)]; C.x = tc(x); C.z = tc(y); C.next = null; C.tp = 8; randomPose(10);
}

function updateCreature(dt, d){
  const mesh = C.mesh;
  if (!C.active){
    C.wait -= dt;
    if (C.wait <= 0){ C.active = true; speak('だるまさんが…ころんだ'); }
    mesh.position.set(C.x,0,C.z); return;
  }
  const seen = isSeen();
  const u = mesh.userData;
  if (seen){
    if (!C.seen){
      if (C.moved > 1.5 && performance.now() - C.lastGiggle > 2500){ const rd = relDir(C.x,C.z); sfx.giggle(clamp(1-d/14,0.15,1), rd.pan); C.lastGiggle = performance.now(); }
      C.moved = 0;
    }
    C.unseen = 0;
    u.faceMat.map = d < 3.5 ? FACE.grin : FACE.calm;
  } else {
    if (C.seen) randomPose(d);
    C.unseen += dt; if (C.tp > 0) C.tp -= dt;
    const pd = dField[ctile()];
    if (pd > 13 && C.unseen > 3 && C.tp <= 0) teleportNear();
    let sp = 2.15 + 0.27*talCount;
    if (!lightOn || battery <= 0) sp *= 1.25;
    if (pd > 9) sp *= 1.7;
    let tx, tz;
    if (d < 4.5 && los(C.x,C.z,P.x,P.z)){ tx = P.x; tz = P.z; C.next = null; }
    else {
      const cur = ctile();
      if (C.next === null || Math.hypot(tc(C.next%N)-C.x, tc((C.next/N)|0)-C.z) < 0.08 || dField[C.next] >= dField[cur]){
        let best = null, bd = dField[cur];
        const cx = cur%N, cy = (cur/N)|0;
        for (const [ox,oy] of shuffle(DIRS.slice())){ const nx=cx+ox, ny=cy+oy; if (wallAt(nx,ny)) continue; const v = dField[nx+ny*N]; if (v >= 0 && v < bd){ bd = v; best = nx+ny*N; } }
        C.next = best;
      }
      if (C.next === null){ tx = P.x; tz = P.z; } else { tx = tc(C.next%N); tz = tc((C.next/N)|0); }
    }
    const vx = tx-C.x, vz = tz-C.z, vl = Math.hypot(vx,vz);
    if (vl > 0.001){
      const step = Math.min(vl, sp*dt);
      const mv = moveCircle(C, vx/vl*step, vz/vl*step, 0.28);
      C.moved += mv; C.stepAcc += mv;
      if (C.stepAcc > 0.7){ C.stepAcc = 0; const rd = relDir(C.x,C.z); const v = Math.pow(clamp(1-rd.d/18,0,1),1.4); if (v > 0.01) sfx.cstep(v, rd.pan, rd.behind); }
    }
    mesh.rotation.y = Math.atan2(P.x-C.x, P.z-C.z);
    u.faceMat.map = d < 3.5 ? FACE.grin : FACE.calm;
    if (Math.hypot(P.x-C.x, P.z-C.z) < 0.85){ C.seen = false; caught(); return; }
  }
  C.seen = seen;
  mesh.position.set(C.x,0,C.z);
  // 鼓動
  C.hb -= dt;
  if (C.hb <= 0){ C.hb = 0.35 + clamp((d-1)/12,0,1)*0.95; if (d < 14) sfx.heart(0.25 + clamp(1-d/14,0,1)*0.55); }
  // 赤いふち
  dangerV += ((!seen && d < 7) ? clamp(1-(d-1)/6,0,0.75) : 0) - dangerV;
  $('danger').style.opacity = dangerV.toFixed(2);
}

function updateCaught(dt){
  ct += dt;
  let dy = catchYaw - P.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  P.yaw += dy*Math.min(1, dt*25); P.pitch += (0 - P.pitch)*Math.min(1, dt*25);
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), dist = 0.85 - Math.min(ct,0.5)*0.6;
  const camY = EYE;
  camera.position.set(P.x, camY, P.z);
  const k = Math.max(0, 1 - ct/1.6);
  camera.rotation.set(P.pitch + rnd(-.05,.05)*k, P.yaw + rnd(-.05,.05)*k, rnd(-.04,.04)*k);
  C.mesh.position.set(P.x+fx*dist, camY-1.365, P.z+fz*dist);
  C.mesh.rotation.y = Math.atan2(-fx,-fz);
  C.mesh.userData.headG.rotation.set(rnd(-.1,.1), rnd(-.1,.1), rnd(-.25,.25));
  spot.intensity = Math.random() < .3 ? 0 : 3;
  $('flash').style.transition = 'none';
  $('flash').style.background = ct < 0.12 ? '#fff' : '#600';
  $('flash').style.opacity = ct < 0.12 ? 0.85 : Math.max(0, 0.35 - ct*0.2) * (Math.random() < .5 ? 1 : 0.3);
  if (ct > 1.6){
    state = 'over'; $('flash').style.opacity = 0; $('flash').style.background = '#fff';
    $('overRes').innerHTML = `お札　${talCount} / ${NEED}　　時間　${fmt(elapsed)}`;
    $('overTip').textContent = TIPS[ri(TIPS.length)];
    setTimeout(() => speak('つかまえた'), 400);
    show('over');
  }
}

function animate(t){
  for (const tl of talismans){ if (tl.taken) continue; tl.g.position.y = 1.15 + Math.sin(t*2+tl.ph)*0.05; tl.g.rotation.y = t*0.8+tl.ph; tl.sp.material.opacity = 0.4 + Math.sin(t*3+tl.ph)*0.15; }
  for (const b of batteries) if (!b.taken) b.g.rotation.y = t;
  if (doorGlow) doorGlow.material.opacity = talCount >= NEED ? 0.35 + Math.sin(t*3)*0.15 : 0;
}

// ---------- ざらつき ----------
const gctx = $('grain').getContext('2d'), gimg = gctx.createImageData(128,128);
let gf = 0;
function grain(){
  if (gf++ % 3) return;
  const d = gimg.data; for (let i=0;i<d.length;i+=4){ const v = Math.random()*255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  gctx.putImageData(gimg,0,0);
}

// タイトル画面の背景用に一度組み立てておく
buildLevel();
camera.position.set(P.x, EYE, P.z); camera.rotation.set(0, P.yaw, 0);

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  if (state === 'play') update(dt);
  else if (state === 'caught') updateCaught(dt);
  else if (state === 'title'){ P.yaw += dt*0.08; camera.rotation.set(0, P.yaw, 0); spot.intensity = Math.random() < .03 ? 0 : 1.6; }
  animate(now/1000);
  renderer.render(scene, camera);
  grain();
}
requestAnimationFrame(loop);
})();
</script>
<script src="../../playtime.js" defer></script>
</body>
