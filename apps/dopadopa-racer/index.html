<meta name="description" content="ネオンの夜道を爆速で駆け抜けろ！車スレスレのニアミス、ドリフトターボ、FEVERで車をぶっ飛ばす。脳汁ドパドパのレースゲーム。">

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b0220;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#safe{position:fixed;left:0;top:0;width:1px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(180deg,rgba(11,2,32,.55),rgba(11,2,32,.15) 40%,rgba(11,2,32,.7));overflow-y:auto}
.logo{display:flex;flex-direction:column;line-height:.92;font-weight:900;letter-spacing:.02em;transform:rotate(-4deg);animation:logo 2.4s ease-in-out infinite}
.logo span{display:block;font-size:min(17vw,96px);background:linear-gradient(180deg,#fff7a8 0%,#ffcf3f 35%,#ff4fb4 70%,#b13cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,80,200,.8)) drop-shadow(0 4px 0 #2a0650)}
.logo .l2{font-size:min(14vw,80px);background:linear-gradient(180deg,#e9ffff 0%,#5ff4ff 45%,#3f7bff 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 10px rgba(60,220,255,.8)) drop-shadow(0 4px 0 #2a0650)}
@keyframes logo{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(-3deg) scale(1.04)}}
.tag{font-weight:800;font-size:13px;letter-spacing:.35em;color:#ffb3ec;text-shadow:0 0 8px #ff3fc8}
.best{font-weight:800;font-size:16px;color:#ffe46b;min-height:1.2em;text-shadow:0 0 8px rgba(255,200,60,.7)}
.btn{font-weight:900;font-size:26px;padding:14px 44px;border-radius:999px;background:linear-gradient(180deg,#ff7ad9,#ff2f9e 55%,#c3127a);box-shadow:0 0 0 3px #ffd1f1 inset,0 6px 0 #6b0a45,0 0 30px rgba(255,60,180,.7);text-shadow:0 2px 0 #7a0c4f;animation:pulse 1.1s ease-in-out infinite}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 3px #ffd1f1 inset,0 2px 0 #6b0a45,0 0 30px rgba(255,60,180,.7)}
.btn.sub{font-size:18px;padding:10px 28px;background:linear-gradient(180deg,#5ff4ff,#2a8cff 60%,#1a4fc0);box-shadow:0 0 0 3px #d4fbff inset,0 5px 0 #0d2a6b,0 0 20px rgba(60,200,255,.6);text-shadow:0 2px 0 #0d2a6b;animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.howto{list-style:none;font-size:14px;line-height:1.55;font-weight:500;background:rgba(20,4,48,.72);border:2px solid rgba(255,90,210,.5);border-radius:16px;padding:12px 16px;max-width:400px;width:100%;text-align:left;box-shadow:0 0 24px rgba(160,40,255,.35)}
.howto li::before{content:"▶ ";color:#5ff4ff}
.howto b{color:#ffe46b}
.r-title{font-weight:900;font-size:min(13vw,64px);color:#fff;text-shadow:0 0 14px #ff3fc8,0 4px 0 #6b0a45;transform:rotate(-3deg)}
.r-label{font-weight:800;letter-spacing:.3em;color:#ffb3ec;font-size:14px;margin-bottom:-12px}
.r-score{font-weight:900;font-size:min(16vw,76px);line-height:1;color:#ffe46b;text-shadow:0 0 18px rgba(255,200,60,.9),0 4px 0 #6b3a00;font-variant-numeric:tabular-nums}
.r-new{font-weight:900;font-size:20px;color:#5ff4ff;text-shadow:0 0 12px #3fd8ff;animation:pulse .6s ease-in-out infinite}
.r-rank{font-weight:900;font-size:min(22vw,110px);line-height:1;height:1em;opacity:0;transform:scale(3) rotate(-25deg)}
.r-rank.show{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-8deg)}}
.r-stats{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-size:15px;background:rgba(20,4,48,.75);border:2px solid rgba(95,244,255,.45);border-radius:16px;padding:12px 18px;min-width:240px;max-width:360px;width:100%}
.r-stats span:nth-child(odd){text-align:left;color:#d9c8ff}
.r-stats span:nth-child(even){text-align:right;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.r-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
#mute{position:fixed;z-index:6;right:calc(10px + env(safe-area-inset-right));top:calc(64px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;background:rgba(20,4,48,.6);border:2px solid rgba(255,255,255,.25);font-size:18px;display:flex;align-items:center;justify-content:center}

<canvas id="cv"></canvas>
<div id="safe"></div>
<button id="mute" aria-label="音のオン・オフ">🔊</button>

<div id="title" class="screen">
  <div class="logo"><span class="l1">ドパドパ</span><span class="l2">レーサー</span></div>
  <div class="tag">NEON DOPAMINE RACER</div>
  <div id="tBest" class="best"></div>
  <button id="btnStart" class="btn">スタート！</button>
  <ul class="howto">
    <li><b>画面の左右</b>をタッチ（←→キー）でハンドル</li>
    <li>車の<b>スレスレ</b>を抜くと NEAR MISS！</li>
    <li>カーブで<b>切り続ける</b>とドリフト → ターボ！</li>
    <li>光る<b>矢印</b>を踏むとブースト、<b>コイン</b>は連続で音階UP</li>
    <li>ゲージMAXで<b>FEVER</b>！車をぶっ飛ばせ</li>
    <li>チェックポイントを通ると時間延長</li>
  </ul>
</div>

<div id="result" class="screen" hidden>
  <div class="r-title">TIME UP!</div>
  <div class="r-label">SCORE</div>
  <div id="rScore" class="r-score">0</div>
  <div id="rNew" class="r-new" hidden>★ NEW RECORD ★</div>
  <div id="rRank" class="r-rank"></div>
  <div id="rStats" class="r-stats"></div>
  <div class="r-btns">
    <button id="btnRetry" class="btn">もう一回！</button>
    <button id="btnTitle" class="btn sub">タイトル</button>
  </div>
</div>
