<meta property="og:title" content="ドボン！マイスライダー">

<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;color:#063247;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;font-weight:800;border:none;cursor:pointer;color:inherit}
.ui{position:fixed;left:0;right:0;pointer-events:none;z-index:5}
.ui>*{pointer-events:auto}

/* タイトル */
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;background:linear-gradient(180deg,rgba(41,182,246,.25),rgba(2,119,189,.55));text-align:center}
#title h1{margin:0;font-size:clamp(34px,11vw,64px);line-height:1.05;color:#fff;text-shadow:0 4px 0 #0277bd,0 8px 18px rgba(0,0,0,.25);letter-spacing:.02em;transform:rotate(-3deg)}
#title h1 small{display:block;font-size:.42em;color:#fff59d;text-shadow:0 3px 0 #e65100}
#title p{margin:0;color:#fff;font-size:15px;text-shadow:0 2px 4px rgba(0,0,0,.35);max-width:340px}
.big{font-size:20px;padding:14px 28px;border-radius:999px;background:#ffeb3b;box-shadow:0 5px 0 #f57f17;min-width:220px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #f57f17}
.sub{font-size:15px;padding:10px 20px;border-radius:999px;background:#fff;box-shadow:0 4px 0 #90a4ae}
.sub:active{transform:translateY(2px);box-shadow:0 2px 0 #90a4ae}
#challengeBox{background:rgba(255,255,255,.95);border-radius:18px;padding:14px 16px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#challengeBox b{color:#d81b60}

/* 作る画面 */
#buildTop{top:0;padding:max(8px,env(safe-area-inset-top)) 10px 0;display:flex;gap:8px;align-items:center}
#nameBtn{flex:1;min-width:0;background:rgba(255,255,255,.92);border-radius:14px;padding:8px 12px;text-align:left;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nameBtn small{display:block;font-size:11px;color:#5c7c8c;font-weight:500}
#infoChip{background:rgba(6,50,71,.8);color:#fff;border-radius:14px;padding:6px 10px;font-size:12px;line-height:1.35;text-align:right;white-space:nowrap}
#buildBottom{bottom:0;padding:0 0 max(8px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(255,255,255,.95) 70%,rgba(255,255,255,0))}
#palette{display:flex;gap:6px;overflow-x:auto;padding:14px 10px 8px;scrollbar-width:none}
#palette::-webkit-scrollbar{display:none}
.pc{flex:0 0 auto;width:66px;height:70px;border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18),inset 0 0 0 3px var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:1.1;padding:4px}
.pc span{font-size:26px;line-height:1}
.pc:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18),inset 0 0 0 3px var(--c)}
#actions{display:flex;gap:6px;padding:2px 10px 0;align-items:center}
#actions .sm{flex:0 0 auto;padding:10px 10px;border-radius:12px;background:#eceff1;font-size:13px}
#goBtn{flex:1;font-size:19px;padding:12px 8px;border-radius:14px;background:#ff5252;color:#fff;box-shadow:0 4px 0 #b71c1c}
#goBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #b71c1c}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:178px;background:rgba(6,50,71,.85);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;white-space:nowrap;z-index:6;pointer-events:none}

/* 滑る画面 */
#rideHud{top:0;padding:max(8px,env(safe-area-inset-top)) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#meter{background:rgba(6,50,71,.78);color:#fff;border-radius:16px;padding:8px 12px;min-width:120px}
#spd{font-size:34px;line-height:1}
#spd small{font-size:13px}
#gtxt{font-size:13px;opacity:.9}
#rideBtns{display:flex;flex-direction:column;gap:6px}
#rideBtns button{background:rgba(255,255,255,.9);border-radius:12px;padding:8px 10px;font-size:13px}
#bubble{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;border-radius:16px;padding:6px 12px;font-size:16px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none}
#bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
#shout{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:7;pointer-events:none;font-size:clamp(34px,12vw,72px);color:#fff;text-shadow:0 4px 0 #d50000,0 0 20px rgba(0,0,0,.4);transform:rotate(-4deg)}
#shout.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(2.4) rotate(-4deg);opacity:0}60%{transform:scale(.92) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;pointer-events:none;font-size:110px;color:#fff;text-shadow:0 6px 0 #0277bd}

/* キャラ選択・結果 */
.modal{position:fixed;inset:0;z-index:30;background:rgba(2,40,60,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:22px;padding:18px 16px;width:100%;max-width:380px;max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card h2{margin:0 0 10px;font-size:20px;text-align:center}
#chars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{border-radius:16px;background:#e1f5fe;padding:10px 6px;font-size:15px;box-shadow:0 3px 0 #81d4fa}
.ch span{display:block;font-size:40px}
.ch small{display:block;font-size:11px;font-weight:500;color:#37627a;margin-top:2px}
#result .card{text-align:center;padding:16px 14px}
#rOutcome{font-size:14px;color:#37627a}
#rTitleLbl{font-size:12px;color:#888;margin-top:6px}
#rTitle{font-size:clamp(22px,7vw,30px);color:#d81b60;margin:2px 0 4px;line-height:1.2}
#rRank{display:inline-block;font-size:44px;line-height:1;width:72px;height:72px;line-height:72px;border-radius:50%;background:#ffeb3b;box-shadow:0 4px 0 #f57f17;margin:4px 0}
#rStats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:12px}
#rStats div{background:#f1f8fc;border-radius:12px;padding:6px}
#rStats b{display:block;font-size:20px}
#rScore{font-size:15px;margin-bottom:6px}
#rScore b{font-size:26px;color:#e65100}
#rBest{font-size:12px;color:#d81b60;min-height:1em}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1;padding:11px 6px;border-radius:12px;font-size:14px;background:#eceff1}
#xBtn{background:#000;color:#fff;font-size:16px;padding:13px}
#imgBtn{background:#29b6f6;color:#fff}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(183,28,28,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#nameModal input{width:100%;font-size:18px;padding:10px;border-radius:12px;border:2px solid #81d4fa;font-family:inherit}
</style>

<body>
<canvas id="c"></canvas>

<div id="title">
  <h1><small>じぶんで作って じぶんで滑る</small>ドボン！<br>マイスライダー</h1>
  <p>ループ、ジャンプ台、ヘアピン、ブースター。<br>好きにつないで、全力で滑れ。<br>コースアウトしても知らない。</p>
  <div id="challengeBox" hidden></div>
  <button class="big" id="startBtn">スライダーを作る</button>
  <button class="sub" id="randBtn">おまかせで1本作る</button>
</div>

<div class="ui" id="buildTop" hidden>
  <button id="nameBtn"><small>スライダーの名前（タップで変更）</small><span id="nameTxt"></span></button>
  <div id="infoChip"></div>
</div>
<div id="hint" hidden>パーツをタップしてつなげよう ／ ドラッグで見回せる</div>
<div class="ui" id="buildBottom" hidden>
  <div id="palette"></div>
  <div id="actions">
    <button class="sm" id="undoBtn">↩ 戻す</button>
    <button class="sm" id="clearBtn">🗑</button>
    <button class="sm" id="diceBtn">🎲</button>
    <button id="goBtn">🏊 滑る！</button>
  </div>
</div>

<div class="ui" id="rideHud" hidden>
  <div id="meter"><div id="spd">0<small> km/h</small></div><div id="gtxt">0.0 G</div></div>
  <div id="rideBtns"><button id="camBtn">🎥 カメラ</button><button id="quitBtn">✋ やめる</button></div>
</div>
<div id="bubble" hidden></div>
<div id="shout" hidden></div>
<div id="countdown" hidden></div>

<div class="modal" id="charModal" hidden>
  <div class="card">
    <h2>だれが滑る？</h2>
    <div id="chars"></div>
    <div class="row"><button id="charCancel">もどる</button></div>
  </div>
</div>

<div class="modal" id="nameModal" hidden>
  <div class="card">
    <h2>スライダーの名前</h2>
    <input id="nameInput" maxlength="14">
    <div class="row"><button id="nameRand">🎲 おまかせ</button><button id="nameOk" style="background:#29b6f6;color:#fff">決定</button></div>
  </div>
</div>

<div class="modal" id="result" hidden>
  <div class="card">
    <div id="rOutcome"></div>
    <div id="rTitleLbl">このスライダーの称号</div>
    <div id="rTitle"></div>
    <div id="rRank"></div>
    <div id="rStats"></div>
    <div id="rScore"></div>
    <div id="rBest"></div>
    <button id="xBtn" style="width:100%;border-radius:12px">𝕏 で自慢する（スライダー付き）</button>
    <div class="row"><button id="imgBtn">📸 画像を保存</button><button id="copyBtn">🔗 URLコピー</button></div>
    <div class="row"><button id="againBtn" style="background:#ffeb3b">もう一回</button><button id="charBtn">キャラ変更</button><button id="editBtn">改造する</button></div>
  </div>
</div>
<div id="toast" hidden></div>
