<title>トレードぐらし</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--bg:#0d1424;--pn:#162039;--pn2:#1d2a4a;--ln:#2a3a63;--tx:#e8eefc;--sub:#8fa0c8;--up:#ff5a64;--dn:#4d9bff;--acc:#ffc93c;--grn:#3ddc97}
html,body{background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.35;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--sub)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}

/* title */
#title{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;
  background:radial-gradient(circle at 50% 30%,#23356b 0%,#0d1424 70%)}
#title h1{font-size:44px;font-weight:900;letter-spacing:.05em;background:linear-gradient(180deg,#fff2b8,#ffc93c 60%,#e89a1c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6b4a0a)}
#title .sub{color:var(--sub);margin:6px 0 18px;font-size:14px}
#title .story{background:rgba(22,32,57,.85);border:1px solid var(--ln);border-radius:14px;padding:14px;font-size:14px;line-height:1.8;max-width:360px;margin-bottom:20px}
#title canvas{width:300px;max-width:100%;height:90px;margin-bottom:10px}
.bigbtn{display:block;width:260px;max-width:100%;margin:8px auto;padding:14px;border-radius:14px;font-size:18px;font-weight:800;background:linear-gradient(180deg,#ffd75e,#f0a91c);color:#3a2600;box-shadow:0 4px 0 #a86c00}
.bigbtn.sec{background:linear-gradient(180deg,#34477e,#253563);color:#fff;box-shadow:0 4px 0 #141f3d}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86c00}

/* header */
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#1b2a52,#121b33);border-bottom:1px solid var(--ln)}
.hd-in{padding:8px 14px 6px}
.hd-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.hd-top b{color:var(--tx);font-size:13px}
.eqrow{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.eq{font-size:26px;font-weight:900;letter-spacing:.01em}
.chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chip{font-size:11px;background:#0d1530;border:1px solid var(--ln);border-radius:999px;padding:2px 8px;color:var(--sub)}
.chip b{color:var(--tx);font-weight:700}
.chip.warn{border-color:var(--up);color:var(--up)}
.tabs{display:flex}
.tabs button{flex:1;padding:9px 0 8px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-left:3px;vertical-align:top}

.sec-t{font-size:12px;color:var(--sub);padding:12px 14px 6px;font-weight:700;letter-spacing:.08em;display:flex;justify-content:space-between}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;margin:0 10px 10px;overflow:hidden}
.pad{padding:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.row:last-child{border-bottom:none}
button.row:active{background:var(--pn2)}
.row .ic{font-size:22px;width:28px;text-align:center;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--sub);font-size:11px}
.row canvas{width:60px;height:28px;flex:none}
.row .pr{text-align:right;min-width:84px;flex:none}
.row .pr b{display:block;font-size:15px}
.row .pr span{font-size:12px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:6px;background:#26355f;color:#cfe0ff;margin-left:4px;vertical-align:1px}
.tag.hold{background:#5a4510;color:#ffe08a}

.news{padding:10px 12px;border-bottom:1px solid var(--ln);font-size:14px;line-height:1.5}
.news:last-child{border-bottom:none}
.news .meta{font-size:11px;color:var(--sub);margin-top:3px}
.rel{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:700}
.rel.h{background:#1f5c43;color:#9ff3cb}.rel.m{background:#5c4d1f;color:#ffe39a}.rel.l{background:#5c1f2a;color:#ffb0b8}.rel.v{background:#3d2a6b;color:#d8c6ff}
.flash{background:#3a1420}

.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--ln)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--sub)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.bar-in{width:100%;max-width:560px;display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#0d1424 70%,rgba(13,20,36,0));pointer-events:auto}
.bar button{border-radius:14px;font-weight:800;padding:14px 0}
#btnAuto{flex:0 0 96px;background:#253563;color:#fff;box-shadow:0 3px 0 #141f3d;font-size:14px}
#btnAuto.on{background:#c9302c;box-shadow:0 3px 0 #7a1512}
#btnNext{flex:1;background:linear-gradient(180deg,#ffd75e,#f0a91c);color:#3a2600;font-size:18px;box-shadow:0 3px 0 #a86c00}
#btnNext:active,#btnAuto:active{transform:translateY(2px)}

/* sheet & popup */
.ov{position:fixed;inset:0;background:rgba(3,6,14,.7);z-index:50;display:flex;justify-content:center}
.ov.bottom{align-items:flex-end}
.ov.center{align-items:center;padding:16px;z-index:60}
.sheet{background:var(--pn);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;border-top:2px solid var(--ln);padding:12px 14px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-hd{display:flex;align-items:center;gap:8px}
.sh-hd .ic{font-size:28px}
.sh-hd .t{flex:1}
.sh-hd .t b{font-size:17px;display:block}
.sh-hd .t small{font-size:12px;color:var(--sub)}
.x{width:36px;height:36px;border-radius:50%;background:#26355f;font-size:18px}
.bigpx{font-size:26px;font-weight:900;margin-top:8px}
.chart{width:100%;height:210px;display:block;margin:8px 0;background:#0f1830;border-radius:10px}
.lbl{font-size:12px;color:var(--sub);margin:10px 0 5px;font-weight:700}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.sel button{padding:7px 10px;border-radius:10px;background:#22305a;font-size:13px;font-weight:700;min-width:44px}
.sel button.on{background:var(--acc);color:#3a2600}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:40px;border-radius:10px;background:#22305a;font-size:20px;font-weight:800}
.qty .v{flex:1;text-align:center;font-size:20px;font-weight:800;background:#0f1830;border-radius:10px;padding:7px 0}
.info{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.6}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;padding:13px 0;border-radius:12px;font-size:16px;font-weight:800;color:#fff}
.b-buy{background:linear-gradient(180deg,#ff6d76,#d93743);box-shadow:0 3px 0 #8a1520}
.b-sell{background:linear-gradient(180deg,#5aa6ff,#2f6fd6);box-shadow:0 3px 0 #173d85}
.b-sub{background:#2a3a66;box-shadow:0 3px 0 #141f3d}
.act button:active:not(:disabled){transform:translateY(2px)}
.pos{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--ln);font-size:13px}
.pos:last-child{border-bottom:none}
.pos .d{flex:1;line-height:1.45}
.pos .cl{padding:7px 10px;border-radius:9px;background:#2a3a66;font-weight:700;font-size:12px;flex:none}
.mini{padding:5px 10px;border-radius:9px;background:#2a3a66;font-weight:700;font-size:12px;margin-top:3px}
.side{font-weight:800;padding:1px 6px;border-radius:5px;font-size:11px;color:#fff}
.side.L{background:#d93743}.side.S{background:#2f6fd6}

.pop{background:var(--pn);border:2px solid var(--ln);border-radius:18px;width:100%;max-width:400px;max-height:88vh;overflow:auto;padding:18px;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.pop h2{font-size:20px;text-align:center;margin-bottom:10px}
.pop .em{font-size:48px;text-align:center}
.pop .body{font-size:14px;line-height:1.7}
.pop .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pop .btns button{padding:12px;border-radius:12px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#ffd75e,#f0a91c);color:#3a2600}
.pop .btns button.sec{background:#2a3a66;color:#fff}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;width:92%;max-width:420px;pointer-events:none}
.toast div{background:rgba(20,30,60,.96);border:1px solid var(--acc);color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:pop .2s}

.life{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.life button{background:#1b2850;border:2px solid var(--ln);border-radius:12px;padding:10px 4px;font-size:12px;line-height:1.5}
.life button.on{border-color:var(--acc);background:#3a3313}
.life button .e{font-size:26px;display:block}
.life button b{display:block;font-size:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{width:56px;height:32px;border-radius:16px;background:#34406a;position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--grn)}.sw.on::after{left:27px}
.gauge{height:12px;border-radius:6px;background:#0f1830;overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;border-radius:6px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln);font-size:13px}
.ach:last-child{border-bottom:none}
.ach .e{font-size:22px;width:30px;text-align:center}
.ach.no{opacity:.35}
.help p{margin-bottom:8px}
.help b{color:var(--acc)}
.empty{padding:18px;text-align:center;color:var(--sub);font-size:13px}
.lnk{color:var(--sub);font-size:12px;text-decoration:underline;padding:8px}
</style>
</head>

<section id="title">
  <canvas id="titleCv"></canvas>

<div class="app" id="game" hidden>

    <nav class="tabs" id="tabs">

      <button data-t="pf">💼 保有</button>
      <button data-t="news">📰 ニュース</button>
      <button data-t="life">🏠 生活</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <button id="btnAuto">⏩ 自動</button>

  </div>
</div>

<div class="ov bottom" id="tradeOv" hidden><div class="sheet" id="sheet"></div></div>
<div class="ov center" id="popOv" hidden><div class="pop" id="pop"></div></div>
<div class="toast" id="toast"></div>
