<style>
[hidden]{display:none!important}
:root{--bg:#fff8e8;--ink:#4a3434;--sub:#8a6f66;--card:#ffffff;--line:#f0dcc4;--accent:#ff8a5c;--accent2:#ffcf5c;--sel:#ffe3a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","M PLUS Rounded 1c","Yu Gothic UI",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--accent2);box-shadow:0 2px 0 #e9b23f;z-index:5;flex:none}
header h1{font-size:17px;margin:0 auto 0 2px;white-space:nowrap;letter-spacing:.02em}
header h1 span{font-size:20px}
@media (max-width:400px){header h1{font-size:15px}header h1 span{display:none}.hb{padding:6px 7px}.hb span{display:none}}
.hb{border:none;background:#fff;border-radius:12px;padding:6px 8px;font-size:13px;font-weight:700;box-shadow:0 2px 0 #e0a53a;display:flex;align-items:center;gap:3px;white-space:nowrap}
.hb:active{transform:translateY(2px);box-shadow:none}
.hb.gp{background:var(--accent);color:#fff;box-shadow:0 2px 0 #d66a3e}
#view{position:relative;flex:1 1 auto;min-height:250px;overflow:hidden;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#nameTag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);border-radius:14px;padding:5px 10px;font-weight:800;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.08);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:none;text-align:left}
#nameTag small{display:block;font-size:10px;font-weight:600;color:var(--sub)}
#acts{position:absolute;left:0;right:0;bottom:6px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:0 6px;pointer-events:none}
#acts button{pointer-events:auto;border:none;background:rgba(255,255,255,.93);border-radius:20px;padding:6px 9px;font-size:12px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.12)}
#acts button:active{transform:translateY(2px);box-shadow:none}
#bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:5px 11px;font-weight:800;font-size:14px;white-space:nowrap;pointer-events:none;z-index:3;animation:bpop .25s ease-out}
#bubble:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
@keyframes bpop{from{transform:translate(-50%,-100%) scale(.4)}to{transform:translate(-50%,-100%) scale(1)}}
#hint{position:absolute;left:50%;top:50px;transform:translateX(-50%);background:rgba(74,52,52,.88);color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.5;width:max-content;max-width:calc(100% - 24px);text-align:center;pointer-events:none;z-index:4;transition:opacity .5s}
#panel{flex:0 0 auto;height:43%;max-height:400px;min-height:210px;background:var(--card);border-top:3px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#tabs{display:flex;overflow-x:auto;gap:4px;padding:6px 6px 0;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 auto;border:none;background:#f6ecdc;border-radius:12px 12px 0 0;padding:7px 10px;font-weight:800;font-size:13px;color:var(--sub)}
#tabs button.on{background:var(--sel);color:var(--ink)}
#opts{flex:1;overflow-y:auto;padding:8px 10px 14px;background:linear-gradient(var(--sel),#fff 26px)}
.og{margin-bottom:10px}
.og h3{font-size:12.5px;margin:0 0 5px;color:var(--sub);display:flex;align-items:center;gap:6px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:700;min-width:0}
.chip i{font-style:normal;font-size:20px;line-height:1.15;height:23px;display:flex;align-items:center}
.chip.on{border-color:var(--accent);background:#fff1e6;box-shadow:0 0 0 2px #ffd2bd inset}
.chip:active{transform:scale(.94)}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--accent)}
.sw label{width:28px;height:28px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.bt{border:none;background:var(--accent2);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;box-shadow:0 2px 0 #e0a53a}
.bt:active{transform:translateY(2px);box-shadow:none}
.bt.o{background:var(--accent);color:#fff;box-shadow:0 2px 0 #d66a3e}
.bt.w{background:#f2ebe1;box-shadow:0 2px 0 #d9ccbb}
.nm{display:flex;gap:6px}
.nm input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-weight:800;font-size:16px;color:var(--ink)}
.prof{background:#fffaf2;border:2px dashed var(--line);border-radius:14px;padding:8px 10px;font-size:12.5px;line-height:1.75}
.prof b{color:var(--accent);margin-right:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(60,40,30,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;max-height:82dvh;border-radius:20px 20px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.sheet h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;justify-content:space-between}
.zk{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.zc{border:2px solid var(--line);border-radius:14px;padding:5px;text-align:center;font-size:11.5px;font-weight:700;background:#fffaf2}
.zc img{width:100%;aspect-ratio:1;border-radius:10px;background:#dff3ff;display:block}
.zc .zn{margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zc .zb{display:flex;gap:3px}
.zc .zb button{flex:1;border:none;border-radius:8px;padding:4px 0;font-size:11px;font-weight:800;background:var(--accent2)}
.zc .zb button.d{background:#eee;flex:0 0 30px}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:20px 0}
/* GP */
body.gpm header,body.gpm #panel,body.gpm #acts,body.gpm #nameTag{display:none!important}
#gp{position:absolute;inset:0;pointer-events:none;z-index:6}
#gpBox{position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:rgba(255,255,255,.96);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;pointer-events:auto;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#gpTitle{font-weight:900;font-size:16px;margin-bottom:3px;color:#c2412d}
#gpText{font-size:13.5px;line-height:1.6;min-height:1.6em}
#gpText .jd{display:block;margin-top:4px;padding:5px 8px;background:#fff6e2;border-radius:10px;font-size:12.5px}
#gpBtns{display:flex;gap:6px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#gpTop{position:absolute;left:0;right:0;top:calc(8px + env(safe-area-inset-top));text-align:center;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none}
#gpQuit{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top));pointer-events:auto;border:none;border-radius:12px;background:rgba(255,255,255,.85);font-size:12px;font-weight:800;padding:5px 9px}
#mg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));width:min(300px,86%);pointer-events:auto}
#mgBar{position:relative;height:30px;border-radius:15px;background:#fff;border:3px solid var(--ink);overflow:hidden}
#mgGood{position:absolute;top:0;bottom:0;left:30%;width:40%;background:#ffe08a}
#mgPerf{position:absolute;top:0;bottom:0;left:42%;width:16%;background:#ff8a5c}
#mgCur{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
#mgBtn{display:block;width:100%;margin-top:10px;border:none;border-radius:18px;padding:14px;font-size:20px;font-weight:900;background:var(--accent);color:#fff;box-shadow:0 4px 0 #c2532a}
#mgBtn:active{transform:translateY(3px);box-shadow:none}
#mgInfo{text-align:center;color:#fff;font-weight:900;text-shadow:0 2px 0 #000;margin-bottom:6px;font-size:14px}
#judge{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:2px #4a3434;text-shadow:0 4px 0 #4a3434;pointer-events:none;white-space:nowrap;z-index:7}
#judge.show{animation:jpop .9s ease-out forwards}
@keyframes jpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.15);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.vl{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.95);border:2px solid var(--ink);border-radius:12px;padding:3px 7px;text-align:center;font-size:11px;font-weight:800;white-space:nowrap;pointer-events:none;min-width:64px}
.vl .vn{max-width:110px;overflow:hidden;text-overflow:ellipsis}
.vl .vv{font-size:15px;color:#c2412d}
.vl .rk{font-size:18px;line-height:1}
.vl.me{border-color:#ff8a5c;box-shadow:0 0 0 3px #ffcf5c}
</style>

  <header>
    <h1><span>🍡</span>ゆるキャラ工房</h1>
    <button class="hb" id="bGacha" title="ランダム">🎲<span>ガチャ</span></button>

    <div id="gp" hidden>
      <div id="gpTop"></div>
      <button id="gpQuit">✕ やめる</button>
      <div id="gpLabels"></div>
      <div id="judge"></div>
      <div id="mg" hidden>
        <div id="mgInfo"></div>
        <div id="mgBar"><div id="mgGood"></div><div id="mgPerf"></div><div id="mgCur"></div></div>

      <div id="gpBox"><div id="gpTitle"></div><div id="gpText"></div><div id="gpBtns"></div></div>

  </div>
  <div id="panel">
    <div id="tabs"></div>
    <div id="opts"></div>
  </div>
</div>
