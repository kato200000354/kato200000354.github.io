<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8302a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ドンドン祭り</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#17305e;--red:#e8302a;--yellow:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1030;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','BIZ UDPGothic','Meiryo',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;color:#222}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;overflow:hidden;background:#7fd0ff}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;outline:none}
.ol{text-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,2px 2px #fff,-2px 2px #fff,2px -2px #fff,-2px -2px #fff}
.tab{position:absolute;left:16px;top:12px;z-index:5;background:linear-gradient(#ff5d3d,#d9221c);color:#fff;font-weight:900;font-size:30px;letter-spacing:2px;padding:4px 30px 8px;border:4px solid #fff;border-radius:26px 26px 26px 8px;box-shadow:0 5px 0 rgba(120,10,10,.5);text-shadow:0 2px 0 #8a1410}
.pill{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(#26478a,#132a55);color:#fff;font-weight:900;font-size:24px;padding:8px 26px 8px 10px;border:4px solid #fff;border-radius:40px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.pill i,.decide i{font-style:normal;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#fff;color:#17305e;font-size:20px;font-weight:900}
.decide i{background:#17305e;color:#fff}
.decide{display:inline-flex;align-items:center;gap:14px;background:linear-gradient(#fff07a,#ffc61a);color:#17305e;font-weight:900;font-size:34px;padding:10px 42px 10px 14px;border:5px solid #17305e;border-radius:50px;box-shadow:0 0 0 4px #fff,0 9px 0 4px rgba(0,0,0,.25)}
.pill:active,.decide:active{transform:translateY(3px)}
.bubble{position:absolute;background:#fff;border:4px solid #17305e;border-radius:24px;padding:12px 18px;font-weight:800;font-size:20px;line-height:1.45;white-space:pre-line;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.jacket{display:grid;place-items:center;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 2px #17305e;font-size:34px;overflow:hidden}
.bounce{animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* title */
#scr-title .logo{position:absolute;left:0;right:0;top:70px;text-align:center;font-weight:900;line-height:1}
#scr-title .logo .l1{display:block;font-size:110px;color:#e8302a;letter-spacing:4px;text-shadow:6px 0 #fff,-6px 0 #fff,0 6px #fff,0 -6px #fff,4px 4px #fff,-4px 4px #fff,4px -4px #fff,-4px -4px #fff,0 12px 0 #17305e,6px 12px 0 #17305e,-6px 12px 0 #17305e}
#scr-title .logo .l2{display:inline-block;margin-top:8px;font-size:150px;color:#ffc21a;text-shadow:7px 0 #17305e,-7px 0 #17305e,0 7px #17305e,0 -7px #17305e,5px 5px #17305e,-5px 5px #17305e,5px -5px #17305e,-5px -5px #17305e,0 16px 0 #fff;transform:rotate(-4deg)}
#scr-title .sub{position:absolute;left:0;right:0;top:20px;text-align:center;font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 0 #17305e,2px 0 #17305e,-2px 0 #17305e,0 -2px #17305e}
#scr-title .tc{position:absolute;width:250px;top:250px}
#scr-title .tc.l{left:40px}#scr-title .tc.r{right:40px;animation-delay:.5s}
#scr-title .menu{position:absolute;left:0;right:0;top:470px;display:flex;flex-direction:column;align-items:center;gap:22px}
#scr-title .hint{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-weight:800;font-size:20px;color:#17305e}
#scr-title .hint span{background:rgba(255,255,255,.88);padding:6px 20px;border-radius:30px;border:3px solid #17305e}
.blink{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}

/* select */
#cats{position:absolute;left:20px;top:92px;width:250px;display:flex;flex-direction:column;gap:8px}
#cats button{display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;background:#fff;border:4px solid #17305e;border-radius:16px;font-weight:900;font-size:23px;color:#17305e;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s}
#cats button b{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#17305e;color:#fff;font-size:21px}
#cats button.on{background:linear-gradient(#ff5d3d,#d9221c);color:#fff;border-color:#fff;box-shadow:0 0 0 4px #b8160f,0 6px 0 4px rgba(0,0,0,.2);transform:translateX(14px)}
#cats button.on b{background:#fff;color:#e8302a}
#songlist{position:absolute;left:300px;top:0;width:620px;height:720px}
.song{position:absolute;left:20px;width:560px;height:74px;display:flex;align-items:center;gap:14px;padding:0 16px 0 8px;background:rgba(255,250,240,.96);border:4px solid #17305e;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:top .18s ease,opacity .18s,transform .18s,left .18s;cursor:pointer}
.song .jacket{width:56px;height:56px;flex:none;font-size:30px}
.song .st{flex:1;min-width:0}
.song .st b{display:block;font-size:25px;font-weight:900;color:#17305e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .st small{display:block;font-size:15px;font-weight:800;color:#556}
.song .cr{font-size:30px;width:40px;text-align:center}
.song.sel{left:0;width:610px;height:98px;background:linear-gradient(#ffe36b,#ffc21a);border-color:#e8302a;box-shadow:0 0 0 4px #fff,0 0 0 8px #e8302a,0 8px 0 6px rgba(0,0,0,.2)}
.song.sel .jacket{width:78px;height:78px;font-size:42px}
.song.sel .st b{font-size:32px}
#bestBox{position:absolute;right:20px;top:12px;display:flex;align-items:center;gap:10px;background:linear-gradient(#26478a,#132a55);border:4px solid #fff;border-radius:40px;padding:4px 26px 4px 6px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#bestBox img{width:60px;height:60px}
#bestBox small{display:block;font-size:15px;font-weight:800;color:#ffd23f}
#bestBox b{font-size:30px;font-weight:900}
#songInfo{position:absolute;right:24px;top:100px;width:320px;background:rgba(255,255,255,.93);border:4px solid #17305e;border-radius:18px;padding:12px 16px;font-weight:800;color:#17305e}
#songInfo .g{display:inline-block;background:#2f8fe8;color:#fff;border-radius:20px;padding:2px 14px;font-size:16px}
#songInfo .bpm{float:right;font-size:18px}
#songInfo .stars{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:16px}
#songInfo .stars span:nth-child(odd){font-weight:900}
#selChara{position:absolute;right:60px;top:330px;width:230px}
#selBtns{position:absolute;right:20px;bottom:18px;display:flex;gap:14px}
#optBtn{position:absolute;left:24px;bottom:22px}

/* difficulty */
#diffHead{position:absolute;left:250px;right:250px;top:70px;height:100px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#26478a,#132a55);border:5px solid #fff;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.25);color:#fff}
#diffHead .t{text-align:center;flex:1}
#diffHead .t b{display:block;font-size:40px;font-weight:900}
#diffHead .t small{font-size:18px;font-weight:800;opacity:.9}
#diffHead button{width:64px;height:100%;font-size:52px;font-weight:900;color:#fff}
#diffCards{position:absolute;left:90px;right:90px;top:210px;display:flex;justify-content:space-between}
.dcard{width:250px;height:300px;border-radius:24px;border:5px solid #17305e;box-shadow:0 0 0 4px #fff,0 8px 0 4px rgba(0,0,0,.2);color:#fff;text-align:center;padding-top:16px;cursor:pointer;transition:transform .15s;position:relative}
.dcard .ic{font-size:76px;line-height:1.15;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.dcard .nm{font-size:34px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.dcard .sr{margin:8px 16px 0;background:rgba(0,0,0,.28);border-radius:12px;padding:4px;font-size:24px;font-weight:900;color:#ffe36b}
.dcard .bs{margin:10px 16px 0;background:rgba(0,0,0,.28);border-radius:12px;padding:4px;font-size:15px;font-weight:800;line-height:1.3}
.dcard .bs b{display:block;font-size:22px}
.dcard .cr{position:absolute;right:10px;top:8px;font-size:32px}
.dcard.d0{background:linear-gradient(#7ad64e,#2f9a2a)}
.dcard.d1{background:linear-gradient(#5cc2ff,#1f72c8)}
.dcard.d2{background:linear-gradient(#ffa13d,#e05a12)}
.dcard.d3{background:linear-gradient(#b57aff,#6a2fc0)}
.dcard.sel{transform:translateY(-14px) scale(1.07);box-shadow:0 0 0 5px #fff,0 0 0 11px #ff3a2a,0 12px 0 8px rgba(0,0,0,.2)}
#diffDesc{position:absolute;left:90px;top:560px;width:690px;height:120px;background:rgba(255,255,255,.95);border:4px solid #17305e;border-radius:22px;padding:18px 26px;font-weight:800;font-size:23px;color:#17305e;line-height:1.5}
#diffOk{position:absolute;right:110px;top:580px}
#diffBack{position:absolute;left:24px;bottom:640px;display:none}

/* result */
#resHead{position:absolute;left:30px;top:56px;font-size:118px;font-weight:900;color:#ffc21a;transform:rotate(-4deg);text-shadow:7px 0 #17305e,-7px 0 #17305e,0 7px #17305e,0 -7px #17305e,5px 5px #17305e,-5px 5px #17305e,5px -5px #17305e,-5px -5px #17305e,0 15px 0 #fff}
#resHead.fail{color:#7fb4ff;font-size:100px}
#resCard{position:absolute;left:60px;top:250px;width:760px;height:330px;background:rgba(255,250,235,.97);border:5px solid #17305e;border-radius:26px;box-shadow:0 0 0 5px #fff,0 10px 0 5px rgba(0,0,0,.2)}
#resSong{position:absolute;left:22px;top:16px;right:22px;display:flex;align-items:center;gap:14px}
#resSong .jacket{width:64px;height:64px}
#resSong b{display:block;font-size:30px;font-weight:900;color:#17305e}
#resSong small{font-size:16px;font-weight:800;color:#556}
#resDiff{margin-left:auto;padding:4px 18px;border-radius:20px;color:#fff;font-weight:900;font-size:20px}
#resScoreBox{position:absolute;left:22px;top:100px;width:360px;height:200px;background:linear-gradient(#26478a,#132a55);border-radius:18px;color:#fff;text-align:center;padding-top:16px}
#resScoreBox small{font-size:20px;font-weight:800}
#resScoreBox .sc{font-size:62px;font-weight:900;line-height:1.25}
#resScoreBox .sc span{font-size:30px}
#resNew{display:inline-block;background:linear-gradient(#fff07a,#ffc61a);color:#b8160f;font-weight:900;font-size:20px;border-radius:20px;padding:3px 20px;animation:blink 1s infinite}
#resJudge{position:absolute;left:400px;top:100px;width:200px;display:flex;flex-direction:column;gap:6px}
#resJudge div{display:flex;justify-content:space-between;align-items:center;background:#fff;border:3px solid #17305e;border-radius:10px;padding:2px 12px;font-weight:900;font-size:23px;color:#17305e}
#resJudge i{font-style:normal;font-size:19px}
#resJudge .g{color:#e06a00}#resJudge .o{color:#555}#resJudge .b{color:#2a5ad8}#resJudge .r{color:#c02a8a}
#resCombo{position:absolute;left:615px;top:120px;width:130px;height:130px;border-radius:50%;background:radial-gradient(#ffe46a,#ff9a1a);border:5px solid #17305e;box-shadow:0 0 0 4px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#17305e}
#resCombo small{font-size:15px}
#resCombo b{font-size:44px;line-height:1}
#resChara{position:absolute;right:60px;top:300px;width:260px}
#resBubble{right:300px;top:600px;left:auto}
#resBubble{position:absolute;left:840px;top:120px;right:auto}
#resOk{position:absolute;right:60px;bottom:30px}
#resAuto{position:absolute;left:840px;top:80px;color:#fff;background:#e8302a;border-radius:10px;padding:2px 12px;font-weight:900}

/* option */
#optPanel{position:absolute;left:150px;top:78px;width:820px;height:620px;background:rgba(255,255,255,.96);border:5px solid #17305e;border-radius:26px;padding:12px 30px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.orow{display:flex;align-items:center;min-height:72px;border-bottom:3px dashed #c8d4ea;gap:16px}
.orow:last-child{border:none}
.orow>label{width:210px;flex:none;font-weight:900;font-size:22px;color:#17305e;display:flex;align-items:center;gap:10px}
.orow>label b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#17305e;color:#fff;font-size:19px}
.vol{flex:1;display:flex;flex-direction:column;gap:4px}
.vol div{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;color:#17305e}
.vol span:first-child{width:70px}.vol output{width:60px;text-align:right}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:16px;border-radius:10px;background:#d5e2f5;border:2px solid #17305e;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#2f8fe8;border:4px solid #fff;box-shadow:0 0 0 2px #17305e}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#2f8fe8;border:4px solid #fff;box-shadow:0 0 0 2px #17305e}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:96px;padding:8px 14px;border-radius:24px;border:3px solid #17305e;background:#fff;font-weight:900;font-size:18px;color:#17305e}
.seg button.on{background:#2f8fe8;color:#fff;border-color:#17305e}
.ohint{font-size:15px;font-weight:800;color:#667;margin-left:6px}
.offs{display:flex;align-items:center;gap:12px}
.offs button{width:52px;height:44px;border-radius:14px;border:3px solid #17305e;background:#fff;font-size:24px;font-weight:900;color:#17305e}
.offs output{width:110px;text-align:center;font-weight:900;font-size:22px;color:#17305e}
#charaSel{display:flex;gap:12px}
#charaSel button{width:78px;height:78px;border-radius:16px;border:4px solid #c8d4ea;background:#fff;padding:2px}
#charaSel button img{width:100%;height:100%}
#charaSel button.on{border-color:#e8302a;box-shadow:0 0 0 3px #ffd23f}
#charaName{font-weight:900;color:#17305e;font-size:18px}
#optBack{position:absolute;left:24px;bottom:22px}
#optChara{position:absolute;right:20px;bottom:20px;width:200px}
#optBubble{right:40px;top:400px}

/* pause */
#pause{background:rgba(10,10,40,.55)}
#pause .box{position:absolute;left:390px;top:150px;width:500px;padding:30px;background:#fffaf0;border:5px solid #17305e;border-radius:26px;box-shadow:0 0 0 5px #fff;display:flex;flex-direction:column;gap:18px;align-items:center}
#pause h2{font-size:44px;font-weight:900;color:#17305e}
#pause button{width:340px;justify-content:center}

#rotate{position:fixed;inset:0;z-index:50;background:#e8302a;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-weight:900;font-size:22px;text-align:center;padding:20px}
#rotate .ph{font-size:70px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#rotate button{background:#fff;color:#e8302a;border-radius:30px;padding:10px 26px;font-weight:900;font-size:18px}
@media (orientation:portrait) and (pointer:coarse){body:not(.ignore-rot) #rotate{display:flex}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="scr-title" class="screen on">
    <div class="sub">わいわい和太鼓リズムゲーム</div>
    <div class="logo"><span class="l1">ドンドン</span><span class="l2">祭り</span></div>
    <img class="tc l bounce" id="tcL" alt="">
    <img class="tc r bounce" id="tcR" alt="">
    <div class="menu">
      <button class="decide" data-act="start"><i>A</i>あそぶ</button>
      <button class="pill" data-act="option"><i>⚙</i>オプション</button>
    </div>
    <div class="hint"><span class="blink">F・J ＝ ドン（赤）　D・K ＝ カッ（青）　／　スマホはタップであそべるよ</span></div>
  </div>

  <div id="scr-select" class="screen">
    <div class="tab">曲をえらぶ</div>
    <div id="bestBox"><img id="bestChara" alt=""><div><small>ベストスコア</small><b id="selBest">0点</b></div></div>
    <div id="cats"></div>
    <div id="songlist"></div>
    <div id="songInfo"></div>
    <img id="selChara" class="bounce" alt="">
    <button class="pill" id="optBtn" data-act="option"><i>⚙</i>オプション</button>
    <div id="selBtns">
      <button class="pill" data-act="back"><i>B</i>もどる</button>
      <button class="pill" data-act="ok"><i>A</i>決定</button>
    </div>
  </div>

  <div id="scr-diff" class="screen">
    <div class="tab">むずかしさをえらぶ</div>
    <div id="diffHead"><button data-act="prevSong">‹</button><div class="t"><b id="dTitle"></b><small id="dArtist"></small></div><button data-act="nextSong">›</button></div>
    <div id="diffCards"></div>
    <div id="diffDesc"></div>
    <button class="decide" id="diffOk" data-act="ok"><i>A</i>はじめる</button>
    <button class="pill" style="position:absolute;right:24px;top:16px" data-act="back"><i>B</i>もどる</button>
  </div>

  <div id="scr-result" class="screen">
    <div class="tab">リザルト</div>
    <div id="resHead">クリア！</div>
    <div id="resAuto" hidden>オートプレイ</div>
    <div id="resCard">
      <div id="resSong"><div class="jacket" id="resJacket"></div><div><b id="resTitle"></b><small id="resArtist"></small></div><span id="resCrown" style="font-size:36px"></span><span id="resDiff"></span></div>
      <div id="resScoreBox"><small>スコア</small><div class="sc"><b id="resScore">0</b><span>点</span></div><div id="resNew">自己ベスト更新！</div></div>
      <div id="resJudge">
        <div><i class="g">良</i><b id="rG">0</b></div>
        <div><i class="o">可</i><b id="rO">0</b></div>
        <div><i class="b">不可</i><b id="rB">0</b></div>
        <div><i class="r">連打数</i><b id="rR">0</b></div>
      </div>
      <div id="resCombo"><small>最大コンボ</small><b id="rC">0</b></div>
    </div>
    <img id="resChara" class="bounce" alt="">
    <div class="bubble" id="resBubble"></div>
    <button class="decide" id="resOk" data-act="ok"><i>A</i>次へ</button>
  </div>

  <div id="scr-option" class="screen">
    <div class="tab">オプション</div>
    <div id="optPanel">
      <div class="orow"><label><b>♪</b>音量</label>
        <div class="vol">
          <div><span>BGM</span><input type="range" id="vBgm" min="0" max="100" step="5"><output id="oBgm"></output></div>
          <div><span>効果音</span><input type="range" id="vSe" min="0" max="100" step="5"><output id="oSe"></output></div>
        </div></div>
      <div class="orow"><label><b>⌨</b>キー配置</label><div class="seg" id="sKeys"></div></div>
      <div class="orow"><label><b>◎</b>入力判定</label><div class="seg" id="sJudge"></div></div>
      <div class="orow"><label><b>»</b>スクロール</label><div class="seg" id="sSpeed"></div></div>
      <div class="orow"><label><b>⏱</b>タイミング</label><div class="offs"><button id="offM">−</button><output id="oOff"></output><button id="offP">＋</button></div><span class="ohint">音よりおそく感じたら＋</span></div>
      <div class="orow"><label><b>▶</b>オート</label><div class="seg" id="sAuto"></div></div>
      <div class="orow"><label><b>☺</b>キャラ</label><div id="charaSel"></div><span id="charaName"></span></div>
    </div>
    <img id="optChara" class="bounce" alt="">
    <div class="bubble" id="optBubble" style="right:30px;top:400px">自分に合った<br>設定で遊ぼう！</div>
    <button class="pill" id="optBack" data-act="back"><i>B</i>もどる</button>
  </div>

  <div id="pause" class="screen">

function drawChar(c,x,y,s,ci,o){

    c.strokeStyle='#222';c.lineWidth=lw*3;c.beginPath();c.moveTo(sx*s*0.85,s*0.25);c.lineTo(hx,hy);c.stroke();
    c.strokeStyle='#fff';c.lineWidth=lw*1.4;c.beginPath();c.moveTo(sx*s*0.85,s*0.25);c.lineTo(hx,hy);c.stroke();
    c.fillStyle='#fff';c.strokeStyle='#222';c.lineWidth=lw;circ(c,hx,hy,s*0.17);c.fill();c.stroke();
  }

  const fx=s*0.05;

    else{c.fillStyle='#fff';c.strokeStyle='#222';c.lineWidth=lw*0.8;c.beginPath();c.ellipse(X,ey,s*0.15,s*0.19,0,0,7);c.fill();c.stroke();
      c.fillStyle='#222';c.beginPath();c.ellipse(X,ey+s*0.03,s*0.095,s*0.125,0,0,7);c.fill();
      c.fillStyle='#fff';circ(c,X+s*0.03,ey-s*0.03,s*0.04);c.fill();}
  }
  c.fillStyle='rgba(255,150,170,.8)';
  for(const sx of[-1,1]){c.beginPath();c.ellipse(fx+sx*s*0.56,s*0.17,s*0.12,s*0.07,0,0,7);c.fill();}
  const my=s*0.2;c.strokeStyle='#222';c.lineWidth=lw;
  if(o.sad){c.beginPath();c.moveTo(fx-s*0.17,my+s*0.17);c.quadraticCurveTo(fx,my-s*0.05,fx+s*0.17,my+s*0.17);c.stroke();}
  else{c.fillStyle='#7a1010';c.beginPath();c.moveTo(fx-s*0.21,my);c.quadraticCurveTo(fx,my+s*0.5,fx+s*0.21,my);c.closePath();c.fill();c.stroke();

const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],yo:[0,2,5,7,9]};

const MEL_RH=['x.x.x...x.x.x...','x..x..x.x...x...','x.x.x.x.x...x...','x...x.x.x.x.x...','x..x..x...x.x.x.','x.xx.x..x.xx.x..','x.x.x.x.x.x.x.x.','x...x...x.x.x...','x..x..x.x.x.x...'];

  const sc=SCALES[song.scale],base=66+pc(song.root-66),notes=[];
  for(let o=-1;o<2;o++)for(const d of sc)notes.push(base+o*12+d);
  const lo=Math.floor(sc.length*0.6),hi=sc.length*2+1;

      else if(st==='chip'){if(s%2===0){const m=br+12+[0,7,12,7][(s/2)%4];add(t,(d,T)=>iTone(d,T,mtof(m),step*1.6,'square',0.05,1800));}}

      else if(st==='ondo'){if(s===0||s===6||s===8||s===12){add(t,(d,T)=>iTone(d,T,mtof(br),step*1.8,'triangle',0.32));}}
      else if(s%2===0){const m=br+(st==='four'&&s%4===2?12:0);add(t,(d,T)=>iTone(d,T,mtof(m),step*1.7,'sawtooth',intro?0.12:0.16,700));}

function endBar(add,song,t0,bar){

function buildSong(song){

  const R=rng(hashStr(song.id));const beat=60/song.bpm,step=beat/4,bar=beat*4;

  const mel={A:makeMelody(song,'A',R),B:makeMelody(song,'B',R),S:makeMelody(song,'S',R)};

// ---- 既存の名曲（メロディ譜面つき） ----
// 記法: 音名+(#/b)+オクターブ:長さ(16分音符いくつ分)。オクターブと長さは省略すると直前の値を引きつぐ。r=休符
function parseMel(str){
  const out=[];let s=0,oct=4,dur=4;
  for(const tk of str.trim().split(/\s+/)){if(tk==='|')continue;
    const m=tk.match(/^([a-gr])([#b]?)(\d)?(?::(\d+))?$/);if(!m)throw new Error('bad token '+tk);
    if(m[3])oct=+m[3];if(m[4])dur=+m[4];
    if(m[1]!=='r'){const b={c:0,d:2,e:4,f:5,g:7,a:9,b:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);out.push({s,len:dur,m:12*(oct+1)+b});}

}

function buildFixedChart(song,diff){

// ================= charts =================
const POOLS=[
  ['x...............','x.......x.......','x...x...x.......','x.......x...x...','x...x...x...x...'],
  ['x.......x...x...','x...x...x...x...','x...x.x.x...x...','x.x.x...x...x...','x.x.x...x.x.x...','x...x.x.x.x.x...'],
  ['x...x.x.x.x.x...','x.x.x...x.x.x...','x.x.x.x.x...x.x.','x.xxx...x.xxx...','x.x.x.x.x.x.x.x.','x.x.xxx.x.x.xxx.','xxx.x.x.xxx.x.x.'],
  ['x.x.xxx.x.x.xxx.','x.xxx.x.x.xxx.x.','xxx.xxx.x.x.xxx.','x.xxx.xxx.xxx.x.','xxxxx.x.xxxxx.x.','x.x.xxxxx.x.xxxx','xxxxxxx.xxx.xxx.']];
function limitPattern(p,bpm,diff){
  const a=p.split('');const rate=bpm/15;
  if(diff<3&&rate>10.4){for(let s=1;s<16;s+=2)a[s]='.';}
  else if(diff===3&&rate>11.3){let run=0;for(let s=0;s<16;s++){if(a[s]==='x'){run=(s>0&&a[s-1]==='x')?run+1:1;if(run>3){a[s]='.';run=0;}}else run=0;}}
  return a.join('');
}
function colorize(p,diff,R){
  const out=[];let gc='d';
  for(let s=0;s<16;s++){if(s%4===0)gc=R()<0.42?'k':'d';if(p[s]!=='x'){out.push('.');continue;}
    let c=gc;if(diff>=2&&R()<0.35)c=c==='d'?'k':'d';if(diff<=1&&R()<0.3)c=R()<0.42?'k':'d';out.push(c);}
  return out;
}
function buildChart(song,diff){
  if(song.mel)return buildFixedChart(song,diff);
  const M=buildSong(song);const R=rng(hashStr(song.id+'#'+diff));const pool=POOLS[diff],n=pool.length;
  const range={A:[0,Math.ceil(n/2)],B:[Math.floor(n/4),Math.ceil(n*3/4)],S:[Math.floor(n/2),n]};
  const pat={};
  for(const sec of['A','B','S']){const[a,b]=range[sec];pat[sec]=[0,1,2,3].map(()=>{const pi=a+Math.floor(R()*(b-a));const p=limitPattern(pool[pi],song.bpm,diff);return{pi,p,c:colorize(p,diff,R)};});
    const v=Math.min(n-1,b);const vp=limitPattern(pool[v],song.bpm,diff);pat[sec].vari={p:vp,c:colorize(vp,diff,R)};}
  const notes=[];const step=M.step,bar=M.bar;let runStart=0;const lastS=LAYOUT.lastIndexOf('S');
  LAYOUT.forEach((sec,b)=>{
    if(b===0||LAYOUT[b-1]!==sec)runStart=b;const i=(b-runStart)%8;const t0=b*bar;
    if(sec==='I')return;
    if(sec==='E'){if(i===0)notes.push({t:t0,type:'don',big:true});return;}
    if(sec==='B'&&i===7){notes.push({t:t0,type:'roll',end:t0+12*step});return;}
    if(b===lastS){const ends=diff===0?[[0,'don'],[8,'don']]:[[0,'don'],[4,'ka'],[8,'don'],[12,'ka']];
      for(const[s,ty]of ends)notes.push({t:t0+s*step,type:ty,big:true});return;}
    const P=i===7?pat[sec].vari:pat[sec][i%4];
    for(let s=0;s<16;s++){if(P.p[s]!=='x')continue;
      const big=(i===0&&s===0&&diff>=1)||(sec==='S'&&s===0&&i%4===0&&diff<=1);
      notes.push({t:t0+s*step,type:P.c[s]==='k'?'ka':'don',big});}
  });
  notes.sort((a,b)=>a.t-b.t);return notes;
}

const dayBG=off(W,H),nightBG=off(W,H);
function buildBG(){
  // ---- day ----
  let c=dayBG.getContext('2d');let R=rng(7);
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3aaef0');g.addColorStop(0.6,'#aee6ff');g.addColorStop(1,'#e6f8ff');c.fillStyle=g;c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=0.18;c.fillStyle='#fff';for(let k=0;k<14;k++){c.beginPath();c.moveTo(640,-200);const a=k/14*Math.PI;c.arc(640,-200,1600,a,a+0.08);c.closePath();c.fill();}c.restore();
  // fuji
  c.fillStyle='#8eb4e8';c.beginPath();c.moveTo(-50,560);c.quadraticCurveTo(200,470,420,540);c.lineTo(420,600);c.lineTo(-50,600);c.fill();
  g=c.createLinearGradient(0,330,0,560);g.addColorStop(0,'#3e6fc4');g.addColorStop(1,'#86b0ea');c.fillStyle=g;
  c.beginPath();c.moveTo(800,560);c.lineTo(1010,345);c.quadraticCurveTo(1045,325,1080,345);c.lineTo(1320,560);c.fill();
  c.fillStyle='#fff';c.beginPath();c.moveTo(1010,345);c.quadraticCurveTo(1045,325,1080,345);c.lineTo(1112,378);c.lineTo(1090,372);c.lineTo(1072,392);c.lineTo(1055,370);c.lineTo(1036,394);c.lineTo(1020,368);c.lineTo(996,385);c.lineTo(978,378);c.closePath();c.fill();
  // ground hills
  c.fillStyle='#7cd06a';c.beginPath();c.moveTo(0,600);c.quadraticCurveTo(320,540,640,590);c.quadraticCurveTo(960,540,1280,590);c.lineTo(1280,720);c.lineTo(0,720);c.fill();
  // sakura trees
  for(const[tx,flip]of[[70,1],[1210,-1],[330,1]]){
    const sc=tx===330?0.6:1;c.fillStyle='#8a4b2a';c.beginPath();c.moveTo(tx-12*sc,640);c.lineTo(tx+12*sc,640);c.lineTo(tx+6*sc,480);c.lineTo(tx+60*flip*sc,430);c.lineTo(tx-4*sc,470);c.lineTo(tx-8*sc,480);c.fill();
    for(let k=0;k<26;k++){const a=R()*Math.PI*2,r=R()*110*sc;c.fillStyle=['#ffc4dc','#ffaacb','#ffd8e8','#ff9cc2'][k%4];circ(c,tx+Math.cos(a)*r*1.2,450*1+(tx===330?40:0)+Math.sin(a)*r*0.6-20,(28+R()*24)*sc);c.fill();}
  }
  // waves
  c.fillStyle='#2a77cf';c.fillRect(0,650,W,70);
  for(let row=0;row<4;row++){const y=650+row*20;for(let x=-40+(row%2)*30;x<W+60;x+=60){
    for(const[r,col]of[[30,'#2a77cf'],[30,'#fff'],[26,'#3d8fe6'],[20,'#fff'],[16,'#5aa8f2'],[10,'#fff'],[6,'#7cc0ff']]){c.fillStyle=col;c.beginPath();c.arc(x,y+30,r,Math.PI,0);c.fill();}}}
  // ---- night ----
  c=nightBG.getContext('2d');R=rng(11);
  g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#16123c');g.addColorStop(0.4,'#3b1d5e');g.addColorStop(0.68,'#9a3a5c');g.addColorStop(0.8,'#f2944a');c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let k=0;k<140;k++){c.fillStyle=`rgba(255,255,255,${0.3+R()*0.7})`;circ(c,R()*W,R()*420,R()*1.6+0.4);c.fill();}
  c.fillStyle='#2b1a45';c.beginPath();c.moveTo(0,520);for(let x=0;x<=W;x+=80)c.lineTo(x,470+Math.sin(x*0.013)*25+R()*12);c.lineTo(W,560);c.lineTo(0,560);c.fill();
  // yagura
  const yx=640;c.fillStyle='#3a1b10';for(const px of[-130,-50,50,130])c.fillRect(yx+px-8,430,16,140);
  c.fillStyle='#5a2a14';c.fillRect(yx-170,420,340,22);
  for(let k=0;k<12;k++){c.fillStyle=k%2?'#fff':'#e8302a';c.fillRect(yx-160+k*(320/12),442,320/12,38);}
  c.fillStyle='#c9302c';c.beginPath();c.moveTo(yx-190,360);c.lineTo(yx+190,360);c.lineTo(yx+150,320);c.lineTo(yx-150,320);c.fill();
  c.fillStyle='#2a1208';c.fillRect(yx-200,356,400,10);for(const px of[-140,140])c.fillRect(yx+px-6,360,12,60);
  // stalls
  for(const sx of[30,1010]){c.fillStyle='#3a1b10';c.fillRect(sx,470,240,110);c.fillStyle='#ffcf6a';c.fillRect(sx+16,500,208,50);
    for(let k=0;k<8;k++){c.fillStyle=k%2?'#fff':'#e8302a';c.beginPath();c.moveTo(sx-10+k*32.5,452);c.lineTo(sx+22.5+k*32.5,452);c.lineTo(sx+22.5+k*32.5,486);c.quadraticCurveTo(sx+6+k*32.5,498,sx-10+k*32.5,486);c.fill();}
    txt(c,sx<500?'たこ焼き':'かき氷',sx+120,525,28,'#7a2a10');}
  g=c.createLinearGradient(0,560,0,H);g.addColorStop(0,'#6a3018');g.addColorStop(1,'#2a1208');c.fillStyle=g;c.fillRect(0,560,W,H-560);
  c.fillStyle='rgba(255,200,120,.12)';c.beginPath();c.ellipse(640,640,520,70,0,0,7);c.fill();
}
const petals=Array.from({length:38},(_,i)=>({x:Math.random()*W,y:Math.random()*H,s:5+Math.random()*6,v:30+Math.random()*40,a:Math.random()*7,w:Math.random()*2+1}));
const clouds=Array.from({length:5},(_,i)=>({x:i*300+Math.random()*100,y:60+Math.random()*180,s:0.7+Math.random()*0.6,v:6+Math.random()*10}));
let particles=[];
function firework(x,y,col){for(let k=0;k<46;k++){const a=k/46*Math.PI*2,sp=140+Math.random()*120;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.1+Math.random()*0.4,t:0,col,sz:3});}}
function confetti(){for(let k=0;k<120;k++)particles.push({x:Math.random()*W,y:-20-Math.random()*300,vx:(Math.random()-0.5)*80,vy:120+Math.random()*120,life:5,t:0,col:['#ff4a4a','#ffd23f','#4fc3f0','#56c95a','#ff8fc0'][k%5],sz:7,conf:true,rot:Math.random()*7});}
function drawParticles(c,dt){
  particles=particles.filter(p=>(p.t+=dt)<p.life);
  for(const p of particles){
    if(p.conf){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*5;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;c.fillRect(-p.sz,-p.sz*0.5,p.sz*2,p.sz);c.restore();continue;}
    p.vx*=0.97;p.vy=p.vy*0.97+60*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    c.globalAlpha=Math.max(0,1-p.t/p.life);c.fillStyle=p.col;circ(c,p.x,p.y,p.sz);c.fill();c.globalAlpha=1;}
}
function drawDay(c,T,dt){
  c.drawImage(dayBG,0,0,W,H);
  for(const cl of clouds){cl.x+=cl.v*dt;if(cl.x>W+200)cl.x=-260;c.fillStyle='rgba(255,255,255,.92)';
    for(const[dx,dy,r]of[[0,0,40],[45,-18,50],[95,0,42],[50,12,40]]){circ(c,cl.x+dx*cl.s,cl.y+dy*cl.s,r*cl.s);c.fill();}}
  drawLanternRow(c,22,34,T,0.85);
  for(const p of petals){p.y+=p.v*dt;p.x+=Math.sin(T*p.w+p.a)*20*dt+10*dt;p.a+=dt;if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}
    c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle='#ffb3cf';c.beginPath();c.ellipse(0,0,p.s,p.s*0.55,0,0,7);c.fill();c.restore();}
  drawParticles(c,dt);
}
function drawLanternRow(c,y0,sag,T,scale){
  c.strokeStyle='#3a2a1a';c.lineWidth=2;c.beginPath();
  for(let x=-20;x<=W+20;x+=20){const u=((x+20)%320)/320;const y=y0+Math.sin(u*Math.PI)*sag;x===-20?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();
  for(let k=0;k<9;k++){const x=-20+160+k*160;if(k%2===0){}const u=((x+20)%320)/320;const y=y0+Math.sin(u*Math.PI)*sag;
    c.save();c.translate(x,y);c.rotate(Math.sin(T*1.6+k)*0.07);const s=scale;
    c.fillStyle='rgba(255,170,80,.22)';circ(c,0,28*s,40*s);c.fill();
    c.fillStyle='#222';c.fillRect(-11*s,2*s,22*s,7*s);c.fillRect(-11*s,46*s,22*s,7*s);
    c.fillStyle=k%3===2?'#fff4dc':'#e8402a';c.beginPath();c.ellipse(0,28*s,20*s,21*s,0,0,7);c.fill();
    c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1.5;for(const dx of[-10,0,10]){c.beginPath();c.ellipse(0,28*s,Math.abs(dx)*s+1,21*s,0,0,7);c.stroke();}
    c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(-7*s,20*s,4*s,8*s,0,0,7);c.fill();
    c.restore();}
}

const LANE={y:178,h:132,hitX:412};const LCY=LANE.y+LANE.h/2;
const DRUM={x:640,y:608,r:105};
function gameTime(){return AC.currentTime-G.startAt-(AC.outputLatency||0)-S.offset/1000;}
function startGame(song,diff){
  initAudio();if(!AC)return;stopMusic();particles=[];
  const M=buildSong(song),notes=buildChart(song,diff);
  const hits=notes.filter(n=>n.type!=='roll');const wsum=hits.reduce((a,n)=>a+(n.big?2:1),0);
  const frac=[0.55,0.65,0.72,0.78][diff];const gain=100/(hits.length*frac);
  G={song,diff,M,notes,rolls:notes.filter(n=>n.type==='roll'),N:hits.length,unit:Math.ceil(1e6/wsum/10)*10,

function judgeNote(n,k){
  const g=G;n.judged=true;const now=performance.now()/1000;
  if(k<2){g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    const w=n.big?2:1;if(k===0){g.good++;g.score+=g.unit*w;g.gauge+=g.gain;}else{g.ok++;g.score+=Math.round(g.unit*w/20)*10;g.gauge+=g.gain/2;}
    g.flyers.push({type:n.type,big:n.big,t0:now});g.rings.push({t0:now,k,big:n.big});
    if(g.combo>=50&&g.combo%50===0)g.banner={t0:now,s:g.combo+'コンボ！'};}
  else{g.bad++;g.combo=0;g.gauge-=g.lose;n.missed=true;}
  g.gauge=clamp(g.gauge,0,100);g.jt={k,t0:now};
}
function hit(kind,side){
  seHit(kind);
  if(mode!=='play'||!G||G.paused)return;
  G.flash[kind]=performance.now()/1000;G.flash.side=side;
  if(G.done||G.auto)return;
  const t=gameTime(),Wd=JW[S.judge]||JW.normal;
  for(const r of G.rolls)if(t>=r.t-0.03&&t<=r.end){G.roll++;G.score+=100;G.rollPop=performance.now()/1000;G.rollCur=r;r.cnt=(r.cnt||0)+1;return;}
  let best=null;
  for(let i=G.ptr;i<G.notes.length;i++){const n=G.notes[i];if(n.judged||n.type==='roll')continue;const dt=t-n.t;if(dt>Wd[2])continue;if(dt<-Wd[2])break;best=n;break;}
  if(!best)return;
  const adt=Math.abs(t-best.t);
  if(best.type!==kind){if(adt<=Wd[1])judgeNote(best,2);return;}
  judgeNote(best,adt<=Wd[0]?0:adt<=Wd[1]?1:2);
}
function updateGame(){
  const g=G,t=gameTime(),Wd=JW[S.judge]||JW.normal,now=performance.now()/1000;
  if(g.auto){
    for(let i=g.ptr;i<g.notes.length;i++){const n=g.notes[i];if(n.t>t)break;if(!n.judged&&n.type!=='roll'){seHit(n.type);g.flash[n.type]=now;g.flash.side=n.t*7%2|0;judgeNote(n,0);}}
    for(const r of g.rolls)if(t>=r.t&&t<=r.end&&now-g.lastAutoRoll>1/14){g.lastAutoRoll=now;seDon();g.flash.don=now;g.flash.side^=1;g.roll++;g.score+=100;g.rollPop=now;g.rollCur=r;r.cnt=(r.cnt||0)+1;}
  }
  for(let i=g.ptr;i<g.notes.length;i++){const n=g.notes[i];if(n.t>t)break;
    if(n.type==='roll'){if(t>n.end)n.judged=true;}else if(!n.judged&&t-n.t>Wd[2])judgeNote(n,2);}
  while(g.ptr<g.notes.length&&g.notes[g.ptr].judged)g.ptr++;
  // fireworks on chorus downbeats
  const b=Math.floor(t/g.M.bar);
  if(b!==g.lastBar){g.lastBar=b;if(g.M.layout[b]==='S'&&b%2===0)firework(150+Math.random()*980,40+Math.random()*90,['#ffd23f','#ff6a8a','#7fe0ff','#a8ff7a'][b%4]);}
  if(!g.done&&t>g.endT)finishGame();
}
function finishGame(){
  const g=G;g.done=true;g.clear=g.gauge>=80;g.fc=g.bad===0;
  g.banner={t0:performance.now()/1000,s:g.fc?'フルコンボ！':g.clear?'クリア！':'しっぱい…',big:true};
  seJingle(g.clear);
  g.newBest=false;
  if(!g.auto){const key=g.song.id+'_'+g.diff;const b=BEST[key]||{score:0,clear:false,fc:false};
    if(g.score>b.score){g.newBest=true;b.score=g.score;}b.clear=b.clear||g.clear;b.fc=b.fc||(g.fc&&g.clear);BEST[key]=b;save();}
  setTimeout(()=>{if(mode==='play'&&G===g)showResult();},2600);
}

    c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(DX[k],650,48,10,0,0,7);c.fill();
    drawChar(c,DX[k],590-bb,46,ci,{arm,arm2:g.combo>=10?(ph<0.5?0.3:1):0.25,happy:g.gauge>=80&&ph<0.5});
    const cc=CHARAS[ci];c.fillStyle='#fff';rr(c,DX[k]-74,664,148,34,17);c.fill();c.strokeStyle=cc.dark;c.lineWidth=4;c.stroke();
    c.fillStyle=cc.col;rr(c,DX[k]-74,664,48,34,17);c.fill();txt(c,(k+1)+'P',DX[k]-50,681,18,'#fff');txt(c,cc.name,DX[k]+24,681,17,'#17305e');});
  drawDrum(c,now);
  // pause button
  c.fillStyle='rgba(23,48,94,.9)';circ(c,1250,30,22);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();c.fillStyle='#fff';c.fillRect(1242,20,5,20);c.fillRect(1253,20,5,20);
  // start banner / hints
  if(t<0){const a=clamp(-t/0.5,0,1);c.globalAlpha=a;
    c.fillStyle='rgba(23,48,94,.85)';rr(c,380,LANE.y+20,760,LANE.h-40,20);c.fill();
    txt(c,'♪ '+g.song.title+'　はじまるよ！',760,LCY,36,'#fff','#e8302a',8);c.globalAlpha=1;
    const hint=g.touched?'まんなか＝ドン　ふち・はし＝カッ':(S.keys==='A'?'F・J＝ドン　　D・K＝カッ':'D・K＝ドン　　F・J＝カッ');
    c.fillStyle='rgba(255,255,255,.9)';rr(c,440,456,400,40,20);c.fill();txt(c,hint,640,476,20,'#17305e');}
  if(AC.state!=='running'&&!g.paused){c.fillStyle='rgba(10,10,40,.6)';c.fillRect(0,0,W,H);
    c.fillStyle='#fff';rr(c,340,300,600,110,30);c.fill();c.strokeStyle='#17305e';c.lineWidth=5;c.stroke();
    txt(c,'画面をタップしてスタート！',640,355,36,'#e8302a');}
  // banner
  if(g.banner){const k=now-g.banner.t0;const dur=g.banner.big?2.6:1.2;
    if(k<dur){const s=Math.min(1,k*6);const y=g.banner.big?LCY:LANE.y-40;c.save();c.translate(g.banner.big?760:280,y);c.scale(s,s);
      txt(c,g.banner.s,0,0,g.banner.big?72:30,g.banner.big?'#ffd23f':'#fff','#17305e',g.banner.big?14:7);c.restore();}else g.banner=null;}
}

// ================= input =================
const LEFT_KEYS=['KeyD','KeyF'];
document.addEventListener('keydown',e=>{
  const k=e.code;const km=KEYS[S.keys]||KEYS.A;const isDon=km.don.includes(k),isKa=km.ka.includes(k);
  const side=LEFT_KEYS.includes(k)?0:1;
  if(['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Backspace'].includes(k)&&e.target.tagName!=='INPUT')e.preventDefault();
  if(mode==='play'){
    if(G&&G.paused){if(k==='Escape'||k==='Enter'||isDon)resumeGame();return;}
    if(k==='Escape'){pauseGame();return;}
    if(e.repeat)return;
    if(isDon){initAudio();hit('don',side);}else if(isKa){initAudio();hit('ka',side);}
    return;
  }
  const ok=k==='Enter'||k==='Space'||isDon,back=k==='Escape'||k==='Backspace';
  const up=k==='ArrowUp'||(isKa&&side===0),down=k==='ArrowDown'||(isKa&&side===1);
  if(mode==='title'){if(ok){initAudio();seDon();go('select');}else if(k==='KeyO'){initAudio();go('option');}}
  else if(mode==='select'){
    if(up){selIdx=(selIdx-1+catSongs().length)%catSongs().length;seKa();renderSelect();}
    else if(down){selIdx=(selIdx+1)%catSongs().length;seKa();renderSelect();}
    else if(k==='ArrowLeft'||k==='ArrowRight'){selCat=(selCat+(k==='ArrowLeft'?-1:1)+CATS.length)%CATS.length;selIdx=0;seKa();renderSelect();}
    else if(ok)decideSong();else if(back){stopMusic();seKa();go('title');}
  }
  else if(mode==='diff'){
    if(k==='ArrowLeft'||(isKa&&side===0)){curDiff=(curDiff+3)%4;seKa();renderDiff();}
    else if(k==='ArrowRight'||(isKa&&side===1)){curDiff=(curDiff+1)%4;seKa();renderDiff();}
    else if(k==='ArrowUp')changeSong(-1);else if(k==='ArrowDown')changeSong(1);
    else if(ok)startFromDiff();else if(back){seKa();go('select');}
  }
  else if(mode==='result'){if(ok||back){seDon();go('select');}}
  else if(mode==='option'){if(back){seKa();go(prevMode);}}
});
// buttons
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(document.activeElement&&document.activeElement.tagName==='BUTTON')document.activeElement.blur();
  if(!b)return;initAudio();const a=b.dataset.act;
  if(a==='start'){seDon();go('select');}
  else if(a==='option'){seDon();go('option');}
  else if(a==='back'){seKa();if(mode==='select'){stopMusic();go('title');}else if(mode==='diff')go('select');else if(mode==='option')go(prevMode);else go('title');}
  else if(a==='ok'){if(mode==='select')decideSong();else if(mode==='diff')startFromDiff();else if(mode==='result'){seDon();go('select');}}
  else if(a==='prevSong')changeSong(-1);else if(a==='nextSong')changeSong(1);
  else if(a==='resume')resumeGame();else if(a==='retry')retryGame();else if(a==='quit')quitGame();
});
$('#scr-title').addEventListener('click',e=>{if(e.target.closest('button'))return;initAudio();seDon();go('select');});
// touch / mouse on canvas during play
cv.addEventListener('pointerdown',e=>{
  if(mode!=='play'||!G)return;e.preventDefault();initAudio();
  const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(Math.hypot(x-1250,y-30)<40){pauseGame();return;}
  if(G.paused)return;
  if(AC.state!=='running'){AC.resume();return;}
  if(y<100)return;
  if(e.pointerType==='touch')G.touched=true;
  const d=Math.hypot(x-DRUM.x,y-DRUM.y);let kind;
  if(d<DRUM.r*0.78)kind='don';else if(d<DRUM.r+30)kind='ka';else kind=(x<330||x>950)?'ka':'don';
  hit(kind,x<640?0:1);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pauseGame();});
document.addEventListener('contextmenu',e=>e.preventDefault());

// ================= loop =================
buildBG();
let lastT=performance.now();
function frame(nowMs){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(nowMs-lastT)/1000);lastT=nowMs;const T=nowMs/1000;
  pumpMusic();
  if(mode==='play'&&G&&AC){if(!G.paused)updateGame();drawGame(ctx,T,G.paused?0:dt);}
  else drawDay(ctx,T,dt);
}
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
</script>
