<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゆけむり湯屋</title>
<meta name="description" content="毎日お風呂に入りたくなる、湯屋づくりアプリ。入ると湯屋にお客さんがやってきて、出たら明日の入浴剤をひけます。">
<meta name="theme-color" content="#16132a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --bg:#16132a;--bg2:#211c3b;--card:#2a2448;--card2:#352d58;
  --text:#f7eedf;--sub:#c4b6a2;--lamp:#ffb85c;--accent:#e8664a;--ok:#7fd1a8;
  --wood:#8a5a32;--wood2:#5e3b1e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;min-height:100dvh;overflow-x:hidden;
  background:radial-gradient(120% 60% at 50% 0%,#2b2350 0%,var(--bg) 60%) fixed;}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
header h1{font-size:20px;font-weight:900;letter-spacing:.08em;color:var(--lamp);text-shadow:0 0 12px rgba(255,184,92,.4)}
.streak{font-size:13px;background:var(--card);padding:6px 10px;border-radius:999px;color:var(--sub);white-space:nowrap}
.streak b{color:var(--lamp);font-size:16px}

/* ---------- scene ---------- */
.scene{position:relative;height:250px;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.04)}
.wall{position:absolute;inset:0;background:
  linear-gradient(rgba(20,16,40,.35),rgba(20,16,40,.15)),
  repeating-linear-gradient(0deg,transparent 0 21px,rgba(60,80,95,.45) 21px 22px),
  repeating-linear-gradient(90deg,transparent 0 21px,rgba(60,80,95,.45) 21px 22px),
  linear-gradient(#b9cdd6,#9fb7c2);}
.mural{position:absolute;left:0;right:0;top:0;height:118px;background:linear-gradient(#6fa8d6,#a9d2ea);overflow:hidden}
.mural::before{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:0;height:0;
  border-left:120px solid transparent;border-right:120px solid transparent;border-bottom:110px solid #3f6aa1}
.mural::after{content:"";position:absolute;left:50%;bottom:66px;transform:translateX(-50%);width:0;height:0;
  border-left:46px solid transparent;border-right:46px solid transparent;border-bottom:42px solid #f4f7fb;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.mural .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;height:12px}
.floor{position:absolute;left:0;right:0;bottom:0;height:40px;background:repeating-linear-gradient(90deg,#6c7b85 0 30px,#5f6d77 30px 31px)}
.noren{position:absolute;top:0;left:50%;transform:translateX(-50%);width:170px;height:46px;display:flex;gap:3px;z-index:6}
.noren span{flex:1;background:linear-gradient(#3a5f9a,#2c4a7c);border-radius:0 0 6px 6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.noren span:nth-child(2){font-size:22px}
.tub{position:absolute;left:18px;right:18px;bottom:22px;height:120px;z-index:3}
.tub-in{position:absolute;inset:10px 12px 0;border-radius:6px 6px 14px 14px;overflow:hidden;background:#cfe1e7}
.water{position:absolute;left:0;right:0;bottom:0;height:20%;transition:height 1s ease,background 1s;z-index:4;opacity:.88}
.water::before{content:"";position:absolute;left:-10%;right:-10%;top:-6px;height:12px;border-radius:50%;background:inherit;filter:brightness(1.15);animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(4%)}}
.water.stars{background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 60%,#fff,transparent),radial-gradient(1px 1px at 80% 25%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#ffe,transparent)!important}
.tub-edge{position:absolute;left:0;right:0;top:0;height:14px;border-radius:6px;background:linear-gradient(var(--wood),var(--wood2));z-index:6;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tub-side{position:absolute;left:0;width:12px;top:8px;bottom:0;background:linear-gradient(90deg,var(--wood2),var(--wood));z-index:6;border-radius:0 0 0 10px}
.tub-side.r{left:auto;right:0;transform:scaleX(-1)}
.guests{position:absolute;left:12px;right:12px;bottom:0;height:100%;z-index:3;pointer-events:none}
.guest{position:absolute;font-size:30px;transform:translateX(-50%);animation:bob 2.6s ease-in-out infinite;transition:bottom 1s}
.guest.pop{animation:popin .7s ease-out,bob 2.6s ease-in-out .7s infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px)}}
@keyframes popin{0%{transform:translateX(-50%) translateY(30px);opacity:0}100%{transform:translateX(-50%);opacity:1}}
.steam{position:absolute;left:0;right:0;bottom:120px;height:120px;z-index:7;pointer-events:none}
.steam i{position:absolute;bottom:0;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(7px);animation:rise 5s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.8}100%{transform:translateY(-120px) scale(1.8);opacity:0}}
.spirit{position:absolute;left:8px;bottom:118px;width:62px;z-index:8;animation:float 3s ease-in-out infinite;cursor:pointer}
@keyframes float{50%{transform:translateY(-5px)}}
.deco{position:absolute;z-index:5;font-size:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.lantern-glow{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(rgba(255,184,92,.35),transparent 70%);z-index:2;pointer-events:none}
.rocks{position:absolute;left:6px;right:6px;bottom:126px;height:16px;z-index:5;display:flex;justify-content:space-between;align-items:flex-end}
.rocks b{display:block;background:#6b6f73;border-radius:50% 50% 20% 20%;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.sign{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:6;background:linear-gradient(#f3cf5a,#c9952a);color:#5a3510;font-weight:900;font-size:13px;padding:3px 12px;border-radius:4px;letter-spacing:.2em;box-shadow:0 2px 6px rgba(0,0,0,.35)}

/* ---------- bubble / cards ---------- */
.bubble{position:relative;margin:14px 4px 0;background:#fff8ec;color:#4a3426;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bubble::before{content:"";position:absolute;left:30px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff8ec}
.bubble small{display:block;color:#a07a5c;font-size:11px;margin-bottom:2px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.card h2{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:8px;letter-spacing:.05em}
.salt-row{display:flex;align-items:center;gap:12px}
.chip{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset 0 -6px 10px rgba(0,0,0,.2),0 0 0 3px rgba(255,255,255,.08)}
.salt-name{font-size:20px;font-weight:900}
.salt-desc{font-size:13px;color:var(--sub);margin-top:2px;line-height:1.5}
.stars-r{color:var(--lamp);font-size:12px;letter-spacing:2px}
.big-btn{display:block;width:100%;padding:16px;border-radius:16px;font-size:18px;font-weight:900;letter-spacing:.06em;
  background:linear-gradient(#f07f5c,#d9533a);color:#fff;box-shadow:0 5px 0 #9c3524,0 8px 18px rgba(232,102,74,.35);margin-top:14px;transition:transform .1s}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #9c3524}
.big-btn.blue{background:linear-gradient(#5aa7d8,#3b7fb5);box-shadow:0 5px 0 #24557d,0 8px 18px rgba(59,127,181,.35)}
.big-btn.gold{background:linear-gradient(#f5cf5e,#d79e2c);color:#4a2b08;box-shadow:0 5px 0 #8f6514,0 8px 18px rgba(245,207,94,.35)}
.sub-btn{display:block;width:100%;padding:12px;border-radius:14px;font-size:14px;font-weight:700;color:var(--sub);background:var(--card2);margin-top:10px}
.mins{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mins span{font-size:13px;color:var(--sub)}
.mins .opts{display:flex;gap:6px}
.mins button{padding:7px 11px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:700}
.mins button.on{background:var(--lamp);color:#3a2610}
.timer{font-size:46px;font-weight:900;text-align:center;letter-spacing:.04em;font-variant-numeric:tabular-nums;margin:4px 0}
.timer-sub{text-align:center;color:var(--sub);font-size:13px}
.checks{display:grid;gap:8px;margin-top:12px}
.check{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--card2);font-size:15px;font-weight:700;text-align:left;width:100%}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--sub);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
.check.done{color:var(--sub)}
.check.done .box{background:var(--ok);border-color:var(--ok);color:#16302a}
.progress{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lamp),#ffd99a);border-radius:999px;transition:width .6s}
.next-deco{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.next-deco b{color:var(--text)}

/* result */
.stamp-wrap{display:flex;justify-content:center;margin:6px 0 4px}
.stamp{width:120px;height:120px;border-radius:50%;border:5px solid #e0473a;color:#e0473a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;transform:rotate(-12deg);background:rgba(224,71,58,.06);animation:stamp .5s cubic-bezier(.3,1.6,.6,1)}
.stamp b{font-size:24px;letter-spacing:.1em}
.stamp small{font-size:11px}
@keyframes stamp{0%{transform:rotate(-12deg) scale(2.4);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.guest-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.gl{background:var(--card2);border-radius:12px;padding:6px 10px;font-size:13px;display:flex;align-items:center;gap:6px}
.gl em{font-style:normal;font-size:22px}
.gl .new{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:999px;font-weight:900}
.quote{font-size:13px;color:var(--sub);margin-top:10px;line-height:1.6}

.gacha{perspective:800px;display:flex;justify-content:center;margin-top:8px}
.gcard{width:200px;height:260px;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.gcard.flip{transform:rotateY(180deg)}
.gface{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center}
.gback{background:repeating-linear-gradient(45deg,#3a5f9a 0 10px,#33558b 10px 20px);border:4px solid #f5cf5e;font-size:40px;font-weight:900;color:#fff}
.gfront{transform:rotateY(180deg);background:#fff8ec;color:#4a3426;border:4px solid #f5cf5e}
.gfront .chip{width:90px;height:90px;margin-bottom:12px}
.gfront .salt-name{font-size:22px}
.gfront .salt-desc{color:#8a6a52}
.gfront.sr{box-shadow:0 0 30px #f5cf5e,0 0 60px rgba(245,207,94,.5)}
.shine{animation:shine 1.2s ease-in-out infinite}
@keyframes shine{50%{filter:brightness(1.25)}}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:18px}
.cal-head button{width:38px;height:38px;border-radius:50%;background:var(--card2);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dw{font-size:11px;color:var(--sub);text-align:center;padding-bottom:2px}
.cal .dw:first-child{color:#e88}.cal .dw:last-child{color:#8bd}
.day{aspect-ratio:1;border-radius:10px;background:var(--card2);position:relative;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 4px;font-size:10px;color:var(--sub);overflow:hidden}
.day.today{box-shadow:0 0 0 2px var(--lamp)}
.day .dot{position:absolute;inset:auto 0 0 0;height:100%;border-radius:10px;opacity:.9}
.day .dot.half{height:50%;border-radius:0 0 10px 10px}
.day span{position:relative;z-index:1;text-shadow:0 0 3px rgba(0,0,0,.6);color:#fff}
.day.empty{background:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--lamp)}
.stat small{font-size:11px;color:var(--sub)}
.legend{font-size:12px;color:var(--sub);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;background:#9fd4e8}
.legend i.h{background:linear-gradient(transparent 50%,#9fd4e8 50%)}

/* zukan */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.z{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;line-height:1.4;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.z .chip{width:38px;height:38px}
.z em{font-style:normal;font-size:34px;line-height:1}
.z.no{opacity:.45}
.z small{color:var(--sub);font-size:10px}
.deco-list{display:grid;gap:6px}
.dl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card2);font-size:14px}
.dl em{font-style:normal;font-size:22px;width:28px;text-align:center}
.dl small{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.dl.no{opacity:.45}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(22,19,42,.94);backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.06);padding-bottom:env(safe-area-inset-bottom);z-index:50}
nav .in{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;padding:10px 0 12px;font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button em{font-style:normal;font-size:22px;filter:grayscale(.6);opacity:.7}
nav button.on{color:var(--lamp)}
nav button.on em{filter:none;opacity:1}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#fff8ec;color:#4a3426;font-weight:900;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:99;transition:transform .4s;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.foot{text-align:center;color:var(--sub);font-size:11px;margin-top:22px;opacity:.7}
.foot button{text-decoration:underline;color:var(--sub);font-size:11px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>♨ ゆけむり湯屋</h1>
    <div class="streak" id="streak"></div>
  </header>

  <!-- 湯屋 -->
  <section id="v-home">
    <div class="scene" id="scene">
      <div class="wall"></div>
      <div class="mural" id="mural" hidden><i class="cloud" style="left:12%;top:24px;width:50px"></i><i class="cloud" style="right:14%;top:40px;width:64px"></i></div>
      <div class="floor"></div>
      <div id="decos"></div>
      <div class="steam" id="steam"></div>
      <div class="tub">
        <div class="tub-in">
          <div class="guests" id="guests"></div>
          <div class="water" id="water"></div>
        </div>
        <div class="tub-edge"></div><div class="tub-side"></div><div class="tub-side r"></div>
      </div>
      <svg class="spirit" id="spirit" viewBox="0 0 64 64" aria-label="ゆげまる">
        <path d="M32 6c-4 6-2 9 0 12-14 1-24 12-24 26 0 8 6 14 14 14h20c8 0 14-6 14-14 0-14-10-25-24-26 2-3 4-6 0-12z" fill="#fffdf8" stroke="#e8dccb" stroke-width="2"/>
        <ellipse cx="24" cy="40" rx="3" ry="4" fill="#4a3426"/><ellipse cx="40" cy="40" rx="3" ry="4" fill="#4a3426"/>
        <circle cx="25" cy="38.5" r="1" fill="#fff"/><circle cx="41" cy="38.5" r="1" fill="#fff"/>
        <ellipse cx="18" cy="47" rx="4" ry="2.5" fill="#ffb3a7" opacity=".8"/><ellipse cx="46" cy="47" rx="4" ry="2.5" fill="#ffb3a7" opacity=".8"/>
        <path d="M28 47q4 4 8 0" stroke="#4a3426" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M12 26q-6-6 0-12M52 26q6-6 0-12" stroke="#fffdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
      </svg>
    </div>
    <div class="bubble" id="bubble"><small>ゆげまる</small><span id="say"></span></div>
    <div id="panel"></div>
    <div class="card">
      <div class="next-deco"><span>湯屋レベル <b id="lv"></b></span><span id="nextDeco"></span></div>
      <div class="progress"><i id="lvbar"></i></div>
    </div>
  </section>

  <!-- カレンダー -->
  <section id="v-cal" hidden>
    <div class="card">
      <div class="cal-head"><button id="calPrev" aria-label="前の月">‹</button><b id="calTitle"></b><button id="calNext" aria-label="次の月">›</button></div>
      <div class="cal" id="cal"></div>
      <div class="legend"><span><i></i>湯船（色は入浴剤）</span><span><i class="h"></i>シャワーだけ</span></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <!-- 図鑑 -->
  <section id="v-book" hidden>
    <div class="card"><h2 id="hSalt">入浴剤ずかん</h2><div class="zgrid" id="zSalt"></div></div>
    <div class="card"><h2 id="hGuest">お客さんずかん</h2><div class="zgrid" id="zGuest"></div></div>
    <div class="card"><h2>湯屋のしつらえ</h2><div class="deco-list" id="zDeco"></div></div>
    <div class="foot">記録はこの端末の中だけに保存されます。<br><button id="reset">記録をすべて消す</button></div>
  </section>
</div>

<nav><div class="in">
  <button data-v="home" class="on"><em>♨️</em>湯屋</button>
  <button data-v="cal"><em>📅</em>カレンダー</button>
  <button data-v="book"><em>📖</em>ずかん</button>
</div></nav>
<div class="toast" id="toast"></div>
