<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a120c">
<title>なぞときの館</title>
<meta name="description" content="古い洋館に閉じこめられた！10枚の扉にかけられた「なぞ」を解いて、館の宝をさがす謎解きゲーム。">
<style>
:root{
  --bg:#1a120c;--bg2:#2a1d13;--card:#f4ead6;--card2:#e9dcc0;--ink:#2b1e14;--sub:#7a6450;
  --gold:#d9a441;--gold2:#f2cf7a;--red:#c0392b;--green:#3f8f5a;--line:#c9b38d;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--card)}
body{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;line-height:1.6;
  background:radial-gradient(ellipse at 50% -10%,#4a3220 0%,var(--bg) 60%) fixed;min-height:100svh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.screen{min-height:100svh}

/* タイトル */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
.logo-sub{letter-spacing:.4em;color:var(--gold);font-size:13px}
.logo{font-size:clamp(38px,11vw,60px);font-weight:900;letter-spacing:.08em;color:var(--gold2);
  text-shadow:0 2px 0 #6b4a1c,0 0 24px rgba(242,207,122,.35);margin:6px 0 4px}
.mansion{width:min(300px,80vw);margin:18px 0}
.story{color:#d9c9ab;font-size:15px;max-width:380px;margin-bottom:22px}
.bigbtn{display:block;width:min(300px,100%);margin:8px auto;padding:14px 18px;border-radius:14px;font-weight:800;font-size:18px;
  background:linear-gradient(#e7b85a,#b9822c);color:#2b1a08;box-shadow:0 4px 0 #6b4a1c,0 8px 18px rgba(0,0,0,.4)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a1c}
.subbtn{display:block;width:min(300px,100%);margin:8px auto;padding:10px;border-radius:12px;border:1px solid #6b5238;color:#d9c9ab;font-size:15px}

/* 扉の一覧 */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.bar h2{font-size:20px;color:var(--gold2)}
.pill{border:1px solid #6b5238;border-radius:999px;padding:4px 12px;font-size:13px;color:#d9c9ab;white-space:nowrap}
.doors{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.door{aspect-ratio:3/5;border-radius:40% 40% 6px 6px / 22% 22% 6px 6px;position:relative;
  background:linear-gradient(#7a4f2c,#5a371c);border:3px solid #3a2412;box-shadow:inset 0 0 0 3px #8d6038;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold2);font-weight:900;font-size:18px}
.door::after{content:"";position:absolute;right:16%;top:55%;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.door .ic{font-size:22px;line-height:1.2}
.door.locked{filter:grayscale(1) brightness(.45)}
.door.locked .ic{font-size:18px}
.door.done{background:linear-gradient(#2c1a0e,#160d06);box-shadow:inset 0 0 18px rgba(242,207,122,.5)}
.door.final{grid-column:span 5;aspect-ratio:auto;height:110px;border-radius:50% 50% 8px 8px / 60% 60% 8px 8px;
  background:linear-gradient(#8a2e22,#561911);box-shadow:inset 0 0 0 3px #b0503e;font-size:16px}
.door.final.locked{filter:grayscale(1) brightness(.4)}
.door.next{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 0 0 3px #8d6038,0 0 18px 4px rgba(242,207,122,.55)}}
.door.final.next{animation:glow2 1.6s ease-in-out infinite}
@keyframes glow2{50%{box-shadow:inset 0 0 0 3px #b0503e,0 0 22px 6px rgba(242,120,90,.55)}}
.note{margin-top:18px;color:#a8957a;font-size:13px;text-align:center}
.memo{margin-top:16px;background:rgba(244,234,214,.06);border:1px dashed #6b5238;border-radius:12px;padding:10px 14px;font-size:14px;color:#d9c9ab}
.memo b{color:var(--gold2)}
.memo ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:4px}

/* なぞ画面 */
.paper{background:var(--card);color:var(--ink);border-radius:6px;padding:20px 16px;position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 40px rgba(160,120,60,.25);
  background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(150,110,60,.08) 31px 32px)}
.paper .no{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;
  padding:2px 14px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.1em;white-space:nowrap}
.paper h3{text-align:center;font-size:19px;margin:4px 0 12px}
.q{text-align:center;font-size:16px}
.big{font-size:clamp(30px,9vw,42px);font-weight:900;letter-spacing:.12em;margin:10px 0}
.row{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:8px 0}
.box{display:inline-block;width:1.15em;height:1.15em;border:2px solid var(--ink);vertical-align:-0.2em;background:#fff8e8}
.word{font-size:24px;font-weight:800;letter-spacing:.08em;padding:2px 8px;border-bottom:2px solid var(--line)}
.lead{font-size:14px;color:var(--sub);text-align:center;margin-top:10px}
.mirror{display:inline-block;transform:scaleX(-1);font-size:clamp(40px,12vw,56px);font-weight:900;letter-spacing:.15em;
  padding:8px 22px;border-radius:50%/40%;background:linear-gradient(135deg,#dfe9ef,#b8c8d2 60%,#eef4f7);border:6px solid #b08a4a;color:#40525e}
.red{color:var(--red)}
.ans-area{margin-top:16px;display:flex;gap:8px}
.ans-area input{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);
  background:#fffaf0;color:var(--ink);text-align:center;letter-spacing:.1em}
.ans-area input:focus{outline:none;border-color:var(--gold)}
.ans-area button{padding:0 18px;border-radius:10px;background:var(--ink);color:var(--gold2);font-weight:800;font-size:17px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{min-height:1.6em;text-align:center;margin-top:8px;font-weight:700}
.msg.ng{color:var(--red)}
.tools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.tbtn{border:1px solid #6b5238;border-radius:999px;padding:6px 14px;font-size:14px;color:#d9c9ab}
.tbtn:disabled{opacity:.4}
.hints{margin-top:12px}
.hint{background:#fff3d6;color:var(--ink);border-left:4px solid var(--gold);border-radius:6px;padding:8px 12px;margin-top:8px;font-size:15px}
.hint.ans{border-color:var(--red)}
.svgbox{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.svgbox svg{display:block}
.svgbox .arw{align-self:center;font-size:14px}
.svgbox.clocks{gap:4px;flex-wrap:nowrap}
.grid50{border-collapse:collapse;margin:10px auto;font-size:14px}
.grid50 td,.grid50 th{border:1px solid var(--line);width:30px;height:28px;text-align:center}
.grid50 th{background:var(--card2);font-weight:800}
.code{font-size:26px;font-weight:900;letter-spacing:.1em;text-align:center;margin:8px 0}
.slot{display:inline-flex;gap:4px;align-items:center;font-size:22px;margin:6px 10px}
.slot .c{width:32px;height:32px;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;background:#fff8e8;font-size:16px}
.slot .c.on{background:var(--red);border-color:var(--red)}

/* 正解モーダル */
.overlay{position:fixed;inset:0;background:rgba(10,6,3,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--card);color:var(--ink);border-radius:14px;padding:22px 18px;width:min(420px,100%);text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.modal .ok{font-size:34px;font-weight:900;color:var(--green);letter-spacing:.1em}
.modal .answer{font-size:28px;font-weight:900;margin:4px 0 10px;letter-spacing:.12em}
.modal .exp{font-size:15px;text-align:left;background:#fff8e8;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.modal .bigbtn{margin-top:4px}

/* エンディング */
#ending{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
.chest{font-size:90px;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.result{background:rgba(244,234,214,.08);border:1px solid #6b5238;border-radius:12px;padding:14px 18px;margin:16px 0;min-width:240px}
.result div{display:flex;justify-content:space-between;gap:20px;padding:3px 0}
.rank{font-size:26px;color:var(--gold2);font-weight:900;margin-top:4px}
.sparkle{position:fixed;pointer-events:none;font-size:22px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
</style>
</head>
<body>

<!-- タイトル -->
<section id="title" class="screen">
  <div class="logo-sub">NAZOTOKI MANSION</div>
  <h1 class="logo">なぞときの館</h1>
  <svg class="mansion" viewBox="0 0 300 180" aria-hidden="true">
    <circle cx="250" cy="34" r="18" fill="#f2cf7a" opacity=".9"/>
    <circle cx="258" cy="28" r="16" fill="#2a1d13"/>
    <polygon points="40,80 150,20 260,80" fill="#3a2716"/>
    <rect x="55" y="80" width="190" height="95" fill="#4a3220"/>
    <polygon points="20,100 70,60 120,100" fill="#2f1f12"/>
    <polygon points="180,100 230,60 280,100" fill="#2f1f12"/>
    <rect x="30" y="100" width="80" height="75" fill="#3d2918"/>
    <rect x="190" y="100" width="80" height="75" fill="#3d2918"/>
    <g fill="#f2cf7a"><rect x="45" y="115" width="18" height="24" opacity=".85"/><rect x="78" y="115" width="18" height="24" opacity=".25"/>
    <rect x="205" y="115" width="18" height="24" opacity=".25"/><rect x="238" y="115" width="18" height="24" opacity=".85"/>
    <rect x="95" y="95" width="18" height="24" opacity=".5"/><rect x="187" y="95" width="18" height="24" opacity=".5"/>
    <circle cx="150" cy="58" r="10" opacity=".7"/></g>
    <path d="M130 175 V130 a20 20 0 0 1 40 0 V175 Z" fill="#7a2a1e"/>
    <circle cx="162" cy="152" r="2.5" fill="#f2cf7a"/>
  </svg>
  <p class="story">目がさめると、そこは古い洋館の中だった。<br>出口へ続く扉には、どれも「なぞ」の錠がかかっている。<br>すべてのなぞを解いて、館にねむる宝を見つけだせ！</p>
  <button class="bigbtn" id="btnStart">はじめる</button>
  <button class="subbtn" id="btnReset" hidden>さいしょからやり直す</button>
</section>

<!-- 扉の一覧 -->
<section id="map" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="pill" id="btnHome">◀ タイトル</button>
      <h2>大広間</h2>
      <span class="pill" id="progress">0 / 10</span>
    </div>
    <div class="doors" id="doors"></div>
    <div class="memo" id="memo" hidden><b>📜 メモ帳</b>（解いた答え）<ul id="memoList"></ul></div>
    <p class="note">光っている扉から順に開けよう。<br>開けた扉は、もう一度遊べます。</p>
  </div>
</section>

<!-- なぞ -->
<section id="puzzle" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="pill" id="btnBack">◀ 大広間</button>
      <span class="pill" id="hintCount">ヒント 0回</span>
    </div>
    <div style="height:10px"></div>
    <div class="paper" id="paper">
      <div class="no" id="pNo">第1の扉</div>
      <h3 id="pTitle"></h3>
      <div id="pBody"></div>
      <form class="ans-area" id="ansForm" autocomplete="off">
        <input id="ans" placeholder="こたえを入力" enterkeyhint="done" autocapitalize="off" spellcheck="false">
        <button type="submit">解く</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
    <div class="tools">
      <button class="tbtn" id="btnHint">💡 ヒントを見る</button>
    </div>
    <div class="hints" id="hints"></div>
  </div>
</section>

<!-- エンディング -->
<section id="ending" class="screen" hidden>
  <div class="chest">🎁</div>
  <h1 class="logo" style="font-size:clamp(30px,9vw,46px)">脱出成功！</h1>
  <p class="story">最後の扉の奥には、金色にかがやく宝箱。<br>ふたを開けると、朝の光がさしこんできた――。<br>あなたは「なぞときの館」をみごと攻略した！</p>
  <div class="result" id="result"></div>
  <button class="bigbtn" id="btnEndMap">大広間にもどる</button>
  <button class="subbtn" id="btnEndReset">さいしょから遊ぶ</button>
</section>

<!-- 正解モーダル -->
<div class="overlay" id="okModal" hidden>
  <div class="modal">
    <div class="ok">せいかい！</div>
    <div class="answer" id="okAnswer"></div>
    <div class="exp" id="okExp"></div>
    <button class="bigbtn" id="okNext">扉を開ける</button>
  </div>
</div>

<script>
