<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#2b1d14;--paper:#fff6e3;--mud:#6a4b30;--hot:#e4442a;--gold:#f5b921;--purple:#6a2c91}
html,body{height:100%;background:#2b1d14;overflow:hidden;overscroll-behavior:none;touch-action:none;
 font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);
 -webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.big{font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-weight:400}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;z-index:5}
.hudrow{display:flex;align-items:center;gap:8px}
#clock{font-family:"Dela Gothic One",sans-serif;font-size:22px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:2px 10px;line-height:1.25;min-width:84px;text-align:center}
#clock.warn{background:var(--hot);color:#fff;animation:shake .35s infinite}
#phase{flex:1;min-width:0;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:3px 9px 5px}
#phaseName{font-weight:900;font-size:13px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:9px;background:#d9c7a4;border-radius:5px;overflow:hidden;margin-top:2px}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#8a5a30,#d8a24a);border-radius:5px}
#bar.over #barFill{background:linear-gradient(90deg,#f5b921,#ff6db0,#6ad1ff)}
.iconbtn{pointer-events:auto;width:38px;height:38px;flex:none;background:var(--paper);border:3px solid var(--ink);border-radius:12px;font-weight:900;font-size:13px;line-height:1}
#heatWrap{margin-top:6px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;opacity:0;transition:opacity .2s}
#heatBar{flex:0 0 130px;height:8px;background:#0006;border-radius:5px;overflow:hidden;border:2px solid #fff}
#itemBar{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 60px);display:flex;flex-direction:column;align-items:flex-end;gap:5px}
#btnWater{pointer-events:auto;background:#bfe6ff;border:3px solid var(--ink);border-radius:12px;font-weight:900;font-size:13px;padding:5px 10px;box-shadow:0 3px 0 var(--ink)}
#btnWater:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#itemChips{background:#fffbeee6;border:2px solid var(--ink);border-radius:10px;font-size:11px;font-weight:900;padding:2px 7px;line-height:1.5}
#owner{grid-column:1/3;text-align:center;font-weight:900;font-size:13px;color:#fff;background:#8a5a30;border:3px solid var(--ink);border-radius:12px;padding:3px 8px}
.item .cnt{display:inline-block;margin-left:6px;font-size:12px;color:#1f5fd0}
#heatFill{height:100%;width:0;background:linear-gradient(90deg,#ffc14d,#e4442a)}

/* テロップ */
#telop{position:fixed;left:0;right:0;top:19%;text-align:center;z-index:6;pointer-events:none;padding:0 10px}
#telop span{display:inline-block;font-family:"Dela Gothic One",sans-serif;font-size:clamp(30px,10.5vw,62px);line-height:1.15;color:#ffe83d;
 -webkit-text-stroke:7px #c61b1b;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #2b1d14);transform:rotate(-4deg)}
#telop span.cool{color:#fff;-webkit-text-stroke-color:#1f5fd0}
#telop span.small{font-size:clamp(22px,7.5vw,42px);-webkit-text-stroke-width:6px}
#telop span.pop{animation:pop .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-14deg);opacity:0}18%{transform:scale(1.2) rotate(-3deg);opacity:1}30%{transform:scale(1) rotate(-4deg)}82%{opacity:1}100%{transform:scale(1.04) rotate(-4deg);opacity:0}}

/* ナレーション */
#narr{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);width:min(92vw,560px);text-align:center;z-index:6;pointer-events:none;
 font-family:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:1.55;color:#fff;
 text-shadow:0 0 4px #000,0 1px 3px #000,0 0 12px #000a;opacity:0;transition:opacity .35s}
#narr.on{opacity:1}

/* 擬音 */
.ono{position:fixed;z-index:4;pointer-events:none;font-family:"Dela Gothic One",sans-serif;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;font-size:20px;animation:ono .75s ease-out both}
@keyframes ono{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}25%{transform:translate(-50%,-80%) scale(1.1);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}

/* 指ヒント */
#hint{position:fixed;left:50%;top:50%;width:0;height:0;z-index:4;pointer-events:none}
#hintDot{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:#fff9;border:4px solid #fff;box-shadow:0 2px 10px #0006;animation:swipe 1.1s ease-in-out infinite alternate}
#hint.tap #hintDot{animation:tap .7s ease-in-out infinite}
#hintText{position:absolute;left:0;top:44px;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:3px 13px}
@keyframes swipe{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes tap{0%,100%{transform:scale(1)}50%{transform:scale(.72)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}

/* 画面 */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;overscroll-behavior:contain}
#title{justify-content:space-between;padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 22px);pointer-events:none}
#title>*{pointer-events:auto}
#logo{text-align:center;pointer-events:none!important}
#logo .kick{display:inline-block;font-family:"Shippori Mincho",serif;font-size:14px;color:#fff;background:#2b1d14;padding:2px 12px;margin-bottom:8px}
#logo h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(46px,15.5vw,84px);line-height:1.04;color:#ffe83d;-webkit-text-stroke:8px #2b1d14;paint-order:stroke fill;filter:drop-shadow(0 5px 0 #c61b1b)}
#logo h1 small{display:block;font-size:.72em;color:#fff}
#menu{width:min(100%,380px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--paper);border:4px solid var(--ink);border-radius:16px;padding:11px 8px;font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.main{grid-column:1/3;background:var(--gold);font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:27px;padding:12px}
#wallet{grid-column:1/3;text-align:center;font-weight:900;font-size:14px;color:#fff;text-shadow:0 1px 3px #000}

/* パネル */
.panel{position:fixed;inset:0;z-index:12;background:#2b1d14d9;display:flex;justify-content:center;align-items:stretch;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);touch-action:pan-y}
.sheet{width:min(100%,460px);background:var(--paper);border:4px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:4px solid var(--ink);background:var(--gold)}
.sheetHead h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:22px}
.coin{font-weight:900;font-size:15px;white-space:nowrap}
.sheetBody{overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1;min-height:0}
.sheetFoot{padding:10px 12px;border-top:4px solid var(--ink)}
.sheetFoot .btn{width:100%}
.sec{font-weight:900;font-size:15px;margin:12px 0 6px;padding-left:8px;border-left:6px solid var(--mud)}
.sec:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:13px;padding:8px 10px;margin-bottom:7px;background:#fff}
.item.on{background:#ffeeb0}
.item .tx{flex:1;min-width:0}
.item b{display:block;font-weight:900;font-size:15px;line-height:1.3}
.item i{display:block;font-style:normal;font-size:12.5px;line-height:1.35;color:#6b5a4a}
.item button{flex:none;min-width:80px;border:3px solid var(--ink);border-radius:11px;padding:6px 7px;font-weight:900;font-size:14px;background:var(--gold)}
.item button:disabled{background:#ddd;color:#888;border-color:#999}
.item button.eq{background:#fff}
.orb{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:7px 4px;text-align:center;min-width:0}
.card .orb{width:46px;height:46px;margin:0 auto 4px}
.card b{display:block;font-size:12px;font-weight:900;line-height:1.25}
.card i{display:block;font-style:normal;font-size:11px;line-height:1.25;color:#6b5a4a;word-break:break-all}
.ladder{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;font-size:14px;font-weight:900}
.ladder div{border:2px solid var(--ink);border-radius:9px;padding:3px 8px;background:#fff}
.ladder div.no{background:#e8dcc6;color:#9b8a74}
.empty{font-size:14px;color:#6b5a4a;text-align:center;padding:14px 0}

/* 鑑定 */
#result{position:fixed;left:0;right:0;bottom:0;z-index:11;display:flex;justify-content:center;padding:0 10px calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
#resCard{pointer-events:auto;width:min(100%,460px);background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:11px 13px 12px;max-height:68vh;overflow-y:auto;touch-action:pan-y}
#resKick{font-family:"Shippori Mincho",serif;font-size:13px;color:#6b5a4a;text-align:center}
#resName{font-weight:900;font-size:15px;text-align:center;line-height:1.35}
#resPrice{font-family:"Dela Gothic One",sans-serif;text-align:center;font-size:clamp(28px,9.6vw,42px);line-height:1.2;color:#c61b1b;margin:3px 0;overflow-wrap:anywhere}
#resPrice.stamp{animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
#resComment{font-family:"Shippori Mincho",serif;font-size:15.5px;line-height:1.5;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;margin-bottom:7px}
#resComment small{display:block;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:11.5px;color:#6b5a4a}
#resLines{font-size:13px;line-height:1.5;font-weight:500;margin-bottom:9px}
#resLines b{font-weight:900}
#resRank{margin:2px 0 4px;padding:5px 9px;border:3px solid var(--ink);border-radius:11px;background:#ffeeb0;font-size:14px;font-weight:900;text-align:center;line-height:1.4}
#resRank big{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:22px;color:#c61b1b}
#resRank small{display:block;font-size:11px;font-weight:500;color:#6b5a4a}
#resRank.pop{animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}
#resBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
#resBtns #btnShare{grid-column:1/-1;background:#111;color:#fff;font-size:15px;padding:8px 4px}
#resBtns .btn{padding:6px 1px;font-size:12.5px;line-height:1.2;box-shadow:0 2px 0 var(--ink);border-width:3px;border-radius:12px;min-width:0}
#resBtns .btn.main{font-size:19px;padding:6px}
#more{grid-column:1/-1;margin-top:3px;border-top:3px dashed #c9b48e;padding-top:5px}
#moreHead{font-weight:900;font-size:13px;text-align:center;margin-bottom:5px}
#moreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.moreCard{display:block;min-width:0;border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;color:var(--ink);text-decoration:none}
.moreCard img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover;background:#2b1d14}
.moreCard b{display:block;font-weight:900;font-size:10.5px;letter-spacing:0;line-height:1.25;padding:4px 3px 0}
.moreCard i{display:block;font-style:normal;font-size:10px;letter-spacing:0;line-height:1.25;color:#6b5a4a;padding:1px 3px 4px}
#moreLinks{margin-top:5px}
#moreAll{display:block;border-radius:10px;font-weight:900;font-size:12.5px;text-align:center;text-decoration:none;background:var(--gold);color:var(--ink);border:3px solid var(--ink);padding:4px 2px}
#moreFollow{display:block;margin-bottom:7px;padding:7px 4px;border-radius:12px;background:#0b6fc2;color:#fff;text-align:center;text-decoration:none;line-height:1.3}
#moreFollow b{display:block;font-weight:900;font-size:15px}
#moreFollow small{display:block;font-size:11.5px}

#pause{z-index:13;align-items:center}
#pause .sheet{height:auto;align-self:center}
#pause .sheetBody{display:grid;gap:10px}
#moveBox{grid-column:1/3;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:7px 10px 8px;font-size:12.5px;font-weight:900;line-height:1.45;text-align:center}
#moveBox .btn{display:block;width:100%;margin-top:6px;background:#1f5fd0;color:#fff;font-size:16px;padding:8px;box-shadow:0 3px 0 var(--ink);border-width:3px}
#torch{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .25s}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:24px;text-align:center;z-index:30;font-weight:900;line-height:1.7}
</style>
</head>
