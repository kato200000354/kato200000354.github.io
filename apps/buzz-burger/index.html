<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#3a2414;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;color:#3a2414;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;background:linear-gradient(#fff3d6,#ffe1a6);display:flex;flex-direction:column;overflow:hidden}
#app.fever{animation:fev 1.2s linear infinite}
@keyframes fev{0%{background:#ffd1e8}25%{background:#fff3a8}50%{background:#c9f5d4}75%{background:#cfe4ff}100%{background:#ffd1e8}}
#app.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;font-weight:800}
#fol{flex:1;font-size:20px;white-space:nowrap}
#fol small{font-size:11px;font-weight:700;opacity:.7}
#combo{font-size:13px;background:#ff5a3c;color:#fff;border-radius:99px;padding:2px 9px;white-space:nowrap}
#strikes{font-size:16px;letter-spacing:1px;white-space:nowrap}
#strikes .off{filter:grayscale(1);opacity:.25}
#mute{border:0;background:#fff8;border-radius:50%;width:32px;height:32px;font-size:16px}
#gaugeW{margin:0 10px;height:16px;background:#fff9;border-radius:99px;overflow:hidden;position:relative;border:2px solid #3a2414}
#gauge{height:100%;width:0;background:linear-gradient(90deg,#ff7a3c,#ff3c8e,#a55cff);transition:width .25s}
#gaugeT{position:absolute;inset:0;font-size:10px;font-weight:800;line-height:12px;text-align:center;color:#3a2414}

/* 客 */
#cust{position:relative;flex:0 0 auto;height:200px;margin:6px 10px 0;display:flex;align-items:flex-end;gap:6px}
#who{width:92px;text-align:center;transition:transform .3s,opacity .3s}
#who.out{transform:translateX(-120px);opacity:0}
#who.in{transform:translateX(140px);opacity:0;transition:none}
#face{font-size:64px;line-height:1.1}
#cname{font-size:11px;font-weight:800;background:#3a2414;color:#fff;border-radius:99px;padding:2px 6px;display:inline-block;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bubble{flex:1;min-width:0;align-self:stretch;background:#fff;border:3px solid #3a2414;border-radius:18px;padding:6px 8px;display:flex;flex-direction:column;position:relative;transition:transform .2s,opacity .2s}
#bubble.out{transform:scale(.6);opacity:0}
#bubble::before{content:"";position:absolute;left:-13px;bottom:34px;border:8px solid transparent;border-right-color:#3a2414}
#say{font-size:12px;font-weight:800;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tag{position:absolute;top:-11px;right:8px;background:#ffcf24;border:2px solid #3a2414;border-radius:99px;font-size:11px;font-weight:800;padding:1px 8px}
#order{flex:1;display:flex;align-items:center;justify-content:space-around;gap:4px;min-height:0}
#order .burger{--w:96px}
.sd{text-align:center;font-size:10px;font-weight:800}
.sd b{display:block;font-size:34px;line-height:1.15;font-weight:400}
.plus{font-weight:800;font-size:18px;opacity:.5}
#pbarW{height:10px;background:#eee;border-radius:99px;overflow:hidden;border:2px solid #3a2414}
#pbar{height:100%;width:100%;background:#4cc35b}

/* バーガー */
.burger{--w:150px;--h:16px;display:flex;flex-direction:column-reverse;align-items:center;width:calc(var(--w)*1.14)}
.ly{flex:0 0 auto;border:2px solid #3a2414;margin-top:-2px}
.bunB{width:var(--w);height:calc(var(--h)*1.1);background:#e2a14e;border-radius:4px 4px 12px 12px;margin-top:0}
.bunT{width:var(--w);height:calc(var(--h)*1.9);background:radial-gradient(circle at 30% 40%,#fff6d8 0 6%,transparent 7%),radial-gradient(circle at 55% 28%,#fff6d8 0 6%,transparent 7%),radial-gradient(circle at 74% 48%,#fff6d8 0 6%,transparent 7%),#eeaa52;border-radius:50% 50% 6px 6px/95% 95% 8px 8px}
.patty{width:calc(var(--w)*1.04);height:var(--h);background:#6b3a1f;border-radius:8px}
.cheese{width:calc(var(--w)*1.1);height:calc(var(--h)*.4);background:#ffcc2e;border-radius:2px;min-height:5px}
.lettuce{width:calc(var(--w)*1.14);height:calc(var(--h)*.5);background:#6fca4c;border-radius:50%/60%;min-height:6px}
.tomato{width:calc(var(--w)*.96);height:calc(var(--h)*.55);background:#e8432f;border-radius:6px;min-height:6px}
.egg{width:var(--w);height:calc(var(--h)*.55);background:radial-gradient(ellipse at 50% 50%,#ffb300 0 24%,#fff 26%);border-radius:50%/70%;min-height:6px}
.bacon{width:calc(var(--w)*1.12);height:calc(var(--h)*.4);background:repeating-linear-gradient(90deg,#c44d3a 0 10px,#f3b9a0 10px 15px);border-radius:3px;min-height:5px}
.drop{animation:drop .16s ease-out}
@keyframes drop{from{transform:translateY(-40px);opacity:.3}}

/* トレイ */
#tray{position:relative;flex:1 1 0;min-height:120px;margin:4px 10px;background:#fff7;border:3px dashed #3a241455;border-radius:16px;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:6px}
#mine{transition:transform .3s,opacity .3s}
#mine.fly{transform:translateY(-150px) scale(.4);opacity:0}
.slot{width:62px;height:66px;border:2px dashed #3a241466;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#3a241499;background:#fff8}
.slot b{font-size:32px;line-height:1.1;font-weight:400}
.slot.on{border-style:solid;border-color:#3a2414;background:#fff;color:#3a2414}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.cmt{position:absolute;right:8px;max-width:70%;background:#1d9bf0;color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:12px 12px 2px 12px;animation:cm 2.2s ease-out forwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmt.bad{background:#e0245e}
@keyframes cm{0%{transform:translateY(20px);opacity:0}12%{transform:none;opacity:1}80%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
.pop{position:absolute;left:0;right:0;text-align:center;font-weight:900;font-size:30px;color:#fff;-webkit-text-stroke:2px #3a2414;paint-order:stroke fill;text-shadow:0 3px 0 #3a2414;animation:pp .9s ease-out forwards}
.pop small{display:block;font-size:20px;color:#ffe14a}
@keyframes pp{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-40px);opacity:0}}

/* 操作 */
#ctl{flex:0 0 auto;padding:4px 10px calc(10px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.grid6{grid-template-columns:repeat(6,1fr)}
.btn{border:3px solid #3a2414;border-radius:14px;background:#fff;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-size:11px;font-weight:800;color:#3a2414;box-shadow:0 4px 0 #3a2414;min-width:0;padding:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2414}
.btn .ly{--w:38px;--h:13px;margin:0}
.btn b{font-size:24px;line-height:1;font-weight:400}
.btn.lock{opacity:.35;pointer-events:none}
.btn.fin{background:#ffcf24}
.btn.undo{background:#e9e2d6}
.btn.sel{background:#b9f0c0}
.grid6 .btn{height:54px;font-size:10px}

/* 画面 */
.scr{position:absolute;inset:0;z-index:20;background:linear-gradient(#ffb42e,#ff7a3c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 16px;text-align:center;overflow-y:auto}
.scr h1{font-size:40px;line-height:1.1;color:#fff;-webkit-text-stroke:3px #3a2414;paint-order:stroke fill;text-shadow:0 5px 0 #3a2414}
.scr h1 small{display:block;font-size:17px;-webkit-text-stroke:2px #3a2414;margin-top:6px}
.card{background:#fff;border:3px solid #3a2414;border-radius:18px;padding:12px 14px;width:100%;max-width:330px;font-size:13px;font-weight:700;line-height:1.7;text-align:left}
.card h2{font-size:13px;text-align:center;background:#ffcf24;border-radius:99px;margin-bottom:6px}
#today{display:flex;align-items:center;justify-content:space-around}
#today .burger{--w:64px;--h:11px}
.big{border:3px solid #3a2414;border-radius:99px;background:#fff;font:inherit;font-size:20px;font-weight:900;color:#3a2414;padding:12px 0;width:100%;max-width:300px;box-shadow:0 6px 0 #3a2414}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #3a2414}
.big.go{background:#4cd964}
.big.x{background:#111;color:#fff;font-size:16px}
.big.s{font-size:16px;background:#ffcf24}
#best{font-weight:800;color:#3a2414}
#shot{width:100%;max-width:300px;border:3px solid #3a2414;border-radius:16px}
#end{justify-content:flex-start}
</style>
</head>

<div id="app">
  <div id="hud">
    <div id="fol">👥 <span id="folN">0</span> <small>フォロワー</small></div>
    <div id="combo" hidden></div>
    <div id="strikes"></div>
    <button id="mute" aria-label="音">🔊</button>
  </div>
  <div id="gaugeW"><div id="gauge"></div><div id="gaugeT">バズゲージ</div></div>

  <div id="cust">
    <div id="who"><div id="face">🙂</div><div id="cname">お客さん</div></div>
    <div id="bubble">
      <div id="tag" hidden></div>
      <div id="say"></div>
      <div id="order"></div>
      <div id="pbarW"><div id="pbar"></div></div>
    </div>
  </div>

  <div id="tray">
    <div class="slot" id="slS"><b>？</b>サイド</div>
    <div id="mine" class="burger"></div>
    <div class="slot" id="slD"><b>？</b>ドリンク</div>
  </div>
  <div id="fx"></div>

  <div id="ctl">
    <div class="grid" id="gIng"></div>
    <div class="grid grid6" id="gSet"></div>
  </div>

  <div class="scr" id="title">
    <h1>🍔バズバーガー<small>人気セットを作れ！</small></h1>
    <div class="card">
      <h2>あそびかた</h2>
      ① ふきだしの注文と同じ順に具を重ねる<br>
      ② サイドとドリンクを選ぶ<br>
      ③ 「上バンズ」でフタをしたら提供！<br>
      🔥 まちがい・時間切れは<b>炎上</b>。3回で閉店
    </div>
    <div class="card">
      <h2>👑 本日の人気No.1セット（フォロワー2倍）</h2>
      <div id="today"></div>
    </div>
    <div id="best"></div>
    <button class="big go" id="start">開店する！</button>
  </div>

  <div class="scr" id="end" hidden>
    <canvas id="shot" width="1080" height="1080"></canvas>
    <button class="big s" id="share">📤 画像つきでシェア</button>
    <button class="big x" id="xpost">𝕏 にポストする</button>
    <button class="big go" id="again">もう一回！</button>
  </div>
</div>
