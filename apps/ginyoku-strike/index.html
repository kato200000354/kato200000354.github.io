<html lang="ja">
<head>

<meta charset="utf-8">
<title>銀翼ストライク</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="戦闘機を操り、5つの作戦と空中要塞に挑む本格3D空戦シューティング。">
<meta name="theme-color" content="#07101f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#07101f; --panel:rgba(8,18,36,.78); --edge:rgba(120,200,255,.35);
  --cyan:#5fd4ff; --green:#7dffb2; --red:#ff4d5e; --gold:#ffcf4a; --text:#e8f1ff; --dim:#8ea3c0;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"M PLUS 1p","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.en{font-family:"Rajdhani",sans-serif;font-weight:700;letter-spacing:.06em}
#c,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(255,20,30,.75) 100%)}
#fade{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .5s}

/* ---------- 画面共通 ---------- */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto}
.dim{background:linear-gradient(180deg,rgba(4,10,22,.55),rgba(4,10,22,.82))}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:22px;max-width:640px;width:100%;margin:auto}
.panel h2{margin:0 0 4px;font-size:22px}
.panel .sub{color:var(--cyan);font-size:13px;margin-bottom:14px}
.btn{display:block;width:100%;padding:13px 16px;margin:8px 0;border-radius:10px;border:1px solid rgba(120,200,255,.45);
  background:linear-gradient(180deg,rgba(40,90,150,.55),rgba(15,40,80,.55));font-weight:700;font-size:16px;letter-spacing:.04em;transition:transform .08s,background .15s}
.btn:hover{background:linear-gradient(180deg,rgba(60,130,210,.7),rgba(20,60,120,.7))}
.btn:active{transform:scale(.98)}
.btn.main{background:linear-gradient(180deg,#2e8fff,#1554c4);border-color:#8fd0ff;box-shadow:0 0 24px rgba(50,150,255,.45)}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px}.row>.btn{flex:1}

/* ---------- タイトル ---------- */
#title{flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(3,8,18,.15) 0%,rgba(3,8,18,0) 40%,rgba(3,8,18,.7) 100%)}
.logo{margin-top:6vh;text-align:center;filter:drop-shadow(0 6px 20px rgba(0,0,0,.6))}
.logo .jp{font-size:clamp(40px,9vw,92px);font-weight:800;letter-spacing:.08em;line-height:1;
  background:linear-gradient(180deg,#fff 10%,#b8d4ff 55%,#6f8fbf 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .enl{font-size:clamp(14px,2.6vw,22px);color:var(--cyan);letter-spacing:.5em;margin-top:8px;padding-left:.5em}
.menu{width:min(360px,100%);margin:0 auto 4vh}
.ver{position:fixed;right:12px;bottom:8px;font-size:11px;color:var(--dim)}

/* ---------- 作戦選択 ---------- */
.mlist{display:grid;gap:10px;margin:10px 0 6px}
.mcard{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid rgba(120,200,255,.3);
  background:linear-gradient(90deg,rgba(30,70,130,.5),rgba(10,25,50,.4));width:100%}
.mcard:hover{border-color:#8fd0ff}
.mcard[disabled]{opacity:.42;cursor:not-allowed}
.mcard .no{font-size:28px;color:var(--cyan);width:44px;text-align:center;flex:none}
.mcard .t{flex:1;min-width:0}
.mcard .t b{display:block;font-size:16px}
.mcard .t small{color:var(--dim);font-size:12px}
.mcard .rk{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:26px;border:1px solid rgba(255,255,255,.2);color:var(--dim)}
.rk.S{color:#ffe27a;border-color:#ffd34d;box-shadow:0 0 14px rgba(255,210,80,.5)}
.rk.A{color:#9fe2ff;border-color:#5fd4ff}.rk.B{color:#b7f5c9}.rk.C{color:#c9c9c9}

/* ---------- ブリーフィング ---------- */
.brief p{line-height:1.8;margin:10px 0;font-size:15px}
.objs{margin:12px 0;padding:12px 14px;border-left:3px solid var(--gold);background:rgba(255,207,74,.07);border-radius:0 8px 8px 0}
.objs div{font-size:14px;margin:3px 0}
.objs div::before{content:"▶ ";color:var(--gold)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--edge);color:var(--cyan);margin-right:6px}

/* ---------- 結果 ---------- */
.res-title{font-size:clamp(28px,6vw,46px);text-align:center;margin:4px 0 2px}
.res-title.win{color:#9fe2ff;text-shadow:0 0 24px rgba(80,180,255,.7)}
.res-title.lose{color:#ff8a94;text-shadow:0 0 24px rgba(255,60,80,.6)}
.res-reason{text-align:center;color:var(--dim);font-size:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:15px;margin:10px 0 14px;padding:12px 14px;background:rgba(0,0,0,.25);border-radius:10px}
.stats .v{text-align:right;font-family:Rajdhani,sans-serif;font-weight:700;font-size:18px}
.bigrank{display:flex;align-items:center;justify-content:center;gap:16px;margin:6px 0}
.bigrank .rk{width:84px;height:84px;font-size:56px;border-radius:16px}
.newrec{color:var(--gold);font-weight:800;text-align:center;font-size:14px;min-height:20px}

/* ---------- 設定・操作 ---------- */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.set span small{display:block;color:var(--dim);font-size:12px}
.seg{display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden;flex:none}
.seg button{background:transparent;border:0;padding:8px 14px;font-size:14px;color:var(--dim)}
.seg button.on{background:#1f6fd8;color:#fff}
input[type=range]{width:140px;accent-color:#2e8fff}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;margin:8px 0}
.keys kbd{font-family:Rajdhani,sans-serif;font-weight:700;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-bottom-width:3px;border-radius:6px;padding:1px 7px;white-space:nowrap;display:inline-block;margin:1px 2px 1px 0}
.tip{font-size:13px;color:var(--dim);line-height:1.7;margin-top:10px}

/* ---------- 無線 ---------- */
#radio{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 10px);max-width:min(620px,86vw);
  padding:9px 16px;border-radius:10px;background:rgba(4,14,28,.72);border:1px solid rgba(120,200,255,.3);font-size:15px;line-height:1.5;pointer-events:none;transition:opacity .3s}
#radio b{color:var(--cyan);margin-right:10px;font-size:13px}
#radio b.foe{color:#ff7b86}
body.touch #radio{bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 62px);font-size:13px;max-width:56vw}

/* ---------- タッチ操作 ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:46%;height:72%;pointer-events:auto}
#stickBase{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:2px solid rgba(160,220,255,.4);background:radial-gradient(circle,rgba(80,160,255,.12),rgba(80,160,255,.04));
  left:110px;bottom:auto;top:calc(100% - 120px);opacity:.75}
#stickKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(220,240,255,.9),rgba(90,160,240,.75));box-shadow:0 0 18px rgba(80,170,255,.5)}
#tbtns{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;
  grid-template-columns:repeat(3,auto);grid-template-areas:"boost brake target" "flare msl msl" "gun gun gun";gap:10px;justify-items:end;align-items:end;pointer-events:auto}
.tb{border-radius:50%;border:2px solid rgba(170,220,255,.55);background:rgba(20,50,100,.45);font-weight:800;color:#e6f3ff;display:grid;place-items:center;touch-action:none;font-size:12px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.tb.on{background:rgba(60,140,255,.75);border-color:#cfeaff}
.tb.sm{width:56px;height:56px}
.tb.md{width:74px;height:74px;font-size:15px;grid-area:msl;border-color:rgba(255,190,90,.7);background:rgba(120,60,10,.45)}
.tb.lg{width:96px;height:96px;font-size:17px;grid-area:gun;border-color:rgba(255,120,120,.7);background:rgba(120,20,30,.45)}
.tb[data-act=boost]{grid-area:boost}.tb[data-act=brake]{grid-area:brake}.tb[data-act=target]{grid-area:target}.tb[data-act=flare]{grid-area:flare}
#tpause{position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:44px;height:34px;border-radius:8px;border:1px solid rgba(170,220,255,.5);background:rgba(10,30,60,.5);pointer-events:auto;font-weight:800}
#rotate{position:fixed;inset:0;background:rgba(4,10,22,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-size:16px;line-height:1.7}
#rotate .ph{width:54px;height:90px;border:3px solid var(--cyan);border-radius:10px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:10;font-size:15px;color:var(--dim)}
#loading .bar{width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:var(--cyan);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (max-height:520px){.panel{padding:16px}.logo{margin-top:2vh}.menu{margin-bottom:2vh}.btn{padding:10px 14px;margin:6px 0}}
</style>

</script>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hud"></canvas>
<div id="vig"></div>
<div id="radio" hidden><b id="rname"></b><span id="rtext"></span></div>

<div id="touch" hidden>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="tbtns">
    <button class="tb sm" data-act="boost">加速</button>
    <button class="tb sm" data-act="brake">減速</button>
    <button class="tb sm" data-act="target">切替</button>
    <button class="tb sm" data-act="flare">フレア</button>
    <button class="tb md en" data-act="missile">MSL</button>
    <button class="tb lg en" data-act="gun">GUN</button>
  </div>
  <button id="tpause" aria-label="ポーズ">II</button>
</div>

<section id="title" class="scr" hidden>
  <div class="logo"><div class="jp">銀翼ストライク</div><div class="enl en">GINYOKU STRIKE</div></div>
  <div class="menu">
    <button class="btn main" id="bStart">出撃する</button>
    <div class="row"><button class="btn" id="bHelp">操作方法</button><button class="btn" id="bSet">設定</button></div>
  </div>
  <div class="ver en">AERIAL COMBAT ／ 5 MISSIONS</div>
</section>

<section id="select" class="scr dim" hidden>
  <div class="panel">
    <h2>作戦選択</h2><div class="sub en">SELECT MISSION</div>
    <div class="mlist" id="mlist"></div>
    <button class="btn ghost" data-back="title">戻る</button>
  </div>
</section>

<section id="brief" class="scr dim" hidden>
  <div class="panel brief">
    <div class="sub en" id="bCode"></div>
    <h2 id="bName"></h2>
    <div style="margin:8px 0"><span class="tag" id="bArea"></span><span class="tag" id="bBest"></span></div>
    <p id="bText"></p>
    <div class="objs" id="bObj"></div>
    <div class="row"><button class="btn ghost" data-back="select">戻る</button><button class="btn main" id="bGo">出撃開始</button></div>
  </div>
</section>

<section id="pause" class="scr dim" hidden>
  <div class="panel" style="max-width:380px">
    <h2>ポーズ</h2><div class="sub en">PAUSED</div>
    <button class="btn main" id="pResume">再開する</button>
    <button class="btn" id="pRetry">最初からやり直す</button>
    <button class="btn" id="pHelp">操作方法</button>
    <button class="btn ghost" id="pQuit">作戦選択へ戻る</button>
  </div>
</section>

<section id="result" class="scr dim" hidden>
  <div class="panel" style="max-width:460px">
    <div class="res-title en" id="rTitle"></div>
    <div class="res-reason" id="rReason"></div>
    <div class="bigrank" id="rRankWrap"><div class="rk en" id="rRank">S</div><div><div style="color:var(--dim);font-size:12px">SCORE</div><div class="en" style="font-size:34px" id="rScore">0</div></div></div>
    <div class="newrec" id="rNew"></div>
    <div class="stats" id="rStats"></div>
    <button class="btn main" id="rNext">次の作戦へ</button>
    <div class="row"><button class="btn" id="rRetry">もう一度</button><button class="btn ghost" id="rSel">作戦選択</button></div>
  </div>
</section>

<section id="help" class="scr dim" hidden>
  <div class="panel">
    <h2>操作方法</h2><div class="sub en">CONTROLS</div>
    <div id="helpBody"></div>
    <button class="btn" id="helpBack">閉じる</button>
  </div>
</section>

<section id="settings" class="scr dim" hidden>
  <div class="panel" style="max-width:480px">
    <h2>設定</h2><div class="sub en">SETTINGS</div>
    <div class="set"><span>画質<small>カクつくときは「軽量」に</small></span><div class="seg" data-set="quality"><button data-v="high">高画質</button><button data-v="low">軽量</button></div></div>
    <div class="set"><span>上下の操作<small>「反転」は操縦桿と同じ向き（↑で機首下げ）</small></span><div class="seg" data-set="invert"><button data-v="0">ふつう</button><button data-v="1">反転</button></div></div>
    <div class="set"><span>自動水平アシスト<small>左右の入力を離すと機体が水平に戻る</small></span><div class="seg" data-set="assist"><button data-v="1">オン</button><button data-v="0">オフ</button></div></div>
    <div class="set"><span>BGM</span><div class="seg" data-set="bgm"><button data-v="1">オン</button><button data-v="0">オフ</button></div></div>
    <div class="set"><span>音量</span><input type="range" id="vol" min="0" max="1" step="0.05"></div>
    <button class="btn" id="setBack" style="margin-top:14px">閉じる</button>
  </div>
</section>

<div id="rotate" hidden><div class="ph"></div><div>スマホを<b>横向き</b>にすると遊びやすくなります</div><button class="btn" id="rotOk" style="width:auto;padding:10px 22px">このまま遊ぶ</button></div>
<div id="loading"><div class="en" style="font-size:22px;color:var(--text);letter-spacing:.3em">GINYOKU STRIKE</div><div class="bar"><i></i></div><div id="ldText">空域を生成しています…</div></div>
<div id="fade"></div>
