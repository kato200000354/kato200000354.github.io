<title>いまミーム</title>
<meta name="description" content="最近はやっているミームを、元ネタ・使い方つきで教えてくれるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#FFF7EC; --bg2:#FFEFF6;
  --surface:#FFFFFF; --surface2:#FFF3E3; --line:#F1E2CF;
  --ink:#2A1E14; --muted:#7A6A5B; --faint:#A8998A;
  --primary:#FF5A36; --onprimary:#FFFFFF; --accent:#7C4DFF;
  --now:#FF3D71; --now-bg:#FFE6EE; --year:#7C4DFF; --year-bg:#EFE8FF; --classic:#1E9E74; --classic-bg:#E1F6EE;
  --star:#FFB400;
  --shadow:0 14px 40px -18px rgba(120,60,20,.35);
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#16110D; --bg2:#1E1220;
    --surface:#231B15; --surface2:#2D231B; --line:#3A2E24;
    --ink:#F7EEE5; --muted:#C2B2A2; --faint:#8D7D6E;
    --primary:#FF7A5C; --onprimary:#1A0E08; --accent:#A88BFF;
    --now:#FF6E93; --now-bg:#3D1B26; --year:#A88BFF; --year-bg:#2A2140; --classic:#43CC9C; --classic-bg:#163329;
    --shadow:0 14px 40px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16110D; --bg2:#1E1220;
  --surface:#231B15; --surface2:#2D231B; --line:#3A2E24;
  --ink:#F7EEE5; --muted:#C2B2A2; --faint:#8D7D6E;
  --primary:#FF7A5C; --onprimary:#1A0E08; --accent:#A88BFF;
  --now:#FF6E93; --now-bg:#3D1B26; --year:#A88BFF; --year-bg:#2A2140; --classic:#43CC9C; --classic-bg:#163329;
  --shadow:0 14px 40px -18px rgba(0,0,0,.8);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--font); color:var(--ink);
  background:var(--bg) linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  min-height:100vh; line-height:1.6;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* header */
header{padding:22px 0 8px;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:16px;background:var(--primary);display:grid;place-items:center;font-size:28px;box-shadow:var(--shadow);transform:rotate(-6deg)}
header h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:.02em}
header p{margin:0;font-size:.8rem;color:var(--muted)}
.theme-btn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;font-size:18px}

/* power meter */
.power{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0 14px;box-shadow:var(--shadow)}
.power b{font-size:1.25rem}
.power .bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.power .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px;transition:width .4s}
.power small{color:var(--muted);font-size:.75rem;display:block;line-height:1.3}

/* chips */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:1rem;outline:none}
.search:focus{border-color:var(--primary)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.updated{font-size:.75rem;color:var(--faint);margin:6px 2px 10px}

/* cards */
.list{display:grid;gap:12px}
.card{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.card:active{transform:scale(.985)}
.rank{position:absolute;top:-8px;left:-6px;background:var(--ink);color:var(--bg);font-weight:800;font-size:.75rem;border-radius:99px;padding:2px 8px}
.emo{flex:none;width:56px;height:56px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;font-size:30px}
.card .body{flex:1;min-width:0}
.card h3{margin:0 0 2px;font-size:1.05rem;line-height:1.35}
.card .one{margin:0;color:var(--muted);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font-size:.7rem;font-weight:800;border-radius:8px;padding:2px 7px;background:var(--surface2);color:var(--muted)}
.tag.week{background:var(--ink);color:var(--bg)}
.tag.now{background:var(--now-bg);color:var(--now)}
.tag.year{background:var(--year-bg);color:var(--year)}
.tag.classic{background:var(--classic-bg);color:var(--classic)}
.fire{font-size:.75rem;letter-spacing:-2px}
.known{position:absolute;right:12px;top:12px;font-size:.7rem;font-weight:800;color:var(--classic)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(20,10,5,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet .top{display:flex;gap:14px;align-items:center}
.sheet .emo{width:72px;height:72px;font-size:40px}
.sheet h2{margin:0;font-size:1.35rem;line-height:1.3}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.sec h4{margin:0 0 4px;font-size:.8rem;color:var(--primary)}
.sec p{margin:0;font-size:.95rem}
.example{white-space:pre-wrap;font-weight:700;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:14px;padding:11px 14px;font-weight:800;font-size:.9rem;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.main{background:var(--primary);color:var(--onprimary);border-color:var(--primary)}
.btn.on{background:var(--classic);color:#fff;border-color:var(--classic)}
.btn.wide{flex:1;justify-content:center}
.close{margin-left:auto;align-self:flex-start;border:none;background:var(--surface2);border-radius:12px;width:38px;height:38px;font-size:18px;flex:none}

/* maker */
.maker{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.maker label{display:block;font-size:.8rem;font-weight:800;color:var(--muted);margin:10px 0 4px}
.maker select,.maker input,.maker textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:1rem;outline:none}
.maker textarea{min-height:84px;resize:vertical}
.hint{font-size:.75rem;color:var(--faint);margin-top:4px}
.maker .row .btn{font-size:.82rem;padding:11px 6px;white-space:nowrap}
canvas{width:100%;height:auto;border-radius:18px;margin-top:14px;display:block;box-shadow:var(--shadow)}

/* live */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:none;background:none;border-radius:10px;padding:8px;font-weight:800;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--onprimary)}
.feed{columns:2;column-gap:10px}
@media (min-width:640px){.feed{columns:3}}
.post{break-inside:avoid;margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:block;text-decoration:none;color:var(--ink)}
.post img{width:100%;display:block;background:var(--surface2);min-height:80px}
.post div{padding:8px 10px;font-size:.78rem;line-height:1.4}
.post small{color:var(--muted);display:block;margin-top:2px}
.note{font-size:.75rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.more{display:block;margin:6px auto 0}

/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;width:100%;max-width:760px}
nav button{flex:1;border:none;background:none;padding:4px 0;font-size:.7rem;font-weight:800;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:22px;line-height:1.2;filter:grayscale(1);opacity:.6}
nav button[aria-current="page"]{color:var(--primary)}
nav button[aria-current="page"] span{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.85rem;font-weight:700;z-index:60;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🫠</div>
    <div>
      <h1>いまミーム</h1>
      <p>最近はやってるミーム、ぜんぶ解説</p>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="テーマ切替">🌓</button>
  </header>

  <!-- ランキング -->
  <section id="tab-rank">
    <div class="power">
      <div style="font-size:26px">🧠</div>
      <div style="flex:1">
        <small>あなたのミーム力</small>
        <div style="display:flex;align-items:center;gap:10px"><b id="powerNum">0 / 0</b><div class="bar"><i id="powerBar"></i></div></div>
        <small id="powerRank">「知ってた！」を押すとたまっていきます</small>
      </div>
    </div>
    <input class="search" id="q" type="search" placeholder="🔍 ミーム名・元ネタで検索">
    <div class="chips" id="statusChips"></div>
    <div class="chips" id="typeChips" style="padding-top:0"></div>
    <div class="updated" id="updated"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- つくる -->
  <section id="tab-make" hidden>
    <div class="maker">
      <label for="tpl">つかうミーム構文</label>
      <select id="tpl"></select>
      <div id="tplDesc" class="hint"></div>
      <label for="word" id="wordLabel">ことば</label>
      <textarea id="word"></textarea>
      <div class="hint" id="wordHint"></div>
      <canvas id="cv" width="1080" height="1080"></canvas>
      <div class="row">
        <button class="btn main wide" id="saveImg">🖼 画像を保存</button>
        <button class="btn wide" id="copyTxt">📋 文章をコピー</button>
        <button class="btn wide" id="shareBtn" hidden>📤 シェア</button>
      </div>
    </div>
  </section>

  <!-- 海外ライブ -->
  <section id="tab-live" hidden>
    <div class="seg">
      <button id="segReddit" aria-pressed="true">🔥 海外のいま</button>
      <button id="segTpl" aria-pressed="false">🏆 定番テンプレTOP</button>
    </div>
    <div id="liveReddit">
      <div class="note">海外の掲示板Redditでいま伸びている投稿を、そのまま表示しています（英語です）。タップで元の投稿が開きます。</div>
      <div class="chips" id="subChips" style="padding-top:0"></div>
      <div class="feed" id="feed"></div>
      <button class="btn more" id="moreBtn" hidden>もっと見る</button>
    </div>
    <div id="liveTpl" hidden>
      <div class="note">世界でいちばん使われているミーム画像のランキング（Imgflip調べ）。タップするとその画像でミームを作れるページが開きます。</div>
      <div class="feed" id="tplFeed"></div>
    </div>
  </section>

  <!-- お気に入り -->
  <section id="tab-fav" hidden>
    <div class="updated">⭐ をつけたミーム</div>
    <div class="list" id="favList"></div>
  </section>
</div>

<nav><div class="in">
  <button data-tab="rank" aria-current="page"><span>📈</span>ランキング</button>
  <button data-tab="make"><span>✍️</span>つくる</button>
  <button data-tab="live"><span>🌍</span>海外ライブ</button>
  <button data-tab="fav"><span>⭐</span>お気に入り</button>
</div></nav>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
