<title>AI大喜利スタジオ</title>
<meta name="description" content="3Dのスタジオでお題に答えて、フリップに手書きで回答！AI審査員5体が笑いを判定する大喜利ゲーム。">
<meta name="theme-color" content="#0b0618">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&family=Yomogi&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--pink:#ff3d8b;--cyan:#2ee6ff;--gold:#ffd23f;--ink:#fff;--bg:#0b0618;--panel:rgba(18,10,40,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(180deg,#ff5fa0,#e0186a);color:#fff;font-weight:800;font-size:18px;padding:14px 22px;border-radius:999px;box-shadow:0 4px 0 #8a0c40,0 0 18px rgba(255,61,139,.5);letter-spacing:.05em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a0c40}
.btn.sub{background:linear-gradient(180deg,#3a3360,#251f45);box-shadow:0 4px 0 #120e26;font-size:15px;padding:11px 18px}
.btn.cy{background:linear-gradient(180deg,#5ff0ff,#13a9c9);box-shadow:0 4px 0 #0a5a6b,0 0 18px rgba(46,230,255,.45);color:#06202a}
.panel{position:fixed;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid rgba(255,255,255,.12);border-radius:20px;padding:18px;width:min(560px,calc(100% - 24px));box-shadow:0 10px 40px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.logo{font-family:"Dela Gothic One",sans-serif;text-align:center;line-height:1.1}
.logo .a{font-size:20px;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.logo .b{font-size:clamp(34px,10vw,52px);color:#fff;text-shadow:0 0 6px var(--pink),0 0 22px var(--pink),3px 3px 0 #7a0a3a}
/* タイトル */
#title{top:50%;transform:translate(-50%,-50%);text-align:center}
#title p{font-size:14px;line-height:1.7;opacity:.9;margin:12px 0 16px}
#title .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.judgeIntro{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 4px}
.judgeIntro div{font-size:10px;line-height:1.3;padding:6px 2px;border-radius:10px;background:rgba(255,255,255,.06)}
.judgeIntro b{display:block;font-size:11px}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
#hudTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-family:"Dela Gothic One",sans-serif;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:14px}
#timer.low{color:#ff5a5a;border-color:#ff5a5a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#odai{margin:8px auto 0;max-width:620px;background:linear-gradient(180deg,#fff,#ffe9f3);color:#2a0b1c;border-radius:14px;padding:10px 14px;font-weight:800;font-size:clamp(16px,4.6vw,22px);line-height:1.4;text-align:center;box-shadow:0 0 0 3px var(--pink),0 6px 24px rgba(255,61,139,.45)}
#odai small{display:block;font-size:11px;color:#c0185e;letter-spacing:.2em}
/* フリップ */
#flipWrap{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;align-items:center;gap:8px}
#flipBoard{position:relative;background:#f7f3e8;border-radius:10px;box-shadow:0 0 0 6px #d9cba4,0 0 0 9px #7a6a44,0 12px 30px rgba(0,0,0,.6);touch-action:none}
#flip{display:block;touch-action:none;border-radius:10px;cursor:crosshair}
#flipHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b5a988;font-family:Yomogi,cursive;font-size:20px;pointer-events:none;text-align:center;line-height:1.5}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px}
.tool{background:#2b2450;color:#fff;font-size:13px;font-weight:800;padding:9px 12px;border-radius:12px;border:2px solid transparent}
.tool.on{border-color:var(--cyan);box-shadow:0 0 10px rgba(46,230,255,.5)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px}
#flipActions{display:flex;gap:10px;align-items:center}
/* 確認 */
#confirm{bottom:calc(env(safe-area-inset-bottom) + 12px)}
#confirm h3{margin:0 0 6px;font-size:15px;color:var(--cyan)}
#confirm img{display:block;width:100%;max-height:28vh;object-fit:contain;background:#f7f3e8;border-radius:8px;margin-bottom:8px}
#readText{width:100%;font-family:inherit;font-size:18px;font-weight:800;padding:10px 12px;border-radius:12px;border:2px solid var(--cyan);background:#120c2a;color:#fff}
#confirm .note{font-size:12px;opacity:.75;margin:6px 0 10px;line-height:1.5}
#confirm .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* 審査 */
#meter{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:5px;background:rgba(0,0,0,.6);padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
#meter i{width:clamp(18px,6vw,26px);height:clamp(18px,6vw,26px);border-radius:50%;background:#2a2340;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);transition:.15s}
#meter i.on{background:radial-gradient(circle at 35% 30%,#fff,var(--gold) 45%,#ff8a00);box-shadow:0 0 14px var(--gold)}
#comment{bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:12px;align-items:center;padding:12px 16px}
#comment .face{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-family:"Dela Gothic One";font-size:20px;color:#000}
#comment .who{font-size:12px;font-weight:800}
#comment .txt{font-size:16px;font-weight:800;line-height:1.45}
#comment .pts{margin-left:auto;font-family:"Dela Gothic One";font-size:22px;color:var(--gold);flex:none}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:"Dela Gothic One",sans-serif;pointer-events:none}
#banner .big{font-size:clamp(48px,15vw,110px);line-height:1;display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
#banner .small{font-size:18px;margin-top:6px}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.b-don{color:var(--gold);text-shadow:0 0 10px #ff8a00,0 0 30px #ff3d00,4px 4px 0 #7a1a00}
.b-uke{color:var(--cyan);text-shadow:0 0 14px var(--cyan),3px 3px 0 #064050}
.b-sube{color:#9aa3c7;text-shadow:3px 3px 0 #1c1f33}
#skip{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 96px);font-size:12px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;border:1px solid rgba(255,255,255,.25)}
/* ラウンド結果・最終 */
#roundEnd,#final{top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 24px);overflow:auto}
#roundEnd h2,#final h2{margin:0 0 8px;font-family:"Dela Gothic One";font-size:22px;text-align:center}
.ansBox{background:#f7f3e8;border-radius:10px;padding:6px;margin:8px 0}
.ansBox img{width:100%;display:block;border-radius:6px}
.ansText{font-size:13px;opacity:.8;text-align:center;margin-top:2px}
.example{background:rgba(46,230,255,.1);border:1px dashed var(--cyan);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.5}
.example b{color:var(--cyan);font-size:12px;display:block}
.center{text-align:center}
.score{font-family:"Dela Gothic One";font-size:40px;color:var(--gold);text-shadow:0 0 14px #ff8a00;text-align:center}
.rankName{font-family:"Dela Gothic One";font-size:clamp(28px,9vw,40px);text-align:center;color:#fff;text-shadow:0 0 8px var(--pink),0 0 24px var(--pink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.gallery figure{margin:0;background:#f7f3e8;border-radius:8px;padding:4px;color:#2a0b1c;font-size:11px}
.gallery img{width:100%;display:block;border-radius:5px}
.gallery figcaption{padding:3px 2px;line-height:1.35}
.gallery figcaption b{color:#c0185e}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mode{font-size:11px;opacity:.6;text-align:center;margin-top:6px}
#toast{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:800;z-index:9;pointer-events:none;max-width:90%;text-align:center}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Dela Gothic One";font-size:20px;background:var(--bg);z-index:10}
#thinking{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);background:rgba(0,0,0,.7);padding:10px 18px;border-radius:999px;font-weight:800;font-size:15px}
#thinking span{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">スタジオ準備中…</div>

<section id="title" class="panel" hidden>
  <div class="logo"><div class="a">— AI審査員5体が判定 —</div><div class="b">AI大喜利<br>スタジオ</div></div>
  <p>出されたお題に、<b>フリップへ手書き</b>で答えよう！<br>AI審査員5体が1人2点・<b>10点満点</b>で笑いを判定。<br>7点以上で<b style="color:var(--gold)">ドッカン！</b> 全5問で大喜利の神を目指せ。</p>
  <div class="judgeIntro" id="judgeIntro"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="startBtn">収録スタート！</button></div>
  <div class="mode">手書きの読み取り：Google手書き入力／審査：無料AI（つながらない時は簡易判定）</div>
</section>

<div id="hud" hidden>
  <div id="hudTop"><span class="chip" id="roundChip">第1問</span><span class="chip" id="totalChip">合計 0点</span><span class="chip" id="timer">60</span></div>
  <div id="odai"><small>お題</small><span id="odaiText"></span></div>
</div>

<div id="flipWrap" hidden>
  <div id="flipBoard"><canvas id="flip"></canvas><div id="flipHint">ここに指で書いてね<br>（横書きで大きく）</div></div>
  <div id="tools">
    <button class="tool on" data-pen="5">細ペン</button>
    <button class="tool" data-pen="10">太ペン</button>
    <button class="tool on" data-col="#1a1a1a"><span class="dot" style="background:#1a1a1a"></span></button>
    <button class="tool" data-col="#d81b4a"><span class="dot" style="background:#d81b4a"></span></button>
    <button class="tool" data-col="#1565c0"><span class="dot" style="background:#1565c0"></span></button>
    <button class="tool" id="undoBtn">↶ 戻す</button>
    <button class="tool" id="clearBtn">全消し</button>
    <button class="tool" id="kbBtn">⌨ 文字で</button>
  </div>
  <div id="flipActions"><button class="btn" id="submitBtn">フリップを出す！</button></div>
</div>

<section id="confirm" class="panel" hidden>
  <h3>AIにはこう読めました</h3>
  <img id="confirmImg" alt="">
  <input id="readText" maxlength="60" autocomplete="off" placeholder="回答を文字で入力">
  <div class="note" id="confirmNote">読み間違いがあれば直してから審査へ。審査員が見るのはこの文字です。</div>
  <div class="row"><button class="btn sub" id="rewriteBtn">書き直す</button><button class="btn" id="judgeBtn">審査へ！</button></div>
</section>

<div id="meter" hidden></div>
<div id="thinking" hidden>審査員AIが協議中<span>…</span></div>
<section id="comment" class="panel" hidden><div class="face" id="cFace"></div><div><div class="who" id="cWho"></div><div class="txt" id="cTxt"></div></div><div class="pts" id="cPts"></div></section>
<div id="banner" hidden></div>
<button id="skip" hidden>早送り ▶▶</button>

<section id="roundEnd" class="panel" hidden></section>
<section id="final" class="panel" hidden></section>
<div id="toast" hidden></div>
