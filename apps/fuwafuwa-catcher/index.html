<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ふわふわキャッチャー</title>
<meta name="description" content="ゲーセンのクレーンゲームがスマホに！ボタンを押してるあいだアームが右へ。はなすとアームが下りてぬいぐるみをつかむ。ゆるいアームでも、引っかけ方しだいで取れる！ハズレが続くとパワーアップ。きんのたまごを狙え。">
<meta name="theme-color" content="#1a0a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#1a0a2e;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#panel{position:fixed;left:0;right:0;bottom:0;height:calc(124px + env(safe-area-inset-bottom));padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:22px;background:linear-gradient(180deg,#3a1660,#24093f);border-top:3px solid #ff7ad9;box-shadow:0 -6px 24px rgba(255,90,200,.25)}
.pb{width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.05;transition:transform .06s,filter .2s,opacity .2s}
.pb .ic{font-size:34px}
.pb .lb{font-size:13px;margin-top:2px}
#bMove{background:radial-gradient(circle at 35% 30%,#8ff7ff,#16b6e0 55%,#0a6f9c);box-shadow:0 7px 0 #064a6a,0 0 22px rgba(60,220,255,.55);color:#06304a}
#bStop{background:radial-gradient(circle at 35% 30%,#ffb3c6,#ff3d6e 55%,#b0103d);box-shadow:0 7px 0 #6e0524,0 0 22px rgba(255,60,110,.55);color:#4a0218}
.pb.on{transform:translateY(5px);box-shadow:0 2px 0 #333!important}
.pb.off{filter:grayscale(.85) brightness(.55);box-shadow:0 7px 0 #222!important}
.pb.glow{animation:glow .7s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#mute{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);font-size:20px}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(70,20,110,.7),rgba(15,4,30,.93));overflow-y:auto}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.logo{font-weight:900;line-height:1;font-size:min(12vw,64px,9vh);letter-spacing:-.02em;background:linear-gradient(180deg,#fff 0%,#ffd6f3 40%,#ff7ad9 70%,#c23cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a0f60) drop-shadow(0 0 20px rgba(255,120,220,.6));animation:logo 1.6s ease-in-out infinite}
.logo small{display:block;font-size:.42em;margin-top:.2em;letter-spacing:.12em;background:linear-gradient(90deg,#7af7ff,#ffe46a,#ff7ad9,#7af7ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 2.4s linear infinite}
@keyframes logo{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-4px)}}
@keyframes rb{to{background-position:300% 0}}
.how{max-width:360px;font-size:14px;line-height:1.75;font-weight:800;color:#f0e2ff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px 16px;text-align:left}
.how b{color:#7af7ff}
.how em{font-style:normal;color:#ffe46a}
.big{font-size:22px;font-weight:900;padding:15px 44px;border-radius:999px;background:linear-gradient(180deg,#ffe46a,#ff9d2e);color:#5a2200;box-shadow:0 6px 0 #a34a00,0 0 26px rgba(255,190,60,.55)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a34a00}
.sub{font-size:15px;font-weight:900;padding:10px 26px;border-radius:999px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.best{font-weight:800;color:#ffd6f3;font-size:14px}
.res-t{font-size:40px;font-weight:900;color:#ffe46a;text-shadow:0 4px 0 #8a3a00}
.res-s{font-size:20px;font-weight:900}
.res-s b{font-size:34px;color:#7af7ff}
.gotlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px}
.gotlist canvas,.zk canvas{position:static;width:56px;height:56px}
.zk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;width:100%}
.zk div{background:rgba(255,255,255,.08);border-radius:14px;padding:6px 2px;font-size:11px;font-weight:800;line-height:1.3}
.zk div.no{opacity:.55}
.zk span{display:block;color:#ffe46a}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="mute" aria-label="音のオン・オフ">🔊</button>
<div id="panel">
  <button class="pb" id="bMove" aria-label="おしているあいだ右へ"><span class="ic">▶</span><span class="lb">おしてる間<br>みぎへ</span></button>
  <button class="pb off" id="bStop" aria-label="アームをとめる"><span class="ic">▼</span><span class="lb">とめる</span></button>
</div>

<div class="ov" id="title">
  <div class="logo">ふわふわ<br>キャッチャー<small>CLAW CATCHER</small></div>
  <div class="how">
    <b>▶ボタン</b>を<em>押しているあいだ</em>アームが右へ。<br>
    はなすとアームが下りて、ぬいぐるみをつかむよ。<br>
    <b>▼とめる</b>で好きな高さで止められる。<br>
    左の<em>あな</em>に落とせばゲット！ アームはちょっとゆるいので、<em>ひっかけ</em>て運ぼう。<br>
    ハズレが続くと<em>パワーアップ</em>！
  </div>
  <button class="big" id="bStart">スタート（12回）</button>
  <div class="row"><button class="sub" id="bZukan">📖 ずかん</button></div>
  <div class="best" id="bestT"></div>
</div>

<div class="ov" id="result" hidden>
  <div class="res-t">おしまい！</div>
  <div class="res-s">スコア <b id="rScore">0</b></div>
  <div class="best" id="rBest"></div>
  <div class="gotlist" id="rGot"></div>
  <div class="row"><button class="big" id="bAgain">もういちど</button></div>
  <div class="row"><button class="sub" id="bZukan2">📖 ずかん</button><button class="sub" id="bTitle">タイトル</button></div>
</div>

<div class="ov" id="zukan" hidden>
  <div class="res-t" style="font-size:30px">📖 ずかん</div>
  <div class="best" id="zkCount"></div>
  <div class="zk" id="zkGrid"></div>
  <button class="big" id="bZkClose">とじる</button>
</div>
