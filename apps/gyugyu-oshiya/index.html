.card ul{padding-left:1.2em}
.card b{color:#c92a2a}

<canvas id="cv"></canvas>
<div id="hud" hidden>
  <span class="chip" id="hSt"></span>
  <span class="chip" id="hScore"><b>0</b> 点</span>
  <span class="chip" id="hKujo"></span>
</div>
<button id="mute" aria-label="音">🔊</button>

<div class="ov" id="title">
  <div class="logo"><small>破裂ギリギリまで詰めろ</small>ぎゅうぎゅう<br>押し屋</div>
  <div class="card">
    <h3>あそびかた</h3>
    <ul>
      <li>画面を<b>指でなぞる</b>と駅員の手がお客を押す</li>
      <li>指を<b>奥まで押し込むほど強く</b>押せる</li>
      <li>発車ベルが鳴ったらドアが閉まる。<b>挟まると開き直し</b></li>
      <li>乗れなかった人・降りそびれた人は<b>苦情</b>。10件でクビ</li>
      <li>ぎゅうぎゅうに詰めるほど高得点。でも<b>押しすぎると車両が破裂</b>する</li>
      <li>力士・ロボ・恐竜（着ぐるみ）・社長も来る</li>
    </ul>
  </div>
  <button class="big" id="bStart">出勤する</button>
  <div class="best" id="bestT"></div>
</div>

<div class="ov" id="over" hidden>
  <div class="res">
    <h2 id="oTitle"></h2>
    <div class="why" id="oWhy"></div>
    <table id="oTbl"></table>
    <div class="rank" id="oRank"></div>
  </div>
  <div class="best" id="oBest"></div>
  <button class="big" id="bRetry">もう一度押す</button>
</div>
