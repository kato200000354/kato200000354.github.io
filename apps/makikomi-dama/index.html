<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>まきこみ玉</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:#24304a}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:rgba(255,255,255,.85);border-radius:16px;padding:6px 12px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:800}
#time{font-size:22px;min-width:74px;text-align:center}
#time.hurry{color:#e2381f;animation:beat .5s infinite alternate}
@keyframes beat{to{transform:scale(1.12)}}
#sizeBox{text-align:center}
#size{font-size:30px;line-height:1.05;letter-spacing:.5px}
#sizeLbl{font-size:11px;opacity:.7}
#count{font-size:16px;min-width:74px;text-align:center}
#next{position:absolute;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:12px;background:rgba(36,48,74,.7);color:#fff;padding:4px 12px;border-radius:12px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast{position:absolute;top:calc(108px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 0 #24304a,0 0 6px #24304a;white-space:nowrap;transition:opacity .3s}
#toast.big{font-size:22px;color:#ffe45c}
#banner{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:clamp(26px,7vw,46px);font-weight:900;color:#fff;text-shadow:0 4px 0 #e2381f,0 0 12px rgba(0,0,0,.35);opacity:0;transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-size:.45em;text-shadow:0 2px 0 #24304a}
#dash{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;border:none;background:#ff7a3d;color:#fff;font-weight:900;font-size:16px;box-shadow:0 5px 0 #c4501e;pointer-events:auto;touch-action:none;font-family:inherit}
#dash:disabled{background:#c7c7c7;box-shadow:0 5px 0 #999}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.9)}
#hint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:16px;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;opacity:.9}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,40,80,.25)}
.card{background:#fffdf6;border-radius:24px;padding:22px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.15);max-height:92vh;overflow:auto}
h1{margin:0 0 4px;font-size:40px;letter-spacing:2px;color:#e2381f;text-shadow:0 3px 0 #ffd23f}
.sub{margin:0 0 14px;font-size:14px;opacity:.8}
.rules{text-align:left;font-size:14px;line-height:1.7;background:#f2f7ff;border-radius:14px;padding:10px 14px;margin:0 0 14px}
.btn{border:none;border-radius:18px;background:#2fb35a;color:#fff;font-size:22px;font-weight:900;padding:14px 36px;box-shadow:0 5px 0 #1e7f3d;font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1e7f3d}
.best{margin-top:12px;font-size:13px;opacity:.75}
#resSize{font-size:44px;font-weight:900;color:#e2381f;margin:2px 0}
#resRank{font-size:18px;font-weight:800;margin-bottom:8px}
#resList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 16px}
#resList span{background:#f2f7ff;border-radius:10px;padding:3px 8px;font-size:13px}
#newRec{color:#e2381f;font-weight:900}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="top">
    <div class="pill" id="time">3:00</div>
    <div class="pill" id="sizeBox"><div id="size">10cm</div><div id="sizeLbl">玉のおおきさ</div></div>
    <div class="pill" id="count">0こ</div>
  </div>
  <div id="next"></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="hint">ドラッグで操作 / ←↑→↓・WASD</div>
  <button id="dash">ダッシュ</button>
</div>

<div class="screen" id="title">
  <div class="card">
    <h1>まきこみ玉</h1>
    <p class="sub">ころがして、なんでも巻き込め！</p>
    <div class="rules">
      🟠 自分より<b>小さいもの</b>にぶつかると、くっついて玉が大きくなる<br>
      🧱 大きいものにぶつかると<b>はじかれて</b>、くっついた物が落ちる<br>
      ⏱ 制限時間は<b>3分</b>。画びょうから始めて、どこまで大きくなれる？<br>
      🎮 スマホ：画面をドラッグ／PC：矢印キー・WASD、スペースでダッシュ
    </div>
    <button class="btn" id="startBtn">スタート</button>
    <div class="best" id="bestTxt"></div>
  </div>
</div>

<div class="screen" id="result" hidden>
  <div class="card">
    <div class="sub">3分間の けっか</div>
    <div id="resSize">0cm</div>
    <div id="resRank"></div>
    <div id="newRec" hidden>🎉 自己ベスト更新！</div>
    <div id="resInfo" class="sub"></div>
    <div id="resList"></div>
    <button class="btn" id="retryBtn">もういちど</button>
    <div class="best" id="bestTxt2"></div>
  </div>
</div>
