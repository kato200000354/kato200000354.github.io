<title>ちょんまげ百人斬り</title>
<meta name="description" content="迫りくる足軽100人をスワイプで斬りまくる3Dチャンバラ。見切り・無双モード・たぬき爆弾・命乞い…最後は大将ゴンザエモンとの一騎打ち！">
<meta name="theme-color" content="#2b1850">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--ink:#2a1430;--gold:#ffcf4a;--red:#e8392f;--paper:#fff6e6}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0d22;color:#fff;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#game{position:fixed;inset:0;overflow:hidden}
#gl,#trail{position:absolute;inset:0;width:100%;height:100%;display:block}
#trail{pointer-events:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(255,20,20,.75));transition:opacity .3s}
#flash.on{opacity:1;transition:none}
#fevfx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 90px 24px rgba(255,200,40,.75)}
#game.fever #fevfx{opacity:1;animation:fpulse .45s infinite alternate}
@keyframes fpulse{to{box-shadow:inset 0 0 60px 14px rgba(255,120,30,.6)}}
.dela{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}
#hud{position:absolute;inset:0;pointer-events:none}
#hp{position:absolute;left:8px;top:calc(12px + env(safe-area-inset-top));font-size:13px;letter-spacing:-1px;white-space:nowrap;filter:drop-shadow(0 2px 2px #0008)}
#hp .off{opacity:.25;filter:grayscale(1)}
#left{position:absolute;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top));text-align:center;text-shadow:0 2px 3px #000a;line-height:1}
#left b{font-family:"Dela Gothic One";font-weight:400;font-size:28px;color:var(--gold)}
#left small{font-size:13px;font-weight:800;margin:0 2px}
#wavelbl{display:block;font-size:11px;font-weight:800;opacity:.85;margin-top:3px}
#score{position:absolute;right:52px;top:calc(12px + env(safe-area-inset-top));font-family:"Dela Gothic One";font-size:15px;text-shadow:0 2px 3px #000a}
#pauseBtn{pointer-events:auto;position:absolute;right:8px;top:calc(6px + env(safe-area-inset-top));width:38px;height:38px;border-radius:12px;border:2px solid #fff6;background:#0006;color:#fff;font-size:14px;font-weight:800}
#combo{position:absolute;right:12px;top:30%;text-align:right;text-shadow:0 3px 0 #0009;line-height:1}
#combo b{font-family:"Dela Gothic One";font-weight:400;font-size:46px;color:#fff;display:block;-webkit-text-stroke:2px var(--red)}
#combo span{font-weight:800;font-size:15px;color:var(--gold)}
#combo.bump b{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.3)}}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));width:min(78vw,340px);text-align:center;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}
#bossbar .bar{height:12px;border-radius:7px;background:#0008;border:2px solid #fff8;overflow:hidden;margin-top:3px}
#bossbar .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff4d3d,#ffb03b);transition:width .2s}
#guardBtn{pointer-events:auto;position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;
  border:4px solid #fff;background:radial-gradient(circle at 40% 35%,#5a8cff,#1f3f9a);color:#fff;font-family:"Dela Gothic One";font-size:24px;
  box-shadow:0 6px 0 #0d1f55,0 8px 16px #0008;touch-action:none}
#guardBtn small{display:block;font-family:"M PLUS Rounded 1c";font-size:10px;font-weight:800;opacity:.85;margin-top:-2px}
#guardBtn.on{transform:translateY(5px);box-shadow:0 1px 0 #0d1f55;background:radial-gradient(circle at 40% 35%,#9fc0ff,#3a62d0)}
#feverWrap{position:absolute;left:124px;right:14px;bottom:calc(52px + env(safe-area-inset-bottom));}
#feverWrap span{font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
#feverWrap .bar{height:14px;border-radius:8px;background:#0008;border:2px solid #fff8;overflow:hidden;margin-top:2px}
#feverBar{height:100%;width:0;background:linear-gradient(90deg,#ff9a3b,#ffe14a);transition:width .15s}
#game.fever #feverBar{background:linear-gradient(90deg,#fff,#ffe14a,#fff);background-size:200% 100%;animation:shine .5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom));width:min(92vw,420px);text-align:center;
  background:#000b;border:2px solid var(--gold);border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;line-height:1.45;animation:tipin .25s}
@keyframes tipin{from{opacity:0;transform:translate(-50%,10px)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none}
#banner .m{font-family:"Dela Gothic One";font-size:44px;color:#fff;-webkit-text-stroke:2px #3a0d10;text-shadow:0 4px 0 #3a0d10,0 0 24px #ff6a3d;animation:bin .4s cubic-bezier(.2,1.6,.4,1)}
#banner .s{font-weight:800;font-size:18px;color:var(--gold);text-shadow:0 2px 3px #000;margin-top:6px;padding:0 12px}
@keyframes bin{from{transform:scale(2.2);opacity:0}}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:"Dela Gothic One";white-space:nowrap;color:#fff;-webkit-text-stroke:1.5px #2a0a0a;text-shadow:0 3px 0 #2a0a0a;animation:popUp .9s forwards}
@keyframes popUp{0%{transform:translate(-50%,-50%) scale(.4)}15%{transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#222;border:2px solid #222;border-radius:14px;padding:3px 10px;font-weight:800;font-size:13px;white-space:nowrap;animation:bub 1.5s forwards}
.bubble::after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:#222}
@keyframes bub{0%{transform:translate(-50%,-80%) scale(.3)}12%{transform:translate(-50%,-100%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-190%);opacity:0}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto;background:linear-gradient(#1a0b2bcc,#1a0b2b66 40%,#1a0b2bdd)}
.logo{font-family:"Dela Gothic One";text-align:center;line-height:1.02;margin:0;font-weight:400}
.logo .a{display:block;font-size:24px;color:var(--gold);letter-spacing:4px;text-shadow:0 3px 0 #5a1d0a}
.logo .b{display:block;font-size:min(17vw,70px);color:#fff;-webkit-text-stroke:3px #4a0d12;text-shadow:0 6px 0 #4a0d12,0 0 30px #ff5a3d}
.catch{font-weight:800;font-size:13px;opacity:.9;margin:8px 0 12px}
.btn{font:inherit;font-family:"Dela Gothic One";font-size:24px;color:#3a1205;background:linear-gradient(#ffe27a,#ffb32b);border:3px solid #fff;border-radius:18px;
  padding:12px 34px;box-shadow:0 6px 0 #8a3d0a,0 10px 18px #0008;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a3d0a}
.btn.sub{font-size:16px;padding:9px 20px;background:linear-gradient(#fff,#d9d0e8);box-shadow:0 5px 0 #5a4a70}
.rules{background:#0009;border:2px solid #fff3;border-radius:16px;padding:10px 14px;margin:14px 0 6px;width:min(100%,380px);font-size:13px;line-height:1.5}
.rules div{display:flex;gap:10px;align-items:center;padding:4px 0}
.rules div+div{border-top:1px dashed #fff3}
.rules i{font-style:normal;font-size:24px;width:32px;text-align:center;flex:none}
.rules b{color:var(--gold)}
.best{font-size:12px;font-weight:800;opacity:.85;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#result h2{font-family:"Dela Gothic One";font-weight:400;font-size:34px;margin:0;text-shadow:0 4px 0 #4a0d12}
.rank{font-family:"Dela Gothic One";font-size:46px;color:var(--gold);-webkit-text-stroke:2px #4a1a05;text-shadow:0 5px 0 #4a1a05;margin:4px 0}
.cmt{font-weight:800;font-size:14px;margin-bottom:10px;text-align:center;max-width:340px}
.stats{background:#0009;border-radius:16px;padding:10px 16px;width:min(100%,320px);font-weight:800;font-size:15px}
.stats div{display:flex;justify-content:space-between;padding:3px 0}
.stats div span:last-child{color:var(--gold)}
.newrec{color:#ff7a7a;font-weight:800;font-size:15px;margin-top:8px;animation:bump .6s infinite}
#muteBtn{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));font:inherit;font-size:13px;font-weight:800;color:#fff;background:#0007;border:2px solid #fff5;border-radius:12px;padding:6px 10px}
</style>

<body>
<div id="game">
  <canvas id="gl"></canvas>
  <canvas id="trail"></canvas>
  <div id="fevfx"></div>
  <div id="flash"></div>
  <div id="fx"></div>
  <div id="hud" hidden>
    <div id="hp"></div>
    <div id="left"><small>残り</small><b id="leftN">100</b><small>人</small><span id="wavelbl"></span></div>
    <div id="score">0</div>
    <button id="pauseBtn" aria-label="一時停止">❚❚</button>
    <div id="bossbar" hidden>大将 鬼瓦ゴンザエモン<div class="bar"><i id="bossHp"></i></div></div>
    <div id="combo" hidden><b id="comboN">0</b><span>連斬！</span></div>
    <div id="feverWrap"><span>無双ゲージ</span><div class="bar"><div id="feverBar"></div></div></div>
    <button id="guardBtn">受け<small>長押し</small></button>
    <div id="tip" hidden></div>
  </div>
  <div id="banner"></div>

  <div id="title" class="scr">
    <button id="muteBtn">🔊 音あり</button>
    <h1 class="logo"><span class="a">ちょんまげ</span><span class="b">百人斬り</span></h1>
    <div class="catch">〜 斬られ役100人、本日も全力で参る 〜</div>
    <button class="btn" id="startBtn">出 陣 ！</button>
    <div class="rules">
      <div><i>👆</i><span>画面を<b>シュッとなぞって斬る</b>。なぞった線で真っ二つ！</span></div>
      <div><i>❗</i><span>敵に<b>「!」</b>が出たら<b>〈受け〉</b>。斬られる直前に押すと<b>見切り</b>でピヨる</span></div>
      <div><i>🪵</i><span>板持ちは<b>矢印の向き</b>に斬れ。板と同じ向きは防がれる</span></div>
      <div><i>🔥</i><span>斬りまくると<b>無双モード</b>。たぬきは斬ると<b>大爆発</b></span></div>
    </div>
    <div class="best" id="bestLbl"></div>
    <div class="best" style="opacity:.6">PC：マウスでドラッグして斬る／右クリック・スペースで受け</div>
  </div>

  <div id="pause" class="scr" hidden>
    <h2 class="logo"><span class="b" style="font-size:44px">一時停止</span></h2>
    <div class="row"><button class="btn" id="resumeBtn">つづける</button></div>
    <div class="row"><button class="btn sub" id="muteBtn2">🔊 音あり</button><button class="btn sub" id="quitBtn">タイトルへ</button></div>
  </div>

  <div id="result" class="scr" hidden>
    <h2 id="resTitle">百人斬り達成！</h2>
    <div class="rank" id="resRank">剣豪</div>
    <div class="cmt" id="resCmt"></div>
    <div class="stats" id="resStats"></div>
    <div class="newrec" id="resNew" hidden>★ 自己ベスト更新！ ★</div>
    <div class="row"><button class="btn" id="againBtn">もう一度</button></div>
    <div class="row"><button class="btn sub" id="toTitleBtn">タイトルへ</button></div>
  </div>
</div>
