<!DOCTYPE html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ウマヌシライフ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--navy:#0a1f44;--panel:rgba(9,27,62,.93);--line:rgba(110,160,240,.42);--gold:#f8c94a;--gold2:#e49b12;--tx:#eef4ff;--mu:#9fb6dc;--card:#f2f6fe;--ctx:#13284d;--green:#57d06a;--red:#ff6b6b;--blue:#2f7be0}
html,body{min-height:100%}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--tx);background:#0a1f44;overflow-x:hidden;font-size:14px}
button,select,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
button:disabled{cursor:not-allowed;opacity:.45}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#3f86d6 0%,#9fd0f3 36%,#d9eec8 44%,#78b956 50%,#2f6e2c 100%)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,18,48,.5),rgba(5,18,48,.78))}
#app{max-width:1180px;margin:0 auto;padding:8px 10px 92px}
/* header */
.hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(180deg,#174284,#0b2452);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hdr .lg{font-weight:900;font-size:17px;color:#fff;text-shadow:0 0 8px #3a8bff;letter-spacing:1px;white-space:nowrap}
.hdr .dt{font-weight:800;font-size:15px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;white-space:nowrap}
.chip b{color:var(--gold)}
.sp{flex:1}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);overflow:hidden;min-width:0}
.panel>h2{font-size:17px;padding:8px 14px;background:linear-gradient(90deg,#1b4f9c,#0d2b60 75%,rgba(13,43,96,0));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;letter-spacing:1px}
.panel>h2 small{font-size:12px;color:var(--mu);font-weight:400;margin-left:auto;letter-spacing:0}
.pb{padding:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g-l{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.g-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:860px){.grid2,.g-l,.g-r{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.g3{grid-template-columns:1fr}}
.stack>*+*{margin-top:12px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;font-weight:800;color:#fff;background:linear-gradient(180deg,#3b8cf0,#1d5bc0);border:1px solid #6fb0ff;box-shadow:0 3px 0 #0f3a85,0 4px 10px rgba(0,0,0,.3);transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0f3a85}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#f0a81c);color:#3a2300;border-color:#fff1b0;box-shadow:0 3px 0 #9a6205,0 4px 10px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(180deg,#ff7d7d,#d83a3a);border-color:#ffb3b3;box-shadow:0 3px 0 #8a1c1c}
.btn.gray{background:linear-gradient(180deg,#5f7396,#3c4d6d);border-color:#8da0c4;box-shadow:0 3px 0 #222f47}
.btn.big{padding:13px 22px;font-size:17px;width:100%}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.w{width:100%}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:8px 8px 0 0;background:rgba(255,255,255,.08);color:var(--mu);font-weight:700;border:1px solid var(--line);border-bottom:none}
.tabs button.on{background:linear-gradient(180deg,#e9f2ff,#c8dcfa);color:#0d2b60}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:12px;font-weight:700}
.seg button.on{background:linear-gradient(180deg,#ffe07a,#f0a81c);color:#3a2300;border-color:#fff1b0}
/* menu list */
.mlist{display:flex;flex-direction:column;gap:7px}
.mitem{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:7px 10px;border-radius:10px;background:linear-gradient(90deg,#f4f8ff,#d8e6fb);color:var(--ctx);border:1px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .1s}
.mitem:hover{transform:translateX(4px)}
.mitem .ic{width:54px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:linear-gradient(180deg,#7cc0f5,#3d8a3c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.mitem b{display:block;font-size:15px}
.mitem small{color:#4a5f86;font-size:11px}
/* cards */
.hc{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--card);color:var(--ctx);border:2px solid transparent;cursor:pointer;text-align:left;width:100%;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hc.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(248,201,74,.4),0 2px 6px rgba(0,0,0,.25)}
.hc .pt{width:64px;height:64px;flex-shrink:0;border-radius:8px;overflow:hidden}
.hc .inf{flex:1;min-width:0}
.hc .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .sub{font-size:11px;color:#4a5f86}
.hc .pr{font-weight:900;font-size:15px;color:#0d2b60;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:7px}
.pt svg,.bigpt svg{display:block;width:100%;height:100%}
.bigpt{width:120px;height:120px;border-radius:10px;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.5)}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 6px;border-radius:6px;font-weight:900;font-size:15px;color:#fff;background:#3a7be8;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);flex-shrink:0}
.rk.S,.rk.SS{background:linear-gradient(180deg,#ffd75e,#e08a00)}
.rk.A,.rk.Ap{background:#e2453b}.rk.B,.rk.Bp{background:#2f7be0}.rk.C,.rk.Cp{background:#2aa457}.rk.D{background:#7c8aa5}.rk.E,.rk.F,.rk.G{background:#8e8e8e}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;background:#2b4a7d;color:#fff;margin-left:4px;vertical-align:middle}
.tag.g{background:#1f8a4c}.tag.r{background:#c93636}.tag.y{background:#c98a0a}.tag.p{background:#b03a8c}.tag.k{background:#555}
/* stats */
.stat{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.sbar{position:relative;height:11px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.sbar .cap{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.14)}
.sbar .cur{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2fbf4a,#a7e83a,#f3e246);border-radius:6px}
.stat b{text-align:right}
.light .sbar{background:#cfdaf0}.light .sbar .cap{background:rgba(30,80,160,.15)}
.mini{font-size:12px;color:var(--mu)}
.light .mini{color:#4a5f86}
.apt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px}
.apt span{background:rgba(255,255,255,.08);border-radius:5px;padding:3px 6px;display:flex;justify-content:space-between}
.apt b{color:var(--gold)}
.box{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:10px}
.box h3{font-size:13px;color:var(--gold);margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px;color:var(--ctx);background:var(--card);border-radius:8px;overflow:hidden}
.t th{background:#1b4f9c;color:#fff;font-weight:700;padding:6px;font-size:12px;text-align:left}
.t td{padding:7px 6px;border-bottom:1px solid #d5e0f3}
.t tr.sel td{background:#fff3c4}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#e3edff}
.t tr.me td{background:#fff3c4;font-weight:800}
.t .num{text-align:right;white-space:nowrap}
.gb{display:inline-block;font-size:10px;font-weight:900;padding:1px 5px;border-radius:4px;color:#fff;background:#888;vertical-align:middle;margin-left:3px}
.gb.GI{background:#1a54c4}.gb.GII{background:#d63a3a}.gb.GIII{background:#1f9a4e}.gb.OP{background:#d98a14}
.scroll{overflow-x:auto}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,#123a78,#071a3d);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:2px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:8px;font-size:11px;color:#cfe0ff;max-width:110px}
.nav button span{font-size:20px;line-height:1}
.nav button.on{background:rgba(255,255,255,.12);color:var(--gold)}
.nav .note{flex:2.2;font-size:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.nav .note{display:none}}
/* overlay / modal */
.ov{position:fixed;inset:0;background:rgba(0,8,26,.78);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
.modal{background:linear-gradient(180deg,#123068,#0a1f44);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal>h2{font-size:17px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#123068;z-index:1}
.modal>h2 .x{margin-left:auto;font-size:20px;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.1)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:linear-gradient(180deg,#ffe07a,#f0a81c);color:#3a2300;padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease;max-width:92vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}}
.news{font-size:12px;line-height:1.6;max-height:160px;overflow:auto}
.news div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
.sec{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:10px;padding:10px;border:1px solid var(--line)}
.sec .av{font-size:34px;line-height:1}
.sec p{font-size:13px;line-height:1.6}
input[type=text]{background:#fff;color:#13284d;border:2px solid #7fb0ff;border-radius:8px;padding:8px 10px;width:100%}
select{background:#fff;color:#13284d;border:1px solid #7fb0ff;border-radius:6px;padding:5px 6px}
.empty{padding:24px;text-align:center;color:var(--mu)}
/* title */
#title{position:fixed;inset:0;z-index:40;overflow:hidden;background:#3d86d6}
#title .scene{position:absolute;inset:0;width:100%;height:100%}
#title .horse{position:absolute;right:-2%;bottom:0;height:92%;aspect-ratio:1/1;max-width:62vw;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
#title .tl{position:absolute;left:4%;top:7%;z-index:2}
.logo{font-size:clamp(38px,8vw,82px);font-weight:900;color:#fff;letter-spacing:2px;line-height:1.05;text-shadow:0 3px 0 #0d3f8f,0 0 3px #0d3f8f,3px 0 0 #0d3f8f,-3px 0 0 #0d3f8f,0 -3px 0 #0d3f8f,0 8px 18px rgba(0,0,0,.4);font-style:italic}
.logo-sub{font-size:clamp(14px,2.4vw,22px);color:#0d2b60;font-weight:900;background:rgba(255,255,255,.85);display:inline-block;padding:3px 14px;border-radius:999px;margin-top:8px}
#title .tm{position:absolute;left:4%;top:40%;z-index:2;display:flex;flex-direction:column;gap:9px;width:min(280px,60vw)}
.tbtn{display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:8px;background:linear-gradient(90deg,#123a78,#0b2452);color:#fff;font-weight:800;font-size:16px;border:1px solid #6fa6ff;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .1s}
.tbtn:hover:not(:disabled){transform:translateX(6px)}
.tbtn.first{background:linear-gradient(90deg,#ffe07a,#f0a81c);color:#3a2300;border-color:#fff1b0}
#title .tq{position:absolute;left:4%;bottom:6%;z-index:2;color:#fff;font-weight:800;font-size:clamp(14px,2vw,20px);line-height:1.7;text-shadow:0 2px 6px rgba(0,0,0,.8)}
@media(max-width:640px){#title .horse{height:60%;max-width:90vw;right:-12%;opacity:.95}#title .tm{top:auto;bottom:22%}#title .tq{bottom:3%;font-size:13px}}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
/* race view */
#rv{position:fixed;inset:0;z-index:70;background:#061633;display:flex;flex-direction:column}
.rv-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#174284,#0b2452);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rv-h b{font-size:18px}
.rv-st{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b2452}
.rv-st canvas{display:block}
#title .horse svg{width:100%;height:100%;display:block}
.rv-b{position:absolute;right:8px;top:8px;width:min(250px,46vw);display:flex;flex-direction:column;gap:3px}
.rv-b div{display:flex;align-items:center;gap:6px;background:rgba(8,26,62,.82);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.rv-b div.me{background:rgba(240,168,28,.9);color:#2a1800}
.rv-b i{font-style:normal;width:18px;height:18px;border-radius:4px;background:#fff;color:#0b2452;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.rv-b span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-rem{position:absolute;left:10px;top:8px;background:rgba(8,26,62,.82);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-weight:900;font-size:16px}
.rv-prog{position:absolute;left:10px;right:10px;bottom:8px;height:14px}
.rv-c{display:flex;gap:10px;align-items:center;padding:8px 12px;background:linear-gradient(180deg,#f2f6fe,#d6e4fa);color:var(--ctx);min-height:72px}
.rv-c .av{width:52px;height:52px;flex-shrink:0;border-radius:8px;overflow:hidden;background:#cfe0f8}
.rv-c p{font-weight:800;font-size:15px;line-height:1.5;flex:1}
.rv-c small{color:#4a5f86;font-weight:700}
.rv-ctl{display:flex;gap:6px;flex-direction:column}
.res-wrap{flex:1;overflow:auto;padding:12px}
.medal{text-align:center;padding:10px}
.medal .w{font-size:clamp(34px,7vw,58px);font-weight:900;font-family:Georgia,serif;letter-spacing:3px;background:linear-gradient(180deg,#fff6c8,#f3c13a 55%,#b9780a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a3a00)}
.medal .n{font-size:24px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #3a2300}
.shine{animation:sh 1.6s ease-in-out infinite alternate}
@keyframes sh{from{filter:drop-shadow(0 0 4px #ffd75e)}to{filter:drop-shadow(0 0 18px #ffd75e)}}
.flash{animation:fl .6s ease}
@keyframes fl{from{background:#fff3c4}}
</style>
</head>
