<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2452">
<title>ウマヌシライフ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--navy:#0a1f44;--panel:rgba(9,27,62,.93);--line:rgba(110,160,240,.42);--gold:#f8c94a;--gold2:#e49b12;--tx:#eef4ff;--mu:#9fb6dc;--card:#f2f6fe;--ctx:#13284d;--green:#57d06a;--red:#ff6b6b;--blue:#2f7be0}
html,body{min-height:100%}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--tx);background:#0a1f44;overflow-x:hidden;font-size:14px}
button,select,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
button:disabled{cursor:not-allowed;opacity:.45}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#3f86d6 0%,#9fd0f3 36%,#d9eec8 44%,#78b956 50%,#2f6e2c 100%)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,18,48,.5),rgba(5,18,48,.78))}
#app{max-width:1180px;margin:0 auto;padding:8px 10px 92px}
/* header */
.hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(180deg,#174284,#0b2452);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.hdr .lg{font-weight:900;font-size:17px;color:#fff;text-shadow:0 0 8px #3a8bff;letter-spacing:1px;white-space:nowrap}
.hdr .dt{font-weight:800;font-size:15px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;white-space:nowrap}
.chip b{color:var(--gold)}
.sp{flex:1}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);overflow:hidden;min-width:0}
.panel>h2{font-size:17px;padding:8px 14px;background:linear-gradient(90deg,#1b4f9c,#0d2b60 75%,rgba(13,43,96,0));border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;letter-spacing:1px}
.panel>h2 small{font-size:12px;color:var(--mu);font-weight:400;margin-left:auto;letter-spacing:0}
.pb{padding:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g-l{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.g-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:860px){.grid2,.g-l,.g-r{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.g3{grid-template-columns:1fr}}
.stack>*+*{margin-top:12px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;font-weight:800;color:#fff;background:linear-gradient(180deg,#3b8cf0,#1d5bc0);border:1px solid #6fb0ff;box-shadow:0 3px 0 #0f3a85,0 4px 10px rgba(0,0,0,.3);transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0f3a85}
.btn.gold{background:linear-gradient(180deg,#ffe07a,#f0a81c);color:#3a2300;border-color:#fff1b0;box-shadow:0 3px 0 #9a6205,0 4px 10px rgba(0,0,0,.3)}
.btn.red{background:linear-gradient(180deg,#ff7d7d,#d83a3a);border-color:#ffb3b3;box-shadow:0 3px 0 #8a1c1c}
.btn.gray{background:linear-gradient(180deg,#5f7396,#3c4d6d);border-color:#8da0c4;box-shadow:0 3px 0 #222f47}
.btn.big{padding:13px 22px;font-size:17px;width:100%}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.w{width:100%}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:8px 8px 0 0;background:rgba(255,255,255,.08);color:var(--mu);font-weight:700;border:1px solid var(--line);border-bottom:none}
.tabs button.on{background:linear-gradient(180deg,#e9f2ff,#c8dcfa);color:#0d2b60}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:12px;font-weight:700}
.seg button.on{background:linear-gradient(180deg,#ffe07a,#f0a81c);color:#3a2300;border-color:#fff1b0}
/* menu list */
.mlist{display:flex;flex-direction:column;gap:7px}
.mitem{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:7px 10px;border-radius:10px;background:linear-gradient(90deg,#f4f8ff,#d8e6fb);color:var(--ctx);border:1px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .1s}
.mitem:hover{transform:translateX(4px)}
.mitem .ic{width:54px;height:40px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:linear-gradient(180deg,#7cc0f5,#3d8a3c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.mitem b{display:block;font-size:15px}
.mitem small{color:#4a5f86;font-size:11px}
/* cards */
.hc{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--card);color:var(--ctx);border:2px solid transparent;cursor:pointer;text-align:left;width:100%;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hc.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(248,201,74,.4),0 2px 6px rgba(0,0,0,.25)}
.hc .pt{width:64px;height:64px;flex-shrink:0;border-radius:8px;overflow:hidden}
.hc .inf{flex:1;min-width:0}
.hc .nm{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .sub{font-size:11px;color:#4a5f86}
.hc .pr{font-weight:900;font-size:15px;color:#0d2b60;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:7px}
.pt svg,.bigpt svg{display:block;width:100%;height:100%}
.bigpt{width:120px;height:120px;border-radius:10px;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.5)}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 6px;border-radius:6px;font-weight:900;font-size:15px;color:#fff;background:#3a7be8;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);flex-shrink:0}
.rk.S,.rk.SS{background:linear-gradient(180deg,#ffd75e,#e08a00)}
.rk.A,.rk.Ap{background:#e2453b}.rk.B,.rk.Bp{background:#2f7be0}.rk.C,.rk.Cp{background:#2aa457}.rk.D{background:#7c8aa5}.rk.E,.rk.F,.rk.G{background:#8e8e8e}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px;background:#2b4a7d;color:#fff;margin-left:4px;vertical-align:middle}
.tag.g{background:#1f8a4c}.tag.r{background:#c93636}.tag.y{background:#c98a0a}.tag.p{background:#b03a8c}.tag.k{background:#555}
/* stats */
.stat{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.sbar{position:relative;height:11px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.sbar .cap{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.14)}
.sbar .cur{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2fbf4a,#a7e83a,#f3e246);border-radius:6px}
.stat b{text-align:right}
.light .sbar{background:#cfdaf0}.light .sbar .cap{background:rgba(30,80,160,.15)}
.mini{font-size:12px;color:var(--mu)}
.light .mini{color:#4a5f86}
.apt{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px}
.apt span{background:rgba(255,255,255,.08);border-radius:5px;padding:3px 6px;display:flex;justify-content:space-between}
.apt b{color:var(--gold)}
.box{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:10px}
.box h3{font-size:13px;color:var(--gold);margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px;color:var(--ctx);background:var(--card);border-radius:8px;overflow:hidden}
.t th{background:#1b4f9c;color:#fff;font-weight:700;padding:6px;font-size:12px;text-align:left}
.t td{padding:7px 6px;border-bottom:1px solid #d5e0f3}
.t tr.sel td{background:#fff3c4}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#e3edff}
.t tr.me td{background:#fff3c4;font-weight:800}
.t .num{text-align:right;white-space:nowrap}
.gb{display:inline-block;font-size:10px;font-weight:900;padding:1px 5px;border-radius:4px;color:#fff;background:#888;vertical-align:middle;margin-left:3px}
.gb.GI{background:#1a54c4}.gb.GII{background:#d63a3a}.gb.GIII{background:#1f9a4e}.gb.OP{background:#d98a14}
.scroll{overflow-x:auto}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,#123a78,#071a3d);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
.nav .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:2px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border-radius:8px;font-size:11px;color:#cfe0ff;max-width:110px}
.nav button span{font-size:20px;line-height:1}
.nav button.on{background:rgba(255,255,255,.12);color:var(--gold)}
.nav .note{flex:2.2;font-size:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){.nav .note{display:none}}
/* overlay / modal */
.ov{position:fixed;inset:0;background:rgba(0,8,26,.78);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
.modal{background:linear-gradient(180deg,#123068,#0a1f44);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.modal>h2{font-size:17px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#123068;z-index:1}
.modal>h2 .x{margin-left:auto;font-size:20px;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.1)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:99;background:linear-gradient(180deg,#ffe07a,#f0a81c);color:#3a2300;padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease;max-width:92vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}}
.news{font-size:12px;line-height:1.6;max-height:160px;overflow:auto}
.news div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
.sec{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.08);border-radius:10px;padding:10px;border:1px solid var(--line)}
.sec .av{font-size:34px;line-height:1}
.sec p{font-size:13px;line-height:1.6}
input[type=text]{background:#fff;color:#13284d;border:2px solid #7fb0ff;border-radius:8px;padding:8px 10px;width:100%}
select{background:#fff;color:#13284d;border:1px solid #7fb0ff;border-radius:6px;padding:5px 6px}
.empty{padding:24px;text-align:center;color:var(--mu)}
/* title */
#title{position:fixed;inset:0;z-index:40;overflow:hidden;background:#3d86d6}
#title .scene{position:absolute;inset:0;width:100%;height:100%}
#title .horse{position:absolute;right:-2%;bottom:0;height:92%;aspect-ratio:1/1;max-width:62vw;filter:drop-shadow(0 10px 30px rgba(0,0,0,.45))}
#title .tl{position:absolute;left:4%;top:7%;z-index:2}
.logo{font-size:clamp(38px,8vw,82px);font-weight:900;color:#fff;letter-spacing:2px;line-height:1.05;text-shadow:0 3px 0 #0d3f8f,0 0 3px #0d3f8f,3px 0 0 #0d3f8f,-3px 0 0 #0d3f8f,0 -3px 0 #0d3f8f,0 8px 18px rgba(0,0,0,.4);font-style:italic}
.logo-sub{font-size:clamp(14px,2.4vw,22px);color:#0d2b60;font-weight:900;background:rgba(255,255,255,.85);display:inline-block;padding:3px 14px;border-radius:999px;margin-top:8px}
#title .tm{position:absolute;left:4%;top:40%;z-index:2;display:flex;flex-direction:column;gap:9px;width:min(280px,60vw)}
.tbtn{display:flex;align-items:center;gap:12px;padding:11px 18px;border-radius:8px;background:linear-gradient(90deg,#123a78,#0b2452);color:#fff;font-weight:800;font-size:16px;border:1px solid #6fa6ff;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .1s}
.tbtn:hover:not(:disabled){transform:translateX(6px)}
.tbtn.first{background:linear-gradient(90deg,#ffe07a,#f0a81c);color:#3a2300;border-color:#fff1b0}
#title .tq{position:absolute;left:4%;bottom:6%;z-index:2;color:#fff;font-weight:800;font-size:clamp(14px,2vw,20px);line-height:1.7;text-shadow:0 2px 6px rgba(0,0,0,.8)}
@media(max-width:640px){#title .horse{height:60%;max-width:90vw;right:-12%;opacity:.95}#title .tm{top:auto;bottom:22%}#title .tq{bottom:3%;font-size:13px}}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3)}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
/* race view */
#rv{position:fixed;inset:0;z-index:70;background:#061633;display:flex;flex-direction:column}
.rv-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#174284,#0b2452);border-bottom:1px solid var(--line);flex-wrap:wrap}
.rv-h b{font-size:18px}
.rv-st{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#0b2452}
.rv-st canvas{display:block}
#title .horse svg{width:100%;height:100%;display:block}
.rv-b{position:absolute;right:8px;top:8px;width:min(250px,46vw);display:flex;flex-direction:column;gap:3px}
.rv-b div{display:flex;align-items:center;gap:6px;background:rgba(8,26,62,.82);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.rv-b div.me{background:rgba(240,168,28,.9);color:#2a1800}
.rv-b i{font-style:normal;width:18px;height:18px;border-radius:4px;background:#fff;color:#0b2452;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.rv-b span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-rem{position:absolute;left:10px;top:8px;background:rgba(8,26,62,.82);border:1px solid var(--line);border-radius:8px;padding:4px 12px;font-weight:900;font-size:16px}
.rv-prog{position:absolute;left:10px;right:10px;bottom:8px;height:14px}
.rv-c{display:flex;gap:10px;align-items:center;padding:8px 12px;background:linear-gradient(180deg,#f2f6fe,#d6e4fa);color:var(--ctx);min-height:72px}
.rv-c .av{width:52px;height:52px;flex-shrink:0;border-radius:8px;overflow:hidden;background:#cfe0f8}
.rv-c p{font-weight:800;font-size:15px;line-height:1.5;flex:1}
.rv-c small{color:#4a5f86;font-weight:700}
.rv-ctl{display:flex;gap:6px;flex-direction:column}
.res-wrap{flex:1;overflow:auto;padding:12px}
.medal{text-align:center;padding:10px}
.medal .w{font-size:clamp(34px,7vw,58px);font-weight:900;font-family:Georgia,serif;letter-spacing:3px;background:linear-gradient(180deg,#fff6c8,#f3c13a 55%,#b9780a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a3a00)}
.medal .n{font-size:24px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #3a2300}
.shine{animation:sh 1.6s ease-in-out infinite alternate}
@keyframes sh{from{filter:drop-shadow(0 0 4px #ffd75e)}to{filter:drop-shadow(0 0 18px #ffd75e)}}
.flash{animation:fl .6s ease}
@keyframes fl{from{background:#fff3c4}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="title" hidden></div>
<div id="app" hidden>
  <div class="hdr" id="hdr"></div>
  <main id="main"></main>
</div>
<nav class="nav" id="nav" hidden><div class="in" id="navin"></div></nav>
<div id="ovl"></div>
<script>
'use strict';
/* ================= 基本ユーティリティ ================= */
const SAVE_KEY='umanushi-life-save-v1',SET_KEY='umanushi-life-settings';
const $=s=>document.querySelector(s);
const R=Math.random;
const ri=(a,b)=>Math.floor(a+R()*(b-a+1));
const rf=(a,b)=>a+R()*(b-a);
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gauss=()=>(R()+R()+R()+R()-2)*1.73;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function yen(m){m=Math.round(m);const neg=m<0;m=Math.abs(m);const o=Math.floor(m/10000),r=m%10000;return(neg?'-':'')+(o?o+'億'+(r?r+'万':'')+'円':r+'万円');}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
let SET={fast:false,sound:true};
try{Object.assign(SET,JSON.parse(lsGet(SET_KEY)||'{}'));}catch(e){}
function saveSet(){lsSet(SET_KEY,JSON.stringify(SET));}

/* ================= データ ================= */
const STATS=[['spd','スピード'],['sta','スタミナ'],['pow','瞬発力'],['guts','根性'],['tem','気性']];
const APT=['×','△','○','◎'];
const DISTN=['短距離','マイル','中距離','長距離'];
const distCat=d=>d<=1400?0:d<=1800?1:d<=2400?2:3;
const aptMul=lv=>[.962,.979,.992,1][lv];
const COATS=[{n:'鹿毛',c:'#8a4b22',m:'#24130a'},{n:'黒鹿毛',c:'#4e2c18',m:'#140a05'},{n:'青鹿毛',c:'#2e1e15',m:'#080504'},{n:'栗毛',c:'#b8652a',m:'#8a4518'},{n:'芦毛',c:'#b6b9c0',m:'#6e7179'},{n:'青毛',c:'#1f1c21',m:'#000'}];
const RANKS=['E','D','C','B','A','S'];
const GROWTH={早熟:{2:1.3,3:1.1,4:.7,5:.4},普通:{2:1,3:1.15,4:1,5:.65},晩成:{2:.75,3:.95,4:1.2,5:1.05,6:.65}};
const PEAK_END={早熟:4,普通:5,晩成:6};
const STYLES=['逃げ','先行','差し','追込'];

 STATS.forEach(([k])=>cap[k]=clamp(Math.round(q+rf(-9,9)),30,100));

 STATS.forEach(([k])=>stats[k]=Math.min(cap[k],Math.round(cap[k]*f*rf(.93,1.06))));
 return{id:S.nid++,name:o.name||genName(),sex:o.sex||(R()<.55?'牡':'牝'),birthYear:o.birthYear,coat:o.coat??ri(0,5),blaze:R()<.45,

const raceCache={};
function weekRaces(y,m,w){
 const a=AW(y,m,w);if(raceCache[a])return raceCache[a];
 const rng=mulberry(a*7919+13),rp=arr=>arr[Math.floor(rng()*arr.length)],rr=(x,z)=>Math.floor(x+rng()*(z-x+1));
 const list=[],vs=venues(m);
 GR.filter(g=>g[0]===m&&g[1]===w).forEach(g=>list.push({name:g[2],grade:g[3],venue:g[4],surf:g[5],dist:g[6],age:g[7],sex:g[8],prize:g[9],field:g[3]==='GI'?18:16}));
 const gen=(name,grade,age,prize)=>{const surf=rng()<.6?'芝':'ダ';const dist=surf==='芝'?rp([1200,1400,1600,1800,2000,2000,2200,2400,2600]):rp([1200,1400,1700,1800,1900,2100]);
  list.push({name,grade,venue:rp(vs),surf,dist,age,sex:(grade!=='OP'&&rng()<.15)?'牝':null,prize,field:rr(12,16)});};
 if(m>=6){gen('2歳新馬','新馬','2',700);if(rng()<.6)gen('2歳新馬','新馬','2',700);}
 const young=m<6;
 gen(young?'3歳未勝利':'未勝利','未勝利',young?'3':'2-3',550);gen(young?'3歳未勝利':'未勝利','未勝利',young?'3':'2-3',550);
 gen('1勝クラス','1勝','all',800);gen('1勝クラス','1勝','all',800);
 gen(rp(OP_NAMES),'OP','all',2200);
 let n=1;list.forEach(r=>{r.R=/^G/.test(r.grade)?11:(r.grade==='OP'?10:n++);});
 list.sort((p,q)=>p.R-q.R);list.forEach((r,i)=>{r.id=a+'-'+i;r.aw=a;});
 raceCache[a]=list;return list;
}

const AGEN={'2':'2歳','3':'3歳','2-3':'2・3歳','3上':'3歳以上','4上':'4歳以上','all':'2歳以上'};
function ineligible(h,r){
 const age=ageOf(h);
 if(h.status!=='race')return'現役馬ではありません';
 if(h.injury>0)return'故障で休養中';
 if(age===2&&S.month<6)return'2歳馬のデビューは6月から';
 if(!ageOk(age,r.age))return AGEN[r.age]+'限定';
 if(r.sex==='牝'&&h.sex!=='牝')return'牝馬限定';
 if(NOW()-h.lastRace<2)return'レース間隔が短い（中1週必要）';
 if(r.grade==='新馬'&&h.starts>0)return'出走経験あり';
 if(r.grade==='未勝利'&&h.wins>0)return'勝ち上がり済み';
 if(r.grade==='1勝'&&h.wins===0)return'未勝利馬は出走できません';
 if(r.grade==='1勝'&&h.wins>=2)return'オープン馬は出走できません';
 if((r.grade==='OP'||r.grade==='GII'||r.grade==='GIII')&&h.wins<1)return'1勝以上が必要';
 if(r.grade==='GI'&&(h.wins<1||h.earnings<(age===2?900:2500)))return'収得賞金が不足（'+(age===2?'900':'2500')+'万円以上）';
 const e=S.entries[h.id];if(e&&e.race!==r.id)return'他のレースに登録済み';
 return'';
}

function doTrain(h,t,auto){
 const now=NOW();
 const eff=(1+S.fac.train*.1)*ageFactor(h)*(auto?.8:1)*(1-h.fatigue/170)*(1+h.cond*.04);
 const out=[];
 for(const k in t.g){const room=h.cap[k]-h.stats[k];if(room<=0)continue;let g=t.g[k]*eff*rf(.75,1.25)*clamp(room/12,.12,1);g=Math.min(g,room);h.stats[k]+=g;if(g>=.5)out.push(STATS.find(s=>s[0]===k)[1]+'+'+Math.round(g));}
 h.fatigue=clamp(h.fatigue+t.f,0,100);
 if(t.id==='light'&&R()<.45)h.cond=Math.min(2,h.cond+1);
 if(t.id==='rest'){if(h.cond<0)h.cond++;else if(R()<.3)h.cond=Math.min(2,h.cond+1);}
 if(t.f>10&&h.fatigue>65&&R()<.35)h.cond=Math.max(-2,h.cond-1);
 let inj=false;
 if(t.f>0&&h.fatigue>62){const p=(h.fatigue-62)/110*(1-.22*S.fac.vet);if(R()<p){h.injury=ri(3,10);inj=true;delete S.entries[h.id];}}
 book('train',t.c);h.trained=now;
 return{out,inj};
}
function autoTrain(h){
 const now=NOW();let id;
 if(h.fatigue>58||h.policy==='rest')id=h.fatigue>75?'rest':'light';
 else if(h.policy==='speed')id=now%2?'hill':'awase';
 else if(h.policy==='stamina')id=now%2?'wood':'pool';
 else id=['hill','wood','pool','awase','gate'][now%5];
 doTrain(h,TRAIN.find(t=>t.id===id),true);
}

/* ================= 週の進行 ================= */
function pickWeather(){const r=R();return r<.55?WEATHER[0]:r<.75?WEATHER[1]:r<.88?WEATHER[2]:WEATHER[3];}
async function nextWeek(){
 if(UI.busy)return;UI.busy=true;
 try{
  for(const r of thisWeekRaces()){
   const ents=Object.entries(S.entries).filter(([,e])=>e.race===r.id).map(([hid,e])=>({h:hById(hid),j:e.j,style:e.style})).filter(e=>e.h&&!ineligible(e.h,r));
   if(ents.length)await runRace(r,ents);
  }
  endWeek();
 }catch(e){console.error(e);}
 UI.busy=false;
 render();
 if(S.debt>=3){gameOver();return;}
 if(UI.pendingFoals&&UI.pendingFoals.length)nameFoals();
}
function endWeek(){
 const now=NOW();
 racers().forEach(h=>{
  if(h.injury>0){h.injury--;h.fatigue=Math.max(0,h.fatigue-10);if(h.injury===0)news(`${esc(h.name)}が故障から復帰しました。`);}
  else if(h.trained!==now&&h.lastRace!==now)autoTrain(h);
  h.fatigue=Math.max(0,h.fatigue-10-S.fac.vet*2);
  const r=R();
  if(h.fatigue>70&&R()<.4)h.cond=Math.max(-2,h.cond-1);else if(r<.17)h.cond=Math.min(2,h.cond+1);else if(r<.32)h.cond=Math.max(-2,h.cond-1);
 });
 S.entries={};
 if(S.week===4)monthEnd();
 S.week++;
 if(S.week>4){S.week=1;S.month++;if(S.month>12){S.month=1;S.year++;newYear();}monthStart();}
 S.weather=pickWeather();
 const gi=thisWeekRaces().filter(r=>r.grade==='GI');
 S.notice=gi.length?`今週は ${gi.map(r=>r.name).join('・')}（GI）！`:'新しいレースに登録できます';
 if(ownerRank()>=5)unlock('rankS');if(S.totalPrize>=100000)unlock('prize');
 save();
}
function monthEnd(){
 const rc=racers().length,fm=S.horses.filter(h=>h.status==='mare'||h.status==='stallion').length,fo=S.horses.filter(h=>h.status==='foal').length;
 const cost=rc*60+fm*25+fo*15+20*(S.fac.stable+S.fac.train+S.fac.farm+S.fac.vet);
 if(cost>0)book('upkeep',cost);
 S.moneyHist.push({k:lkey(),m:S.money});if(S.moneyHist.length>24)S.moneyHist.shift();
 if(S.money<0){S.debt++;news(`⚠ 資金がマイナスです（${S.debt}/3ヶ月）。3ヶ月続くと破産します！`);}else S.debt=0;
}
function monthStart(){
 genMarket();news('新しい競走馬が入荷しました。');
 if(S.month>=2&&S.month<=6){

  if(S.month===2&&S.horses.some(h=>h.status==='mare'))news('🌸 繁殖シーズン到来！（2〜6月に配合できます）');
 }
 racers().forEach(h=>{const a=ageOf(h),pe=PEAK_END[h.growth];if(a>pe){const d=.35+(a-pe)*.25;STATS.forEach(([k])=>{const x=rf(0,d*1.6);h.stats[k]=Math.max(20,h.stats[k]-x);h.cap[k]=Math.max(h.stats[k],h.cap[k]-x*.8);});}});

function newYear(){
 const born=[];
 S.horses.filter(h=>h.status==='mare'&&h.preg).forEach(m=>{const f=makeFoal(m,m.preg);m.preg=null;S.horses.push(f);born.push(f);});
 S.horses.filter(h=>h.status==='foal'&&ageOf(h)>=2).forEach(h=>{h.status='race';STATS.forEach(([k])=>h.stats[k]=Math.round(h.cap[k]*rf(.52,.63)));news(`${esc(h.name)}が2歳になり、競走馬として入厩しました！`);});
 racers().filter(h=>ageOf(h)>=9).forEach(h=>autoRetire(h));
 S.horses.filter(h=>(h.status==='mare'&&ageOf(h)>=21)||(h.status==='stallion'&&ageOf(h)>=24)).forEach(h=>{news(`${esc(h.name)}が功労馬として余生を過ごすことになりました。`);removeHorse(h);});
 S.rivals=S.rivals.filter(r=>S.year-r.birthYear<=6);for(let i=0;i<3;i++)S.rivals.push(makeRival(S.year-2));
 news(`🎍 ${S.year}年が始まりました。全馬が1つ歳をとりました。`);
 if(born.length){news(`🐴 ${born.length}頭の子馬が誕生しました！`);UI.pendingFoals=born.map(h=>h.id);}
}
function makeFoal(m,p){
 const mix=(a,b)=>clamp(Math.round((a+b)/2+rf(-.8,.8)),0,3);
 const h=makeHorse({q:60,birthYear:S.year,status:'foal',sire:p.n,dam:m.name,homebred:true,coat:R()<.5?p.coat:m.coat,
  growth:R()<.4?p.g:R()<.6?m.growth:pick(['早熟','普通','晩成']),apt:{turf:mix(p.turf,m.turf),dirt:mix(p.dirt,m.dirt),dist:p.dist.map((v,i)=>mix(v,m.dist[i]))}});
 STATS.forEach(([k])=>{let v=(p.c[k]+m.cap[k])/2*rf(.9,1.09)+rf(-3,4);if(R()<.06)v+=8;h.cap[k]=clamp(Math.round(v),30,100);h.stats[k]=Math.round(h.cap[k]*.3);});
 h.style=pick(STYLES);return h;
}
function addHall(h){if(h.hallDone)return;h.hallDone=true;if(h.grades.length||h.wins>=4)S.hall.unshift({name:h.name,sex:h.sex,by:h.birthYear,starts:h.starts,wins:h.wins,sec:h.sec,thi:h.thi,earnings:h.earnings,grades:h.grades.map(g=>g.n+(g.gr==='GI'?'(GI)':'')),homebred:h.homebred});}
function removeHorse(h){addHall(h);S.horses=S.horses.filter(x=>x!==h);delete S.entries[h.id];}
function canStallion(h){return h.sex==='牡'&&(h.grades.length>0||h.earnings>=10000);}
function retireTo(h,to){
 delete S.entries[h.id];addHall(h);
 if(to==='mare'){h.status='mare';h.preg=null;news(`${esc(h.name)}が引退し、繁殖牝馬になりました。`);}
 else if(to==='stallion'){h.status='stallion';h.fee=studFeeOf(h);news(`${esc(h.name)}が引退し、種牡馬入り！（種付け料 ${yen(h.fee)}）`);}
 else{book('sell',50);news(`${esc(h.name)}が引退し、乗馬クラブへ譲渡されました。`);removeHorse(h);}
}
function autoRetire(h){
 const room=farmers().length<farmCap();
 if(h.sex==='牝'&&room)retireTo(h,'mare');else if(canStallion(h)&&room)retireTo(h,'stallion');else retireTo(h,'release');
}

/* ================= レース実行 ================= */
function runRace(race,ents){return new Promise(res=>{
 const field=buildField(race,ents);const sim=simulate(field,race);
 showRaceIntro(race,field,()=>playRace(race,field,sim,()=>{const out=applyResult(race,field,sim);showResults(race,field,sim,out,res);}));
});}
function npcAge(code){return code==='2'?2:code==='3'?3:code==='2-3'?(S.month<6?3:ri(2,3)):code==='4上'?ri(4,7):ri(3,6);}
function npcRunner(race){
 const base=GRADE_BASE[race.grade]+(race.age==='2'?-8:0)+(race.age==='3'&&S.month<=6?-3:0)+(race.age==='2-3'&&S.month>=6&&S.month<=9?-4:0);
 const off=ri(-5,5),st={};STATS.forEach(([k])=>st[k]=clamp(base+off+ri(-6,6),25,99));
 const c=pick(COATS);const sex=race.sex||(R()<.6?'牡':'牝');
 return{name:genName(),sa:sex+npcAge(race.age),jockey:R()<.25?pick(JOCKEYS).n:pick(NPC_J),silk:`hsl(${ri(0,359)},${ri(55,85)}%,${ri(35,55)}%)`,silk2:`hsl(${ri(0,359)},70%,${ri(40,90)}%)`,coat:c.c,mane:c.m,player:false,...st,style:pick(STYLES),mult:rf(.992,1)*(1+ri(2,7)*.001)};
}
function rivalOk(r,race){const age=S.year-r.birthYear;if(age<2||(age===2&&S.month<6))return false;if(!ageOk(age,race.age))return false;if(race.sex==='牝'&&r.sex!=='牝')return false;return(race.surf==='芝'?r.turf:r.dirt)>=2&&r.dist[distCat(race.dist)]>=2;}
function rivalRunner(r,race){const st=rivalStats(r);const c=COATS[r.coat];return{name:r.name,sa:r.sex+(S.year-r.birthYear),jockey:pick(JOCKEYS.filter(j=>j.s>=6)).n,silk:r.silk,silk2:'#fff',coat:c.c,mane:c.m,player:false,rival:r,...st,style:r.style,mult:aptMul(race.surf==='芝'?r.turf:r.dirt)*aptMul(r.dist[distCat(race.dist)])*rf(.994,1.002)*1.006};}
function buildField(race,ents){
 const field=[];
 ents.forEach(e=>{const h=e.h,jk=JOCKEYS[e.j]||JOCKEYS[0],c=COATS[h.coat];
  field.push({name:h.name,sa:h.sex+ageOf(h),jockey:jk.n,silk:S.silk,silk2:'#fff',coat:c.c,mane:c.m,player:true,hid:h.id,
   spd:h.stats.spd,sta:h.stats.sta,pow:h.stats.pow,guts:h.stats.guts,tem:h.stats.tem,style:e.style||h.style,
   mult:aptMul(race.surf==='芝'?h.turf:h.dirt)*aptMul(h.dist[distCat(race.dist)])*[.985,.993,1,1.006,1.012][h.cond+2]*(1-Math.max(0,h.fatigue-40)*.0005)*(h.shoe?1.006:1)*(1+jk.s*.001)});});
 if(/^G/.test(race.grade)){const rv=shuffle(S.rivals.filter(r=>rivalOk(r,race))).slice(0,race.grade==='GI'?4:(R()<.6?1:0));rv.forEach(r=>field.push(rivalRunner(r,race)));}
 while(field.length<race.field)field.push(npcRunner(race));
 shuffle(field);field.forEach((r,i)=>{r.no=i+1;r.lane=i;});
 const sc=field.map(r=>({r,s:(r.spd*.35+r.pow*.25+r.sta*(race.dist>2000?.25:.12)+r.guts*.1)*r.mult+rf(-4,4)})).sort((a,b)=>b.s-a.s);
 sc.forEach((x,i)=>{x.r.pop=i+1;x.r.mark=['◎','○','▲','△','△'][i]||'';});
 return field;
}
function simulate(field,race){
 const D=race.dist,dt=.05,frames=[];let t=0,step=0,done=0,maxFin=0;
 const SE={逃げ:1.04,先行:1.02,差し:.995,追込:.975},SM={逃げ:1,先行:.995,差し:.99,追込:.985},SF={逃げ:.99,先行:1.012,差し:1.03,追込:1.045};
 const fl=Math.max(400,D*.25);
 const tr=S.weather.t==='重'?(race.surf==='ダ'?1.004:.99):S.weather.t==='稍重'?(race.surf==='ダ'?1.002:.996):1;
 field.forEach(r=>{const es=r.sta*2000/D;r.E=D*(.9+es*.004);r.pos=0;r.v=0;r.delay=R()<(105-r.tem)/480?rf(.45,1):rf(0,.15);r.kakari=R()<(100-r.tem)/320;r.vC=(15+r.spd*.016)*r.mult*rf(.993,1.007)*tr;r.fin=null;r.noise=1;});
 frames.push(field.map(()=>0));
 while(t<420){
  t+=dt;step++;
  const ns=Math.floor(t)!==Math.floor(t-dt);
  for(const r of field){
   if(t<r.delay)continue;
   if(ns)r.noise=1+rf(-.007,.007);
   const prog=r.pos/D,rem=D-r.pos;let tg;
   if(r.pos>=D)tg=r.vC*.55;
   else if(r.E<=0)tg=r.vC*(.86+r.guts*.001);
   else if(prog<.15)tg=r.vC*SE[r.style];
   else if(rem>fl)tg=r.vC*SM[r.style];
   else tg=(r.vC+.3+r.pow*.012*r.mult)*SF[r.style];
   if(rem>0&&rem<300&&r.E>0&&field.some(o=>o!==r&&Math.abs(o.pos-r.pos)<1.5))tg+=r.guts*.004;
   tg*=r.noise;
   r.v+=(tg-r.v)*Math.min(1,dt*(t-r.delay<4?2.2:1.3));
   if(r.pos<D){let dr=Math.pow(r.v/r.vC,3);if(r.kakari&&prog>.1&&prog<.5)dr*=1.3;r.E-=dr*r.v*dt;}
   const old=r.pos;r.pos+=r.v*dt;
   if(old<D&&r.pos>=D){r.fin=t-dt+(D-old)/(r.pos-old)*dt;done++;maxFin=Math.max(maxFin,r.fin);}
  }
  if(step%5===0)frames.push(field.map(r=>r.pos));
  if(done===field.length&&t>maxFin+2.5)break;
 }
 field.forEach(r=>{if(r.fin===null)r.fin=t+(D-r.pos)/Math.max(1,r.v);});
 const order=field.map((r,i)=>i).sort((a,b)=>field[a].fin-field[b].fin);
 return{frames,T:(frames.length-1)*.25,order,fin:field.map(r=>r.fin),D};
}
function posAt(sim,i,pt){const f=pt/.25,a=Math.min(Math.floor(f),sim.frames.length-1),b=Math.min(a+1,sim.frames.length-1);const A=sim.frames[a][i],B=sim.frames[b][i];return A+(B-A)*Math.min(1,f-a);}
function fmtTime(t){const d=Math.round(t*10),m=Math.floor(d/600);return m+':'+((d%600)/10).toFixed(1).padStart(4,'0');}
function marginStr(m){const L=m/2.4;if(L<.04)return'ハナ';if(L<.15)return'アタマ';if(L<.3)return'クビ';if(L<.6)return'1/2';if(L<.85)return'3/4';if(L<1.15)return'1';if(L<1.4)return'1 1/4';if(L<1.65)return'1 1/2';if(L<1.9)return'1 3/4';if(L<2.5)return'2';if(L<10)return Math.round(L)+'';return'大差';}
function applyResult(race,field,sim){
 const out=[],now=NOW();
 sim.order.forEach((idx,k)=>{
  const r=field[idx],pos=k+1;
  if(r.rival&&pos===1){r.rival.wins++;if(race.grade==='GI')r.rival.g1++;}
  if(!r.player)return;
  const h=hById(r.hid);if(!h)return;
  const pay=pos<=5?Math.round(race.prize*PAY[pos-1]):0;
  h.starts++;if(pos===1)h.wins++;else if(pos===2)h.sec++;else if(pos===3)h.thi++;
  h.earnings+=pay;if(pay){book('prize',pay);S.totalPrize+=pay;}
  h.hist.unshift({y:S.year,m:S.month,n:race.name,gr:race.grade,v:race.venue,s:race.surf,d:race.dist,p:pos,f:field.length,t:sim.fin[idx],j:r.jockey,pop:r.pop});
  if(h.hist.length>40)h.hist.length=40;
  h.fatigue=clamp(h.fatigue+18+race.dist/200,0,100);h.lastRace=now;h.shoe=false;
  if(pos===1&&R()<.5)h.cond=Math.min(2,h.cond+1);else if(pos>8&&R()<.4)h.cond=Math.max(-2,h.cond-1);
  if(R()<.02*(h.fatigue>75?3:1)*(1-.22*S.fac.vet)){h.injury=ri(4,12);news(`⚠ ${esc(h.name)}がレース後に故障…（${h.injury}週の休養）`);}
  if(pos===1){
   unlock('win');
   if(/^G/.test(race.grade)){
    h.grades.push({n:race.name,gr:race.grade,y:S.year});S.records.unshift({y:S.year,m:S.month,n:race.name,gr:race.grade,h:h.name});
    unlock('grade');if(h.homebred)unlock('home');
    if(race.grade==='GI'){S.g1++;unlock('g1');if(h.homebred)unlock('homeg1');if(S.g1>=10)unlock('g1x10');
     ({'日本ダービー':'derby','オークス':'oaks','有馬記念':'arima','ジャパンカップ':'jc'})[race.name]&&unlock({'日本ダービー':'derby','オークス':'oaks','有馬記念':'arima','ジャパンカップ':'jc'}[race.name]);
     const gs=h.grades.map(g=>g.n);
     if(['皐月賞','日本ダービー','菊花賞'].every(n=>gs.includes(n)))unlock('triple');
     if(['桜花賞','オークス','秋華賞'].every(n=>gs.includes(n)))unlock('ftriple');}
    news(`🏆 <b>${esc(h.name)}</b>が${race.name}（${race.grade}）を制覇！`);
   }else news(`${esc(h.name)}が${race.venue}${race.name}で1着！`);
  }else news(`${esc(h.name)}は${race.name}で${pos}着${pay?'（+'+yen(pay)+'）':''}`);
  out.push({h,pos,pay});
 });
 return out;
}

function playRace(race,field,sim,done){

 const cv=$('#rvc'),ctx=cv.getContext('2d');let W=300,H=200;
 const resize=()=>{const st=$('#rvst');if(!st)return;const dpr=Math.min(2,window.devicePixelRatio||1);W=st.clientWidth;H=Math.min(st.clientHeight,W<640?W*1.05:W*.62);cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};

 $('#rvsp').onclick=()=>{mul=mul===1?2:1;$('#rvsp').textContent=mul===1?'×2':'×1';};

 const comms=buildComments(race,field,sim);let ci=0;
 const pIdx=Math.max(0,field.findIndex(r=>r.player));
 let cam=0,pt=0,last=performance.now(),bt=0,goalSnd=false;
 function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  pt+=dt*rate*mul;if(skip)pt=sim.T;if(pt>sim.T)pt=sim.T;
  const pos=field.map((r,i)=>posAt(sim,i,pt));
  cam+=(pos[pIdx]-cam)*Math.min(1,dt*5);if(pt<.3||skip)cam=pos[pIdx];
  drawRace(ctx,W,H,race,field,pos,cam,pt);
  while(ci<comms.length&&comms[ci].t<=pt){$('#rvt').innerHTML=comms[ci].s;ci++;}
  bt-=dt;if(bt<=0){bt=.2;updateBoard(field,pos,sim,pt,race);}
  if(!goalSnd&&pt>=sim.fin[sim.order[0]]){goalSnd=true;if(!skip)tone(660,.3,0,'triangle',.06);}
  if(pt>=sim.T){window.removeEventListener('resize',resize);updateBoard(field,pos,sim,pt,race);setTimeout(done,skip?60:900);return;}
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
}
function rankAt(field,pos,sim,pt){return field.map((r,i)=>i).sort((a,b)=>{const fa=sim.fin[a]<=pt,fb=sim.fin[b]<=pt;if(fa&&fb)return sim.fin[a]-sim.fin[b];if(fa)return-1;if(fb)return 1;return pos[b]-pos[a];});}
function updateBoard(field,pos,sim,pt,race){
 const o=rankAt(field,pos,sim,pt);let html='';
 o.slice(0,5).forEach((i,k)=>{const r=field[i];html+=`<div class="${r.player?'me':''}"><i>${k+1}</i><span>${esc(r.name)}</span></div>`;});
 o.forEach((i,k)=>{if(k>=5&&field[i].player)html+=`<div class="me"><i>${k+1}</i><span>${esc(field[i].name)}</span></div>`;});
 $('#rvb').innerHTML=html;
 const lead=Math.max(...pos);$('#rvrem').textContent=lead>=race.dist?'ゴール！':'残り '+Math.ceil((race.dist-lead)/10)*10+'m';
}
function buildComments(race,field,sim){
 const D=race.dist,cs=[],pl=field.filter(r=>r.player);
 const nm=r=>r.player?`<span style="color:#d97a00">${esc(r.name)}</span>`:esc(r.name);
 const orderAt=t=>{const pos=field.map((r,i)=>posAt(sim,i,t));return field.map((r,i)=>i).sort((a,b)=>pos[b]-pos[a]);};
 const tl=x=>{for(let k=0;k<sim.frames.length;k++)if(Math.max(...sim.frames[k])>=x)return k*.25;return sim.T;};
 cs.push({t:0,s:`${race.venue}${race.R}R ${race.name}、スタートしました！`});
 const late=field.filter(r=>r.delay>.4);if(late.length)cs.push({t:1.5,s:`おっと、${late.slice(0,3).map(nm).join('、')}は出遅れた！`});
 let t=tl(D*.12),o=orderAt(t);cs.push({t,s:`先手を取ったのは${nm(field[o[0]])}。2番手に${nm(field[o[1]])}、続いて${nm(field[o[2]])}。`});
 t=tl(D*.35);o=orderAt(t);pl.forEach((p,j)=>{const k=o.indexOf(field.indexOf(p))+1;cs.push({t:t+j*2,s:`${nm(p)}は現在${k}番手。${k<=3?'好位につけています！':k<=8?'中団で脚をためています。':'後方からの競馬です。'}`});});
 const kk=pl.find(p=>p.kakari);if(kk)cs.push({t:tl(D*.25),s:`${nm(kk)}、少し掛かり気味か！？`});
 if(D>=1600){const tk=tl(1000);cs.push({t:tk,s:`1000mの通過は${tk.toFixed(1)}秒、${tk<59.6?'速いペース':tk>61.8?'ゆったりとしたペース':'平均ペース'}です。`});}
 t=tl(D-Math.max(450,D*.25));o=orderAt(t);cs.push({t,s:`さあ最後の直線！先頭は${nm(field[o[0]])}！${nm(field[o[1]])}も並びかける！`});
 t=tl(D-200);o=orderAt(t);const pk=pl.length?o.indexOf(field.indexOf(pl[0]))+1:0;
 cs.push({t,s:`残り200！${nm(field[o[0]])}先頭、${nm(field[o[1]])}が迫る！${pl.length?nm(pl[0])+'は'+pk+'番手！':''}`});
 const w=field[sim.order[0]];cs.push({t:sim.fin[sim.order[0]],s:`${nm(w)}、ゴールイン！${w.player?'やりました！見事な勝利です！':''}`});
 return cs.sort((a,b)=>a.t-b.t);
}
function cloud(ctx,x,y,s){ctx.beginPath();ctx.arc(x,y,14*s,0,7);ctx.arc(x+16*s,y-6*s,17*s,0,7);ctx.arc(x+34*s,y,13*s,0,7);ctx.arc(x+16*s,y+5*s,13*s,0,7);ctx.fill();}
function drawRace(ctx,W,H,race,field,pos,cam,pt){
 const D=race.dist,ppm=Math.max(6,W/62),cx=W*.42,hz=H*.3,ty=hz+H*.08,turf=race.surf==='芝';
 const L=cam-cx/ppm,Rr=cam+(W-cx)/ppm,wx=x=>cx+(x-cam)*ppm;
 let g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,S.weather.t==='重'?'#7b8fa6':'#2f7fd2');g.addColorStop(1,S.weather.t==='重'?'#c9d3dd':'#cbe9fb');ctx.fillStyle=g;ctx.fillRect(0,0,W,hz+2);
 ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<5;i++){const span=W+400;const x=((i*span/5-cam*ppm*.02)%span+span)%span-200;cloud(ctx,x,hz*.18+(i*29)%(hz*.4),.6+(i%3)*.25);}
 ctx.fillStyle='#7d9fc4';ctx.beginPath();ctx.moveTo(0,hz);for(let x=0;x<=W;x+=8){const w=x+cam*ppm*.04;ctx.lineTo(x,hz-H*.06-Math.sin(w*.008)*H*.035-Math.sin(w*.021+1)*H*.02);}ctx.lineTo(W,hz);ctx.closePath();ctx.fill();
 ctx.fillStyle='#5e9d48';ctx.fillRect(0,hz,W,ty-hz);
 const tp=cam*ppm*.15,j0=Math.floor(tp/26)-2;ctx.fillStyle='#2f6b33';
 for(let j=j0;j<j0+W/26+5;j++){const x=j*26-tp;ctx.beginPath();ctx.arc(x,hz,9+Math.abs(j*7)%5*2,Math.PI,0);ctx.fill();}
 // スタンド
 const sx=cx+(D-300-cam)*ppm*.55,ex=cx+(D+80-cam)*ppm*.55;
 if(ex>0&&sx<W){const top=hz-H*.11;ctx.fillStyle='#dfe7f1';ctx.fillRect(sx,top,ex-sx,ty-top);ctx.fillStyle='#2c4f7c';ctx.beginPath();ctx.moveTo(sx-10,top);ctx.lineTo(ex+10,top);ctx.lineTo(ex,top+H*.035);ctx.lineTo(sx,top+H*.035);ctx.fill();
  for(let row=0;row<4;row++){for(let x=Math.max(sx+4,0);x<Math.min(ex-4,W);x+=5){const k=Math.floor((x-sx)/5)*7+row*13;ctx.fillStyle=['#e44','#36c','#fc3','#fff','#4a4','#c6f','#333'][k%7];ctx.fillRect(x,top+H*.05+row*((ty-top-H*.06)/4),3,3);}}
  ctx.fillStyle='#9aa9bd';for(let x=sx;x<ex;x+=40)ctx.fillRect(x,top,3,ty-top);}
 // コース
 ctx.fillStyle=turf?'#4ea443':'#b4875a';ctx.fillRect(0,ty,W,H-ty);
 ctx.fillStyle=turf?'#5cb34f':'#bf9367';for(let k=Math.floor(L/10);k<=Rr/10;k++){if(k%2===0)ctx.fillRect(wx(k*10),ty,10*ppm,H-ty);}
 ctx.fillStyle='#fff';ctx.fillRect(0,ty-6,W,3);for(let k=Math.floor(L/4);k<=Rr/4+1;k++)ctx.fillRect(wx(k*4),ty-6,2,8);
 for(let rem=200;rem<D;rem+=200){const x=wx(D-rem);if(x<-30||x>W+30)continue;ctx.fillStyle='#d33';ctx.fillRect(x,ty-H*.1,3,H*.1);ctx.fillStyle='#fff';ctx.fillRect(x-12,ty-H*.1-14,27,14);ctx.fillStyle='#c22';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(rem,x+1.5,ty-H*.1-7);}
 const gx=wx(D);if(gx>-40&&gx<W+40){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(gx,ty,3,H-ty);ctx.fillStyle='#fff';ctx.fillRect(gx-2,ty-H*.2,5,H*.2);ctx.fillStyle='#e33';ctx.beginPath();ctx.arc(gx,ty-H*.2,13,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText('GOAL',gx,ty-H*.2+1);}
 if(pt<4){const x=wx(-2);if(x>-60){ctx.fillStyle='rgba(40,120,60,.85)';ctx.fillRect(x-8,ty+4,10,H-ty-H*.07);}}
 // 馬
 const n=field.length,top=ty+H*.07,bot=H-H*.12;
 const idx=field.map((r,i)=>i).sort((a,b)=>field[a].lane-field[b].lane);
 const labels=[];
 idx.forEach(i=>{const r=field[i],x=wx(pos[i]);if(x<-70||x>W+70)return;const y=top+r.lane*(bot-top)/Math.max(1,n-1);const s=Math.min(H/400,W/640)*(.72+.34*r.lane/Math.max(1,n-1));drawHorse(ctx,x,y,s,r,pos[i]*.42);if(r.player)labels.push([x,y-34*s,r]);});
 labels.forEach(([x,y,r])=>{ctx.font='bold 12px sans-serif';const w=ctx.measureText(r.name).width+12;ctx.fillStyle='rgba(240,168,28,.95)';ctx.fillRect(x-w/2,y-26,w,17);ctx.beginPath();ctx.moveTo(x-5,y-9);ctx.lineTo(x+5,y-9);ctx.lineTo(x,y-3);ctx.fill();ctx.fillStyle='#2a1800';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r.name,x,y-17);});
 ctx.fillStyle='#fff';ctx.fillRect(0,H-H*.07,W,3);for(let k=Math.floor(L/4);k<=Rr/4+1;k++)ctx.fillRect(wx(k*4),H-H*.07,2,7);
 // 進捗バー
 const py=H-10;ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(14,py-3,W-28,6);
 field.forEach((r,i)=>{if(r.player)return;ctx.fillStyle='#fff';ctx.fillRect(14+(W-28)*clamp(pos[i]/D,0,1)-1.5,py-4,3,8);});
 field.forEach((r,i)=>{if(!r.player)return;ctx.fillStyle='#f8c94a';ctx.beginPath();ctx.arc(14+(W-28)*clamp(pos[i]/D,0,1),py,5,0,7);ctx.fill();});
}
function drawHorse(ctx,x,y,s,r,ph){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,26,26,4,0,0,7);ctx.fill();
 ctx.translate(0,Math.sin(ph*2)*1.4);
 const leg=(hx,hy,a,col)=>{ctx.strokeStyle=col;ctx.lineWidth=3.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hx,hy);const kx=hx+Math.sin(a)*11,ky=hy+Math.cos(a)*11;ctx.lineTo(kx,ky);const b=a+(a>0?-.9:.6);ctx.lineTo(kx+Math.sin(b)*11,ky+Math.cos(b)*11);ctx.stroke();};
 leg(15,3,Math.sin(ph+.7)*.85,r.mane);leg(-15,3,Math.sin(ph+3.8)*.85,r.mane);
 ctx.strokeStyle=r.mane;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-21,-5);ctx.quadraticCurveTo(-32,-6+Math.sin(ph)*3,-35,8+Math.sin(ph*1.3)*3);ctx.stroke();
 ctx.fillStyle=r.coat;ctx.beginPath();ctx.ellipse(0,0,22,10,0,0,7);ctx.fill();
 ctx.beginPath();ctx.moveTo(12,-7);ctx.lineTo(25,-21);ctx.lineTo(32,-17);ctx.lineTo(21,4);ctx.closePath();ctx.fill();
 ctx.save();ctx.translate(30,-18);ctx.rotate(.6);ctx.beginPath();ctx.ellipse(6,0,10,4.6,0,0,7);ctx.fill();ctx.restore();
 ctx.beginPath();ctx.moveTo(26,-21);ctx.lineTo(25,-28);ctx.lineTo(29.5,-22);ctx.fill();
 ctx.strokeStyle=r.mane;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(13,-9);ctx.lineTo(25,-22);ctx.stroke();
 leg(17,4,Math.sin(ph)*.85,r.coat);leg(-13,4,Math.sin(ph+3.14)*.85,r.coat);
 ctx.fillStyle='#fafafa';ctx.fillRect(-9,-8,13,10);ctx.fillStyle='#111';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r.no,-2.5,-3);
 ctx.strokeStyle='#eee';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(1,-13);ctx.lineTo(6,-6);ctx.stroke();
 ctx.fillStyle=r.silk;ctx.save();ctx.translate(4,-16);ctx.rotate(-.25);ctx.beginPath();ctx.ellipse(0,0,8,4.5,0,0,7);ctx.fill();ctx.restore();
 ctx.strokeStyle=r.silk;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(9,-18);ctx.lineTo(19,-15);ctx.stroke();
 ctx.fillStyle=r.silk2;ctx.beginPath();ctx.arc(13,-21,3.6,0,7);ctx.fill();
 ctx.restore();
}
function showResults(race,field,sim,out,res){
 const rv=$('#rv'),D=race.dist,w0=sim.fin[sim.order[0]],vAvg=D/w0;
 const won=out.find(o=>o.pos===1);

  :`<div class="box"><h3>あなたの馬の結果</h3>${out.map(o=>`<div class="between" style="padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.15)"><b>${esc(o.h.name)}</b><span>${o.pos}着 ${o.pay?'<b style="color:var(--gold)">+'+yen(o.pay)+'</b>':''}</span></div>`).join('')}

 rv.innerHTML=`${rvHead(race)}<div class="res-wrap"><div class="g-l" style="max-width:1100px;margin:0 auto">

 <div class="stack">${side}<button class="btn gold big" id="rvnext">次へ ▶</button></div></div></div>`;
 $('#rvnext').onclick=()=>{rv.remove();res();};
}

function tone(f,d,w=0,type='square',vol=.05){if(!SET.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+w;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}}

function unlock(id){if(!S||S.ach[id])return;S.ach[id]=`${S.year}年${S.month}月`;const a=ACH.find(x=>x.id===id);toast('🏆 実績解除：'+a.n);}

 const nav=[['home','🏠','ホーム'],['horses','🐴','馬情報'],['race','🏇','レース'],['farm','🌾','牧場'],['shop','🛒','ショップ'],['menu','☰','メニュー']];

function tip(){
 const rs=racers();
 if(!S.horses.length)return'まずは「馬を購入する」から、最初の愛馬を迎えましょう！2歳馬は6月からデビューできます。';
 if(S.money<0)return'資金がマイナスです！賞金を稼ぐか、馬を売却して立て直しましょう。';
 const ok=rs.filter(h=>!S.entries[h.id]&&thisWeekRaces().some(r=>!ineligible(h,r)));
 if(ok.length)return`今週出走できる馬がいます（${ok.slice(0,3).map(h=>esc(h.name)).join('・')}）。「レースに出走」から登録しましょう。`;
 if(S.month>=2&&S.month<=6&&S.horses.some(h=>h.status==='mare'&&!h.preg))return'繁殖シーズンです（2〜6月）。「繁殖」から配合を検討しましょう。';
 if(rs.some(h=>ageOf(h)===2&&S.month<6))return'2歳馬のデビューは6月から。それまでは調教でじっくり鍛えましょう。';
 if(rs.some(h=>h.fatigue>65))return'疲れている馬がいます。軽め調整や放牧休養で回復させましょう。';
 return'良い馬を見つけ、育て、レースで勝利を目指しましょう。あなただけの名馬を作り上げてください。';
}

function scRace(){
 const tabs=`<div class="tabs">${[['entry','出走登録'],['sched','重賞スケジュール'],['plan','出走予定']].map(([k,n])=>`<button class="${UI.raceTab===k?'on':''}" data-act="raceTab" data-k="${k}">${n}</button>`).join('')}</div>`;
 if(UI.raceTab==='sched'){let rows='';for(let i=0;i<20;i++){let y=S.year,m=S.month,w=S.week+i;while(w>4){w-=4;m++;if(m>12){m=1;y++;}}weekRaces(y,m,w).filter(r=>/^G/.test(r.grade)).forEach(r=>{const cand=racers().filter(h=>(r.surf==='芝'?h.turf:h.dirt)>=2&&ageOk(ageOf(h)+(y>S.year?1:0),r.age)&&(!r.sex||h.sex==='牝')).map(h=>esc(h.name));rows+=`<tr class="${i===0?'sel':''}"><td>${y!==S.year?y+'年':''}${m}月${w}週</td><td>${r.name}${gradeLabel(r)}</td><td>${r.venue}</td><td>${r.surf}${r.dist}m</td><td>${raceCond(r)}</td><td class="num">${yen(r.prize)}</td><td class="mini" style="color:#4a5f86">${cand.join('・')}</td></tr>`;});}
  return`<section class="panel"><h2>レース出走</h2>${tabs}<div class="pb scroll"><table class="t"><tr><th>日程</th><th>レース名</th><th>場</th><th>コース</th><th>条件</th><th class="num">1着賞金</th><th>適性の合う馬</th></tr>${rows}</table></div></section>`;}
 if(UI.raceTab==='plan'){const e=Object.entries(S.entries);return`<section class="panel"><h2>レース出走</h2>${tabs}<div class="pb">${e.length?`<table class="t"><tr><th>馬名</th><th>レース</th><th>騎手</th><th>作戦</th><th></th></tr>${e.map(([id,x])=>{const h=hById(id),r=raceById(x.race);return h&&r?`<tr><td><b>${esc(h.name)}</b></td><td>${r.venue}${r.R}R ${r.name}${gradeLabel(r)}</td><td>${JOCKEYS[x.j].n}</td><td>${x.style}</td><td><button class="btn sm red" data-act="unentry" data-id="${id}">取消</button></td></tr>`:'';}).join('')}</table>`:'<div class="empty">今週の出走予定はありません</div>'}</div></section>`;}
 const races=thisWeekRaces();const r=races.find(x=>x.id===UI.raceSel)||races.find(x=>/^G/.test(x.grade))||races[0];UI.raceSel=r.id;
 const rs=racers();const hs=rs.find(h=>h.id===UI.raceHorse);
 const rk=ownerRank();const okJ=JOCKEYS.map((j,i)=>({...j,i})).filter(j=>j.r<=rk);
 const entered=Object.entries(S.entries).filter(([,e])=>e.race===r.id).map(([id])=>+id);
 let right=`<div class="box"><div class="between"><b style="font-size:16px">${r.venue}${r.R}R ${r.name}${gradeLabel(r)}</b><span class="mini">${r.field}頭立て</span></div><div class="mini">${r.surf} ${r.dist}m（${DISTN[distCat(r.dist)]}）・${raceCond(r)}・1着賞金 ${yen(r.prize)}</div></div>`;
 right+=`<div class="box"><h3>出走馬を選ぶ</h3>${rs.length?rs.map(h=>{const why=ineligible(h,r);const en=entered.includes(h.id);return`<button class="hc ${hs&&hs.id===h.id?'on':''}" style="padding:5px 8px;margin-bottom:5px" data-act="raceHorse" data-id="${h.id}" ${why&&!en?'disabled':''}><div class="pt" style="width:40px;height:40px">${horseSVG(h)}</div><div class="inf"><div class="nm" style="font-size:14px">${esc(h.name)} ${en?'<span class="tag p">登録済</span>':''}</div><div class="sub">${why&&!en?'✕ '+why:`芝${APT[h.turf]} ダ${APT[h.dirt]} ${DISTN[distCat(r.dist)]}${APT[h.dist[distCat(r.dist)]]} ・ ${condLabel(h)} ・ 疲労${Math.round(h.fatigue)}`}</div></div>${rkHTML(letter(rating(h.stats)))}</button>`;}).join(''):'<span class="mini">現役馬がいません</span>'}</div>`;
 if(hs&&!ineligible(hs,r)&&!entered.includes(hs.id)){
  const best=okJ[okJ.length-1];
  right+=`<div class="box"><div class="row" style="align-items:flex-start"><div>${radar(hs.stats,150)}</div><div style="flex:1;min-width:150px" class="stack"><div><div class="mini">騎手（馬主ランクで依頼できる騎手が増えます）</div><select id="selJ" style="width:100%">${okJ.map(j=>`<option value="${j.i}" ${j.i===best.i?'selected':''}>${j.n}（騎乗技術 ${'★'.repeat(Math.ceil(j.s/2))}）</option>`).join('')}</select></div>
  <div><div class="mini">作戦</div><select id="selS" style="width:100%">${STYLES.map(s=>`<option ${s===hs.style?'selected':''}>${s}</option>`).join('')}</select></div>
  <button class="btn w" data-act="entry">出走登録する</button></div></div></div>`;
 }
 return`<section class="panel"><h2>レース出走<small>${S.year}年${S.month}月${S.week}週 ・ 天候${S.weather.i} 馬場 ${S.weather.t}</small></h2>${tabs}<div class="pb g-l">
 <div class="scroll"><table class="t"><tr><th>R</th><th>レース名</th><th>距離</th><th>条件</th><th class="num">頭数</th><th class="num">1着賞金</th></tr>${races.map(x=>`<tr class="click ${x.id===r.id?'sel':''}" data-act="raceSel" data-k="${x.id}"><td>${x.venue}${x.R}R</td><td>${x.name}${gradeLabel(x)}${Object.values(S.entries).some(e=>e.race===x.id)?' 🏇':''}</td><td>${x.surf==='芝'?'<span style="color:#1f8a4c">芝</span>':'<span style="color:#a0632a">ダ</span>'}${x.dist}m</td><td style="font-size:11px">${raceCond(x)}</td><td class="num">${x.field}頭</td><td class="num">${yen(x.prize)}</td></tr>`).join('')}</table>
 <p class="mini" style="margin-top:8px">クラス：未勝利 → 1勝クラス → オープン（重賞は1勝以上、GIは収得賞金も必要）。登録したレースは「次の週へ」で開催されます。</p></div>
 <div class="stack">${right}</div></div></section>`;
}
const FAC={stable:{n:'厩舎',ic:'🏠',max:6,cost:l=>2000*l,eff:l=>`現役馬 ${2+2*l}頭まで`},train:{n:'調教設備',ic:'⛰️',max:5,cost:l=>1500*(l+1),eff:l=>`調教効果 +${l*10}%`},farm:{n:'生産牧場',ic:'🌾',max:6,cost:l=>1500*l,eff:l=>`繁殖馬・子馬 ${1+2*l}頭まで`},vet:{n:'獣医・スタッフ',ic:'🩺',max:3,cost:l=>1000*(l+1),eff:l=>`故障率 -${l*22}%・疲労回復 +${l*2}`}};
function scFarm(){
 const rc=racers().length,fm=S.horses.filter(h=>h.status==='mare'||h.status==='stallion').length,fo=S.horses.filter(h=>h.status==='foal').length;
 const up=rc*60+fm*25+fo*15+20*(S.fac.stable+S.fac.train+S.fac.farm+S.fac.vet);
 return`<div class="stack"><section class="panel"><h2>牧場・厩舎<small>施設は維持費がかかります（1レベルにつき月20万円）</small></h2><div class="pb g3" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${Object.entries(FAC).map(([k,f])=>{const l=S.fac[k],mx=l>=f.max,c=mx?0:f.cost(l);return`<div class="box"><div class="between"><b style="font-size:16px">${f.ic} ${f.n}</b><span class="chip">Lv <b>${l}</b>/${f.max}</span></div><p class="mini" style="margin:6px 0">現在：${f.eff(l)}${mx?'':'<br>次：'+f.eff(l+1)}</p><button class="btn w sm" data-act="facUp" data-k="${k}" ${mx||S.money<c?'disabled':''}>${mx?'最大レベル':'強化する（'+yen(c)+'）'}</button></div>`;}).join('')}</div></section>
 <section class="panel"><h2>維持費の目安（月額）</h2><div class="pb"><table class="t"><tr><td>現役馬 ${rc}頭 × 60万円</td><td class="num">${yen(rc*60)}</td></tr><tr><td>繁殖馬 ${fm}頭 × 25万円</td><td class="num">${yen(fm*25)}</td></tr><tr><td>子馬 ${fo}頭 × 15万円</td><td class="num">${yen(fo*15)}</td></tr><tr><td>施設維持費</td><td class="num">${yen(20*(S.fac.stable+S.fac.train+S.fac.farm+S.fac.vet))}</td></tr><tr><td><b>合計</b></td><td class="num"><b>${yen(up)}</b></td></tr></table>
 <div class="row" style="margin-top:10px"><span class="chip">現役 <b>${rc}/${stableCap()}</b></span><span class="chip">牧場 <b>${fm+fo}/${farmCap()}</b></span><button class="btn sm" data-act="go" data-s="horses">馬情報を見る</button><button class="btn sm" data-act="go" data-s="breed">繁殖へ</button></div></div></section></div>`;
}
function scHorses(){

 breedMare:d=>{UI.breedMare=+d.id;render();},
 breedSire:d=>{UI.breedSire=+d.k;render();},
 breedDo:()=>{const m=hById(UI.breedMare),p=sireList()[UI.breedSire];if(!m||!p||m.preg)return;if(!(S.month>=2&&S.month<=6))return toast('繁殖シーズン外です');if(S.money<p.fee)return toast('資金が足りません');
  if(p.fee)book('breed',p.fee);
  if(R()<.85){m.preg={n:p.n,c:{...p.c},turf:p.turf,dirt:p.dirt,dist:[...p.dist],g:p.g,coat:p.coat};toast('🎉 受胎確認！来年1月に出産予定です');news(`${esc(m.name)}が${esc(p.n)}の子を受胎しました。`);}
  else toast('残念…不受胎でした。もう一度挑戦できます');save();render();},
 finTab:d=>{UI.finTab=d.k;render();},
 calMonth:d=>{UI.calMonth=+d.k;render();},
 shopBuy:d=>{const it=SHOP.find(x=>x.id===d.k);let rs=racers();if(it.id==='vet')rs=rs.filter(h=>h.injury>0);if(!rs.length)return toast(it.id==='vet'?'故障中の馬はいません':'現役馬がいません');
  modal(it.ic+' '+it.n,`<p class="mini" style="margin-bottom:8px">${it.d}（${yen(it.p)}）— 使う馬を選んでください</p><div class="list">${rs.map(h=>hcard(h,'shopUse',false).replace('data-act="shopUse"',`data-act="shopUse" data-k="${it.id}"`)).join('')}</div>`);},
 shopUse:d=>{const it=SHOP.find(x=>x.id===d.k),h=hById(d.id);if(!it||!h)return;if(S.money<it.p)return toast('資金が足りません');book('shop',it.p);let msg='';
  if(it.id==='carrot'){h.cond=Math.min(2,h.cond+1);msg=`調子が「${condLabel(h)}」になった！`;}
  else if(it.id==='supp'){h.fatigue=Math.max(0,h.fatigue-40);msg='疲労が回復した！';}
  else if(it.id==='protein'){['pow','guts'].forEach(k=>h.stats[k]=Math.min(h.cap[k],h.stats[k]+2));msg='瞬発力・根性がアップ！';}
  else if(it.id==='shoe'){h.shoe=true;msg='勝負蹄鉄を装着した！';}
  else if(it.id==='feed'){STATS.forEach(([k])=>h.cap[k]=Math.min(100,h.cap[k]+ri(1,3)));msg='潜在能力がアップした！';}
  else if(it.id==='vet'){h.injury=Math.max(0,Math.floor(h.injury/3));msg=h.injury?`治療期間が残り${h.injury}週に短縮！`:'故障が完治した！';}
  closeModal();toast(`${esc(h.name)}：${msg}`);save();render();},
 save:()=>{toast(save()?'💾 セーブしました':'セーブできませんでした');},
 ach:()=>modal('🏆 実績',`<div class="list">${ACH.map(a=>`<div class="box" style="${S.ach[a.id]?'':'opacity:.45'}"><div class="between"><b>${S.ach[a.id]?'🏆':'🔒'} ${a.n}</b><span class="mini">${S.ach[a.id]||''}</span></div><div class="mini">${a.d}</div></div>`).join('')}</div>`),
 records:()=>modal('📜 重賞勝利記録',S.records.length?`<table class="t"><tr><th>年月</th><th>レース</th><th>勝ち馬</th></tr>${S.records.map(r=>`<tr><td>${r.y}/${r.m}</td><td>${r.n}<span class="gb ${r.gr}">${r.gr}</span></td><td><b>${esc(r.h)}</b></td></tr>`).join('')}</table>`:'<div class="empty">まだ重賞勝利はありません</div>'),
 settings:()=>openSettings(),
 credit:()=>openCredit(),
 toTitle:()=>{save();showTitle();},
 wipe:()=>modal('データ削除',`<p>セーブデータを削除して最初からやり直しますか？<br><span class="mini">この操作は取り消せません。</span></p><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn gray" data-act="close">やめる</button><button class="btn red" data-act="doWipe">削除する</button></div>`),
 doWipe:()=>{lsDel(SAVE_KEY);S=null;closeModal();showTitle();},
 setFast:d=>{SET.fast=d.k==='1';saveSet();openSettings();},
 setSound:d=>{SET.sound=d.k==='1';saveSet();openSettings();},
 tNew:()=>openNewGame(),
 tCont:()=>{if(load())startApp();else toast('セーブデータがありません');},
 tSet:()=>openSettings(),
 tCredit:()=>openCredit(),
 silk:d=>{UI.silk=d.k;document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.k===d.k));},
 fund:d=>{UI.fund=+d.k;document.querySelectorAll('[data-act=fund]').forEach(s=>s.classList.toggle('on',s.dataset.k===d.k));},
 startNew:()=>{const nm=($('#oname').value||'').trim()||'あなた';newGame(nm,UI.silk||'#1d5bc0',UI.fund||10000);closeModal();startApp();},
 foalOK:()=>{(UI.pendingFoals||[]).forEach(id=>{const h=hById(id),el=$('#fn'+id);if(h&&el&&el.value.trim())h.name=el.value.trim().slice(0,9);});UI.pendingFoals=null;closeModal();save();render();},
 goTitle:()=>{closeModal();showTitle();},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){if(el.dataset.act==='ovbg'){f(el.dataset,el,e);return;}f(el.dataset,el,e);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;if(el.dataset.chg==='style'){const h=hById(el.dataset.id);if(h){h.style=el.value;save();toast('脚質を「'+el.value+'」に変更しました');}}});

function openSettings(){modal('⚙️ 設定',`<div class="stack"><div><b>レース演出の速さ</b><div class="seg" style="margin-top:6px"><button class="${!SET.fast?'on':''}" data-act="setFast" data-k="0">標準</button><button class="${SET.fast?'on':''}" data-act="setFast" data-k="1">高速</button></div></div>
<div><b>サウンド</b><div class="seg" style="margin-top:6px"><button class="${SET.sound?'on':''}" data-act="setSound" data-k="1">ON</button><button class="${!SET.sound?'on':''}" data-act="setSound" data-k="0">OFF</button></div></div></div>`);}
function openCredit(){modal('📝 クレジット',`<div class="stack"><p><b>ウマヌシライフ ～夢を、あの名馬とともに～</b></p><p class="mini">競走馬を購入・育成し、レースに出走させ、引退後は繁殖で次の世代へ――。あなただけの名馬を作り上げる馬主シミュレーションです。</p><p class="mini">登場する馬名・騎手名・種牡馬名はすべて架空のものです。</p><p class="mini">データはこの端末のブラウザに保存されます。</p></div>`);}
function nameFoals(){const ids=UI.pendingFoals||[];const hs=ids.map(hById).filter(Boolean);if(!hs.length){UI.pendingFoals=null;return;}
 modal('🐴 子馬が誕生しました！',`<p class="mini" style="margin-bottom:10px">名前をつけてあげましょう（9文字まで）</p><div class="stack">${hs.map(h=>`<div class="row"><div class="pt" style="width:56px;height:56px;border-radius:8px;overflow:hidden">${horseSVG(h)}</div><div style="flex:1"><div class="mini">${h.sex} 父 ${esc(h.sire)} × 母 ${esc(h.dam)}</div><input type="text" id="fn${h.id}" maxlength="9" value="${esc(h.name)}"></div></div>`).join('')}</div><button class="btn gold big" style="margin-top:12px" data-act="foalOK">決定</button>`);}
function gameOver(){lsDel(SAVE_KEY);modal('破産…',`<div class="empty" style="color:var(--tx)"><div style="font-size:48px">💸</div><p style="margin:10px 0">資金難が続き、馬主を続けることができなくなりました…</p><p class="mini">通算獲得賞金 ${yen(S.totalPrize)} ・ GI ${S.g1}勝 ・ 重賞 ${S.records.length}勝</p><button class="btn gold" style="margin-top:14px" data-act="goTitle">タイトルへ</button></div>`);}

/* ================= セーブ／開始 ================= */
function save(){if(!S)return false;return lsSet(SAVE_KEY,JSON.stringify(S));}
function load(){try{const d=JSON.parse(lsGet(SAVE_KEY)||'null');if(!d||!d.v)return false;S=d;return true;}catch(e){return false;}}
function newGame(owner,silk,money){
 S={v:1,owner,silk,startYear:2026,year:2026,month:4,week:1,money,horses:[],nid:1,market:[],entries:{},ledger:{},moneyHist:[],fac:{stable:1,train:0,farm:1,vet:0},totalPrize:0,g1:0,rivals:[],news:[],ach:{},hall:[],records:[],weather:WEATHER[0],debt:0,notice:'まずは馬を購入しましょう'};
 for(const by of[2024,2023,2022])for(let i=0;i<3;i++)S.rivals.push(makeRival(by));
 genMarket();
 news(`ようこそ、${esc(owner)}オーナー！馬主としての第一歩が始まりました。`);
 news('まずは「馬を購入する」から最初の愛馬を迎えましょう。');
 save();
}
function startApp(){$('#title').hidden=true;$('#app').hidden=false;$('#nav').hidden=false;UI.screen='home';render();scrollTo(0,0);}
function openNewGame(){UI.silk='#1d5bc0';UI.fund=10000;
 const silks=['#1d5bc0','#d6303a','#1f9a4e','#f0a81c','#8a3fc4','#e35d9a','#222831','#0fb5c4'];
 modal('はじめる',`<div class="stack"><div><b>馬主名</b><input type="text" id="oname" maxlength="12" placeholder="あなた" style="margin-top:6px"></div>
 <div><b>勝負服の色</b><div class="row" style="margin-top:6px">${silks.map(c=>`<button class="swatch ${c===UI.silk?'on':''}" style="background:${c}" data-act="silk" data-k="${c}"></button>`).join('')}</div></div>
 <div><b>開始資金（難易度）</b><div class="seg" style="margin-top:6px"><button data-act="fund" data-k="30000">やさしい（3億円）</button><button class="on" data-act="fund" data-k="10000">ふつう（1億円）</button><button data-act="fund" data-k="5000">きびしい（5000万円）</button></div></div>
 ${lsGet(SAVE_KEY)?'<p class="mini" style="color:var(--red)">※ 既存のセーブデータは上書きされます</p>':''}
 <button class="btn gold big" data-act="startNew">夢の舞台へ ▶</button></div>`);}
function showTitle(){
 $('#app').hidden=true;$('#nav').hidden=true;closeModal();
 let crowd='';for(let i=0;i<170;i++){const x=170+(i%34)*20,y=420+Math.floor(i/34)*18;crowd+=`<rect x="${x}" y="${y}" width="9" height="9" fill="${['#e44','#36c','#fc3','#fff','#4a4','#c6f'][i*7%6]}"/>`;}
 let trees='';for(let x=-20;x<1650;x+=46)trees+=`<circle cx="${x}" cy="${548+(x*13%9)}" r="${24+(x*7%11)}" fill="#2f6b33"/>`;
 const hasSave=!!lsGet(SAVE_KEY);
 $('#title').innerHTML=`<svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a74cc"/><stop offset=".55" stop-color="#a9d8f6"/><stop offset=".62" stop-color="#eaf6ff"/></linearGradient><radialGradient id="tsun" cx=".66" cy=".1" r=".4"><stop offset="0" stop-color="#fffbe0" stop-opacity=".95"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient></defs>
 <rect width="1600" height="900" fill="url(#tsky)"/><rect width="1600" height="900" fill="url(#tsun)"/>
 <g fill="#fff" opacity=".9"><ellipse cx="300" cy="140" rx="120" ry="34"/><ellipse cx="380" cy="120" rx="80" ry="40"/><ellipse cx="1000" cy="90" rx="140" ry="30"/><ellipse cx="1080" cy="72" rx="70" ry="34"/><ellipse cx="1400" cy="200" rx="110" ry="28"/></g>
 <path d="M0 520L160 440L300 485L500 400L690 470L900 415L1100 480L1310 405L1600 470L1600 570L0 570Z" fill="#86a7c9"/><path d="M0 545L220 490L420 530L640 480L860 525L1080 485L1320 530L1600 500L1600 580L0 580Z" fill="#6a93b9"/>
 <rect x="150" y="390" width="720" height="160" fill="#e4ebf3"/><path d="M130 392L890 392L870 350L150 350Z" fill="#2c4f7c"/>${crowd}<g fill="#9aa9bd">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${160+i*100}" y="392" width="5" height="158"/>`).join('')}</g>
 ${trees}<path d="M0 560Q800 520 1600 560L1600 900L0 900Z" fill="#6db14f"/><path d="M0 650Q800 585 1600 630L1600 740Q800 680 0 780Z" fill="#8fca68"/>
 <path d="M0 640Q800 575 1600 620" stroke="#fff" stroke-width="6" fill="none"/><path d="M0 790Q800 690 1600 750" stroke="#fff" stroke-width="7" fill="none"/>
 ${[...Array(30)].map((_,i)=>`<rect x="${i*56}" y="${640-Math.sin(i/30*Math.PI)*45-i*.0}" width="4" height="22" fill="#fff"/>`).join('')}
 </svg>
 <div class="horse">${horseSVG({coat:0,blaze:true}).replace(/<rect width="100" height="100"[^>]*\/>/,'')}</div>
 <div class="tl"><div class="logo">ウマヌシライフ</div><div class="logo-sub">～夢を、あの名馬とともに～</div></div>
 <div class="tm"><button class="tbtn first" data-act="tNew">▶ はじめる</button><button class="tbtn" data-act="tCont" ${hasSave?'':'disabled'}>📂 続きから</button><button class="tbtn" data-act="tSet">⚙️ 設定</button><button class="tbtn" data-act="tCredit">📝 クレジット</button></div>
 <div class="tq">あなたは、ひとりの馬主。<br>夢の舞台へ、今、歩み出す――</div>`;
 $('#title').hidden=false;
}
showTitle();
</script>
<script src="../../playtime.js" defer></script>
</body>
