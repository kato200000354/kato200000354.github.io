<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>灰の騎士 ― ASHEN KNIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#d9d0bf;font-family:'Shippori Mincho','Yu Mincho','Hiragino Mincho ProN',serif;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button{font-family:inherit}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#emblem{position:absolute;left:16px;top:14px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3c342b,#100d0b 70%);border:2px solid #6d6150;box-shadow:0 0 0 2px #000,0 0 14px #000}
#emblem svg{width:100%;height:100%}
#bars{position:absolute;left:84px;top:20px}
.bar{position:relative;height:9px;margin-bottom:7px;background:#0a0807d0;border:1px solid #5d5242;box-shadow:0 0 0 1px #000;transition:width .4s}
.bar::after{content:'';position:absolute;right:-5px;top:-3px;width:3px;height:13px;background:#8a7a5c;box-shadow:0 0 0 1px #000}
.bar i{position:absolute;left:0;top:0;bottom:0}
.bar .lag{background:#d9c08a;opacity:.85}
#hpBar .fill{background:linear-gradient(#d0412f,#7a1a12)}
#fpBar .fill{background:linear-gradient(#4a7de0,#1e3a80)}
#stBar .fill{background:linear-gradient(#45a854,#1d5a27)}
#slots{position:absolute;left:18px;bottom:20px;width:200px;height:200px}
.slot{position:absolute;width:62px;height:76px;border:1px solid #5d5344;background:linear-gradient(#1c1915d8,#0b0a09d8);box-shadow:0 0 0 1px #000,inset 0 0 12px #000}
.slot svg{width:100%;height:100%}
.slot b{position:absolute;right:5px;bottom:2px;font:700 15px Cinzel,serif;text-shadow:0 0 3px #000,0 0 3px #000}
#slotL{left:0;top:52px}#slotT{left:68px;top:0;height:56px;opacity:.55}#slotR{left:136px;top:52px}#slotB{left:68px;top:100px}
#itemName{position:absolute;left:30px;top:180px;width:140px;text-align:center;font-size:13px;text-shadow:0 0 4px #000,0 0 4px #000}
#souls{position:absolute;right:24px;bottom:24px;min-width:180px;padding:7px 16px;border:1px solid #5d5344;background:linear-gradient(90deg,#0d0b0ad8,#1c1713d8);display:flex;align-items:center;gap:12px;justify-content:space-between;font:700 21px Cinzel,serif;box-shadow:0 0 0 1px #000}
#souls svg{width:26px;height:26px}
#soulGain{position:absolute;right:16px;top:-26px;font:600 17px Cinzel,serif;color:#efe4c8;text-shadow:0 0 6px #000;opacity:0;transition:opacity .3s}
#bossBox{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:min(64vw,760px)}
#bossName{font-size:17px;margin:0 0 5px 2px;text-shadow:0 0 6px #000,0 0 3px #000;letter-spacing:.08em}
#bossBar{height:12px}
#bossBar .fill{background:linear-gradient(#b02a1c,#5e120b)}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);padding:9px 34px;background:linear-gradient(90deg,transparent,#0c0a09ee 20%,#0c0a09ee 80%,transparent);font-size:17px;letter-spacing:.06em;text-shadow:0 0 4px #000;border-top:1px solid #6a5d4a55;border-bottom:1px solid #6a5d4a55;white-space:nowrap}
#prompt .k{display:inline-block;min-width:24px;padding:0 6px;margin-right:10px;border:1px solid #9a8a6a;border-radius:4px;font:600 14px Cinzel,serif;text-align:center}
#toast{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:17px;padding:8px 40px;background:linear-gradient(90deg,transparent,#0c0a09dd 20%,#0c0a09dd 80%,transparent);opacity:0;transition:opacity .4s;white-space:nowrap;text-shadow:0 0 4px #000}
#banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:26px 0;opacity:0;transition:opacity 1s;background:linear-gradient(transparent,#000a 25%,#000a 75%,transparent)}
#banner .jp{font-size:clamp(28px,5vw,56px);letter-spacing:.2em;font-weight:700}
#banner .en{font:500 clamp(12px,1.6vw,18px) Cinzel,serif;letter-spacing:.4em;margin-top:6px;opacity:.8}
#banner.gold .jp{color:#e8c870;text-shadow:0 0 18px #c8902a99,0 0 2px #000}
#banner.gold .en{color:#d8b860}
#banner.area{background:none;top:30%}
#banner.area .jp{font-size:clamp(22px,3.4vw,38px);color:#e8e0d0;text-shadow:0 0 10px #000,0 0 3px #000}
#banner.area .jp::before,#banner.area .jp::after{content:'';display:inline-block;width:12vw;height:1px;background:linear-gradient(90deg,transparent,#c8b890);vertical-align:middle;margin:0 22px}
#banner.area .jp::after{background:linear-gradient(90deg,#c8b890,transparent)}
#ebars .ebar{position:absolute;width:86px;height:6px;margin-left:-43px;background:#000c;border:1px solid #3a302a}
#ebars .ebar i{position:absolute;left:0;top:0;bottom:0}
#ebars .ebar .fill{background:#b02a1c}
#ebars .ebar span{position:absolute;left:92px;top:-7px;font:600 14px Cinzel,serif;color:#f0e6d0;text-shadow:0 0 3px #000,0 0 3px #000}
#lockDot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(#fff 0 30%,#ffe9b0aa 45%,transparent 70%);box-shadow:0 0 10px #ffd890}
#msgBox{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);min-width:340px;max-width:86vw;padding:22px 34px;background:linear-gradient(#17130fef,#0c0a08ef);border:1px solid #6a5a40;text-align:center;font-size:19px;line-height:1.8;box-shadow:0 0 30px #000;white-space:pre-line}
#msgBox small{display:block;color:#a89a80;font-size:13px;margin-top:8px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
/* ---------- Death ---------- */
#dead{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2.2s;display:flex;align-items:center;justify-content:center;flex-direction:column}
#dead .band{position:absolute;left:0;right:0;top:50%;height:200px;transform:translateY(-50%);background:linear-gradient(transparent,#000d 30%,#000d 70%,transparent)}
#dead h1{position:relative;margin:0;font:500 clamp(48px,10vw,120px) 'Shippori Mincho',serif;color:#9e1a14;letter-spacing:.06em;text-shadow:0 0 30px #5a0a0699;transform:scale(1.15);transition:transform 6s ease-out}
#dead.on h1{transform:scale(1)}
#dead p{position:relative;margin:12px 0 0;font-size:16px;color:#bfb4a0;opacity:0;transition:opacity 1.5s 2s;text-align:center;line-height:1.8}
#dead.on p{opacity:1}
/* ---------- Panels / menus ---------- */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0008,#000c)}
.panel{background:linear-gradient(#16130fF2,#0b0907F2);border:1px solid #4e4436;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #ffffff08,0 18px 50px #000c}
.ph{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #4e443666;font-size:21px;letter-spacing:.1em}
.ph svg{width:26px;height:26px}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;border-bottom:1px solid #ffffff0d;font-size:15px}
.row .v{font:600 15px Cinzel,'Shippori Mincho',serif}
.row.up .v{color:#7fb0ff}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;background:none;border:0;border-bottom:1px solid #ffffff0b;color:#d9d0bf;font-size:17px;text-align:left;cursor:pointer;letter-spacing:.05em}
.mi:hover,.mi.sel{background:linear-gradient(90deg,#8a5a2acc,#3a2614aa 60%,transparent);color:#fff2d8}
.mi:disabled{opacity:.35;cursor:default;background:none}
.foot{display:flex;gap:18px;padding:9px 16px;font-size:13px;color:#a89a80;border-top:1px solid #4e443666}
#menu .wrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px;width:min(1080px,96vw);max-height:92vh}
#menuBody{overflow:auto;max-height:86vh}
.eq{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) minmax(0,230px);gap:10px;padding:12px}
.eq .grid{display:grid;grid-template-columns:repeat(3,56px);gap:6px;align-content:start}
.cell{width:56px;height:64px;border:1px solid #4e4436;background:#0a0908;cursor:pointer;position:relative;padding:0}
.cell svg{width:100%;height:100%}
.cell.sel{border-color:#d49a4a;box-shadow:0 0 8px #d49a4a88}
.cell b{position:absolute;right:3px;bottom:1px;font:600 12px Cinzel,serif;color:#eee}
.sub{border:1px solid #4e443655;padding:10px 12px;background:#0006}
.sub h3{margin:0 0 6px;font-size:18px;font-weight:700;letter-spacing:.06em}
.sub h4{margin:10px 0 4px;font-size:14px;color:#b8aa90;font-weight:500;border-bottom:1px solid #4e443666}
.desc{margin-top:10px;font-size:14px;line-height:1.8;color:#c8bea8;white-space:pre-line}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbar{height:8px;flex:1;margin:0 10px;background:#000;border:1px solid #3a3228}
.sbar i{display:block;height:100%}
.lvbtn{width:28px;height:24px;background:#1d1813;border:1px solid #5d5344;color:#e8dcc0;cursor:pointer;font-size:14px}
.lvbtn:disabled{opacity:.3}
.big{display:block;margin:12px auto 0;padding:9px 40px;background:linear-gradient(#5a3c1c,#2c1c0e);border:1px solid #a07a44;color:#f4e6c8;font-size:16px;cursor:pointer;letter-spacing:.1em}
.big:disabled{opacity:.35;cursor:default}
#bonfireMenu .wrap{display:flex;gap:12px;align-items:flex-start;max-width:96vw}
#bfList{width:300px}
#bfSide{width:min(440px,90vw)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px}
.keys b{font:600 13px Cinzel,'Shippori Mincho',serif;color:#e8c890;border:1px solid #6a5a40;padding:1px 8px;border-radius:4px;justify-self:start;white-space:nowrap}
/* ---------- Title ---------- */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:11vh;background:radial-gradient(ellipse at center,transparent 30%,#000c 90%)}
#title h1{margin:0;font:700 clamp(40px,8vw,92px) 'Shippori Mincho',serif;letter-spacing:.35em;color:#e6dcc6;text-shadow:0 0 30px #000,0 0 60px #c8702a55;padding-left:.35em}
#title .en{font:500 clamp(13px,1.8vw,20px) Cinzel,serif;letter-spacing:.8em;color:#b8a07a;margin:8px 0 34vh;padding-left:.8em}
#title .mi{text-shadow:0 0 8px #000,0 0 4px #000}
#title .mi{justify-content:center;width:260px;font-size:19px;background:none}
#title .mi:hover{background:linear-gradient(90deg,transparent,#8a5a2acc,transparent)}
#title .hint{position:absolute;bottom:20px;font-size:13px;color:#8a806e;text-align:center;padding:0 16px}
#ending{text-align:center}
#ending .panel{padding:34px 44px;max-width:92vw}
#ending h2{margin:0 0 6px;font-size:30px;color:#e8c870;letter-spacing:.2em}
/* ---------- Touch ---------- */
#touch{position:fixed;inset:0;pointer-events:none}
#touch .tb{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid #c8b89066;background:radial-gradient(#2a221acc,#0b0907cc);color:#e8dcc0;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
#touch .tb.on{background:radial-gradient(#7a5a2acc,#2b1c0ecc)}
#stickBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid #c8b89055;background:#0005;display:none}
#stickKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#c8b89055}
@media (max-width:700px){
 #slots{transform:scale(.72);transform-origin:left bottom}
 #souls{bottom:auto;top:16px;right:12px;min-width:120px;font-size:16px}
 .eq{grid-template-columns:1fr}
 #menu .wrap{grid-template-columns:1fr}
 #bonfireMenu .wrap{flex-direction:column;max-height:94vh;overflow:auto}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="emblem"></div>
  <div id="bars">
    <div class="bar" id="hpBar"><i class="lag"></i><i class="fill"></i></div>
    <div class="bar" id="fpBar"><i class="fill"></i></div>
    <div class="bar" id="stBar"><i class="fill"></i></div>
  </div>
  <div id="ebars"></div>
  <div id="lockDot" class="hide"></div>
  <div id="slots">
    <div class="slot" id="slotT"></div>
    <div class="slot" id="slotL"></div>
    <div class="slot" id="slotR"></div>
    <div class="slot" id="slotB"></div>
    <div id="itemName"></div>
  </div>
  <div id="souls"><span id="soulIco"></span><span id="soulNum">0</span><span id="soulGain"></span></div>
  <div id="bossBox" class="hide"><div id="bossName"></div><div class="bar" id="bossBar"><i class="lag"></i><i class="fill"></i></div></div>
  <div id="prompt" class="hide"></div>
  <div id="toast"></div>
  <div id="msgBox" class="hide"></div>
</div>
<div id="banner"><div class="jp"></div><div class="en"></div></div>

<div id="dead"><div class="band"></div><h1>YOU DIED</h1><p>あなたは、死んだ。<br>しかし、まだ終わりではない。</p></div>

<div id="title" class="overlay" style="background:radial-gradient(ellipse at center,transparent 30%,#000c 90%)">
  <h1>灰の騎士</h1>
  <div class="en">ASHEN KNIGHT</div>
  <button class="mi" id="btnContinue">つづきから</button>
  <button class="mi" id="btnNew">はじめから</button>
  <button class="mi" id="btnHow">操作説明</button>
  <div class="hint" id="titleHint"></div>
</div>

<div id="menu" class="overlay hide">
  <div class="wrap">
    <div class="panel">
      <div class="ph"><span id="menuIco"></span>メニュー</div>
      <div id="menuNav"></div>
      <div class="foot"><span>Esc / Tab：閉じる</span></div>
    </div>
    <div class="panel" id="menuBody"></div>
  </div>
</div>

<div id="bonfireMenu" class="overlay hide" style="background:radial-gradient(ellipse at 30% 50%,transparent,#000b)">
  <div class="wrap">
    <div class="panel" id="bfList"></div>
    <div class="panel hide" id="bfSide"></div>
  </div>
</div>

<div id="howto" class="overlay hide">
  <div class="panel" style="width:min(620px,94vw)">
    <div class="ph">操作説明</div>
    <div style="padding:16px 20px" id="howBody"></div>
    <div class="foot" style="justify-content:center"><button class="big" id="howClose" style="margin:0">閉じる</button></div>
  </div>
</div>

<div id="ending" class="overlay hide">
  <div class="panel">
    <h2>深淵を越えて</h2>
    <div style="font:500 14px Cinzel,serif;letter-spacing:.4em;color:#b8a07a;margin-bottom:18px">THE ABYSS IS SILENT</div>
    <div id="endStats" style="line-height:2;font-size:16px"></div>
    <p style="color:#a89a80;font-size:14px;line-height:1.8">火は、まだ消えていない。<br>遊んでくれて、ありがとう。</p>
    <button class="big" id="endClose">世界にとどまる</button>
  </div>
</div>

<div id="touch" class="hide">
  <div id="stickBase"><div id="stickKnob"></div></div>
</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   灰の騎士 ― ASHEN KNIGHT
   ========================================================= */
const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function angDiff(a,b){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}
const angTo=(a,b)=>Math.atan2(b.x-a.x,b.z-a.z);
const dist2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
function turnTo(o,target,rate){o.facing+=clamp(angDiff(o.facing,target),-rate,rate);}
const IS_TOUCH=('ontouchstart' in window)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);

/* ---------------- ICONS ---------------- */
const ICON={
 sword:`<svg viewBox="0 0 64 76"><defs><linearGradient id="gsw" x1="0" x2="1"><stop offset="0" stop-color="#eef3ff"/><stop offset="1" stop-color="#5a6680"/></linearGradient></defs><g transform="rotate(38 32 38)"><path d="M30 2 L34 2 L35.5 50 L28.5 50Z" fill="url(#gsw)"/><path d="M32 4 L32 48" stroke="#a8c8ff" stroke-width=".8" opacity=".8"/><rect x="21" y="50" width="22" height="4" fill="#9a8a62"/><rect x="30" y="54" width="4" height="13" fill="#4a3a2a"/><circle cx="32" cy="69" r="3" fill="#9a8a62"/></g></svg>`,
 shield:`<svg viewBox="0 0 64 76"><defs><linearGradient id="gsh" x1="0" x2="1"><stop offset="0" stop-color="#9aa0a8"/><stop offset="1" stop-color="#3a3e44"/></linearGradient></defs><path d="M12 12 L52 12 L50 40 Q46 58 32 68 Q18 58 14 40Z" fill="url(#gsh)" stroke="#1a1a1a" stroke-width="2"/><path d="M32 16 V62 M18 30 H46" stroke="#5a4a2a" stroke-width="4"/></svg>`,
 estus:`<svg viewBox="0 0 64 76"><defs><radialGradient id="ges"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#f0a020"/><stop offset="1" stop-color="#8a4008"/></radialGradient></defs><circle cx="32" cy="46" r="22" fill="#f8a02033"/><rect x="27" y="10" width="10" height="12" fill="#6a5a40"/><path d="M26 20 H38 L44 34 Q48 44 46 54 Q42 66 32 66 Q22 66 18 54 Q16 44 20 34Z" fill="url(#ges)" stroke="#3a2a10" stroke-width="1.5"/></svg>`,
 ash:`<svg viewBox="0 0 64 76"><defs><radialGradient id="gas"><stop offset="0" stop-color="#e0f0ff"/><stop offset=".5" stop-color="#3a7ad8"/><stop offset="1" stop-color="#102a5a"/></radialGradient></defs><circle cx="32" cy="46" r="22" fill="#3a7ad833"/><rect x="27" y="10" width="10" height="12" fill="#5a5a60"/><path d="M26 20 H38 L44 34 Q48 44 46 54 Q42 66 32 66 Q22 66 18 54 Q16 44 20 34Z" fill="url(#gas)" stroke="#102040" stroke-width="1.5"/></svg>`,
 bomb:`<svg viewBox="0 0 64 76"><defs><radialGradient id="gbo" cx=".4" cy=".35"><stop offset="0" stop-color="#8a6a4a"/><stop offset="1" stop-color="#2a1a10"/></radialGradient></defs><circle cx="32" cy="44" r="18" fill="url(#gbo)" stroke="#120a06" stroke-width="2"/><rect x="28" y="20" width="8" height="8" fill="#4a3a2a"/><path d="M32 20 Q36 12 42 14" stroke="#f0a040" stroke-width="2" fill="none"/><circle cx="43" cy="13" r="3" fill="#ffd060"/></svg>`,
 helm:`<svg viewBox="0 0 64 76"><path d="M18 50 V30 Q18 12 32 12 Q46 12 46 30 V50 Q32 58 18 50Z" fill="#4a4c52" stroke="#111" stroke-width="2"/><rect x="21" y="30" width="22" height="3" fill="#0a0a0a"/><path d="M32 12 V50" stroke="#6a6c72" stroke-width="2"/></svg>`,
 armor:`<svg viewBox="0 0 64 76"><path d="M16 18 L26 14 Q32 18 38 14 L48 18 L50 34 L44 36 L44 62 L20 62 L20 36 L14 34Z" fill="#4a4c52" stroke="#111" stroke-width="2"/><rect x="22" y="44" width="20" height="16" fill="#5a2a1a"/></svg>`,
 gaunt:`<svg viewBox="0 0 64 76"><path d="M22 14 H42 V40 L46 52 Q40 62 30 62 Q20 60 18 50 L22 40Z" fill="#4a4c52" stroke="#111" stroke-width="2"/></svg>`,
 legs:`<svg viewBox="0 0 64 76"><path d="M20 12 H30 V58 H16 V52 L20 50Z M34 12 H44 V50 L48 52 V58 H34Z" fill="#4a4c52" stroke="#111" stroke-width="2"/></svg>`,
 ring:`<svg viewBox="0 0 64 76"><circle cx="32" cy="40" r="14" fill="none" stroke="#8a7a5a" stroke-width="4"/></svg>`,
 empty:`<svg viewBox="0 0 64 76"></svg>`,
 soul:`<svg viewBox="0 0 32 32"><defs><radialGradient id="gso"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#d8e0ff"/><stop offset="1" stop-color="#d8e0ff00"/></radialGradient></defs><circle cx="16" cy="16" r="14" fill="url(#gso)"/><path d="M16 5 Q20 12 16 16 Q12 12 16 5Z M16 27 Q12 20 16 16 Q20 20 16 27Z" fill="#fff"/></svg>`,
 emblem:`<svg viewBox="0 0 60 60"><g fill="none" stroke="#c8b080" stroke-width="1.6"><path d="M30 8 V52 M22 18 H38"/><path d="M14 46 L46 14 M14 14 L46 46" opacity=".5"/><circle cx="30" cy="30" r="20" opacity=".5"/></g><circle cx="30" cy="30" r="4" fill="#e8a040"/></svg>`,

 return {list:[],max,emit(o){if(this.list.length<this.max){o.max=o.life;this.list.push(o);}},
  update(dt){const L=this.list;for(let i=L.length-1;i>=0;i--){const p=L[i];p.life-=dt;if(p.life<=0){L[i]=L[L.length-1];L.pop();continue;}

    p.vy-=(p.g||0)*dt;if(p.drag){const k=Math.exp(-p.drag*dt);p.vx*=k;p.vy*=k;p.vz*=k;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.floor&&p.y<.05){p.y=.05;p.vy*=-.3;}}
   for(let i=0;i<L.length;i++){const p=L[i],f=p.fade===false?1:Math.min(1,p.life/p.max*1.6);pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;col[i*3]=p.r*f;col[i*3+1]=p.g2*f;col[i*3+2]=p.b*f;}

function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
 nbuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 // wind ambience
 const s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;ambGain=AC.createGain();ambGain.gain.value=.13;
 const lfo=AC.createOscillator();lfo.frequency.value=.07;const lg=AC.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(f.frequency);lfo.start();s.connect(f);f.connect(ambGain);ambGain.connect(master);s.start();}
function nz(dur,f0,f1,q,vol,type='bandpass',when=0){if(!AC)return;const t=AC.currentTime+when,s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.05);}
function tone(fr,dur,type,vol,f1,when=0,att=.01,dest){if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(fr,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.05);}

function startMusic(){if(!AC||musicTimer)return;musicGain=AC.createGain();musicGain.gain.value=.0001;musicGain.connect(master);musicGain.gain.exponentialRampToValueAtTime(.5,AC.currentTime+2);
 const notes=[73.4,73.4,87.3,82.4,73.4,65.4,69.3,73.4];let i=0;const beat=.42;
 musicTimer=setInterval(()=>{const n=notes[i%8];tone(n,beat*1.9,'sawtooth',.12,0,0,.02,musicGain);tone(n*2,beat*.9,'square',.03,0,0,.01,musicGain);
  if(i%2===0){tone(55,.35,'sine',.5,30,0,.005,musicGain);}if(i%8===4||i%8===7){const t=AC.currentTime;const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=300;const g=AC.createGain();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(f);f.connect(g);g.connect(musicGain);s.start(t);s.stop(t+.5);}
  if(i%16===0){[146.8,174.6,220].forEach(f=>tone(f,beat*7,'triangle',.05,0,0,.6,musicGain));}
  i++;},beat*1000);}
function stopMusic(){if(!musicTimer)return;clearInterval(musicTimer);musicTimer=null;const g=musicGain;g.gain.cancelScheduledValues(AC.currentTime);g.gain.setValueAtTime(g.gain.value,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+2);}

 if(G.mode==='title'){if(k==='Enter'||k==='Space')($('btnContinue').classList.contains('hide')?$('btnNew'):$('btnContinue')).click();return;}

 if(P.state==='dead'){if(G.deadT>3)respawn();return;}
 switch(k){
  case 'Space':spaceDownT=G.time;break;
  case 'KeyJ':buffer(e.shiftKey?'heavy':'light');break;
  case 'KeyF':case 'KeyL':buffer('heavy');break;
  case 'KeyG':buffer('skill');break;

  case 'Digit1':P.item=0;break;case 'Digit2':P.item=1;break;case 'Digit3':P.item=2;break;

 }

 canvas.addEventListener('touchmove',ev=>{for(const t of ev.changedTouches){if(t.identifier===stick.id){let dx=t.clientX-stick.ox,dy=t.clientY-stick.oy;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l;}stick.x=dx/m;stick.y=dy/m;$('stickKnob').style.transform=`translate(${dx}px,${dy}px)`;}
  else if(t.identifier===camT.id){cam.yaw-=(t.clientX-camT.x)*.006;cam.pitch=clamp(cam.pitch+(t.clientY-camT.y)*.004,-.25,1.05);camT.x=t.clientX;camT.y=t.clientY;}}},{passive:true});
 const end=ev=>{for(const t of ev.changedTouches){if(t.identifier===stick.id){stick.id=null;stick.x=stick.y=0;$('stickBase').style.display='none';$('stickKnob').style.transform='';}if(t.identifier===camT.id)camT.id=null;}};
 canvas.addEventListener('touchend',end);canvas.addEventListener('touchcancel',end);}

/* ---------------- UI HELPERS ---------------- */
let toastTimer=0,bannerTimer=0,msgTimer=0;
function toast(t,dur=2.6){const el=$('toast');el.textContent=t;el.style.opacity=1;toastTimer=dur;}
function banner(jp,en,cls,dur=3.5){const b=$('banner');b.className=cls||'';b.querySelector('.jp').textContent=jp;b.querySelector('.en').textContent=en||'';b.style.opacity=1;bannerTimer=dur;}
function showMsg(t,dur=5){const m=$('msgBox');const [a,...rest]=t.split('\n');m.innerHTML='';m.appendChild(document.createTextNode(a));if(rest.length){const s=document.createElement('small');s.textContent=rest.join('\n');m.appendChild(s);}m.classList.remove('hide');msgTimer=dur;}
function fadeTo(v){$('fade').style.opacity=v;}
let soulShown=0,soulGainAcc=0,soulGainT=0;
function gainSouls(n){n=Math.round(n);P.souls+=n;soulGainAcc+=n;soulGainT=2.2;}

/* ---------------- PLAYER ---------------- */
const PATK={
 light:[{anim:'slashH',dur:.72,hit:[.34,.53],mv:.68,st:16,arc:2.4,range:2.7},{anim:'slashH2',dur:.7,hit:[.32,.5],mv:.72,st:16,arc:2.4,range:2.7},{anim:'slashV',dur:.86,hit:[.36,.52],mv:.88,st:19,arc:1.3,range:2.95}],
 heavy:{anim:'heavy',dur:1.15,hit:[.46,.62],mv:1.3,st:30,arc:1.3,range:3.05,poise:2.4,lunge:3},
 skill:{anim:'skill',dur:1.1,hit:[.42,.56],mv:.7,st:20,arc:2.4,range:2.8,fp:35,wave:.47},
 rollatk:{anim:'thrust',dur:.72,hit:[.4,.56],mv:.75,st:16,arc:.8,range:3.1,lunge:4},
};
function useSt(n){P.st=Math.max(-15,P.st-n);P.stDelay=.6;}
function startRoll(mv){P.state='roll';P.t=0;useSt(20);const d=mv.len>.1?new V3(mv.x,0,mv.z).normalize():new V3(Math.sin(P.facing),0,Math.cos(P.facing));P.rollDir.copy(d);P.facing=Math.atan2(d.x,d.z);SFX.roll();P.combo=0;}
function startAttack(kind,mv){let a;if(kind==='light'){a=PATK.light[P.combo%3];P.combo++;}else{a=PATK[kind];P.combo=kind==='rollatk'?1:0;}
 P.atk=a;P.state='attack';P.t=0;P.hitSet.clear();P.trailDone=false;P.waveDone=false;useSt(a.st);if(a.fp)P.fp-=a.fp;
 if(P.lock)P.facing=angTo(P.pos,P.lock.pos);else if(mv&&mv.len>.1)P.facing=Math.atan2(mv.x,mv.z);
 SFX.swing(kind==='heavy');if(kind==='skill')SFX.magic();}
function useItem(){const it=ITEMS[P.item].id;
 if(it==='estus'){if(P.estus<=0){toast('エスト瓶は空だ');return;}P.state='drink';P.t=0;P.drinkDone=false;P.drinkKind='estus';}
 else if(it==='ash'){if(P.ash<=0){toast('灰のエスト瓶は空だ');return;}P.state='drink';P.t=0;P.drinkDone=false;P.drinkKind='ash';}
 else if(it==='bomb'){if(P.bombs<=0){toast('火炎壺を持っていない');return;}P.state='throw';P.t=0;P.thrown=false;if(P.lock)P.facing=angTo(P.pos,P.lock.pos);}}
function walkable(x,z,r,who){if(!inZones(x,z,r))return false;
 if(who==='player'){if(!G.bossDead){if(!G.inBossRoom&&z<FOG_Z-.2)return false;if(G.inBossRoom&&z>FOG_Z-1.6)return false;}}
 else if(who==='enemy'){if(z<FOG_Z+.6)return false;}else if(who==='boss'){if(z>FOG_Z-2)return false;}
 for(const o of OBST){const dx=x-o.x,dz=z-o.z,R=o.r+r;if(dx*dx+dz*dz<R*R)return false;}return true;}
function moveEnt(pos,dx,dz,r,who){if(walkable(pos.x+dx,pos.z,r,who))pos.x+=dx;if(walkable(pos.x,pos.z+dz,r,who))pos.z+=dz;}
function hitPlayer(raw,src,opt={}){
 if(P.state==='dead'||G.mode!=='play'&&G.mode!=='menu')return false;if(P.iframe)return false;if(P.state==='fog')return false;
 const ang=angTo(P.pos,src);const away=new V3(P.pos.x-src.x,0,P.pos.z-src.z).normalize();
 if(P.guard&&Math.abs(angDiff(P.facing,ang))<1.3&&!opt.unblockable){
  const cut=opt.fire?.6:1;P.hp-=raw*(1-cut)*D.def;P.st-=raw*.5*(100/ (EQUIP.shield.stab+50));P.stDelay=.7;SFX.block();
  const sx=P.pos.x+Math.sin(P.facing)*.6,sz=P.pos.z+Math.cos(P.facing)*.6;spark(sx,1.2,sz,14,[1,.85,.5],4);P.knock.copy(away).multiplyScalar(3.5);
  if(P.st<=0){P.st=0;P.state='gbreak';P.t=0;SFX.gbreak();}
  if(P.hp<=0)killPlayer();return true;}
 const dmg=raw*D.def;P.hp-=dmg;P.state='hurt';P.t=0;P.knock.copy(away).multiplyScalar(opt.big?7:4.5);G.shake=Math.max(G.shake,.35);SFX.hurt();blood(P.pos.x,1.2,P.pos.z,16);spark(P.pos.x,1.2,P.pos.z,6,[1,.3,.15],3);
 P.combo=0;if(P.hp<=0)killPlayer();return true;}
function killPlayer(){P.hp=0;P.state='dead';P.t=0;G.deadT=0;P.lock=null;SFX.death();G.deaths++;
 G.blood=P.souls>0?{x:P.pos.x,z:P.pos.z,souls:P.souls}:null;P.souls=0;soulShown=0;
 if(G.inBossRoom&&!G.bossDead)stopMusic();save();}
function respawn(){if(G.respawning)return;G.respawning=true;fadeTo(1);
 setTimeout(()=>{$('dead').style.opacity=0;$('dead').classList.remove('on');restAtBonfire(G.lastBonfire,true);P.state='idle';G.respawning=false;setTimeout(()=>fadeTo(0),250);},900);}
function placeAt(i){const b=BONFIRES[i];P.pos.set(b.spawn[0],0,b.spawn[1]);P.facing=angTo(P.pos,{x:b.x,z:b.z})+Math.PI;cam.yaw=P.facing+Math.PI;P.y=0;
 P.model.root.position.copy(P.pos);if(i===2){G.inBossRoom=true;}else G.inBossRoom=false;}
function restAtBonfire(i,teleport){D=derive(P.stats);P.hp=D.hp;P.fp=D.fp;P.st=D.st;P.hpLag=P.hp;P.estus=P.estusMax;P.ash=P.ashMax;
 G.inBossRoom=false;G.bossActive=false;$('bossBox').classList.add('hide');stopMusic();
 for(const e of ENEMIES)resetEnemy(e);for(const pr of PROJ)pr.dead=true;
 if(teleport)placeAt(i);G.lastBonfire=i;P.lock=null;save();}

function updatePlayer(dt){
 const m=P.model;const mv=moveInput();P.t+=dt;P.guard=false;P.iframe=false;
 const busy=['roll','attack','gbreak'].includes(P.state)||P.sprinting;
 if(P.stDelay>0)P.stDelay-=dt;else if(!busy)P.st=Math.min(D.st,P.st+(inputGuard()?16:50)*dt);
 if(P.lock&&(P.lock.dead||dist2(P.lock.pos,P.pos)>26||P.lock.state==='dormant'))P.lock=null;
 // knockback
 if(P.knock.lengthSq()>.01){moveEnt(P.pos,P.knock.x*dt,P.knock.z*dt,P.r,'player');P.knock.multiplyScalar(Math.exp(-8*dt));}
 let pose=null;const S=P.state;
 if(S==='idle'||S==='move'){
  const b=takeBuf();
  if(b==='roll'&&P.st>0)return startRoll(mv);
  if(b==='light'&&P.st>0)return startAttack('light',mv);
  if(b==='heavy'&&P.st>0)return startAttack('heavy',mv);
  if(b==='skill'){if(P.fp>=35&&P.st>0)return startAttack('skill',mv);toast('FPが足りない');}
  if(b==='item')useItem();
  if(P.state!==S)return;
  P.guard=inputGuard();P.sprinting=false;let sp=3.5;
  if(P.guard)sp=1.9;else if(sprintHeld()&&mv.len>.2&&P.st>1){sp=6.4;P.sprinting=true;P.st-=17*dt;P.stDelay=.35;}
  if(mv.len>.05){moveEnt(P.pos,mv.x*sp*mv.len*dt,mv.z*sp*mv.len*dt,P.r,'player');P.state='move';}else P.state='idle';
  if(P.lock&&!P.sprinting)turnTo(P,angTo(P.pos,P.lock.pos),10*dt);else if(mv.len>.05)turnTo(P,Math.atan2(mv.x,mv.z),11*dt);
  P.walkPhase+=dt*sp*2.3*(mv.len>.05?1:0);
  pose=locoPose(P.walkPhase,mv.len>.05?Math.min(1,sp/3.5)*.55*mv.len+.05:0,P.guard,P.sprinting);
  if(mv.len<=.05)pose.hY+=Math.sin(G.time*1.6)*.012;
  applyPose(m,pose,1-Math.exp(-dt*14));m.pivot.rotation.x=lerp(m.pivot.rotation.x,0,.3);
 }
 else if(S==='roll'){const dur=.64,u=P.t/dur;const sp=u<.7?7.4*(1-u*.55):2;moveEnt(P.pos,P.rollDir.x*sp*dt,P.rollDir.z*sp*dt,P.r,'player');
  P.iframe=P.t>.03&&P.t<.42;const k=smooth((P.t-.04)/.5);m.pivot.rotation.x=k*Math.PI*2;
  applyPose(m,PZ({hY:-.3,tX:.6,aRx:-1.2,aLx:-1.2,lL:-1.2,lR:-1.0}),u<.8?.35:.15);
  if(u>.55){const b=peekBuf();if(b==='light'&&P.st>0){takeBuf();m.pivot.rotation.x=0;return startAttack('rollatk',mv);}}
  if(u>=1){m.pivot.rotation.x=0;P.state='idle';}}
 else if(S==='attack'){const a=P.atk,u=P.t/a.dur;
  if(u<.28){if(P.lock)turnTo(P,angTo(P.pos,P.lock.pos),8*dt);else if(mv.len>.1)turnTo(P,Math.atan2(mv.x,mv.z),6*dt);}
  if(u>a.hit[0]-.12&&u<a.hit[1]){const ls=a.lunge||2.2;moveEnt(P.pos,Math.sin(P.facing)*ls*dt,Math.cos(P.facing)*ls*dt,P.r,'player');}
  if(u>=a.hit[0]&&!P.trailDone){P.trailDone=true;spawnTrail(P,TRAIL_OF[a.anim],a.anim==='skill'?0x7fb4ff:0xa8c4ff);}
  if(u>=a.hit[0]&&u<=a.hit[1]){const dmg=(D.phys+D.mag)*a.mv;for(const e of ENEMIES){if(e.dead||P.hitSet.has(e)||e.y>1.6||e.state==='dormant')continue;if(inArc(P.pos,P.facing,e.pos,a.range+e.r,a.arc)){P.hitSet.add(e);damageEnemy(e,dmg,a.poise||1);}}}
  if(a.wave&&!P.waveDone&&u>=a.wave){P.waveDone=true;spawnWave();}
  pose=keyPose(ANIM[a.anim],u);applyPose(m,pose,.55);
  if(u>.62){const b=peekBuf();if(b==='light'&&P.st>0&&P.combo>0&&P.atk!==PATK.skill){takeBuf();return startAttack('light',mv);}if(b==='roll'&&P.st>0){takeBuf();return startRoll(mv);}if(b==='heavy'&&P.st>0){takeBuf();return startAttack('heavy',mv);}}
  if(u>=1){P.state='idle';P.combo=0;}}
 else if(S==='drink'){const dur=1.3,u=P.t/dur;if(mv.len>.05)moveEnt(P.pos,mv.x*1.1*dt,mv.z*1.1*dt,P.r,'player');
  if(u>.55&&!P.drinkDone){P.drinkDone=true;SFX.drink();if(P.drinkKind==='estus'){P.estus--;P.hp=Math.min(D.hp,P.hp+Math.round(D.hp*.5));for(let i=0;i<16;i++)PS_S.emit({x:P.pos.x+rand(-.5,.5),y:rand(.2,1.8),z:P.pos.z+rand(-.5,.5),vx:0,vy:rand(.5,1.5),vz:0,life:rand(.5,1),r:1,g2:.65,b:.2});}
   else{P.ash--;P.fp=Math.min(D.fp,P.fp+Math.round(D.fp*.6));for(let i=0;i<16;i++)PS_S.emit({x:P.pos.x+rand(-.5,.5),y:rand(.2,1.8),z:P.pos.z+rand(-.5,.5),vx:0,vy:rand(.5,1.5),vz:0,life:rand(.5,1),r:.3,g2:.55,b:1});}}
  pose=keyPose(ANIM.drink,u);applyPose(m,pose,.4);if(u>=1)P.state='idle';}
 else if(S==='throw'){const dur=.8,u=P.t/dur;if(u>.42&&!P.thrown){P.thrown=true;P.bombs--;spawnBomb();}pose=keyPose(ANIM.slashV,u*.9);applyPose(m,pose,.5);if(u>=1)P.state='idle';}
 else if(S==='hurt'){applyPose(m,POSE.hurt,.3);if(P.t>.42){P.state='idle';}}
 else if(S==='gbreak'){applyPose(m,POSE.gbreak,.25);if(P.t>1.1)P.state='idle';}
 else if(S==='fog'){const k=P.t/1.5;P.pos.z=lerp(P.fogFrom,FOG_Z-2.6,smooth(k));P.facing=Math.PI;P.walkPhase+=dt*5;applyPose(m,locoPose(P.walkPhase,.35,false,false),.3);
  if(k>=1){P.state='idle';G.inBossRoom=true;startBoss();}}
 else if(S==='sit'){applyPose(m,POSE.sit,.12);}
 else if(S==='dead'){G.deadT+=dt;const k=smooth(P.t/1.1);m.pivot.rotation.x=-k*Math.PI/2;applyPose(m,PZ({aRx:.2,aLx:.2,aLz:.6,aRz:-.6,lL:-.2}),.1);
  if(G.deadT>1.3&&!$('dead').classList.contains('on')){$('dead').classList.add('on');$('dead').style.opacity=1;SFX.youdied();}
  if(G.deadT>8)respawn();}
 // cape
 if(m.cape)m.cape.rotation.x=.12+(P.state==='move'?(P.sprinting?.7:.3):0)+Math.sin(G.time*3)*.04;
 m.root.position.set(P.pos.x,P.state==='dead'?-smooth(P.t/1.1)*.38:0,P.pos.z);m.root.rotation.y=P.facing;
}
function inArc(from,facing,to,range,arc){const dx=to.x-from.x,dz=to.z-from.z,d=Math.hypot(dx,dz);if(d>range)return false;if(arc>=6.2)return true;return Math.abs(angDiff(facing,Math.atan2(dx,dz)))<=arc/2;}

/* ---------------- LOCK ON ---------------- */
function toggleLock(){if(P.lock){P.lock=null;return;}let best=null,bs=1e9;const fwd=Math.atan2(-Math.sin(cam.yaw),-Math.cos(cam.yaw));
 for(const e of ENEMIES){if(e.dead||e.state==='dormant'||!e.m.root.visible)continue;const d=dist2(e.pos,P.pos);if(d>20)continue;const a=Math.abs(angDiff(fwd,angTo(P.pos,e.pos)));if(a>1.4)continue;const s=d+a*8;if(s<bs){bs=s;best=e;}}
 if(best)P.lock=best;else cam.yaw=P.facing+Math.PI;}

/* ---------------- ENEMIES ---------------- */
function damageEnemy(e,dmg,poiseMul=1,kind){dmg=Math.round(dmg*e.def.def*rand(.95,1.05));e.hp-=dmg;e.barT=6;if(e.dmgT>0)e.dmgAcc+=dmg;else e.dmgAcc=dmg;e.dmgT=1.4;
 const cy=1.2*e.def.scale;if(kind==='magic')spark(e.pos.x,cy,e.pos.z,18,[.5,.75,1],4);else if(kind==='fire')spark(e.pos.x,cy,e.pos.z,14,[1,.5,.15],4);else{spark(e.pos.x,cy,e.pos.z,10,[1,.75,.4],4);blood(e.pos.x,cy,e.pos.z,12);}
 SFX.hit();G.hitstop=.055;G.shake=Math.max(G.shake,.12);
 if(e.state==='idle'||e.state==='return')e.state='chase';
 const canStagger=!['leap','roar','dormant','rise'].includes(e.state);
 e.poise-=28*poiseMul;if(e.poise<=0&&canStagger){e.state='hurt';e.t=0;e.poise=e.def.poise;e.spin=0;e.knock.set(e.pos.x-P.pos.x,0,e.pos.z-P.pos.z).normalize().multiplyScalar(3);}
 if(e.hp<=0)killEnemy(e);}
function killEnemy(e){e.dead=true;e.deadT=0;e.hp=0;e.bar.classList.add('hide');if(P.lock===e)P.lock=null;
 const s=e.def.souls*D.soulMul;soulBurst(e.pos.x,1.2*e.def.scale,e.pos.z,e.def.boss?160:24);setTimeout(()=>{gainSouls(s);SFX.souls();},e.def.boss?2600:700);
 if(e.def.boss){G.bossDead=true;G.bossActive=false;stopMusic();G.hitstop=.4;G.shake=1;
  setTimeout(()=>{banner('宿敵撃破','GREAT ENEMY FELLED','gold',6);SFX.victory();$('bossBox').classList.add('hide');},1600);
  setTimeout(()=>{BONFIRES[2].g.visible=true;BONFIRES[2].hidden=false;save();},3000);
  setTimeout(()=>{if(G.mode==='play'&&P.state!=='dead')showEnding();},9000);}}
function chooseAttack(e,d){const opts=e.atks.map(k=>ATK[k]).filter(a=>d<=a.maxD&&d>=(a.minD||0));if(!opts.length)return null;let tot=0;for(const a of opts)tot+=a.w||1;let r=Math.random()*tot;for(const a of opts){r-=a.w||1;if(r<=0)return a;}return opts[0];}
function startBoss(){const b=G.boss;if(!b||G.bossDead)return;G.bossActive=true;b.state='rise';b.t=0;$('bossBox').classList.remove('hide');$('bossName').textContent=b.def.name;startMusic();
 for(const f of arenaFires)f.on=true;banner('深淵の間','',`area`,3);}
function updateEnemy(e,dt){const m=e.m,d=e.def,sc=d.scale;
 if(e.dead){e.deadT+=dt;const k=smooth(e.deadT/.9);m.pivot.rotation.x=-k*Math.PI/2*.97;m.root.position.y=-k*.38*sc;
  if(e.deadT>1.4){const f=1-(e.deadT-1.4)/1.2;for(const mt of m.mats){mt.transparent=true;mt.opacity=Math.max(0,f);}if(Math.random()<.5)PS_S.emit({x:e.pos.x+rand(-.6,.6)*sc,y:rand(.1,.6),z:e.pos.z+rand(-.6,.6)*sc,vx:0,vy:rand(.5,1.5),vz:0,life:.8,r:.8,g2:.85,b:1});if(f<=0)m.root.visible=false;}
  return;}
 e.t+=dt;if(e.cd>0)e.cd-=dt;if(e.dmgT>0)e.dmgT-=dt;if(e.barT>0)e.barT-=dt;
 const dP=dist2(e.pos,P.pos),aP=angTo(e.pos,P.pos);const pAlive=P.state!=='dead';const who=d.boss?'boss':'enemy';
 if(e.knock.lengthSq()>.01){moveEnt(e.pos,e.knock.x*dt,e.knock.z*dt,e.r,who);e.knock.multiplyScalar(Math.exp(-7*dt));}
 let pose=null,moveAmp=0,spd=0;
 switch(e.state){
  case 'dormant':pose=POSE.kneel;break;
  case 'rise':{if(e.t<.1)SFX.roar();pose=keyPose([[0,POSE.kneel],[.5,POSE.kneel],[1.3,POSE.roar],[2,PZ()]],e.t);if(e.t>.8&&e.t<1.4){G.shake=Math.max(G.shake,.3);}turnTo(e,aP,2*dt);if(e.t>2){e.state='chase';e.t=0;e.cd=.3;}break;}
  case 'idle':{if(pAlive&&dP<d.aggro&&(!d.boss)){const seen=dP<5||Math.abs(angDiff(e.facing,aP))<1.6;if(seen){e.state='chase';e.t=0;}}turnTo(e,e.homeFace,1.5*dt);pose=locoPose(G.time*.8+e.walkPhase,0,false,false,d.hunch);pose.tX+=Math.sin(G.time*1.3+e.walkPhase)*.03;break;}
  case 'chase':{
   if(!pAlive){e.state=d.boss?'idle2':'return';break;}
   if(!d.boss&&dist2(e.pos,e.home)>34){e.state='return';break;}
   if(d.boss&&e.phase===1&&e.hp<e.maxHp*.5){e.phase=2;e.state='roar';e.t=0;e.atks.push('b_wave');break;}
   turnTo(e,aP,d.turn*dt);
   if(e.cd<=0&&Math.abs(angDiff(e.facing,aP))<.7){const a=chooseAttack(e,dP);if(a){e.atk=a;e.state=a.special==='leap'?'leap':'attack';e.t=0;e.hitFlags=[];e.waveDone=false;e.trailIdx=-1;e.leapFrom=null;e.landed=false;break;}}
   spd=d.speed*(e.phase===2?1.2:1);
   if(dP>d.range){moveEnt(e.pos,Math.sin(aP)*spd*dt,Math.cos(aP)*spd*dt,e.r,who);moveAmp=.55;}

const PROJ=[];
function spawnWave(){const g=new THREE.Group();const mat=new THREE.MeshBasicMaterial({color:0x8fc0ff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false});
 const r=new THREE.Mesh(new THREE.RingGeometry(1.1,1.7,32,1,Math.PI*1.15,Math.PI*.7),mat);r.rotation.x=-Math.PI/2;g.add(r);const r2=new THREE.Mesh(new THREE.RingGeometry(1.2,1.5,32,1,Math.PI*1.15,Math.PI*.7),mat.clone());r2.material.color.setHex(0xffffff);r2.rotation.x=-Math.PI/2;g.add(r2);
 g.position.set(P.pos.x,1.1,P.pos.z);g.rotation.y=P.facing;g.rotation.z=.25;scene.add(g);
 PROJ.push({kind:'wave',g,mat,pos:g.position,vel:new V3(Math.sin(P.facing)*17,0,Math.cos(P.facing)*17),life:1.3,hit:new Set()});}
function spawnBomb(){const g=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),new THREE.MeshStandardMaterial({color:0x3a2a1a,emissive:0x552200}));g.position.set(P.pos.x+Math.sin(P.facing)*.4,1.7,P.pos.z+Math.cos(P.facing)*.4);scene.add(g);
 let sp=10;if(P.lock){const d=dist2(P.pos,P.lock.pos);sp=clamp(d*1.15,5,13);}
 PROJ.push({kind:'bomb',g,pos:g.position,vel:new V3(Math.sin(P.facing)*sp,5,Math.cos(P.facing)*sp),life:3,hit:new Set()});SFX.swing(false);}

function explode(p){spark(p.x,.5,p.z,30,[1,.55,.15],6);for(let i=0;i<24;i++)PS_B.emit({x:p.x+rand(-1,1),y:rand(.2,1.5),z:p.z+rand(-1,1),vx:rand(-2,2),vy:rand(1,4),vz:rand(-2,2),life:rand(.4,.9),r:1,g2:.45,b:.1,drag:1.5});SFX.fire();G.shake=Math.max(G.shake,.25);

function updateProjectiles(dt){for(const pr of PROJ){if(pr.dead)continue;pr.life-=dt;
  if(pr.kind==='wave'){pr.pos.addScaledVector(pr.vel,dt);pr.mat.opacity=Math.min(.9,pr.life*1.5);if(!walkable(pr.pos.x,pr.pos.z,0,'none')&&!inZones(pr.pos.x,pr.pos.z,0))pr.life=Math.min(pr.life,.1);
   for(const e of ENEMIES){if(e.dead||pr.hit.has(e)||e.state==='dormant')continue;if(dist2(e.pos,pr.pos)<1.7+e.r){pr.hit.add(e);damageEnemy(e,D.mag*2.6+D.phys*.6+40,2,'magic');}}
   if(Math.random()<.7)PS_S.emit({x:pr.pos.x+rand(-1,1),y:pr.pos.y+rand(-.2,.2),z:pr.pos.z+rand(-1,1),vx:0,vy:.3,vz:0,life:.4,r:.5,g2:.75,b:1});}
  else if(pr.kind==='bomb'){pr.vel.y-=16*dt;pr.pos.addScaledVector(pr.vel,dt);PS_B.emit({x:pr.pos.x,y:pr.pos.y,z:pr.pos.z,vx:0,vy:.5,vz:0,life:.25,r:1,g2:.5,b:.1});
   let boom=pr.pos.y<=.12||!inZones(pr.pos.x,pr.pos.z,0);for(const e of ENEMIES){if(!e.dead&&dist2(e.pos,pr.pos)<e.r+.4&&pr.pos.y<2.2*e.def.scale)boom=true;}
   if(boom){explode(pr.pos);pr.life=0;}}
  else if(pr.kind==='fwave'){pr.pos.addScaledVector(pr.vel,dt);for(let i=0;i<3;i++)PS_B.emit({x:pr.pos.x+rand(-.4,.4),y:rand(.1,.6),z:pr.pos.z+rand(-.4,.4),vx:rand(-.5,.5),vy:rand(2,4),vz:rand(-.5,.5),life:rand(.3,.6),r:1,g2:rand(.3,.5),b:.08,drag:1});
   if(!inZones(pr.pos.x,pr.pos.z,0))pr.life=0;if(!pr.hit.has(P)&&dist2(pr.pos,P.pos)<1.1&&P.state!=='dead'){if(hitPlayer(70,pr.src.pos,{fire:true}))pr.hit.add(P);}}

  const E=EQUIP[eqSel];let d=`<div class="sub"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${E.name}</h3><div style="font-size:14px;color:#b8aa90">${E.type}${E.atk?' ／ '+E.atk:''}</div></div><div style="width:64px;flex:none">${ICON[E.icon]}</div></div>`;
  if(eqSel==='weapon'){d+=`<div class="row"><span>消費FP</span><span class="v">${E.fp}</span></div><div class="row"><span>重量</span><span class="v">${E.wt.toFixed(1)}</span></div><div class="two"><div><h4>攻撃力</h4><div class="row"><span>物理</span><span class="v">${D.physB} + ${D.phys-D.physB}</span></div><div class="row"><span>魔力</span><span class="v">${D.magB} + ${D.mag-D.magB}</span></div><div class="row"><span>炎</span><span class="v">0</span></div><div class="row"><span>雷</span><span class="v">0</span></div><div class="row"><span>致命</span><span class="v">100</span></div></div><div><h4>補正</h4><div class="row"><span>筋力</span><span class="v">C</span></div><div class="row"><span>技量</span><span class="v">D</span></div><div class="row"><span>理力</span><span class="v">B</span></div></div></div>`;}
  else if(eqSel==='shield'){d+=`<div class="row"><span>重量</span><span class="v">${E.wt.toFixed(1)}</span></div><h4>ガード時カット率</h4>`;for(const [l,v] of E.cut)d+=`<div class="row"><span>${l}</span><span class="v">${v.toFixed(1)}</span></div>`;d+=`<div class="row"><span>受け能力</span><span class="v">${E.stab}</span></div>`;}
  else d+=`<div class="row"><span>重量</span><span class="v">${E.wt.toFixed(1)}</span></div>`;
  d+=`<div class="desc">${E.desc}</div></div>`;
  B.innerHTML=`<div class="ph">${ICON.sword.replace('<svg','<svg style="width:26px;height:26px"')}装備</div><div class="eq">${g}${d}${charData()}</div><div class="foot"><span>クリック：詳細</span><span>Esc：閉じる</span></div>`;
  B.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{eqSel=b.dataset.s;SFX.menu();renderMenu();});B.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{itSel=+b.dataset.it;menuTab='items';renderMenu();});}
 else if(menuTab==='status'){const bar=(v,m,c)=>`<span class="sbar"><i style="width:${clamp(v/m*100,0,100)}%;background:${c}"></i></span>`;
  let h=`<div class="ph">ステータス</div><div class="eq" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="sub"><div style="display:flex;gap:14px;align-items:center"><div style="width:60px">${ICON.helm}</div><div style="flex:1"><div class="row"><span>レベル</span><span class="v">${D.lv}</span></div><div class="row"><span>所持ソウル</span><span class="v">${P.souls.toLocaleString()}</span></div></div></div><div style="height:6px"></div>`;
  for(const [k,l,desc] of STAT_INFO)h+=`<div class="row" title="${desc}"><span>${l}</span><span class="v">${P.stats[k]}</span></div>`;
  h+=`<div style="height:10px"></div><div class="row"><span style="width:62px">HP</span>${bar(P.hp,D.hp,'#b0301e')}<span class="v">${Math.ceil(P.hp)}/${D.hp}</span></div><div class="row"><span style="width:62px">FP</span>${bar(P.fp,D.fp,'#2e5ac0')}<span class="v">${Math.floor(P.fp)}/${D.fp}</span></div><div class="row"><span style="width:62px">スタミナ</span>${bar(D.st,D.st,'#2e8a3e')}<span class="v">${D.st}</span></div></div>`;
  h+=`<div class="sub"><h3>能力</h3><div class="row"><span>攻撃力 物理</span><span class="v">${D.phys}</span></div><div class="row"><span>攻撃力 魔力</span><span class="v">${D.mag}</span></div><div class="row"><span>被ダメージ倍率</span><span class="v">${Math.round(D.def*100)}%</span></div><div class="row"><span>ソウル取得</span><span class="v">${Math.round(D.soulMul*100)}%</span></div><div class="row"><span>次のレベルまで</span><span class="v">${lvCost(D.lv).toLocaleString()}</span></div>
   <h4>記録</h4><div class="row"><span>死亡回数</span><span class="v">${G.deaths}</span></div><div class="row"><span>プレイ時間</span><span class="v">${fmtTime(G.playTime)}</span></div><div class="row"><span>深淵の騎士</span><span class="v">${G.bossDead?'撃破':'―'}</span></div></div></div>`;
  B.innerHTML=h;}
 else if(menuTab==='items'){const cnt=[`${P.estus}/ ${P.estusMax}`,`${P.ash}/ ${P.ashMax}`,`${P.bombs}`];let h=`<div class="ph">インベントリ</div><div class="eq" style="grid-template-columns:minmax(0,220px) minmax(0,1fr)"><div>`;
  ITEMS.forEach((it,i)=>{h+=`<button class="mi ${itSel===i?'sel':''}" data-i="${i}"><span style="width:30px;height:36px;display:inline-block">${ICON[it.icon]}</span>${it.name}<span style="margin-left:auto;font-family:Cinzel">${cnt[i]}</span></button>`;});
  const it=ITEMS[itSel];h+=`</div><div class="sub"><div style="display:flex;gap:16px"><div style="width:110px;height:130px;border:1px solid #4e4436;background:#0a0908">${ICON[it.icon]}</div><div style="flex:1"><h3>${it.name}</h3><div style="color:#b8aa90;font-size:14px">${it.type}</div><div class="row" style="margin-top:10px"><span>所持数</span><span class="v">${cnt[itSel]}</span></div><div class="row"><span>クイックスロット</span><span class="v">${P.item===itSel?'装備中':'―'}</span></div></div></div><div class="desc">${it.desc}</div><button class="big" id="setQuick">クイックスロットに設定</button></div></div>`;
  B.innerHTML=h;B.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{itSel=+b.dataset.i;SFX.menu();renderMenu();});$('setQuick').onclick=()=>{P.item=itSel;SFX.menu();renderMenu();};}
 else if(menuTab==='controls'){B.innerHTML=`<div class="ph">操作説明</div><div style="padding:16px 20px">${howHTML()}</div>`;}
 else if(menuTab==='system'){B.innerHTML=`<div class="ph">システム</div><div style="padding:16px 20px;line-height:1.9"><p>セーブは篝火での休息・レベルアップ・死亡時に自動で行われます。</p><button class="big" id="toTitle" style="margin-left:0">タイトルへ戻る</button><button class="big" id="wipe" style="margin-left:0;background:linear-gradient(#5a1c1c,#2c0e0e);border-color:#a04444">セーブデータを削除してタイトルへ</button></div>`;
  $('toTitle').onclick=()=>{save();location.reload();};$('wipe').onclick=()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}location.reload();};}}
function fmtTime(s){s=Math.floor(s);return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function howHTML(){if(IS_TOUCH)return `<div class="keys"><b>左側をドラッグ</b><span>移動</span><b>右側をドラッグ</b><span>カメラ</span><b>攻撃 / 強攻撃</b><span>攻撃（連打でコンボ）</span><b>回避</b><span>タップでローリング（無敵時間あり）／長押しでダッシュ</span><b>ガード</b><span>押している間、盾を構える</span><b>戦技</b><span>月光の奔流（FP 35）</span><b>ロック</b><span>敵をロックオン</span><b>アイテム / 切替</b><span>クイックアイテムを使う／切り替える</span><b>調べる</b><span>篝火・メッセージ・アイテム・霧</span><b>≡</b><span>メニュー</span></div>`;
 return `<div class="keys"><b>WASD</b><span>移動</span><b>マウス</b><span>カメラ（画面クリックで固定）</span><b>左クリック / J</b><span>弱攻撃（連打で3段コンボ）</span><b>Shift+左クリック / F</b><span>強攻撃</span><b>右クリック / K</b><span>ガード（押している間）</span><b>Space</b><span>タップでローリング（無敵時間あり）／長押しでダッシュ</span><b>G</b><span>戦技「月光の奔流」（FP 35）</span><b>Q / ホイールクリック</b><span>ロックオン（もう一度で解除）</span><b>R</b><span>クイックアイテムを使う</span><b>1・2・3 / C / ホイール</b><span>クイックアイテムの切り替え</span><b>E</b><span>調べる（篝火・メッセージ・霧など）</span><b>Tab / Esc</b><span>メニュー</span></div>
 <p style="color:#a89a80;font-size:14px;line-height:1.8;margin-top:16px">死ぬと所持ソウルをその場に落とす。もう一度たどり着けば取り戻せるが、その前に死ねば失われる。<br>篝火で休むとHPとエスト瓶が戻るが、倒した敵も蘇る。</p>`;}

/* ---------------- TITLE / FLOW ---------------- */
function startGame(cont){initAudio();const s=cont?loadSave():null;
 if(s){P.stats=Object.assign({},BASE_STATS,s.stats);P.souls=s.souls||0;(s.lit||[]).forEach((v,i)=>{if(BONFIRES[i])BONFIRES[i].lit=v;});G.lastBonfire=s.last||0;G.bossDead=!!s.bossDead;G.blood=s.blood||null;G.picked=new Set(s.picked||[]);P.estusMax=s.estusMax||5;P.ashMax=s.ashMax||2;P.bombs=s.bombs||0;G.deaths=s.deaths||0;G.playTime=s.playTime||0;}
 else{try{localStorage.removeItem(SAVE_KEY);}catch(e){}for(const b of BONFIRES)b.lit=false;}
 for(const p of PICKUPS)p.spr.visible=!G.picked.has(p.id);
 if(G.bossDead){BONFIRES[2].hidden=false;BONFIRES[2].g.visible=true;}
 if(G.lastBonfire===2&&!G.bossDead)G.lastBonfire=1;
 soulShown=P.souls;$('title').classList.add('hide');$('hud').classList.remove('hide');if(IS_TOUCH)setupTouch();
 P.state='idle';fadeTo(1);setTimeout(()=>{restAtBonfire(G.lastBonfire,true);P.state='idle';G.mode='play';fadeTo(0);G.area=-1;if(!IS_TOUCH)toast('画面をクリックするとマウスでカメラを操作できます',4);},700);}
function showEnding(){G.mode='ending';if(document.pointerLockElement)document.exitPointerLock();$('endStats').innerHTML=`レベル ${derive(P.stats).lv}　／　死亡回数 ${G.deaths}<br>プレイ時間 ${fmtTime(G.playTime)}`;$('ending').classList.remove('hide');}
$('endClose').onclick=()=>{$('ending').classList.add('hide');G.mode='play';};
$('btnNew').onclick=()=>startGame(false);$('btnContinue').onclick=()=>startGame(true);
$('btnHow').onclick=()=>{$('howBody').innerHTML=howHTML();$('howto').classList.remove('hide');};$('howClose').onclick=()=>$('howto').classList.add('hide');
if(!loadSave())$('btnContinue').classList.add('hide');
$('titleHint').textContent=IS_TOUCH?'タップで選択':'Enter で開始 ／ マウス・キーボード推奨';

/* ---------------- HUD UPDATE ---------------- */
const tmpV=new V3();
function proj(x,y,z){tmpV.set(x,y,z).project(camera);return{x:(tmpV.x*.5+.5)*innerWidth,y:(-tmpV.y*.5+.5)*innerHeight,ok:tmpV.z<1&&Math.abs(tmpV.x)<1.1&&Math.abs(tmpV.y)<1.1};}
let lastSlotKey='';
function updateHUD(dt){
 const W=Math.min(innerWidth-120,99999);
 $('hpBar').style.width=Math.min(W,D.hp*.42)+'px';$('fpBar').style.width=Math.min(W,D.fp*1.9)+'px';$('stBar').style.width=Math.min(W,D.st*2.1)+'px';
 if(P.hpLag>P.hp)P.hpLag=Math.max(P.hp,P.hpLag-D.hp*.35*dt);else P.hpLag=P.hp;
 $('hpBar').querySelector('.fill').style.width=clamp(P.hp/D.hp*100,0,100)+'%';$('hpBar').querySelector('.lag').style.width=clamp(P.hpLag/D.hp*100,0,100)+'%';
 $('fpBar').querySelector('.fill').style.width=clamp(P.fp/D.fp*100,0,100)+'%';$('stBar').querySelector('.fill').style.width=clamp(P.st/D.st*100,0,100)+'%';
 if(soulGainT>0){soulGainT-=dt;$('soulGain').textContent='+'+soulGainAcc.toLocaleString();$('soulGain').style.opacity=1;if(soulGainT<=0){soulGainAcc=0;$('soulGain').style.opacity=0;}}
 else{const df=P.souls-soulShown;soulShown=Math.abs(df)<1?P.souls:soulShown+df*Math.min(1,dt*6);}
 $('soulNum').textContent=Math.round(soulGainT>0?soulShown:soulShown).toLocaleString();
 const it=ITEMS[P.item],cnt=[P.estus,P.ash,P.bombs][P.item];const key=P.item+':'+cnt;
 if(key!==lastSlotKey){lastSlotKey=key;$('slotL').innerHTML=ICON.shield;$('slotR').innerHTML=ICON.sword;$('slotT').innerHTML=ICON.empty;$('slotB').innerHTML=ICON[it.icon]+`<b>${cnt}</b>`;$('itemName').textContent=it.name;$('slotB').style.opacity=cnt>0?1:.45;}
 // boss
 const b=G.boss;if(b&&G.bossActive&&!G.bossDead){if(b.hpLag>b.hp)b.hpLag=Math.max(b.hp,b.hpLag-b.maxHp*.15*dt);$('bossBar').querySelector('.fill').style.width=b.hp/b.maxHp*100+'%';$('bossBar').querySelector('.lag').style.width=b.hpLag/b.maxHp*100+'%';}
 // enemy bars
 for(const e of ENEMIES){const show=e.barT>0&&!e.dead&&!e.def.boss&&e.m.root.visible;if(!show){if(!e.bar.classList.contains('hide'))e.bar.classList.add('hide');continue;}
  const p=proj(e.pos.x,e.y+2.25*e.def.scale,e.pos.z);if(!p.ok){e.bar.classList.add('hide');continue;}e.bar.classList.remove('hide');e.bar.style.left=p.x+'px';e.bar.style.top=p.y+'px';
  if(e.hpLag>e.hp)e.hpLag=Math.max(e.hp,e.hpLag-e.maxHp*.5*dt);e.bar.querySelector('.fill').style.width=e.hp/e.maxHp*100+'%';e.bar.querySelector('.lag').style.width=e.hpLag/e.maxHp*100+'%';e.bar.querySelector('span').textContent=e.dmgT>0?e.dmgAcc:'';}
 const ld=$('lockDot');if(P.lock&&!P.lock.dead){const p=proj(P.lock.pos.x,P.lock.y+1.3*P.lock.def.scale,P.lock.pos.z);if(p.ok){ld.classList.remove('hide');ld.style.left=p.x+'px';ld.style.top=p.y+'px';}else ld.classList.add('hide');}else ld.classList.add('hide');
 // prompt
 curInteract=G.mode==='play'?findInteract():null;const pr=$('prompt');
 if(curInteract){pr.classList.remove('hide');pr.innerHTML=`<span class="k">${IS_TOUCH?'調べる':'E'}</span>${curInteract.label}`;}else pr.classList.add('hide');
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0;}
 if(bannerTimer>0){bannerTimer-=dt;if(bannerTimer<=0)$('banner').style.opacity=0;}
 if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0||!curInteract||curInteract.type!=='msg'&&msgTimer<4.6)$('msgBox').classList.add('hide');}
}

/* ---------------- CAMERA ---------------- */
const camLook=new V3(0,1.5,0);
function updateCamera(dt){
 if(G.mode==='title'){const t=G.time*.08;camera.position.set(4.2+Math.sin(t)*.8,1.7,10.5);camLook.set(-1.5,4.5,-30);camera.lookAt(camLook);}
 else{const tgt=new V3(P.pos.x,1.55,P.pos.z);let dist=cam.dist;
  if(P.lock){const d=new V3(P.lock.pos.x-P.pos.x,0,P.lock.pos.z-P.pos.z);const want=Math.atan2(-d.x,-d.z);cam.yaw+=angDiff(cam.yaw,want)*(1-Math.exp(-dt*6));cam.pitch=lerp(cam.pitch,P.lock.def.boss?.32:.26,dt*3);if(P.lock.def.boss)dist*=1.3;}
  if(P.state==='sit'||G.mode==='bonfire'){cam.yaw+=dt*.12;dist*=.85;}
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);const want=new V3(tgt.x+Math.sin(cam.yaw)*cp*dist,tgt.y+sp*dist,tgt.z+Math.cos(cam.yaw)*cp*dist);
  // keep camera inside reasonable area
  for(let k=1;k>.3;k-=.1){const x=lerp(tgt.x,want.x,k),z=lerp(tgt.z,want.z,k);if(inZones(x,z,-1.2)){want.x=x;want.z=z;break;}}
  if(want.y<.35)want.y=.35;camera.position.lerp(want,1-Math.exp(-dt*14));
  let look=tgt.clone();if(P.lock){look.lerp(new V3(P.lock.pos.x,P.lock.y+1.2*P.lock.def.scale,P.lock.pos.z),.35);}camLook.lerp(look,1-Math.exp(-dt*16));camera.lookAt(camLook);}
 if(G.shake>0){G.shake=Math.max(0,G.shake-dt*1.8);const s=G.shake*G.shake*.35;camera.position.x+=rand(-s,s);camera.position.y+=rand(-s,s);}
 sky.position.copy(camera.position);const ep=camera.position.clone().addScaledVector(SUN_DIR,450);corona.position.copy(ep);eDisc.position.copy(ep);
 sun.position.copy(P.pos).addScaledVector(SUN_DIR,70);sun.target.position.copy(P.pos);}

/* ---------------- WORLD UPDATE ---------------- */
function updateWorld(dt){
 for(const f of FIRES){const on=f.on!==false;if(f.light){const fl=f.base*(.8+Math.sin(G.time*13+f.x)*.08+Math.sin(G.time*23+f.z)*.07+rand(-.06,.06));f.light.intensity=f.lit===false?0:fl;}}
 for(const b of BONFIRES){if(b.hidden)continue;b.fire.light.intensity=b.lit?b.fire.light.intensity:0.15+Math.sin(G.time*2)*.05;const near=dist2(camera.position,b)<60;if(!near)continue;if(b.lit)fireEmit(b.x,.35,b.z,.9);else if(Math.random()<.1)PS_S.emit({x:b.x+rand(-.2,.2),y:.3,z:b.z+rand(-.2,.2),vx:0,vy:rand(.3,.8),vz:0,life:1,r:1,g2:.4,b:.1});}
 for(const f of FIRES){if(BONFIRES.some(b=>b.fire===f))continue;if(dist2(camera.position,f)<55)fireEmit(f.x,f.y,f.z,f.power);}
 // ambient embers & ash
 if(Math.random()<.5){const a=rand(0,6.28),r=rand(2,16);PS_S.emit({x:camera.position.x+Math.sin(a)*r,y:rand(0,4),z:camera.position.z+Math.cos(a)*r,vx:rand(-.3,.3),vy:rand(.1,.5),vz:rand(-.3,.3),life:rand(2,4),r:.9,g2:.4,b:.12});}
 fogMat.uniforms.t.value=G.time;if(G.bossDead){fogMat.uniforms.a.value=Math.max(0,fogMat.uniforms.a.value-dt*.5);fogGate.visible=fogMat.uniforms.a.value>0;}
 for(const m of MESSAGES)m.mesh.material.opacity=.7+Math.sin(G.time*2+m.x)*.25;
 for(const p of PICKUPS)if(p.spr.visible){const s=.55+Math.sin(G.time*3+p.x)*.15;p.spr.scale.setScalar(s);if(Math.random()<.05)PS_S.emit({x:p.x,y:.4,z:p.z,vx:0,vy:.6,vz:0,life:1,r:1,g2:.95,b:.8});}
 if(G.blood){bloodSpr.visible=true;bloodSpr.position.set(G.blood.x,.5,G.blood.z);bloodSpr.scale.setScalar(1+Math.sin(G.time*4)*.2);if(Math.random()<.2)PS_S.emit({x:G.blood.x+rand(-.2,.2),y:.3,z:G.blood.z+rand(-.2,.2),vx:0,vy:rand(.4,1),vz:0,life:1,r:.3,g2:1,b:.5});}else bloodSpr.visible=false;
 for(let i=TRAILS.length-1;i>=0;i--){const t=TRAILS[i];t.life-=dt;t.mat.opacity=Math.max(0,t.life/t.max)*.6;if(t.life<=0){scene.remove(t.g);t.g.children[0].geometry.dispose();t.mat.dispose();TRAILS.splice(i,1);}}
 PS_S.update(dt);PS_B.update(dt);PS_D.update(dt);}
function checkArea(){const z=zoneOf(P.pos.x,P.pos.z);if(z!==G.area&&z>=0){if(G.area!==-1&&z!==4&&!G.shownArea?.has(z)){G.shownArea=G.shownArea||new Set();G.shownArea.add(z);banner(ZONES[z].name,'','area',3);}if(G.area===-1){G.shownArea=G.shownArea||new Set();G.shownArea.add(z);banner(ZONES[z].name,'','area',3);}G.area=z;}}

/* ---------------- MAIN LOOP ---------------- */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-last)/1000);last=now;G.time+=dt;
 let gdt=dt;if(G.hitstop>0){G.hitstop-=dt;gdt=dt*.12;}
 if(G.mode==='play'){G.playTime+=dt;updatePlayer(gdt);for(const e of ENEMIES)updateEnemy(e,gdt);separate();updateProjectiles(gdt);checkArea();}
 else if(G.mode==='bonfire'){updatePlayer(dt);for(const e of ENEMIES)if(!e.dead)updateEnemy(e,dt);}
 else if(G.mode==='title'){P.model.root.position.set(1.4,0,2.4);P.model.root.rotation.y=-.72;P.state='sit';applyPose(P.model,POSE.sit,.2);}
 updateWorld(dt);updateCamera(dt);if(G.mode!=='title')updateHUD(dt);
 renderer.render(scene,camera);}
// title scene: light the first bonfire visually
BONFIRES[0].lit=true;
requestAnimationFrame(loop);
</script>
<script src="../../playtime.js" defer></script>
</body>
