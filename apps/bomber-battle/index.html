<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<title>ボンバーバトル</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10265c">
<meta name="description" content="ボムを置いてみんなをたおせ！最大4人で遊べるボム対戦アクション。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: sky-blue arcade menus (navy panels + yellow primary buttons) → one full-bleed canvas arena with HUD row on top and touch pad below */
:root{
  --sky1:#47b8ff; --sky2:#dff4ff; --navy:#10265c; --navy2:#1a3b86; --line:#5cb8ff;
  --gold:#ffd23a; --gold2:#ff9f1a; --paper:#ffffff; --mute:#b8cdf5; --red:#ff3b5c;
  --p1:#ff5fa8; --p2:#3d8bff; --p3:#ffc928; --p4:#3fc25a;
  --disp:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky1);color:var(--paper);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
canvas{display:block}

#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;
  padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));
  background:
    radial-gradient(120px 46px at 12% 18%,rgba(255,255,255,.75),transparent 70%),
    radial-gradient(160px 54px at 82% 10%,rgba(255,255,255,.6),transparent 70%),
    radial-gradient(140px 50px at 70% 88%,rgba(255,255,255,.45),transparent 70%),
    linear-gradient(180deg,var(--sky1),var(--sky2));}

/* ---------- panels ---------- */
.panel{width:100%;max-width:760px;background:var(--navy);border:3px solid var(--line);border-radius:20px;
  box-shadow:0 6px 0 rgba(16,38,92,.35);padding:18px 16px 16px;position:relative;margin-top:22px;display:flex;flex-direction:column;gap:14px}
.tab{position:absolute;top:-20px;left:14px;background:var(--navy);border:3px solid var(--line);border-radius:999px;
  font-family:var(--disp);font-size:17px;padding:4px 18px;letter-spacing:.04em}
.foot{display:flex;justify-content:space-between;gap:10px;background:#0b1a44;border-radius:12px;padding:8px}
.fbtn{display:flex;align-items:center;gap:8px;font-weight:800;padding:8px 14px;border-radius:10px;font-size:16px}
.fbtn:hover{background:rgba(255,255,255,.08)}
.kbd{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper);color:var(--navy);font-size:13px;font-weight:800}
.fbtn.go{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 var(--gold2)}
.fbtn.go .kbd{background:var(--navy);color:var(--gold)}

/* ---------- title ---------- */
#title{justify-content:center}
.tgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);grid-template-areas:"logo logo" "menu art";gap:8px 24px;
  width:100%;max-width:980px;align-items:center}
.logo{grid-area:logo;text-align:center;line-height:.95;transform:rotate(-3deg)}
.logo .w{display:inline-block;position:relative;font-family:var(--disp);font-size:clamp(46px,11vw,104px);letter-spacing:.02em;
  color:var(--navy);-webkit-text-stroke:clamp(9px,1.8vw,16px) var(--navy);text-shadow:0 8px 0 var(--navy)}
.logo .w::after{content:attr(data-t);position:absolute;inset:0;-webkit-text-stroke:0;text-shadow:none;color:transparent;-webkit-background-clip:text;background-clip:text}
.logo .w1::after{background-image:linear-gradient(180deg,#fff58a 10%,#ffc21a 55%,#ff7b00 95%)}
.logo .w2::after{background-image:linear-gradient(180deg,#bff1ff 10%,#3fb2ff 55%,#1859e8 95%)}
.logo .w2{margin-left:.6em}
.logo .ja{display:block;font-family:var(--disp);color:var(--navy);font-size:clamp(14px,2.4vw,20px);letter-spacing:.5em;margin-top:10px}
.menu{grid-area:menu;display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;background:var(--navy);border:3px solid var(--line);border-radius:14px;
  padding:11px 18px;font-weight:800;font-size:18px;box-shadow:0 5px 0 rgba(16,38,92,.45);transition:transform .08s}
.mbtn:hover{transform:translateX(4px)}
.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(16,38,92,.45)}
.mbtn.primary{background:var(--gold);border-color:#fff2a8;color:var(--navy);font-size:21px;box-shadow:0 5px 0 var(--gold2)}
.mbtn svg{width:24px;height:24px;flex:none}
.artwrap{grid-area:art;position:relative;min-width:0}
#titleArt{width:100%;aspect-ratio:16/11;max-width:100%}
.ribbon{position:absolute;right:2%;bottom:6%;background:var(--navy);color:var(--paper);font-family:var(--disp);
  padding:8px 18px;transform:rotate(-8deg);font-size:clamp(14px,2.4vw,22px);border:3px solid var(--paper);border-radius:6px;line-height:1.25}
.ver{position:absolute;left:14px;bottom:10px;color:var(--navy);font-size:12px;opacity:.6}
@media (max-width:700px){
  .tgrid{grid-template-columns:1fr;grid-template-areas:"logo" "art" "menu"}
  #titleArt{aspect-ratio:16/9}
  .menu{display:grid;grid-template-columns:1fr 1fr}
  .menu .primary{grid-column:1/-1}
  .mbtn{font-size:15px;padding:10px 12px;gap:8px}
}

/* ---------- character select ---------- */
.csel{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:14px;align-items:stretch}
.portrait{position:relative;background:linear-gradient(160deg,#ffffff22,#ffffff05);border-radius:16px;border:3px solid var(--line);min-height:220px}
.portrait canvas{width:100%;height:100%;position:absolute;inset:0}
.ptag{position:absolute;top:-4px;left:-4px;font-family:var(--disp);padding:2px 14px;border-radius:10px 0 12px 0;font-size:20px;color:var(--paper)}
.arrow{position:absolute;top:50%;translate:0 -50%;width:40px;height:56px;border-radius:12px;background:var(--navy2);border:2px solid var(--line);font-size:22px;font-weight:800}
.arrow.l{left:-14px}.arrow.r{right:-14px}
.cinfo{display:flex;flex-direction:column;gap:10px;min-width:0}
.cname{font-family:var(--disp);font-size:28px;background:#0b1a44;border-radius:12px;padding:8px 14px}
.cdesc{background:#0b1a44;border-radius:12px;padding:10px 14px;font-weight:800;font-size:17px;white-space:pre-line;line-height:1.5}
.stats{background:#0b1a44;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-weight:800}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bar i{height:12px;border-radius:3px;background:#24396f}
.bar i.on{background:var(--c)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumb{position:relative;border-radius:14px;border:3px solid #2c4c96;background:#0b1a44;aspect-ratio:1/1.08;overflow:hidden;max-width:100%}
.thumb canvas{width:100%;height:100%}
.thumb.sel{border-color:var(--gold);box-shadow:0 0 0 3px #ffd23a55}
.thumb b{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--disp);font-size:14px;text-shadow:0 2px 0 #000a}
@media (max-width:560px){.csel{grid-template-columns:1fr}.portrait{min-height:200px}.cname{font-size:22px}}

/* ---------- stage select ---------- */
.stars{position:absolute;top:10px;right:14px;background:#0b1a44;border-radius:999px;padding:3px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.stars em{color:var(--gold);font-style:normal}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.scard{border-radius:12px;border:3px solid #2c4c96;background:#0b1a44;padding:5px;display:flex;flex-direction:column;gap:5px;text-align:left}
.scard canvas{width:100%;aspect-ratio:624/552;border-radius:7px;max-width:100%}
.scard .sl{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:4px;padding:0 3px}
.scard .sl span:last-child{color:var(--gold);letter-spacing:-.1em}
.scard.sel{border-color:var(--gold);box-shadow:0 0 0 3px #ffd23a55}
.sdesc{background:#0b1a44;border-radius:12px;padding:10px 14px;font-weight:800;line-height:1.5}
@media (max-width:520px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- lobby ---------- */
.room{display:flex;gap:10px}
.room div{background:#0b1a44;border-radius:10px;padding:6px 12px;font-weight:800}
.room small{display:block;color:var(--mute);font-size:11px}
.room div:first-child{flex:1}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:44px auto minmax(0,1fr) auto;align-items:center;gap:10px;border-radius:12px;padding:6px 8px;background:var(--c);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.slot.off{background:#24396f;opacity:.75}
.slot canvas{width:44px;height:44px;background:#ffffff55;border-radius:10px}
.slot .pn{font-family:var(--disp);font-size:18px;color:var(--paper);text-shadow:0 2px 0 #0006}
.slot input{min-width:0;width:100%;border:0;border-radius:8px;padding:7px 10px;font:inherit;font-weight:800;background:#ffffffe0;color:var(--navy)}
.slot .ctl{display:flex;gap:6px}
.chip{background:var(--navy);border-radius:8px;padding:7px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.keys{background:#0b1a44;border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.7;color:var(--mute)}
.keys b{color:var(--paper)}
@media (max-width:520px){.slot{grid-template-columns:40px minmax(0,1fr) auto}.slot .pn{display:none}.chip{padding:6px 8px;font-size:13px}}

/* ---------- options / items ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0b1a44;border-radius:12px;padding:10px 14px;font-weight:800;flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:8px;background:#24396f;font-weight:800}
.seg button.on{background:var(--gold);color:var(--navy)}
.ilist{background:var(--paper);color:var(--navy);border-radius:14px;padding:6px 12px;display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #d6e4fb}
.irow:last-child{border-bottom:0}
.irow canvas{width:52px;height:52px}
.irow b{font-size:17px}
.irow p{margin:2px 0 0;font-size:14px;color:#3a4f80}

/* ---------- game ---------- */
#game{padding:0;background:#163a2a;gap:0;overflow:hidden}
.hud{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:max(6px,env(safe-area-inset-top,0px)) 8px 6px;background:#0b1a44;flex:none}
.pchips{display:flex;gap:6px;flex:1;min-width:0}
.pchips.r{justify-content:flex-end}
.pc{display:flex;align-items:center;gap:5px;background:var(--c);border-radius:10px;padding:3px 8px 3px 3px;min-width:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.pc canvas{width:30px;height:30px;border-radius:8px;background:#ffffff66;flex:none}
.pc .pt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.pc .pt b{font-family:var(--disp);font-size:13px;text-shadow:0 1px 0 #0006}
.pc .pt span{font-size:12px;letter-spacing:-.05em;color:#fff;text-shadow:0 1px 0 #0006;white-space:nowrap}
.pc.dead{filter:grayscale(1) brightness(.7)}
.timer{font-family:var(--disp);font-size:24px;background:var(--navy);border:3px solid var(--line);border-radius:12px;padding:2px 12px;font-variant-numeric:tabular-nums;flex:none}
.timer.hurry{color:var(--red);border-color:var(--red)}
.alive{font-weight:800;font-size:14px;background:var(--navy2);border-radius:999px;padding:3px 10px;flex:none;font-variant-numeric:tabular-nums}
.pause{width:36px;height:36px;border-radius:10px;background:var(--navy2);font-weight:800;flex:none}
.field{flex:1;width:100%;position:relative;min-height:0;display:flex;justify-content:center;align-items:center}
#cv{touch-action:none}
.touch{position:absolute;inset:0;pointer-events:none}
.pad{position:absolute;left:18px;bottom:18px;width:150px;height:150px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle,#ffffff30 0 30%,#ffffff18 31% 100%);border:3px solid #ffffff55}
.pad::before,.pad::after{content:"";position:absolute;background:#ffffff26;border-radius:10px}
.pad::before{left:50%;top:12%;bottom:12%;width:36%;translate:-50% 0}
.pad::after{top:50%;left:12%;right:12%;height:36%;translate:0 -50%}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#ffffffcc;box-shadow:0 4px 0 #0004;z-index:1}
.bbtn{position:absolute;right:20px;bottom:26px;width:96px;height:96px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:radial-gradient(circle at 40% 35%,#fff 0 18%,#2a2f45 19% 60%,#11131f 61%);border:5px solid var(--p1);box-shadow:0 5px 0 #0006}
.bbtn:active,.bbtn.dn{transform:translateY(3px)}
.tbtn{position:absolute;right:128px;bottom:20px;width:62px;height:62px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:#0b1a44;border:3px solid var(--line);font-weight:800;font-size:12px;display:grid;place-items:center;line-height:1.1;text-align:center}
.tbtn.dim{opacity:.4}
.tbtn i{font-style:normal;font-size:18px;display:block}
.ovl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,16,44,.55);z-index:5;padding:16px}
.obox{background:var(--navy);border:3px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:min(320px,100%);max-width:420px;text-align:center}
.obox h2{margin:0;font-family:var(--disp);font-size:30px;font-weight:400;text-wrap:balance}
.obox canvas{width:150px;height:150px;margin:0 auto}
.obox p{margin:0;font-weight:800;color:var(--mute)}
.big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:4;font-family:var(--disp);font-size:clamp(56px,14vw,120px);
  color:var(--gold);-webkit-text-stroke:3px var(--navy);text-shadow:0 6px 0 var(--navy)}
.big.pop{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(2.2);opacity:0}40%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
.toast{position:absolute;left:50%;top:10px;translate:-50% 0;background:#0b1a44e6;border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px;z-index:3;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.big.pop{animation:none}.mbtn{transition:none}}
@media (max-width:520px){.timer{font-size:18px;padding:2px 8px}.pc{padding-right:5px}.pc canvas{width:26px;height:26px}.alive{display:none}.pause{width:32px;height:32px}}
</style>
</head>
<body>
<div id="app">

<!-- TITLE -->
<section class="screen" id="title">
  <div class="tgrid">
    <h1 class="logo" aria-label="BOMBER BATTLE ボンバーバトル">
      <span class="w w1" data-t="BOMBER">BOMBER</span><br>
      <span class="w w2" data-t="BATTLE">BATTLE</span>
      <span class="ja">ボンバーバトル</span>
    </h1>
    <nav class="menu">
      <button class="mbtn primary" data-go="solo"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor"/></svg>はじめる</button>
      <button class="mbtn" data-go="lobby"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="8" r="3.5"/><circle cx="16.5" cy="9" r="3"/><path d="M1.5 20c0-4 3-6.5 6.5-6.5s6.5 2.5 6.5 6.5z"/><path d="M14 14.2c3.8-1 8.5 1 8.5 5.8h-6.5c0-2.4-.7-4.3-2-5.8z"/></svg>マルチプレイ</button>
      <button class="mbtn" data-go="stages"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="6" height="6" rx="1.5"/><rect x="9" y="2" width="6" height="6" rx="1.5"/><rect x="16" y="2" width="6" height="6" rx="1.5"/><rect x="2" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/><rect x="16" y="9" width="6" height="6" rx="1.5"/><rect x="2" y="16" width="6" height="6" rx="1.5"/><rect x="9" y="16" width="6" height="6" rx="1.5"/><rect x="16" y="16" width="6" height="6" rx="1.5"/></svg>ステージセレクト</button>
      <button class="mbtn" data-go="chars"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="13" r="9"/><circle cx="12" cy="2.8" r="2.3"/><ellipse cx="12" cy="14.5" rx="6" ry="5" fill="#10265c"/><ellipse cx="9.8" cy="14" rx="1" ry="2" fill="#fff"/><ellipse cx="14.2" cy="14" rx="1" ry="2" fill="#fff"/></svg>キャラクター</button>
      <button class="mbtn" data-go="items"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="10" cy="14" r="8"/><path d="M15 6l3-3 2 2-3 3z"/><circle cx="20.5" cy="2.8" r="1.8" fill="#ffd23a"/></svg>アイテム一覧</button>
      <button class="mbtn" data-go="options"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 1h4l.6 3 2.4 1 2.6-1.7 2.8 2.8-1.7 2.6 1 2.4 3 .6v4l-3 .6-1 2.4 1.7 2.6-2.8 2.8-2.6-1.7-2.4 1-.6 3h-4l-.6-3-2.4-1-2.6 1.7-2.8-2.8 1.7-2.6-1-2.4-3-.6v-4l3-.6 1-2.4L3.6 6.1l2.8-2.8L9 5l1-1zM12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>オプション</button>
    </nav>
    <div class="artwrap">
      <canvas id="titleArt" width="800" height="550"></canvas>
      <div class="ribbon">ボムを置いて<br>みんなをたおせ！</div>
    </div>
  </div>
</section>

<!-- CHARACTER SELECT -->
<section class="screen" id="chars" hidden>
  <div class="panel">
    <div class="tab">キャラクター選択</div>
    <div class="csel">
      <div class="portrait" id="portrait">
        <canvas id="portraitCv" width="480" height="480"></canvas>
        <div class="ptag" id="ptag">1P</div>
        <button class="arrow l" id="cPrev" aria-label="前のキャラ">‹</button>
        <button class="arrow r" id="cNext" aria-label="次のキャラ">›</button>
      </div>
      <div class="cinfo">
        <div class="cname" id="cName"></div>
        <div class="cdesc" id="cDesc"></div>
        <div class="stats" id="cStats"></div>
      </div>
    </div>
    <div class="thumbs" id="cThumbs"></div>
    <div class="foot">
      <button class="fbtn" data-back><span class="kbd">B</span>もどる</button>
      <button class="fbtn go" id="cOk"><span class="kbd">A</span>決定</button>
    </div>
  </div>
</section>

<!-- STAGE SELECT -->
<section class="screen" id="stages" hidden>
  <div class="panel">
    <div class="tab">ステージセレクト</div>
    <div class="stars">★ <em id="starNum">0</em> / 18</div>
    <div class="sgrid" id="sGrid"></div>
    <div class="sdesc" id="sDesc"></div>
    <div class="foot">
      <button class="fbtn" data-back><span class="kbd">B</span>もどる</button>
      <button class="fbtn go" id="sOk"><span class="kbd">A</span>決定</button>
    </div>
  </div>
</section>

<!-- LOBBY -->
<section class="screen" id="lobby" hidden>
  <div class="panel">
    <div class="tab">マルチプレイ（ローカル対戦）</div>
    <div class="room">
      <div><small>ルーム名</small>みんなでボンバーバトル！</div>
      <div><small>ステージ</small><span id="lStage"></span></div>
    </div>
    <div class="slots" id="slots"></div>
    <div class="keys" id="keyGuide"></div>
    <div class="foot">
      <button class="fbtn" data-back><span class="kbd">B</span>もどる</button>
      <button class="fbtn" id="lStageBtn">ステージ変更</button>
      <button class="fbtn go" id="lStart"><span class="kbd">A</span>スタート</button>
    </div>
  </div>
</section>

<!-- OPTIONS -->
<section class="screen" id="options" hidden>
  <div class="panel">
    <div class="tab">オプション</div>
    <div class="opts" id="opts"></div>
    <div class="foot">
      <button class="fbtn" data-back><span class="kbd">B</span>もどる</button>
    </div>
  </div>
</section>

<!-- ITEMS -->
<section class="screen" id="items" hidden>
  <div class="panel">
    <div class="tab">アイテム一覧</div>
    <div class="ilist" id="iList"></div>
    <div class="foot">
      <button class="fbtn" data-back><span class="kbd">B</span>もどる</button>
    </div>
  </div>
</section>

<!-- GAME -->
<section class="screen" id="game" hidden>
  <div class="hud">
    <div class="pchips" id="chipsL"></div>
    <div class="timer" id="timer">3:00</div>
    <div class="alive" id="aliveN">4/4</div>
    <div class="pchips r" id="chipsR"></div>
    <button class="pause" id="pauseBtn" aria-label="ポーズ">II</button>
  </div>
  <div class="field" id="field">
    <canvas id="cv"></canvas>
    <div class="touch" id="touch" hidden>
      <div class="pad" id="pad"><div class="knob" id="knob"></div></div>
      <button class="tbtn" id="trapBtn"><span><i>☠</i>×<span id="trapN">0</span></span></button>
      <button class="bbtn" id="bombBtn" aria-label="ボムを置く"></button>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="big" id="big" hidden></div>
  </div>
  <div class="ovl" id="pauseOvl" hidden>
    <div class="obox">
      <h2>ポーズ</h2>
      <button class="mbtn primary" id="pResume">つづける</button>
      <button class="mbtn" id="pRetry">さいしょから</button>
      <button class="mbtn" id="pQuit">タイトルへ</button>
    </div>
  </div>
  <div class="ovl" id="resultOvl" hidden>
    <div class="obox">
      <canvas id="resCv" width="300" height="300"></canvas>
      <h2 id="resTitle"></h2>
      <p id="resSub"></p>
      <button class="mbtn primary" id="rRetry">もう一回</button>
      <button class="mbtn" id="rSelect">ステージをえらぶ</button>
      <button class="mbtn" id="rQuit">タイトルへ</button>
    </div>
  </div>
</section>
</div>
