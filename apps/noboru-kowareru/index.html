<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>のぼると壊れる</title>
<meta name="description" content="縦穴をひたすら登るだけ。登るほど、体とゲーム画面が呪いで壊れていく3Dゲーム。">
<meta name="theme-color" content="#07060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--fg:#ece6dc;--dim:#9a9187;--curse:#a259ff;--water:#3fd0c9;--bg:#07060a;--red:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
/* HUD */
#hud{padding:calc(10px + env(safe-area-inset-top)) 16px 0;display:flex;flex-direction:column;gap:6px}
#hRow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
#height{font-family:"Dela Gothic One",sans-serif;font-size:44px;line-height:1;text-shadow:0 2px 10px #000}
#height small{font-size:20px;margin-left:2px}
#stage{font-size:12px;text-align:right;color:var(--dim);text-shadow:0 1px 4px #000;max-width:55%}
#stage b{display:block;color:var(--fg);font-size:14px}
.bar{height:10px;border-radius:6px;background:#0008;border:1px solid #fff2;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px}
#curseBar i{background:linear-gradient(90deg,#5b2a9e,var(--curse),#ff5ce1)}
#waterBar i{background:linear-gradient(90deg,#1d6d6a,var(--water))}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);text-shadow:0 1px 3px #000;margin-bottom:2px}
#msg{position:fixed;left:0;right:0;top:38%;text-align:center;font-family:"Dela Gothic One",sans-serif;font-size:26px;
  text-shadow:0 0 12px #000,0 2px 2px #000;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 16px}
#msg.show{opacity:1;transition:none}
#rest{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:14px;color:#b7f5e9;text-shadow:0 1px 4px #000;pointer-events:none}
/* 操作ボタン */
#pad{position:fixed;inset:0;pointer-events:none}
.hb{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:calc(50% - 24px);height:22vh;max-height:190px;min-height:110px;
  border-radius:22px;border:2px solid #ffffff30;background:#ffffff08;color:var(--fg);font-family:"Dela Gothic One",sans-serif;
  font-size:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;pointer-events:auto;
  transition:left .35s cubic-bezier(.5,-0.4,.5,1.4),transform .08s;backdrop-filter:blur(1px)}
.hb span{font-size:11px;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--dim)}
.hb.next{border-color:#ffd9a0aa;background:#ffb24714;box-shadow:0 0 24px #ffb24733 inset}
.hb.press{transform:scale(.94)}
#hbL{left:16px}#hbR{left:calc(50% + 8px)}
/* ひび */
#cracks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* 溶ける */
.melt{filter:url(#meltF)}
/* 画面 */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(ellipse at 50% 20%,#1a1420cc,#050407f2 70%);overflow-y:auto}
.screen>:first-child{margin-top:auto!important}.screen>:last-child{margin-bottom:auto!important}
.title{font-family:"Dela Gothic One",sans-serif;font-size:min(13vw,58px);line-height:1.15;margin:0 0 10px;letter-spacing:.02em;
  text-shadow:3px 0 #ff2a6d88,-3px 0 #2af5ff66}
.title .k{display:inline-block;animation:shk 2.6s infinite}
@keyframes shk{0%,86%,100%{transform:none;filter:none}88%{transform:translate(3px,-2px) skewX(12deg)}90%{transform:translate(-4px,1px);filter:blur(1px)}92%{transform:translate(1px,2px) scaleY(1.3)}}
.tag{color:var(--dim);font-size:14px;line-height:1.7;margin:0 0 22px}
.btn{display:block;width:min(300px,100%);margin:8px auto;padding:15px 10px;border-radius:14px;border:0;font:700 17px "Zen Kaku Gothic New",sans-serif;
  background:var(--fg);color:#120d14;cursor:pointer}
.btn.sub{background:#ffffff14;color:var(--fg);border:1px solid #ffffff2a}
.btn.x{background:#000;color:#fff;border:1px solid #fff4}
.best{margin-top:14px;font-size:13px;color:var(--dim)}
/* ガイド */
#guide .steps{width:min(340px,100%);text-align:left;display:flex;flex-direction:column;gap:12px;margin:0 auto 22px}
#guide .st{display:flex;gap:12px;align-items:flex-start;background:#ffffff0c;border:1px solid #ffffff1c;border-radius:14px;padding:12px}
#guide .ic{flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:"Dela Gothic One";font-size:16px;background:#ffffff14}
#guide .st p{margin:0;font-size:14px;line-height:1.55}
#guide .st b{color:#ffd9a0}
/* 結果 */
#result h2{font-family:"Dela Gothic One";font-size:15px;color:var(--dim);margin:0 0 4px;font-weight:400}
#rHeight{font-family:"Dela Gothic One";font-size:60px;line-height:1.05}
#rName{font-family:"Dela Gothic One";font-size:24px;margin:8px 0 6px;color:#e9c7ff}
#rDesc{font-size:14px;line-height:1.7;max-width:340px;margin:0 auto 6px}
#rSym{font-size:12px;color:var(--dim);max-width:340px;margin:0 auto 4px;line-height:1.6}
#rNew{color:#ffd9a0;font-size:13px;min-height:1.4em;margin-bottom:8px}
#cardPrev{width:min(220px,60vw);border-radius:10px;border:1px solid #fff3;margin:4px auto 10px;display:block}
/* 図鑑 */
#zukan .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(420px,100%);margin:0 auto 16px;text-align:left}
#zukan .z{background:#ffffff0c;border:1px solid #ffffff1c;border-radius:12px;padding:10px;min-height:96px}
#zukan .z b{display:block;font-family:"Dela Gothic One";font-weight:400;font-size:14px;margin-bottom:4px;color:#e9c7ff}
#zukan .z p{margin:0;font-size:11px;line-height:1.5;color:var(--dim)}
#zukan .z.lock b{color:#666}
#zukan .z .bd{font-size:10px;color:#ffd9a0;margin-top:4px}
#zCount{color:var(--dim);font-size:13px;margin:0 0 12px}
#fade{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<svg id="cracks" viewBox="0 0 100 100" preserveAspectRatio="none" hidden></svg>
<svg width="0" height="0" style="position:absolute">
  <filter id="meltF" x="-20%" y="-20%" width="140%" height="180%">
    <feTurbulence id="meltT" type="fractalNoise" baseFrequency="0.02 0.09" numOctaves="2" seed="3"/>
    <feDisplacementMap id="meltD" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div id="hud" class="layer" hidden>
  <div id="hRow"><div id="height">0.0<small>m</small></div><div id="stage"><b id="stName">第一帯</b><span id="stSym">異常なし</span></div></div>
  <div><div class="lbl"><span id="lbC">呪い</span><span id="lbCv"></span></div><div class="bar" id="curseBar"><i></i></div></div>
  <div><div class="lbl"><span id="lbW">黒い水まで</span><span id="lbWv"></span></div><div class="bar" id="waterBar"><i></i></div></div>
</div>
<div id="rest" hidden>くぼみで休んでいる……呪いが引いていく</div>
<div id="msg"></div>
<div id="pad" hidden>
  <button class="hb" id="hbL" data-hand="L"><b class="hbt">左手</b><span>タップ</span></button>
  <button class="hb" id="hbR" data-hand="R"><b class="hbt">右手</b><span>タップ</span></button>
</div>
<div id="fade"></div>

<div id="title" class="screen">
  <h1 class="title"><span>のぼると</span><br><span class="k">壊れる</span></h1>
  <p class="tag">底なしの縦穴を、上へ。<br>のぼるほど、体も画面も呪いで壊れていく。</p>
  <button class="btn" id="bStart">のぼる</button>
  <button class="btn sub" id="bZukan">成れの果て図鑑</button>
  <div class="best" id="bestT"></div>
</div>

<div id="guide" class="screen" hidden>
  <h2 class="title" style="font-size:30px">あそびかた</h2>
  <div class="steps">
    <div class="st"><div class="ic">左右</div><p><b>左手 → 右手 → 左手…</b><br>交互にタップすると登れる。同じ手を続けて押すと滑り落ちる。</p></div>
    <div class="st"><div class="ic" style="color:var(--water)">水</div><p>下から<b>黒い水</b>が上がってくる。追いつかれたら終わり。</p></div>
    <div class="st"><div class="ic" style="color:var(--curse)">呪</div><p>速く登るほど<b>呪い</b>がたまり、満タンで体が壊れて終わる。上へ行くほどたまりやすい。</p></div>
    <div class="st"><div class="ic">休</div><p>25mごとの<b>くぼみ</b>で手を止めると、呪いが早く引く。</p></div>
  </div>
  <button class="btn" id="bGo">わかった</button>
</div>

<div id="result" class="screen" hidden>
  <h2>到達</h2>
  <div id="rHeight">0m</div>
  <div id="rName"></div>
  <div id="rDesc"></div>
  <div id="rSym"></div>
  <div id="rNew"></div>
  <img id="cardPrev" alt="結果カード">
  <button class="btn" id="bRetry">もう一度のぼる</button>
  <button class="btn x" id="bX">X にポスト</button>
  <button class="btn sub" id="bSave">結果画像を保存・共有</button>
  <button class="btn sub" id="bZukan2">成れの果て図鑑</button>
  <button class="btn sub" id="bHome">タイトルへ</button>
</div>

<div id="zukan" class="screen" hidden>
  <h2 class="title" style="font-size:28px">成れの果て図鑑</h2>
  <p id="zCount"></p>
  <div class="grid" id="zGrid"></div>
  <button class="btn sub" id="bZBack">もどる</button>
</div>
