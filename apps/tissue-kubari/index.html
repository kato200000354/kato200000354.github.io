<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ティッシュくばり名人</title>
<meta name="description" content="駅前でティッシュを配るバイトゲーム！目の前を通る人をタイミングよくタップして手渡そう。いそぎのサラリーマン、花粉症さん、イヤホンさん…でも「おことわりさん」と犬には渡しちゃダメ。毎日のノルマを達成して名人をめざせ。">
<meta name="theme-color" content="#2b6cb0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#cfe8ff;color:#222;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top)) 60px 0 12px;pointer-events:none}
#hud .row{display:flex;gap:8px;align-items:center;font-weight:900}
.chip{background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
#hCount{background:#fff3b0}
#hCount b{font-size:19px;color:#d9480f}
#tbar{margin-top:6px;height:12px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
#tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#51cf66,#94d82d);border-radius:6px;transition:background .3s}
#tbar i.low{background:linear-gradient(90deg,#fa5252,#ff922b)}
#mute{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.85);font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));text-align:center;background:rgba(20,40,80,.72);color:#fff;overflow-y:auto}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.logo{font-size:clamp(30px,9vw,52px);font-weight:900;line-height:1.1;color:#fff;text-shadow:0 4px 0 #e8590c,0 8px 18px rgba(0,0,0,.35)}
.logo small{display:block;font-size:.42em;color:#ffe066;text-shadow:0 2px 0 #a14000;margin-bottom:6px}
.card{background:#fff;color:#333;border-radius:18px;padding:14px 16px;max-width:420px;width:100%;text-align:left;line-height:1.6;font-size:14px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.card h3{font-size:16px;color:#e8590c;margin-bottom:6px}
.card ul{padding-left:1.2em}
.big{min-width:220px;padding:14px 28px;border-radius:999px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#ff922b,#e8590c);box-shadow:0 6px 0 #a14000;transition:transform .06s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a14000}
.sub{padding:10px 22px;border-radius:999px;font-size:15px;font-weight:800;background:rgba(255,255,255,.18);color:#fff}
.newc{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed #ddd}
.newc:last-child{border-bottom:0}
.newc canvas{position:static;flex:none;width:64px;height:76px;background:#eef6ff;border-radius:12px}
.newc b{color:#1c7ed6;font-size:16px}
.newc .ng{color:#e03131}
.stat{font-size:18px;font-weight:800;line-height:1.8}
.stat b{color:#ffe066;font-size:24px}
.best{font-size:14px;color:#ffe066;font-weight:800}
.rank{font-size:26px;font-weight:900;color:#ffe066;text-shadow:0 3px 0 #a14000}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div class="row"><span class="chip" id="hDay">1日目</span><span class="chip" id="hCount"><b>0</b>/12こ</span><span class="chip" id="hScore">0点</span></div>
  <div id="tbar"><i id="tfill"></i></div>
</div>
<button id="mute" aria-label="音">🔊</button>

<div class="ov" id="title">
  <div class="logo"><small>駅前バイト</small>ティッシュ<br>くばり名人</div>
  <div class="card">
    <h3>あそびかた</h3>
    <ul>
      <li>目の前の<b>オレンジのゾーン</b>に入った人を<b>タップ</b>すると、ティッシュを手渡せる</li>
      <li>ゾーンのど真ん中で渡すと<b>「ナイス！」</b>でボーナス</li>
      <li>時間内に<b>ノルマの数</b>を配れば、その日はクリア</li>
      <li>渡しそびれるとコンボが切れる。<b>15コンボでフィーバー</b>！</li>
      <li>✋の人や犬に渡すと<b>時間が減る</b>ので注意</li>
    </ul>
  </div>
  <button class="big" id="bStart">バイトをはじめる</button>
  <div class="best" id="bestT"></div>
</div>

<div class="ov" id="intro" hidden>
  <div class="logo" style="font-size:34px" id="introDay">2日目</div>
  <div class="card" id="introCard"></div>
  <button class="big" id="bGo">配りはじめる</button>
</div>

<div class="ov" id="clear" hidden>
  <div class="logo" style="font-size:36px" id="clearT">1日目 クリア！</div>
  <div class="stat" id="clearS"></div>
  <button class="big" id="bNext">つぎの日へ</button>
</div>

<div class="ov" id="over" hidden>
  <div class="logo" style="font-size:34px">しゅうりょう〜</div>
  <div class="stat" id="overS"></div>
  <div class="rank" id="overR"></div>
  <div class="best" id="overB"></div>
  <button class="big" id="bRetry">もう一回</button>
  <button class="sub" id="bTitle">タイトルへ</button>
</div>
