<title>一攫千金ぐらし</title>
<meta name="description" content="所持金10万円から、競馬・宝くじ・スクラッチで暮らしていけるか？ 新聞と情報を読んで馬券を当て、毎日の生活費と家賃を払いながら億り人を目指す生活シミュレーション。">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--bg:#15110d;--panel:#231c15;--panel2:#30261b;--line:#4a3b2a;--gold:#ffcc4d;--gold2:#e8a317;--text:#fbf3e4;--sub:#c4b296;--red:#ff6161;--green:#5be08a;--blue:#6cb8ff}
html,body{background:var(--bg);color:var(--text);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;min-height:100%}
body{padding-bottom:calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}

#hud{position:sticky;top:0;z-index:20;background:rgba(21,17,13,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.hud-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px}
.day{font-weight:900;font-size:16px;line-height:1.2}
.day small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.money{margin-left:auto;text-align:right;font-weight:900;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.15;transition:transform .15s}
.money.neg{color:var(--red)}
.money.bump{transform:scale(1.12)}
.money small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.ib{width:38px;height:38px;border-radius:11px;background:var(--panel2);font-size:18px;flex:none}

main{max-width:560px;margin:0 auto;padding:14px 16px}
h2{font-size:19px;font-weight:900;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
h2 .back{font-size:14px;font-weight:800;background:var(--panel2);border-radius:10px;padding:6px 10px}
.note{font-size:12px;color:var(--sub);line-height:1.6}

.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
.tile .ic{font-size:32px;width:54px;height:54px;display:grid;place-items:center;border-radius:14px;background:var(--panel2);flex:none}
.tile b{font-size:17px;display:block}
.tile span{font-size:12px;color:var(--sub);display:block;margin-top:2px;line-height:1.5}
.tile:disabled{opacity:.45}
.tile.hot{border-color:var(--gold2);box-shadow:0 0 18px rgba(232,163,23,.18)}
.tile .tag,.tag{display:inline-block;margin-top:0;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--gold);color:#2a1a00;margin-left:6px;vertical-align:2px}
.tag.red{background:var(--red);color:#fff}
.news{background:#0e0b08;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.7}
.news b{color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .tile{flex-direction:column;text-align:center;gap:6px;margin:0}
.row2 .tile .ic{width:46px;height:46px;font-size:26px}

.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:900;font-size:17px;background:linear-gradient(#ffd66b,#e8a317);color:#2a1a00;box-shadow:0 3px 0 #8a5d05}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5d05}
.btn.sub{background:var(--panel2);color:var(--text);box-shadow:0 3px 0 #120e0a;border:1px solid var(--line)}
.btn.red{background:linear-gradient(#ff7b6b,#d93a2b);color:#fff;box-shadow:0 3px 0 #7a1a10}
.btn:disabled{opacity:.4}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.8}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.panel h3{font-size:15px;font-weight:900;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--sub);font-weight:700}
.r{text-align:right;font-variant-numeric:tabular-nums}
.plus{color:var(--green)}.minus{color:var(--red)}

/* lotto */
.jumbo{background:linear-gradient(135deg,#c2185b,#7b1fa2 60%,#311b92);border-radius:18px;padding:16px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.jumbo .t{font-size:13px;font-weight:800;opacity:.9}
.jumbo .big{font-size:34px;font-weight:900;color:#ffe680;text-shadow:0 2px 0 #7a3b00;letter-spacing:1px}
.jumbo .s{font-size:12px;margin-top:4px}
.tickets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tk{font-size:12px;background:#fff7e0;color:#6a1b4d;border-radius:6px;padding:3px 7px;font-weight:800;font-variant-numeric:tabular-nums}

/* scratch */
.cards{display:grid;gap:10px}
.cardbuy{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;color:#fff;text-align:left;width:100%}
.cardbuy .em{font-size:34px}
.cardbuy b{font-size:17px;display:block}
.cardbuy span{font-size:12px;opacity:.9}
.cardbuy .pr{margin-left:auto;font-weight:900;font-size:18px;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px;white-space:nowrap}
.scard{border-radius:18px;padding:14px;color:#fff;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.sc-title{font-size:20px;font-weight:900;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.sc-rule{font-size:12px;text-align:center;margin:2px 0 10px;opacity:.95}
.sc-area{position:relative;background:#fffdf5;border-radius:12px;padding:8px;max-width:330px;margin:0 auto}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sc-grid div{aspect-ratio:1;display:grid;place-items:center;font-size:44px;border-radius:10px;background:#f3ead2;transition:background .3s,transform .3s}
.sc-grid div.hit{background:#ffd54a;transform:scale(1.06)}
#scv{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;touch-action:none;cursor:pointer;transition:opacity .5s}
.sc-prizes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;font-size:11px;text-align:center}
.sc-prizes div{background:rgba(0,0,0,.25);border-radius:8px;padding:4px 2px}
.sc-prizes i{font-style:normal;font-size:18px;display:block}
.banner{text-align:center;font-weight:900;font-size:22px;padding:10px;border-radius:12px;margin:10px 0}
.banner.win{background:linear-gradient(#ffe27a,#ffb300);color:#3a2000;animation:pop .5s}
.banner.lose{background:var(--panel2);color:var(--sub)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* race */
.rhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rhead b{font-size:18px;font-weight:900}
.grade{display:inline-block;background:#1e88e5;color:#fff;font-size:12px;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:2px}
.grade.g1{background:#d32f2f}.grade.g2{background:#c2185b}
.rhead span{font-size:12px;color:var(--sub)}
.rtools{display:flex;gap:8px;margin:10px 0}
.rtools button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:800}
.rtools button.on{border-color:var(--gold);color:var(--gold)}
.hs td{padding:7px 3px;vertical-align:middle}
.hs tr.h{cursor:pointer}
.hs tr.sel{background:rgba(255,204,77,.16)}
.hs tr.sel td:first-child{box-shadow:inset 3px 0 var(--gold)}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:900;font-size:13px;border:1px solid rgba(255,255,255,.3)}
.hn{font-weight:800;font-size:14px;line-height:1.3;width:100%}
.hn small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.mk{font-size:16px;font-weight:900;color:var(--gold);text-align:center;width:22px}
.od{font-weight:900;font-variant-numeric:tabular-nums}
.od small{display:block;font-size:10px;color:var(--sub);font-weight:500}
.cd{font-size:11px;font-weight:800;white-space:nowrap}
.c1{color:#ff8a65}.c0{color:var(--sub)}.c-1{color:var(--blue)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-weight:900;font-size:14px}
.tabs button.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.selinfo{background:#0e0b08;border-radius:10px;padding:8px 10px;font-size:13px;min-height:38px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.selinfo b{color:var(--gold);font-size:16px}
.chips{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.chips button{flex:1;min-width:58px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 4px;font-weight:800;font-size:13px}
.amt{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:20px;margin:4px 0 8px}
.amt span{font-size:12px;color:var(--sub);font-weight:500}
.tlist{margin:10px 0;display:grid;gap:6px}
.tline{display:flex;align-items:center;gap:8px;background:#fffbea;color:#3a2a10;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:800}
.tline .x{margin-left:auto;background:#e6d9b8;border-radius:6px;width:26px;height:26px;color:#5a4320}
.tline.hit{background:#ffe27a}
.tline.miss{opacity:.55}
#track{display:block;width:100%;border-radius:12px;background:#2a8034}
.comm{background:#0e0b08;border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:800;font-size:15px;min-height:48px;line-height:1.5}
.res td{padding:5px 3px}

/* modal */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;display:grid;place-items:center;padding:16px}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:440px;max-height:86vh;overflow:auto;padding:18px;animation:pop .3s}
#modal h3{font-size:19px;font-weight:900;margin-bottom:10px;text-align:center}
#modal .mb{font-size:14px;line-height:1.7}
#modal .btns{grid-template-columns:1fr}
#modal .btns.two{grid-template-columns:1fr 1fr}
.drow{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.drow .dn{font-weight:900;font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:1px}
.drow.dim{opacity:.25}
.big-num{font-size:30px;font-weight:900;color:var(--gold);text-align:center;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;font-weight:800;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>

<main>

  <section id="race" class="screen" hidden></section>

  <section id="scratch" class="screen" hidden></section>
</main>

<div id="mask" hidden><div id="modal"></div></div>
