<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>わかる麻雀</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{min-height:100vh;background:#0b3d26;background-image:radial-gradient(circle at 50% 25%,#1d7d4f,#0b3d26 75%);color:#fff;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;}
#app{max-width:540px;margin:0 auto;padding:8px 12px 28px;--hw:min(38px,calc((min(100vw,540px) - 24px - 34px) / 14))}
button{font-family:inherit;cursor:pointer}

/* ---------- 牌 ---------- */
.tile{--w:22px;width:var(--w);height:calc(var(--w)*1.38);background:linear-gradient(#fffef9,#f1e8cf);border-radius:calc(var(--w)*.16);box-shadow:0 2px 0 #c2b07c,0 3px 4px rgba(0,0,0,.35);color:#222;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;position:relative;user-select:none;-webkit-user-select:none}
.tile b{font-size:calc(var(--w)*.64);font-weight:900}
.tile i{font-style:normal;font-size:calc(var(--w)*.37);margin-top:calc(var(--w)*.05);font-weight:800}
.tile.s0{color:#c62828}.tile.s1{color:#1565c0}.tile.s2{color:#2e7d32}
.tile.h b{font-size:calc(var(--w)*.72)}
.tile.h4 b{color:#a9b4bd}.tile.h5 b{color:#2e7d32}.tile.h6 b{color:#d32f2f}
.tile.red{background:linear-gradient(#fff3f3,#f7d4d4)}
.tile.red::after{content:"";position:absolute;top:calc(var(--w)*.08);right:calc(var(--w)*.08);width:calc(var(--w)*.18);height:calc(var(--w)*.18);border-radius:50%;background:#e53935}
.tile.back{background:linear-gradient(#3d8bd9,#1f5fa6);box-shadow:0 2px 0 #13406f}
.tile.mini{--w:21px;vertical-align:middle;margin:0 1px;top:-1px}
.tile.rii{outline:2px solid #ff5252;outline-offset:-1px}
.tile.lastd{box-shadow:0 0 0 2px #ffd54f,0 3px 4px rgba(0,0,0,.35)}

/* ---------- 画面 ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(0,0,0,.25);border-radius:12px;padding:6px 10px;font-size:13px;flex-wrap:wrap}
.bar .rnd{font-weight:900;font-size:16px}
.bar .dora{display:flex;align-items:center;gap:4px}
.bar .tools{display:flex;gap:6px}
.sbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.sbtn.on{background:#ffd54f;color:#4a3500;border-color:#ffd54f}
.opps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;margin-top:6px}
.seat{background:rgba(0,0,0,.2);border-radius:10px;padding:5px 6px;border:2px solid transparent;min-width:0}
.seat.top{grid-column:1/3}
.seat.turn{border-color:#ffd54f;box-shadow:0 0 10px rgba(255,213,79,.45)}
.shead{display:flex;align-items:center;gap:5px;font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.shead .nm{font-weight:800;font-size:13px}
.wind{display:inline-block;background:#fff;color:#123;border-radius:5px;padding:0 4px;font-weight:900;font-size:12px}
.wind.oya{background:#ff7043;color:#fff}
.pts{font-variant-numeric:tabular-nums;opacity:.9}
.badge{background:#e53935;color:#fff;border-radius:5px;padding:0 5px;font-weight:900;font-size:11px}
.badge.tp{background:#7e57c2}
.cnt{opacity:.7;font-size:11px;margin-left:auto;white-space:nowrap}
.river{display:flex;flex-wrap:wrap;gap:2px;min-height:22px}
.river .tile{--w:16px}
.melds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.meld{display:flex;gap:1px}
.melds .tile{--w:15px}
.mine{margin-top:6px;background:rgba(0,0,0,.18);border-radius:10px;padding:6px;border:2px solid transparent}
.mine.turn{border-color:#ffd54f}
.mine .river .tile{--w:20px}
.mine .melds{justify-content:flex-end;margin-top:4px}
.mine .melds .tile{--w:20px}
.hand{display:flex;justify-content:center;gap:2px;align-items:flex-end;padding-top:14px;min-height:calc(var(--hw)*1.38 + 16px)}
.hand .tile{--w:var(--hw);cursor:pointer;transition:transform .12s}
.hand .tile.sel{transform:translateY(-12px)}
.hand .tile.rec{box-shadow:0 0 0 3px #ffd54f,0 0 14px #ffd54f}
.hand .tile.dim{filter:brightness(.5)}
.hand .tile.drawn{margin-left:9px}
.selinfo{text-align:center;font-size:13px;min-height:20px;margin-top:4px;color:#ffe9a8}
.actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:46px;margin:6px 0}
.actions button{font-size:16px;padding:10px 16px;border-radius:12px;border:0;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.3);display:inline-flex;align-items:center;gap:4px}
.actions button:active{transform:translateY(2px);box-shadow:none}
.b-win{background:#ff7043;color:#fff;animation:pulse 1s infinite}
.b-rii{background:#e53935;color:#fff}
.b-rii.on{background:#ffd54f;color:#5a3c00}
.b-call{background:#42a5f5;color:#fff}
.b-pass{background:#eceff1;color:#333}
.b-ai{background:#7e57c2;color:#fff}
.actions .tile{--w:18px}
@keyframes pulse{50%{transform:scale(1.06)}}
.hint{overflow-wrap:anywhere;background:#fffbea;color:#333;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.65;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.hint .coach{display:flex;align-items:center;gap:6px;font-weight:900;color:#6a4c00;margin-bottom:4px}
.hint .coach span{font-size:22px}
.hint .rec{font-size:16px;font-weight:900;color:#b23c00}
.hint .warn{color:#c62828;font-weight:800}
.hint .tip{background:#fff1c4;border-radius:8px;padding:4px 8px;margin-top:4px}
.hint .big{font-size:18px;font-weight:900;color:#d84315}
.hint table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:6px}
.hint td,.hint th{border-top:1px solid #eadfb8;padding:3px 4px;text-align:left}
.hint th{color:#8a6d1a;font-weight:700}
.hint .ok{color:#2e7d32;font-weight:800}
.hint .ng{color:#c62828;font-weight:800}
.hint-off{text-align:center}
.msg{text-align:center;font-size:13px;opacity:.85;margin-top:8px;min-height:18px}

/* ---------- モーダル ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.card{background:#fffdf6;color:#222;border-radius:18px;padding:18px 16px;max-width:500px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.card h1{margin:0 0 4px;font-size:30px;text-align:center;color:#0f5132}
.card h2{margin:0 0 10px;font-size:20px;text-align:center}
.card h3{margin:14px 0 6px;font-size:16px;color:#0f5132;border-left:5px solid #2e7d32;padding-left:8px}
.card p,.card li{font-size:14px;line-height:1.7}
.card .sub{text-align:center;color:#555;font-size:14px;margin:0 0 12px}
.opt{margin:10px 0}
.opt .lb{font-weight:800;font-size:14px;margin-bottom:4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;border:2px solid #b7c9bd;background:#fff;font-weight:800;font-size:14px;color:#234}
.seg button.on{background:#2e7d32;border-color:#2e7d32;color:#fff}
.big-btn{display:block;width:100%;padding:14px;margin-top:10px;font-size:18px;font-weight:900;border:0;border-radius:14px;background:#ff7043;color:#fff;box-shadow:0 4px 0 #bf4b26}
.big-btn.sec{background:#eceff1;color:#333;box-shadow:0 4px 0 #b0bec5}
.rhand{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin:8px 0;align-items:flex-end}
.rhand .tile{--w:24px}
.rhand .tile.win{margin-left:8px;box-shadow:0 0 0 3px #ff7043}
.rhand .gap{width:8px}
.ylist{list-style:none;padding:0;margin:6px 0}
.ylist li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #ddd;padding:4px 2px}
.ylist small{display:block;color:#777;font-size:12px;line-height:1.4}
.ylist .h{font-weight:900;white-space:nowrap;color:#c62828}
.total{text-align:center;font-size:20px;font-weight:900;color:#d84315;margin:10px 0}
.sc{width:100%;border-collapse:collapse;font-size:14px}
.sc td{padding:5px 4px;border-bottom:1px solid #eee}
.sc .p{color:#2e7d32;font-weight:800}.sc .m{color:#c62828;font-weight:800}
.ex{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:4px 0}
.ex .tile{--w:22px}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#fff;text-shadow:0 0 12px #000,0 3px 0 #b71c1c;pointer-events:none;z-index:60;animation:pop .9s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.notice{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:61;max-width:90vw}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div><span class="rnd" id="rnd">東1局</span> <span id="honba"></span></div>
    <div class="dora" id="dora"></div>
    <div>残り <b id="left">--</b> 枚</div>
    <div class="tools">
      <button class="sbtn" id="hintBtn">💡ヒント</button>
      <button class="sbtn" id="ruleBtn">❓ルール</button>
    </div>
  </div>
  <div class="opps">
    <div class="seat top" id="seat2"></div>
    <div class="seat" id="seat3"></div>
    <div class="seat" id="seat1"></div>
  </div>
  <div class="mine" id="mine">
    <div class="shead" id="myhead"></div>
    <div class="river" id="myriver"></div>
    <div class="melds" id="mymelds"></div>
    <div class="hand" id="hand"></div>
    <div class="selinfo" id="selinfo"></div>
  </div>
  <div class="actions" id="actions"></div>
  <div class="hint" id="hint"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="ov" id="startOv">
  <div class="card">
    <h1>🀄 わかる麻雀</h1>
    <p class="sub">AIコーチがヒントを出してくれる、はじめての人向けの麻雀</p>
    <div class="opt"><div class="lb">ゲームの長さ</div>
      <div class="seg" data-opt="len"><button data-v="4">東風戦（4局）</button><button data-v="8">半荘戦（8局）</button></div></div>
    <div class="opt"><div class="lb">相手の強さ</div>
      <div class="seg" data-opt="diff"><button data-v="easy">やさしい</button><button data-v="normal">ふつう</button></div></div>
    <div class="opt"><div class="lb">AIコーチのヒント</div>
      <div class="seg" data-opt="hint"><button data-v="on">いつも出す</button><button data-v="off">ボタンで出す</button></div></div>
    <div class="opt"><div class="lb">相手のスピード</div>
      <div class="seg" data-opt="speed"><button data-v="700">ゆっくり</button><button data-v="400">ふつう</button><button data-v="180">はやい</button></div></div>
    <button class="big-btn" id="startBtn">はじめる</button>
    <button class="big-btn sec" id="ruleBtn2">はじめての人へ（ルール説明）</button>
  </div>
</div>

<div class="ov" id="modal" hidden>
  <div class="card"><div id="modalBody"></div><div id="modalBtns"></div></div>
</div>
