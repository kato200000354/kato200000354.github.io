[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1420;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,#6b5640 0%,#3b2c2a 38%,#1b1420 75%)}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.chip{background:rgba(20,12,18,.72);border:1px solid rgba(255,220,120,.35);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.3}
.chip b{font-size:20px;color:#ffd84a}
.hud button{pointer-events:auto}
.icon{background:rgba(20,12,18,.72);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;width:40px;height:40px;font-size:18px}
#bubble{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);max-width:86vw;background:#fff;color:#2a1c12;font-weight:700;border-radius:16px;padding:9px 14px;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.25);z-index:6;pointer-events:none;transition:opacity .25s;width:max-content;text-align:center}

#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);text-align:center;font-size:14px;color:#ffe9b0;text-shadow:0 2px 4px #000;pointer-events:none;z-index:5}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ov.dim{background:rgba(10,6,10,.55)}
.ov.bottom{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.card{width:100%;max-width:400px;background:rgba(32,22,28,.94);border:2px solid rgba(255,216,74,.45);border-radius:20px;padding:18px 16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}

h2{margin:0 0 8px;font-size:20px;color:#ffd84a}
p{margin:6px 0;font-size:14px;line-height:1.6;color:#f2e6d6}
.big{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:800;color:#3a2200;background:linear-gradient(#ffe36a,#f4b52c);box-shadow:0 4px 0 #a86a10;margin-top:10px;font-family:inherit}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a10}
.big.gray{background:linear-gradient(#e9e2da,#bdb2a6);box-shadow:0 4px 0 #7d7266;color:#2a2018}
.row2{display:flex;gap:8px}.row2 .big{flex:1;font-size:16px}
.tfollow{display:block;margin:10px 0 0;padding:10px;border-radius:14px;background:#1d9bf0;color:#fff;text-decoration:none;text-align:center;box-shadow:0 4px 0 #0d6aa8}
.tfollow b{display:block;font-size:15px}.tfollow small{font-size:11px;opacity:.9}
.link{display:block;margin-top:12px;color:#ffe9b0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.grid button{border:0;border-radius:10px;padding:10px 0;font-size:17px;font-weight:800;background:#4a3a32;color:#fff;font-family:inherit;box-shadow:0 3px 0 #2a1e18}
.grid button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1e18}
.who{font-size:24px;font-weight:900;color:#fff;margin:2px 0;white-space:nowrap}

.stars{color:#ffd84a;font-size:18px;letter-spacing:2px}
.quote{background:#fff;color:#2a1c12;border-radius:12px;padding:8px 10px;font-weight:700;margin:10px 0;font-size:15px}
.verdict{font-size:22px;font-weight:900;margin:8px 0 2px}
.verdict.hit{color:#ffd84a}.verdict.near{color:#8fe08f}.verdict.miss{color:#c8b8a8}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dex div{background:#3a2c26;border-radius:12px;padding:10px 4px;font-size:12px;color:#d8c8b8}
.dex div span{display:block;font-size:30px;margin-bottom:4px}
.dex div.no{opacity:.45}.dex div.no span{filter:grayscale(1) brightness(.3)}
.more{margin-top:14px;text-align:left}
.more h3{font-size:14px;margin:0 0 8px;color:#ffe9b0}
.moreList{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.moreList a{flex:0 0 96px;color:#fff;text-decoration:none;font-size:11px;line-height:1.3}
.moreList img{width:96px;height:128px;object-fit:cover;border-radius:10px;display:block;margin-bottom:4px;background:#333}
.moreAll{display:block;text-align:center;color:#ffe9b0;font-size:13px;margin-top:6px}
