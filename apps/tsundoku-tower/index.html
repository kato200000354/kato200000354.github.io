<style>
[hidden]{display:none!important}
:root{
  --ink:#3a2a22; --cream:#fff6e6; --paper:#fdf0d8; --red:#d9483b; --red-d:#a8322a;
  --gold:#f2b632; --gold-d:#c48a12; --green:#3e9b63; --green-d:#2b7449; --blue:#2e6da4; --blue-d:#1f4f7a;
  --font:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Meiryo',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#2a1e18;color:var(--ink);font-family:var(--font);font-weight:800;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:stretch;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 0;max-width:560px;margin:0 auto;pointer-events:none}
.chip{flex:1;background:rgba(255,246,230,.92);border-radius:14px;padding:4px 8px;text-align:center;line-height:1.1;
  box-shadow:0 3px 0 rgba(0,0,0,.25)}
.chip small{display:block;font-size:10px;color:#8a6a58;letter-spacing:.05em}
.chip b{font-size:22px;font-weight:900}
.chip b span{font-size:12px;margin-left:1px}
#hBooks{color:var(--red)}
.iconbtn{pointer-events:auto;width:42px;flex:none;border-radius:14px;background:rgba(255,246,230,.92);
  box-shadow:0 3px 0 rgba(0,0,0,.25);font-size:18px}
#bookLabel{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 66px);
  width:min(92vw,500px);text-align:center;pointer-events:none}
#bookLabel .type{display:inline-block;font-size:11px;background:var(--ink);color:#fff;border-radius:99px;padding:2px 10px;margin-bottom:3px}
#bookLabel .title{display:block;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 8px rgba(0,0,0,.5);
  line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
#bookLabel.gold .type{background:var(--gold-d)}
#bookLabel.curse .type{background:#6a2d8f}
#nextLabel{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:rgba(255,246,230,.88);
  border-radius:12px;padding:4px 10px;font-size:12px;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#comboLabel{position:absolute;left:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:var(--gold);
  border-radius:12px;padding:4px 10px;font-size:13px;pointer-events:none;box-shadow:0 3px 0 var(--gold-d)}
#tapHint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 56px);transform:translateX(-50%);
  color:#fff;font-size:15px;background:rgba(0,0,0,.45);padding:8px 16px;border-radius:99px;pointer-events:none;
  animation:blink 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.35}}
#popups{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;transform:translate(-50%,0);font-size:28px;font-weight:900;color:#fff;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 10px rgba(0,0,0,.35);animation:popup 1.1s ease-out forwards}
.pop.perfect{color:#ffe066}
.pop.giri{color:#7fe0ff}
.pop.mile{font-size:24px;color:#fff;background:linear-gradient(#e85d4a,#b83a2c);padding:6px 16px;border-radius:14px;
  text-shadow:none;box-shadow:0 4px 0 #7a2219;animation:popup2 2.2s ease-out forwards}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}
  30%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
@keyframes popup2{0%{opacity:0;transform:translate(-50%,0) scale(.5)}10%{opacity:1;transform:translate(-50%,0) scale(1.1)}
  20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none}
#banner div{display:inline-block;background:#1d1410;color:#ffde59;font-size:26px;font-weight:900;padding:10px 26px;
  border:3px solid #ffde59;border-radius:16px;animation:bannerIn .35s ease-out;max-width:92vw}
#banner small{display:block;color:#fff;font-size:13px;margin-top:2px}
@keyframes bannerIn{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1);opacity:1}}

/* overlays */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(30,20,15,.45);overflow-y:auto}
.card{background:var(--cream);border-radius:22px;padding:20px 18px;width:min(100%,400px);text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.3);margin:auto}
.logo{font-size:40px;font-weight:900;line-height:1.05;color:var(--ink);letter-spacing:.02em}
.logo em{font-style:normal;color:var(--red)}
.sub{font-size:14px;color:#7a5a48;margin:8px 0 14px}
.howto{text-align:left;background:var(--paper);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.8;margin-bottom:14px;font-weight:500}
.howto b{font-weight:900}
.btn{display:block;width:100%;padding:14px;border-radius:16px;font-size:20px;font-weight:900;color:#fff;
  background:var(--red);box-shadow:0 5px 0 var(--red-d);margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d)}
.btn.x{background:#111;box-shadow:0 5px 0 #000;font-size:17px}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d);font-size:17px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.best{font-size:13px;color:#7a5a48;margin-top:10px}
#result .card{padding-top:16px}
.r-head{font-size:30px;font-weight:900;color:var(--red);line-height:1.1}
.r-stats{display:flex;justify-content:center;gap:18px;margin:10px 0 6px}
.r-stats div small{display:block;font-size:11px;color:#8a6a58}
.r-stats div b{font-size:34px;font-weight:900;line-height:1}
.r-stats div b span{font-size:14px}
.r-new{display:inline-block;background:var(--gold);color:#5a3a00;font-size:12px;border-radius:99px;padding:2px 10px;margin-bottom:4px}
.r-rank{background:var(--ink);color:#fff;border-radius:14px;padding:8px 10px;margin:8px 0}
.r-rank small{display:block;font-size:11px;color:#d8c2b0}
.r-rank b{font-size:22px;color:#ffde59}
.r-rank p{margin:2px 0 0;font-size:12px;font-weight:500;color:#eee}
.r-mile{font-size:13px;color:#7a5a48;margin:4px 0}
.r-list{text-align:left;background:var(--paper);border-radius:14px;padding:8px 12px;font-size:12px;line-height:1.7;font-weight:500;margin:8px 0 2px}
.r-list b{font-weight:900;color:var(--red-d)}
.r-list ol{margin:2px 0 0;padding-left:20px}
.r-list li{overflow-wrap:anywhere}
</style>

<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" hidden>
    <div class="chip"><small>積んだ冊数</small><b id="hBooks">0</b></div>
    <div class="chip"><small>高さ</small><b id="hCm">0<span>cm</span></b></div>
    <div class="chip"><small>ベスト</small><b id="hBest">0<span>冊</span></b></div>
    <button class="iconbtn" id="muteBtn" aria-label="音">🔊</button>
  </div>
  <div id="bookLabel" hidden><span class="type"></span><span class="title"></span></div>
  <div id="nextLabel" hidden></div>
  <div id="comboLabel" hidden></div>
  <div id="tapHint" hidden>タップで本を落とす</div>
  <div id="popups"></div>
  <div id="banner" hidden></div>

  <section id="title" class="overlay">
    <div class="card">
      <div class="logo">積ん読<em>タワー</em></div>
      <div class="sub">買ったけど読んでない本を、どこまで積める？</div>
      <div class="howto">
        📚 <b>タップ</b>で本を落として積み上げる<br>
        ✨ <b>ピッタリ</b>重ねるとコンボ＆ズレない<br>
        🐈 ネコ・地震・扇風機がジャマしにくる<br>
        💥 本が崩れたらおしまい
      </div>
      <button class="btn" id="startBtn">積みはじめる</button>
      <div class="best" id="titleBest"></div>
    </div>
  </section>

  <section id="result" class="overlay" hidden>
    <div class="card">
      <div class="r-head" id="rHead">積ん読、崩壊。</div>
      <div id="rNew" class="r-new" hidden>自己ベスト更新！</div>
      <div class="r-stats">
        <div><small>積んだ本</small><b id="rBooks">0<span>冊</span></b></div>
        <div><small>高さ</small><b id="rCm">0<span>cm</span></b></div>
      </div>
      <div class="r-mile" id="rMile"></div>
      <div class="r-rank"><small>あなたの積ん読称号</small><b id="rRank"></b><p id="rRankDesc"></p></div>
      <div class="r-list" id="rList"></div>
      <button class="btn" id="retryBtn">もう一回積む</button>
      <div class="row">
        <button class="btn x" id="shareX">𝕏 でシェア</button>
        <button class="btn green" id="shareImg">画像で保存</button>
      </div>
      <button class="btn" id="toTitleBtn" style="background:#8a6a58;box-shadow:0 5px 0 #5e463a;font-size:15px;padding:10px">タイトルへ</button>
    </div>
  </section>
</div>
