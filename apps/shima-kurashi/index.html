<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>のんびり島ぐらし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed island canvas; rounded cream HUD cards float at the four edges like a handheld life-sim */
:root{
  --leaf:#4cb866; --leaf-d:#2f9450; --cream:#fffaf0; --card:rgba(255,250,238,.95); --ink:#5b4a36; --ink-soft:#9a8670;
  --orange:#f5a03c; --sea:#3aa5dc; --line:#efe3c9; --red:#e8604a;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --fs:clamp(10px, calc(.9vmin + 7px), 16px);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#3aa5dc;overflow:hidden;font-family:var(--f-ui);color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);pointer-events:none;font-size:var(--fs);font-weight:700}
.p{pointer-events:auto}
.card{background:var(--card);border-radius:1.2em;box-shadow:0 .25em 0 rgba(150,110,60,.15),0 .4em 1.2em rgba(40,30,10,.15)}
#topL{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:.6em;width:min(22em,52vw)}
#islandCard{display:flex;align-items:center;gap:.7em;padding:.6em 1em .6em .6em;align-self:flex-start;min-width:15em}
.ava{flex:none;width:3em;height:3em;border-radius:50%;background:#c4ecf2;display:grid;place-items:center;overflow:hidden}
.ava svg{width:100%;height:100%;display:block}
.ic-col{flex:1;min-width:0}
#islandName{font-weight:800;font-size:1.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow{display:flex;align-items:center;gap:.5em;color:var(--ink-soft)}
.bar{flex:1;height:.65em;background:#e9e1cd;border-radius:99px;overflow:hidden;min-width:5em}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .4s}
#clock{display:flex;align-items:center;gap:.5em;color:#fff;text-shadow:0 .1em .3em rgba(30,50,80,.55)}
#clock .ci{width:2.6em;height:2.6em;flex:none;filter:drop-shadow(0 .1em .2em rgba(30,50,80,.3))}
#clock .ci svg{width:100%;height:100%}
.time{font-weight:800;font-size:2.3em;line-height:1;font-variant-numeric:tabular-nums}
.time small{font-size:.48em;margin-right:.25em}
#date{font-weight:800;font-size:1.05em;margin-top:.15em}
#todo{position:relative;padding:1.5em .9em .5em;margin-top:.9em}
#todoHead{position:absolute;left:-.3em;top:-1em;border:0;display:inline-flex;align-items:center;gap:.4em;background:var(--orange);color:#fff;font-weight:800;font-size:1em;padding:.45em 1.1em .45em .7em;border-radius:99px;box-shadow:0 .2em 0 #d7832a}
#todoHead svg{width:1.3em;height:1.3em}
#todoList{list-style:none;margin:0;padding:0}
#todoList li{display:flex;align-items:center;gap:.55em;padding:.5em .1em;border-bottom:1px dashed var(--line);font-size:.95em;transition:background .3s}
#todoList li:last-child{border-bottom:0}
.ck{flex:none;width:1.25em;height:1.25em;border-radius:.35em;border:2px solid #cfc3a8;display:grid;place-items:center;color:#fff;font-size:.8em}
li.done .ck{background:var(--leaf);border-color:var(--leaf)}
li.done .tx{text-decoration:line-through;color:var(--ink-soft)}
.ti{flex:none;font-size:1.2em;width:1.3em;text-align:center}
.tx{flex:1;min-width:0}
.tc{flex:none;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#todo.collapsed{background:none;box-shadow:none;padding:.4em 0 0}
#todo.collapsed #todoList{display:none}
#topR{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:.8em}
#counters{display:flex;gap:.6em;flex-wrap:wrap;justify-content:flex-end}
.ctr{display:flex;align-items:center;gap:.6em;padding:.35em 1em .35em .4em;border-radius:99px;font-weight:800;font-size:1.15em;font-variant-numeric:tabular-nums;min-width:6.5em;justify-content:space-between}
.ctr svg{width:1.8em;height:1.8em;display:block}
#side{display:flex;flex-direction:column;gap:.6em}
.sbtn{border:0;width:5.3em;height:4.9em;white-space:nowrap;border-radius:1.1em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;font-size:.82em;font-weight:800}
.sbtn svg{width:2.3em;height:2.3em}
.sbtn:active,.tool:active{transform:translateY(2px)}
#mini{position:absolute;left:12px;bottom:calc(12px + 4.4em);width:10em;height:10em;border-radius:50%;border:.35em solid #fff;box-shadow:0 .4em 1.2em rgba(40,30,10,.2);overflow:hidden;background:#3aa5dc}
#mm{width:100%;height:100%;display:block}
#msg{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:.6em;padding:.35em 1.3em .35em .35em;border-radius:99px;max-width:min(26em,40vw)}
#msg .ava{width:2.8em;height:2.8em;background:#ffe9c9}
#msgText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;padding:.45em;gap:.2em;border-radius:1.4em}
.tool{border:0;background:none;width:5.4em;padding:.35em 0 .3em;border-radius:1em;display:flex;flex-direction:column;align-items:center;gap:.15em;font-size:.85em;font-weight:800;position:relative}
.tool .ic{width:3.1em;height:3.1em;border-radius:50%;display:grid;place-items:center;background:#eaf5f7;transition:transform .15s}
.tool svg{width:2.1em;height:2.1em}
.tool.on{background:#fff0c9;box-shadow:inset 0 0 0 .18em var(--orange)}
.tool.on .ic{transform:translateY(-.2em) scale(1.06)}
.tool>span:last-child{white-space:nowrap;font-size:.95em}
.tool kbd{position:absolute;top:.2em;right:.55em;font:inherit;font-size:.75em;color:var(--ink-soft)}
#btns{position:absolute;right:14px;bottom:14px;display:flex;align-items:flex-end;gap:.8em}
#runBtn{border:0;white-space:nowrap;width:4.4em;height:4.4em;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:inset 0 0 0 .35em #cfcfcf,0 .3em .8em rgba(0,0,0,.15);font-weight:800;font-size:.9em;color:#888}
#runBtn.on{box-shadow:inset 0 0 0 .35em var(--orange),0 .3em .8em rgba(0,0,0,.15);color:var(--orange)}
#actBtn{border:0;width:8em;height:8em;border-radius:50%;background:var(--leaf);color:#fff;box-shadow:inset 0 0 0 .45em #fff,0 0 0 .3em var(--leaf),0 .6em 1.2em rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;font-weight:800;font-size:1.1em;margin:.3em}
#actBtn svg{width:2.6em;height:2.6em}
#actBtn:active{transform:scale(.95)}
#actBtn.idle{background:#9fcfa9;box-shadow:inset 0 0 0 .45em #fff,0 0 0 .3em #9fcfa9,0 .6em 1.2em rgba(0,0,0,.15)}
#banner{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:var(--leaf);color:#fff;font-weight:800;font-size:1.4em;padding:.55em 1.5em;border-radius:99px;box-shadow:0 .25em 0 var(--leaf-d),0 .6em 1.4em rgba(0,0,0,.2);transition:opacity .3s,transform .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.gold{background:var(--orange);box-shadow:0 .25em 0 #d7832a,0 .6em 1.4em rgba(0,0,0,.2)}
#stick{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.65);pointer-events:none;z-index:5}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(0,0,0,.2)}
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8em);width:min(40em,calc(100vw - 24px));background:#fffdf6;border-radius:1.6em;padding:1.6em 1.6em 1.3em;font-size:calc(var(--fs) * 1.15);font-weight:700;line-height:1.75;box-shadow:0 .3em 0 rgba(150,110,60,.18),0 .8em 2em rgba(40,30,10,.25);cursor:pointer;z-index:20;min-height:6.5em}
#dlgName{position:absolute;left:1.2em;top:-.95em;background:var(--orange);color:#fff;padding:.1em 1.1em;border-radius:99px;font-weight:800;transform:rotate(-3deg)}
#dlgChoices{display:flex;gap:.6em;justify-content:flex-end;margin-top:.6em;flex-wrap:wrap}
#dlgChoices button{border:0;background:var(--leaf);color:#fff;font-weight:800;padding:.4em 1.3em;border-radius:99px;font-size:.95em}
#dlgChoices button.alt{background:#efe5cf;color:var(--ink)}
#dlgMore{position:absolute;right:1.2em;bottom:.4em;color:var(--orange);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#modal{position:fixed;inset:0;background:rgba(40,60,70,.35);display:grid;place-items:center;z-index:30;padding:16px;font-size:var(--fs)}
.sheet{background:var(--cream);border-radius:1.6em;width:min(36em,100%);max-height:min(86vh,48em);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1em 3em rgba(0,0,0,.25)}
.sheet header{display:flex;align-items:center;gap:.6em;padding:1em 1.2em .6em}
.sheet h2{margin:0;font-size:1.35em;font-weight:800;flex:1}
#mClose{border:0;background:#efe5cf;width:2.2em;height:2.2em;border-radius:50%;font-size:1.1em;font-weight:800;flex:none}
#mBody{overflow:auto;padding:0 1.2em 1.2em;font-weight:700;touch-action:pan-y}
.tabs{display:flex;gap:.4em;margin-bottom:.8em;flex-wrap:wrap}
.tabs button{border:0;background:#efe5cf;padding:.45em 1em;border-radius:99px;font-weight:800}
.tabs button.on{background:var(--orange);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.5em}
.slot{border:0;aspect-ratio:1;background:#fff;border-radius:1em;box-shadow:inset 0 0 0 2px var(--line);font-size:1.8em;display:grid;place-items:center;position:relative;max-width:100%;padding:0}
.slot b{position:absolute;right:.3em;bottom:.15em;font-size:.42em;color:var(--ink)}
.slot.sel{box-shadow:inset 0 0 0 3px var(--orange);background:#fff7e3}
.slot.empty{background:#f4ecda;box-shadow:none;cursor:default}
.slot.unk{background:#f4ecda;box-shadow:none;color:#cbbd9f;font-size:1.2em;cursor:default}
.detail{margin-top:.8em;background:#fff;border-radius:1em;padding:.8em 1em;display:flex;align-items:center;gap:.6em;flex-wrap:wrap;min-height:3.6em}
.detail .big{font-size:2em}
.detail .dn{flex:1;min-width:8em}
.detail small{display:block;color:var(--ink-soft)}
.btn{border:0;background:var(--leaf);color:#fff;font-weight:800;padding:.5em 1.1em;border-radius:99px;font-size:.95em}
.btn.alt{background:#efe5cf;color:var(--ink)}
.btn.or{background:var(--orange)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;align-items:center;gap:.6em;padding:.55em .2em;border-bottom:1px dashed var(--line)}
.row .ic{font-size:1.6em;width:1.5em;text-align:center;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--ink-soft);font-size:.8em}
.row .pr{color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.keeper{display:flex;gap:.7em;align-items:center;background:#fff;border-radius:1em;padding:.7em .9em;margin-bottom:.8em}
.keeper span{font-size:2em}
.sw{display:flex;gap:.5em;flex-wrap:wrap;margin:.4em 0 1em}
.sw button{width:2.4em;height:2.4em;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--orange)}
.lbl{color:var(--ink-soft);font-size:.9em;margin-top:.4em}
.help{line-height:1.9;margin:0;padding-left:1.2em}
.photo{width:100%;border-radius:1em;display:block}
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1em;background:linear-gradient(rgba(150,215,245,.55),rgba(255,255,255,.15) 50%,rgba(80,170,90,.35));font-size:var(--fs);padding:16px;text-align:center;overflow:auto}
#title h1{margin:0;font-size:clamp(36px,8vw,76px);font-weight:800;color:#fff;letter-spacing:.04em;line-height:1.1;text-shadow:0 .05em 0 var(--leaf-d),0 .1em 0 var(--leaf-d),0 .18em .25em rgba(0,40,20,.25);text-wrap:balance}
#title .sub{color:#fff;font-weight:800;font-size:1.15em;text-shadow:0 .1em .3em rgba(0,40,60,.5)}
.form{background:var(--card);border-radius:1.4em;padding:1.2em 1.4em;display:grid;gap:.7em;width:min(22em,100%);box-shadow:0 .6em 1.6em rgba(0,0,0,.15)}
.form label{display:grid;gap:.25em;text-align:left;font-weight:800;font-size:.9em;color:var(--ink-soft)}
.form input{font:inherit;font-weight:800;font-size:1.15em;padding:.5em .8em;border-radius:.8em;border:2px solid var(--line);background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;width:100%}
#startBtn{border:0;background:var(--leaf);color:#fff;font-weight:800;font-size:1.3em;padding:.6em 1em;border-radius:99px;box-shadow:0 .2em 0 var(--leaf-d)}
.keys{color:var(--ink-soft);font-size:.82em;line-height:1.6}
#camui{position:fixed;inset:0;z-index:25;pointer-events:none}
#camui .frame{position:absolute;inset:16px;border:3px solid rgba(255,255,255,.85);border-radius:1.2em}
#shutter{pointer-events:auto;position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:78px;height:78px;border-radius:50%;border:6px solid #fff;background:rgba(255,255,255,.45);box-shadow:0 4px 14px rgba(0,0,0,.25)}
#camClose{pointer-events:auto;position:absolute;right:28px;top:calc(28px + env(safe-area-inset-top,0px));border:0;background:#fff;border-radius:99px;padding:.5em 1.2em;font-weight:800;font-size:var(--fs)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:26;transition:opacity .5s}
@media (max-width:1100px){#msg{left:50%;transform:translateX(-50%);bottom:calc(12px + 6.4em);max-width:min(30em,60vw)}}
@media (max-width:700px){
  #topL{width:56vw}
  #islandCard{min-width:0;align-self:stretch;padding:.45em .7em .45em .45em}
  .time{font-size:1.9em}
  #clock .ci{width:2.1em;height:2.1em}
  #counters{flex-direction:column;align-items:flex-end;gap:.4em}
  .ctr{font-size:1em;min-width:6em;padding:.2em .8em .2em .3em}
  .ctr svg{width:1.6em;height:1.6em}
  .sbtn{width:4em;height:4em;font-size:.75em}
  #toolbar{left:8px;right:8px;transform:none;justify-content:space-between;bottom:8px;padding:.35em}
  .tool{width:auto;flex:1;font-size:.72em;padding:.3em 0}
  .tool .ic{width:2.9em;height:2.9em}
  .tool kbd{display:none}
  #msg{left:8px;right:8px;transform:none;max-width:none;bottom:calc(8px + 5.4em)}
  #mini{width:6.8em;height:6.8em;bottom:calc(8px + 9.2em);left:8px}
  #btns{right:8px;bottom:calc(8px + 8.6em)}
  #actBtn{width:6.6em;height:6.6em}
  #runBtn{width:3.9em;height:3.9em}
  #dialog{bottom:calc(env(safe-area-inset-bottom,0px) + 5.6em)}
}
@media (prefers-reduced-motion:reduce){#dlgMore{animation:none}#banner{transition:opacity .2s}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="topL">
    <div class="card" id="islandCard">
      <div class="ava" id="islandAva"></div>
      <div class="ic-col">
        <div id="islandName">のんびり島</div>
        <div class="lvrow">Lv.<b id="lv">1</b><div class="bar"><i id="expbar"></i></div></div>
      </div>
    </div>
    <div id="clock">
      <div class="ci" id="sunIco"></div>
      <div><div class="time"><small id="ampm">AM</small><span id="hm">10:24</span></div><div id="date"></div></div>
      <div class="ci" id="wIco"></div>
    </div>
    <div class="card p" id="todo">
      <button id="todoHead" aria-expanded="true"><span id="clipIco"></span><span id="todoTitle">やることリスト</span></button>
      <ul id="todoList"></ul>
    </div>
  </div>
  <div id="topR">
    <div id="counters">
      <div class="ctr card" title="ポイント"><span id="icPts"></span><span id="cPts">0</span></div>
      <div class="ctr card" title="コイン"><span id="icCoin"></span><span id="cCoin">0</span></div>
      <div class="ctr card" title="もちもの"><span id="icPocket"></span><span id="cInv">0/20</span></div>
    </div>
    <div id="side">
      <button class="sbtn card p" id="bInv"></button>
      <button class="sbtn card p" id="bWear"></button>
      <button class="sbtn card p" id="bCam"></button>
      <button class="sbtn card p" id="bSet"></button>
    </div>
  </div>
  <div id="mini"><canvas id="mm" width="240" height="240"></canvas></div>
  <div id="msg" class="card"><div class="ava" id="msgAva"></div><span id="msgText">今日はどんなことをしようかな？</span></div>
  <div id="toolbar" class="card p"></div>
  <div id="btns"><button id="runBtn" class="p">はしる</button><button id="actBtn" class="p"><span id="actIco"></span><span id="actLabel">—</span></button></div>
  <div id="banner"></div>
</div>
<div id="stick" hidden><i></i></div>
<div id="dialog" hidden><div id="dlgName"></div><div id="dlgText"></div><div id="dlgChoices"></div><span id="dlgMore">▼</span></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><header><h2 id="mTitle"></h2><button id="mClose" aria-label="とじる">×</button></header><div id="mBody"></div></div></div>
<div id="camui" hidden><div class="frame"></div><button id="shutter" aria-label="撮影"></button><button id="camClose">もどる</button></div>
<div id="flash"></div>
<div id="title">
  <h1>のんびり島ぐらし</h1>
  <div class="sub">釣って、捕まえて、育てて。あなただけの島の毎日。</div>
  <div class="form">
    <label for="inName">あなたの名前<input id="inName" maxlength="8" value="あなた"></label>
    <label for="inIsland">島の名前<input id="inIsland" maxlength="8" value="さくら島"></label>
    <button id="startBtn">島にでかける</button>
    <div class="keys">移動：WASD / 矢印・画面左側をドラッグ<br>アクション：Space / Z・右下ボタン　ダッシュ：Shift<br>道具：1〜6キー（0で しまう）　もちもの：E</div>
  </div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const TS=48,W=72,H=56;
const T={SEA:0,SAND:1,GRASS:2,RIVER:3,DIRT:4,BRIDGE:5};
const tiles=new Uint8Array(W*H),solid=new Uint8Array(W*H),seaD=new Uint8Array(W*H),grRiver=new Uint8Array(W*H);
let objAt=new Array(W*H).fill(null);
const ix=(x,y)=>y*W+x;
const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const tAt=(x,y)=>inb(x,y)?tiles[ix(x,y)]:T.SEA;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,s=t=>t*t*(3-2*t);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1),u=s(xf),v=s(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand=Math.random;

function setDirt(x,y){if(tAt(x,y)===T.GRASS)tiles[ix(x,y)]=T.DIRT}
function genTiles(){
  const cx=W/2,cy=H/2+1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const dx=(x+.5-cx)/(W/2-4),dy=(y+.5-cy)/(H/2-4);
    const d=Math.hypot(dx,dy)+(vnoise(x/5,y/5)-.5)*.28+(vnoise(x/13+9,y/13)-.5)*.2;
    tiles[ix(x,y)]=d<.8?T.GRASS:d<.95?T.SAND:T.SEA;
  }
  const force=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inb(x,y))tiles[ix(x,y)]=T.GRASS};
  for(const b of BUILD)force(b.x-2,b.y-2,b.x+b.w+1,b.y+b.h+2);
  force(9,25,59,30);
  for(let y=0;y<H;y++){const r=RX(y);for(let k=0;k<2;k++){const x=r+k;if(tAt(x,y)!==T.SEA)tiles[ix(x,y)]=T.RIVER}}
  for(let x=9;x<=59;x++)setDirt(x,27);
  const vline=(x,y0,y1)=>{for(let y=y0;y<=y1;y++)setDirt(x,y)};
  vline(17,20,27);vline(27,19,27);vline(10,25,27);vline(32,23,27);vline(50,22,27);vline(57,25,27);
  for(let y=26;y<=28;y++)for(let x=20;x<=24;x++)setDirt(x,y);
  // sea distance
  const q=[];seaD.fill(255);
  for(let i=0;i<W*H;i++)if(tiles[i]!==T.SEA){seaD[i]=0;q.push(i)}
  for(let h=0;h<q.length;h++){const i=q[h],x=i%W,y=(i/W)|0;for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(!inb(nx,ny))continue;const j=ix(nx,ny);if(seaD[j]===255){seaD[j]=Math.min(250,seaD[i]+1);q.push(j)}}}
  for(let y=0;y<H;y++){const r=RX(y);const g=t=>t===T.GRASS||t===T.DIRT;if(g(tAt(r-1,y))||g(tAt(r+2,y)))for(let k=0;k<2;k++)if(inb(r+k,y))grRiver[ix(r+k,y)]=1}
}
function applyBridge(){for(const y of[BR_Y,BR_Y+1]){const r=RX(y);for(let k=0;k<2;k++)if(tAt(r+k,y)===T.RIVER)tiles[ix(r+k,y)]=T.BRIDGE}}
function genObjects(){
  const R=rng(20261003),objs=[],occ=new Set(),res=new Uint8Array(W*H);
  const mark=(x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(inb(x,y))res[ix(x,y)]=1};
  for(const b of BUILD)mark(b.x-1,b.y-1,b.x+b.w,b.y+b.h+1);
  for(const s of STATIC)mark(s.x-1,s.y-1,s.x+1,s.y+1);
  for(let i=0;i<W*H;i++)if(tiles[i]===T.DIRT)res[i]=1;
  mark(15,19,21,23);mark(19,24,25,30);
  const free=(x,y,sp)=>{for(let dy=-sp;dy<=sp;dy++)for(let dx=-sp;dx<=sp;dx++)if(occ.has((x+dx)+','+(y+dy)))return false;return true};
  const nearRiver=(x,y)=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const t=tAt(x+dx,y+dy);if(t===T.RIVER||t===T.SEA)return true}return false};
  const put=o=>{objs.push(o);occ.add(o.x+','+o.y)};
  const rx=()=>1+Math.floor(R()*(W-2)),ry=()=>1+Math.floor(R()*(H-2));
  let n=0;
  for(let i=0;i<3000&&n<115;i++){const x=rx(),y=ry();if(tAt(x,y)!==T.GRASS||res[ix(x,y)]||nearRiver(x,y)||!free(x,y,1))continue;
    const f=R()<.38?(R()<.6?'apple':R()<.5?'orange':'peach'):null;put({k:'tree',x,y,fruit:f,fr:f?3:0,frAt:0,ch:0,chAt:0});n++}
  n=0;for(let i=0;i<3000&&n<14;i++){const x=rx(),y=ry();if(tAt(x,y)!==T.SAND||seaD[ix(x,y)]!==0)continue;let adjSea=false;for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]])if(tAt(x+a,y+b)===T.SEA)adjSea=true;if(adjSea||!free(x,y,2))continue;put({k:'palm',x,y,fruit:'coconut',fr:2,frAt:0,ch:0,chAt:0});n++}
  n=0;for(let i=0;i<3000&&n<8;i++){const x=rx(),y=ry();if(tAt(x,y)!==T.GRASS||res[ix(x,y)]||!free(x,y,1))continue;put({k:'rock',x,y,hit:0,hitAt:0});n++}
  for(let c=0;c<12;c++){for(let a=0;a<50;a++){const x=rx(),y=ry();if(tAt(x,y)!==T.GRASS||res[ix(x,y)])continue;const col=FLKEYS[Math.floor(R()*FLKEYS.length)];
    for(let k=0;k<9;k++){const fx=x+Math.floor(R()*5)-2,fy=y+Math.floor(R()*4)-1;if(tAt(fx,fy)===T.GRASS&&!res[ix(fx,fy)]&&free(fx,fy,0))put({k:'flower',x:fx,y:fy,col})}break}}
  for(const[x,y,col]of[[14,21,'red'],[15,21,'yellow'],[19,21,'pink'],[20,21,'white'],[13,21,'yellow'],[21,21,'red']])if(free(x,y,0))put({k:'flower',x,y,col});
  const scatter=(k,tt,cnt)=>{let m=0;for(let i=0;i<3000&&m<cnt;i++){const x=rx(),y=ry();if(tAt(x,y)!==tt||res[ix(x,y)]||!free(x,y,0))continue;put({k,x,y});m++}};
  scatter('weed',T.GRASS,30);scatter('shell',T.SAND,12);scatter('dig',T.GRASS,6);
  return objs;
}
const SOLIDK=new Set(['tree','palm','rock','sap']);
function rebuildGrid(){
  objAt=new Array(W*H).fill(null);
  for(let i=0;i<W*H;i++){const t=tiles[i];solid[i]=(t===T.SEA||t===T.RIVER)?1:0}
  for(const o of S.objs){const i=ix(o.x,o.y);objAt[i]=o;if(SOLIDK.has(o.k))solid[i]=1}
  for(const b of BUILD)for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)solid[ix(x,y)]=1;
  for(const s of STATIC)solid[ix(s.x,s.y)]=1;
}
function blocked(x,y){const tx=Math.floor(x),ty=Math.floor(y);return !inb(tx,ty)||solid[ix(tx,ty)]===1}
function free(x,y){const r=.26;return !blocked(x-r,y-.22)&&!blocked(x+r,y-.22)&&!blocked(x-r,y+.02)&&!blocked(x+r,y+.02)}
function tryMove(e,dx,dy){if(free(e.x+dx,e.y))e.x+=dx;if(free(e.x,e.y+dy))e.y+=dy}
function removeObj(o){const k=S.objs.indexOf(o);if(k>=0)S.objs.splice(k,1);rebuildGrid()}
function addObj(o){S.objs.push(o);rebuildGrid()}

let AC=null,sfxOn=true,bgmOn=true,bgmNext=0,bgmStep=0,bgmMel=4;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}

function tone(f,d,type='sine',v=.12,w=0){if(!AC||!sfxOn)return;note(f,d,type,v,AC.currentTime+w)}

function bgmTick(){
  if(!AC||!bgmOn||AC.state!=='running')return;
  const night=isNight(),spb=night?.42:.32,sc=[0,2,4,7,9,12,14,16,19,21],roots=[0,5,7,3],base=night?220:262;
  if(bgmNext<AC.currentTime)bgmNext=AC.currentTime+.05;
  while(bgmNext<AC.currentTime+.6){
    const bar=Math.floor(bgmStep/8)%4,r=roots[bar],t=bgmNext;
    if(bgmStep%8===0){note(base/2*Math.pow(2,r/12),spb*3.5,'triangle',.05,t);note(base/2*Math.pow(2,(r+7)/12),spb*3,'sine',.03,t+spb*2)}
    if(bgmStep%4===2)note(base*Math.pow(2,(r+4)/12),spb*.8,'sine',.025,t);
    if(bgmStep%2===0||rand()<.25){bgmMel=Math.max(0,Math.min(sc.length-1,bgmMel+Math.floor(rand()*5)-2));if(rand()<.85)note(base*2*Math.pow(2,sc[bgmMel]/12)/2,spb*1.6,'triangle',.035,t)}
    bgmNext+=spb;bgmStep++;
  }
}

const cnt=id=>S.inv.reduce((s,e)=>s+(e.id===id?e.c:0),0);
function addItem(id,n=1){
  let s=S.inv.find(e=>e.id===id&&e.c+n<=99);
  if(s)s.c+=n;else{if(S.inv.length>=20){msg('ポケットがいっぱい！ 商店で売ってこよう');return false}S.inv.push({id,c:n})}
  if(id==='wood')emit('wood',n);
  hudDirty=true;return true;
}
function removeItem(id,n=1){for(let i=S.inv.length-1;i>=0&&n>0;i--){const e=S.inv[i];if(e.id!==id)continue;const k=Math.min(n,e.c);e.c-=k;n-=k;if(e.c<=0)S.inv.splice(i,1)}hudDirty=true}
let msgT=0;
function msg(t){$('#msgText').textContent=t;msgT=now}
let bannerQ=[],bannerBusy=false;
function banner(t,gold){bannerQ.push([t,gold]);if(!bannerBusy)nextBanner()}
function nextBanner(){const b=bannerQ.shift();const el=$('#banner');if(!b){bannerBusy=false;return}bannerBusy=true;el.textContent=b[0];el.classList.toggle('gold',!!b[1]);el.classList.add('show');setTimeout(()=>{el.classList.remove('show');setTimeout(nextBanner,350)},1900)}
const need=()=>80+S.lv*60;
function addExp(n){S.exp+=n;while(S.exp>=need()){S.exp-=need();S.lv++;banner(`島のレベルが ${S.lv} になった！`,true);SFX.task()}hudDirty=true}
function newTask(excl){const pool=TASK_POOL.filter(t=>!excl.includes(t.id));const t=pick(pool);return{id:t.id,c:0,done:false}}
function emit(ev,n=1){
  for(const tk of S.tasks){const d=TASK_POOL.find(t=>t.id===tk.id);if(!d||tk.done||d.ev!==ev)continue;tk.c=Math.min(d.n,tk.c+n);
    if(tk.c>=d.n){tk.done=true;S.points+=d.pt;addExp(40);SFX.task();banner(`達成！ ${d.t}　+${d.pt}ポイント`);
      setTimeout(()=>{const k=S.tasks.indexOf(tk);if(k>=0){S.tasks[k]=newTask(S.tasks.map(t=>t.id));hudDirty=true;save()}},2600)}}
  hudDirty=true;
}

function dialog(name,lines,opt={}){dlg={name,lines:Array.isArray(lines)?lines:[lines],i:0,shown:0,choices:opt.choices,onEnd:opt.onEnd,col:opt.col};$('#dialog').hidden=false;$('#dlgName').textContent=name;$('#dlgName').style.background=opt.col||'var(--orange)';renderDlg()}
function renderDlg(){
  const l=dlg.lines[dlg.i];$('#dlgText').textContent=l.slice(0,Math.floor(dlg.shown));
  const full=dlg.shown>=l.length,last=dlg.i===dlg.lines.length-1;
  const ch=$('#dlgChoices');
  if(full&&last&&dlg.choices){if(!ch.childElementCount){dlg.choices.forEach((c,k)=>{const b=document.createElement('button');b.textContent=c.l;if(c.alt)b.className='alt';b.onclick=e=>{e.stopPropagation();const d=dlg;closeDlg();c.f&&c.f();if(d.onEnd)d.onEnd()};ch.appendChild(b)})}}else ch.innerHTML='';
  $('#dlgMore').hidden=!full||(last&&!!dlg.choices);
}
function advanceDlg(){if(!dlg)return;const l=dlg.lines[dlg.i];if(dlg.shown<l.length){dlg.shown=l.length;renderDlg();return}
  if(dlg.i<dlg.lines.length-1){dlg.i++;dlg.shown=0;renderDlg();return}
  if(dlg.choices)return;const d=dlg;closeDlg();if(d.onEnd)d.onEnd()}
function closeDlg(){dlg=null;$('#dialog').hidden=true;$('#dlgChoices').innerHTML='';villagers.forEach(v=>v.talk=false)}
function updateDlg(dt){if(!dlg)return;const l=dlg.lines[dlg.i];if(dlg.shown<l.length){const b=Math.floor(dlg.shown);dlg.shown=Math.min(l.length,dlg.shown+dt*38);if(Math.floor(dlg.shown)!==b&&b%3===0)SFX.talk();renderDlg()}}

// ---------- actions ----------
const DIRV={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
function front(d=.75){const v=DIRV[P.dir];return{x:P.x+v[0]*d,y:P.y-.2+v[1]*d}}
function burst(x,y,kind,n,col){for(let i=0;i<n;i++){const a=rand()*Math.PI*2,s=.5+rand()*1.6;parts.push({x,y,z:kind==='leaf'?1.4:.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.5,vz:kind==='splash'?2+rand()*2:kind==='spark'?1+rand():rand(),life:0,max:.6+rand()*.6,kind,col})}}
function drop(id,x,y){S.drops.push({id,x,y,t:0})}
function plan(){
  if(P.jump||!S.started)return null;
  if(P.fish)return{l:P.fish.st==='bite'?'ひく！':'ひく',f:reel};
  const fp=front(),fx=Math.floor(fp.x),fy=Math.floor(fp.y);
  const v=villagers.find(v=>Math.hypot(v.x-fp.x,v.y-.2-fp.y)<.8);
  if(v)return{l:'はなす',f:()=>talkTo(v)};
  const d=S.drops.find(d=>Math.hypot(d.x-P.x,d.y-(P.y-.15))<.7||Math.hypot(d.x-fp.x,d.y-fp.y)<.6);
  if(d)return{l:'ひろう',f:()=>pickDrop(d)};
  const o=inb(fx,fy)?objAt[ix(fx,fy)]:null;
  if(o&&(o.k==='weed'||o.k==='shell'))return{l:o.k==='weed'?'ぬく':'ひろう',f:()=>pickObj(o)};
  const b=BUILD.find(b=>b.door.x===fx&&b.door.y===fy);
  if(b&&P.dir==='u')return{l:'はいる',f:()=>enter(b)};
  const st=STATIC.find(s=>s.x===fx&&s.y===fy);
  if(st&&st.k==='sign')return{l:'よむ',f:bridgeSign};
  if(st&&st.k==='mail')return{l:'あける',f:openMail};
  const tool=S.tool>=0?TOOLS[S.tool].id:null;
  const tp=toolPlan(tool,fx,fy,o);if(tp)return tp;
  if(o&&(o.k==='tree'||o.k==='palm'))return{l:'ゆする',f:()=>shake(o)};
  return null;
}
function toolPlan(tool,fx,fy,o){
  switch(tool){
    case'rod':{const w=findWater();return w?{l:'つる',f:()=>cast(w)}:null}
    case'net':return{l:'ふる',f:swingNet};
    case'shovel':if(o&&o.k==='dig')return{l:'ほる',f:()=>dig(fx,fy,o)};if(o&&o.k==='hole')return{l:'うめる',f:()=>dig(fx,fy,o)};if(!o&&canDig(fx,fy))return{l:'ほる',f:()=>dig(fx,fy,null)};return null;
    case'pole':{const j=vaultTarget();return j?{l:'とぶ',f:()=>vault(j)}:null}
    case'axe':if(o&&(o.k==='tree'||o.k==='rock'))return{l:o.k==='rock'?'たたく':'きる',f:()=>chop(o)};return null;
    case'can':return{l:'みずやり',f:()=>water(fx,fy)};
  }return null;
}
function doAction(){
  if(dlg){advanceDlg();return}
  if(modalOpen||camMode||!S.started)return;
  const p=plan();if(p){p.f();return}
  if(S.tool>=0){P.anim={tool:TOOLS[S.tool].id,t:0,d:.35};SFX.swing()}
}
function pickDrop(d){
  S.drops.splice(S.drops.indexOf(d),1);
  if(d.id==='bag'){S.coins+=1000;SFX.coin();msg('コインぶくろだ！ 1,000コイン手に入れた');hudDirty=true;return}
  if(!addItem(d.id)){S.drops.push(d);return}
  SFX.pick();msg(`${ITEMS[d.id].n}を拾った`);
  if(['apple','orange','peach','coconut'].includes(d.id)){emit('fruit');addExp(5)}
}
function pickObj(o){
  if(!addItem(o.k))return;removeObj(o);SFX.pick();burst(o.x+.5,o.y+.6,'leaf',4,o.k==='weed'?'#5cb84a':'#ffd0dc');
  if(o.k==='weed'){emit('weed');msg('ざっそうをぬいた')}else{emit('shell');msg('貝がらを拾った')}addExp(2);
}
function shake(o){
  o.sh=.5;burst(o.x+.5,o.y-.4,'leaf',8,'#5cb84a');SFX.chop();
  if(o.fruit&&o.fr>0){for(let i=0;i<o.fr;i++)drop(o.fruit,o.x+.5+(i-(o.fr-1)/2)*.55,o.y+1.25+(i%2)*.15);o.fr=0;o.frAt=Date.now()+8*60000;msg(`${ITEMS[o.fruit].n}が落ちてきた！`)}
  else if(rand()<.12){drop(rand()<.5?'bag':'wood',o.x+.5,o.y+1.3);msg('なにか落ちてきた！')}
  else msg('……なにも落ちてこない');
}
function chop(o){
  P.anim={tool:'axe',t:0,d:.4};o.sh=.4;
  if(o.k==='rock'){SFX.rock();burst(o.x+.5,o.y+.5,'spark',6,'#fff6b0');if(Date.now()>o.hitAt)o.hit=0;
    if(o.hit>=4){msg('もう何も出ないみたい');return}o.hit++;if(o.hit>=4)o.hitAt=Date.now()+5*60000;
    const r=rand(),id=r<.03?'gold':r<.25?'iron':r<.33?'bag':'stone';
    const dx=P.x-(o.x+.5),dy=P.y-(o.y+.5),l=Math.hypot(dx,dy)||1;drop(id,o.x+.5+dx/l*.75+(rand()-.5)*.4,o.y+.7+dy/l*.7);emit('rock');addExp(3);return}
  SFX.chop();burst(o.x+.5,o.y+.5,'chip',6,'#c99a5a');if(Date.now()>o.chAt)o.ch=0;
  if(o.ch>=3){msg('今日はもう木材が出ないみたい');return}o.ch++;if(o.ch>=3)o.chAt=Date.now()+5*60000;
  const dx=P.x-(o.x+.5),dy=P.y-(o.y+.5),l=Math.hypot(dx,dy)||1;drop('wood',o.x+.5+dx/l*.75+(rand()-.5)*.3,o.y+.75+dy/l*.65);addExp(3);
}
function canDig(x,y){const t=tAt(x,y);return(t===T.GRASS||t===T.SAND||t===T.DIRT)&&!solid[ix(x,y)]&&!objAt[ix(x,y)]&&!(Math.floor(P.x)===x&&Math.floor(P.y-.1)===y)}
function dig(x,y,o){
  P.anim={tool:'shovel',t:0,d:.4};SFX.dig();burst(x+.5,y+.5,'chip',6,'#b48a52');
  if(o&&o.k==='dig'){removeObj(o);const r=rand();const id=r<.68?'fossil':r<.85?'present':'bag';drop(id,x+.5,y+.6);if(id==='fossil'){emit('fossil');msg('化石を掘りだした！')}else msg('なにか埋まっていた！');addExp(15);return}
  if(o&&o.k==='hole'){removeObj(o);msg('穴をうめた');return}
  addObj({k:'hole',x,y});msg('穴をほった');
}
function water(fx,fy){
  P.anim={tool:'can',t:0,d:.6};SFX.water();const v=DIRV[P.dir];let did=0;
  const tl=[[fx,fy],[fx+v[1],fy+v[0]],[fx-v[1],fy-v[0]]];
  for(const[x,y]of tl){burst(x+.5,y+.5,'drop',3,'#8fd8ff');const o=inb(x,y)&&objAt[ix(x,y)];if(!o)continue;
    if(o.k==='flower'){if(!o.wet||Date.now()-o.wet>60000){o.wet=Date.now();did++;if(rand()<.3)spreadFlower(o)}}
    else if(o.k==='bud'||o.k==='sap'){if(!o.wet||Date.now()-o.wet>20000){o.wet=Date.now();o.at-=45000;did++}}}
  if(did){emit('water',did);msg('お水をあげた。うれしそう！');addExp(did)}
}
function spreadFlower(o){const c=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[o.x+a,o.y+b]).filter(([x,y])=>tAt(x,y)===T.GRASS&&!objAt[ix(x,y)]&&!solid[ix(x,y)]);if(c.length){const[x,y]=pick(c);addObj({k:'bud',x,y,col:o.col,at:Date.now()+30000});msg('となりに新しいつぼみが出てきた！')}}
function findWater(){const v=DIRV[P.dir],tx=Math.floor(P.x),ty=Math.floor(P.y-.15);for(let k=1;k<=3;k++){const x=tx+v[0]*k,y=ty+v[1]*k,t=tAt(x,y);if(t===T.SEA||t===T.RIVER)return{x:x+.5+(rand()-.5)*.3,y:y+.5+(rand()-.5)*.3,water:t===T.SEA?'sea':'river'};if(solid[ix(x,y)]&&t!==T.BRIDGE)return null}return null}
function vaultTarget(){const v=DIRV[P.dir],tx=Math.floor(P.x),ty=Math.floor(P.y-.15);let saw=false;for(let k=1;k<=3;k++){const x=tx+v[0]*k,y=ty+v[1]*k,t=tAt(x,y);if(t===T.RIVER){saw=true;continue}if(!saw||t===T.SEA||solid[ix(x,y)])return null;return{x:x+.5,y:y+.6}}return null}
function vault(j){P.jump={sx:P.x,sy:P.y,ex:j.x,ey:j.y,t:0};SFX.jump()}
function swingNet(){
  P.anim={tool:'net',t:0,d:.35};SFX.swing();const fp=front(.9),R=S.gold.net?1.5:1;
  const b=bugs.find(b=>!b.flee&&Math.hypot(b.x-fp.x,b.y-fp.y)<R);
  if(!b)return;bugs.splice(bugs.indexOf(b),1);const d=BUGS.find(x=>x.id===b.id);
  if(!addItem(d.id))return;S.dex[d.id]=(S.dex[d.id]||0)+1;emit('bug');addExp(20);SFX.catch();
  P.show={i:d.i,t:1.6};banner(`${d.n}をつかまえた！`);msg(`${d.n}をつかまえた！（${d.p.toLocaleString()}コイン）`);save();
}
function cast(w){P.anim=null;P.fish={x:w.x,y:w.y,water:w.water,st:'cast',t:0,target:null,dip:0};SFX.swing();msg('魚の影が来るのを待とう…')}

function drawPerson(x,y,dir,ph,mv,o,z=0){

function bubble(x,y,t,sz=13){const c=ctx;c.font=`800 ${sz}px ${UIF}`;const w=c.measureText(t).width+20,h=sz+14;c.fillStyle='rgba(0,0,0,.1)';rr(x-w/2,y-h-8+3,w,h,h/2);c.fillStyle='#fff';rr(x-w/2,y-h-8,w,h,h/2);poly([[x-6,y-9],[x+6,y-9],[x,y-1]]);c.fillStyle='#5b4a36';c.textAlign='center';c.textBaseline='middle';c.fillText(t,x,y-8-h/2+1)}

  c.save();c.translate(x+(dir==='u'?0:fl*8),hy+18);if(dir==='l')c.scale(-1,1);if(dir==='d'||dir==='u')a+=.6;c.rotate(a);

function render(){
  const vw=cw/Z,vh=ch/Z;
  const tx=P.x*TS-vw/2,ty=P.y*TS-vh/2-20;
  const clampC=(v,max)=>max<0?max/2:Math.max(0,Math.min(max,v));
  const gx=clampC(tx,W*TS-vw),gy=clampC(ty,H*TS-vh);
  if(!camInit){camX=gx;camY=gy;camInit=true}else{camX+=(gx-camX)*.12;camY+=(gy-camY)*.12}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#3aa5dc';ctx.fillRect(0,0,cv.width,cv.height);
  const s=DPR*Z;ctx.setTransform(s,0,0,s,-camX*s,-camY*s);
  const x0=Math.max(0,Math.floor(camX/TS)-1),y0=Math.max(0,Math.floor(camY/TS)-1),x1=Math.min(W-1,Math.ceil((camX+vw)/TS)+1),y1=Math.min(H-1,Math.ceil((camY+vh)/TS)+2);
  drawTiles(x0,y0,x1,y1);
  // shadows (fish)
  for(const sh of shadows){ctx.fillStyle=`rgba(20,50,80,${.38*sh.a})`;const r=5+sh.s*3;ell(sh.x*TS,sh.y*TS,r*1.5,r)}
  const inView=(x,y,m=2)=>x>=x0-m&&x<=x1+m&&y>=y0-1&&y<=y1+3;
  const list=[];
  for(const o of S.objs){if(!inView(o.x,o.y))continue;if(o.k==='tree'||o.k==='palm'||o.k==='rock'||o.k==='sap')list.push([o.y*TS+TS-6,o]);else drawDecal(o)}
  for(const d of S.drops){const z=Math.max(0,(1-d.t*3))*20*Math.abs(Math.sin(d.t*8));ctx.fillStyle='rgba(30,60,20,.2)';ell(d.x*TS,d.y*TS+2,9,3);ctx.font=`22px ${EMOJI}`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(ITEMS[d.id].i,d.x*TS,d.y*TS+4-z)}
  for(const b of BUILD)list.push([(b.y+b.h)*TS-6,{k:'bld',b}]);
  for(const st of STATIC)if(inView(st.x,st.y))list.push([st.y*TS+TS-8,{k:'st',s:st}]);
  for(const v of villagers)list.push([v.y*TS,{k:'vil',v}]);
  list.push([P.y*TS,{k:'pl'}]);
  for(const b of bugs)list.push([b.y*TS+(b.mode==='tree'?2:0),{k:'bug',b}]);
  list.sort((a,b)=>a[0]-b[0]);
  for(const[,e]of list){
    if(e.k==='tree')drawTree(e);else if(e.k==='palm')drawPalm(e);else if(e.k==='rock')drawRock(e);else if(e.k==='sap')drawSap(e);
    else if(e.k==='bld')drawBuilding(e.b);else if(e.k==='st')drawStatic(e.s);
    else if(e.k==='vil'){const v=e.v;drawPerson(v.x*TS,v.y*TS,v.dir,v.ph,v.mv,v)}
    else if(e.k==='bug')drawBug(e.b);
    else drawPlayer();
  }
  // fishing line
  if(P.fish){const f=P.fish,fl=P.dir==='l'?-1:P.dir==='r'?1:0,hx=P.x*TS+fl*8,hy=P.y*TS-26,v=DIRV[P.dir],tipx=hx+v[0]*40+(fl?0:14),tipy=hy-30+v[1]*20;
    ctx.strokeStyle='#9b6a3c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tipx,tipy);ctx.stroke();
    const k=f.st==='cast'?Math.min(1,f.t/.35):1,bx=tipx+(f.x*TS-tipx)*k,by=tipy+(f.y*TS-tipy)*k-(f.st==='cast'?Math.sin(k*Math.PI)*40:0),dp=f.dip>0?f.dip*14:Math.sin(now*3)*1.2;
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(tipx,tipy);ctx.quadraticCurveTo((tipx+bx)/2,Math.max(tipy,by)+10,bx,by+dp);ctx.stroke();
    if(f.st!=='cast'){ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(bx,by+2,8+Math.sin(now*3)*2,3,0,0,Math.PI*2);ctx.stroke()}
    ctx.fillStyle='#fff';circ(bx,by+dp,4.5);ctx.fillStyle='#e8463c';ctx.beginPath();ctx.arc(bx,by+dp,4.5,Math.PI,0);ctx.fill()}
  // particles
  for(const p of parts){const a=1-p.life/p.max,X=p.x*TS,Y=p.y*TS-p.z*TS*.6;ctx.globalAlpha=a;ctx.fillStyle=p.col;
    if(p.kind==='leaf'){ctx.save();ctx.translate(X,Y);ctx.rotate(p.life*6);ell(0,0,4,2);ctx.restore()}else if(p.kind==='spark')star(X,Y,2.2);else circ(X,Y,p.kind==='dust'?4*a+1:2.5)}
  ctx.globalAlpha=1;
  // bubbles

  for(const v of villagers){const d=Math.hypot(v.x-P.x,v.y-P.y);if(v.talk)continue;
    if(v.id==='komugi'&&d<6&&S.talked.komugi!==today())bubble(v.x*TS,v.y*TS-62,'いらっしゃいませ！素敵な1日を♪');
    else if(v.bub>0)bubble(v.x*TS,v.y*TS-62,'♪')}
  if(P.emote)bubble(P.x*TS,P.y*TS-64,'！',18);
  if(P.show){const z=Math.min(1,(1.6-P.show.t)*4);ctx.font=`${30*z}px ${EMOJI}`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(P.show.i,P.x*TS,P.y*TS-70)}
  // light / weather
  ctx.setTransform(1,0,0,1,0,0);
  const n=nightF(),h=hourNow(),w=weatherNow(),u=h>=16&&h<19.5?Math.sin((h-16)/3.5*Math.PI):0;
  if(u>0){ctx.fillStyle=`rgba(255,130,50,${.17*u})`;ctx.fillRect(0,0,cv.width,cv.height)}
  if(w===1){ctx.fillStyle='rgba(90,100,120,.08)';ctx.fillRect(0,0,cv.width,cv.height)}
  if(w===2){ctx.fillStyle='rgba(60,80,110,.16)';ctx.fillRect(0,0,cv.width,cv.height)}
  if(n>0){ctx.fillStyle=`rgba(18,28,80,${.5*n})`;ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(s,0,0,s,-camX*s,-camY*s);ctx.globalCompositeOperation='lighter';
    const glow=(x,y,r,a)=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,200,110,${a})`);g.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)};
    for(const st of STATIC)if(st.k==='lamp')glow(st.x*TS+TS/2,st.y*TS-14,110,.35*n);
    for(const b of BUILD)glow(b.door.x*TS+TS/2,(b.y+b.h)*TS-30,90,.25*n);
    glow(P.x*TS,P.y*TS-20,90,.12*n);
    for(const b of bugs)if(b.id==='b_hotaru')glow(b.x*TS,b.y*TS-b.z,26,.5*n*(.5+.5*Math.sin(b.t*4)));
    ctx.globalCompositeOperation='source-over';ctx.setTransform(1,0,0,1,0,0)}
  if(w===2){ctx.strokeStyle='rgba(220,235,255,.55)';ctx.lineWidth=1.4*DPR;ctx.beginPath();const W2=cv.width,H2=cv.height;for(let i=0;i<110;i++){const y=(hash(i,2)*H2+now*900*DPR)%H2,x=(hash(i,1)*W2-y*.2+W2)%W2;ctx.moveTo(x,y);ctx.lineTo(x-4*DPR,y+16*DPR)}ctx.stroke()}
}

function drawPlayer(){

      const b1=document.createElement('button');b1.className='btn';b1.textContent='1つ売る';b1.onclick=()=>{S.coins+=it.p;removeItem(e.id,1);emit('sell');SFX.coin();re()};r.appendChild(b1);el.appendChild(r)});
  }else if(tab==='buy'){
    [['seed',240,'植えると花がさく'],['sapling',640,'植えると木に育つ'],['apple',300,'植えるとりんごの木に']].forEach(([id,pr,ds])=>{const it=ITEMS[id],r=document.createElement('div');r.className='row';r.innerHTML=`<span class="ic">${it.i}</span><span class="nm">${it.n}<small>${ds}</small></span><span class="pr">${pr}コイン</span>`;
      const b=document.createElement('button');b.className='btn';b.textContent='買う';b.disabled=S.coins<pr;b.onclick=()=>{if(S.coins<pr)return;if(addItem(id)){S.coins-=pr;SFX.coin();re()}};r.appendChild(b);el.appendChild(r)});
  }else{
    const pts=[['goldrod','🎣','金のつりざお','魚がかかっている時間が長くなる',1500],['goldnet','🥅','金のあみ','虫をつかまえる範囲が広がる',1500],['coins','💰','3,000コインと交換','いつでも交換できます',1000]];
    for(const[key,ic,n,ds,pt]of pts){const owned=key==='goldrod'?S.gold.rod:key==='goldnet'?S.gold.net:false;const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="ic">${ic}</span><span class="nm">${n}<small>${ds}</small></span><span class="pr">${pt.toLocaleString()}pt</span>`;
      const b=document.createElement('button');b.className='btn';b.textContent=owned?'交換ずみ':'交換';b.disabled=owned||S.points<pt;b.onclick=()=>{if(S.points<pt)return;S.points-=pt;if(key==='goldrod')S.gold.rod=true;else if(key==='goldnet')S.gold.net=true;else S.coins+=3000;SFX.task();hudDirty=true;re()};r.appendChild(b);el.appendChild(r)}
  }})}
function openWear(){openModal('きせかえ',el=>{
  const sec=(label,key,cols,allowNone)=>{const l=document.createElement('div');l.className='lbl';l.textContent=label;el.appendChild(l);const sw=document.createElement('div');sw.className='sw';
    const list=allowNone?[null,...cols]:cols;for(const c of list){const b=document.createElement('button');b.style.background=c||'repeating-linear-gradient(45deg,#fff,#fff 4px,#eee 4px,#eee 8px)';b.setAttribute('aria-label',c||'なし');if(S.outfit[key]===c)b.className='on';b.onclick=()=>{S.outfit[key]=c;hudDirty=true;closeModal();openWear()};sw.appendChild(b)}el.appendChild(sw)};
  sec('ぼうし','cap',['#efe6d2','#e8524a','#3a8fe0','#4cb866','#f5a03c','#ff9ccf','#5b4a36'],true);
  sec('シャツ','shirt',['#6fb8e8','#e8524a','#4cb866','#ffd23f','#ff9ccf','#a98bf0','#ffffff','#5b4a36']);
  sec('かみの色','hair',['#6b4630','#2e2420','#c98a4a','#e8c070','#d8604a']);
  const b=document.createElement('button');b.className='btn alt';b.textContent=S.outfit.stripe?'しましま：あり':'しましま：なし';b.onclick=()=>{S.outfit.stripe=!S.outfit.stripe;closeModal();openWear()};el.appendChild(b);
})}
let resetArm=false;
function openSettings(){openModal('設定',el=>{
  const row=(l,on,f)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span class="nm">${l}</span>`;const b=document.createElement('button');b.className='btn'+(on?'':' alt');b.textContent=on?'ON':'OFF';b.onclick=()=>{f();closeModal();openSettings()};r.appendChild(b);el.appendChild(r)};
  row('BGM',bgmOn,()=>{bgmOn=!bgmOn;ensureAudio()});row('効果音',sfxOn,()=>{sfxOn=!sfxOn});
  el.insertAdjacentHTML('beforeend',`<div class="lbl">あそびかた</div><ul class="help"><li>移動：WASD・矢印キー／画面の左側をドラッグ</li><li>アクション：Space・Z／右下の大きいボタン（話す・拾う・道具を使う）</li><li>ダッシュ：Shift／「はしる」ボタン（走ると虫がにげる）</li><li>道具：1〜6キー、0でしまう／下の道具バー</li><li>つり：水辺で「つる」→ 影が近づき浮きが大きくしずんだら「ひく」</li><li>たかとびぼう：川の手前で「とぶ」</li><li>果物・タネ・なえぎは「もちもの」から目の前に植えられる</li><li>時間と天気は現実の時刻と連動。夜はホタルやコオロギが出るよ</li><li>データはこのブラウザに自動保存されます</li></ul>`);
  const b=document.createElement('button');b.className='btn alt';b.style.marginTop='1em';b.textContent=resetArm?'本当に消す（もう一度押す）':'データを消してはじめから';
  b.onclick=()=>{if(!resetArm){resetArm=true;closeModal();openSettings();return}try{localStorage.removeItem(KEY)}catch(e){}location.reload()};el.appendChild(b);
})}
function camOn(){camMode=true;$('#hud').hidden=true;$('#camui').hidden=false}
function camOff(){camMode=false;$('#hud').hidden=false;$('#camui').hidden=true}
function shoot(){const f=$('#flash');f.style.transition='none';f.style.opacity=1;requestAnimationFrame(()=>{f.style.transition='opacity .5s';f.style.opacity=0});tone(1500,.05,'square',.05);
  let url='';try{url=cv.toDataURL('image/png')}catch(e){}camOff();
  openModal('しゃしん',el=>{if(!url){el.textContent='撮影できませんでした。';return}const im=new Image();im.src=url;im.className='photo';im.alt='島の写真';el.appendChild(im);el.insertAdjacentHTML('beforeend','<p class="lbl">画像を長押し（PCは右クリック）で保存できます。</p>');
    const a=document.createElement('a');a.href=url;a.download='island-photo.png';a.className='btn';a.textContent='ダウンロード';a.style.display='inline-block';a.style.textDecoration='none';el.appendChild(a)})}

// ---------- save ----------
const KEY='nonbiri-shima-v1';
function save(){if(!S.started)return;try{S.px=P.x;S.py=P.y;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){return null}}

// ---------- input ----------
const stickEl=$('#stick'),knob=stickEl.firstElementChild;
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  ensureAudio();keys.add(e.code);if(e.repeat)return;
  if(e.code==='Escape'){if(modalOpen)closeModal();else if(camMode)camOff();return}
  if(e.code==='Space'||e.code==='KeyZ'||e.code==='Enter'){if(camMode)shoot();else doAction();return}
  if(modalOpen||dlg||!S.started)return;
  if(/^Digit[1-6]$/.test(e.code))setTool(+e.code.slice(5)-1);
  if(e.code==='Digit0'||e.code==='KeyQ')setTool(-1);
  if(e.code==='KeyE'||e.code==='KeyI')openInv();
});
addEventListener('keyup',e=>keys.delete(e.code));
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{
  ensureAudio();if(!S.started||camMode)return;if(dlg){advanceDlg();return}
  if(e.pointerType!=='mouse'&&e.clientX>innerWidth*.6)return;
  stick={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};stickEl.hidden=false;stickEl.style.left=e.clientX+'px';stickEl.style.top=e.clientY+'px';knob.style.transform='';
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{if(!stick||e.pointerId!==stick.id)return;let dx=(e.clientX-stick.ox)/50,dy=(e.clientY-stick.oy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}stick.dx=dx;stick.dy=dy;knob.style.transform=`translate(${dx*36}px,${dy*36}px)`});
const endStick=e=>{if(stick&&e.pointerId===stick.id){stick=null;stickEl.hidden=true}};
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
$('#dialog').addEventListener('click',()=>advanceDlg());
$('#actBtn').addEventListener('click',()=>{ensureAudio();doAction()});
$('#runBtn').addEventListener('click',()=>{runToggle=!runToggle;$('#runBtn').classList.toggle('on',runToggle)});
$('#bInv').onclick=()=>{if(!dlg)openInv()};$('#bWear').onclick=()=>{if(!dlg)openWear()};$('#bCam').onclick=()=>{if(!dlg)camOn()};$('#bSet').onclick=()=>{resetArm=false;if(!dlg)openSettings()};
$('#mClose').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#shutter').onclick=shoot;$('#camClose').onclick=camOff;
$('#todoHead').onclick=()=>{const t=$('#todo');t.classList.toggle('collapsed');$('#todoHead').setAttribute('aria-expanded',!t.classList.contains('collapsed'));hudDirty=true};

// ---------- init ----------
function spawnVillagers(){villagers=VDEF.map(d=>({...d,x:d.hx+.5,y:d.hy+.6,tx:d.hx+.5,ty:d.hy+.6,dir:'d',ph:0,mv:false,wait:rand()*3,stuck:0,talk:false,pants:shade(d.shirt,-50)}))}
function init(){
  resize();addEventListener('resize',resize);
  genTiles();
  const sv=loadSave();
  if(sv&&sv.v===1){Object.assign(S,sv,{started:false});P.x=S.px;P.y=S.py;$('#inName').value=S.name;$('#inIsland').value=S.island;$('#startBtn').textContent='つづきから';}
  else{S.objs=genObjects();S.tasks=['shop','talk','fruit','wood'].map(id=>({id,c:0,done:false}))}
  if(S.bridge)applyBridge();rebuildGrid();if(!free(P.x,P.y)){P.x=17.5;P.y=21.5}
  spawnVillagers();renderMiniBase();buildToolbar();
  $('#islandAva').innerHTML=ICON.island;$('#clipIco').innerHTML=ICON.clip;$('#icPts').innerHTML=ICON.leaf;$('#icCoin').innerHTML=ICON.coin;$('#icPocket').innerHTML=ICON.pocket;$('#actIco').innerHTML=ICON.leafW;
  [['#bInv','bag','もちもの'],['#bWear','shirt','きせかえ'],['#bCam','camera','カメラ'],['#bSet','gear','設定']].forEach(([s,i,l])=>$(s).innerHTML=ICON[i]+`<span>${l}</span>`);
  if(innerWidth<700||innerHeight<560)$('#todo').classList.add('collapsed');
  tickClock();renderHUD();
  $('#startBtn').onclick=()=>{ensureAudio();const first=!sv;S.name=($('#inName').value.trim()||'あなた').slice(0,8);S.island=($('#inIsland').value.trim()||'さくら島').slice(0,8);
    S.started=true;$('#title').hidden=true;hudDirty=true;save();
    if(first){const k=villagers.find(v=>v.id==='komugi');dialog('こむぎ',[`ようこそ、${S.island}へ！ 案内係のこむぎです♪`,'移動はWASDか矢印キー。スマホなら画面の左側をドラッグしてくださいね。','Spaceキーか右下のボタンで、話す・拾う・道具を使う、ができますよ。','下の道具バー（1〜6キー）で道具を持ちかえられます。','まずは「やることリスト」をこなしてみてくださいね。素敵な1日を♪'],{col:k.col})}
    else msg(`おかえりなさい、${S.name}さん！`)};
  let last=performance.now(),acc=0,clk=0,mmT=0,saveT=0;
  const frame=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;now+=dt;
    updatePlayer(dt);updateVillagers(dt);updateBugs(dt);updateShadows(dt);updateFishing(dt);updateWorld(dt);updateDlg(dt);
    render();
    acc-=dt;if(acc<=0){acc=.12;const p=plan();$('#actLabel').textContent=p?p.l:(S.tool>=0?TOOLS[S.tool].n:'—');$('#actBtn').classList.toggle('idle',!p)}
    clk-=dt;if(clk<=0){clk=1;tickClock()}
    mmT-=dt;if(mmT<=0){mmT=.25;renderMini()}
    saveT+=dt;if(saveT>15){saveT=0;save()}
    if(hudDirty){hudDirty=false;renderHUD()}
    bgmTick();requestAnimationFrame(frame)};
  requestAnimationFrame(frame);
  addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
}
init();
</script>
<script src="../../playtime.js" defer></script>
</body>
