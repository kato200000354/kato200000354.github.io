[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1430;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 35%,#3b2a66 0%,#1b1430 65%,#0d0a18 100%)}
body.disco{animation:disco .5s steps(1) infinite}
@keyframes disco{0%{background:#3a0b4f}25%{background:#0b3a4f}50%{background:#4f3a0b}75%{background:#0b4f22}}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.hud-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none;z-index:5}
.count{pointer-events:none}
.count small{display:block;font-size:11px;opacity:.7;letter-spacing:.1em}
.count b{font-size:34px;font-weight:900;line-height:1;text-shadow:0 3px 0 #000a}
.count .mult{display:inline-block;margin-left:6px;font-size:14px;color:#ffd84a;vertical-align:top}
.tbtns{display:flex;gap:6px;pointer-events:auto}
.ibtn{background:#ffffff1c;border:1px solid #ffffff30;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;backdrop-filter:blur(6px)}
.hud-bot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:0 12px calc(14px + env(safe-area-inset-bottom));z-index:5}
.bbtn{flex:1;max-width:200px;background:#ffffff18;border:1px solid #ffffff35;border-radius:16px;padding:12px 6px;font-size:14px;font-weight:800;backdrop-filter:blur(6px)}
.bbtn.hot{background:linear-gradient(#ff4b55,#c4121e);border-color:#ff8a90;box-shadow:0 4px 0 #6d0910}
.timer{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:44px;font-weight:900;text-shadow:0 4px 0 #000a;pointer-events:none;z-index:5}
.timer small{display:block;font-size:13px;opacity:.8;font-weight:700}
#banner{position:fixed;top:calc(110px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:6;width:min(92vw,420px)}
.bn{display:inline-block;padding:8px 16px 9px;border-radius:14px;background:#000c;border:2px solid var(--c);box-shadow:0 0 24px var(--c);animation:bnIn .35s cubic-bezier(.2,1.6,.4,1)}
.bn .rt{display:inline-block;font-size:12px;font-weight:900;padding:1px 7px;border-radius:6px;background:var(--c);color:#111;margin-right:6px;vertical-align:2px}
.bn .nm{font-size:19px;font-weight:900}
.bn .new{color:#ff5;font-size:12px;font-weight:900;margin-left:6px}
.bn .ds{display:block;font-size:12px;opacity:.8;margin-top:2px}
.bn.LEG{border-image:linear-gradient(90deg,red,orange,yellow,lime,cyan,violet) 1;}
@keyframes bnIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#bubble{position:fixed;z-index:4;pointer-events:none;background:#fff;color:#222;font-weight:900;font-size:15px;padding:7px 12px;border-radius:14px;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:0 4px 0 #0005;transition:opacity .2s}
#bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.pop{position:fixed;z-index:4;pointer-events:none;font-weight:900;font-size:20px;text-shadow:0 2px 0 #000;animation:pop .8s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-160%) scale(1.3);opacity:0}}
.combo{position:fixed;right:14px;top:calc(80px + env(safe-area-inset-top));z-index:5;text-align:right;font-weight:900;pointer-events:none;color:#ffd84a;text-shadow:0 3px 0 #000a}
.combo b{font-size:30px;display:block;line-height:1}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:#0b0816e8;backdrop-filter:blur(4px)}
.card{width:min(100%,400px);max-height:88vh;overflow:auto;background:#241a40;border:1px solid #ffffff2a;border-radius:20px;padding:20px 18px;text-align:center}
.card h2{margin:0 0 6px;font-size:22px}
.title-logo{font-size:52px;font-weight:900;line-height:1.05;letter-spacing:.04em;color:#ff4b55;text-shadow:0 5px 0 #6d0910,0 0 30px #ff4b5580;margin:8px 0}
.warn{display:inline-block;background:repeating-linear-gradient(45deg,#ffd000 0 12px,#111 12px 24px);padding:4px;border-radius:8px;margin-bottom:12px}
.warn span{display:block;background:#111;padding:6px 12px;border-radius:5px;font-weight:900;font-size:13px;color:#ffd000}
.big{display:block;width:100%;padding:15px;border-radius:16px;font-size:17px;font-weight:900;background:linear-gradient(#ff4b55,#c4121e);box-shadow:0 5px 0 #6d0910;margin-top:12px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #6d0910}
.sub{display:block;width:100%;padding:12px;border-radius:14px;font-size:15px;font-weight:800;background:#ffffff18;border:1px solid #ffffff30;margin-top:10px}
.note{font-size:12px;opacity:.65;margin-top:12px;line-height:1.6}
.zukan{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;text-align:left}
.zi{border-radius:12px;padding:8px 10px;background:#ffffff10;border:1px solid var(--c)}
.zi .r{font-size:11px;font-weight:900;color:var(--c)}
.zi .n{font-size:14px;font-weight:900}
.zi .d{font-size:11px;opacity:.7;line-height:1.4}
.zi.lock{border-color:#ffffff20;opacity:.55}
.score{font-size:64px;font-weight:900;line-height:1;margin:6px 0;color:#ffd84a;text-shadow:0 4px 0 #6b4a00}
.rank{font-size:20px;font-weight:900;margin-bottom:4px}
#count3{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;pointer-events:none;text-shadow:0 8px 0 #000a}
#flash{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;font-weight:900}
#flash.white{background:#fff;color:#111}
#flash.black{background:#000;color:#fff;pointer-events:auto}
#flash .t1{font-size:28px}
#flash .t2{font-size:16px;margin-top:14px;opacity:.8}
.credits{position:absolute;left:0;right:0;top:100%;text-align:center;line-height:2.2;font-size:17px;animation:roll 9s linear forwards}
@keyframes roll{to{transform:translateY(-200%)}}
.vign{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(circle,transparent 20%,#000 75%);opacity:0;transition:opacity .4s}
.vign.on{opacity:.9}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;background:#000d;padding:9px 16px;border-radius:12px;font-size:13px;font-weight:700;pointer-events:none}
#dark{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 52%,transparent 0 50px,#000e 150px);opacity:0;transition:opacity .25s}
#dark.on{opacity:1}
#fx{position:fixed;inset:0;z-index:12;pointer-events:none;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:900;padding:20px}
.alien{font-family:monospace;color:#6f6;background:#000d;border:2px solid #6f6;border-radius:10px;padding:16px 18px;font-size:20px;line-height:1.7;white-space:pre-line;min-width:260px;box-shadow:0 0 30px #6f68}
.slot{font-size:60px;letter-spacing:.15em;background:#000d;padding:10px 22px;border:5px solid #ffc93c;border-radius:18px;color:#ffd84a;box-shadow:0 0 40px #ffc93c88}
.vhs{font-family:monospace;font-size:30px;color:#fff;text-shadow:3px 0 #f0f,-3px 0 #0ff;background:#0008;padding:6px 14px}
.bigtxt{font-size:48px;color:#fff;text-shadow:0 5px 0 #000a;animation:bnIn .4s cubic-bezier(.2,1.6,.4,1)}

.more h3 a{font-size:12px;color:#ffd84a;text-decoration:none;white-space:nowrap}
.mrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;touch-action:pan-x pan-y;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.mrow::-webkit-scrollbar{display:none}
.mcard{flex:none;width:108px;text-decoration:none;color:#fff}

.mcard img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .hot{position:absolute;left:4px;top:4px;background:#ff3d7a;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
.mcard b{display:block;font-size:12px;margin-top:4px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mcard:active{transform:scale(.96)}
.mrow.wide .mcard{width:168px}
.mrow.wide .mcard .im{width:168px;height:80px}
.mcard i{display:block;font-style:normal;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow{display:block;margin:0 0 12px;padding:12px;border-radius:14px;background:#1d9bf0;color:#fff;text-decoration:none;text-align:center;box-shadow:0 4px 0 #0d6aa8}
.follow b{display:block;font-size:16px;font-weight:800}
.follow small{font-size:12px;opacity:.9}

    <div class="zukan" id="zkList"></div>
    <button class="sub" id="btnZkClose">とじる</button>

</div>
