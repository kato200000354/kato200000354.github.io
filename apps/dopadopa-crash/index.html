<title>ドパドパ クラッシュ3D</title>
<meta name="description" content="ネオンの道を爆走して光るクリスタルを粉砕！叩くたびに音階が上がるコンボ、倍率ゲート、FEVERで連鎖大爆発。脳汁ドパドパの3Dクラッシュゲーム。">
<meta name="theme-color" content="#07021a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#07021a;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#score{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top));text-align:center;font-weight:900;font-size:min(11vw,52px);line-height:1;letter-spacing:.02em;text-shadow:0 3px 0 #3a0060,0 0 18px rgba(255,80,240,.8);transition:transform .08s}
#score.bump{transform:scale(1.15)}
#mult{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top) + min(11vw,52px) + 4px);text-align:center;font-weight:900;font-size:20px;color:#ffe14d;text-shadow:0 0 12px #ff9d00}
#hearts{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top));font-size:22px;letter-spacing:2px;filter:drop-shadow(0 0 6px #ff2d6a)}
#dist{position:absolute;right:58px;top:calc(18px + env(safe-area-inset-top));font-weight:800;font-size:14px;opacity:.8}
#combo{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:900;line-height:1;opacity:0;transition:opacity .3s}
#combo b{display:block;font-size:min(20vw,96px);background:linear-gradient(90deg,#ff4df0,#ffe14d,#4dfcff,#7dff6a,#ff4df0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 1.2s linear infinite;filter:drop-shadow(0 4px 0 rgba(58,0,96,.9))}
#combo span{font-size:min(6vw,26px);letter-spacing:.3em;text-shadow:0 0 10px #ff4df0}
#combo.pop b{animation:rb 1.2s linear infinite,pop .18s ease-out}
@keyframes pop{0%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes rb{to{background-position:300% 0}}
#feverWrap{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(80vw,420px);height:16px;border-radius:9px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);overflow:hidden}
#feverBar{height:100%;width:0;background:linear-gradient(90deg,#ff4df0,#ffe14d,#4dfcff);background-size:200% 100%;animation:rb 1s linear infinite;transition:width .15s}
#feverLbl{position:absolute;left:0;right:0;bottom:calc(38px + env(safe-area-inset-bottom));text-align:center;font-size:12px;font-weight:800;letter-spacing:.3em;opacity:.8}
#banner{position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:900;font-size:min(16vw,84px);line-height:1;opacity:0;pointer-events:none;white-space:nowrap}
#banner.show{animation:ban 1.1s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(3) rotate(-8deg)}15%{opacity:1;transform:scale(.9) rotate(2deg)}25%{transform:scale(1.05) rotate(-1deg)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3) translateY(-30px)}}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0}
.pop{position:absolute;font-weight:900;font-size:22px;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px currentColor;animation:fl .8s ease-out forwards}
@keyframes fl{0%{opacity:1;transform:translate(-50%,-50%) scale(1.6)}20%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-220%) scale(.9)}}
#mute{position:fixed;z-index:5;right:12px;top:calc(10px + env(safe-area-inset-top));width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);font-size:16px}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(60,10,90,.55),rgba(7,2,26,.9))}
.logo{font-weight:900;line-height:1;font-size:min(15vw,80px);letter-spacing:-.02em;background:linear-gradient(90deg,#ff4df0,#ffe14d,#4dfcff,#7dff6a,#ff4df0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a0060) drop-shadow(0 0 24px rgba(255,80,240,.6));animation:rb 2.4s linear infinite,logo 1.3s ease-in-out infinite}
.logo small{display:block;font-size:.5em;margin-top:.14em;letter-spacing:.1em}
@keyframes logo{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.06)}}
.how{font-size:14px;line-height:1.9;max-width:360px;opacity:.92}
.how b{color:#ffe14d}
.big{font-weight:900;font-size:22px;padding:14px 46px;border-radius:40px;background:linear-gradient(135deg,#ff3df0,#ff8a3d);box-shadow:0 6px 0 #6a0050,0 0 30px rgba(255,61,240,.6);animation:logo 1s ease-in-out infinite}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #6a0050}
.res{font-size:16px;line-height:2}
.res .sc{font-size:min(14vw,64px);font-weight:900;color:#ffe14d;text-shadow:0 0 20px #ff9d00;line-height:1.1}
.new{color:#7dff6a;font-weight:900;animation:logo .6s ease-in-out infinite;display:inline-block}
</style>
</head>
<body>
<div id="flash"></div>
<div id="hud" hidden>
  <div id="score">0</div>
  <div id="mult"></div>
  <div id="hearts"></div>
  <div id="dist">0m</div>
  <div id="combo"><b>0</b><span>COMBO</span></div>
  <div id="banner"></div>
  <div id="feverLbl">FEVER</div>
  <div id="feverWrap"><div id="feverBar"></div></div>
</div>
<button id="mute" aria-label="音のオン・オフ">🔊</button>

<div class="ov" id="title">
  <div class="logo">ドパドパ<small>クラッシュ3D</small></div>
  <div class="how">
    左右に<b>スワイプ</b>（← → / A D キー）で移動<br>
    💎 クリスタルを<b>粉砕</b>してコンボをつなげ！<br>
    🌈 虹のリングをくぐると<b>倍率アップ</b><br>
    💣 トゲ爆弾は<b>よけろ</b>（倍率リセット）<br>
    ゲージ満タンで <b>FEVER</b> ── 全部ぶっ壊せ！
  </div>
  <button class="big" id="startBtn">スタート！</button>
</div>

<div class="ov" id="over" hidden>
  <div class="logo" style="font-size:min(11vw,56px)">GAME OVER</div>
  <div class="res" id="resTxt"></div>
  <button class="big" id="retryBtn">もう一回！</button>
</div>
