<title>ぶっ飛べ！エンジンタイヤ</title>
<meta name="description" content="手作りエンジンでタイヤを回して、離した瞬間に村をぶっ飛ばす！ヤギ・屋台・デコトラをなぎ倒して飛距離を競う3Dゲーム。">

<style>

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.stroke{text-shadow:0 2px 0 #5a2a08,2px 0 0 #5a2a08,-2px 0 0 #5a2a08,0 -2px 0 #5a2a08,0 4px 0 rgba(0,0,0,.25)}

#dist{font-size:44px;font-weight:900;line-height:1}
#dist small{font-size:20px}
#sub{font-size:13px;font-weight:800;opacity:.95;margin-top:2px}
#coinBox{background:rgba(70,30,5,.55);border-radius:20px;padding:5px 12px;font-weight:900;font-size:16px}
#gauge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 70px);width:min(320px,86vw);pointer-events:none}
#gauge .lab{text-align:center;font-weight:900;font-size:17px;margin-bottom:8px}
#bar{position:relative;height:26px;border-radius:13px;background:linear-gradient(90deg,#3d4a5a,#5d6b7b);border:3px solid #5a2a08;overflow:hidden}
#zone{position:absolute;top:0;bottom:0;background:#39d36b;box-shadow:0 0 12px #6fff9a}
#red{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,#e8322a 0 8px,#9e1a14 8px 16px)}
#fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd45a,#ff8a2a);opacity:.85}
#needle{position:absolute;top:-3px;bottom:-3px;width:5px;background:#fff;box-shadow:0 0 6px #000;border-radius:3px}
#rpmTxt{text-align:center;font-weight:900;font-size:14px;margin-top:6px}
#tapHint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);text-align:center;font-weight:900;font-size:15px;pointer-events:none;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
#steerHint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 22px);text-align:center;font-weight:800;font-size:14px;pointer-events:none;opacity:.9}
#pops{position:fixed;left:0;right:0;top:28%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.pop{font-weight:900;font-size:30px;animation:pop 1.4s ease-out forwards;white-space:nowrap}
.pop.big{font-size:46px;color:#ffe14a}
.pop.good{color:#7dff9b}
.pop.bad{color:#ff6a5a}
@keyframes pop{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}75%{opacity:1}100%{transform:translateY(-40px);opacity:0}}
.bub{position:fixed;transform:translate(-50%,-100%);background:#fff;color:#3a1c05;font-weight:900;font-size:13px;padding:5px 9px;border-radius:12px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.bub:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
#slow{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
#slowTxt{position:fixed;top:calc(env(safe-area-inset-top) + 74px);left:12px;font-weight:900;font-size:13px;color:#fff;background:#d6312a;padding:2px 8px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,16,0,.38);overflow-y:auto}
.card{width:100%;max-width:400px;background:linear-gradient(#fff6e6,#ffe7c0);color:#4a2306;border-radius:22px;padding:20px 16px;text-align:center;border:4px solid #5a2a08;box-shadow:0 8px 0 rgba(0,0,0,.25);max-height:calc(100vh - 32px);overflow-y:auto}
.logo{font-size:38px;font-weight:900;line-height:1.05;color:#fff;margin:6px 0 4px}
.logo span{display:block;font-size:20px;color:#ffd84a}
.tag{font-size:13px;font-weight:800;opacity:.8;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:900 20px "M PLUS Rounded 1c",sans-serif;background:linear-gradient(#ff9a3a,#e8571c);color:#fff;box-shadow:0 5px 0 #8a2e08;margin-top:10px;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a2e08}
.btn.sub{background:linear-gradient(#4fb0ff,#2a74d6);box-shadow:0 5px 0 #133f80;font-size:16px;padding:11px}
.btn.gray{background:linear-gradient(#9c8a78,#6e5e50);box-shadow:0 5px 0 #3e3228;font-size:15px;padding:10px}
.btn.x{background:linear-gradient(#333,#000);box-shadow:0 5px 0 #555;font-size:15px;padding:10px}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.daily{background:#fff;border-radius:14px;padding:10px;margin:10px 0 4px;font-weight:800;font-size:14px;border:2px dashed #e8571c}
.daily b{color:#e8571c}
.stat{display:flex;justify-content:space-between;font-weight:800;font-size:14px;padding:5px 2px;border-bottom:1px dashed #d9b98f}
.bigd{font-size:56px;font-weight:900;color:#e8571c;line-height:1}
.bigd small{font-size:24px}
.title{display:inline-block;margin:8px 0;background:#4a2306;color:#ffd84a;font-weight:900;font-size:20px;padding:6px 14px;border-radius:12px}
.new{display:inline-block;background:#e8322a;color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}
h2{font-size:24px;font-weight:900;margin-bottom:6px}
h3{font-size:16px;font-weight:900;margin:14px 0 6px;text-align:left}
.item{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:8px;margin-bottom:6px;text-align:left;border:2px solid transparent}
.item.on{border-color:#e8571c}
.item .nm{font-weight:900;font-size:14px}
.item .ds{font-size:11px;font-weight:700;opacity:.75}
.item .bars{font-size:11px;font-weight:800;color:#e8571c}
.item button{margin-left:auto;flex:none;border:0;border-radius:10px;padding:8px 10px;font:900 13px "M PLUS Rounded 1c",sans-serif;background:#2a74d6;color:#fff;min-width:74px;cursor:pointer}
.item button:disabled{background:#bbb}
.item button.eq{background:#39a35a}
.coinL{font-weight:900;font-size:18px;color:#e8571c}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;text-align:left}
.tlist div{background:#fff;border-radius:10px;padding:6px 8px;font-size:12px;font-weight:800}
.tlist div.lock{opacity:.4}
.tlist div small{display:block;font-size:10px;opacity:.7;font-weight:700}
.small{font-size:12px;font-weight:700;opacity:.75;margin-top:10px}
a.more{color:#2a74d6;font-weight:800;font-size:13px}
#shareImg{width:100%;border-radius:12px;margin-top:10px}
</style>

<div id="hud" hidden>
  <div><div id="dist" class="stroke">0.0<small> m</small></div><div id="sub" class="stroke"></div></div>
  <div id="coinBox">🪙 <span id="coinN">0</span></div>
</div>
<div id="gauge" hidden>
  <div class="lab stroke" id="gLab">長押しでエンジンをふかせ！</div>
  <div id="bar"><div id="fill"></div><div id="zone"></div><div id="red"></div><div id="needle"></div></div>
  <div id="rpmTxt" class="stroke">0 rpm</div>
</div>
<div id="tapHint" class="stroke" hidden>👆 画面を長押し → 緑で離す！</div>
<div id="steerHint" class="stroke" hidden>👈 左右にスワイプで曲がる 👉</div>
<div id="pops"></div>
<div id="bubs"></div>
<div id="slow"></div><div id="slowTxt">SLOW</div>
<div id="flash"></div>

<div id="titleOv" class="ov">
  <div class="card" style="background:linear-gradient(#ffb04a,#e8571c);color:#fff">
    <div class="logo stroke"><span>パキスタン式</span>ぶっ飛べ！<br>エンジンタイヤ</div>
    <div class="tag">エンジンでタイヤを回して、離せば村を爆走！</div>
    <div class="daily" style="color:#4a2306" id="dailyBox"></div>
    <div style="font-weight:900;font-size:14px;margin-top:6px" id="bestLine"></div>
    <button class="btn" id="startBtn" style="background:linear-gradient(#ffe14a,#ffb21c);color:#5a2a08;box-shadow:0 5px 0 #8a5a08;font-size:24px">🔥 回す！</button>
    <div class="row"><button class="btn sub" id="garageBtn">🔧 ガレージ</button><button class="btn sub" id="titlesBtn">🏅 称号</button></div>
    <div class="small" style="color:#fff">コースは毎日0時に変わる（その日は全員同じコース）</div>
    <div class="small"><a class="more" style="color:#fff" href="https://kato200000354.github.io/">🎮 ほかのゲームも遊ぶ</a></div>
  </div>
</div>

<div id="garageOv" class="ov" hidden>
  <div class="card">
    <h2>🔧 ガレージ</h2>
    <div class="coinL">🪙 <span id="gCoin">0</span></div>
    <h3>エンジン</h3><div id="engList"></div>
    <h3>タイヤ</h3><div id="tyrList"></div>
    <button class="btn" id="gBack">もどる</button>
  </div>
</div>

<div id="titlesOv" class="ov" hidden>
  <div class="card">
    <h2>🏅 称号コレクション</h2>
    <div style="font-weight:800;margin-bottom:8px" id="tCount"></div>
    <div class="tlist" id="tList"></div>
    <button class="btn" id="tBack">もどる</button>
  </div>
</div>

<div id="resultOv" class="ov" hidden>
  <div class="card">
    <div style="font-weight:900;font-size:15px" id="rHead">記録</div>
    <div class="bigd" id="rDist">0<small>m</small></div>
    <div class="title" id="rTitle"></div>
    <div id="rBest" style="font-weight:900;color:#e8322a;font-size:15px"></div>
    <div id="rStats" style="margin-top:6px"></div>
    <div class="daily" id="rDaily"></div>
    <button class="btn" id="againBtn">🔥 もう一回</button>
    <div class="row"><button class="btn sub" id="shareBtn">📸 画像で自慢</button><button class="btn x" id="xBtn">𝕏 ポスト</button></div>
    <div class="row"><button class="btn gray" id="rGarage">🔧 ガレージ</button><button class="btn gray" id="rTitle2">タイトル</button></div>
    <img id="shareImg" hidden alt="結果画像">
    <div class="small" id="shareNote" hidden>画像を長押しで保存できます</div>
  </div>
</div>
