<title>沈鐘の城</title>
<meta name="description" content="湖の底に沈んだ城を、たいまつ一本で降りていく。骨兵や大槌の番人と戦いながら鍵を集め、最下層の鐘を鳴らせ。一人称で歩く、昔ながらの3DダンジョンRPG。">
<meta name="theme-color" content="#050506">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050506;color:#e6dcc8;
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none}
#stats{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));width:min(44vw,210px)}
.bar{position:relative;height:14px;background:rgba(0,0,0,.6);border:1px solid rgba(230,220,200,.35);margin-bottom:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#9c2428;transition:width .15s}
.bar.mp i{background:#2d58a8}
.bar.gg i{background:#8a7232;transition:none}
.bar.gg.full i{background:#f0cf73}
.bar span{position:absolute;left:5px;top:0;font-size:11px;line-height:13px;text-shadow:0 1px 2px #000;white-space:nowrap}
#lvl{font-size:12px;opacity:.85;text-shadow:0 1px 2px #000}
#mini{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:96px;height:96px;border-radius:50%;border:1px solid rgba(230,220,200,.35);background:rgba(0,0,0,.55)}
#fname{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:22px;letter-spacing:.25em;opacity:0;transition:opacity 1.4s;text-shadow:0 2px 10px #000}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:rgba(230,220,200,.45);border-radius:50%}
#prompt{position:absolute;left:50%;top:60%;transform:translateX(-50%);padding:5px 12px;background:rgba(0,0,0,.6);border:1px solid rgba(230,220,200,.3);font-size:14px;white-space:nowrap}
#log{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(92vw,560px);text-align:center;font-size:14px;line-height:1.55;text-shadow:0 1px 3px #000,0 0 6px #000}
#log div{transition:opacity .8s}
body.touch #log{bottom:auto;top:calc(112px + env(safe-area-inset-top));font-size:13px;width:min(94vw,520px)}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));width:min(60vw,380px);text-align:center;font-size:13px;letter-spacing:.2em;text-shadow:0 1px 3px #000}
body.touch #bossbar{top:calc(84px + env(safe-area-inset-top))}
#bossbar .bar{margin-top:3px;height:8px}
#bossbar .bar i{background:#b0302a}
#flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(150,0,0,.75));opacity:0}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
.num{position:absolute;font-size:17px;font-weight:bold;color:#ffe6a8;text-shadow:0 1px 3px #000,0 0 4px #000;transform:translate(-50%,-50%);white-space:nowrap}
.num.crit{color:#ffd040;font-size:21px}
/* touch */
#touch{position:fixed;inset:0;touch-action:none}
#joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:1px solid rgba(230,220,200,.3);background:rgba(0,0,0,.2);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(230,220,200,.3)}
.tb{position:absolute;width:58px;height:58px;border-radius:50%;border:1px solid rgba(230,220,200,.38);background:rgba(10,10,10,.42);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;touch-action:none}
.tb.on{background:rgba(230,200,140,.3)}
.tb small{font-size:10px;opacity:.8}
#tAtk{right:calc(16px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:82px;height:82px;font-size:17px}
#tUse{right:calc(110px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}
#tMag{right:calc(102px + env(safe-area-inset-right));bottom:calc(88px + env(safe-area-inset-bottom))}
#tHerb{right:calc(28px + env(safe-area-inset-right));bottom:calc(122px + env(safe-area-inset-bottom))}
#tMap,#tMenu{width:44px;height:44px;font-size:12px;top:calc(114px + env(safe-area-inset-top))}
#tMap{right:calc(62px + env(safe-area-inset-right))}
#tMenu{right:calc(12px + env(safe-area-inset-right))}
body.touch #log{width:min(60vw,400px);left:calc(10px + env(safe-area-inset-left));transform:none;text-align:left}
/* screens */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;touch-action:pan-y}
.box{width:min(100%,460px);background:rgba(8,7,6,.86);border:1px solid rgba(230,220,200,.25);padding:22px 20px;text-align:center}
.scr button.b{display:block;width:100%;margin:10px 0 0;padding:12px 10px;background:rgba(60,48,32,.6);border:1px solid rgba(230,220,200,.35);font-size:16px;letter-spacing:.1em;cursor:pointer}
.scr button.b:hover{background:rgba(90,70,44,.7)}
.scr button.b.sm{font-size:14px;padding:9px}
#title{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.65))}
#title .box{background:rgba(5,5,6,.55);border:none}
#title h1{font-size:46px;letter-spacing:.3em;margin:6px 0 10px;padding-left:.3em;font-weight:normal;text-shadow:0 0 18px rgba(240,200,120,.35)}
#title .sub{font-size:11px;letter-spacing:.35em;opacity:.6}
#title .tag{font-size:13px;line-height:1.8;opacity:.85;margin-bottom:12px}
.story{font-size:15px;line-height:2;text-align:left;white-space:pre-line}
.small{font-size:12px;opacity:.7;margin-top:10px;line-height:1.6}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(94vw,560px);background:rgba(6,6,8,.9);border:1px solid rgba(230,220,200,.3);padding:14px 16px 26px;font-size:15px;line-height:1.8;min-height:96px;cursor:pointer}
#talk b{display:block;font-size:12px;opacity:.6;font-weight:normal;margin-bottom:2px}
#talk .nx{position:absolute;right:12px;bottom:6px;font-size:11px;opacity:.6}
#menu .box{text-align:left}
#menu h2{font-size:18px;font-weight:normal;letter-spacing:.2em;margin-bottom:10px;text-align:center}
.st{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;margin-bottom:12px}
.st b{font-weight:normal;opacity:.65}
.inv{font-size:14px;line-height:1.9}
.inv .row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(230,220,200,.12);padding:3px 0}
.inv button{padding:3px 12px;background:rgba(60,48,32,.6);border:1px solid rgba(230,220,200,.35);cursor:pointer}
.inv button:disabled{opacity:.35}
.two{display:flex;gap:8px}.two button.b{flex:1}
#mapv{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#bigmap{max-width:94vw;max-height:78vh}
#mapv p{font-size:13px;opacity:.75}
#guide{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,400px);background:rgba(0,0,0,.55);border:1px solid rgba(230,220,200,.25);padding:14px 16px;font-size:14px;line-height:1.9;pointer-events:none;transition:opacity 1s}
#guide h3{font-size:13px;font-weight:normal;opacity:.6;letter-spacing:.2em;margin-bottom:4px}
#guide kbd{display:inline-block;min-width:1.6em;padding:0 5px;border:1px solid rgba(230,220,200,.45);border-radius:3px;font-family:inherit;font-size:12px;text-align:center;margin-right:2px}
body.touch #guide{top:42%}
.keyhelp{font-size:12px;opacity:.7;line-height:1.8;margin-top:12px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div id="stats">
    <div class="bar hp"><i></i><span></span></div>
    <div class="bar mp"><i></i><span></span></div>
    <div class="bar gg"><i></i><span>力</span></div>
    <div id="lvl"></div>
  </div>
  <canvas id="mini" width="192" height="192"></canvas>
  <div id="bossbar" hidden>鐘　守<div class="bar"><i></i></div></div>
  <div id="cross"></div>
  <div id="fname"></div>
  <div id="prompt" hidden></div>
  <div id="log"></div>
  <div id="nums"></div>
  <div id="flash"></div>
</div>

<div id="touch" hidden>
  <div id="joy"><i></i></div>
  <button class="tb" id="tAtk">攻撃</button>
  <button class="tb" id="tUse">調べる</button>
  <button class="tb" id="tMag">魔法<small>MP3</small></button>
  <button class="tb" id="tHerb">薬草<small id="herbN">×0</small></button>
  <button class="tb" id="tMap">地図</button>
  <button class="tb" id="tMenu">≡</button>
</div>

<div id="guide" hidden></div>

<div id="talk" hidden><b id="talkWho"></b><div id="talkTx"></div><span class="nx">▼ タップ／E</span></div>

<div id="mapv" hidden><canvas id="bigmap" width="640" height="520"></canvas><p id="mapName"></p><p>閉じる：M／タップ</p></div>

<div id="title" class="scr">
  <div class="box">
    <div class="sub">THE SUNKEN BELL KEEP</div>
    <h1>沈鐘の城</h1>
    <p class="tag">湖の底に沈んだ城を、たいまつ一本で降りていく。<br>一人称で歩いて戦う、昔ながらのダンジョンRPG。</p>
    <button class="b" id="bCont" hidden>つづきから</button>
    <button class="b" id="bNew">はじめから</button>
    <p class="small" id="tHint">ヘッドホン推奨／約30〜40分</p>
  </div>
</div>

<div id="intro" class="scr" hidden>
  <div class="box">
    <p class="story">霧の湖のまんなかに、鐘楼の先だけが突き出ている。
百年前の嵐の夜、鐘が鳴りやむと同時に、城は湖の底へ沈んだという。

鐘がふたたび鳴れば、城は地上へ帰る——
言い伝えを胸に、あなたは湖底へ続く石段を降りた。</p>
    <button class="b" id="bGo">降りていく</button>
  </div>
</div>

<div id="menu" class="scr" hidden><div class="box" id="menuBox"></div></div>

<div id="dead" class="scr" hidden>
  <div class="box">
    <p class="story" style="text-align:center">あなたは力尽きた……</p>
    <button class="b" id="bRetry">泉で記録したところから</button>
    <button class="b sm" id="bDeadTitle">タイトルへ</button>
  </div>
</div>

<div id="ending" class="scr" hidden>
  <div class="box">
    <p class="story" id="endTx"></p>
    <p class="small" id="endSt"></p>
    <button class="b" id="bEndTitle">タイトルへ</button>
  </div>
</div>

<div id="fade"></div>
