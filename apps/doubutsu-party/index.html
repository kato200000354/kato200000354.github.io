<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<title>どうぶつパーティー島</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{
  --navy:#17427e; --navy2:#2a68b8; --ink:#24324a; --y1:#ffd84a; --y2:#ffa31a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{font-size:clamp(9px, min(1.2vw, 1.85vh), 16px)}
body{background:#a9dcf7;overflow:hidden;color:var(--ink);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;font-weight:800}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.layer button,.layer .pe{pointer-events:auto}
.panel{background:linear-gradient(180deg,rgba(30,78,148,.93),rgba(16,46,98,.93));color:#fff;border-radius:1rem;
  box-shadow:0 .3rem 1rem rgba(0,30,80,.3), inset 0 0 0 2px rgba(255,255,255,.22)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:1rem;
  background:linear-gradient(180deg,#2f75c9,#1b4c93);color:#fff;font-size:1.25rem;box-shadow:0 .3rem 0 #123566;transition:transform .08s}
.btn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 #123566}
.btn.y{background:linear-gradient(180deg,#ffe066,#ffaa1d);color:#5a3200;box-shadow:0 .3rem 0 #d57a00}
.btn.y:active{box-shadow:0 .1rem 0 #d57a00}
.btn.g{background:linear-gradient(180deg,#f1f3f6,#cfd6e0);color:#33445e;box-shadow:0 .3rem 0 #9aa6b8}
.btn.big{font-size:1.7rem;padding:1rem 2.6rem;border-radius:3rem}
.btn:disabled{filter:grayscale(.7) brightness(.85);cursor:default}

/* ---------- ボードHUD ---------- */
#plist{position:absolute;left:max(1rem,env(safe-area-inset-left));top:1rem;display:flex;flex-direction:column;gap:.55rem}
.pc{position:relative;display:flex;align-items:center;gap:.6rem;padding:.35rem 1rem .35rem .35rem;min-width:13.5rem;
  border-radius:3rem 1rem 1rem 3rem;transition:transform .25s, box-shadow .25s}
.pc img{width:4.2rem;height:4.2rem;border-radius:50%;border:.22rem solid var(--c);background:#fff;flex:none}
.pc .tag{position:absolute;left:.1rem;top:-.4rem;background:var(--c);color:#fff;font-size:.78rem;padding:.05rem .5rem;border-radius:1rem;border:2px solid #fff}
.pc .nm{font-size:1.15rem;line-height:1.2}
.pc .st{display:flex;gap:.8rem;font-size:1.05rem;line-height:1.3}
.pc .it{font-size:.9rem;min-height:1.1em;letter-spacing:.1em}
.pc.on{transform:translateX(.7rem) scale(1.06);box-shadow:0 0 0 .2rem var(--c),0 0 1.2rem var(--c)}
#turnBox{position:absolute;right:1rem;top:1rem;padding:.5rem 1.3rem;font-size:1.25rem;border-radius:2rem}
#turnBox b{font-size:2rem}
#side{position:absolute;right:1rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.7rem}
#side button{width:5.2rem;height:5.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:2rem;border-radius:1rem}
#side button span{font-size:.85rem}
#side button.on{box-shadow:0 0 0 .2rem var(--y1), inset 0 0 0 2px rgba(255,255,255,.3)}
#area{position:absolute;left:1rem;bottom:1rem;display:flex;align-items:center;gap:.8rem;padding:.5rem 1.6rem .5rem .5rem;border-radius:3rem 1rem 1rem 3rem}
#area .ic{width:4.6rem;height:4.6rem;border-radius:50%;background:radial-gradient(#e8f7ff,#9ed3f2);display:grid;place-items:center;font-size:2.4rem;border:.2rem solid #fff}
#area b{font-size:1.4rem;display:block}
#area small{font-size:.9rem;opacity:.85}
#rollPanel{position:absolute;left:50%;bottom:1.4rem;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1rem}
.bubble{position:relative;background:#fff;color:#24324a;border-radius:2rem;padding:.9rem 1.6rem;font-size:1.2rem;text-align:center;line-height:1.5;
  box-shadow:0 .3rem 1rem rgba(0,0,0,.15)}
.bubble small{font-size:.85rem;color:#5b6d88}
#rollPanel .bubble:after{content:"";position:absolute;left:50%;bottom:-.8rem;margin-left:-.8rem;border:.8rem solid transparent;border-bottom:0;border-top-color:#fff}
#bRoll{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none}
#banner div{display:inline-block;padding:.8rem 3rem;font-size:2.2rem;color:#fff;border-radius:3rem;background:var(--c,#2a68b8);
  box-shadow:0 .4rem 1.4rem rgba(0,0,0,.25), inset 0 0 0 .25rem rgba(255,255,255,.5);animation:bnr 1.6s forwards;text-shadow:0 .15rem 0 rgba(0,0,0,.2)}
@keyframes bnr{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-1rem)}}
#toast{position:absolute;left:50%;top:5.5rem;transform:translateX(-50%);padding:.6rem 1.4rem;border-radius:2rem;font-size:1.1rem;transition:opacity .3s}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:2rem;font-weight:900;white-space:nowrap;
  -webkit-text-stroke:.35rem #fff;paint-order:stroke fill;text-shadow:0 .2rem .4rem rgba(0,0,0,.25)}
#steps{position:absolute;transform:translate(-50%,-50%);width:4rem;height:4rem;border-radius:50%;background:#fff;color:#1b4c93;
  display:grid;place-items:center;font-size:2.4rem;border:.3rem solid #1b4c93;box-shadow:0 .3rem .6rem rgba(0,0,0,.25)}
.ntag{position:absolute;transform:translate(-50%,-100%);padding:.1rem .6rem;border-radius:1rem;color:#fff;font-size:1rem;border:2px solid #fff;white-space:nowrap}

/* ---------- ダイアログ ---------- */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,30,60,.35);padding:1rem}
.dbox{background:#fff;border-radius:1.6rem;min-width:min(26rem,92vw);max-width:min(40rem,94vw);max-height:90vh;overflow:auto;
  box-shadow:0 1rem 3rem rgba(0,20,60,.35);animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.dbox h2{margin:0;padding:1rem 1.6rem;background:linear-gradient(180deg,#2f75c9,#1b4c93);color:#fff;font-size:1.6rem;border-radius:1.6rem 1.6rem 0 0;text-align:center}
.dbody{padding:1.3rem 1.6rem;font-size:1.2rem;line-height:1.7;text-align:center}
.dbtns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;padding:0 1.4rem 1.4rem}
.bigEmoji{font-size:4.5rem;line-height:1.2}
.itemRow{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;padding:.7rem 1rem;margin:.4rem 0;border-radius:1rem;background:#f1f6fd;border:2px solid #d6e4f6;font-size:1.15rem}
.itemRow .e{font-size:2.4rem}
.itemRow small{display:block;font-size:.9rem;color:#5b6d88}
button.itemRow:hover{background:#e3eefc}
.rk{display:flex;align-items:center;gap:.8rem;padding:.4rem .8rem;margin:.35rem 0;border-radius:1rem;background:#f4f7fb;text-align:left}
.rk img{width:3rem;height:3rem;border-radius:50%;border:3px solid var(--c)}
.rk .n{flex:1}
.rk .r{width:3rem;font-size:1.4rem;color:#1b4c93}
.rk .c{color:#e09000;font-size:1.3rem}
.rules{text-align:left;font-size:1.05rem;line-height:1.75;margin:0;padding-left:1.3rem}
.rules li{margin:.2rem 0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid #e3e9f2}
.seg{display:inline-flex;background:#e3eaf4;border-radius:2rem;padding:.25rem}
.seg button{padding:.4rem 1.1rem;border-radius:2rem;font-size:1.1rem;color:#4a5b75}
.seg button.on{background:#1b4c93;color:#fff}
#menu{z-index:20}
.mbtns{display:flex;flex-direction:column;gap:.7rem;padding:1.2rem 1.6rem}
.mbtns .btn{justify-content:flex-start}

/* ---------- ミニゲームHUD ---------- */
#mgTitle{position:absolute;left:1rem;top:1rem;display:flex;align-items:center;gap:.9rem;padding:.7rem 1.6rem .7rem .8rem;max-width:min(36rem,70vw)}
#mgTitle .ic{width:3.6rem;height:3.6rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2rem;flex:none}
#mgTitle b{font-size:1.5rem;display:block}
#mgTitle small{font-size:.95rem;opacity:.9}
#mgTimer{position:absolute;right:1rem;top:1rem;padding:.4rem 1.4rem;font-size:2.4rem;border-radius:2rem}
#mgHelp{position:absolute;right:1rem;top:50%;transform:translateY(-50%);padding:.9rem 1.1rem;font-size:.95rem;text-align:center;line-height:1.6}
#mgHelp b{display:block;font-size:1.1rem;margin-bottom:.3rem}
#mgStatus{position:absolute;left:50%;transform:translateX(-50%);bottom:1rem;display:flex;gap:.6rem;flex-wrap:nowrap}
.ms{display:flex;align-items:center;gap:.4rem;padding:.25rem 1rem .25rem .25rem;border-radius:3rem;background:linear-gradient(90deg,var(--c),rgba(16,46,98,.9));color:#fff}
.ms img{width:3rem;height:3rem;border-radius:50%;border:2px solid #fff;background:#fff}
.ms .v{font-size:1.15rem;line-height:1.2}
.ms small{font-size:.8rem;display:block}
#pads{position:absolute;left:0;right:0;bottom:6rem;display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap;padding:0 1rem}
#pads.solo{bottom:1rem;justify-content:space-between}
.pad{display:flex;gap:.5rem;align-items:center;padding:.4rem;border-radius:1.2rem;background:rgba(255,255,255,.25);border:.2rem solid var(--c)}
.pad span{color:#fff;background:var(--c);border-radius:1rem;padding:.1rem .5rem;font-size:.9rem}
.pad button{width:4.6rem;height:4.6rem;border-radius:1rem;background:rgba(255,255,255,.85);color:#1b4c93;font-size:2rem;box-shadow:0 .25rem 0 rgba(0,0,0,.2)}
.pad button.dn{transform:translateY(.15rem);background:#ffe27a}
#pads.solo .pad{background:none;border:0;gap:1rem}
#pads.solo .pad button{width:6.5rem;height:6.5rem;font-size:2.8rem;opacity:.85}
#pads.solo{bottom:6.5rem}
#countdown{position:absolute;left:0;right:0;top:35%;text-align:center;font-size:8rem;color:#fff;font-weight:900;
  -webkit-text-stroke:.6rem #1b4c93;paint-order:stroke fill;text-shadow:0 .5rem 1rem rgba(0,0,0,.3)}
#countdown.anim{animation:cd .8s}
@keyframes cd{from{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}}

/* ---------- タイトル ---------- */
#title{background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(10,40,90,.35))}
.tbox{width:min(46rem,96vw);text-align:center}
.logo small{display:inline-block;background:#fff;color:#ef5d8e;border-radius:2rem;padding:.2rem 1.2rem;font-size:1.2rem}
.logo h1{margin:.4rem 0 1rem;font-size:4rem;line-height:1.1;color:#fff;font-weight:900;letter-spacing:.05em;
  -webkit-text-stroke:.55rem #1b4c93;paint-order:stroke fill;text-shadow:0 .5rem 0 #0f2f63}
.logo h1 span{color:#ffd84a}
.tpanel{background:rgba(255,255,255,.93);border-radius:1.6rem;padding:1.2rem;box-shadow:0 .8rem 2rem rgba(0,30,80,.3)}
#selChars{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.sc{border-radius:1.2rem;padding:.6rem .3rem;background:var(--bg);border:.2rem solid var(--c);display:flex;flex-direction:column;align-items:center;gap:.3rem}
.sc img{width:5rem;height:5rem;border-radius:50%;background:#fff;border:.2rem solid #fff}
.sc b{font-size:1.2rem}
.sc .tg{font-size:1rem;padding:.25rem .9rem;border-radius:2rem;background:#fff;color:#7a8799;border:2px solid #cfd8e4}
.sc.h .tg{background:var(--c);color:#fff;border-color:var(--c)}
.trow{display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap;font-size:1.2rem}
.tnote{font-size:.9rem;color:#5b6d88;margin-top:.6rem}

/* ---------- 結果 ---------- */
#results{background:rgba(160,215,250,.55)}
.rbox{width:min(50rem,96vw);text-align:center}
.ribbon{display:inline-block;background:linear-gradient(180deg,#2f75c9,#17427e);color:#fff;font-size:2.6rem;padding:.6rem 4rem;border-radius:.6rem;
  box-shadow:0 .4rem 0 #0f2f63;position:relative;margin-bottom:1.4rem}
.rcards{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;align-items:end}
.rcard{border-radius:1.2rem;background:var(--bg);border:.25rem solid #fff;box-shadow:0 .4rem 1rem rgba(0,0,0,.18);overflow:hidden;animation:pop .5s backwards}
.rcard .rn{font-size:2.4rem;color:var(--c);-webkit-text-stroke:.3rem #fff;paint-order:stroke fill;margin-top:.3rem}
.rcard img{width:80%;border-radius:50%;background:#fff;margin:.3rem 0}
.rcard .bar{background:var(--c);color:#fff;padding:.4rem .2rem .6rem}
.rcard .bar b{font-size:1.2rem;display:block}
.rcard .bar span{font-size:1.5rem}
.rcard .bar small{font-size:1rem;opacity:.9}
.rfoot{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-top:1.4rem;flex-wrap:wrap}

@media (orientation:portrait){
  html{font-size:clamp(8px, 2.3vw, 14px)}
  #area{display:none}
  #side{top:auto;bottom:13rem;transform:none}
  #side button{width:4.4rem;height:4.4rem}
  .pc{min-width:11.5rem}
  .pc img{width:3.4rem;height:3.4rem}
  #mgHelp{display:none}
  #mgStatus{gap:.3rem}
  .ms{padding-right:.5rem}
  .ms img{width:2.4rem;height:2.4rem}
  .logo h1{font-size:3rem}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"><div id="steps" hidden></div></div>

<div id="hud" class="layer" hidden>
  <div id="plist"></div>
  <div id="turnBox" class="panel"><b id="turnNow">1</b> / <span id="turnMax">10</span> ターン</div>
  <div id="side">
    <button class="panel" id="bMap">🗺️<span>マップ</span></button>
    <button class="panel" id="bItem">🎒<span>アイテム</span></button>
    <button class="panel" id="bMenu">☰<span>メニュー</span></button>
  </div>
  <div id="area" class="panel"><div class="ic" id="areaIc">🌳</div><div><b id="areaName">はじまりの森</b><small id="areaSub">たくさんの冒険が待っている…</small></div></div>
  <div id="rollPanel" hidden>
    <div class="bubble" id="rollMsg">サイコロをふって<br>マスを進みましょう！</div>
    <button class="btn y big" id="bRoll">🎲 サイコロをふる</button>
  </div>
  <div id="banner"></div>
  <div id="toast" class="panel" hidden></div>
</div>

<div id="mgHud" class="layer" hidden>
  <div id="mgTitle" class="panel"><div class="ic" id="mgIc">🎮</div><div><b id="mgName"></b><small id="mgDesc"></small></div></div>
  <div id="mgTimer" class="panel">⏱ <b id="mgTime">45</b></div>
  <div id="mgHelp" class="panel"></div>
  <div id="pads"></div>
  <div id="mgStatus"></div>
  <div id="countdown"></div>
</div>

<div id="title" class="ov">
  <div class="tbox">
    <div class="logo"><small>みんなで あそぼう！</small><h1>どうぶつ<br><span>パーティー</span>アイランド</h1></div>
    <div class="tpanel">
      <div id="selChars"></div>
      <div class="tnote">カードをタップして「あなた」と「CPU」を切りかえ（1台で4人まであそべます）</div>
      <div class="trow">ターン数
        <div class="seg" id="segTurn"><button data-v="5">5</button><button data-v="10" class="on">10</button><button data-v="15">15</button><button data-v="20">20</button></div>
      </div>
      <div class="trow">
        <button class="btn y big" id="bStart">▶ はじめる！</button>
        <button class="btn" id="bCont" hidden>つづきから</button>
        <button class="btn g" id="bRules">ルール説明</button>
      </div>
    </div>
  </div>
</div>

<div id="results" class="ov" hidden>
  <div class="rbox">
    <div class="ribbon">みんなの結果</div>
    <div class="rcards" id="rcards"></div>
    <div class="rfoot"><div class="bubble" id="rmsg"></div><button class="btn y big" id="bRes">タイトルへ ›</button></div>
  </div>
</div>

<div id="dlg" class="ov" hidden><div class="dbox"><h2 id="dlgT"></h2><div class="dbody" id="dlgB"></div><div class="dbtns" id="dlgBtns"></div></div></div>
<div id="menu" class="ov" hidden><div class="dbox"><h2 id="menuT">メニュー</h2><div id="menuB"></div></div></div>
