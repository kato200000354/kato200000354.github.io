<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>どうぶつパーティー島</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{
  --navy:#17427e; --navy2:#2a68b8; --ink:#24324a; --y1:#ffd84a; --y2:#ffa31a;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{font-size:clamp(9px, min(1.2vw, 1.85vh), 16px)}
body{background:#a9dcf7;overflow:hidden;color:var(--ink);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;font-weight:800}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;pointer-events:none}
.layer button,.layer .pe{pointer-events:auto}
.panel{background:linear-gradient(180deg,rgba(30,78,148,.93),rgba(16,46,98,.93));color:#fff;border-radius:1rem;
  box-shadow:0 .3rem 1rem rgba(0,30,80,.3), inset 0 0 0 2px rgba(255,255,255,.22)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.6rem;border-radius:1rem;
  background:linear-gradient(180deg,#2f75c9,#1b4c93);color:#fff;font-size:1.25rem;box-shadow:0 .3rem 0 #123566;transition:transform .08s}
.btn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 #123566}
.btn.y{background:linear-gradient(180deg,#ffe066,#ffaa1d);color:#5a3200;box-shadow:0 .3rem 0 #d57a00}
.btn.y:active{box-shadow:0 .1rem 0 #d57a00}
.btn.g{background:linear-gradient(180deg,#f1f3f6,#cfd6e0);color:#33445e;box-shadow:0 .3rem 0 #9aa6b8}
.btn.big{font-size:1.7rem;padding:1rem 2.6rem;border-radius:3rem}
.btn:disabled{filter:grayscale(.7) brightness(.85);cursor:default}

/* ---------- ボードHUD ---------- */
#plist{position:absolute;left:max(1rem,env(safe-area-inset-left));top:1rem;display:flex;flex-direction:column;gap:.55rem}
.pc{position:relative;display:flex;align-items:center;gap:.6rem;padding:.35rem 1rem .35rem .35rem;min-width:13.5rem;
  border-radius:3rem 1rem 1rem 3rem;transition:transform .25s, box-shadow .25s}
.pc img{width:4.2rem;height:4.2rem;border-radius:50%;border:.22rem solid var(--c);background:#fff;flex:none}
.pc .tag{position:absolute;left:.1rem;top:-.4rem;background:var(--c);color:#fff;font-size:.78rem;padding:.05rem .5rem;border-radius:1rem;border:2px solid #fff}
.pc .nm{font-size:1.15rem;line-height:1.2}
.pc .st{display:flex;gap:.8rem;font-size:1.05rem;line-height:1.3}
.pc .it{font-size:.9rem;min-height:1.1em;letter-spacing:.1em}
.pc.on{transform:translateX(.7rem) scale(1.06);box-shadow:0 0 0 .2rem var(--c),0 0 1.2rem var(--c)}
#turnBox{position:absolute;right:1rem;top:1rem;padding:.5rem 1.3rem;font-size:1.25rem;border-radius:2rem}
#turnBox b{font-size:2rem}
#side{position:absolute;right:1rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.7rem}
#side button{width:5.2rem;height:5.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;font-size:2rem;border-radius:1rem}
#side button span{font-size:.85rem}
#side button.on{box-shadow:0 0 0 .2rem var(--y1), inset 0 0 0 2px rgba(255,255,255,.3)}
#area{position:absolute;left:1rem;bottom:1rem;display:flex;align-items:center;gap:.8rem;padding:.5rem 1.6rem .5rem .5rem;border-radius:3rem 1rem 1rem 3rem}
#area .ic{width:4.6rem;height:4.6rem;border-radius:50%;background:radial-gradient(#e8f7ff,#9ed3f2);display:grid;place-items:center;font-size:2.4rem;border:.2rem solid #fff}
#area b{font-size:1.4rem;display:block}
#area small{font-size:.9rem;opacity:.85}
#rollPanel{position:absolute;left:50%;bottom:1.4rem;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1rem}
.bubble{position:relative;background:#fff;color:#24324a;border-radius:2rem;padding:.9rem 1.6rem;font-size:1.2rem;text-align:center;line-height:1.5;
  box-shadow:0 .3rem 1rem rgba(0,0,0,.15)}
.bubble small{font-size:.85rem;color:#5b6d88}
#rollPanel .bubble:after{content:"";position:absolute;left:50%;bottom:-.8rem;margin-left:-.8rem;border:.8rem solid transparent;border-bottom:0;border-top-color:#fff}
#bRoll{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none}
#banner div{display:inline-block;padding:.8rem 3rem;font-size:2.2rem;color:#fff;border-radius:3rem;background:var(--c,#2a68b8);
  box-shadow:0 .4rem 1.4rem rgba(0,0,0,.25), inset 0 0 0 .25rem rgba(255,255,255,.5);animation:bnr 1.6s forwards;text-shadow:0 .15rem 0 rgba(0,0,0,.2)}
@keyframes bnr{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-1rem)}}
#toast{position:absolute;left:50%;top:5.5rem;transform:translateX(-50%);padding:.6rem 1.4rem;border-radius:2rem;font-size:1.1rem;transition:opacity .3s}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-size:2rem;font-weight:900;white-space:nowrap;
  -webkit-text-stroke:.35rem #fff;paint-order:stroke fill;text-shadow:0 .2rem .4rem rgba(0,0,0,.25)}
#steps{position:absolute;transform:translate(-50%,-50%);width:4rem;height:4rem;border-radius:50%;background:#fff;color:#1b4c93;
  display:grid;place-items:center;font-size:2.4rem;border:.3rem solid #1b4c93;box-shadow:0 .3rem .6rem rgba(0,0,0,.25)}
.ntag{position:absolute;transform:translate(-50%,-100%);padding:.1rem .6rem;border-radius:1rem;color:#fff;font-size:1rem;border:2px solid #fff;white-space:nowrap}

/* ---------- ダイアログ ---------- */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,30,60,.35);padding:1rem}
.dbox{background:#fff;border-radius:1.6rem;min-width:min(26rem,92vw);max-width:min(40rem,94vw);max-height:90vh;overflow:auto;
  box-shadow:0 1rem 3rem rgba(0,20,60,.35);animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.dbox h2{margin:0;padding:1rem 1.6rem;background:linear-gradient(180deg,#2f75c9,#1b4c93);color:#fff;font-size:1.6rem;border-radius:1.6rem 1.6rem 0 0;text-align:center}
.dbody{padding:1.3rem 1.6rem;font-size:1.2rem;line-height:1.7;text-align:center}
.dbtns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;padding:0 1.4rem 1.4rem}
.bigEmoji{font-size:4.5rem;line-height:1.2}
.itemRow{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;padding:.7rem 1rem;margin:.4rem 0;border-radius:1rem;background:#f1f6fd;border:2px solid #d6e4f6;font-size:1.15rem}
.itemRow .e{font-size:2.4rem}
.itemRow small{display:block;font-size:.9rem;color:#5b6d88}
button.itemRow:hover{background:#e3eefc}
.rk{display:flex;align-items:center;gap:.8rem;padding:.4rem .8rem;margin:.35rem 0;border-radius:1rem;background:#f4f7fb;text-align:left}
.rk img{width:3rem;height:3rem;border-radius:50%;border:3px solid var(--c)}
.rk .n{flex:1}
.rk .r{width:3rem;font-size:1.4rem;color:#1b4c93}
.rk .c{color:#e09000;font-size:1.3rem}
.rules{text-align:left;font-size:1.05rem;line-height:1.75;margin:0;padding-left:1.3rem}
.rules li{margin:.2rem 0}
.sw{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.6rem 0;border-bottom:1px solid #e3e9f2}
.seg{display:inline-flex;background:#e3eaf4;border-radius:2rem;padding:.25rem}
.seg button{padding:.4rem 1.1rem;border-radius:2rem;font-size:1.1rem;color:#4a5b75}
.seg button.on{background:#1b4c93;color:#fff}
#menu{z-index:20}
.mbtns{display:flex;flex-direction:column;gap:.7rem;padding:1.2rem 1.6rem}
.mbtns .btn{justify-content:flex-start}

/* ---------- ミニゲームHUD ---------- */
#mgTitle{position:absolute;left:1rem;top:1rem;display:flex;align-items:center;gap:.9rem;padding:.7rem 1.6rem .7rem .8rem;max-width:min(36rem,70vw)}
#mgTitle .ic{width:3.6rem;height:3.6rem;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:2rem;flex:none}
#mgTitle b{font-size:1.5rem;display:block}
#mgTitle small{font-size:.95rem;opacity:.9}
#mgTimer{position:absolute;right:1rem;top:1rem;padding:.4rem 1.4rem;font-size:2.4rem;border-radius:2rem}
#mgHelp{position:absolute;right:1rem;top:50%;transform:translateY(-50%);padding:.9rem 1.1rem;font-size:.95rem;text-align:center;line-height:1.6}
#mgHelp b{display:block;font-size:1.1rem;margin-bottom:.3rem}
#mgStatus{position:absolute;left:50%;transform:translateX(-50%);bottom:1rem;display:flex;gap:.6rem;flex-wrap:nowrap}
.ms{display:flex;align-items:center;gap:.4rem;padding:.25rem 1rem .25rem .25rem;border-radius:3rem;background:linear-gradient(90deg,var(--c),rgba(16,46,98,.9));color:#fff}
.ms img{width:3rem;height:3rem;border-radius:50%;border:2px solid #fff;background:#fff}
.ms .v{font-size:1.15rem;line-height:1.2}
.ms small{font-size:.8rem;display:block}
#pads{position:absolute;left:0;right:0;bottom:6rem;display:flex;justify-content:center;gap:1.2rem;flex-wrap:wrap;padding:0 1rem}
#pads.solo{bottom:1rem;justify-content:space-between}
.pad{display:flex;gap:.5rem;align-items:center;padding:.4rem;border-radius:1.2rem;background:rgba(255,255,255,.25);border:.2rem solid var(--c)}
.pad span{color:#fff;background:var(--c);border-radius:1rem;padding:.1rem .5rem;font-size:.9rem}
.pad button{width:4.6rem;height:4.6rem;border-radius:1rem;background:rgba(255,255,255,.85);color:#1b4c93;font-size:2rem;box-shadow:0 .25rem 0 rgba(0,0,0,.2)}
.pad button.dn{transform:translateY(.15rem);background:#ffe27a}
#pads.solo .pad{background:none;border:0;gap:1rem}
#pads.solo .pad button{width:6.5rem;height:6.5rem;font-size:2.8rem;opacity:.85}
#pads.solo{bottom:6.5rem}
#countdown{position:absolute;left:0;right:0;top:35%;text-align:center;font-size:8rem;color:#fff;font-weight:900;
  -webkit-text-stroke:.6rem #1b4c93;paint-order:stroke fill;text-shadow:0 .5rem 1rem rgba(0,0,0,.3)}
#countdown.anim{animation:cd .8s}
@keyframes cd{from{transform:scale(2);opacity:0}30%{transform:scale(1);opacity:1}}

/* ---------- タイトル ---------- */
#title{background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(10,40,90,.35))}
.tbox{width:min(46rem,96vw);text-align:center}
.logo small{display:inline-block;background:#fff;color:#ef5d8e;border-radius:2rem;padding:.2rem 1.2rem;font-size:1.2rem}
.logo h1{margin:.4rem 0 1rem;font-size:4rem;line-height:1.1;color:#fff;font-weight:900;letter-spacing:.05em;
  -webkit-text-stroke:.55rem #1b4c93;paint-order:stroke fill;text-shadow:0 .5rem 0 #0f2f63}
.logo h1 span{color:#ffd84a}
.tpanel{background:rgba(255,255,255,.93);border-radius:1.6rem;padding:1.2rem;box-shadow:0 .8rem 2rem rgba(0,30,80,.3)}
#selChars{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.sc{border-radius:1.2rem;padding:.6rem .3rem;background:var(--bg);border:.2rem solid var(--c);display:flex;flex-direction:column;align-items:center;gap:.3rem}
.sc img{width:5rem;height:5rem;border-radius:50%;background:#fff;border:.2rem solid #fff}
.sc b{font-size:1.2rem}
.sc .tg{font-size:1rem;padding:.25rem .9rem;border-radius:2rem;background:#fff;color:#7a8799;border:2px solid #cfd8e4}
.sc.h .tg{background:var(--c);color:#fff;border-color:var(--c)}
.trow{display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap;font-size:1.2rem}
.tnote{font-size:.9rem;color:#5b6d88;margin-top:.6rem}

/* ---------- 結果 ---------- */
#results{background:rgba(160,215,250,.55)}
.rbox{width:min(50rem,96vw);text-align:center}
.ribbon{display:inline-block;background:linear-gradient(180deg,#2f75c9,#17427e);color:#fff;font-size:2.6rem;padding:.6rem 4rem;border-radius:.6rem;
  box-shadow:0 .4rem 0 #0f2f63;position:relative;margin-bottom:1.4rem}
.rcards{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;align-items:end}
.rcard{border-radius:1.2rem;background:var(--bg);border:.25rem solid #fff;box-shadow:0 .4rem 1rem rgba(0,0,0,.18);overflow:hidden;animation:pop .5s backwards}
.rcard .rn{font-size:2.4rem;color:var(--c);-webkit-text-stroke:.3rem #fff;paint-order:stroke fill;margin-top:.3rem}
.rcard img{width:80%;border-radius:50%;background:#fff;margin:.3rem 0}
.rcard .bar{background:var(--c);color:#fff;padding:.4rem .2rem .6rem}
.rcard .bar b{font-size:1.2rem;display:block}
.rcard .bar span{font-size:1.5rem}
.rcard .bar small{font-size:1rem;opacity:.9}
.rfoot{display:flex;justify-content:center;align-items:center;gap:1.4rem;margin-top:1.4rem;flex-wrap:wrap}

@media (orientation:portrait){
  html{font-size:clamp(8px, 2.3vw, 14px)}
  #area{display:none}
  #side{top:auto;bottom:13rem;transform:none}
  #side button{width:4.4rem;height:4.4rem}
  .pc{min-width:11.5rem}
  .pc img{width:3.4rem;height:3.4rem}
  #mgHelp{display:none}
  #mgStatus{gap:.3rem}
  .ms{padding-right:.5rem}
  .ms img{width:2.4rem;height:2.4rem}
  .logo h1{font-size:3rem}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"><div id="steps" hidden></div></div>

<div id="hud" class="layer" hidden>
  <div id="plist"></div>
  <div id="turnBox" class="panel"><b id="turnNow">1</b> / <span id="turnMax">10</span> ターン</div>
  <div id="side">
    <button class="panel" id="bMap">🗺️<span>マップ</span></button>
    <button class="panel" id="bItem">🎒<span>アイテム</span></button>
    <button class="panel" id="bMenu">☰<span>メニュー</span></button>
  </div>
  <div id="area" class="panel"><div class="ic" id="areaIc">🌳</div><div><b id="areaName">はじまりの森</b><small id="areaSub">たくさんの冒険が待っている…</small></div></div>
  <div id="rollPanel" hidden>
    <div class="bubble" id="rollMsg">サイコロをふって<br>マスを進みましょう！</div>
    <button class="btn y big" id="bRoll">🎲 サイコロをふる</button>
  </div>
  <div id="banner"></div>
  <div id="toast" class="panel" hidden></div>
</div>

<div id="mgHud" class="layer" hidden>
  <div id="mgTitle" class="panel"><div class="ic" id="mgIc">🎮</div><div><b id="mgName"></b><small id="mgDesc"></small></div></div>
  <div id="mgTimer" class="panel">⏱ <b id="mgTime">45</b></div>
  <div id="mgHelp" class="panel"></div>
  <div id="pads"></div>
  <div id="mgStatus"></div>
  <div id="countdown"></div>
</div>

<div id="title" class="ov">
  <div class="tbox">
    <div class="logo"><small>みんなで あそぼう！</small><h1>どうぶつ<br><span>パーティー</span>アイランド</h1></div>
    <div class="tpanel">
      <div id="selChars"></div>
      <div class="tnote">カードをタップして「あなた」と「CPU」を切りかえ（1台で4人まであそべます）</div>
      <div class="trow">ターン数
        <div class="seg" id="segTurn"><button data-v="5">5</button><button data-v="10" class="on">10</button><button data-v="15">15</button><button data-v="20">20</button></div>
      </div>
      <div class="trow">
        <button class="btn y big" id="bStart">▶ はじめる！</button>
        <button class="btn" id="bCont" hidden>つづきから</button>
        <button class="btn g" id="bRules">ルール説明</button>
      </div>
    </div>
  </div>
</div>

<div id="results" class="ov" hidden>
  <div class="rbox">
    <div class="ribbon">みんなの結果</div>
    <div class="rcards" id="rcards"></div>
    <div class="rfoot"><div class="bubble" id="rmsg"></div><button class="btn y big" id="bRes">タイトルへ ›</button></div>
  </div>
</div>

<div id="dlg" class="ov" hidden><div class="dbox"><h2 id="dlgT"></h2><div class="dbody" id="dlgB"></div><div class="dbtns" id="dlgBtns"></div></div></div>
<div id="menu" class="ov" hidden><div class="dbox"><h2 id="menuT">メニュー</h2><div id="menuB"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ============================================================
//  基本ユーティリティ
// ============================================================
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

const CH=[
  {name:'さくら',kind:'rabbit',body:0xf7a6c2,theme:'#ef5d8e',bg:'#ffe0ea'},
  {name:'たくみ',kind:'cat',   body:0x6aa3ea,theme:'#3a7fd9',bg:'#d9e9ff'},
  {name:'ゆうき',kind:'chick', body:0xf7d64a,theme:'#4fae35',bg:'#e4f6cf'},
  {name:'あおい',kind:'tanuki',body:0xa98bef,theme:'#8a5bd8',bg:'#ece2ff'},
];
const ITEMS={
  speed:{n:'スピードUP',e:'🍄',d:'サイコロの目が +3 になる'},
  star:{n:'スター',e:'⭐',d:'スターの近くまで ワープできる'},
  dice:{n:'ダイス+1',e:'🎲',d:'サイコロを 2こ ふれる'},
  shield:{n:'シールド',e:'🛡️',d:'つぎに コインをへらされるのを 1回ふせぐ'},
};
const ITEM_W=[['speed',3],['dice',3],['shield',2],['star',1]];
function randItem(){let s=0;ITEM_W.forEach(w=>s+=w[1]);let r=Math.random()*s;for(const w of ITEM_W){r-=w[1];if(r<0)return w[0]}return 'speed'}
const N=44, STAR_COST=20, SAVE_KEY='doubutsu-party-save-v1', SET_KEY='doubutsu-party-settings';
const AREAS=[
  {from:0,name:'はじまりの森',ic:'🌳',sub:'たくさんの冒険が待っている…'},
  {from:11,name:'おしろのまち',ic:'🏰',sub:'おしろが見える にぎやかな道'},
  {from:22,name:'みずうみのほとり',ic:'💧',sub:'きらきら光る 水辺の小道'},
  {from:33,name:'かぜのおか',ic:'🌬️',sub:'風がきもちいい 見はらしの丘'},
];
const areaOf=i=>{let a=AREAS[0];for(const x of AREAS)if(i>=x.from)a=x;return a};

// ============================================================
//  ゲーム状態
// ============================================================
const G={mode:'title',players:[],turn:1,maxTurn:10,cur:0,starIdx:20,paused:false,mapView:false,
  follow:null,camOverride:null,curP:null,steps:0,mods:{add:0,dice:1},itemPhase:false,itemUsed:false,
  settings:{sound:true,fast:false},starPos:new THREE.Vector3()};
try{Object.assign(G.settings,JSON.parse(lsGet(SET_KEY)||'{}'))}catch(e){}
const SPD=()=>G.settings.fast?0.6:1;

// ---------- 中断できる待ち（タイトルに戻ると全部止まる） ----------
const ABORT={abort:true};
const pend=new Set(), timers=[], tweens=[];
function abortable(fn){return new Promise((res,rej)=>{const e={rej};pend.add(e);fn(v=>{pend.delete(e);res(v)})})}
function abortAll(){pend.forEach(e=>e.rej(ABORT));pend.clear();timers.length=0;tweens.length=0}
function wait(ms){return abortable(res=>timers.push({left:ms/1000*SPD(),done:res}))}
function tween(dur,fn){return abortable(res=>tweens.push({t:0,dur:dur*SPD(),fn,done:res}))}
function waitBtn(el){return abortable(res=>{el.onclick=()=>{if(el.disabled)return;el.onclick=null;sfx('click');res()}})}

  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

  s(.5,mc,0,.72,0,1,1.08,.95);
  s(.34,d.kind==='chick'?PH(0xfff1a8):mw,0,.66,.24,1,1.1,.6);
  s(.62,mc,0,1.6,.02);
  for(const sx of[-1,1]){
    s(.1,mk,.22*sx,1.66,.53,1,1.3,.6);
    s(.035,mw,.2*sx,1.71,.6);

  else{const b=new THREE.Mesh(new THREE.ConeGeometry(.12,.28,12),PH(0xff9a2e));b.rotation.x=Math.PI/2;b.position.set(0,1.47,.68);body.add(b);
    for(let i=-1;i<=1;i++){const t=s(.07,mc,i*.07,2.26,0,1,3,1);t.rotation.z=-i*.4}}
  if(d.kind==='rabbit')for(const sx of[-1,1]){const e=s(.15,mc,.22*sx,2.4,-.04,1,3.4,.7);e.rotation.z=-.15*sx;const e2=s(.08,mp,.22*sx,2.4,.05,1,2.8,.4);e2.rotation.z=-.15*sx}
  if(d.kind==='cat')for(const sx of[-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.22,.45,12),mc);e.position.set(.36*sx,2.12,0);e.rotation.z=-.35*sx;e.castShadow=true;body.add(e)}
  if(d.kind==='tanuki'){for(const sx of[-1,1]){s(.19,mc,.42*sx,2.1,0,1,1,.6);s(.1,md,.42*sx,2.1,.08,1,1,.4)}s(.32,mc,0,.55,-.55,1,1.1,1.5);s(.15,md,0,.6,-.98,1,1,1)}

  const al=arm(-1),ar=arm(1);

}
function animChar(m,t){
  const u=m.userData,b=u.body,ph=t+u.seed;
  b.rotation.set(0,0,0);b.position.set(0,0,0);u.fl.position.z=.08;u.fr.position.z=.08;
  u.al.rotation.set(0,0,0);u.ar.rotation.set(0,0,0);
  if(u.mode==='run'){const s=Math.sin(ph*15);u.fl.position.z=.08+s*.22;u.fr.position.z=.08-s*.22;u.al.rotation.x=s*.9;u.ar.rotation.x=-s*.9;b.position.y=Math.abs(s)*.09;b.rotation.x=.12}
  else if(u.mode==='joy'){const s=Math.abs(Math.sin(ph*6));b.position.y=s*.45;u.al.rotation.z=-2.4;u.ar.rotation.z=2.4}
  else if(u.mode==='stun'){b.rotation.y=ph*12;b.rotation.z=.25}
  else if(u.mode==='sad'){b.rotation.x=.3;u.al.rotation.z=.3;u.ar.rotation.z=-.3}
  else{b.position.y=Math.sin(ph*3)*.025;u.al.rotation.z=-.15-Math.sin(ph*3)*.08;u.ar.rotation.z=.15+Math.sin(ph*3)*.08}
}

function terrainH(x,z){const d=Math.hypot(x,z);return 1.9+.8*Math.sin(x*.13+1)*Math.cos(z*.11)+.45*Math.sin(z*.21+x*.05)+4.5*Math.exp(-d*d/90)}

const TCOL={blue:0x3d8fe8,red:0xe8504a,event:0x3fb64a,item:0xf59a23};

  add(new THREE.BoxGeometry(5.6,5,5.6),wall,0,7,0);add(new THREE.ConeGeometry(4.4,3.4,4),roof,0,11.2,0,Math.PI/4);

  const door=add(new THREE.CylinderGeometry(1.2,1.2,.2,16,1,false,0,Math.PI),dark,0,2.2,4.52);door.rotation.set(Math.PI/2,0,Math.PI/2);
  add(new THREE.BoxGeometry(2.4,1.6,.2),dark,0,1.6,4.52);

function pipTex(n){return canvasTex(128,128,(x)=>{x.fillStyle='#fff';x.fillRect(0,0,128,128);x.strokeStyle='#dfe6ef';x.lineWidth=6;x.strokeRect(3,3,122,122);
  const P={1:[[64,64]],2:[[36,36],[92,92]],3:[[32,32],[64,64],[96,96]],4:[[36,36],[92,36],[36,92],[92,92]],5:[[34,34],[94,34],[64,64],[34,94],[94,94]],6:[[36,30],[92,30],[36,64],[92,64],[36,98],[92,98]]};
  P[n].forEach(([a,b])=>{x.beginPath();x.arc(a,b,n===1?17:12,0,Math.PI*2);x.fillStyle=n===1?'#e8504a':'#25324a';x.fill()})})}

function toScreen(v){_v.copy(v).project(camera);return{x:(_v.x*.5+.5)*innerWidth,y:(-_v.y*.5+.5)*innerHeight,vis:_v.z<1}}

function pop(target,text,color='#ffb400'){const el=document.createElement('div');el.className='pop';el.textContent=text;el.style.color=color;$('#labels').appendChild(el);
  pops.push({el,obj:target.mesh||target,t:0})}
function updatePops(dt){for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt;const base=p.obj.position?p.obj.position:p.obj;
  _v.set(0,0,0);const w=new THREE.Vector3().copy(base);w.y+=2.6+p.t*1.2;const s=toScreen(w);
  p.el.style.left=s.x+'px';p.el.style.top=s.y+'px';p.el.style.opacity=p.t<1.2?1:Math.max(0,1-(p.t-1.2)*2.5);

function slotTargets(){const groups={},res=new Map();
  G.players.forEach(p=>(groups[p.pos]=groups[p.pos]||[]).push(p));
  for(const k in groups){const arr=groups[k];arr.forEach((p,i)=>{const v=SP[k].clone();if(arr.length>1){const a=i/arr.length*Math.PI*2+Math.PI/4;v.x+=Math.cos(a)*.62;v.z+=Math.sin(a)*.62}v.y+=.06;res.set(p,v)})}
  return res}
async function layout(anim){const t=slotTargets();G.players.forEach(p=>p.mesh.rotation.y=0);
  if(!anim){t.forEach((v,p)=>p.mesh.position.copy(v));return}
  const fr=new Map();G.players.forEach(p=>fr.set(p,p.mesh.position.clone()));
  await tween(.2,k=>t.forEach((v,p)=>p.mesh.position.lerpVectors(fr.get(p),v,k)))}
function setStar(i){G.starIdx=i;G.starPos.copy(SP[i])}

function newGame(humans,turns){
  G.players=CH.map((_,i)=>({ci:i,human:humans[i],pos:0,coins:10,stars:0,items:[],shield:false,mesh:board.chars[i]}));
  G.turn=1;G.maxTurn=turns;G.cur=0;
  const cand=[];for(let i=12;i<32;i++)if(TYPES[i]==='blue')cand.push(i);setStar(pick(cand));
  runGame(true);
}
function snapshot(){return{turn:G.turn,maxTurn:G.maxTurn,cur:G.cur,starIdx:G.starIdx,players:G.players.map(p=>({ci:p.ci,human:p.human,pos:p.pos,coins:p.coins,stars:p.stars,items:p.items.slice(),shield:p.shield}))}}
function saveGame(){return lsSet(SAVE_KEY,JSON.stringify(G.snap||snapshot()))}
function loadGame(){let s;try{s=JSON.parse(lsGet(SAVE_KEY))}catch(e){}if(!s)return false;
  G.players=s.players.map(q=>Object.assign({},q,{items:q.items.slice(),mesh:board.chars[q.ci]}));
  G.turn=s.turn;G.maxTurn=s.maxTurn;G.cur=s.cur;setStar(s.starIdx);runGame(false);return true}

async function runGame(fresh){
  G.mode='board';G.mapView=false;G.curP=null;
  $('#title').hidden=true;$('#hud').hidden=false;$('#results').hidden=true;
  renderPlist();layout(false);updateHUD();
  G.players.forEach(p=>{p.mesh.visible=true;p.mesh.scale.setScalar(.8);p.mesh.userData.mode='idle'});
  try{
    if(fresh){G.follow=null;G.camOverride=G.starPos.clone();banner('スターを あつめよう！','#e0a800');sfx('star');await wait(1800);G.camOverride=null}
    while(G.turn<=G.maxTurn){
      if(G.cur===0)await turnIntro();
      while(G.cur<G.players.length){G.snap=snapshot();saveGame();await playerTurn(G.players[G.cur]);G.cur++}
      G.curP=null;updateHUD();G.snap=snapshot();saveGame();
      await runMinigame();
      G.turn++;G.cur=0;G.snap=snapshot();saveGame();
    }
    lsDel(SAVE_KEY);
    await finalResults();
  }catch(e){if(e!==ABORT)console.error(e)}
}

async function applyItem(p,idx){

async function cpuItem(p){
  if(!p.items.length||Math.random()<.2)return;
  const dist=(G.starIdx-p.pos+N)%N;let idx=-1;
  const si=p.items.indexOf('star');
  if(si>=0&&p.coins>=STAR_COST&&dist>8)idx=si;
  else if(p.coins>=STAR_COST&&dist>3&&dist<=13)idx=p.items.findIndex(k=>k==='dice'||k==='speed');
  else if(Math.random()<.5)idx=p.items.findIndex(k=>k!=='star');
  if(idx>=0)await applyItem(p,idx);
}

// ---------- 移動 ----------
async function hop(p,idx){
  const from=p.mesh.position.clone(),to=SP[idx].clone();to.y+=.06;
  p.mesh.rotation.y=Math.atan2(to.x-from.x,to.z-from.z);sfx('hop');
  await tween(.27,k=>{p.mesh.position.lerpVectors(from,to,k);p.mesh.position.y+=Math.sin(k*Math.PI)*.9});
}
async function moveSteps(p,n,starCheck,counter){
  const dir=n>0?1:-1;let left=Math.abs(n);
  while(left>0){
    if(counter)G.steps=left;
    const nx=(p.pos+dir+N)%N;await hop(p,nx);p.pos=nx;left--;
    if(counter)G.steps=left;updateHUD();
    if(starCheck&&dir>0&&p.pos===G.starIdx){const keep=G.steps;G.steps=0;await starEvent(p);G.steps=keep}
  }
  G.steps=0;await layout(true);updateHUD();
}
async function warpTo(p,idx){
  sfx('warp');const s=p.mesh.userData.scale;
  await tween(.35,k=>{p.mesh.scale.setScalar(s*(1-k));p.mesh.rotation.y=k*12});
  p.pos=idx;await layout(false);await wait(450);
  await tween(.35,k=>{p.mesh.scale.setScalar(s*k);p.mesh.rotation.y=k*12});p.mesh.scale.setScalar(s);p.mesh.rotation.y=0;updateHUD();
}
function gain(p,n){
  if(n<0&&p.shield){p.shield=false;pop(p,'🛡️ ガード！','#3a7fd9');sfx('item');updateHUD();return 0}
  const b=p.coins;p.coins=Math.max(0,p.coins+n);const d=p.coins-b;
  pop(p,(d>=0?'+':'')+d+' 🪙',d>=0?'#ffb400':'#e8504a');sfx(d>=0?'coin':'bad');updateHUD();return d}
async function starEvent(p){
  G.camOverride=null;
  if(p.coins>=STAR_COST){
    const buy=p.human?await dialog('⭐ スター',`<div class="bigEmoji">⭐</div>${STAR_COST}コインで スターを かいますか？<br><small>（いま ${p.coins} コイン）</small>`,[{label:'かう！',value:true,cls:'y'},{label:'やめる',value:false,cls:'g'}]):true;
    if(buy){p.coins-=STAR_COST;p.stars++;updateHUD();sfx('star');p.mesh.userData.mode='joy';pop(p,'+1 ⭐','#e0a800');
      banner(`${CH[p.ci].name} が スターを ゲット！`,'#e0a800');await wait(1800);p.mesh.userData.mode='idle';await moveStar();}
  }else{pop(p,'コインが たりない…','#7a8799');await wait(1100)}
}
async function moveStar(){
  const cand=[];const cd=(a,b)=>Math.min((a-b+N)%N,(b-a+N)%N);
  for(let i=0;i<N;i++)if(TYPES[i]==='blue'&&cd(i,G.starIdx)>=10&&!G.players.some(q=>q.pos===i))cand.push(i);
  const ni=pick(cand),from=G.starPos.clone(),to=SP[ni].clone();
  banner('スターが いどうするよ！','#e0a800');
  G.camOverride=from.clone();
  await tween(1.6,k=>{G.starPos.lerpVectors(from,to,k);G.starPos.y+=Math.sin(k*Math.PI)*12;G.camOverride.lerpVectors(from,to,k)});
  G.starIdx=ni;G.starPos.copy(to);sfx('star');
  await wait(900);toast(`⭐ スターは「${areaOf(ni).name}」へ！`);G.camOverride=null;
}

async function landEffect(p){
  if(p.pos===G.starIdx)return;
  const t=TYPES[p.pos],m=(G.turn>G.maxTurn-3&&G.maxTurn>=5)?2:1;
  if(t==='blue'){gain(p,3*m);p.mesh.userData.mode='joy';await wait(900);p.mesh.userData.mode='idle'}

function catchAI(c,items,dt){
  const a=c.ai;a.t-=dt;
  if(a.t<=0){a.t=rnd(.14,.3);a.j=false;let best=null,bs=-1e9;

    for(const b of items){if(b.type==='bomb'&&b.y<5&&b.y>0&&Math.abs(b.x-a.tx)<1.3)a.tx=b.x+(c.x>=b.x?1.8:-1.8)}

function mgStatus(){
  if(!MG)return;const sc=MG.scores(),rk=rankOf(sc);
  $('#mgStatus').innerHTML=MG.ps.map(c=>`<div class="ms" style="--c:${CH[c.p.ci].theme}"><img src="${FACES[c.p.ci]}" alt=""><div class="v"><small>${c.p.human?(c.i+1)+'P':'CPU'} ${CH[c.p.ci].name}</small>${MG.status(c,rk)}</div></div>`).join('');
}
async function runMinigame(){
  let k;do{k=ri(0,MG_DEFS.length-1)}while(k===lastMg&&MG_DEFS.length>1);lastMg=k;const def=MG_DEFS[k];
  const humans=G.players.map((p,i)=>p.human?i:-1).filter(i=>i>=0);
  const keysHtml=humans.length===0?'みんな CPU！ 見てて たのしもう':humans.length===1?'キーボード：← → / ↑（A D / W）<br>スマホ：画面のボタン':humans.map((pi,hi)=>`${pi+1}P（${CH[G.players[pi].ci].name}）：${KM_TXT[hi]}`).join('<br>');
  banner('ミニゲーム！','#ef5d8e');sfx('fanfare');await wait(1300);
  await dialog(`🎮 ミニゲーム`,`<div class="bigEmoji">${def.ic}</div><b style="font-size:1.5rem">${def.name}</b><br>${def.desc}<br><div style="margin-top:.8rem;font-size:1rem;color:#5b6d88">${keysHtml}</div>`,
    [{label:'スタート！',value:1,cls:'y big'}],humans.length?{}:{auto:2.5});
  MG=def.create();G.mode='mg';snapCam=true;
  $('#hud').hidden=true;$('#mgHud').hidden=false;
  $('#mgIc').textContent=def.ic;$('#mgName').textContent=def.name;$('#mgDesc').textContent=def.desc;$('#mgHelp').innerHTML=def.help;$('#mgTime').textContent=def.time;
  buildPads();mgStatus();makeTags();
  const cd=$('#countdown');
  for(const s of['3','2','1','スタート！']){cd.textContent=s;cd.classList.remove('anim');void cd.offsetWidth;cd.classList.add('anim');sfx(s.length>1?'go':'count');await abortable(r=>timers.push({left:.75,done:r}))}
  cd.textContent='';
  await abortable(res=>{MG.end=()=>{if(!MG.running)return;MG.running=false;res()};MG.running=true});
  sfx('whistle');cd.textContent='しゅうりょう！';cd.classList.remove('anim');void cd.offsetWidth;cd.classList.add('anim');
  await abortable(r=>timers.push({left:1.4,done:r}));cd.textContent='';
  const sc=MG.scores(),rk=rankOf(sc),RW=[10,5,3,1];
  const order=MG.ps.slice().sort((a,b)=>rk[a.i]-rk[b.i]);
  const html=order.map(c=>`<div class="rk" style="--c:${CH[c.p.ci].theme}"><span class="r">${rk[c.i]}位</span><img src="${FACES[c.p.ci]}" alt=""><span class="n">${CH[c.p.ci].name}<br><small style="color:#7a8799">${MG.status(c,rk)}</small></span><span class="c">+${RW[rk[c.i]-1]} 🪙</span></div>`).join('');
  MG.ps.forEach(c=>{c.m.userData.mode=rk[c.i]===1?'joy':'idle';c.m.visible=true});
  sfx('fanfare');
  await dialog('🏆 ミニゲーム けっか',html,[{label:'つぎへ ›',value:1,cls:'y'}],humans.length?{}:{auto:3});
  G.players.forEach((p,i)=>{p.coins+=RW[rk[i]-1]});
  endMinigame();
  updateHUD();
  G.players.forEach((p,i)=>pop(p,`+${RW[rk[i]-1]} 🪙`));sfx('coin');
  await wait(1200);
}
function makeTags(){clearTags();MG.tags=MG.ps.map(c=>{const e=document.createElement('div');e.className='ntag';e.style.background=CH[c.p.ci].theme;e.textContent=c.p.human?(c.i+1)+'P':'CPU';$('#labels').appendChild(e);return e})}
function clearTags(){document.querySelectorAll('.ntag').forEach(e=>e.remove())}
function endMinigame(){
  if(MG){MG.scene.traverse(o=>{if(o.geometry&&o.geometry!==SPH&&!o.geometry.userData.keep)o.geometry.dispose()});MG=null}
  clearTags();$('#mgHud').hidden=true;$('#countdown').textContent='';
  if(G.mode==='mg'){G.mode='board';$('#hud').hidden=false;snapCam=true}
}

// ============================================================
//  さいごの結果
// ============================================================
async function finalResults(){
  G.mode='result';G.curP=null;hideDice();updateHUD();
  banner('ゲーム しゅうりょう！','#e8504a');sfx('whistle');await wait(1600);
  const sc=G.players.map(p=>p.stars*1000+p.coins),rk=rankOf(sc);
  const order=G.players.slice().sort((a,b)=>rk[G.players.indexOf(a)]-rk[G.players.indexOf(b)]);
  const win=order[0];G.follow=win.mesh;G.players.forEach((p,i)=>p.mesh.userData.mode=rk[i]===1?'joy':'idle');
  $('#hud').hidden=true;
  $('#rcards').innerHTML=order.map((p,k)=>{const r=rk[G.players.indexOf(p)];return `<div class="rcard" style="--c:${CH[p.ci].theme};--bg:${CH[p.ci].bg};animation-delay:${(3-k)*.25}s;${r===1?'transform:scale(1.06)':''}">
    <div class="rn">${r===1?'👑':''}${r}位</div><img src="${FACES[p.ci]}" alt=""><div class="bar"><b>${CH[p.ci].name}</b><span>⭐ ${p.stars}</span><br><small>🪙 ${p.coins}</small></div></div>`}).join('');
  const winners=order.filter(p=>rk[G.players.indexOf(p)]===1).map(p=>CH[p.ci].name).join(' と ');
  $('#rmsg').innerHTML=`ゆうしょうは <b style="color:#ef5d8e">${winners}</b>！<br>つぎの ぼうけんでも がんばりましょう！`;
  $('#results').hidden=false;sfx('fanfare');
}

// ============================================================
//  タイトル・メニュー
// ============================================================
const humanSel=[true,false,false,false];let turnSel=10;
function renderTitle(){
  $('#selChars').innerHTML=CH.map((c,i)=>`<button class="sc ${humanSel[i]?'h':''}" data-i="${i}" style="--c:${c.theme};--bg:${c.bg}"><img src="${FACES[i]}" alt=""><b>${c.name}</b><span class="tg">${humanSel[i]?'あなた '+(i+1)+'P':'CPU'}</span></button>`).join('');
  $('#selChars').querySelectorAll('.sc').forEach(b=>b.onclick=()=>{sfx('click');const i=+b.dataset.i;humanSel[i]=!humanSel[i];renderTitle()});
  $('#bCont').hidden=!lsGet(SAVE_KEY);
}
$('#segTurn').querySelectorAll('button').forEach(b=>b.onclick=()=>{sfx('click');turnSel=+b.dataset.v;$('#segTurn').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
$('#bStart').onclick=()=>{sfx('click');ac();lsDel(SAVE_KEY);newGame(humanSel.slice(),turnSel)};
$('#bCont').onclick=()=>{sfx('click');ac();if(!loadGame())toast('セーブデータが ありません')};
$('#bRules').onclick=()=>{sfx('click');openMenu('rules')};
$('#bRes').onclick=()=>{sfx('click');toTitle()};
function toTitle(){
  abortAll();endMinigame();
  G.mode='title';G.curP=null;G.follow=null;G.camOverride=null;G.mapView=false;G.steps=0;G.paused=false;
  ['#hud','#mgHud','#results','#dlg','#menu','#rollPanel'].forEach(s=>$(s).hidden=true);
  hideDice();$('#banner').innerHTML='';pops.forEach(p=>p.el.remove());pops.length=0;
  G.players=CH.map((_,i)=>({ci:i,pos:0,mesh:board.chars[i],items:[]}));layout(false);board.chars.forEach(m=>{m.userData.mode='idle';m.scale.setScalar(.8);m.visible=true});
  $('#title').hidden=false;renderTitle();
}
$('#bMap').onclick=()=>{sfx('click');if(G.mode!=='board')return;G.mapView=!G.mapView;updateHUD()};
$('#bMenu').onclick=()=>{sfx('click');openMenu('main')};
$('#bItem').onclick=async()=>{
  sfx('click');const p=G.curP;if(G.mode!=='board')return;
  if(G.itemPhase&&p&&p.human&&!G.itemUsed){
    if(!p.items.length){toast('アイテムを もっていません');return}
    G.itemPhase=false;$('#bRoll').disabled=true;
    try{const idx=await itemDialog(p);if(idx!=null)await applyItem(p,idx);updateRollMsg();$('#bRoll').disabled=false;if(!G.itemUsed)G.itemPhase=true}catch(e){}
  }else openMenu('items');
};
const RULES=`<ul class="rules">
<li>じゅんばんに 🎲サイコロをふって すすもう</li>
<li><b style="color:#3d8fe8">青マス</b> +3コイン　<b style="color:#e8504a">赤マス</b> −3コイン</li>
<li><b style="color:#3fb64a">緑マス</b> ？イベント　<b style="color:#f59a23">オレンジマス</b> アイテム</li>
<li>⭐の場所を とおると <b>${STAR_COST}コイン</b>で スターが かえる（スターは いどうする）</li>
<li>みんなが うごいたら ミニゲーム！ 1位 +10 / 2位 +5 / 3位 +3 / 4位 +1 コイン</li>
<li>のこり3ターンは 青・赤マスの コインが 2ばい！</li>
<li>さいごに <b>スターが いちばん多い人</b>の かち（同じなら コインの多い人）</li>
<li>アイテムは サイコロをふる前に 右の 🎒 から（3こまで もてる）</li>
<li>ミニゲームのそうさ：1人なら ←→↑ / A D W / スペース、スマホは画面ボタン。<br>2人以上なら 1P: A D W　2P: ← → ↑　3P: J L I　4P: テンキー 4 6 8</li>
</ul>`;
function openMenu(view){
  G.paused=true;const m=$('#menu'),B=$('#menuB');m.hidden=false;
  const back=G.mode==='title'?'':`<button class="btn g" data-a="main">‹ もどる</button>`;
  if(view==='main'){$('#menuT').textContent='メニュー';
    B.innerHTML=`<div class="mbtns"><button class="btn" data-a="save">💾 セーブ</button><button class="btn" data-a="settings">⚙️ 設定</button><button class="btn" data-a="rules">📖 ルール説明</button><button class="btn" data-a="title">🏠 タイトルへ戻る</button><button class="btn y" data-a="close">とじる</button></div>`}
  else if(view==='rules'){$('#menuT').textContent='📖 ルール説明';B.innerHTML=`<div class="dbody">${RULES}</div><div class="dbtns">${back}<button class="btn y" data-a="close">とじる</button></div>`}
  else if(view==='settings'){$('#menuT').textContent='⚙️ 設定';
    B.innerHTML=`<div class="dbody"><div class="sw"><span>サウンド</span><div class="seg"><button data-s="sound:1" class="${G.settings.sound?'on':''}">ON</button><button data-s="sound:0" class="${G.settings.sound?'':'on'}">OFF</button></div></div>
    <div class="sw"><span>ゲームのはやさ</span><div class="seg"><button data-s="fast:0" class="${G.settings.fast?'':'on'}">ふつう</button><button data-s="fast:1" class="${G.settings.fast?'on':''}">はやい</button></div></div></div>
    <div class="dbtns">${back}<button class="btn y" data-a="close">とじる</button></div>`}
  else if(view==='items'){$('#menuT').textContent='🎒 アイテム一覧';const p=G.curP;
    B.innerHTML=`<div class="dbody">${Object.values(ITEMS).map(I=>`<div class="itemRow"><span class="e">${I.e}</span><span><b>${I.n}</b><small>${I.d}</small></span></div>`).join('')}
    <small style="color:#7a8799">アイテムは 自分のばんで サイコロをふる前に つかえます</small></div><div class="dbtns"><button class="btn y" data-a="close">とじる</button></div>`}
  else if(view==='confirm'){$('#menuT').textContent='🏠 タイトルへ';
    B.innerHTML=`<div class="dbody">タイトルに もどりますか？<br><small>（セーブしていない しんこうは きえます。ターンのはじめに 自動セーブ されています）</small></div><div class="dbtns"><button class="btn y" data-a="totitle">もどる</button><button class="btn g" data-a="main">キャンセル</button></div>`}
  B.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{sfx('click');const a=b.dataset.a;
    if(a==='close'){m.hidden=true;G.paused=false}
    else if(a==='save'){if(G.mode==='title'||G.mode==='result'){toast('いまは セーブできません');return}toast(saveGame()?'💾 セーブしました（このターンのはじめから再開）':'セーブできませんでした')}
    else if(a==='title')openMenu('confirm');
    else if(a==='totitle'){m.hidden=true;toTitle()}
    else openMenu(a)});
  B.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.s.split(':');G.settings[k]=v==='1';lsSet(SET_KEY,JSON.stringify(G.settings));sfx('click');openMenu('settings')});
}

// ============================================================
//  メインループ
// ============================================================
let T=0,last=performance.now(),diceTick=0,statusT=0,titleAng=0;
const tgtPos=new THREE.Vector3(),tgtLook=new THREE.Vector3();
function updateCamera(dt){
  const k=camera.aspect<1?1.75:1;
  if(G.mode==='title'){titleAng+=dt*.05;tgtLook.set(0,2,0);tgtPos.set(Math.cos(titleAng)*58*k,36*k,Math.sin(titleAng)*58*k)}
  else if(G.mode==='mg'&&MG){MG.camera(tgtPos,tgtLook);if(k>1){tgtPos.sub(tgtLook).multiplyScalar(1.45).add(tgtLook)}}
  else if(G.mapView&&G.mode==='board'){tgtLook.set(0,0,3);tgtPos.set(0,64*k,48*k)}
  else{const f=G.camOverride||(G.follow?G.follow.position:SP[0]);tgtLook.copy(f);tgtLook.y+=1;
    const dist=G.mode==="result"?.7:1;tgtPos.set(f.x,f.y+15*k*dist,f.z+13*k*dist)}
  if(snapCam){camPos.copy(tgtPos);camLook.copy(tgtLook);snapCam=false}
  const a=1-Math.exp(-dt*(G.mode==='mg'?6:3.2));camPos.lerp(tgtPos,a);camLook.lerp(tgtLook,a);
  camera.position.copy(camPos);camera.lookAt(camLook);
}
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;const pdt=G.paused?0:dt;T+=pdt;
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.left-=pdt;if(t.left<=0){timers.splice(i,1);t.done()}}
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];t.t+=pdt;const k=Math.min(1,t.t/t.dur);t.fn(k);if(k>=1){tweens.splice(i,1);t.done()}}
  if(G.mode==='mg'&&MG){
    if(MG.running&&!G.paused){MG.update(pdt);$('#mgTime').textContent=Math.ceil(MG.time);statusT-=dt;if(statusT<=0){statusT=.2;mgStatus()}}
    MG.ps.forEach(c=>animChar(c.m,T));
    if(MG.tags)MG.ps.forEach((c,i)=>{const w=c.m.position.clone();w.y+=2.9;const s=toScreen(w);const e=MG.tags[i];if(e){e.style.left=s.x+'px';e.style.top=s.y+'px'}});
    updateCamera(dt);
    renderer.render(MG.scene,camera);
  }else{
    board.chars.forEach(m=>animChar(m,T));
    board.clouds.forEach(c=>{c.position.x+=dt*.8;if(c.position.x>140)c.position.x=-140});
    board.water.position.y=-.45+Math.sin(T*.8)*.05;
    if(board.flag)board.flag.rotation.y=Math.sin(T*3)*.3;
    board.starG.position.copy(G.starPos);board.starG.position.y+=2.6;board.star.position.y=Math.sin(T*2.5)*.2;board.star.rotation.y+=dt*1.8;
    board.starG.visible=G.mode!=='title'||true;
    const cp=G.curP;
    board.arrow.visible=!!cp&&G.mode==='board';
    if(cp){board.arrow.position.copy(cp.mesh.position);board.arrow.position.y+=3.1+Math.abs(Math.sin(T*4))*.3;board.arrow.rotation.y+=dt*2}
    const ds=board.dice.filter(d=>d.h.visible);
    ds.forEach((d,i)=>{if(cp){d.h.position.copy(cp.mesh.position);d.h.position.y+=3.6}d.h.lookAt(camera.position);d.h.translateX((i-(ds.length-1)/2)*1.5);
      if(d.spin&&!G.paused){d.m.rotation.x+=dt*11;d.m.rotation.y+=dt*13;d.m.rotation.z+=dt*7}});
    if(ds.some(d=>d.spin)&&!G.paused){diceTick-=dt;if(diceTick<=0){diceTick=.09;sfx('dice')}}
    const st=$('#steps');
    if(G.steps>0&&cp){const w=cp.mesh.position.clone();w.y+=3.4;const s=toScreen(w);st.hidden=false;st.textContent=G.steps;st.style.left=s.x+'px';st.style.top=s.y+'px'}else st.hidden=true;
    updateCamera(dt);
    renderer.render(BS,camera);
  }
  updatePops(dt);
}

function init(){buildBoard();setStar(20);toTitle();requestAnimationFrame(loop)}
Promise.race([document.fonts?document.fonts.load('900 64px "M PLUS Rounded 1c"'):0,new Promise(r=>setTimeout(r,1500))]).catch(()=>{}).then(init);
</script>
