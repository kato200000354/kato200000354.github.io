<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ぷにぷにガイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{--pink:#ff4f9f;--pink2:#ff86c4;--navy:#0f2565;--navy2:#16307d;--blue:#1d86ff;--blue2:#58b8ff;--yellow:#ffd83a;--yellow2:#ffae00;--purple:#8b5cf6;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#6ccaff}
[hidden]{display:none!important}
body{color:#fff;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;font-weight:800;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;pointer-events:none;z-index:2}
.screen>*{pointer-events:auto}
.ol{text-shadow:0 3px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy)}
.panel{background:rgba(14,36,100,.9);border:3px solid #fff;border-radius:18px;box-shadow:0 6px 0 rgba(10,30,90,.35)}
.ptag{display:inline-block;background:linear-gradient(#ff7cc0,#ff3f92);border:3px solid #fff;border-radius:999px;padding:2px 20px 5px;font-size:22px;font-weight:900;box-shadow:0 4px 0 rgba(160,20,90,.35);white-space:nowrap}
.key{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:#0f2565;color:#fff;font-size:.8em;border:2px solid #fff}

/* ---------- LOBBY ---------- */
.profile{position:absolute;left:calc(12px + var(--sl));top:calc(10px + var(--st));display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;min-width:220px;text-align:left}
.avatar{width:58px;height:58px;border-radius:50%;background:radial-gradient(#ffe36b,#ffb800);border:3px solid #fff;object-fit:cover;display:block}
.lvb{position:absolute;left:4px;bottom:-4px;background:var(--yellow);color:var(--navy);border:2px solid #fff;border-radius:8px;font-size:13px;padding:0 6px;font-weight:900}
.pinfo{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.pname{font-size:17px;padding:2px 10px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.xpbar{position:relative;height:16px;border-radius:9px;background:#0a1a4a;border:2px solid #fff;overflow:hidden}
.xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff4f9f,#ff9ad0);border-radius:9px}
.xpbar em{position:absolute;inset:0;font-style:normal;font-size:10px;line-height:12px;text-align:center}
.wallet{position:absolute;right:calc(12px + var(--sr));top:calc(12px + var(--st));display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(14,36,100,.9);border:3px solid #fff;border-radius:999px;padding:3px 14px 3px 6px;font-size:17px;min-width:90px;justify-content:space-between}
.crownIc{width:26px;height:20px;background:linear-gradient(#ffe56b,#ffb400);clip-path:polygon(0 30%,25% 60%,50% 0,75% 60%,100% 30%,90% 100%,10% 100%)}
.coinIc{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#d9b8ff 30%,#9b5cff 32%,#9b5cff 55%,#c79bff 58%);border:2px solid #fff}
.logo{position:absolute;left:50%;top:calc(14px + var(--st));transform:translateX(-50%) rotate(-7deg);line-height:.85;text-align:center;font-weight:900;font-size:52px;letter-spacing:1px;pointer-events:none}
.logo span{display:block}
.logo span:first-child{color:#2ad1ff;-webkit-text-stroke:3px #fff;text-shadow:0 5px 0 #0b5fc2}
.logo span:last-child{color:#ff4f9f;-webkit-text-stroke:3px #fff;text-shadow:0 5px 0 #b51462;font-size:.9em}
.menu{position:absolute;left:calc(12px + var(--sl));top:calc(100px + var(--st));display:flex;flex-direction:column;gap:9px;width:200px}
.mbtn{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:14px;border:3px solid #fff;font-size:18px;background:linear-gradient(#2c9bff,#1570e0);box-shadow:0 5px 0 rgba(10,40,120,.4);transition:transform .08s;position:relative}
.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(10,40,120,.4)}
.mbtn.hot{background:linear-gradient(#ff6fb5,#ff3f92);box-shadow:0 5px 0 rgba(150,20,80,.45)}
.mbtn svg{width:24px;height:24px;flex:none}
.badge{position:absolute;right:-6px;top:-8px;background:#ff3b3b;border:2px solid #fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}
.showcard{position:absolute;left:calc(12px + var(--sl));bottom:calc(12px + var(--sb));display:flex;gap:10px;align-items:center;padding:6px 16px 6px 6px;text-align:left;max-width:360px}
.showcard .sthumb{width:84px;height:62px;border-radius:12px;border:2px solid #fff;flex:none;background-size:cover;background-position:center}
.showcard small{display:block;font-size:12px;opacity:.85}
.showcard b{display:block;font-size:18px;color:var(--yellow)}
.showcard em{display:block;font-style:normal;font-size:12px}
.playbtn{position:absolute;right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));display:flex;align-items:center;gap:14px;padding:12px 26px 12px 18px;border-radius:20px;background:linear-gradient(#fff07a,#ffd22e 50%,#ffbb00);border:4px solid #fff;color:var(--navy);box-shadow:0 7px 0 #c97f00,0 10px 20px rgba(0,0,0,.2);animation:pulse 1.6s ease-in-out infinite}
.playbtn b{display:block;font-size:34px;line-height:1;font-weight:900}
.playbtn small{display:block;font-size:14px}
.playbtn .key{width:42px;height:42px;font-size:20px}
.playbtn:active{transform:translateY(4px);box-shadow:0 3px 0 #c97f00}
@keyframes pulse{50%{transform:scale(1.04)}}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,20,70,.45);padding:16px}
.mbox{width:min(720px,100%);max-height:calc(100% - 20px);overflow:auto;padding:16px;position:relative}
.mbox h2{margin:0 0 12px;font-size:22px}
.mhead{display:flex;justify-content:center}
.close{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;background:#ff4f9f;border:3px solid #fff;font-size:20px;line-height:1}
.shows{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.scard{border-radius:16px;border:3px solid #fff;overflow:hidden;background:#123;position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;transition:transform .1s}
.scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center 30%}
.scard .lab{position:relative;background:rgba(14,36,100,.88);padding:6px 4px;font-size:15px}
.scard .lab small{display:block;font-size:10px;opacity:.85;font-weight:500}
.scard.on{border-color:var(--yellow);box-shadow:0 0 0 4px var(--yellow);transform:translateY(-4px)}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;align-items:center}
.pbtn{padding:10px 22px;border-radius:14px;background:linear-gradient(#fff07a,#ffc400);color:var(--navy);border:3px solid #fff;font-size:18px;box-shadow:0 4px 0 #c97f00}
.pbtn.blue{background:linear-gradient(#2c9bff,#1570e0);color:#fff;box-shadow:0 4px 0 rgba(10,40,120,.4)}
.pbtn:disabled{filter:grayscale(1);opacity:.6}
.chal{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px}
.crow .ct{flex:1}
.crow .bar{height:12px;border-radius:7px;background:#0a1a4a;border:2px solid #fff;overflow:hidden;margin-top:5px}
.crow .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd83a,#ffae00)}
.crow small{font-size:12px;opacity:.85}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.2)}
.tog{width:64px;height:34px;border-radius:999px;background:#5a6a99;border:3px solid #fff;position:relative}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:#3ad16f}.tog.on::after{left:31px}
input[type=range]{width:160px;accent-color:#ff4f9f}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shopit{background:rgba(255,255,255,.1);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.shopit .ti{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(#5ec8ff,#2a8cff);display:grid;place-items:center;overflow:hidden}
.shopit .ti img{width:100%;height:100%;object-fit:contain}
.shopit small{font-size:11px}
.price{display:inline-flex;align-items:center;gap:4px}
.price .coinIc{width:16px;height:16px}
.toast{position:fixed;left:50%;top:calc(80px + var(--st));transform:translateX(-50%);z-index:50;background:rgba(14,36,100,.95);border:3px solid #fff;border-radius:999px;padding:8px 20px;font-size:16px;pointer-events:none;animation:toast 2s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- CUSTOMIZE ---------- */
.stitle{position:absolute;left:calc(12px + var(--sl));top:calc(10px + var(--st))}
.cpanel{position:absolute;right:calc(12px + var(--sr));top:calc(56px + var(--st));bottom:calc(70px + var(--sb));width:min(560px,56vw);display:flex;flex-direction:column;padding:10px;gap:10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:7px 2px;border-radius:12px;background:linear-gradient(#58c4ff,#2a95f0);border:2px solid #fff;font-size:14px;white-space:nowrap}
.tabs button.on{background:linear-gradient(#ff7cc0,#ff3f92)}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;align-content:start;padding:4px;touch-action:pan-y}
.item{position:relative;aspect-ratio:1;border-radius:14px;border:3px solid rgba(255,255,255,.5);background:linear-gradient(#4fb8ff,#2079e6);overflow:hidden;display:grid;place-items:center}
.item img{width:100%;height:100%;object-fit:contain}
.item.sel{border-color:#ff4f9f;box-shadow:0 0 0 3px #ff4f9f}
.item .eq{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;background:#ffb800;border:2px solid #fff;font-size:12px;display:grid;place-items:center}
.item .lk{position:absolute;inset:auto 0 0 0;background:rgba(10,20,60,.75);font-size:12px;padding:2px;display:flex;justify-content:center;align-items:center;gap:3px}
.item .lk .coinIc{width:13px;height:13px;border-width:1px}
.item .nm{position:absolute;inset:auto 0 0 0;font-size:11px;background:rgba(10,20,60,.6);padding:2px}
.item.locked img{filter:brightness(.75)}
.plateSw{width:86%;height:40%;border-radius:10px;border:2px solid #fff;display:grid;place-items:center;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cinfo{position:absolute;left:calc(12px + var(--sl));bottom:calc(14px + var(--sb));padding:8px 16px;display:flex;align-items:center;gap:12px;min-width:230px}
.cinfo b{font-size:18px}
.rar{display:inline-block;font-size:11px;padding:1px 10px;border-radius:999px;background:#9db4d6;color:var(--navy);margin-top:2px}
.buy{padding:6px 14px;border-radius:12px;background:linear-gradient(#fff07a,#ffc400);color:var(--navy);border:2px solid #fff;display:inline-flex;align-items:center;gap:5px}
.back{position:absolute;right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));padding:8px 18px;border-radius:999px;background:rgba(14,36,100,.9);border:3px solid #fff;font-size:16px;display:flex;gap:8px;align-items:center}

/* ---------- MATCHING / HUD ---------- */
#matching{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.25),rgba(29,134,255,.55))}
.mcard{text-align:center;padding:24px 34px}
.mcard .big{font-size:56px;font-weight:900;color:var(--yellow)}
.spin{width:70px;height:70px;margin:8px auto 10px;border-radius:50%;border:8px solid rgba(255,255,255,.3);border-top-color:#ff4f9f;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tip{font-size:13px;opacity:.9;margin-top:10px;max-width:320px;font-weight:500}
#touch{position:absolute;inset:0;z-index:0}
.rtag{position:absolute;left:calc(10px + var(--sl));top:calc(10px + var(--st));display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.rtag .goal{background:linear-gradient(#ff7cc0,#ff3f92);border:3px solid #fff;border-radius:10px;padding:2px 12px;font-size:14px;transform:skewX(-8deg)}
.rtag .hint{background:rgba(14,36,100,.85);border-radius:999px;padding:3px 12px;font-size:12px;border:2px solid rgba(255,255,255,.7)}
.qbox{position:absolute;right:calc(0px + var(--sr));top:calc(10px + var(--st));background:rgba(14,36,100,.92);border:3px solid #fff;border-right:0;border-radius:18px 0 0 18px;padding:4px 18px 6px 22px;text-align:center;pointer-events:none;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
.qbox small{display:block;font-size:13px;letter-spacing:1px}
.qbox b{display:block;font-size:26px;line-height:1}
.timer{position:absolute;left:50%;top:calc(10px + var(--st));transform:translateX(-50%);font-size:30px;pointer-events:none;background:rgba(14,36,100,.8);border:3px solid #fff;border-radius:14px;padding:0 14px}
.bigmsg{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(44px,11vw,96px);font-weight:900;pointer-events:none;color:#fff;letter-spacing:2px}
.bigmsg.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bigmsg.q{color:#ffe14a}.bigmsg.e{color:#ff8fb8}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#joy{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.7);pointer-events:none;z-index:3}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tbtns{position:absolute;right:calc(16px + var(--sr));bottom:calc(18px + var(--sb));width:190px;height:170px;z-index:4}
.tb{position:absolute;border-radius:50%;border:4px solid #fff;font-size:15px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);touch-action:none}
.tb.j{right:0;bottom:0;width:96px;height:96px;background:radial-gradient(circle at 40% 35%,#7dd0ff,#1d86ff)}
.tb.d{right:104px;bottom:6px;width:74px;height:74px;background:radial-gradient(circle at 40% 35%,#ff9ad0,#ff3f92)}
.tb.g{right:12px;bottom:106px;width:62px;height:62px;background:radial-gradient(circle at 40% 35%,#ffe97a,#ffb800);color:var(--navy);font-size:24px}
.tb:active,.tb.down{transform:scale(.92)}
.skip{position:absolute;right:calc(14px + var(--sr));top:calc(88px + var(--st));padding:8px 18px;border-radius:999px;background:linear-gradient(#fff07a,#ffc400);color:var(--navy);border:3px solid #fff;font-size:16px;z-index:5}
.intro{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:linear-gradient(transparent 30%,rgba(10,30,90,.35))}
.icard{text-align:center;padding:18px 26px;max-width:min(560px,92vw);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.icard .ty{display:inline-block;background:var(--yellow);color:var(--navy);border-radius:999px;padding:2px 16px;font-size:15px;border:2px solid #fff}
.icard h1{margin:6px 0 4px;font-size:clamp(30px,7vw,48px);line-height:1.1}
.icard p{margin:6px 0 0;font-weight:500;font-size:15px}
.icard .rn{font-size:13px;opacity:.85}
.emoteP{position:absolute;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);padding:10px;z-index:6;width:min(560px,94vw)}
.erow{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.ebtn{border-radius:12px;background:linear-gradient(#58c4ff,#2a95f0);border:2px solid #fff;overflow:hidden;position:relative;aspect-ratio:1}
.ebtn img{width:100%;height:100%;object-fit:contain}
.ebtn span{position:absolute;inset:auto 0 0 0;font-size:11px;background:rgba(10,20,60,.55)}
.crow2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.chat{background:#fff;color:var(--navy);border-radius:12px;padding:8px 2px;font-size:14px;border:2px solid #b9dcff}

/* ---------- RESULT ---------- */
.banner{position:absolute;left:50%;top:calc(16px + var(--st));transform:translateX(-50%) rotate(-3deg);padding:8px 44px 12px;font-size:clamp(30px,7vw,60px);font-weight:900;background:linear-gradient(#ff7cc0,#ff2f86);border:4px solid #fff;border-radius:12px;white-space:nowrap;box-shadow:0 8px 0 rgba(150,20,80,.4);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.banner.lose{background:linear-gradient(#9aa6c8,#5d6a92);box-shadow:0 8px 0 rgba(40,50,90,.4)}
.banner.win{background:linear-gradient(#fff07a,#ffb800);color:var(--navy);box-shadow:0 8px 0 #c97f00}
.rpanel{position:absolute;right:calc(16px + var(--sr));top:50%;transform:translateY(-50%);width:min(320px,44vw);padding:6px 0;overflow:hidden}
.rline{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid rgba(255,255,255,.25);font-size:18px}
.rline:last-child{border-bottom:0}
.rline b{font-size:24px;color:var(--yellow)}
.rnext{position:absolute;right:calc(16px + var(--sr));bottom:calc(16px + var(--sb));padding:12px 26px;border-radius:999px;background:rgba(14,36,100,.92);border:3px solid #fff;font-size:19px;display:flex;align-items:center;gap:10px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:760px){
  .logo{font-size:34px;top:calc(76px + var(--st));left:auto;right:16px;transform:rotate(-7deg)}
  .menu{width:150px;top:calc(88px + var(--st));gap:7px}
  .mbtn{height:42px;font-size:15px;padding:0 10px;gap:8px}
  .mbtn svg{width:20px;height:20px}
  .profile{min-width:0;padding-right:10px}.avatar{width:48px;height:48px}.pname{max-width:110px;font-size:15px}
  .pill{min-width:0;font-size:15px;padding-right:10px}
  .showcard{max-width:calc(100vw - 210px);padding-right:10px}.showcard .sthumb{width:56px;height:46px}.showcard b{font-size:15px}.showcard em{display:none}
  .playbtn{padding:10px 18px 10px 12px;gap:10px}.playbtn b{font-size:26px}.playbtn .key{width:34px;height:34px;font-size:16px}
  .shows{grid-template-columns:repeat(2,1fr)}
  .shopgrid{grid-template-columns:repeat(2,1fr)}
}
@media (orientation:portrait){
  .cpanel{left:calc(10px + var(--sl));right:calc(10px + var(--sr));width:auto;top:44%;bottom:calc(64px + var(--sb))}
  .cinfo{bottom:calc(10px + var(--sb));padding:6px 12px;min-width:0}
  .back{bottom:calc(12px + var(--sb))}
  .tabs button{font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  .rpanel{left:50%;right:auto;top:auto;bottom:calc(84px + var(--sb));transform:translateX(-50%);width:min(340px,90vw)}
  .rline{padding:8px 16px}
}
@media (max-height:460px){
  .menu{top:calc(78px + var(--st));gap:5px}.mbtn{height:36px}
  .logo{display:none}
  .tbtns{transform:scale(.85);transform-origin:right bottom}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<!-- LOBBY -->
<section id="lobby" class="screen">

function emotePose(e,t){

  case 'cheer':p.sp=p.sn=2.3+Math.sin(t*12)*0.5;p.innerY=Math.abs(Math.sin(t*6))*0.1;break;
  case 'bow':p.tx=t<1.7?0.7:0;p.sp=p.sn=0.05;break;
  case 'oops':p.rotY=Math.sin(t*13)*0.35;p.sp=p.sn=1.2;p.tz=0.12;break;
  case 'dance':p.rotY=Math.sin(t*6)*0.7;p.sp=1.5+Math.sin(t*6);p.sn=1.5-Math.sin(t*6);p.innerY=Math.abs(Math.sin(t*12))*0.08;break;

 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.03);}

function updateGame(dt){
 R.time+=dt;const live=G.phase==='play';
 if(G.phase==='intro'){G.phaseT-=dt;if(G.phaseT<=0){G.phase='count';G.phaseT=3.0;$('#intro').hidden=true;G.lastCount=-1;}}
 else if(G.phase==='count'){G.phaseT-=dt;const c=Math.ceil(G.phaseT);if(c!==G.lastCount){G.lastCount=c;if(c>0){bigMsg(String(c));sfx('beep');}}
  if(G.phaseT<=0){G.phase='play';R.time=0;bigMsg('GO!','q');sfx('go');setTimeout(()=>{if(G.phase==='play'&&$('#bigMsg').textContent==='GO!')$('#bigMsg').textContent='';},800);
   for(const b of G.beans)if(!b.isPlayer&&Math.random()<0.25)setTimeout(()=>b.say(pick(CHATS)),rand(200,2500));}}
 if(R.type==='race')updateRace(dt,live);else if(R.type==='survival')updateSurvival(dt,live);else updateHex(dt);
 const pin=live?playerInput():(inp.jumpQ=inp.diveQ=false,NOINP);
 for(const b of G.beans){if(!b.active)continue;
  let i=NOINP;if(live)i=b.isPlayer?pin:(R.type==='race'?raceAI(b,dt):R.type==='survival'?survivalAI(b,dt):hexAI(b,dt));
  controlChar(b,i,dt);}
 const SUB=3,sdt=dt/SUB;for(let s=0;s<SUB;s++)for(const b of G.beans)if(b.active)physStep(b,sdt);
 beanPush(G.beans);
 for(const b of G.beans){if(!b.active)continue;
  if(R.type==='race'){if(b.pos.y<R.killY)respawn(b);while(b.cp<R.cps.length-1&&b.pos.z>R.cps[b.cp+1].z&&b.grounded)b.cp++;
   if(live&&b.pos.z>R.goalZ&&b.pos.y>3)qualifyBean(b);}
  else if(b.pos.y<R.killY)eliminateBean(b);
  if(live&&!b.isPlayer&&b.state==='normal'&&b.grounded&&Math.random()<0.0004)b.doEmote(pick(['wave','hop','cheer']));}
 for(const b of G.beans)if(b.root.visible)animateBean(b,dt);
 if(G.player&&G.player.chev){G.player.chev.position.y=2.05+Math.sin(R.time*5)*0.08;G.player.chev.rotation.y+=dt*2;}
 // end conditions
 if(live){
  if(R.type==='race'){if(R.finished.length>=R.quota||R.time>180)endRound();}
  else if(R.type==='survival'){const alive=G.beans.filter(b=>!b.out).length;if(alive<=R.target||R.time>=R.timeLimit)endRound();}
  else{const alive=G.beans.filter(b=>!b.out).length;if(alive<=1||R.time>240)endRound();}
  if(G.player.out){G.outT-=dt;if(G.outT<=0&&G.phase==='play')endRound();}
 }
 updateHUD();updateGameCam(dt);
}
function skipRound(){if(G.phase!=='play')return;
 const rest=G.beans.filter(b=>b.active).sort((a,b)=>b.pos.z-a.pos.z);while(R.finished.length<R.quota&&rest.length){const b=rest.shift();b.done=true;b.active=false;b.root.visible=false;R.finished.push(b);}
 endRound();}
function endRound(){
 if(G.phase!=='play')return;G.phase='ended';
 const pb=G.player;let qualified=false,rank='-',crown=false,pts=15;
 if(R.type==='race'){R.finished.slice(0,R.quota).forEach(b=>b.ent.alive=true);G.beans.forEach(b=>{if(!R.finished.slice(0,R.quota).includes(b))b.ent.alive=false;});
  const i=R.finished.indexOf(pb);qualified=i>=0&&i<R.quota;rank=i>=0?(i+1)+'位':'-';if(qualified){pts+=35;if(i<3)pts+=[30,20,10][i];}}
 else if(R.type==='survival'){G.beans.forEach(b=>b.ent.alive=!b.out);qualified=!pb.out;rank=qualified?'生きのこり':(G.beans.length-R.outOrder.indexOf(pb))+'位';if(qualified)pts+=40;}
 else{const alive=G.beans.filter(b=>!b.out);let winner=alive.length===1?alive[0]:alive.sort((a,b)=>b.pos.y-a.pos.y)[0];if(!winner)winner=R.outOrder[R.outOrder.length-1];
  G.beans.forEach(b=>b.ent.alive=b===winner);qualified=winner===pb;
  rank=qualified?'1位':(G.beans.length-R.outOrder.indexOf(pb))+'位';if(qualified)pts+=40;}
 if(R.isFinal&&qualified){crown=true;pts+=200;}
 if(qualified)S.stats.qualified++;
 const lvUp=addPoints(pts);if(crown){S.crowns++;S.stats.wins++;}save();
 G.result={qualified,rank,crown,pts,lvUp,final:R.isFinal};
 if(qualified&&!pb.done&&R.type!=='race'){bigMsg(crown?'優勝！':'QUALIFIED!','q');sfx(crown?'win':'qual');}
 else if(R.type==='race'&&!qualified&&!pb.out){bigMsg('ELIMINATED','e');sfx('out');}
 setTimeout(showResult,1600);
}

const _tv=new V3(),_dv=new V3();
function updateGameCam(dt){
 const k=1-Math.exp(-8*dt);
 if(G.phase==='intro'){const t=1-G.phaseT/3.6;
  if(R.introFrom){_tv.lerpVectors(R.introFrom[0],R.introTo[0],t*t*(3-2*t));_dv.lerpVectors(R.introFrom[1],R.introTo[1],t*t*(3-2*t));camera.position.copy(_tv);camera.lookAt(_dv);cam.pos.copy(_tv);cam.look.copy(_dv);}
  else{const o=R.introOrbit,a=t*1.6+0.4;camera.position.set(Math.cos(a)*o.r,o.h+o.y,Math.sin(a)*o.r);_dv.set(0,o.y,0);camera.lookAt(_dv);cam.pos.copy(camera.position);cam.look.copy(_dv);}
  return;}
 let tgt=G.player;
 if(!tgt.active){if(!G.spectate||!G.spectate.active){const c=G.beans.filter(b=>b.active);G.spectate=R.type==='race'?c.sort((a,b)=>b.pos.z-a.pos.z)[0]:pick(c);}if(G.spectate&&(tgt.done||G.outT<=0||tgt.pos.y<R.killY-4))tgt=G.spectate;}
 if(keys.KeyQ)cam.yaw+=1.8*dt;if(keys.KeyE)cam.yaw-=1.8*dt;
 const T=_tv.set(tgt.pos.x,Math.max(tgt.pos.y,R.killY+2)+1.3,tgt.pos.z);
 const cp=Math.cos(cam.pitch),fx=Math.sin(cam.yaw)*cp,fy=-Math.sin(cam.pitch),fz=Math.cos(cam.yaw)*cp;
 _dv.set(T.x-fx*cam.dist,T.y-fy*cam.dist,T.z-fz*cam.dist);
 cam.pos.lerp(_dv,G.phase==='count'?1-Math.exp(-5*dt):k*1.4>1?1:k*1.4);cam.look.lerp(T,Math.min(1,k*2));
 camera.position.copy(cam.pos);if(cam.shake>0){cam.shake-=dt;camera.position.x+=rand(-1,1)*cam.shake*0.4;camera.position.y+=rand(-1,1)*cam.shake*0.4;}
 camera.lookAt(cam.look);
 sun.position.set(T.x+14,T.y+30,T.z-10);sun.target.position.copy(T);
}

const openModal=id=>{$(id).hidden=false;sfx('click');};
$$('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.modal').hidden=true;sfx('click');refreshLobby();});
$$('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m){m.hidden=true;refreshLobby();}}));
let showPick=S.show;
function renderShows(){const box=$('#showList');box.innerHTML='';
 SHOWS.forEach(s=>{const b=document.createElement('button');b.className='scard'+(s.id===showPick?' on':'');const bg={main:'#ffcf3f,#ff86c4',race:'#7fd0ff,#ff86c4',survive:'#9b6bff,#5ec8ff',hex:'#3a1b8e,#9b6bff'}[s.id];
  b.style.background=`linear-gradient(${bg})`;b.innerHTML=`<img alt="" src="${thumb(s.look,'cheer',0.2)}"><span class="lab">${s.name}<small>${s.rounds.length}ラウンド・${s.players}人</small></span>`;
  b.onclick=()=>{showPick=s.id;sfx('click');renderShows();};box.appendChild(b);});
 $('#showInfo').textContent=(SHOWS.find(s=>s.id===showPick)||SHOWS[0]).desc;}
$('#showOk').onclick=()=>{S.show=showPick;save();$('#mShows').hidden=true;sfx('coin');refreshLobby();};
const claimable=()=>CHALL.filter(c=>{const tier=S.claimed[c.id]||0;return S.stats[c.stat]>=c.base*(tier+1);}).length;
function renderChal(){const box=$('#chalList');box.innerHTML='';
 CHALL.forEach(c=>{const tier=S.claimed[c.id]||0,target=c.base*(tier+1),v=Math.min(S.stats[c.stat],target),rw=Math.round(c.reward*(1+tier*0.5)),ok=S.stats[c.stat]>=target;
  const d=document.createElement('div');d.className='crow';d.innerHTML=`<div class="ct">${c.name}（${target}回）<small> ★${tier+1}</small><div class="bar"><i style="width:${v/target*100}%"></i></div><small>${v} / ${target}</small></div><button class="pbtn" ${ok?'':'disabled'}><span class="price"><span class="coinIc"></span>${rw}</span></button>`;
  d.querySelector('button').onclick=()=>{if(!ok)return;S.claimed[c.id]=tier+1;addPoints(rw);sfx('coin');toast(`ほうしゅう +${rw}！`);renderChal();refreshLobby();};box.appendChild(d);});}
function dailyShop(){const d=new Date();let seed=d.getFullYear()*372+d.getMonth()*31+d.getDate();const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
 const pool=[];for(const cat in CATS)for(const it of CATS[cat])if(it.price>0)pool.push({cat,it});
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 const un=pool.filter(p=>!owns(p.cat,p.it.id));return un.slice(0,6);}
function renderShop(){const box=$('#shopList');box.innerHTML='';const list=dailyShop();
 if(!list.length){box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px">ぜんぶ持ってる！すごい！</div>';return;}
 const lab={costume:'コスチューム',color:'カラー',emote:'エモート',plate:'名前プレート'};
 list.forEach(({cat,it})=>{const d=document.createElement('div');d.className='shopit';
  let ti;if(cat==='plate')ti=`<span class="plateSw" style="background:${it.bg}">${S.name}</span>`;else{const lk=cat==='costume'?{...S.look,costume:it.id}:cat==='color'?{...S.look,color:it.id}:S.look;ti=`<img alt="" src="${thumb(lk,cat==='emote'?it.id:null,0.3)}">`;}
  const[rn,rc]=rarity(it.price);
  d.innerHTML=`<div class="ti">${ti}</div><b>${it.name}</b><small>${lab[cat]}・<span style="color:${rc}">${rn}</span></small><button class="buy"><span class="coinIc"></span>${it.price}</button>`;
  d.querySelector('button').onclick=()=>buy(cat,it.id,()=>{renderShop();refreshLobby();});box.appendChild(d);});}
function renderSettings(){$$('[data-set]').forEach(b=>b.classList.toggle('on',!!S.settings[b.dataset.set]));$('#sens').value=S.settings.sens;}
$$('[data-set]').forEach(b=>b.onclick=()=>{const k=b.dataset.set;S.settings[k]=!S.settings[k];save();renderSettings();applyAudio();if(k==='shadows')applyShadows();sfx('click');});
$('#sens').oninput=e=>{S.settings.sens=+e.target.value;save();};
function rename(){let n=null;try{n=prompt('なまえを入力してね（10文字まで）',S.name);}catch(e){}if(n&&n.trim()){S.name=n.trim().slice(0,10);save();refreshLobby();}}
$('#renameBtn').onclick=rename;$('#profileBtn').onclick=()=>{sfx('click');rename();};
$$('#lobby [data-go]').forEach(b=>b.onclick=()=>{audioInit();sfx('click');const g=b.dataset.go;
 if(g==='play')startShow();else if(g==='custom')openCustom();else if(g==='shows'){showPick=S.show;renderShows();openModal('#mShows');}
 else if(g==='challenge'){renderChal();openModal('#mChal');}else if(g==='shop'){renderShop();openModal('#mShop');}else if(g==='settings'){renderSettings();openModal('#mSet');}});
addEventListener('keydown',e=>{if(G.state==='lobby'&&e.code==='Enter'&&$$('.modal').every(m=>m.hidden)){audioInit();startShow();}
 if(G.state==='result'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();$('#rNext').click();}});

// ================= LOOP =================
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?68:55;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(0.05,(now-last)/1000);last=now;
 const t=now/1000;for(const f of animFns)f(t);
 if(G.state==='game')updateGame(dt);else if(G.state==='result')updateResultStage(dt);else if(G.state==='lobby'||G.state==='custom'||G.state==='matching')updateLobby(dt);
 updateParts(dt);
 cam.shiftX+=(cam.tsx-cam.shiftX)*Math.min(1,dt*6);cam.shiftY+=(cam.tsy-cam.shiftY)*Math.min(1,dt*6);
 if(G.state==='game'){cam.tsx=cam.tsy=0;}
 const w=innerWidth,h=innerHeight;if(Math.abs(cam.shiftX)>0.002||Math.abs(cam.shiftY)>0.002)camera.setViewOffset(w,h,cam.shiftX*w,cam.shiftY*h,w,h);else if(camera.view&&camera.view.enabled)camera.clearViewOffset();
 renderer.render(scene,camera);}
applyShadows();goLobby();setTouchUI();requestAnimationFrame(frame);
window.__G=G;
})();
</script>
<script src="../../playtime.js" defer></script>
</body>
</html>
