<canvas id="c"></canvas>

<div id="title" class="ov">
  <h1>盗まれない<span>傘</span>を<br>つくれ！</h1>
  <p class="lead">コンビニで買い物してる、ほんの数十秒。<br>外の傘立てに置いた傘が……<b>盗まれる！</b><br>誰にも盗まれない、でも自分は使える<br><b>“世界にひとつの傘”</b>をつくろう。</p>
  <div class="rules">
    🎨 生地・柄・持ち手・ぶら下げ・文字・ギミックを組み合わせる<br>
    🧍 傘泥棒にはいろんな人がいる。好みもバラバラ<br>
    ✊ 手が伸びたら「ガラスをコンコン」で追い払え（3回まで）<br>
    📸 ヘンな傘は写真を撮られて<b>バズる</b>かも
  </div>
  <button class="big" id="start">傘をつくる ▶</button>
  <div class="best" id="bestline"></div>
</div>

<div id="editor" hidden>
  <div id="topbar">
    <div class="ttl">☂ 傘をカスタム<br><small style="font-weight:500;font-size:11px;color:#bcd">ドラッグで回転</small></div>
    <div id="meters">
      <div class="mrow"><b>実用度</b><div class="bar"><i id="mU" style="background:#5fd38a"></i></div></div>
      <div class="mrow"><b>ヤバさ</b><div class="bar"><i id="mS" style="background:#ff6b6b"></i></div></div>
      <div class="mrow"><b>映え</b><div class="bar"><i id="mB" style="background:#ff9fd0"></i></div></div>
    </div>
  </div>
  <div id="sidebtns">
    <button class="sb" id="toggleOpen">閉じた姿</button>
    <button class="sb" id="randomize">🎲 おまかせ</button>
  </div>
  <div id="sheet">
    <div id="tabs"></div>
    <div id="opts"></div>
    <button class="big" id="go">コンビニの傘立てに置く ▶</button>
  </div>
</div>

<div id="hud" hidden>
  <div id="hudtop">
    <div id="prog">🛒 店内で買い物中… <span id="progtxt"></span><div class="bar"><i id="progbar" style="background:#7fd3ff;width:0"></i></div></div>
    <div id="likes">❤ 0</div>
  </div>
  <div id="banner" style="opacity:0"></div>
  <div id="mine">あなたの傘<br>▼</div>
  <button id="knock">✊ ガラスをコンコン（3）</button>
</div>
<div id="flash"></div>
<div id="cine" hidden><div id="cinetxt"></div></div>

<div id="result" class="ov" hidden>
  <img id="card" alt="結果カード">
  <div id="story"></div>
  <div class="row">
    <button class="big" id="share" style="margin-top:0;font-size:16px;padding:12px 22px">📤 結果をシェア</button>
    <button class="btnx" id="xpost">𝕏 でポスト</button>
  </div>
  <div class="row">
    <button class="btn2" id="retry">🔧 改造してリベンジ</button>
    <button class="btn2" id="fresh">🆕 ぜんぶ作り直す</button>
  </div>
  <div class="best" style="margin-bottom:20px">画像は長押しでも保存できます</div>
</div>
