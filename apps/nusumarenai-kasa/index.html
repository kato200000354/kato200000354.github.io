<title>盗まれない傘をつくれ！</title>
<meta name="description" content="コンビニで買い物している間に傘が盗まれる！誰にも盗まれない、でも自分は使える“独自の傘”を3Dでつくろう。">
<meta name="theme-color" content="#16213a">

<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#16213a;color:#fff;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;border:0}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;text-align:center;z-index:20}
#title{background:radial-gradient(ellipse at 50% 30%,rgba(40,70,130,.75),rgba(10,16,32,.95))}
#title h1{font-size:clamp(30px,9vw,52px);line-height:1.15;margin:0 0 6px;font-weight:800;text-shadow:0 4px 0 #0b1224,0 0 24px rgba(120,190,255,.5)}
#title h1 span{color:#ffd84a}
#title .lead{font-size:15px;line-height:1.7;max-width:420px;margin:10px 0 18px;color:#dfe8ff}
#title .rules{font-size:13px;line-height:1.7;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;max-width:420px;text-align:left;color:#cfdaf5}
.big{background:linear-gradient(#ffe25a,#ffb81f);color:#3a2200;font-weight:800;font-size:20px;padding:14px 34px;border-radius:999px;box-shadow:0 5px 0 #b77800,0 8px 20px rgba(0,0,0,.35);margin-top:18px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b77800}
.best{margin-top:12px;font-size:13px;color:#9fb3dd}
/* editor */
#editor{position:fixed;inset:0;pointer-events:none;z-index:10}
#editor>*{pointer-events:auto}
#topbar{position:absolute;top:0;left:0;right:0;padding:10px 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#topbar .ttl{font-weight:800;font-size:15px;text-shadow:0 2px 0 #000;flex:1;line-height:1.3}
#meters{background:rgba(10,18,36,.72);border-radius:12px;padding:7px 10px;font-size:11px;min-width:150px;pointer-events:none}
.mrow{display:flex;align-items:center;gap:6px;margin:2px 0}
.mrow b{width:44px;font-weight:800;text-align:left}
.bar{flex:1;height:8px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .25s}
#sidebtns{position:absolute;left:10px;top:58px;display:flex;flex-direction:column;gap:8px}
.sb{background:rgba(10,18,36,.75);color:#fff;font-size:12px;font-weight:800;padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.18)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(rgba(14,22,44,.92),#0d1530);border-radius:20px 20px 0 0;padding:10px 10px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.4)}
#tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:rgba(255,255,255,.08);color:#cdd8f5;font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px}
.tab.on{background:#ffd84a;color:#3a2200}
#opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;height:min(28vh,190px);overflow-y:auto;align-content:start;padding:2px}
.op{background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:6px 2px;font-size:11px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;min-height:58px;justify-content:center}
.op .ic{font-size:22px;line-height:1}
.op .sw{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.op.on{border-color:#ffd84a;background:rgba(255,216,74,.16)}
.textpane{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.textpane input{width:100%;font-family:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid #ffd84a;background:#0a1124;color:#fff;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.1);color:#fff;font-size:12px;padding:6px 10px;border-radius:999px}
.hint{font-size:11px;color:#9fb3dd;text-align:left}
#go{width:100%;margin-top:8px;font-size:18px;padding:12px}
/* store */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hudtop{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center}
#prog{flex:1;background:rgba(10,18,36,.75);border-radius:12px;padding:6px 10px;font-size:12px;font-weight:800}
#prog .bar{margin-top:4px;height:10px}
#likes{background:rgba(10,18,36,.75);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:800;color:#ff8fb1;white-space:nowrap}
#knock{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;background:linear-gradient(#7fd3ff,#3a8fe0);color:#06223f;font-weight:800;font-size:19px;padding:15px 26px;border-radius:999px;box-shadow:0 5px 0 #1f5a99,0 8px 22px rgba(0,0,0,.4);white-space:nowrap}
#knock:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #1f5a99}
#knock.alert{background:linear-gradient(#ff7a7a,#e02d2d);color:#fff;box-shadow:0 5px 0 #8f1010,0 0 30px rgba(255,60,60,.9);animation:pulse .35s infinite alternate}
#knock:disabled{filter:grayscale(1) brightness(.7)}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}
#banner{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#1a1a2e;font-weight:800;font-size:16px;padding:9px 16px;border-radius:14px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .25s}
#banner.red{background:#ff4b4b;color:#fff}
#banner.green{background:#3fd27a;color:#05301a}
.bubble{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#fff;color:#1a1a2e;font-size:13px;font-weight:800;padding:6px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.shout{background:#ffe14a}
.bubble.shout:after{border-top-color:#ffe14a}
#mine{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-size:12px;font-weight:800;color:#ffd84a;text-shadow:0 2px 0 #000;pointer-events:none;text-align:center;animation:bob 1s infinite alternate}
@keyframes bob{to{margin-top:-6px}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:15;transition:opacity .35s}
.floatlike{position:absolute;transform:translate(-50%,-100%);color:#ff6f9d;font-weight:800;font-size:16px;text-shadow:0 2px 0 #fff;pointer-events:none;animation:up 1.4s forwards}
@keyframes up{to{margin-top:-60px;opacity:0}}
/* result */
#result{background:rgba(6,10,22,.92);justify-content:flex-start;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top))}
#result img{width:min(92vw,420px);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#result .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;max-width:440px}
.btn2{background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:14px;padding:11px 16px;border-radius:999px}
.btnx{background:#000;color:#fff;font-weight:800;font-size:14px;padding:11px 16px;border-radius:999px;border:1px solid #555}
#story{font-size:15px;line-height:1.8;max-width:420px;margin:14px 0 4px;color:#e6ecff}
#cine{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:18;pointer-events:none}
#cine div{background:rgba(0,0,0,.78);padding:16px 22px;border-radius:16px;font-size:clamp(18px,5.4vw,26px);font-weight:800;line-height:1.6;text-align:center;max-width:92vw}

<body>
<canvas id="c"></canvas>

<div id="title" class="ov">
  <h1>盗まれない<span>傘</span>を<br>つくれ！</h1>
  <p class="lead">コンビニで買い物してる、ほんの数十秒。<br>外の傘立てに置いた傘が……<b>盗まれる！</b><br>誰にも盗まれない、でも自分は使える<br><b>“世界にひとつの傘”</b>をつくろう。</p>
  <div class="rules">
    🎨 生地・柄・持ち手・ぶら下げ・文字・ギミックを組み合わせる<br>
    🧍 傘泥棒にはいろんな人がいる。好みもバラバラ<br>
    ✊ 手が伸びたら「ガラスをコンコン」で追い払え（3回まで）<br>
    📸 ヘンな傘は写真を撮られて<b>バズる</b>かも
  </div>
  <button class="big" id="start">傘をつくる ▶</button>
  <div class="best" id="bestline"></div>
</div>

<div id="editor" hidden>
  <div id="topbar">
    <div class="ttl">☂ 傘をカスタム<br><small style="font-weight:500;font-size:11px;color:#bcd">ドラッグで回転</small></div>
    <div id="meters">
      <div class="mrow"><b>実用度</b><div class="bar"><i id="mU" style="background:#5fd38a"></i></div></div>
      <div class="mrow"><b>ヤバさ</b><div class="bar"><i id="mS" style="background:#ff6b6b"></i></div></div>
      <div class="mrow"><b>映え</b><div class="bar"><i id="mB" style="background:#ff9fd0"></i></div></div>
    </div>
  </div>
  <div id="sidebtns">
    <button class="sb" id="toggleOpen">閉じた姿</button>
    <button class="sb" id="randomize">🎲 おまかせ</button>
  </div>
  <div id="sheet">
    <div id="tabs"></div>
    <div id="opts"></div>
    <button class="big" id="go">コンビニの傘立てに置く ▶</button>
  </div>
</div>

<div id="hud" hidden>
  <div id="hudtop">
    <div id="prog">🛒 店内で買い物中… <span id="progtxt"></span><div class="bar"><i id="progbar" style="background:#7fd3ff;width:0"></i></div></div>
    <div id="likes">❤ 0</div>
  </div>
  <div id="banner" style="opacity:0"></div>
  <div id="mine">あなたの傘<br>▼</div>
  <button id="knock">✊ ガラスをコンコン（3）</button>
</div>
<div id="flash"></div>
<div id="cine" hidden><div id="cinetxt"></div></div>

<div id="result" class="ov" hidden>
  <img id="card" alt="結果カード">
  <div id="story"></div>
  <div class="row">
    <button class="big" id="share" style="margin-top:0;font-size:16px;padding:12px 22px">📤 結果をシェア</button>
    <button class="btnx" id="xpost">𝕏 でポスト</button>
  </div>
  <div class="row">
    <button class="btn2" id="retry">🔧 改造してリベンジ</button>
    <button class="btn2" id="fresh">🆕 ぜんぶ作り直す</button>
  </div>
  <div class="best" style="margin-bottom:20px">画像は長押しでも保存できます</div>
</div>
