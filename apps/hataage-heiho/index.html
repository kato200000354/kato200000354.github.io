<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>はたあげヘイホー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2a6e; --navy2:#173f9c; --yellow:#ffd23a; --red:#e8262b;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#0a1d4d;font-family:var(--font);color:var(--navy);overflow:hidden;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,24,70,.45);z-index:10;overflow:auto}
.panel{background:#fff;border:5px solid var(--navy);border-radius:26px;padding:22px 22px 20px;width:min(520px,100%);
  box-shadow:0 10px 0 rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.35);text-align:center;max-height:100%;overflow:auto}
h1{margin:0 0 4px;font-size:clamp(30px,8vw,46px);font-weight:900;color:var(--navy);letter-spacing:.02em;
  text-shadow:0 3px 0 var(--yellow)}
.sub{margin:0 0 16px;font-weight:800;color:#3a5bb0;font-size:14px;line-height:1.6}
.row{margin:12px 0}
.row .lbl{font-weight:900;font-size:14px;margin-bottom:6px}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg button{border:3px solid var(--navy);background:#eef3ff;color:var(--navy);border-radius:14px;
  padding:8px 14px;font-weight:900;font-size:16px;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;box-shadow:0 0 0 3px var(--yellow)}
.big{display:block;width:100%;margin-top:16px;border:0;border-radius:18px;padding:14px;font-size:24px;font-weight:900;
  background:linear-gradient(#ffe066,#ffb400);color:var(--navy);box-shadow:0 6px 0 #c47f00}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c47f00}
.big.sec{background:#eef3ff;box-shadow:0 6px 0 #9fb2dd;font-size:18px;padding:10px}
.howto{margin-top:14px;text-align:left;background:#f1f6ff;border-radius:14px;padding:10px 14px;font-size:13px;
  font-weight:800;line-height:1.75;color:#28437f}
.howto b{color:var(--red)}
.keys{font-size:12px;color:#5b6f9e}
.rank{list-style:none;padding:0;margin:10px 0 0;text-align:left}
.rank li{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:6px 0;border-radius:14px;
  background:#f1f6ff;font-weight:900;font-size:18px}
.rank .pl{width:52px;text-align:center;font-size:20px}
.rank .dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--navy)}
.rank .nm{flex:1}
.rank .rd{font-size:13px;color:#5b6f9e}
.rank li.first{background:linear-gradient(#fff6c8,#ffe27a)}
.best{margin-top:8px;font-weight:900;color:#3a5bb0}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="overlay" id="title">
  <div class="panel">
    <h1>はたあげヘイホー</h1>
    <p class="sub">ヘイホーの かけごえを よく きいて<br>はたを あげたり さげたり しよう！</p>
    <div class="row"><div class="lbl">あそぶ ひとの かず</div>
      <div class="seg" id="segHumans">
        <button data-v="1" aria-pressed="true">1人</button><button data-v="2">2人</button>
        <button data-v="3">3人</button><button data-v="4">4人</button>
      </div></div>
    <div class="row"><div class="lbl">CPUの つよさ</div>
      <div class="seg" id="segLevel">
        <button data-v="0">よわい</button><button data-v="1" aria-pressed="true">ふつう</button><button data-v="2">つよい</button>
      </div></div>
    <div class="row"><div class="lbl">こえ（よみあげ）</div>
      <div class="seg" id="segVoice">
        <button data-v="1" aria-pressed="true">ON</button><button data-v="0">OFF</button>
      </div></div>
    <button class="big" id="btnStart">スタート！</button>
    <div class="howto">
      ・「<b>赤</b>あげて」「白さげて」の かけごえ どおりに はたを うごかそう<br>
      ・「赤あげ<b>ないで</b>」は うごかしちゃ ダメ！<br>
      ・じかんぎれで まちがえていたら おとしあなに まっさかさま…<br>
      ・さいごの ひとりまで のこったら かち！
      <div class="keys">キー：1P A/S（ひとりなら ←/→ も OK）・2P F/G・3P J/K・4P L/;　タップでも そうさ できます</div>
    </div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel">
    <h1 id="resTitle">けっか</h1>
    <ul class="rank" id="rankList"></ul>
    <div class="best" id="bestLine"></div>
    <button class="big" id="btnAgain">もういちど！</button>
    <button class="big sec" id="btnTitle">タイトルへ</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 960;
let H = 640, K = 1, OX = 0, OY = 0, DPR = 1;
let bg = null;

const COLORS = ['#e53935', '#1e7be0', '#3fa63a', '#f6c41b'];
const NAMES = ['1P', '2P', '3P', '4P'];
const KEYMAP = [['a', 's'], ['f', 'g'], ['j', 'k'], ['l', ';']];
const RED = '#e8262b';
const PX = [230, 397, 563, 730];

const settings = { humans: 1, level: 1, voice: true };
let players = [];
let ref = { aL: 0, aR: 0, r: false, w: false };
const game = { phase: 'title', t: 0, round: 0, E: { r: false, w: false }, tokens: [], limit: 2, msg: '', msgT: 0, msgColor: '#fff' };
let particles = [];
let clouds = [];
let buttonsFlash = {};
let time = 0;

function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (f - r) * p); g = Math.round(g + (f - g) * p); b = Math.round(b + (f - b) * p);
  return `rgb(${r},${g},${b})`;
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

// ---------- layout ----------
const L = {};
function layout() {
  L.horizon = H * 0.42;
  L.R = H * 0.55;
  L.PY = H * 0.82;
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = innerWidth, ch = innerHeight;
  H = clamp(W * ch / cw, 560, 1700);
  K = Math.min(cw / W, ch / H);
  OX = (cw - W * K) / 2; OY = (ch - H * K) / 2;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  layout();
  buildBg();
}

// ---------- background ----------
function buildBg() {
  bg = document.createElement('canvas');
  bg.width = Math.round(W * K * DPR); bg.height = Math.round(H * K * DPR);
  const g = bg.getContext('2d');
  drawBgTo(g);
}
function drawBgTo(g) {
  g.setTransform(K * DPR, 0, 0, K * DPR, 0, 0);
  const hz = L.horizon;
  let gr = g.createLinearGradient(0, 0, 0, hz);
  gr.addColorStop(0, '#2f8fe8'); gr.addColorStop(0.7, '#7cc6ff'); gr.addColorStop(1, '#cdeeff');
  g.fillStyle = gr; g.fillRect(0, 0, W, hz + 2);
  // sea
  gr = g.createLinearGradient(0, hz - 30, 0, hz);
  gr.addColorStop(0, '#3db8e6'); gr.addColorStop(1, '#2a8fc9');
  g.fillStyle = gr; g.fillRect(0, hz - 30, W, 32);
  g.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 18; i++) { g.fillRect(i * 57 + (i % 3) * 13, hz - 22 + (i % 4) * 5, 22, 2); }
  // far islands
  const mesa = (x, w, h) => {
    g.fillStyle = '#c99a63'; g.beginPath();
    g.moveTo(x, hz); g.lineTo(x + 8, hz - h); g.lineTo(x + w - 8, hz - h); g.lineTo(x + w, hz); g.fill();
    g.fillStyle = '#d7ad78'; g.fillRect(x + 12, hz - h + 14, w - 24, 4);
    g.fillStyle = '#57b94a'; g.beginPath(); g.ellipse(x + w / 2, hz - h, w / 2 - 2, 12, 0, Math.PI, 0); g.fill();
    g.fillRect(x + 6, hz - h - 1, w - 12, 8);
    g.fillStyle = '#3d9a36'; g.fillRect(x + 6, hz - h + 6, w - 12, 4);
  };
  mesa(-20, 210, 110); mesa(150, 140, 70); mesa(330, 120, 45); mesa(820, 170, 100); mesa(905, 120, 140);
  // castle
  const cx = 700, cb = hz - 18;
  g.fillStyle = '#f2ece6'; g.fillRect(cx - 70, cb - 50, 140, 50);
  g.fillStyle = '#e4d8cf'; g.fillRect(cx - 70, cb - 12, 140, 12);
  const tower = (x, w, h, roof) => {
    g.fillStyle = '#f7f2ec'; g.fillRect(x - w / 2, cb - h, w, h);
    g.fillStyle = '#e06a7a'; g.beginPath(); g.moveTo(x - w / 2 - 5, cb - h); g.lineTo(x, cb - h - roof); g.lineTo(x + w / 2 + 5, cb - h); g.fill();
    g.fillStyle = '#c4475a'; g.beginPath(); g.moveTo(x, cb - h - roof); g.lineTo(x + w / 2 + 5, cb - h); g.lineTo(x + 2, cb - h); g.fill();
    g.fillStyle = '#5f86c9'; g.fillRect(x - 3, cb - h + 10, 6, 9);
    g.strokeStyle = '#555'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, cb - h - roof); g.lineTo(x, cb - h - roof - 12); g.stroke();
    g.fillStyle = RED; g.fillRect(x, cb - h - roof - 12, 8, 5);
  };
  tower(cx - 62, 20, 62, 30); tower(cx + 62, 20, 62, 30); tower(cx - 28, 24, 80, 34); tower(cx + 28, 24, 80, 34); tower(cx, 34, 108, 44);
  g.fillStyle = '#a0715a'; g.beginPath(); g.arc(cx, cb, 10, Math.PI, 0); g.fill();
  // grass strip & ground
  gr = g.createLinearGradient(0, hz, 0, H);
  gr.addColorStop(0, '#f2d79c'); gr.addColorStop(1, '#e3bb74');
  g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
  g.fillStyle = '#5cc04e'; g.beginPath(); g.moveTo(0, hz);
  for (let x = 0; x <= W; x += 40) g.quadraticCurveTo(x + 20, hz + 26 + Math.sin(x) * 4, x + 40, hz + 14);
  g.lineTo(W, hz); g.fill();
  g.fillStyle = '#43a23a'; g.fillRect(0, hz, W, 5);
  // sand ripples
  g.strokeStyle = 'rgba(190,140,70,.22)'; g.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const y = hz + 50 + i * (H - hz) / 9;
    g.beginPath(); g.ellipse(W / 2, y + 60, 300 + i * 70, 60 + i * 8, 0, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
  }
  // fences
  const fence = (x0, x1, y) => {
    g.fillStyle = '#a8713d';
    g.fillRect(x0, y - 22, x1 - x0, 6); g.fillRect(x0, y - 10, x1 - x0, 5);
    for (let x = x0; x <= x1; x += 46) { g.fillStyle = '#8c5a2b'; g.fillRect(x - 4, y - 32, 9, 34); g.fillStyle = '#b98348'; g.fillRect(x - 4, y - 32, 9, 4); }
  };
  fence(10, 200, hz + 34); fence(760, 950, hz + 34);
  // palms
  const palm = (x, y, h, dir) => {
    g.strokeStyle = '#a77a45'; g.lineWidth = 16; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + dir * 30, y - h * 0.6, x + dir * 10, y - h); g.stroke();
    g.strokeStyle = 'rgba(90,60,30,.35)'; g.lineWidth = 2;
    for (let i = 1; i < 8; i++) { const yy = y - h * i / 8; g.beginPath(); g.moveTo(x - 8 + dir * 18 * Math.sin(i / 3), yy); g.lineTo(x + 8 + dir * 18 * Math.sin(i / 3), yy - 3); g.stroke(); }
    const tx = x + dir * 10, ty = y - h;
    for (let i = 0; i < 7; i++) {
      const a = -Math.PI / 2 + (i - 3) * 0.55;
      g.fillStyle = i % 2 ? '#3fa83a' : '#56c24a';
      g.beginPath(); g.moveTo(tx, ty);
      const ex = tx + Math.cos(a) * 95, ey = ty + Math.sin(a) * 45 + 40;
      g.quadraticCurveTo(tx + Math.cos(a) * 60, ty + Math.sin(a) * 70 - 10, ex, ey);
      g.quadraticCurveTo(tx + Math.cos(a) * 50, ty + Math.sin(a) * 30, tx, ty); g.fill();
    }
    g.fillStyle = '#7a5a2a'; g.beginPath(); g.arc(tx - 6, ty + 8, 7, 0, 7); g.arc(tx + 7, ty + 9, 7, 0, 7); g.fill();
  };
  palm(30, hz + 40, 230, 1); palm(935, hz + 40, 250, -1);
  // flowers
  const fl = ['#ff7aa8', '#fff', '#ffd23a'];
  for (let i = 0; i < 14; i++) {
    const x = (i < 7 ? 20 + i * 26 : 760 + (i - 7) * 27), y = hz + 12 + (i % 3) * 5;
    g.fillStyle = fl[i % 3]; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill();
    g.fillStyle = '#f6a400'; g.beginPath(); g.arc(x, y, 1.6, 0, 7); g.fill();
  }
}

function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) clouds.push({ x: rnd(0, W), y: rnd(20, L.horizon * 0.6), s: rnd(0.6, 1.3), v: rnd(4, 10) });
}
function drawClouds(dt) {
  for (const c of clouds) {
    c.x += c.v * dt; if (c.x > W + 150) { c.x = -150; c.y = rnd(20, L.horizon * 0.6); }
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.arc(-40, 8, 26, 0, 7); ctx.arc(-10, -8, 36, 0, 7); ctx.arc(30, 2, 30, 0, 7); ctx.arc(60, 12, 20, 0, 7);
    ctx.rect(-60, 8, 130, 26); ctx.fill();
    ctx.fillStyle = 'rgba(190,220,250,.55)'; ctx.fillRect(-60, 28, 130, 6);
    ctx.restore();
  }
}

// ---------- shy guy ----------
function ease(t) { return t * t * (3 - 2 * t); }
function drawFlagArm(side, t, col, flagCol) {
  const th = Math.PI * (0.16 + 0.74 * ease(clamp(t, 0, 1)));
  const dx = side * Math.sin(th), dy = Math.cos(th);
  const sx = side * 25, sy = -58;
  const hx = sx + dx * 24, hy = sy + dy * 24;
  // stick
  const tx = hx + dx * 50, ty = hy + dy * 50;
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx - dx * 5, hy - dy * 5); ctx.lineTo(tx, ty); ctx.stroke();
  // cloth
  const bx = tx - dx * 28, by = ty - dy * 28;
  const wv = Math.sin(time * 9 + side) * 4, wv2 = Math.sin(time * 9 + side + 1.2) * 5;
  ctx.fillStyle = flagCol; ctx.strokeStyle = flagCol === '#fafafa' ? '#9aa3b5' : shade(flagCol, -0.3); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(tx, ty);
  ctx.quadraticCurveTo(tx + side * 20, ty + wv, tx + side * 40, ty + wv2 + 3);
  ctx.lineTo(bx + side * 40, by + wv2 + 3);
  ctx.quadraticCurveTo(bx + side * 20, by + wv, bx, by);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // arm
  ctx.strokeStyle = shade(col, -0.12); ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c9cfdc'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(hx, hy, 7, 0, 7); ctx.fill(); ctx.stroke();
}
function drawShy(x, y, s, col, aL, aR, opt = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (!opt.noShadow) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ell(0, 0, 42, 10); ctx.fill(); }
  // feet
  ctx.fillStyle = '#28327e'; ell(-15, -5, 15, 8); ctx.fill(); ell(15, -5, 15, 8); ctx.fill();
  // body
  const gr = ctx.createLinearGradient(-40, 0, 40, 0);
  gr.addColorStop(0, shade(col, 0.22)); gr.addColorStop(0.55, col); gr.addColorStop(1, shade(col, -0.25));
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.moveTo(-37, -9);
  ctx.quadraticCurveTo(-42, -50, -31, -80);
  ctx.bezierCurveTo(-28, -122, 28, -122, 31, -80);
  ctx.quadraticCurveTo(42, -50, 37, -9);
  ctx.quadraticCurveTo(0, -2, -37, -9); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(col, -0.35); ctx.lineWidth = 2; ctx.stroke();
  // belt
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#5a3a22'; ctx.fillRect(-45, -38, 90, 9);
  ctx.restore();
  ctx.fillStyle = '#ffcc33'; ctx.strokeStyle = '#a77a10'; ctx.lineWidth = 1.5;
  ctx.fillRect(-7, -40, 14, 13); ctx.strokeRect(-7, -40, 14, 13);
  ctx.fillStyle = '#5a3a22'; ctx.fillRect(-3, -36, 6, 5);
  // mask
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#cfd5e2'; ctx.lineWidth = 2;
  ell(0, -83, 22, 25); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#1a1a22';
  if (opt.dizzy) {
    ctx.strokeStyle = '#1a1a22'; ctx.lineWidth = 2.5;
    for (const ex of [-8, 8]) { ctx.beginPath(); ctx.moveTo(ex - 4, -92); ctx.lineTo(ex + 4, -84); ctx.moveTo(ex + 4, -92); ctx.lineTo(ex - 4, -84); ctx.stroke(); }
    ell(0, -70, 5, 5); ctx.fill();
  } else {
    ell(-8, -88, 4.5, 7.5); ctx.fill(); ell(8, -88, 4.5, 7.5); ctx.fill();
    ctx.fillStyle = '#fff'; ell(-7, -91, 1.5, 2.2); ctx.fill(); ell(9, -91, 1.5, 2.2); ctx.fill();
    ctx.fillStyle = '#1a1a22'; ell(0, -71, 4, 3.4); ctx.fill();
  }
  if (opt.hat) {
    ctx.fillStyle = '#1d2a5c'; rr(-20, -124, 40, 16, 5); ctx.fill();
    ctx.fillRect(-28, -110, 56, 5);
    ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(0, -116, 4, 0, 7); ctx.fill();
  }
  drawFlagArm(-1, aL, col, RED);
  drawFlagArm(1, aR, col, '#fafafa');
  ctx.restore();
}

// ---------- players ----------
function makePlayers() {
  players = [];
  for (let i = 0; i < 4; i++) {
    players.push({
      id: i, color: COLORS[i], name: NAMES[i], human: i < settings.humans,
      r: false, w: false, aL: 0, aR: 0, alive: true, fallT: -1, place: 0, outRound: 0,
      mark: '', sched: [], jump: 0
    });
  }
}
function toggle(p, f) {
  if (!p.alive || game.phase !== 'call') return;
  p[f] = !p[f];
  buttonsFlash[p.id + f] = 0.18;
  sfx.flap(p[f]);
}

// ---------- commands ----------
const FLAGS = { r: { t: '赤', c: RED, say: 'あか' }, w: { t: '白', c: '#ffffff', say: 'しろ' } };
function pickAction(f, up, round) {
  const opts = [];
  if (!up) { opts.push(['あげて', true, 3]); if (round >= 3) opts.push(['あげないで', false, 1.1]); if (round >= 5) opts.push(['さげて', false, 0.6]); }
  else { opts.push(['さげて', false, 3]); if (round >= 3) opts.push(['さげないで', true, 1.1]); if (round >= 5) opts.push(['あげて', true, 0.6]); }
  let tot = opts.reduce((a, o) => a + o[2], 0), x = Math.random() * tot;
  for (const o of opts) { if ((x -= o[2]) < 0) return o; }
  return opts[0];
}
function makeCommand() {
  const round = game.round;
  const E = game.E;
  const dbl = round >= 6 && Math.random() < Math.min(0.5, 0.2 + round * 0.015);
  const order = Math.random() < 0.5 ? ['r', 'w'] : ['w', 'r'];
  const use = dbl ? order : [order[0]];
  const tokens = []; let say = ''; let tricky = false;
  for (const f of use) {
    const [word, res] = pickAction(f, E[f], round);
    if (word.includes('ないで') || (word === 'さげて' && !E[f]) || (word === 'あげて' && E[f])) tricky = true;
    E[f] = res;
    tokens.push({ t: FLAGS[f].t, c: FLAGS[f].c, flag: true }, { t: word + ' ', c: '#0e2a6e' });
    say += FLAGS[f].say + word + '、';
  }
  game.tokens = tokens; game.tricky = tricky; game.dbl = dbl;
  const humansAlive = players.some(p => p.human && p.alive);
  let lim = Math.max(0.85, 2.3 - round * 0.065) + (dbl ? 0.45 : 0);
  if (!humansAlive) lim *= 0.7;
  game.limit = lim;
  speak(say);
}

function scheduleCpu(p) {
  const lv = settings.level;
  const base = [0.88, 0.95, 0.985][lv], decay = [0.01, 0.007, 0.004][lv];
  let acc = base - game.round * decay - (game.tricky ? [0.08, 0.05, 0.025][lv] : 0) - (game.dbl ? 0.04 : 0);
  acc = clamp(acc, 0.45, 0.99);
  const target = { r: game.E.r, w: game.E.w };
  let delay = game.limit * rnd(...[[0.35, 0.8], [0.25, 0.7], [0.18, 0.55]][lv]);
  if (Math.random() > acc) {
    const needs = target.r !== p.r || target.w !== p.w;
    if (needs && Math.random() < 0.35) delay = game.limit * rnd(1.05, 1.4);
    else { const f = Math.random() < 0.5 ? 'r' : 'w'; target[f] = !target[f]; }
  }
  p.sched = [];
  let k = 0;
  for (const f of ['r', 'w']) if (target[f] !== p[f]) { p.sched.push({ t: delay + k * rnd(0.08, 0.2), f }); k++; }
}

// ---------- flow ----------
function startGame() {
  sfx.init();
  makePlayers();
  ref = { aL: 0, aR: 0, r: false, w: false };
  game.E = { r: false, w: false };
  game.round = 0; game.phase = 'count'; game.t = 0; game.tokens = [];
  particles = [];
  show('title', false); show('result', false);
}
function nextRound() {
  game.round++;
  for (const p of players) p.mark = '';
  makeCommand();
  game.phase = 'call'; game.t = 0;
  for (const p of players) if (!p.human && p.alive) scheduleCpu(p);
  sfx.whistle();
}
function judge() {
  game.phase = 'judge'; game.t = 0;
  ref.r = game.E.r; ref.w = game.E.w;
  const alive = players.filter(p => p.alive);
  const losers = alive.filter(p => p.r !== game.E.r || p.w !== game.E.w);
  for (const p of alive) { p.sched = []; p.mark = losers.includes(p) ? 'x' : 'o'; }
  if (losers.length === alive.length) {
    for (const p of alive) { p.r = game.E.r; p.w = game.E.w; }
    flash('ぜんいん セーフ！', '#ffd23a'); sfx.safe();
    return;
  }
  const after = alive.length - losers.length;
  for (const p of losers) { p.alive = false; p.fallT = 0; p.place = after + 1; p.outRound = game.round; }
  if (losers.length) { flash('アウト！', '#ff5a5a'); sfx.out(); setTimeout(() => sfx.fall(), 350); }
  else { flash('セーフ！', '#7dff8a'); sfx.safe(); }
  if (after === 1) { const w = alive.find(p => p.alive); w.place = 1; w.outRound = game.round; }
}
function flash(t, c) { game.msg = t; game.msgT = 1.3; game.msgColor = c; }

function finish() {
  game.phase = 'result';
  const winner = players.find(p => p.alive);
  sfx.fanfare();
  for (let i = 0; i < 90; i++) particles.push({ x: rnd(0, W), y: rnd(-200, 0), vx: rnd(-30, 30), vy: rnd(80, 200), c: COLORS[i % 4], s: rnd(5, 10), rot: rnd(0, 6), conf: 1, life: 6 });
  const list = document.getElementById('rankList');
  list.innerHTML = '';
  const sorted = [...players].sort((a, b) => a.place - b.place || b.outRound - a.outRound);
  for (const p of sorted) {
    const li = document.createElement('li');
    if (p.place === 1) li.className = 'first';
    li.innerHTML = `<span class="pl">${p.place === 1 ? '👑' : p.place + 'い'}</span><span class="dot" style="background:${p.color}"></span>` +
      `<span class="nm">${p.name}${p.human ? '' : '（CPU）'}</span><span class="rd">${p.place === 1 ? 'ゆうしょう！' : p.outRound + 'ラウンドで アウト'}</span>`;
    list.appendChild(li);
  }
  const human = players.filter(p => p.human);
  let title = winner.human ? `${winner.name} の かち！` : 'ざんねん…';
  if (settings.humans > 1 && !winner.human) title = 'CPU の かち！';
  document.getElementById('resTitle').textContent = title;
  let bestLine = '';
  if (settings.humans === 1) {
    const me = players[0];
    const score = me.place === 1 ? game.round : me.outRound - 1;
    let best = 0;
    try { best = +localStorage.getItem('hataage-best') || 0; if (score > best) localStorage.setItem('hataage-best', String(score)); } catch (e) {}
    bestLine = `クリアした ラウンド：${score}　（ベスト：${Math.max(best, score)}）` + (score > best ? ' ✨きろく こうしん！' : '');
  }
  document.getElementById('bestLine').textContent = bestLine;
  setTimeout(() => { if (game.phase === 'result') show('result', true); }, 1600);
}

function update(dt) {
  game.t += dt;
  if (game.msgT > 0) game.msgT -= dt;
  for (const k in buttonsFlash) { buttonsFlash[k] -= dt; if (buttonsFlash[k] <= 0) delete buttonsFlash[k]; }
  if (game.phase === 'count') {
    const n = 3 - Math.floor(game.t);
    if (n !== game.lastCount && n > 0) { game.lastCount = n; sfx.tick(); }
    if (game.t >= 3) { game.lastCount = 0; nextRound(); }
  } else if (game.phase === 'call') {
    for (const p of players) {
      if (p.human || !p.alive) continue;
      while (p.sched.length && p.sched[0].t <= game.t) { const s = p.sched.shift(); p[s.f] = !p[s.f]; }
    }
    if (game.t >= game.limit) judge();
  } else if (game.phase === 'judge') {
    if (game.t >= 1.6) {
      const alive = players.filter(p => p.alive);
      if (alive.length <= 1) finish(); else nextRound();
    }
  }
  const sp = Math.min(1, dt * 16);
  for (const p of players) {
    p.aL += ((p.r ? 1 : 0) - p.aL) * sp; p.aR += ((p.w ? 1 : 0) - p.aR) * sp;
    if (p.fallT >= 0) p.fallT += dt;
    if (game.phase === 'result' && p.alive) p.jump += dt;
  }
  const rs = Math.min(1, dt * 12);
  ref.aL += ((ref.r ? 1 : 0) - ref.aL) * rs; ref.aR += ((ref.w ? 1 : 0) - ref.aR) * rs;
  for (const q of particles) {
    q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.conf) { q.rot += dt * 6; q.vx += Math.sin(time * 3 + q.y * 0.02) * 4 * dt; }
    else q.vy += 600 * dt;
  }
  particles = particles.filter(q => q.life > 0 && q.y < H + 40);
}

// ---------- drawing ----------
function getButtons() {

function drawBubble() {
  if (!(game.phase === 'call' || game.phase === 'judge') || !game.tokens.length) return;
  const cx = W / 2, top = L.R - 275, h = 76;
  ctx.font = `900 40px ${FONT}`;
  let tw = 0; for (const t of game.tokens) tw += ctx.measureText(t.t).width;
  const w = Math.max(260, tw + 60);
  const pop = game.phase === 'call' ? Math.min(1, game.t * 8) : 1;
  ctx.save(); ctx.translate(cx, top + h / 2); ctx.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop); ctx.translate(-cx, -(top + h / 2));
  ctx.fillStyle = 'rgba(0,0,0,.18)'; rr(cx - w / 2, top + 6, w, h, 24); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0e2a6e'; ctx.lineWidth = 5;
  rr(cx - w / 2, top, w, h, 24); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 14, top + h - 2); ctx.lineTo(cx, top + h + 20); ctx.lineTo(cx + 14, top + h - 2); ctx.closePath();
  ctx.fill(); ctx.beginPath(); ctx.moveTo(cx - 14, top + h + 1); ctx.lineTo(cx, top + h + 20); ctx.lineTo(cx + 14, top + h + 1); ctx.stroke();
  let x = cx - tw / 2; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const t of game.tokens) {
    if (t.flag) {
      ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = t.c === '#ffffff' ? '#0e2a6e' : '#7a0d10';
      ctx.strokeText(t.t, x, top + h / 2 + 2);
    }
    ctx.fillStyle = t.c; ctx.fillText(t.t, x, top + h / 2 + 2);
    x += ctx.measureText(t.t).width;
  }
  ctx.restore();
  // timer bar
  if (game.phase === 'call') {
    const frac = clamp(1 - game.t / game.limit, 0, 1);
    const bw = 280, by = top + h + 28;
    ctx.fillStyle = 'rgba(14,42,110,.85)'; rr(cx - bw / 2 - 4, by - 4, bw + 8, 18, 9); ctx.fill();
    ctx.fillStyle = frac > 0.5 ? '#5ad65a' : frac > 0.25 ? '#ffd23a' : '#ff4a4a';
    if (frac > 0) { rr(cx - bw / 2, by, bw * frac, 10, 5); ctx.fill(); }
  }
}

function drawPedestal() {
  const x = W / 2, y = L.R;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ell(x, y + 36, 92, 20); ctx.fill();
  // side
  const n = 10;
  for (let i = 0; i < n; i++) {
    const a0 = Math.PI * i / n, a1 = Math.PI * (i + 1) / n;
    ctx.fillStyle = i % 2 ? '#fff' : '#e8483d';
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a0) * 80, y + Math.sin(a0) * 20);
    ctx.lineTo(x + Math.cos(a1) * 80, y + Math.sin(a1) * 20);
    ctx.lineTo(x + Math.cos(a1) * 80, y + 28 + Math.sin(a1) * 20);
    ctx.lineTo(x + Math.cos(a0) * 80, y + 28 + Math.sin(a0) * 20); ctx.fill();
  }
  ctx.fillStyle = '#f7c9b9'; ell(x, y, 80, 20); ctx.fill();
  ctx.strokeStyle = '#e8483d'; ctx.lineWidth = 4; ell(x, y, 72, 16); ctx.stroke();
}

function drawPlayer(p) {
  const x = PX[p.id], y = L.PY;
  // pad / hole
  if (p.fallT >= 0) {
    const o = Math.min(1, p.fallT * 6);
    ctx.fillStyle = '#2b1a10'; ell(x, y, 54 * o, 15 * o); ctx.fill();
    ctx.fillStyle = '#120a05'; ell(x, y + 2, 46 * o, 11 * o); ctx.fill();
  } else {
    ctx.strokeStyle = p.color; ctx.lineWidth = 5; ell(x, y, 56, 15); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ell(x, y, 62, 18); ctx.stroke();
  }
  if (p.fallT >= 0) {
    if (p.fallT > 1.4) return;
    const t = Math.max(0, p.fallT - 0.12);
    const dy = 0.5 * 2200 * t * t;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, y + 2); ctx.clip();
    drawShy(x, y + dy - (t < 0.01 ? 0 : 0), 1, p.color, 1, 1, { dizzy: true, noShadow: true });
    ctx.restore();
    return;
  }
  let jy = 0;
  if (p.jump > 0) jy = -Math.abs(Math.sin(p.jump * 7)) * 30;
  drawShy(x, y + jy, 1, p.color, p.aL, p.aR);

  }

  const lw = 44;
  ctx.fillStyle = p.color; rr(x - lw / 2, y + 16, lw, 22, 11); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(p.name, x, y + 28);
}
function drawFallMarks() {
  for (const p of players) {

      ctx.strokeStyle = '#2f5fe0'; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 20, my - 20); ctx.lineTo(x + 20, my + 20); ctx.moveTo(x + 20, my - 20); ctx.lineTo(x - 20, my + 20); ctx.stroke();
    }

}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (game.phase !== 'title') update(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0a1d4d'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bg, OX * DPR, OY * DPR);
  ctx.setTransform(K * DPR, 0, 0, K * DPR, OX * DPR, OY * DPR);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, L.horizon - 30); ctx.clip(); drawClouds(dt); ctx.restore();

  drawPedestal();
  drawShy(W / 2, L.R, 1.18, '#e0245e', ref.aL, ref.aR, { hat: true, noShadow: true });
  if (game.phase === 'call') outlineText('？', W / 2 + 70, L.R - 120, 34, '#ffd23a', '#0e2a6e', 6);
  drawBubble();
  if (players.length) for (const p of players) drawPlayer(p);
  drawFallMarks();
  if (players.length && game.phase !== 'title') for (const b of getButtons()) drawButton(b);
  drawHUD();

  if (game.phase === 'count') {
    const n = 3 - Math.floor(game.t);
    const f = game.t % 1;
    outlineText(n > 0 ? String(n) : 'スタート！', W / 2, H * 0.3, 90 + (1 - f) * 30, '#ffd23a', '#0e2a6e', 12);
    outlineText('かけごえ どおりに はたを うごかそう！', W / 2, H * 0.3 + 80, 24, '#fff', '#0e2a6e', 7);
  }
  if (game.msgT > 0) {
    const a = Math.min(1, game.msgT * 3);
    ctx.globalAlpha = a;
    const s = 1 + Math.max(0, game.msgT - 1.1) * 3;
    outlineText(game.msg, W / 2, L.PY - 210, 56 * s, game.msgColor, '#0e2a6e', 12);
    ctx.globalAlpha = 1;
  }
  if (game.phase === 'result') {
    const w = players.find(p => p.alive);
    if (w) outlineText(`${w.name} の かち！`, W / 2, L.PY - 210, 60, '#ffd23a', '#0e2a6e', 12);
  }
  for (const q of particles) {
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot || 0); ctx.fillStyle = q.c;
    ctx.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); ctx.restore();
  }
  requestAnimationFrame(frame);
}

// ---------- input ----------
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (game.phase === 'result' && (k === 'enter' || k === ' ')) { startGame(); return; }
  if (!players.length) return;
  for (const p of players) {
    if (!p.human) continue;
    const km = KEYMAP[p.id];
    if (k === km[0]) toggle(p, 'r');
    else if (k === km[1]) toggle(p, 'w');
  }
  if (settings.humans === 1) {
    if (k === 'arrowleft') { toggle(players[0], 'r'); e.preventDefault(); }
    if (k === 'arrowright') { toggle(players[0], 'w'); e.preventDefault(); }
  }
});
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  sfx.init();
  if (!players.length || game.phase === 'title') return;
  const x = (e.clientX - OX) / K, y = (e.clientY - OY) / K;
  for (const b of getButtons()) {
    if (Math.hypot(x - b.x, y - b.y) <= b.r + 10) { toggle(b.p, b.f); return; }
  }
});

// ---------- audio ----------
const sfx = (() => {
  let ac = null;
  function init() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
  function tone(f, d, type = 'square', v = 0.08, f2 = null, delay = 0) {
    if (!ac) return;
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  }
  return {
    init,
    tick: () => tone(880, 0.12, 'square', 0.06),
    whistle: () => { tone(2100, 0.09, 'sine', 0.07); tone(2300, 0.12, 'sine', 0.07, null, 0.1); },
    flap: up => tone(up ? 520 : 360, 0.06, 'triangle', 0.09, up ? 760 : 240),
    safe: () => { tone(784, 0.1, 'square', 0.05); tone(1047, 0.16, 'square', 0.05, null, 0.1); },
    out: () => tone(180, 0.35, 'sawtooth', 0.07, 120),
    fall: () => tone(1200, 0.8, 'sine', 0.08, 120),
    fanfare: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? 0.5 : 0.14, 'square', 0.05, null, i * 0.14)); }
  };
})();
let jaVoice = null;
function pickVoice() {
  try { jaVoice = speechSynthesis.getVoices().find(v => /ja/i.test(v.lang)) || null; } catch (e) {}
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!settings.voice || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
    u.rate = Math.min(2, 1.35 + game.round * 0.03); u.pitch = 1.5;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- menus ----------
function show(id, on) { document.getElementById(id).hidden = !on; }
function seg(id, key, num) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    for (const x of el.children) x.setAttribute('aria-pressed', String(x === b));
    settings[key] = num ? +b.dataset.v : b.dataset.v === '1';
  });
}
seg('segHumans', 'humans', true); seg('segLevel', 'level', true); seg('segVoice', 'voice', false);
document.getElementById('btnStart').addEventListener('click', () => { if (settings.voice) speak(' '); startGame(); });
document.getElementById('btnAgain').addEventListener('click', startGame);
document.getElementById('btnTitle').addEventListener('click', () => {
  show('result', false); show('title', true); game.phase = 'title'; players = []; ref = { aL: 0, aR: 0, r: false, w: false }; game.tokens = []; game.round = 0; particles = [];
});

addEventListener('resize', () => { resize(); });
resize(); initClouds();
requestAnimationFrame(frame);
})();
</script>
