<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#123563">
<title>モンスター冒険記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2b7bd0;--blue2:#1b5cad;--navy:#0f2c55;--txt:#1d2b3e;--line:#c9d9ec;--sub:#5d7290}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1a30;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Meiryo',sans-serif;color:var(--txt);touch-action:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#pcard{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(16,44,86,.9),rgba(10,30,62,.9));border:2px solid rgba(160,205,255,.7);border-radius:40px 14px 14px 40px;padding:4px 14px 4px 4px;color:#fff;min-width:200px}
#avatar{width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:#cfe8ff}
.pinfo{flex:1;font-size:14px}
.pinfo b{color:#ffe27a}
.xpbar{height:8px;background:rgba(255,255,255,.25);border-radius:6px;margin:3px 0;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#5ee07a,#2fbf57);border-radius:6px}
.xpt{font-size:11px;text-align:right;opacity:.85}
#quest{position:absolute;left:10px;top:76px;display:flex;gap:8px;align-items:center;background:rgba(10,30,62,.82);border:2px solid rgba(160,205,255,.5);border-radius:12px;padding:6px 12px 6px 8px;color:#fff;max-width:min(330px,calc(100vw - 150px))}
.qi{width:26px;height:26px;border-radius:50%;background:#ffcf3a;color:#7a4a00;font-weight:900;display:grid;place-items:center;flex:none;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.qh{font-size:11px;color:#ffe27a;font-weight:800}
#qText{font-size:13px;font-weight:700}
#topR{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#gold{display:flex;align-items:center;gap:8px;background:rgba(10,30,62,.85);border:2px solid rgba(160,205,255,.6);color:#fff;border-radius:30px;padding:4px 14px 4px 6px;font-size:17px}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6a8,#f5c518 55%,#c99000);border:2px solid #a87800;display:inline-block}
#mmWrap{position:relative;width:118px;height:118px}
#minimap{width:118px;height:118px;border-radius:50%;border:4px solid #e9f3ff;box-shadow:0 2px 10px rgba(0,0,0,.4);background:#2a4a6a}
.cmp{position:absolute;font-size:11px;font-weight:900;color:#fff;background:#1b4f8f;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
.cmp.n{top:-4px;left:50px}.cmp.s{bottom:-4px;left:50px}.cmp.w{left:-4px;top:50px}.cmp.e{right:-4px;top:50px}
#menuBtn{background:linear-gradient(#3d8ee6,#1f60b5);color:#fff;border:2px solid #cfe5ff;border-radius:12px;padding:7px 12px;font-weight:800;font-size:14px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
#areaName{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(10,30,62,.85);color:#fff;font-size:24px;font-weight:800;padding:10px 28px;border-radius:14px;border:2px solid #9fd0ff;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
#areaName.show{opacity:1}
#joy{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.25),rgba(30,60,100,.45));border:3px solid rgba(255,255,255,.55);touch-action:none}
#joy::before{content:'▲';position:absolute;top:4px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:12px}
#joy::after{content:'▼';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:12px}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c9d6e4);box-shadow:0 3px 8px rgba(0,0,0,.4)}
#actBtns{position:absolute;right:18px;bottom:24px;display:flex;gap:12px;align-items:flex-end}
.rbtn{width:76px;height:76px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 40% 30%,#3d79c4,#16396e);color:#fff;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.rbtn span{font-size:26px;line-height:1}
.rbtn.on{background:radial-gradient(circle at 40% 30%,#ffb347,#d9611a)}
#talkBtn{width:84px;height:84px}
@media (min-width:900px) and (hover:hover){#joy{opacity:.55}}
/* ---------- dialog ---------- */
#dialog{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));min-height:96px;background:linear-gradient(#ffffff,#eef5fd);border:4px solid #2f7ad0;border-radius:16px;padding:16px 22px;z-index:50;font-size:18px;font-weight:700;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer}
#dName{position:absolute;top:-16px;left:18px;background:#2f7ad0;color:#fff;padding:2px 14px;border-radius:10px;font-size:14px}
#dNext{position:absolute;right:16px;bottom:8px;color:#2f7ad0;animation:bob .7s infinite}
@keyframes bob{50%{transform:translateY(3px)}}
/* ---------- battle ---------- */
#battle{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#000}
#bscene{position:relative;flex:1;min-height:0}
#bcv{position:absolute;inset:0;width:100%;height:100%}
.hpbox{position:absolute;background:linear-gradient(rgba(16,44,86,.92),rgba(10,30,62,.92));border:2px solid rgba(170,210,255,.8);color:#fff;border-radius:14px;padding:8px 14px;min-width:230px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
#eBox{left:12px;top:12px}
#aBox{right:12px;bottom:18%}
.hpn{display:flex;align-items:center;gap:6px;font-size:17px}
.hpn .lv{margin-left:auto;font-weight:800;color:#ffe27a}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.4)}
.bar i{display:block;height:100%;width:100%;background:#4ade80;border-radius:6px}
.hpt{text-align:right;font-weight:800;font-size:16px;margin-top:2px}
.xbar{height:4px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;margin-top:3px}
.xbar i{display:block;height:100%;background:#60c5ff}
.tic{font-size:15px}
#bbox{background:linear-gradient(#173f75,#0f2c55);border-top:3px solid #6fb0f0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));min-height:170px;color:#fff;cursor:pointer}
#btext{font-size:19px;font-weight:800;min-height:30px;margin-bottom:10px;padding:2px 6px}
.cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cbtn{border:2px solid rgba(255,255,255,.6);border-radius:14px;color:#fff;font-weight:800;padding:12px 4px;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:inset 0 -5px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.cbtn .ic{font-size:26px;line-height:1}
.cbtn:active{transform:translateY(2px)}
.c-red{background:linear-gradient(#f8716b,#d23a3a)}.c-blue{background:linear-gradient(#5aa8ff,#2468d8)}.c-green{background:linear-gradient(#5fd36a,#2a9d3c)}.c-purple{background:linear-gradient(#9b8cff,#5b4bd6)}.c-gray{background:linear-gradient(#8a98ad,#5a6880)}
.mvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mvb{background:#fff;color:var(--txt);border:0;border-left:8px solid #999;border-radius:12px;padding:8px 12px;text-align:left;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.mvb small{font-size:12px;color:var(--sub);font-weight:700}
.mvb:disabled{opacity:.45}
.blist{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.bli{display:flex;align-items:center;gap:10px;background:#fff;color:var(--txt);border:0;border-radius:10px;padding:6px 12px;font-weight:800;font-size:15px;text-align:left}
.bli .r{margin-left:auto;font-size:13px;color:var(--sub)}
.bback{margin-top:8px;background:#5a6880;color:#fff;border:0;border-radius:10px;padding:8px 18px;font-weight:800}
@media (max-width:620px){.cmds{grid-template-columns:1fr 1fr}.mvs{grid-template-columns:1fr}.hpbox{min-width:170px;padding:6px 10px}.hpn{font-size:14px}#btext{font-size:16px}#aBox{bottom:8%}}
/* ---------- panel ---------- */
#panel{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(8,22,46,.5);padding:10px}
.win{width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(#f7fbff,#e5eff9);border:3px solid #fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.4);overflow:hidden}
.whead{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;background:linear-gradient(#bfe0ff,#dcefff);border-bottom:2px solid #9cc8f0}
.chip{background:linear-gradient(#2f80d8,#1b5cad);color:#fff;font-weight:800;font-size:17px;padding:5px 18px;border-radius:20px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.whead .sp{flex:1}
.xb{width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:#1f5fb0;color:#fff;font-size:18px;font-weight:900}
.wbody{padding:12px;overflow:auto;flex:1}
.win.dark{background:linear-gradient(#173f75,#0f2c55);color:#fff;border-color:#6fb0f0;width:min(640px,100%)}
.win.dark .whead{background:transparent;border-bottom-color:#2f5f9a}
.mgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:10px}
.mbtn{width:118px;height:110px;border-radius:16px;border:2px solid #7fb6ec;background:linear-gradient(#245a9e,#163e74);color:#fff;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 2px rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.3)}
.mbtn .ic{font-size:36px;line-height:1}
.mbtn:hover{filter:brightness(1.15)}
.btn{background:linear-gradient(#3d8ee6,#1f60b5);color:#fff;border:2px solid #fff;border-radius:22px;padding:9px 22px;font-weight:800;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.btn:disabled{filter:grayscale(1);opacity:.5}
.btn.red{background:linear-gradient(#f8716b,#d23a3a)}.btn.green{background:linear-gradient(#5fd36a,#2a9d3c)}.btn.gray{background:linear-gradient(#8a98ad,#5a6880)}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px}
.tchip{display:inline-flex;align-items:center;gap:2px;color:#fff;font-size:12px;font-weight:800;padding:2px 9px;border-radius:12px;white-space:nowrap}
.ball{display:inline-block;width:22px;height:22px;border-radius:50%;background:linear-gradient(#e94b4b 0 44%,#2a2a2a 44% 56%,#fafafa 56%);border:2px solid #2a2a2a;position:relative;flex:none;vertical-align:middle}
.ball::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:2px solid #2a2a2a}
.ball.b2{background:linear-gradient(#3b82f6 0 44%,#2a2a2a 44% 56%,#fafafa 56%)}
.ball.b3{background:linear-gradient(#facc15 0 44%,#2a2a2a 44% 56%,#333 56%)}
.ball.big{width:40px;height:40px}.ball.big::after{width:10px;height:10px}
.ball.huge{width:64px;height:64px;border-width:3px}.ball.huge::after{width:16px;height:16px;border-width:3px}
.emo{font-size:24px;line-height:1;flex:none}
/* bag */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:2px solid #9cc8f0;background:#fff;color:#1b5cad;border-radius:12px;padding:7px 18px;font-weight:800;font-size:15px}
.tab.on{background:linear-gradient(#3d8ee6,#1f60b5);color:#fff;border-color:#fff}
.bag{display:grid;grid-template-columns:1fr 250px;gap:12px}
.ilist{display:flex;flex-direction:column;gap:6px}
.irow{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.irow.on{background:linear-gradient(#3d8ee6,#2468d8);color:#fff;border-color:#fff}
.irow .nm{font-weight:800;font-size:16px}.irow .ds{font-size:12px;opacity:.8}
.irow .ct{margin-left:auto;font-weight:800}
.idet{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;align-self:start}
.idet .big{font-size:56px;width:90px;height:90px;display:grid;place-items:center;background:#eef5fd;border-radius:16px}
.qty{display:flex;align-items:center;border-radius:20px;overflow:hidden;border:2px solid #2468d8}
.qty button{width:40px;height:34px;border:0;background:#2468d8;color:#fff;font-size:20px;font-weight:900}
.qty span{width:56px;text-align:center;font-weight:800;font-size:18px}
/* raise */
.raise{display:grid;grid-template-columns:1fr 220px;gap:12px}
.rcard{display:grid;grid-template-columns:170px 1fr;gap:14px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px}
.rpor{background:linear-gradient(#d7ecff,#f3f9ff);border-radius:14px;display:grid;place-items:center;border:2px solid #b9d8f5}
.rname{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.srow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3ecf6;padding:4px 2px;font-size:15px}
.srow b{font-size:16px}
.srow .pl{color:#2a9d3c;font-size:12px}
.hearts{font-size:18px;color:#ff5c9a;letter-spacing:1px}
.ract{display:flex;flex-direction:column;gap:8px}
.abtn{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #9cc8f0;border-radius:14px;padding:10px 14px;font-weight:800;font-size:16px;color:var(--txt);text-align:left;box-shadow:0 2px 0 #b9d8f5}
.abtn .ic{font-size:24px}.abtn small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.abtn:disabled{opacity:.45}
.prow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pth{width:74px;height:74px;border-radius:12px;border:3px solid #b9d8f5;background:linear-gradient(#e4f2ff,#fff);position:relative;padding:0;cursor:pointer}
.pth.on{border-color:#2468d8;box-shadow:0 0 0 3px #8fc3ff}
.pth .lv{position:absolute;bottom:1px;right:4px;font-size:11px;font-weight:800}
.pth.dead{filter:grayscale(1)}
.pth.add{font-size:28px;color:#6fa4dc;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pth.add small{font-size:10px}
/* status */
.stat3{display:grid;grid-template-columns:200px 1fr 1fr;gap:12px}
.mvrow{display:flex;align-items:center;gap:10px;background:#f3f8fe;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.mvrow .mn{font-weight:800;flex:1}
.mvrow .pp{font-size:12px;font-weight:800;color:var(--sub);text-align:right}
/* dex */
.dex{display:grid;grid-template-columns:130px 1fr;gap:12px}
.flt{display:flex;flex-direction:column;gap:4px}
.flt button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:10px;font-weight:800;font-size:15px;color:var(--txt)}
.flt button.on{background:#ffe27a}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.dc{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px;text-align:center;position:relative;cursor:pointer}
.dc .no{position:absolute;left:6px;top:3px;font-size:11px;font-weight:800;color:var(--sub)}
.dc .dn{font-size:13px;font-weight:800}
.dc .ball{position:absolute;right:5px;top:4px;width:14px;height:14px;border-width:1.5px}
.dc .ball::after{width:3px;height:3px;border-width:1px}
.dhead{display:flex;justify-content:flex-end;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dcount{background:linear-gradient(#2f80d8,#1b5cad);color:#fff;border-radius:20px;padding:4px 16px;font-weight:800}
.dcount b{font-size:20px}
/* map */
.mapw{position:relative;width:100%;aspect-ratio:16/10;max-height:70vh;border-radius:14px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.mapw>canvas{position:absolute;inset:0;width:100%;height:100%}
.mlab{position:absolute;transform:translate(-50%,-50%);background:rgba(15,44,85,.9);color:#fff;border:2px solid #fff;border-radius:12px;padding:3px 12px;font-weight:800;font-size:14px;white-space:nowrap;cursor:pointer}
.mlab.un{background:rgba(80,90,110,.85)}
.mlab.sel{background:#ffcf3a;color:#5a3a00}
.minfo{position:absolute;right:10px;bottom:10px;background:rgba(15,44,85,.92);color:#fff;border-radius:14px;padding:10px 14px;border:2px solid #9fd0ff;min-width:230px;max-width:60%}
.minfo .ms{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
.mback{position:absolute;left:10px;bottom:10px}
.here{position:absolute;transform:translate(-50%,-100%);font-size:26px;animation:bob .8s infinite;pointer-events:none}
/* facility */
.fac{display:grid;grid-template-columns:1fr 240px;gap:12px}
.fview{background:linear-gradient(#bfe6ff 0,#eaf7ff 45%,#d7f0c0 46%,#b6e09a 100%);border-radius:14px;border:2px solid var(--line);padding:14px;min-height:300px;display:flex;flex-direction:column;gap:10px}
.clerk{display:flex;gap:12px;align-items:flex-start}
.clerk .av{font-size:44px;background:#fff;border-radius:50%;width:70px;height:70px;display:grid;place-items:center;border:3px solid #2f7ad0;flex:none}
.bubble{background:#fff;border-radius:16px;padding:10px 14px;font-weight:700;border:2px solid #9cc8f0;flex:1}
.fmenu{display:flex;flex-direction:column;gap:6px}
.fmenu button{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;font-size:16px;text-align:left;color:var(--txt)}
.fmenu button.on{background:linear-gradient(#3d8ee6,#1f60b5);color:#fff;border-color:#fff}
.shopl{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.srw{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px}
.srw .nm{font-weight:800}.srw .ds{font-size:11px;color:var(--sub)}
.srw .pr{margin-left:auto;font-weight:800;white-space:nowrap}
.srw .btn{padding:5px 14px;font-size:14px}
/* picker */
#picker{position:fixed;inset:0;z-index:40;background:rgba(8,22,46,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.pk{background:#fff;border-radius:16px;border:3px solid #2f7ad0;padding:14px;width:min(460px,100%);max-height:100%;overflow:auto}
.pk h3{margin:0 0 10px;font-size:18px}
.pkr{display:flex;align-items:center;gap:10px;width:100%;background:#f3f8fe;border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:6px;font-weight:800;font-size:15px;text-align:left;color:var(--txt)}
.pkr .hb{flex:1;max-width:130px;height:8px;background:#dde7f2;border-radius:5px;overflow:hidden}
.pkr .hb i{display:block;height:100%;background:#4ade80}
/* evo / title / misc */
.evo{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px}
.evo canvas{width:min(360px,80vw);height:min(300px,60vw);border-radius:16px}
.evo #evoT{font-size:20px;font-weight:800;text-align:center}
#title{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.tbox{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.logo{font-size:clamp(40px,9vw,84px);font-weight:800;color:#fff;line-height:1.05;-webkit-text-stroke:3px #1b4f8f;paint-order:stroke;text-shadow:0 6px 0 #0f2c55,0 10px 20px rgba(0,0,0,.4)}
.logo span{color:#ffcf3a}
.tsub{color:#fff;font-weight:800;letter-spacing:6px;text-shadow:0 2px 4px rgba(0,0,0,.5)}
#tBtns{display:flex;flex-direction:column;gap:12px;margin-top:2vh}
.raise>*,.bag>*,.fac>*,.stat3>*,.dex>*,.rcard>*{min-width:0}
.win{min-width:0}
#tBtns .btn{font-size:20px;padding:12px 44px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .25s}
#fade.on{opacity:1}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:rgba(15,44,85,.95);color:#fff;padding:10px 20px;border-radius:14px;font-weight:800;border:2px solid #9fd0ff;animation:tin 2.2s forwards;white-space:nowrap}
@keyframes tin{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.starters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.st{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.st:hover{border-color:#2f7ad0;transform:translateY(-3px)}
.st .d{font-size:12px;color:var(--sub)}
input.nm{font-family:inherit;font-size:22px;font-weight:800;padding:8px 14px;border-radius:12px;border:3px solid #2f7ad0;width:220px;text-align:center;user-select:text;-webkit-user-select:text}
.heartfx{position:fixed;font-size:34px;pointer-events:none;z-index:80;animation:hf 1s forwards}
@keyframes hf{to{transform:translateY(-70px) scale(1.4);opacity:0}}
.setr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid #2f5f9a;font-weight:800}
.seg{display:flex;gap:4px}.seg button{border:2px solid #7fb6ec;background:transparent;color:#fff;border-radius:10px;padding:6px 12px;font-weight:800}
.seg button.on{background:#3d8ee6}
#err{position:fixed;left:0;bottom:0;z-index:99;background:#b00;color:#fff;font-size:12px;max-width:100%;white-space:pre-wrap}
@media (max-width:760px){
 .bag,.raise,.fac,.stat3,.dex{grid-template-columns:minmax(0,1fr)}
 .rcard{grid-template-columns:minmax(0,1fr)}
 .rpor{height:160px}
 .flt{flex-direction:row;flex-wrap:wrap}
 .starters{grid-template-columns:1fr}
 .minfo{max-width:calc(100% - 20px);left:10px;right:10px;bottom:56px}
 #pcard{min-width:0;padding-right:10px}
 #quest{top:72px}
 #mmWrap,#minimap{width:92px;height:92px}
 .cmp.n,.cmp.s{left:37px}.cmp.w,.cmp.e{top:37px}
 #joy{width:116px;height:116px;left:14px;bottom:14px}
 .rbtn{width:66px;height:66px}#talkBtn{width:74px;height:74px}
 #dialog{font-size:16px}
}
