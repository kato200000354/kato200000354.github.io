<title>つりびと大図鑑</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="9つの釣り場で90種の魚を集める釣りゲーム。色違い・王冠サイズ・ぬし9体・道具とスキル・水族館・依頼・大会・実績まで、やりこみ放題。">
<meta name="theme-color" content="#0f2a44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0f2a44; --panel:rgba(14,32,54,.94); --edge:rgba(140,210,255,.35); --text:#f4fbff; --dim:#a9c4da;
  --gold:#ffd25c; --good:#7dffb0; --bad:#ff7070; --accent:#4fc3ff; --chip:rgba(10,24,42,.72);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:flex-start;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));pointer-events:none;font-size:13px}
.chip{background:var(--chip);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap;font-weight:700}
.hl,.hr{display:flex;flex-direction:column;gap:5px}
.hr{align-items:flex-end}
#lvbar{width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#lvbar i{display:block;height:100%;background:linear-gradient(90deg,#7dffb0,#4fc3ff);width:0}
#money{color:var(--gold)}
.tap{pointer-events:auto}

#tools{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(max(8px,env(safe-area-inset-bottom)) + 62px);
  display:flex;justify-content:space-between;pointer-events:none;font-size:13px}
#tools .chip{pointer-events:auto}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(8px,env(safe-area-inset-bottom)) + 104px);
  pointer-events:none;font-size:13px;color:#fff;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.6);text-align:center;width:92%;font-weight:700}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;
  padding:6px max(6px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(6,16,30,0),rgba(6,16,30,.85) 35%)}
#nav button{flex:1;max-width:78px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px;
  background:rgba(20,44,72,.85);border:1px solid rgba(140,210,255,.22);font-size:10.5px;font-weight:700;position:relative}
#nav button b{font-size:19px;line-height:1.1;font-weight:400}
#nav button .dot{position:absolute;top:3px;right:6px;width:9px;height:9px;border-radius:50%;background:#ff5a5a;box-shadow:0 0 6px #ff5a5a}
body.busy #nav,body.busy #tools{display:none}
body.busy #hint{bottom:calc(max(8px,env(safe-area-inset-bottom)) + 24px)}

#tour{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 64px);left:50%;transform:translateX(-50%);background:var(--chip);
  border:1px solid rgba(255,210,92,.5);border-radius:14px;padding:7px 12px;font-size:12.5px;min-width:220px;text-align:center}
#tour .tt{font-size:20px;font-weight:800;color:var(--gold)}
#tour .rv{display:flex;flex-direction:column;gap:1px;margin-top:3px;text-align:left}
#tour .rv div{display:flex;justify-content:space-between;gap:12px}
#tour .me{color:var(--good);font-weight:800}
#tour button{margin-top:4px;font-size:11px;color:var(--dim);text-decoration:underline}

#toasts{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 70px);transition:top .2s;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;
  align-items:center;pointer-events:none;width:92%;z-index:30}
.toast{background:rgba(10,24,42,.93);border:1px solid var(--edge);border-radius:12px;padding:8px 14px;font-size:13.5px;font-weight:700;
  animation:tin .25s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.4);text-align:center}
.toast.gold{border-color:var(--gold);color:var(--gold)}
body.touring #toasts{top:calc(max(8px,env(safe-area-inset-top)) + 200px)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* モーダル */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(3,10,20,.55);
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));touch-action:pan-y}
#mbox{width:100%;max-width:560px;max-height:100%;overflow-y:auto;overflow-x:hidden;background:var(--panel);border:1px solid var(--edge);border-radius:18px;
  padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pin .2s ease-out;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@keyframes pin{from{transform:scale(.96);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-2px 0 10px}
.mh h2{margin:0;font-size:19px}
.x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);font-size:18px;flex:none}
.btn{background:linear-gradient(180deg,#3fb2f0,#1f7ac0);border-radius:12px;padding:9px 14px;font-weight:800;box-shadow:0 3px 0 #11507f}
.btn.gold{background:linear-gradient(180deg,#ffd25c,#e89a1a);color:#3a2400;box-shadow:0 3px 0 #9a5e00}
.btn.gray{background:rgba(255,255,255,.12);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%;padding:12px;font-size:16px}
.muted{color:var(--dim);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px;margin-bottom:8px}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.lock{opacity:.7}
.grow{flex:1;min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;touch-action:pan-x}
.tabs button{flex:none;padding:6px 9px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px;font-weight:700}
.tabs button.on{background:var(--accent);color:#04223a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.cell{background:rgba(255,255,255,.06);border-radius:12px;padding:6px 4px;text-align:center;font-size:11.5px;position:relative;border:1px solid transparent}
.cell img{width:100%;max-width:96px;height:auto;display:block;margin:0 auto}
.cell .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cell .bd{position:absolute;top:3px;right:4px;font-size:12px}
.cell.nushi{border-color:rgba(255,210,92,.5)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7dffb0,#4fc3ff)}
.stars{color:var(--gold);letter-spacing:1px}
.badge{display:inline-block;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:800;margin:2px}
.b-new{background:#ff5a7a}.b-rec{background:#4fc3ff;color:#04223a}.b-cr{background:#ffd25c;color:#3a2400}.b-sh{background:linear-gradient(90deg,#ff8ad8,#8ad8ff);color:#2a0040}
.res{text-align:center}
.res img{width:100%;max-width:300px}
.res .sz{font-size:30px;font-weight:800}
.res .sz small{font-size:14px;color:var(--dim);margin-left:6px}
.desc{font-size:13px;color:#d8e8f4;line-height:1.6}
table.kv{width:100%;font-size:13px;border-collapse:collapse}
table.kv td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
table.kv td:last-child{text-align:right;font-weight:700}
#aqc{width:100%;height:190px;border-radius:12px;display:block;background:#0a3a5a}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:8px}
.slot{aspect-ratio:1.3;border-radius:10px;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;padding:2px}
.slot img{width:100%}
.ach{display:flex;gap:10px;align-items:center}
.ach .ic{font-size:22px;width:30px;text-align:center}
.ach.done{border-color:rgba(125,255,176,.4)}
.pill{display:inline-block;background:rgba(255,255,255,.1);border-radius:999px;padding:1px 8px;font-size:11.5px;margin:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hl">
    <button class="chip tap" id="spotChip" data-act="map"></button>
    <button class="chip tap" id="timeChip" data-act="rest" title="休んで時間を進める"></button>
  </div>
  <div class="hr">
    <div class="chip" id="money"></div>
    <button class="chip tap" data-act="skill"><span id="lvTxt"></span><span id="lvbar"><i></i></span></button>
  </div>
</div>
<div id="tour" hidden></div>
<div id="toasts"></div>
<div id="tools">
  <button class="chip" id="baitChip" data-act="bait"></button>
  <button class="chip" id="restChip" data-act="rest">⏭ 休む</button>
</div>
<div id="hint"></div>
<nav id="nav">
  <button data-act="map"><b>🗺️</b>釣り場</button>
  <button data-act="dex"><b>📖</b>図鑑</button>
  <button data-act="shop"><b>🏪</b>道具屋</button>
  <button data-act="aq"><b>🐠</b>水族館<span class="dot" id="aqDot" hidden></span></button>
  <button data-act="req"><b>📜</b>依頼<span class="dot" id="reqDot" hidden></span></button>
  <button data-act="skill"><b>🧠</b>スキル<span class="dot" id="skDot" hidden></span></button>
  <button data-act="ach"><b>🏆</b>実績</button>
  <button data-act="set"><b>⚙️</b>設定</button>
</nav>
<div id="modal" hidden><div id="mbox"></div></div>
