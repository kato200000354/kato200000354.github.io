<title>ひっくり返せ！フライパン食堂</title>
<meta name="description" content="フライパンひとつで、へんてこなお客さんの注文に応えよう。タップでひっくり返して両面を焼き、ちょうどいい焼き加減でお客さんへ投げ渡す！ドラゴンはまっくろこげ、宇宙人は表と裏で違う焼き加減をご所望です。">
<meta name="theme-color" content="#c8412b">
<style>
:root{--red:#c8412b;--red2:#8e2717;--ink:#3a2a1e;--dim:#8a7462;--cream:#fff8ea;--wall:#f6dfb8;--wood:#a8693a;--wood2:#7d4a24;--tile:#e9e3d6;--gold:#f2b705}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#4a3324;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;background:var(--tile);box-shadow:0 0 30px rgba(0,0,0,.4);touch-action:none}
#app.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translate(-7px,2px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,1px)}}

/* HUD */
#hud{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--red);color:#fff;font-weight:900;flex:none}
.pill{background:rgba(0,0,0,.22);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
#hTime.low{background:#ffd23f;color:var(--red2);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#hQuota{flex:1;min-width:0}
#hQuota .qbar{height:9px;border-radius:9px;background:rgba(0,0,0,.25);overflow:hidden}
#hQuota .qbar i{display:block;height:100%;width:0;background:#ffd23f;border-radius:9px;transition:width .3s}
#hQuota .qbar i.ok{background:#7be07b}
#hQuota span{display:block;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hHearts{font-size:15px;letter-spacing:-2px;white-space:nowrap}
#mute{font-size:18px;width:30px}

/* counter */
#counter{flex:none;height:clamp(150px,27vh,200px);display:flex;gap:6px;padding:8px 8px 0;background:linear-gradient(var(--wall) 0 78%,var(--wood) 78% 88%,var(--wood2) 88%);position:relative}
#counter::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:repeating-linear-gradient(90deg,#d94b35 0 26px,#fff 26px 52px);border-radius:0 0 50% 50%/0 0 100% 100%;opacity:.9}
.seat{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(clamp(150px,27vh,200px)*.22);border-radius:14px;transition:background .15s}
.seat.hover{background:rgba(255,210,63,.45)}
.seat .face{font-size:clamp(36px,9vw,48px);line-height:1;position:relative;transition:transform .2s}
.seat .face.enter{animation:enter .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes enter{from{transform:translateY(60px) scale(.6);opacity:0}}
.seat .face.angry{animation:wobble .25s infinite}
@keyframes wobble{50%{transform:rotate(-8deg)}}
.seat .face .mood{position:absolute;right:-10px;top:-6px;font-size:20px}
.seat .chair{font-size:30px;opacity:.25}
.bubble{position:relative;background:#fff;border-radius:12px;padding:4px 6px 5px;margin-bottom:7px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.12);width:100%;max-width:150px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble .line{font-size:10.5px;color:var(--dim);line-height:1.25;min-height:13px}
.bubble .ord{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:1px}
.bubble .fe{font-size:24px;line-height:1}
.bubble .chips{display:flex;flex-direction:column;gap:2px}
.chip{display:block;font-size:10.5px;font-weight:900;border-radius:6px;padding:1px 5px;white-space:nowrap}
.bubble.react{font-size:14px;font-weight:900;padding:8px 6px}
.pat{width:80%;height:5px;border-radius:5px;background:rgba(0,0,0,.15);overflow:hidden;position:absolute;bottom:calc(clamp(150px,27vh,200px)*.22 - 9px)}
.pat i{display:block;height:100%;background:#4cbf56;width:100%}
.pat i.mid{background:#f0b030}.pat i.low{background:#e04030}

/* kitchen */
#kitchen{flex:1;position:relative;min-height:0;background:
 linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px) 0 0/34px 34px,
 linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px) 0 0/34px 34px,var(--tile);display:flex;align-items:center;justify-content:center}
#stove{position:relative;isolation:isolate;--pan:min(66vw,330px,max(190px,calc(100vh - 400px)))}
#glow{position:absolute;left:50%;top:50%;width:calc(var(--pan)*1.05);height:calc(var(--pan)*1.05);transform:translate(-50%,-50%);border-radius:50%;transition:box-shadow .3s}
#pan{position:relative;width:var(--pan);height:var(--pan);border-radius:50%;background:radial-gradient(circle at 40% 35%,#5d5f66,#2c2d31 62%,#1b1b1e);border:calc(var(--pan)*.035) solid #3c3d42;box-shadow:inset 0 0 0 3px #6d6f76,inset 0 8px 24px rgba(0,0,0,.6),0 8px 0 #222}
#pan::after{content:"";position:absolute;left:80%;top:84%;width:calc(var(--pan)*.3);height:calc(var(--pan)*.1);background:linear-gradient(#5a3a22,#3d2513);border-radius:0 calc(var(--pan)*.05) calc(var(--pan)*.05) 0;transform:rotate(55deg);transform-origin:left center;box-shadow:0 4px 0 #2a180b;z-index:-1}
.slot{position:absolute;width:36%;height:36%;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed rgba(255,255,255,.08)}
.food{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.food .emo{font-size:calc(var(--pan)*.16);line-height:1;transition:filter .25s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.food.drop{animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-40px) scale(1.3);opacity:0}}
.food.flipping .emo{animation:flip .34s ease-in-out}
@keyframes flip{0%{transform:none}50%{transform:translateY(-55px) rotateX(180deg) scale(1.15)}100%{transform:rotateX(360deg)}}
.food.lifted{opacity:.25}
.food.ready .emo{animation:ready 1s infinite}
@keyframes ready{50%{transform:scale(1.08)}}
.food.ready::before{content:"";position:absolute;inset:6%;border-radius:50%;box-shadow:0 0 0 3px #7be07b,0 0 18px #7be07b;pointer-events:none}
.food.smoke::after{content:"💨";position:absolute;top:-6%;left:55%;font-size:calc(var(--pan)*.08);animation:smoke 1.1s infinite;pointer-events:none}
@keyframes smoke{from{transform:translateY(0) scale(.6);opacity:.9}to{transform:translateY(-30px) scale(1.4);opacity:0}}
.bars{width:96%;margin-top:3px;display:flex;flex-direction:column;gap:2px}
.br{display:flex;align-items:center;gap:2px;font-size:9px;font-weight:900;color:#fff}
.br b{width:11px;text-align:center;flex:none}
.bar{position:relative;flex:1;height:7px;border-radius:4px;background:linear-gradient(90deg,#f4e7cc 0 17.9%,#ef8b8b 17.9% 37.1%,#f3b23d 37.1% 58.6%,#9a5a26 58.6% 78.6%,#6e6258 78.6% 80%,#111 80%);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.bar .m{position:absolute;top:-3px;width:3px;height:13px;margin-left:-1.5px;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #000}
.br.hot b{color:#ffb347}

#cat{position:absolute;font-size:calc(var(--pan)*.17);transform:translate(-50%,-50%);z-index:5;cursor:pointer;animation:catin .3s ease-out,catbob .35s .3s infinite alternate;filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
#cat::after{content:"ねらってる…";position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;background:#e04030;border-radius:6px;padding:1px 5px;white-space:nowrap}
@keyframes catin{from{transform:translate(-50%,-50%) scale(0)}}
@keyframes catbob{to{transform:translate(-50%,-58%)}}

#heat{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
#heat button{width:46px;padding:7px 0;border-radius:12px;background:#fff;font-weight:900;font-size:13px;box-shadow:0 3px 0 #cbbfae;line-height:1.1}
#heat button span{display:block;font-size:16px}
#heat button.on{background:#ff8a3d;color:#fff;box-shadow:0 3px 0 #b8541a}
#heat .lbl{font-size:10px;font-weight:900;color:var(--dim);text-align:center}
#trash{position:absolute;left:8px;bottom:10px;width:58px;height:62px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #cbbfae;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;transition:transform .15s}
#trash small{font-size:10px;font-weight:900;color:var(--dim)}
#trash.hover{transform:scale(1.15);background:#ffe0d8}

/* tray */
#tray{flex:none;display:flex;gap:6px;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--wood);box-shadow:inset 0 4px 0 var(--wood2)}
#foods{flex:1;display:flex;gap:5px;min-width:0}
.fb{flex:1;min-width:0;background:var(--cream);border-radius:12px;padding:5px 0 4px;box-shadow:0 4px 0 #c9b28e;display:flex;flex-direction:column;align-items:center}
.fb:active{transform:translateY(3px);box-shadow:0 1px 0 #c9b28e}
.fb .e{font-size:28px;line-height:1}
.fb small{font-size:9.5px;font-weight:900;color:var(--dim);white-space:nowrap}
.fb.new{animation:newf 1s 3}
@keyframes newf{50%{background:#ffe58a}}
#flipAll{flex:none;width:76px;border-radius:12px;background:var(--red);color:#fff;font-weight:900;font-size:12px;box-shadow:0 4px 0 var(--red2);line-height:1.2}
#flipAll span{display:block;font-size:24px}
#flipAll:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:18px;color:#fff;-webkit-text-stroke:5px var(--red2);paint-order:stroke fill;white-space:nowrap;animation:pop 1.1s ease-out forwards}
.pop.big{font-size:26px;-webkit-text-stroke-color:#a06a00;color:#ffe14a}
.pop.good{-webkit-text-stroke-color:#2a7a33}
.pop.bad{-webkit-text-stroke-color:#333;color:#ddd}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4)}20%{transform:translate(-50%,-70%) scale(1.15)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.ghost{position:fixed;font-size:56px;line-height:1;transform:translate(-50%,-60%) rotate(-8deg);filter:drop-shadow(0 10px 6px rgba(0,0,0,.4))}
.fly{position:fixed;font-size:44px;line-height:1;transition:transform .55s cubic-bezier(.3,0,.7,1),opacity .55s}

/* overlays */
.ov{position:absolute;inset:0;z-index:30;background:rgba(58,30,14,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--cream);border-radius:22px;padding:20px 18px;width:100%;max-width:400px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.25);animation:cardin .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes cardin{from{transform:scale(.8);opacity:0}}
.card h1{font-size:27px;line-height:1.2;color:var(--red);letter-spacing:.02em}
.card h1 small{display:block;font-size:14px;color:var(--dim);letter-spacing:0;margin-bottom:4px}
.card h2{font-size:22px;color:var(--red);margin-bottom:8px}
.card p{font-size:14px;line-height:1.6;margin:8px 0}
.logo{font-size:58px;line-height:1;margin:6px 0 4px;animation:logo 1.4s infinite}
@keyframes logo{0%,60%,100%{transform:none}30%{transform:translateY(-22px) rotate(180deg)}}
.rules{text-align:left;font-size:13px;line-height:1.55;background:#fff;border-radius:14px;padding:10px 12px;margin:10px 0}
.rules li{list-style:none;padding-left:1.6em;text-indent:-1.6em;margin:3px 0}
.btn{display:block;width:100%;padding:13px 16px;border-radius:16px;font-size:19px;font-weight:900;background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red2);margin-top:10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red2)}
.btn.sub{background:#fff;color:var(--red2);box-shadow:0 5px 0 #d9c4a8;font-size:16px}
.best{font-size:13px;color:var(--dim);font-weight:900;margin-top:8px}
.stat{display:flex;justify-content:space-between;background:#fff;border-radius:10px;padding:7px 12px;margin:5px 0;font-size:15px;font-weight:900}
.stat b{color:var(--red)}
.verdict{font-size:22px;font-weight:900;margin:10px 0 4px}
.verdict.ok{color:#2a9a3a}.verdict.ng{color:#c03020}
.boss{font-size:13px;background:#fff3c9;border-radius:12px;padding:8px 10px;margin-top:8px;text-align:left;line-height:1.5}
.perk{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;text-align:left;box-shadow:0 4px 0 #d9c4a8}
.perk:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c4a8}
.perk .pe{font-size:34px}
.perk b{display:block;font-size:16px;color:var(--red)}
.perk small{font-size:12px;color:var(--dim);line-height:1.4}
.news{background:#fff;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px;text-align:left;line-height:1.6}
.news .t{font-size:11px;font-weight:900;color:var(--red)}
.zl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
</style>
</head>

<div id="app">
  <header id="hud">
    <div class="pill" id="hDay">1日目</div>
    <div class="pill" id="hTime">⏱ 75</div>
    <div id="hQuota"><div class="qbar"><i></i></div><span>0 / 500円</span></div>
    <div id="hHearts"></div>
    <button id="mute" aria-label="音">🔊</button>

  <section id="counter"></section>
  <section id="kitchen">
    <div id="stove"><div id="glow"></div><div id="pan"></div></div>
    <div id="heat">
      <div class="lbl">火力</div>
      <button data-h="2"><span>🔥</span>強</button>
      <button data-h="1" class="on"><span>🔥</span>中</button>
      <button data-h="0"><span>🔥</span>弱</button>
    </div>
    <div id="trash">🗑️<small>すてる</small></div>
  </section>
  <footer id="tray">
    <div id="foods"></div>
    <button id="flipAll"><span>🔄</span>ぜんぶ<br>返す</button>
  </footer>

  <div class="ov" id="ovTitle">
    <div class="card">
      <h1><small>フライパンひとつで勝負！</small>ひっくり返せ！<br>フライパン食堂</h1>
      <div class="logo">🍳</div>
      <ul class="rules">
        <li>🥚 下の食材をタップ → フライパンへ</li>
        <li>👆 食材をタップ → <b>ひっくり返す</b>（焼けるのは下の面だけ）</li>
        <li>🫴 食材を<b>お客さんまでドラッグ</b>して出す</li>
        <li>🎯 ゲージの<b>上の面・下の面</b>を両方、注文の焼き加減の色に合わせよう</li>
        <li>✨ 注文どおりに焼けると<b>緑に光る</b>！光ったら出そう</li>
        <li>🐲 へんなお客さんは、へんな注文をします</li>
        <li>🐈 ネコが来たらタップで追いはらう！</li>
      </ul>
      <div class="zl" id="zoneLegend"></div>
      <button class="btn" id="bStart">開店する！</button>
      <div class="best" id="bestT"></div>
    </div>
  </div>
  <div class="ov" id="ovDay" hidden><div class="card" id="dayCard"></div></div>
  <div class="ov" id="ovResult" hidden><div class="card" id="resCard"></div></div>
  <div class="ov" id="ovPerk" hidden><div class="card" id="perkCard"></div></div>
  <div class="ov" id="ovOver" hidden><div class="card" id="overCard"></div></div>
</div>
