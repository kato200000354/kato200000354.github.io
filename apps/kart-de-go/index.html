<meta charset="utf-8">
<script src="../../audio-pause.js"></script>
<title>カートでゴー！</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
:root{
  --sky:#8fd6ff; --navy:#0f2c6b; --blue:#1f5fd6; --blue2:#3b86ff;
  --panel:rgba(14,42,110,.86); --yellow:#ffd23f; --yellow2:#ffb400; --orange:#e06a00;
  --white:#ffffff; --ink:#0d2352; --silver:#9db4d6; --gold:#ffc62e; --bronze:#e0853a; --purple:#8a5ad8;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--white);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",system-ui,sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.ol{text-shadow:0 3px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),2px -2px 0 var(--navy),-2px -2px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy)}
.ol-o{text-shadow:0 3px 0 var(--orange),2px 2px 0 var(--orange),-2px 2px 0 var(--orange),2px -2px 0 var(--orange),-2px -2px 0 var(--orange),3px 0 0 var(--orange),-3px 0 0 var(--orange),0 -3px 0 var(--orange)}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}

/* buttons */
.btn-y{background:linear-gradient(#ffe46b,#ffbf16);border:3px solid #fff;border-radius:999px;
  box-shadow:0 6px 0 #c96a00,0 12px 20px rgba(0,0,0,.25);padding:12px 44px;font-size:26px;font-weight:900;color:#fff;
  transition:transform .08s}
.btn-y:active{transform:translateY(4px);box-shadow:0 2px 0 #c96a00}
.btn-b{background:linear-gradient(#4f95ff,#1f5fd6);border:3px solid #fff;border-radius:999px;
  box-shadow:0 5px 0 #0f2c6b,0 10px 16px rgba(0,0,0,.2);padding:10px 26px;font-size:18px;font-weight:900}
.btn-b:active{transform:translateY(3px);box-shadow:0 2px 0 #0f2c6b}
.ribbon{display:inline-block;background:linear-gradient(#2f6fe8,#163f9e);border:3px solid #fff;border-radius:999px;
  padding:6px 22px;font-size:16px;box-shadow:0 4px 0 rgba(10,30,80,.5)}

/* title */
#title{background:linear-gradient(to bottom,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(0,40,110,.25));gap:14px}
.logo{margin:0;font-size:clamp(46px,11vw,104px);font-weight:900;letter-spacing:.02em;line-height:1;transform:rotate(-4deg);
  text-align:center;white-space:nowrap}
.logo span{display:inline-block;-webkit-text-stroke:0;text-shadow:0 6px 0 var(--navy),4px 4px 0 var(--navy),-4px 4px 0 var(--navy),4px -4px 0 var(--navy),-4px -4px 0 var(--navy),5px 0 0 var(--navy),-5px 0 0 var(--navy),0 -5px 0 var(--navy),0 12px 20px rgba(0,0,0,.3)}
.logo .a{color:#ffc21a}.logo .b{color:#fff;font-size:.72em}.logo .c{color:#48c7ff}
@media (prefers-reduced-motion:no-preference){.logo{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{50%{transform:rotate(-4deg) translateY(-8px)}}
.sub{transform:rotate(-4deg);margin-top:-6px}
.round-row{display:flex;gap:22px;margin-top:6px}
.round{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.round i{width:58px;height:58px;border-radius:50%;background:linear-gradient(#3f86ff,#1848b8);border:3px solid #fff;
  display:grid;place-items:center;box-shadow:0 4px 0 #0f2c6b}
.round svg{width:30px;height:30px}
.hint{font-size:12px;opacity:.9;text-align:center;font-weight:500}

/* select */
.panel{background:var(--panel);border:3px solid #fff;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.3);
  padding:14px 16px;box-sizing:border-box;width:min(760px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;align-items:center}
.grid-ch{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;width:100%}
.grid-kt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.pick{background:linear-gradient(#e8f4ff,#bcdcff);border:3px solid rgba(255,255,255,.6);border-radius:14px;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;padding:4px 2px;font-size:12px;min-width:0}
.pick .emo{font-size:30px;line-height:1.2}
.pick svg{width:100%;max-width:84px;height:auto}
.pick[aria-pressed="true"]{border-color:var(--yellow);background:linear-gradient(#fff6c8,#ffd95a);box-shadow:0 0 0 3px var(--blue2)}
.preview{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.stage{display:flex;align-items:flex-end;gap:4px;padding:8px 20px;border-radius:50%/40%;
  background:radial-gradient(ellipse at 50% 85%,#5aa8ff 0 38%,rgba(90,168,255,0) 62%)}
.stage .big{font-size:58px;line-height:1}
.stage svg{width:150px;height:auto}
.stats{background:rgba(5,20,60,.55);border:2px solid rgba(255,255,255,.7);border-radius:14px;padding:10px 14px;min-width:190px;display:grid;gap:6px}
.stats b{font-size:16px}
.stat{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;font-size:13px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#43d1ff,#7dffb0);transition:width .25s}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
@media (max-height:500px){
  #title{gap:8px}
  .logo{font-size:min(11vw,17vh)}
  #title > div[style]{height:6px!important}
  .btn-y{padding:8px 36px;font-size:22px}
  .round i{width:46px;height:46px}.round svg{width:24px;height:24px}
  .lineup span{width:clamp(34px,11vh,56px)}
}
@media (max-width:620px){.grid-ch{grid-template-columns:repeat(4,1fr)}.pick .emo{font-size:26px}}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
.tl{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}
.posbox{display:flex;align-items:flex-end;gap:2px;background:radial-gradient(circle at 40% 40%,rgba(20,50,120,.8),rgba(10,30,80,.65));
  border:3px solid rgba(255,255,255,.85);border-radius:26px;padding:0 14px 4px 12px;width:max-content}
.posbox .n{font-size:64px;line-height:1;font-weight:900;color:var(--yellow)}
.posbox .d{font-size:30px;line-height:1.3;font-weight:900}
.posbox small{font-size:12px;margin-left:4px;margin-bottom:6px}
.ranks{display:grid;gap:3px}
.ranks div{display:flex;align-items:center;gap:6px;width:84px;height:24px;border-radius:7px;background:rgba(10,30,80,.55);font-size:14px;padding-left:6px;box-sizing:border-box}
.ranks div span:last-child{font-size:17px}
.ranks .me{background:var(--blue2);box-shadow:0 0 0 2px #fff;width:94px}
.tc{position:absolute;left:50%;top:max(10px,env(safe-area-inset-top,0px));transform:translateX(-50%)}
.lap{background:linear-gradient(#2f6fe8,#163f9e);border:3px solid #fff;border-radius:999px;padding:2px 26px;font-size:24px;font-style:italic;white-space:nowrap}
.lap b{font-size:40px;color:var(--yellow)}
.tr{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.timer{display:flex;align-items:center;gap:8px;background:linear-gradient(#2f6fe8,#163f9e);border:3px solid #fff;border-radius:999px;padding:4px 18px 4px 8px}
.timer svg{width:30px;height:30px}
.timer .lbl{font-size:11px;display:block;line-height:1}
.timer .t{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.items{display:flex;align-items:center;gap:10px;background:rgba(14,42,110,.8);border:3px solid #fff;border-radius:20px;padding:6px 12px}
.slot{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#fff 0 50%,#cfe6ff);border:3px solid var(--blue2);display:grid;place-items:center}
.slot svg{width:44px;height:44px}
.slot.rolling svg{animation:spinY .12s linear infinite}
@keyframes spinY{50%{transform:scale(.7)}}
.coins{display:flex;align-items:center;gap:4px;font-size:22px;font-variant-numeric:tabular-nums}
.coins svg{width:30px;height:30px}
#mini{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:170px;height:120px}
.ctl{pointer-events:auto;touch-action:none}
.steer{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));
  width:200px;height:104px;border-radius:999px;background:linear-gradient(rgba(220,230,245,.55),rgba(140,160,190,.55));border:4px solid rgba(255,255,255,.85);
  display:flex;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.steer button{flex:1;display:grid;place-items:center}
.steer svg{width:44px;height:44px}
.steer button.on svg path{fill:var(--yellow)}
.rb{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:12px}
.drift{width:124px;height:124px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#5ea6ff,#1a4fc4);border:5px solid #fff;
  box-shadow:0 0 0 4px rgba(30,80,200,.4),0 10px 20px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px}
.drift svg{width:52px;height:40px}
.drift.on{background:radial-gradient(circle at 40% 30%,#ffd86b,#ff8a00)}
.usebtn{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffe98a,#ffb400);border:4px solid #fff;font-size:14px;color:#fff;
  box-shadow:0 8px 16px rgba(0,0,0,.25);margin-bottom:8px}
.keys{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom,0px)) + 128px);transform:translateX(-50%);font-size:11px;font-weight:500;
  background:rgba(10,30,80,.5);padding:3px 10px;border-radius:999px;white-space:nowrap}
@media (hover:none){.keys{display:none}}
#cd{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(80px,18vw,160px);font-weight:900;color:var(--yellow);pointer-events:none;white-space:nowrap}
#cd.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.9);opacity:1}}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(22px,4.5vw,36px);font-weight:900;pointer-events:none;opacity:0;white-space:nowrap}
#toast.show{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) scale(.6)}15%{opacity:1;transform:translateX(-50%) scale(1.08)}80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0}}
@media (max-height:520px){
  .posbox .n{font-size:46px}.posbox .d{font-size:22px}
  .ranks div{height:19px;font-size:12px;width:74px}.ranks .me{width:82px}.ranks div span:last-child{font-size:14px}
  .lap{font-size:18px}.lap b{font-size:30px}
  .timer .t{font-size:20px}.slot{width:48px;height:48px}.slot svg{width:34px;height:34px}
  .steer{width:164px;height:84px}.drift{width:100px;height:100px;font-size:15px}.usebtn{width:64px;height:64px;font-size:12px}
  #mini{width:130px;height:92px}.keys{display:none}
}
@media (max-width:600px){.ranks{display:none}#mini{bottom:auto;top:calc(max(10px,env(safe-area-inset-top,0px)) + 64px);left:auto;right:12px;transform:none;display:none}}
/* 縦向きスマホ: アイテムをドリフトの上に縦積みし、ハンドルは残り幅に収める */
@media (max-width:600px) and (orientation:portrait){
  .rb{flex-direction:column;align-items:center;gap:10px;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px))}
  .usebtn{width:70px;height:70px;margin-bottom:0}
  .drift{width:108px;height:108px;font-size:15px}.drift svg{width:44px;height:34px}
  .steer{left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:calc(100vw - 108px - 54px);max-width:200px;height:96px}
}

.grid-course{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.cc{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px;border-radius:16px;background:linear-gradient(#e8f4ff,#bcdcff);
  border:3px solid rgba(255,255,255,.6);color:var(--ink);text-align:left;min-width:0}
.cc canvas{width:100%;aspect-ratio:16/11;height:auto;border-radius:10px;display:block;max-width:100%}
.cc b{font-size:15px;line-height:1.2}
.cc small{font-size:11px;font-weight:500;line-height:1.3}
.cc .st{color:#ff9d00;font-size:13px;letter-spacing:.1em}
.cc .st i{font-style:normal;color:rgba(13,35,82,.25)}
.cc .best{font-size:11px;font-variant-numeric:tabular-nums;color:var(--blue)}
.cc[aria-pressed="true"]{border-color:var(--yellow);background:linear-gradient(#fff6c8,#ffd95a);box-shadow:0 0 0 3px var(--blue2)}
@media (max-width:700px){.grid-course{grid-template-columns:repeat(2,1fr)}}
img.pt{display:block;width:100%;height:auto;max-width:100%;pointer-events:none}
.pick .emo{width:52px}
.stage .big{width:110px}
.ranks img.pt{width:22px}
.ranks div span:last-child{font-size:inherit}
.pod .emo{width:62px}
.res-list img.pt{width:26px}
.mbody img.pt{display:inline-block;width:24px;vertical-align:middle}
.lineup{display:flex;gap:2px;margin-top:-4px;transform:rotate(-4deg)}
.lineup span{width:clamp(44px,8.5vw,80px);filter:drop-shadow(0 3px 0 rgba(15,44,107,.55))}
@media (prefers-reduced-motion:no-preference){.lineup span{animation:hop 1.1s ease-in-out infinite}}
@keyframes hop{50%{transform:translateY(-7px)}}
/* result */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;flex:1;max-width:130px}
.pod .emo{font-size:40px;line-height:1.1}
.pod .blk{width:100%;border:3px solid #fff;border-radius:12px 12px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0}
.pod .pl{font-size:28px;font-weight:900;line-height:1}
.pod .pl small{font-size:14px}
.pod .tm{font-size:12px;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.25);border-radius:6px;padding:0 6px;margin-top:2px}
.res-list{list-style:none;margin:0;padding:6px;width:100%;box-sizing:border-box;background:rgba(255,255,255,.95);border-radius:14px;color:var(--ink);display:grid;gap:2px}
.res-list li{display:grid;grid-template-columns:34px 30px 1fr auto;align-items:center;padding:3px 10px;border-radius:8px;font-size:15px}
.res-list li .t{font-variant-numeric:tabular-nums}
.res-list li.me{background:linear-gradient(90deg,#ffe16b,#fff3b8)}
.res-list li b{color:var(--blue)}

/* modal */
#modal{position:absolute;inset:0;background:rgba(5,20,60,.55);display:grid;place-items:center;padding:16px;box-sizing:border-box}
#modal .panel{width:min(460px,100%);align-items:stretch}
#modal h2{margin:0;text-align:center;font-size:22px}
.mbody{font-weight:500;font-size:14px;line-height:1.7;display:grid;gap:8px}
.mbody table{width:100%;border-collapse:collapse}
.mbody td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.2)}
.mbody td.t{font-variant-numeric:tabular-nums;text-align:right}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:#fff}
kbd{background:#fff;color:var(--ink);border-radius:5px;padding:0 6px;font-family:inherit;font-weight:800}
</style>

<div id="app">
  <canvas id="gl"></canvas>

  <div id="title" class="screen">
    <h1 class="logo"><span class="a">カート</span><span class="b">で</span><span class="c">ゴー！</span></h1>
    <div class="ribbon sub">みんなでわくわくレース</div>
    <div id="lineup" class="lineup"></div>
    <div style="height:clamp(20px,12vh,120px)"></div>
    <button id="btnStart" class="btn-y ol-o">スタート ▶</button>
    <div class="round-row">
      <button class="round ol" data-modal="rank"><i><svg viewBox="0 0 32 32"><path d="M4 24 L6 10 L12 16 L16 6 L20 16 L26 10 L28 24Z" fill="#fff"/><rect x="4" y="25" width="24" height="3" rx="1.5" fill="#fff"/></svg></i>ランキング</button>
      <button class="round ol" data-modal="settings"><i><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="4 3.85"/><circle cx="16" cy="16" r="7.5" fill="#fff"/><circle cx="16" cy="16" r="3.5" fill="#1f5fd6"/></svg></i>設定</button>
      <button class="round ol" data-modal="help"><i><svg viewBox="0 0 32 32"><text x="16" y="25" text-anchor="middle" font-size="24" font-weight="900" fill="#fff" font-family="sans-serif">?</text></svg></i>ヘルプ</button>
    </div>
  </div>

  <div id="select" class="screen" hidden style="display:none">
    <div class="panel">
      <div class="ribbon">キャラクターを選んでね</div>
      <div id="gridCh" class="grid-ch"></div>
      <div class="preview">
        <div class="stage"><span id="pvEmo" class="big"></span><span id="pvKart"></span></div>
        <div class="stats">
          <b id="pvName"></b>
          <div class="stat">スピード<span class="bar"><i id="stSp"></i></span></div>
          <div class="stat">ハンドリング<span class="bar"><i id="stHd"></i></span></div>
          <div class="stat">加速<span class="bar"><i id="stAc"></i></span></div>
        </div>
      </div>
      <div class="ribbon">カートを選んでね</div>
      <div id="gridKt" class="grid-kt"></div>
      <div class="row">
        <button id="btnBack" class="btn-b">もどる</button>
        <button id="btnGo" class="btn-y ol-o">決定 ▶</button>
      </div>
    </div>
  </div>

  <div id="hud" hidden style="display:none">
    <div class="tl">
      <div class="posbox ol"><span id="hPos" class="n">8</span><span class="d">/8</span><small>順位</small></div>
      <div id="hRanks" class="ranks ol"></div>
    </div>
    <div class="tc"><div class="lap ol">LAP <b id="hLap">1</b>/3</div></div>
    <div class="tr">
      <div class="timer ol"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="#fff" stroke="#0f2c6b" stroke-width="2"/><path d="M16 8v8l5 4" stroke="#0f2c6b" stroke-width="3" fill="none" stroke-linecap="round"/></svg><span><span class="lbl">タイム</span><span id="hTime" class="t">00:00.0</span></span></div>
      <div class="items ol"><div id="hSlot" class="slot"></div><div class="coins"><span id="coinIco"></span>×<span id="hCoins">0</span></div></div>
    </div>
    <canvas id="mini"></canvas>
    <div class="keys">← → ハンドル ／ Space ドリフト ／ X アイテム ／ ↓ ブレーキ</div>
    <div class="steer ctl" id="steer">
      <button id="bL" aria-label="左"><svg viewBox="0 0 40 40"><path d="M28 6 L8 20 L28 34Z" fill="#fff" stroke="#0f2c6b" stroke-width="3" stroke-linejoin="round"/></svg></button>
      <button id="bR" aria-label="右"><svg viewBox="0 0 40 40"><path d="M12 6 L32 20 L12 34Z" fill="#fff" stroke="#0f2c6b" stroke-width="3" stroke-linejoin="round"/></svg></button>
    </div>
