<title>ぴょんぴょん忍者</title>
<meta name="description" content="タップひとつで左右のかべをジャンプしてのぼるドット絵アクション。空中でもう一回タップで切りかえし！トゲ・カラス・落石をよけて、竹やぶから天守閣、月夜、そして宇宙まで、どこまで高くのぼれるかな？">

<body>
<div id="app">
  <div id="wrap">
    <canvas id="cv" width="144" height="256"></canvas>
    <div id="hud" hidden>
      <div><div id="hm" class="px">0<small>m</small></div><div id="hb" class="px"></div></div>
      <div><div id="hc" class="px"><img class="coin" alt=""><span id="hcn">0</span></div><div id="hs" class="px"></div></div>
    </div>
    <div id="banner" class="px"></div>
    <div id="tut" class="px" hidden></div>

    <div id="title" class="ov dim">
      <div class="logo px">ぴょんぴょん<br><span class="l2">忍者</span></div>
      <div class="sub px">タップでかべからかべへジャンプ！<br>空中でもう一回タップで<span style="color:#ffd23f">切りかえし</span></div>
      <div class="stat px"><span>ベスト <span id="tBest">0</span>m</span><span><img class="coin" alt=""> <span id="tWallet">0</span></span></div>
      <button class="btn" id="bPlay">あそぶ</button>
      <button class="btn b2" id="bShop">きせかえ</button>
      <button class="btn b3" id="bSound">おと：ON</button>
    </div>

    <div id="over" class="ov dim" hidden>
      <div class="panel">
        <div class="gt px" id="goT">やられた！</div>
        <div class="reason" id="goR"></div>
        <div class="bigm px"><span id="goM">0</span><small>m</small></div>
        <div id="goNew" class="px" hidden>NEW RECORD!</div>
        <div class="line">ベスト <span id="goBest">0</span>m</div>
        <div class="line"><img class="coin" alt=""> +<span id="goC">0</span>　<span style="color:#b9b3d6">もちがね <span id="goW">0</span></span></div>
      </div>
      <button class="btn" id="bRetry">もう一回</button>
      <button class="btn b3" id="bTitle">タイトルへ</button>
    </div>

    <div id="shop" class="ov dim" hidden>
      <div class="panel">
        <div class="st px">きせかえ</div>
        <div class="line"><img class="coin" alt=""> <span id="sW">0</span></div>
        <div id="grid"></div>
        <button class="btn b3" id="bShopClose">もどる</button>
      </div>
    </div>

    <div id="pause" class="ov dim px" hidden>タップでさいかい</div>
  </div>
</div>
