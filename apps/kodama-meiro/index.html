<!DOCTYPE html>
<!-- © kato200000354. 無断転載・複製・再配布を禁止します。 (kato200000354-protected) -->

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>こだま迷路</title>
<style>
  :root{
    --bg:#030407; --fg:#cfefff; --accent:#7fe7ff; --gold:#ffd27a; --danger:#ff4d6d; --panel:rgba(8,14,22,.86);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none;font-size:15px;letter-spacing:.05em}
  #hud .l{display:flex;gap:14px;align-items:center}
  #hud b{color:var(--accent);font-weight:700}
  #muteBtn{pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid rgba(127,231,255,.25);color:var(--fg);
    border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
  .btn{position:fixed;border-radius:50%;display:none;align-items:center;justify-content:center;flex-direction:column;
    font-weight:700;color:var(--fg);background:rgba(127,231,255,.08);border:2px solid rgba(127,231,255,.35);
    touch-action:none}
  .btn small{font-size:10px;opacity:.7;font-weight:400}
  #pingBtn{width:96px;height:96px;right:22px;bottom:calc(30px + env(safe-area-inset-bottom));font-size:22px}
  #stoneBtn{width:64px;height:64px;right:132px;bottom:calc(36px + env(safe-area-inset-bottom));font-size:16px;
    border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
  body.touch .btn{display:flex}
  #pingBtn.on{background:rgba(127,231,255,.25)}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(2,3,6,.55)}
  #overlay.hide{display:none}
  .card{max-width:440px;width:100%;background:var(--panel);border:1px solid rgba(127,231,255,.2);border-radius:16px;
    padding:26px 22px;text-align:center;line-height:1.75}
  .card h1{font-size:34px;letter-spacing:.2em;color:var(--accent);text-shadow:0 0 18px rgba(127,231,255,.6);margin-bottom:6px}
  .card h2{font-size:24px;margin-bottom:8px}
  .card p{font-size:14px;opacity:.88}
  .card{max-height:calc(100vh - 32px);overflow-y:auto}
  .note{background:#d9d1c2;color:#2a2018;border-radius:4px;padding:18px 18px 14px;text-align:left;margin:10px 0 4px;
    font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:14.5px;line-height:1.9;
    box-shadow:0 0 30px rgba(0,0,0,.6) inset, 0 4px 16px rgba(0,0,0,.5);transform:rotate(-.6deg)}
  .note .nt{font-weight:700;border-bottom:1px solid rgba(60,40,20,.3);margin-bottom:8px;padding-bottom:4px;font-size:13px}
  .note .stain{color:#7a1020}
  .sub{margin-top:10px;font-size:14px;padding:8px 20px;border-radius:20px;cursor:pointer;
    background:transparent;color:#d9d1c2;border:1px solid rgba(217,209,194,.35)}
  .notelist .note{transform:none;font-size:13.5px}
  #whiteout{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity 7s ease-in}
  #whiteout.on{opacity:1}
  #ending{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding:16px;text-align:center;z-index:5;pointer-events:none;
    font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif}
  #ending.on{display:flex}
  #ending p{opacity:0;transition:opacity 1.8s;font-size:18px;letter-spacing:.08em;line-height:1.7;max-width:520px}
  #ending p.show{opacity:1}
  #ending.light{color:#2a2622} #ending.dark{color:#e8e2dc;justify-content:flex-end;padding-bottom:calc(8vh + env(safe-area-inset-bottom))}
  #ending .etitle{font-size:24px;font-weight:700;margin-top:18px}
  #ending .ehint{font-size:13px;opacity:.7}
  #ending .ebtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;transition:opacity 1.5s}
  #ending .ebtns.show{opacity:1;pointer-events:auto}
  #ending.light .sub{color:#2a2622;border-color:rgba(40,30,20,.4)}
  .card ul{list-style:none;text-align:left;font-size:13.5px;margin:14px 0;opacity:.9}
  .card li{padding:3px 0}
  .card li span{color:var(--accent)}
  .card .go,#ending .go{margin-top:16px;font-size:18px;padding:12px 36px;border-radius:30px;border:none;cursor:pointer;
    background:#a3122f;color:#f3e9e4;font-weight:700;letter-spacing:.1em;box-shadow:0 0 18px rgba(255,40,70,.35)}
  .hint{font-size:12px;opacity:.6;margin-top:10px}
  .danger{color:var(--danger)} .gold,.card li span.gold{color:var(--gold)}
  #breathBtn{width:64px;height:64px;right:30px;bottom:calc(140px + env(safe-area-inset-bottom));font-size:16px;
    border-color:rgba(180,160,255,.35);background:rgba(180,160,255,.06)}
  #breathBtn.on{background:rgba(180,160,255,.28)}
  #hBr{display:inline-block;width:56px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;vertical-align:middle}
  #hBr i{display:block;height:100%;width:100%;background:#b4a0ff;transition:background .2s}
  #hBr.low i{background:var(--danger)}
  /* ホラー演出 */
  .card h1.glitch{color:#e8e2dc;text-shadow:2px 0 rgba(255,40,70,.7),-2px 0 rgba(127,231,255,.5);
    animation:glitch 3.2s infinite steps(1)}
  @keyframes glitch{
    0%,100%{transform:none;opacity:1} 41%{transform:translate(2px,-1px) skewX(-6deg);opacity:.85}
    42%{transform:translate(-3px,1px);opacity:.4} 43%{transform:none;opacity:1}
    77%{opacity:.2} 78%{opacity:1} 79%{transform:translate(1px,0) skewX(8deg)} 80%{transform:none}
  }
  .tagline{font-size:13px;opacity:.75;letter-spacing:.1em;margin-bottom:12px}
  .warn{display:inline-block;font-size:12px;border:1px solid rgba(255,77,109,.5);color:#ff9aac;border-radius:12px;
    padding:2px 10px;margin-bottom:10px}
  h2.shake{animation:shake .12s infinite}
  @keyframes shake{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="l"><span>地下 <b id="hLv">1</b> 層</span><span>石 ×<b id="hSt">3</b></span><span>息 <span id="hBr"><i></i></span></span><span id="hBest" style="opacity:.6"></span></div>
  <button id="muteBtn">🔊 音あり</button>
</div>
<div id="stoneBtn" class="btn">石<small>なげる</small></div>
<div id="breathBtn" class="btn">息<small>ひそめる</small></div>
<div id="pingBtn" class="btn">音<small>長押しで大</small></div>
<div id="overlay"><div class="card" id="card"></div></div>
<div id="whiteout"></div>
<div id="ending"></div>
