<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>こだま迷路</title>
<style>
  :root{
    --bg:#030407; --fg:#cfefff; --accent:#7fe7ff; --gold:#ffd27a; --danger:#ff4d6d; --panel:rgba(8,14,22,.86);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;touch-action:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none;font-size:15px;letter-spacing:.05em}
  #hud .l{display:flex;gap:14px;align-items:center}
  #hud b{color:var(--accent);font-weight:700}
  #muteBtn{pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid rgba(127,231,255,.25);color:var(--fg);
    border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer}
  .btn{position:fixed;border-radius:50%;display:none;align-items:center;justify-content:center;flex-direction:column;
    font-weight:700;color:var(--fg);background:rgba(127,231,255,.08);border:2px solid rgba(127,231,255,.35);
    touch-action:none}
  .btn small{font-size:10px;opacity:.7;font-weight:400}
  #pingBtn{width:96px;height:96px;right:22px;bottom:calc(30px + env(safe-area-inset-bottom));font-size:22px}
  #stoneBtn{width:64px;height:64px;right:132px;bottom:calc(36px + env(safe-area-inset-bottom));font-size:16px;
    border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
  body.touch .btn{display:flex}
  #pingBtn.on{background:rgba(127,231,255,.25)}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(2,3,6,.55)}
  #overlay.hide{display:none}
  .card{max-width:440px;width:100%;background:var(--panel);border:1px solid rgba(127,231,255,.2);border-radius:16px;
    padding:26px 22px;text-align:center;line-height:1.75}
  .card h1{font-size:34px;letter-spacing:.2em;color:var(--accent);text-shadow:0 0 18px rgba(127,231,255,.6);margin-bottom:6px}
  .card h2{font-size:24px;margin-bottom:8px}
  .card p{font-size:14px;opacity:.88}
  .card{max-height:calc(100vh - 32px);overflow-y:auto}
  .note{background:#d9d1c2;color:#2a2018;border-radius:4px;padding:18px 18px 14px;text-align:left;margin:10px 0 4px;
    font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:14.5px;line-height:1.9;
    box-shadow:0 0 30px rgba(0,0,0,.6) inset, 0 4px 16px rgba(0,0,0,.5);transform:rotate(-.6deg)}
  .note .nt{font-weight:700;border-bottom:1px solid rgba(60,40,20,.3);margin-bottom:8px;padding-bottom:4px;font-size:13px}
  .note .stain{color:#7a1020}
  .sub{margin-top:10px;font-size:14px;padding:8px 20px;border-radius:20px;cursor:pointer;
    background:transparent;color:#d9d1c2;border:1px solid rgba(217,209,194,.35)}
  .notelist .note{transform:none;font-size:13.5px}
  .card ul{list-style:none;text-align:left;font-size:13.5px;margin:14px 0;opacity:.9}
  .card li{padding:3px 0}
  .card li span{color:var(--accent)}
  .card .go{margin-top:16px;font-size:18px;padding:12px 36px;border-radius:30px;border:none;cursor:pointer;
    background:#a3122f;color:#f3e9e4;font-weight:700;letter-spacing:.1em;box-shadow:0 0 18px rgba(255,40,70,.35)}
  .hint{font-size:12px;opacity:.6;margin-top:10px}
  .danger{color:var(--danger)} .gold,.card li span.gold{color:var(--gold)}
  #breathBtn{width:64px;height:64px;right:30px;bottom:calc(140px + env(safe-area-inset-bottom));font-size:16px;
    border-color:rgba(180,160,255,.35);background:rgba(180,160,255,.06)}
  #breathBtn.on{background:rgba(180,160,255,.28)}
  #hBr{display:inline-block;width:56px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;vertical-align:middle}
  #hBr i{display:block;height:100%;width:100%;background:#b4a0ff;transition:background .2s}
  #hBr.low i{background:var(--danger)}
  /* ホラー演出 */
  .card h1.glitch{color:#e8e2dc;text-shadow:2px 0 rgba(255,40,70,.7),-2px 0 rgba(127,231,255,.5);
    animation:glitch 3.2s infinite steps(1)}
  @keyframes glitch{
    0%,100%{transform:none;opacity:1} 41%{transform:translate(2px,-1px) skewX(-6deg);opacity:.85}
    42%{transform:translate(-3px,1px);opacity:.4} 43%{transform:none;opacity:1}
    77%{opacity:.2} 78%{opacity:1} 79%{transform:translate(1px,0) skewX(8deg)} 80%{transform:none}
  }
  .tagline{font-size:13px;opacity:.75;letter-spacing:.1em;margin-bottom:12px}
  .warn{display:inline-block;font-size:12px;border:1px solid rgba(255,77,109,.5);color:#ff9aac;border-radius:12px;
    padding:2px 10px;margin-bottom:10px}
  h2.shake{animation:shake .12s infinite}
  @keyframes shake{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="l"><span>地下 <b id="hLv">1</b> 層</span><span>石 ×<b id="hSt">3</b></span><span>息 <span id="hBr"><i></i></span></span><span id="hBest" style="opacity:.6"></span></div>
  <button id="muteBtn">🔊 音あり</button>
</div>
<div id="stoneBtn" class="btn">石<small>なげる</small></div>
<div id="breathBtn" class="btn">息<small>ひそめる</small></div>
<div id="pingBtn" class="btn">音<small>長押しで大</small></div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
// ===== 基本設定 =====
const SPEED = 15;       // 音の広がる速さ（マス/秒）
const FADE = 2.4;       // 壁が光ってから消えるまで（秒）
const PLAYER_SPEED = 3.3;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, TS;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  TS = Math.max(26, Math.min(W, H) / 11);
}
addEventListener('resize', resize); resize();

const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');

function store(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

// ===== サウンド =====
let AC = null, master = null, echoIn = null, muted = store('kodama_mute') === '1';
function initAudio(){
  if (AC){ if (AC.state === 'suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(AC.destination);
    const d = AC.createDelay(1); d.delayTime.value = 0.21;
    const fb = AC.createGain(); fb.gain.value = 0.4;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    echoIn = AC.createGain(); echoIn.gain.value = 0.55;
    echoIn.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);
  }catch(e){ AC = null; }
}
// 低くうなり続ける環境音
let drone = null;
function startDrone(){
  if (!AC || drone) return;
  const g = AC.createGain(), lp = AC.createBiquadFilter(), lfo = AC.createOscillator(), lg = AC.createGain();
  g.gain.value = 0; lp.type = 'lowpass'; lp.frequency.value = 180;
  lfo.frequency.value = 0.08; lg.gain.value = 70; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  for (const [f, type] of [[43, 'sawtooth'], [43.6, 'sawtooth'], [64.5, 'triangle']]){
    const o = AC.createOscillator(); o.type = type; o.frequency.value = f; o.connect(lp); o.start();
  }
  lp.connect(g); g.connect(master);
  g.gain.linearRampToValueAtTime(0.09, AC.currentTime + 3);
  drone = g;
}
function out(pan, echo){
  let node = master;
  if (AC.createStereoPanner && pan){
    const p = AC.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(master);
    if (echo) p.connect(echoIn);
    return p;
  }
  if (echo){ const g = AC.createGain(); g.connect(master); g.connect(echoIn); return g; }
  return node;
}
function tone(f0, f1, dur, vol, type='sine', pan=0, echo=false, delay=0){
  if (!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out(pan, echo)); o.start(t); o.stop(t + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, vol, filt='lowpass', freq=600, pan=0){
  if (!AC) return;
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (dur <= 0) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = filt; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(out(pan, false)); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  ping(fr, pan = 0, vs = 1){ tone(1500 - 400*fr, 650 - 200*fr, 0.22 + 0.25*fr, (0.12 + 0.18*fr) * vs, 'sine', pan, true); },
  paper(){ noise(0.25, 0.12, 'bandpass', 2500); noise(0.18, 0.08, 'highpass', 4000); },
  step(){ noise(0.05, 0.035, 'lowpass', 500); },
  land(pan){ noise(0.08, 0.25, 'highpass', 1800, pan); tone(2300, 1700, 0.12, 0.08, 'triangle', pan, true); },
  enemyStep(pan, vol){ tone(95, 48, 0.14, vol, 'triangle', pan); },
  growl(pan, vol){ tone(130, 60, 0.6, vol, 'sawtooth', pan); tone(97, 50, 0.6, vol*0.7, 'square', pan); },
  pickup(){ tone(880, 880, 0.12, 0.12, 'sine'); tone(1320, 1320, 0.18, 0.12, 'sine', 0, false, 0.09); },
  clear(){ [392, 466, 554, 523].forEach((f, i) => tone(f, f * 0.98, 0.5, 0.1, 'triangle', 0, true, i * 0.16)); },
  dead(){ tone(320, 40, 1.1, 0.25, 'sawtooth'); noise(0.6, 0.3, 'lowpass', 300); },
  throw(){ noise(0.12, 0.06, 'bandpass', 900); },
  sting(pan){
    tone(220, 207, 0.9, 0.07, 'sawtooth', pan, true); tone(233, 247, 0.9, 0.07, 'sawtooth', pan, true);
    tone(1900, 1500, 0.7, 0.03, 'triangle', pan, true); noise(0.4, 0.05, 'bandpass', 3000, pan);
  },
  heart(vol){ tone(62, 40, 0.16, vol, 'sine'); tone(55, 38, 0.18, vol * 0.75, 'sine', 0, false, 0.17); },
  drip(pan){ tone(1700 + Math.random() * 600, 700, 0.09, 0.05, 'sine', pan, true); },
  gasp(){ noise(0.5, 0.22, 'bandpass', 1100); tone(380, 260, 0.35, 0.04, 'sawtooth'); },
  whisper(pan){ // 帯域を揺らしたノイズで「ささやき」
    if (!AC) return;
    noise(0, 0); // バッファを用意
    const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.Q.value = 9;
    f.frequency.setValueAtTime(900, t);
    for (let i = 1; i <= 8; i++) f.frequency.linearRampToValueAtTime(700 + Math.random() * 1400, t + i * 0.18);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.09, t + 0.3);
    g.gain.linearRampToValueAtTime(0.05, t + 1.0); g.gain.linearRampToValueAtTime(0.0001, t + 1.5);
    s.connect(f); f.connect(g); g.connect(out(pan, true)); s.start(t); s.stop(t + 1.6);
  }
};
const muteBtn = document.getElementById('muteBtn');
function refreshMute(){ muteBtn.textContent = muted ? '🔇 音なし' : '🔊 音あり'; if (master) master.gain.value = muted ? 0 : 0.8; }
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); initAudio(); muted = !muted; store('kodama_mute', muted ? '1' : '0'); refreshMute(); });
refreshMute();

// ===== 迷路 =====
let grid, gw, gh, allFaces;
function isWall(x, y){ return x < 0 || y < 0 || x >= gw || y >= gh || grid[y * gw + x] === 1; }
function rnd(n){ return Math.floor(Math.random() * n); }

function genMaze(cw, ch){
  gw = cw * 2 + 1; gh = ch * 2 + 1;
  grid = new Uint8Array(gw * gh).fill(1);
  const vis = new Uint8Array(cw * ch), stack = [[0, 0]];
  vis[0] = 1; grid[gw + 1] = 0;
  while (stack.length){
    const [cx, cy] = stack[stack.length - 1], nb = [];
    for (const [dx, dy] of DIRS){
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && ny >= 0 && nx < cw && ny < ch && !vis[ny * cw + nx]) nb.push([nx, ny, dx, dy]);
    }
    if (!nb.length){ stack.pop(); continue; }
    const [nx, ny, dx, dy] = nb[rnd(nb.length)];
    vis[ny * cw + nx] = 1;
    grid[(cy * 2 + 1 + dy) * gw + cx * 2 + 1 + dx] = 0;
    grid[(ny * 2 + 1) * gw + nx * 2 + 1] = 0;
    stack.push([nx, ny]);
  }
  // 行き止まりを一部つなげて、逃げ道（ループ）を作る
  for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++){
    const tx = cx * 2 + 1, ty = cy * 2 + 1;
    let walls = 0; for (const [dx, dy] of DIRS) if (isWall(tx + dx, ty + dy)) walls++;
    if (walls === 3 && Math.random() < 0.4){
      const opts = DIRS.filter(([dx, dy]) => isWall(tx + dx, ty + dy) && tx + dx*2 > 0 && ty + dy*2 > 0 && tx + dx*2 < gw - 1 && ty + dy*2 < gh - 1);
      if (opts.length){ const [dx, dy] = opts[rnd(opts.length)]; grid[(ty + dy) * gw + tx + dx] = 0; }
    }
  }
  allFaces = [];
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    if (isWall(x, y)) continue;
    if (isWall(x - 1, y)) allFaces.push([x, y, x, y + 1]);
    if (isWall(x + 1, y)) allFaces.push([x + 1, y, x + 1, y + 1]);
    if (isWall(x, y - 1)) allFaces.push([x, y, x + 1, y]);
    if (isWall(x, y + 1)) allFaces.push([x, y + 1, x + 1, y + 1]);
  }
}
function bfs(sx, sy){
  const dist = new Int32Array(gw * gh).fill(-1), prev = new Int32Array(gw * gh).fill(-1), q = [sy * gw + sx];
  dist[q[0]] = 0;
  for (let i = 0; i < q.length; i++){
    const c = q[i], x = c % gw, y = (c / gw) | 0;
    for (const [dx, dy] of DIRS){
      const nx = x + dx, ny = y + dy;
      if (isWall(nx, ny)) continue;
      const n = ny * gw + nx;
      if (dist[n] < 0){ dist[n] = dist[c] + 1; prev[n] = c; q.push(n); }
    }
  }
  return { dist, prev };
}
function bfsPath(sx, sy, tx, ty){
  if (isWall(tx, ty)) return [];
  const { prev, dist } = bfs(sx, sy);
  let c = ty * gw + tx; if (dist[c] < 0) return [];
  const path = [];
  while (c !== sy * gw + sx){ path.push([c % gw, (c / gw) | 0]); c = prev[c]; }
  return path.reverse();
}

// ===== レイ（音の反響） =====
function castRay(ox, oy, ang, maxR){
  let dx = Math.cos(ang), dy = Math.sin(ang);
  if (Math.abs(dx) < 1e-9) dx = 1e-9; if (Math.abs(dy) < 1e-9) dy = 1e-9;
  let mx = Math.floor(ox), my = Math.floor(oy);
  const ddx = Math.abs(1 / dx), ddy = Math.abs(1 / dy), sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1;
  let sdx = dx < 0 ? (ox - mx) * ddx : (mx + 1 - ox) * ddx;
  let sdy = dy < 0 ? (oy - my) * ddy : (my + 1 - oy) * ddy;
  for (let i = 0; i < 200; i++){
    let d, side;
    if (sdx < sdy){ d = sdx; sdx += ddx; mx += sx; side = 0; } else { d = sdy; sdy += ddy; my += sy; side = 1; }
    if (d > maxR) return null;
    if (isWall(mx, my)) return { mx, my, side, step: side ? sy : sx, d };
  }
  return null;
}
function los(ax, ay, bx, by){
  const d = Math.hypot(bx - ax, by - ay);
  if (d < 0.05) return true;
  return !castRay(ax, ay, Math.atan2(by - ay, bx - ax), d);
}

// ===== 物語（1層ごとに1枚ずつ見つかる記録） =====
const NOTES = [
  ['作業員のメモ', 'ここでは明かりを使うな、と言われた。\n理由は聞くな、とも。\n\nかわりに手を叩け、と。\n音が返ってくる方に、壁がある。'],
  ['研究日誌 ― 第七反響施設', '被験者たちを完全な暗闇で生活させて、今日で四十日。\n全員が、手を叩くだけで部屋の形を言い当てるようになった。\n\n実験は順調だ。'],
  ['研究日誌 ― 六十二日目', '被験者3番が「目はもういらない」と言った。\n検査すると、本当に光に反応しなくなっていた。\n\n本人は笑っていた。とても静かに。'],
  ['走り書き', 'あいつら、明かりをつけると叫ぶ。\n音を立てると、こっちに来る。\n\n音を立てるな。音を立てるな。音を立て<span class="stain">るな</span>'],
  ['子どもの字', 'おとうさんは ちかで おしごとしてる。\nくらいけど みんなのこえが きこえるって。\n\nいつ かえってくるの'],
  ['研究日誌 ― 九十日目', '指が伸びている。長く、細く。\n「壁を探るためだ」と3番は言った。\n\n目の数が増えた者もいる。\n見えないはずのその目が、ずっとこちらを向いている。'],
  ['警備員の手帳', '気をつけろ。やつらは真似をする。\n\nおれが手を叩く音で、おれを呼んだ。\n出口の明かりのふりをして、待っていた。\n\n<span class="stain">出口の字を、よく見ろ。</span>'],
  ['避難指示書（破れている）', '地上への階段はすべて封鎖した。\n残った職員は、最下層の非常口から\n\n（ここから先は破れていて読めない）'],
  ['研究主任のメモ', 'わたしも、目を閉じている時間が長くなった。\n暗闇の方が、よく聞こえる。\n\n手を叩くと、世界が見える。\nあれは、なんて美しいのだろう。'],
  ['このメモを読んでいるあなたへ', 'あなたも、音で見ているでしょう。\n手を叩いて、壁の形を知って、ここまで降りてきた。\n\nそれがどういう意味か、もうわかるはず。\n\n<span class="stain">わたしたちは、あなたを待っている。</span>']
];
let foundNotes = (() => { try { return JSON.parse(store('kodama_notes') || '[]'); } catch(e){ return []; } })();
let noteObj = null;
function noteHtml(i){
  const [t, b] = NOTES[i];
  return `<div class="note"><div class="nt">記録 ${i + 1} ／ ${t}</div>${b.replace(/\n/g, '<br>')}</div>`;
}

// ===== 状態 =====
let state = 'title', level = 1, stones = 3, best = +(store('kodama_best') || 0);
let player, enemies, items, exitObj, pings, projectiles, memory, memKeys, now = 0, deathInfo = null;
let charging = false, chargeStart = 0, pingCooldown = 0, stepTimer = 0, dangerPulse = 0;
let breath = 1, holdBreath = false, breathLocked = false, lastBeat = -99, nextBeat = 0, dripT = 3, whisperT = 15, deathAt = -99;

function setupLevel(){
  const size = Math.min(16, 6 + level);
  genMaze(size, size);
  player = { x: 1.5, y: 1.5, fx: 1, fy: 0 };
  const { dist } = bfs(1, 1);
  let maxD = 0, ex = 1, ey = 1;
  for (let y = 1; y < gh; y += 2) for (let x = 1; x < gw; x += 2){
    const d = dist[y * gw + x]; if (d > maxD){ maxD = d; ex = x; ey = y; }
  }
  exitObj = { x: ex + 0.5, y: ey + 0.5, known: false, seenAt: -99 };
  // 石は行き止まりに置く
  const deadEnds = [], cells = [];
  for (let y = 1; y < gh; y += 2) for (let x = 1; x < gw; x += 2){
    if ((x === 1 && y === 1) || (x === ex && y === ey)) continue;
    let w = 0; for (const [dx, dy] of DIRS) if (isWall(x + dx, y + dy)) w++;
    if (w === 3) deadEnds.push([x, y]);
    cells.push([x, y, dist[y * gw + x]]);
  }
  items = [];
  const nStone = 2 + (level % 2);
  for (let i = 0; i < nStone && deadEnds.length; i++){
    const [x, y] = deadEnds.splice(rnd(deadEnds.length), 1)[0];
    items.push({ x: x + 0.5, y: y + 0.5, known: false, seenAt: -99 });
  }
  // 記録：その層の1枚（まだ拾っていなければ）を、道のりの中ほどに置く
  noteObj = null;
  if (level <= NOTES.length && !foundNotes.includes(level - 1)){
    const mid = cells.filter(c => c[2] >= maxD * 0.3 && c[2] <= maxD * 0.75 && !items.some(it => it.x === c[0] + 0.5 && it.y === c[1] + 0.5));
    const pool = mid.length ? mid : cells;
    const [x, y] = pool[rnd(pool.length)];
    noteObj = { x: x + 0.5, y: y + 0.5, idx: level - 1, known: false, seenAt: -99 };
  }
  // 敵はスタートから遠い場所に（3層からは「まねるもの」がまざる）
  enemies = [];
  const nMimic = level >= 5 ? 2 : level >= 3 ? 1 : 0;
  const nEnemy = Math.min(7, 1 + Math.floor(level / 2));
  const far = cells.filter(c => c[2] >= Math.max(9, maxD * 0.35));
  for (let i = 0; i < nEnemy && far.length; i++){
    const [x, y] = far.splice(rnd(far.length), 1)[0];
    enemies.push({ x: x + 0.5, y: y + 0.5, cx: x, cy: y, nx: x, ny: y, px: -1, py: -1, path: [],
      hunt: false, wait: 0, stepT: Math.random(), seenAt: -99, sx: 0, sy: 0, alertAt: -99,
      seed: Math.random() * Math.PI * 2, stingAt: -99, mimic: i < nMimic, fakeT: 5 + Math.random() * 8 });
  }
  pings = []; projectiles = []; memory = []; memKeys = new Set();
  charging = false; pingCooldown = 0; deathInfo = null;
  breath = 1; breathLocked = false; holdBreath = false;
  updateHud();
}

function updateHud(){
  document.getElementById('hLv').textContent = level;
  document.getElementById('hSt').textContent = stones;
  document.getElementById('hBest').textContent = best ? '最深 ' + best + ' 層' : '';
}

// ===== 音を出す =====
function makePing(x, y, maxR, hearing, opt = {}){
  const rays = Math.max(90, Math.ceil(maxR * 42)), map = new Map();
  for (let i = 0; i < rays; i++){
    const h = castRay(x, y, (i / rays) * Math.PI * 2, maxR);
    if (!h) continue;
    const key = h.mx + ',' + h.my + ',' + h.side + ',' + h.step;
    const old = map.get(key);
    if (old && old.d <= h.d) continue;
    let seg;
    if (h.side === 0){ const fx = h.step > 0 ? h.mx : h.mx + 1; seg = [fx, h.my, fx, h.my + 1]; }
    else { const fy = h.step > 0 ? h.my : h.my + 1; seg = [h.mx, fy, h.mx + 1, fy]; }
    map.set(key, { key, seg, d: h.d });
  }
  const hits = [...map.values()].sort((a, b) => a.d - b.d);
  pings.push({ x, y, t0: now, maxR, hits, idx: 0, prevR: 0, bright: opt.bright ?? 1,
    color: opt.color || '127,231,255', ring: opt.ring !== false });
  for (const e of enemies){
    if (Math.hypot(e.x - x, e.y - y) <= hearing) hear(e, x, y);
  }
}
function doPing(){
  if (pingCooldown > 0) return;
  const fr = Math.min(1, (now - chargeStart) / 1.0);
  const maxR = 4 + 9 * fr;
  makePing(player.x, player.y, maxR, maxR * 1.15);
  SFX.ping(fr);
  pingCooldown = 0.45;
}
function throwStone(){
  if (state !== 'play' || stones <= 0) return;
  stones--; updateHud(); SFX.throw();
  const l = Math.hypot(player.fx, player.fy) || 1;
  projectiles.push({ x: player.x, y: player.y, vx: player.fx / l * 11, vy: player.fy / l * 11, trav: 0 });
}

// ===== 敵 =====
const enemyPan = e => Math.max(-1, Math.min(1, (e.x - player.x) / 7));
function hear(e, x, y){
  const tx = Math.floor(x), ty = Math.floor(y);
  e.path = bfsPath(e.nx, e.ny, tx, ty);
  if (!e.hunt || now - e.alertAt > 2){
    e.alertAt = now; e.seenAt = now; e.sx = e.x; e.sy = e.y;
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < 14) SFX.growl(enemyPan(e), 0.12 * Math.max(0.15, 1 - d / 14));
  }
  e.hunt = true; e.wait = 0;
}
function arrive(e){
  e.px = e.cx; e.py = e.cy; e.cx = e.nx; e.cy = e.ny;
  if (e.path.length){ [e.nx, e.ny] = e.path.shift(); return; }
  if (e.hunt){ e.hunt = false; e.wait = 1.2; return; } // 音のした場所で耳をすます
  let opts = DIRS.map(([dx, dy]) => [e.cx + dx, e.cy + dy]).filter(([x, y]) => !isWall(x, y));
  const fwd = opts.filter(([x, y]) => x !== e.px || y !== e.py);
  if (fwd.length) opts = fwd;
  [e.nx, e.ny] = opts[rnd(opts.length)];
}
function updateEnemy(e, dt){
  if (e.mimic){ // プレイヤーと同じ音を鳴らして、出口のふりをする
    e.fakeT -= dt;
    if (e.fakeT <= 0){
      e.fakeT = 9 + Math.random() * 9;
      const d = Math.hypot(e.x - player.x, e.y - player.y);
      if (d < 14 && !e.hunt){
        makePing(e.x, e.y, 6, -1);
        SFX.ping(0.3, enemyPan(e), Math.max(0.15, 1 - d / 14));
      }
    }
  }
  if (e.wait > 0){ e.wait -= dt; return; }
  const sp = e.hunt ? Math.min(3.05, 2.3 + level * 0.08) : 1.25;
  let move = sp * dt, guard = 0;
  while (move > 0 && guard++ < 8){
    const gx = e.nx + 0.5, gy = e.ny + 0.5, dx = gx - e.x, dy = gy - e.y, d = Math.hypot(dx, dy);
    if (d <= move){ e.x = gx; e.y = gy; move -= d; arrive(e); if (e.wait > 0) break; }
    else { e.x += dx / d * move; e.y += dy / d * move; move = 0; }
  }
  // 足音（ステレオで方向がわかる）
  e.stepT -= dt;
  if (e.stepT <= 0){
    e.stepT = e.hunt ? 0.36 : 0.7;
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < 10 && (!e.mimic || e.hunt)) SFX.enemyStep(enemyPan(e), 0.35 * Math.pow(1 - d / 10, 2) + 0.01);
  }
}

// ===== 入力 =====
const keys = new Set();
let joy = null; // {id, bx, by, x, y}
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  initAudio();
  if (state !== 'play'){ if (e.code === 'Space' || e.code === 'Enter') overlayAction(); return; }
  keys.add(e.code);
  if (e.code === 'Space' && !e.repeat) startCharge();
  if ((e.code === 'KeyE' || e.code === 'KeyF') && !e.repeat) throwStone();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') holdBreath = true;
});
addEventListener('keyup', e => {
  keys.delete(e.code);
  if (e.code === 'Space') releaseCharge();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') holdBreath = false;
});
function startCharge(){ if (state === 'play' && !charging){ charging = true; chargeStart = now; } }
function releaseCharge(){ if (charging){ charging = false; if (state === 'play') doPing(); } }

cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'play' || joy) return;
  joy = { id: e.pointerId, bx: e.clientX, by: e.clientY, x: e.clientX, y: e.clientY };
});
addEventListener('pointermove', e => { if (joy && e.pointerId === joy.id){ joy.x = e.clientX; joy.y = e.clientY; } });
const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
addEventListener('pointerup', endJoy); addEventListener('pointercancel', endJoy);

const pingBtn = document.getElementById('pingBtn');
pingBtn.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); pingBtn.classList.add('on'); startCharge(); });
['pointerup','pointercancel','pointerleave'].forEach(t => pingBtn.addEventListener(t, () => { pingBtn.classList.remove('on'); releaseCharge(); }));
document.getElementById('stoneBtn').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); throwStone(); });
const breathBtn = document.getElementById('breathBtn');
breathBtn.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); holdBreath = true; breathBtn.classList.add('on'); });
['pointerup','pointercancel','pointerleave'].forEach(t => breathBtn.addEventListener(t, () => { holdBreath = false; breathBtn.classList.remove('on'); }));

function inputVec(){
  let x = 0, y = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) x -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) x += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) y -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) y += 1;
  if (joy){
    const dx = joy.x - joy.bx, dy = joy.y - joy.by, l = Math.hypot(dx, dy), R = 50;
    if (l > 8){ const m = Math.min(1, l / R); x = dx / l * m; y = dy / l * m; }
  }
  const l = Math.hypot(x, y); if (l > 1){ x /= l; y /= l; }
  return [x, y];
}

// ===== 更新 =====
function blocked(x, y){
  const r = 0.27;
  return isWall(Math.floor(x - r), Math.floor(y - r)) || isWall(Math.floor(x + r), Math.floor(y - r)) ||
         isWall(Math.floor(x - r), Math.floor(y + r)) || isWall(Math.floor(x + r), Math.floor(y + r));
}
function movePlayer(dt, sneaking){
  const [ix, iy] = inputVec(), mag = Math.hypot(ix, iy);
  if (mag < 0.1) return false;
  player.fx = ix; player.fy = iy;
  const sp = sneaking ? 1.5 : PLAYER_SPEED;
  const vx = ix * sp * dt, vy = iy * sp * dt, p = player;
  const assist = (axis, amt) => { // 角でひっかからないよう中央へ寄せる
    const c = Math.floor(p[axis]) + 0.5, d = c - p[axis];
    p[axis] += Math.sign(d) * Math.min(Math.abs(d), amt);
  };
  if (vx){ if (!blocked(p.x + vx, p.y)) p.x += vx; else if (Math.abs(ix) > Math.abs(iy)) assist('y', Math.abs(vx)); }
  if (vy){ if (!blocked(p.x, p.y + vy)) p.y += vy; else if (Math.abs(iy) > Math.abs(ix)) assist('x', Math.abs(vy)); }
  return true;
}

function revealCheck(p, r, obj, x, y){
  const d = Math.hypot(x - p.x, y - p.y);
  if (d > p.prevR - 0.2 && d <= r && d <= p.maxR + 0.4 && los(p.x, p.y, x, y)){ obj.seenAt = now; return true; }
  return false;
}

function update(dt){
  pingCooldown = Math.max(0, pingCooldown - dt);
  // 息をひそめる：足音が消えるが、長くは続かない
  const sneaking = holdBreath && !breathLocked;
  if (sneaking){
    breath -= dt / 4;
    if (breath <= 0){ // 限界で大きく息を吐いてしまう
      breath = 0; breathLocked = true; SFX.gasp();
      makePing(player.x, player.y, 2.5, 5.5, { bright: 0.6 });
    }
  } else {
    breath = Math.min(1, breath + dt / 3);
    if (breathLocked && breath > 0.4) breathLocked = false;
  }
  const brEl = document.getElementById('hBr');
  brEl.firstChild.style.width = (breath * 100) + '%';
  brEl.classList.toggle('low', breathLocked || breath < 0.25);
  // 環境音
  dripT -= dt; whisperT -= dt;
  if (dripT <= 0){ dripT = 2.5 + Math.random() * 6; SFX.drip(Math.random() * 2 - 1); }
  if (whisperT <= 0){ whisperT = 18 + Math.random() * 25; SFX.whisper(Math.random() < 0.5 ? -0.9 : 0.9); }

  const moving = movePlayer(dt, sneaking);
  if (moving && !sneaking){
    stepTimer += dt;
    if (stepTimer > 0.42){ // 足音で足元だけうっすら見える
      stepTimer = 0; SFX.step();
      makePing(player.x, player.y, 1.7, 2.1, { bright: 0.45, ring: false });
    }
  }
  // 石
  for (let i = projectiles.length - 1; i >= 0; i--){
    const s = projectiles[i], n = 6;
    let landed = false;
    for (let k = 0; k < n; k++){
      const nx = s.x + s.vx * dt / n, ny = s.y + s.vy * dt / n;
      if (isWall(Math.floor(nx), Math.floor(ny))){ landed = true; break; }
      s.x = nx; s.y = ny; s.trav += Math.hypot(s.vx, s.vy) * dt / n;
      if (s.trav >= 7){ landed = true; break; }
    }
    if (landed){
      projectiles.splice(i, 1);
      makePing(s.x, s.y, 5.5, 10, { color: '230,240,255', bright: 0.85 });
      SFX.land(Math.max(-1, Math.min(1, (s.x - player.x) / 7)));
    }
  }
  // 音の輪
  for (let i = pings.length - 1; i >= 0; i--){
    const p = pings[i], r = Math.min((now - p.t0) * SPEED, p.maxR + 0.5);
    while (p.idx < p.hits.length && p.hits[p.idx].d <= r){
      const h = p.hits[p.idx++];
      if (!memKeys.has(h.key)){ memKeys.add(h.key); memory.push(h.seg); }
    }
    if (p.ring){
      if (revealCheck(p, r, exitObj, exitObj.x, exitObj.y)) exitObj.known = true;
      for (const it of items) if (revealCheck(p, r, it, it.x, it.y)) it.known = true;
      if (noteObj && revealCheck(p, r, noteObj, noteObj.x, noteObj.y)) noteObj.known = true;
      for (const e of enemies) if (revealCheck(p, r, e, e.x, e.y)){
        e.sx = e.x; e.sy = e.y;
        // 近くで姿を見てしまったときの不協和音
        if (!disguised(e) && Math.hypot(e.x - player.x, e.y - player.y) < 4.5 && now - e.stingAt > 4){ e.stingAt = now; SFX.sting(enemyPan(e)); }
      }
    }
    p.prevR = r;
    if (now > p.t0 + p.maxR / SPEED + FADE) pings.splice(i, 1);
  }
  for (const e of enemies) updateEnemy(e, dt);

  // 拾う・ゴール・やられ
  for (let i = items.length - 1; i >= 0; i--){
    if (Math.hypot(items[i].x - player.x, items[i].y - player.y) < 0.55){ items.splice(i, 1); stones++; updateHud(); SFX.pickup(); }
  }
  if (noteObj && Math.hypot(noteObj.x - player.x, noteObj.y - player.y) < 0.55){ readNote(); return; }
  let nearest = 99;
  for (const e of enemies){
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    nearest = Math.min(nearest, d);
    if (d < 0.6){ die(e); return; }
  }
  // 心臓の鼓動：近いほど速く強く
  dangerPulse = Math.max(0, 1 - nearest / 8);
  if (dangerPulse > 0 && now >= nextBeat){
    nextBeat = now + 0.3 + 0.75 * (nearest / 8);
    lastBeat = now; SFX.heart(0.08 + 0.3 * dangerPulse);
  }
  if (Math.hypot(exitObj.x - player.x, exitObj.y - player.y) < 0.5) clearLevel();
}

// ===== 描画 =====
function seg(s){ ctx.moveTo(s[0] * TS, s[1] * TS); ctx.lineTo(s[2] * TS, s[3] * TS); }
const grainPat = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), img = g.createImageData(128, 128);
  for (let i = 0; i < img.data.length; i += 4){ const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return ctx.createPattern(c, 'repeat');
})();
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#030407'; ctx.fillRect(0, 0, W, H);
  if (!player) return;
  const camX = player.x * TS - W / 2, camY = player.y * TS - H / 2;
  ctx.translate(-camX, -camY);
  ctx.lineCap = 'round';

  // ゲームオーバー/クリア時は迷路の全体を見せる
  if (state === 'dead' || state === 'clear'){
    ctx.strokeStyle = 'rgba(127,231,255,.22)'; ctx.lineWidth = 2; ctx.beginPath(); allFaces.forEach(seg); ctx.stroke();
  }
  // 記憶（一度見た壁はうっすら残る）
  ctx.strokeStyle = 'rgba(127,231,255,.09)'; ctx.lineWidth = 2; ctx.beginPath(); memory.forEach(seg); ctx.stroke();

  // 音の輪と反響
  for (const p of pings){
    const r = (now - p.t0) * SPEED;
    if (p.ring && r < p.maxR){
      const a = (1 - r / p.maxR) * 0.35 * p.bright;
      ctx.strokeStyle = `rgba(${p.color},${a})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x * TS, p.y * TS, r * TS, 0, Math.PI * 2); ctx.stroke();
    }
    for (let i = 0; i < p.idx; i++){
      const h = p.hits[i], age = now - (p.t0 + h.d / SPEED);
      const a = Math.max(0, 1 - age / FADE) * p.bright * (1 - 0.35 * h.d / Math.max(4, p.maxR));
      if (a <= 0.01) continue;
      ctx.strokeStyle = `rgba(${p.color},${a * 0.22})`; ctx.lineWidth = 8; ctx.beginPath(); seg(h.seg); ctx.stroke();
      ctx.strokeStyle = `rgba(${p.color},${a})`; ctx.lineWidth = 2.2; ctx.beginPath(); seg(h.seg); ctx.stroke();
    }
  }

  // 出口
  const showAll = state === 'dead' || state === 'clear';
  if (exitObj.known || showAll){
    const f = Math.max(0, 1 - (now - exitObj.seenAt) / FADE);
    drawExit(exitObj.x * TS, exitObj.y * TS, 0.35 + 0.65 * f, '出口');
  }
  // 記録（紙切れ）
  if (noteObj && (noteObj.known || showAll)){
    const f = Math.max(0, 1 - (now - noteObj.seenAt) / FADE), a = 0.3 + 0.7 * f, s = TS * 0.2;
    const x = noteObj.x * TS, y = noteObj.y * TS;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.2);
    ctx.fillStyle = `rgba(217,209,194,${a})`; ctx.fillRect(-s * 0.8, -s, s * 1.6, s * 2);
    ctx.strokeStyle = `rgba(90,70,50,${a})`; ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.moveTo(-s * 0.55, -s * 0.6 + i * s * 0.4); ctx.lineTo(s * 0.55, -s * 0.6 + i * s * 0.4); ctx.stroke(); }
    ctx.restore();
  }
  // 石
  for (const it of items){
    if (!it.known && !showAll) continue;
    const f = Math.max(0, 1 - (now - it.seenAt) / FADE), a = 0.25 + 0.75 * f, s = TS * 0.13;
    ctx.fillStyle = `rgba(235,240,255,${a})`;
    ctx.beginPath(); ctx.moveTo(it.x * TS, it.y * TS - s); ctx.lineTo(it.x * TS + s, it.y * TS);
    ctx.lineTo(it.x * TS, it.y * TS + s); ctx.lineTo(it.x * TS - s, it.y * TS); ctx.fill();
  }
  // 飛んでいる石
  ctx.fillStyle = 'rgba(235,240,255,.7)';
  for (const s of projectiles){ ctx.beginPath(); ctx.arc(s.x * TS, s.y * TS, 2.5, 0, Math.PI * 2); ctx.fill(); }

  // 敵（音が当たった瞬間の姿だけ見える）
  for (const e of enemies){
    let a, x, y;
    if (showAll){ a = 1; x = e.x; y = e.y; }
    else { a = Math.max(0, 1 - (now - e.seenAt) / 1.6); x = e.sx; y = e.sy; }
    if (a <= 0) continue;
    if (!showAll && disguised(e, x, y)) drawExit(x * TS, y * TS, a, '出ロ'); // よく見ると「ロ」
    else drawEnemy(e, x * TS, y * TS, a);
  }

  // プレイヤー
  const px = player.x * TS, py = player.y * TS;
  const g = ctx.createRadialGradient(px, py, 0, px, py, TS * 0.7);
  g.addColorStop(0, 'rgba(200,245,255,.35)'); g.addColorStop(1, 'rgba(200,245,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, TS * 0.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = state === 'dead' ? '#ff4d6d' : '#eafcff';
  ctx.beginPath(); ctx.arc(px, py, TS * 0.16, 0, Math.PI * 2); ctx.fill();
  // 向き
  const fl = Math.hypot(player.fx, player.fy) || 1;
  ctx.fillStyle = 'rgba(234,252,255,.6)';
  ctx.beginPath(); ctx.arc(px + player.fx / fl * TS * 0.3, py + player.fy / fl * TS * 0.3, TS * 0.05, 0, Math.PI * 2); ctx.fill();
  // ため
  if (charging){
    const fr = Math.min(1, (now - chargeStart) / 1.0), R = (4 + 9 * fr) * TS;
    ctx.strokeStyle = `rgba(127,231,255,${0.15 + 0.15 * fr})`; ctx.setLineDash([4, 8]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(127,231,255,.9)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px, py, TS * 0.3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fr); ctx.stroke();
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 息をひそめている間は視界のふちが暗くなる
  if (state === 'play' && holdBreath && !breathLocked){
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.15, W / 2, H / 2, Math.max(W, H) * 0.6);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  // 鼓動にあわせて画面のふちが赤く脈打つ
  if (state === 'play' && dangerPulse > 0){
    const a = dangerPulse * 0.55 * Math.exp(-(now - lastBeat) * 5) + dangerPulse * 0.08;
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
    vg.addColorStop(0, 'rgba(255,40,70,0)'); vg.addColorStop(1, `rgba(255,40,70,${a})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
  // フィルムのようなざらつき（やられた直後は赤い砂嵐）
  if (grainPat){
    const dt = now - deathAt, dying = state === 'dead' && dt < 1.4;
    if (dying){ ctx.fillStyle = `rgba(120,0,15,${0.55 * (1 - dt / 1.4)})`; ctx.fillRect(0, 0, W, H); }
    ctx.save(); ctx.globalAlpha = dying ? 0.45 * (1 - dt / 1.4) + 0.08 : 0.07;
    ctx.translate(-rnd(128), -rnd(128)); ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 128, H + 128); ctx.restore();
  }
  // バーチャルスティック
  if (joy){
    ctx.strokeStyle = 'rgba(127,231,255,.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(joy.bx, joy.by, 50, 0, Math.PI * 2); ctx.stroke();
    const dx = joy.x - joy.bx, dy = joy.y - joy.by, l = Math.hypot(dx, dy), m = Math.min(l, 50) / (l || 1);
    ctx.fillStyle = 'rgba(127,231,255,.3)'; ctx.beginPath(); ctx.arc(joy.bx + dx * m, joy.by + dy * m, 20, 0, Math.PI * 2); ctx.fill();
  }
}
function disguised(e, x = e.x, y = e.y){
  return e.mimic && !e.hunt && Math.hypot(x - player.x, y - player.y) > 2.5;
}
function drawExit(x, y, a, label){
  const s = TS * 0.42;
  ctx.fillStyle = `rgba(255,210,122,${a * 0.18})`;
  ctx.beginPath(); ctx.arc(x, y, s * 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = `rgba(255,210,122,${a})`; ctx.lineWidth = 2.5;
  ctx.strokeRect(x - s / 2, y - s * 0.6, s, s * 1.2);
  ctx.fillStyle = `rgba(255,210,122,${a})`; ctx.font = `bold ${Math.round(TS * 0.24)}px sans-serif`;
  ctx.textAlign = 'center'; ctx.fillText(label, x, y - s * 0.8);
}
function drawEnemy(e, x, y, a){
  const s = TS * 0.42, t = now, hunt = e.hunt, sd = e.seed;
  const fl = a * (0.7 + 0.3 * Math.random()); // 古い蛍光灯のようなちらつき
  const jit = hunt ? s * 0.06 : s * 0.015;
  ctx.save();
  ctx.translate(x + (Math.random() - 0.5) * jit, y + (Math.random() - 0.5) * jit);
  // 赤黒いもや
  const g = ctx.createRadialGradient(0, 0, s * 0.3, 0, 0, s * 2.4);
  g.addColorStop(0, `rgba(140,0,25,${0.4 * fl})`); g.addColorStop(1, 'rgba(140,0,25,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s * 2.4, 0, Math.PI * 2); ctx.fill();
  // 長くて細い腕と指
  for (let i = 0; i < 7; i++){
    const ang = sd + i / 7 * Math.PI * 2 + Math.sin(t * 1.3 + i * 2.1) * 0.25;
    const len = s * (1.45 + 0.45 * Math.sin(t * 2.2 + i * 1.7 + sd));
    const bend = Math.sin(t * 1.7 + i) * 0.6;
    const bx = Math.cos(ang) * s * 0.6, by = Math.sin(ang) * s * 0.6;
    const ex = Math.cos(ang) * len, ey = Math.sin(ang) * len;
    const mx = Math.cos(ang + bend) * len * 0.6, my = Math.sin(ang + bend) * len * 0.6;
    for (const [col, w] of [[`rgba(200,20,50,${0.55 * fl})`, s * 0.17], [`rgba(18,0,5,${fl})`, s * 0.1]]){
      ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
      ctx.lineWidth = w * 0.45;
      for (let k = -1; k <= 1; k++){ // 指
        const fa = ang + k * 0.45 + Math.sin(t * 3 + i + k) * 0.15;
        ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex + Math.cos(fa) * s * 0.35, ey + Math.sin(fa) * s * 0.35); ctx.stroke();
      }
    }
  }
  // ぐにゃりと脈打つ体
  ctx.beginPath();
  for (let i = 0; i <= 24; i++){
    const ang = i / 24 * Math.PI * 2, rr = s * (0.82 + 0.13 * Math.sin(i * 3 + t * 4 + sd) + 0.05 * Math.sin(i * 7 - t * 6));
    i ? ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr) : ctx.moveTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
  }
  ctx.fillStyle = `rgba(16,0,4,${fl})`; ctx.fill();
  ctx.strokeStyle = `rgba(220,30,60,${0.7 * fl})`; ctx.lineWidth = 1.5; ctx.stroke();
  // 不ぞろいな目（プレイヤーをじっと見る）
  let lx = player.x - e.x, ly = player.y - e.y; const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
  const eyes = [[0.02, -0.3, 0.24], [-0.42, -0.02, 0.13], [0.4, -0.1, 0.1], [-0.15, 0.08, 0.07]];
  for (const [ex, ey, er] of eyes){
    const r = s * er * (hunt ? 1.15 : 1);
    ctx.fillStyle = `rgba(232,222,214,${fl})`;
    ctx.beginPath(); ctx.ellipse(ex * s, ey * s, r, r * (hunt ? 0.95 : 0.6), 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hunt ? `rgba(255,20,50,${fl})` : `rgba(10,0,0,${fl})`;
    ctx.beginPath(); ctx.arc(ex * s + lx * r * 0.45, ey * s + ly * r * 0.35, r * (hunt ? 0.32 : 0.45), 0, Math.PI * 2); ctx.fill();
  }
  // 歯のならんだ裂け目のような口
  const mw = s * 0.62, mh = s * (hunt ? 0.26 + 0.06 * Math.sin(t * 14) : 0.06), my0 = s * 0.38;
  ctx.fillStyle = `rgba(60,0,10,${fl})`;
  ctx.beginPath(); ctx.moveTo(-mw / 2, my0); ctx.quadraticCurveTo(0, my0 - mh, mw / 2, my0);
  ctx.quadraticCurveTo(0, my0 + mh * 1.4, -mw / 2, my0); ctx.fill();
  ctx.fillStyle = `rgba(235,228,210,${fl})`;
  const nT = 7;
  for (let i = 0; i < nT; i++){
    const tx = -mw / 2 + mw * (i + 0.5) / nT, tw = mw / nT * 0.45, th = s * (0.07 + 0.04 * ((i * 7 + 3) % 3));
    ctx.beginPath(); ctx.moveTo(tx - tw, my0 - mh * 0.45); ctx.lineTo(tx + tw, my0 - mh * 0.45); ctx.lineTo(tx, my0 - mh * 0.45 + th); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - tw, my0 + mh * 0.6); ctx.lineTo(tx + tw, my0 + mh * 0.6); ctx.lineTo(tx, my0 + mh * 0.6 - th); ctx.fill();
  }
  ctx.restore();
}

// ===== 画面遷移 =====
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
let overlayAction = () => {};
function showCard(html, action){
  card.innerHTML = html; overlay.classList.remove('hide');
  overlayAction = () => { initAudio(); overlay.classList.add('hide'); overlayAction = () => {}; action(); };
  card.querySelector('.go').addEventListener('click', overlayAction);
}
const controls = isTouch
  ? '<li><span>左側をドラッグ</span>　移動</li><li><span>「音」ボタン</span>　音を出す（長押しで遠くまで）</li><li><span>「息」ボタン</span>　押している間、足音を消して忍び歩き</li><li><span>「石」ボタン</span>　向いている方へ投げる</li>'
  : '<li><span>WASD / 矢印</span>　移動</li><li><span>スペース</span>　音を出す（長押しで遠くまで）</li><li><span>Shift</span>　押している間、足音を消して忍び歩き</li><li><span>E / F</span>　石を向いている方へ投げる</li>';
function title(){
  state = 'title'; level = 1; stones = 3; setupLevel();
  showCard(`<span class="warn">ホラー表現あり ・ 🎧 イヤホン推奨</span>
    <h1 class="glitch">こだま迷路</h1><p class="tagline">── 音を出すな。けれど、出さなければ進めない。</p>
    <p>ここは光の届かない地下。音を出すと、その反響で壁が一瞬だけ見える。<br>
    でも、<span class="danger">音は「やつら」にも聞こえている。</span></p>
    <ul>${controls}<li><span class="gold">出口</span>にたどり着けば、さらに奥へ。</li>
    <li>石が落ちた場所でも音が鳴る。おとりに使え。</li>
    <li>息は長くはもたない。限界がくると、大きく吐いてしまう。</li></ul>
    <button class="go">はいる</button><br>
    ${foundNotes.length ? `<button class="sub" id="notesBtn">見つけた記録を読む（${foundNotes.length} / ${NOTES.length}）</button>` : ''}
    <p class="hint">足音・心音・ささやきは左右から聞こえます</p>`, start);
  const nb = document.getElementById('notesBtn');
  if (nb) nb.addEventListener('click', showNotes);
}
function showNotes(){
  const list = [...foundNotes].sort((a, b) => a - b).map(noteHtml).join('');
  showCard(`<h2>見つけた記録</h2><p class="hint">${foundNotes.length} / ${NOTES.length}</p><div class="notelist">${list}</div>
    <button class="go">もどる</button>`, title);
}
function readNote(){
  const i = noteObj.idx; noteObj = null;
  if (!foundNotes.includes(i)){ foundNotes.push(i); store('kodama_notes', JSON.stringify(foundNotes)); }
  state = 'note'; charging = false; holdBreath = false; joy = null; keys.clear();
  pingBtn.classList.remove('on'); breathBtn.classList.remove('on');
  SFX.paper();
  showCard(`${noteHtml(i)}<p class="hint">${foundNotes.length} / ${NOTES.length} 枚目の記録</p><button class="go">つづける</button>`,
    () => { state = 'play'; });
}
function start(){ startDrone(); state = 'play'; }
const deathLines = ['つかまった…', 'みつかった', 'うしろに、いた', 'もう、にげられない'];
function die(e){
  state = 'dead'; deathAt = now; SFX.dead(); charging = false; joy = null; holdBreath = false;
  if (level - 1 > best){ best = level - 1; store('kodama_best', best); }
  updateHud();
  const line = deathLines[rnd(deathLines.length)];
  setTimeout(() => showCard(`<h2 class="danger shake">${line}</h2><p>地下 ${level} 層で、音が途絶えた。<br>到達記録：${level - 1} 層${best ? `（最深 ${best} 層）` : ''}</p>
    <button class="go">もう一度はいる</button>`, () => { level = 1; stones = 3; setupLevel(); start(); }), 1400);
}
function clearLevel(){
  state = 'clear'; SFX.clear(); charging = false; joy = null; holdBreath = false;
  if (level > best){ best = level; store('kodama_best', best); }
  updateHud();
  const extra = level === 2 ? '<br><span class="danger">次の層から、なにかが「まね」をはじめる。</span>' : '';
  setTimeout(() => showCard(`<h2 class="gold">地下 ${level} 層を抜けた</h2><p>……でも、出口はまだ下へ続いている。<br>奥ほど広く、やつらの数も増える。　石 +1${extra}</p>
    <button class="go">さらに下へ</button>`, () => { level++; stones++; setupLevel(); start(); }), 900);
}

// ===== ループ =====
let last = performance.now();
function loop(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now = t / 1000;
  if (state === 'play') update(dt);
  else if (state !== 'title' && state !== 'note'){ // 終了演出中も音の輪は消えていく
    for (let i = pings.length - 1; i >= 0; i--){ const p = pings[i]; if (now > p.t0 + p.maxR / SPEED + FADE) pings.splice(i, 1); }
  }
  draw();
  requestAnimationFrame(loop);
}
title();
requestAnimationFrame(loop);
})();
</script>
