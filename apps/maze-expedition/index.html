<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>迷宮探索記</title>
<meta name="description" content="毎日形を変える巨大迷路へ広場から出発し、門が閉じる前に宝を持ち帰る3D探索ゲーム">
<meta name="theme-color" content="#1b2630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1b2630;color:#eaf4fb;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:Rajdhani,"Segoe UI",sans-serif;font-style:italic;font-weight:700}
.panel{background:linear-gradient(180deg,rgba(18,30,42,.74),rgba(12,22,32,.62));border:1px solid rgba(160,205,235,.45);box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 0 18px rgba(120,190,240,.08);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);z-index:4}
#danger,#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 45%,rgba(160,10,10,.75) 100%);opacity:0;z-index:4;transition:opacity .2s}
#hurt{background:rgba(200,20,20,.35);transition:opacity .35s}
#obj{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));padding:8px 16px 10px 12px;max-width:min(340px,calc(50vw - 150px));clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
#obj .ttl{font-weight:800;font-size:19px;font-style:italic;letter-spacing:.05em;display:flex;align-items:baseline;gap:10px}
#obj .ttl em{font-style:italic}
#obj .ttl span{font-size:13px;color:#9fd2f2;font-family:Rajdhani,sans-serif;letter-spacing:.1em}
#obj .row{display:flex;align-items:flex-start;gap:8px;font-size:14px;margin-top:4px;line-height:1.45}
.dia{width:13px;height:13px;border:2.5px solid #f2b52a;transform:rotate(45deg);display:inline-block;flex:none;position:relative;margin-top:4px}
.dia::after{content:"";position:absolute;inset:2px;background:#f2b52a}
#timer{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);padding:4px 46px 6px;text-align:center;clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%);background:linear-gradient(180deg,rgba(18,30,42,.78),rgba(12,22,32,.66));border-top:1px solid rgba(160,205,235,.5);border-bottom:1px solid rgba(160,205,235,.5)}
#timer .lab{font-weight:700;font-size:12px;letter-spacing:.12em;line-height:1.2}
#tm{font-size:46px;line-height:.95;letter-spacing:.02em;text-shadow:0 0 14px rgba(140,200,255,.35)}
#tm small{font-size:.82em;color:#c8d6e2;opacity:.75}
#timer.low #tm{color:#ff6b5e;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
#mapw{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:180px;height:180px;padding:6px;border-radius:10px}
#map{width:100%;height:100%;display:block;border-radius:6px}
#mapw .n{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:Rajdhani,sans-serif;font-weight:700;font-size:14px;text-shadow:0 0 4px #000}
#inv{position:absolute;right:max(14px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 188px);width:180px;display:flex;justify-content:space-around;padding:5px 8px;border-radius:8px;font-size:13px}
#inv b{font-family:Rajdhani,sans-serif;font-size:16px;margin-left:3px}
#inv b.full{color:#ff8a70}
#vitals{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;align-items:center;gap:10px}
.vl{font-family:Rajdhani,sans-serif;font-style:italic;font-weight:700;font-size:18px;width:28px;text-shadow:0 0 6px #000}
.bar{width:300px;height:18px;transform:skewX(-20deg);border:1.5px solid rgba(200,225,240,.7);background:rgba(10,18,26,.65);padding:2px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1aa3ff,#5fd0ff);box-shadow:0 0 10px rgba(60,180,255,.7);transition:width .1s}
.bar.ex i{background:linear-gradient(90deg,#ff5040,#ff8a60)}
.bar.hp i{background:linear-gradient(90deg,#e0303a,#ff6b6b);box-shadow:0 0 10px rgba(255,60,60,.6)}
.bar.boss i{background:linear-gradient(90deg,#9a2bd6,#ff4a6a);box-shadow:0 0 10px rgba(200,60,255,.6)}
#boss{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 84px);transform:translateX(-50%);text-align:center}
#boss .bn{font-size:14px;font-weight:800;letter-spacing:.1em;text-shadow:0 0 6px #000;margin-bottom:3px}
#boss .bar{width:min(340px,70vw);height:12px}
#keys{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#keys div{display:flex;align-items:center;gap:10px;padding:4px 16px 4px 12px;font-size:14px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
#keys b{font-family:Rajdhani,"Segoe UI",sans-serif;font-size:13px;font-weight:700;border:1.5px solid rgba(220,235,245,.8);border-radius:5px;padding:0 6px;min-width:48px;text-align:center}
#feed{position:absolute;left:max(14px,env(safe-area-inset-left));top:40%;display:flex;flex-direction:column;gap:4px}
#feed div{padding:4px 12px;font-size:14px;border-radius:6px;background:rgba(10,20,30,.6);border-left:3px solid #f2c94c;animation:feed 3s forwards}
@keyframes feed{0%{opacity:0;transform:translateX(-10px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:60%;transform:translateX(-50%);padding:10px 20px;font-size:16px;white-space:nowrap;border-radius:8px;opacity:0;transition:opacity .3s;max-width:calc(100vw - 24px);white-space:normal;text-align:center}
#toast.show{opacity:1}
#guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 22px;border-radius:12px;font-size:15px;line-height:1.75;width:max-content;max-width:min(460px,calc(100vw - 32px));transition:opacity .6s}
#guide h3{font-size:18px;margin-bottom:6px;color:#ffd36b}
#guide .tap{margin-top:8px;font-size:12px;color:#9fb8c8;text-align:center}
#retBtn{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 120px);transform:translateX(-50%);pointer-events:auto;padding:14px 26px;font-size:17px;font-weight:800;border-radius:12px;border:2px solid #ffd36b;color:#1b1406;background:linear-gradient(180deg,#ffe49a,#f2b52a);box-shadow:0 0 22px rgba(255,200,80,.55);cursor:pointer;white-space:nowrap}
#pauseBtn{position:absolute;pointer-events:auto;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:42px;height:34px;border-radius:8px;color:#eaf4fb;font-weight:800;font-size:14px;letter-spacing:2px;cursor:pointer}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 3px #000}
#touch{position:fixed;inset:0;z-index:3}
#joyBase{position:fixed;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(200,230,250,.5);background:rgba(20,40,60,.25);pointer-events:none;z-index:6}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(200,230,250,.55);box-shadow:0 0 12px rgba(120,200,255,.6)}
#joyBase.dash{border-color:#5fd0ff;box-shadow:0 0 18px rgba(80,200,255,.6)}
#tbtns{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:200px;height:200px;pointer-events:none}
#tbtns button{position:absolute;pointer-events:auto;border-radius:50%;color:#eaf4fb;font-size:13px;font-weight:700;cursor:pointer}
#bAtk{right:0;bottom:0;width:96px;height:96px;font-size:16px!important;border-color:rgba(255,190,120,.8)!important}
#bJump{right:104px;bottom:0;width:70px;height:70px}
#bCrouch{right:6px;bottom:104px;width:66px;height:66px}
#bPot{right:96px;bottom:84px;width:58px;height:58px;font-size:12px!important}
#tbtns button.on{background:rgba(60,160,230,.55);border-color:#8fdcff}
/* screens */
.scr{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(10,18,26,.3),rgba(6,10,16,.8))}
.card{width:min(480px,100%);max-height:calc(100% - 8px);overflow:auto;padding:24px 22px;border-radius:14px;text-align:center;touch-action:pan-y}
.logo{font-size:42px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 22px rgba(140,200,255,.45),0 3px 0 rgba(0,0,0,.4);line-height:1.15}
.sub{font-family:Rajdhani,sans-serif;letter-spacing:.35em;color:#9fd2f2;font-size:15px;margin-top:4px}
.lead{font-size:14px;line-height:1.85;color:#c9dbe7;margin:16px 0 18px}
.btn{display:block;width:100%;padding:14px;margin-top:10px;font-size:18px;font-weight:800;color:#0d1a24;border:none;border-radius:10px;background:linear-gradient(180deg,#9fe0ff,#4fb8f0);box-shadow:0 0 18px rgba(80,190,255,.45);cursor:pointer;letter-spacing:.1em}
.btn.gold{background:linear-gradient(180deg,#ffe49a,#f2b52a);box-shadow:0 0 18px rgba(255,200,80,.4)}
.btn.sec{background:rgba(30,50,68,.8);color:#eaf4fb;border:1px solid rgba(160,205,235,.5);box-shadow:none;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.small{font-size:12px;color:#9fb8c8;margin-top:12px;line-height:1.6}
.res-t{font-size:30px;font-weight:900;letter-spacing:.06em}
.res-t.win{color:#ffd36b;text-shadow:0 0 18px rgba(255,200,80,.5)}
.res-t.lose{color:#ff7a6a;text-shadow:0 0 18px rgba(255,80,60,.45)}
.stats{margin:14px 0 8px;font-size:14px;line-height:1.9;color:#d6e6f0}
.stats b{font-family:Rajdhani,sans-serif;font-size:20px;font-style:italic;color:#fff}
.loot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;border:1px solid rgba(255,255,255,.12)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.lost{opacity:.5;text-decoration:line-through}
/* camp */
.camp{text-align:left;padding:18px 18px 16px}
.camp-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dayt{font-size:28px;font-weight:900;letter-spacing:.05em}
.seed{font-size:12px;color:#9fb8c8}
.coins{font-family:Rajdhani,sans-serif;font-weight:700;font-size:20px;color:#f2c94c;white-space:nowrap}
.goal{margin:12px 0;padding:10px 12px;border-radius:8px;background:rgba(242,181,42,.1);border:1px solid rgba(242,181,42,.4);font-size:14px;line-height:1.6;display:flex;gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid rgba(160,205,235,.4);background:rgba(30,50,68,.6);color:#c9dbe7;font-weight:700;font-size:14px;cursor:pointer}
.tabs button.on{background:rgba(80,170,230,.35);color:#fff;border-color:#8fdcff}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.crow .sl{font-size:11px;color:#9fd2f2;letter-spacing:.1em}
.crow .nm{font-size:15px;font-weight:700}
.crow .nm small{font-weight:400;color:#9fb8c8;margin-left:6px;font-size:12px}
.crow .nx{grid-column:1/2;font-size:13px;color:#d6e6f0}
.cost{font-size:12px;margin-top:2px}
.cost span{margin-right:8px;white-space:nowrap}
.cost .ok{color:#8fe3a0}.cost .ng{color:#ff8a7a}
.crow button{grid-row:1/4;grid-column:2;padding:10px 14px;border-radius:8px;border:none;font-weight:800;background:linear-gradient(180deg,#ffe49a,#f2b52a);color:#1b1406;cursor:pointer}
.crow button:disabled{background:#3a4a58;color:#8aa0b0;cursor:default}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05);font-size:14px}
.mat i{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);flex:none}
.mat b{margin-left:auto;font-family:Rajdhani,sans-serif;font-size:18px}
.help{font-size:13px;line-height:1.75;color:#c9dbe7}
.help b{color:#ffd36b}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .8s}
#ending{background:radial-gradient(ellipse at center,rgba(120,70,200,.35),rgba(4,2,10,.95))}
#ending .res-t{color:#d9b8ff;text-shadow:0 0 24px rgba(190,120,255,.7);font-size:34px}
.story{font-size:14px;line-height:2;color:#e2d6f5;margin:16px 0}
@media (max-width:640px){
  #obj{padding:5px 9px 6px 8px;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));max-width:calc(50vw - 72px)}
  #obj .ttl{font-size:13px}
  #obj .ttl em{display:none}
  #obj .ttl span{font-size:13px;color:#eaf4fb}
  #obj .row{font-size:10px;gap:5px;line-height:1.35}
  .dia{width:9px;height:9px;border-width:2px;margin-top:2px}
  #timer{padding:2px 20px 4px;top:max(8px,env(safe-area-inset-top));clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
  #timer .lab{font-size:9px}
  #tm{font-size:28px}
  #mapw{width:104px;height:104px;padding:4px;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
  #mapw .n{font-size:11px;top:0}
  #inv{width:104px;top:calc(max(8px,env(safe-area-inset-top)) + 110px);right:max(8px,env(safe-area-inset-right));font-size:11px;flex-direction:column;align-items:flex-start;gap:0;padding:3px 8px}
  #inv b{font-size:14px}
  #vitals{left:50%;transform:translateX(-50%);bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 52px);gap:3px}
  .vl{font-size:11px;width:16px}
  .vrow{gap:4px}
  .bar{width:110px;height:9px;padding:1px}
  #boss{top:calc(max(8px,env(safe-area-inset-top)) + 84px)}
  #boss .bn{font-size:11px}
  #boss .bar{width:150px;height:8px}
  #pauseBtn{left:auto;transform:none;right:max(8px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 158px);bottom:auto;width:38px;height:30px}
  #feed{top:34%}
  #feed div{font-size:12px}
  #toast{font-size:13px;top:42%}
  #retBtn{bottom:auto;top:52%;font-size:15px;padding:12px 18px}
  .logo{font-size:34px}
  .dayt{font-size:24px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="danger"></div>
<div id="hurt"></div>
<div id="touch" hidden></div>
<div id="joyBase" hidden><div id="joyKnob"></div></div>

<div id="hud" hidden>
  <div id="obj" class="panel"><div class="ttl"><em>目標</em><span id="dayL">DAY 1</span></div><div class="row"><i class="dia"></i><span id="objT"></span></div></div>
  <div id="timer"><div class="lab">門が閉じるまで</div><div id="tm" class="num">00:00<small>.00</small></div></div>
  <div id="mapw" class="panel"><canvas id="map"></canvas><span class="n">N</span></div>
  <div id="inv" class="panel"><span>かばん<b id="bagT">0/6</b></span><span>回復薬<b id="potT">0</b></span></div>
  <div id="vitals">
    <div class="vrow"><span class="vl">HP</span><div class="bar hp"><i id="hpb"></i></div></div>
    <div class="vrow"><span class="vl">ST</span><div class="bar" id="stbar"><i id="stb"></i></div></div>
  </div>
  <div id="boss" hidden><div class="bn" id="bossN"></div><div class="bar boss"><i id="bossB"></i></div></div>
  <div id="keys">
    <div class="panel"><b>クリック</b>攻撃</div>
    <div class="panel"><b>Shift</b>ダッシュ</div>
    <div class="panel"><b>Space</b>ジャンプ</div>
    <div class="panel"><b>C</b>しゃがむ</div>
    <div class="panel"><b>Q</b>回復薬</div>
  </div>
  <div id="feed"></div>
  <div id="cross"></div>
  <div id="toast" class="panel"></div>
  <div id="guide" class="panel" hidden></div>
  <button id="retBtn" hidden>広場に帰還する</button>
  <button id="pauseBtn" class="panel">II</button>
  <div id="tbtns" hidden>
    <button id="bAtk" class="panel">攻撃</button>
    <button id="bJump" class="panel">ジャンプ</button>
    <button id="bCrouch" class="panel">しゃがむ</button>
    <button id="bPot" class="panel">回復薬</button>
  </div>
</div>

<div id="title" class="scr">
  <div class="card panel">
    <div class="logo">迷宮探索記</div>
    <div class="sub">MAZE EXPEDITION</div>
    <p class="lead">目が覚めると、巨大な石壁に囲まれた広場にいた。<br>朝になると四つの門が開き、夕方には閉じる。<br>迷路は<b style="color:#9fe0ff">毎日形を変える</b>。<br>宝を集め、番人を倒し、<b style="color:#d9b8ff">秘密の部屋</b>を見つけ出せ。</p>
    <button class="btn" id="contBtn" hidden>つづきから</button>
    <button class="btn" id="newBtn">はじめから</button>
    <div class="small" id="titleInfo"></div>
  </div>
</div>

<div id="camp" class="scr" hidden>
  <div class="card panel camp">
    <div class="camp-h">
      <div><div class="dayt">第<span id="cDay">1</span>日・広場</div><div class="seed" id="cSeed"></div></div>
      <div class="coins">硬貨 <span id="cCoin">0</span></div>
    </div>
    <div class="goal"><i class="dia"></i><span id="cGoal"></span></div>
    <div class="tabs"><button data-t="gear" class="on">装備</button><button data-t="stash">倉庫</button><button data-t="shop">店</button><button data-t="help">遊び方</button></div>
    <div id="cBody"></div>
    <button class="btn gold" id="goBtn">門をくぐって迷路へ</button>
    <button class="btn sec" id="campTitle">タイトルへ</button>
  </div>
</div>

<div id="pause" class="scr" hidden>
  <div class="card panel">
    <div class="res-t">一時停止</div>
    <p class="small">やめると、今日拾った物は持ち帰れません。</p>
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn sec" id="giveupBtn">あきらめて広場へ（持ち物は失う）</button>
  </div>
</div>

<div id="result" class="scr" hidden>
  <div class="card panel">
    <div class="res-t" id="resT"></div>
    <div class="stats" id="resS"></div>
    <div class="loot" id="resL"></div>
    <button class="btn" id="resBtn">広場へ</button>
  </div>
</div>

<div id="ending" class="scr" hidden>
  <div class="card panel">
    <div class="res-t">秘密の部屋</div>
    <div class="story" id="endStory"></div>
    <div class="stats" id="endS"></div>
    <button class="btn" id="endCont">広場へ戻って遊びつづける</button>
    <button class="btn sec" id="endTitle">タイトルへ</button>
  </div>
