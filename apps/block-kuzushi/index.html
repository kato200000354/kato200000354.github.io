<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a3a8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ブロックくずし ギャラクシー</title>
<style>
  :root{
    --sky1:#2b5fd0;--sky2:#1a3a8f;--navy:#13245e;--panel:rgba(22,48,128,.72);
    --line:rgba(140,200,255,.85);--glow:0 0 14px rgba(110,190,255,.55);
    --text:#eaf4ff;--sub:#bcd8ff;--gold:#ffd84a;--card:#e9f3ff;--cardtx:#1d3c8c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--text);
    background:
      radial-gradient(ellipse 40% 18% at 8% 96%,rgba(255,255,255,.55),transparent 70%),
      radial-gradient(ellipse 30% 14% at 22% 100%,rgba(255,255,255,.45),transparent 70%),
      radial-gradient(ellipse 35% 16% at 92% 98%,rgba(255,255,255,.5),transparent 70%),
      radial-gradient(ellipse 25% 12% at 78% 104%,rgba(255,255,255,.4),transparent 70%),
      linear-gradient(180deg,#183a9a 0%,#2856c4 55%,#4a86e8 100%);
    background-color:#1a3a8f;
  }
  #app{position:relative;height:100%;display:grid;grid-template-columns:minmax(200px,270px) auto minmax(220px,290px);gap:18px;justify-content:center;align-items:start;padding:14px 16px}
  .panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:var(--glow),inset 0 0 20px rgba(120,180,255,.15);padding:14px 16px;backdrop-filter:blur(4px)}
  .col{display:flex;flex-direction:column;gap:14px;height:calc(100vh - 28px);min-height:0}
  /* left */
  .stage-t{display:flex;align-items:baseline;gap:14px;font-weight:800;letter-spacing:.04em}
  .stage-t .a{font-size:26px}.stage-t .b{font-size:34px}
  .stars{font-size:26px;letter-spacing:2px;margin:2px 0 4px;color:#ffffff55}
  .stars .on{color:var(--gold);text-shadow:0 0 8px rgba(255,216,74,.7)}
  .stage-name{font-size:14px;color:var(--sub)}
  .stat{padding:10px 0;border-bottom:1px solid rgba(140,200,255,.35)}
  .stat:last-child{border-bottom:0}
  .stat .lb{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--sub);font-weight:700}
  .stat .v{text-align:right;font-size:26px;font-weight:800;margin-top:2px}
  .stat .v.gold{color:var(--gold);font-size:32px}
  .stat .tot{text-align:right;font-size:12px;color:var(--sub)}
  .hearts{text-align:center;font-size:30px;letter-spacing:6px;margin-top:4px}
  .ptitle{font-weight:800;font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ibtn{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:linear-gradient(180deg,#2a55bf,#1a3a8f);box-shadow:inset 0 0 10px rgba(140,200,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
  .ibtn:active{transform:scale(.93)}
  .ibtn svg{width:70%;height:70%}
  .ibtn .n{position:absolute;right:4px;bottom:1px;font-size:13px;font-weight:800;text-shadow:0 1px 2px #000}
  .ibtn.empty{opacity:.38;filter:grayscale(.6);cursor:default}
  .ibtn .k{position:absolute;left:5px;top:2px;font-size:10px;color:var(--sub)}
  .help{font-size:12px;color:var(--sub);line-height:1.7}
  /* center */
  #gamewrap{position:relative;height:calc(100vh - 28px);aspect-ratio:3/4;border-radius:22px;border:3px solid #8fd0ff;box-shadow:0 0 22px rgba(120,200,255,.7),inset 0 0 0 3px rgba(40,80,180,.8);overflow:hidden;background:#0f1d5c}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:none}
  /* right */
  .topbtns{display:flex;gap:12px;justify-content:flex-end}
  .rbtn{height:54px;border-radius:30px;border:3px solid #cfe8ff;background:rgba(25,55,140,.6);color:#fff;font-weight:800;font-size:19px;font-family:inherit;cursor:pointer;box-shadow:var(--glow);padding:0 22px}
  .rbtn.round{width:54px;padding:0;font-size:20px}
  .rbtn:active{transform:scale(.95)}
  .pw{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--cardtx);border-radius:12px;padding:9px 10px;margin-top:8px;cursor:pointer;position:relative;overflow:hidden;border:2px solid transparent;transition:transform .1s}
  .pw:active{transform:scale(.97)}
  .pw .ic{width:52px;height:52px;flex:none;border-radius:12px;background:#fff;border:2px solid #b8d4ff;display:flex;align-items:center;justify-content:center}
  .pw .ic svg{width:36px;height:36px}
  .pw .t{font-weight:800;font-size:16px}
  .pw .d{font-size:12px;color:#4a68b0;margin-top:2px}
  .pw .cnt{margin-left:auto;font-weight:800;font-size:15px;color:#2f6fe8;white-space:nowrap}
  .pw .bar{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#ffb02e,#ff5b8f);width:0}
  .pw.active{border-color:#ffb02e}
  .pw.empty{opacity:.6}
  .qm{width:24px;height:24px;border-radius:50%;background:#2f6fe8;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
  .mascot{position:relative;margin-top:auto;height:250px;flex:none}
  .bubble{position:absolute;left:0;top:0;width:78%;background:#f4f9ff;color:#1d3c8c;font-weight:800;font-size:15px;line-height:1.55;padding:14px 16px;border-radius:40px;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:rotate(-6deg);transition:transform .2s}
  .bubble:after{content:"";position:absolute;right:30px;bottom:-14px;border:10px solid transparent;border-top:16px solid #f4f9ff;transform:rotate(-20deg)}
  .bubble.pop{transform:rotate(-6deg) scale(1.08)}
  .mascot svg{position:absolute;right:-6px;bottom:0;width:62%;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
  /* overlay */
  #ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,16,60,.55);backdrop-filter:blur(3px);z-index:5}
  #ov.show{display:flex}
  .box{width:84%;max-width:440px;background:linear-gradient(180deg,#2f63d4,#1a3a8f);border:3px solid #9fd6ff;border-radius:24px;box-shadow:0 0 30px rgba(120,200,255,.6);padding:24px 22px;text-align:center;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.8);opacity:0}}
  .box h1{font-size:32px;line-height:1.25;margin-bottom:6px;text-shadow:0 3px 0 #0d2266,0 0 16px rgba(140,210,255,.8)}
  .box h1 small{display:block;font-size:16px;color:var(--gold);letter-spacing:.3em}
  .box p{font-size:14px;color:var(--sub);line-height:1.7;margin:8px 0}
  .bigstars{font-size:52px;letter-spacing:6px;color:#ffffff40;margin:6px 0}
  .bigstars span{display:inline-block}
  .bigstars .on{color:var(--gold);text-shadow:0 0 14px rgba(255,216,74,.9);animation:star .5s ease-out backwards}
  @keyframes star{from{transform:scale(2.4) rotate(-40deg);opacity:0}}
  .btn{display:block;width:100%;margin-top:12px;padding:14px;border-radius:30px;border:3px solid #fff;background:linear-gradient(180deg,#ffd84a,#ff9f1a);color:#5a2a00;font-family:inherit;font-weight:800;font-size:19px;cursor:pointer;box-shadow:0 4px 0 #b86400}
  .btn.sec{background:linear-gradient(180deg,#e9f3ff,#a9cdff);color:#1d3c8c;box-shadow:0 4px 0 #4a6fbf}
  .btn:active{transform:translateY(3px);box-shadow:none}
  .sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;max-height:46vh;overflow:auto}
  .sgrid button{padding:10px 0;border-radius:12px;border:2px solid #9fd6ff;background:#1a3a8f;color:#fff;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
  .sgrid button i{display:block;font-style:normal;font-size:10px;color:var(--gold)}
  .sgrid button:disabled{opacity:.35;cursor:default}
  .rows{text-align:left;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:15px}
  .rows div{display:flex;justify-content:space-between;padding:3px 0}
  .rows b{color:var(--gold)}
  /* mobile */
  #mbar,#mitems{display:none}
  @media (max-width:900px),(max-aspect-ratio:1/1){
    #app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom))}
    #left,#right{display:none}
    #mbar{display:flex;width:100%;max-width:560px;align-items:center;gap:8px;padding:8px 12px;border-radius:14px}
    #mbar .ms{font-weight:800;font-size:17px;line-height:1.1}
    #mbar .ms small{display:block;font-size:13px;color:#ffffff55;letter-spacing:1px}
    #mbar .ms small .on{color:var(--gold)}
    #mbar .msc{margin-left:auto;text-align:right;font-weight:800;line-height:1.1}
    #mbar .msc .s{font-size:20px;color:var(--gold)}
    #mbar .msc .tg{font-size:11px;color:var(--sub)}
    #mbar .mh{font-size:18px;letter-spacing:1px}
    #mbar .rbtn{height:40px;font-size:15px;padding:0 12px}
    #mbar .rbtn.round{width:40px;padding:0}
    #gamewrap{height:auto;width:min(100%,calc((100dvh - 190px) * .75));max-width:560px}
    #mitems{display:grid;width:100%;max-width:400px;padding:8px 10px;border-radius:14px}
    .ibtn .k{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <!-- 左パネル -->
  <div class="col" id="left">
    <div class="panel">
      <div class="stage-t"><span class="a">STAGE</span><span class="b" data-bind="stage">1-1</span></div>
      <div class="stars" data-bind="stars">★★★</div>
      <div class="stage-name" data-bind="sname">はじまりの空</div>
    </div>
    <div class="panel" style="padding:6px 16px">
      <div class="stat"><div class="lb">⭐ 目標スコア</div><div class="v" data-bind="target">0</div></div>
      <div class="stat"><div class="lb">👑 現在のスコア</div><div class="v gold" data-bind="score">0</div><div class="tot">トータル <span data-bind="total">0</span> ／ ハイスコア <span data-bind="best">0</span></div></div>
      <div class="stat"><div class="lb">💗 残りライフ</div><div class="hearts" data-bind="hearts">♥♥♥</div></div>
    </div>
    <div class="panel">
      <div class="ptitle">アイテム</div>
      <div class="items" data-items></div>
    </div>
    <div class="panel help">
      マウス / タッチ：パドル移動<br>クリック / スペース：発射<br>1〜4キー：アイテム使用<br>P / Esc：ポーズ
    </div>
  </div>

  <!-- スマホ用上部バー -->
  <div class="panel" id="mbar">
    <div class="ms">STAGE <span data-bind="stage">1-1</span><small data-bind="stars">★★★</small></div>
    <div class="mh" data-bind="hearts">♥♥♥</div>
    <div class="msc"><div class="s" data-bind="score">0</div><div class="tg">目標 <span data-bind="target">0</span></div></div>
    <button class="rbtn round" data-act="pause">❚❚</button>
    <button class="rbtn" data-act="menu">メニュー</button>
  </div>

  <!-- ゲーム画面 -->
  <div id="gamewrap">
    <canvas id="cv" width="720" height="960"></canvas>
    <div id="ov"></div>
  </div>

  <div class="panel items" id="mitems" data-items></div>

  <!-- 右パネル -->
  <div class="col" id="right">
    <div class="topbtns">
      <button class="rbtn round" data-act="pause" title="ポーズ (P)">❚❚</button>
      <button class="rbtn" data-act="menu">メニュー</button>
    </div>
    <div class="panel" style="padding:12px">
      <div class="ptitle">パワーアップ <span class="qm" data-act="help">?</span></div>
      <div id="pwlist"></div>
    </div>
    <div class="mascot">
      <div class="bubble" id="bubble">たくさんのブロックを壊して、ハイスコアを目指そう！</div>
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="dome" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".6" stop-color="#bfe4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7fc4ff" stop-opacity=".55"/></radialGradient>
          <linearGradient id="saucer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9cc8f5"/></linearGradient>
        </defs>
        <ellipse cx="100" cy="190" rx="20" ry="6" fill="#ffd84a" opacity=".5"/>
        <path d="M86 168 L100 192 L114 168Z" fill="#ffe680" opacity=".7"/>
        <!-- dog -->
        <g>
          <path d="M66 72 L58 38 L84 58Z" fill="#9aa6bd"/><path d="M134 72 L142 38 L116 58Z" fill="#9aa6bd"/>
          <path d="M68 66 L63 46 L80 59Z" fill="#f2c4cf"/><path d="M132 66 L137 46 L120 59Z" fill="#f2c4cf"/>
          <ellipse cx="100" cy="92" rx="38" ry="34" fill="#fff"/>
          <path d="M64 86 Q72 60 100 60 Q86 74 84 96 Z" fill="#a9b4c8"/>
          <path d="M136 86 Q128 60 100 60 Q114 74 116 96 Z" fill="#a9b4c8"/>
          <circle cx="86" cy="90" r="5.5" fill="#1d2a4a"/><circle cx="114" cy="90" r="5.5" fill="#1d2a4a"/>
          <circle cx="88" cy="88" r="1.8" fill="#fff"/><circle cx="116" cy="88" r="1.8" fill="#fff"/>
          <ellipse cx="100" cy="102" rx="6" ry="4.5" fill="#1d2a4a"/>
          <path d="M92 108 Q100 116 108 108" stroke="#1d2a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M96 112 Q100 122 104 112Z" fill="#ff7a9a"/>
          <ellipse cx="76" cy="104" rx="6" ry="3.5" fill="#ffb3c6" opacity=".7"/><ellipse cx="124" cy="104" rx="6" ry="3.5" fill="#ffb3c6" opacity=".7"/>
          <ellipse cx="70" cy="122" rx="10" ry="8" fill="#fff" stroke="#c9d3e3" stroke-width="2"/>
          <ellipse cx="130" cy="118" rx="10" ry="8" fill="#fff" stroke="#c9d3e3" stroke-width="2"/>
        </g>
        <circle cx="100" cy="94" r="54" fill="url(#dome)" stroke="#e6f4ff" stroke-width="3"/>
        <path d="M70 66 Q80 52 98 48" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
        <ellipse cx="100" cy="146" rx="86" ry="24" fill="url(#saucer)" stroke="#5a8fd8" stroke-width="3"/>
        <ellipse cx="100" cy="138" rx="56" ry="10" fill="#d8ecff"/>
        <circle cx="40" cy="150" r="6" fill="#ffd84a"/><circle cx="70" cy="160" r="6" fill="#4cc3ff"/><circle cx="100" cy="164" r="6" fill="#ffd84a"/><circle cx="130" cy="160" r="6" fill="#4cc3ff"/><circle cx="160" cy="150" r="6" fill="#ffd84a"/>
      </svg>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
// ====== 基本設定 ======
const W = 720, H = 960;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const COLS = 10, BX = 8, BY = 62, GAP = 4;
const BW = (W - BX * 2 - GAP * (COLS - 1)) / COLS;
const BH = 38;
const BALL_R = 11;
const PADDLE_Y = H - 110, PADDLE_H = 24, PADDLE_W = 150;
const MAX_LIVES = 3;

const COLORS = {
  r: ['#ff6b9c', '#e8336d'], o: ['#ffb04a', '#f27a12'], y: ['#ffe866', '#f2c218'],
  g: ['#5ef07a', '#1fb648'], b: ['#66b2ff', '#2a76ec'], p: ['#cf82ff', '#9443ea'],
  c: ['#a6e3ff', '#4db4f7'], S: ['#a6e3ff', '#4db4f7'], M: ['#a8b1c6', '#5d6680']
};
const PAL = 'roygbpc';

// ====== ステージ ======
const STAGES = [
  { name: 'はじまりの空', map: [
    'rrrrrrrrrr', 'oooooooooo', 'yyySyySyyy', 'gggggggggg', 'bbbbbbbbbb'] },
  { name: '虹のピラミッド', map: [
    '....rr....', '...oooo...', '..yySSyy..', '.gggggggg.', 'bbbbbbbbbb', 'pppppppppp'] },
  { name: 'カラフルな空', map: [
    'rrrrrrrrrr', 'oooo..oooo', 'yyy....yyy', 'gggg..gggg', 'bbb.ggbbbb',
    'MS...b.MSM', 'pM..pbbpMp', '.c..MppMc.'] },
  { name: '鉄のとりで', map: [
    'MMMMMMMMMM', 'M.rrrrrr.M', 'M.oSooSo.M', 'M.yyyyyy.M', 'M.gggggg.M', 'MMMM..MMMM', 'cccc..cccc'] },
  { name: 'ハートの星雲', map: [
    '.rr....rr.', 'rrrr..rrrr', 'rrSrrrrSrr', 'pppppppppp', '.pppppppp.', '..bbbbbb..', '...cMMc...', '....cc....'] },
];
const WORLD_NAMES = ['オーロラ', '流れ星', '月うさぎ', 'ほうき星', '天の川', 'ふたご座', '土星リング', '銀河のはて'];

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function getStage(i) {
  if (i < STAGES.length) return STAGES[i];
  const rnd = mulberry32(i * 9973 + 17);
  const rows = Math.min(10, 6 + Math.floor((i - 5) / 4));
  const metal = Math.min(0.22, 0.06 + (i - 5) * 0.01);
  const shift = Math.floor(rnd() * 7);
  const map = [];
  for (let r = 0; r < rows; r++) {
    let half = '';
    const rowCol = PAL[(r + shift) % 7];
    for (let c = 0; c < 5; c++) {
      const v = rnd();
      half += v < 0.16 ? '.' : v < 0.16 + metal ? 'M' : v < 0.22 + metal ? 'S' : (rnd() < 0.25 ? PAL[(r + shift + 1) % 7] : rowCol);
    }
    map.push(half + half.split('').reverse().join(''));
  }
  return { name: WORLD_NAMES[(i - 5) % WORLD_NAMES.length] + 'の空', map };
}
const stageLabel = i => `${Math.floor(i / 5) + 1}-${i % 5 + 1}`;

// ====== アイテム ======
const ITEMS = [
  { id: 'multi', name: 'マルチボール', desc: 'ボールが3つに増える' },
  { id: 'expand', name: 'パドル拡張', desc: 'パドルが大きくなる' },
  { id: 'magnet', name: 'マグネット', desc: 'ボールを引き寄せる' },
  { id: 'time', name: 'タイムストップ', desc: '時間を少し止める' },
];
const DUR = { expand: 15, magnet: 12, time: 6 };
function pieSvg() {
  const cols = ['#ff5b8f', '#ffa53a', '#ffe14d', '#4fe36a', '#4cb3f5', '#a46bff'];
  let s = '';
  for (let k = 0; k < 6; k++) {
    const a0 = k / 6 * Math.PI * 2 - Math.PI / 2, a1 = (k + 1) / 6 * Math.PI * 2 - Math.PI / 2;
    s += `<path d="M24 24 L${24 + 18 * Math.cos(a0)} ${24 + 18 * Math.sin(a0)} A18 18 0 0 1 ${24 + 18 * Math.cos(a1)} ${24 + 18 * Math.sin(a1)}Z" fill="${cols[k]}"/>`;
  }
  return s;
}
const ICONS = {
  multi: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#fff" stroke="#c9dcf5" stroke-width="2"/>${pieSvg()}<circle cx="24" cy="24" r="7" fill="#fff"/><ellipse cx="17" cy="15" rx="5" ry="3" fill="#fff" opacity=".7"/></svg>`,
  expand: `<svg viewBox="0 0 48 48"><rect x="8" y="18" width="32" height="12" rx="6" fill="#2f8cf0" stroke="#fff" stroke-width="2.5"/><rect x="12" y="20" width="20" height="3" rx="1.5" fill="#bfe4ff"/><path d="M6 24 L1 24 M1 24 L4 21 M1 24 L4 27 M42 24 L47 24 M47 24 L44 21 M47 24 L44 27" stroke="#2f4fae" stroke-width="2.5" stroke-linecap="round"/><path d="M19 12 L24 7 L29 12 M19 36 L24 41 L29 36" stroke="#2f4fae" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  magnet: `<svg viewBox="0 0 48 48"><g transform="rotate(30 24 24)"><path d="M10 8 V24 A14 14 0 0 0 38 24 V8 H29 V24 A5 5 0 0 1 19 24 V8Z" fill="#e8334a" stroke="#fff" stroke-width="2"/><rect x="10" y="6" width="9" height="8" fill="#2f6fe8" stroke="#fff" stroke-width="2"/><rect x="29" y="6" width="9" height="8" fill="#2f6fe8" stroke="#fff" stroke-width="2"/><path d="M13 22 V26" stroke="#ff9aa8" stroke-width="2.5" stroke-linecap="round"/></g></svg>`,
  time: `<svg viewBox="0 0 48 48"><rect x="20" y="3" width="8" height="6" rx="2" fill="#e8582f"/><circle cx="24" cy="27" r="18" fill="#ff9f2e" stroke="#fff" stroke-width="2"/><circle cx="24" cy="27" r="13" fill="#fff"/><path d="M24 27 V18 M24 27 L30 31" stroke="#333" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="27" r="2" fill="#e8582f"/></svg>`,
};
const iconImg = {};

  for (const k of bricks) {
    if (k.dead) continue;
    const sp = brickSprite(k.type, k.hp);
    if (k.hit > 0) { ctx.save(); ctx.translate(k.x + k.w / 2, k.y + k.h / 2); ctx.scale(1.06, 1.06); ctx.drawImage(sp, -k.w / 2 - SP, -k.h / 2 - SP); ctx.restore(); }
    else ctx.drawImage(sp, k.x - SP, k.y - SP);
  }

  // 下のライン
  ctx.strokeStyle = 'rgba(140,200,255,.45)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(6, H - 26); ctx.lineTo(W - 6, H - 26); ctx.stroke();

  // カプセル
  for (const c of caps) {
    ctx.save(); ctx.translate(c.x, c.y);
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#7fc4ff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.rotate(Math.sin(c.r) * 0.25);
    if (iconImg[c.id].complete) ctx.drawImage(iconImg[c.id], -16, -16, 32, 32);
    ctx.restore();
  }

  // パドル
  const pw = paddle.w, px = paddle.x - pw / 2;
  ctx.save();
  ctx.shadowColor = fx.magnet > 0 ? '#ff6b8a' : '#4cc3ff'; ctx.shadowBlur = 20;
  rr(ctx, px - 4, PADDLE_Y - 4, pw + 8, PADDLE_H + 8, (PADDLE_H + 8) / 2); ctx.fillStyle = '#f4faff'; ctx.fill();
  ctx.shadowBlur = 0;
  const pg = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
  pg.addColorStop(0, '#5fd0ff'); pg.addColorStop(1, '#1c7fe8');
  rr(ctx, px, PADDLE_Y, pw, PADDLE_H, PADDLE_H / 2); ctx.fillStyle = pg; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(ctx, px + 12, PADDLE_Y + 3, pw - 24, 6, 3); ctx.fill();
  if (fx.magnet > 0) {
    ctx.fillStyle = '#ff4d6d'; rr(ctx, px + 3, PADDLE_Y + 3, 14, PADDLE_H - 6, 6); ctx.fill();
    ctx.fillStyle = '#2f6fe8'; rr(ctx, px + pw - 17, PADDLE_Y + 3, 14, PADDLE_H - 6, 6); ctx.fill();
  }
  ctx.restore();

  // 狙いガイド
  const aiming = state === 'play' && balls.some(b => b.stuck && !b.auto);
  if (aiming) {
    const b = balls.find(b => b.stuck && !b.auto);
    const a = Math.sin(aimT * 1.7) * 0.85;
    let x = b.x, y = b.y, dx = Math.sin(a), dy = -Math.cos(a);
    for (let i = 1; i <= 11; i++) {
      for (let s = 0; s < 30; s++) { x += dx; y += dy; if (x < BALL_R || x > W - BALL_R) dx = -dx; }
      ctx.globalAlpha = 1 - i / 13; ctx.fillStyle = '#dff3ff';
      ctx.beginPath(); ctx.arc(x, y, 5 - i * 0.25, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ボール
  for (const b of balls) {
    for (let i = 0; i < b.trail.length; i += 4) {
      const t = i / b.trail.length;
      ctx.globalAlpha = t * 0.6; ctx.fillStyle = '#bfe8ff';
      ctx.beginPath(); ctx.arc(b.trail[i], b.trail[i + 1], BALL_R * (0.3 + t * 0.4), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.shadowColor = fx.time > 0 ? '#ffb02e' : '#8fd8ff'; ctx.shadowBlur = 22;
    const g = ctx.createRadialGradient(b.x - 4, b.y - 4, 1, b.x, b.y, BALL_R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#d8f1ff'); g.addColorStop(1, fx.time > 0 ? '#ffc76b' : '#7cc8ff');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 7); ctx.fill();
    ctx.restore();
  }

  // パーティクル
  for (const p of parts) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 22px "Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif'; ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,20,70,.8)';
    ctx.strokeText(p.t, p.x, p.y); ctx.fillStyle = p.col; ctx.fillText(p.t, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (combo >= 3 && state === 'play') {
    ctx.font = 'bold 30px "Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = '#13245e'; ctx.fillStyle = '#ffe866';
    ctx.strokeText(combo + ' COMBO!', W / 2, H - 48); ctx.fillText(combo + ' COMBO!', W / 2, H - 48);
  }
  if (aiming) {
    ctx.font = 'bold 22px "Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif';
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 4); ctx.fillStyle = '#fff';
    ctx.fillText('タップ / クリックで発射！', W / 2, PADDLE_Y + 70); ctx.globalAlpha = 1;
  }
  // タイムストップの演出
  if (fx.time > 0) { ctx.fillStyle = `rgba(255,190,90,${0.06 + flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

// ====== HUD ======
const $$ = s => document.querySelectorAll(s);
function bind(k, v, html) { $$(`[data-bind="${k}"]`).forEach(e => html ? e.innerHTML = v : e.textContent = v); }
const fmt = n => n.toLocaleString('ja-JP');
function starsHtml(n) { return [0, 1, 2].map(i => `<span class="${i < n ? 'on' : ''}">★</span>`).join(''); }
function updateHUD() {
  bind('stage', stageLabel(stageIdx));
  bind('sname', getStage(stageIdx).name + 'のステージ');
  bind('target', fmt(target)); bind('score', fmt(stageScore)); bind('total', fmt(score)); bind('best', fmt(save.best));
  bind('stars', starsHtml(calcStars()), true);
  bind('hearts', Array.from({ length: MAX_LIVES }, (_, i) => i < lives ? '<span style="color:#ff6fa8;text-shadow:0 0 8px #ff6fa8">♥</span>' : '<span style="color:#ffffff88">♡</span>').join(''), true);
}
function renderItems() {
  $$('[data-items]').forEach(box => {
    box.innerHTML = ITEMS.map((it, i) => `<div class="ibtn ${inv[it.id] ? '' : 'empty'}" data-use="${it.id}" title="${it.name}：${it.desc}"><span class="k">${i + 1}</span>${ICONS[it.id]}<span class="n">x${inv[it.id]}</span></div>`).join('');
  });
  document.getElementById('pwlist').innerHTML = ITEMS.map(it => `<div class="pw ${inv[it.id] ? '' : 'empty'}" data-use="${it.id}" data-pw="${it.id}"><div class="ic">${ICONS[it.id]}</div><div><div class="t">${it.name}</div><div class="d">${it.desc}</div></div><div class="cnt">x${inv[it.id]} ›</div><div class="bar"></div></div>`).join('');
}
function updateFxBars() {
  for (const k in DUR) {
    const el = document.querySelector(`[data-pw="${k}"]`); if (!el) continue;
    const r = fx[k] / DUR[k];
    el.querySelector('.bar').style.width = (r * 100) + '%';
    el.classList.toggle('active', r > 0);
  }
}

// ====== オーバーレイ ======
const ov = document.getElementById('ov');
function showOv(html) { ov.innerHTML = `<div class="box">${html}</div>`; ov.classList.add('show'); }
function hideOv() { ov.classList.remove('show'); }
function showTitle() {
  state = 'title';
  const cont = save.unlocked > 0;
  showOv(`<h1><small>BLOCK BREAKER</small>ブロックくずし<br>ギャラクシー</h1>
    <p>ブロックを全部こわしてステージクリア！<br>★ブロックからアイテムが出るよ</p>
    ${cont ? `<button class="btn" data-act="continue">つづきから（${stageLabel(save.unlocked)}）</button>` : ''}
    <button class="btn ${cont ? 'sec' : ''}" data-act="start">はじめから</button>
    <button class="btn sec" data-act="select">ステージ選択</button>
    <p>ハイスコア：${fmt(save.best)}</p>`);
}
function showSelect(back) {
  const n = Math.max(10, Math.ceil((save.unlocked + 1) / 5) * 5);
  let g = '';
  for (let i = 0; i < n; i++) g += `<button data-stage="${i}" ${i > save.unlocked ? 'disabled' : ''}>${stageLabel(i)}<i>${'★'.repeat(save.stars[i] || 0) || '&nbsp;'}</i></button>`;
  showOv(`<h1 style="font-size:26px">ステージ選択</h1><div class="sgrid">${g}</div><button class="btn sec" data-act="${back}">もどる</button>`);
}
function togglePause() {
  if (state === 'play') { state = 'paused'; showOv(`<h1>ポーズ</h1><p>ひと休み中…</p><button class="btn" data-act="resume">つづける</button>`); }
  else if (state === 'paused') { state = 'play'; hideOv(); }
}
function showMenu() {
  if (state === 'title') return;
  if (state === 'play') state = 'menu';
  if (state !== 'menu' && state !== 'paused') return;
  state = 'menu';
  showOv(`<h1>メニュー</h1>
    <button class="btn" data-act="resume">ゲームにもどる</button>
    <button class="btn sec" data-act="retry">ステージをやり直す</button>
    <button class="btn sec" data-act="select-menu">ステージ選択</button>
    <button class="btn sec" data-act="sound">サウンド：${save.sound ? 'ON' : 'OFF'}</button>
    <button class="btn sec" data-act="title">タイトルへ</button>`);
}
function showClear(bonus, stars) {
  showOv(`<h1><small>STAGE ${stageLabel(stageIdx)}</small>ステージクリア！</h1>
    <div class="bigstars">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}" style="animation-delay:${i * 0.25}s">★</span>`).join('')}</div>
    <div class="rows"><div><span>ステージスコア</span><b>${fmt(stageScore)}</b></div><div><span>クリアボーナス</span><b>+${fmt(bonus)}</b></div><div><span>目標スコア</span><span>${fmt(target)}</span></div><div><span>トータル</span><b>${fmt(score)}</b></div></div>
    <button class="btn" data-act="next">つぎのステージへ</button>
    <button class="btn sec" data-act="title">タイトルへ</button>`);
}
function showOver() {
  showOv(`<h1><small>GAME OVER</small>ゲームオーバー</h1>
    <div class="rows"><div><span>到達ステージ</span><b>${stageLabel(stageIdx)}</b></div><div><span>トータルスコア</span><b>${fmt(score)}</b></div><div><span>ハイスコア</span><b>${fmt(save.best)}</b></div></div>
    <button class="btn" data-act="retry-over">このステージからリトライ</button>
    <button class="btn sec" data-act="title">タイトルへ</button>`);
}
let stageStartScore = 0;
const _load = loadStage;
loadStage = function (i) { _load(i); stageStartScore = score; };

document.addEventListener('click', e => {
  audio();
  const use = e.target.closest('[data-use]'); if (use) { useItem(use.dataset.use); return; }
  const st = e.target.closest('[data-stage]'); if (st) { newGame(+st.dataset.stage); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'start': newGame(0); break;
    case 'continue': newGame(save.unlocked); break;
    case 'select': showSelect('back-title'); break;
    case 'select-menu': showSelect('back-menu'); break;
    case 'back-title': showTitle(); break;
    case 'back-menu': state = 'menu'; showMenu(); break;
    case 'pause': if (state === 'play' || state === 'paused') togglePause(); break;
    case 'menu': if (state === 'menu') { state = 'play'; hideOv(); } else showMenu(); break;
    case 'resume': state = 'play'; hideOv(); break;
    case 'retry': score = stageStartScore; loadStage(stageIdx); state = 'play'; hideOv(); break;
    case 'retry-over': score = stageStartScore; lives = MAX_LIVES; loadStage(stageIdx); state = 'play'; hideOv(); say('もう一回！今度こそいけるよ！'); break;
    case 'next': loadStage(stageIdx + 1); state = 'play'; hideOv(); say(`ステージ${stageLabel(stageIdx)}スタート！`); break;
    case 'sound': save.sound = !save.sound; writeSave(); showMenu(); break;
    case 'title': writeSave(); loadStage(stageIdx); showTitle(); break;
    case 'help': say('★ブロックを壊すとアイテムが落ちてくるよ。パドルで拾って、タップで使おう！'); break;
  }
});

// ====== ループ ======
let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
loadStage(Math.min(2, save.unlocked));
renderItems();
showTitle();
requestAnimationFrame(loop);
})();
</script>
<script src="../../playtime.js" defer></script>
</body>
</html>
