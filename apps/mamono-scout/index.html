<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e2550">
<title>まものスカウターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--edge:#9fd0ff;--p1:rgba(30,66,124,.97);--p2:rgba(10,30,68,.97);--sub:#a8c9f0;--gold:#ffd54a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#07142b;color:#fff;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Meiryo',sans-serif;touch-action:none;overscroll-behavior:none}
.hidden,[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;font-size:inherit}
img{-webkit-user-drag:none;pointer-events:none}
#field{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{background:linear-gradient(180deg,var(--p1),var(--p2));border:2px solid var(--edge);border-radius:12px;box-shadow:0 0 0 2px #061430,inset 0 0 14px rgba(110,180,255,.22),0 8px 18px rgba(0,0,0,.45)}
.chip{display:inline-block;background:linear-gradient(180deg,#24497f,#0f2a55);border:2px solid var(--edge);border-radius:6px 20px 20px 6px;padding:4px 22px 4px 14px;font-weight:800;font-size:18px;letter-spacing:.06em;text-shadow:0 2px 0 #061430;box-shadow:0 0 0 2px #061430}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;border:2px solid #5d93d6;background:linear-gradient(180deg,#244d8a,#123266);font-weight:800;font-size:16px;position:relative;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);transition:transform .08s}
.mbtn:active{transform:scale(.97)}
.mbtn.on,.mbtn:focus-visible{background:linear-gradient(180deg,#5ab8ff,#1d6fd8);border-color:#fff;box-shadow:0 0 12px rgba(90,180,255,.8);outline:none}
@media (hover:hover){.mbtn:not(:disabled):hover{background:linear-gradient(180deg,#5ab8ff,#1d6fd8);border-color:#fff;box-shadow:0 0 12px rgba(90,180,255,.8)}
.mbtn:not(:disabled):hover::before{content:'';position:absolute;left:-15px;top:50%;margin-top:-9px;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:12px solid #ffd23f;filter:drop-shadow(0 0 2px #000)}}
.mbtn:disabled{opacity:.42;cursor:default}
.mbtn .ico{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center}
.mbtn .ico svg{width:100%;height:100%}
.mbtn .r{margin-left:auto;font-size:13px;color:var(--sub);font-weight:700}
.mbtn.on .r{color:#fff}
.bar{height:7px;border-radius:4px;background:#0a1830;border:1px solid #2c5a94;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(#7dffaa,#2fc865);border-radius:3px;transition:width .4s}
.bar.mp>i{background:linear-gradient(#8fdcff,#1f97ea)}
.bar.low>i{background:linear-gradient(#ffe27a,#f0a020)}
.bar.crit>i{background:linear-gradient(#ff9a9a,#e53935)}
.bar.exp>i{background:linear-gradient(#ffe98a,#f2b51e)}
.rank{display:inline-flex;min-width:24px;height:24px;border-radius:6px;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:1.5px solid #fff;text-shadow:0 1px 0 rgba(0,0,0,.5);padding:0 4px}
.rk0{background:#7d8796}.rk1{background:#4caf50}.rk2{background:#1fa9a0}.rk3{background:#2f7fe0}.rk4{background:#8e55e0}.rk5{background:#f07a1a}.rk6{background:linear-gradient(#ffe066,#e0a400);color:#4a3000}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f2b51e 60%,#b07a0a);border:1px solid #7a5200;vertical-align:-4px;margin-right:6px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#mini{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));width:118px;height:118px;border-radius:50%;border:3px solid #dbeeff;box-shadow:0 0 0 3px #13325f,0 4px 12px rgba(0,0,0,.5);overflow:hidden;background:#1b3a2a}
#miniC{width:100%;height:100%;display:block}
#mini .n{position:absolute;top:1px;left:50%;transform:translateX(-50%);font-weight:800;font-size:13px;text-shadow:0 0 3px #000,0 0 3px #000}
#area{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));padding:6px 18px 6px 22px;border-radius:20px 6px 6px 20px;background:linear-gradient(90deg,rgba(14,37,80,.94),rgba(30,66,124,.94));border:2px solid var(--edge);font-weight:800;font-size:15px;box-shadow:0 0 0 2px #061430}
#ptop{position:absolute;right:10px;top:calc(52px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:4px}
.pt{display:flex;align-items:center;gap:6px;background:rgba(10,30,68,.86);border:1.5px solid #6fa7e6;border-radius:10px;padding:2px 8px 2px 2px;width:132px}
.pt img{width:30px;height:30px;flex:none}
.pt .bars{flex:1;display:flex;flex-direction:column;gap:2px}
.pt .bar{height:5px}
.pt.dead img{filter:grayscale(1) brightness(.6)}
#hint{position:absolute;left:10px;bottom:10px;padding:8px 16px;font-size:14px;line-height:1.8;font-weight:700}
.key{display:inline-flex;min-width:21px;height:21px;border-radius:50%;border:1.5px solid #fff;align-items:center;justify-content:center;font-size:11px;margin-right:8px;padding:0 3px}
#joy{position:absolute;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(10,30,68,.35);border:2px solid rgba(160,205,255,.55);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd0ff,#2b6fc8);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#abtns{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:170px;height:156px}
#abtns button{position:absolute;border-radius:50%;font-weight:800;color:#fff;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4);text-shadow:0 1px 2px rgba(0,0,0,.5);touch-action:none}
#btnA{right:0;top:24px;width:78px;height:78px;font-size:16px;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d42c3c)}
#btnB{right:88px;top:84px;width:64px;height:64px;font-size:14px;background:radial-gradient(circle at 35% 30%,#8fd0ff,#2563c8)}
#btnL{right:96px;top:4px;width:58px;height:58px;font-size:11px;line-height:1.15;background:radial-gradient(circle at 35% 30%,#ffe27a,#d99a14)}
#btnL.on{box-shadow:0 0 16px 4px #ffd23f}
#btnA b,#btnB b{display:block;font-size:24px;line-height:1}
#hud.touch #hint{display:none}
#hud:not(.touch) #joy,#hud:not(.touch) #abtns{display:none}
#banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:6;pointer-events:none;font-weight:800;font-size:26px;padding:10px 40px;background:linear-gradient(90deg,transparent,rgba(10,30,68,.85) 20%,rgba(10,30,68,.85) 80%,transparent);text-shadow:0 2px 0 #000;opacity:0;transition:opacity .5s;white-space:nowrap}
#banner.show{opacity:1}
/* ---------- battle ---------- */
#battle{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#07142b}
#bscene{position:relative;flex:1;overflow:hidden;min-height:0}
#bbg{position:absolute;inset:0}
#bbg svg{width:100%;height:100%;display:block}
#eTags{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;z-index:3}
.etag{padding:4px 10px 6px;min-width:120px;max-width:200px;flex:1;border-radius:10px}
.etag .nm{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:13px;white-space:nowrap}
.etag .nm small{font-size:11px;color:var(--sub)}
.etag.dead{opacity:.35}
.etag .bar{margin-top:3px}
#eRow{position:absolute;left:0;right:0;top:20%;height:44%;display:flex;justify-content:center;align-items:flex-end;gap:3%;z-index:2}
.emon{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.emon img{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.emon.pick img{animation:pickGlow .8s infinite}
@keyframes pickGlow{50%{filter:drop-shadow(0 0 10px #ffd23f) brightness(1.15)}}
.emon .cur{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid #ffd23f;filter:drop-shadow(0 0 2px #000);animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translate(-50%,6px)}}
#pRow{position:absolute;left:2%;right:2%;bottom:3%;height:28%;display:flex;gap:2%;align-items:flex-end;justify-content:center;z-index:2}
.pmon{position:relative;height:100%;flex:1;max-width:30%;display:flex;align-items:flex-end;justify-content:center}
.pmon img{height:100%;width:100%;object-fit:contain;object-position:50% 100%;transform:scaleX(-1);filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.pmon.dead img{filter:grayscale(1) brightness(.55);transform:scaleX(-1) rotate(80deg) translateX(-20%);transform-origin:50% 90%;opacity:.7}
.ghost img{opacity:0;transition:opacity .5s}
#bfx{position:absolute;inset:0;pointer-events:none;z-index:4}
.sfl{position:absolute;inset:0;animation:sfl .45s forwards}
@keyframes sfl{0%{opacity:0}30%{opacity:.75}100%{opacity:0}}
.slash{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;z-index:5;animation:slash .32s forwards}
@keyframes slash{0%{opacity:0;transform:scale(.4) rotate(-20deg)}40%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(10deg)}}
.dmg{position:absolute;left:50%;top:35%;font-weight:800;font-size:30px;color:#fff;-webkit-text-stroke:1.5px #9a1212;text-shadow:0 3px 0 #5a0808;animation:dmgUp 1s forwards;pointer-events:none;z-index:6;white-space:nowrap}
.dmg.heal{color:#b6ffcf;-webkit-text-stroke:1.5px #0d7a3a;text-shadow:0 3px 0 #064a22}
.dmg.miss{font-size:22px;color:#dfe8ff;-webkit-text-stroke:1px #233}
.dmg.crit{font-size:40px;color:#ffe066}
@keyframes dmgUp{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{transform:translate(-50%,-16px) scale(1.25);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-44px) scale(1);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-9px 0}40%{translate:9px 0}60%{translate:-5px 0}80%{translate:5px 0}}
.hop{animation:hop .35s}
@keyframes hop{50%{translate:0 -16px;scale:1.07}}
.flash img{animation:flash .35s}
@keyframes flash{30%,70%{filter:brightness(3) saturate(0)}}
.die{animation:die .7s forwards}
@keyframes die{to{opacity:0;translate:0 24px;scale:.75;filter:brightness(2.5)}}
.zzz{position:absolute;top:8%;right:8%;font-weight:800;color:#bfe0ff;font-size:18px;text-shadow:0 0 4px #000;animation:bob2 1.2s infinite alternate}
@keyframes bob2{to{translate:0 -6px}}
.psn{position:absolute;top:8%;left:8%;font-size:16px}
#bbot{background:linear-gradient(#0e2550,#07142b);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:2px solid #2f68b3}
#bbotIn{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#pCards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pcard{display:flex;gap:6px;align-items:center;padding:4px 8px 5px 4px;border-radius:10px;min-width:0;transition:box-shadow .2s}
.pcard .pi{flex:none;display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:800;color:var(--sub)}.pcard img{width:38px;height:38px}@media (max-width:480px){.pcard img{width:30px;height:30px}.pcard{padding:4px 6px 5px 3px;gap:4px}}
.pcard .in{flex:1;min-width:0}
.pcard .nm{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .nm small{color:var(--sub);margin-left:4px}
.pcard .num{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--sub);margin-top:1px}
.pcard .num b{color:#fff}
.pcard .bar{height:6px;margin-top:1px}
.pcard.act{border-color:#ffd23f;box-shadow:0 0 0 2px #061430,0 0 14px #ffd23f}
.pcard.dead{filter:grayscale(1) brightness(.6)}
.pcard.hurt{animation:shake .35s}
#bArea{display:grid;grid-template-columns:1fr;position:relative;min-height:180px}
#bMsg{padding:14px 18px;font-size:16.5px;line-height:1.65;white-space:pre-wrap;min-height:180px;font-weight:700}
#bCmd{background:linear-gradient(180deg,#1e427c,#0a1e44);position:absolute;inset:0;padding:10px 12px 10px 24px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;overflow:auto;touch-action:pan-y}
#bCmd.list{grid-template-columns:1fr 1fr}
#bCmd .mbtn{padding:9px 12px;font-size:15.5px}
#bCmd .hd{grid-column:1/-1;font-size:13px;color:var(--sub);font-weight:800;display:flex;align-items:center;gap:8px}
#bCmd .hd img{width:26px;height:26px}
@media (min-width:760px){#bArea{grid-template-columns:1fr 380px;gap:8px}#bCmd{position:relative;inset:auto}}
#scoutBox{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);z-index:7;padding:14px 22px;text-align:center;min-width:240px}
#scoutBox .t{font-weight:800;font-size:15px;color:var(--sub)}
#scoutBox .v{font-weight:800;font-size:44px;color:#ffe066;text-shadow:0 3px 0 #7a4a00}
#scoutBox .bar{height:12px;margin-top:6px}
#scoutBox .bar>i{background:linear-gradient(#ffe98a,#f2b51e);transition:width .9s}
/* ---------- talk ---------- */
#talk{position:fixed;inset:0;z-index:55}
#tBox{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(760px,calc(100% - 20px));padding:22px 24px 20px;font-size:17px;line-height:1.8;min-height:124px;font-weight:700;white-space:pre-wrap}
#tName{position:absolute;left:16px;top:-20px;font-size:15px;padding:3px 18px 3px 12px}
#tNext{position:absolute;right:18px;bottom:8px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #ffd23f;animation:bob .5s infinite alternate}
#tChoices{position:absolute;right:max(10px,calc(50% - 380px));bottom:calc(158px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px 26px;min-width:230px}
/* ---------- screens ---------- */
#layer{position:fixed;inset:0;z-index:30;pointer-events:none}
.scr{position:absolute;inset:0;pointer-events:auto;background:rgba(5,14,32,.86);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));animation:scrIn .18s}
@keyframes scrIn{from{opacity:0;transform:scale(.98)}}
.scrHead{display:flex;align-items:center;gap:10px;margin:0 auto 10px;width:100%;max-width:1000px}
.scrHead .x{margin-left:auto;width:46px;height:46px;border-radius:50%;border:2px solid var(--edge);background:linear-gradient(#244d8a,#123266);font-size:22px;font-weight:800;flex:none}
.scrBody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;max-width:1000px;width:100%;margin:0 auto;padding:2px 4px 10px}
.menuGrid{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:14px}
@media (max-width:620px){.menuGrid{grid-template-columns:1fr}.mlist{display:grid;grid-template-columns:1fr 1fr;padding:12px}.mlist .mbtn{padding:10px}}
.mlist{display:flex;flex-direction:column;gap:8px;padding:14px 14px 14px 26px}
.psec{padding:12px}
.psec h3,.box h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid rgba(160,205,255,.3);padding-bottom:6px}
.pslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border-radius:10px;border:2px solid #4f86c9;background:linear-gradient(#1d4178,#0f2a55);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 6px 8px;position:relative;min-height:120px}
.slot img{width:78%;max-width:110px}
.slot .lv{font-size:13px;font-weight:800}
.slot .nm{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .bar{width:90%;margin-top:3px;height:5px}
.slot.empty{justify-content:center;font-size:34px;color:#4f86c9;font-weight:800}
.slot.sel{border-color:#ffd23f;box-shadow:0 0 14px #ffd23f}
.slot .tag{position:absolute;top:4px;left:4px;font-size:10px;background:#e0533a;border-radius:4px;padding:0 5px;font-weight:800}
.slot.dead img{filter:grayscale(1) brightness(.6)}
.goldbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;margin-top:14px;font-weight:700;font-size:14px}
.goldbar b{font-size:20px}
.tabs{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.tab{flex:1;padding:8px 4px;border-radius:8px;border:2px solid #4f86c9;background:#123266;font-weight:800;font-size:14px}
.tab.on{background:linear-gradient(#5ab8ff,#1d6fd8);border-color:#fff}
.lr{width:34px;height:34px;border:2px solid #cfe6ff;border-radius:6px;font-weight:800;flex:none}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bcell{aspect-ratio:1;border-radius:10px;border:2px solid #4f86c9;background:linear-gradient(#24508f,#11305f);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bcell img{width:84%;margin-top:-10px}
.bcell .lv{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000}
.bcell .rank{position:absolute;top:3px;left:3px;min-width:19px;height:19px;font-size:11px;border-width:1px}
.bcell .fav{position:absolute;top:2px;right:4px;color:#ffd23f;font-size:15px;text-shadow:0 0 2px #000}
.bcell .pt2{position:absolute;top:3px;right:3px;font-size:9.5px;background:#e0533a;border-radius:4px;padding:0 4px;font-weight:800}
.bcell.dis{opacity:.35}
.bcell.sel{border-color:#ffd23f;box-shadow:0 0 12px #ffd23f}
.bcell.unk img{filter:brightness(0) opacity(.55)}
.bfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
.pill{padding:8px 16px;border-radius:20px;border:2px solid #6fa7e6;background:#0f2a55;font-weight:800;font-size:14px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:660px){.detail{grid-template-columns:1fr}}
.box{padding:12px 14px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:20px;margin-bottom:10px}
.dhead small{font-size:14px;color:var(--sub)}
.portrait{background:linear-gradient(#9fd4ff,#dff3ff 58%,#9ad16e 58%,#5fa544);border-radius:10px;border:2px solid #9fd0ff;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.portrait img{height:88%}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid rgba(160,205,255,.18);font-weight:700;font-size:15px}
.srow .bar{margin-top:4px}
.srow.col{flex-direction:column;align-items:stretch}
.srow.col>div{display:flex;justify-content:space-between}
.krow{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid rgba(160,205,255,.18);font-weight:700;font-size:15px}
.krow .mp{margin-left:auto;color:var(--sub);font-size:13px;white-space:nowrap}
.krow .mp b{color:#fff;margin-left:6px;font-size:15px}
.kdesc{font-size:12px;color:var(--sub);font-weight:500}
.dot{width:10px;height:10px;border-radius:3px;flex:none;transform:rotate(45deg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .mbtn{width:auto;flex:1;justify-content:center;min-width:120px}
.irow{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid rgba(160,205,255,.18)}
.irow .ii{font-size:26px;width:36px;text-align:center}
.irow .in{flex:1}
.irow .in b{font-size:16px}
.irow .mbtn{width:auto;padding:8px 14px;font-size:14px}
.qrow{display:flex;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid rgba(160,205,255,.18)}
.qrow .ck{width:30px;height:30px;border-radius:50%;border:2px solid #6fa7e6;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.qrow.done .ck{background:#2fc865;border-color:#fff}
.qrow .in{flex:1}
.qrow .in div{font-size:12.5px;color:var(--sub)}
.fuse{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;font-weight:800}
.fuse .fc{width:150px;padding:10px}
.fuse .fc img{width:110px;height:110px}
.fuse .op{font-size:34px;color:#ffd23f}
#mapC{width:100%;height:auto;display:block;border-radius:10px;border:2px solid var(--edge);image-rendering:pixelated}
.starter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.starter .bcell{aspect-ratio:3/4;flex-direction:column}
.starter .bcell img{width:80%;margin:0}
.starter .bcell .lv{position:static}
/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
#title .bg{position:absolute;inset:0}
#title .bg svg{width:100%;height:100%}
.logo{position:relative;font-size:clamp(36px,10vw,72px);font-weight:800;color:#fff;letter-spacing:.04em;text-align:center;line-height:1.1;-webkit-text-stroke:2px #1d4f9c;text-shadow:0 4px 0 #1d4f9c,0 8px 0 #0b2a5c,0 12px 24px rgba(0,0,0,.45)}
.logo small{display:block;font-size:.32em;letter-spacing:.3em;-webkit-text-stroke:1px #1d4f9c;margin-bottom:6px;color:#ffe066}
.tmons{position:relative;display:flex;gap:6px;height:clamp(70px,16vw,120px)}
.tmons img{height:100%;animation:tb 1s infinite alternate ease-in-out}
@keyframes tb{to{translate:0 -10px}}
.tbtns{position:relative;display:flex;flex-direction:column;gap:10px;width:min(300px,80vw);padding:16px 16px 16px 30px}
.tver{position:absolute;bottom:8px;right:12px;font-size:11px;opacity:.7}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:60;transition:opacity .35s}
#fade.white{background:#fff}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{padding:10px 22px;font-weight:800;font-size:15px;animation:tst 2.6s forwards;text-align:center}
@keyframes tst{0%{opacity:0;translate:0 -10px}10%,80%{opacity:1;translate:0 0}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="hud" class="hidden">
  <div id="mini"><canvas id="miniC" width="160" height="160"></canvas><span class="n">N</span></div>
  <div id="area">のどかな草原</div>
  <div id="ptop"></div>
  <div id="hint" class="panel"><div><span class="key">Z</span>話す・調べる</div><div><span class="key">X</span>メニューを開く</div><div><span class="key">⇧</span>ダッシュ</div></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="abtns"><button id="btnL">L<br>ダッシュ</button><button id="btnA"><b>A</b>話す</button><button id="btnB"><b>B</b>メニュー</button></div>
</div>
<div id="banner"></div>
<div id="battle" class="hidden">
  <div id="bscene">
    <div id="bbg"></div>
    <div id="eTags"></div>
    <div id="eRow"></div>
    <div id="pRow"></div>
    <div id="bfx"></div>
  </div>
  <div id="bbot"><div id="bbotIn">
    <div id="pCards"></div>
    <div id="bArea"><div id="bMsg" class="panel"></div><div id="bCmd" class="panel hidden"></div></div>
  </div></div>
</div>
<div id="layer"></div>
<div id="talk" class="hidden">
  <div id="tBox" class="panel"><span id="tName" class="chip"></span><div id="tText"></div><i id="tNext"></i></div>
  <div id="tChoices" class="panel hidden"></div>
</div>
<div id="title">
  <div class="bg" id="titleBg"></div>
  <div class="logo"><small>モンスター スカウト RPG</small>まものスカウターズ</div>
  <div class="tmons" id="tmons"></div>
  <div class="tbtns panel">
    <button class="mbtn" id="tNew">はじめから</button>
    <button class="mbtn" id="tLoad">つづきから</button>
  </div>
  <div class="tver">v1.0</div>
</div>
<div id="fade"></div>
<div id="toast"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hx(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(c,t,k){const a=hx(c),b=hx(t);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*k).toString(16).padStart(2,'0')).join('')}
const lt=(c,k)=>mix(c,'#ffffff',k),dk=(c,k)=>mix(c,'#000000',k);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* =================== モンスターの絵 (SVG) =================== */
const OL='#2a1f3d';
const rg=(id,c,k1=.5,k2=.32)=>`<radialGradient id="${id}" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="${lt(c,k1)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${dk(c,k2)}"/></radialGradient>`;
const sh=(rx=28,cy=94)=>`<ellipse cx="50" cy="${cy}" rx="${rx}" ry="4.5" fill="#000" opacity=".2"/>`;
const S=(w=2.4)=>`stroke="${OL}" stroke-width="${w}" stroke-linejoin="round"`;
function eyesCute(x1,x2,y,s=1){return[x1,x2].map(x=>`<ellipse cx="${x}" cy="${y}" rx="${6*s}" ry="${8*s}" fill="#fff" ${S(2)}/><ellipse cx="${x+.8*s}" cy="${y+1.6*s}" rx="${3.7*s}" ry="${5.1*s}" fill="#1a1230"/><circle cx="${x+2.1*s}" cy="${y-.9*s}" r="${1.7*s}" fill="#fff"/>`).join('')}
function eyesFierce(x1,x2,y,s=1,col='#fff'){return`<path d="M${x1-6*s} ${y-3*s}L${x1+6*s} ${y+1.5*s}L${x1+4*s} ${y+5.5*s}L${x1-5*s} ${y+3.5*s}Z" fill="${col}" ${S(1.8)}/><circle cx="${x1+1.2*s}" cy="${y+2.8*s}" r="${2.1*s}" fill="#1a1230"/><path d="M${x2+6*s} ${y-3*s}L${x2-6*s} ${y+1.5*s}L${x2-4*s} ${y+5.5*s}L${x2+5*s} ${y+3.5*s}Z" fill="${col}" ${S(1.8)}/><circle cx="${x2-1.2*s}" cy="${y+2.8*s}" r="${2.1*s}" fill="#1a1230"/>`}
const mirror=(d)=>d.replace(/(-?\d+\.?\d*) (-?\d+\.?\d*)/g,(m,x,y)=>`${(100-parseFloat(x)).toFixed(1)} ${y}`);
const crown=(y=24,s=1)=>`<g transform="translate(50 ${y}) scale(${s}) translate(-50 -24)"><path d="M34 24L35 6L43 15L50 2L57 15L65 6L66 24Z" fill="#ffd23f" ${S(2.2)}/><circle cx="50" cy="16" r="3.2" fill="#e53935" ${S(1.2)}/><circle cx="38" cy="19" r="2" fill="#3f9dff"/><circle cx="62" cy="19" r="2" fill="#3f9dff"/></g>`;
const ART={
slime(c,o){
  const g=o.metal?`<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${c.a}"/><stop offset=".62" stop-color="${dk(c.a,.3)}"/><stop offset=".8" stop-color="${lt(c.a,.35)}"/><stop offset="1" stop-color="${dk(c.a,.45)}"/></linearGradient>`:rg('g',c.a);
  let s=sh(34)+`<path d="M50 17C54 27 62 32 70 40C81 50 86 59 86 71C86 86 70 93 50 93C30 93 14 86 14 71C14 59 19 50 30 40C38 32 46 27 50 17Z" fill="url(#g)" ${S(2.6)}/>`;
  s+=o.crown?crown(24):`<path d="M50 18C47 12 50 7 56 8" fill="none" ${S(5)} stroke-linecap="round"/><path d="M50 18C47 12 50 7 56 8" fill="none" stroke="${o.metal?c.a:lt(c.a,.15)}" stroke-width="2.6" stroke-linecap="round"/>`;
  s+=`<ellipse cx="32" cy="56" rx="6" ry="11" fill="#fff" opacity=".55" transform="rotate(28 32 56)"/>`+eyesCute(40,60,62);
  s+=`<path d="M36 74Q50 90 64 74Q50 79 36 74Z" fill="#8a1d2e" ${S(2)}/><path d="M43 80Q50 87 57 80Q50 82 43 80Z" fill="#ff7a8a"/>`;
  return{d:g,b:s}},
knight(c){
  const sl=ART.slime(c,{});
  let s=`<g transform="translate(18 36) scale(.64)">${sl.b}</g>`;
  s+=`<path d="M50 7Q61 1 63 13Q57 9 53 13Z" fill="#e53935" ${S(1.8)}/>`;
  s+=`<path d="M40 31Q50 26 60 31L61 47Q50 52 39 47Z" fill="url(#k)" ${S(2.2)}/>`;
  s+=`<path d="M60 35L68 31" ${S(6)} stroke-linecap="round"/><path d="M60 35L68 31" stroke="${c.b}" stroke-width="3.5" stroke-linecap="round"/>`;
  s+=`<path d="M67 32L82 5" ${S(5.5)} stroke-linecap="round"/><path d="M67 32L82 5" stroke="#e6edf5" stroke-width="3" stroke-linecap="round"/><path d="M62 30L73 36" ${S(4.5)} stroke-linecap="round"/><path d="M62 30L73 36" stroke="#e0b23a" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=`<circle cx="50" cy="21" r="10.5" fill="url(#h)" ${S(2.2)}/><rect x="42.5" y="19" width="15" height="4.4" rx="2" fill="#1a1230"/>`;
  s+=`<ellipse cx="37" cy="41" rx="8.5" ry="10.5" fill="#ffd23f" ${S(2)}/><path d="M37 34V48M31.5 41H42.5" stroke="#e53935" stroke-width="2.4"/>`;
  return{d:sl.d+rg('k',c.b)+rg('h','#c9d3df',.6),b:s}},
jelly(c){
  let s=sh(24);
  for(let i=0;i<5;i++){const x=28+i*11;s+=`<path d="M${x} 58q-5 8 0 16q5 8 0 16" fill="none" ${S(7.5)} stroke-linecap="round"/><path d="M${x} 58q-5 8 0 16q5 8 0 16" fill="none" stroke="${c.b}" stroke-width="4" stroke-linecap="round"/>`}
  s+=`<path d="M15 60C15 24 85 24 85 60Q50 70 15 60Z" fill="url(#g)" ${S(2.6)}/><path d="M50 30C47 24 50 19 56 20" fill="none" ${S(5)} stroke-linecap="round"/><path d="M50 30C47 24 50 19 56 20" fill="none" stroke="${lt(c.a,.15)}" stroke-width="2.6" stroke-linecap="round"/>`;
  s+=`<ellipse cx="30" cy="46" rx="5" ry="8" fill="#fff" opacity=".55" transform="rotate(30 30 46)"/>`+eyesCute(41,59,46,.85)+`<path d="M44 56Q50 62 56 56" fill="none" ${S(2.2)} stroke-linecap="round"/>`;
  return{d:rg('g',c.a),b:s}},
bat(c){
  const wl='M37 50L6 30L12 46L2 55L16 58L10 71L34 63Z';
  let s=sh(18,95)+`<path d="${wl}" fill="url(#w)" ${S(2.2)}/><path d="${mirror(wl)}" fill="url(#w)" ${S(2.2)}/>`;
  s+=`<path d="M37 40L31 20L45 33Z" fill="${c.a}" ${S(2.2)}/><path d="M63 40L69 20L55 33Z" fill="${c.a}" ${S(2.2)}/>`;
  s+=`<circle cx="50" cy="53" r="21" fill="url(#g)" ${S(2.6)}/>`+eyesCute(42,58,50,.9);
  s+=`<path d="M41 62Q50 69 59 62" fill="none" ${S(2.2)} stroke-linecap="round"/><path d="M43 63L45 69L47.5 64.5Z" fill="#fff" ${S(1.2)}/><path d="M57 63L55 69L52.5 64.5Z" fill="#fff" ${S(1.2)}/>`;
  s+=`<path d="M44 73L42 80M56 73L58 80" ${S(3)} stroke-linecap="round"/>`;
  return{d:rg('g',c.a)+`<linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.b}"/><stop offset="1" stop-color="${dk(c.a,.2)}"/></linearGradient>`,b:s}},
beast(c,o){
  let s=sh(34);
  if(o.wings)s+=`<path d="M58 50Q68 12 95 12Q86 22 91 29Q80 31 83 39Q72 41 70 56Z" fill="${lt(c.c,.25)}" ${S(2.2)}/><path d="M66 40Q76 26 88 20M70 48Q80 38 86 32" stroke="${dk(c.c,.2)}" stroke-width="1.6" fill="none"/>`;
  s+=`<path d="M82 62Q97 56 92 37" fill="none" ${S(7.5)} stroke-linecap="round"/><path d="M82 62Q97 56 92 37" fill="none" stroke="${c.a}" stroke-width="4.5" stroke-linecap="round"/><circle cx="92" cy="36" r="5" fill="${o.mane?c.c:dk(c.a,.2)}" ${S(2)}/>`;
  s+=`<path d="M70 64L72 88Q76 93 81 88L80 62Z" fill="${dk(c.a,.18)}" ${S(2.2)}/><path d="M60 68L60 90Q64 94 69 90L68 66Z" fill="${dk(c.a,.12)}" ${S(2.2)}/>`;
  s+=`<ellipse cx="62" cy="61" rx="25" ry="16" fill="url(#g)" ${S(2.4)}/>`;
  if(o.spots)s+=[[58,54,3.5],[70,58,3],[64,66,2.8],[78,62,2.5],[52,62,2.5],[74,51,2.4]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.8}" fill="${c.b}"/>`).join('');
  else s+=`<path d="M44 68Q62 80 82 67Q62 74 44 68Z" fill="${lt(c.b,.1)}"/>`;
  s+=`<path d="M38 63L36 90Q41 95 47 90L48 65Z" fill="url(#g)" ${S(2.2)}/><path d="M50 66L50 91Q55 95 60 91L60 66Z" fill="url(#g)" ${S(2.2)}/>`;
  if(o.mane){let p='';for(let k=0;k<16;k++){const a=k/16*Math.PI*2,r=k%2?14:23;p+=`${k?'L':'M'}${(34+Math.cos(a)*r).toFixed(1)} ${(45+Math.sin(a)*r).toFixed(1)}`}s+=`<path d="${p}Z" fill="${c.c}" ${S(2.2)}/>`}
  s+=`<path d="M24 37L21 25L32 32Z" fill="${c.a}" ${S(2)}/><path d="M40 33L47 23L47 36Z" fill="${c.a}" ${S(2)}/>`;
  s+=`<circle cx="34" cy="46" r="14.5" fill="url(#g)" ${S(2.4)}/>`;
  if(o.spots)s+=`<circle cx="40" cy="38" r="1.8" fill="${c.b}"/><circle cx="44" cy="46" r="1.6" fill="${c.b}"/>`;
  s+=`<ellipse cx="27" cy="53" rx="9.5" ry="6.5" fill="${lt(c.a,.55)}" ${S(2)}/><ellipse cx="20.5" cy="50" rx="3.2" ry="2.3" fill="${OL}"/>`;
  s+=eyesFierce(27,39,42,.72);
  if(o.tusks)s+=`<path d="M22 56Q15 55 15 47" fill="none" ${S(5.5)} stroke-linecap="round"/><path d="M22 56Q15 55 15 47" fill="none" stroke="#fffbe8" stroke-width="3" stroke-linecap="round"/><path d="M22 57Q30 60 35 56" fill="none" ${S(2)}/>`;
  else s+=`<path d="M19 56Q27 66 35 56Z" fill="#8a1d2e" ${S(1.8)}/><path d="M21.5 56.5L23 61L24.5 56.5ZM31 56.5L32.3 61L33.6 56.5Z" fill="#fff"/>`;
  return{d:rg('g',c.a),b:s}},
bird(c,o){
  let s=sh(24)+`<path d="M50 74L40 93L50 87L60 93Z" fill="${dk(c.a,.2)}" ${S(2)}/>`;
  s+=`<path d="M30 52Q4 40 6 65Q16 60 18 71Q26 64 33 69Z" fill="${dk(c.a,.12)}" ${S(2.2)}/><path d="M70 52Q96 26 97 50Q87 50 87 61Q78 57 67 66Z" fill="${dk(c.a,.12)}" ${S(2.2)}/>`;
  s+=`<path d="M44 82L42 90M44 82L46 90M56 82L54 90M56 82L58 90" stroke="#e8902c" stroke-width="3" stroke-linecap="round"/>`;
  s+=`<ellipse cx="50" cy="58" rx="23" ry="23" fill="url(#g)" ${S(2.6)}/><ellipse cx="50" cy="67" rx="14" ry="12.5" fill="${c.b}"/>`;
  if(o.eagle)s+=`<path d="M28 54Q28 34 50 34Q72 34 72 54Q50 47 28 54Z" fill="${c.b}" ${S(2)}/>`;
  else s+=`<path d="M48 37Q42 21 51 15Q50 26 54 35Z" fill="${c.c}" ${S(2)}/><path d="M52 37Q54 22 64 20Q58 28 57 38Z" fill="${c.c}" ${S(2)}/>`;
  s+=o.eagle?eyesFierce(42,58,47,.75):eyesCute(42,58,49,.8);
  s+=o.eagle?`<path d="M44 55L56 55Q56 64 49 67Q52 61 44 55Z" fill="#ffc22c" ${S(2)}/>`:`<path d="M44 56L56 56L50 66Z" fill="#ffb22c" ${S(2)}/>`;
  return{d:rg('g',c.a),b:s}},
plant(c,o){
  let s=sh(26)+`<ellipse cx="39" cy="90" rx="7" ry="4" fill="#8a5a33" ${S(2)}/><ellipse cx="61" cy="90" rx="7" ry="4" fill="#8a5a33" ${S(2)}/>`;
  if(o.vine)s+=`<path d="M27 70Q8 68 10 52" fill="none" ${S(6)} stroke-linecap="round"/><path d="M27 70Q8 68 10 52" fill="none" stroke="${c.b}" stroke-width="3.5" stroke-linecap="round"/><path d="M73 70Q92 68 90 52" fill="none" ${S(6)} stroke-linecap="round"/><path d="M73 70Q92 68 90 52" fill="none" stroke="${c.b}" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="10" cy="50" rx="5" ry="3" fill="${c.b}" ${S(1.6)}/><ellipse cx="90" cy="50" rx="5" ry="3" fill="${c.b}" ${S(1.6)}/>`;
  s+=`<path d="M50 42C77 42 81 66 75 80C69 92 31 92 25 80C19 66 23 42 50 42Z" fill="url(#g)" ${S(2.6)}/>`;
  s+=`<path d="M50 44Q50 35 52 30" fill="none" stroke="#3f7d2a" stroke-width="3.2"/>`;
  if(o.vine){for(let k=0;k<6;k++){const a=k/6*Math.PI*2;s+=`<ellipse cx="${(52+Math.cos(a)*8).toFixed(1)}" cy="${(28+Math.sin(a)*8).toFixed(1)}" rx="6" ry="6" fill="${c.c}" ${S(1.8)}/>`}s+=`<circle cx="52" cy="28" r="5" fill="#ffe066" ${S(1.8)}/>`}
  else s+=`<path d="M51 31Q36 15 21 26Q36 37 51 31Z" fill="${c.b}" ${S(2.2)}/><path d="M51 31Q67 9 83 19Q69 34 51 31Z" fill="${lt(c.b,.18)}" ${S(2.2)}/><path d="M50 31Q37 25 27 26M52 30Q66 21 76 20" stroke="${dk(c.b,.25)}" stroke-width="1.4" fill="none"/>`;
  s+=`<ellipse cx="34" cy="70" rx="5" ry="3" fill="#ff8fb0" opacity=".7"/><ellipse cx="66" cy="70" rx="5" ry="3" fill="#ff8fb0" opacity=".7"/>`+eyesCute(41,59,61,.85)+`<path d="M45 71Q50 76 55 71" fill="none" ${S(2.2)} stroke-linecap="round"/>`;
  return{d:rg('g',c.a),b:s}},
rock(c){
  let s=sh(36)+`<circle cx="13" cy="70" r="8" fill="url(#g)" ${S(2.2)}/><circle cx="87" cy="70" r="8" fill="url(#g)" ${S(2.2)}/>`;
  s+=`<path d="M22 89L13 62L23 36L45 23L70 29L87 52L85 80L70 92Z" fill="url(#g)" ${S(2.6)}/>`;
  s+=`<path d="M28 36Q46 21 66 29Q60 37 50 33Q40 40 28 36Z" fill="${c.b}" ${S(2)}/>`;
  s+=`<path d="M72 48L65 57L71 64M27 70L35 76" stroke="${dk(c.a,.45)}" stroke-width="2" fill="none"/>`+eyesFierce(40,60,54,.85,'#ffe9a8');
  s+=`<path d="M40 72Q50 67 60 72" fill="none" ${S(3)} stroke-linecap="round"/>`;
  return{d:rg('g',c.a,.35),b:s}},
ghost(c){
  let s=sh(22,95)+`<path d="M30 42C30 16 70 16 70 42L72 70Q76 82 85 86Q71 91 62 84Q56 93 48 86Q40 93 33 84Q23 89 18 80Q28 75 30 64Z" fill="url(#g)" ${S(2.6)}/>`;
  s+=`<ellipse cx="25" cy="54" rx="7" ry="4.5" transform="rotate(-30 25 54)" fill="url(#g)" ${S(2)}/><ellipse cx="75" cy="54" rx="7" ry="4.5" transform="rotate(30 75 54)" fill="url(#g)" ${S(2)}/>`;
  s+=`<ellipse cx="42" cy="40" rx="4.5" ry="6.5" fill="#1a1230"/><ellipse cx="58" cy="40" rx="4.5" ry="6.5" fill="#1a1230"/><circle cx="43.5" cy="38" r="1.6" fill="#fff"/><circle cx="59.5" cy="38" r="1.6" fill="#fff"/>`;
  s+=`<ellipse cx="50" cy="54" rx="5.5" ry="6.5" fill="#8a1d2e" ${S(2)}/><ellipse cx="50" cy="57.5" rx="3.5" ry="2.5" fill="#ff7a8a"/><ellipse cx="35" cy="48" rx="4" ry="2.5" fill="${c.b}" opacity=".8"/><ellipse cx="65" cy="48" rx="4" ry="2.5" fill="${c.b}" opacity=".8"/>`;
  return{d:rg('g',c.a,.6,.2),b:s}},
lich(c){

  const sp=SP[m.sp],b=sp.st,f=1+(m.lv-1)*.09,pf=1+(m.plus||0)*.03,o={};

const magDmg=(a,d,sk)=>isMetal(d)?(Math.random()<.85?0:1):Math.round((sk.p+eff(a,'wis')*.3)*rnd(.9,1.1)*(d.guard?.6:1));

async function applyDmg(t,v,quiet){

  if(t.m.hp<=0)await killF(t);
  else if(t.sleep&&v>0&&Math.random()<.5){t.sleep=0;updBars()}}
async function killF(t){

async function tryStatus(t,st,ch){
  if(t.m.hp<=0||SP[t.m.sp].trait==='boss'||isMetal(t))return;
  if(st==='sleep'){if(t.sleep)return;if(Math.random()<ch){t.sleep=1;updBars();await bmsg(`${t.label}は ねむってしまった！`,550)}else await bmsg(`${t.label}には きかなかった！`,400)}
  if(st==='poison'){if(t.poison)return;if(Math.random()<ch){t.poison=1;updBars();await bmsg(`${t.label}は どくに おかされた！`,550)}}}
async function doAct(a){
  const f=a.f;if(f.m.hp<=0||f.fled||f.scouted)return;
  if(f.sleep){if(Math.random()<.45||f.sleep>=3){f.sleep=0;updBars();await bmsg(`${f.label}は めを さました！`,550)}else{f.sleep++;await bmsg(`${f.label}は ねむっている……`,550);return}}
  if(f.side==='e'&&isMetal(f)&&Math.random()<.22){f.fled=1;f.el.classList.add('die');updBars();await bmsg(`${f.label}は にげだした！`,700);return}
  const sk=SK[a.sk];
  if(sk.mp>f.m.mp){await bmsg(`${f.label}は ${a.sk}を つかおうとした！\nしかし MPが たりない！`,700);return}
  if(sk.k==='guard'){await bmsg(`${f.label}は みを まもっている。`,450);return}
  f.m.mp-=sk.mp;updBars();
  const foes=f.side==='p'?B.en:B.pt,fr=f.side==='p'?B.pt:B.en,ok=x=>x&&x.m.hp>0&&!x.fled&&!x.scouted;
  anim(f.el,'hop',360);
  await bmsg(a.sk==='こうげき'?`${f.label}の こうげき！`:sk.k==='mag'?`${f.label}は ${a.sk}を となえた！`:sk.k==='breath'?`${f.label}は ${a.sk}を はいた！`:`${f.label}の ${a.sk}！`,480);
  if(sk.k==='phys'){
    for(let h=0;h<(sk.hits||1);h++){
      const live=alive(foes);if(!live.length)break;
      const t=sk.t==='rand'?pick(live):ok(a.tgt)?a.tgt:pick(live);
      if((sk.hit&&Math.random()>sk.hit)||Math.random()<.03){sfx('miss');fxNum(t,'ミス','miss');await bmsg(`ミス！ ${t.label}に ダメージを あたえられない！`,500);continue}
      const r=physDmg(f,t,sk);slashFx(t,r.crit?'#ffe066':'#fff');
      if(r.crit){sfx('crit');await bmsg('かいしんの いちげき！',350)}else sfx('hit');
      await applyDmg(t,r.v);
      if(sk.st)await tryStatus(t,sk.st,sk.sc);
      if(sk.recoil&&f.m.hp>0){await bmsg(`${f.label}は はんどうで ダメージを うけた！`,300);await applyDmg(f,Math.max(1,r.v*sk.recoil),1)}
      if(ok(t)&&f.m.hp>0&&SP[t.m.sp].trait==='counter'&&Math.random()<.25){await bmsg(`${t.label}の カウンター！`,400);sfx('hit');await applyDmg(f,physDmg(t,f,SK['こうげき']).v)}
      if(f.m.hp<=0)break}
    f.charge=0}
  else if(sk.k==='mag'||sk.k==='breath'){
    const tg=sk.t==='foes'?alive(foes):[ok(a.tgt)?a.tgt:pick(alive(foes))];
    screenFx(sk.el);sfx(sk.k==='mag'?'mag':'breath');await wait(320);
    for(const t of tg){if(!ok(t))continue;const v=sk.k==='mag'?magDmg(f,t,sk):breathDmg(f,t,sk);if(v===0){fxNum(t,'0','miss');await bmsg(`${t.label}には ききめが ない！`,380);continue}await applyDmg(t,v)}}
  else if(sk.k==='heal'){
    const tg=sk.t==='allies'?alive(fr):sk.t==='self'?[f]:[ok(a.tgt)?a.tgt:lowest(fr)];sfx('heal');
    for(const t of tg){if(!t)continue;const v=healF(t,(sk.p+eff(f,'wis')*.3)*rnd(.9,1.1));await bmsg(`${t.label}の HPが ${v} かいふくした！`,420)}}
  else if(sk.k==='revive'){
    const t=a.tgt&&a.tgt.m.hp<=0&&!a.tgt.fled&&!a.tgt.scouted?a.tgt:fr.find(x=>x.m.hp<=0&&!x.fled&&!x.scouted);
    if(!t)await bmsg('しかし なにも おこらなかった。',500);
    else if(Math.random()<.75){t.m.hp=Math.ceil(t.s.hp/2);reviveVis(t);sfx('heal');await bmsg(`${t.label}は いきかえった！`,600)}
    else await bmsg(`しかし ${t.label}は いきかえらなかった……`,600)}
  else if(sk.k==='buff'){
    const tg=sk.t==='allies'?alive(fr):[ok(a.tgt)?a.tgt:f];sfx('buff');tg.forEach(t=>{t.buf[sk.stat]=4;anim(t.el,'flash')});
    await bmsg(`${tg.length>1?'みかた全員':tg[0].label}の ${STATN[sk.stat]}が あがった！`,600)}
  else if(sk.k==='charge'){f.charge=1;sfx('buff');await bmsg(`${f.label}は ちからを ためている！`,550)}
  else if(sk.k==='status'){screenFx('dark');for(const t of alive(foes))await tryStatus(t,sk.st,sk.sc)}}
async function endTurn(){
  for(const f of[...B.pt,...B.en]){if(f.m.hp<=0||f.fled||f.scouted)continue;const tr=SP[f.m.sp].trait;
    if(f.poison){await bmsg(`${f.label}は どくの ダメージを うけた！`,250);await applyDmg(f,Math.max(1,Math.floor(f.s.hp/10)),1);if(f.m.hp<=0)continue}
    if(tr==='auto_heal'&&f.m.hp<f.s.hp){const v=healF(f,f.s.hp*.08+1);await bmsg(`${f.label}の HPが ${v} かいふくした！`,380)}
    if(tr==='mp_regen')f.m.mp=Math.min(f.s.mp,f.m.mp+2+Math.floor(f.s.mp*.05));
    for(const k in f.buf)if(f.buf[k]>0)f.buf[k]--;f.guard=0}
  updBars()}
async function doScout(e){
  if(SP[e.m.sp].opt.noscout||e.boss){await bmsg(`${e.label}は スカウト できない！`,800);return false}
  if(e.angry){await bmsg(`${e.label}は おこっていて スカウトに おうじない！`,800);return false}
  const parts=alive(B.pt).filter(f=>!f.sleep);
  await bmsg('スカウトアタック！',500);let pw=0;
  for(const f of parts){anim(f.el,'hop',360);sfx('appeal');slashFx(e,'#ffd23f');anim(e.el,'shake');await bmsg(`${f.label}の アピール！`,420);pw+=Math.max(eff(f,'atk'),eff(f,'wis')*.9)*rnd(.85,1.15)}
  const need=e.s.hp*.3+eff(e,'def')*1.2+e.m.lv*3+6;
  let p=pw/need*42*(1-SP[e.m.sp].rank*.07)*(1+(1-e.m.hp/e.s.hp)*.8)+(B.meat?25:0);
  if(isMetal(e))p*=.45;p=clamp(Math.round(p),1,99);
  const box=document.createElement('div');box.id='scoutBox';box.className='panel';box.innerHTML=`<div class="t">スカウト成功率</div><div class="v">0%</div><div class="bar"><i style="width:0"></i></div>`;$('#bscene').append(box);
  const vEl=box.querySelector('.v');await sleepRaw(60);box.querySelector('i').style.width=p+'%';
  for(let i=0;i<=20;i++){vEl.textContent=Math.round(p*i/20)+'%';await sleepRaw(40)}
  await wait(700);box.remove();
  B.meat=0;
  if(Math.random()*100<p){
    sfx('scout');await bmsg(`${e.label}が 仲間に なりたそうに こちらを みている！`,1200);
    e.scouted=1;e.el.classList.add('ghost');updBars();
    const m=e.m;delete m.boss;m.hp=Math.max(1,Math.min(m.hp,stats(m).hp));ownMark(m.sp);G.cnt.scout++;
    const where=addMon(m),nm=SP[m.sp].name;
    await bmsg(where?`${nm}が 仲間に なった！${where==='box'?'\n(パーティが いっぱいなので BOXへ おくった)':''}`:`BOXが いっぱいで ${nm}を つれていけない……`,1400);
    if(alive(B.en).length)await bmsg('ほかの まものたちは にげていった。',700);
    if(B.expPool)await reward();
    return true}
  sfx('ng');
  if(Math.random()<.5){e.angry=1;await bmsg(`${e.label}は おこってしまった！`,800)}else await bmsg(`${e.label}は しらんぷりを している……`,800);
  return false}
async function victory(){sfx('win');await bmsg('まものたちを やっつけた！',900);G.cnt.win++;await reward(true)}
async function reward(full){

  if(ex)await bmsg(`それぞれ ${ex}ポイントの けいけんちを かくとく！`,800);
  if(gd){G.gold+=gd;await bmsg(`${gd}ゴールドを てにいれた！`,700)}

    if(drop){G.items[drop[0]]=(G.items[drop[0]]||0)+drop[1];await bmsg(`${ITEMS[drop[0]].n}を ${drop[1]}こ てにいれた！`,700)}}

      const m=await pickMon({title:'預ける モンスター',list:G.party,note:'BOXに 預ける モンスターを えらんでください'});if(m){G.party.splice(G.party.indexOf(m),1);G.box.push(m);sfx('coin');toast(`${mname(m)}を 預けました`)}}

function fuseResult(a,b){
  const r=RECIPE.find(([x,y])=>(x===a.sp&&y===b.sp)||(x===b.sp&&y===a.sp));let sp;
  if(r)sp=r[2];else{const fam=SP[a.sp].fam,target=clamp(Math.ceil((SP[a.sp].rank+SP[b.sp].rank)/2)+1,0,5);
    const c=Object.values(SP).filter(s=>s.fam===fam&&!s.opt.fuse&&!s.opt.noscout);let best=c.filter(s=>s.rank===target);
    if(!best.length){const lo=c.filter(s=>s.rank<=target).sort((x,y)=>y.rank-x.rank);best=lo.length?lo.filter(s=>s.rank===lo[0].rank):c.sort((x,y)=>x.rank-y.rank).slice(0,1)}
    sp=best[(a.uid+b.uid)%best.length].id}
  const plus=Math.min(99,Math.floor((a.lv+b.lv)/4)+Math.floor(((a.plus||0)+(b.plus||0))/2));
  const own=SP[sp].skills.map(x=>x[1]);
  const inherit=[...new Set([...a.skills,...b.skills])].filter(s=>!own.includes(s)).sort((x,y)=>SK[y].mp-SK[x].mp).slice(0,2);
  return{sp,plus,inherit,special:!!r}}

  ${[[60,50,1],[300,40,1.4],[200,80,.8]].map(([x,y,k])=>`<g fill="#fff" opacity=".9" transform="translate(${x} ${y}) scale(${k})"><ellipse cx="0" cy="10" rx="30" ry="10"/><circle cx="-10" cy="4" r="12"/><circle cx="10" cy="0" r="15"/></g>`).join('')}
  <path d="M0 170L50 120L90 150L150 95L210 150L260 110L320 150L400 115V300H0Z" fill="#7fb0d0"/>
  <g transform="translate(200 128)"><rect x="-30" y="-10" width="60" height="40" fill="#d8d4e4"/><rect x="-38" y="-30" width="16" height="60" fill="#e4e0ee"/><rect x="22" y="-30" width="16" height="60" fill="#e4e0ee"/><rect x="-10" y="-50" width="20" height="60" fill="#ecE8f4"/><path d="M-41 -30L-30 -52L-19 -30ZM19 -30L30 -52L41 -30ZM-13 -50L0 -78L13 -50Z" fill="#3f6fd0"/></g>
  <path d="M0 190Q100 160 200 185T400 175V300H0Z" fill="#7cc95a"/><path d="M0 215Q200 195 400 215V300H0Z" fill="#5fae4f"/><path d="M170 300L195 215Q200 210 205 215L230 300Z" fill="#e6c98e"/></svg>`}
function startField(){$('#title').classList.add('hidden');$('#hud').classList.remove('hidden');P.x=G.x;P.y=G.y;P.dir=G.dir||'down';curZone='';SYM=[];placeFixed();updHUD();started=true}
function pickStarter(){return new Promise(res=>{const ops=['slime','cdrago','leaf'];
  const el=openScr('あいぼうを えらぼう',`<p style="text-align:center;font-weight:700">さいしょの なかまを 1体 えらんでね！</p><div class="starter">${ops.map(s=>`<button class="bcell" data-s="${s}"><img src="${monImg(s)}"><span class="lv">${SP[s].name}</span><span class="kdesc">${FAM[SP[s].fam]}・${TR[SP[s].trait].n}</span></button>`).join('')}</div>`);
  el.querySelector('.x').classList.add('hidden');
  $$('.bcell',el.body).forEach(b=>b.onclick=()=>{sfx('sel');closeScr(SCR.find(o=>o.el===el),1);res(b.dataset.s)})})}
async function newGameFlow(){
  G=freshGame();startField();busy=true;
  await say('村長',['おお、めざめたか！ わしは この町の 村長じゃ。','この せかいでは まものを「スカウト」して 仲間にする スカウターが かつやく しておる。','じゃが 北の城に すむ まおう ダークロードが まものたちを あばれさせて こまっておるのじゃ。','どうか まおうを たおしてくれ！ まずは あいぼうを えらぶのじゃ。']);
  const sp=await pickStarter();const m=newMon(sp,3);ownMark(sp);G.party.push(m);updHUD();sfx('scout');
  await say('',[`${SP[sp].name}が 仲間に なった！`]);
  await say('村長',['フィールドの まものに ふれると バトルに なる。','よわらせて「スカウト」すれば 仲間に できるぞ。 3体 そろえば スカウトも しやすくなる。','つかれたら 宿屋で やすむのじゃ。 では、いってこい！']);
  G.started=true;busy=false;save()}
async function ending(){
  await say('',['ダークロードは くずれおちた……','やみの ちからが きえ、せかいに へいわが もどった！']);sfx('scout');
  await new Promise(res=>{const el=openScr('THE END',`<div class="box panel" style="text-align:center;padding:30px 16px;max-width:560px;margin:0 auto"><div class="logo" style="font-size:40px">おめでとう！</div><p style="font-weight:700;line-height:2">まおう ダークロードを たおした！<br>スカウトした かず：${G.cnt.scout}<br>配合した かず：${G.cnt.fuse}<br>あつめた しゅるい：${Object.keys(G.dex.own).length} / ${Object.values(SP).filter(s=>!s.opt.noscout).length}</p><p class="kdesc">このまま ぼうけんを つづけて ずかんを うめよう！</p><button class="mbtn" style="justify-content:center;max-width:280px;margin:16px auto 0" id="endOk">ぼうけんを つづける</button></div>`,{onClose:res});
    $('#endOk',el.body).onclick=()=>el.close()})}
window.addEventListener('error',e=>{toast('エラー: '+esc(e.message||e));document.title='ERR '+(e.message||'')});
window.addEventListener('unhandledrejection',e=>{toast('エラー: '+esc(e.reason&&e.reason.message||e.reason));document.title='ERR '+(e.reason&&e.reason.message||e.reason)});
function init(){
  genMap();buildMPix();resize();requestAnimationFrame(frame);
  $('#titleBg').innerHTML=titleBg();$('#tmons').innerHTML=['slime','cdrago','leo','bird','bat','hat'].map((s,i)=>`<img src="${monImg(s)}" style="animation-delay:${i*.15}s">`).join('');
  const sv=loadSave();if(!sv||!sv.started)$('#tLoad').disabled=true;
  $('#tNew').onclick=async()=>{if(sv&&sv.started){G=sv;const c=await say('',['セーブデータが あります。\nさいしょから はじめますか？'],['はじめから','やめる']);if(c!==0)return}newGameFlow()};
  $('#tLoad').onclick=()=>{G=sv;for(const k of['shards','dex','q','cnt','set','items'])G[k]=G[k]||freshGame()[k];startField();toast('ぼうけんの つづきから はじめます')};
  setInterval(()=>{if(G&&G.started&&fieldActive())save()},15000);
  const h=location.hash;
  if(h.startsWith('#t-')){G=freshGame();G.started=true;['slime','leo','hat'].forEach((s,i)=>{const m=newMon(s,12+i);ownMark(s);G.party.push(m)});for(const s of['bat','rock','ghost','griffin'])G.box.push(newMon(s,10));startField();
    if(h==='#t-battle')encounter({sp:'bat',x:P.x,y:P.y,z:'grass',lv:5});
    if(h==='#t-boss')encounter(SYM.find(s=>s.boss));
    if(h==='#t-menu')openMenu();if(h==='#t-detail')openDetail(G.party[1]);if(h==='#t-box')openBox();if(h==='#t-map')openMap();if(h==='#t-dex'){for(const k in SP)G.dex.seen[k]=1;openDex()}
    if(h.startsWith('#t-at')){const[x,y]=h.slice(5).split(',').map(Number);P.x=x;P.y=y}}
}
init();
</script>
<script src="../../playtime.js" defer></script>
