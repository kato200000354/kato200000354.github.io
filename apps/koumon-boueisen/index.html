<title>肛門防衛線</title>
<meta name="description" content="トイレまで漏らさずたどり着け。便意の波を括約筋で耐え抜く、尊厳をかけた3Dアクション。">
<meta name="theme-color" content="#6b3f1d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💩</text></svg>">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#2a1a0c;color:#2a1a0c;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.ui{position:absolute;inset:0;pointer-events:none}
.ui button,.panel,.panel *{pointer-events:auto}

#vig{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(120,0,0,0) 42%,rgba(150,10,0,.78) 100%)}
#zenfx{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,250,200,.05) 30%,rgba(255,240,170,.55) 100%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}

#hud{padding:max(8px,env(safe-area-inset-top)) 10px 0}
.toprow{display:flex;gap:8px;align-items:center}
#face{width:50px;height:50px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.gauges{flex:1;min-width:0}
.glabel{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;line-height:1.25}
.bar{position:relative;background:rgba(30,15,5,.72);border:2px solid #fff;border-radius:9px;overflow:visible}
#pbar{height:17px;margin-bottom:3px}
#dbar{height:9px;border-width:1.5px}
.fill{height:100%;border-radius:6px;width:0}
#pfill{background:linear-gradient(90deg,#c98f4d,#8c5120 55%,#d22)}
#dfill{background:#7fd0ff}
#pmark{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:22px;line-height:1}
#pbar.danger{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(-1px,0)}50%{transform:translate(1px,1px)}100%{transform:translate(0,-1px)}}
#pauseBtn{width:38px;height:38px;border-radius:50%;background:rgba(30,15,5,.65);color:#fff;font-size:16px;flex:none}
#dist{display:inline-block;margin-top:5px;background:rgba(30,15,5,.72);color:#fff;font-size:13px;font-weight:800;padding:3px 10px;border-radius:12px}
#dist b{color:#ffe06a}

#alert{position:absolute;left:0;right:0;top:calc(max(8px,env(safe-area-inset-top)) + 88px);background:#c8121b;color:#fff;border-top:3px solid #ffe06a;border-bottom:3px solid #ffe06a;
  padding:5px 12px;text-align:center;font-weight:900;line-height:1.25}
#alert small{display:block;font-size:11px;letter-spacing:.08em;color:#ffe06a}
#alert span{font-size:17px}
#alert.hit{animation:blink .28s infinite alternate}
@keyframes blink{to{background:#7d0910}}

#toast{position:absolute;left:12px;right:12px;top:38%;text-align:center;font-size:20px;font-weight:900;color:#fff;
  text-shadow:0 2px 0 #4a2a10,0 0 8px #000,2px 0 0 #4a2a10,-2px 0 0 #4a2a10;opacity:0}
#toast.show{animation:pop 1.5s ease-out both}
@keyframes pop{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}

#thought{position:absolute;left:10px;bottom:calc(24px + env(safe-area-inset-bottom));max-width:calc(100% - 150px);background:#fff;border:2px solid #4a2a10;border-radius:14px;
  padding:7px 11px;font-size:13px;font-weight:700;line-height:1.35;transition:opacity .25s}
#thought:after{content:"";position:absolute;right:14px;bottom:-9px;width:12px;height:12px;background:#fff;border:2px solid #4a2a10;border-radius:50%}

#clench{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:transparent;touch-action:none}
#clench .in{position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9f6a,#d4351f);box-shadow:0 5px 0 #7d1a0c,0 8px 14px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:21px;line-height:1.05;text-shadow:0 2px 0 #7d1a0c}
#clench .in small{font-size:10px;font-weight:800;margin-top:2px}
#clench.on .in{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 #7d1a0c}
#clench.nudge{animation:nudge .55s infinite}
@keyframes nudge{50%{transform:scale(1.14)}}
#clench svg{position:absolute;inset:0;transform:rotate(-90deg)}
#stamRing{transition:stroke .15s}
#gas{position:absolute;right:30px;bottom:calc(142px + env(safe-area-inset-bottom));width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6f27a,#78a825);
  box-shadow:0 4px 0 #456613,0 6px 10px rgba(0,0,0,.4);color:#23370a;font-size:13px;font-weight:900;line-height:1.1;touch-action:none;overflow:hidden}
#gas i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);height:0;pointer-events:none}
#gas span{position:relative}
#gas.nudge{animation:nudge .55s infinite}

#say{position:absolute;left:12px;right:12px;bottom:calc(22px + env(safe-area-inset-bottom));background:#fffdf4;border:3px solid #4a2a10;border-radius:14px;padding:11px 14px 12px;min-height:74px;pointer-events:auto;
  box-shadow:0 5px 0 rgba(74,42,16,.55)}
#say b{display:block;font-size:12px;color:#a2531c;margin-bottom:2px}
#say p{font-size:17px;font-weight:800;line-height:1.4}

#talk{position:absolute;left:10px;right:138px;bottom:calc(20px + env(safe-area-inset-bottom));pointer-events:auto}
#talkBubble{background:#fff;border:3px solid #333;border-radius:14px;padding:8px 10px;font-size:13.5px;font-weight:800;line-height:1.35;margin-bottom:7px;min-height:62px}
#talkBubble b{display:block;color:#b43;font-size:11px}
#talkBtn{width:100%;padding:12px 4px;background:#ffd23e;border-radius:12px;font-weight:900;font-size:14px;box-shadow:0 4px 0 #a07e0c;touch-action:none}
#talkBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #a07e0c}
#talkProg{height:6px;background:rgba(0,0,0,.4);border-radius:3px;margin-top:7px;overflow:hidden}
#talkProg i{display:block;height:100%;width:0;background:#7ee04d}

#guide{position:absolute;left:14px;right:14px;top:42%;text-align:center;font-size:18px;font-weight:900;color:#fff;background:rgba(30,15,5,.82);padding:10px 12px;border-radius:12px;line-height:1.4}
#guide b{color:#ffe06a}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px;text-align:center;pointer-events:auto;overflow-y:auto}
#title{justify-content:space-between;padding:calc(max(26px,env(safe-area-inset-top)) + 8px) 16px calc(26px + env(safe-area-inset-bottom));pointer-events:none}
#title button{pointer-events:auto}
.logo{font-size:clamp(44px,14.5vw,74px);font-weight:900;line-height:1.02;color:#fff4d4;letter-spacing:.01em;
  -webkit-text-stroke:2px #4a2a10;paint-order:stroke fill;text-shadow:0 5px 0 #4a2a10,0 9px 16px rgba(0,0,0,.45)}
.logo em{font-style:normal;color:#ffc53a}
.tag{display:inline-block;margin-top:10px;background:#c8121b;color:#fff;font-weight:900;font-size:13px;padding:4px 12px;transform:rotate(-2deg);box-shadow:0 3px 0 #7d0910}
.big{display:block;width:min(290px,84vw);margin:0 auto;padding:15px 8px;border-radius:30px;background:#ffc53a;color:#4a2a10;font-size:21px;font-weight:900;box-shadow:0 6px 0 #a4760c,0 10px 18px rgba(0,0,0,.4)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a4760c}
.sub{display:block;width:min(290px,84vw);margin:12px auto 0;padding:10px 8px;border-radius:22px;background:#fff4d4;color:#4a2a10;font-size:14px;font-weight:800;box-shadow:0 4px 0 #b8a572}
.note{color:#fff;font-size:12px;font-weight:700;margin-top:10px;text-shadow:0 1px 3px #000}
.dim{background:rgba(35,18,6,.84)}
.card{background:#fffdf4;border:3px solid #4a2a10;border-radius:18px;padding:16px 14px;width:min(350px,100%);box-shadow:0 7px 0 rgba(0,0,0,.4)}
#stageNo{font-size:13px;font-weight:900;color:#a2531c;letter-spacing:.12em}
#stageName{font-size:32px;font-weight:900;margin:2px 0 6px}
#stageDesc{font-size:14px;font-weight:700;line-height:1.5;margin-bottom:14px}
#resKind{font-size:13px;font-weight:900;color:#a2531c}
#resTitle{font-size:27px;font-weight:900;line-height:1.2;margin:3px 0 7px}
#resText{font-size:13px;font-weight:700;line-height:1.5;color:#68401d;margin-bottom:9px}
#resScore{font-size:34px;font-weight:900;color:#c8121b}
#resRows{list-style:none;margin:9px 0 12px;font-size:13px;font-weight:700;text-align:left;border-top:2px dashed #cfb98c}
#resRows li{display:flex;justify-content:space-between;gap:8px;border-bottom:2px dashed #cfb98c;padding:4px 2px}
#resRows b{white-space:nowrap}
.card .big{font-size:17px;padding:12px 6px;width:100%}
.card .sub{width:100%;margin-top:9px}
#bigword{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:clamp(78px,27vw,130px);font-weight:900;color:#ffdf3a;-webkit-text-stroke:3px #7d0910;paint-order:stroke fill;text-shadow:0 6px 0 #7d0910;animation:slam .35s cubic-bezier(.2,1.6,.5,1) both}
@keyframes slam{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
#alt{position:absolute;left:0;right:0;top:calc(27% + 130px);text-align:center;color:#fff;font-size:24px;font-weight:900;text-shadow:0 2px 3px #000}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="vig"></div><div id="zenfx"></div>

  <div class="ui" id="hud" hidden>
    <div class="toprow">
      <svg id="face" viewBox="0 0 48 48" aria-hidden="true">
        <circle id="fSkin" cx="24" cy="24" r="21" fill="#ffd7b0" stroke="#4a2a10" stroke-width="2.5"/>
        <path d="M6 18 Q10 3 24 3 Q38 3 42 18 Q33 10 24 12 Q14 11 6 18Z" fill="#2a2018"/>
        <ellipse id="fEyeL" cx="16.5" cy="22" rx="2.6" ry="3" fill="#2a2018"/><ellipse id="fEyeR" cx="31.5" cy="22" rx="2.6" ry="3" fill="#2a2018"/>
        <path id="fMouth" d="M16 31 Q24 37 32 31" fill="none" stroke="#4a2a10" stroke-width="2.5" stroke-linecap="round"/>
        <path id="fSweat" d="M40 12 q4 6 0 8 q-4 -2 0 -8Z" fill="#59b6ff" stroke="#fff" visibility="hidden"/>
      </svg>
      <div class="gauges">
        <div class="glabel"><span>便意</span><span id="pNum">0%</span></div>
        <div class="bar" id="pbar"><div class="fill" id="pfill"></div><div id="pmark">💩</div></div>
        <div class="glabel"><span>尊厳</span><span id="dNum">100</span></div>
        <div class="bar" id="dbar"><div class="fill" id="dfill"></div></div>
      </div>
      <button id="pauseBtn" aria-label="一時停止">Ⅱ</button>
    </div>
    <div id="dist"></div>
  </div>

  <div class="ui" id="fx">
    <div id="alert" hidden><small id="alertTop"></small><span id="alertMain"></span></div>
    <div id="toast"></div>
    <div id="guide" hidden></div>
    <div id="thought" hidden></div>
    <div id="bigword" hidden></div>
    <div id="alt" hidden></div>
  </div>

  <div class="ui" id="ctrls" hidden>
    <div id="talk" hidden>
      <div id="talkBubble"><b id="talkName"></b><span id="talkLine"></span></div>
      <button id="talkBtn">話を切り上げる（連打！）</button>
      <div id="talkProg"><i id="talkBar"></i></div>
    </div>
    <button id="gas" aria-label="ガス抜き"><i id="gasCd"></i><span>ガス<br>抜き</span></button>
    <button id="clench" aria-label="しめる">
      <svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="52" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="7"/><circle id="stamRing" cx="56" cy="56" r="52" fill="none" stroke="#ffe06a" stroke-width="7" stroke-linecap="round"/></svg>
      <div class="in"><span>しめる</span><small>長押し</small></div>
    </button>
  </div>

  <div class="ui" id="sayLayer" hidden><div id="say"><b id="sayName"></b><p id="sayText"></p></div></div>

  <div class="screen" id="title">
    <div>
      <div class="logo">肛門<br><em>防衛線</em></div>
      <div class="tag">漏らせば、社会的に死ぬ。</div>
    </div>
    <div>
      <button class="big" id="startBtn">トイレへ走る</button>
      <button class="sub" id="soundBtn">音：あり（ぜひ音ありで）</button>
      <div class="note" id="bestNote"></div>
    </div>
  </div>

  <div class="screen dim" id="stageCard" hidden>
    <div class="card">
      <div id="stageNo"></div>
      <div id="stageName"></div>
      <div id="stageDesc"></div>
      <button class="big" id="stageGo">行くぞ</button>
    </div>
  </div>

  <div class="screen dim" id="pause" hidden>
    <div class="card">
      <div id="stageName2" style="font-size:24px;font-weight:900;margin-bottom:6px">一時停止</div>
      <div style="font-size:13px;font-weight:700;margin-bottom:12px">便意は待ってくれている。今だけは。</div>
      <button class="big" id="resumeBtn">つづける</button>
      <button class="sub" id="soundBtn2">音：あり</button>
      <button class="sub" id="quitBtn">タイトルへ</button>
    </div>
  </div>

  <div class="screen dim" id="result" hidden>
    <div class="card">
      <div id="resKind"></div>
      <div id="resTitle"></div>
      <div id="resText"></div>
      <div id="resScore"></div>
      <ul id="resRows"></ul>
      <button class="big" id="retryBtn"></button>
      <button class="sub" id="shareBtn">この結果を自慢する</button>
      <button class="sub" id="toTitleBtn">タイトルへ</button>
    </div>
  </div>
  <div id="flash"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
