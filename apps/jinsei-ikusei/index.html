<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e6d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>じんせい育成</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#3b2c22;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:#3a3530;overscroll-behavior:none}
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:linear-gradient(#e9d8c2,#d9c0a0)}
  #stage.land{width:1536px;height:1024px}
  #stage.port{width:900px;height:1720px}
  #scene{position:absolute;left:0;top:0;display:block}
  .land #scene{width:1536px;height:1024px}
  .port #scene{width:900px;height:920px}
  .card{position:absolute;background:rgba(255,255,255,.93);border-radius:30px;box-shadow:0 6px 20px rgba(80,50,20,.18)}
  .pill{position:absolute;height:66px;border-radius:33px;background:rgba(255,255,255,.93);box-shadow:0 6px 18px rgba(80,50,20,.16);display:flex;align-items:center;font-weight:700;font-size:28px;color:#3c4150}

  /* profile */
  #profile{display:flex;align-items:center;padding:0 30px 0 0}
  .land #profile{left:24px;top:24px;width:484px;height:140px;border-radius:70px}
  .port #profile{left:16px;top:16px;width:560px;height:140px;border-radius:70px}
  #avatar{width:128px;height:128px;border-radius:50%;margin:0 18px 0 6px;flex:none;background:linear-gradient(#bfe3ff,#e8f5ff);border:5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15);overflow:hidden}
  #profile .info{flex:1}
  #pname{font-size:30px;font-weight:800;color:#3c4150}
  .lvrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
  #plv{font-size:28px;font-weight:700;color:#3c4150}
  #pexpT{font-size:20px;font-weight:700;color:#3c4150}
  .bar{height:12px;border-radius:6px;background:#e3e6ec;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;border-radius:6px;transition:width .5s}
  .enrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:18px;font-weight:700;color:#5a5f6e}
  .enrow .bar{flex:1;margin:0;height:10px}

  #datePill{justify-content:center;gap:16px}
  .land #datePill{left:535px;top:26px;width:415px}
  .port #datePill{left:16px;top:180px;width:410px}
  #datePill .sep{width:2px;height:30px;background:#ddd}
  #timeT{font-weight:600;color:#5b606e}
  #wIcon{font-size:34px}
  #coinPill,#gemPill{justify-content:space-between;padding:0 30px 0 10px;cursor:pointer}
  .land #coinPill{left:1018px;top:26px;width:200px}
  .land #gemPill{left:1234px;top:26px;width:184px}
  .port #coinPill{left:440px;top:180px;width:220px}
  .port #gemPill{left:672px;top:180px;width:212px}
  .ico{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px}
  #coinPill .ico{background:radial-gradient(circle at 40% 35%,#ffe58a,#f4b414);box-shadow:inset 0 -3px 0 #d79a0b;font-size:24px;color:#c98a00}
  #gearBtn{position:absolute;width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.93);box-shadow:0 6px 18px rgba(80,50,20,.16);font-size:34px;display:flex;align-items:center;justify-content:center}
  .land #gearBtn{left:1452px;top:26px}
  .port #gearBtn{left:818px;top:46px}

  /* side menu */
  #sideMenu{position:absolute;display:flex;flex-direction:column;gap:22px}
  .land #sideMenu{left:28px;top:182px}
  .port #sideMenu{left:18px;top:270px;gap:16px}
  .mbtn{width:104px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .mbtn .mi{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 4px 12px rgba(80,50,20,.2);display:flex;align-items:center;justify-content:center;font-size:40px;transition:transform .15s}
  .mbtn:active .mi{transform:scale(.92)}
  .mbtn span{font-size:20px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.35)}
  .badge{position:absolute;top:-8px;right:4px;width:32px;height:32px;border-radius:50%;background:#ef4a4a;color:#fff;font-weight:900;font-size:22px;display:none;align-items:center;justify-content:center;border:3px solid #fff;animation:bob 1s infinite}
  .badge.on{display:flex}
  @keyframes bob{50%{transform:translateY(-4px)}}

  /* bubble */
  #bubble{position:absolute;background:rgba(255,255,255,.96);border-radius:40px;padding:22px 30px;font-size:24px;line-height:1.5;font-weight:700;color:#3c4150;box-shadow:0 6px 18px rgba(80,50,20,.16);width:262px;transform-origin:20% 100%}
  .land #bubble{left:730px;top:140px}
  .port #bubble{left:420px;top:262px;width:300px}
  #bubble:after{content:"";position:absolute;left:58px;bottom:-26px;width:30px;height:30px;background:rgba(255,255,255,.96);border-radius:50%}
  #bubble:before{content:"";position:absolute;left:44px;bottom:-46px;width:16px;height:16px;background:rgba(255,255,255,.96);border-radius:50%}
  #bubble.pop{animation:pop .35s}
  @keyframes pop{0%{transform:scale(.7);opacity:.3}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

  /* status */
  #status{padding:22px 26px}
  .land #status{left:1052px;top:118px;width:460px;height:386px}
  .port #status{left:16px;top:935px;width:868px;height:300px}
  .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .phead h2{font-size:28px;font-weight:800;color:#3c4150}
  .smallBtn{padding:8px 24px;border-radius:20px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);font-size:20px;font-weight:700}
  #statList{display:grid;gap:4px}
  .port #statList{grid-template-columns:1fr 1fr;column-gap:36px}
  .srow{display:flex;align-items:center;height:70px}
  .port .srow{height:100px}
  .srow .si{font-size:40px;width:58px}
  .srow .sn{font-size:22px;font-weight:800;width:104px}
  .srow .sb{flex:1}
  .sb .sl{font-size:19px;color:#7a8296;font-weight:600}
  .sb .bar{height:14px;margin-top:4px}
  .sb .sv{text-align:right;font-size:19px;font-weight:700;margin-top:2px;color:#3c4150}
  .srow.up{animation:flash .8s}
  @keyframes flash{30%{background:rgba(255,236,150,.7);border-radius:16px}}

  /* event */
  #eventCard{padding:20px 26px;cursor:pointer}
  .land #eventCard{left:1052px;top:522px;width:460px;height:190px}
  .port #eventCard{left:16px;top:1250px;width:868px;height:150px;padding:14px 26px}
  .port #eventCard .phead{margin-bottom:6px}
  .evrow{display:flex;align-items:center;gap:18px;border-top:2px solid #eef0f3;padding-top:14px}
  .port .evrow{padding-top:8px}
  #evThumb{width:100px;height:76px;border-radius:14px;background:linear-gradient(#9fd6ff,#b9e7a8);display:flex;align-items:center;justify-content:center;font-size:44px;flex:none}
  .port #evThumb{height:66px}
  #evTitle{font-size:22px;font-weight:800}
  .evsub{display:flex;justify-content:space-between;margin-top:8px;font-size:19px;font-weight:700;color:#5a5f6e}
  #evLeft.today{color:#ef4a4a}

  /* goal */
  #goal{display:flex;align-items:center;padding:0 30px 0 0;border-radius:60px}
  .land #goal{left:24px;top:768px;width:470px;height:190px}
  .port #goal{left:16px;top:1415px;width:868px;height:130px}
  #treeAv{width:124px;height:124px;border-radius:50%;flex:none;margin:0 20px 0 10px;overflow:hidden;border:5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .port #treeAv{width:104px;height:104px}
  #goal .gl{font-size:20px;color:#7a8296;font-weight:700}
  #goalT{font-size:30px;font-weight:800;margin:8px 0 12px;color:#3c4150}
  .port #goalT{font-size:28px;margin:2px 0 8px}
  #goalSub{font-size:18px;color:#7a8296;font-weight:600;margin-top:6px}
  .grow{display:flex;align-items:center;gap:16px}
  .grow .bar{flex:1;margin:0;height:14px}
  #goalN{font-size:22px;font-weight:700}

  /* actions */
  #actions{position:absolute;display:flex;gap:10px}
  .land #actions{left:512px;top:776px}
  .port #actions{left:16px;top:1558px;gap:8px}
  .act{width:152px;height:172px;border-radius:30px;border:6px solid #fff;box-shadow:0 6px 16px rgba(80,50,20,.25);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0 12px;transition:transform .12s,filter .2s;position:relative}
  .port .act{width:136px;height:152px;padding:10px 0}
  .act:active{transform:scale(.94)}
  .act .ai{font-size:58px;line-height:1;margin-top:2px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
  .port .act .ai{font-size:50px}
  .act .an{font-size:27px;font-weight:800}
  .act .ac{font-size:20px;font-weight:800;color:#fff;padding:3px 0;width:84%;border-radius:16px;text-align:center}
  .act.dis{filter:grayscale(.8) brightness(.95);opacity:.7}
  .a-study{background:linear-gradient(#dff0ff,#bfe0ff)} .a-study .ac{background:#4a94e6}
  .a-exercise{background:linear-gradient(#ddf6e6,#bcebcd)} .a-exercise .ac{background:#3cb874}
  .a-hobby{background:linear-gradient(#ece4ff,#d8c9ff)} .a-hobby .ac{background:#8a67e6}
  .a-social{background:linear-gradient(#fff0d6,#ffdfae)} .a-social .ac{background:#f0a83c}
  .a-rest{background:linear-gradient(#ffe5ec,#ffcbd8)} .a-rest .ac{background:#f07ea0}
  #nextBtn{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 40%,#fff8e6,#fbe6bf);border:6px solid #fff;box-shadow:0 6px 18px rgba(80,50,20,.25);font-weight:800;font-size:27px;transition:transform .12s}
  #nextBtn:active{transform:scale(.94)}
  #nextBtn .ni{font-size:60px;line-height:1}
  .land #nextBtn{left:1322px;top:752px;width:192px;height:192px;border-radius:50%}
  .port #nextBtn{left:740px;top:1558px;width:144px;height:152px;border-radius:30px;font-size:22px}
  .port #nextBtn .ni{font-size:46px}
  #nextBtn.glow{animation:glow 1.4s infinite}
  @keyframes glow{50%{box-shadow:0 0 0 10px rgba(255,200,80,.45),0 6px 18px rgba(80,50,20,.25)}}

  /* fx */
  .float{position:absolute;font-weight:900;font-size:30px;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 #fff,0 0 8px #fff;animation:floatUp 1.5s ease-out forwards;z-index:30}
  @keyframes floatUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-20px) scale(1.1);opacity:1}100%{transform:translate(-50%,-140px) scale(1);opacity:0}}
  .prop{position:absolute;font-size:110px;pointer-events:none;animation:propPop 1.3s ease-out forwards;z-index:25;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
  @keyframes propPop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15) rotate(8deg);opacity:1}60%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
  #toasts{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:40;pointer-events:none}
  .land #toasts{top:110px}
  .port #toasts{top:260px}
  .toast{background:linear-gradient(90deg,#ffb432,#ff7a59);color:#fff;font-weight:800;font-size:26px;padding:12px 30px;border-radius:30px;box-shadow:0 6px 14px rgba(0,0,0,.25);animation:toastIn 2.6s forwards}
  @keyframes toastIn{0%{transform:translateY(-20px);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

  /* sleep curtain */
  #sleep{position:absolute;inset:0;background:#141a35;opacity:0;pointer-events:none;transition:opacity .7s;z-index:45;display:flex;align-items:center;justify-content:center;color:#fff;font-size:64px;font-weight:800}
  #sleep.on{opacity:1;pointer-events:auto}

  /* modal */
  #overlay{position:absolute;inset:0;background:rgba(40,28,18,.5);display:none;align-items:center;justify-content:center;z-index:50}
  #overlay.show{display:flex}
  #mbox{background:#fffdf8;border-radius:36px;box-shadow:0 14px 40px rgba(0,0,0,.35);width:760px;max-height:88%;display:flex;flex-direction:column;animation:pop .3s;position:relative}
  .port #mbox{width:840px}
  #mtitle{font-size:34px;font-weight:800;padding:30px 40px 10px;text-align:center}
  #mbody{padding:10px 40px;overflow-y:auto;font-size:24px;line-height:1.6;flex:1}
  #mbtns{display:flex;gap:16px;justify-content:center;padding:20px 40px 32px;flex-wrap:wrap}
  .mb{min-width:220px;padding:18px 30px;border-radius:40px;font-size:26px;font-weight:800;background:linear-gradient(#5aa8f5,#3d84e0);color:#fff;box-shadow:0 5px 0 #2c66b8}
  .mb:active{transform:translateY(3px);box-shadow:0 2px 0 #2c66b8}
  .mb.sub{background:linear-gradient(#f1f2f5,#dfe2e8);color:#555;box-shadow:0 5px 0 #b9bdc6}
  .mb.pink{background:linear-gradient(#ff8fb1,#f0688f);box-shadow:0 5px 0 #c04b6d}
  .mb.orange{background:linear-gradient(#ffc04d,#f59a1e);box-shadow:0 5px 0 #c97710}
  #mclose{position:absolute;right:20px;top:18px;width:56px;height:56px;border-radius:50%;background:#f0ece4;font-size:30px;font-weight:900;color:#888}
  .big{font-size:90px;text-align:center;line-height:1.2}
  .center{text-align:center}
  .muted{color:#8a8f9c;font-size:21px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
  .chip{background:#f3efe6;border-radius:20px;padding:6px 18px;font-weight:700;font-size:22px}
  .chip.plus{background:#e3f6e9;color:#1f8a4d}
  .chip.minus{background:#fde7ea;color:#c23a55}
  .mlist{display:flex;flex-direction:column;gap:14px}
  .mitem{display:flex;align-items:center;gap:18px;background:#f7f3ea;border-radius:22px;padding:16px 20px}
  .mitem .mi2{font-size:44px;width:60px;text-align:center}
  .mitem .mt{flex:1}
  .mitem .mt b{display:block;font-size:24px}
  .mitem .bar{height:12px}
  .mitem .mbsm{min-width:150px;padding:12px 18px;font-size:22px}
  .mbsm:disabled{opacity:.45;filter:grayscale(1)}
  .done{color:#2aa35f;font-weight:800}
  input.name{font-family:inherit;font-size:32px;padding:14px 22px;border-radius:20px;border:3px solid #e0d6c5;width:100%;text-align:center;outline:none;user-select:text;-webkit-user-select:text}
  input.name:focus{border-color:#5aa8f5}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal .h{text-align:center;font-weight:800;font-size:20px;color:#8a8f9c}
  .cal .h.sun{color:#e05a5a}.cal .h.sat{color:#4a84e0}
  .cal .d{aspect-ratio:1/1;background:#f7f3ea;border-radius:16px;padding:6px;font-size:19px;font-weight:700;position:relative;display:flex;flex-direction:column;align-items:center}
  .cal .d.past{opacity:.55}
  .cal .d.today{background:#ffe9b0;box-shadow:inset 0 0 0 3px #f5a623}
  .cal .d .ce{font-size:30px;line-height:1.1;margin-top:2px}
  .cal .d.empty{background:none}
  .album{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .acard{background:#f7f3ea;border-radius:22px;padding:14px 8px;text-align:center}
  .acard .ae{font-size:56px}
  .acard b{display:block;font-size:20px;line-height:1.3;margin-top:4px}
  .acard small{font-size:17px;color:#8a8f9c}
  .acard.lock{opacity:.5}
  .acard.lock .ae{filter:grayscale(1) brightness(.3)}
  table.st{width:100%;border-collapse:collapse;font-size:22px}
  table.st td{padding:8px 6px;border-bottom:2px solid #f0ebe0}
  table.st td:last-child{text-align:right;font-weight:800}
  .row2{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:2px solid #f0ebe0}

  /* svg anims */
  #handR{animation:write 0.7s ease-in-out infinite}
  @keyframes write{0%,100%{transform:translate(0,0)}25%{transform:translate(8px,-3px)}50%{transform:translate(14px,0)}75%{transform:translate(6px,2px)}}
  #charAll{transform-box:fill-box;transform-origin:50% 100%}
  #charAll.hop{animation:hop .5s}
  @keyframes hop{30%{transform:translateY(-18px) scale(1.02)}60%{transform:translateY(2px)}}
  #catTail{transform-box:fill-box;transform-origin:0% 100%;animation:tail 2.4s ease-in-out infinite}
  @keyframes tail{50%{transform:rotate(-18deg)}}
  #charHead{transform-box:fill-box;transform-origin:50% 90%;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{50%{transform:rotate(1.2deg) translateY(2px)}}
  .zz{animation:zz 2.5s infinite}
  @keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(20px,-40px)}}
</style>
</head>
<body>
<div id="stage" class="land">
  <!-- ===== ROOM SCENE ===== -->
  <svg id="scene" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wallG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c6ad"/><stop offset="1" stop-color="#ecdcc6"/></linearGradient>
      <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop id="sky1" offset="0" stop-color="#5bb8f5"/><stop id="sky2" offset="1" stop-color="#d8f1ff"/></linearGradient>
      <linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79a62"/><stop offset="1" stop-color="#a86a3a"/></linearGradient>
      <linearGradient id="shelfG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a86d3e"/><stop offset="1" stop-color="#c88a55"/></linearGradient>
      <linearGradient id="curtG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f5fae"/><stop offset=".3" stop-color="#4c82d4"/><stop offset=".6" stop-color="#3567b9"/><stop offset="1" stop-color="#4c82d4"/></linearGradient>
      <radialGradient id="glowG" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#fff3c4" stop-opacity=".9"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunG"><stop offset="0" stop-color="#fff9d6"/><stop offset=".5" stop-color="#ffe680" stop-opacity=".8"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>
      <pattern id="checkP" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#eaf2ff"/><rect width="22" height="44" fill="#9cc0f0" opacity=".7"/><rect width="44" height="22" fill="#9cc0f0" opacity=".5"/></pattern>
      <g id="headBase">
        <ellipse cx="590" cy="410" rx="142" ry="130" fill="#4a2f22"/>
        <ellipse cx="466" cy="455" rx="20" ry="26" fill="#f8d5bd"/>
        <ellipse cx="714" cy="455" rx="20" ry="26" fill="#f8d5bd"/>
        <ellipse cx="590" cy="448" rx="122" ry="110" fill="#fde5d2"/>
        <path d="M458 445 Q448 320 560 296 Q660 280 718 352 Q742 395 722 448 Q706 404 684 396 Q692 426 670 436 Q656 398 630 388 Q632 414 610 424 Q600 388 574 382 Q560 414 528 420 Q544 394 538 378 Q500 400 486 446 Q474 420 470 470 Z" fill="#553627"/>
        <path d="M590 292 Q606 250 646 258 Q612 268 606 300 Z" fill="#553627"/>
        <path d="M520 330 Q560 310 600 318" stroke="#7a5240" stroke-width="6" fill="none" stroke-linecap="round" opacity=".6"/>
        <ellipse cx="518" cy="508" rx="22" ry="12" fill="#ff9d9d" opacity=".45"/>
        <ellipse cx="662" cy="508" rx="22" ry="12" fill="#ff9d9d" opacity=".45"/>
      </g>
    </defs>

    <!-- wall -->
    <rect width="1536" height="1024" fill="url(#wallG)"/>
    <rect x="0" y="0" width="1536" height="1024" fill="#000" opacity=".04"/>
    <!-- picture frame -->
    <rect x="292" y="140" width="130" height="96" rx="6" fill="#7b5638"/>
    <rect x="302" y="150" width="110" height="76" fill="#3b6fb8"/>
    <path d="M302 226 L340 190 L370 210 L392 186 L412 206 L412 226 Z" fill="#9ccbe8"/>

/* ---------- audio ---------- */
let AC=null;
function beep(f,d=0.12,type='sine',v=0.12,delay=0){
  if(!S||!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

  tap:()=>beep(660,.08,'triangle',.08),

  coin:()=>{beep(988,.07,'square',.05);beep(1319,.15,'square',.05,.06)},
  bad:()=>beep(200,.2,'sawtooth',.06),
  fan:()=>[523,659,784,659,784,1047].forEach((f,i)=>beep(f,.22,'triangle',.1,i*.12)),

function genMissions(){
  const pool=[];
  ['study','exercise','hobby','social'].forEach(k=>{const n=rnd(1,2);pool.push({kind:'act',key:k,n,text:`${ACTS[k].name}を${n}回する`,reward:80+n*60})});
  const n=rnd(4,5);pool.push({kind:'total',n,text:`1日に${n}回行動する（休む以外）`,reward:220});
  pool.push({kind:'act',key:'rest',n:1,text:'休んで体力を回復する',reward:80});
  const out=[];while(out.length<3){const m=pick(pool);if(!out.includes(m))out.push(m)}
  S.missions=out.map(m=>({...m,claimed:false}));
}
function missionProg(m){return Math.min(m.n,m.kind==='total'?S.today.total:S.today[m.key])}
function scheduleEvents(){
  S.events=S.events.filter(e=>e.day>=S.day);
  while(S.events.length<2){
    const last=S.events.length?S.events[S.events.length-1].day:S.day;
    const used=S.events.map(e=>e.id);
    let cands=EVENTS.filter(e=>!used.includes(e.id)&&!S.seenEvents.includes(e.id));
    if(!cands.length)cands=EVENTS.filter(e=>!used.includes(e.id));
    S.events.push({id:pick(cands).id,day:last+rnd(2,4)});
  }
}
const EV=id=>EVENTS.find(e=>e.id===id);

/* ---------- exp ---------- */
let lvUps=[];
function gainExp(k,amt,show){
  const s=S.stats[k];const out=[];
  if(s.lv>=10){return[`${STATS[k].name} MAX`]}
  s.exp+=amt;out.push(`${STATS[k].icon} ${STATS[k].name} +${amt}`);
  while(s.exp>=100&&s.lv<10){s.exp-=100;s.lv++;lvUps.push(k)}
  if(s.lv>=10)s.exp=0;
  return out;
}
function gainP(amt){
  S.pexp+=amt;
  while(S.pexp>=pNeed(S.plv)){S.pexp-=pNeed(S.plv);S.plv++;S.gems+=10;toast(`🎉 ${S.name} が Lv.${S.plv} になった！ 💎+10`);sfx.lvl()}
}
function flushLvUps(){
  lvUps.forEach((k,i)=>{
    setTimeout(()=>{toast(`${STATS[k].icon} ${STATS[k].name}が Lv.${S.stats[k].lv} にアップ！`);sfx.lvl();
      const row=document.querySelector(`.srow[data-k="${k}"]`);if(row){row.classList.remove('up');void row.offsetWidth;row.classList.add('up')}},i*350);
  });
  lvUps=[];
}
function applyEff(eff){
  const out=[];
  for(const k in eff){
    const v=eff[k];
    if(STATS[k]){out.push(...gainExp(k,v))}
    else if(k==='energy'){S.energy=clamp(S.energy+v,0,100);out.push(`⚡ 体力 ${v>0?'+':''}${v}`)}
    else if(k==='coins'){S.coins=Math.max(0,S.coins+v);out.push(`★ コイン ${v>0?'+':''}${v}`)}
    else if(k==='gems'){S.gems+=v;out.push(`💎 ${v>0?'+':''}${v}`)}
    else if(k==='hour'){S.hour=Math.min(22,S.hour+v)}
  }
  return out;
}
const chipHtml=list=>`<div class="chips">${list.map(t=>`<span class="chip ${/-\d/.test(t)?'minus':'plus'}">${t}</span>`).join('')}</div>`;

/* ---------- goals ---------- */
function goalFrac(i){const g=GOALS[i];if(!g)return 1;const ks=Object.keys(g.req);return ks.reduce((a,k)=>a+Math.min(1,S.stats[k].lv/g.req[k]),0)/ks.length}
function checkGoal(){
  while(S.goal<GOALS.length&&goalFrac(S.goal)>=1){
    const g=GOALS[S.goal];S.goal++;S.gems+=30;
    addAlbum({kind:'goal',icon:g.icon,t:g.t});
    const last=S.goal>=GOALS.length;
    queueModal({title:last?'🌟 夢がかなった！':'🎯 目標達成！',html:`<div class="big">${g.icon}</div><p class="center"><b>「${g.t}」</b>を達成した！</p>${chipHtml(['💎 +30'])}${last?'':`<p class="center muted">次の目標：${GOALS[S.goal].t}</p>`}`,
      buttons:[{label:last?'つづきへ':'やった！',cls:'orange'}],onShow:sfx.fan});
    if(last&&!S.ended){S.ended=true;queueModal(endingModal())}
  }
}
function endingModal(){
  const days=S.day+1;
  const title=days<=40?'伝説の努力家':days<=60?'夢をつかんだ人':days<=90?'コツコツの達人':'あきらめない心の持ち主';

    <p class="center" style="margin-top:12px">称号：<b style="color:#f08a1e">${title}</b></p>
    <table class="st" style="margin-top:14px">${SK.map(k=>`<tr><td>${STATS[k].icon} ${STATS[k].name}</td><td>Lv. ${S.stats[k].lv}</td></tr>`).join('')}
    <tr><td>総行動回数</td><td>${Object.values(S.counts).reduce((a,b)=>a+b,0)} 回</td></tr><tr><td>思い出</td><td>${S.album.length} 個</td></tr></table>
    <p class="center muted" style="margin-top:10px">このまま育成を続けることもできます</p>`,
    buttons:[{label:'このまま続ける'},{label:'最初から',cls:'sub',fn:()=>{confirmReset()}}]};
}
function addAlbum(a){S.album.push({...a,day:S.day});S.albumNew=true}

/* ---------- actions ---------- */
function canAct(){return !modalOpen&&!busy}
let busy=false;
function doAction(key){
  if(!canAct())return;
  const A=ACTS[key];
  if(S.hour>=22){say('もう夜だ…<br>そろそろ寝よう');sfx.bad();pulseNext();return}
  if(!A.heal&&S.energy<A.cost){say('つかれて動けない…<br>休もうかな');setFace('tired');sfx.bad();return}
  if(A.heal&&S.energy>=100){say('体力は満タンだ！<br>何かしよう');return}
  sfx.act();
  const out=[];
  if(A.heal){
    const h=A.heal+(S.stats.sta.lv>=5?5:0);
    S.energy=clamp(S.energy+h,0,100);out.push(`⚡ +${h}`);
  }else{
    let base=rnd(14,22);
    let mul=1+(S.stats.mot.lv-1)*0.06;
    if(BOOST[key]&&S.owned[BOOST[key]])mul*=1.25;
    if(S.weather==='rain'){if(key==='exercise')mul*=.6;if(key==='study'||key==='hobby')mul*=1.2}
    if(S.weather==='sun'&&key==='exercise')mul*=1.15;
    if(S.energy<30)mul*=.7;
    const crit=Math.random()<.12;
    if(crit)mul*=2;
    const amt=Math.round(base*mul);
    out.push(...gainExp(A.stat,amt));
    if(A.sub)out.push(...gainExp(A.sub[0],A.sub[1]));
    S.energy-=A.cost;
    const c=rnd(10,30);S.coins+=c;out.push(`★ +${c}`);
    if(crit)setTimeout(()=>toast('✨ 大成功！ 経験値2倍！'),200);
    S.today.total++;
  }
  S.counts[key]++;S.today[key]++;
  S.hour=Math.min(22,S.hour+2);S.min=rnd(0,59);if(S.hour>=22)S.min=0;
  gainP(A.heal?5:15);
  // fx
  showProp(A.prop);
  out.forEach((t,i)=>setTimeout(()=>floatText(t,i),i*220));
  hop();setFace(S.energy<20?'tired':'happy');
  say(pick(A.lines)+(S.energy<20&&!A.heal?'<br><small>…ちょっと疲れたかも</small>':''));
  setTimeout(()=>setFace(S.energy<20?'tired':'normal'),1800);
  flushLvUps();
  checkGoal();
  // mission complete notice
  S.missions.forEach(m=>{if(!m.claimed&&!m.noticed&&missionProg(m)>=m.n){m.noticed=true;setTimeout(()=>toast(`📋 ミッション達成！「${m.text}」`),600)}});
  render();save();
  busy=true;setTimeout(()=>busy=false,350);
  if(S.hour>=22){setTimeout(()=>{say('もう22時だ。<br>今日はおしまい！');pulseNext()},1400)}
}
function pulseNext(){$('#nextBtn').classList.add('glow')}

function nextDay(){
  if(modalOpen||busy)return;
  busy=true;sfx.tap();
  const sl=$('#sleep');sl.textContent='💤 おやすみ…';sl.classList.add('on');
  setTimeout(()=>{
    // sleep restore
    const restore=clamp(40+Math.max(0,22-S.hour)*5+S.stats.sta.lv*2,40,90);
    const before=S.energy;S.energy=clamp(S.energy+restore,0,100);
    // auto claim
    let auto=0;S.missions.forEach(m=>{if(!m.claimed&&missionProg(m)>=m.n){m.claimed=true;auto+=m.reward}});
    if(auto){S.coins+=auto}
    S.day++;S.hour=8;S.min=rnd(0,15);
    S.today={study:0,exercise:0,hobby:0,social:0,rest:0,total:0};
    S.coins+=100;
    rollWeather();genMissions();
    const lines=[`⚡ 体力 +${S.energy-before}`,'★ おこづかい +100'];
    if(auto)lines.push(`📋 ミッション報酬 +${auto}`);
    let mtxt='';
    if(Math.random()<.4){
      const tot=MORNING.reduce((a,m)=>a+m.w,0);let r=Math.random()*tot,mm=MORNING[0];
      for(const m of MORNING){r-=m.w;if(r<=0){mm=m;break}}
      mtxt=`<p class="center" style="margin-top:8px"><b>${mm.t}</b></p>`+chipHtml(applyEff(mm.eff));
      if(mm.eff.hour)S.hour=8+mm.eff.hour;
    }
    sl.textContent='☀️ おはよう！';
    render();
    setTimeout(()=>{
      sl.classList.remove('on');busy=false;
      queueModal({title:`☀️ ${fmtDate(S.day)}`,html:`<p class="center">${WICON[S.weather]} 今日の天気：${{sun:'はれ',cloud:'くもり',rain:'雨'}[S.weather]}${S.weather==='rain'?'<br><span class="muted">雨の日は勉強・趣味の効果UP、運動は効果DOWN</span>':S.weather==='sun'?'<br><span class="muted">晴れの日は運動の効果UP</span>':''}</p>${chipHtml(lines)}${mtxt}`,buttons:[{label:'今日もがんばる！'}]});
      const ev=S.events.find(e=>e.day===S.day);
      if(ev)queueModal(eventModal(ev));
      flushLvUps();checkGoal();
      say(pick(['よし、今日は何しよう？','新しい一日のはじまり！','今日も一歩ずつ！']));
      setFace('normal');
      $('#nextBtn').classList.remove('glow');
      render();save();
    },700);
  },800);
}
function eventModal(ev){
  const E=EV(ev.id);
  const effTxt=o=>Object.entries(o.eff).filter(([k])=>k!=='hour').map(([k,v])=>STATS[k]?`${STATS[k].icon}${STATS[k].name}${v>0?'+':''}${v}`:k==='energy'?`⚡${v>0?'+':''}${v}`:k==='coins'?`★${v>0?'+':''}${v}`:'').join(' ');
  const choose=o=>{
    S.events=S.events.filter(e=>e!==ev);
    if(!S.seenEvents.includes(E.id))S.seenEvents.push(E.id);
    if(o.eff.coins<0&&S.coins<-o.eff.coins){modalQ.unshift({title:'コインが足りない…',html:`<p class="center">お金が足りなくて行けなかった…</p>`,buttons:[{label:'しかたない'}]});scheduleEvents();return}
    const res=applyEff(o.eff);let msg=o.msg;
    if(o===E.go)addAlbum({kind:'event',icon:E.icon,t:E.t});
    if(o.contest){
      const sc=S.stats.mot.lv+S.stats.kno.lv+rnd(0,4);
      if(sc>=12){res.push(...applyEff({coins:1000,gems:20}));msg='なんと入賞！賞金をもらった！';}
      else if(sc>=8){res.push(...applyEff({coins:300}));msg='佳作に選ばれた！次はもっと上へ！';}
      else msg='残念ながら落選…でも挑戦できたことが大事！';
    }
    modalQ.unshift({title:`${E.icon} ${E.t}`,html:`<p class="center">${msg}</p>${chipHtml(res)}`,buttons:[{label:'OK'}],onShow:sfx.coin});
    scheduleEvents();flushLvUps();checkGoal();render();save();
  };
  return {title:`${E.icon} イベント発生！`,noClose:true,html:`<div class="big">${E.icon}</div><p class="center"><b>今日は「${E.t}」の日！</b><br>どうする？</p>
    <div class="mlist" style="margin-top:14px"><div class="mitem"><div class="mt"><b>${E.go.label}</b><span class="muted">${effTxt(E.go)}${E.go.contest?' ＋結果しだいで賞金':''}</span></div></div>
    <div class="mitem"><div class="mt"><b>${E.no.label}</b><span class="muted">${effTxt(E.no)}</span></div></div></div>`,
    buttons:[{label:E.go.label,cls:'orange',fn:()=>choose(E.go)},{label:E.no.label,cls:'sub',fn:()=>choose(E.no)}]};
}

/* ---------- modal ---------- */
const modalQ=[];let modalOpen=false,curModal=null;
function queueModal(m){modalQ.push(m);if(!modalOpen)nextModal()}
function nextModal(){
  const m=modalQ.shift();
  if(!m){modalOpen=false;curModal=null;$('#overlay').classList.remove('show');render();return}
  modalOpen=true;showModal(m);
}
function showModal(m){
  curModal=m;
  $('#overlay').classList.add('show');
  $('#mtitle').innerHTML=m.title;
  $('#mbody').innerHTML=typeof m.html==='function'?m.html():m.html;
  $('#mclose').style.display=m.noClose?'none':'block';
  const bb=$('#mbtns');bb.innerHTML='';
  (m.buttons||[]).forEach(b=>{
    const el=document.createElement('button');el.className='mb '+(b.cls||'');el.innerHTML=b.label;
    el.onclick=()=>{sfx.tap();if(b.fn)b.fn();if(!b.keep)nextModal()};bb.appendChild(el);
  });
  bb.style.display=(m.buttons&&m.buttons.length)?'flex':'none';
  $('#mbody').scrollTop=0;
  if(m.onMount)m.onMount($('#mbody'));
  if(m.onShow)m.onShow();
}
$('#mclose').onclick=()=>{sfx.tap();nextModal()};
function openMenu(m){if(modalOpen||busy)return;sfx.tap();queueModal(m)}

/* ---------- menus ---------- */
function missionModal(){
  return {title:'📋 今日のミッション',html:()=>`<div class="mlist">${S.missions.map((m,i)=>{
      const p=missionProg(m),ok=p>=m.n;
      return `<div class="mitem"><div class="mi2">${m.kind==='total'?'🔥':ACTS[m.key].icon}</div><div class="mt"><b>${m.text}</b>
      <div class="bar"><i style="width:${p/m.n*100}%;background:linear-gradient(90deg,#3cb874,#7ad99e)"></i></div><span class="muted">${p} / ${m.n}　報酬 ★${m.reward}</span></div>
      ${m.claimed?'<span class="done">受取済 ✓</span>':`<button class="mb mbsm orange" data-i="${i}" ${ok?'':'disabled'}>受け取る</button>`}</div>`}).join('')}</div>
      <p class="muted center" style="margin-top:14px">ミッションは毎日入れかわります（達成済みは翌日に自動で受け取り）</p>`,
    onMount:b=>b.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{
      const m=S.missions[+el.dataset.i];if(m.claimed||missionProg(m)<m.n)return;
      m.claimed=true;S.coins+=m.reward;gainP(20);sfx.coin();toast(`★ +${m.reward} コインを受け取った！`);save();render();showModal(missionModal());
    }),buttons:[{label:'とじる',cls:'sub'}]};
}
function calModal(offset=0){
  const cur=dateOf(S.day);const y=cur.getFullYear(),mo=cur.getMonth()+offset;
  const first=new Date(y,mo,1);const last=new Date(y,mo+1,0).getDate();
  const dayIdx=d=>Math.round((d-START)/86400000);
  let cells=WD.map((w,i)=>`<div class="h ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++)cells+='<div class="d empty"></div>';
  for(let d=1;d<=last;d++){
    const di=dayIdx(new Date(first.getFullYear(),first.getMonth(),d));
    const ev=S.events.find(e=>e.day===di);const al=S.album.filter(a=>a.day===di);
    let ic=ev?EV(ev.id).icon:al.length?al[0].icon:'';
    cells+=`<div class="d ${di<S.day?'past':''} ${di===S.day?'today':''}">${d}<span class="ce">${ic}</span></div>`;
  }
  const evList=S.events.map(e=>`<div class="row2"><span>${EV(e.id).icon} ${EV(e.id).t}</span><span class="muted">${fmtDate(e.day)}（${e.day===S.day?'今日':'あと'+(e.day-S.day)+'日'}）</span></div>`).join('');
  return {title:`📅 ${first.getFullYear()}年 ${first.getMonth()+1}月`,html:`<div class="cal">${cells}</div><div style="margin-top:16px"><b>予定</b>${evList}</div>`,
    buttons:[{label:'‹ 前の月',cls:'sub',keep:true,fn:()=>showModal(calModal(offset-1))},{label:'次の月 ›',cls:'sub',keep:true,fn:()=>showModal(calModal(offset+1))},{label:'とじる'}]};
}
function albumModal(){
  S.albumNew=false;save();render();
  const slots=[...GOALS.map(g=>({kind:'goal',icon:g.icon,t:g.t})),...EVENTS.map(e=>({kind:'event',icon:e.icon,t:e.t}))];
  return {title:'📔 アルバム',html:`<p class="muted center">思い出 ${S.album.length} 個</p><div class="album" style="margin-top:10px">${slots.map(s=>{
      const got=S.album.find(a=>a.t===s.t);
      return got?`<div class="acard"><div class="ae">${s.icon}</div><b>${s.t}</b><small>${fmtDate(got.day)}${s.kind==='goal'?' 目標達成':''}</small></div>`
        :`<div class="acard lock"><div class="ae">${s.icon}</div><b>？？？</b><small>${s.kind==='goal'?'目標':'イベント'}</small></div>`}).join('')}</div>`,buttons:[{label:'とじる',cls:'sub'}]};
}
function shopModal(){
  return {title:'🛍️ ショップ',html:()=>`<p class="center" style="font-weight:800">★ ${S.coins.toLocaleString()}　💎 ${S.gems}</p><div class="mlist" style="margin-top:10px">${SHOP.map((it,i)=>{
      const owned=it.once&&S.owned[it.id];const can=(it.cur==='coins'?S.coins:S.gems)>=it.price;
      return `<div class="mitem"><div class="mi2">${it.icon}</div><div class="mt"><b>${it.t}</b><span class="muted">${it.d}</span></div>
      ${owned?'<span class="done">購入済 ✓</span>':`<button class="mb mbsm ${it.cur==='gems'?'pink':'orange'}" data-i="${i}" ${can?'':'disabled'}>${it.cur==='coins'?'★':'💎'} ${it.price}</button>`}</div>`}).join('')}</div>`,
    onMount:b=>b.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{
      const it=SHOP[+el.dataset.i];const bal=it.cur==='coins'?'coins':'gems';
      if(S[bal]<it.price||(it.once&&S.owned[it.id]))return;
      S[bal]-=it.price;sfx.coin();
      if(it.once){S.owned[it.id]=true;toast(`${it.icon} ${it.t}を手に入れた！`)}
      else{const r=it.use();toast(`${it.icon} ${it.t}を使った！ ${r.join(' ')}`)}
      flushLvUps();checkGoal();save();render();if(curModal&&curModal.title==='🛍️ ショップ')showModal(shopModal());
    }),buttons:[{label:'とじる',cls:'sub'}]};
}
function detailModal(){
  const cnt=S.counts;
  return {title:'📊 くわしいステータス',html:`${SK.map(k=>{const s=S.stats[k];return `<div class="row2"><div><b>${STATS[k].icon} ${STATS[k].name}　Lv. ${s.lv}</b><br><span class="muted">${STATS[k].desc}</span></div><b>${s.lv>=10?'MAX':s.exp+' / 100'}</b></div>`}).join('')}
    <table class="st" style="margin-top:14px"><tr><td>経過日数</td><td>${S.day+1} 日目</td></tr>
    ${Object.keys(ACTS).map(k=>`<tr><td>${ACTS[k].icon} ${ACTS[k].name}した回数</td><td>${cnt[k]} 回</td></tr>`).join('')}
    <tr><td>持ち物</td><td>${Object.keys(S.owned).map(id=>SHOP.find(s=>s.id===id).icon).join(' ')||'なし'}</td></tr></table>
    <p class="muted" style="margin-top:12px">💡 やる気が高いほど全部の行動の効果UP／体力が30未満だと効果DOWN／早く寝るほど回復量が増える／たまに「大成功」で2倍！</p>`,buttons:[{label:'とじる',cls:'sub'}]};
}
function settingsModal(){
  return {title:'⚙️ 設定',html:`<p style="font-weight:800">なまえ</p><input class="name" id="nmIn" maxlength="8" value="${esc(S.name)}">
    <div class="row2" style="margin-top:16px"><b>🔊 効果音</b><button class="mb mbsm ${S.sound?'':'sub'}" id="sndBtn">${S.sound?'ON':'OFF'}</button></div>
    <div class="row2"><b>🗑️ データを消して最初から</b><button class="mb mbsm pink" id="rstBtn">リセット</button></div>
    <p class="muted" style="margin-top:12px">データはこの端末のブラウザに自動保存されます。</p>`,
    onMount:b=>{
      b.querySelector('#sndBtn').onclick=()=>{S.sound=!S.sound;save();showModal(settingsModal())};
      b.querySelector('#rstBtn').onclick=()=>{nextModal();confirmReset()};
    },
    buttons:[{label:'保存してとじる',fn:()=>{const v=($('#nmIn')||{}).value;if(v&&v.trim()){S.name=v.trim().slice(0,8)}save();render()}}]};
}
function confirmReset(){
  queueModal({title:'本当にリセットする？',html:'<p class="center">これまでの育成データがすべて消えます。</p>',
    buttons:[{label:'リセットする',cls:'pink',fn:()=>{try{localStorage.removeItem(KEY)}catch(e){};S=null;modalQ.length=0;setTimeout(titleScreen,50)}},{label:'やめる',cls:'sub'}]});
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function titleScreen(){
  S=newState();render();
  queueModal({title:'🌱 じんせい育成',noClose:true,html:`<div class="big">🧑‍🎓</div><p class="center">好きなことで生きていくために、<br>毎日の行動を選んで主人公を育てよう！</p>
    <ul style="margin:14px 0 14px 30px;font-size:22px"><li>行動すると⚡体力を使ってステータスが上がる</li><li>1日は朝8時〜夜22時。疲れたら休もう</li><li>イベントやミッションでボーナス！</li><li>5つの目標をクリアすると夢がかなう</li></ul>
    <p style="font-weight:800">主人公のなまえ</p><input class="name" id="startName" maxlength="8" value="たかし">`,
    buttons:[{label:'はじめる！',cls:'orange',fn:()=>{
      const v=($('#startName').value||'').trim()||'たかし';
      S=newState(v.slice(0,8));rollWeather();S.weather='sun';genMissions();scheduleEvents();save();render();
      say(`よし、${esc(S.name)}の<br>新しい毎日のスタートだ！`);sfx.fan();
    }}]});
}

/* ---------- fx ---------- */
function charPos(){return stage.classList.contains('port')?{x:300,y:380}:{x:590,y:450}}
function floatText(t,i){
  const p=charPos();const el=document.createElement('div');el.className='float';el.textContent=t;
  el.style.left=(p.x+(i%2?110:-90))+'px';el.style.top=(p.y-20-i*8)+'px';
  el.style.color=/-\d/.test(t)?'#e0445f':'#2a8a50';
  stage.appendChild(el);setTimeout(()=>el.remove(),1600);
}
function showProp(e){
  const p=charPos();const el=document.createElement('div');el.className='prop';el.textContent=e;
  el.style.left=(p.x+170)+'px';el.style.top=(p.y-60)+'px';stage.appendChild(el);setTimeout(()=>el.remove(),1400);
}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),2700)}
function hop(){const c=$('#charAll');c.classList.remove('hop');void c.getBBox();c.classList.add('hop')}
function say(html){const b=$('#bubble');b.innerHTML=html;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function setFace(f){
  const set=(id,on)=>$(id).setAttribute('opacity',on?1:0);
  set('#eyesN',f==='normal');set('#eyesH',f==='happy');set('#eyesT',f==='tired');
  set('#mouthN',f==='normal');set('#mouthH',f==='happy');set('#mouthT',f==='tired');set('#sweat',f==='tired');
}

/* ---------- render ---------- */
function renderScene(){
  const h=S.hour+S.min/60;
  let c1,c2,tint=0,warm=0,night=false;
  if(h<10){c1='#8fd3ff';c2='#eef8ff'}
  else if(h<16){c1='#4fb0f2';c2='#d4efff'}
  else if(h<18){c1='#7fa8e0';c2='#ffd6a0';warm=.08}
  else if(h<20){c1='#4a4f8f';c2='#ff9a66';warm=.12;tint=.12}
  else{c1='#141b45';c2='#333a78';tint=.3;night=true}
  if(S.weather==='rain'&&!night){c1='#8b98aa';c2='#c9d1dc';tint=Math.max(tint,.08)}
  else if(S.weather==='cloud'&&!night){c2='#e6eef5'}
  $('#sky1').setAttribute('stop-color',c1);$('#sky2').setAttribute('stop-color',c2);
  $('#tint').setAttribute('opacity',tint);$('#warm').setAttribute('opacity',warm);
  const sunY=h<12?260-(h-8)*25:160+(h-12)*30;
  $('#sun').setAttribute('cy',sunY);$('#sunCore').setAttribute('cy',sunY);
  $('#sunG1').setAttribute('opacity',night||S.weather==='rain'?0:1);
  $('#moonG').setAttribute('opacity',night?1:0);
  $('#clouds').setAttribute('opacity',night?.15:S.weather==='sun'?.7:1);
  $('#city').setAttribute('fill',night?'#2b3263':'#c9d6e6');
  $('#cityWin').setAttribute('fill',night?'#ffe18a':'#e8eef6');
  $('#sunbeam').setAttribute('opacity',night||S.weather==='rain'?0:.12);
  $('#lampGlow').setAttribute('opacity',night?.95:h>=18?.75:.5);
  $('#catEyes').setAttribute('opacity',night?0:1);$('#catSleep').setAttribute('opacity',night?1:0);$('#catZ').setAttribute('opacity',night?1:0);
}
function renderStats(){
  $('#statList').innerHTML=SK.map(k=>{const s=S.stats[k],m=s.lv>=10;
    return `<div class="srow" data-k="${k}"><div class="si">${STATS[k].icon}</div><div class="sn">${STATS[k].name}</div><div class="sb"><div class="sl">Lv. ${s.lv}</div><div class="bar"><i style="width:${m?100:s.exp}%;background:${STATS[k].color}"></i></div><div class="sv">${m?'MAX':s.exp+' / 100'}</div></div></div>`}).join('');
}
function renderActions(){
  const wrap=$('#actions');
  if(!wrap.children.length){
    wrap.innerHTML=Object.entries(ACTS).map(([k,a])=>`<button class="act a-${k}" data-k="${k}"><span class="ai">${a.icon}</span><span class="an">${a.name}</span><span class="ac">${a.heal?'⚡ +'+a.heal:'⚡ -'+a.cost}</span></button>`).join('');
    wrap.querySelectorAll('.act').forEach(b=>b.onclick=()=>doAction(b.dataset.k));
  }
  wrap.querySelectorAll('.act').forEach(b=>{const a=ACTS[b.dataset.k];
    b.classList.toggle('dis',!!(S.hour>=22||(!a.heal&&S.energy<a.cost)||(a.heal&&S.energy>=100)))});
}
function render(){
  if(!S)return;
  $('#pname').textContent=S.name;
  $('#plv').textContent=`Lv. ${S.plv}`;
  $('#pexpT').textContent=`${S.pexp} / ${pNeed(S.plv)}`;
  $('#pexpB').style.width=(S.pexp/pNeed(S.plv)*100)+'%';
  $('#enB').style.width=S.energy+'%';$('#enT').textContent=S.energy;
  $('#enB').style.background=S.energy<30?'linear-gradient(90deg,#f05a5a,#ff8a7a)':'linear-gradient(90deg,#ffb11f,#ffd25a)';
  $('#wIcon').textContent=WICON[S.weather];
  $('#dateT').textContent=fmtDate(S.day);
  $('#timeT').textContent=fmtTime(S.hour,S.min);
  $('#coinT').textContent=S.coins.toLocaleString();
  $('#gemT').textContent=S.gems.toLocaleString();
  renderStats();renderActions();renderScene();
  // event
  const ev=S.events[0];
  if(ev){const E=EV(ev.id);$('#evThumb').textContent=E.icon;$('#evThumb').style.background=E.bg;$('#evTitle').textContent=E.t;
    const v=Object.entries(E.go.eff).find(([k])=>STATS[k]||k==='coins');
    $('#evEff').textContent=v?(STATS[v[0]]?`${STATS[v[0]].icon} ${STATS[v[0]].name} +${v[1]}`:`★ コイン +${v[1]}`):'';
    const left=ev.day-S.day;const el=$('#evLeft');el.textContent=left<=0?'今日！':`あと${left}日`;el.classList.toggle('today',left<=0)}
  // goal
  if(S.goal<GOALS.length){const g=GOALS[S.goal];$('#goalT').textContent=g.t;
    $('#goalB').style.width=(goalFrac(S.goal)*100)+'%';
    $('#goalSub').textContent='条件：'+Object.entries(g.req).map(([k,v])=>`${STATS[k].name}Lv${v}${S.stats[k].lv>=v?'✓':''}`).join('・');}
  else{$('#goalT').textContent='夢をかなえた！🌟';$('#goalB').style.width='100%';$('#goalSub').textContent='このまま自由に育成できます'}
  $('#goalN').textContent=`${S.goal} / ${GOALS.length}`;
  // tree grows
  const sc=0.55+S.goal*0.1;['#tr1','#tr2','#tr3'].forEach((id,i)=>$(id).setAttribute('transform',`translate(50 50) scale(${sc}) translate(-50 -50)`));
  $('#fruits').innerHTML=[[42,34],[58,38],[38,52],[62,52],[50,26]].slice(0,S.goal).map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#ff6b6b" transform="translate(50 50) scale(${sc}) translate(-50 -50)"/>`).join('');
  // badges
  $('#mBadge').classList.toggle('on',S.missions.some(m=>!m.claimed&&missionProg(m)>=m.n));
  $('#aBadge').classList.toggle('on',!!S.albumNew);
  $('#nextBtn').classList.toggle('glow',!!(S.hour>=22||(S.energy<10&&S.hour>=18)));
}

/* ---------- idle chatter ---------- */
setInterval(()=>{
  if(!S||modalOpen||busy)return;
  let l;
  if(S.hour>=22)l='もう夜だ。<br>「次の日へ」で寝よう';
  else if(S.energy<20)l=pick(['ちょっとつかれたな…','休むのも大事だよね']);
  else if(S.events[0]&&S.events[0].day-S.day===1)l=`明日は「${EV(S.events[0].id).t}」だ！`;
  else if(S.missions.some(m=>!m.claimed&&missionProg(m)>=m.n))l='ミッション達成してる！<br>報酬を受け取ろう';
  else l=pick(['よし、<br>今日はこのタスクをやってみよう！','好きなことで<br>生きていきたいな','何からやろうかな？','コツコツが大事！',`目標は<br>「${S.goal<5?GOALS[S.goal].t:'もっと上へ'}」`]);
  say(l);
},11000);

/* ---------- layout ---------- */
function fit(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const port=vw/vh<0.95;
  stage.className=port?'port':'land';
  const W=port?900:1536,H=port?1720:1024;
  const s=Math.min(vw/W,vh/H);
  stage.style.left=((vw-W*s)/2)+'px';stage.style.top=((vh-H*s)/2)+'px';
  stage.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit);

/* ---------- bind ---------- */
$('#nextBtn').onclick=nextDay;
$('#mMission').onclick=()=>openMenu(missionModal());
$('#mCal').onclick=()=>openMenu(calModal());
$('#mAlbum').onclick=()=>openMenu(albumModal());
$('#mShop').onclick=()=>openMenu(shopModal());
$('#coinPill').onclick=()=>openMenu(shopModal());
$('#gemPill').onclick=()=>openMenu(shopModal());
$('#gearBtn').onclick=()=>openMenu(settingsModal());
$('#detailBtn').onclick=()=>openMenu(detailModal());
$('#eventCard').onclick=()=>openMenu(calModal());
$('#bubble').onclick=()=>{if(S){hop();setFace('happy');sfx.tap();say(pick(['なに？','がんばるぞー！','えへへ','いい天気だね','応援ありがとう！']));setTimeout(()=>setFace('normal'),1200)}};

fit();
const saved=load();
if(saved&&saved.stats){S=Object.assign(newState(),saved);render();say(`おかえり！<br>${fmtDate(S.day)}の続きだよ`);
  const ev=S.events.find(e=>e.day<=S.day);if(ev)queueModal(eventModal(ev));}
else titleScreen();
})();
</script>
<script src="../../playtime.js" defer></script>
</body>
