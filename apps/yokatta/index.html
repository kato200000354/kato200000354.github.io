<title>よかった、この距離で。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#233a60; --ink2:#5a6e92; --ink3:#93a3bf;
  --accent:#2e5a92; --accent2:#4f7fc0;
  --paper:#f6f9fd; --card:#ffffff; --line:#dde6f2; --mist:#e9f0f9;
  --peach:#f4cdb9; --ground:#dfe9f6;
  --hand:'Klee One','Zen Maru Gothic','Hiragino Maru Gothic ProN',serif;
  --round:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; padding:16px; background:linear-gradient(180deg,#d6e4f5 0%,#eef3fa 60%,#f6e9e2 100%);
  color:var(--ink); font-family:var(--round); display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.phone{
  position:relative; width:100%; max-width:420px; height:100%; max-height:880px; min-height:560px;
  border-radius:30px; overflow:hidden; background:var(--paper);
  border:2px solid #1e3a66; box-shadow:0 24px 60px rgba(35,58,96,.22);
}
.scr{position:absolute; inset:0; display:flex; flex-direction:column; animation:fade .5s ease both}
.scr.still{animation:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ic{width:22px;height:22px;flex:none}

/* ---------- title ---------- */
.title{color:#fff}
.title .art{position:absolute; inset:0}
.title .art svg{width:100%;height:100%;display:block}
.logo-wrap{position:relative; margin-top:16%; padding-inline:40px; display:flex; flex-direction:column; align-items:center; gap:14px}
.logo{margin:0; font-family:var(--hand); font-weight:400; font-size:clamp(38px,11vw,50px); line-height:1.35; letter-spacing:.14em;
  transform:rotate(-7deg); text-shadow:0 2px 18px rgba(30,60,110,.35); display:flex; flex-direction:column}
.logo span:last-child{padding-left:.6em}
.logo-rule{width:62%; height:1px; background:rgba(255,255,255,.8); transform:rotate(-7deg); margin-top:6px}
.logo-sub{font-family:var(--hand); font-size:13px; letter-spacing:.3em; opacity:.9}
.title-menu{position:absolute; left:0; right:0; bottom:9%; display:flex; flex-direction:column; align-items:center; gap:10px}
.title-menu button{background:none; border:0; color:#fff; letter-spacing:.3em; font-size:15px; padding:8px 18px; text-shadow:0 1px 8px rgba(20,40,80,.5)}
.title-menu .tm-main{font-size:17px; letter-spacing:.4em; margin-bottom:10px}
.title-menu .tm-main::before,.title-menu .tm-main::after{content:"—"; margin:0 .6em; opacity:.8}
.title-menu .sub{display:flex;align-items:center;gap:8px;font-size:13px}
.title-menu .sub i{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;display:inline-block}

/* ---------- intro / ending ---------- */
.intro{background:linear-gradient(180deg,#f7f9fd 0%,#eef3fa 55%,#e6eef8 100%)}
.intro .art,.ending .art{position:absolute; inset:0}
.intro .art svg,.ending .art svg{width:100%;height:100%;display:block}
.intro-text{position:relative; padding:18% 34px 0; font-family:var(--hand); font-size:15px; line-height:2.1; letter-spacing:.08em}
.intro-text p{margin:0 0 1.4em; opacity:0; animation:rise 1.2s ease forwards}
@keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.intro-foot{position:absolute; left:28px; right:18px; bottom:22px; display:flex; align-items:center; justify-content:space-between; font-family:var(--hand); font-size:13px; letter-spacing:.12em}
.intro-foot span::before{content:""; display:inline-block; width:30px; height:1px; background:var(--ink); vertical-align:middle; margin-right:12px}
.next{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.8);font-size:20px;display:grid;place-items:center}

.ending{color:var(--ink)}
.end-wrap{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; padding:12% 28px 26px; gap:18px; text-align:center; overflow:auto}
.end-wrap h2{margin:0; font-family:var(--hand); font-weight:400; color:#fff; font-size:34px; line-height:1.4; letter-spacing:.14em; transform:rotate(-5deg); text-shadow:0 2px 14px rgba(40,50,110,.35)}
.end-card{margin-top:auto; background:rgba(255,255,255,.82); backdrop-filter:blur(6px); border-radius:20px; padding:20px 18px; font-family:var(--hand); font-size:14px; line-height:2; letter-spacing:.06em; display:flex; flex-direction:column; gap:14px; width:100%}
.end-card p{margin:0}

/* ---------- paper screens ---------- */
.paper{background:var(--paper)}
.mhead{padding:22px 20px 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#e8f0fa,var(--paper))}
.mhead small{display:block; font-size:10px; letter-spacing:.24em; color:var(--ink3)}
.mhead h2{margin:4px 0 0; font-family:var(--hand); font-weight:600; font-size:21px; letter-spacing:.12em}
.badge{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; font-size:12px; padding:4px 10px; border-radius:99px; font-variant-numeric:tabular-nums}
.list{flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.stage{display:grid; grid-template-columns:104px 1fr auto; align-items:center; gap:14px; padding:8px 14px 8px 8px; border-radius:16px; background:var(--card); border:1px solid var(--line); text-align:left; box-shadow:0 4px 14px rgba(40,70,120,.06)}
.stage:hover{border-color:#b9cbe4}
.stage .thumb{width:104px; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:var(--mist)}
.stage .thumb svg{width:100%;height:100%;display:block}
.st-txt b{display:block; font-weight:500; font-size:15px; letter-spacing:.06em}
.st-txt small{display:flex; align-items:center; gap:6px; margin-top:6px; color:var(--ink2); font-size:12px}
.st-txt small i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink3)}
.stage.done .st-txt small i{background:var(--accent2); border-color:var(--accent2)}
.stage .mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--accent)}
.stage .new{font-size:10px; letter-spacing:.14em; color:#c0664e; border:1px solid #ecc3b5; border-radius:99px; padding:2px 8px}
.stage.locked{opacity:.6; box-shadow:none; background:rgba(255,255,255,.5)}
.stage.locked .thumb{background:linear-gradient(180deg,#e3ebf5,#f3f6fb)}
.map-foot{padding:0 16px 8px}
.wide{width:100%; padding:13px; border-radius:99px; border:1px solid var(--line); background:var(--card); letter-spacing:.14em; font-size:14px}

.nav{display:flex; justify-content:space-around; border-top:1px solid var(--line); background:var(--card); padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink3);padding:6px 8px;letter-spacing:.06em}
.nav button.on{color:var(--accent)}
.nav button.on .ic{stroke-width:2}

.tabs{display:flex; gap:4px; margin:14px 16px 0; background:var(--mist); padding:4px; border-radius:99px}
.tabs button{flex:1; border:0; background:none; padding:8px; border-radius:99px; font-size:13px; color:var(--ink2); letter-spacing:.06em}
.tabs button.on{background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(40,70,120,.1)}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-content:start}
.tile{display:flex; flex-direction:column; gap:6px; background:none; border:0; padding:0; text-align:center; font-size:11px; color:var(--ink2)}
.tile .img{aspect-ratio:1; border-radius:10px; overflow:hidden; background:linear-gradient(180deg,#e3ebf5,#f3f6fb); border:1px solid var(--line); display:grid; place-items:center; color:var(--ink3); font-size:18px}
.tile .img svg{width:100%;height:100%;display:block}
.empty{margin:auto; text-align:center; color:var(--ink2); font-family:var(--hand); line-height:2; font-size:14px; padding:30px 10px}

.diary{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
.diary .dt{font-size:12px; color:var(--ink2); letter-spacing:.1em; display:flex; justify-content:space-between}
.diary p{margin:0; font-family:var(--hand); font-size:15px; line-height:2}
.diary .pic{border-radius:10px; overflow:hidden; aspect-ratio:16/9}
.diary .pic svg{width:100%;height:100%;display:block}
.word{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; font-family:var(--hand); font-size:16px; line-height:1.9}
.word small{display:block; font-family:var(--round); font-size:11px; color:var(--ink3); margin-top:6px; letter-spacing:.08em}

.set{display:flex; flex-direction:column}
.set .row{display:flex; align-items:center; gap:12px; padding:16px 6px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; font-size:14px; width:100%}
.set .row span{flex:1}
.set .row em{font-style:normal; color:var(--ink2); font-size:13px}
.sw{width:42px;height:24px;border-radius:99px;background:#cfd9e7;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row[aria-pressed="true"] .sw{background:var(--accent2)}
.row[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.chev{color:var(--ink3)}

/* ---------- play ---------- */
.play{background:var(--paper)}
.scene{position:relative; flex:1 1 auto; min-height:180px; overflow:hidden; background:#cfe0f3}
.scene > svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.zl,.pw{transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.topbar{position:absolute; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:10px; color:#fff; text-shadow:0 1px 6px rgba(20,40,80,.45)}
.topbar .nm{flex:1; font-size:14px; letter-spacing:.1em}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:var(--ink);display:grid;place-items:center;text-shadow:none;backdrop-filter:blur(4px)}
.panel{position:relative; flex:none; margin-top:-24px; background:var(--card); border-radius:24px 24px 0 0; padding:20px 20px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px; box-shadow:0 -10px 30px rgba(40,70,120,.1)}
.lead{margin:0; font-family:var(--hand); font-size:14px; line-height:1.9; letter-spacing:.04em; white-space:pre-line; min-height:3.8em}
.hint{margin:0; font-size:12.5px; color:var(--ink2); display:flex; align-items:center; gap:8px; min-height:1.6em}
.hint::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ink3); flex:none}
.hint[data-k="ok"]::before{background:#e39a7e}
.hint[data-k="near"]::before,.hint[data-k="tooNear"]::before{background:#8d9cc4}
.meter{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--ink2)}
.meter .ep{display:flex; flex-direction:column; align-items:center; gap:2px; width:28px}
.meter input{flex:1; -webkit-appearance:none; appearance:none; background:none; height:30px; margin:0}
.meter input::-webkit-slider-runnable-track{height:2px; background:var(--ink)}
.meter input::-moz-range-track{height:2px; background:var(--ink)}
.meter input::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 1px var(--accent); margin-top:-8px}
.meter input::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 1px var(--accent)}
.ctrls{display:flex; justify-content:center; align-items:center; gap:26px}
.rb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(40,70,120,.08);color:var(--ink)}
.rb.big{width:66px;height:66px;color:var(--accent);box-shadow:0 6px 18px rgba(40,70,120,.16)}
.rb:active{transform:scale(.95)}
.cap{margin:0; text-align:center; font-size:11px; color:var(--ink3); letter-spacing:.06em}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.glow{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); white-space:nowrap; font-family:var(--hand); font-size:22px; letter-spacing:.12em; color:var(--ink);
  padding:22px 30px; background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.7) 60%,rgba(255,255,255,0)); text-shadow:0 0 12px #fff; animation:glowIn 2.2s ease both}
@keyframes glowIn{0%{opacity:0; filter:blur(6px)}25%{opacity:1; filter:none}85%{opacity:1}100%{opacity:.95}}

.bubble{position:absolute; left:16px; bottom:40px; max-width:72%; background:#fff; border-radius:16px; padding:14px 16px; font-family:var(--hand); font-size:15px; line-height:1.8; box-shadow:0 6px 20px rgba(40,70,120,.15); animation:rise .5s ease both}
.note{margin:0; font-family:var(--hand); font-size:13.5px; line-height:1.8; color:var(--ink2); white-space:pre-line}
.choices{display:flex; flex-direction:column; gap:10px}
.choice{display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:14px; border:1px solid var(--line); background:#fff; text-align:left; font-size:14px; letter-spacing:.04em; box-shadow:0 2px 8px rgba(40,70,120,.05)}
.choice i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2);flex:none}
.choice:hover:not(:disabled){border-color:#b9cbe4; background:#fbfdff}
.choice:disabled{opacity:.4; cursor:default; text-decoration:line-through}
.glowline{margin:0; text-align:center; font-family:var(--hand); font-size:19px; letter-spacing:.14em}
.memo{background:var(--mist); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.memo small{font-size:11px; color:var(--ink2); letter-spacing:.1em; display:flex; justify-content:space-between}
.memo p{margin:0; font-family:var(--hand); font-size:14px; line-height:1.9; white-space:pre-line}
.primary{width:100%; padding:14px; border-radius:99px; border:0; background:var(--accent); color:#fff; letter-spacing:.18em; font-size:14px; box-shadow:0 6px 16px rgba(46,90,146,.3)}
.primary.soft{background:#9fb8d9; box-shadow:none}

/* ---------- tutorial ---------- */
.tut{background:var(--paper); padding:20px}
.tut-head{display:flex; align-items:center; gap:10px; font-size:15px; letter-spacing:.1em}
.tut-head button{background:none;border:0;font-size:20px;color:var(--ink2);padding:4px 8px}
.tut-fig{margin:26px 0 20px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:20px; display:grid; place-items:center; aspect-ratio:16/9}
.tut-fig svg{width:100%; height:100%}
.tut p{margin:0 0 12px; font-family:var(--hand); font-size:15px; line-height:2; letter-spacing:.04em}
.dots{display:flex; gap:6px; justify-content:center; margin:auto 0 16px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent2)}

/* ---------- modal ---------- */
.modal{position:absolute; inset:0; background:rgba(28,46,80,.4); display:grid; place-items:center; padding:24px; z-index:10; animation:fade .25s both}
.sheet{width:100%; max-width:340px; background:#fff; border-radius:22px; padding:22px; display:flex; flex-direction:column; gap:12px; text-align:center; box-shadow:0 20px 50px rgba(20,40,80,.3); max-height:100%; overflow:auto}
.sheet h3{margin:0; font-family:var(--hand); font-weight:600; font-size:18px; letter-spacing:.1em}
.sheet p{margin:0; font-size:13px; color:var(--ink2); line-height:1.8; white-space:pre-line}
.sheet .pic{border-radius:14px; overflow:hidden; aspect-ratio:1}
.sheet .pic svg{width:100%;height:100%;display:block}
.toast{position:absolute; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:13px; padding:10px 18px; border-radius:99px; z-index:20; animation:fade .3s both; white-space:nowrap}

.cloud{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(26px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  .intro-text p{opacity:1}
}
@media (max-height:640px){
  .lead{min-height:0}
  .panel{gap:8px; padding-top:16px}
  .rb{width:46px;height:46px}.rb.big{width:56px;height:56px}
}
</style>

========================================================= */
let AC = null, bgmT = null;
function ac(){
  try { if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume(); }
  catch(e){ AC = null; }
  return AC;
}
function note(f, t0, dur, vol, type){
  const o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 2000; o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0 + .03); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(lp); lp.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + .05);
}
function se(k){
  if(!save.se || !ac()) return;
  const t = AC.currentTime;
  if(k === 'step') note(880, t, .12, .04, 'triangle');
  else if(k === 'tap') note(660, t, .1, .03);
  else if(k === 'ok') [523.25,659.25,783.99,1046.5].forEach((f,i) => note(f, t + i*.1, 1.4, .06));
  else if(k === 'ng'){ note(330, t, .35, .05); note(294, t + .14, .5, .045); }
}
const PROG = [[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,392]];
function bgmStart(){
  if(!save.bgm || bgmT || !ac()) return;
  let step = 0;
  const tick = () => {
    const t = AC.currentTime + .05, ch = PROG[Math.floor(step/8) % 4];
    note(ch[[0,2,1,3,2,1,3,2][step % 8]] * 2, t, 1.8, .028);
    if(step % 8 === 0) ch.forEach(f => note(f, t, 5, .014, 'triangle'));
    step++;
  };
  tick(); bgmT = setInterval(tick, 620);
}
function bgmStop(){ clearInterval(bgmT); bgmT = null; }
document.addEventListener('pointerdown', () => { if(save.bgm) bgmStart(); });
document.addEventListener('visibilitychange', () => { if(document.hidden) bgmStop(); });

function skyline(r, base, color, op, hmin, hmax, win){
  let s = '', w2 = '', x = -70;
  while(x < 440){
    const w = 10 + r()*22, h = hmin + r()*(hmax - hmin);
    s += `<rect x="${f1(x)}" y="${f1(base-h)}" width="${f1(w)}" height="${f1(h+3)}"/>`;
    if(r() < .22) s += `<rect x="${f1(x+w/2-1)}" y="${f1(base-h-9)}" width="2" height="9"/>`;
    if(win) for(let k=0;k<3;k++) if(r() < .5) w2 += `<rect x="${f1(x+2+r()*(w-5))}" y="${f1(base-h+4+r()*(h-8))}" width="2" height="2"/>`;
    x += w + r()*3;
  }
  return `<g fill="${color}" opacity="${op}">${s}</g>` + (w2 ? `<g fill="#ffe2a8" opacity=".85">${w2}</g>` : '');
}
function clouds(r, n = 4){
  let s = '';

  return `<g fill="#fff" class="cloud">${s}</g>`;
}

    <path d="M-600 300L1000 170" stroke="#f7f7f7" stroke-width="3"/>${Array.from({length:10},(_,i)=>{const x=-100+i*60, y=300-(x+600)*130/1600; return `<path d="M${x} ${f1(y)}v${16}" stroke="#e8e8ea" stroke-width="3"/>`;}).join('')}`;
  if(sc === 'harbor') return `<rect x="-600" y="232" width="1600" height="900" fill="#b8b2c3"/><path d="M-600 212H1000M-600 224H1000" stroke="#5f5d7c" stroke-width="2.5"/>

}

function face(hy, e, L){
  const y = hy + 2, c = '#3b2f2c';
  let s = '';
  const eye = (x, dy = 0) => `<ellipse cx="${x}" cy="${y+dy}" rx="1.9" ry="2.6" fill="${c}"/><circle cx="${x+.6}" cy="${y+dy-1}" r=".7" fill="#fff"/>`;
  if(e === 'soft' || e === 'happy') s += `<ellipse cx="-9" cy="${y+5}" rx="3" ry="1.6" fill="#f2a3a0" opacity=".5"/><ellipse cx="9" cy="${y+5}" rx="3" ry="1.6" fill="#f2a3a0" opacity=".5"/>`;
  if(e === 'happy'){
    s += `<path d="M-7.5 ${y+.5}Q-5.5 ${y-2.6} -3.5 ${y+.5}M3.5 ${y+.5}Q5.5 ${y-2.6} 7.5 ${y+.5}" stroke="${c}" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M-3.4 ${y+5.4}Q0 ${y+10.5} 3.4 ${y+5.4}Z" fill="#c9656b"/>`;
  } else if(e === 'sad'){
    s += eye(-5.5, 1) + eye(5.5, 1) + `<path d="M-8 ${y-5.5}L-3.5 ${y-4}M8 ${y-5.5}L3.5 ${y-4}" stroke="${c}" stroke-width="1" stroke-linecap="round"/><path d="M-2.5 ${y+8}Q0 ${y+6.4} 2.5 ${y+8}" stroke="${c}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  } else if(e === 'uneasy'){
    s += eye(-5.5) + eye(5.5) + `<path d="M-8 ${y-4.5}L-3.5 ${y-6}M8 ${y-4.5}L3.5 ${y-6}" stroke="${c}" stroke-width="1" stroke-linecap="round"/><path d="M-3 ${y+7}q1.5 -1.4 3 0t3 0" stroke="${c}" stroke-width="1.1" fill="none" stroke-linecap="round"/><path d="M13 ${y-7}q2.4 3.4 0 4.6q-2.4 -1.2 0 -4.6z" fill="#bfe0f5"/>`;
  } else {
    s += eye(-5.5) + eye(5.5);
    s += e === 'soft'
      ? `<path d="M-2.6 ${y+6.2}Q0 ${y+8.4} 2.6 ${y+6.2}" stroke="${c}" stroke-width="1.1" fill="none" stroke-linecap="round"/>`
      : `<path d="M-2.2 ${y+7}H2.2" stroke="${c}" stroke-width="1.1" stroke-linecap="round"/>`;
  }
  if(L.glasses) s += `<g stroke="#2a2630" stroke-width=".9" fill="rgba(255,255,255,.15)"><circle cx="-5.6" cy="${y}" r="4.2"/><circle cx="5.6" cy="${y}" r="4.2"/><path d="M-1.4 ${y}H1.4" fill="none"/></g>`;
  return s;
}

function person(L, o){
  const sit = o.pose === 'sit', hy = sit ? -80 : -100;
  const skin = '#f7dccb', hc = L.hc, top = L.top, top2 = L.top2, bot = L.bottom, shoe = '#f3f1ee';
  const y0 = sit ? -66 : -86, y1 = sit ? -26 : -44;
  let s = '';
  // 後ろ髪
  if(L.hair === 'bob') s += `<path d="M-18 ${hy}Q-19 ${hy-20} 0 ${hy-20}Q19 ${hy-20} 18 ${hy}L19 ${hy+15}Q11 ${hy+18} 8 ${hy+12}H-8Q-11 ${hy+18} -19 ${hy+15}Z" fill="${hc}"/>`;
  if(L.hair === 'long') s += `<path d="M-18 ${hy}Q-19 ${hy-20} 0 ${hy-20}Q19 ${hy-20} 18 ${hy}L21 ${hy+36}Q10 ${hy+40} 8 ${hy+30}H-8Q-10 ${hy+40} -21 ${hy+36}Z" fill="${hc}"/>`;
  if(L.hair === 'pony') s += `<ellipse cx="17" cy="${hy+2}" rx="6" ry="15" transform="rotate(-18 17 ${hy+2})" fill="${hc}"/>`;
  // 脚
  if(sit){
    s += `<rect x="-13" y="-30" width="26" height="14" rx="6" fill="${bot}"/><rect x="-11" y="-20" width="8" height="18" rx="3" fill="${bot}"/><rect x="3" y="-20" width="8" height="18" rx="3" fill="${bot}"/>
    <ellipse cx="-7" cy="-2" rx="6" ry="3" fill="${shoe}"/><ellipse cx="7" cy="-2" rx="6" ry="3" fill="${shoe}"/>`;
  } else {
    s += `<rect x="-10" y="-48" width="9" height="45" rx="3.5" fill="${bot}"/><rect x="1" y="-48" width="9" height="45" rx="3.5" fill="${bot}"/>
    <ellipse cx="-6" cy="-2" rx="6.5" ry="3" fill="${shoe}"/><ellipse cx="6" cy="-2" rx="6.5" ry="3" fill="${shoe}"/>`;
  }
  // 体
  s += `<rect x="-4" y="${y0-7}" width="8" height="9" fill="#efcdb8"/>
  <path d="M-17 ${y1}Q-19 ${y0+8} -12 ${y0}H12Q19 ${y0+8} 17 ${y1}Z" fill="${top}"/>
  <path d="M-9 ${y0}Q0 ${y0+7} 9 ${y0}" stroke="${top2}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M-14 ${y0+4}Q-21 ${(y0+y1)/2} -16 ${y1-2}M14 ${y0+4}Q21 ${(y0+y1)/2} 16 ${y1-2}" stroke="${top2}" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="-16" cy="${y1-1}" r="3.2" fill="${skin}"/><circle cx="16" cy="${y1-1}" r="3.2" fill="${skin}"/>`;
  // 頭
  s += `<circle cx="0" cy="${hy}" r="15" fill="${skin}"/>` + face(hy, o.expr, L);
  // 前髪
  if(L.hair === 'bob' || L.hair === 'long' || L.hair === 'pony')
    s += `<path d="M-16 ${hy+3}Q-18 ${hy-18} 0 ${hy-18}Q18 ${hy-18} 16 ${hy+3}Q12 ${hy-6} 6 ${hy-7}Q2 ${hy-4} -2 ${hy-8}Q-8 ${hy-5} -12 ${hy-6}Q-15 ${hy-3} -16 ${hy+3}Z" fill="${hc}"/>`;
  else if(L.hair === 'short' || L.hair === 'cap')
    s += `<path d="M-16 ${hy+1}Q-17 ${hy-19} 0 ${hy-19}Q17 ${hy-19} 16 ${hy+1}Q13 ${hy-8} 8 ${hy-6}Q4 ${hy-10} 0 ${hy-6}Q-5 ${hy-10} -9 ${hy-5}Q-13 ${hy-8} -16 ${hy+1}Z" fill="${hc}"/>`;
  if(L.hair === 'cap') s += `<path d="M-16 ${hy-5}Q-15 ${hy-22} 0 ${hy-22}Q15 ${hy-22} 16 ${hy-5}Z" fill="${L.cap}"/><path d="M-17 ${hy-5}Q0 ${hy-9} 23 ${hy-3}" stroke="${L.cap}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="0" cy="${hy-22}" r="1.6" fill="${L.cap}"/>`;
  if(L.hair === 'cap') s += `<path d="M-15 ${y0+2}L-12 ${y1+4}M15 ${y0+2}L12 ${y1+4}" stroke="#d98d6c" stroke-width="2.5"/>`;
  return `<g>${s}</g>`;
}

const PX = 215, PY = 290, ZX = 215, ZY = 250;
const zoomOf = d => .7 + d * .09;

function sceneSVG(s, o){
  const id = 'u' + (++UID), T = TIMES[s.time], r = rng(hash(s.id));
  const sky = `<linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1">${T.sky.map((c,i,a)=>`<stop offset="${f1(i/(a.length-1))}" stop-color="${c}"/>`).join('')}</linearGradient>`;
  const bg = bgOf(s, T, r, id), fg = fgOf(s), front = frontOf(s);
  const tint = T.tint && s.scene !== 'library' ? `<rect x="0" y="0" width="360" height="380" fill="${T.tint}" opacity=".1"/>` : '';
  const k = s.kid ? .78 : 1;
  const label = `${s.name}の${s.who}`;
  if(o.mode === 'portrait'){
    return `<svg viewBox="0 0 360 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}"><defs>${sky}<filter id="${id}b" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
      <g filter="url(#${id}b)"><g transform="translate(${ZX} ${ZY}) scale(1.6) translate(${-ZX} ${-ZY})">${bg}${fg}</g></g>${tint}
      <rect x="0" y="0" width="360" height="380" fill="#fff" opacity=".08"/>
      <g transform="translate(180 470) scale(3.2)">${person(s.look, {pose:'stand', expr:o.expr})}</g></svg>`;
  }
  if(o.mode === 'thumb' || o.mode === 'square' || o.mode === 'wide'){
    const vb = o.mode === 'square' ? '95 155 240 240' : o.mode === 'wide' ? '30 150 320 180' : '70 150 280 210';
    return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}"><defs>${sky}</defs>${bg}
      <g transform="translate(${ZX} ${ZY}) scale(1.15) translate(${-ZX} ${-ZY})">${fg}<g transform="translate(${PX} ${PY}) scale(${k})">${person(s.look, {pose:s.pose, expr:'happy'})}</g>${front}</g>${tint}</svg>`;
  }
  // play
  return `<svg viewBox="0 0 360 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${label}"><defs>${sky}</defs>
    <g id="bgL" class="zl">${bg}</g>
    <g id="fgL" class="zl">${fg}<g id="ptnWrap" class="pw" style="transform-origin:${PX}px ${PY}px"><g transform="translate(${PX} ${PY}) scale(${k})"><g id="ptn"></g></g></g>${front}</g>
    ${tint}
    <g id="me" class="zl"><g transform="translate(70 386)">${meBack()}</g></g></svg>`;
}

    <div class="tut-fig">${tutFig(p.fig)}</div>
    <p>${esc(p.t)}</p><p>${esc(p.s)}</p>
    <div class="dots">${TUT.map((_,k) => `<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <button class="primary ${last ? '' : 'soft'}" data-act="tut" data-arg="${i+1}">${last ? 'はじめる' : '次へ'}</button>`, 'tut');
}

function scrMap(){
  const n = clearedCount();
  const next = STAGES.findIndex((s,i) => unlocked(i) && !save.cleared[s.id]);
  const items = STAGES.map((s,i) => {
    if(!unlocked(i)) return `<div class="stage locked" aria-label="まだ行けない場所"><div class="thumb"></div><div class="st-txt"><b>？？？</b><small><i></i>？？？</small></div><span class="mark">${ic('lock')}</span></div>`;
    const c = save.cleared[s.id];
    return `<button class="stage ${c?'done':''}" data-act="play" data-arg="${i}"><div class="thumb">${sceneSVG(s,{mode:'thumb'})}</div>
      <div class="st-txt"><b>${esc(s.name)}</b><small><i></i>${esc(s.tag)}</small></div>${c ? `<span class="mark">${ic('check')}</span>` : i === next ? '<span class="new">NEW</span>' : '<span></span>'}</button>`;
  }).join('');
  show('map', `<header class="mhead"><div><small>STAGE SELECT</small><h2>はじまりの街</h2></div><span class="badge" aria-label="${n}人と出会った">${ic('map').replace('class="ic"','class="ic" style="width:14px;height:14px"')}${n}/${STAGES.length}</span></header>
    <div class="list">${items}</div>
    ${n === STAGES.length ? `<div class="map-foot"><button class="wide" data-act="ending">エンディングをもう一度見る</button></div>` : ''}
    ${nav('map')}`, 'paper');
}

/* ---------- プレイ ---------- */
let P = null;
function status(s, d){
  const [lo, hi] = s.range;
  if(d < lo - 2) return {key:'tooFar', expr:'neutral', text:'遠すぎて、こちらに気づいていないみたい。'};
  if(d < lo)     return {key:'far', expr:'neutral', text:s.far};
  if(d <= hi)    return {key:'ok', expr:'soft', text:s.ok};
  if(d <= hi + 2) return {key:'near', expr:'uneasy', text:s.near};
  return {key:'tooNear', expr:'uneasy', text:'近すぎる。相手が身を引いている。'};
}
function startStage(i){
  P = {i, s:STAGES[i], d:0, tries:0, phase:'approach', wrong:new Set(), expr:'soft', bubble:null, note:null};
  scrPlay();
}
function scrPlay(){
  const s = P.s;
  show('play', `<div class="scene">${sceneSVG(s,{mode:'play'})}
      <div class="topbar"><button class="ib" data-act="map" aria-label="マップにもどる">${ic('back')}</button><span class="nm">${esc(s.name)}</span><button class="ib" data-act="pause" aria-label="一時停止">${ic('pause')}</button></div>
      <div class="glow" id="glow" hidden>よかった、この距離で。</div></div>
    <div class="panel">
      <p class="lead" id="lead">${esc(s.intro)}</p>
      <p class="hint" id="hint"></p>
      <div class="meter"><span class="ep">遠い</span><input type="range" id="dist" min="0" max="10" step="1" value="${P.d}" aria-label="相手との距離（右ほど近い）"><span class="ep">近い</span></div>
      <div class="ctrls"><button class="rb" data-act="step" data-arg="-1" aria-label="はなれる">‹</button><button class="rb big" id="decideBtn" data-act="decide" aria-label="この距離にきめる">${FEET}</button><button class="rb" data-act="step" data-arg="1" aria-label="近づく">›</button></div>
      <p class="cap">足あとボタンで、この距離にきめる</p>
    </div>`, 'play');
  $('#dist').addEventListener('input', e => setD(+e.target.value));
  updateScene();
}
function updateScene(){
  const s = P.s, d = P.d, st = status(s, d), z = zoomOf(d);
  const bs = 1 + d * .035;
  $('#bgL').style.transform = `translate(${ZX}px,${ZY}px) scale(${bs}) translate(${-ZX}px,${-ZY}px)`;
  $('#fgL').style.transform = `translate(${ZX}px,${ZY}px) scale(${z}) translate(${-ZX}px,${-ZY}px)`;
  $('#me').style.transform = `translateX(${d*3}px)`;
  $('#ptnWrap').style.transform = st.key === 'tooNear' ? 'translateX(9px) rotate(5deg)' : st.key === 'near' ? 'translateX(4px) rotate(2deg)' : 'none';
  $('#ptn').innerHTML = person(s.look, {pose:s.pose, expr:st.expr});
  const h = $('#hint'); h.textContent = st.text; h.dataset.k = st.key;
}
function setD(v){
  if(!P || P.phase !== 'approach' || screen !== 'play') return;
  v = Math.max(0, Math.min(10, v));
  const r = $('#dist');
  if(v === P.d){ if(r) r.value = v; return; }
  P.d = v; se('step'); if(r) r.value = v;
  updateScene();
}
function decide(){
  if(!P || P.phase !== 'approach') return;
  const st = status(P.s, P.d);
  if(st.key === 'ok'){
    P.phase = 'glow'; se('ok');
    $('#glow').hidden = false;
    setTimeout(() => { if(P && P.phase === 'glow'){ P.phase = 'talk'; scrTalk(); } }, 2300);
  } else {
    P.tries++; se('ng');
    const far = st.key === 'far' || st.key === 'tooFar';
    $('#lead').textContent = far ? 'まだ、声をかけるには遠いみたい。\nもう少し近づいてみよう。' : '近づきすぎたかもしれない。\n少し、はなれてみよう。';
    const b = $('#decideBtn'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }
}

function scrTalk(still){
  const s = P.s;
  show('talk', `<div class="scene">${sceneSVG(s,{mode:'portrait', expr:P.expr})}
      <div class="topbar"><button class="ib" data-act="map" aria-label="マップにもどる">${ic('back')}</button><span class="nm">${esc(s.name)}</span></div>
      <div class="bubble">${br(P.bubble || s.prompt)}</div></div>
    <div class="panel">
      <p class="note">${br(P.note || s.note)}</p>
      <div class="choices">${s.choices.map((c,k) => `<button class="choice" data-act="choose" data-arg="${k}" ${P.wrong.has(k)?'disabled':''}><i></i>${esc(c.t)}</button>`).join('')}</div>
    </div>`, 'play', still);
}
function choose(k){
  if(!P || P.phase !== 'talk') return;
  const c = P.s.choices[k];
  if(c.ok){
    se('ok'); P.phase = 'done';
    const prev = save.cleared[P.s.id];
    save.cleared[P.s.id] = {tries: prev ? Math.min(prev.tries, P.tries) : P.tries};
    persist(); scrResult(c.r);
  } else {
    se('ng'); P.wrong.add(k); P.tries++;
    P.expr = c.e || 'sad'; P.bubble = c.r; P.note = c.m + '\nもう一度、選んでみよう。';
    scrTalk(true);
  }
}
function scrResult(reply){
  const s = P.s;
  show('result', `<div class="scene">${sceneSVG(s,{mode:'portrait', expr:'happy'})}<div class="bubble">${br(reply)}</div></div>
    <div class="panel">
      <p class="glowline">よかった、この距離で。</p>
      <div class="memo"><small><span>${esc(s.date)}の手帳</span><span>はかりなおした回数 ${P.tries}</span></small><p>${br(s.diary)}</p></div>
      <button class="primary" data-act="afterResult">手帳を閉じる</button>
    </div>`, 'play');
}

function scrEnding(){
  show('ending', `<div class="art">${endingArt()}</div>
    <div class="end-wrap"><h2>よかった、<br>この距離で。</h2>
      <div class="end-card">
        <p>近すぎても、遠すぎても、<br>きっとそれは「正解」じゃない。</p>
        <p>大切なのは、<br>その人にとっての<br>ちょうどいい距離を知ること。</p>
        <p>── そして、<br>自分にとっての「ちょうどいい」も。</p>
        <p style="font-size:12px;color:var(--ink2)">人との距離は、きっと、ずっと、変わっていく。</p>
        <button class="primary soft" data-act="home">もう一度はじめる</button>
      </div></div>`, 'ending');
}

/* ---------- アルバム・手帳・設定 ---------- */
let albumTab = 'people', noteTab = 'diary';
function scrAlbum(){
  const tiles = STAGES.map((s,i) => {
    if(!save.cleared[s.id]) return `<div class="tile"><div class="img">？</div>？？？</div>`;
    return `<button class="tile" data-act="view" data-arg="${i}"><div class="img">${sceneSVG(s,{mode: albumTab === 'people' ? 'portrait' : 'square', expr:'happy'}).replace('viewBox="0 0 360 380"','viewBox="60 30 240 240"')}</div>${esc(albumTab === 'people' ? s.who : s.name)}</button>`;
  }).join('');
  show('album', `<header class="mhead"><div><small>ALBUM</small><h2>アルバム</h2></div><span class="badge">${clearedCount()}/${STAGES.length}</span></header>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="${albumTab==='people'}" class="${albumTab==='people'?'on':''}" data-act="atab" data-arg="people">出会った人</button><button role="tab" aria-selected="${albumTab==='scenes'}" class="${albumTab==='scenes'?'on':''}" data-act="atab" data-arg="scenes">名場面</button></div>
    <div class="list"><div class="grid">${tiles}</div></div>${nav('album')}`, 'paper', true);
}
function viewer(i){
  const s = STAGES[i];
  modal(`<div class="pic">${sceneSVG(s,{mode: albumTab === 'people' ? 'portrait' : 'square', expr:'happy'}).replace('viewBox="0 0 360 380"','viewBox="60 30 240 240"')}</div>
    <h3>${esc(albumTab === 'people' ? s.who : s.name)}</h3><p>${esc(s.name)}・${esc(s.tag)}\n「${esc(s.word)}」</p>
    <button class="primary soft" data-act="close">閉じる</button>`);
}
function scrNote(){
  const got = STAGES.filter(s => save.cleared[s.id]);
  let body;
  if(!got.length) body = `<p class="empty">まだ何も書かれていない。<br>街へ出かけてみよう。</p>`;
  else if(noteTab === 'diary') body = got.map(s => `<article class="diary"><div class="dt"><span>${esc(s.date)}</span><span>${esc(s.name)}</span></div><p>${br(s.diary)}</p><div class="pic">${sceneSVG(s,{mode:'wide'})}</div></article>`).join('');
  else body = got.map(s => `<div class="word">「${br(s.word)}」<small>${esc(s.who)}／${esc(s.name)}</small></div>`).join('');
  show('notebook', `<header class="mhead"><div><small>NOTEBOOK</small><h2>手帳</h2></div></header>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="${noteTab==='diary'}" class="${noteTab==='diary'?'on':''}" data-act="ntab" data-arg="diary">日記</button><button role="tab" aria-selected="${noteTab==='words'}" class="${noteTab==='words'?'on':''}" data-act="ntab" data-arg="words">心に残った言葉</button></div>
    <div class="list">${body}</div>${nav('notebook')}`, 'paper', true);
}
function scrSettings(still){
  const tg = (k, label, i) => `<button class="row" data-act="toggle" data-arg="${k}" aria-pressed="${!!save[k]}">${ic(i)}<span>${label}</span><i class="sw"></i></button>`;
  show('settings', `<header class="mhead"><div><small>SETTINGS</small><h2>設定</h2></div></header>
    <div class="list"><div class="set">
      ${tg('bgm','BGM','music')}${tg('se','効果音','sound')}
      <button class="row" data-act="howto">${ic('pad')}<span>操作方法</span><b class="chev">›</b></button>
      <div class="row">${ic('globe')}<span>言語</span><em>日本語</em></div>
      <button class="row" data-act="reset">${ic('reset')}<span>データの初期化</span><b class="chev">›</b></button>
    </div></div>${nav('settings')}`, 'paper', still);
}

/* ---------- モーダル ---------- */
let pendingOk = null;
function modal(html){
  closeModal();
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
  m.innerHTML = `<div class="sheet">${html}</div>`;
  m.addEventListener('click', e => { if(e.target === m) closeModal(); });
  phone.appendChild(m);
  const f = m.querySelector('button'); if(f) f.focus();
}
function closeModal(){ const m = phone.querySelector('.modal'); if(m) m.remove(); }
function confirmBox(title, text, okLabel, fn){
  pendingOk = fn;
  modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><button class="primary" data-act="ok">${esc(okLabel)}</button><button class="wide" data-act="close">やめる</button>`);
}
function toast(t){
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; phone.appendChild(d);
  setTimeout(() => d.remove(), 1800);
}

/* =========================================================
   操作
========================================================= */
const A = {
  newgame(){
    const start = () => { save.cleared = {}; save.ended = false; persist(); scrIntro(); };
    if(clearedCount()) confirmBox('最初からはじめますか？', 'これまでのアルバムと手帳の記録は消えます。', '最初からはじめる', start);
    else start();
  },
  continue(){ save.tut ? scrMap() : (tutReturn = 'map', scrTut(0)); },
  introNext(){ if(save.tut) scrMap(); else { tutReturn = 'map'; scrTut(0); } },
  tut(a){ const i = +a; if(i < TUT.length) scrTut(i); else { save.tut = true; persist(); tutReturn === 'settings' ? scrSettings() : scrMap(); } },
  tutSkip(){ save.tut = true; persist(); scrMap(); },
  home(){ closeModal(); P = null; scrTitle(); },
  map(){ closeModal(); P = null; scrMap(); },
  album(){ scrAlbum(); }, notebook(){ scrNote(); }, settings(){ scrSettings(); },
  atab(a){ albumTab = a; scrAlbum(); }, ntab(a){ noteTab = a; scrNote(); },
  view(a){ viewer(+a); }, close(){ closeModal(); },
  play(a){ startStage(+a); },
  step(a){ if(P) setD(P.d + (+a)); },
  decide(){ decide(); },
  pause(){ modal(`<h3>ひと休み</h3><p>${esc(P ? P.s.name : '')}</p><button class="primary" data-act="close">つづける</button><button class="wide" data-act="howtoPlay">操作方法</button><button class="wide" data-act="map">マップにもどる</button>`); },
  howtoPlay(){ modal(`<h3>操作方法</h3><p>‹ › ボタン、スライダー、\nキーボードの ← → で距離を調整。\n\n相手の表情と、下のひとことをよく見て、\nちょうどいいと思ったら足あとボタン\n（Enter / スペース）で決定。</p><button class="primary soft" data-act="close">もどる</button>`); },
  choose(a){ choose(+a); },
  afterResult(){
    P = null;
    if(clearedCount() === STAGES.length && !save.ended){ save.ended = true; persist(); scrEnding(); }
    else scrMap();
  },
  ending(){ scrEnding(); },
  toggle(a){ save[a] = !save[a]; persist(); if(a === 'bgm'){ save.bgm ? bgmStart() : bgmStop(); } scrSettings(true); },
  howto(){ tutReturn = 'settings'; scrTut(0); },
  reset(){ confirmBox('データを初期化しますか？', 'アルバム・手帳・進行状況がすべて消えます。', '初期化する', () => { save.cleared = {}; save.ended = false; save.tut = false; persist(); scrSettings(true); toast('記録を消しました'); }); },
  ok(){ const f = pendingOk; pendingOk = null; closeModal(); if(f) f(); },
};
const SILENT = new Set(['step','decide','choose','toggle','ok']);
phone.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const f = A[b.dataset.act];
  if(!f) return;
  if(!SILENT.has(b.dataset.act)) se('tap');
  f(b.dataset.arg);
});
document.addEventListener('keydown', e => {
  if(screen !== 'play' || !P || phone.querySelector('.modal')) return;
  if(e.target && e.target.id === 'dist' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); setD(P.d - 1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); setD(P.d + 1); }
  else if((e.key === 'Enter' || e.key === ' ') && !(e.target && e.target.closest && e.target.closest('button'))){ e.preventDefault(); decide(); }
});

scrTitle();
})();
</script>
