<title>よかった、この距離で。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ink:#233a60; --ink2:#5a6e92; --ink3:#93a3bf;
  --accent:#2e5a92; --accent2:#4f7fc0;
  --paper:#f6f9fd; --card:#ffffff; --line:#dde6f2; --mist:#e9f0f9;
  --peach:#f4cdb9; --ground:#dfe9f6;
  --hand:'Klee One','Zen Maru Gothic','Hiragino Maru Gothic ProN',serif;
  --round:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; padding:16px; background:linear-gradient(180deg,#d6e4f5 0%,#eef3fa 60%,#f6e9e2 100%);
  color:var(--ink); font-family:var(--round); display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.phone{
  position:relative; width:100%; max-width:420px; height:100%; max-height:880px; min-height:560px;
  border-radius:30px; overflow:hidden; background:var(--paper);
  border:2px solid #1e3a66; box-shadow:0 24px 60px rgba(35,58,96,.22);
}
.scr{position:absolute; inset:0; display:flex; flex-direction:column; animation:fade .5s ease both}
.scr.still{animation:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ic{width:22px;height:22px;flex:none}

/* ---------- title ---------- */
.title{color:#fff}
.title .art{position:absolute; inset:0}
.title .art svg{width:100%;height:100%;display:block}
.logo-wrap{position:relative; margin-top:16%; padding-inline:40px; display:flex; flex-direction:column; align-items:center; gap:14px}
.logo{margin:0; font-family:var(--hand); font-weight:400; font-size:clamp(38px,11vw,50px); line-height:1.35; letter-spacing:.14em;
  transform:rotate(-7deg); text-shadow:0 2px 18px rgba(30,60,110,.35); display:flex; flex-direction:column}
.logo span:last-child{padding-left:.6em}
.logo-rule{width:62%; height:1px; background:rgba(255,255,255,.8); transform:rotate(-7deg); margin-top:6px}
.logo-sub{font-family:var(--hand); font-size:13px; letter-spacing:.3em; opacity:.9}
.title-menu{position:absolute; left:0; right:0; bottom:9%; display:flex; flex-direction:column; align-items:center; gap:10px}
.title-menu button{background:none; border:0; color:#fff; letter-spacing:.3em; font-size:15px; padding:8px 18px; text-shadow:0 1px 8px rgba(20,40,80,.5)}
.title-menu .tm-main{font-size:17px; letter-spacing:.4em; margin-bottom:10px}
.title-menu .tm-main::before,.title-menu .tm-main::after{content:"—"; margin:0 .6em; opacity:.8}
.title-menu .sub{display:flex;align-items:center;gap:8px;font-size:13px}
.title-menu .sub i{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;display:inline-block}

/* ---------- intro / ending ---------- */
.intro{background:linear-gradient(180deg,#f7f9fd 0%,#eef3fa 55%,#e6eef8 100%)}
.intro .art,.ending .art{position:absolute; inset:0}
.intro .art svg,.ending .art svg{width:100%;height:100%;display:block}
.intro-text{position:relative; padding:18% 34px 0; font-family:var(--hand); font-size:15px; line-height:2.1; letter-spacing:.08em}
.intro-text p{margin:0 0 1.4em; opacity:0; animation:rise 1.2s ease forwards}
@keyframes rise{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.intro-foot{position:absolute; left:28px; right:18px; bottom:22px; display:flex; align-items:center; justify-content:space-between; font-family:var(--hand); font-size:13px; letter-spacing:.12em}
.intro-foot span::before{content:""; display:inline-block; width:30px; height:1px; background:var(--ink); vertical-align:middle; margin-right:12px}
.next{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.8);font-size:20px;display:grid;place-items:center}

.ending{color:var(--ink)}
.end-wrap{position:relative; flex:1; display:flex; flex-direction:column; align-items:center; padding:12% 28px 26px; gap:18px; text-align:center; overflow:auto}
.end-wrap h2{margin:0; font-family:var(--hand); font-weight:400; color:#fff; font-size:34px; line-height:1.4; letter-spacing:.14em; transform:rotate(-5deg); text-shadow:0 2px 14px rgba(40,50,110,.35)}
.end-card{margin-top:auto; background:rgba(255,255,255,.82); backdrop-filter:blur(6px); border-radius:20px; padding:20px 18px; font-family:var(--hand); font-size:14px; line-height:2; letter-spacing:.06em; display:flex; flex-direction:column; gap:14px; width:100%}
.end-card p{margin:0}

/* ---------- paper screens ---------- */
.paper{background:var(--paper)}
.mhead{padding:22px 20px 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#e8f0fa,var(--paper))}
.mhead small{display:block; font-size:10px; letter-spacing:.24em; color:var(--ink3)}
.mhead h2{margin:4px 0 0; font-family:var(--hand); font-weight:600; font-size:21px; letter-spacing:.12em}
.badge{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; font-size:12px; padding:4px 10px; border-radius:99px; font-variant-numeric:tabular-nums}
.list{flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.stage{display:grid; grid-template-columns:104px 1fr auto; align-items:center; gap:14px; padding:8px 14px 8px 8px; border-radius:16px; background:var(--card); border:1px solid var(--line); text-align:left; box-shadow:0 4px 14px rgba(40,70,120,.06)}
.stage:hover{border-color:#b9cbe4}
.stage .thumb{width:104px; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:var(--mist)}
.stage .thumb svg{width:100%;height:100%;display:block}
.st-txt b{display:block; font-weight:500; font-size:15px; letter-spacing:.06em}
.st-txt small{display:flex; align-items:center; gap:6px; margin-top:6px; color:var(--ink2); font-size:12px}
.st-txt small i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink3)}
.stage.done .st-txt small i{background:var(--accent2); border-color:var(--accent2)}
.stage .mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--accent)}
.stage .new{font-size:10px; letter-spacing:.14em; color:#c0664e; border:1px solid #ecc3b5; border-radius:99px; padding:2px 8px}
.stage.locked{opacity:.6; box-shadow:none; background:rgba(255,255,255,.5)}
.stage.locked .thumb{background:linear-gradient(180deg,#e3ebf5,#f3f6fb)}
.map-foot{padding:0 16px 8px}
.wide{width:100%; padding:13px; border-radius:99px; border:1px solid var(--line); background:var(--card); letter-spacing:.14em; font-size:14px}

.nav{display:flex; justify-content:space-around; border-top:1px solid var(--line); background:var(--card); padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink3);padding:6px 8px;letter-spacing:.06em}
.nav button.on{color:var(--accent)}
.nav button.on .ic{stroke-width:2}

.tabs{display:flex; gap:4px; margin:14px 16px 0; background:var(--mist); padding:4px; border-radius:99px}
.tabs button{flex:1; border:0; background:none; padding:8px; border-radius:99px; font-size:13px; color:var(--ink2); letter-spacing:.06em}
.tabs button.on{background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(40,70,120,.1)}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-content:start}
.tile{display:flex; flex-direction:column; gap:6px; background:none; border:0; padding:0; text-align:center; font-size:11px; color:var(--ink2)}
.tile .img{aspect-ratio:1; border-radius:10px; overflow:hidden; background:linear-gradient(180deg,#e3ebf5,#f3f6fb); border:1px solid var(--line); display:grid; place-items:center; color:var(--ink3); font-size:18px}
.tile .img svg{width:100%;height:100%;display:block}
.empty{margin:auto; text-align:center; color:var(--ink2); font-family:var(--hand); line-height:2; font-size:14px; padding:30px 10px}

.diary{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
.diary .dt{font-size:12px; color:var(--ink2); letter-spacing:.1em; display:flex; justify-content:space-between}
.diary p{margin:0; font-family:var(--hand); font-size:15px; line-height:2}
.diary .pic{border-radius:10px; overflow:hidden; aspect-ratio:16/9}
.diary .pic svg{width:100%;height:100%;display:block}
.word{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; font-family:var(--hand); font-size:16px; line-height:1.9}
.word small{display:block; font-family:var(--round); font-size:11px; color:var(--ink3); margin-top:6px; letter-spacing:.08em}

.set{display:flex; flex-direction:column}
.set .row{display:flex; align-items:center; gap:12px; padding:16px 6px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; font-size:14px; width:100%}
.set .row span{flex:1}
.set .row em{font-style:normal; color:var(--ink2); font-size:13px}
.sw{width:42px;height:24px;border-radius:99px;background:#cfd9e7;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.row[aria-pressed="true"] .sw{background:var(--accent2)}
.row[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.chev{color:var(--ink3)}

/* ---------- play ---------- */
.play{background:var(--paper)}
.scene{position:relative; flex:1 1 auto; min-height:180px; overflow:hidden; background:#cfe0f3}
.scene > svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.zl,.pw{transition:transform .7s cubic-bezier(.3,.7,.3,1)}
.topbar{position:absolute; top:12px; left:12px; right:12px; display:flex; align-items:center; gap:10px; color:#fff; text-shadow:0 1px 6px rgba(20,40,80,.45)}
.topbar .nm{flex:1; font-size:14px; letter-spacing:.1em}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:var(--ink);display:grid;place-items:center;text-shadow:none;backdrop-filter:blur(4px)}
.panel{position:relative; flex:none; margin-top:-24px; background:var(--card); border-radius:24px 24px 0 0; padding:20px 20px calc(16px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:12px; box-shadow:0 -10px 30px rgba(40,70,120,.1)}
.lead{margin:0; font-family:var(--hand); font-size:14px; line-height:1.9; letter-spacing:.04em; white-space:pre-line; min-height:3.8em}
.hint{margin:0; font-size:12.5px; color:var(--ink2); display:flex; align-items:center; gap:8px; min-height:1.6em}
.hint::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--ink3); flex:none}
.hint[data-k="ok"]::before{background:#e39a7e}
.hint[data-k="near"]::before,.hint[data-k="tooNear"]::before{background:#8d9cc4}
.meter{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--ink2)}
.meter .ep{display:flex; flex-direction:column; align-items:center; gap:2px; width:28px}
.meter input{flex:1; -webkit-appearance:none; appearance:none; background:none; height:30px; margin:0}
.meter input::-webkit-slider-runnable-track{height:2px; background:var(--ink)}
.meter input::-moz-range-track{height:2px; background:var(--ink)}
.meter input::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 1px var(--accent); margin-top:-8px}
.meter input::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 1px var(--accent)}
.ctrls{display:flex; justify-content:center; align-items:center; gap:26px}
.rb{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(40,70,120,.08);color:var(--ink)}
.rb.big{width:66px;height:66px;color:var(--accent);box-shadow:0 6px 18px rgba(40,70,120,.16)}
.rb:active{transform:scale(.95)}
.cap{margin:0; text-align:center; font-size:11px; color:var(--ink3); letter-spacing:.06em}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.glow{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); white-space:nowrap; font-family:var(--hand); font-size:22px; letter-spacing:.12em; color:var(--ink);
  padding:22px 30px; background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.7) 60%,rgba(255,255,255,0)); text-shadow:0 0 12px #fff; animation:glowIn 2.2s ease both}
@keyframes glowIn{0%{opacity:0; filter:blur(6px)}25%{opacity:1; filter:none}85%{opacity:1}100%{opacity:.95}}

.bubble{position:absolute; left:16px; bottom:40px; max-width:72%; background:#fff; border-radius:16px; padding:14px 16px; font-family:var(--hand); font-size:15px; line-height:1.8; box-shadow:0 6px 20px rgba(40,70,120,.15); animation:rise .5s ease both}
.note{margin:0; font-family:var(--hand); font-size:13.5px; line-height:1.8; color:var(--ink2); white-space:pre-line}
.choices{display:flex; flex-direction:column; gap:10px}
.choice{display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:14px; border:1px solid var(--line); background:#fff; text-align:left; font-size:14px; letter-spacing:.04em; box-shadow:0 2px 8px rgba(40,70,120,.05)}
.choice i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink2);flex:none}
.choice:hover:not(:disabled){border-color:#b9cbe4; background:#fbfdff}
.choice:disabled{opacity:.4; cursor:default; text-decoration:line-through}
.glowline{margin:0; text-align:center; font-family:var(--hand); font-size:19px; letter-spacing:.14em}
.memo{background:var(--mist); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.memo small{font-size:11px; color:var(--ink2); letter-spacing:.1em; display:flex; justify-content:space-between}
.memo p{margin:0; font-family:var(--hand); font-size:14px; line-height:1.9; white-space:pre-line}
.primary{width:100%; padding:14px; border-radius:99px; border:0; background:var(--accent); color:#fff; letter-spacing:.18em; font-size:14px; box-shadow:0 6px 16px rgba(46,90,146,.3)}
.primary.soft{background:#9fb8d9; box-shadow:none}

/* ---------- tutorial ---------- */
.tut{background:var(--paper); padding:20px}
.tut-head{display:flex; align-items:center; gap:10px; font-size:15px; letter-spacing:.1em}
.tut-head button{background:none;border:0;font-size:20px;color:var(--ink2);padding:4px 8px}
.tut-fig{margin:26px 0 20px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:20px; display:grid; place-items:center; aspect-ratio:16/9}
.tut-fig svg{width:100%; height:100%}
.tut p{margin:0 0 12px; font-family:var(--hand); font-size:15px; line-height:2; letter-spacing:.04em}
.dots{display:flex; gap:6px; justify-content:center; margin:auto 0 16px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent2)}

/* ---------- modal ---------- */
.modal{position:absolute; inset:0; background:rgba(28,46,80,.4); display:grid; place-items:center; padding:24px; z-index:10; animation:fade .25s both}
.sheet{width:100%; max-width:340px; background:#fff; border-radius:22px; padding:22px; display:flex; flex-direction:column; gap:12px; text-align:center; box-shadow:0 20px 50px rgba(20,40,80,.3); max-height:100%; overflow:auto}
.sheet h3{margin:0; font-family:var(--hand); font-weight:600; font-size:18px; letter-spacing:.1em}
.sheet p{margin:0; font-size:13px; color:var(--ink2); line-height:1.8; white-space:pre-line}
.sheet .pic{border-radius:14px; overflow:hidden; aspect-ratio:1}
.sheet .pic svg{width:100%;height:100%;display:block}
.toast{position:absolute; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:13px; padding:10px 18px; border-radius:99px; z-index:20; animation:fade .3s both; white-space:nowrap}

.cloud{animation:drift 60s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(26px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  .intro-text p{opacity:1}
}
@media (max-height:640px){
  .lead{min-height:0}
  .panel{gap:8px; padding-top:16px}
  .rb{width:46px;height:46px}.rb.big{width:56px;height:56px}
}
</style>
