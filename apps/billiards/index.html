<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>8 Ball Billiards</title>
<style>
:root{--line:rgba(120,170,255,.28);--text:#eaf2ff;}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;color:var(--text)}
#stage{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:1536px;height:1024px}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.panel{background:linear-gradient(180deg,rgba(16,28,56,.92),rgba(7,13,28,.92));border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07)}
svg{display:block}

/* players */
.pcard{position:absolute;top:14px;height:108px;display:flex;align-items:center;gap:14px;border-radius:60px 20px 20px 60px;padding-right:18px;transition:box-shadow .3s,border-color .3s}
#p1{left:20px;width:350px}
#p2{left:880px;width:250px}
#p1.active{border-color:#4aa3ff;box-shadow:0 0 0 2px rgba(74,163,255,.55),0 0 26px rgba(74,163,255,.6)}
#p2.active{border-color:#ff5466;box-shadow:0 0 0 2px rgba(255,84,102,.55),0 0 26px rgba(255,84,102,.6)}
.avatar{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
#p1 .avatar{width:98px;height:98px;font-size:58px;margin-left:4px;background:radial-gradient(circle at 40% 30%,#4b6fae,#0c1830 75%);border:3px solid #9cc2ff}
#p2 .avatar{width:80px;height:80px;font-size:46px;margin-left:8px;background:radial-gradient(circle at 40% 30%,#a8566a,#2a0c18 75%);border:3px solid #ffb0bb}
.pinfo{flex:1;min-width:0}
.pname{font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:space-between;white-space:nowrap}
.lvrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}
.lv{border:1.5px solid #4aa3ff;border-radius:8px;padding:1px 6px;font-weight:700;background:rgba(20,60,130,.5)}
#p2 .lv{border-color:#ff7a8a;background:rgba(130,20,40,.5)}
.xpbar{width:72px;height:12px;border-radius:6px;background:#0a1226;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a8cff,#5fd0ff);border-radius:6px}
.grp{display:flex;gap:2px;margin-top:7px;height:18px;align-items:center;font-size:12px;opacity:.95}
.mb{width:17px;height:17px;border-radius:50%;background:var(--c);font-size:9px;font-weight:800;font-style:normal;display:flex;align-items:center;justify-content:center;color:#111;
  box-shadow:inset -2px -2px 3px rgba(0,0,0,.4)}
.mb b{background:#fff;border-radius:50%;width:10px;height:10px;display:flex;align-items:center;justify-content:center;font-size:7px}
.mb.st{background:linear-gradient(#f4f2ea 22%,var(--c) 22% 78%,#f4f2ea 78%)}
.mb.gone{opacity:.18}
.open{color:#9fb4d8}

/* score */
#score{position:absolute;left:440px;top:22px;width:432px;height:88px}
.sc{position:absolute;top:0;width:140px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.sc b{font-size:23px}
.sc span{font-size:44px;margin-top:2px}
.you{left:0;background:linear-gradient(180deg,#3d97ff,#0a46c4);clip-path:polygon(16% 0,100% 0,84% 100%,16% 100%,0 50%);filter:drop-shadow(0 0 8px #1c6cff)}
.riv{right:0;background:linear-gradient(180deg,#ff3d52,#a3061a);clip-path:polygon(16% 0,84% 0,100% 50%,84% 100%,0 100%)}
.mid{position:absolute;left:110px;right:110px;top:6px;height:76px;background:linear-gradient(180deg,#152446,#0a1430);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:7px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #cfdaf0;box-sizing:border-box}
.dots i.w0{background:#2f8cff;border-color:#9ccaff}
.dots i.w1{background:#ff3d52;border-color:#ffb0bb}

/* top icons */
#icons{position:absolute;left:1296px;top:22px;width:216px;height:68px;border-radius:34px;display:flex;align-items:center;justify-content:space-around}
.ibtn{background:none;border:0;width:62px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:20px}
.ibtn:active{background:rgba(255,255,255,.08)}

#turn{position:absolute;left:50%;top:124px;transform:translateX(-50%);padding:6px 22px;border-radius:20px;font-size:18px;font-weight:700;background:rgba(5,12,28,.75);border:1px solid var(--line);white-space:nowrap;transition:color .3s}

/* power */
#power{position:absolute;left:26px;top:192px;width:72px;height:498px;border-radius:24px;touch-action:none}
#ppct{position:absolute;top:6px;width:100%;text-align:center;font-size:14px;font-weight:700}
#ptrack{position:absolute;left:21px;top:30px;width:30px;height:452px;border-radius:15px;background:#070b16;box-shadow:inset 0 2px 6px #000;overflow:hidden}
#pfill{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,#ffe066,#ffa52a 45%,#ff3b1f);opacity:.9}
#pcue{position:absolute;left:11px;width:8px;height:560px;top:-120px;border-radius:4px;
  background:linear-gradient(180deg,#f5f2ea 0 2%,#e7c78f 2% 55%,#c9c9c9 55% 57%,#3b1a0d 57% 78%,#c18a2c 78% 80%,#3b1a0d 80% 98%,#111 98%);box-shadow:0 0 4px rgba(0,0,0,.8)}
#power .hint{position:absolute;bottom:-2px;width:100%;text-align:center;font-size:11px;color:#9fb4d8}

/* spin */
#spin{position:absolute;left:24px;top:704px;width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none}
#spinball{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff,#e8e4d8 45%,#9c988c 100%);position:relative;box-shadow:0 4px 10px rgba(0,0,0,.6)}
#spindot{position:absolute;width:16px;height:16px;border-radius:50%;background:#e01c1c;border:3px solid #fff;box-sizing:border-box;left:40px;top:40px;box-shadow:0 0 6px #f33}
#spin .lbl{position:absolute;bottom:-8px;font-size:17px;font-weight:700;text-shadow:0 2px 4px #000}
#spin .ring{position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(160,200,255,.4)}

/* right buttons */
.rbtn{position:absolute;left:1422px;width:90px;height:106px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700}
.rbtn.on{border-color:#39a0ff;box-shadow:0 0 0 2px rgba(57,160,255,.5),0 0 18px rgba(57,160,255,.5)}
.rbtn:active,.tab:active,.bbtn:active{transform:scale(.96)}

/* bottom */
#bottom{position:absolute;left:0;top:860px;width:1536px;height:164px;background:linear-gradient(180deg,rgba(6,11,24,.0),rgba(6,11,24,.92) 18%,#050914);border-top:1px solid rgba(80,140,255,.25)}
.bbtn{position:absolute;top:886px;height:80px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:600}
#back{left:30px;width:74px}
#menuBtn{left:132px;width:160px}
#tabs{position:absolute;left:414px;top:878px;width:692px;height:118px;border-radius:24px;display:flex;gap:10px;padding:10px;box-sizing:border-box}
.tab{flex:1;border-radius:16px;border:1px solid rgba(120,170,255,.2);background:linear-gradient(180deg,#14223f,#0a1328);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:700}
.tab.on{border:2px solid #39a0ff;background:linear-gradient(180deg,#1b56b0,#0c2a62);box-shadow:0 0 18px rgba(57,160,255,.6),inset 0 0 14px rgba(57,160,255,.4)}
.tab small{font-size:12px;color:#a9c4ee;font-weight:600;margin-top:-4px}
#shootWrap{position:absolute;left:1146px;top:870px;width:352px;height:116px;filter:drop-shadow(0 0 14px rgba(40,140,255,.85))}
#shoot{width:100%;height:100%;border:0;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);background:linear-gradient(180deg,#5ab4ff,#1466e6 50%,#0a3fae);display:flex;align-items:center;justify-content:center;gap:26px;font-size:48px;font-weight:800;letter-spacing:4px;text-shadow:0 3px 6px rgba(0,0,0,.45)}
#shoot .cb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff,#e1ddd0 50%,#8f8b80)}
#shoot:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
#shoot:not(:disabled):active{transform:scale(.97)}

/* toast / bubbles */
#toast{position:absolute;left:50%;top:430px;transform:translate(-50%,-50%) scale(.9);padding:16px 34px;border-radius:18px;background:rgba(4,10,24,.88);border:1px solid rgba(120,170,255,.45);font-size:26px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bub{position:absolute;top:128px;padding:10px 18px;border-radius:16px;background:#fff;color:#14203a;font-size:18px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.bub.show{opacity:1}
#bub1{left:110px}#bub2{left:900px}
#chatpop{position:absolute;left:1180px;top:100px;width:320px;border-radius:18px;padding:12px;display:none;flex-wrap:wrap;gap:8px;box-sizing:border-box;z-index:5}
#chatpop.show{display:flex}
#chatpop button{flex:1 1 45%;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:#12224a;font-size:17px}

/* modal */
#modal{position:absolute;inset:0;background:rgba(2,5,12,.72);display:none;align-items:center;justify-content:center;z-index:10;backdrop-filter:blur(3px)}
#modal.show{display:flex}
#modal .box{width:720px;max-height:860px;overflow:auto;border-radius:28px;padding:36px 44px;box-sizing:border-box;text-align:center}
#modal h1{margin:0 0 14px;font-size:46px;letter-spacing:2px;background:linear-gradient(180deg,#fff,#8fc3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#mbody{font-size:20px;line-height:1.6;color:#d3e2fb}
#mbody ul{text-align:left;font-size:17px;line-height:1.7;padding-left:24px;margin:10px 0}
#mbtns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:24px}
.mbtn{min-width:200px;padding:16px 26px;border-radius:16px;border:1px solid rgba(120,170,255,.4);background:linear-gradient(180deg,#1d3466,#0d1a38);font-size:22px;font-weight:700}
.mbtn.pri{background:linear-gradient(180deg,#4aa8ff,#0d55d6);border-color:#8cc8ff}
.seg{display:inline-flex;gap:8px;margin:8px 0}
.seg button{padding:10px 20px;border-radius:12px;border:1px solid var(--line);background:#0f1c3c;font-size:18px}
.seg button.on{background:#1f6be0;border-color:#8cc8ff}
.row{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0;font-size:19px}

#rot{position:fixed;inset:auto 0 0 0;padding:10px;text-align:center;background:rgba(10,20,40,.9);color:#cfe0ff;font:14px sans-serif;display:none;z-index:20}
</style>
</head>
<body>

  <canvas id="cv"></canvas>

  <div id="p1" class="pcard panel">

  <div id="score">

      <div class="pname">Rival001</div>

    </div>

    <button class="ibtn" id="hamBtn" title="メニュー"><svg width="36" height="32" viewBox="0 0 24 20"><rect y="1" width="24" height="3" rx="1.5" fill="#e6eefc"/><rect y="8.5" width="24" height="3" rx="1.5" fill="#e6eefc"/><rect y="16" width="24" height="3" rx="1.5" fill="#e6eefc"/></svg></button>
  </div>
  <div id="chatpop" class="panel"></div>
  <div class="bub" id="bub1"></div><div class="bub" id="bub2"></div>

  <div id="turn">あなたの番です</div>

  <div id="power" class="panel">
    <div id="ppct">50%</div>
    <div id="ptrack"><div id="pfill"></div><div id="pcue"></div></div>
  </div>

  <div id="spin" class="panel">
    <div class="ring"></div>
    <div id="spinball"><div id="spindot"></div></div>
    <div class="lbl">スピン</div>
  </div>

  <button class="rbtn panel" id="hintBtn"><svg width="50" height="44" viewBox="0 0 50 44"><g stroke="rgba(0,0,0,.35)" stroke-width="1"><circle cx="25" cy="9" r="7" fill="#f07a10"/><circle cx="17" cy="22" r="7" fill="#e02020"/><circle cx="33" cy="22" r="7" fill="#f5c400"/><circle cx="9" cy="35" r="7" fill="#e02020"/><circle cx="25" cy="35" r="7" fill="#1d4fd8"/><circle cx="41" cy="35" r="7" fill="#f07a10"/></g></svg>次の手</button>
  <button class="rbtn panel on" id="guideBtn" style="top:396px"><svg width="50" height="44" viewBox="0 0 50 44"><circle cx="20" cy="24" r="14" fill="url(#gb)"/><defs><radialGradient id="gb" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#ddd8cc"/><stop offset="1" stop-color="#8b877c"/></radialGradient></defs><path d="M30 18 L48 4" stroke="#c9934a" stroke-width="4" stroke-linecap="round"/><path d="M30 18 L34 15" stroke="#4d8fe8" stroke-width="4" stroke-linecap="round"/></svg>ガイド</button>
  <button class="rbtn panel" id="viewBtn" style="top:524px"><svg width="46" height="40" viewBox="0 0 24 20"><path d="M12 2C6 2 2 10 2 10s4 8 10 8 10-8 10-8-4-8-10-8z" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="12" cy="10" r="4" fill="#fff"/><circle cx="12" cy="10" r="1.8" fill="#16264a"/></svg>ビュー変更</button>

  <div id="bottom"></div>

  <div id="tabs" class="panel">
    <button class="tab" id="tCue"><svg width="40" height="34" viewBox="0 0 40 34"><path d="M6 30 L34 4" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M30 8 L34 4" stroke="#7fb8ff" stroke-width="4" stroke-linecap="round"/></svg>キュー</button>

    <button class="tab on" id="tFx"><svg width="40" height="34" viewBox="0 0 40 40"><g fill="#fff"><circle cx="20" cy="5" r="3"/><circle cx="20" cy="35" r="3"/><circle cx="5" cy="20" r="3"/><circle cx="35" cy="20" r="3"/><circle cx="9.5" cy="9.5" r="2.4"/><circle cx="30.5" cy="30.5" r="2.4"/><circle cx="30.5" cy="9.5" r="2.4"/><circle cx="9.5" cy="30.5" r="2.4"/><circle cx="20" cy="20" r="4"/></g></svg>エフェクト</button>

  <div id="toast"></div>
