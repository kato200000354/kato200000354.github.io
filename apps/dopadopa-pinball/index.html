<title>ドパドパ ピンボール</title>
<meta name="description" content="光る！鳴る！揺れる！バンパーを叩くたびに音階が上がるコンボ、DOPA!ターゲットでジャックポット点灯、ゲージ満タンでFEVERマルチボール。脳汁ドパドパのネオンピンボール。">
<meta name="theme-color" content="#0a0320">

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#05010f;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#mute{position:fixed;z-index:5;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-size:15px;line-height:1}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(60,10,90,.6),rgba(5,1,15,.9))}
.logo{font-weight:900;line-height:1;font-size:min(15vw,78px);letter-spacing:-.02em;
  background:linear-gradient(90deg,#ff4df0,#ffe14d,#4dfcff,#7dff6a,#ff4df0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #3a0060) drop-shadow(0 0 24px rgba(255,80,240,.6));animation:rb 2.4s linear infinite,logo 1.3s ease-in-out infinite}
.logo small{display:block;font-size:.46em;margin-top:.14em;letter-spacing:.12em}
@keyframes rb{to{background-position:300% 0}}
@keyframes logo{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.06)}}
.how{font-size:14px;line-height:1.8;color:#e9dcff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;max-width:340px;text-align:left}
.how b{color:#ffe14d}
.btn{font-weight:900;font-size:24px;padding:14px 44px;border-radius:999px;background:linear-gradient(180deg,#ff7af5,#c91fd0);box-shadow:0 6px 0 #6a0a78,0 0 30px rgba(255,80,240,.6);animation:pulse 1s ease-in-out infinite}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6a0a78}
@keyframes pulse{50%{transform:scale(1.06)}}
.best{font-size:15px;color:#ffe14d;font-weight:800}
.go{font-weight:900;font-size:min(13vw,60px);color:#fff;text-shadow:0 0 20px #ff4df0,0 4px 0 #6a0a78}
.sc{font-weight:900;font-size:min(12vw,54px);color:#ffe14d;text-shadow:0 0 18px rgba(255,200,40,.8)}
.rec{font-weight:900;font-size:22px;color:#4dfcff;animation:pulse .5s infinite;text-shadow:0 0 14px #4dfcff}
</style>

<body>
<canvas id="cv"></canvas>
<button id="mute" aria-label="音のオン・オフ">🔊</button>

<div class="ov" id="title">
  <div class="logo">ドパドパ<small>PINBALL</small></div>
  <div class="how">
    <b>画面の左半分</b>タップ → 左フリッパー<br>
    <b>画面の右半分</b>タップ → 右フリッパー<br>
    ボール発射は<b>長押し → 離す</b>（強さが変わる）<br>
    <b>DOPA!</b> を全部倒すと<b>ジャックポット</b>点灯 → 左の穴へ！<br>
    ゲージ満タンで<b>FEVER</b>＝マルチボール＆得点2倍<br>
    <span style="opacity:.7">PC：← → キー（Z / M）、発射はスペース</span>
  </div>
  <button class="btn" id="startBtn">スタート</button>
  <div class="best" id="bestT"></div>
</div>

<div class="ov" id="over" hidden>
  <div class="go">GAME OVER</div>
  <div class="sc" id="finalS">0</div>
  <div class="rec" id="newRec" hidden>★ 自己ベスト更新！ ★</div>
  <div class="best" id="bestO"></div>
  <button class="btn" id="againBtn">もう一回！</button>
</div>
