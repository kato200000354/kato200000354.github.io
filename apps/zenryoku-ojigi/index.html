<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>全力おじぎ課長</title>
<meta name="description" content="長押しでおじぎ！お客さまが指定する角度ピッタリで指を離せ。社長は90度、モアイは180度、宇宙人は360度、神は1080度。角度で出世するバカゲー。">
<meta name="theme-color" content="#34495e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#efe6d2;color:#222;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top)) 60px 0 12px;pointer-events:none;display:flex;gap:6px;flex-wrap:wrap;font-weight:900}
.chip{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 12px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
#hScore b{color:#d9480f;font-size:18px}
#hCombo{background:#fff3b0}
#mute{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);font-size:20px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));text-align:center;background:rgba(30,40,60,.78);color:#fff;overflow-y:auto}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.logo{font-size:clamp(34px,10vw,56px);font-weight:900;line-height:1.1;color:#fff;text-shadow:0 4px 0 #c92a2a,0 8px 18px rgba(0,0,0,.4)}
.logo small{display:block;font-size:.38em;color:#ffe066;text-shadow:0 2px 0 #7a4b00;margin-bottom:6px}
.card{background:#fff;color:#333;border-radius:18px;padding:14px 16px;max-width:420px;width:100%;text-align:left;line-height:1.65;font-size:14px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.card h3{font-size:16px;color:#c92a2a;margin-bottom:6px}
.card ul{padding-left:1.2em}
.card b{color:#1c4f8a}
.big{min-width:230px;padding:14px 28px;border-radius:999px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#ff6b6b,#c92a2a);box-shadow:0 6px 0 #7d1a1a;transition:transform .06s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #7d1a1a}
.best{font-size:14px;color:#ffe066;font-weight:800}
.jirei{background:#fffdf5;color:#222;border:3px double #222;max-width:360px;width:100%;padding:16px 18px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.8;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.jirei h2{font-size:26px;letter-spacing:.4em;text-align:center;margin-bottom:6px}
.jirei .r{font-size:22px;font-weight:900;color:#c92a2a;text-align:center;margin:6px 0}
.jirei table{width:100%;font-size:15px;border-collapse:collapse}
.jirei td{padding:2px 0;border-bottom:1px dotted #aaa}
.jirei td:last-child{text-align:right;font-weight:900}
.jirei .hanko{display:inline-block;color:#e03131;border:2px solid #e03131;border-radius:50%;width:46px;height:46px;line-height:42px;text-align:center;font-weight:900;transform:rotate(-12deg);float:right;margin-top:6px;font-size:14px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <span class="chip" id="hScore"><b>0</b> 点</span>
  <span class="chip" id="hCombo" hidden></span>
  <span class="chip" id="hLife"></span>
</div>
<button id="mute" aria-label="音">🔊</button>

<div class="ov" id="title">
  <div class="logo"><small>角度で出世せよ</small>全力<br>おじぎ課長</div>
  <div class="card">
    <h3>あそびかた</h3>
    <ul>
      <li>画面を<b>長押し</b>するとおじぎする。<b>指を離すと止まる</b></li>
      <li>お客さまが言う<b>角度ピッタリ</b>で離せ！</li>
      <li>長押しするほど<b>回転がどんどん速く</b>なる</li>
      <li>社長は90度。だんだん無茶な客が来る（360度とか）</li>
      <li>🚫マークの人には<b>おじぎしちゃダメ</b>。じっと待て</li>
      <li>失敗すると<b>始末書</b>。3枚で左遷</li>
    </ul>
  </div>
  <button class="big" id="bStart">出社する</button>
  <div class="best" id="bestT"></div>
</div>

<div class="ov" id="over" hidden>
  <div class="jirei">
    <h2>辞令</h2>
    <div id="overMsg" style="text-align:center"></div>
    <div class="r" id="overRank"></div>
    <table id="overTbl"></table>
    <span class="hanko">人事</span>
    <div style="clear:both"></div>
  </div>
  <div class="best" id="overBest"></div>
  <button class="big" id="bRetry">もう一度出社する</button>
</div>
