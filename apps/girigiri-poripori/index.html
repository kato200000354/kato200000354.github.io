.pill .lbl,.gapbox .lbl,.mouth .lbl{font-size:10px;opacity:.8;font-weight:800;white-space:nowrap}
#timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
#timer.warn{color:#ff6b6b}
.gapbox{flex:1;text-align:center;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 4px;min-width:0}

#gapv small{font-size:13px;margin-left:2px}
#gapv.micro{font-size:18px;color:#ffd1e3;animation:blink .5s infinite alternate}

.mouth{width:78px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:6px 7px;text-align:center}
.bar{height:12px;border-radius:7px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:#7ee08a;border-radius:7px;transition:background .2s}
#mpct{font-size:11px;font-weight:900;margin-top:2px}
#bubble{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 84px);display:flex;align-items:flex-start;gap:8px}
#bubble .nm{flex:none;background:#ff4f88;font-size:11px;font-weight:900;border-radius:10px;padding:3px 8px;margin-top:6px}
#bubble .tx{background:#fff;color:#3a1830;font-weight:800;font-size:15px;border-radius:14px;padding:8px 12px;position:relative;max-width:calc(100% - 80px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
#bubble .tx:before{content:"";position:absolute;left:-7px;top:12px;border:7px solid transparent;border-right-color:#fff;border-left:0}

#hint{font-weight:900;font-size:15px;background:rgba(0,0,0,.4);border-radius:20px;padding:7px 16px;animation:nudge 1s infinite;white-space:nowrap}
@keyframes nudge{50%{transform:translateX(-8px)}}
#stopBtn{pointer-events:auto;width:100%;max-width:420px;font-size:19px;font-weight:900;padding:15px 10px;border-radius:18px;background:linear-gradient(#ffe066,#ffb703);color:#4a2400;box-shadow:0 5px 0 #b86f00}
#stopBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b86f00}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;text-align:center;pointer-events:none;color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 4px 0 #ff4f88,0 0 20px rgba(0,0,0,.6);width:94%;line-height:1.25}
#toast.show{animation:toast 1.3s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* 画面（タイトル・結果） */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto;touch-action:pan-y}
#title{background:linear-gradient(180deg,rgba(42,15,43,.15) 0%,rgba(42,15,43,.0) 30%,rgba(42,15,43,.9) 62%)}
.logo{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:0;right:0;text-align:center;pointer-events:none}
.logo h1{font-size:44px;font-weight:900;line-height:1.05;color:#fff;-webkit-text-stroke:2px #5a0f35;text-shadow:0 5px 0 #ff4f88,0 9px 0 #5a0f35;letter-spacing:1px}
.logo p{margin-top:12px;font-weight:800;font-size:14px;background:rgba(0,0,0,.35);display:inline-block;padding:4px 12px;border-radius:12px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:18px;padding:12px 14px}
.who{display:flex;align-items:center;gap:10px}

.who b{font-size:20px}
.who span.sub{font-size:12px;opacity:.75}

.how{margin-top:10px;font-size:13px;line-height:1.7;font-weight:500}
.how b{color:#ffe066}
.big{width:100%;max-width:420px;margin-top:12px;font-size:22px;font-weight:900;padding:16px;border-radius:20px;background:linear-gradient(#ff7aa8,#ff3d7a);box-shadow:0 6px 0 #a3164a}

.rval .mm{font-size:12px;opacity:.75;font-weight:800}
.rcmp{margin-top:6px;font-size:14px;font-weight:800;color:#ffd1e3}

<canvas id="cv"></canvas>

  </div>
</div>
<div id="toast"></div>

  </div>
</div>
