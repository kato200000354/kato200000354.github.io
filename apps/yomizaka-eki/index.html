<style>

  #pa { position:fixed; left:16px; right:16px; top:calc(16% + env(safe-area-inset-top)); text-align:center; pointer-events:none; font-size:14px; letter-spacing:.08em; line-height:1.7; color:#cfe0c6; text-shadow:0 0 6px #000,0 0 12px #000; opacity:0; transition:opacity .8s; z-index:6; }

  .ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px 16px; box-sizing:border-box; overflow-y:auto; z-index:10; }

  #title { background:radial-gradient(ellipse at 50% 60%, rgba(0,0,0,.1), rgba(0,0,0,.85)); }
  #title .line { width:min(320px,70vw); height:6px; background:#2f6b4f; margin:0 auto 14px; box-shadow:0 0 12px rgba(47,107,79,.6); }

  .howto b { color:#d9cfbe; font-weight:normal; }
  .warn { font-size:12px; color:#7d746a; margin-top:10px; }
  #best { font-size:13px; color:#bfae8e; margin-top:8px; min-height:1em; }

  #note { background:rgba(0,0,0,.72); pointer-events:auto; }
  #note .paper { background:#e4dcc6; color:#15110e; width:min(520px, 100%); padding:24px 24px 16px; box-sizing:border-box; text-align:left;
    box-shadow:0 0 40px #000; background-image:radial-gradient(ellipse at 20% 30%, rgba(120,90,50,.18), transparent 60%), radial-gradient(ellipse at 80% 85%, rgba(100,60,30,.22), transparent 55%); transform:rotate(-.6deg); max-height:86vh; overflow-y:auto;
    font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif; }
  #note h3 { margin:0 0 12px; font-size:16px; letter-spacing:.1em; border-bottom:1px solid rgba(0,0,0,.25); padding-bottom:8px; }

  #note .body em { font-style:normal; color:#7a0e0a; font-weight:700; }
  #note .btn { color:#2a1a14; background:none; border-color:#6b5a48; display:block; margin:14px auto 0; font-size:15px; padding:8px 26px; }

  #pad { background:rgba(0,0,0,.35); pointer-events:auto; justify-content:flex-end; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  #pad .box { background:rgba(12,16,14,.88); border:1px solid #3c5446; padding:14px 16px 12px; width:min(300px, 92vw); box-sizing:border-box; }
  #pad .t { font-size:12px; color:#8fa596; letter-spacing:.15em; margin-bottom:8px; }
  #padd { font-family:"Consolas","Courier New",monospace; font-size:34px; letter-spacing:.35em; padding-left:.35em; color:#7dff9a; text-shadow:0 0 8px rgba(80,255,120,.5); background:#050806; border:1px solid #233; margin-bottom:10px; height:46px; line-height:46px; }
  #padd.ng { color:#ff5a4a; text-shadow:0 0 8px rgba(255,60,40,.6); }
  #pad .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  #pad .keys button { font:inherit; font-size:20px; padding:10px 0; background:#1b231e; color:#dfe6dd; border:1px solid #3a4a40; cursor:pointer; touch-action:manipulation; }
  #pad .keys button:active { background:#355a43; }
  #pad .known { font-size:12px; color:#a99f86; margin-top:8px; letter-spacing:.1em; }
  @media (max-height:520px) { #pad { padding-bottom:8px; padding-top:8px; } #pad .box { padding:8px 12px; width:min(280px,60vw); } #padd { font-size:24px; height:32px; line-height:32px; margin-bottom:6px; } #pad .keys { gap:4px; } #pad .keys button { font-size:16px; padding:5px 0; } #pad .t, #pad .known { margin:2px 0; } }

  /* 地図：右下に透けて出る。見ながら歩ける */
  #mapv { position:fixed; right:calc(14px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom)); width:min(32vw, 360px); pointer-events:none; opacity:.78; z-index:4; }
  #mapc { display:block; width:100%; height:auto; border-radius:4px; }
  body.touch #mapv { right:calc(14px + env(safe-area-inset-right)); bottom:calc(214px + env(safe-area-inset-bottom)); width:min(56vw, 240px); }
  @media (max-height:520px) { body.touch #mapv { right:calc(196px + env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom)); width:min(30vw, 230px); } }

  #pause, #dead, #win { background:rgba(0,0,0,.84); pointer-events:auto; }
  #pause h2, #dead h2, #win h2 { font-size:clamp(28px, 8vw, 48px); letter-spacing:.3em; padding-left:.3em; margin:0 0 14px; font-weight:700; }
  #dead h2 { color:#a3150f; text-shadow:0 0 20px rgba(160,0,0,.6); }
  #win h2 { color:#dfe6dd; }
  .tip { font-size:14px; color:#a49c90; margin-bottom:20px; line-height:1.9; max-width:480px; white-space:pre-line; }
  .row { display:flex; flex-wrap:wrap; justify-content:center; }
  label.sens { font-size:13px; color:#a49c90; margin:12px 0; display:flex; align-items:center; gap:10px; }

  #touch { position:fixed; inset:0; touch-action:none; z-index:3; }
  #guide, #guidePC { position:fixed; inset:0; pointer-events:none; transition:opacity .8s; z-index:5; }
  #guide.off, #guidePC.off { opacity:0; }
  #guide .gL, #guide .gR { position:absolute; top:44%; width:42%; text-align:center; font-size:15px; line-height:1.6; color:rgba(240,230,210,.88); text-shadow:0 0 6px #000; }
  #guide .gL { left:2%; border-right:1px dashed rgba(240,230,210,.25); }
  #guide .gR { right:2%; }
  #guide b { font-size:20px; letter-spacing:.2em; }
  #guide .gU { position:absolute; right:calc(18px + env(safe-area-inset-right)); bottom:calc(200px + env(safe-area-inset-bottom)); font-size:13px; text-align:right; color:rgba(240,230,210,.85); text-shadow:0 0 6px #000; line-height:1.6; }
  #guidePC .box { position:absolute; left:50%; bottom:13%; transform:translateX(-50%); background:rgba(0,0,0,.45); border:1px solid rgba(240,230,210,.18); padding:12px 20px; font-size:14px; line-height:2; color:rgba(240,230,210,.9); white-space:nowrap; text-align:center; }
  #guidePC kbd { font-family:inherit; border:1px solid rgba(240,230,210,.5); border-radius:3px; padding:0 6px; margin:0 2px; font-size:13px; }
  #joy { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); display:none; pointer-events:none; }

  #tRun { right:calc(112px + env(safe-area-inset-right)); bottom:calc(40px + env(safe-area-inset-bottom)); }
  #tCrouch { right:calc(24px + env(safe-area-inset-right)); bottom:calc(30px + env(safe-area-inset-bottom)); }
  #tLight { right:calc(112px + env(safe-area-inset-right)); bottom:calc(126px + env(safe-area-inset-bottom)); width:54px; height:54px; }

<canvas id="c"></canvas>
<canvas id="grain" width="320" height="200"></canvas>
<div id="slats" class="hidden"></div>
<div id="vig"></div><div id="redv"></div><div id="flash"></div>

  <div class="tl"><div id="obj"></div><div id="inv"></div></div>

  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="stam"><i></i></div>
</div>
<div id="msg"></div>
<div id="pa"></div>

<div id="touch" class="hidden">
  <div id="joy"><i></i></div>
  <button class="tb big" id="tUse">調べる</button>
  <button class="tb big" id="tRun">走る</button>
  <button class="tb" id="tCrouch">しゃがむ</button>
  <button class="tb on" id="tLight">ライト</button>
  <button class="tb" id="tMap">地図</button>
  <button class="tb" id="tPause">Ⅱ</button>
</div>
<div id="guide" class="off"><div class="gL">左側をなぞって<br><b>移動</b></div><div class="gR">右側をなぞって<br><b>見回す</b></div><div class="gU">光っている物に近づいて<br><b style="font-size:15px">［調べる］</b>を押す</div></div>
<div id="guidePC" class="off"><div class="box"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動　<kbd>マウス</kbd> 見回す　<kbd>E</kbd> 調べる<br><kbd>Shift</kbd> 走る　<kbd>C</kbd> しゃがむ　<kbd>F</kbd> ライト　<kbd>M</kbd> 地図</div></div>

<div id="note" class="ov hidden"><div class="paper"><h3></h3><div class="body"></div><button class="btn" id="noteClose">閉じる</button></div></div>
<div id="pad" class="ov hidden"><div class="box">
  <div class="t">非常用シャッター　暗証番号</div>
  <div id="padd">____</div>
  <div class="keys"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button data-k="del">消す</button><button>0</button><button data-k="close">離れる</button></div>
  <div class="known" id="padKnown"></div>
</div></div>
<div id="mapv" class="hidden"><canvas id="mapc" width="640" height="470"></canvas></div>

<div id="title" class="ov">
  <div class="line"></div>
  <h1>夜見坂駅</h1>
  <div class="kana">よ み ざ か</div>
  <div class="sub">― 終電のあと ―</div>
  <button class="btn" id="startBtn">目をさます</button>
  <div id="best"></div>
  <div class="howto" id="howto"></div>
  <div class="warn">ヘッドホン推奨 ／ 突然大きな音が出ます</div>
</div>
<div id="pause" class="ov hidden">
  <h2>一時停止</h2>
  <label class="sens">視点の感度 <input type="range" id="sens" min="0.3" max="2.5" step="0.1" value="1"></label>
  <div class="row"><button class="btn" id="resumeBtn">つづける</button><button class="btn" id="quitBtn">タイトルへ</button></div>
</div>
<div id="dead" class="ov hidden">
  <h2>みつかった</h2>
  <div class="tip" id="deadTip"></div>
  <div class="row"><button class="btn" id="retryBtn">もう一度</button><button class="btn" id="quit2Btn">タイトルへ</button></div>
</div>
<div id="win" class="ov hidden">
  <h2>脱出</h2>
  <div class="tip" id="winText"></div>
  <div class="row"><button class="btn" id="againBtn">もう一度</button><button class="btn" id="quit3Btn">タイトルへ</button></div>
</div>
<div id="black"></div>
