<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>車の上のバイクの上のチャリ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#7cc4f0;color:#fff;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#controls{position:fixed;left:0;right:0;bottom:0;height:140px;padding:0 10px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.bal{display:flex;gap:6px}
.btn{pointer-events:auto;touch-action:none;border:none;color:#fff;font-weight:900;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .05s}
.btn.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.25)}
.lr{width:60px;height:96px;border-radius:16px;background:#3d6fd9;font-size:30px}
.lr small{font-size:10px;margin-top:2px;opacity:.85}
#pedal{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff8a3d,#e0400f);font-size:26px;border:4px solid #fff3}
#pedal small{font-size:11px;opacity:.9}
#mute{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,.35);font-size:20px;pointer-events:auto}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,10,30,.45);z-index:5}
.card{width:100%;max-width:400px;max-height:100%;overflow:auto;background:#fffdf4;color:#222;border-radius:22px;padding:22px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);border:4px solid #222}
.card h1{font-size:25px;line-height:1.25;margin-bottom:4px;color:#e0400f;text-shadow:2px 2px 0 #ffd400}
.card .sub{font-size:13px;color:#666;margin-bottom:14px}
.card ul{list-style:none;text-align:left;font-size:14px;line-height:1.6;background:#f1ecd9;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.card ul li{padding-left:1.2em;text-indent:-1.2em}
.card ul b{color:#e0400f}
.go{display:block;width:100%;padding:14px;border:none;border-radius:14px;background:#e0400f;color:#fff;font-size:22px;font-weight:900;font-family:inherit;box-shadow:0 5px 0 #8c2808;cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #8c2808}
.best{font-size:13px;color:#555;margin-top:10px}
.big{font-size:48px;font-weight:900;color:#222;line-height:1.1}
.big span{font-size:22px}
.rank{display:inline-block;margin:8px 0 12px;padding:4px 14px;border-radius:20px;background:#222;color:#ffd400;font-weight:900;font-size:17px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;font-size:13px}
.stats div{background:#f1ecd9;border-radius:10px;padding:6px}
.stats b{display:block;font-size:18px}
.newrec{color:#e0400f;font-weight:900;font-size:18px;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.3}}
.tower{font-size:34px;line-height:.9;margin:6px 0 10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="controls">
  <div class="bal">
    <button class="btn lr" id="bl">◀<small>バランス</small></button>
    <button class="btn lr" id="br">▶<small>バランス</small></button>
  </div>
  <button class="btn" id="pedal">こぐ!<small>タイミング</small></button>
</div>
<button class="btn" id="mute" aria-label="音">🔊</button>

<div class="panel" id="title">
  <div class="card">
    <div class="tower">🚴<br>🏍️<br>🚗</div>
    <h1>車の上の<br>バイクの上の<br>チャリ</h1>
    <div class="sub">〜 どこまで行けるか選手権 〜</div>
    <ul>
      <li>● 下のメーターの針が<b>緑のところ</b>に来た瞬間に<b>【こぐ!】</b>。ぴったりだと加速</li>
      <li>● チャリが遅いとフラフラになるので、こぎ続けよう</li>
      <li>● <b>◀ ▶</b>でバランス。<b>突風・カーブ・段差</b>に注意</li>
      <li>● 落ちたら終わり。合計スピードで進んだ距離を競う</li>
      <li>● PC：スペース＝こぐ ／ ← →＝バランス</li>
    </ul>
    <button class="go" id="start">出発!</button>
    <div class="best" id="titleBest"></div>
  </div>
</div>

<div class="panel" id="result" hidden>
  <div class="card">
    <h1>ガッシャーン!!</h1>
    <div class="sub">チャリが落ちた</div>
    <div class="big" id="rDist">0<span>m</span></div>
    <div id="rNew" class="newrec" hidden>★ 自己ベスト更新!! ★</div>
    <div class="rank" id="rRank"></div>
    <div class="stats">
      <div>最高速度<b id="rSpd">0</b></div>
      <div>最大コンボ<b id="rCombo">0</b></div>
      <div>ぴったり回数<b id="rPerf">0</b></div>
      <div>自己ベスト<b id="rBest">0</b></div>
    </div>
    <button class="go" id="retry">もう一回!</button>
  </div>
</div>
