<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>カラフルアイランド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#12357f; --navy2:#1c55c0; --ink:#1a2b55; --yellow:#ffd23a; --yellow2:#ffab00;
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0b2a66; font-family:var(--font); color:var(--ink); overflow:hidden; user-select:none; -webkit-user-select:none; }
  #app { position:relative; width:100%; max-width:480px; height:100dvh; margin:0 auto; overflow:hidden;
    background:linear-gradient(#8fd8ff 0%, #bfeaff 40%, #4bb6ee 41%, #1d7fd6 100%); }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active { display:flex; }
  button { font-family:var(--font); cursor:pointer; }

  /* 共通パーツ */
  .btn { border:none; border-radius:999px; font-weight:900; font-size:22px; padding:14px 28px; letter-spacing:.05em; }
  .btn.yellow { background:linear-gradient(#ffe46b, var(--yellow) 50%, var(--yellow2)); color:var(--navy); box-shadow:0 5px 0 #c77f00, 0 8px 16px #0004; border:3px solid #fff8; }
  .btn.navy { background:linear-gradient(#2b6fe0, var(--navy)); color:#fff; box-shadow:0 5px 0 #0a1f4d, 0 8px 16px #0004; border:3px solid #fff5; }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #0005; }
  .header { display:flex; align-items:center; gap:10px; padding:14px 14px 12px; background:linear-gradient(var(--navy2), var(--navy)); color:#fff; font-weight:900; font-size:19px; box-shadow:0 3px 10px #0004; }
  .header .back { width:38px; height:38px; border-radius:50%; border:none; background:#fff; color:var(--navy); font-size:20px; font-weight:900; }
  .header .ttl { flex:1; text-align:center; margin-right:48px; }
  .panel { background:#fffffff2; border-radius:20px; margin:14px; padding:18px; box-shadow:0 6px 18px #0003; }

  /* タイトル */
  #s-title { align-items:center; justify-content:space-between; padding:28px 16px 22px; }
  .logo { text-align:center; margin-top:6px; }
  .logo .l1, .logo .l2 { font-size:52px; font-weight:900; line-height:1.05; letter-spacing:-.02em; }
  .logo span { -webkit-text-stroke:6px #fff; paint-order:stroke fill; text-shadow:0 5px 0 #1b3f8f, 0 8px 12px #0005; display:inline-block; }
  .logo .sub { display:inline-block; margin-top:10px; background:linear-gradient(#2a67d8,#153f99); color:#fff; font-weight:800; padding:6px 18px; border-radius:999px; border:3px solid #fff; font-size:16px; }
  #titleCv { width:100%; max-width:380px; aspect-ratio: 380/220; }
  .title-bottom { width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .title-bottom .btn.yellow { width:80%; font-size:28px; }
  .subrow { display:flex; gap:8px; width:100%; justify-content:center; }
  .subrow .btn { font-size:15px; padding:10px 14px; flex:1; max-width:140px; }

  /* モード */
  .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 16px; }
  .mode { border:3px solid #fff9; border-radius:20px; padding:18px 10px; color:#fff; text-align:center; box-shadow:0 6px 0 #0003, 0 10px 18px #0003; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .mode:active { transform:translateY(4px); }
  .mode .ic { font-size:40px; line-height:1; }
  .mode b { font-size:18px; }
  .mode small { font-size:11.5px; opacity:.95; line-height:1.4; }
  .m-online { background:linear-gradient(#3f8cff,#1b55c8); }
  .m-friend { background:linear-gradient(#ffc93a,#f59a00); }
  .m-cpu { background:linear-gradient(#4fd264,#1f9a3b); outline:4px solid #fff; }
  .m-search { background:linear-gradient(#a57cff,#6a42d6); }
  .badge-soon { font-size:10px; background:#0005; padding:2px 8px; border-radius:99px; }

  /* ルール */
  #ruleCv { width:100%; border-radius:14px; aspect-ratio: 400/230; display:block; }
  .rule-banner { background:var(--navy); color:#fff; text-align:center; font-weight:900; padding:8px; border-radius:0 0 14px 14px; margin-top:-6px; position:relative; }
  .rule-text { text-align:center; line-height:1.9; font-weight:800; font-size:15px; margin:14px 0 6px; }
  .items { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .item { background:#eaf3ff; border-radius:12px; padding:8px 4px; text-align:center; }
  .item .e { font-size:28px; }
  .item b { display:block; font-size:12px; }
  .item small { font-size:10px; line-height:1.3; display:block; color:#40507a; }

  /* ゲーム */
  #s-game { align-items:center; justify-content:center; background:#1d7fd6; }
  #cv { display:block; touch-action:none; }
  #itemBtn { position:absolute; right:14px; bottom:18px; width:84px; height:84px; border-radius:50%; border:4px solid #fff; background:radial-gradient(#fff, #cfe2ff); box-shadow:0 5px 0 #0a1f4d88, 0 8px 16px #0005; font-size:34px; line-height:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--navy); }
  #itemBtn small { font-size:11px; font-weight:900; margin-top:2px; }
  #itemBtn.empty { opacity:.55; filter:grayscale(1); }
  #quitBtn { position:absolute; left:12px; bottom:18px; border:none; background:#0f2f6bcc; color:#fff; border-radius:999px; padding:8px 14px; font-weight:800; font-size:13px; }

  /* 結果 */
  #s-result { align-items:center; justify-content:center; gap:6px; background:radial-gradient(circle at 50% 35%, #fff7c2 0%, #7fd0ff 45%, #1d7fd6 100%); }
  .rank { font-size:76px; font-weight:900; color:#ffcc1a; -webkit-text-stroke:5px #8a4b00; paint-order:stroke fill; text-shadow:0 6px 0 #5a3000; line-height:1; }
  .rank small { font-size:40px; }
  #resultCv { width:92%; max-width:400px; aspect-ratio:400/250; }
  .ribbon { background:linear-gradient(#2a67d8,#12357f); color:#fff; font-weight:900; font-size:26px; padding:10px 34px; border-radius:12px; border:3px solid #ffd23a; box-shadow:0 6px 14px #0005; margin-top:-24px; position:relative; }
  #resSub { color:#fff; font-weight:800; text-shadow:0 2px 3px #0007; margin:10px 0 14px; }
  .row { display:flex; gap:10px; }
  .row .btn { font-size:18px; padding:12px 20px; }

  /* ランキング・設定 */
  .stat { display:flex; justify-content:space-between; padding:12px 4px; border-bottom:1px solid #dde6f5; font-weight:800; }
  .stat:last-child { border-bottom:none; }
  .stat span:last-child { color:var(--navy2); }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:10px; border-radius:999px; border:2px solid var(--navy2); background:#fff; color:var(--navy2); font-weight:900; font-size:15px; }
  .seg button.on { background:var(--navy2); color:#fff; }
  .set-label { font-weight:900; margin:14px 0 8px; }

  #toast { position:absolute; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); background:#0f2f6bee; color:#fff; padding:12px 18px; border-radius:14px; font-weight:800; font-size:14px; opacity:0; transition:.25s; pointer-events:none; width:max-content; max-width:90%; text-align:center; z-index:10; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section class="screen active" id="s-title">
    <div class="logo">
      <div class="l1"><span style="color:#ff4a3d">カ</span><span style="color:#ff9a1f">ラ</span><span style="color:#ffd21f">フ</span><span style="color:#39c24f">ル</span></div>
      <div class="l2"><span style="color:#2f86ff">ア</span><span style="color:#9a5cff">イ</span><span style="color:#ff5aa8">ラ</span><span style="color:#ff4a3d">ン</span><span style="color:#ffb11f">ド</span></div>
      <div class="sub">〜いろいろきのこサバイバル〜</div>
    </div>
    <canvas id="titleCv"></canvas>
    <div class="title-bottom">
      <button class="btn yellow" id="startBtn">はじめる</button>
      <div class="subrow">
        <button class="btn navy" data-go="s-rule" id="ruleBtn">📖 ルール</button>
        <button class="btn navy" data-go="s-rank">👑 ランキング</button>
        <button class="btn navy" data-go="s-set">⚙️ 設定</button>
      </div>
    </div>
  </section>

  <!-- モード選択 -->
  <section class="screen" id="s-mode">
    <div class="header"><button class="back" data-go="s-title">←</button><div class="ttl">モード選択</div></div>
    <div class="mode-grid">
      <button class="mode m-online" data-soon="オンライン対戦"><div class="ic">👥</div><b>オンライン対戦</b><small>全国のプレイヤーと<br>4人で遊ぶ</small><span class="badge-soon">準備中</span></button>
      <button class="mode m-friend" data-soon="フレンド対戦"><div class="ic">🤝</div><b>フレンド対戦</b><small>ルームを作って<br>友達と遊ぶ</small><span class="badge-soon">準備中</span></button>
      <button class="mode m-cpu" id="cpuBtn"><div class="ic">🤖</div><b>CPU対戦</b><small>コンピューターと<br>遊ぶ</small></button>
      <button class="mode m-search" data-soon="ルーム検索"><div class="ic">🔍</div><b>ルーム検索</b><small>フレンドのルームを<br>探す</small><span class="badge-soon">準備中</span></button>
    </div>
  </section>

  <!-- ルール -->
  <section class="screen" id="s-rule">
    <div class="header"><button class="back" id="ruleBack">←</button><div class="ttl">ルール説明</div></div>
    <div style="flex:1; overflow:auto;">
      <div class="panel">
        <canvas id="ruleCv"></canvas>
        <div class="rule-banner">次のマークの島に移動しよう！</div>
        <p class="rule-text">指定されたマークの島以外は<br>しばらくすると沈んでしまいます。<br>最後まで残った人の勝ちです！</p>
        <div class="items">
          <div class="item"><div class="e">👟</div><b>ダッシュ</b><small>3秒間すばやく移動</small></div>
          <div class="item"><div class="e">🛡️</div><b>バリア</b><small>1回だけ落下を防ぐ</small></div>
          <div class="item"><div class="e">💥</div><b>ふっとばし</b><small>近くの相手を吹き飛ばす</small></div>
          <div class="item"><div class="e">⏳</div><b>スロー</b><small>沈むまでの時間+2秒</small></div>
        </div>
        <p style="text-align:center;font-size:12px;color:#5a6a90;margin:10px 0 0">スワイプ（ドラッグ）で移動／PCは矢印キー・WASD、スペースでアイテム</p>
      </div>
    </div>
    <div style="padding:6px 16px 22px; text-align:center;"><button class="btn yellow" id="ruleStart" style="width:80%">スタート</button></div>
  </section>

  <!-- ゲーム -->
  <section class="screen" id="s-game">
    <canvas id="cv"></canvas>
    <button id="itemBtn" class="empty"><span id="itemIc">？</span><small id="itemName">アイテム</small></button>
    <button id="quitBtn">🏠 やめる</button>
  </section>

  <!-- 結果 -->
  <section class="screen" id="s-result">
    <div class="rank" id="rankTxt">1<small>位</small> 👑</div>
    <canvas id="resultCv"></canvas>
    <div class="ribbon" id="resMsg">あなたの勝ち！</div>
    <div id="resSub"></div>
    <div class="row">
      <button class="btn yellow" id="againBtn">🔄 もう一回!</button>
      <button class="btn navy" data-go="s-title">🏠 ホームへ</button>
    </div>
  </section>

  <!-- ランキング -->
  <section class="screen" id="s-rank">
    <div class="header"><button class="back" data-go="s-title">←</button><div class="ttl">ランキング（自分の記録）</div></div>
    <div class="panel" id="rankPanel"></div>
  </section>

  <!-- 設定 -->
  <section class="screen" id="s-set">
    <div class="header"><button class="back" data-go="s-title">←</button><div class="ttl">設定</div></div>
    <div class="panel">
      <div class="set-label">🔊 サウンド</div>
      <div class="seg" id="segSound"><button data-v="on">ON</button><button data-v="off">OFF</button></div>
      <div class="set-label">🤖 CPUのつよさ</div>
      <div class="seg" id="segDiff"><button data-v="easy">かんたん</button><button data-v="normal">ふつう</button><button data-v="hard">むずかしい</button></div>
    </div>
  </section>

  <div id="toast"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('iroiro_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('iroiro_' + k, JSON.stringify(v)); } catch (e) {} },
};
let settings = Object.assign({ sound:true, diff:'normal' }, store.get('settings', {}));

// ================= データ =================
const MARKS = [
  { id:'star',   name:'ほし',     c:'#e8413c', light:'#ffd9d2' },
  { id:'tri',    name:'さんかく', c:'#23a53f', light:'#cff5d6' },
  { id:'circle', name:'まる',     c:'#2f7fe8', light:'#d3e6ff' },
  { id:'wave',   name:'なみ',     c:'#eda900', light:'#fff1b8' },
  { id:'heart',  name:'ハート',   c:'#e8559c', light:'#ffd9ec' },
  { id:'dia',    name:'ダイヤ',   c:'#8a55d8', light:'#e8dcff' },
];
const CHARS = [
  { label:'1P', name:'あなた',     main:'#e8413c', dark:'#9e1f1b' },
  { label:'2P', name:'プレイヤー2', main:'#2f6fe0', dark:'#173f98' },
  { label:'3P', name:'プレイヤー3', main:'#2fae43', dark:'#176b27' },
  { label:'4P', name:'プレイヤー4', main:'#f4c21b', dark:'#a87a00' },
];
const ITEMS = {
  dash:    { e:'👟', name:'ダッシュ' },
  barrier: { e:'🛡️', name:'バリア' },
  blow:    { e:'💥', name:'ふっとばし' },
  slow:    { e:'⏳', name:'スロー' },
};
const DIFF = {
  easy:   { react:0.95, miss:0.22, speed:0.80, chase:0.3 },
  normal: { react:0.55, miss:0.10, speed:0.92, chase:0.6 },
  hard:   { react:0.28, miss:0.03, speed:1.00, chase:0.9 },
};
const W = 480, H = 720, RX = 66, RY = 42, PR = 13, SINK_T = 1.8;
const ISLAND_POS = [ [130,245], [352,238], [242,352], [108,468], [376,468], [242,590] ];

// ================= 音 =================
let ac = null;
function initAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) {} }
function tone(f, d, type = 'square', v = 0.06, delay = 0) {
  if (!ac || !settings.sound) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  show()  { tone(880,.12); tone(1320,.18,'square',.05,.1); },
  tick()  { tone(660,.06,'triangle',.08); },
  sink()  { tone(160,.6,'sawtooth',.05); tone(110,.6,'sine',.1,.05); },
  splash(){ tone(500,.08,'sine',.1); tone(240,.3,'sine',.1,.07); },
  bump()  { tone(200,.06,'triangle',.12); },
  item()  { tone(988,.08); tone(1319,.12,'square',.06,.08); },
  use()   { tone(523,.08); tone(784,.08,'square',.06,.06); tone(1047,.12,'square',.06,.12); },
  win()   { [523,659,784,1047].forEach((f,i) => tone(f,.25,'square',.06,i*.13)); },
  lose()  { [392,330,262].forEach((f,i) => tone(f,.3,'triangle',.1,i*.2)); },
  tap()   { tone(740,.05,'triangle',.08); },
};

// ================= 描画パーツ =================
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
}
function drawMark(g, id, x, y, s, col, f = 1) {
  g.save(); g.translate(x, y); g.fillStyle = col; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  if (id === 'star') {
    for (let i = 0; i < 10; i++) { const r = i % 2 ? s*.45 : s, a = -Math.PI/2 + i*Math.PI/5; g.lineTo(Math.cos(a)*r, Math.sin(a)*r*f); }
    g.closePath(); g.fill();
  } else if (id === 'tri') {
    g.moveTo(0, -s*f); g.lineTo(s*.95, s*.72*f); g.lineTo(-s*.95, s*.72*f); g.closePath(); g.fill();
  } else if (id === 'circle') {
    g.lineWidth = s*.32; g.ellipse(0, 0, s*.72, s*.72*f, 0, 0, Math.PI*2); g.stroke();
  } else if (id === 'wave') {
    g.lineWidth = s*.26;
    for (const k of [-.36, .36]) { g.moveTo(-s, k*s*f); for (let t = -1; t <= 1.001; t += .1) g.lineTo(t*s, (k*s + Math.sin(t*Math.PI*2)*s*.2)*f); }
    g.stroke();
  } else if (id === 'heart') {
    g.moveTo(0, s*.85*f);
    g.bezierCurveTo(-s*1.25, -s*.05*f, -s*.6, -s*1.0*f, 0, -s*.38*f);
    g.bezierCurveTo(s*.6, -s*1.0*f, s*1.25, -s*.05*f, 0, s*.85*f); g.fill();
  } else if (id === 'dia') {
    g.moveTo(0, -s*f); g.lineTo(s*.72, 0); g.lineTo(0, s*f); g.lineTo(-s*.72, 0); g.closePath(); g.fill();
  }
  g.restore();
}
function drawIsland(g, isl, t, glow = 0) {
  const m = MARKS[isl.mark], sk = isl.sink;
  g.save();
  g.translate(isl.x, isl.y + sk*56 + Math.sin(t*1.6 + isl.x)*1.2);
  g.globalAlpha = Math.max(0, 1 - sk*0.9);
  if (glow) {
    const lg = g.createLinearGradient(0, -230, 0, 0);
    lg.addColorStop(0, 'rgba(255,255,220,0)'); lg.addColorStop(1, 'rgba(255,255,200,.55)');
    g.fillStyle = lg; g.fillRect(-RX*.72, -230, RX*1.44, 230);
  }
  const DEP = 46;
  g.fillStyle = 'rgba(0,40,100,.28)'; g.beginPath(); g.ellipse(0, DEP + 10, RX+10, RY+8, 0, 0, Math.PI*2); g.fill();
  // 側面（土）
  g.fillStyle = '#8a5a2e'; g.beginPath(); g.ellipse(0, DEP, RX*.93, RY*.93, 0, 0, Math.PI*2); g.fill();
  g.fillRect(-RX*.93, 0, RX*1.86, DEP);
  g.fillStyle = '#a06c38'; g.fillRect(-RX*.93, 4, RX*.22, DEP - 6);
  g.fillStyle = '#6d4420';
  for (let i = -3; i <= 3; i++) {
    const y0 = RY*.93*Math.sqrt(1 - (i*17/(RX*.93))**2);
    g.beginPath(); g.ellipse(i*17, y0 + 18, 5, 4, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(i*17 + 8, y0 + DEP - 8, 4, 3, 0, 0, Math.PI*2); g.fill();
  }
  // 水ぎわの波
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 3;
  g.beginPath(); g.ellipse(0, DEP + 2, RX*.98, RY*.98, 0, .15, Math.PI - .15); g.stroke();
  // 草
  g.fillStyle = '#2f9a38'; g.beginPath(); g.ellipse(0, 4, RX, RY, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#56c850'; g.beginPath(); g.ellipse(0, 0, RX, RY, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#7ddc62';
  for (let i = 0; i < 12; i++) { const a = i/12*Math.PI*2; g.beginPath(); g.arc(Math.cos(a)*RX*.9, Math.sin(a)*RY*.9, 6, 0, Math.PI*2); g.fill(); }
  // 中のパネル
  g.fillStyle = m.light; g.strokeStyle = m.c; g.lineWidth = 3;
  g.beginPath(); g.ellipse(0, 0, RX*.76, RY*.76, 0, 0, Math.PI*2); g.fill(); g.stroke();
  drawMark(g, m.id, 0, 0, 23, m.c, .62);
  if (glow) {
    g.globalAlpha = .55 + .45*Math.sin(t*12);
    g.strokeStyle = '#fffbd0'; g.lineWidth = 7;
    g.beginPath(); g.ellipse(0, 0, RX+7, RY+6, 0, 0, Math.PI*2); g.stroke();
  }
  g.restore();
}
function drawChar(g, c, x, y, s = 1, o = {}) {
  g.save(); g.translate(x, y); g.scale(s, s);
  if (o.alpha != null) g.globalAlpha = o.alpha;
  const bob = o.bob || 0;

}
function cpuThink(p, dt, d) {
  if (p.delay > 0) p.delay -= dt;
  if (p.recheck > 0) { p.recheck -= dt; if (p.recheck <= 0 && phase === 'show') p.goal = pointIn(targetIsland(), .4); }
  if ((phase === 'idle' || phase === 'rise') && !p.goal) {
    if (items.length && Math.random() < d.chase*dt*2) { const it = items[Math.floor(Math.random()*items.length)]; p.goal = { x:it.x, y:it.y }; }
    else if (Math.random() < dt*.8) { const s = islands[Math.floor(Math.random()*islands.length)]; p.goal = pointIn(s, .5); }
  }
  if (p.item) {
    p.itemHold -= dt;
    if (p.itemHold <= 0) {
      if (p.item === 'blow') {
        const near = players.some(o => o !== p && o.alive && Math.hypot(o.x - p.x, o.y - p.y) < 90);
        if (near && (phase === 'show' || phase === 'sink')) useItem(p);
      } else if (p.item === 'dash') { if (phase === 'show') useItem(p); }
      else useItem(p);
    }
  }
}
function updateParticles(dt) {
  particles.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt; p.vx *= .97; p.life -= dt; });
  particles = particles.filter(p => p.life > 0);
  rings.forEach(r => { r.r += dt*90; r.life -= dt*1.2; });
  rings = rings.filter(r => r.life > 0);
}

function drawGame(t) {
  const g = gctx; if (!g) return;
  drawWater(g, t, W, H);
  drawShore(g, 20, 150, 70, false); drawShore(g, 470, 130, 60, true);
  drawShore(g, -10, 690, 70, false); drawShore(g, 490, 700, 70, true);
  rings.forEach(r => {
    g.globalAlpha = Math.max(0, r.life); g.strokeStyle = r.c || '#fff'; g.lineWidth = 4;
    g.beginPath(); g.ellipse(r.x, r.y, r.r, r.r*.6, 0, 0, Math.PI*2); g.stroke();
  });
  g.globalAlpha = 1;
  [...islands].sort((a, b) => a.y - b.y).forEach(s => drawIsland(g, s, t, phase === 'show' && s.mark === target ? 1 : 0));
  // アイテム
  items.forEach(it => {
    const y = it.y - 16 + Math.sin(it.t*4)*3;
    g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(it.x, it.y, 10, 4, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,255,255,.9)'; g.strokeStyle = '#ffd23a'; g.lineWidth = 3;
    g.beginPath(); g.arc(it.x, y, 15, 0, Math.PI*2); g.fill(); g.stroke();
    g.font = '18px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(ITEMS[it.type].e, it.x, y + 1);
  });
  // プレイヤー
  [...players].sort((a, b) => a.y - b.y).forEach(p => {
    if (p.alive) {
      const inWater = !onAnyIsland(p);
      if (inWater) {
        g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2;
        g.beginPath(); g.ellipse(p.x, p.y, 16 + Math.sin(t*6)*2, 6, 0, 0, Math.PI*2); g.stroke();
      }
      drawChar(g, p, p.x, p.y + (inWater ? 6 : 0), 1.05, { bob:Math.abs(Math.sin(p.walk))*3, barrier:p.barrier, noShadow:inWater });
      if (p.dashT > 0) { g.font = '14px sans-serif'; g.textAlign = 'center'; g.fillText('💨', p.x - 18, p.y - 8); }
      if (!p.cpu) {
        g.fillStyle = '#ffe14d'; g.strokeStyle = '#a86b00'; g.lineWidth = 2;
        const yy = p.y - 76 + Math.sin(t*5)*3;
        g.beginPath(); g.moveTo(p.x, yy + 10); g.lineTo(p.x - 7, yy); g.lineTo(p.x + 7, yy); g.closePath(); g.fill(); g.stroke();
      }
    } else if (p.fallT < 1.2) {
      const a = Math.max(0, 1 - p.fallT/1.2);
      drawChar(g, p, p.x, p.y + p.fallT*30, 1.05, { alpha:a, noShadow:true, label:p.fallT < .6 });
    }
  });
  particles.forEach(p => { g.globalAlpha = Math.min(1, p.life*2); g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2); g.fill(); });
  g.globalAlpha = 1;

  // ジョイスティック
  if (joy) {
    const r = cv.getBoundingClientRect();
    const ox = (joy.ox - r.left)/cssScale, oy = (joy.oy - r.top)/cssScale;
    let dx = (joy.x - joy.ox)/cssScale, dy = (joy.y - joy.oy)/cssScale; const l = Math.hypot(dx, dy), m = 45/cssScale*cssScale;
    if (l > m) { dx = dx/l*m; dy = dy/l*m; }
    g.fillStyle = 'rgba(255,255,255,.18)'; g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 3;
    g.beginPath(); g.arc(ox, oy, 46, 0, Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.arc(ox + dx, oy + dy, 20, 0, Math.PI*2); g.fill();
  }
  drawHud(g, t);
}
function drawHud(g, t) {
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const alive = players.filter(p => p.alive).length;
  // 残り
  g.fillStyle = 'rgba(12,38,100,.88)'; rr(g, 10, 14, 96, 38, 12); g.fill();
  g.fillStyle = '#fff'; g.font = '800 13px ' + FONT; g.fillText('残り', 36, 34);
  g.font = '900 22px ' + FONT; g.fillText(alive + '人', 76, 33);
  // タイマー
  const tt = phase === 'end' ? 0 : Math.max(0, phaseT);
  g.fillStyle = 'rgba(12,38,100,.88)'; rr(g, 374, 14, 96, 38, 12); g.fill();
  g.fillStyle = phase === 'show' && tt < 1.5 ? '#ff8a7a' : '#fff';
  g.font = '900 24px ' + FONT; g.fillText(tt.toFixed(1), 410, 33);
  g.font = '800 12px ' + FONT; g.fillText('秒', 448, 36);
  // 中央
  if (phase === 'sink' || phase === 'end') {
    g.fillStyle = '#e8312a'; rr(g, 128, 12, 224, 50, 25); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke();
    g.fillStyle = '#fff'; g.font = '900 21px ' + FONT;
    g.fillText(phase === 'end' ? 'しゅうりょう！' : '今から沈みます！', 240, 38);
  } else {
    g.fillStyle = 'rgba(12,38,100,.92)'; rr(g, 150, 6, 180, 84, 22); g.fill();
    g.fillStyle = '#fff'; g.font = '800 15px ' + FONT; g.fillText(phase === 'rise' ? 'セーフ！' : '次のマーク', 240, 25);
    g.fillStyle = '#fff'; g.beginPath(); g.arc(240, 60, 22, 0, Math.PI*2); g.fill();
    if (phase === 'show') {
      const m = MARKS[target]; const s = 1 + .08*Math.sin(t*10);
      g.fillStyle = m.c; g.beginPath(); g.arc(240, 60, 19, 0, Math.PI*2); g.fill();
      drawMark(g, m.id, 240, 61, 12*s, '#fff');
    } else {
      g.fillStyle = '#1c55c0'; g.font = '900 26px ' + FONT; g.fillText('?', 240, 61);
    }
  }
  // 下のバナー
  let banner = null;
  if (phase === 'show') banner = 'mark';
  else if (phase === 'idle' && round === 1) banner = '👆 スワイプで移動';
  if (banner) {
    g.fillStyle = 'rgba(12,38,100,.9)'; rr(g, 110, 622, 260, 48, 24); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#fff'; g.font = '900 18px ' + FONT;
    if (banner === 'mark') {
      const m = MARKS[target];
      g.fillStyle = m.c; g.beginPath(); g.arc(142, 646, 16, 0, Math.PI*2); g.fill();
      drawMark(g, m.id, 142, 647, 9, '#fff');
      g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText('の島に移動しよう！', 166, 647); g.textAlign = 'center';
    } else g.fillText(banner, 240, 647);
  }
  // メッセージ
  if (msgT > 0) {
    const a = Math.min(1, msgT*2.5), sc = 1 + Math.max(0, msgT - 1.1)*1.5;
    g.save(); g.globalAlpha = a; g.translate(240, 300); g.scale(sc, sc);
    g.font = '900 38px ' + FONT; g.lineJoin = 'round';
    g.lineWidth = 10; g.strokeStyle = '#12357f'; g.strokeText(msg, 0, 0);
    g.fillStyle = '#fff'; g.fillText(msg, 0, 0);
    g.restore();
  }
}

// ================= 結果 =================
function showResult() {
  G.running = false;
  const me = players[0], alive = players.filter(p => p.alive);
  let rank, title, sub;
  if (me.alive) { rank = 1; title = 'あなたの勝ち！'; sub = `${round} ラウンドを生き抜いた！`; sfx.win(); }
  else if (alive.length === 0) { rank = 1; title = '引き分け！'; sub = `最後はみんな同時に落ちちゃった（${round} ラウンド）`; sfx.win(); }
  else { rank = alive.length + 1; title = rank === 2 ? 'おしい！' : 'ざんねん…'; sub = `${me.outRound} ラウンド目で脱落`; sfx.lose(); }
  $('rankTxt').innerHTML = `${rank}<small>位</small>${rank === 1 ? ' 👑' : ''}`;
  $('resMsg').textContent = title; $('resSub').textContent = sub;

  const stats = store.get('stats', { plays:0, wins:0, best:0, history:[] });
  stats.plays++; if (rank === 1 && me.alive) stats.wins++;
  const survived = me.alive ? round : me.outRound - 1;
  stats.best = Math.max(stats.best, survived);
  stats.history.unshift({ rank, round:survived, diff:settings.diff, date:new Date().toLocaleDateString('ja-JP') });
  stats.history = stats.history.slice(0, 8);
  store.set('stats', stats);

  go('s-result');
  const cvR = $('resultCv'); const g = setupCanvas(cvR, 400, 250);
  g.clearRect(0, 0, 400, 250);
  // 表彰台の島
  g.fillStyle = '#8a5a2e'; g.beginPath(); g.ellipse(200, 205, 170, 34, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#56c850'; g.beginPath(); g.ellipse(200, 190, 175, 36, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = '#ffd9d2'; g.strokeStyle = '#e8413c'; g.lineWidth = 3;
  g.beginPath(); g.ellipse(200, 186, 70, 20, 0, 0, Math.PI*2); g.fill(); g.stroke();
  const winners = me.alive ? [me] : alive.length ? alive : [];
  const others = players.filter(p => !winners.includes(p));
  others.forEach((p, i) => drawChar(g, p, [70, 330, 130, 270][i], 200, 1.2));
  winners.forEach((p, i) => drawChar(g, p, 200 + (i - (winners.length-1)/2)*60, 180, 2.1));
  // 紙吹雪
  for (let i = 0; i < 40; i++) {
    g.fillStyle = ['#ff4a3d','#ffd21f','#39c24f','#2f86ff','#ff5aa8'][i%5];
    g.save(); g.translate(Math.random()*400, Math.random()*150); g.rotate(Math.random()*3); g.fillRect(-4, -2, 8, 4); g.restore();
  }
}
function renderRank() {
  const s = store.get('stats', { plays:0, wins:0, best:0, history:[] });
  const dn = { easy:'かんたん', normal:'ふつう', hard:'むずかしい' };
  $('rankPanel').innerHTML = `
    <div class="stat"><span>🎮 プレイ回数</span><span>${s.plays} 回</span></div>
    <div class="stat"><span>👑 優勝回数</span><span>${s.wins} 回</span></div>
    <div class="stat"><span>🏝️ 最高生存ラウンド</span><span>${s.best} ラウンド</span></div>
    <div class="set-label" style="margin-top:18px">さいきんの結果</div>
    ${s.history.length ? s.history.map(h => `<div class="stat"><span>${h.date}（${dn[h.diff] || ''}）</span><span>${h.rank}位・${h.round}R</span></div>`).join('') : '<p style="color:#6a7aa0">まだ記録がありません</p>'}
    <p style="font-size:12px;color:#6a7aa0;margin-top:12px">※ 全国ランキングはオンライン対戦とあわせて準備中です</p>`;
}
function renderSettings() {
  document.querySelectorAll('#segSound button').forEach(b => b.classList.toggle('on', (b.dataset.v === 'on') === settings.sound));
  document.querySelectorAll('#segDiff button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.diff));
}
$('segSound').onclick = e => { const b = e.target.closest('button'); if (!b) return; settings.sound = b.dataset.v === 'on'; store.set('settings', settings); renderSettings(); initAudio(); sfx.tap(); };
$('segDiff').onclick = e => { const b = e.target.closest('button'); if (!b) return; settings.diff = b.dataset.v; store.set('settings', settings); renderSettings(); sfx.tap(); };

// ================= ループ =================
let last = performance.now();
function loop(now) {
  const dt = Math.min(.033, (now - last)/1000); last = now;
  const t = now/1000;
  if ($('s-title').classList.contains('active')) drawTitleArt(t);
  if (G.running) { update(dt); drawGame(t); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
