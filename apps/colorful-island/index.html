<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>カラフルアイランド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#12357f; --navy2:#1c55c0; --ink:#1a2b55; --yellow:#ffd23a; --yellow2:#ffab00;
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0b2a66; font-family:var(--font); color:var(--ink); overflow:hidden; user-select:none; -webkit-user-select:none; }
  #app { position:relative; width:100%; max-width:480px; height:100dvh; margin:0 auto; overflow:hidden;
    background:linear-gradient(#8fd8ff 0%, #bfeaff 40%, #4bb6ee 41%, #1d7fd6 100%); }
  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.active { display:flex; }
  button { font-family:var(--font); cursor:pointer; }

  /* 共通パーツ */
  .btn { border:none; border-radius:999px; font-weight:900; font-size:22px; padding:14px 28px; letter-spacing:.05em; }
  .btn.yellow { background:linear-gradient(#ffe46b, var(--yellow) 50%, var(--yellow2)); color:var(--navy); box-shadow:0 5px 0 #c77f00, 0 8px 16px #0004; border:3px solid #fff8; }
  .btn.navy { background:linear-gradient(#2b6fe0, var(--navy)); color:#fff; box-shadow:0 5px 0 #0a1f4d, 0 8px 16px #0004; border:3px solid #fff5; }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #0005; }
  .header { display:flex; align-items:center; gap:10px; padding:14px 14px 12px; background:linear-gradient(var(--navy2), var(--navy)); color:#fff; font-weight:900; font-size:19px; box-shadow:0 3px 10px #0004; }
  .header .back { width:38px; height:38px; border-radius:50%; border:none; background:#fff; color:var(--navy); font-size:20px; font-weight:900; }
  .header .ttl { flex:1; text-align:center; margin-right:48px; }
  .panel { background:#fffffff2; border-radius:20px; margin:14px; padding:18px; box-shadow:0 6px 18px #0003; }

  /* タイトル */
  #s-title { align-items:center; justify-content:space-between; padding:28px 16px 22px; }
  .logo { text-align:center; margin-top:6px; }
  .logo .l1, .logo .l2 { font-size:52px; font-weight:900; line-height:1.05; letter-spacing:-.02em; }
  .logo span { -webkit-text-stroke:6px #fff; paint-order:stroke fill; text-shadow:0 5px 0 #1b3f8f, 0 8px 12px #0005; display:inline-block; }
  .logo .sub { display:inline-block; margin-top:10px; background:linear-gradient(#2a67d8,#153f99); color:#fff; font-weight:800; padding:6px 18px; border-radius:999px; border:3px solid #fff; font-size:16px; }
  #titleCv { width:100%; max-width:380px; aspect-ratio: 380/220; }
  .title-bottom { width:100%; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .title-bottom .btn.yellow { width:80%; font-size:28px; }
  .subrow { display:flex; gap:8px; width:100%; justify-content:center; }
  .subrow .btn { font-size:15px; padding:10px 14px; flex:1; max-width:140px; }

  /* モード */
  .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 16px; }
  .mode { border:3px solid #fff9; border-radius:20px; padding:18px 10px; color:#fff; text-align:center; box-shadow:0 6px 0 #0003, 0 10px 18px #0003; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .mode:active { transform:translateY(4px); }
  .mode .ic { font-size:40px; line-height:1; }
  .mode b { font-size:18px; }
  .mode small { font-size:11.5px; opacity:.95; line-height:1.4; }
  .m-online { background:linear-gradient(#3f8cff,#1b55c8); }
  .m-friend { background:linear-gradient(#ffc93a,#f59a00); }
  .m-cpu { background:linear-gradient(#4fd264,#1f9a3b); outline:4px solid #fff; }
  .m-search { background:linear-gradient(#a57cff,#6a42d6); }
  .badge-soon { font-size:10px; background:#0005; padding:2px 8px; border-radius:99px; }

  /* ルール */
  #ruleCv { width:100%; border-radius:14px; aspect-ratio: 400/230; display:block; }
  .rule-banner { background:var(--navy); color:#fff; text-align:center; font-weight:900; padding:8px; border-radius:0 0 14px 14px; margin-top:-6px; position:relative; }
  .rule-text { text-align:center; line-height:1.9; font-weight:800; font-size:15px; margin:14px 0 6px; }
  .items { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }
  .item { background:#eaf3ff; border-radius:12px; padding:8px 4px; text-align:center; }
  .item .e { font-size:28px; }
  .item b { display:block; font-size:12px; }
  .item small { font-size:10px; line-height:1.3; display:block; color:#40507a; }

  /* ゲーム */
  #s-game { align-items:center; justify-content:center; background:#1d7fd6; }
  #cv { display:block; touch-action:none; }
  #itemBtn { position:absolute; right:14px; bottom:18px; width:84px; height:84px; border-radius:50%; border:4px solid #fff; background:radial-gradient(#fff, #cfe2ff); box-shadow:0 5px 0 #0a1f4d88, 0 8px 16px #0005; font-size:34px; line-height:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--navy); }
  #itemBtn small { font-size:11px; font-weight:900; margin-top:2px; }
  #itemBtn.empty { opacity:.55; filter:grayscale(1); }
  #quitBtn { position:absolute; left:12px; bottom:18px; border:none; background:#0f2f6bcc; color:#fff; border-radius:999px; padding:8px 14px; font-weight:800; font-size:13px; }

  /* 結果 */
  #s-result { align-items:center; justify-content:center; gap:6px; background:radial-gradient(circle at 50% 35%, #fff7c2 0%, #7fd0ff 45%, #1d7fd6 100%); }
  .rank { font-size:76px; font-weight:900; color:#ffcc1a; -webkit-text-stroke:5px #8a4b00; paint-order:stroke fill; text-shadow:0 6px 0 #5a3000; line-height:1; }
  .rank small { font-size:40px; }
  #resultCv { width:92%; max-width:400px; aspect-ratio:400/250; }
  .ribbon { background:linear-gradient(#2a67d8,#12357f); color:#fff; font-weight:900; font-size:26px; padding:10px 34px; border-radius:12px; border:3px solid #ffd23a; box-shadow:0 6px 14px #0005; margin-top:-24px; position:relative; }
  #resSub { color:#fff; font-weight:800; text-shadow:0 2px 3px #0007; margin:10px 0 14px; }
  .row { display:flex; gap:10px; }
  .row .btn { font-size:18px; padding:12px 20px; }

  /* ランキング・設定 */
  .stat { display:flex; justify-content:space-between; padding:12px 4px; border-bottom:1px solid #dde6f5; font-weight:800; }
  .stat:last-child { border-bottom:none; }
  .stat span:last-child { color:var(--navy2); }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; padding:10px; border-radius:999px; border:2px solid var(--navy2); background:#fff; color:var(--navy2); font-weight:900; font-size:15px; }
  .seg button.on { background:var(--navy2); color:#fff; }
  .set-label { font-weight:900; margin:14px 0 8px; }

  #toast { position:absolute; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); background:#0f2f6bee; color:#fff; padding:12px 18px; border-radius:14px; font-weight:800; font-size:14px; opacity:0; transition:.25s; pointer-events:none; width:max-content; max-width:90%; text-align:center; z-index:10; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section class="screen active" id="s-title">
    <div class="logo">
      <div class="l1"><span style="color:#ff4a3d">カ</span><span style="color:#ff9a1f">ラ</span><span style="color:#ffd21f">フ</span><span style="color:#39c24f">ル</span></div>
      <div class="l2"><span style="color:#2f86ff">ア</span><span style="color:#9a5cff">イ</span><span style="color:#ff5aa8">ラ</span><span style="color:#ff4a3d">ン</span><span style="color:#ffb11f">ド</span></div>
      <div class="sub">〜いろいろきのこサバイバル〜</div>
    </div>
    <canvas id="titleCv"></canvas>
    <div class="title-bottom">
      <button class="btn yellow" id="startBtn">はじめる</button>
      <div class="subrow">
        <button class="btn navy" data-go="s-rule" id="ruleBtn">📖 ルール</button>
        <button class="btn navy" data-go="s-rank">👑 ランキング</button>
        <button class="btn navy" data-go="s-set">⚙️ 設定</button>
      </div>
    </div>
  </section>

  <!-- モード選択 -->
  <section class="screen" id="s-mode">
    <div class="header"><button class="back" data-go="s-title">←</button><div class="ttl">モード選択</div></div>
    <div class="mode-grid">
      <button class="mode m-online" data-soon="オンライン対戦"><div class="ic">👥</div><b>オンライン対戦</b><small>全国のプレイヤーと<br>4人で遊ぶ</small><span class="badge-soon">準備中</span></button>
      <button class="mode m-friend" data-soon="フレンド対戦"><div class="ic">🤝</div><b>フレンド対戦</b><small>ルームを作って<br>友達と遊ぶ</small><span class="badge-soon">準備中</span></button>
      <button class="mode m-cpu" id="cpuBtn"><div class="ic">🤖</div><b>CPU対戦</b><small>コンピューターと<br>遊ぶ</small></button>
      <button class="mode m-search" data-soon="ルーム検索"><div class="ic">🔍</div><b>ルーム検索</b><small>フレンドのルームを<br>探す</small><span class="badge-soon">準備中</span></button>
    </div>
  </section>

  <!-- ルール -->
  <section class="screen" id="s-rule">
    <div class="header"><button class="back" id="ruleBack">←</button><div class="ttl">ルール説明</div></div>
    <div style="flex:1; overflow:auto;">
      <div class="panel">
        <canvas id="ruleCv"></canvas>
        <div class="rule-banner">次のマークの島に移動しよう！</div>
        <p class="rule-text">指定されたマークの島以外は<br>しばらくすると沈んでしまいます。<br>最後まで残った人の勝ちです！</p>
        <div class="items">
          <div class="item"><div class="e">👟</div><b>ダッシュ</b><small>3秒間すばやく移動</small></div>
          <div class="item"><div class="e">🛡️</div><b>バリア</b><small>1回だけ落下を防ぐ</small></div>
          <div class="item"><div class="e">💥</div><b>ふっとばし</b><small>近くの相手を吹き飛ばす</small></div>
          <div class="item"><div class="e">⏳</div><b>スロー</b><small>沈むまでの時間+2秒</small></div>
        </div>
        <p style="text-align:center;font-size:12px;color:#5a6a90;margin:10px 0 0">スワイプ（ドラッグ）で移動／PCは矢印キー・WASD、スペースでアイテム</p>
      </div>
    </div>
    <div style="padding:6px 16px 22px; text-align:center;"><button class="btn yellow" id="ruleStart" style="width:80%">スタート</button></div>
  </section>

  <!-- ゲーム -->
  <section class="screen" id="s-game">
    <canvas id="cv"></canvas>
    <button id="itemBtn" class="empty"><span id="itemIc">？</span><small id="itemName">アイテム</small></button>
    <button id="quitBtn">🏠 やめる</button>
  </section>

  <!-- 結果 -->
  <section class="screen" id="s-result">
    <div class="rank" id="rankTxt">1<small>位</small> 👑</div>
    <canvas id="resultCv"></canvas>
    <div class="ribbon" id="resMsg">あなたの勝ち！</div>
    <div id="resSub"></div>
    <div class="row">
      <button class="btn yellow" id="againBtn">🔄 もう一回!</button>
      <button class="btn navy" data-go="s-title">🏠 ホームへ</button>
    </div>
  </section>

  <!-- ランキング -->
  <section class="screen" id="s-rank">
    <div class="header"><button class="back" data-go="s-title">←</button><div class="ttl">ランキング（自分の記録）</div></div>
    <div class="panel" id="rankPanel"></div>
  </section>

  <!-- 設定 -->
  <section class="screen" id="s-set">
    <div class="header"><button class="back" data-go="s-title">←</button><div class="ttl">設定</div></div>
    <div class="panel">
      <div class="set-label">🔊 サウンド</div>
      <div class="seg" id="segSound"><button data-v="on">ON</button><button data-v="off">OFF</button></div>
      <div class="set-label">🤖 CPUのつよさ</div>
      <div class="seg" id="segDiff"><button data-v="easy">かんたん</button><button data-v="normal">ふつう</button><button data-v="hard">むずかしい</button></div>
    </div>
  </section>

  <div id="toast"></div>
</div>
