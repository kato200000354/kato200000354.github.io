#box{position:relative}

.panel h2{margin:0 0 10px;font-size:26px;color:#ff6fa3}
.panel .sub{font-size:13px;color:#8a7aa8;margin-bottom:12px}
.how{text-align:left;font-size:14px;line-height:1.7;background:#f3ecff;border-radius:14px;padding:10px 14px;margin:10px 0 14px}
.row{display:flex;justify-content:space-between;font-size:15px;padding:5px 4px;border-bottom:1px dashed #e0d4f5}
.row b{color:#ff6fa3}
.total{font-size:22px;margin:12px 0 4px;font-weight:bold}
.stars{font-size:34px;letter-spacing:4px;margin:4px 0}
.rank{font-size:64px;font-weight:bold;color:#ffb400;text-shadow:0 4px 0 #ffe7a0;line-height:1}
button{font:inherit;font-weight:bold;font-size:19px;border:none;border-radius:999px;padding:12px 30px;margin:6px 4px 0;color:#fff;background:#ff6fa3;box-shadow:0 5px 0 #d14a7e;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #d14a7e}
button.sec{background:#8a7aa8;box-shadow:0 5px 0 #64577f;font-size:15px;padding:9px 20px}
