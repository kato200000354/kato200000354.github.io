<title>きらぼしシューター</title>
<meta name="description" content="弾にかすってゲージをため、ハイパーで弾幕を星に変える縦スクロールシューティング。ボスを倒してパワーアップを選び、どこまで進めるか挑戦しよう。">
<meta name="theme-color" content="#070a1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070a1f; --panel:rgba(14,20,56,.92); --line:#3b4fa8; --text:#f2f5ff; --muted:#a9b3e0;
  --pink:#ff4f9a; --cyan:#4fe0ff; --gold:#ffd23f;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --u:1;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;
  touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03040d}
#stage{position:relative;overflow:hidden;background:var(--bg)}
#cv{display:block;touch-action:none}
button{font-family:var(--font);cursor:pointer;-webkit-tap-highlight-color:transparent}
.hudbtn{position:absolute;border:0;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#pauseBtn{top:calc(var(--u)*8px);right:calc(var(--u)*8px);width:calc(var(--u)*34px);height:calc(var(--u)*34px);
  border-radius:calc(var(--u)*10px);background:rgba(255,255,255,.12);font-size:calc(var(--u)*15px);font-weight:900}
#hyperBtn{right:calc(var(--u)*10px);bottom:calc(var(--u)*10px);width:calc(var(--u)*66px);height:calc(var(--u)*66px);border-radius:50%;
  background:rgba(255,255,255,.1);border:calc(var(--u)*2px) solid rgba(255,255,255,.25);font-size:calc(var(--u)*12px);font-weight:900;
  color:rgba(255,255,255,.45);letter-spacing:.02em;line-height:1.1;flex-direction:column}
#hyperBtn small{font-size:calc(var(--u)*9px);font-weight:700}
#hyperBtn.ready{color:#fff;border-color:#fff;background:conic-gradient(from var(--ang,0deg),#ff4f9a,#ffd23f,#4fe0ff,#a46bff,#ff4f9a);
  box-shadow:0 0 calc(var(--u)*18px) rgba(255,210,63,.8);animation:spin 1.2s linear infinite;text-shadow:0 1px 3px #000}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--u)*18px);background:rgba(4,6,22,.72);gap:calc(var(--u)*10px)}
.logo{font-weight:900;font-size:calc(var(--u)*44px);line-height:1.05;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 0%,#ffe27a 45%,#ff7ab3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 calc(var(--u)*3px) 0 #3a1a6e) drop-shadow(0 0 calc(var(--u)*14px) rgba(255,120,200,.55))}
.sub{color:var(--muted);font-size:calc(var(--u)*13px);font-weight:700}
.big{font-weight:900;font-size:calc(var(--u)*34px)}
.btn{border:0;border-radius:calc(var(--u)*999px);padding:calc(var(--u)*12px) calc(var(--u)*30px);font-size:calc(var(--u)*18px);font-weight:900;color:#2a0f3d;
  background:linear-gradient(180deg,#fff2a8,#ffc83d);box-shadow:0 calc(var(--u)*4px) 0 #b5730a,0 0 calc(var(--u)*20px) rgba(255,200,61,.45);min-width:calc(var(--u)*180px)}
.btn:active{transform:translateY(calc(var(--u)*3px));box-shadow:0 calc(var(--u)*1px) 0 #b5730a}
.btn.sec{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;font-size:calc(var(--u)*15px);padding:calc(var(--u)*9px) calc(var(--u)*22px)}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--u)*14px);padding:calc(var(--u)*10px) calc(var(--u)*14px);
  text-align:left;font-size:calc(var(--u)*12px);line-height:1.6;max-width:calc(var(--u)*310px);font-weight:500}
.howto b{color:var(--gold)}
.hi{font-size:calc(var(--u)*14px);font-weight:800;color:var(--gold)}
.ver{position:absolute;bottom:calc(var(--u)*6px);left:0;right:0;font-size:calc(var(--u)*10px);color:rgba(255,255,255,.35)}
.row{display:flex;gap:calc(var(--u)*8px);justify-content:center;flex-wrap:wrap}
.stats{font-size:calc(var(--u)*15px);line-height:1.7;font-weight:700}
.stats .n{color:var(--gold);font-weight:900;font-size:calc(var(--u)*24px)}
.newrec{color:var(--pink);font-weight:900;font-size:calc(var(--u)*16px);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.cards{display:flex;flex-direction:column;gap:calc(var(--u)*9px);width:100%;max-width:calc(var(--u)*310px)}
.card{display:flex;align-items:center;gap:calc(var(--u)*12px);text-align:left;color:#fff;border:calc(var(--u)*2px) solid #4c63c9;
  background:linear-gradient(180deg,#1a2470,#121a52);border-radius:calc(var(--u)*14px);padding:calc(var(--u)*10px) calc(var(--u)*12px);
  animation:pop .35s backwards}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card:hover,.card:focus-visible{border-color:var(--gold);outline:none}
.card:active{transform:scale(.97)}
.card .ic{font-size:calc(var(--u)*30px);width:calc(var(--u)*40px);text-align:center;flex:none}
.card .nm{font-weight:900;font-size:calc(var(--u)*15px)}
.card .lv{color:var(--gold);font-size:calc(var(--u)*11px);margin-left:calc(var(--u)*4px)}
.card .ds{font-size:calc(var(--u)*11.5px);color:var(--muted);font-weight:500;line-height:1.45;margin-top:calc(var(--u)*2px)}
@keyframes pop{from{opacity:0;transform:translateY(calc(var(--u)*16px)) scale(.95)}}
.clear{font-weight:900;font-size:calc(var(--u)*30px);color:var(--gold);text-shadow:0 0 calc(var(--u)*14px) rgba(255,210,63,.6)}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="pauseBtn" class="hudbtn" aria-label="ポーズ" hidden>II</button>
    <button id="hyperBtn" class="hudbtn" aria-label="ハイパー" hidden>HYPER<small id="hyperPct">0%</small></button>

    <div id="titleOv" class="overlay">
      <div class="logo">きらぼし<br>シューター</div>
      <div class="sub">弾幕にかすって、星に変えろ！</div>
      <div class="hi" id="titleHi">HI SCORE 0</div>
      <button class="btn" id="startBtn">スタート</button>
      <div class="howto">
        ・指で<b>ドラッグ</b>して移動。弾は自動で撃つよ<br>
        ・敵の弾に<b>かする</b>とハイパーゲージがたまる<br>
        ・<b>ハイパー</b>中は無敵！ 弾がぜんぶ星に変わる<br>
        ・敵を続けて倒すと<b>チェイン</b>で得点アップ<br>
        ・ボスを倒すと<b>パワーアップ</b>を選べる<br>
        <span style="color:var(--muted)">PC：矢印/WASD 移動・Shift 低速・Space ハイパー・P ポーズ</span>
      </div>
      <button class="btn sec" id="muteBtn1">🔊 サウンド ON</button>
      <div class="ver">ver 1.0</div>
    </div>

    <div id="pauseOv" class="overlay" hidden>
      <div class="big">ポーズ</div>
      <button class="btn" id="resumeBtn">つづける</button>
      <button class="btn sec" id="muteBtn2">🔊 サウンド ON</button>
      <button class="btn sec" id="quitBtn">タイトルへ</button>
    </div>

    <div id="upOv" class="overlay" hidden>
      <div class="clear" id="upTitle">STAGE CLEAR!</div>
      <div class="sub">パワーアップを1つ選ぼう</div>
      <div class="cards" id="cards"></div>
    </div>

    <div id="overOv" class="overlay" hidden>
      <div class="big" style="color:var(--pink)">GAME OVER</div>
      <div class="stats">
        <div>スコア</div><div class="n" id="ovScore">0</div>
        <div id="ovNew" class="newrec" hidden>NEW RECORD!</div>
        <div id="ovInfo"></div>
        <div style="color:var(--muted);font-size:calc(var(--u)*13px)" id="ovHi"></div>
      </div>
      <button class="btn" id="retryBtn">もう一回</button>
      <button class="btn sec" id="toTitleBtn">タイトルへ</button>
    </div>
  </div>
</div>
