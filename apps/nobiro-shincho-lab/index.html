<!doctype html>
<html lang="ja">
<head>
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>のびろ！身長ラボ</title>
<meta name="description" content="身長研究所の所長になって、睡眠・栄養・運動の習慣から育成スタート。研究が進むと100時間ルーム、重力装置、巨人化カプセル…と研究身長がどんどん暴走する放置育成ゲーム。">
<meta name="theme-color" content="#19a38c">
<style>
:root{--bg:#e8f6f1;--card:#fff;--ink:#22333b;--dim:#6b7f86;--teal:#19a38c;--teal2:#0f7d6b;--orange:#ff8a3d;--pink:#ff6f91;--purple:#7a5cff;--gold:#f5b70a;--line:#d5e7e1;--lock:#b9c6c4}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#cfe9e1;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.12)}
/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:linear-gradient(#8fd9f5,#dff6ff 55%,#bde9c9 55.2%,#9fd9ad);overflow:hidden}
#title .logo{font-size:44px;font-weight:900;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 #0f7d6b,0 6px 0 #0a5c4f,0 10px 18px rgba(0,0,0,.25);text-align:center;line-height:1.1}
#title .logo small{display:block;font-size:15px;letter-spacing:.3em;margin-bottom:6px;text-shadow:0 2px 0 #0f7d6b}
#titleCv{width:200px;height:210px}
.tbtns{display:flex;flex-direction:column;gap:10px;width:min(280px,90%)}
.btn{display:block;width:100%;padding:14px 16px;border-radius:16px;font-size:17px;font-weight:800;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal2);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal2)}
.btn.sub{background:#fff;color:var(--teal2);box-shadow:0 4px 0 #b7d8cf}
.btn.org{background:var(--orange);box-shadow:0 4px 0 #c8601c}
.btn.pur{background:var(--purple);box-shadow:0 4px 0 #4d35b8}
.btn.red{background:#e2504c;box-shadow:0 4px 0 #a6302d}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.tnote{font-size:11px;color:#3d5a57;text-align:center;line-height:1.6;max-width:320px}
/* ---------- game frame ---------- */
#game{position:absolute;inset:0;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--teal);color:#fff}
.chip{flex:1;min-width:0;background:rgba(0,0,0,.18);border-radius:12px;padding:5px 8px;line-height:1.15}
.chip b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:10px;opacity:.85;white-space:nowrap}
#bSet{flex:none;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.18);font-size:18px;color:#fff}
#main{flex:1;min-height:0;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}
#tab-home{padding:0;display:flex;flex-direction:column;overflow:hidden}
#nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:7px 0 8px;font-size:11px;font-weight:700;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#nav button i{font-style:normal;font-size:22px;line-height:1.1;filter:grayscale(.7);opacity:.7}
#nav button.on{color:var(--teal2)}
#nav button.on i{filter:none;opacity:1}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--pink);color:#fff;font-size:10px;line-height:16px;font-style:normal}
/* ---------- home ---------- */
#stage{flex:1;min-height:200px;position:relative;overflow:hidden;background:#f4efe6}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hcard{position:absolute;left:8px;right:8px;top:8px;background:rgba(255,255,255,.88);border-radius:14px;padding:8px 12px 9px;box-shadow:0 3px 10px rgba(0,0,0,.12);pointer-events:none;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:end}
#hcard>#hLabel{grid-column:1/3}
#hNext{grid-column:1/3}
#hSub{text-align:right;align-self:center}
#hLabel{font-size:11px;color:var(--dim);font-weight:700}
#hBig{font-size:28px;font-weight:900;line-height:1.1;color:var(--ink);white-space:nowrap}
#hBig.rs{color:var(--purple)}
#hSub{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
#hNext{margin-top:5px;font-size:10.5px;color:var(--ink)}
.bar{height:7px;background:#e3ece9;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#53d6b9);border-radius:4px;transition:width .3s}
.bar.p i{background:linear-gradient(90deg,var(--purple),#c08bff)}
.bar.o i{background:linear-gradient(90deg,var(--orange),#ffc15e)}
#hint{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:6px;align-items:flex-end;pointer-events:none}
#hint .bot{font-size:22px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
#hint .bub{background:rgba(255,255,255,.9);border-radius:12px 12px 12px 3px;padding:5px 9px;font-size:11.5px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.idea{position:absolute;width:54px;height:54px;border-radius:50%;font-size:30px;background:radial-gradient(circle,#fffbd0,#ffe066 60%,rgba(255,224,102,0) 72%);animation:float 2.2s ease-in-out infinite;z-index:3}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.flt{position:absolute;z-index:4;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.3);pointer-events:none;animation:flt 1s ease-out forwards;white-space:nowrap}
@keyframes flt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
#homeCtl{flex:none;padding:8px 10px 8px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
#bMeasure{width:100%;padding:12px;border-radius:18px;background:linear-gradient(#ff9d55,var(--orange));color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px 0 #c8601c;display:flex;align-items:center;justify-content:center;gap:10px}
#bMeasure:active{transform:translateY(4px);box-shadow:0 1px 0 #c8601c}
#bMeasure small{font-size:13px;font-weight:700;background:rgba(0,0,0,.15);border-radius:8px;padding:2px 8px}
.habits{display:flex;gap:7px}
.hab{flex:1;position:relative;overflow:hidden;background:#fff;border-radius:14px;padding:6px 2px;font-size:12px;font-weight:800;box-shadow:0 3px 0 #c7ddd6;line-height:1.2}
.hab i{font-style:normal;font-size:20px;display:block}
.hab .cd{position:absolute;left:0;bottom:0;height:4px;background:var(--teal);width:0}
.hab.wait{color:var(--lock)}
.hab.wait i{filter:grayscale(1);opacity:.5}
.hab.wait .cd{background:var(--lock)}
.row2{display:flex;gap:7px}
.row2 .btn{flex:1;position:relative}
#offCard{background:linear-gradient(135deg,#fff7e0,#ffe9c2);border:2px solid #ffcf7a;border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:12px;line-height:1.45}
#offCard div{flex:1}
#rate{font-size:11px;color:var(--dim);text-align:center}
/* ---------- lists ---------- */
h2{font-size:17px;margin:6px 2px 8px;display:flex;align-items:center;gap:6px}
h3{font-size:14px;margin:14px 2px 6px;color:var(--teal2)}
.subtabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:-12px;z-index:2;background:var(--bg);padding:6px 0}
.subtabs button{flex:1;padding:9px 4px;border-radius:12px;background:#fff;font-weight:800;font-size:13px;color:var(--dim);box-shadow:0 2px 0 #c7ddd6}
.subtabs button.on{background:var(--teal);color:#fff;box-shadow:0 2px 0 var(--teal2)}
.card{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 0 #cfe2dc}
.item{display:flex;gap:10px;align-items:center}
.item .ic{flex:none;width:46px;height:46px;border-radius:12px;background:#eef7f4;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative}
.item .ic em{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:0 5px;line-height:16px}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14px}
.item .ds{font-size:11px;color:var(--dim);line-height:1.45;margin-top:1px}
.item .ef{font-size:11px;color:var(--teal2);font-weight:700;margin-top:2px}
.buy{flex:none;min-width:84px;padding:8px 8px;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:12px;line-height:1.25;box-shadow:0 3px 0 var(--teal2)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal2)}
.buy.no{background:#c9d6d3;box-shadow:0 3px 0 #a9b9b5;color:#fff}
.buy.done{background:#fff;color:var(--teal2);box-shadow:none;border:2px solid var(--teal)}
.buy.wear{background:var(--orange);box-shadow:0 3px 0 #c8601c}
.locked{opacity:.6}
.locked .ic{filter:grayscale(1)}
.amt{display:flex;gap:4px;justify-content:flex-end;margin-bottom:8px;align-items:center;font-size:12px;color:var(--dim)}
.amt button{padding:5px 10px;border-radius:9px;background:#fff;font-weight:800;font-size:12px}
.amt button.on{background:var(--ink);color:#fff}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px}
/* tree */
.route{border-radius:18px;padding:10px;margin-bottom:12px}
.route.health{background:#dff5ea}
.route.science{background:#e0ecff}
.route.neta{background:#f0e4ff}
.route>.rh{font-weight:900;font-size:15px;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.route>.rh small{font-size:11px;color:var(--dim);font-weight:700}
.node{position:relative;background:#fff;border-radius:14px;padding:9px 10px;margin-bottom:14px;display:flex;gap:9px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.node:not(:last-child)::after{content:"";position:absolute;left:30px;bottom:-14px;width:4px;height:14px;background:rgba(0,0,0,.12)}
.node .ic{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#eef3f2}
.node.done .ic{background:var(--teal);color:#fff}
.node.done{box-shadow:0 0 0 2px var(--teal) inset}
.node.hid .nm{letter-spacing:.2em;color:var(--lock)}
.node .tx{flex:1;min-width:0}
.node .nm{font-weight:800;font-size:13.5px}
.node .ds{font-size:11px;color:var(--dim);line-height:1.4;margin-top:1px}
.node .rq{font-size:10.5px;color:#c0504d;margin-top:2px}
.prest{background:linear-gradient(135deg,#2a1b5c,#5a2fa8);color:#fff;border-radius:16px;padding:12px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.prest b{font-size:15px}
/* book */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px}
.cell{background:#fff;border-radius:12px;padding:8px 6px;text-align:center;font-size:11px;line-height:1.35;box-shadow:0 2px 0 #cfe2dc;min-height:84px}
.cell i{font-style:normal;font-size:26px;display:block;margin-bottom:3px}
.cell b{display:block;font-size:11.5px}
.cell.no{color:var(--lock)}
.cell.no i{filter:grayscale(1) brightness(1.4);opacity:.45}
.end{display:flex;gap:10px;align-items:center}
.end .ic{font-size:30px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv b{font-weight:800}
.hst{display:grid;grid-template-columns:52px 1fr 40px;gap:6px;align-items:center;font-size:12px;margin:6px 0}
.rank{font-size:34px;font-weight:900;color:var(--teal2);line-height:1}
#graph{width:100%;height:170px;display:block;background:#fbfefd;border-radius:12px}
.mis .bar{height:9px}
.mis .pg{font-size:11px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between}
.note{font-size:11px;color:var(--dim);line-height:1.6;margin:6px 2px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--teal2);padding:4px 2px;margin-bottom:4px}
textarea{width:100%;height:90px;border-radius:10px;border:1px solid var(--line);padding:8px;font-size:11px;font-family:monospace}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-size:18px;font-family:inherit;text-align:center}
/* modal / toast */
#modal{position:absolute;inset:0;z-index:50;background:rgba(20,35,40,.55);display:flex;align-items:center;justify-content:center;padding:18px}
#mbox{background:#fff;border-radius:22px;width:100%;max-width:400px;max-height:88%;overflow:auto;padding:18px 16px 16px;animation:pop .22s ease-out;text-align:center}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#mbox .mic{font-size:52px;line-height:1.1}
#mbox h4{font-size:19px;margin:6px 0 8px}
#mbox .mt{font-size:13px;line-height:1.75;color:#3a4c52;text-align:left}
#mbox .mt.c{text-align:center}
#mbox .mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#mbox.end{background:linear-gradient(#1b1240,#3d2287);color:#fff}
#mbox.end .mt{color:#e6defc}
.rw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.rw span{background:#f1f7f5;border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px}
#toasts{position:absolute;left:0;right:0;top:calc(64px + env(safe-area-inset-top));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(34,51,59,.92);color:#fff;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:700;max-width:90%;text-align:center;animation:tin .25s ease-out;line-height:1.45}
.toast.gold{background:linear-gradient(135deg,#f5a700,#ff7a3d)}
.toast.pur{background:linear-gradient(135deg,#6a45ff,#b04dff)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.sw{display:inline-block;width:52px;height:30px;border-radius:15px;background:#c9d6d3;position:relative;vertical-align:middle;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--teal)}
.sw.on::after{left:25px}
</style>
</head>
<body>
<div id="app">
  <!-- タイトル -->
  <div id="title">
    <div class="logo"><small>身長研究シミュレーション</small>のびろ！<br>身長ラボ</div>
    <canvas id="titleCv" width="400" height="420"></canvas>
    <div class="tbtns">
      <button class="btn" id="tContinue" hidden>つづきから</button>
      <button class="btn org" id="tNew">はじめる</button>
      <div style="display:flex;gap:8px"><button class="btn sub sm" id="tBook">📖 図鑑</button><button class="btn sub sm" id="tSet">⚙ 設定</button></div>
    </div>
    <p class="tnote">※ゲーム内の身長はシミュレーション値です。研究身長は架空の技術によるゲーム専用の数値です。</p>
  </div>

  <!-- ゲーム本体 -->
  <div id="game" hidden>
    <header id="top">
      <div class="chip"><span>💰 コイン</span><b id="vCoin">0</b></div>
      <div class="chip"><span>🔬 研究pt</span><b id="vRp">0</b></div>
      <div class="chip" id="chipDd"><span>💾 発見データ</span><b id="vDd">0</b></div>
      <button id="bSet" aria-label="設定">⚙</button>
    </header>
    <main id="main">
      <section class="tab" id="tab-home">
        <div id="stage">
          <canvas id="cv"></canvas>
          <div id="hcard">
            <div id="hLabel">現在の身長</div>
            <div id="hBig">160.0 cm</div>
            <div id="hSub"></div>
            <div id="hNext"><span id="hNextT"></span><div class="bar"><i id="hNextB"></i></div></div>
          </div>
          <div id="hint"><div class="bot">🤖</div><div class="bub" id="hintT"></div></div>
        </div>
        <div id="homeCtl">
          <button id="bMeasure">📏 測定する <small id="tapV">+1 G</small></button>
          <div class="habits">
            <button class="hab" data-h="sleep"><i>😴</i>ねる<div class="cd"></div></button>
            <button class="hab" data-h="food"><i>🍙</i>たべる<div class="cd"></div></button>
            <button class="hab" data-h="ex"><i>🏃</i>うごく<div class="cd"></div></button>
          </div>
          <div id="offCard" hidden><div id="offT"></div><button class="btn sm org" id="bOff" style="width:auto">受け取る</button></div>
          <div class="row2"><button class="btn sub sm" id="bMis">📋 ミッション<i class="badge" id="misBadge" hidden>!</i></button><button class="btn sub sm" id="bRec">📈 身長記録</button></div>
          <div id="rate"></div>
        </div>
      </section>
      <section class="tab" id="tab-lab" hidden></section>
      <section class="tab" id="tab-shop" hidden></section>
      <section class="tab" id="tab-book" hidden></section>
      <section class="tab" id="tab-mis" hidden></section>
      <section class="tab" id="tab-rec" hidden></section>
      <section class="tab" id="tab-set" hidden></section>
    </main>
    <nav id="nav">
      <button data-tab="home" class="on"><i>🏠</i>ホーム</button>
      <button data-tab="lab"><i>🔬</i>研究<em class="badge" id="labBadge" hidden>!</em></button>
      <button data-tab="shop"><i>🛒</i>ショップ</button>
      <button data-tab="book"><i>📖</i>図鑑</button>
    </nav>
  </div>

  <div id="modal" hidden><div id="mbox"></div></div>
  <div id="toasts"></div>
</div>

<script>
/*LOGIC_START*/
// ============================================================
//  ゲームデータとロジック（DOMに依存しない部分）
// ============================================================
const LY = 9.4607e17;          // 1光年(cm)
const UNIVERSE = 8.8e28;       // 観測可能な宇宙の直径(cm)
const DAYSEC = 15;             // ゲーム内1日 = 15秒
const GROW_YEARS = 4;          // 14歳→18歳まで成長期
const START_AGE = 14, START_H = 160;
const GROW_DAYS = GROW_YEARS * 365.25;

// 施設  g:コイン/秒  rp:研究pt/秒  dd:発見データ/秒  grow:研究身長の伸び(cm/秒)
const FAC = [
  {id:'bed',      icon:'🛏️', name:'快眠ベッド',        cost:15, g:0.1, rp:0.01, dd:0, grow:0,     stat:'sleep', desc:'ぐっすり眠れる研究用ベッド。睡眠は成長期のいちばんの土台。'},
  {id:'kitchen',  icon:'🍳', name:'栄養キッチン',      cost:110, g:0.8, rp:0.03, dd:0, grow:0,     stat:'food',  desc:'たんぱく質・カルシウム・ビタミンを考えた献立を作る。'},

function gfun(days){ const t=Math.min(1,Math.max(0,days/GROW_DAYS)); return 1-(1-t)*(1-t); }
function facLevel(n){ let l=0; for(const v of FAC_LV) if(n>=v) l++; return l; }
function facUnlocked(S,f){ return !f.unlock || !!S.res[f.unlock]; }
function facCost(f,owned,n){ return f.cost*Math.pow(1.15,owned)*(Math.pow(1.15,n)-1)/0.15; }
function facMaxBuy(f,owned,coins){ let n=Math.floor(Math.log(coins*0.15/(f.cost*Math.pow(1.15,owned))+1)/Math.log(1.15)); return Math.max(0,n); }
function resAvail(S,r){ return !S.res[r.id] && r.req.every(q=>S.res[q]); }
function priceOf(S,it){ if(it.id==='m_clock') return {dd:Math.ceil(3*Math.pow(1.6,S.clock||0))}; return it.price; }
function canPay(S,p){ return (p.g||0)<=S.coins+1e-9 && (p.rp||0)<=S.rp+1e-9 && (p.dd||0)<=S.dd+1e-9; }
function pay(S,p){ S.coins-=p.g||0; S.rp-=p.rp||0; S.dd-=p.dd||0; }

function calc(S){
  const C={fm:{},hs:{sleep:6,food:6,ex:6,post:3},gMul:1,rpMul:1,ddMul:1,growMul:1,allMul:1,tapMul:1,tapCps:0,
    offCap:8,offMul:1,habitMul:1,habitCd:1,ideaRate:1,expRate:0,hatAdd:0};
  for(const f of FAC) C.fm[f.id]=Math.pow(2,facLevel(S.fac[f.id]||0));
  for(const r of RES) if(S.res[r.id]&&r.fx) r.fx(C);
  for(const it of SHOP) if(S.shop[it.id]&&it.fx) it.fx(C);
  // 健康
  const raw={sleep:(S.fac.bed||0)+S.habit.sleep*0.5+C.hs.sleep, food:(S.fac.kitchen||0)+S.habit.food*0.5+C.hs.food,
    ex:(S.fac.gym||0)+S.habit.ex*0.5+C.hs.ex, post:(S.fac.posture||0)*1.5+C.hs.post};
  C.health={}; for(const k in raw) C.health[k]=1-Math.exp(-raw[k]/30);
  C.hAvg=(C.health.sleep+C.health.food+C.health.ex+C.health.post)/4;
  C.rank=C.hAvg>=.85?'S':C.hAvg>=.7?'A':C.hAvg>=.5?'B':C.hAvg>=.3?'C':'D';
  C.finalH=165+12*(C.health.sleep+C.health.food+C.health.ex)/3;
  C.postBonus=1.2*C.health.post;
  // 生産
  let g=2/60,rp=0.015,dd=0,grow=0;
  for(const f of FAC){ const n=S.fac[f.id]||0; if(!n) continue; const m=C.fm[f.id];
    g+=n*f.g*m; rp+=n*f.rp*m; dd+=n*f.dd*m; grow+=n*f.grow*m; }
  C.fameMul=1+0.25*(S.fame||0);
  C.healthMul=1+0.5*C.hAvg;
  C.cps=g*C.gMul*C.allMul*C.healthMul*C.fameMul;
  C.rps=rp*C.rpMul*C.allMul*C.fameMul;
  C.dds=dd*C.ddMul*C.fameMul;
  C.grow=grow*C.growMul*C.allMul*C.fameMul;
  C.tap=(1*C.tapMul)*C.fameMul*(1+C.hAvg)+C.cps*C.tapCps;
  C.habitCdSec=60*C.habitCd;
  C.habitCoins=Math.max(10,C.cps*12)*C.habitMul;
  C.habitRp=Math.max(0.5,C.rps*8)*C.habitMul;
  return C;
}
function realH(S,C){ return S.realBase+C.postBonus; }
function curRH(S,C){ return Math.min(UNIVERSE, realH(S,C)+S.extra+C.hatAdd); }

// 研究身長の伸び（exp有りでも解析的に）
function growExtra(S,C,dt){
  if(C.expRate>0){ const k=C.expRate, a=C.grow/k; S.extra=(S.extra+a)*Math.exp(Math.min(k*dt,700))-a; }
  else S.extra+=C.grow*dt;
  if(!isFinite(S.extra)||S.extra>UNIVERSE) S.extra=UNIVERSE;
}
function growReal(S,C,dt){
  if(S.days>=GROW_DAYS) return;
  const d0=S.days, d1=Math.min(GROW_DAYS,d0+dt/DAYSEC);
  S.realBase+=(C.finalH-START_H)*(gfun(d1)-gfun(d0));
  S.days=d1;
}
function advance(S,C,dt){
  const g=C.cps*dt; S.coins+=g; S.stats.coinsEarned+=g;
  S.rp+=C.rps*dt; S.dd+=C.dds*dt;
  growExtra(S,C,dt); growReal(S,C,dt);
  const r=curRH(S,C); if(r>S.maxRH) S.maxRH=r;
}
// 放置：成長はすぐ反映、資源は「受け取る」まで保留
function offline(S,C,sec){
  const cap=C.offCap*3600, dt=Math.min(sec,cap);
  const h0=curRH(S,C), r0=realH(S,C), d0=S.days;
  growExtra(S,C,dt); growReal(S,C,dt);
  const C2=calc(S); const h1=curRH(S,C2);
  if(h1>S.maxRH) S.maxRH=h1;
  const m=C.offMul;
  const res={sec,dt,coins:C.cps*dt*m,rp:C.rps*dt*m,dd:C.dds*dt*m,dh:h1-h0,dreal:realH(S,C2)-r0,ddays:S.days-d0};
  if(S.pending){ for(const k of['coins','rp','dd','dh','dreal','ddays','sec','dt']) S.pending[k]=(S.pending[k]||0)+res[k]; }
  else S.pending=res;
  return res;
}
function fameGain(S){ return Math.max(0,Math.floor(Math.log10(Math.max(1,S.maxRH)))-14); }

const JU=[[1e48,'極'],[1e44,'載'],[1e40,'正'],[1e36,'澗'],[1e32,'溝'],[1e28,'穣'],[1e24,'秭'],[1e20,'垓'],[1e16,'京'],[1e12,'兆'],[1e8,'億'],[1e4,'万']];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<10 && n%1) return n.toFixed(n<1?2:1);
  if(n<1e4) return Math.floor(n).toLocaleString('ja-JP');
  for(const [v,u] of JU) if(n>=v){ const x=n/v; return (x<10?x.toFixed(2):x<100?x.toFixed(1):Math.floor(x).toString())+u; }
  return n.toExponential(2);
}
function fmtLen(cm,short){
  if(cm<1000) return cm.toFixed(short?0:1)+' cm';
  if(cm<1e5) return (cm/100).toFixed(cm<1e4?2:1).replace(/\.?0+$/,short?'':'$&')+' m';
  if(cm<LY*0.05) return fmt(cm/1e5)+' km';
  return fmt(cm/LY)+' 光年';
}
function fmtPrice(p){
  const a=[]; if(p.g) a.push('💰'+fmt(p.g)); if(p.rp) a.push('🔬'+fmt(p.rp)); if(p.dd) a.push('💾'+fmt(p.dd));
  return a.length?a.join(' '):'無料';
}
function fmtTime(sec){
  sec=Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h?`${h}時間${m}分`:m?`${m}分${s?s+'秒':''}`:`${s}秒`;
}

// ---------- 効果音 ----------
let AC=null;
function sfx(type){
  if(!S||!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const seq={tap:[[880,.05,'sine',.12]],buy:[[523,.07,'square',.06],[784,.09,'square',.06]],res:[[523,.08,'triangle',.15],[659,.08,'triangle',.15],[784,.08,'triangle',.15],[1046,.16,'triangle',.15]],
      fan:[[523,.12,'square',.07],[659,.12,'square',.07],[784,.12,'square',.07],[1046,.35,'square',.07]],idea:[[1200,.06,'sine',.12],[1600,.1,'sine',.12]],
      no:[[200,.12,'sawtooth',.05]],habit:[[392,.08,'triangle',.15],[587,.12,'triangle',.15]]}[type]||[];
    let t=AC.currentTime;
    for(const [f,d,w,v] of seq){
      const o=AC.createOscillator(), g=AC.createGain(); o.type=w; o.frequency.value=f;
      g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.02); t+=d*0.85;
    }
  }catch(e){}
}

const MT=[
  {k:'taps',  t:n=>`測定を${n}回する`, n:()=>[10,20,30][Math.floor(Math.random()*3)]},
  {k:'bought',t:n=>`施設を${n}個建てる`, n:()=>1+Math.floor(Math.random()*4)},
  {k:'researched',t:n=>`研究を${n}個完了する`, n:()=>1, ok:()=>RES.some(r=>resAvail(S,r))},
  {k:'habits',t:n=>`習慣アクションを${n}回する`, n:()=>2+Math.floor(Math.random()*2)},
  {k:'ideas', t:n=>`💡ひらめきを${n}回キャッチ`, n:()=>1},
  {k:'coinsEarned',t:n=>`コインを${fmt(n)}かせぐ`, n:()=>{ const c=C?C.cps:0.1; const v=Math.max(150,c*240); const p=Math.pow(10,Math.floor(Math.log10(v))); return Math.ceil(v/p)*p; }},
];
function newMission(){
  const have=new Set((S.missions||[]).map(m=>m.k));
  const pool=MT.filter(m=>!have.has(m.k)&&(!m.ok||m.ok()));
  const m=pool[Math.floor(Math.random()*pool.length)]||MT[0];
  return {k:m.k,need:m.n(),base:S.stats[m.k]||0};
}
function misProg(m){ return Math.min(m.need,(S.stats[m.k]||0)-m.base); }
function misReward(){ return {g:Math.max(30,C.cps*60),rp:Math.max(2,C.rps*60),dd:S.res.s3?Math.max(1,Math.floor(C.dds*200)):0}; }
function checkMis(){ const n=S.missions.filter(m=>misProg(m)>=m.need).length; $('#misBadge').hidden=!n; $('#misBadge').textContent=n; }
function renderMis(){
  const el=$('#tab-mis'); const rw=misReward();
  let h=`<button class="back" id="misBack">‹ ホームへ</button><h2>📋 ミッション</h2><p class="note">短い時間で達成できる目標です。達成すると次のミッションが届きます。</p>`;
  S.missions.forEach((m,i)=>{
    const t=MT.find(x=>x.k===m.k), p=misProg(m), ok=p>=m.need;
    h+=`<div class="card mis"><div class="item"><div class="tx"><div class="nm">${t.t(m.need)}</div><div class="bar o"><i style="width:${p/m.need*100}%"></i></div><div class="pg"><span>${fmt(p)} / ${fmt(m.need)}</span><span>報酬 💰${fmt(rw.g)} 🔬${fmt(rw.rp)}${rw.dd?' 💾'+fmt(rw.dd):''}</span></div></div><button class="buy ${ok?'wear':'no'}" data-mis="${i}">${ok?'受け取る':'挑戦中'}</button></div></div>`;
  });
  h+=`<p class="note">これまでの達成数：${S.stats.missions}</p>`;
  el.innerHTML=h;
  el.querySelector('#misBack').onclick=()=>switchTab('home');
  el.querySelectorAll('[data-mis]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.mis, m=S.missions[i]; if(misProg(m)<m.need){ sfx('no'); return; }
    const r=misReward(); S.coins+=r.g; S.stats.coinsEarned+=r.g; S.rp+=r.rp; S.dd+=r.dd; S.stats.missions++;
    S.missions.splice(i,1); S.missions.push(newMission()); sfx('fan');
    toast(`ミッション達成！ 💰${fmt(r.g)} 🔬${fmt(r.rp)}${r.dd?' 💾'+fmt(r.dd):''}`,'gold');
    checkMis(); renderMis(); refresh();
  });
}

function drawGraph(){
  const cv=$('#graph'); if(!cv) return; const dpr=window.devicePixelRatio||1; const w=cv.clientWidth, hh=cv.clientHeight;
  cv.width=w*dpr; cv.height=hh*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const H=S.history.concat([[Date.now(),curRH(S,C),realH(S,C)]]);
  if(H.length<2){ g.fillStyle='#9ab'; g.font='12px sans-serif'; g.textAlign='center'; g.fillText('しばらく遊ぶとグラフが表示されます',w/2,hh/2); return; }
  const t0=H[0][0], t1=H[H.length-1][0]||t0+1, pad=28;
  const X=t=>pad+(w-pad-8)*(t-t0)/Math.max(1,t1-t0);
  const rmin=Math.min(...H.map(x=>x[2]))-1, rmax=Math.max(...H.map(x=>x[2]))+1;
  g.strokeStyle='#e3ece9'; g.lineWidth=1; for(let i=0;i<=4;i++){ const y=10+(hh-30)*i/4; g.beginPath(); g.moveTo(pad,y); g.lineTo(w-8,y); g.stroke(); }
  g.fillStyle='#8aa'; g.font='9px sans-serif'; g.textAlign='right';
  g.fillText(rmax.toFixed(0),pad-3,14); g.fillText(rmin.toFixed(0),pad-3,hh-20);
  const line=(f,col)=>{ g.strokeStyle=col; g.lineWidth=2.5; g.beginPath(); H.forEach((p,i)=>{ const y=f(p); i?g.lineTo(X(p[0]),y):g.moveTo(X(p[0]),y); }); g.stroke(); };
  if(S.res.s3){
    const lmin=Math.log10(Math.min(...H.map(x=>x[1]))), lmax=Math.max(lmin+0.1,Math.log10(Math.max(...H.map(x=>x[1]))));
    line(p=>10+(hh-30)*(1-(Math.log10(p[1])-lmin)/(lmax-lmin)),'#7a5cff');
    g.fillStyle='#7a5cff'; g.textAlign='left'; g.fillText(fmtLen(Math.pow(10,lmax),true),pad+2,22);
  }
  line(p=>10+(hh-30)*(1-(p[2]-rmin)/(rmax-rmin)),'#19a38c');
  g.fillStyle='#8aa'; g.textAlign='center'; g.fillText('はじめ',pad+10,hh-6); g.fillText('いま',w-20,hh-6);
}

function checkMiles(quiet){
  const rh=curRH(S,C), rl=realH(S,C);
  MILES.forEach((m,i)=>{
    if(S.runMiles[i]) return;
    if(!m.real && !S.res.s3 && m.h>180) return; // 研究身長が出るまでは非表示
    if((m.real?rl:rh)>=m.h){
      S.runMiles[i]=1; const first=!S.miles[i]; if(first) S.miles[i]=Date.now();
      if(m.dd) S.dd+=m.dd;
      toast(`🏅 称号「${m.name}」${m.dd?` 💾+${fmt(m.dd)}`:''}`,'gold'); if(!quiet) sfx('fan');
      if(m.h===260 && !m.real){ $('#stage').classList.remove('shake'); void $('#stage').offsetWidth; $('#stage').classList.add('shake'); }
      if(m.end && !S.endings[m.end]) showEnding(m.end);
    }
  });

  if(S.days>=GROW_DAYS && !S.adultShown){
    S.adultShown=true;
    modal({icon:'🎂',title:`${esc(S.name)}さん、18歳になりました`,html:`成長期がおわりました。実身長は <b>${realH(S,C).toFixed(1)} cm</b> で確定です。<br>健康ランク：<b>${C.rank}</b><br><br>成人後は骨の長さはほとんど変わりません。ここからは、姿勢と健康を保つことが大切です。${S.res.s3?'<br><br>…研究身長のほうは、まだまだ伸ばせますよ、所長。':''}`});

let lastRefresh=0, lastSave=0, lastHist=0, lastCalc=0;
function tick(){
  if(!S||$('#game').hidden) { lastTick=Date.now(); return; }
  if(document.hidden) return;
  const now=performance.now(), wall=Date.now(); let dt=(wall-lastTick)/1000; lastTick=wall;
  if(dt>5){ if(dt>60) doOffline(dt); else advance(S,C,dt); return; }
  if(now-lastCalc>1000){ C=calc(S); lastCalc=now; }
  advance(S,C,dt); S.stats.play+=dt;
  checkMiles(false);
  if(Date.now()-lastHist>60000||!S.history.length){ lastHist=Date.now(); S.history.push([Date.now(),curRH(S,C),realH(S,C)]); if(S.history.length>240) S.history.splice(0,S.history.length-240); }
  if(curTab==='home' && now>ideaNext && !document.querySelector('.idea')){ spawnIdea(); ideaNext=now+(45000+Math.random()*75000)/C.ideaRate; }
  if(now-lastRefresh>250){ lastRefresh=now; refresh(); }
  if(now-lastSave>5000){ lastSave=now; save(); }
}
function refresh(){
  if(!S||!C) return;
  $('#vCoin').textContent=fmt(S.coins); $('#vRp').textContent=fmt(S.rp); $('#vDd').textContent=fmt(S.dd);
  $('#chipDd').style.opacity=S.res.s3||S.dd>0?1:.45;
  $('#labBadge').hidden=!(RES.some(r=>resAvail(S,r)&&canPay(S,r.cost)));
  if(curTab==='home'){
    const rh=curRH(S,C), rl=realH(S,C), mad=!!S.res.s3;
    $('#hLabel').textContent=mad?'研究身長（ゲーム専用の架空の値）':`${S.name}さんの身長`;
    $('#hBig').textContent=mad?fmtLen(rh):rl.toFixed(1)+' cm'; $('#hBig').classList.toggle('rs',mad);
    $('#hSub').innerHTML=(mad?`実身長 ${rl.toFixed(1)} cm ・ `:'')+`${ageText()} ・ 健康 ${C.rank}`+(mad&&C.grow?`<br>伸び +${fmtLen(C.grow)}/秒${C.expRate?' ＋指数成長':''}`:'');
    let next=null, prev=START_H;
    for(const m of MILES){ const v=m.real?rl:rh; if(m.real&&mad) continue; if(!mad&&!m.real&&m.h>180) break; if(v<m.h){ next=m; break; } prev=m.h; }
    if(!mad && !next) next={h:180,name:'目標180cm（研究で…？）'};
    if(next){ const v=next.real?rl:rh; const p=mad?Math.max(0,(Math.log(v)-Math.log(prev))/(Math.log(next.h)-Math.log(prev))):Math.max(0,(v-START_H)/(next.h-START_H));
      $('#hNextT').textContent=`次の目標：${fmtLen(next.h,true)}「${next.name}」`; $('#hNextB').style.width=Math.min(100,p*100)+'%'; $('#hNext').hidden=false; }
    else $('#hNext').hidden=true;
    $('#tapV').textContent='+'+fmt(C.tap)+' G';
    const now=Date.now();
    document.querySelectorAll('.hab').forEach(b=>{ const at=S.habitAt[b.dataset.h]||0, r=Math.max(0,1-(now-at)/(C.habitCdSec*1000));
      b.classList.toggle('wait',r>0); b.querySelector('.cd').style.width=(r>0?(1-r)*100:100)+'%'; });
    const p=S.pending; $('#offCard').hidden=!p;
    if(p) $('#offT').innerHTML=`<b>放置報酬</b><br>前回から${fmtTime(p.sec)}経過。 💰${fmt(p.coins)} 🔬${fmt(p.rp)}${p.dd>=0.01?' 💾'+fmt(p.dd):''}`;
    $('#rate').textContent=`毎秒 💰${fmt(C.cps)} ・ 🔬${fmt(C.rps)}${C.dds?` ・ 💾${fmt(C.dds)}`:''}`;
    if(Math.floor(now/9000)!==refresh._h){ refresh._h=Math.floor(now/9000); $('#hintT').textContent=hintText(); }
    else if(S.stats.taps<3||!S.res.h1) $('#hintT').textContent=hintText();
  }
  else if(curTab==='lab') refreshLab();
  else if(curTab==='shop') refreshShop();
  else if(curTab==='mis'){ /* 進行はタブを開いたときに更新 */ }
  checkMis();
}

  for(let c=0;c<=hcm;c+=10){ const y=base-c*px; const L=c%50===0; g.fillRect(x-w/2,y,L?w*0.6:w*0.35,1); if(c%50===0&&c>0&&px>0.35) g.fillText(c,x-w/2-3,y+4); }
  // ヘッドプレート
  const head=Math.min(rh,hcm); const since=(performance.now()-measureT)/1000; const drop=since<0.25?(1-since/0.25)*40:0;
  const py=base-head*px-drop; g.fillStyle=look==='laser'?'#ff3b3b':col[1]; g.fillRect(x-w/2,py-3,w+Math.max(30,40*px),5);
  if(look==='laser'){ g.strokeStyle='rgba(255,60,60,.6)'; g.lineWidth=2; g.beginPath(); g.moveTo(x,py); g.lineTo(x+60*px,py); g.stroke(); }
  if(look==='digital'||look==='sat'){ g.fillStyle='#14231f'; const dw=Math.max(54,48*px); rr(x-dw/2,top-22,dw,18,4); g.fill(); g.fillStyle='#4dffb0'; g.font='bold 11px monospace'; g.textAlign='center'; g.fillText(rh>=1000?'ERROR':rh.toFixed(1),x,top-9); }
}

function drawObj(g,o,x,base,px,t){
  const h=o.s*px, w=h*o.w;
  g.save();
  switch(o.k){
    case 'door': g.fillStyle='#a8743f'; g.fillRect(x,base-h,w,h); g.fillStyle='#8a5a2b'; g.fillRect(x+w*0.12,base-h*0.92,w*0.76,h*0.38); g.fillRect(x+w*0.12,base-h*0.48,w*0.76,h*0.4); g.fillStyle='#ffd34d'; g.beginPath(); g.arc(x+w*0.82,base-h*0.5,Math.max(1,w*0.06),0,6.29); g.fill(); break;
    case 'emoji': g.font=`${h*1.05}px sans-serif`; g.textAlign='left'; g.textBaseline='bottom'; g.fillText(o.e,x,base+h*0.08); break;
    case 'house': g.fillStyle='#f6e7c8'; g.fillRect(x,base-h*0.6,w,h*0.6); g.fillStyle='#d9534f'; g.beginPath(); g.moveTo(x-w*0.08,base-h*0.6); g.lineTo(x+w/2,base-h); g.lineTo(x+w*1.08,base-h*0.6); g.closePath(); g.fill(); g.fillStyle='#7cc8f2'; g.fillRect(x+w*0.15,base-h*0.45,w*0.22,h*0.17); g.fillStyle='#8a5a2b'; g.fillRect(x+w*0.6,base-h*0.34,w*0.2,h*0.34); break;
    case 'bldg': g.fillStyle='#8fa3b8'; g.fillRect(x,base-h,w,h); g.fillStyle='#d8f0ff'; for(let i=0;i<14;i++) for(let j=0;j<3;j++) g.fillRect(x+w*(0.12+j*0.29),base-h*(0.95-i*0.066),w*0.18,h*0.035); break;
    case 'tower': g.strokeStyle='#e8413a'; g.lineWidth=Math.max(1,w*0.05); g.beginPath(); g.moveTo(x,base); g.lineTo(x+w/2,base-h); g.lineTo(x+w,base); g.stroke();
      for(let i=1;i<7;i++){ const yy=base-h*i/7, hw=w/2*(1-i/7); g.beginPath(); g.moveTo(x+w/2-hw,yy); g.lineTo(x+w/2+hw,yy); g.stroke(); }
      g.fillStyle='#fff'; g.fillRect(x+w*0.36,base-h*0.4,w*0.28,h*0.03); break;
    case 'stree': g.fillStyle='#c5d3e0'; g.beginPath(); g.moveTo(x,base); g.lineTo(x+w*0.45,base-h); g.lineTo(x+w*0.55,base-h); g.lineTo(x+w,base); g.closePath(); g.fill();
      g.fillStyle='#8fa3b8'; g.fillRect(x+w*0.2,base-h*0.55,w*0.6,h*0.025); g.fillRect(x+w*0.3,base-h*0.72,w*0.4,h*0.02); break;
    case 'mt': case 'mt2': { const c=o.k==='mt'?'#5a7fb5':'#7d8796'; g.fillStyle=c; g.beginPath(); g.moveTo(x,base); if(o.k==='mt'){ g.lineTo(x+w*0.44,base-h); g.lineTo(x+w*0.56,base-h); } else { g.lineTo(x+w*0.3,base-h*0.6); g.lineTo(x+w*0.4,base-h*0.75); g.lineTo(x+w*0.5,base-h); g.lineTo(x+w*0.62,base-h*0.7); } g.lineTo(x+w,base); g.closePath(); g.fill();
      g.fillStyle='#fff'; g.beginPath(); if(o.k==='mt'){ g.moveTo(x+w*0.36,base-h*0.8); g.lineTo(x+w*0.44,base-h); g.lineTo(x+w*0.56,base-h); g.lineTo(x+w*0.64,base-h*0.8); g.lineTo(x+w*0.55,base-h*0.85); g.lineTo(x+w*0.48,base-h*0.78); } else { g.moveTo(x+w*0.42,base-h*0.84); g.lineTo(x+w*0.5,base-h); g.lineTo(x+w*0.58,base-h*0.82); } g.closePath(); g.fill(); break; }
    case 'ball': { const r=h/2, cx=x+r, cy=base-r; if(o.glow){ g.shadowColor='#ffb300'; g.shadowBlur=Math.min(60,r*0.6); } const gr=g.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r); gr.addColorStop(0,o.c[0]); gr.addColorStop(1,o.c[1]); g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,r,0,6.29); g.fill(); g.shadowBlur=0;
      if(o.band){ g.strokeStyle='rgba(150,90,50,.45)'; g.lineWidth=r*0.08; for(const k of[-0.35,0,0.3]){ g.beginPath(); g.moveTo(cx-r*Math.sqrt(1-k*k),cy+k*r); g.lineTo(cx+r*Math.sqrt(1-k*k),cy+k*r); g.stroke(); } } break; }
    case 'orbits': { const r=h/2, cx=x+r, cy=base-r; g.strokeStyle='rgba(180,200,255,.35)'; g.lineWidth=1; for(let i=1;i<=8;i++){ g.beginPath(); g.arc(cx,cy,r*Math.pow(i/8,1.6),0,6.29); g.stroke(); }
      g.fillStyle='#ffd34d'; g.beginPath(); g.arc(cx,cy,Math.max(2,r*0.02),0,6.29); g.fill(); break; }
    case 'galaxy': { const r=h/2, cx=x+r, cy=base-r; g.translate(cx,cy); if(o.tilt) g.scale(1,0.45); g.rotate(t*0.05);
      const gr=g.createRadialGradient(0,0,0,0,0,r); gr.addColorStop(0,'rgba(255,240,200,.95)'); gr.addColorStop(0.25,'rgba(200,170,255,.45)'); gr.addColorStop(1,'rgba(80,60,160,0)'); g.fillStyle=gr; g.beginPath(); g.arc(0,0,r,0,6.29); g.fill();
      g.fillStyle='rgba(255,255,255,.7)'; for(let i=0;i<220;i++){ const a=i*0.35, d=(i/220)*r; g.fillRect(Math.cos(a+(i%2)*Math.PI)*d,Math.sin(a+(i%2)*Math.PI)*d,1.5,1.5); } break; }
  }
  g.restore();
  // ラベル
  if(h>14){ g.fillStyle='rgba(0,0,0,.55)'; g.font='bold 10px sans-serif'; g.textAlign='left'; const lb=`${o.name} ${fmtLen(o.s,true)}`; const tw=g.measureText(lb).width;
    const ly=Math.max(14,base-h-4); rr(x-2,ly-11,tw+8,14,4); g.fill(); g.fillStyle='#fff'; g.fillText(lb,x+2,ly); }
}

function drawScene(t){
  const W=CW, H=CH; ctx.setTransform(dpr,0,0,dpr,0,0);
  const rh=curRH(S,C), L=Math.log10(rh);
  const hc=$('#hcard'), hn=$('#hint'); const topPad=hc.offsetTop+hc.offsetHeight+18, base=H-Math.max(40,hn.offsetHeight+16);
  const charH=Math.max(60,base-topPad)*Math.min(1,rh/190), px=charH/rh, cx=W*0.5;
  const indoor=rh<260;
  if(indoor){
    // 研究所の部屋
    const wallTop=base-260*px;
    ctx.fillStyle='#f4efe6'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#e8dfcf'; ctx.fillRect(0,Math.max(0,wallTop),W,6);
    const wx=W*0.68, wy=base-200*px, ww=Math.min(W*0.26,90*px), wh=80*px;
    ctx.fillStyle='#bfe6fb'; ctx.fillRect(wx,wy,ww,wh); ctx.strokeStyle='#c9b79c'; ctx.lineWidth=4; ctx.strokeRect(wx,wy,ww,wh); ctx.beginPath(); ctx.moveTo(wx+ww/2,wy); ctx.lineTo(wx+ww/2,wy+wh); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(wx+ww*0.3,wy+wh*0.35,wh*0.12,0,6.29); ctx.arc(wx+ww*0.42,wy+wh*0.32,wh*0.15,0,6.29); ctx.fill();
    { const pw=Math.min(W*0.15,40*px), ph=pw*0.75, pxl=W*0.03, pyl=base-188*px; ctx.fillStyle='#fff'; rr(pxl,pyl,pw,ph,4); ctx.fill(); ctx.fillStyle='#ff8a3d'; ctx.font=`bold ${Math.max(8,pw*0.22)}px sans-serif`; ctx.textAlign='center'; ctx.fillText('目標',pxl+pw/2,pyl+ph*0.42); ctx.fillText('180cm',pxl+pw/2,pyl+ph*0.8); }
    ctx.fillStyle='#d9c8a9'; ctx.fillRect(0,base,W,H-base); ctx.fillStyle='#cdb994'; for(let i=0;i<W;i+=40) ctx.fillRect(i,base,2,H-base);
    // 家具
    const emo=(e,x,s)=>{ ctx.font=`${s*px}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(e,x,base+s*px*0.08); ctx.textBaseline='alphabetic'; };
    if(S.shop.f_shelf){ ctx.fillStyle='#9a6b3f'; ctx.fillRect(W*0.82,base-150*px,50*px,150*px); ctx.fillStyle='#6a4524'; for(let i=1;i<4;i++) ctx.fillRect(W*0.82,base-150*px+i*37*px,50*px,3);
      const bc=['#e8473f','#4a90e2','#f5b70a','#19a38c']; for(let i=0;i<4;i++) for(let j=0;j<5;j++){ ctx.fillStyle=bc[(i+j)%4]; ctx.fillRect(W*0.82+4*px+j*8.5*px,base-150*px+i*37*px+8*px,6*px,28*px); } }
    if(S.shop.f_plant) emo('🪴',W*0.08,70);
    if(S.shop.f_sofa) emo('🛋️',W*0.78,75);
    if(S.shop.f_monitor){ ctx.fillStyle='#222'; rr(W*0.62,base-175*px,70*px,42*px,4); ctx.fill(); ctx.fillStyle='#19a38c'; ctx.fillRect(W*0.62+4*px,base-171*px,62*px,34*px); ctx.fillStyle='#fff'; ctx.font=`${Math.max(7,8*px)}px sans-serif`; ctx.textAlign='center'; ctx.fillText(rh.toFixed(1),W*0.62+35*px,base-150*px); }
    if(S.shop.f_scope) emo('🔭',W*0.92,90);
    drawMeter(ctx,cx-charH*0.32,base,px,rh,t);
  }else{
    // 空・宇宙
    let top,bot;
    if(L<6){ top=mix('#6ec0ee','#3a7fd0',(L-2.4)/3.6); bot=mix('#d8f1ff','#a9d4f5',(L-2.4)/3.6); }
    else if(L<7.6){ const k=(L-6)/1.6; top=mix('#3a7fd0','#02030a',k); bot=mix('#a9d4f5','#0b1030',k); }
    else if(L<17){ top='#02030a'; bot=mix('#0b1030','#120a2a',(L-7.6)/9); }
    else { top=mix('#02030a','#0d0620',(L-17)/5); bot=mix('#120a2a','#24104a',(L-17)/8); }
    const gr=ctx.createLinearGradient(0,0,0,H); gr.addColorStop(0,top); gr.addColorStop(1,bot); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
    const sa=Math.max(0,Math.min(1,(L-6.3)/1.2));
    if(sa>0){ for(const s of STARS){ ctx.globalAlpha=sa*(0.5+0.5*Math.sin(t*1.5+s[3])); ctx.fillStyle='#fff'; ctx.fillRect(s[0]*W,s[1]*H,s[2],s[2]); } ctx.globalAlpha=1; }
    if(L>25.5){ ctx.globalAlpha=Math.min(1,(L-25.5)/2); for(let i=0;i<60;i++){ const a=STARS[i]; ctx.fillStyle=`hsla(${(i*37)%360},70%,75%,.5)`; ctx.beginPath(); ctx.ellipse(a[1]*W,a[0]*H,3+a[2]*2,1.5+a[2],a[3],0,6.29); ctx.fill(); } ctx.globalAlpha=1; }
    // 地球（足もと）
    const R=6.371e8*px;
    if(R>4000){ ctx.fillStyle='#7cc46b'; ctx.fillRect(0,base,W,H-base); ctx.fillStyle='#5aa851'; ctx.fillRect(0,base,W,3);
      if(rh<3e5){ const labH=900*px; if(labH>4){ const lx=cx-charH*0.45-labH*1.5; ctx.fillStyle='#e9f3f1'; ctx.fillRect(lx,base-labH,labH*1.4,labH); ctx.fillStyle='#19a38c'; ctx.fillRect(lx,base-labH,labH*1.4,labH*0.18);
        ctx.fillStyle='#bfe6fb'; for(let i=0;i<3;i++) ctx.fillRect(lx+labH*(0.12+i*0.42),base-labH*0.65,labH*0.3,labH*0.22);
        if(labH>30){ ctx.fillStyle='#fff'; ctx.font=`bold ${labH*0.12}px sans-serif`; ctx.textAlign='center'; ctx.fillText('身長ラボ',lx+labH*0.7,base-labH*0.86); } } }
    }else if(R>0.6){
      ctx.save(); ctx.shadowColor='rgba(120,180,255,.8)'; ctx.shadowBlur=Math.min(30,R*0.1);
      const eg=ctx.createRadialGradient(cx-R*0.3,base+R*0.7,R*0.1,cx,base+R,R); eg.addColorStop(0,'#5fb0ff'); eg.addColorStop(1,'#1f4fa0');
      ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(cx,base+R,R,0,6.29); ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.arc(cx,base+R,R,0,6.29); ctx.clip(); ctx.fillStyle='#5cae5a';
      for(const [a,b,c] of[[-0.4,0.3,0.35],[0.3,0.55,0.3],[0.1,-0.4,0.25],[-0.6,-0.2,0.2]]){ ctx.beginPath(); ctx.ellipse(cx+a*R,base+R+b*R,c*R,c*R*0.6,a,0,6.29); ctx.fill(); }
      ctx.restore();
      if(R<60){ ctx.fillStyle='#bfe0ff'; ctx.font='10px sans-serif'; ctx.textAlign='left'; ctx.fillText('← 足もとの地球',cx+R+charH*0.12,base+Math.min(R,20)); }
    }else{ ctx.fillStyle='#bfe0ff'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.fillText('足もとの地球は見えないほど小さい',W-6,base-4); }
    // 比較オブジェクト（右側）
    const vis=OBJS.filter(o=>{ const h=o.s*px; return h>10 && h<H*0.9; });
    let ox=cx+charH*0.22;
    for(const o of vis.slice(-2)){ const h=o.s*px, w=h*o.w; drawObj(ctx,o,ox,base,px,t); ox+=w+12; }
    // 高さの線
    ctx.setLineDash([5,4]); ctx.lineWidth=1;
    for(const l of LINES){ const y=base-l.s*px; if(y<16||y>base-12) continue; ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.fillText(l.name,W-6,y-3); }
    ctx.setLineDash([]);
    if(rh<2000) drawMeter(ctx,cx-charH*0.32,base,px,rh,t);
  }
  // 左端の目盛り
  if(!indoor){ const visCm=base/px; const unit=visCm<1000?1:visCm<1e5?100:visCm<LY*0.05?1e5:LY; const vu=visCm/unit;
    let step=Math.pow(10,Math.floor(Math.log10(vu/4))); if(vu/step>8) step*=2; if(vu/step>8) step*=2.5; step*=unit;
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='9px sans-serif'; ctx.textAlign='left';
    for(let i=1;i*step<visCm&&i<20;i++){ const v=i*step, y=base-v*px; ctx.fillRect(0,y,8,1); if(y<base-8) ctx.fillText(fmtLen(v,true),10,y+3); } }
  // キャラクター
  const since=(performance.now()-measureT)/1000; const sq=since<0.2?1-Math.sin(since/0.2*Math.PI)*0.025:1;
  drawChar(ctx,cx,base,charH*sq,S.outfit,t,{hat:!!S.shop.m_hat});
  // 頭の線
  const hy=base-charH*sq; ctx.strokeStyle=S.res.s3?'rgba(122,92,255,.85)':'rgba(255,138,61,.9)'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(0,hy); ctx.lineTo(cx-charH*0.05,hy); ctx.stroke(); ctx.setLineDash([]);
}

let rafT0=performance.now();
function loop(){
  requestAnimationFrame(loop);
  if(!S||!C||$('#game').hidden||curTab!=='home'||document.hidden) return;
  if(cv.width<2) resizeCv();
  try{ drawScene((performance.now()-rafT0)/1000); }catch(e){ console.error(e); }
}
requestAnimationFrame(loop);

// タイトルのキャラ
function drawTitleChar(){
  const c=$('#titleCv'), g=c.getContext('2d');
  const anim=()=>{ if($('#title').hidden) return; g.clearRect(0,0,400,420); const t=performance.now()/1000;
    g.fillStyle='#c8955a'; g.fillRect(120,40,26,370); g.fillStyle='#8a5a2b'; for(let i=0;i<18;i++) g.fillRect(120,400-i*20,i%5===0?16:9,2);
    g.fillRect(120,60+Math.sin(t*2)*4,90,8);
    drawChar(g,250,410,340+Math.sin(t*2)*4,'coat',t,{});
    requestAnimationFrame(anim); };
  anim();
}

showTitle();
</script>
