<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>のびろ！身長ラボ</title>
<meta name="description" content="身長研究所の所長になって、睡眠・栄養・運動の習慣から育成スタート。研究が進むと100時間ルーム、重力装置、巨人化カプセル…と研究身長がどんどん暴走する放置育成ゲーム。">
<meta name="theme-color" content="#19a38c">
<style>
:root{--bg:#e8f6f1;--card:#fff;--ink:#22333b;--dim:#6b7f86;--teal:#19a38c;--teal2:#0f7d6b;--orange:#ff8a3d;--pink:#ff6f91;--purple:#7a5cff;--gold:#f5b70a;--line:#d5e7e1;--lock:#b9c6c4}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#cfe9e1;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.12)}
/* ---------- title ---------- */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:linear-gradient(#8fd9f5,#dff6ff 55%,#bde9c9 55.2%,#9fd9ad);overflow:hidden}
#title .logo{font-size:44px;font-weight:900;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 #0f7d6b,0 6px 0 #0a5c4f,0 10px 18px rgba(0,0,0,.25);text-align:center;line-height:1.1}
#title .logo small{display:block;font-size:15px;letter-spacing:.3em;margin-bottom:6px;text-shadow:0 2px 0 #0f7d6b}
#titleCv{width:200px;height:210px}
.tbtns{display:flex;flex-direction:column;gap:10px;width:min(280px,90%)}
.btn{display:block;width:100%;padding:14px 16px;border-radius:16px;font-size:17px;font-weight:800;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal2);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal2)}
.btn.sub{background:#fff;color:var(--teal2);box-shadow:0 4px 0 #b7d8cf}
.btn.org{background:var(--orange);box-shadow:0 4px 0 #c8601c}
.btn.pur{background:var(--purple);box-shadow:0 4px 0 #4d35b8}
.btn.red{background:#e2504c;box-shadow:0 4px 0 #a6302d}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.tnote{font-size:11px;color:#3d5a57;text-align:center;line-height:1.6;max-width:320px}
/* ---------- game frame ---------- */
#game{position:absolute;inset:0;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--teal);color:#fff}
.chip{flex:1;min-width:0;background:rgba(0,0,0,.18);border-radius:12px;padding:5px 8px;line-height:1.15}
.chip b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip span{font-size:10px;opacity:.85;white-space:nowrap}
#bSet{flex:none;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.18);font-size:18px;color:#fff}
#main{flex:1;min-height:0;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}
#tab-home{padding:0;display:flex;flex-direction:column;overflow:hidden}
#nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;padding:7px 0 8px;font-size:11px;font-weight:700;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#nav button i{font-style:normal;font-size:22px;line-height:1.1;filter:grayscale(.7);opacity:.7}
#nav button.on{color:var(--teal2)}
#nav button.on i{filter:none;opacity:1}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--pink);color:#fff;font-size:10px;line-height:16px;font-style:normal}
/* ---------- home ---------- */
#stage{flex:1;min-height:200px;position:relative;overflow:hidden;background:#f4efe6}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hcard{position:absolute;left:8px;right:8px;top:8px;background:rgba(255,255,255,.88);border-radius:14px;padding:8px 12px 9px;box-shadow:0 3px 10px rgba(0,0,0,.12);pointer-events:none;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:end}
#hcard>#hLabel{grid-column:1/3}
#hNext{grid-column:1/3}
#hSub{text-align:right;align-self:center}
#hLabel{font-size:11px;color:var(--dim);font-weight:700}
#hBig{font-size:28px;font-weight:900;line-height:1.1;color:var(--ink);white-space:nowrap}
#hBig.rs{color:var(--purple)}
#hSub{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
#hNext{margin-top:5px;font-size:10.5px;color:var(--ink)}
.bar{height:7px;background:#e3ece9;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#53d6b9);border-radius:4px;transition:width .3s}
.bar.p i{background:linear-gradient(90deg,var(--purple),#c08bff)}
.bar.o i{background:linear-gradient(90deg,var(--orange),#ffc15e)}
#hint{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:6px;align-items:flex-end;pointer-events:none}
#hint .bot{font-size:22px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
#hint .bub{background:rgba(255,255,255,.9);border-radius:12px 12px 12px 3px;padding:5px 9px;font-size:11.5px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.idea{position:absolute;width:54px;height:54px;border-radius:50%;font-size:30px;background:radial-gradient(circle,#fffbd0,#ffe066 60%,rgba(255,224,102,0) 72%);animation:float 2.2s ease-in-out infinite;z-index:3}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
.flt{position:absolute;z-index:4;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.3);pointer-events:none;animation:flt 1s ease-out forwards;white-space:nowrap}
@keyframes flt{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
#homeCtl{flex:none;padding:8px 10px 8px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
#bMeasure{width:100%;padding:12px;border-radius:18px;background:linear-gradient(#ff9d55,var(--orange));color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px 0 #c8601c;display:flex;align-items:center;justify-content:center;gap:10px}
#bMeasure:active{transform:translateY(4px);box-shadow:0 1px 0 #c8601c}
#bMeasure small{font-size:13px;font-weight:700;background:rgba(0,0,0,.15);border-radius:8px;padding:2px 8px}
.habits{display:flex;gap:7px}
.hab{flex:1;position:relative;overflow:hidden;background:#fff;border-radius:14px;padding:6px 2px;font-size:12px;font-weight:800;box-shadow:0 3px 0 #c7ddd6;line-height:1.2}
.hab i{font-style:normal;font-size:20px;display:block}
.hab .cd{position:absolute;left:0;bottom:0;height:4px;background:var(--teal);width:0}
.hab.wait{color:var(--lock)}
.hab.wait i{filter:grayscale(1);opacity:.5}
.hab.wait .cd{background:var(--lock)}
.row2{display:flex;gap:7px}
.row2 .btn{flex:1;position:relative}
#offCard{background:linear-gradient(135deg,#fff7e0,#ffe9c2);border:2px solid #ffcf7a;border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:12px;line-height:1.45}
#offCard div{flex:1}
#rate{font-size:11px;color:var(--dim);text-align:center}
/* ---------- lists ---------- */
h2{font-size:17px;margin:6px 2px 8px;display:flex;align-items:center;gap:6px}
h3{font-size:14px;margin:14px 2px 6px;color:var(--teal2)}
.subtabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:-12px;z-index:2;background:var(--bg);padding:6px 0}
.subtabs button{flex:1;padding:9px 4px;border-radius:12px;background:#fff;font-weight:800;font-size:13px;color:var(--dim);box-shadow:0 2px 0 #c7ddd6}
.subtabs button.on{background:var(--teal);color:#fff;box-shadow:0 2px 0 var(--teal2)}
.card{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 0 #cfe2dc}
.item{display:flex;gap:10px;align-items:center}
.item .ic{flex:none;width:46px;height:46px;border-radius:12px;background:#eef7f4;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative}
.item .ic em{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:8px;padding:0 5px;line-height:16px}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:14px}
.item .ds{font-size:11px;color:var(--dim);line-height:1.45;margin-top:1px}
.item .ef{font-size:11px;color:var(--teal2);font-weight:700;margin-top:2px}
.buy{flex:none;min-width:84px;padding:8px 8px;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;font-size:12px;line-height:1.25;box-shadow:0 3px 0 var(--teal2)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal2)}
.buy.no{background:#c9d6d3;box-shadow:0 3px 0 #a9b9b5;color:#fff}
.buy.done{background:#fff;color:var(--teal2);box-shadow:none;border:2px solid var(--teal)}
.buy.wear{background:var(--orange);box-shadow:0 3px 0 #c8601c}
.locked{opacity:.6}
.locked .ic{filter:grayscale(1)}
.amt{display:flex;gap:4px;justify-content:flex-end;margin-bottom:8px;align-items:center;font-size:12px;color:var(--dim)}
.amt button{padding:5px 10px;border-radius:9px;background:#fff;font-weight:800;font-size:12px}
.amt button.on{background:var(--ink);color:#fff}
.stars{color:var(--gold);font-size:11px;letter-spacing:-1px}
/* tree */
.route{border-radius:18px;padding:10px;margin-bottom:12px}
.route.health{background:#dff5ea}
.route.science{background:#e0ecff}
.route.neta{background:#f0e4ff}
.route>.rh{font-weight:900;font-size:15px;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.route>.rh small{font-size:11px;color:var(--dim);font-weight:700}
.node{position:relative;background:#fff;border-radius:14px;padding:9px 10px;margin-bottom:14px;display:flex;gap:9px;align-items:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.node:not(:last-child)::after{content:"";position:absolute;left:30px;bottom:-14px;width:4px;height:14px;background:rgba(0,0,0,.12)}
.node .ic{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:#eef3f2}
.node.done .ic{background:var(--teal);color:#fff}
.node.done{box-shadow:0 0 0 2px var(--teal) inset}
.node.hid .nm{letter-spacing:.2em;color:var(--lock)}
.node .tx{flex:1;min-width:0}
.node .nm{font-weight:800;font-size:13.5px}
.node .ds{font-size:11px;color:var(--dim);line-height:1.4;margin-top:1px}
.node .rq{font-size:10.5px;color:#c0504d;margin-top:2px}
.prest{background:linear-gradient(135deg,#2a1b5c,#5a2fa8);color:#fff;border-radius:16px;padding:12px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.prest b{font-size:15px}
/* book */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:7px}
.cell{background:#fff;border-radius:12px;padding:8px 6px;text-align:center;font-size:11px;line-height:1.35;box-shadow:0 2px 0 #cfe2dc;min-height:84px}
.cell i{font-style:normal;font-size:26px;display:block;margin-bottom:3px}
.cell b{display:block;font-size:11.5px}
.cell.no{color:var(--lock)}
.cell.no i{filter:grayscale(1) brightness(1.4);opacity:.45}
.end{display:flex;gap:10px;align-items:center}
.end .ic{font-size:30px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}
.kv b{font-weight:800}
.hst{display:grid;grid-template-columns:52px 1fr 40px;gap:6px;align-items:center;font-size:12px;margin:6px 0}
.rank{font-size:34px;font-weight:900;color:var(--teal2);line-height:1}
#graph{width:100%;height:170px;display:block;background:#fbfefd;border-radius:12px}
.mis .bar{height:9px}
.mis .pg{font-size:11px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between}
.note{font-size:11px;color:var(--dim);line-height:1.6;margin:6px 2px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;color:var(--teal2);padding:4px 2px;margin-bottom:4px}
textarea{width:100%;height:90px;border-radius:10px;border:1px solid var(--line);padding:8px;font-size:11px;font-family:monospace}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-size:18px;font-family:inherit;text-align:center}
/* modal / toast */
#modal{position:absolute;inset:0;z-index:50;background:rgba(20,35,40,.55);display:flex;align-items:center;justify-content:center;padding:18px}
#mbox{background:#fff;border-radius:22px;width:100%;max-width:400px;max-height:88%;overflow:auto;padding:18px 16px 16px;animation:pop .22s ease-out;text-align:center}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#mbox .mic{font-size:52px;line-height:1.1}
#mbox h4{font-size:19px;margin:6px 0 8px}
#mbox .mt{font-size:13px;line-height:1.75;color:#3a4c52;text-align:left}
#mbox .mt.c{text-align:center}
#mbox .mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#mbox.end{background:linear-gradient(#1b1240,#3d2287);color:#fff}
#mbox.end .mt{color:#e6defc}
.rw{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.rw span{background:#f1f7f5;border-radius:10px;padding:5px 10px;font-weight:800;font-size:14px}
#toasts{position:absolute;left:0;right:0;top:calc(64px + env(safe-area-inset-top));z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(34,51,59,.92);color:#fff;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:700;max-width:90%;text-align:center;animation:tin .25s ease-out;line-height:1.45}
.toast.gold{background:linear-gradient(135deg,#f5a700,#ff7a3d)}
.toast.pur{background:linear-gradient(135deg,#6a45ff,#b04dff)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.sw{display:inline-block;width:52px;height:30px;border-radius:15px;background:#c9d6d3;position:relative;vertical-align:middle;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--teal)}
.sw.on::after{left:25px}
</style>
</head>
<body>
<div id="app">
  <!-- タイトル -->
  <div id="title">
    <div class="logo"><small>身長研究シミュレーション</small>のびろ！<br>身長ラボ</div>
    <canvas id="titleCv" width="400" height="420"></canvas>
    <div class="tbtns">
      <button class="btn" id="tContinue" hidden>つづきから</button>
      <button class="btn org" id="tNew">はじめる</button>
      <div style="display:flex;gap:8px"><button class="btn sub sm" id="tBook">📖 図鑑</button><button class="btn sub sm" id="tSet">⚙ 設定</button></div>
    </div>
    <p class="tnote">※ゲーム内の身長はシミュレーション値です。研究身長は架空の技術によるゲーム専用の数値です。</p>
  </div>

  <!-- ゲーム本体 -->
  <div id="game" hidden>
    <header id="top">
      <div class="chip"><span>💰 コイン</span><b id="vCoin">0</b></div>
      <div class="chip"><span>🔬 研究pt</span><b id="vRp">0</b></div>
      <div class="chip" id="chipDd"><span>💾 発見データ</span><b id="vDd">0</b></div>
      <button id="bSet" aria-label="設定">⚙</button>
    </header>
    <main id="main">
      <section class="tab" id="tab-home">
        <div id="stage">
          <canvas id="cv"></canvas>
          <div id="hcard">
            <div id="hLabel">現在の身長</div>
            <div id="hBig">160.0 cm</div>
            <div id="hSub"></div>
            <div id="hNext"><span id="hNextT"></span><div class="bar"><i id="hNextB"></i></div></div>
          </div>
          <div id="hint"><div class="bot">🤖</div><div class="bub" id="hintT"></div></div>
        </div>
        <div id="homeCtl">
          <button id="bMeasure">📏 測定する <small id="tapV">+1 G</small></button>
          <div class="habits">
            <button class="hab" data-h="sleep"><i>😴</i>ねる<div class="cd"></div></button>
            <button class="hab" data-h="food"><i>🍙</i>たべる<div class="cd"></div></button>
            <button class="hab" data-h="ex"><i>🏃</i>うごく<div class="cd"></div></button>
          </div>
          <div id="offCard" hidden><div id="offT"></div><button class="btn sm org" id="bOff" style="width:auto">受け取る</button></div>
          <div class="row2"><button class="btn sub sm" id="bMis">📋 ミッション<i class="badge" id="misBadge" hidden>!</i></button><button class="btn sub sm" id="bRec">📈 身長記録</button></div>
          <div id="rate"></div>
        </div>
      </section>
      <section class="tab" id="tab-lab" hidden></section>
      <section class="tab" id="tab-shop" hidden></section>
      <section class="tab" id="tab-book" hidden></section>
      <section class="tab" id="tab-mis" hidden></section>
      <section class="tab" id="tab-rec" hidden></section>
      <section class="tab" id="tab-set" hidden></section>
    </main>
    <nav id="nav">
      <button data-tab="home" class="on"><i>🏠</i>ホーム</button>
      <button data-tab="lab"><i>🔬</i>研究<em class="badge" id="labBadge" hidden>!</em></button>
      <button data-tab="shop"><i>🛒</i>ショップ</button>
      <button data-tab="book"><i>📖</i>図鑑</button>
    </nav>
  </div>

  <div id="modal" hidden><div id="mbox"></div></div>
  <div id="toasts"></div>
</div>
