<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おべんとうタワー</title>
<meta name="theme-color" content="#ffe6d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --ink:#5a3a2e; --ink-dim:#9a7564; --cream:#fff8ee; --peach:#ffe2d2;
  --pink:#ff7fa3; --pink-d:#e0577f; --yellow:#ffd34d; --yellow-d:#e2a91c;
  --green:#6cc35a; --green-d:#469a37; --blue:#7fb2ff; --blue-d:#5288e0;
  --font:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Meiryo',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#ffeede; color:var(--ink); font-family:var(--font); font-weight:800;
  overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:none;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  background:linear-gradient(#fff8ee,#ffe3d4)}
/* HUD */
#hud{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px}
.chip{background:#fff;border-radius:14px;padding:4px 10px;box-shadow:0 3px 0 rgba(200,140,110,.35);text-align:center;line-height:1.1}
.chip small{display:block;font-size:10px;color:var(--ink-dim);letter-spacing:.05em}
.chip b{font-size:18px;font-weight:900}
#scoreChip{flex:1.2}
#scoreChip b{color:var(--pink-d);font-size:22px}
#heightChip{flex:1}
#bestChip{flex:1}
#nextChip{display:flex;align-items:center;gap:2px;padding:2px 6px}
#nextCv{width:54px;height:40px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:#fff;box-shadow:0 3px 0 rgba(200,140,110,.35);font-size:18px;display:grid;place-items:center;flex:none}
#goal{margin:0 8px 4px;background:rgba(255,255,255,.85);border-radius:12px;padding:5px 10px;font-size:13px;text-align:center;box-shadow:0 2px 0 rgba(200,140,110,.25)}
#goal .prog{color:var(--pink-d)}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:#fff;pointer-events:none;
  text-shadow:0 1px 3px rgba(90,58,46,.7);transition:opacity .6s}
/* controls */
#controls{display:grid;grid-template-columns:1fr 1fr 1.6fr 1fr;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px)}
.cbtn{height:58px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #e6b9a6;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:none}
.cbtn span{font-size:10px;margin-top:3px;color:var(--ink-dim)}
.cbtn:active,.cbtn.on{transform:translateY(4px);box-shadow:0 1px 0 #e6b9a6}
.cbtn.drop{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);font-size:20px}
.cbtn.drop span{color:#ffe6ee}
.cbtn.drop:active{box-shadow:0 1px 0 var(--pink-d)}
.cbtn:disabled{opacity:.45}
/* overlays */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  background:linear-gradient(#fff8ee,#ffd9c8);overflow:auto}
.logo{font-size:40px;font-weight:900;color:#fff;letter-spacing:.02em;text-align:center;line-height:1.1;margin:4px 0 2px;
  -webkit-text-stroke:8px var(--pink-d);paint-order:stroke fill;text-shadow:0 6px 0 rgba(224,87,127,.35)}
.logo-sub{font-size:13px;color:var(--ink-dim);margin-bottom:6px}
#titleCv{width:220px;height:200px}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);margin-top:6px}
.bigbtn{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;background:#fff;box-shadow:0 6px 0 #e6b9a6;text-align:left}
.bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #e6b9a6}
.bigbtn .em{font-size:30px;flex:none}
.bigbtn b{display:block;font-size:18px}
.bigbtn small{display:block;font-size:11px;color:var(--ink-dim);font-weight:500}
.bigbtn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-d)}
.bigbtn.pink small{color:#ffe6ee}
.bigbtn.yellow{background:var(--yellow);box-shadow:0 6px 0 var(--yellow-d)}
.bigbtn.yellow small{color:#8a6420}
.bigbtn.green{background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-d)}
.bigbtn.green small{color:#e6ffe0}
.howto{margin-top:14px;font-size:12px;font-weight:500;color:var(--ink-dim);text-align:center;line-height:1.7}
.foot{display:flex;gap:10px;margin-top:10px}
.small{padding:8px 14px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #e6b9a6;font-size:14px}
.small:active{transform:translateY(3px);box-shadow:0 1px 0 #e6b9a6}
h2{margin:0 0 10px;font-size:24px;font-weight:900;color:var(--pink-d)}
#lvGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(360px,100%)}
.lv{border-radius:16px;background:#fff;box-shadow:0 5px 0 #e6b9a6;padding:10px;text-align:left;min-height:76px}
.lv:active{transform:translateY(4px);box-shadow:0 1px 0 #e6b9a6}
.lv .n{font-size:11px;color:var(--pink-d)}
.lv .t{font-size:13px;line-height:1.35}
.lv.done{background:#fff6c9}
.lv.lock{opacity:.45;pointer-events:none}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(90,58,46,.35);padding:16px}
.card{width:min(330px,100%);background:#fff;border-radius:26px;padding:20px 18px 18px;text-align:center;box-shadow:0 10px 0 #e6b9a6;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.card .ttl{font-size:26px;font-weight:900;color:var(--pink-d);margin-bottom:4px}
.card .sc{font-size:48px;font-weight:900;line-height:1;margin:6px 0}
.card .rows{font-size:13px;color:var(--ink-dim);line-height:1.8;margin-bottom:10px}
.card .rows b{color:var(--ink)}
.newrec{display:inline-block;background:var(--yellow);border-radius:10px;padding:2px 10px;font-size:13px;animation:wig 1s infinite}
@keyframes wig{50%{transform:rotate(-4deg) scale(1.06)}}
.card .menu{margin:12px auto 0;width:100%}
.card .bigbtn{justify-content:center;text-align:center;padding:12px}
#err{color:#c33;font-size:13px;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <button class="iconbtn" id="menuBtn" aria-label="メニュー">II</button>
    <div class="chip" id="scoreChip"><small>SCORE</small><b id="scoreTx">0</b></div>
    <div class="chip" id="heightChip"><small id="hLabel">たかさ</small><b id="heightTx">0.0</b><small style="display:inline">cm</small></div>
    <div class="chip" id="bestChip"><small>BEST</small><b id="bestTx">0</b></div>
    <div class="chip" id="nextChip"><small>つぎ</small><canvas id="nextCv" width="108" height="80"></canvas></div>
  </div>
  <div id="goal" hidden></div>
  <div id="stage"><canvas id="cv"></canvas><div id="hint">指で左右に動かして、はなすと落ちるよ！</div></div>
  <div id="controls">
    <button class="cbtn" id="btnL">◀<span>ひだり</span></button>
    <button class="cbtn" id="btnRot">↻<span>まわす</span></button>
    <button class="cbtn drop" id="btnDrop">ポン！<span>おとす</span></button>
    <button class="cbtn" id="btnR">▶<span>みぎ</span></button>
  </div>
</div>

<!-- タイトル -->
<div class="screen" id="title">
  <div class="logo">おべんとう<br>タワー</div>
  <div class="logo-sub">おかずを積んで、たかーいタワーをつくろう！</div>
  <canvas id="titleCv" width="440" height="400"></canvas>
  <div class="menu">
    <button class="bigbtn pink" data-mode="endless"><span class="em">🍱</span><span><b>エンドレス</b><small>くずれるまで積み続けよう　BEST <span id="tBestE">0</span></small></span></button>
    <button class="bigbtn yellow" data-mode="challenge"><span class="em">🚩</span><span><b>お題チャレンジ</b><small>お題をクリアしていこう　<span id="tClear">0</span>/10</small></span></button>
    <button class="bigbtn green" data-mode="time"><span class="em">⏱️</span><span><b>60びょう</b><small>時間内にどれだけ積める？　BEST <span id="tBestT">0</span></small></span></button>
  </div>
  <div class="foot"><button class="small" id="sndBtn">🔊 おと ON</button></div>
  <div class="howto">◀▶・ドラッグで動かす ／ ↻で回す ／ はなす・ポン！で落とす<br>
    おにぎり＋梅干し、卵焼き＋ウインナー などで<b>コンボ</b>！<br>赤・黄・緑をそろえると<b>彩りボーナス</b>！</div>
  <div id="err"></div>
</div>

<!-- お題選択 -->
<div class="screen" id="levels" hidden>
  <h2>🚩 お題チャレンジ</h2>
  <div id="lvGrid"></div>
  <div class="foot"><button class="small" id="lvBack">← もどる</button></div>
</div>

<!-- 結果 -->
<div class="modal" id="result" hidden>
  <div class="card">
    <div class="ttl" id="rTitle">くずれちゃった！</div>
    <div id="rNew" hidden><span class="newrec">🎉 しんきろく！</span></div>
    <div class="sc" id="rScore">0</div>
    <div class="rows" id="rRows"></div>
    <div class="menu">
      <button class="bigbtn pink" id="rNext" hidden><b>つぎのお題へ ▶</b></button>
      <button class="bigbtn yellow" id="rRetry"><b>もういっかい</b></button>
      <button class="bigbtn" id="rTitleBtn"><b>タイトルへ</b></button>
    </div>
  </div>
</div>

<!-- ポーズ -->
<div class="modal" id="pause" hidden>
  <div class="card">
    <div class="ttl">ひとやすみ</div>
    <div class="menu">
      <button class="bigbtn pink" id="pResume"><b>つづける</b></button>
      <button class="bigbtn yellow" id="pRetry"><b>やりなおす</b></button>
      <button class="bigbtn" id="pSnd"><b>🔊 おと ON</b></button>
      <button class="bigbtn" id="pTitle"><b>タイトルへ</b></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
