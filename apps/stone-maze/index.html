<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>石壁の迷宮</title>
<meta name="description" content="そびえ立つ石壁の迷路を一人称で走り抜け、制限時間内に脱出する3Dゲーム">
<meta name="theme-color" content="#1b2630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#1b2630;color:#eaf4fb;font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.num{font-family:Rajdhani,"Segoe UI",sans-serif;font-style:italic;font-weight:700}
.panel{background:linear-gradient(180deg,rgba(18,30,42,.72),rgba(12,22,32,.6));border:1px solid rgba(160,205,235,.45);box-shadow:0 0 0 1px rgba(0,0,0,.25),inset 0 0 18px rgba(120,190,240,.08);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%);z-index:4}
#danger{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 45%,rgba(160,10,10,.75) 100%);opacity:0;z-index:4;transition:opacity .2s}
#obj{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));padding:8px 16px 10px 12px;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
#obj .ttl{font-weight:800;font-size:19px;font-style:italic;letter-spacing:.05em;display:flex;align-items:baseline;gap:10px}
#obj .ttl em{font-style:italic}
#obj .ttl span{font-size:13px;color:#9fd2f2;font-family:Rajdhani,sans-serif;letter-spacing:.1em}
#obj .row{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:4px;white-space:nowrap}
.dia{width:13px;height:13px;border:2.5px solid #f2b52a;transform:rotate(45deg);display:inline-block;flex:none;position:relative}
.dia::after{content:"";position:absolute;inset:2px;background:#f2b52a}
#timer{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);padding:4px 46px 6px;text-align:center;clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,22px 100%,0 50%);background:linear-gradient(180deg,rgba(18,30,42,.78),rgba(12,22,32,.66));border-top:1px solid rgba(160,205,235,.5);border-bottom:1px solid rgba(160,205,235,.5)}
#timer .lab{font-family:Rajdhani,sans-serif;font-style:italic;font-weight:700;font-size:15px;letter-spacing:.12em;line-height:1}
#tm{font-size:50px;line-height:.95;letter-spacing:.02em;text-shadow:0 0 14px rgba(140,200,255,.35)}
#tm small{font-size:.82em;color:#c8d6e2;opacity:.75}
#timer.low #tm{color:#ff6b5e;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
#bonus{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 84px);transform:translateX(-50%);font-size:26px;color:#7fe6ff;opacity:0;text-shadow:0 0 12px rgba(80,210,255,.7)}
#bonus.show{animation:bonus 1.4s ease-out}
@keyframes bonus{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
#mapw{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:170px;height:170px;padding:6px;border-radius:10px}
#map{width:100%;height:100%;display:block;border-radius:6px}
#mapw .n{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:Rajdhani,sans-serif;font-weight:700;font-size:14px;text-shadow:0 0 4px #000}
#stam{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:12px}
#stam svg{width:54px;height:54px;flex:none;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
#stam .lab{font-family:Rajdhani,sans-serif;font-style:italic;font-weight:700;font-size:20px;letter-spacing:.08em;text-shadow:0 0 6px #000}
.bar{width:300px;height:20px;transform:skewX(-20deg);border:1.5px solid rgba(200,225,240,.7);background:rgba(10,18,26,.65);padding:2px;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1aa3ff,#5fd0ff);box-shadow:0 0 10px rgba(60,180,255,.7)}
.bar.ex i{background:linear-gradient(90deg,#ff5040,#ff8a60);box-shadow:0 0 10px rgba(255,80,60,.7)}
#keys{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#keys div{display:flex;align-items:center;gap:12px;padding:6px 20px 6px 12px;font-size:17px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
#keys b{font-family:Rajdhani,"Segoe UI",sans-serif;font-size:15px;font-weight:700;border:1.5px solid rgba(220,235,245,.8);border-radius:5px;padding:1px 7px;min-width:52px;text-align:center}
#toast{position:absolute;left:50%;top:58%;transform:translateX(-50%);padding:10px 20px;font-size:16px;white-space:nowrap;border-radius:8px;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 22px;border-radius:12px;font-size:15px;line-height:1.75;width:max-content;max-width:min(440px,calc(100vw - 32px));transition:opacity .6s}
#guide h3{font-size:18px;margin-bottom:6px;color:#ffd36b;display:flex;align-items:center;gap:8px}
#guide .tap{margin-top:8px;font-size:12px;color:#9fb8c8;text-align:center}
#pauseBtn{position:absolute;pointer-events:auto;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:42px;height:34px;border-radius:8px;color:#eaf4fb;font-weight:800;font-size:14px;letter-spacing:2px;cursor:pointer}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 3px #000}
/* touch */
#touch{position:fixed;inset:0;z-index:3}
#joyBase{position:fixed;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(200,230,250,.5);background:rgba(20,40,60,.25);pointer-events:none;z-index:6}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(200,230,250,.55);box-shadow:0 0 12px rgba(120,200,255,.6)}
#joyBase.dash{border-color:#5fd0ff;box-shadow:0 0 18px rgba(80,200,255,.6)}
#tbtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
#tbtns button{width:76px;height:76px;border-radius:50%;color:#eaf4fb;font-size:14px;font-weight:700;cursor:pointer}
#tbtns #bJump{width:88px;height:88px}
#tbtns button.on{background:rgba(60,160,230,.55);border-color:#8fdcff}
#hint{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 6px);font-size:12px;color:rgba(234,244,251,.7);text-shadow:0 0 4px #000}
/* screens */
.scr{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at center,rgba(10,18,26,.35),rgba(6,10,16,.82))}
.card{width:min(460px,100%);padding:26px 24px;border-radius:14px;text-align:center}
.logo{font-size:44px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 22px rgba(140,200,255,.45),0 3px 0 rgba(0,0,0,.4);line-height:1.15}
.sub{font-family:Rajdhani,sans-serif;letter-spacing:.35em;color:#9fd2f2;font-size:15px;margin-top:4px}
.lead{font-size:14px;line-height:1.8;color:#c9dbe7;margin:16px 0 18px}
.btn{display:block;width:100%;padding:14px;margin-top:10px;font-size:18px;font-weight:800;color:#0d1a24;border:none;border-radius:10px;background:linear-gradient(180deg,#9fe0ff,#4fb8f0);box-shadow:0 0 18px rgba(80,190,255,.45);cursor:pointer;letter-spacing:.1em}
.btn.sec{background:rgba(30,50,68,.8);color:#eaf4fb;border:1px solid rgba(160,205,235,.5);box-shadow:none;font-size:16px}
.best{margin-top:14px;font-size:13px;color:#9fb8c8}
.res-t{font-size:32px;font-weight:900;letter-spacing:.06em}
.res-t.win{color:#ffd36b;text-shadow:0 0 18px rgba(255,200,80,.5)}
.res-t.lose{color:#ff7a6a;text-shadow:0 0 18px rgba(255,80,60,.45)}
.stats{margin:16px 0 8px;font-size:15px;line-height:2;color:#d6e6f0}
.stats b{font-family:Rajdhani,sans-serif;font-size:24px;font-style:italic;color:#fff}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .8s}
@media (max-width:640px){
  #obj{padding:5px 10px 6px 8px;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left))}
  #obj .ttl{font-size:14px}
  #obj .ttl em{display:none}
  #obj .ttl span{font-size:14px;color:#eaf4fb}
  #obj .row{font-size:10px;gap:5px}
  #obj .row span{display:none}
  #obj .row::after{content:"出口へ急げ"}
  .dia{width:10px;height:10px;border-width:2px}
  #timer{padding:2px 22px 4px;top:max(8px,env(safe-area-inset-top));clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
  #timer .lab{font-size:11px}
  #tm{font-size:30px}
  #bonus{top:calc(max(8px,env(safe-area-inset-top)) + 58px);font-size:20px}
  #mapw{width:108px;height:108px;padding:4px;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right))}
  #mapw .n{font-size:11px;top:0}
  #stam{left:50%;transform:translateX(-50%);bottom:auto;top:calc(max(8px,env(safe-area-inset-top)) + 54px);gap:6px;align-items:center}
  #stam svg{width:20px;height:20px}
  #stam .lab{display:none}
  .bar{width:120px;height:10px;padding:1px;margin:0}
  #pauseBtn{left:auto;transform:none;right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 116px);bottom:auto;width:38px;height:30px}
  #toast{font-size:14px;top:40%}
  .logo{font-size:36px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="danger"></div>
<div id="touch" hidden></div>
<div id="joyBase" hidden><div id="joyKnob"></div></div>

<div id="hud" hidden>
  <div id="obj" class="panel"><div class="ttl"><em>目標</em> <span id="stg">STAGE 1</span></div><div class="row"><i class="dia"></i><span>制限時間内に迷路から脱出する</span></div></div>
  <div id="timer"><div class="lab">TIME</div><div id="tm" class="num">00:00<small>.00</small></div></div>
  <div id="bonus" class="num">+10s</div>
  <div id="mapw" class="panel"><canvas id="map"></canvas><span class="n">N</span></div>
  <div id="stam">
    <svg viewBox="0 0 64 64" fill="#fff"><circle cx="40" cy="9" r="6"/><path d="M30 17l12 3 6 11 9 2-1 5-12-3-4-6-4 11 9 7-3 15h-6l2-12-10-7-6 12-13 1 1-5 9-1 10-22-6 1-5 8-5-2 7-12z"/></svg>
    <div><div class="lab">STAMINA</div><div class="bar" id="stbar"><i id="stb"></i></div></div>
  </div>
  <div id="keys">
    <div class="panel"><b>Shift</b>ダッシュ</div>
    <div class="panel"><b>Space</b>ジャンプ</div>
    <div class="panel"><b>C</b>しゃがむ</div>
  </div>
  <div id="cross"></div>
  <div id="toast" class="panel"></div>
  <div id="guide" class="panel" hidden></div>
  <button id="pauseBtn" class="panel">II</button>
  <div id="tbtns" hidden><button id="bCrouch" class="panel">しゃがむ</button><button id="bJump" class="panel">ジャンプ</button></div>
  <div id="hint" hidden>左を押しっぱなしで移動・端まで倒すとダッシュ</div>
</div>

<div id="title" class="scr">
  <div class="card panel">
    <div class="logo">石壁の迷宮</div>
    <div class="sub">MAZE ESCAPE</div>
    <p class="lead">目が覚めると、そびえ立つ石壁の中にいた。<br>空にのびる<b style="color:#9fe0ff">光の柱</b>が出口のしるし。<br>時間切れになる前に、迷路から抜け出せ。</p>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="best" id="bestTxt"></div>
  </div>
</div>

<div id="pause" class="scr" hidden>
  <div class="card panel">
    <div class="res-t">一時停止</div>
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn sec" id="quitBtn">タイトルへ</button>
  </div>
</div>

<div id="result" class="scr" hidden>
  <div class="card panel">
    <div class="res-t" id="resT"></div>
    <div class="stats" id="resS"></div>
    <button class="btn" id="nextBtn"></button>
    <button class="btn sec" id="toTitleBtn">タイトルへ</button>
  </div>
</div>
<div id="fade"></div>
