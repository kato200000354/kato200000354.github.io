<!doctype html>
<html lang="ja">
<head>
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>部屋を飼う</title>
<meta name="description" content="意思を持つ部屋が集まった巨大住宅。部屋の接続を組み替えて出口を目指す一人称3Dホラー。家は、あなたの攻略法を覚えている。">
<style>
:root{--fg:#e9e1d4;--dim:rgba(233,225,212,.55);--accent:#ffcf7a;--danger:#ff4a4a;--panel:rgba(12,9,16,.92);--line:rgba(233,225,212,.18)}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#030206;color:var(--fg);touch-action:none;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button{font-family:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.78) 100%)}
#red{z-index:1;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(160,0,0,.75) 100%);opacity:0}
#uw{z-index:1;background:rgba(20,70,95,.55);opacity:0;transition:opacity .2s}
#flash{z-index:6;background:#000;opacity:0;transition:opacity .8s}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.45);z-index:2;pointer-events:none}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
#topL{position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top));max-width:58%}
#stName{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:14px;letter-spacing:.1em;color:var(--accent);text-shadow:0 0 8px #000}
#goal{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5;text-shadow:0 0 6px #000}
#inv{font-size:15px;margin-top:5px;text-shadow:0 0 6px #000}
#topR{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
.hb{pointer-events:auto;background:rgba(20,14,26,.72);border:1px solid rgba(255,207,122,.45);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;letter-spacing:.05em}
.hb.sq{padding:9px 12px;border-color:var(--line)}
#bMap{box-shadow:0 0 12px rgba(255,207,122,.25)}
#msg{position:absolute;left:16px;right:16px;top:30%;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:1.8;letter-spacing:.06em;opacity:0;transition:opacity .5s;text-shadow:0 0 6px #000,0 0 14px #000}
#msg.on{opacity:1}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));width:min(92%,560px);text-align:center;font-size:13px;line-height:1.6;background:rgba(10,8,14,.7);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#bars{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;align-items:center}
.bar{width:150px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#d8cfb8}
#breathB i{background:#6cc8ff}
#bAct{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));pointer-events:auto;background:rgba(40,26,10,.85);border:1px solid var(--accent);color:var(--accent);border-radius:14px;padding:12px 22px;font-size:16px;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 18px rgba(255,207,122,.3)}
#bRun{position:absolute;right:18px;bottom:calc(26px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;pointer-events:auto;background:rgba(20,14,26,.55);border:1px solid var(--line);font-size:14px}
#bRun.on{background:rgba(255,207,122,.25);border-color:var(--accent)}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);display:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.18)}
#joyHint{position:absolute;left:20px;bottom:calc(30px + env(safe-area-inset-bottom));font-size:11px;color:rgba(255,255,255,.28)}
/* 間取り盤 */
#map{position:fixed;inset:0;z-index:4;background:rgba(3,2,8,.62);display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{background:var(--panel);border:1px solid rgba(255,207,122,.35);border-radius:16px;padding:12px 12px 14px;max-width:100%;box-shadow:0 0 40px rgba(0,0,0,.7)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.mhead b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:var(--accent);letter-spacing:.15em;font-size:16px}
#mapInfo{font-size:11px;color:var(--dim)}
#grid{position:relative;margin:0 auto;background:repeating-linear-gradient(45deg,#0a0810 0 6px,#0d0a14 6px 12px);border-radius:8px}
.cell{position:absolute;padding:4px;cursor:pointer}
.cell .in{position:absolute;inset:4px;border-radius:6px;border:1px solid rgba(233,225,212,.25);background:#1b1524;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cell .nm{font-size:11px;letter-spacing:.04em;text-align:center;line-height:1.2;position:relative;z-index:1}
.cell .ic{font-size:15px;position:relative;z-index:1;min-height:18px}
.cell.empty .in{background:transparent;border:1px dashed rgba(233,225,212,.15)}
.cell.empty .nm{color:rgba(233,225,212,.3)}
.cell.empty.can .in{border:1px dashed var(--accent);background:rgba(255,207,122,.08)}
.cell.empty.can .nm{color:var(--accent)}
.cell.you .in{border:2px solid #7fe3ff;box-shadow:inset 0 0 14px rgba(127,227,255,.25)}
.cell.sel .in{border:2px solid var(--accent);box-shadow:0 0 14px rgba(255,207,122,.5)}
.cell.fixed .in{background:repeating-linear-gradient(135deg,#221a2a 0 8px,#2a2033 8px 16px)}
.cell.enemy .in{animation:epulse 1.1s infinite}
@keyframes epulse{0%,100%{box-shadow:inset 0 0 6px rgba(255,40,40,.2)}50%{box-shadow:inset 0 0 22px rgba(255,40,40,.75)}}
.cell .wt{position:absolute;left:0;right:0;bottom:0;background:rgba(60,150,200,.45);z-index:0}
.dr{position:absolute;background:#7a6a8c;z-index:2;border-radius:2px}
.dr.o{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.dr.k0{top:0;left:34%;width:32%;height:6px}.dr.k2{bottom:0;left:34%;width:32%;height:6px}
.dr.k1{right:0;top:34%;height:32%;width:6px}.dr.k3{left:0;top:34%;height:32%;width:6px}
#mapHint{font-size:12px;line-height:1.55;color:var(--dim);text-align:center;margin:10px 4px 0;min-height:38px}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:8px}
.mb{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer}
.mb.pri{border-color:var(--accent);color:var(--accent)}
.mb:disabled{opacity:.3}
/* ダイアログ */
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6)}
.dbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;width:min(100%,420px);text-align:center}
.dbox h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;letter-spacing:.15em;font-size:21px;margin-bottom:12px;color:var(--accent)}
.dbox .bd{font-size:14px;line-height:1.85;color:#d8d0c2;margin-bottom:16px;text-align:left}
.dbox .bd p+p{margin-top:8px}
.dbtns{display:flex;flex-direction:column;gap:8px}
.db{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:15px;cursor:pointer;letter-spacing:.05em}
.db.pri{border-color:var(--accent);color:var(--accent)}
.db:disabled{opacity:.3;cursor:default}
.db small{display:block;font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:0}
/* タイトル */
#title{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.75))}
.tbox{text-align:center;width:min(100%,380px)}
.tsub{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.tbox h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;font-size:clamp(44px,13vw,68px);letter-spacing:.2em;margin:10px 0 6px;padding-left:.2em;text-shadow:0 0 24px rgba(255,180,90,.35),0 0 4px #000}
.tcatch{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:13px;color:#cfc4b0;letter-spacing:.08em;margin-bottom:22px;line-height:1.8;text-shadow:0 0 6px #000}
#tAbs{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:13px;color:#ffb0a0;margin:-10px 0 18px;letter-spacing:.06em;text-shadow:0 0 8px #000}
.tb{display:block;width:100%;margin:8px 0;background:rgba(14,10,18,.78);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;letter-spacing:.12em;cursor:pointer}
.tb.pri{border-color:var(--accent);color:var(--accent)}
#tCont{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#tCont .tb{flex:1;min-width:70px;font-size:13px;letter-spacing:.04em;padding:10px 4px;margin:2px 0}
#tEnd{margin-top:14px;font-size:12px;color:var(--dim);letter-spacing:.06em}
/* 導入・エンディング */
#intro{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1s;text-align:center;padding:16px}
#intro.on{opacity:1}
#intro .a{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(19px,5.6vw,28px);letter-spacing:.14em;white-space:nowrap;text-shadow:0 0 16px #000,0 0 4px #000}
#intro .b{font-size:13px;color:#cfc4b0;margin-top:12px;letter-spacing:.1em;text-shadow:0 0 8px #000}
#ending{position:fixed;inset:0;z-index:7;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.ebox{width:min(100%,460px);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.ebox p{font-size:16px;line-height:2.1;letter-spacing:.06em;opacity:0;transition:opacity 2s;margin-bottom:14px}
.ebox p.on{opacity:1}
.ebox .et{font-size:24px;text-align:center;letter-spacing:.3em;color:var(--accent);margin-top:20px}
.ebox button{display:block;margin:28px auto 0;opacity:0;transition:opacity 1.5s}
.ebox button.on{opacity:1}
body.shake #c{animation:shk .09s infinite}
@keyframes shk{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
#err{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.8;background:#000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig" class="fx"></div><div id="uw" class="fx"></div><div id="red" class="fx"></div>

<div id="hud" hidden>
  <div id="cross"></div>
  <div id="topL"><div id="stName"></div><div id="goal"></div><div id="inv"></div></div>
  <div id="topR"><button id="bMap" class="hb">間取り盤</button><button id="bPause" class="hb sq">Ⅱ</button></div>
  <div id="msg"></div>
  <div id="hint" hidden></div>
  <div id="bars"><div id="stamB" class="bar"><i></i></div><div id="breathB" class="bar" hidden><i></i></div></div>
  <button id="bAct" hidden></button>
  <button id="bRun" hidden>走る</button>
  <div id="joy"><div id="knob"></div></div>
  <div id="joyHint" hidden>左側をドラッグで移動／右側で視点</div>
</div>

<div id="map" hidden>
  <div class="mbox">
    <div class="mhead"><b>間取り盤</b><span id="mapInfo"></span></div>
    <div id="grid"></div>
    <div id="mapHint"></div>
    <div class="mbtns"><button id="bRot" class="mb pri">↻ 回転</button><button id="bClose" class="mb">閉じる</button></div>
  </div>
</div>

<div id="title">
  <div class="tbox">
    <div class="tsub">一人称3Dホラー × 空間パズル</div>
    <h1>部屋を飼う</h1>
    <div class="tcatch">あなたが学習するほど、家もあなたを学習する。</div>
    <div id="tAbs" hidden></div>
    <button id="tNew" class="tb pri">はじめから</button>
    <div id="tCont"></div>
    <button id="tHow" class="tb">遊び方</button>
    <div id="tEnd"></div>
  </div>
</div>

<div id="intro"><div class="a"></div><div class="b"></div></div>
<div id="dlg" class="ov" hidden><div class="dbox"><h2 id="dlgT"></h2><div id="dlgB" class="bd"></div><div id="dlgBtns" class="dbtns"></div></div></div>
<div id="ending" hidden><div class="ebox" id="ebox"></div></div>
<div id="flash" class="fx"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
if(typeof THREE==='undefined'){document.body.insertAdjacentHTML('beforeend','<div id="err">3Dエンジンを読み込めませんでした。<br>通信状態を確認して、再読み込みしてください。</div>');throw new Error('three missing');}

/* ===== 定数 ===== */
const S=8,H=4,CEIL=4.4,DW=1.7,DH=2.7,PR=0.28,EYE=1.6;
const DX=[0,1,0,-1],DZ=[-1,0,1,0],YAW=[0,-Math.PI/2,Math.PI,Math.PI/2];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){let a=(seed>>>0)||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ===== 描画の土台 ===== */
const canvas=$('c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err">この端末では3D表示（WebGL）が使えないようです。</div>');throw e;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030206);
scene.fog=new THREE.FogExp2(0x030206,0.07);
const camera=new THREE.PerspectiveCamera(72,1,0.05,70);
camera.rotation.order='YXZ';
scene.add(camera);
const amb=new THREE.AmbientLight(0x5a4c72,0.5);scene.add(amb);
const flashL=new THREE.SpotLight(0xffe6c0,1.25,17,0.6,0.55,1);
flashL.position.set(0.12,-0.12,0.1);camera.add(flashL);flashL.target.position.set(0,-0.25,-4);camera.add(flashL.target);
const lamps=[];for(let i=0;i<5;i++){const l=new THREE.PointLight(0xffc888,0,12,1.3);scene.add(l);lamps.push(l);}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?82:72;camera.updateProjectionMatrix();if(state==='map')renderMap();}
addEventListener('resize',resize);

/* ===== テクスチャ（すべて手描き生成） ===== */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
const ANISO=Math.min(4,renderer.capabilities.getMaxAnisotropy());
function toTex(cv,rep){const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep,rep);t.anisotropy=ANISO;return t;}
function rgb(c,f=1,a=1){return `rgba(${Math.min(255,((c>>16)&255)*f)|0},${Math.min(255,((c>>8)&255)*f)|0},${Math.min(255,(c&255)*f)|0},${a})`;}
function speckle(g,n,count,alpha){for(let i=0;i<count;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*alpha})`;g.fillRect(Math.random()*n,Math.random()*n,1+Math.random()*3,1+Math.random()*3);}}
function stain(g,n,alpha){for(let i=0;i<10;i++){const x=20+Math.random()*(n-40),y=20+Math.random()*(n-40),r=10+Math.random()*20;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(15,8,4,${alpha*Math.random()})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}}
const TEXC={};
function wallTex(kind,c){
  const key=kind+'_'+c;if(TEXC[key])return TEXC[key];
  const n=256,cv=mkCanvas(n),g=cv.getContext('2d');
  g.fillStyle=rgb(c);g.fillRect(0,0,n,n);
  if(kind==='stripe'){
    for(let i=0;i<8;i++){const x=i*32;g.fillStyle=rgb(c,1.16);g.fillRect(x,0,13,n);g.fillStyle=rgb(c,.78);g.fillRect(x+15,0,2,n);
      g.fillStyle=rgb(c,1.35,.55);for(let y=(i%2)*16;y<n;y+=32){g.beginPath();g.moveTo(x+24,y);g.lineTo(x+28,y+6);g.lineTo(x+24,y+12);g.lineTo(x+20,y+6);g.fill();}}
  }else if(kind==='damask'){
    g.fillStyle=rgb(c,.82);g.fillRect(0,0,n,n);g.strokeStyle=rgb(c,1.5,.7);g.lineWidth=2;
    for(let row=-1;row<5;row++)for(let col=-1;col<5;col++){const x=col*64+(row&1?32:0),y=row*64;
      for(let j=-3;j<=3;j++){g.beginPath();g.moveTo(x,y+62);g.quadraticCurveTo(x+j*10,y+34,x+j*8,y+10);g.stroke();}
      g.beginPath();g.arc(x,y+62,50,Math.PI*1.17,Math.PI*1.83);g.stroke();}
  }else if(kind==='tile'){
    for(let y=0;y<n;y+=32)for(let x=0;x<n;x+=32){g.fillStyle=rgb(c,.95+Math.random()*.15);g.fillRect(x+1,y+1,30,30);}
    g.fillStyle=rgb(c,.55);for(let i=0;i<=n;i+=32){g.fillRect(i-1,0,2,n);g.fillRect(0,i-1,n,2);}
  }else if(kind==='paper'){
    g.strokeStyle='rgba(40,30,20,.35)';g.lineWidth=1;
    for(let i=0;i<40;i++){g.beginPath();let x=Math.random()*n,y=Math.random()*n;g.moveTo(x,y);for(let k=0;k<4;k++){x+=(Math.random()-.5)*60;y+=(Math.random()-.5)*60;g.lineTo(x,y);}g.stroke();}
  }else if(kind==='flesh'){
    for(let i=0;i<500;i++){g.fillStyle=rgb(c,.6+Math.random()*.8,.25);const r=2+Math.random()*10;g.beginPath();g.arc(Math.random()*n,Math.random()*n,r,0,7);g.fill();}
    g.strokeStyle=rgb(c,2.2,.5);for(let i=0;i<14;i++){g.lineWidth=1+Math.random()*3;g.beginPath();let x=Math.random()*n,y=Math.random()*n;g.moveTo(x,y);for(let k=0;k<5;k++){x+=(Math.random()-.5)*70;y+=Math.random()*50;g.lineTo(x,y);}g.stroke();}
  }
  speckle(g,n,700,.25);stain(g,n,.35);
  return TEXC[key]=toTex(cv);
}
function floorTex(kind){
  const key='floor_'+kind;if(TEXC[key])return TEXC[key];
  const n=256,cv=mkCanvas(n),g=cv.getContext('2d');
  if(kind==='tile'){for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle=(x+y)%2?'#1e1d22':'#77756b';g.fillRect(x*64,y*64,64,64);}g.fillStyle='rgba(0,0,0,.4)';for(let i=0;i<=n;i+=64){g.fillRect(i-1,0,2,n);g.fillRect(0,i-1,n,2);}}
  else if(kind==='flesh'){return TEXC[key]=wallTex('flesh',0x3a0a10);}
  else{for(let r=0;r<8;r++){let x=-Math.random()*120;while(x<n){const w=70+Math.random()*90;g.fillStyle=rgb(0x5c3a22,.65+Math.random()*.55);g.fillRect(x,r*32,w,32);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(x,r*32,2,32);for(let k=0;k<4;k++){g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x,r*32+4+Math.random()*24,w,1);}x+=w;}g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,r*32,n,2);}}
  speckle(g,n,600,.3);stain(g,n,.4);
  return TEXC[key]=toTex(cv);

function linked(room,k){if(!room||room.anim||!wdoor(room,k))return false;const n=getSlot(room.c+DX[k],room.r+DZ[k]);return !!(n&&!n.anim&&wdoor(n,(k+2)%4));}

function nextStep(from,to){const prev=new Map([[from,null]]);const q=[from];while(q.length){const a=q.shift();if(a===to)break;for(let k=0;k<4;k++)if(linked(a,k)){const n=getSlot(a.c+DX[k],a.r+DZ[k]);if(!prev.has(n)){prev.set(n,[a,k]);q.push(n);}}}
  if(!prev.has(to)||from===to)return null;let cur=to,step=null;while(prev.get(cur)&&prev.get(cur)[0]!==from)cur=prev.get(cur)[0];step=prev.get(cur);return step?step[1]:null;}

function canStand(x,z,rad,noObs){
  const c=Math.round(x/S),r=Math.round(z/S),room=getSlot(c,r);if(!room||room.anim)return false;
  const lx=x-c*S,lz=z-r*S,lim=H-.12-rad,ox=Math.abs(lx)>lim,oz=Math.abs(lz)>lim;
  if(ox&&oz)return false;
  if(ox&&(!linked(room,lx>0?1:3)||Math.abs(lz)>DW/2-rad))return false;
  if(oz&&(!linked(room,lz>0?2:0)||Math.abs(lx)>DW/2-rad))return false;
  if(!noObs)for(const o of room.wobs){const dx=Math.max(Math.abs(lx-o.x)-o.hx,0),dz=Math.max(Math.abs(lz-o.z)-o.hz,0);if(dx*dx+dz*dz<rad*rad)return false;}
  return true;
}

      const pv=new THREE.Object3D();pv.position.set(-DW/2+.03,0,-H+.06);sg.add(pv);

      for(const s of[1,-1]){const kn=new THREE.Mesh(knobGeo,BRASS);kn.position.set(DW-.32,1.0,.07*s);pv.add(kn);room.knobs.push(kn);}
      pv.userData.o=0;room.pivots[k]=pv;

/* ===== 部屋の操作（プレイヤーと家の共通） ===== */
function canOperate(room,by){
  if(!room)return'そこには部屋がない';
  if(G.anim)return'家が組み変わっている最中だ';
  if(room.fixed)return'この部屋は鎖で固定されていて動かない';
  if(room===playerRoom())return'今いる部屋は動かせない';
  return null;
}
function emptiesAround(room){const a=[];for(let k=0;k<4;k++){const c=room.c+DX[k],r=room.r+DZ[k];if(c>=0&&r>=0&&c<G.cols&&r<G.rows&&!getSlot(c,r))a.push({c,r});}return a;}
function doSlide(room,c,r,by){
  const oc=room.c,orr=room.r;G.slots[idx(oc,orr)]=null;G.slots[idx(c,r)]=room;room.c=c;room.r=r;room.anim=true;
  G.anim={room,type:'slide',t:0,dur:.85,fx:oc*S,fz:orr*S,tx:c*S,tz:r*S};afterOp(room,by);
}
function doRotate(room,by){
  const from=-room.rot*Math.PI/2;room.rot=(room.rot+1)%4;room.anim=true;

}
function afterOp(room,by){

function updateAnim(dt){

const AU={c:null};
function initAudio(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return;}
  try{
    const C=window.AudioContext||window.webkitAudioContext;const c=new C();AU.c=c;const m=c.createGain();m.gain.value=.9;m.connect(c.destination);AU.m=m;
    const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=200;const dg=c.createGain();dg.gain.value=.05;lp.connect(dg);dg.connect(m);
    for(const f of[55,55.6,82.6]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();}
    const n=c.createBufferSource();n.buffer=b;n.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=.8;const wg=c.createGain();wg.gain.value=.03;n.connect(bp);bp.connect(wg);wg.connect(m);n.start();
    const lfo=c.createOscillator();lfo.frequency.value=.07;const lg=c.createGain();lg.gain.value=260;lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
    const eo=c.createOscillator();eo.type='sawtooth';eo.frequency.value=34;const el=c.createBiquadFilter();el.type='lowpass';el.frequency.value=150;const eg=c.createGain();eg.gain.value=0;eo.connect(el);el.connect(eg);eg.connect(m);eo.start();AU.eg=eg;AU.eo=eo;
    const wn=c.createBufferSource();wn.buffer=b;wn.loop=true;const wl=c.createBiquadFilter();wl.type='lowpass';wl.frequency.value=650;const wgg=c.createGain();wgg.gain.value=0;wn.connect(wl);wl.connect(wgg);wgg.connect(m);wn.start();AU.wg=wgg;
  }catch(e){AU.c=null;}
}
function silence(){document.body.classList.remove('shake');if(!AU.c)return;AU.eg.gain.setTargetAtTime(0,AU.c.currentTime,.1);AU.wg.gain.setTargetAtTime(0,AU.c.currentTime,.1);}
function envG(t,peak,a,dur){const g=AU.c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);g.connect(AU.m);return g;}
function noise(t,dur,filterType,freq,q,peak,a=.005){const s=AU.c.createBufferSource();s.buffer=AU.nb;const f=AU.c.createBiquadFilter();f.type=filterType;f.frequency.value=freq;f.Q.value=q;const g=envG(t,peak,a,dur);s.connect(f);f.connect(g);s.start(t,Math.random()*1.5,dur+.05);return f;}
function tone(t,type,f0,f1,dur,peak,a=.01){const o=AU.c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=envG(t,peak,a,dur);o.connect(g);o.start(t);o.stop(t+dur+.05);return o;}
function sfx(type){

    case'splash':noise(t,.3,'bandpass',1100+Math.random()*500,1.2,.09,.02);break;
    case'creak':{const o=tone(t,'sawtooth',130,70,1.3,.07,.15);const f=noise(t,1.4,'bandpass',300,6,.12,.2);f.frequency.exponentialRampToValueAtTime(1100,t+1.3);break;}

    case'click':tone(t,'square',1600,1200,.03,.03);break;
    case'pick':[660,880,1320].forEach((f,i)=>tone(t+i*.09,'sine',f,f*1.01,.5,.12));break;
    case'sting':[880,932,1245,622].forEach(f=>tone(t,'sawtooth',f,f*.97,1.6,.03,.02));noise(t,1.2,'highpass',2500,1,.06);break;
    case'beat':tone(t,'sine',60,40,.18,.3);tone(t+.22,'sine',55,38,.2,.22);break;
    case'death':noise(t,2.2,'lowpass',900,1,.4);tone(t,'sawtooth',200,30,2,.2);[466,494,523].forEach(f=>tone(t,'sawtooth',f,f*.6,1.8,.04));break;

function updatePlayer(dt){

  const pr=playerRoom(),wh=pr&&G.def.water?pr.water*1.9:0;

  P.stam=clamp(P.stam+(running?-.28:.16)*dt,0,1);

  else if(canStand(nx,P.z,PR)){moved=Math.abs(nx-P.x);P.x=nx;}
  else if(canStand(P.x,nz,PR)){moved=Math.abs(nz-P.z);P.z=nz;}
  P.step+=moved;P.bob+=moved*(running?2.6:3.2);
  if(P.step>(running?1.7:1.35)){P.step=0;sfx(wh>.15?'splash':'step');}
  // 水と息
  const under=wh>EYE-.05;

  $('breathB').hidden=P.breath>.99&&!under;$('breathB').firstElementChild.style.width=P.breath*100+'%';
  $('stamB').firstElementChild.style.width=P.stam*100+'%';$('stamB').style.opacity=P.stam>.99?0:1;
  $('uw').style.opacity=under?1:0;
  if(P.breath<=0)die('drown');
  // アイテム
  for(const it of G.items){if(it.taken)continue;it.g.getWorldPosition(_v);if(it.room===pr&&Math.hypot(_v.x-P.x,_v.z-P.z)<1.15){it.taken=true;it.g.parent.remove(it.g);G.keys++;updateInv();sfx('pick');
    const need=G.def.keys-G.keys;msg(G.def.item==='key'?(need?`鍵を手に入れた。あと ${need} 本。`:'鍵がそろった。「出口の間」の扉へ。'):(need?`心臓の弁を手に入れた。あと ${need} つ。`:'弁がそろった。家の心臓へ向かえ。'));
    if(G.def.tutorial)setHint(null);}}
  // 滞在時間（家の学習）
  if(pr){pr.dwell+=dt;}
  const a=actTarget();const ba=$('bAct');
  if(a){ba.hidden=false;ba.textContent=a==='exit'?(G.keys>=G.def.keys?'扉を開ける':'扉を調べる'):'核に触れる';if(!IS_TOUCH)ba.textContent+='（E）';}else ba.hidden=true;
}

/* ===== 更新：家（水・敵・学習） ===== */
function updateWater(dt){
  for(let i=0;i<G.rooms.length;i++){const a=G.rooms[i];for(const k of[1,2])if(linked(a,k)){const b=getSlot(a.c+DX[k],a.r+DZ[k]);const f=(a.water-b.water)*.075*dt;if(!a.source)a.water-=f;if(!b.source)b.water+=f;}}
  const src=G.rooms.find(r=>r.source),wet=src?bfs(src):new Map();
  for(const r of G.rooms){if(r.source)r.water=1;else if(!wet.has(r))r.water=Math.max(0,r.water-.03*dt);r.water=clamp(r.water,0,1);
    r.wmesh.visible=r.water>.01;r.wmesh.position.y=r.water*1.9;}
  const pr=playerRoom();if(AU.c)AU.wg.gain.setTargetAtTime(pr&&wet.has(pr)&&!pr.source?.06:(pr&&pr.water>.05?.02:0),AU.c.currentTime,.3);
  for(const r of G.rooms)if(r.stream)r.stream.scale.y=1+Math.sin(tNow*20)*.1;
}
function enemyScore(pr,er){
  const d=bfs(er);let s=-(d.has(pr)?d.get(pr):9)*10;
  if(G.marked&&G.marked!==pr&&d.has(G.marked))s+=6-d.get(G.marked);
  if(d.has(pr)&&d.get(pr)<=3)s-=bfs(pr,er).size*1.5;
  return s;
}
function chooseEnemyOp(){
  const pr=playerRoom(),er=E.room;if(!pr)return null;
  const base=enemyScore(pr,er);let best=null,bs=base+.5;
  for(const room of G.rooms){
    if(room===pr||room.fixed)continue;
    room.rot=(room.rot+1)%4;let s=enemyScore(pr,er)+Math.random()*2;room.rot=(room.rot+3)%4;
    if(s>bs){bs=s;best={type:'rot',room};}
    for(const e of emptiesAround(room)){
      const oc=room.c,orr=room.r;G.slots[idx(oc,orr)]=null;G.slots[idx(e.c,e.r)]=room;room.c=e.c;room.r=e.r;
      s=enemyScore(pr,er)+Math.random()*2;
      G.slots[idx(e.c,e.r)]=null;G.slots[idx(oc,orr)]=room;room.c=oc;room.r=orr;
      if(s>bs){bs=s;best={type:'slide',room,c:e.c,r:e.r};}
    }
  }
  return best;
}
function enemyCooldown(){return Math.max(7,(G.def.cool||18)-G.alert*.6);}
function updateEnemy(dt){
  if(!E.active)return;
  E.t+=dt;const p=E.parts,pr=playerRoom(),er=E.room;
  scene.updateMatrixWorld();
  // 擬態：気配のある部屋の壁紙が脈打ち、ドアノブが呼吸する
  for(const r of G.rooms){const on=r===er&&r!==pr;const pulse=on?(Math.sin(E.t*2.4)*.5+.5)*.09:0;r.wallMat.emissive.setRGB(pulse,0,0);for(const k of r.knobs){const s=on?1+Math.sin(E.t*2.4+1)*.35:1;k.scale.set(s,s,s);}}
  // 家の組み替え（予兆あり）
  if(!G.anim){
    if(E.warn>0){E.warn-=dt;document.body.classList.add('shake');if(E.warn<=0){document.body.classList.remove('shake');const op=chooseEnemyOp();
        if(op){op.type==='rot'?doRotate(op.room,'house'):doSlide(op.room,op.c,op.r,'house');msg(op.room===er?'気配のある部屋が、動いた。':'家が、組み変わった。');}
        E.rewire=enemyCooldown();}}
    else{E.rewire-=dt*(G.marked&&pr===G.marked?2:1);if(E.rewire<=0){E.warn=2.4;sfx('creak');msg('……壁がきしんでいる。',2.4);}}
  }
  if(er.anim){p.body.position.y=Math.sin(E.t*20)*.03;return;}
  // 移動
  const e=eWorld(),d=bfs(er);let tx=e.x,tz=e.z,sp=0;
  if(pr===er){tx=P.x;tz=P.z;sp=2.75;E.mode='chase';if(!E.seen){E.seen=true;E.hold=.9;sfx('sting');msg('――来る。',2);}if(E.hold>0){E.hold-=dt;sp=0;}}
  else if(pr&&d.has(pr)){const k=nextStep(er,pr);if(k!==null){const cx=er.c*S,cz=er.r*S,lat=k%2?e.z-cz:e.x-cx;
      if(Math.abs(lat)>.25){tx=cx+DX[k]*(H-1.3);tz=cz+DZ[k]*(H-1.3);}else{tx=cx+DX[k]*(H+1.2);tz=cz+DZ[k]*(H+1.2);}
      sp=d.get(pr)<=1?2.5:1.8;E.mode='hunt';}}
  else{E.mode='lurk';E.seen=false;
    if(!E.idleSpot||E.idleSpot.room!==er){const k=[0,1,2,3].find(k=>!wdoor(er,k));const kk=k===undefined?0:k;E.idleSpot={room:er,x:er.c*S+DX[kk]*(H-.9)+(kk%2?0:2.2),z:er.r*S+DZ[kk]*(H-.9)+(kk%2?2.2:0)};}
    tx=E.idleSpot.x;tz=E.idleSpot.z;sp=.8;}
  let dx=tx-e.x,dz=tz-e.z,dl=Math.hypot(dx,dz);
  const stuck=!canStand(e.x,e.z,.5,true);
  if(stuck){tx=er.c*S;tz=er.r*S;dx=tx-e.x;dz=tz-e.z;dl=Math.hypot(dx,dz);sp=Math.max(sp,1.5);}
  if(dl>.05&&sp>0){const st=Math.min(dl,sp*dt);let nx=e.x+dx/dl*st,nz=e.z+dz/dl*st;
    if(!stuck&&!canStand(nx,nz,.5,true)){if(canStand(nx,e.z,.5,true))nz=e.z;else if(canStand(e.x,nz,.5,true))nx=e.x;else{nx=e.x;nz=e.z;}}
    const nr=roomAt(nx,nz);
    if(nr&&nr!==er&&!nr.anim){E.room=nr;nr.group.attach(E.mesh);normRot();}
    eSet(nx,nz);
    const face=Math.atan2(dx,dz)-E.room.group.rotation.y;let cur=E.mesh.rotation.y,df=((face-cur+Math.PI*3)%(Math.PI*2))-Math.PI;E.mesh.rotation.y=cur+df*Math.min(1,dt*5);
  }
  // 見た目のアニメーション
  const moving=sp>.9&&dl>.1,w=E.t*(E.mode==='chase'?9:5);
  p.body.position.y=moving?Math.abs(Math.sin(w))*.12:Math.sin(E.t*1.3)*.02;
  p.body.rotation.z=moving?Math.sin(w)*.08:0;
  p.mouth.rotation.y=E.mode==='chase'?-.6-Math.sin(E.t*8)*.4:(E.mode==='lurk'?0:-.25+Math.sin(E.t*2)*.2);
  p.head.rotation.x=Math.sin(E.t*1.7)*.15;
  p.arms.forEach((a,i)=>{a.a.rotation.x=moving?Math.sin(w+i*Math.PI)*.6:Math.sin(E.t+i)*.1;a.f.rotation.x=-.4+Math.sin(w*.5+i)*.3;});
  const lx=e.x-E.room.c*S,lz=e.z-E.room.r*S,edge=Math.min(H-Math.abs(lx),H-Math.abs(lz));p.body.scale.y=edge<1.1?.78:1;
  // 捕まる・接近の演出
  const dist=Math.hypot(e.x-P.x,e.z-P.z);
  if(pr===er&&dist<1.15)die('eaten');
  const near=(pr===er||(pr&&d.get(pr)===1))?clamp(1-dist/11,0,1):0;
  $('red').style.opacity=state==='dead'?1:near*.55;
  if(AU.c)AU.eg.gain.setTargetAtTime(near*.2+(E.warn>0?.08:0),AU.c.currentTime,.2);
}
function updateLearning(dt){
  G.learnT=(G.learnT||0)+dt;if(G.learnT<1)return;G.learnT=0;
  const f=favRoom(),pr=playerRoom();
  if(G.def.enemy&&f&&f.dwell>25&&f.dwell>G.time*.3&&G.marked!==f){G.marked=f;msg(`家は「${f.name}」を、あなたの安全地帯だと覚えた。`);}
  if(G.idx>=2&&pr&&pr.dwell>40&&pr.dwell>G.time*.42&&!G.flags.cozy){G.flags.cozy=1;msg('……この部屋は、居心地がいい。');}
  else if(G.idx===3&&pr&&pr.dwell>70&&!G.flags.cozy2){G.flags.cozy2=1;msg('壁紙が、あなたの体温を覚えはじめている。');}
}
function updateDoors(dt){
  for(const r of G.rooms)for(let k=0;k<4;k++){const pv=r.pivots[k];if(!pv)continue;const tg=linked(r,(k+r.rot)%4)?1:0;pv.userData.o+=(tg-pv.userData.o)*Math.min(1,dt*4);pv.rotation.y=-1.75*pv.userData.o;}
}
function updateLights(){
  const c=Math.round(P.x/S),r=Math.round(P.z/S),nb=[[0,0],[1,0],[-1,0],[0,1],[0,-1]];
  const warn=E.active&&E.warn>0;
  nb.forEach(([a,b],i)=>{const room=getSlot(c+a,r+b),L=lamps[i];if(!room){L.intensity=0;return;}
    L.position.set(room.group.position.x,3.2,room.group.position.z);L.color.setHex(TYPES[room.type].lamp);
    let f=.95+Math.sin(tNow*13+i*3)*Math.sin(tNow*7.1+i)*.08;
    if(warn&&Math.random()<.35)f*=.1;
    if(E.active&&room===E.room){f*=.55+Math.random()*.45;L.color.lerp(new THREE.Color(0xff3020),.5);}
    if(room.type==='heart'&&room.core){const b=heartPulse();f*=.7+b*.6;}
    L.intensity=(i===0?1.0:.8)*f;});
}
function heartPulse(){const t=(tNow%1.1)/1.1;return Math.max(Math.exp(-t*18),Math.exp(-Math.abs(t-.22)*18)*.7);}

/* ===== メインループ ===== */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;tNow+=dt;
  if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)$('msg').classList.remove('on');}
  if(mapHintT>0)mapHintT-=dt;
  if(state==='title'||!G){
    if(TITLE){P.yaw=Math.sin(tNow*.12)*.55;camera.position.set(0,EYE+Math.sin(tNow*.5)*.03,2.8);camera.rotation.set(.02,P.yaw,0);
      lamps[0].position.set(0,3.2,0);lamps[0].color.setHex(0xffc27a);lamps[0].intensity=.95+Math.sin(tNow*11)*Math.sin(tNow*5.3)*.12;for(let i=1;i<5;i++)lamps[i].intensity=0;}
    renderer.render(scene,camera);return;
  }
  const live=state==='play'||state==='map';
  if(state!=='play')$('bAct').hidden=true;
  if(live){
    G.time+=dt;updateAnim(dt);
    if(state==='play')updatePlayer(dt);else{const pr=playerRoom();if(pr)pr.dwell+=dt;}
    if(G.def.water)updateWater(dt);
    if(G.def.enemy)updateEnemy(dt);
    updateLearning(dt);
    if(state==='map'){G.mapT=(G.mapT||0)+dt;if(G.mapT>.3){G.mapT=0;renderMap();}}
    if(G.def.heart){const h=G.rooms.find(r=>r.type==='heart');const b=heartPulse();if(h.core){h.core.scale.setScalar(1+b*.12);h.core.material.emissiveIntensity=.5+b*.9;h.core.rotation.y+=dt*.3;h.coreGlow.material.opacity=.4+b*.5;}
      G.beatT+=dt;if(G.beatT>1.1){G.beatT=0;sfx('beat');}}
  }
  if(G){
    updateDoors(dt);updateLights();
    for(const it of G.items)if(!it.taken){it.g.rotation.y+=dt*1.6;it.g.position.y=1.0+Math.sin(tNow*2+it.g.position.x)*.1;}
    for(const r of G.rooms)if(r.exitDoor)r.exitDoor.rotation.y=.9+Math.sin(tNow*.7)*.08;
  }
  P.shake=Math.max(0,P.shake-dt);
  const sh=P.shake*.06+(E.active&&E.warn>0?.025:0);
  camera.position.set(P.x+(Math.random()-.5)*sh,EYE+Math.sin(P.bob)*.045+(Math.random()-.5)*sh,P.z+(Math.random()-.5)*sh);
  camera.rotation.set(P.pitch,P.yaw,0);
  renderer.render(scene,camera);
}
resize();toTitle();requestAnimationFrame(frame);
</script>
