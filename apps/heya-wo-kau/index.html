<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>部屋を飼う</title>
<meta name="description" content="意思を持つ部屋が集まった巨大住宅。部屋の接続を組み替えて出口を目指す一人称3Dホラー。家は、あなたの攻略法を覚えている。">
<style>
:root{--fg:#e9e1d4;--dim:rgba(233,225,212,.55);--accent:#ffcf7a;--danger:#ff4a4a;--panel:rgba(12,9,16,.92);--line:rgba(233,225,212,.18)}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#030206;color:var(--fg);touch-action:none;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
button{font-family:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.78) 100%)}
#red{z-index:1;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(160,0,0,.75) 100%);opacity:0}
#uw{z-index:1;background:rgba(20,70,95,.55);opacity:0;transition:opacity .2s}
#flash{z-index:6;background:#000;opacity:0;transition:opacity .8s}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,255,255,.45);z-index:2;pointer-events:none}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
#topL{position:absolute;left:14px;top:calc(10px + env(safe-area-inset-top));max-width:58%}
#stName{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:14px;letter-spacing:.1em;color:var(--accent);text-shadow:0 0 8px #000}
#goal{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5;text-shadow:0 0 6px #000}
#inv{font-size:15px;margin-top:5px;text-shadow:0 0 6px #000}
#topR{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
.hb{pointer-events:auto;background:rgba(20,14,26,.72);border:1px solid rgba(255,207,122,.45);border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;letter-spacing:.05em}
.hb.sq{padding:9px 12px;border-color:var(--line)}
#bMap{box-shadow:0 0 12px rgba(255,207,122,.25)}
#msg{position:absolute;left:16px;right:16px;top:30%;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:1.8;letter-spacing:.06em;opacity:0;transition:opacity .5s;text-shadow:0 0 6px #000,0 0 14px #000}
#msg.on{opacity:1}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));width:min(92%,560px);text-align:center;font-size:13px;line-height:1.6;background:rgba(10,8,14,.7);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#bars{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(122px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;align-items:center}
.bar{width:150px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#d8cfb8}
#breathB i{background:#6cc8ff}
#bAct{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));pointer-events:auto;background:rgba(40,26,10,.85);border:1px solid var(--accent);color:var(--accent);border-radius:14px;padding:12px 22px;font-size:16px;letter-spacing:.08em;cursor:pointer;box-shadow:0 0 18px rgba(255,207,122,.3)}
#bRun{position:absolute;right:18px;bottom:calc(26px + env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;pointer-events:auto;background:rgba(20,14,26,.55);border:1px solid var(--line);font-size:14px}
#bRun.on{background:rgba(255,207,122,.25);border-color:var(--accent)}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);display:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.18)}
#joyHint{position:absolute;left:20px;bottom:calc(30px + env(safe-area-inset-bottom));font-size:11px;color:rgba(255,255,255,.28)}
/* 間取り盤 */
#map{position:fixed;inset:0;z-index:4;background:rgba(3,2,8,.62);display:flex;align-items:center;justify-content:center;padding:12px}
.mbox{background:var(--panel);border:1px solid rgba(255,207,122,.35);border-radius:16px;padding:12px 12px 14px;max-width:100%;box-shadow:0 0 40px rgba(0,0,0,.7)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.mhead b{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:var(--accent);letter-spacing:.15em;font-size:16px}
#mapInfo{font-size:11px;color:var(--dim)}
#grid{position:relative;margin:0 auto;background:repeating-linear-gradient(45deg,#0a0810 0 6px,#0d0a14 6px 12px);border-radius:8px}
.cell{position:absolute;padding:4px;cursor:pointer}
.cell .in{position:absolute;inset:4px;border-radius:6px;border:1px solid rgba(233,225,212,.25);background:#1b1524;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cell .nm{font-size:11px;letter-spacing:.04em;text-align:center;line-height:1.2;position:relative;z-index:1}
.cell .ic{font-size:15px;position:relative;z-index:1;min-height:18px}
.cell.empty .in{background:transparent;border:1px dashed rgba(233,225,212,.15)}
.cell.empty .nm{color:rgba(233,225,212,.3)}
.cell.empty.can .in{border:1px dashed var(--accent);background:rgba(255,207,122,.08)}
.cell.empty.can .nm{color:var(--accent)}
.cell.you .in{border:2px solid #7fe3ff;box-shadow:inset 0 0 14px rgba(127,227,255,.25)}
.cell.sel .in{border:2px solid var(--accent);box-shadow:0 0 14px rgba(255,207,122,.5)}
.cell.fixed .in{background:repeating-linear-gradient(135deg,#221a2a 0 8px,#2a2033 8px 16px)}
.cell.enemy .in{animation:epulse 1.1s infinite}
@keyframes epulse{0%,100%{box-shadow:inset 0 0 6px rgba(255,40,40,.2)}50%{box-shadow:inset 0 0 22px rgba(255,40,40,.75)}}
.cell .wt{position:absolute;left:0;right:0;bottom:0;background:rgba(60,150,200,.45);z-index:0}
.dr{position:absolute;background:#7a6a8c;z-index:2;border-radius:2px}
.dr.o{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.dr.k0{top:0;left:34%;width:32%;height:6px}.dr.k2{bottom:0;left:34%;width:32%;height:6px}
.dr.k1{right:0;top:34%;height:32%;width:6px}.dr.k3{left:0;top:34%;height:32%;width:6px}
#mapHint{font-size:12px;line-height:1.55;color:var(--dim);text-align:center;margin:10px 4px 0;min-height:38px}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:8px}
.mb{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer}
.mb.pri{border-color:var(--accent);color:var(--accent)}
.mb:disabled{opacity:.3}
/* ダイアログ */
.ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6)}
.dbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;width:min(100%,420px);text-align:center}
.dbox h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;letter-spacing:.15em;font-size:21px;margin-bottom:12px;color:var(--accent)}
.dbox .bd{font-size:14px;line-height:1.85;color:#d8d0c2;margin-bottom:16px;text-align:left}
.dbox .bd p+p{margin-top:8px}
.dbtns{display:flex;flex-direction:column;gap:8px}
.db{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:15px;cursor:pointer;letter-spacing:.05em}
.db.pri{border-color:var(--accent);color:var(--accent)}
.db:disabled{opacity:.3;cursor:default}
.db small{display:block;font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:0}
/* タイトル */
#title{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.75))}
.tbox{text-align:center;width:min(100%,380px)}
.tsub{font-size:12px;letter-spacing:.3em;color:var(--dim)}
.tbox h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-weight:500;font-size:clamp(44px,13vw,68px);letter-spacing:.2em;margin:10px 0 6px;padding-left:.2em;text-shadow:0 0 24px rgba(255,180,90,.35),0 0 4px #000}
.tcatch{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:13px;color:#cfc4b0;letter-spacing:.08em;margin-bottom:22px;line-height:1.8;text-shadow:0 0 6px #000}
#tAbs{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:13px;color:#ffb0a0;margin:-10px 0 18px;letter-spacing:.06em;text-shadow:0 0 8px #000}
.tb{display:block;width:100%;margin:8px 0;background:rgba(14,10,18,.78);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;letter-spacing:.12em;cursor:pointer}
.tb.pri{border-color:var(--accent);color:var(--accent)}
#tCont{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#tCont .tb{flex:1;min-width:70px;font-size:13px;letter-spacing:.04em;padding:10px 4px;margin:2px 0}
#tEnd{margin-top:14px;font-size:12px;color:var(--dim);letter-spacing:.06em}
/* 導入・エンディング */
#intro{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1s;text-align:center;padding:16px}
#intro.on{opacity:1}
#intro .a{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(19px,5.6vw,28px);letter-spacing:.14em;white-space:nowrap;text-shadow:0 0 16px #000,0 0 4px #000}
#intro .b{font-size:13px;color:#cfc4b0;margin-top:12px;letter-spacing:.1em;text-shadow:0 0 8px #000}
#ending{position:fixed;inset:0;z-index:7;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.ebox{width:min(100%,460px);font-family:"Yu Mincho","Hiragino Mincho ProN",serif}
.ebox p{font-size:16px;line-height:2.1;letter-spacing:.06em;opacity:0;transition:opacity 2s;margin-bottom:14px}
.ebox p.on{opacity:1}
.ebox .et{font-size:24px;text-align:center;letter-spacing:.3em;color:var(--accent);margin-top:20px}
.ebox button{display:block;margin:28px auto 0;opacity:0;transition:opacity 1.5s}
.ebox button.on{opacity:1}
body.shake #c{animation:shk .09s infinite}
@keyframes shk{0%{transform:translate(1px,0)}50%{transform:translate(-1px,1px)}100%{transform:translate(0,-1px)}}
#err{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;line-height:1.8;background:#000}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig" class="fx"></div><div id="uw" class="fx"></div><div id="red" class="fx"></div>

<div id="hud" hidden>
  <div id="cross"></div>
  <div id="topL"><div id="stName"></div><div id="goal"></div><div id="inv"></div></div>
  <div id="topR"><button id="bMap" class="hb">間取り盤</button><button id="bPause" class="hb sq">Ⅱ</button></div>
  <div id="msg"></div>
  <div id="hint" hidden></div>
  <div id="bars"><div id="stamB" class="bar"><i></i></div><div id="breathB" class="bar" hidden><i></i></div></div>
  <button id="bAct" hidden></button>
  <button id="bRun" hidden>走る</button>
  <div id="joy"><div id="knob"></div></div>
  <div id="joyHint" hidden>左側をドラッグで移動／右側で視点</div>
</div>

<div id="map" hidden>
  <div class="mbox">
    <div class="mhead"><b>間取り盤</b><span id="mapInfo"></span></div>
    <div id="grid"></div>
    <div id="mapHint"></div>
    <div class="mbtns"><button id="bRot" class="mb pri">↻ 回転</button><button id="bClose" class="mb">閉じる</button></div>
  </div>
</div>

<div id="title">
  <div class="tbox">
    <div class="tsub">一人称3Dホラー × 空間パズル</div>
    <h1>部屋を飼う</h1>
    <div class="tcatch">あなたが学習するほど、家もあなたを学習する。</div>
    <div id="tAbs" hidden></div>
    <button id="tNew" class="tb pri">はじめから</button>
    <div id="tCont"></div>
    <button id="tHow" class="tb">遊び方</button>
    <div id="tEnd"></div>
  </div>
</div>

<div id="intro"><div class="a"></div><div class="b"></div></div>
<div id="dlg" class="ov" hidden><div class="dbox"><h2 id="dlgT"></h2><div id="dlgB" class="bd"></div><div id="dlgBtns" class="dbtns"></div></div></div>
<div id="ending" hidden><div class="ebox" id="ebox"></div></div>
<div id="flash" class="fx"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
