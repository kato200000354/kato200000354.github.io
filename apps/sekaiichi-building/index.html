<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>世界一のビルを建てろ</title>
<meta name="description" content="クレーンでフロアを積み上げて、世界一高いビルを目指す3D建設シミュレーション。目指せブルジュ・ハリファ、そして宇宙へ！">
<meta name="theme-color" content="#1b2a4a">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer}
#hud{position:fixed;left:8px;right:62px;top:calc(6px + env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
#money{font-size:22px;font-weight:800}
#inc{font-size:13px;color:#d6ffb0;font-weight:700}
#height{font-size:18px;font-weight:800;color:#fff6b0}
#floors{font-size:12px;opacity:.9}
.bars{display:flex;gap:6px;margin-top:4px;max-width:300px}
.bar{position:relative;flex:1;height:16px;border-radius:8px;background:rgba(0,0,0,.35);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:#5ad16b;transition:width .3s}
.bar b{position:relative;display:block;font-size:10px;line-height:16px;text-align:center}
#next{margin-top:4px;font-size:12px;background:rgba(0,0,0,.3);display:inline-block;padding:2px 8px;border-radius:10px}
#warn{margin-top:3px;font-size:12px;color:#ffd0d0;font-weight:700}
#side{position:fixed;right:8px;top:calc(8px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px}
#side button{width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.7);background:rgba(20,35,70,.65);color:#fff;font-size:20px;font-weight:800;padding:0}
#side #bCrane{font-size:13px}
#side button.on{background:#e8833a}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,20,40,.55) 30%)}
#info{font-size:12px;text-align:center;padding:4px 8px;text-shadow:0 1px 2px #000;min-height:22px}
#types{display:flex;gap:6px;overflow-x:auto;padding:2px 8px 4px;scrollbar-width:none}
#types::-webkit-scrollbar{display:none}
.tc{flex:0 0 auto;width:74px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(25,40,75,.8);color:#fff;padding:4px 2px;text-align:center;font-size:11px;line-height:1.25}
.tc .e{font-size:22px;display:block}
.tc .p{font-weight:800;color:#fff3a0;font-size:11px}
.tc.sel{border-color:#ffd54a;background:rgba(232,131,58,.9)}
.tc.poor .p{color:#ff9b9b}
.tc.lock{opacity:.45}
#tapHint{position:fixed;left:50%;top:44%;transform:translateX(-50%);font-size:15px;font-weight:800;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:20px;pointer-events:none;animation:blink 1.2s infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.35}}
.toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;white-space:nowrap;pointer-events:none;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6);animation:pop 1.3s ease-out forwards;z-index:20}
.toast.small{font-size:17px;top:56%}
.toast.good{color:#fff36b}.toast.perfect{color:#7dffb0;font-size:36px}.toast.bad{color:#ff8b8b;font-size:22px}.toast.big{font-size:26px;color:#ffd54a;white-space:normal;width:90%;text-align:center}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.conf{position:fixed;top:-40px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:25}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#modal,#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,25,.55);z-index:30;padding:16px}
.card{background:#fffaf0;color:#2a2a3a;border-radius:20px;padding:18px 16px;width:100%;max-width:380px;max-height:86vh;overflow:auto;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.card h2{margin:4px 0 8px;font-size:20px}
.card p{margin:0 0 12px;font-size:14px;line-height:1.6;white-space:pre-line}
#mEmo{font-size:48px;line-height:1.1}
#mBtns{display:flex;flex-direction:column;gap:8px}
.btn{border:none;border-radius:14px;padding:12px;font-size:16px;font-weight:800;background:#e8833a;color:#fff;box-shadow:0 3px 0 #a5521b}
.btn.sub{background:#7a8aa6;box-shadow:0 3px 0 #4b5770}
.btn:disabled{opacity:.45}
.shop{display:flex;flex-direction:column;gap:8px;text-align:left;margin-bottom:10px}
.si{display:flex;align-items:center;gap:8px;background:#f1eadb;border-radius:12px;padding:8px}
.si .t{flex:1;font-size:13px;line-height:1.4}
.si .t b{font-size:14px}
.si button{flex:0 0 auto;min-width:92px;padding:8px 6px;font-size:13px}
#title .card{max-width:400px}
#title h1{margin:4px 0;font-size:30px;line-height:1.2;color:#1b2a4a}
#title h1 span{color:#e8833a}
.how{font-size:13px;text-align:left;background:#f1eadb;border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <div class="row"><span id="money">0円</span><span id="inc">+0円/秒</span></div>
  <div class="row"><span id="height">0m</span><span id="floors">0階</span></div>
  <div class="bars">
    <div class="bar"><i id="stabBar"></i><b id="stabTxt">安定度</b></div>
    <div class="bar"><i id="satBar"></i><b id="satTxt">満足度</b></div>
  </div>
  <div id="next"></div>
  <div id="warn"></div>
</div>
<div id="side" hidden>
  <button id="bShop" title="強化">🛠</button>
  <button id="bView" title="全体を見る">🔭</button>
  <button id="bCrane" title="一度に積む階数">×1階</button>
  <button id="bAuto" title="自動クレーン" hidden>🤖</button>
  <button id="bSnd" title="音">🔊</button>
</div>
<div id="bottom" hidden>
  <div id="info"></div>
  <div id="types"></div>
</div>
<div id="tapHint" hidden>👆 画面をタップしてフロアを落とす！</div>
<div id="modal" hidden><div class="card"><div id="mEmo"></div><h2 id="mTitle"></h2><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="title"><div class="card">
  <div style="font-size:52px">🏗️</div>
  <h1>世界一の<span>ビル</span>を<br>建てろ</h1>
  <div class="how">
    🏗️ クレーンでゆれるフロアを、<b>タップ</b>して落として積もう<br>
    ✨ ぴったり重ねると <b>PERFECT</b>！ずれるとビルがグラグラに<br>
    💰 テナントの家賃でお金がたまる。フロアの種類で作戦を<br>
    🛗 エレベーターがないと住民がキレる<br>
    🏆 目標は <b>828m</b>（世界一）。その先は…宇宙？
  </div>
  <div id="mBtns2" style="display:flex;flex-direction:column;gap:8px">
    <button class="btn" id="bStart">はじめる</button>
    <button class="btn sub" id="bNew" hidden>さいしょから</button>
  </div>
</div></div>
