<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>トモダチ島ぐらし</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{--blue:#2f6fae;--blue2:#4f95d6;--navy:#1f4e7f;--yel:#ffd54a;--yel2:#f5b400;--panel:#fbfaf5;--line:#dfe5ee;--text:#3a3d4a;--sub:#7b8194;--pink:#ff6f9f;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7ec8ee;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Meiryo',system-ui,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 12px 0;z-index:40;pointer-events:none}
.clock{background:rgba(24,62,104,.85);color:#fff;border-radius:16px;padding:6px 14px 7px;font-weight:800;line-height:1.25;box-shadow:0 3px 8px rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.65)}
.clock .d{font-size:15px}.clock .t{font-size:13px;opacity:.92}
.coin{background:rgba(24,62,104,.85);color:#fff;border-radius:999px;padding:5px 16px 5px 6px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.65);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.coin i{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a0,#f5b400 60%,#c98600);display:block;border:2px solid #fff6c0}

/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px max(10px,env(safe-area-inset-bottom));z-index:40;pointer-events:none;gap:8px}
#nav .grp{display:flex;gap:7px;pointer-events:auto}
.nbtn{background:linear-gradient(#3d82c6,#1f4e7f);color:#fff;border:3px solid #fff;border-radius:14px;padding:7px 13px;font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;white-space:nowrap}
.nbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.nbtn .e{font-size:18px}
.nbtn.sm{font-size:13px;padding:6px 11px}
@media (max-width:560px){.nbtn{padding:7px 9px;font-size:12px}.nbtn .lb{display:none}.nbtn .e{font-size:21px}}

/* modal */
#modal{position:absolute;inset:0;background:rgba(20,30,50,.42);display:none;align-items:center;justify-content:center;z-index:80;padding:12px}
#modal.on{display:flex}
.panel{background:var(--panel);border:4px solid var(--blue);border-radius:18px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.ph{background:linear-gradient(#4f95d6,#2f6fae);color:#fff;padding:9px 14px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ph .x{background:none;border:none;color:#fff;font-size:22px;opacity:.85;padding:0 4px}
.pb{padding:12px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.pf{padding:10px 12px;border-top:2px solid var(--line);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;flex-shrink:0}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{flex:1;min-width:58px;background:#e9eef5;border:none;border-radius:10px;padding:8px 6px;font-weight:800;color:#556;font-size:14px}
.tab.on{background:var(--yel);color:#4a3a00;box-shadow:inset 0 -3px 0 var(--yel2)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-weight:700;width:100%;text-align:left;font-size:15px;color:var(--text)}
.row:hover{background:#fff6d0;border-color:var(--yel2)}
.row .ic{font-size:22px;width:30px;text-align:center;flex-shrink:0}
.row .n{flex:1}
.row .c{color:var(--sub);font-weight:800}
.row .ic svg{width:100%;height:100%;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;font-weight:700;font-size:12px;color:var(--text);position:relative;line-height:1.3}
.card:hover{border-color:#b9cbe2}
.card.sel{border-color:var(--yel2);background:#fff8dc;box-shadow:0 0 0 2px var(--yel)}
.card svg{width:100%;height:64px;display:block}
.card .cnt{position:absolute;top:4px;right:5px;background:var(--blue);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
.card .em{font-size:38px;height:64px;display:flex;align-items:center;justify-content:center}
.card .pr{color:#b07a00;font-weight:800}
.sec{font-weight:800;color:var(--sub);font-size:13px;margin:10px 2px 6px}
.desc{margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:54px;font-size:14px}
.desc b{display:block;margin-bottom:2px;font-size:15px}
.b{background:linear-gradient(#ffe57a,#ffc928);border:2px solid #e8a900;color:#4a3800;border-radius:12px;padding:9px 18px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #c98f00}
.b.blue{background:linear-gradient(#5aa0e0,#2f6fae);border-color:#1f4e7f;color:#fff;box-shadow:0 3px 0 #1a426b}
.b.gray{background:#eef1f5;border-color:#cbd3de;color:#556;box-shadow:0 3px 0 #b8c1cd}
.b.red{background:linear-gradient(#ff8a80,#e2483e);border-color:#b0302a;color:#fff;box-shadow:0 3px 0 #8f2620}
.b:active{transform:translateY(2px);box-shadow:none}
.b:disabled{opacity:.5}
.chip{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;margin:2px;font-weight:700;font-size:13px}
.bar{height:11px;border-radius:99px;background:#e6eaf0;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:99px}

/* scene */
.mii{position:absolute;bottom:calc(3% + 44px);transform:translateX(-50%);height:min(52vh,440px,88vw);aspect-ratio:100/150;animation:bob 2.6s ease-in-out infinite;cursor:pointer;z-index:2}
.mii svg{width:100%;height:100%;display:block;overflow:visible}
.mii.m{height:min(42vh,350px,60vw)}
.mii.s{height:min(34vh,290px,42vw)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
.mii.sel svg{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 9px #ffd54a)}
.mii.jump{animation:jump .55s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-18px)}}
.bub{position:absolute;top:max(13%,78px);transform:translateX(-50%);background:#fff;border-radius:22px;padding:10px 18px;font-weight:800;font-size:clamp(14px,2.3vw,20px);box-shadow:0 4px 12px rgba(0,0,0,.18);max-width:min(78vw,460px);text-align:center;z-index:6;animation:pop .2s;line-height:1.5}
.bub:after{content:'';position:absolute;left:50%;bottom:-12px;margin-left:-10px;border-width:13px 10px 0;border-style:solid;border-color:#fff transparent transparent}
.bub.trb{background:#fffbe6;border:3px solid #ffb02e;cursor:pointer}
.bub.trb:after{border-top-color:#ffb02e}
.bub .go{margin-top:6px;display:inline-block;background:linear-gradient(#ffb056,#f0731c);color:#fff;border-radius:999px;padding:4px 14px;font-size:14px}
.bub .tic{font-size:1.3em;margin-right:4px}
.narr{position:absolute;left:50%;top:max(14%,80px);transform:translateX(-50%);background:rgba(24,62,104,.9);color:#fff;border-radius:14px;padding:12px 20px;font-weight:800;font-size:clamp(14px,2.2vw,19px);z-index:6;max-width:88vw;text-align:center;animation:pop .2s}
.tap{position:absolute;right:16px;bottom:16px;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px;font-weight:800;color:var(--blue);z-index:7;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
.prop{position:absolute;bottom:calc(3% + 44px);font-size:min(11vh,84px);transform:translateX(-50%);z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.fx{position:absolute;z-index:4;font-size:min(6vh,40px);animation:floaty 2.2s ease-out infinite;pointer-events:none}
@keyframes floaty{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
.icol{position:absolute;left:12px;top:max(86px,14%);display:flex;flex-direction:column;gap:9px;z-index:10}
.ib{width:62px;height:62px;border-radius:14px;background:linear-gradient(#ffb056,#f0731c);border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.18);color:#fff;font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.ib .e{font-size:24px;line-height:1}
.ib:active{transform:translateY(2px)}
@media (max-height:560px){.ib{width:50px;height:50px;font-size:9px}.ib .e{font-size:19px}.icol{display:grid;grid-template-columns:repeat(2,50px);gap:6px;top:78px}.mb{padding:6px 10px;margin-bottom:4px;font-size:14px}.side h3{margin-bottom:4px}}
.tr{position:absolute;right:12px;top:max(64px,calc(env(safe-area-inset-top) + 58px));display:flex;flex-direction:column;gap:8px;z-index:10;align-items:flex-end}
.side{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:min(270px,44vw);background:rgba(255,255,255,.94);border-radius:18px;padding:10px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:10;border:3px solid #cfdcec}
.side h3{margin:2px 4px 8px;font-size:15px;color:var(--sub)}
.mb{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:2.5px solid #cfdcec;border-radius:12px;padding:9px 12px;margin-bottom:7px;font-weight:800;font-size:15px;color:#2b4c74;text-align:left}
.mb:last-child{margin-bottom:0}
.mb:hover{background:#fff4c4;border-color:var(--yel2)}
.mb .e{font-size:20px;width:24px;text-align:center}
.ptag{position:absolute;left:0;top:max(76px,13%);background:linear-gradient(#4f95d6,#2f6fae);color:#fff;font-weight:800;font-size:20px;padding:6px 24px 6px 16px;border-radius:0 999px 999px 0;z-index:9;border:3px solid #fff;border-left:none;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.empty{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);border-radius:16px;padding:16px 22px;font-weight:800;text-align:center;z-index:5;line-height:1.8;max-width:86vw}
@media (max-width:640px),(max-aspect-ratio:1/1){
 .side{top:auto;bottom:66px;transform:none;left:10px;right:10px;width:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
 .side h3{grid-column:1/-1;margin:0 4px}
 .mb{margin:0;padding:8px 10px;font-size:14px}
 #scr-place .mii{bottom:calc(66px + 180px)}
 #scr-place .mii.m,#scr-place .mii.s{height:min(30vh,230px,40vw)}
 #scr-place .bub{top:max(18%,120px)}
}

/* map */
#scr-map{background:#3fa6dc}
#scr-map>svg{position:absolute;inset:0;width:100%;height:100%}
.lbl{cursor:pointer}
.lbl:hover rect{fill:#fff6c4}

/* apartment */
.bld{position:absolute;left:50%;transform:translateX(-50%);top:max(76px,12%);bottom:72px;width:min(760px,94vw);display:flex;flex-direction:column;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
.roof{height:42px;background:linear-gradient(#f08a4b,#d8662c);border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 -10px}
.roof span{background:#fff;border-radius:8px;padding:2px 14px;font-weight:800;color:#a24d1d;border:2px solid #f3c7a5}
.facade{flex:1;background:#f6ead0;border:4px solid #dcc69c;border-top:none;padding:16px 16px 26px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px 16px;overflow:auto;align-content:start;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.facade{grid-template-columns:repeat(4,1fr)}}
.win{position:relative;background:linear-gradient(#dff1ff,#bfe0fb);border:5px solid #fff;border-radius:8px;aspect-ratio:4/3;box-shadow:inset 0 0 0 2px #b7c7d6,0 4px 0 #d3bb8c;cursor:pointer}
.win:hover{transform:translateY(-2px)}
.win .face{position:absolute;inset:4% 8% 0;overflow:hidden}
.win .face svg{width:100%;height:100%;display:block}
.win.sleep{background:linear-gradient(#1d2a55,#33457e)}
.win.out{background:repeating-linear-gradient(90deg,#9ed69a 0 10px,#8bc987 10px 20px)}
.win.add{background:#efe4cc;border-style:dashed;border-color:#c9b48a;display:flex;align-items:center;justify-content:center;font-weight:800;color:#a08350;text-align:center;font-size:26px;line-height:1}
.win.add small{font-size:12px}
.win .np{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);background:#fff;border:2px solid #d9c49a;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:800;white-space:nowrap;z-index:2}
.win .tb{position:absolute;right:-12px;top:-14px;background:#fff;border:3px solid #ff8c2b;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:19px;animation:bnc 1s infinite;z-index:3}
@keyframes bnc{50%{transform:translateY(-5px)}}
.win .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#2c5a2a;font-weight:800;text-align:center;padding:4px;line-height:1.4}
.win .zz{position:absolute;right:6px;top:4px;color:#fff;font-weight:800;font-size:13px}

/* profile */
.pgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media (max-width:520px){.pgrid{grid-template-columns:1fr}}
.pbox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.ptop{display:flex;gap:10px;align-items:center}
.ava{width:84px;height:84px;border-radius:14px;background:#e8f2fb;flex-shrink:0;overflow:hidden;border:2px solid #d5e3f2}
.ava svg{width:100%;height:100%}
.pname{font-size:21px;font-weight:800}
.lab{font-size:12px;color:var(--sub);font-weight:800;margin-top:8px}
.frs{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.fr{text-align:center;font-size:11px;font-weight:800;width:56px}
.fr .ava{width:52px;height:52px;margin:0 auto 2px}
.stat{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;font-weight:800}
.stat .si{font-size:20px;width:26px;text-align:center}
.stat .sv{flex:1}
.relrow{display:flex;align-items:center;gap:10px;padding:6px;border-bottom:1px solid var(--line)}
.relrow .ava{width:44px;height:44px}
.relrow .n{flex:1;font-weight:800}
.tagl{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;color:#fff}

/* album */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photo{background:#fff;padding:5px 5px 3px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer;border:1px solid #e5e5e5}
.photo svg{width:100%;aspect-ratio:4/3;display:block;border-radius:3px}
.photo .cap{font-size:11px;font-weight:700;color:var(--sub);padding:3px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigphoto svg{width:100%;aspect-ratio:16/10;display:block;border-radius:8px}

/* creator */
.crw{display:grid;grid-template-columns:180px 1fr;gap:14px}
@media (max-width:560px){.crw{grid-template-columns:1fr}.crprev{height:180px}}
.crprev{background:linear-gradient(#dff1ff,#fdf7e6);border-radius:14px;border:2px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:8px}
.crprev{align-self:start;height:300px;position:sticky;top:0}
.crprev svg{height:100%;width:auto;display:block}
.fl{font-weight:800;font-size:13px;color:var(--sub);margin:8px 0 4px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfd8e3;margin:2px;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--yel2)}
.opt{background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:800;font-size:13px;margin:2px;color:var(--text)}
.opt.on{background:var(--yel);border-color:var(--yel2)}
.inp{width:100%;font-size:17px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);font-weight:800}
.sel{font-size:14px;padding:6px;border-radius:10px;border:2px solid var(--line);font-weight:700;background:#fff}

/* bowling */
#scr-bowl{background:radial-gradient(circle at 50% 0,#4a3a80,#1e1838)}
.bw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.sb{border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.3);flex-shrink:0}
.sb th{background:var(--blue);color:#fff;padding:3px 8px}
.sb td{border:1px solid #e3e7ee;padding:2px 8px;text-align:center;min-width:42px}
.sb td.nm{text-align:left;white-space:nowrap}
.sb tr.cur td{background:#fff6cf}
.sb .tot{color:var(--blue);font-size:15px}
#lane{flex:1;min-height:0;width:100%;max-width:520px;margin:6px 0}
.bwb{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);border-radius:18px;padding:8px 14px;width:min(560px,100%);flex-shrink:0}
.bwb .who{width:54px;height:54px;flex-shrink:0;border-radius:12px;background:#e8f2fb;overflow:hidden}
.bwb .who svg{width:100%;height:100%}
.bwb .mid{flex:1;min-width:0}
.bwb .msg{font-weight:800;font-size:15px}
.pw{height:12px;background:#e6eaf0;border-radius:99px;overflow:hidden;margin-top:5px}
.pw i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5cbf5c,#ffd54a,#ff5a3c)}
.b.big{font-size:18px;padding:12px 22px}

/* misc */
#toasts{position:absolute;top:max(72px,11%);left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:rgba(255,255,255,.97);border:3px solid var(--blue);border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.2);animation:tin .25s,tout .4s 2.8s forwards;text-align:center}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.flash{position:absolute;inset:0;background:#fff;z-index:95;pointer-events:none;animation:fl .6s forwards}
@keyframes fl{from{opacity:1}to{opacity:0}}
.qface{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.qface .ava{width:70px;height:70px}
.qface .q{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;flex:1;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="scr-map" class="screen"></div>
  <div id="scr-apart" class="screen"></div>
  <div id="scr-room" class="screen"></div>
  <div id="scr-place" class="screen"></div>
  <div id="scr-event" class="screen"></div>
  <div id="scr-bowl" class="screen"></div>
  <div id="hud">
    <div class="clock"><div class="d" id="hd"></div><div class="t" id="ht"></div></div>
    <div class="coin"><i></i><span id="hm"></span></div>
  </div>
  <div id="nav">
    <div class="grp">
      <button class="nbtn" onclick="navApart()"><span class="e">👥</span><span class="lb">住人を見る</span></button>
