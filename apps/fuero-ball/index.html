<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ふえろ！ボール</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="長押しでボールを落として、×2・×3のゲートで増やしまくれ！何千発にもふくれあがったボールでボスブロックを粉砕する、数字がドパドパ増える爽快ゲーム。">
<meta name="theme-color" content="#0a0620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0a0620;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,2,22,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:16px;z-index:10}
.card{width:min(380px,100%);background:linear-gradient(#26135a,#140a32);border:2px solid #7b5cff;border-radius:22px;padding:22px 18px 20px;text-align:center;box-shadow:0 0 40px #7b5cff66;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.logo{font-size:46px;font-weight:900;line-height:1.05;background:linear-gradient(#fff36b,#ff9a3c 55%,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a1d8a)}
.sub{font-size:13px;color:#c9b8ff;margin-top:8px;line-height:1.6}
.big{font-size:40px;font-weight:900;background:linear-gradient(#fff36b,#ff6bd6);-webkit-background-clip:text;background-clip:text;color:transparent}
.big.lose{background:linear-gradient(#9fe8ff,#7b8cff);-webkit-background-clip:text;background-clip:text}
.stat{margin-top:6px;font-size:15px;color:#e6dcff}
.stat b{color:#ffd23f;font-size:18px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-size:20px;font-weight:900;background:linear-gradient(#ffe35a,#ff8a00);color:#3a1600;box-shadow:0 5px 0 #a34d00;margin-top:16px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a34d00}
.btn.sec{background:linear-gradient(#8f7bff,#5b3fe0);color:#fff;box-shadow:0 5px 0 #33208f;font-size:16px;padding:10px;margin-top:10px}
.ups{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.up{background:#2d1a68;border:2px solid #5d43c4;border-radius:12px;padding:8px 2px 7px;font-size:12px;line-height:1.35}
.up .n{font-weight:800;font-size:13px}
.up b{display:block;font-size:19px;color:#9fffd8}
.up .c{color:#ffd23f;font-weight:800;font-size:13px}
.up:not(:disabled):active{transform:scale(.95)}
.up:disabled{opacity:.45}
.up.can{border-color:#ffd23f;box-shadow:0 0 12px #ffd23f88}
.how{margin-top:14px;text-align:left;font-size:13px;color:#d8ccff;background:#ffffff10;border-radius:12px;padding:10px 12px;line-height:1.7}
.how span{font-weight:800}
#pauseB{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;background:#ffffff18;font-size:17px;z-index:5;display:none}
#pauseB.on{display:block}
#pauseOv{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(6,2,22,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#pauseOv.on{display:flex}
#pauseOv b{font-size:28px;letter-spacing:.2em}
#mute{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;background:#ffffff18;font-size:19px;z-index:5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="mute" aria-label="音のオンオフ">🔊</button>
<button id="pauseB" aria-label="一時停止">⏸</button>
<div id="pauseOv"><b data-t="paused">一時停止中</b><button class="btn" id="resumeB" style="width:min(260px,80vw)" data-t="resume">▶ つづける</button></div>

<div class="ov" id="title">
  <div class="card">
    <div class="logo" data-t="logo">ふえろ！<br>ボール</div>
    <div class="sub" data-t="sub">ゲートをくぐるたびにボールが増える。<br>何千発になってもまだ増える。</div>
    <div class="how" data-t="how">
      <span>指をすべらせる</span>と発射口だけ動く（狙い）<br>
      <span>止めて長押し</span>でボールを落とす。落としながら左右にも動かせる<br>
      <span style="color:#3dffb0">×2 ×3</span>で増える・<span style="color:#ffd23f">金の×10</span>は大当たり<br>
      <span style="color:#ff5d7a">÷2 ÷3</span>は減ってしまうので避けよう（先のステージほど増える）
    </div>
    <div class="stat" id="tBest"></div>
    <button class="btn" id="startBtn" data-t="start">スタート</button>
    <button id="langBtn" style="margin-top:10px;background:none;border:1.5px solid rgba(255,255,255,.35);color:#fff;font:inherit;font-weight:800;font-size:13px;padding:6px 16px;border-radius:999px;cursor:pointer">English</button>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="card">
    <div class="big" id="rTitle">BREAK!!</div>
    <div class="stat" id="rLine1"></div>
    <div class="stat" id="rLine2"></div>
    <div class="ups" id="ups"></div>
    <button class="btn" id="nextBtn" data-t="next">次のステージ</button>
  </div>
</div>
