<style>
[hidden]{display:none!important}
:root{
  --ink:#17120c;--paper:#fff4d6;--paper2:#ffe9b3;--yellow:#ffcf1f;--red:#e8291c;--blue:#1f6fe0;--green:#1f9d4d;--pink:#ff5fa8;--muted:#6d5f49;
  --logo:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17120c;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
.pop{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);border-radius:10px;background:var(--paper)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--logo);min-height:46px;padding:8px 12px;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);background:var(--yellow);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.white{background:#fff}
.btn:disabled{background:#cdc3ad;color:#7f7565;box-shadow:none;transform:translate(3px,3px);cursor:default}

#hud{position:fixed;top:calc(var(--safe-t) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:6;pointer-events:none}
#hud>*{pointer-events:auto}
#best{padding:4px 10px;font-size:12px;line-height:1.25;max-width:58vw}
#best b{font-family:var(--logo);font-weight:400;font-size:15px;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hudBtns{display:flex;gap:6px}
.icon{width:42px;height:42px;font-size:20px;display:flex;align-items:center;justify-content:center}

#title{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 62px) 16px calc(var(--safe-b) + 18px);pointer-events:none}
#logo{font-family:var(--logo);font-size:min(16.5vw,82px);line-height:1;color:var(--yellow);text-align:center;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--red);transform:rotate(-5deg);animation:logoIn .6s cubic-bezier(.2,1.8,.4,1) both}
#logo small{display:block;font-size:.34em;color:#fff;text-shadow:3px 3px 0 var(--ink);margin-bottom:6px;-webkit-text-stroke:2px var(--ink)}
@keyframes logoIn{from{transform:rotate(-16deg) scale(2.2);opacity:0}}
.titleFoot{width:min(100%,420px);display:flex;flex-direction:column;gap:9px;pointer-events:auto}
#startBtn{font-size:25px;min-height:66px;background:var(--red);color:#fff}
.disc{font-size:11px;line-height:1.5;color:#fff;text-align:center;background:rgba(23,18,12,.76);padding:6px 9px;border-radius:7px}

.panel{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0 auto;max-width:600px;background:var(--paper);border-top:4px solid var(--ink);padding:9px 10px calc(var(--safe-b) + 10px);display:flex;flex-direction:column;gap:8px}
@media (min-width:601px){.panel{border-left:4px solid var(--ink);border-right:4px solid var(--ink);border-radius:14px 14px 0 0}}
#lab{height:min(53vh,410px)}
.statRow{display:flex;gap:8px;align-items:stretch}
.stat{flex:1;min-width:0;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--muted);line-height:1.2}
.stat b{display:block;color:var(--ink);font-family:var(--logo);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barBox{height:7px;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:#eee;margin-top:2px}
#riskBar{height:100%;width:0;background:var(--green);transition:width .3s,background .3s}
.syrRow{display:flex;gap:6px;align-items:stretch}
.slot{flex:1;min-width:0;height:56px;background:#fff;border:3px dashed #a3947a;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;line-height:1.15;text-align:center;overflow:hidden;padding:2px}
.slot.on{border:3px solid var(--ink);background:var(--paper2);animation:slotIn .22s cubic-bezier(.2,1.8,.4,1)}
.slot i{font-style:normal;font-size:23px;line-height:1.1}
@keyframes slotIn{from{transform:scale(.4)}}
#injectBtn{width:92px;flex:none;font-size:15px;background:var(--pink);line-height:1.15;text-align:center;padding:4px}
#preview{font-size:12px;min-height:17px;line-height:17px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#preview b{color:var(--red)}
.tabs{display:flex;gap:4px}
.tab{flex:1;height:34px;border:2px solid var(--ink);border-radius:8px 8px 0 0;background:#e2d3ab;font-size:13px;font-weight:700;margin-bottom:-8px;padding-bottom:4px}
.tab.on{background:var(--yellow)}
#grid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;align-content:start;background:var(--paper2);border:2px solid var(--ink);border-radius:0 0 8px 8px;padding:6px;position:relative;touch-action:pan-y}
.ing{min-width:0;height:62px;background:#fff;border:2px solid var(--ink);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font-size:10px;line-height:1.1;text-align:center;box-shadow:2px 2px 0 var(--ink);overflow:hidden}
.ing:active{transform:translate(2px,2px);box-shadow:none}
.ing i{font-style:normal;font-size:20px;line-height:1.15}
.ing em{font-style:normal;font-weight:700;color:var(--blue);font-size:10px}
.ing em.bad{color:var(--red)}
.ing.lock{background:#cdc3ad;color:#6f6553;box-shadow:none}
#punchBtn{min-height:44px;font-size:15px;flex:none}

#site{gap:7px}
#siteTitle,#reactTitle{font-family:var(--logo);font-size:17px;text-align:center}
.siteBtn{display:flex;gap:9px;align-items:center;width:100%;min-height:50px;padding:5px 9px;background:#fff;border:2px solid var(--ink);border-radius:9px;box-shadow:2px 2px 0 var(--ink);text-align:left}
.siteBtn:active{transform:translate(2px,2px);box-shadow:none}
.siteBtn:disabled{opacity:.42;box-shadow:none}
.siteBtn i{font-style:normal;font-size:22px}
.siteBtn b{display:block;font-size:14px}
.siteBtn span{font-size:11px;color:var(--muted);line-height:1.25;display:block}
#siteBack{min-height:40px;font-size:14px}

#react{gap:8px;text-align:center}
#reactList{display:flex;flex-direction:column;gap:5px;max-height:36vh;overflow:auto}
.rcp{background:var(--yellow);border:3px solid var(--ink);border-radius:9px;padding:6px 8px;animation:rcpIn .36s cubic-bezier(.2,1.9,.4,1) both}
.rcp b{font-family:var(--logo);font-weight:400;font-size:19px;display:block;line-height:1.2}
.rcp span{font-size:12px;line-height:1.3;display:block}
.rcp.new::before{content:"新発見！";display:inline-block;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700}
.rcp.nerf{background:#bcd5ff}
@keyframes rcpIn{from{transform:scale(.3) rotate(-8deg);opacity:0}}
#reactMul{font-family:var(--logo);font-size:32px;color:var(--red);line-height:1.1;-webkit-text-stroke:1px var(--ink)}
#reactSay{font-size:13px;min-height:18px;line-height:1.35}

#meterWrap{position:fixed;left:14px;right:14px;bottom:calc(var(--safe-b) + 24px);max-width:560px;margin:0 auto;z-index:5;text-align:center}
#meterMsg{font-family:var(--logo);font-size:21px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;margin-bottom:7px}
#meter{position:relative;height:44px;border:4px solid var(--ink);border-radius:10px;overflow:hidden;background:linear-gradient(90deg,#6b6b6b 0 18%,#f0d24a 18% 38%,#f47f23 38% 46%,#e8291c 46% 54%,#f47f23 54% 62%,#f0d24a 62% 82%,#6b6b6b 82%)}
#needle{position:absolute;top:-4px;bottom:-4px;width:7px;margin-left:-3px;background:#fff;border:2px solid var(--ink)}
#hitLayer{position:fixed;inset:0;z-index:4}

#cap{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 66px);z-index:7;text-align:center;pointer-events:none}
#capMain{display:inline-block;font-family:var(--logo);font-size:min(10vw,44px);line-height:1.15;color:var(--yellow);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--red);animation:capIn .28s cubic-bezier(.2,1.9,.4,1) both}
#capSub{font-size:14px;font-weight:700;color:#fff;margin-top:8px;text-shadow:0 0 4px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
@keyframes capIn{from{transform:scale(2.4) rotate(-6deg);opacity:0}}
#impact{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none}
#impact span{font-family:var(--logo);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--red);transform:rotate(-8deg);display:block;text-align:center;line-height:1.05;animation:impIn .22s cubic-bezier(.2,2,.4,1) both;padding:0 8px;word-break:keep-all}
@keyframes impIn{from{transform:rotate(-8deg) scale(3.2);opacity:0}}
#speed{position:fixed;inset:-30%;z-index:3;pointer-events:none;opacity:0;background:repeating-conic-gradient(#000 0 .9deg,transparent .9deg 5deg);-webkit-mask:radial-gradient(circle,transparent 32%,#000 62%);mask:radial-gradient(circle,transparent 32%,#000 62%);animation:spin .3s steps(4) infinite}
@keyframes spin{to{transform:rotate(20deg)}}
#flash{position:fixed;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}
#skip{position:fixed;right:10px;bottom:calc(var(--safe-b) + 10px);z-index:10;color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:4px 9px;border-radius:6px;pointer-events:none}
#cineTap{position:fixed;inset:0;z-index:9}
#ending{position:fixed;inset:0;z-index:12;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-family:var(--logo);font-size:24px;line-height:1.6;color:var(--ink);opacity:0;pointer-events:none;transition:opacity 1s}

#more{border-top:3px dashed #c9b48e;padding-top:7px}
#more.endMore{border:3px solid var(--ink);border-radius:10px;background:var(--yellow);padding:7px}
#moreHead{font-weight:900;font-size:13px;text-align:center;margin-bottom:5px}
#moreGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.moreCard{display:block;min-width:0;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff;color:var(--ink);text-decoration:none}
.moreCard img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#2b1d14}
.moreCard b{display:block;font-weight:900;font-size:10.5px;letter-spacing:0;line-height:1.25;padding:4px 3px 0}
.moreCard i{display:block;font-style:normal;font-size:10px;letter-spacing:0;line-height:1.25;color:var(--muted);padding:1px 3px 4px}
#moreLinks{display:grid;grid-template-columns:1.5fr 1fr;gap:5px;margin-top:7px}
#moreAll,#moreFollow{display:block;border-radius:10px;padding:8px 2px;font-weight:900;font-size:13px;letter-spacing:0;text-align:center;text-decoration:none}
#moreAll{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);padding:5px 2px}
#moreFollow{background:#111;color:#fff}
#result{height:min(66vh,540px);gap:7px}
#rBody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
#rBody>*{flex:none}
#rTitle{font-family:var(--logo);font-size:19px;text-align:center;line-height:1.25;color:var(--red)}
#rScore{font-family:var(--logo);font-size:min(11vw,42px);line-height:1.1;text-align:center;overflow-wrap:anywhere}
#rScore small{font-size:.5em}
#rNew{align-self:center;background:var(--red);color:#fff;font-family:var(--logo);font-size:13px;padding:2px 10px;border-radius:6px;animation:rcpIn .4s both}
.bill{display:flex;justify-content:space-between;gap:8px;font-size:13px;background:#fff;border:2px dashed var(--ink);padding:5px 9px;border-radius:7px}
.bill b{text-align:right;color:var(--red)}
#rComment{font-size:13px;line-height:1.45}
#rShots{font-size:12px;line-height:1.5;background:var(--paper2);border-radius:8px;padding:5px 9px;overflow-wrap:anywhere}
#rUnlock{font-size:14px;font-weight:700;color:#fff;background:var(--green);border:2px solid var(--ink);border-radius:8px;padding:4px 9px;text-align:center}
#rProg{font-size:12px;text-align:center}
#rProg b{font-family:var(--logo);font-weight:400;font-size:14px}
#rProg em{font-style:normal;font-weight:700;color:var(--red)}
#rScore.final{color:var(--red)!important}
.later{opacity:0;transform:translateY(8px)}
#rBody>*{transition:opacity .22s,transform .22s}
.slam{animation:slam .26s cubic-bezier(.2,2,.4,1) both}
@keyframes slam{from{transform:scale(1.55);filter:brightness(1.6)}}
.rcp.roul{background:#ffe9b3}
.rcp.site{background:#fff;padding:3px 8px}.rcp.site b{font-size:15px}
.rcp.safe{background:#a8ffbf}
#rays{position:fixed;inset:-40%;z-index:2;pointer-events:none;opacity:0;background:repeating-conic-gradient(var(--ray,#ffcf1f) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 52%);mask:radial-gradient(circle,#000 12%,transparent 52%)}
#rays.on{animation:rayIn 1.1s ease-out both}
@keyframes rayIn{0%{opacity:.75;transform:rotate(0) scale(.7)}100%{opacity:0;transform:rotate(60deg) scale(1.1)}}
#conf{position:fixed;inset:0;width:100%;height:100%;z-index:11;pointer-events:none}
.hotT{animation:hotT .4s steps(2) infinite}
@keyframes hotT{50%{color:#ff8a14}}
#injectBtn.hot{animation:hotB .42s ease-in-out infinite alternate;background:var(--yellow)}
@keyframes hotB{to{transform:scale(1.07);filter:brightness(1.12)}}
.syrRow.hot .slot.on{background:#fff0a0;border-color:var(--red)}
#powV.bump{animation:slam .3s both}
#rHint{font-size:12px;line-height:1.45;background:#fff;border-left:5px solid var(--blue);padding:5px 8px}
.rBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.rBtns .btn{min-height:40px;font-size:13px}
.rBtns #againBtn{grid-column:1/-1;font-size:18px;background:var(--red);color:#fff;min-height:50px}

#tip{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 62px);z-index:6;margin:auto;max-width:440px;padding:6px 10px;font-size:13px;font-weight:700;line-height:1.35;text-align:center;pointer-events:none;animation:rcpIn .3s both}
#say{position:fixed;left:50%;top:calc(var(--safe-t) + 60px);transform:translateX(-50%);z-index:6;max-width:88vw;width:max-content;padding:4px 10px;font-size:13px;font-weight:700;line-height:1.35;text-align:center;pointer-events:none;background:#fff}

/* 小さいスマホ：3Dを減らして素材欄を確保 */
@media (max-height:650px) and (max-aspect-ratio:119/100){
  #lab{height:64vh;gap:5px}
  .slot{height:44px}.slot i{font-size:18px}
  .stat b{font-size:14px}
  #punchBtn{min-height:38px}
  #result{height:68vh}
  .siteBtn{min-height:42px;padding:3px 8px}
}
/* 横長画面：パネルを右に立てる */
@media (min-aspect-ratio:6/5){
  .panel,#lab,#result{left:auto;right:0;top:0;bottom:0;margin:0;width:min(47vw,480px);max-width:none;height:auto;border-top:0;border-left:4px solid var(--ink);border-right:0;border-radius:0;overflow-y:auto}
  #hud{right:calc(min(47vw,480px) + 8px)}
  #title #logo{font-size:min(16.5vw,82px,15vh)}
  #tip,#say{right:auto;left:12px;width:calc(100vw - min(47vw,480px) - 24px);max-width:none;transform:none;top:calc(var(--safe-t) + 60px)}
  #grid{min-height:92px}
  #react,#site{justify-content:center}
  body.inTitle #hud{right:8px}
}
@media (min-aspect-ratio:6/5) and (max-height:500px){
  #title{padding-top:calc(var(--safe-t) + 8px);padding-bottom:calc(var(--safe-b) + 6px)}
  #title #logo{font-size:12vh}
  .titleFoot{gap:4px}
  #startBtn{min-height:42px;font-size:17px}
  .disc{font-size:10px;padding:3px 6px}
}
#book{position:fixed;inset:0;z-index:20;background:rgba(23,18,12,.8);display:flex;align-items:flex-end;justify-content:center}
#bookIn{width:100%;max-width:600px;height:86%;background:var(--paper);border:4px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding:12px 12px calc(var(--safe-b) + 12px);gap:8px}
#bookHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
#bookHead h2{margin:0;font-family:var(--logo);font-weight:400;font-size:20px}
#bookStat{font-size:12px;line-height:1.45;color:var(--muted)}
#bookList{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.bk{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35}
.bk b{font-family:var(--logo);font-weight:400;font-size:14px;margin-right:4px}
.bk em{font-style:normal;color:var(--red);font-weight:700}
.bk.unk{background:#fff4c9;color:var(--ink);border-style:dashed}
.bk.lockd{background:#e4d9bf;color:#6a5e49}
.bk .mat{display:block;margin-top:3px;font-weight:700}
.bkHint{display:block;width:100%;min-height:36px;margin-top:6px;background:var(--yellow);border:2px solid var(--ink);border-radius:7px;font-weight:700;font-size:12.5px;color:var(--ink)}
.bkGoal{flex:none;background:#241a3d;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5}
.bkGoal b{display:block;font-family:var(--logo);font-weight:400;font-size:15px;color:var(--yellow)}
.bkGoal ul{margin:4px 0 0;padding-left:1.2em}
.bkGoal .step{margin-top:7px;padding-top:6px;border-top:1px dashed #8b7fb0}
.bkGoal .step i{font-style:normal;font-weight:700;color:var(--yellow)}
.bkHead{flex:none;font-family:var(--logo);font-size:14px;padding:3px 2px 0}
#bookClose{min-height:46px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="speed"></div>
<div id="rays"></div>

<div id="hud">
  <div id="best" class="pop">自己ベスト<b id="bestV">-</b></div>
  <div class="hudBtns">
    <button id="bookBtn" class="icon pop" aria-label="調合ノート">📓</button>
    <button id="muteBtn" class="icon pop" aria-label="音の切り替え">🔊</button>
  </div>
</div>

<div id="title">
  <div id="logo"><small>全身バカ注入アクション</small>ドーピング<br>パンチ</div>
