<title>最強の剣を打て</title>
<meta name="description" content="素材を選んで、焼いて、叩いて、冷やして、最強の剣を打つ3Dゲーム。ちくわ、入れ歯、ブラックホールの欠片…なんでも剣になる。試し斬りは豆腐から宇宙まで。">

<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#1a110c;--paper:#fff4e0;--fire:#ff6a1a;--gold:#ffc83a;--hot:#e5372a;--dim:rgba(20,12,8,.82)}
html,body{height:100%;background:#1a110c;overflow:hidden;overscroll-behavior:none;touch-action:none;
 font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--paper);-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.5) 100%)}
.dela{font-family:"Dela Gothic One","Hiragino Kaku Gothic ProN",sans-serif;font-weight:400}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
button{font-family:inherit;border:0;cursor:pointer;color:inherit}
.btn{display:block;width:100%;padding:13px 10px;border-radius:14px;font-size:17px;font-weight:900;background:linear-gradient(#ff8a3a,#e04a17);color:#fff;
 box-shadow:0 4px 0 #8a2a08,0 8px 18px rgba(0,0,0,.4);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a2a08}
.btn.sub{background:linear-gradient(#5a4436,#3a2a20);box-shadow:0 4px 0 #1e140e}
.btn.gold{background:linear-gradient(#ffe07a,#f0a81c);color:#3a2306;text-shadow:none;box-shadow:0 4px 0 #8a5a06}
.btn.x{background:#000;box-shadow:0 4px 0 #444}
.btn[disabled]{opacity:.4;pointer-events:none}

/* タイトル */
#title{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 34px) 22px calc(env(safe-area-inset-bottom) + 26px);
 background:linear-gradient(rgba(20,10,5,.55),rgba(20,10,5,0) 40%,rgba(20,10,5,0) 55%,rgba(20,10,5,.85))}
#title h1{font-size:clamp(40px,13vw,64px);line-height:1.05;text-align:center;color:#fff;letter-spacing:.02em;
 text-shadow:0 0 24px rgba(255,120,30,.9),0 4px 0 #7a1d06,0 6px 14px rgba(0,0,0,.6)}
#title h1 small{display:block;font-size:.34em;letter-spacing:.3em;color:var(--gold);margin-bottom:8px;text-shadow:0 2px 0 #000}
#title .catch{margin-top:12px;font-size:14px;text-align:center;line-height:1.7;color:#ffe9c9;text-shadow:0 2px 4px #000}
#titleBtns{width:100%;max-width:340px;display:grid;gap:12px}
#titleBtns .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#best{font-size:12.5px;text-align:center;color:#ffdca8;min-height:1.2em;text-shadow:0 1px 3px #000}

/* 共通HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;align-items:center;gap:8px;pointer-events:none}
#steps{display:flex;gap:4px;flex:1}
#steps i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);font-style:normal}
#steps i.on{background:var(--fire);box-shadow:0 0 8px var(--fire)}
#steps i.done{background:#ffb070}
#mute{pointer-events:auto;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);font-size:17px}
#tip{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 54px);text-align:center;pointer-events:none}
#tip b{display:block;font-size:22px;color:#fff;text-shadow:0 2px 0 #000,0 0 14px rgba(255,110,30,.8)}
#tip span{display:inline-block;margin-top:6px;font-size:13.5px;background:rgba(0,0,0,.55);padding:5px 12px;border-radius:999px;line-height:1.5}

/* 素材選び */
#pick{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(rgba(26,17,12,0),rgba(26,17,12,.96) 14%)}
#slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 10px}
.slot{height:54px;border-radius:12px;border:2px dashed rgba(255,200,140,.4);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#ffcf9a;background:rgba(0,0,0,.3);padding:0 4px;text-align:center;line-height:1.2}
.slot.f{border-style:solid;border-color:#ffb070;background:rgba(255,120,40,.18);color:#fff}
.slot em{font-style:normal;font-size:22px}
#shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mat{position:relative;border-radius:12px;padding:8px 4px 7px;background:linear-gradient(#4a372a,#2e2119);text-align:center;box-shadow:0 3px 0 #150d08;min-width:0}
.mat .ic{font-size:26px;line-height:1.15;display:block}
.mat .nm{display:block;font-size:12px;font-weight:900;line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat .ds{display:block;font-size:10px;color:#e8c9a8;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mat .q{position:absolute;right:5px;top:4px;font-size:10px;color:#ffd9a8}
.mat .rr{position:absolute;left:5px;top:4px;font-size:9.5px;font-weight:900;letter-spacing:.04em}
.mat.r1{background:linear-gradient(#3a4a6a,#222b40)}
.mat.r1 .rr{color:#8fc8ff}
.mat.r2{background:linear-gradient(#6a3a7a,#3a1f46);box-shadow:0 3px 0 #1d0f24,0 0 12px rgba(200,110,255,.45)}
.mat.r2 .rr{color:#f0b0ff}
.mat.r3{background:linear-gradient(#8a6a1a,#4a3608);box-shadow:0 3px 0 #2a1d04,0 0 18px rgba(255,210,80,.75);animation:shine 1.4s infinite alternate}
.mat.r3 .rr{color:#ffe680}
@keyframes shine{to{box-shadow:0 3px 0 #2a1d04,0 0 28px rgba(255,230,120,1)}}
.mat.out{opacity:.35;pointer-events:none}
#pickBtns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}

/* 加熱 */
#heat{position:fixed;inset:0;pointer-events:none}
#gauge{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 170px);bottom:calc(env(safe-area-inset-bottom) + 130px);width:34px;border-radius:17px;
 background:linear-gradient(#fff 0%,#ffe27a 12%,#ff8a2a 40%,#a8220a 75%,#3a0d04 100%);box-shadow:0 0 0 3px #000,0 0 0 5px #6a4a36}
#zone{position:absolute;left:-8px;right:-8px;border:3px solid #fff;border-radius:8px;box-shadow:0 0 12px #fff,inset 0 0 10px rgba(255,255,255,.6)}
#zone:after{content:"ここ!";position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);font-size:13px;font-weight:900;white-space:nowrap;color:#fff;text-shadow:0 1px 3px #000}
#needle{position:absolute;left:-14px;right:-14px;height:6px;margin-top:-3px;background:#fff;border-radius:3px;box-shadow:0 0 0 2px #000,0 0 10px #fff}
#melt{position:absolute;left:-60px;top:-24px;font-size:11px;font-weight:900;color:#fff;white-space:nowrap;text-shadow:0 1px 3px #000}
#holdBtn{pointer-events:auto;position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);width:min(260px,70vw);height:84px;border-radius:42px;
 font-size:19px;font-weight:900;background:radial-gradient(circle at 50% 30%,#ffb35a,#e0400f);box-shadow:0 6px 0 #7a1d04,0 0 30px rgba(255,100,20,.6);color:#fff;touch-action:none}
#holdBtn.on{transform:translateX(-50%) translateY(4px) scale(.97);box-shadow:0 2px 0 #7a1d04,0 0 60px rgba(255,160,40,1)}

/* 鍛造リング */
#ringWrap{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
#ringT,#ringM{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
#ringT{width:68px;height:68px;border:4px solid rgba(255,255,255,.9);box-shadow:0 0 14px rgba(255,200,120,.9)}
#ringM{border:5px solid var(--gold);box-shadow:0 0 16px var(--gold)}
#hamCnt{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);text-align:center;font-size:15px;pointer-events:none;text-shadow:0 2px 3px #000}
#hamCnt b{font-size:26px;color:var(--gold)}
#judge{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:42px;pointer-events:none;opacity:0;color:#fff;text-shadow:0 3px 0 #000,0 0 20px var(--fire)}
#judge.pop{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.25)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}

/* 焼き入れ */
#quench{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(rgba(26,17,12,0),rgba(26,17,12,.95) 18%)}
#liqs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.liq{border-radius:14px;padding:10px 8px;background:linear-gradient(#2a4a5a,#15283a);text-align:left;display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 #0a141e;min-width:0}
.liq em{font-style:normal;font-size:28px}
.liq b{display:block;font-size:14px}
.liq small{display:block;font-size:10.5px;color:#bfe0ff;line-height:1.3}
.liq.rare{background:linear-gradient(#7a1a2a,#3a0a14);box-shadow:0 3px 0 #1e0408,0 0 14px rgba(255,60,80,.6)}

/* 完成 */
#reveal{position:fixed;left:0;right:0;bottom:0;padding:0 18px calc(env(safe-area-inset-bottom) + 18px);text-align:center;background:linear-gradient(rgba(10,6,4,0),rgba(10,6,4,.9) 30%)}
#rvRank{font-size:15px;color:var(--gold);letter-spacing:.3em;text-shadow:0 2px 0 #000}
#rvName{white-space:nowrap;font-size:clamp(22px,7.4vw,34px);line-height:1.25;margin:6px 0 4px;color:#fff;text-shadow:0 0 18px rgba(255,180,80,.9),0 3px 0 #000;word-break:keep-all;overflow-wrap:anywhere}
#rvPow{font-size:13px;color:#ffdcb0}
#rvPow b{display:block;font-size:clamp(26px,9vw,40px);color:#fff;font-family:"Dela Gothic One",sans-serif;font-weight:400;text-shadow:0 0 16px var(--fire),0 3px 0 #000;line-height:1.2}
#rvBreak{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 14px;font-size:10.5px;color:#d8b896}
#rvBreak div{background:rgba(255,255,255,.07);border-radius:8px;padding:5px 2px;line-height:1.35}
#rvBreak b{display:block;font-size:13px;color:#fff}
#rvSpecial{display:inline-block;margin-bottom:6px;font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,#ff3a8a,#ffb03a);color:#fff}

/* 試し斬り */
#cutHud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 50px);text-align:center;pointer-events:none}
#cutStage{font-size:12px;letter-spacing:.2em;color:#ffe2b8;text-shadow:0 1px 3px #000}
#cutName{font-size:clamp(30px,10vw,44px);color:#fff;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.6);line-height:1.2}
#cutReq{display:inline-block;margin-top:6px;font-size:13px;background:rgba(0,0,0,.6);padding:5px 12px;border-radius:999px}
#cutReq b{color:var(--gold)}
#cutGo{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 34px);text-align:center;font-size:17px;font-weight:900;pointer-events:none;color:#fff;text-shadow:0 2px 0 #000,0 0 12px #000;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
#slash{position:fixed;left:50%;top:50%;width:150vmax;height:10px;margin:-5px 0 0 -75vmax;pointer-events:none;opacity:0;
 background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 24px #fff,0 0 60px #bfe6ff;border-radius:50%}
#slash.go{animation:slash .35s ease-out}
@keyframes slash{0%{opacity:1;clip-path:inset(0 100% 0 0)}40%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#gameCut{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
#gameCut .h{position:absolute;inset:0;background-size:100% 100%;transition:transform 2.2s cubic-bezier(.3,0,.2,1)}
#gameCut p{position:relative;font-size:15px;line-height:1.9;color:#ddd;opacity:0;transition:opacity 1.5s 1.6s}
#gameCut p b{font-size:24px;color:#fff;display:block}

/* 結果 */
#result{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 20px);background:rgba(14,9,6,.9);touch-action:pan-y}
.card{max-width:420px;margin:0 auto;background:linear-gradient(#3a2618,#22160e);border-radius:20px;padding:16px 14px 14px;border:2px solid #7a5232;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#resImg{display:block;width:100%;border-radius:12px;background:#000;aspect-ratio:1/1;object-fit:cover}
#resRank{text-align:center;margin-top:12px;font-size:13px;color:var(--gold);letter-spacing:.25em}
#resName{white-space:nowrap;text-align:center;font-size:clamp(20px,6.6vw,28px);line-height:1.3;color:#fff;margin:4px 0;overflow-wrap:anywhere}
#resPow{text-align:center;font-size:13px;color:#ffd9b0}
#resPow b{font-size:22px;color:#fff;font-family:"Dela Gothic One",sans-serif;font-weight:400}
#resCut{margin:12px 0 8px;text-align:center;font-size:17px;font-weight:900;color:#fff;background:rgba(255,120,40,.18);border-radius:12px;padding:10px 6px}
#resTop{text-align:center;font-size:13px;color:#ffcf96}
#resTop b{font-size:18px;color:var(--gold)}
#resComment{margin:10px 0 2px;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6}
#resComment .face{flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffd6a8,#c88a5a);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 2px #7a5232}
#resComment .bub{background:#fff4e0;color:#2a1a10;border-radius:4px 14px 14px 14px;padding:8px 12px;font-weight:900}
#resNew{text-align:center;margin-top:8px;font-size:13px;color:#ffe680;font-weight:900}
#resBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#resBtns .wide{grid-column:1/-1}

/* 図鑑 */
#zukan{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 20px);background:rgba(14,9,6,.96);touch-action:pan-y;z-index:40;background:#140c08}
#zukan h2{text-align:center;font-size:24px;margin-bottom:4px}
#zukan h3{font-size:14px;margin:16px 0 8px;color:var(--gold)}
#zukan .pr{text-align:center;font-size:13px;color:#ffd0a0}
.zgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.zi{background:rgba(255,255,255,.07);border-radius:10px;padding:8px;font-size:12.5px;line-height:1.4;min-width:0}
.zi b{display:block;font-size:14px}
.zi.no{opacity:.45}
.zi small{color:#d8b896}
#zukan .bestBox{background:rgba(255,160,60,.12);border-radius:12px;padding:10px;font-size:13px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>

<div id="hud" hidden><div id="steps"><i></i><i></i><i></i><i></i><i></i></div></div>
<button id="mute" style="position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:30" aria-label="音">🔊</button>
<div id="tip" hidden><b></b><span></span></div>

<!-- タイトル -->
<div id="title" class="layer">
 <div>
  <h1 class="dela"><small>鍛冶屋シミュレーター</small>最強の剣を<br>打て</h1>
  <p class="catch">ちくわでも、入れ歯でも、ブラックホールでも。<br>焼いて、叩いて、冷やして——<br>豆腐から<b>宇宙</b>まで、斬れるか。</p>
 </div>
 <div id="titleBtns">
  <p id="best"></p>
  <button class="btn" id="btnStart">剣を打つ</button>
  <div class="row">
   <button class="btn gold" id="btnDaily">今日の素材</button>
   <button class="btn sub" id="btnZukan">図鑑</button>
  </div>
 </div>
</div>

<!-- 素材選び -->
<div id="pick" hidden>
 <div id="slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
 <div id="shelf"></div>
 <div id="pickBtns"><button class="btn sub" id="btnReroll">棚を入替</button><button class="btn" id="btnForge" disabled>この素材で打つ</button></div>
</div>

<!-- 加熱 -->
<div id="heat" hidden>
 <div id="gauge"><div id="zone"></div><div id="needle"></div><div id="melt">↑ 溶ける</div></div>
 <button id="holdBtn">長押しで<br>ふいごを踏む</button>
</div>

<!-- 鍛造 -->
<div id="ringWrap" hidden><div id="ringT"></div><div id="ringM"></div></div>
<div id="hamCnt" hidden></div>
<div id="judge" class="dela"></div>

<!-- 焼き入れ -->
<div id="quench" hidden><div id="liqs"></div></div>

<!-- 完成 -->
<div id="reveal" hidden>
 <div id="rvSpecial" hidden></div>
 <div id="rvRank"></div>
 <div id="rvName" class="dela"></div>
 <div id="rvPow">攻撃力<b>0</b></div>
 <div id="rvBreak"></div>
 <button class="btn" id="btnCut">試し斬りへ</button>
</div>

<!-- 試し斬り -->
<div id="cutHud" hidden><div id="cutStage"></div><div id="cutName" class="dela"></div><div id="cutReq"></div></div>
<div id="cutGo" hidden>タップ / スワイプで斬れ！</div>
<div id="slash"></div>
<div id="flash"></div>
<div id="gameCut" hidden><p><b>ゲームを、斬ってしまった。</b>あなたの剣は、この世界の外側に届きました。<br><small>（タップで戻る）</small></p></div>

<!-- 結果 -->
<div id="result" hidden>
 <div class="card">
  <img id="resImg" alt="完成した剣">
  <div id="resRank"></div>
  <div id="resName" class="dela"></div>
  <div id="resPow"></div>
  <div id="resCut"></div>
  <div id="resTop"></div>
  <div id="resComment"><div class="face">👴</div><div class="bub"></div></div>
  <div id="resNew"></div>
  <div id="resBtns">
   <button class="btn x wide" id="btnShare">結果をXでポスト</button>
   <button class="btn sub" id="btnImg">画像で保存</button>
   <button class="btn sub" id="btnZukan2">図鑑</button>
   <button class="btn wide" id="btnAgain">もう一本打つ</button>
   <button class="btn sub wide" id="btnTitle">タイトルへ</button>
  </div>
 </div>
</div>

<!-- 図鑑 -->
<div id="zukan" hidden>
 <h2 class="dela">斬ったもの図鑑</h2>
 <p class="pr" id="zkPr"></p>
 <h3>自己ベストの剣</h3>
 <div class="bestBox" id="zkBest"></div>
 <h3>斬ったもの</h3>
 <div class="zgrid" id="zkCut"></div>
