<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>やすらぎ食堂物語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3d63; --blue:#2d6a9f; --blue2:#3f80ba; --pale:#eef6fb; --line:#7fb0d6;
  --brown:#4a3424; --cream:#fff8e6; --gold:#ffcd3c;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#3a2e24;
  background-image:radial-gradient(circle at 20% 10%,#5b4634 0,#3a2e24 60%);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  color:var(--navy);min-height:100vh;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer}
#app{
  max-width:1280px;margin:0 auto;padding:8px;
  display:grid;gap:8px;
  grid-template-columns:220px minmax(0,1fr) 260px;
  grid-template-areas:"top top top" "menu stage side" "bottom bottom bottom" "foot foot foot";
}
/* ---- top bar ---- */
#top{grid-area:top;display:flex;justify-content:space-between;gap:8px;align-items:stretch}
.datebox{display:flex;align-items:center;gap:12px;background:linear-gradient(#5a4130,#3f2c1f);
  border:3px solid #8a6a4c;border-radius:12px;padding:4px 12px 4px 4px;color:#fff;font-weight:800;font-size:20px;
  box-shadow:0 3px 0 #22180f;flex-wrap:wrap}
.wicon{width:44px;height:44px;border-radius:8px;background:linear-gradient(#ffb347,#ff8c1a);display:grid;place-items:center;font-size:26px;border:2px solid #ffd27a}
.sep{width:2px;height:28px;background:#8a6a4c}
#timeTxt{color:#ffe68a;letter-spacing:1px}
.speed{display:flex;gap:4px}
.speed button{background:#2b1e14;color:#ffe9b0;border:2px solid #8a6a4c;border-radius:7px;font-size:12px;font-weight:800;padding:4px 7px;min-width:36px}
.speed button.on{background:var(--gold);color:#4a2e00;border-color:#fff3b0}
.moneybox{background:linear-gradient(#fffdf4,#f3e7c6);border:3px solid #8a6a4c;border-radius:12px;padding:4px 16px;
  display:flex;align-items:center;gap:8px;font-size:26px;font-weight:800;color:#2a2a2a;box-shadow:0 3px 0 #22180f}
.moneybox small{font-size:16px}
/* ---- panels ---- */
.panel{background:var(--pale);border:3px solid var(--blue);border-radius:12px;box-shadow:0 3px 0 #173a5c;overflow:hidden}
.panel h3{margin:0;background:linear-gradient(#4a8bc4,#2d6396);color:#fff;padding:4px 10px;font-size:16px;display:flex;align-items:center;gap:6px;letter-spacing:1px}
#menu{grid-area:menu;padding:6px;display:flex;flex-direction:column;gap:6px;align-self:start}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;background:linear-gradient(#f8fcff,#d8ebf8);
  border:2px solid var(--line);border-radius:9px;font-weight:800;font-size:17px;color:var(--navy);text-align:left}
.mbtn .mi{font-size:24px;width:30px;text-align:center}
.mbtn .arr{margin-left:auto;font-size:20px}
.mbtn:hover{filter:brightness(1.05)}
.mbtn.hl{background:linear-gradient(#fff0a8,#ffcd3c);border-color:#d99a00;color:#5a3500}
/* ---- stage ---- */
#stage{grid-area:stage;position:relative;border-radius:12px;overflow:hidden;border:3px solid #6b4e36;background:#7dbb57;box-shadow:0 3px 0 #22180f;align-self:start}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated}
#openBtn{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:22px;font-weight:800;
  padding:12px 26px;border-radius:14px;border:3px solid #fff3b0;background:linear-gradient(#ff8a5c,#e8492a);color:#fff;
  box-shadow:0 4px 0 #8a2410,0 0 0 4px rgba(0,0,0,.15);animation:pulse 1.4s infinite;white-space:nowrap}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:90%}
.tmsg{background:rgba(31,61,99,.92);color:#fff;font-weight:800;padding:6px 14px;border-radius:20px;border:2px solid #fff;font-size:14px;animation:tin .3s;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* ---- side ---- */
#side{grid-area:side;display:flex;flex-direction:column;gap:8px;align-self:start}
.repTop{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.bar{flex:1;height:16px;background:#cfd8e0;border-radius:9px;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.bar i{display:block;height:100%;border-radius:7px;transition:width .4s}
.big{font-size:30px;font-weight:800;min-width:50px;text-align:right}
.repRow{display:flex;align-items:center;gap:8px;padding:2px 12px;font-weight:800;font-size:15px}
.repRow span:first-child{width:62px}
.repRow b{width:28px;text-align:right}
.repRow .bar{height:12px}
.cmt{display:flex;align-items:center;gap:8px;padding:8px 10px 10px}
.face{width:48px;height:48px;border-radius:10px;background:#d8e6f1;display:grid;place-items:center;font-size:32px;flex:none}
.bub{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;font-size:14px;position:relative;min-height:40px}
.bub:before{content:"";position:absolute;left:-9px;top:14px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.salesBig{text-align:right;font-size:28px;font-weight:800;padding:6px 12px 2px;color:#222}
.salesBig small{font-size:16px}
.kv{display:flex;justify-content:space-between;padding:4px 12px;font-weight:800;border-top:1px solid #cfe0ee;font-size:15px}
.kv span:first-child{color:var(--blue)}
/* ---- bottom ---- */
#bottom{grid-area:bottom;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px}
.pad{padding:8px 12px}
.shopName{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.lvRow{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin:4px 0}
.small{font-size:13px;font-weight:800;color:#45607e}
.badge{display:inline-block;background:linear-gradient(#a5683a,#7e4c27);color:#fff;border-radius:8px;padding:3px 10px;font-weight:800;font-size:13px;border:2px solid #e9c48f;margin-top:4px}
.recRow{display:flex;align-items:center;gap:10px}
.plate{width:60px;height:46px;border-radius:50%;background:radial-gradient(#fff 55%,#d7dde3 56%,#fff 70%);display:grid;place-items:center;font-size:28px;border:2px solid #c3ccd5;flex:none}
.hot{background:#ff9f2e;color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px;border:2px solid #fff;margin-left:6px}
.rankRow{margin-top:6px;background:#fff7d6;border-radius:8px;padding:4px 10px;font-weight:800;border:1px solid #ecd68d}
.rankRow b{font-size:22px;color:#c77d00}
.mini{display:grid;grid-template-columns:1fr 1.3fr;gap:6px;padding:6px}
.mini .panel{box-shadow:none;border-width:2px}
.mini h3{font-size:13px;padding:2px 8px}
.miniv{padding:4px 8px;font-weight:800;font-size:17px;text-align:right}
/* ---- footer ---- */
#foot{grid-area:foot;display:flex;justify-content:space-between}
.fbtn{background:linear-gradient(#f8fcff,#cfe3f3);border:3px solid var(--blue);border-radius:14px;padding:10px 26px;font-size:18px;font-weight:800;color:var(--navy);box-shadow:0 3px 0 #173a5c}
/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.mbox{background:var(--pale);border:4px solid var(--blue);border-radius:16px;width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 6px 0 #173a5c}
.mhead{background:linear-gradient(#4a8bc4,#2d6396);color:#fff;font-weight:800;font-size:19px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0}
#mClose{background:#fff;color:var(--blue);border:none;border-radius:8px;font-size:18px;font-weight:800;width:34px;height:34px}
#mBody{overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #cfe0ee;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.row .ic{font-size:30px;width:40px;text-align:center;flex:none}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:16px}
.row .ds{font-size:12px;color:#5a6f86;font-weight:500}
.btn{background:linear-gradient(#fff0a8,#ffcd3c);border:2px solid #d99a00;color:#5a3500;border-radius:9px;font-weight:800;padding:7px 12px;font-size:14px;white-space:nowrap}
.btn.blue{background:linear-gradient(#e3f1fc,#a9d0ee);border-color:#4f8cc1;color:var(--navy)}
.btn.red{background:linear-gradient(#ffd9d0,#ff9e8a);border-color:#d0553c;color:#6a1a0a}
.btn.big{font-size:20px;padding:12px 20px;width:100%;margin:6px 0}
.btn:disabled{filter:grayscale(1);opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:9px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--navy);font-size:15px}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stat{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-top:2px}
.stat span{width:36px}
.stat .bar{height:9px;border-width:1px}
.price{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}
.price b{min-width:64px;text-align:center;font-size:15px}
.price .btn{padding:3px 8px}
.tag{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:#dbeaf6;color:var(--blue);margin-left:4px;white-space:nowrap}
.sumgrid{display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-weight:800;font-size:16px;background:#fff;border-radius:10px;padding:10px 14px;border:2px solid #cfe0ee}
.sumgrid .tot{border-top:2px dashed #9cbad3;padding-top:4px;font-size:20px}
.plus{color:#1c8a3a}.minus{color:#c6402a}
.msg{background:#fff7d6;border:2px solid #ecd68d;border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:800}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;background:#fff;border:2px solid #cfe0ee;border-radius:10px;padding:8px}
.chart div{flex:1;background:linear-gradient(#5fb0ef,#2d6a9f);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.chart div span{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:9px;color:#fff;font-weight:800}
h4{margin:12px 0 6px;font-size:16px}
.help p{margin:6px 0;line-height:1.6;font-size:14px}

/* ---- responsive ---- */
@media (max-width:980px){
  #app{grid-template-columns:minmax(0,1fr) 240px;grid-template-areas:"top top" "stage side" "menu menu" "bottom bottom" "foot foot"}
  #menu{display:grid;grid-template-columns:repeat(3,1fr)}
  #bottom{grid-template-columns:1fr 1fr}
  #bottom > :last-child{grid-column:1/-1}
}
@media (max-width:680px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "menu" "side" "bottom" "foot";padding:6px;gap:6px}
  #top{flex-direction:column}
  .datebox{font-size:16px;gap:8px;justify-content:space-between}
  .wicon{width:34px;height:34px;font-size:20px}
  .moneybox{font-size:20px;justify-content:flex-end;padding:2px 14px}
  #menu{grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}
  .mbtn{flex-direction:column;gap:2px;font-size:12px;padding:6px 2px;text-align:center}
  .mbtn .mi{font-size:22px;width:auto}
  .mbtn .arr{display:none}
  #side{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #side .panel:first-child .cmt{display:none}
  .repRow{font-size:12px;padding:2px 6px;gap:4px}.repRow span:first-child{width:52px;white-space:nowrap}
  .big{font-size:22px}
  .salesBig{font-size:20px}
  .kv{font-size:12px;padding:3px 8px}
  #bottom{grid-template-columns:1fr}
  #openBtn{font-size:17px;padding:9px 18px}
  .fbtn{padding:8px 18px;font-size:15px}
  .row{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="datebox">
      <div id="wIcon" class="wicon">☀️</div>
      <div id="dateTxt">1年目 4月 1週</div>
      <div class="sep"></div>
      <div id="timeTxt">AM 10:00</div>
      <div class="speed" id="speedBox">
        <button data-sp="0">⏸</button><button data-sp="1">▶</button><button data-sp="2">▶▶</button><button data-sp="4">▶▶▶</button>
      </div>
    </div>
    <div class="moneybox">🪙 <span id="moneyTop">0</span><small>円</small></div>
  </header>

  <nav id="menu" class="panel">
    <button class="mbtn hl" data-m="run"><span class="mi">🏪</span>お店を運営<span class="arr">›</span></button>
    <button class="mbtn" data-m="staff"><span class="mi">🧑‍🍳</span>店員を雇う</button>
    <button class="mbtn" data-m="menu"><span class="mi">🍴</span>メニュー開発</button>
    <button class="mbtn" data-m="equip"><span class="mi">🔨</span>設備を購入</button>
    <button class="mbtn" data-m="info"><span class="mi">📈</span>情報を見る</button>
    <button class="mbtn" data-m="sys"><span class="mi">⚙️</span>システム</button>
  </nav>

  <main id="stage">
    <canvas id="cv" width="760" height="500"></canvas>
    <button id="openBtn">🏮 開店する！</button>
    <div id="toast"></div>
  </main>

  <aside id="side">
    <section class="panel">
      <h3><span id="repFace">🙂</span> 今日の評判</h3>
      <div class="repTop"><div class="bar"><i id="repBar" style="background:linear-gradient(#5be36b,#21a83a)"></i></div><div class="big" id="repAll">50</div></div>
      <div class="repRow"><span>・味</span><b id="rTaste">0</b><div class="bar"><i id="bTaste" style="background:linear-gradient(#5fb8ff,#1f7fd6)"></i></div></div>
      <div class="repRow"><span>・接客</span><b id="rServ">0</b><div class="bar"><i id="bServ" style="background:linear-gradient(#4fe0c0,#18a58a)"></i></div></div>
      <div class="repRow"><span>・清潔さ</span><b id="rClean">0</b><div class="bar"><i id="bClean" style="background:linear-gradient(#ffd25c,#f2a000)"></i></div></div>
      <div class="cmt"><div class="face" id="cFace">👩</div><div class="bub" id="cTxt">…</div></div>
    </section>
    <section class="panel">
      <h3>💴 本日の売上</h3>
      <div class="salesBig"><span id="sSales">0</span><small>円</small></div>
      <div class="kv"><span>来客数</span><span id="sCust">0人</span></div>
      <div class="kv"><span>客単価</span><span id="sUnit">0円</span></div>
      <div class="kv"><span>材料費</span><span id="sMat">0円</span></div>
      <div class="kv"><span>人件費</span><span id="sLabor">0円</span></div>
    </section>
  </aside>

  <section id="bottom">
    <div class="panel pad">
      <div class="shopName">🏪 <span id="shopName">やすらぎ食堂</span></div>
      <div class="lvRow">Lv. <span id="lvNum">1</span><div class="bar"><i id="lvBar" style="background:linear-gradient(#5fb8ff,#1f7fd6)"></i></div></div>
      <div class="small" id="lvNext">次のレベルまで あと 0円</div>
      <div class="badge">⭐ <span id="lvTitle">町の小さな食堂</span></div>
    </div>
    <div class="panel">
      <h3>本日のおすすめメニュー</h3>
      <div class="pad">
        <div class="recRow"><div class="plate" id="recIcon">🍖</div>
          <div><div style="font-weight:800;font-size:17px"><span id="recName">-</span><span class="hot" id="recHot">大人気！</span></div>
          <div style="font-weight:800;font-size:17px" id="recPrice">0円</div></div></div>
        <div class="rankRow">👑 今月の売上ランキング <b id="rankNum">-</b> 位</div>
      </div>
    </div>
    <div class="panel">
      <div class="mini">
        <div class="panel"><h3>現在のスタッフ</h3><div class="miniv">🧑‍🍳 <span id="staffNum">0</span>人</div></div>
        <div class="panel"><h3>所持金</h3><div class="miniv">🪙 <span id="money2">0</span>円</div></div>
      </div>
      <div class="panel" style="margin:0 6px 6px;box-shadow:none;border-width:2px">
        <h3 style="font-size:13px;padding:2px 8px">次のイベント</h3>
        <div class="pad small" style="font-size:14px;color:var(--navy)" id="nextEv">-</div>
      </div>
    </div>
  </section>

  <footer id="foot">
    <button class="fbtn" id="saveBtn">セーブ</button>
    <button class="fbtn" id="sysBtn">メニュー</button>
  </footer>
</div>

<div id="modal" hidden>
  <div class="mbox">
    <div class="mhead"><span id="mTitle"></span><button id="mClose">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const CW=760, CH=500;
const W=13, H=11, HW=28, HH=14, OX=352, OY=108, WALLH=92;
const MPS=5;                 // 1倍速で1秒あたり進むゲーム内の分
const OPEN=600, CLOSE=1260;  // 10:00〜21:00
const STREET_Y=H+0.85;
const SAVE_KEY='yasuragi-shokudo-save-v1';
const RENT=30000;

function iso(x,y){return [OX+(x-y)*HW, OY+(x+y)*HH];}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
const lerp=(a,b,t)=>a+(b-a)*t;

/* ================= データ ================= */
const DISHES=[
 {id:'curry',   name:'カレーライス',   icon:'🍛',price:680, cost:210,taste:52,time:4,  dev:0,     lv:1},
 {id:'onigiri', name:'おにぎりセット', icon:'🍙',price:450, cost:120,taste:44,time:2,  dev:0,     lv:1},
 {id:'hamburg', name:'ハンバーグ定食', icon:'🍖',price:880, cost:300,taste:62,time:6,  dev:0,     lv:1},
 {id:'ramen',   name:'しょうゆラーメン',icon:'🍜',price:750, cost:240,taste:58,time:5,  dev:30000, lv:1},
 {id:'pudding', name:'なめらかプリン', icon:'🍮',price:380, cost:90, taste:55,time:1.5,dev:35000, lv:1},
 {id:'napoli',  name:'ナポリタン',     icon:'🍝',price:780, cost:240,taste:60,time:4,  dev:45000, lv:2},
 {id:'cake',    name:'いちごショート', icon:'🍰',price:480, cost:140,taste:63,time:2,  dev:60000, lv:2},
 {id:'tempura', name:'天ぷら定食',     icon:'🍤',price:1100,cost:400,taste:72,time:7,  dev:90000, lv:2},
 {id:'kaisen',  name:'海鮮丼',         icon:'🐟',price:1400,cost:560,taste:80,time:5,  dev:140000,lv:3},
 {id:'bento',   name:'特製幕の内',     icon:'🍱',price:1600,cost:620,taste:84,time:6,  dev:200000,lv:3},
 {id:'sukiyaki',name:'すき焼き御膳',   icon:'🥘',price:2200,cost:880,taste:90,time:9,  dev:300000,lv:4},
 {id:'kani',    name:'カニ雑炊',       icon:'🦀',price:1800,cost:700,taste:92,time:8,  dev:380000,lv:5},
];
const D={}; DISHES.forEach(d=>D[d.id]=d);

const WEATHER={sun:{icon:'☀️',name:'晴れ',m:1},cloud:{icon:'☁️',name:'くもり',m:.9},rain:{icon:'☔',name:'雨',m:.7}};
const EVENTS=[
 {m:1, w:1,name:'お正月の初売り',icon:'🎍',type:'cust',val:1.3},
 {m:3, w:4,name:'お花見シーズン',icon:'🌸',type:'cust',val:1.25},
 {m:5, w:3,name:'食材フェア開催',icon:'🥬',type:'mat', val:.7},

function seatList(){

    a.push({i:t*4+2,t,x:tx,  y:ty-1,back:false});

const walkY=sy=>sy<=6?4.4:sy<=8?7.5:10.5;

function syncWorkers(reset){
  const nw={};let ci=0,hi=0;
  S.staff.forEach(s=>{
    let w=(!reset&&workers[s.id])||null;
    const isNew=!w;
    if(!w) w={id:s.id,x:0,y:0,path:[],task:null,st:'idle',walkT:0,bubble:null};
    w.s=s;
    if(s.role==='chef'){w.home=[STATIONS[ci],1.6];ci++;}
    else{w.home=HALL_IDLE[hi]||HALL_IDLE[0];hi++;}
    w.spd=.6+s.speed/220;
    if(isNew){w.x=w.home[0];w.y=w.home[1];}
    nw[s.id]=w;
  });
  Object.values(workers).forEach(w=>{
    if(nw[w.id])return;
    (w.jobs||[]).forEach(o=>{o.carrier=null;if(o.st==='carry')o.st='ready';});
    if(!w.task)return;
    const o=w.task;
    if(o.st==='cook'){o.st='queue';}
  });
  workers=nw;
}

/* ================= シミュレーション ================= */
function step(e,dt){
  if(!e.path.length){e.moving=false;return true;}
  const[tx,ty]=e.path[0];const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy),s=e.spd*dt;
  e.moving=true;e.walkT=(e.walkT||0)+dt;
  if(d>.001){e.flip=(dx-dy)<0;e.back=(dx+dy)<0;}
  if(d<=s){e.x=tx;e.y=ty;e.path.shift();if(!e.path.length){e.moving=false;return true;}return false;}
  e.x+=dx/d*s;e.y+=dy/d*s;return false;
}
function spawnCustomer(){
  const left=Math.random()<.5;
  const sx=left?-5:18;
  customers.push({x:sx,y:STREET_Y+rnd(-.1,.15),spd:.3+rnd(0,.05),path:[[1.5,STREET_Y]],st:'street',
    look:randLook(),exitX:Math.random()<.5?-5:18,bubble:null,walkT:0});
}
function setComment(kind){S.comment={txt:pick(COMMENTS[kind]),mood:kind};}
function goAway(c){c.st='away';c.sitting=false;c.path=[[c.exitX,STREET_Y]];}
function freeSeat(c){if(c.seat&&occ[c.seat.i]===c)delete occ[c.seat.i];}
function leaveRoute(c){
  const s=c.seat,wy=walkY(s.y);
  c.sitting=false;
  c.path=[[s.x,wy],[1.5,wy],[1.5,H-.3],[1.5,STREET_Y],[c.exitX,STREET_Y]];
}
function arriveDoor(c){
  if(S.phase!=='open'){goAway(c);return;}
  const free=seatList().filter(s=>!occ[s.i]);
  if(!free.length){
    S.day.lost++;c.bubble={txt:'💦',t:40};goAway(c);
    if(Math.random()<.3)setComment('full');
    return;
  }
  const s=pick(free);occ[s.i]=c;c.seat=s;c.st='in';
  const wy=walkY(s.y);
  c.path=[[1.5,H-.3],[1.5,wy],[s.x,wy],[s.x,s.y]];
}
function placeOrder(c){
  const list=offered();
  let tot=0;const ws=list.map(d=>{
    const m=S.menu[d.id];const t=Math.min(100,d.taste+(m.lv-1)*3);
    let w=t*t/100*clamp(Math.pow(d.price/m.price,2),.15,2.2);
    if(S.rec===d.id)w*=1.8;tot+=w;return w;
  });
  let r=Math.random()*tot,d=list[0];
  for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0){d=list[i];break;}}
  const o={id:uid(),dish:d.id,cust:c,st:'queue',t:0,px:0,carrier:null,dead:false};
  orders.push(o);c.order=o;c.st='wait';c.waited=0;
  c.pat=95+rnd(0,40)+(S.rep.service-50)*.4;
  c.bubble={txt:d.icon,t:9999};
}
function angryLeave(c){
  c.order.dead=true;S.day.angry++;
  S.rep.service=lerp(S.rep.service,10,.06);
  c.bubble={txt:'💢',t:50};setComment('angry');
  freeSeat(c);c.st='leave';leaveRoute(c);
}
function earn(v){S.money+=v;S.day.sales+=v;S.totalSales+=v;S.monthSales+=v;checkLevel();}
function finishEat(c){
  const o=c.order,d=D[o.dish],m=S.menu[o.dish];
  const price=m.price;earn(price);
  m.sold++;
  const nl=Math.min(10,1+Math.floor(Math.sqrt(m.sold/6)));
  if(nl>m.lv){m.lv=nl;toast(`${d.icon} ${d.name}の熟練度がLv.${nl}に上がった！`);}
  const taste=o.taste||50;
  const service=clamp(100-Math.max(0,c.waited-20)*.9+((o.serve||40)-50)*.35,0,100);
  const pr=price/d.price;const pp=pr>1?-(pr-1)*70:(1-pr)*15;
  const sat=.45*taste+.3*service+.15*S.rep.clean+.1*amb()+pp+rnd(-5,5);
  S.rep.taste=lerp(S.rep.taste,taste,.05);
  S.rep.service=lerp(S.rep.service,service,.05);
  const hall=S.staff.filter(s=>s.role==='hall');
  const avgServe=hall.length?hall.reduce((a,s)=>a+s.serve,0)/hall.length:30;
  S.rep.clean=clamp(S.rep.clean-(.75-avgServe/250),0,100);
  let mood=sat>=78?'great':sat>=62?'good':sat>=45?'meh':'bad';
  if(pr>1.25&&mood!=='great'&&Math.random()<.6)mood='pricey';
  c.bubble={txt:{great:'🎵',good:'😊',meh:'😐',bad:'😞',pricey:'💸'}[mood],t:60};
  if(Math.random()<.35||mood==='great')setComment(mood);
  S.day.customers++;S.day.satSum+=sat;
  const[sx,sy]=iso(c.x,c.y);
  floats.push({x:sx,y:sy-60,txt:'+'+fmt(price)+'円',t:1.6,c:'#ffe14a'});
  freeSeat(c);c.st='leave';leaveRoute(c);
}
function updateCustomers(dt){
  for(const c of customers){
    if(c.bubble){c.bubble.t-=dt;if(c.bubble.t<=0)c.bubble=null;}
    switch(c.st){
      case 'street':if(step(c,dt))arriveDoor(c);break;
      case 'in':if(step(c,dt)){c.st='order';c.t=rnd(2,4);c.sitting=true;c.back=c.seat.back;c.flip=c.seat.back;c.bubble={txt:'💭',t:9999};}break;
      case 'order':c.t-=dt;if(c.t<=0)placeOrder(c);break;
      case 'wait':c.waited+=dt;if(c.waited>c.pat)angryLeave(c);break;
      case 'eat':c.t-=dt;if(c.t<=0)finishEat(c);break;
      case 'leave':case 'away':if(step(c,dt))c.dead=true;break;
    }
  }
  customers=customers.filter(c=>!c.dead);
}
function updateChefs(dt){
  for(const w of Object.values(workers)){
    if(w.s.role!=='chef')continue;
    w.x=w.home[0];w.y=w.home[1];w.back=true;
    if(w.bubble){w.bubble.t-=dt;if(w.bubble.t<=0)w.bubble=null;}
    if(!w.task){
      const o=orders.find(o=>o.st==='queue'&&!o.dead);
      if(o){
        const d=D[o.dish];o.st='cook';w.task=o;
        o.t=d.time*1.4/(.55+w.s.cook/100+w.s.speed/300)/kitchenMult();
        const cost=Math.round(d.cost*matMult());S.money-=cost;S.day.mat+=cost;
      }
    }else{
      const o=w.task;w.cookT=(w.cookT||0)+dt;
      if(o.dead){o.st='x';w.task=null;continue;}
      o.t-=dt;
      if(o.t<=0){
        const d=D[o.dish],m=S.menu[o.dish];
        o.taste=Math.min(100,(d.taste+(m.lv-1)*3)*(.7+w.s.cook/170));
        o.st='ready';
        const same=orders.filter(x=>x.st==='ready'&&Math.abs(x.px-w.home[0])<.6).length;
        o.px=clamp(w.home[0]-.3+same*.3,1.2,9.8);
        w.task=null;w.bubble={txt:'✨',t:10};
      }
    }
  }
}
const AISLES=[1.5,5.75,9.25,12.6];
function hallRoute(seat){
  const wy=walkY(seat.y),pts=[];
  if(wy>4.5){
    const ax=AISLES.reduce((a,b)=>Math.abs(b-seat.x)<Math.abs(a-seat.x)?b:a);
    pts.push([ax,4.4],[ax,wy],[seat.x,wy]);
  }else pts.push([seat.x,4.4]);
  const dy=seat.y-wy;
  pts.push([seat.x,Math.abs(dy)<.7?wy:seat.y-Math.sign(dy)*.65]);
  return pts;
}
// 今いる場所から厨房前の通路へ戻る道順
function backPts(w){
  const R=w.route||[],n=w.path.length;
  if(n>R.length)return w.path.slice(0,n-R.length);
  return R.slice(0,R.length-n).reverse();
}
function startPick(w){
  const ready=orders.filter(x=>x.st==='ready'&&!x.carrier&&!x.dead);
  if(!ready.length)return false;
  const jobs=ready.slice(0,w.s.serve>=70?3:2);
  jobs.forEach(o=>o.carrier=w);
  w.jobs=jobs;w.st='pick';w.route=[];w.back=true;
  const xs=jobs.map(o=>o.px).sort((a,b)=>Math.abs(a-w.x)-Math.abs(b-w.x));
  w.path=[[w.x,4.15],...xs.map(x=>[x,4.15])];
  return true;
}
function nextDelivery(w,fromBack){
  w.jobs=(w.jobs||[]).filter(o=>{if(o.dead){o.carrier=null;return false;}return true;});
  if(!w.jobs.length){w.route=[];w.path=fromBack.concat([[w.home[0],w.home[1]]]);w.st='back';return;}
  w.route=hallRoute(w.jobs[0].cust.seat);
  w.path=fromBack.concat(w.route);w.st='deliver';
}
function updateHall(dt){
  for(const w of Object.values(workers)){
    if(w.s.role!=='hall')continue;
    switch(w.st){
      case 'idle':
        step(w,dt);
        if(!w.path.length){w.back=false;startPick(w);}
        break;
      case 'pick':
        if(step(w,dt)){
          w.jobs.forEach(o=>{if(!o.dead)o.st='carry';});
          nextDelivery(w,[]);
        }
        break;
      case 'deliver':{
        const o=w.jobs[0];
        if(o.dead){w.jobs.shift();o.carrier=null;nextDelivery(w,backPts(w));break;}
        if(step(w,dt)){
          const c=o.cust;o.serve=w.s.serve;o.st='served';
          c.st='eat';c.t=rnd(18,30);c.bubble=null;
          w.jobs.shift();nextDelivery(w,backPts(w));
        }
        break;}
      case 'back':
        if(w.y<4.7&&startPick(w))break;
        if(step(w,dt)){w.st='idle';w.back=false;}
        break;
    }
  }
}
function sim(dt){
  S.time+=dt;
  if(S.phase==='open'){
    if(S.time>=CLOSE){S.phase='closing';toast('🌙 閉店時間です。最後のお客さんを見送ろう');}
    else if(Math.random()<custRate()/60*dt)spawnCustomer();
  }
  updateCustomers(dt);updateChefs(dt);updateHall(dt);
  orders=orders.filter(o=>o.st!=='served'&&o.st!=='x'&&!(o.dead&&!o.carrier&&o.st!=='cook'));
  if(S.phase==='closing'){
    const inside=customers.some(c=>c.st!=='street'&&c.st!=='away'&&!(c.st==='leave'&&c.y>H));
    if(!inside||S.time>CLOSE+90){
      customers.forEach(c=>{if(c.st!=='away'&&c.st!=='leave'){freeSeat(c);if(c.order)c.order.dead=true;c.st='leave';if(c.seat)leaveRoute(c);else goAway(c);}});
      endDay();
    }
  }
}
function ambient(dt){
  for(const p of passers){step(p,dt);if(!p.path.length)p.dead=true;}
  passers=passers.filter(p=>!p.dead);
  if(passers.length<5&&Math.random()<dt*.04){
    const l=Math.random()<.5;
    passers.push({x:l?-7:22,y:STREET_Y+rnd(-.15,.25),spd:.2+rnd(0,.06),path:[[l?22:-7,STREET_Y+rnd(-.15,.25)]],look:randLook(),walkT:0});
  }
  for(const c of cars){c.x+=c.v*dt;}
  cars=cars.filter(c=>c.x>-14&&c.x<30);
  if(cars.length<2&&Math.random()<dt*.012){
    const r=Math.random()<.5;
    cars.push({x:r?-13:29,y:r?H+3:H+4.5,v:r?.9:-.9,col:pick(['#e5534b','#4f8fdd','#f2c14e','#ffffff','#46b36b'])});
  }
  // 営業時間外でも店外のお客は歩き続ける
  if(S.phase==='prep'||S.phase==='summary'){
    for(const c of customers){if(c.bubble){c.bubble.t-=dt;if(c.bubble.t<=0)c.bubble=null;}step(c,dt);if(!c.path.length)c.dead=true;}
    customers=customers.filter(c=>!c.dead);
  }
}

function openShop(){
  if(S.phase!=='prep')return;
  if(!offered().length){toast('提供中のメニューがありません！');return;}
  S.phase='open';S.time=OPEN;S.day=freshDay();S.boost=1;
  closeModal();
  const ev=todayEvent();
  if(ev)toast(`${ev.icon} 今週は「${ev.name}」！`);

  if(r<.07&&overall()>=65){S.boost=1.6;toast('📺 テレビの取材が来た！今日はお客さんが増えそう！');}
  else if(r<.15){S.fame+=.3;toast('🗣️ 常連さんがお店の評判を広めてくれた！');}
  if(S.speed===0)setSpeed(1);
}
function endDay(){
  S.phase='summary';
  const labor=S.staff.reduce((a,s)=>a+s.salary,0);
  S.money-=labor;S.day.labor=labor;
  S.rep.clean=Math.min(100,S.rep.clean+10+S.equip.plants*1.5);
  const msgs=[];const ev=todayEvent();
  if(ev&&ev.type==='press'){
    if(overall()>=70){S.fame+=3;msgs.push('📰 グルメ雑誌に大きく掲載された！知名度が大幅アップ！');}

  }
  const profit=S.day.sales-S.day.mat-labor;
  S.history.push({label:`${S.month}/${S.week}`,sales:S.day.sales,profit,cust:S.day.customers});
  if(S.history.length>16)S.history.shift();
  let rent=0,rank=0;

    rent=RENT;S.money-=rent;rank=myRank(true);S.lastRank=rank;
    if(rank===1){S.fame+=1;msgs.push('👑 月間売上ランキング1位！知名度アップ！');}

function poly(pts,fill,stroke){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function strip(y1,y2,col,x1=-14,x2=W+16){poly([iso(x1,y1),iso(x2,y1),iso(x2,y2),iso(x1,y2)],col);}
function tile(x,y,w,d,col,stroke){poly([iso(x,y),iso(x+w,y),iso(x+w,y+d),iso(x,y+d)],col,stroke);}
const OL='rgba(50,30,15,.35)';
function isoBox(x,y,w,d,h,top,left,right,lift=0){
  const a=iso(x,y),b=iso(x+w,y),c=iso(x+w,y+d),e=iso(x,y+d);
  const L=lift,T=lift+h;
  poly([[e[0],e[1]-L],[c[0],c[1]-L],[c[0],c[1]-T],[e[0],e[1]-T]],left,OL);
  poly([[b[0],b[1]-L],[c[0],c[1]-L],[c[0],c[1]-T],[b[0],b[1]-T]],right,OL);
  poly([[a[0],a[1]-T],[b[0],b[1]-T],[c[0],c[1]-T],[e[0],e[1]-T]],top,OL);
}
function wq(ax,ay,bx,by,h0,h1,fill,stroke){
  const a=iso(ax,ay),b=iso(bx,by);
  poly([[a[0],a[1]-h0],[b[0],b[1]-h0],[b[0],b[1]-h1],[a[0],a[1]-h1]],fill,stroke);
}

function drawPerson(e){

  const fr=e.moving?Math.floor(e.walkT*.7)%2:0;
  const chef=L.kind==='chef',hall=L.kind==='hall';
  const shirt=chef?'#ffffff':hall?'#f7f7f7':L.shirt;
  const pants=chef?'#3a3a3a':hall?'#222':L.pants;
  if(!sit){
    r(-3,-4,2,fr?3:4,pants);r(1,-4,2,fr?4:3,pants);

  if(S.equip.sign>=1)add(W+1+9.8,()=>{const[a,b]=iso(W+1.1,9.8);ctx.fillStyle='#5a3418';ctx.fillRect(a-2,b-60,4,60);ctx.fillStyle='#ffce3c';ctx.fillRect(a-20,b-82,40,26);ctx.strokeStyle='#8a5a00';ctx.lineWidth=2;ctx.strokeRect(a-20,b-82,40,26);emoji('🍚',a,b-69,16);});
  // 車
  cars.forEach(c=>add(c.x+c.y+3,()=>{isoBox(c.x-1,c.y-.45,2,.9,12,c.col,'#555','#444',4);isoBox(c.x-.5,c.y-.4,1.1,.8,10,'#cfe8f7','#8fb8d0','#7aa3bb',16);}));
  // 人
  const ppl=[...passers,...customers,...Object.values(workers)];
  ppl.forEach(e=>add(e.x+e.y+(e.sitting?.05:0),()=>{
    if(e.s&&e.s.role==='hall')e.carry=(e.st==='deliver'&&e.jobs&&e.jobs.length)?D[e.jobs[0].dish].icon+(e.jobs.length>1?'':''):null;
    drawPerson(e.s?{...e,look:e.s.look}:e);
  }));
  objs.sort((a,b)=>a.k-b.k).forEach(o=>o.f());

  // 吹き出し
  for(const c of customers){if(c.bubble){const[a,b]=iso(c.x,c.y);drawBubble(a,b-(c.sitting?50:42),c.bubble.txt);}}
  for(const w of Object.values(workers)){
    let txt=w.bubble&&w.bubble.txt;
    if(w.s.role==='chef'&&w.task&&!txt)txt=D[w.task.dish].icon;
    if(txt){const[a,b]=iso(w.x,w.y);drawBubble(a,b-52,txt);}
  }
  // お金の数字
  floats.forEach(f=>{ctx.font='bold 15px "M PLUS Rounded 1c",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#3a2a10';
    ctx.globalAlpha=clamp(f.t,0,1);ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;});
  // 時間帯の色
  const eve=clamp((S.time-1020)/120,0,1);
  if(eve>0){ctx.fillStyle=`rgba(255,140,60,${.12*eve*(1-night)})`;ctx.fillRect(0,0,CW,CH);}
  if(night>0){ctx.fillStyle=`rgba(20,30,80,${.28*night})`;ctx.fillRect(0,0,CW,CH);}
  // 雨
  if(S.weather==='rain'){
    ctx.fillStyle='rgba(40,60,90,.12)';ctx.fillRect(0,0,CW,CH);
    ctx.strokeStyle='rgba(200,220,255,.55)';ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<110;i++){const x=(i*71.3+t*80)%CW,y=(i*53.7+t*520)%CH;ctx.moveTo(x,y);ctx.lineTo(x-4,y+12);}
    ctx.stroke();
  }else if(S.weather==='cloud'){ctx.fillStyle='rgba(90,100,120,.08)';ctx.fillRect(0,0,CW,CH);}
  if(S.phase==='prep'){ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(0,0,CW,CH);}
}

const el=id=>document.getElementById(id);
function timeStr(t){const h=Math.floor(t/60)%24,m=Math.floor(t%60/10)*10;return (h<12?'AM ':'PM ')+(h<=12?h:h-12)+':'+String(m).padStart(2,'0');}
function setBar(id,v){el(id).style.width=clamp(v,0,100)+'%';}
function nextEventText(){
  let m=S.month,w=S.week;
  for(let i=0;i<48;i++){
    const e=EVENTS.find(e=>e.m===m&&e.w===w);
    if(e)return (i===0?'今週！ ':'')+`${e.icon} ${m}月${w}週 ${e.name}`;
    w++;if(w>4){w=1;m=m%12+1;}
  }
  return '-';
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

el('mBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'open':openShop();return;
    case 'next':nextWeek();return;
    case 'goto':openModal(b.dataset.to);return;
    case 'tab':modalTab=b.dataset.t;break;
    case 'ad':S.money-=15000;S.ad=1;toast('📄 チラシを配った！');break;
    case 'clean':S.money-=10000;S.rep.clean=100;toast('🧹 お店がピカピカになった！');break;
    case 'rename':{const n=prompt('新しい店名（10文字まで）',S.shop);if(n&&n.trim())S.shop=n.trim().slice(0,10);break;}
    case 'train':{const s=S.staff.find(x=>x.id===id);const c=8000*s.lv;if(S.money<c)break;S.money-=c;s.lv++;
      if(s.role==='chef')s.cook=Math.min(100,s.cook+ri(6,10));else s.serve=Math.min(100,s.serve+ri(6,10));
      s.speed=Math.min(100,s.speed+ri(3,6));s.salary=salaryOf(s);toast(`📚 ${s.name}の研修が完了！`);break;}
    case 'fire':{const s=S.staff.find(x=>x.id===id);
      if(S.staff.filter(x=>x.role===s.role).length<=1){toast(`${s.role==='chef'?'料理人':'ホール'}が1人もいなくなってしまいます！`);break;}
      if(!confirm(`${s.name}を解雇しますか？`))break;
      S.staff=S.staff.filter(x=>x!==s);syncWorkers(false);toast(`${s.name}が退職しました`);break;}
    case 'hire':{const s=S.candidates.find(x=>x.id===id);
      if(S.staff.filter(x=>x.role===s.role).length>=maxRole()){toast('これ以上その役割のスタッフは雇えません（店Lvを上げよう）');break;}
      S.money-=s.salary*3;S.staff.push(s);S.candidates=S.candidates.filter(x=>x!==s);syncWorkers(false);toast(`🎉 ${s.name}が仲間になった！`);break;}
    case 'price':{const m=S.menu[id];m.price=clamp(m.price+(+b.dataset.v),100,D[id].price*3);break;}
    case 'toggle':{const m=S.menu[id];if(m.on&&offered().length<=1){toast('最低1品は提供しましょう');break;}
      m.on=!m.on;if(!m.on&&S.rec===id)S.rec=offered()[0].id;break;}
    case 'rec':S.rec=id;break;
    case 'dev':{const d=D[id];if(S.money<d.dev)break;S.money-=d.dev;S.menu[id]={on:true,price:d.price,lv:1,sold:0};toast(`${d.icon} 新メニュー「${d.name}」が完成！`);break;}
    case 'equip':{const q=EQUIP.find(x=>x.id===id);const n=S.equip[id],c=q.cost(n);if(n>=q.max()||S.money<c)break;S.money-=c;S.equip[id]++;toast(`${q.icon} ${q.name}を購入した！`);break;}
    case 'speed':setSpeed(+b.dataset.v);break;
    case 'save':save();break;
    case 'load':if(load()){closeModal();toast('📂 ロードしました');}else toast('セーブデータがありません');return;
    case 'reset':if(!confirm('最初から遊びますか？（セーブデータは上書きされます）'))break;
    case 'reset2':S=newState();S.candidates=genCandidates();resetRuntime();save(true);closeModal();toast('新しいお店がオープン！');return;
  }
  renderModal();updateUI();
});
el('mClose').onclick=()=>{if(modalKind==='summary'){nextWeek();return;}if(modalKind==='over')return;closeModal();};
el('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&modalKind!=='summary'&&modalKind!=='over')closeModal();});
document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{if(modalKind==='summary'||modalKind==='over')return;if(b.dataset.m==='staff')modalTab='staff';openModal(b.dataset.m);});
el('openBtn').onclick=openShop;
el('saveBtn').onclick=()=>save();
el('sysBtn').onclick=()=>{if(modalKind!=='summary'&&modalKind!=='over')openModal('sys');};
document.querySelectorAll('#speedBox button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.sp));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!modalKind){e.preventDefault();setSpeed(S.speed?0:1);}});

/* ================= セーブ ================= */
function save(silent){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));if(!silent)toast('💾 セーブしました');}
  catch(e){if(!silent)toast('セーブできませんでした');}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const d=JSON.parse(raw);const base=newState();
    S=Object.assign(base,d);
    S.rep=Object.assign(base.rep,d.rep);S.equip=Object.assign(base.equip,d.equip);
    if(S.phase!=='prep'){S.phase='prep';S.time=OPEN;S.day=freshDay();}
    if(!S.candidates||!S.candidates.length)S.candidates=genCandidates();
    resetRuntime();return true;
  }catch(e){return false;}
}

/* ================= メインループ ================= */
let last=performance.now(),uiT=0;
function loop(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  if(!modalKind&&S.speed>0&&(S.phase==='open'||S.phase==='closing')){
    const g=rdt*MPS*S.speed,n=Math.ceil(g/1.5);
    for(let i=0;i<n&&(S.phase==='open'||S.phase==='closing');i++)sim(g/n);
  }
  ambient(rdt*MPS);
  floats.forEach(f=>{f.t-=rdt;f.y-=rdt*28;});floats=floats.filter(f=>f.t>0);
  draw(now);
  uiT+=rdt;if(uiT>.2){uiT=0;updateUI();}
  requestAnimationFrame(loop);
}
if(!load()){S=newState();S.candidates=genCandidates();resetRuntime();}
for(let i=0;i<3;i++)passers.push({x:rnd(-5,20),y:STREET_Y+rnd(-.15,.25),spd:.2+rnd(0,.05),path:[[Math.random()<.5?-7:22,STREET_Y]],look:randLook(),walkT:0});
updateUI();
requestAnimationFrame(loop);
</script>
<script src="../../playtime.js" defer></script>
