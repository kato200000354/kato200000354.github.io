<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ブロックおとし</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --ink:#f3f1ff; --ink-dim:#b7b0e0; --ink-faint:#7c74a8;
  --bg1:#120b2e; --bg2:#24124f; --bg3:#3b1a6b;
  --panel:rgba(20,12,52,.78); --well:#0b0720; --line:rgba(180,160,255,.18);
  --accent:#ffd23f; --accent2:#ff5fa2;
  --disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --body:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Meiryo',sans-serif;
  --side:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  color:var(--ink); font-family:var(--body); font-weight:500; overflow:hidden;
  background:
    radial-gradient(circle at 15% 10%, rgba(255,95,162,.18), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(80,200,255,.16), transparent 45%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg3));
  background-color:var(--bg1);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

/* header */
.hud{display:flex;align-items:center;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 10px;min-width:0}
.stat small{display:block;font-size:10px;color:var(--ink-dim);letter-spacing:.08em}
.stat b{font-family:var(--disp);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat.score{flex:1}
.stat.score b{font-size:22px;color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:18px;display:grid;place-items:center;flex:none}

/* stage */
.stage{display:grid;grid-template-columns:var(--side) auto var(--side);gap:8px;justify-content:center;align-items:start;min-height:0}
.side{display:flex;flex-direction:column;gap:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px 4px;text-align:center}
.box h3{margin:0 0 2px;font-size:10px;letter-spacing:.12em;color:var(--ink-dim);font-weight:800}
.box canvas{display:block;margin:0 auto}
.combo{font-family:var(--disp);font-size:12px;color:var(--accent2);text-align:center;min-height:1.3em;line-height:1.3}
.wrap{position:relative;border-radius:8px;box-shadow:0 0 0 2px rgba(180,160,255,.35),0 10px 40px rgba(0,0,0,.5);background:var(--well)}
.wrap canvas{display:block;border-radius:8px;touch-action:none}
.pop{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;font-family:var(--disp);
  font-size:26px;line-height:1.2;color:#fff;text-shadow:0 0 12px var(--accent2),0 3px 0 #000;opacity:0}
.pop.show{animation:pop 1.1s ease-out forwards}
.pop .sub{display:block;font-size:14px;color:var(--accent)}
@keyframes pop{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.shake{animation:shake .18s}
@keyframes shake{0%,100%{transform:none}30%{transform:translateY(4px)}60%{transform:translateY(-2px)}}

/* controls */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:56px;border-radius:16px;background:linear-gradient(180deg,rgba(90,70,170,.75),rgba(50,35,110,.85));
  border:1px solid rgba(200,180,255,.3);font-size:22px;font-weight:800;touch-action:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.pad button small{display:block;font-size:10px;font-weight:500;color:var(--ink-dim);margin-top:-2px}
.pad button.on{transform:translateY(2px);box-shadow:none;filter:brightness(1.3)}
.pad .drop{background:linear-gradient(180deg,#ff6fae,#c2306f)}
.pad .rot{background:linear-gradient(180deg,#5c8cff,#3050c8)}
.keys{display:none;text-align:center;font-size:12px;color:var(--ink-dim);padding:4px}
.keys kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-family:inherit;color:var(--ink)}
@media (hover:hover) and (pointer:fine){ .pad{display:none} .keys{display:block} }

/* overlays */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,5,30,.72);backdrop-filter:blur(4px);z-index:10;padding:16px}
.card{width:min(360px,100%);background:linear-gradient(180deg,#2a1866,#170d3d);border:1px solid rgba(200,180,255,.35);border-radius:22px;padding:22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.card h1{font-family:var(--disp);font-weight:400;font-size:34px;margin:0 0 4px;line-height:1.15;
  background:linear-gradient(180deg,#fff 20%,var(--accent) 60%,#ff9a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-family:var(--disp);font-weight:400;font-size:26px;margin:0 0 10px}
.card p{margin:6px 0;color:var(--ink-dim);font-size:13px;line-height:1.6}
.logo{display:flex;justify-content:center;gap:3px;margin:4px 0 12px}
.logo i{width:18px;height:18px;border-radius:4px;box-shadow:inset 0 3px rgba(255,255,255,.4),inset 0 -3px rgba(0,0,0,.25)}
.big{display:block;width:100%;margin-top:14px;padding:14px;border-radius:16px;font-size:18px;font-weight:800;
  background:linear-gradient(180deg,#ffe066,#ffb81f);color:#3a2300;box-shadow:0 4px 0 #b97800}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #b97800}
.sub-btn{display:block;width:100%;margin-top:8px;padding:10px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800}
.best{font-family:var(--disp);color:var(--accent);font-size:15px;margin-top:6px}
.howto{text-align:left;font-size:12.5px;color:var(--ink-dim);background:rgba(0,0,0,.2);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.7}
.howto b{color:var(--ink)}
.result{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.result div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px}
.result small{display:block;font-size:11px;color:var(--ink-dim)}
.result b{font-family:var(--disp);font-weight:400;font-size:20px}
.newrec{color:var(--accent2);font-family:var(--disp);font-size:16px;animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.4}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat score"><small>スコア</small><b id="score">0</b></div>
    <div class="stat"><small>レベル</small><b id="level">1</b></div>
    <div class="stat"><small>ライン</small><b id="lines">0</b></div>
    <button class="iconbtn" id="muteBtn" aria-label="音のオン・オフ">🔊</button>
    <button class="iconbtn" id="pauseBtn" aria-label="一時停止">⏸</button>
  </header>

  <main class="stage" id="stage">
    <div class="side">
      <div class="box"><h3>HOLD</h3><canvas id="holdCv"></canvas></div>
      <div class="combo" id="comboTxt"></div>
    </div>
    <div class="wrap" id="wrap">
      <canvas id="cv"></canvas>
      <div class="pop" id="pop"></div>
    </div>
    <div class="side">
      <div class="box"><h3>NEXT</h3><canvas id="nextCv"></canvas></div>
    </div>
  </main>

  <footer>
    <div class="pad" id="pad">
      <button data-act="hold">⇄<small>ホールド</small></button>
      <button data-act="ccw" class="rot">↺<small>左回転</small></button>
      <button data-act="cw" class="rot">↻<small>右回転</small></button>
      <button data-act="hard" class="drop">⤓<small>ドロップ</small></button>
      <button data-act="left">◀</button>
      <button data-act="soft">▼</button>
      <button data-act="right">▶</button>
      <button data-act="cw" class="rot">↻</button>
    </div>
    <div class="keys">
      <kbd>←</kbd><kbd>→</kbd> 移動　<kbd>↓</kbd> ゆっくり落とす　<kbd>↑</kbd>/<kbd>X</kbd> 右回転　<kbd>Z</kbd> 左回転　<kbd>Space</kbd> 一気に落とす　<kbd>C</kbd> ホールド　<kbd>P</kbd> 一時停止
    </div>
  </footer>
</div>

<div class="ov" id="titleOv">
  <div class="card">
    <div class="logo"><i style="background:#36d6f0"></i><i style="background:#ffd23f"></i><i style="background:#b05cff"></i><i style="background:#4fdc6a"></i><i style="background:#ff4f5e"></i><i style="background:#3f7bff"></i><i style="background:#ff9a2e"></i></div>
    <h1>ブロック<br>おとし</h1>
    <p>落ちてくるブロックを並べて、横一列をそろえて消そう！</p>
    <div class="best" id="bestTitle"></div>
    <button class="big" id="startBtn">スタート</button>
    <div class="howto">
      <b>ボタン</b>でも、<b>盤面を指でなぞって</b>も操作できるよ<br>
      ・タップ → 回転<br>
      ・左右にスライド → 移動<br>
      ・下にスライド → ゆっくり落とす<br>
      ・下にサッとはじく → 一気に落とす<br>
      ・上にはじく → ホールド
    </div>
  </div>
</div>

<div class="ov" id="pauseOv" hidden>
  <div class="card">
    <h2>一時停止</h2>
    <button class="big" id="resumeBtn">つづける</button>
    <button class="sub-btn" id="quitBtn">はじめから</button>
  </div>
</div>

<div class="ov" id="overOv" hidden>
  <div class="card">
    <h2>ゲームオーバー</h2>
    <div class="newrec" id="newRec" hidden>ハイスコア更新！</div>
    <div class="result">
      <div style="grid-column:1/-1"><small>スコア</small><b id="rScore" style="color:var(--accent);font-size:28px">0</b></div>
      <div><small>レベル</small><b id="rLevel">1</b></div>
      <div><small>ライン</small><b id="rLines">0</b></div>
    </div>
    <div class="best" id="bestOver"></div>
    <button class="big" id="retryBtn">もう一回</button>
  </div>
</div>
