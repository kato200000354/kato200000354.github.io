<title>ぴったり等分！フリーナイフ</title>
<meta name="description" content="包丁を指で自由に動かして、ピザやケーキをほにゃらら等分。曲線もジグザグも思いのまま。どれだけきれいに分けられるかを競う3Dゲーム。">
<meta name="theme-color" content="#e9eef7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#e9eef7;--ink:#2e2a3b;--accent:#3d6fd8;--accent-d:#284ea3;--warn:#e8473b;--panel:#fdfdff;--sub:#6b6880}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:'M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;text-align:center;z-index:20}
#title{background:radial-gradient(ellipse at 50% 60%,rgba(233,238,247,.1),rgba(233,238,247,.92) 75%)}
#title h1{margin:0 0 4px;font-size:clamp(38px,12vw,60px);font-weight:900;line-height:1.05;color:var(--accent);text-shadow:0 4px 0 #fff,0 6px 0 rgba(46,42,59,.25)}
#title h1 small{display:block;font-size:.3em;color:var(--ink);text-shadow:none;letter-spacing:.1em;margin-bottom:6px}
#title h1 .tag{display:inline-block;font-size:.42em;background:var(--warn);color:#fff;border-radius:10px;padding:2px 10px;text-shadow:none;vertical-align:middle;margin-top:6px}
#title .lead{font-size:15px;line-height:1.7;margin:10px 0 18px;background:rgba(253,253,255,.9);padding:10px 14px;border-radius:14px}
#title .best{font-size:13px;color:var(--sub);margin-top:12px;min-height:1em}
#title .other{margin-top:8px;font-size:13px;color:var(--sub);font-weight:800}
#title .other a{color:var(--warn)}
.spacer{flex:1;max-height:30vh}
.btn{font-family:inherit;font-weight:900;font-size:20px;border:0;border-radius:999px;padding:14px 34px;background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-d);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn.sub{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfd4e2;font-size:16px;padding:11px 24px}
.btn.sub:active{box-shadow:0 1px 0 #cfd4e2}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:10;pointer-events:none;gap:8px}
.chip{background:rgba(253,253,255,.94);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:0 2px 0 rgba(46,42,59,.18);white-space:nowrap}
#targetBox{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 42px);left:50%;transform:translateX(-50%);text-align:center;z-index:10;pointer-events:none}
#targetN{font-size:34px;font-weight:900;color:var(--accent);text-shadow:0 3px 0 #fff}
#pieceCount{font-size:14px;font-weight:800;background:rgba(253,253,255,.94);border-radius:999px;padding:3px 12px;display:inline-block}
#evTag{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;z-index:10;pointer-events:none;white-space:nowrap}
#tapHint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));font-weight:900;font-size:15px;background:rgba(253,253,255,.94);padding:8px 16px;border-radius:999px;z-index:10;pointer-events:none;animation:blink 1s infinite alternate;white-space:nowrap}
@keyframes blink{from{opacity:1}to{opacity:.5}}
#trail{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#liftBtn{position:fixed;left:12px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:11;border:0;font-family:inherit;color:var(--ink);cursor:pointer;font-size:12px;touch-action:manipulation}
#doneBtn{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:11;font-size:15px;padding:10px 18px}
#pop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;pointer-events:none;z-index:15;white-space:nowrap;text-shadow:0 3px 0 #fff,0 0 12px rgba(255,255,255,.9)}
.popA{animation:popA .9s ease-out forwards}
@keyframes popA{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
#side{position:fixed;left:50%;top:39%;transform:translateX(-50%);font-size:16px;font-weight:800;pointer-events:none;z-index:15;white-space:nowrap;color:#7a1f15;text-shadow:0 2px 0 #fff}
#intro{background:rgba(233,238,247,.72);cursor:pointer}
#intro .food{font-size:18px;font-weight:800;background:#fff;padding:6px 16px;border-radius:999px;box-shadow:0 3px 0 #cfd4e2}
#intro .rnd{font-size:14px;color:var(--sub);font-weight:800;margin-bottom:8px}
#rouletteN{font-size:clamp(64px,24vw,120px);font-weight:900;color:var(--accent);line-height:1.1;margin:14px 0 0;text-shadow:0 5px 0 #fff,0 7px 0 rgba(46,42,59,.25);min-height:1.1em}
#rouletteN.hon{font-size:clamp(34px,11vw,56px)}
#rouletteN.bang{animation:bang .5s ease-out}
@keyframes bang{0%{transform:scale(1.6)}60%{transform:scale(.92)}100%{transform:scale(1)}}
#intro .unit{font-size:30px;font-weight:900;margin-top:-6px}
#evCard{margin-top:16px;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;max-width:320px;font-size:14px;line-height:1.5}
#evCard b{display:block;font-size:18px;color:#ffd166}
#introGo{margin-top:18px;font-weight:900;font-size:18px;animation:blink .8s infinite alternate}
#labels{position:fixed;inset:0;pointer-events:none;z-index:12}
.lbl{position:absolute;transform:translate(-50%,-100%);text-align:center;white-space:nowrap}
.lbl .pct{display:inline-block;background:#fff;border-radius:10px;padding:2px 8px;font-weight:900;font-size:15px;box-shadow:0 2px 0 rgba(46,42,59,.25)}
.lbl .say{display:block;font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:8px;padding:2px 6px;margin-bottom:3px}
.lbl.big .pct{background:#ffd166}
.lbl.small .pct{background:#ffb3a7}
.lbl.eat .pct{background:#c9b8ff}
#result{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--panel);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -6px 20px rgba(46,42,59,.18);text-align:center;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#resScore{font-size:48px;font-weight:900;color:var(--accent);line-height:1}
#resScore small{font-size:18px;color:var(--ink)}
#resComment{font-size:20px;font-weight:900;margin:4px 0 6px}
#resDetail{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:10px}
#final{background:rgba(233,238,247,.95);overflow:auto;justify-content:flex-start;padding-top:max(28px,env(safe-area-inset-top))}
#final h2{margin:6px 0 0;font-size:16px;color:var(--sub)}
#finTotal{font-size:64px;font-weight:900;color:var(--accent);line-height:1.1}
#finTotal small{font-size:20px;color:var(--ink)}
#finRank{font-size:26px;font-weight:900;margin:2px 0 4px}
#finBest{font-size:13px;color:var(--sub);margin-bottom:12px}
#finList{list-style:none;padding:0;margin:0 0 16px;width:100%;max-width:340px}
#finList li{display:flex;justify-content:space-between;background:#fff;border-radius:12px;padding:8px 12px;margin:5px 0;font-size:14px;font-weight:800;gap:8px}
#finList li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>

<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <span class="chip" id="hudRound">1 / 5</span>
  <span class="chip" id="hudFood">ピザ</span>
</div>
<div id="targetBox" hidden>
  <div id="targetN">3等分</div>
  <div id="pieceCount">いま 1ピース</div>
</div>
<div id="evTag" hidden></div>
<div id="tapHint" hidden>指を置いたまま動かすと包丁が切る</div>
<canvas id="trail"></canvas>
<button class="btn sub" id="doneBtn" hidden>これで完成</button>
<button class="chip" id="liftBtn" hidden>刃先：指の真下</button>
<div id="pop"></div>
<div id="side"></div>
<div id="labels"></div>

<div id="title" class="screen">
  <div class="spacer"></div>
  <h1><small>包丁を自由にあやつって ほにゃらら等分</small>ぴったり<br>等分！<br><span class="tag">フリーナイフ</span></h1>
  <div class="lead">包丁はあなたの指について動く。<br>まっすぐも、カーブも、ジグザグも自由。<br><b>切りすぎた分はつまみ食いされる</b>。</div>
  <button class="btn" id="startBtn">包丁を持つ</button>
  <div class="best" id="titleBest"></div>
  <div class="other">ほかの遊び方 → <a href="../pittari-toubun/">回転版</a> ／ <a href="../pittari-toubun-free/">なぞり版</a></div>
</div>

<div id="intro" class="screen" hidden>
  <div class="rnd" id="introRound">ROUND 1</div>
  <div class="food" id="introFood">ピザ</div>
  <div id="rouletteN" class="hon">ほにゃらら</div>
  <div class="unit">等分</div>
  <div id="evCard" hidden></div>
  <div id="introGo" hidden>タップでスタート</div>
</div>

<div id="result" hidden>
  <div id="resScore">0<small>点</small></div>
  <div id="resComment"></div>
  <div id="resDetail"></div>
  <button class="btn" id="nextBtn">つぎへ</button>
</div>

<div id="final" class="screen" hidden>
  <h2>5皿の合計</h2>
  <div id="finTotal">0<small> / 500点</small></div>
  <div id="finRank"></div>
  <div id="finBest"></div>
  <ul id="finList"></ul>
  <div class="row">
    <button class="btn" id="againBtn">もう一回</button>
    <button class="btn sub" id="shareBtn">Xでじまん</button>
  </div>
</div>
