<title>霜月の木</title>
<meta name="description" content="霜月二十日の真夜中、おおトチの木に灯がともる。臆病な五つの子が、提灯ひとつで峠をこえる、しんみり怖い横スクロールホラー。">
<meta name="theme-color" content="#07060c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:"Shippori Mincho","Yu Mincho","YuMincho","Hiragino Mincho ProN",serif;color:#ece8f2}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:14px;pointer-events:none;z-index:5}
.bar{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85;max-width:200px}
.bar span{white-space:nowrap}
.track{flex:1;height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.fill{height:100%;width:100%;background:#ff9a3c}
#cfill{background:#cfc8ee}
#dlg{position:fixed;left:12px;right:12px;top:calc(36px + env(safe-area-inset-top));max-width:560px;margin:0 auto;min-height:76px;background:rgba(6,5,12,.86);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:10px 14px 18px;font-size:16px;line-height:1.75;z-index:8}
#who{font-size:12px;color:#ffb36b;letter-spacing:.1em}
#nx{position:absolute;right:10px;bottom:3px;font-size:11px;opacity:.6;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.1}}
#hint{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;font-size:13px;opacity:0;transition:opacity .6s;pointer-events:none;z-index:6;padding:0 16px;text-shadow:0 0 6px #000,0 0 3px #000}
#hint.show{opacity:.9}
#ctrl{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;z-index:7;pointer-events:none}
#ctrl>div{display:flex;gap:12px;pointer-events:auto}
.btn{width:66px;height:66px;border-radius:50%;border:1.5px solid rgba(255,255,255,.32);background:rgba(16,14,26,.6);color:#eee;font:inherit;font-size:13px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;touch-action:none;padding:0}
.btn.dir{font-size:22px}
.btn.on{background:rgba(255,154,60,.32);border-color:rgba(255,190,120,.7)}
#bB{background:linear-gradient(to top,rgba(207,200,238,.28) var(--b,100%),rgba(16,14,26,.6) var(--b,100%))}
#bB.on{border-color:#cfc8ee}
#act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));padding:10px 20px;border-radius:22px;border:1.5px solid rgba(255,190,120,.7);background:rgba(40,24,10,.75);color:#ffd9ae;font:inherit;font-size:15px;white-space:nowrap;z-index:7;touch-action:none}
#card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;opacity:1;pointer-events:none;transition:opacity .9s;text-align:center;padding:24px;font-size:17px;line-height:2.2;z-index:20}
#card.blk{pointer-events:auto}
.cl{opacity:0;transition:opacity 1.1s}
.cl.show{opacity:1}
.cn{margin-top:22px;font-size:12px;opacity:.5;animation:bl 1.2s infinite}
.big{font-size:26px;letter-spacing:.2em}
#title{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px calc(60px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,rgba(0,0,0,0) 40%,rgba(0,0,0,.75))}
#title h1{position:absolute;top:calc(13vh + env(safe-area-inset-top));left:0;right:0;margin:0;text-align:center;font-weight:700;font-size:44px;letter-spacing:.35em;text-indent:.35em;text-shadow:0 0 18px rgba(0,0,0,.9)}
#title h1 small{display:block;font-size:13px;letter-spacing:.4em;font-weight:500;opacity:.7;margin-top:6px}
.tbtn{font:inherit;font-size:18px;letter-spacing:.3em;text-indent:.3em;color:#ffd9ae;background:rgba(40,24,10,.6);border:1.5px solid rgba(255,190,120,.6);border-radius:30px;padding:12px 44px;margin-bottom:16px}
#tnote{font-size:12px;opacity:.65;text-align:center;line-height:1.9}
#ends{font-size:13px;letter-spacing:.2em;margin-bottom:14px;opacity:.85}
#choice{position:fixed;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px;z-index:9}
.chb{font:inherit;font-size:17px;letter-spacing:.2em;min-width:200px;padding:12px 24px;border-radius:6px;border:1.5px solid rgba(255,190,120,.6);background:rgba(10,8,16,.85);color:#ffe2c2}
#over{position:fixed;inset:0;z-index:18;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-size:16px;line-height:2;text-align:center;padding:24px}
