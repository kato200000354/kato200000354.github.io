<style>
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#07080b;color:#ddd4c0;

  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;cursor:pointer}
  .bar{position:relative;height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(210,195,160,.35);overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#c8443a,#7c1f19)}
  .bar.mp i{background:linear-gradient(#4a78d0,#203c80)}
  .bar.s{height:6px}
  .bar.s i{background:linear-gradient(#e8d9a8,#9c8a5a)}

  #hud{position:fixed;inset:0;pointer-events:none}
  #stat{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));width:min(46vw,230px);
    background:linear-gradient(rgba(10,10,14,.72),rgba(10,10,14,.45));border:1px solid rgba(210,195,160,.25);padding:7px 9px 8px;font-size:12px}

  #lvl{font-size:11px;color:#a79c84;margin-top:5px;display:flex;justify-content:space-between}

    border:1px solid rgba(210,195,160,.3);background:rgba(10,10,14,.55);

    background:rgba(10,10,14,.6);border:1px solid rgba(210,195,160,.35);font-size:20px}
  #area{position:absolute;left:0;right:0;top:24%;text-align:center;font-size:26px;letter-spacing:.4em;color:#e9dfc4;
    text-shadow:0 0 12px #000,0 0 3px #000;opacity:0;transition:opacity 1s}
  #area small{display:block;font-size:12px;letter-spacing:.3em;color:#a79c84;margin-top:6px}
  #log{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(168px + env(safe-area-inset-top));width:min(62vw,340px);font-size:13px;line-height:1.5;text-shadow:0 1px 2px #000,0 0 6px #000}
  #log div{transition:opacity .8s}
  #prompt{position:absolute;left:50%;bottom:calc(36% + env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 14px;font-size:14px;

  #cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(240,228,192,.55)}
  #target{position:absolute;left:50%;top:calc(46px + env(safe-area-inset-top));transform:translateX(-50%);width:min(60vw,300px);text-align:center;font-size:12px;color:#d9ccaa;text-shadow:0 1px 2px #000}
  body.touch #target{top:calc(52px + env(safe-area-inset-top));left:auto;right:calc(10px + env(safe-area-inset-right));transform:none;width:150px}
  #target .bar{height:5px;margin-top:3px}
  #boss{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(70vw,460px);text-align:center;font-size:13px;letter-spacing:.2em;text-shadow:0 1px 3px #000}
  body.touch #boss{bottom:auto;top:calc(232px + env(safe-area-inset-top))}
  #boss .bar{height:7px;margin-top:4px}
  #spellTag{position:absolute;font-size:11px;color:#9fb6e8;text-shadow:0 1px 2px #000}
  body:not(.touch) #spellTag{left:calc(12px + env(safe-area-inset-left));bottom:12px}
  #hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,0,0,.75))}
  #fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1;transition:opacity .45s}
  .pop{position:fixed;font-size:16px;font-weight:bold;color:#ffe3a0;text-shadow:0 0 4px #000,0 1px 2px #000;pointer-events:none;transform:translate(-50%,-50%)}
  .pop.me{color:#ff7a6a}
  .pop.heal{color:#9cf09c}

  /* タッチ操作 */
  #touch{position:fixed;inset:0;touch-action:none}
  #joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);display:none;pointer-events:none}
  #joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(230,220,200,.22)}
  .tb{position:absolute;border-radius:50%;border:1px solid rgba(230,210,170,.4);background:rgba(10,10,14,.45);color:#e4d8bc;
    display:flex;align-items:center;justify-content:center;touch-action:none;font-size:13px}
  .tb.on{background:rgba(230,192,96,.3)}
  .tb.dim{opacity:.45}
  #tAtk{width:84px;height:84px;right:calc(16px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));font-size:16px}
  #tMag{width:60px;height:60px;right:calc(30px + env(safe-area-inset-right));bottom:calc(128px + env(safe-area-inset-bottom))}
  #tAct{width:60px;height:60px;right:calc(114px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom))}
  #tRun{width:50px;height:50px;right:calc(112px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom));font-size:12px}
  #tAtk svg{position:absolute;inset:-4px;width:92px;height:92px;transform:rotate(-90deg)}
  body.touch #spellTag{right:calc(22px + env(safe-area-inset-right));bottom:calc(192px + env(safe-area-inset-bottom));width:76px;text-align:center}

  /* 画面 */
  .scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  #title{background:radial-gradient(ellipse at 50% 60%,rgba(40,50,70,.35),rgba(4,5,8,.92) 70%)}
  #title h1{font-size:clamp(38px,11vw,64px);letter-spacing:.25em;margin-right:-.25em;font-weight:normal;color:#e9dfc4;text-shadow:0 0 24px rgba(160,190,255,.35)}
  #title .sub{font-size:13px;letter-spacing:.5em;color:#8f8670;margin:10px 0 40px}
  .btn{display:block;width:220px;margin:8px auto;padding:12px;background:rgba(14,14,18,.75);border:1px solid rgba(210,195,160,.4);font-size:16px;letter-spacing:.2em}
  .btn:disabled{opacity:.35}
  .btn:not(:disabled):active,.btn:not(:disabled):hover{border-color:#e6c060;color:#fff3cf}
  #title .foot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));font-size:11px;color:#6d6656;line-height:1.7}
  #dead{background:rgba(30,0,0,.55)}
  #dead h2,#ending h2{font-size:30px;letter-spacing:.4em;font-weight:normal;margin-bottom:12px}
  #dead p,#ending p{font-size:14px;color:#b9ad90;margin-bottom:28px;line-height:1.9}
  #ending{background:rgba(230,225,210,.0);transition:background 3s}
  #ending.on{background:rgba(220,214,196,.92);color:#2a2418}
  #ending.on p{color:#4a4232}
  #ending.on .btn{color:#2a2418;background:rgba(255,255,255,.4);border-color:#6d6044}

  /* 会話 */
  #dlg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(94vw,640px);min-height:120px;
    background:rgba(8,8,12,.88);border:1px solid rgba(210,195,160,.45);padding:12px 16px 14px;font-size:15px;line-height:1.75}
  #dlgName{font-size:12px;color:#e6c060;letter-spacing:.15em;margin-bottom:4px}
  #dlgNext{position:absolute;right:12px;bottom:6px;font-size:12px;color:#a79c84;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  #dlgOpts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  #dlgOpts button{padding:8px 18px;background:rgba(30,30,36,.8);border:1px solid rgba(210,195,160,.45)}

  /* メニュー・店 */
  .panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,560px);height:min(86vh,560px);display:flex;flex-direction:column;
    background:rgba(8,8,12,.94);border:1px solid rgba(210,195,160,.45)}
  .tabs{display:flex;border-bottom:1px solid rgba(210,195,160,.3)}
  .tabs button{flex:1;padding:11px 0;background:none;border:none;font-size:14px;color:#a79c84}
  .tabs button.on{color:#f0e4c0;background:rgba(230,192,96,.12)}
  .pbody{flex:1;overflow-y:auto;padding:10px 12px;font-size:14px;touch-action:pan-y}
  .pfoot{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(210,195,160,.3)}
  .pfoot button{flex:1;padding:10px;background:rgba(30,30,36,.8);border:1px solid rgba(210,195,160,.4)}
  .li{display:flex;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid rgba(210,195,160,.12)}
  .li .n{flex:1}
  .li .n small{display:block;font-size:11px;color:#8f8670;margin-top:2px}
  .li .c{color:#a79c84;font-size:13px;min-width:40px;text-align:right}
  .li button{padding:6px 12px;background:rgba(30,30,36,.8);border:1px solid rgba(210,195,160,.4);font-size:13px}
  .li button:disabled{opacity:.35}
  .li.eq .n{color:#e6c060}

  .hd:first-child{margin-top:0}

  #guide .gl{left:4%} #guide .gr{right:4%}
  #guide .gl i,#guide .gr i{display:block;font-style:normal;font-size:34px;opacity:.6}
  #guide .gb{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(240px + env(safe-area-inset-bottom));width:min(90vw,520px);text-align:center;font-size:13px;line-height:1.8;
    background:rgba(8,8,12,.7);border:1px solid rgba(230,192,96,.35);padding:10px 12px}
  #guide .gb b{color:#e6c060;font-weight:normal}
  #guide.pc .gb{bottom:auto;top:50%;transform:translate(-50%,-50%);font-size:15px;line-height:2}
  #lockHint{position:fixed;left:50%;top:16%;transform:translateX(-50%);font-size:13px;color:#d9ccaa;background:rgba(8,8,12,.7);padding:6px 14px;border:1px solid rgba(210,195,160,.3);pointer-events:none}
  @media (max-height:520px){
    #stat{width:200px;padding:5px 8px}
    #log{top:calc(150px + env(safe-area-inset-top))}
    #prompt{bottom:30%}
    #guide .gb{bottom:auto;top:12px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="stat">
    <div class="row"><b>HP</b><div class="bar" id="hpBar"><i id="hpB"></i></div></div>
    <div class="num"><span id="hpT"></span><span id="status"></span></div>
    <div class="row"><b>MP</b><div class="bar mp"><i id="mpB"></i></div></div>
    <div class="num"><span id="mpT"></span><span></span></div>
    <div class="gauges">
      <div class="g"><em>力</em><div class="bar s" id="agBar"><i id="agB"></i></div></div>
      <div class="g"><em>魔</em><div class="bar s" id="mgBar"><i id="mgB"></i></div></div>
    </div>
    <div id="lvl"><span id="lvT"></span><span id="goldT"></span></div>
  </div>
  <div id="compass"><div id="compStrip"></div></div>
  <div id="area"></div>
  <div id="log"></div>
  <div id="target" hidden><span id="tgName"></span><div class="bar"><i id="tgB"></i></div></div>
  <div id="boss" hidden><span id="bossName"></span><div class="bar"><i id="bossB"></i></div></div>
  <div id="prompt" hidden></div>
  <div id="cross"></div>
  <div id="spellTag"></div>
  <button id="menuBtn" aria-label="メニュー">☰</button>
</div>

<div id="touch" hidden>
  <div id="joy"><i></i></div>
  <div class="tb" id="tAtk">攻撃</div>
  <div class="tb" id="tMag">魔法</div>
  <div class="tb dim" id="tAct">調べる</div>
  <div class="tb" id="tRun">走る</div>
</div>

<div id="guide" hidden></div>
<div id="lockHint" hidden>クリックで視点を固定</div>
<div id="hurt"></div>

<div id="dlg" hidden><div id="dlgName"></div><div id="dlgText"></div><div id="dlgOpts"></div><div id="dlgNext">▼</div></div>

<div id="menu" class="panel" hidden>
  <div class="tabs" id="mTabs">
    <button data-t="item" class="on">道具</button><button data-t="equip">装備</button><button data-t="magic">魔法</button><button data-t="map">地図</button><button data-t="stat">状態</button>
  </div>
  <div class="pbody" id="mBody"></div>
  <div class="pfoot"><button id="mTitle">タイトルへ</button><button id="mClose">閉じる</button></div>
</div>

<div id="shop" class="panel" hidden>
  <div class="tabs"><button class="on" style="color:#f0e4c0">よろず屋</button></div>
  <div class="pbody" id="shopBody"></div>
  <div class="pfoot"><span id="shopGold"></span><button id="shopClose">店を出る</button></div>
</div>

<div id="title" class="scr">
  <h1>霧ノ王墓</h1>
  <div class="sub">KIRI NO OUBO</div>
  <button class="btn" id="bNew">はじめから</button>
  <button class="btn" id="bCont">つづきから</button>
  <div class="foot">一人称の剣と魔法のダンジョンRPG<br>スマホは画面の左で移動・右で見回す／PCは WASD とマウス</div>
</div>
<div id="dead" class="scr" hidden>
  <h2>力尽きた</h2>
  <p>霧が、あなたを呑みこんでいく……</p>
  <button class="btn" id="bRetry">最後に祈った灯から</button>
  <button class="btn" id="bDeadTitle">タイトルへ</button>
</div>
<div id="ending" class="scr" hidden>
  <h2>霧は晴れた</h2>
  <p id="endText"></p>
  <button class="btn" id="bEndTitle">タイトルへ</button>
</div>
<div id="fade"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
