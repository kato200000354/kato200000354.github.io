<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3e2c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>こねこ日和</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#ecd9bf;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:#5b4636;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
#room{position:absolute;inset:0;width:100%;height:100%;display:block}
.card{background:rgba(255,255,255,.9);border-radius:24px;box-shadow:0 6px 18px rgba(120,80,40,.16),inset 0 -3px 0 rgba(210,180,150,.28)}
.press{transition:transform .12s}
.press:active{transform:scale(.94)}
.bar{height:12px;border-radius:99px;background:#e7e1da;overflow:hidden}
.bar>i{display:block;height:100%;width:50%;border-radius:inherit;background:linear-gradient(90deg,#2f95ec,#5cc2ff);transition:width .4s}
.badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff5a6e;color:#fff;font-size:13px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.badge.on{display:flex}

/* ---------- 猫 ---------- */
#catWrap{position:absolute;left:50%;bottom:150px;width:460px;height:521px;margin-left:-230px}
#cat{position:absolute;inset:0;width:100%;height:100%;overflow:visible;cursor:pointer;touch-action:none}
.cat .happyEyes,.cat .sleepEyes,.cat .angryEyes,.cat .mouthOpen{display:none}
.cat.happy .eyesOpen,.cat.sleep .eyesOpen,.cat.angry .eyesOpen{display:none}
.cat.happy .happyEyes{display:inline}
.cat.sleep .sleepEyes{display:inline}
.cat.angry .angryEyes{display:inline}
.cat.meow .mouthOpen,.cat.eat .mouthOpen{display:inline}
.cat.sleep .happyEyes,.cat.sleep .angryEyes{display:none}
.cat.live g,.cat.live path{transform-box:view-box}
.cat.live .bodyG{transform-origin:150px 286px;animation:breathe 3.2s ease-in-out infinite}
.cat.live .headG{transform-origin:150px 190px;animation:headIdle 7s ease-in-out infinite}
.cat.live .tailG{transform-origin:200px 262px;animation:tail 2.6s ease-in-out infinite}
.cat.live .eye{transform-box:fill-box;transform-origin:center;transition:transform .08s}
.cat.live.blink .eye{transform:scaleY(.08)}
.cat.live.sleep .bodyG{animation-duration:5s}
.cat.live.sleep .headG{animation:none;transform:translateY(16px) rotate(7deg)}
.cat.live.sleep .tailG{animation-duration:7s}
.cat.live.eat .headG{animation:eat .45s ease-in-out infinite}
.cat.live.pet .headG{animation:none;transform:rotate(-7deg)}
.cat.live.angry .headG{animation:none;transform:rotate(9deg)}
.cat.live.angry .tailG{animation-duration:.5s}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
@keyframes headIdle{0%,100%{transform:rotate(0)}30%{transform:rotate(-2.5deg)}60%{transform:rotate(2deg)}}
@keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(12deg)}}
@keyframes eat{0%,100%{transform:translateY(8px) rotate(2deg)}50%{transform:translateY(20px) rotate(-1deg)}}
#catWrap.pounce #cat{animation:pounce .55s ease-out}
@keyframes pounce{0%{transform:none}25%{transform:translateY(10px) scale(1.05,.9)}55%{transform:translateY(-60px) scale(.95,1.06)}80%{transform:translateY(4px) scale(1.06,.92)}100%{transform:none}}
#catWrap.hop #cat{animation:hop .5s ease-out}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-22px)}}
#bowl{position:absolute;left:-30%;bottom:0;width:31%;pointer-events:none}
#bowl .food{transition:transform 3s linear;transform-origin:50% 100%;transform-box:fill-box}
#bowl.empty .food{transform:scaleY(0)}
#yarn{position:absolute;right:-16%;bottom:-2%;width:19%;pointer-events:none}
#zzz{position:absolute;left:62%;top:4%;font-size:40px;font-weight:800;color:#7a8fc6;display:none;pointer-events:none}
#zzz span{display:inline-block;animation:zz 2.4s ease-in-out infinite;opacity:0}
#zzz span:nth-child(2){animation-delay:.6s;font-size:.8em}
#zzz span:nth-child(3){animation-delay:1.2s;font-size:.6em}
@keyframes zz{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(20px,-40px)}}
.sleeping #zzz{display:block}
#bubble{position:absolute;left:78%;top:4%;min-width:200px;max-width:290px;padding:16px 22px;border-radius:30px;background:#fff;font-size:21px;font-weight:700;line-height:1.5;box-shadow:0 6px 16px rgba(120,80,40,.18);opacity:0;transform:scale(.7);transform-origin:0 100%;transition:opacity .25s,transform .25s;pointer-events:none;white-space:pre-line}
#bubble.on{opacity:1;transform:scale(1)}
#bubble:after{content:"";position:absolute;left:30px;bottom:-14px;border:12px solid transparent;border-top:18px solid #fff;border-bottom:0;transform:skewX(25deg)}
#bubble .hrt{color:#ff6b8a;font-size:24px;display:block;line-height:1}

/* ---------- 部屋の夜 ---------- */
#shade{position:absolute;inset:0;background:#18224e;opacity:0;pointer-events:none;transition:opacity 1.5s}
.sleeping #shade{opacity:.42!important}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;transition:opacity .3s}
#hud>*{pointer-events:auto;position:absolute}
body.mini #hud{opacity:0;pointer-events:none}
body.mini #hud>*{pointer-events:none}

#profile{left:18px;top:18px;width:420px;display:flex;align-items:center}
#profile .avatar{width:112px;height:112px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:0 6px 18px rgba(120,80,40,.2);overflow:hidden;flex:none;z-index:1;position:relative}
.avatar svg{width:100%;height:100%;display:block;background:linear-gradient(#f7ecdc,#ecd9bf)}
#profile .info{margin-left:-34px;padding:14px 22px 14px 48px;flex:1;height:92px;border-radius:0 46px 46px 0}
#pname{font-size:27px;font-weight:800;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
#pgender{font-size:22px;color:#4b9be0}
#pgender.f{color:#f07aa0}
.lvrow{display:flex;align-items:center;gap:8px;margin-top:6px;font-weight:700}
.lvrow .paw{width:30px;height:30px;border-radius:50%;background:#3aa0f0;display:flex;align-items:center;justify-content:center;flex:none}
.lvcol{flex:1}
.lvtxt{display:flex;justify-content:space-between;font-size:17px;margin-bottom:3px}
.lvtxt span:last-child{color:#8c7a6b;font-weight:600}

#money{top:24px;left:calc(50% + 50px);transform:translateX(-50%);display:flex;gap:14px}
.pill{display:flex;align-items:center;height:56px;padding:0 8px 0 6px;border-radius:30px;background:rgba(255,255,255,.88);box-shadow:0 5px 14px rgba(120,80,40,.15)}
.pill svg{width:46px;height:46px;flex:none;margin-left:-14px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.pill b{min-width:84px;text-align:right;font-size:25px;font-weight:800;padding:0 10px}
.plus{width:30px;height:30px;border-radius:50%;background:#8b97a6;color:#fff;font-size:24px;font-weight:800;line-height:30px;text-align:center}

#topIcons{top:18px;right:18px;display:flex;gap:14px}
.ibtn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ibtn svg{width:36px;height:36px}

#todo{left:26px;top:144px;width:340px;padding:16px 20px 12px}
#todo .head{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800;padding-bottom:10px;border-bottom:2px solid #f0e6da;width:100%;text-align:left}
#todo .head svg{width:40px;height:40px;flex:none}
#todo .head .chev{display:none;margin-left:auto;font-size:16px;color:#a59383}
#todoList{list-style:none}
#todoList li{display:flex;align-items:center;gap:12px;padding:11px 2px;font-size:19px;font-weight:700}
#todoList li .pp{font-size:20px;opacity:.55;filter:grayscale(1)}
#todoList li .t{flex:1}
#todoList li small{color:#9a8878;font-size:14px;margin-left:4px}
.chk{width:30px;height:30px;border-radius:50%;border:3px solid #cdbfb2;flex:none;display:flex;align-items:center;justify-content:center}
.chk.on{border:none;background:#5cc26a}
.chk.on:after{content:"";width:13px;height:7px;border-left:4px solid #fff;border-bottom:4px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
#todoBonus{font-size:13px;color:#a08a76;text-align:center;padding-top:4px}

#eventBanner{right:18px;top:100px;width:300px;height:132px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#fdf7ff,#e5f4ff 60%,#fff6d8);border:4px solid #fff;box-shadow:0 6px 18px rgba(120,80,40,.18);text-align:left;padding:12px 16px}
#eventBanner .tag{display:inline-block;background:#9a6ad8;color:#fff;font-size:14px;font-weight:800;padding:3px 10px;border-radius:8px}
#eventBanner .ttl{font-size:23px;font-weight:800;margin-top:6px;color:#4d3a2c;text-shadow:0 0 6px #fff,0 0 6px #fff}
#eventBanner .rest{font-size:15px;font-weight:700;color:#9a8270;margin-top:6px}
#eventBanner .ev-face{position:absolute;right:-6px;bottom:-10px;width:104px;height:104px}
#eventBanner .evbar{position:absolute;left:16px;bottom:10px;width:150px;height:8px}
#eventBanner .ev-face svg{background:none}
#evBadge{top:8px;right:8px}
#eventBanner .evbar i{background:linear-gradient(90deg,#ffb04a,#ff7e6b)}

#side{right:18px;top:252px;display:flex;flex-direction:column;gap:14px}
.sbtn{width:172px;white-space:nowrap;height:66px;border-radius:22px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:19px;font-weight:800;position:relative}
.sbtn .ic{font-size:36px;line-height:1;width:44px;text-align:center}

#moodCard{left:18px;bottom:22px;width:440px;display:flex;align-items:center}
#moodCard .avatar{width:150px;height:150px;border-radius:50%;border:6px solid #fff;box-shadow:0 6px 18px rgba(120,80,40,.2);overflow:hidden;flex:none;z-index:1;position:relative}
#moodCard .info{margin-left:-40px;padding:14px 22px 14px 54px;flex:1;border-radius:0 40px 40px 0}
.moodTop{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.moodTop .face{font-size:28px}
.moodTop .more{margin-left:auto;background:#eee7df;border-radius:14px;padding:2px 12px;font-size:16px;letter-spacing:2px;color:#8b7969}
#moodBar{height:20px;margin:8px 0 10px}
#moodBar i{background:linear-gradient(90deg,#7ad86a,#4fbf63)}
.mini3{display:flex;gap:10px}
.mini3 div{flex:1;font-size:12px;font-weight:700;color:#8b7969}
.mini3 .bar{height:7px;margin-top:3px}
.mini3 .h i{background:linear-gradient(90deg,#ffb04a,#ff8c3a)}
.mini3 .c i{background:linear-gradient(90deg,#7ad0f5,#45b2e8)}
.mini3 .e i{background:linear-gradient(90deg,#c69cf2,#9d6fe0)}
.low{animation:lowblink 1s ease-in-out infinite}
@keyframes lowblink{50%{opacity:.4}}

#actions{bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:14px}
.act{width:124px;height:124px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:19px;font-weight:800;position:relative}
.act svg{width:66px;height:62px}
.act:disabled{opacity:.5}

#petBtn{right:26px;bottom:20px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffd178,#ffb03b 70%,#f39a22);border:7px solid #fff;box-shadow:0 8px 22px rgba(200,110,20,.35);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:26px;color:#fff;font-size:34px;font-weight:900;letter-spacing:.05em;text-shadow:0 2px 0 #e08a12,0 0 6px #e08a12}
#petBtn svg{position:absolute;top:22px;left:50%;width:96px;margin-left:-48px;opacity:.9}
#petBtn span{position:relative}
#petBtn:after{content:"";position:absolute;right:-6px;top:-14px;width:44px;height:30px;background:linear-gradient(#ffe066,#ffe066) 0 100%/8px 20px no-repeat,linear-gradient(#ffe066,#ffe066) 16px 50%/8px 26px no-repeat,linear-gradient(#ffe066,#ffe066) 32px 100%/8px 20px no-repeat;transform:rotate(20deg);opacity:.9}

/* ---------- エフェクト ---------- */
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pt{position:absolute;font-size:34px;font-weight:800;animation:ptUp 1.2s ease-out forwards;white-space:nowrap}
@keyframes ptUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-200%) scale(.9)}}
.pt.txt{font-size:24px;color:#fff;text-shadow:0 2px 0 #e08a12,0 0 6px rgba(0,0,0,.25)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#toast{position:absolute;left:50%;top:110px;transform:translate(-50%,-20px);background:rgba(80,58,40,.92);color:#fff;padding:12px 24px;border-radius:30px;font-size:19px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- ミニゲーム ---------- */
#modeBar{position:absolute;left:50%;top:22px;transform:translate(-50%,-150%);width:min(620px,94%);padding:14px 22px;border-radius:24px;transition:transform .35s;z-index:20;display:flex;flex-direction:column;gap:8px}
body.mini #modeBar{transform:translate(-50%,0)}
#modeBar .row1{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
#modeBar .row1 .sp{flex:1}
#modeBar .bar{height:14px}
#modeBar .bar i{background:linear-gradient(90deg,#ffb04a,#ff7e6b)}
#modeEnd{background:#8b97a6;color:#fff;border-radius:16px;padding:6px 16px;font-size:16px}
#toy{position:absolute;width:120px;height:80px;margin:-40px 0 0 -60px;display:none;z-index:15;transition:left .6s ease-in-out,top .6s ease-in-out;touch-action:none;cursor:pointer}
#toy svg{width:100%;height:100%;transition:transform .2s}
#toy.l svg{transform:scaleX(-1)}
#toy.hit{animation:toyHit .25s}
@keyframes toyHit{50%{transform:scale(1.3) rotate(15deg)}}
#brush{position:absolute;width:110px;height:110px;margin:-20px 0 0 -20px;display:none;pointer-events:none;z-index:16}
body.brushing #brush{display:block}
body.brushing #cat{cursor:none}

#walk{position:absolute;inset:0;display:none;z-index:18;overflow:hidden;background:linear-gradient(#8fd0ff,#d9f2ff 55%,#fff5d8)}
#walk.on{display:block}
#walk .hills{position:absolute;left:0;right:0;bottom:22%;height:30%;background:radial-gradient(ellipse 30% 70% at 15% 100%,#a6dd8f 98%,transparent 100%),radial-gradient(ellipse 35% 80% at 55% 100%,#94d27f 98%,transparent 100%),radial-gradient(ellipse 30% 65% at 92% 100%,#a6dd8f 98%,transparent 100%);background-size:1200px 100%;animation:scroll 30s linear infinite}
#walk .ground{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#7cc46a 0 14%,#e9d3a6 14% 100%)}
#walk .road{position:absolute;left:0;right:0;bottom:9%;height:6px;background:repeating-linear-gradient(90deg,#fff 0 40px,transparent 40px 80px);opacity:.7;animation:scroll 1.2s linear infinite;background-size:80px 100%}
@keyframes scroll{from{background-position:0 0}to{background-position:-1200px 0}}
#walk .road{animation-name:scrollR}
@keyframes scrollR{from{background-position:0 0}to{background-position:-80px 0}}
.deco{position:absolute;font-size:110px;line-height:1;animation:decoMove linear infinite;pointer-events:none}
@keyframes decoMove{from{left:105%}to{left:-25%}}
#walkCat{position:absolute;left:12%;bottom:13%;width:260px;height:182px}
#walkCat .lg1{animation:leg .5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
#walkCat .lg2{animation:leg .5s ease-in-out infinite reverse;transform-box:fill-box;transform-origin:50% 0}
#walkCat .wb{animation:wbob .25s ease-in-out infinite alternate}
#walkCat .wt{transform-box:fill-box;transform-origin:100% 100%;animation:wtail 1s ease-in-out infinite alternate}
@keyframes leg{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes wbob{to{transform:translateY(-3px)}}
@keyframes wtail{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.item{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 40%,rgba(255,255,255,0) 70%);display:flex;align-items:center;justify-content:center;font-size:54px;cursor:pointer;touch-action:none}
.item.r3,.item.r4{background:radial-gradient(circle,#fff 35%,rgba(255,236,140,.8) 50%,rgba(255,236,140,0) 70%);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{filter:brightness(1.15) drop-shadow(0 0 8px #ffe066)}}
.item.got{animation:got .4s ease-out forwards;pointer-events:none}
@keyframes got{to{transform:scale(1.8);opacity:0}}

/* ---------- モーダル ---------- */
#modalBg{position:absolute;inset:0;background:rgba(70,50,30,.38);display:none;align-items:center;justify-content:center;z-index:40}
#modalBg.on{display:flex}
#modal{width:min(720px,92%);max-height:88%;display:flex;flex-direction:column;background:#fffaf3;border-radius:30px;border:5px solid #fff;box-shadow:0 14px 40px rgba(80,50,20,.3);animation:pop .25s ease-out;position:relative}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#modal h2{font-size:26px;font-weight:800;text-align:center;padding:20px 60px 12px;border-bottom:2px dashed #eedfcd}
#modalX{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;background:#efe4d6;font-size:24px;font-weight:800;color:#8b7969}
#modalBody{padding:18px 24px 24px;overflow:auto;touch-action:pan-y;font-size:18px;line-height:1.6}
.mbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 26px;border-radius:20px;background:linear-gradient(#ffc75a,#ffa63a);color:#fff;font-weight:800;font-size:19px;box-shadow:0 4px 0 #e48a1c;text-shadow:0 1px 0 rgba(180,100,0,.5)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e48a1c}
.mbtn.gray{background:linear-gradient(#c3c9d1,#a5adb8);box-shadow:0 4px 0 #858d98;text-shadow:none}
.mbtn.blue{background:linear-gradient(#6cc4ff,#3a9cf0);box-shadow:0 4px 0 #2a7cc8}
.mbtn.pink{background:linear-gradient(#ff9ab8,#f56d95);box-shadow:0 4px 0 #d24c75}
.mbtn:disabled{filter:grayscale(1);opacity:.6}
.center{text-align:center}
.grid{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:20px;background:#fff;box-shadow:0 3px 10px rgba(120,80,40,.1);text-align:left;width:100%}
.opt .big{font-size:42px;width:56px;text-align:center;flex:none}
.opt .tx{flex:1}
.opt .tx b{display:block;font-size:20px}
.opt .tx small{color:#9a8878;font-size:15px}
.price{font-weight:800;font-size:17px;white-space:nowrap}
.dex{grid-template-columns:repeat(4,1fr)}
.dexc{background:#fff;border-radius:18px;padding:10px 4px;text-align:center;box-shadow:0 3px 10px rgba(120,80,40,.1)}
.dexc .e{font-size:44px;line-height:1.2}
.dexc .n{font-size:13px;font-weight:700}
.dexc .s{font-size:11px;color:#f0a020;letter-spacing:-1px}
.dexc.no .e{filter:brightness(0) opacity(.18)}
.dexc.no .n{color:#bbb}
.album{grid-template-columns:repeat(3,1fr)}
.photo{border-radius:16px;overflow:hidden;background:#fff;padding:6px 6px 4px;box-shadow:0 3px 10px rgba(120,80,40,.15);cursor:pointer}
.photo .pic{aspect-ratio:1;border-radius:10px;overflow:hidden}
.photo .pic svg{width:100%;height:100%;display:block}
.photo .cap{font-size:12px;text-align:center;padding-top:3px;color:#8b7969;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dress{display:flex;gap:18px}
.dress .pv{width:240px;flex:none;border-radius:24px;background:linear-gradient(#f7ecdc,#ecd9bf);aspect-ratio:300/340;align-self:flex-start;position:sticky;top:0}
.dress .pv svg{width:100%;height:100%}
.dress .lst{flex:1;display:grid;gap:10px}
.opt.eq{outline:4px solid #5cc26a}
.cal{grid-template-columns:repeat(7,1fr);gap:8px}
.cal div{background:#fff;border-radius:14px;padding:8px 2px;text-align:center;font-size:13px;font-weight:700;box-shadow:0 3px 8px rgba(120,80,40,.1);position:relative}
.cal div .e{font-size:26px;display:block}
.cal div.done{opacity:.45}
.cal div.done:after{content:"✔";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:#5cc26a;opacity:1}
.cal div.today{outline:4px solid #ffb03b}
.stat{display:flex;align-items:center;gap:12px;margin:8px 0;font-weight:700}
.stat span{width:96px}
.stat .bar{flex:1;height:16px}

function faceSvg(){return `<svg viewBox="52 -16 196 196" class="cat">${catMarkup(S.eq)}</svg>`}
function renderCatAll(){
  catSvg.innerHTML=catMarkup(S.eq);
  ['#avatar1','#avatar2','#avatar3'].forEach(s=>$(s).innerHTML=faceSvg());
  $('#walkAcc').innerHTML=S.eq.head?`<g transform="translate(210 12) scale(.42) translate(-150 0)">${ACC_SVG[S.eq.head]}</g>`:'';
  updDirt();
}
function updDirt(){const o=clamp((55-S.st.clean)/45,0,1);catSvg.querySelectorAll('.dirt').forEach(d=>d.setAttribute('opacity',o.toFixed(2)))}
function catCls(c,on,ms){catSvg.classList.toggle(c,on);if(ms)setTimeout(()=>catSvg.classList.remove(c),ms)}

/* 目線 */
let lookT=null,lastPointer=0;
function lookAt(lx,ly){const r=headCenter();const dx=lx-r.x,dy=ly-r.y;const L=Math.hypot(dx,dy)||1;const m=Math.min(4.5,L/40);
  catSvg.querySelectorAll('.iris').forEach(i=>i.setAttribute('transform',`translate(${(dx/L*m).toFixed(2)} ${(dy/L*m).toFixed(2)})`))}
function headCenter(){return{x:catWrap.offsetLeft+catWrap.offsetWidth*.5,y:catWrap.offsetTop+catWrap.offsetHeight*(158/340)}}
function toLogical(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/SCALE,y:(e.clientY-r.top)/SCALE}}
stage.addEventListener('pointermove',e=>{const p=toLogical(e);lastPointer=Date.now();if(!playing)lookAt(p.x,p.y);if(brushing)brushMove(e,p)});
setInterval(()=>{if(Date.now()-lastPointer>2500&&!playing){const W=stage.offsetWidth,H=stage.offsetHeight;lookAt(rnd(0,W),rnd(H*.2,H*.8))}},2600);
(function blinkLoop(){setTimeout(()=>{if(!S.sleeping){catSvg.classList.add('blink');setTimeout(()=>catSvg.classList.remove('blink'),130)}blinkLoop()},rnd(2200,5200))})();

/* ================= レイアウト ================= */
function layout(){const w=innerWidth,h=innerHeight;PORT=w/h<.9;const b=PORT?[430,860]:[1400,860];SCALE=Math.min(w/b[0],h/b[1]);
  stage.style.width=w/SCALE+'px';stage.style.height=h/SCALE+'px';stage.style.transform=`scale(${SCALE})`;document.body.classList.toggle('port',PORT)}
addEventListener('resize',layout);layout();

/* ================= 共通UI ================= */
let toastQ=[],toastOn=false;
function toast(t){toastQ.push(t);if(!toastOn)nextToast()}
function nextToast(){const t=toastQ.shift();const el=$('#toast');if(!t){toastOn=false;return}toastOn=true;el.textContent=t;el.classList.add('on');setTimeout(()=>{el.classList.remove('on');setTimeout(nextToast,300)},1900)}
function fx(x,y,ch,cls='',dx=0){const s=document.createElement('span');s.className='pt '+cls;s.textContent=ch;s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',dx+'px');$('#fx').appendChild(s);setTimeout(()=>s.remove(),1250)}
function hearts(n=3,ch='❤️'){const c=headCenter();for(let i=0;i<n;i++)setTimeout(()=>fx(c.x+rnd(-90,90),c.y+rnd(-80,10),ch,'',rnd(-30,30)),i*90)}
function gainFx(txt){const c=headCenter();fx(c.x+rnd(-40,40),c.y-120,txt,'txt')}
let bubT=null;
function say(t,ms=3800,heart=true){const b=$('#bubble');b.innerHTML=(heart?'<span class="hrt">♥</span>':'')+t.replace(/</g,'&lt;');b.classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove('on'),ms)}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalBg').classList.add('on');$('#modalBody').scrollTop=0;blip(660);return $('#modalBody')}
function closeModal(){$('#modalBg').classList.remove('on');if(modalOnClose){const f=modalOnClose;modalOnClose=null;f()}}
let modalOnClose=null;
$('#modalX').onclick=closeModal;
$('#modalBg').addEventListener('pointerdown',e=>{if(e.target.id==='modalBg')closeModal()});
const fmt=n=>Math.floor(n).toLocaleString();
function give(r,src){const parts=[];if(r.coins){S.coins+=r.coins;parts.push('コイン×'+r.coins)}if(r.fish){S.fish+=r.fish;parts.push('にぼし×'+r.fish)}if(r.gems){S.gems+=r.gems;parts.push('ジュエル×'+r.gems)}
  if(r.acc){if(S.owned.includes(r.acc)){S.gems+=30;parts.push('ジュエル×30（'+ACC[r.acc].n+'は持っているので）')}else{S.owned.push(r.acc);parts.push(ACC[r.acc].n)}}
  renderTop();save();return parts.join('・')}

/* ================= ステータス ================= */
const need=l=>100+50*(l-1);
function addXP(n){S.xp+=n;let up=false;while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;up=true}renderTop();if(up)levelUp()}
function levelUp(){const r={coins:50*S.level,gems:5};const t=give(r);chime();meow(1.1);
  setTimeout(()=>{takePhoto(`Lv.${S.level} になった日`,true);openModal('レベルアップ！',`<div class="center"><div class="lvup">Lv.${S.level}</div><p>${esc(S.name)}がもっとなかよくなった！</p><p style="margin:10px 0 16px;font-weight:800">🎁 ${t}</p><button class="mbtn" id="okBtn">やったー！</button><p style="font-size:13px;color:#a08a76;margin-top:10px">記念写真をアルバムに保存しました</p></div>`);$('#okBtn').onclick=closeModal},500)}
function addSt(o){for(const k in o)S.st[k]=clamp(S.st[k]+o[k]);renderStats()}
function moodInfo(){const m=S.st.mood;if(S.sleeping)return['😴','おやすみ中'];if(m>=75)return['😊','ごきげん'];if(m>=50)return['🙂','ふつう'];if(m>=25)return['😿','ちょっとさみしい'];return['😾','ごきげんななめ']}
function setBar(id,v){const el=$(id);el.firstElementChild.style.width=v+'%';el.classList.toggle('low',v<25)}
function renderStats(){setBar('#moodBar',S.st.mood);setBar('#hBar',S.st.hunger);setBar('#cBar',S.st.clean);setBar('#eBar',S.st.energy);
  const [f,l]=moodInfo();$('#moodFace').textContent=f;$('#moodLabel').textContent=l;updDirt()}
function renderTop(){$('#pnameTxt').textContent=S.name;const g=$('#pgender');g.textContent=S.gender==='m'?'♂':'♀';g.classList.toggle('f',S.gender!=='m');
  $('#lvTxt').textContent='Lv. '+S.level;$('#xpTxt').textContent=S.xp+' / '+need(S.level);$('#xpBar').firstElementChild.style.width=(S.xp/need(S.level)*100)+'%';
  $('#fishTxt').textContent=fmt(S.fish);$('#coinTxt').textContent=fmt(S.coins);$('#gemTxt').textContent=fmt(S.gems);renderBadges()}
function renderBadges(){const m=S.mail.filter(x=>!x.c).length;const mb=$('#mailBadge');mb.textContent=m;mb.classList.toggle('on',m>0);
  $('#presentBadge').classList.toggle('on',S.login.last!==today());$('#evBadge').classList.toggle('on',S.st.energy>=20&&S.ev.pts<EV_MILES[2].pts&&!S.sleeping&&S.tot.walk===0)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= 今日のやること ================= */
function checkDaily(){if(S.daily.date===today())return;const pool=['play','pet','brush','walk','photo','treat'].sort(()=>Math.random()-.5);
  S.daily={date:today(),tasks:['feed',pool[0],pool[1]].map(id=>({id,p:0,done:false})),bonus:false};save()}
function task(id,n=1){checkDaily();const t=S.daily.tasks.find(x=>x.id===id);if(!t||t.done)return;t.p=Math.min(TASKS[id].g,t.p+n);
  if(t.p>=TASKS[id].g){t.done=true;give({coins:50});addXP(15);toast(`✅ 「${TASKS[id].l}」たっせい！ コイン+50`);chime();
    if(S.daily.tasks.every(x=>x.done)&&!S.daily.bonus){S.daily.bonus=true;give({gems:5});setTimeout(()=>toast('🎉 ぜんぶできた！ ジュエル+5'),400)}}
  renderTodo();save()}
function renderTodo(){checkDaily();const ul=$('#todoList');ul.innerHTML=S.daily.tasks.map(t=>{const d=TASKS[t.id];
  return `<li><span class="pp">🐾</span><span class="t">${d.l}${d.g>1&&!t.done?`<small>${t.p}/${d.g}</small>`:''}</span><span class="chk ${t.done?'on':''}"></span></li>`}).join('');
  const n=S.daily.tasks.filter(t=>t.done).length;$('#todoCnt').textContent=n+'/3';
  $('#todoBonus').textContent=S.daily.bonus?'今日はぜんぶできたね！':'ぜんぶできたらジュエル×5'}
$('#todoHead').onclick=()=>{if(PORT)$('#todo').classList.toggle('open')};

/* ================= セリフ ================= */
function idleLine(){const st=S.st;
  if(S.sleeping)return pick(['すや…すや…','むにゃ…おさかな…','zzz…']);
  if(st.hunger<25)return pick(['おなかすいたにゃ…','ごはんまだかにゃ？']);
  if(st.energy<20)return pick(['ねむいにゃ…','ちょっとおやすみしたいにゃ']);
  if(st.clean<25)return 'からだがムズムズするにゃ\nブラッシングしてほしいにゃ';
  if(st.mood<30)return pick(['かまってほしいにゃ…','さみしいにゃ…']);
  const h=new Date().getHours();
  const l=['にゃー\nあそぼうかにゃ？','なでてほしいにゃ','ごろごろ…','きょうも一緒でうれしいにゃ','あの毛糸、気になるにゃ',`${S.name}だにゃ！`,'おさんぽ行きたいにゃ～','まどの外、いい景色だにゃ'];
  if(h>=5&&h<10)l.push('おはようにゃ！');if(h>=18||h<4)l.push('こんばんにゃ','夜はちょっとワクワクするにゃ');
  return pick(l)}
setInterval(()=>{if(!busy&&!$('#modalBg').classList.contains('on')&&Math.random()<.6){say(idleLine());if(!S.sleeping&&Math.random()<.3)meow()}},11000);

/* ================= なでる ================= */
let petTimes=[],annoyedUntil=0;
function pet(x,y){if(busy)return;const now=Date.now();
  if(S.sleeping){say('むにゃ…',1500,false);return}
  if(now<annoyedUntil){say('しつこいにゃ！',1500,false);return}
  petTimes=petTimes.filter(t=>now-t<8000);petTimes.push(now);
  if(petTimes.length>14){annoyedUntil=now+4000;petTimes=[];catCls('angry',true,2500);catSvg.classList.remove('happy','pet');say('もう！しつこいにゃ！',2500,false);meow(1.3);addSt({mood:-3});return}
  catSvg.classList.add('happy','pet');clearTimeout(pet.t);pet.t=setTimeout(()=>catSvg.classList.remove('happy','pet'),900);
  if(x!=null)fx(x,y,'❤️','',rnd(-20,20));else hearts(2);
  addSt({mood:4});S.tot.pet++;if(S.tot.pet%3===0)addXP(2);task('pet');
  if(Math.random()<.25){say(pick(['ごろごろ…','きもちいいにゃ～','もっとなでてにゃ','そこそこ！']),2200);meow(1.05)}else blip(rnd(700,900),.06,'sine',.06)}
$('#petBtn').onclick=()=>pet();
catSvg.addEventListener('pointerdown',e=>{if(brushing){brushDown=true;return}if(playing||busy)return;const p=toLogical(e);pet(p.x,p.y)});

/* ================= ごはん ================= */
let busy=false;
function blockMsg(){if(S.sleeping){toast('いまはおやすみ中だよ（「おこす」で起こせます）');return true}if(busy)return true;return false}
$('#feedBtn').onclick=()=>{if(blockMsg())return;
  const b=openModal('ごはんをえらぶ',`<div class="grid">
   <button class="opt press" data-f="0"><span class="big">🥣</span><span class="tx"><b>カリカリ</b><small>おなか+30・ごきげん+3</small></span><span class="price">むりょう</span></button>
   <button class="opt press" data-f="1"><span class="big">🥫</span><span class="tx"><b>とくせいねこ缶</b><small>おなか+50・ごきげん+12</small></span><span class="price">🪙 30</span></button>
   <button class="opt press" data-f="2"><span class="big">🐟</span><span class="tx"><b>にぼし</b><small>おなか+12・ごきげん+20（大好物！）</small></span><span class="price">にぼし 1</span></button></div>`);
  b.querySelectorAll('[data-f]').forEach(el=>el.onclick=()=>feed(+el.dataset.f))};
function feed(i){const F=[{h:30,m:3,x:8},{h:50,m:12,x:12,c:30},{h:12,m:20,x:10,f:1}][i];
  if(S.st.hunger>=95&&i!==2){closeModal();say('おなかいっぱいだにゃ～',2500);return}
  if(F.c&&S.coins<F.c){toast('コインがたりないよ');return}if(F.f&&S.fish<F.f){toast('にぼしがないよ（＋からこうかんできます）');return}
  if(F.c)S.coins-=F.c;if(F.f)S.fish-=F.f;closeModal();busy=true;
  const bowl=$('#bowl');bowl.classList.remove('empty');meow(1.1);say(i===2?'にぼしだにゃ！！':'ごはんだにゃ！',1500);
  setTimeout(()=>{catCls('eat',true);bowl.classList.add('empty');say('もぐもぐ…',2600,false)},700);
  setTimeout(()=>{catCls('eat',false);catCls('happy',true,1500);hearts(3);addSt({hunger:F.h,mood:F.m});addXP(F.x);gainFx('おなか +'+F.h);
    S.tot.feed++;task('feed');if(i===2)task('treat');say(pick(['おいしかったにゃ～','ごちそうさまにゃ！','しあわせだにゃ']),2500);busy=false;renderTop();save()},3600)}

/* ================= おもちゃ（ミニゲーム） ================= */
let playing=false,playHits=0,playT0=0,toyTimer=null,playRaf=null;
const PLAY_SEC=12;
$('#playBtn').onclick=()=>{if(blockMsg())return;if(S.st.energy<10){say('つかれてて遊べないにゃ…',2500);return}startPlay()};
function startPlay(){busy=true;playing=true;playHits=0;playT0=performance.now();document.body.classList.add('mini');
  $('#modeTitle').textContent='🐭 ねずみをタップしてつかまえよう！';$('#modeEnd').style.display='none';
  const toy=$('#toy');toy.style.display='block';toy.style.transition='none';toy.style.left=stage.offsetWidth*.8+'px';toy.style.top=stage.offsetHeight*.7+'px';
  requestAnimationFrame(()=>{toy.style.transition='';moveToy()});say('まてまて～！',1500,false);meow(1.2);
  const loop=()=>{const el=(performance.now()-playT0)/1000;const left=Math.max(0,PLAY_SEC-el);
    $('#modeProg').style.width=(left/PLAY_SEC*100)+'%';$('#modeInfo').textContent=`のこり ${Math.ceil(left)}秒　ヒット ${playHits}`;
    const r=toy.getBoundingClientRect(),s=stage.getBoundingClientRect();lookAt((r.left+r.width/2-s.left)/SCALE,(r.top+r.height/2-s.top)/SCALE);
    if(left<=0)return endPlay();playRaf=requestAnimationFrame(loop)};loop()}
function moveToy(){clearTimeout(toyTimer);const W=stage.offsetWidth,H=stage.offsetHeight,toy=$('#toy');
  const nx=rnd(W*.12,W*.88),ny=rnd(H*(PORT?.4:.45),H*(PORT?.72:.8));const ox=parseFloat(toy.style.left)||0;toy.classList.toggle('l',nx<ox);
  toy.style.left=nx+'px';toy.style.top=ny+'px';toyTimer=setTimeout(moveToy,rnd(650,1000)-Math.min(playHits*15,250))}
$('#toy').addEventListener('pointerdown',e=>{if(!playing)return;e.stopPropagation();playHits++;const p=toLogical(e);fx(p.x,p.y,'💥');fx(p.x,p.y-40,'+'+playHits,'txt');blip(600+playHits*40,.08,'square',.07);
  const t=$('#toy');t.classList.remove('hit');void t.offsetWidth;t.classList.add('hit');catWrap.classList.remove('pounce');void catWrap.offsetWidth;catWrap.classList.add('pounce');moveToy()});
function endPlay(){playing=false;cancelAnimationFrame(playRaf);clearTimeout(toyTimer);$('#toy').style.display='none';document.body.classList.remove('mini');catWrap.classList.remove('pounce');
  const coins=playHits*5,mood=Math.min(35,8+playHits*3),xp=6+playHits*2;give({coins});addSt({mood,energy:-10,hunger:-5});addXP(xp);S.tot.play++;task('play');busy=false;
  catCls('happy',true,1800);hearts(4);meow();
  const rank=playHits>=14?'すごい！ハンターだにゃ！':playHits>=8?'たのしかったにゃ！':'もっと遊びたいにゃ～';
  const b=openModal('おもちゃで遊んだ！',`<div class="center"><div style="font-size:60px">🐭</div><p style="font-size:24px;font-weight:800">ヒット ${playHits} 回</p><p>「${rank}」</p><p style="margin:12px 0 18px;font-weight:700">🪙 +${coins}　ごきげん +${mood}　けいけん +${xp}</p><button class="mbtn" id="okBtn">OK</button></div>`);b.querySelector('#okBtn').onclick=closeModal;save()}

/* ================= お手入れ ================= */
let brushing=false,brushProg=0,brushDown=false,brushLast=null,brushSp=0;
$('#brushBtn').onclick=()=>{if(blockMsg())return;startBrush()};
function startBrush(){busy=true;brushing=true;brushProg=0;brushLast=null;document.body.classList.add('mini','brushing');
  $('#modeTitle').textContent='🪮 ねこの上をドラッグしてブラッシング';$('#modeEnd').style.display='';$('#modeInfo').textContent='';$('#modeProg').style.width='0%';
  const c=headCenter();$('#brush').style.left=c.x+120+'px';$('#brush').style.top=c.y+60+'px';say('ブラシだにゃ？',1500,false)}
stage.addEventListener('pointerdown',e=>{if(brushing){brushDown=true;brushLast=toLogical(e)}});
addEventListener('pointerup',()=>{brushDown=false;brushLast=null});
function brushMove(e,p){const br=$('#brush');br.style.left=p.x+'px';br.style.top=p.y+'px';
  if(!(brushDown||e.pointerType==='mouse'&&e.buttons))return;
  const r=catWrap;const inCat=p.x>r.offsetLeft+r.offsetWidth*.1&&p.x<r.offsetLeft+r.offsetWidth*.9&&p.y>r.offsetTop+r.offsetHeight*.05&&p.y<r.offsetTop+r.offsetHeight*.95;
  if(brushLast&&inCat){const d=Math.hypot(p.x-brushLast.x,p.y-brushLast.y);brushProg=Math.min(100,brushProg+d*(PORT?.09:.055));brushSp+=d;
    catSvg.classList.add('happy');clearTimeout(brushMove.t);brushMove.t=setTimeout(()=>catSvg.classList.remove('happy'),500);
    S.st.clean=clamp(S.st.clean+d*.05);updDirt();
    if(brushSp>50){brushSp=0;fx(p.x+rnd(-20,20),p.y+rnd(-20,20),pick(['✨','✨','💫']));blip(rnd(1200,1600),.04,'sine',.04)}
    $('#modeProg').style.width=brushProg+'%';$('#modeInfo').textContent=Math.floor(brushProg)+'%';if(brushProg>=100)endBrush(true)}
  brushLast=p}
$('#modeEnd').onclick=()=>{if(brushing)endBrush(brushProg>=30)};
function endBrush(ok){brushing=false;brushDown=false;document.body.classList.remove('mini','brushing');busy=false;
  if(ok){const f=brushProg/100;addSt({clean:100*f,mood:Math.round(12*f)});addXP(Math.round(12*f)+2);give({coins:Math.round(20*f)});S.tot.brush++;task('brush');catCls('happy',true,1600);hearts(3,'✨');say('ピカピカだにゃ！',2500);meow()}
  else{say('もうおわりかにゃ？',2000,false)}renderStats();save()}

/* ================= おやすみ ================= */

function skyUpdate(){const h=new Date().getHours()+new Date().getMinutes()/60;let s1,s2,night=0,sun=1;
  if(h>=5&&h<8){s1='#ffc9a8';s2='#cfe8ff';night=.08}else if(h>=8&&h<16){s1='#7cc4f5';s2='#dff3ff'}else if(h>=16&&h<19){s1='#ff9d7a';s2='#ffe0b0';night=.12}else{s1='#0f1b3d';s2='#32457e';night=.32;sun=0}
  $('#sky1').setAttribute('stop-color',s1);$('#sky2').setAttribute('stop-color',s2);$('#stars').setAttribute('opacity',sun?0:1);$('#sun').setAttribute('opacity',sun);$('#moon').setAttribute('opacity',sun?0:1);
  if(h>=16&&h<19)$('#sun').setAttribute('fill','#ffd27a');else $('#sun').setAttribute('fill','#fff7cf');$('#shade').style.opacity=night}
skyUpdate();setInterval(skyUpdate,60000);

    st.mood=clamp(st.mood-(.7+(st.hunger<30?1:0)+(st.clean<30?.6:0)+(st.energy<20?.6:0))*dt)}

let walkOn=false,walkItems=[],walkT0=0,walkLast=0,walkSpawn=0,walkGot=[],walkRaf=null;
const WALK_SEC=18;
function rollItem(){const tot=DEX.reduce((a,d)=>a+RW[d.r],0);let r=Math.random()*tot;for(const d of DEX){r-=RW[d.r];if(r<0)return d}return DEX[0]}
function startWalk(){busy=true;walkOn=true;walkGot=[];walkItems=[];$('#walkItems').innerHTML='';$('#walk').classList.add('on');document.body.classList.add('mini');
  $('#modeTitle').textContent='🐾 おちているものをタップ！';$('#modeEnd').style.display='none';
  const deco=$('#walkDeco');deco.innerHTML='';[['🌳',14,0,'26%'],['🌲',18,-6,'27%'],['🏠',24,-10,'28%'],['🌳',14,-8,'25%'],['🌷',7,-2,'16%'],['🌻',9,-6,'15%']].forEach(([e,d,del,b])=>{const s=document.createElement('span');s.className='deco';s.textContent=e;s.style.bottom=b;s.style.animationDuration=d+'s';s.style.animationDelay=del+'s';if(e==='🌷'||e==='🌻')s.style.fontSize='56px';deco.appendChild(s)});
  walkT0=walkLast=performance.now();walkSpawn=0;meow(1.15);walkRaf=requestAnimationFrame(walkLoop)}
function walkLoop(now){const dt=Math.min(.05,(now-walkLast)/1000);walkLast=now;const el=(now-walkT0)/1000,left=Math.max(0,WALK_SEC-el);
  const W=stage.offsetWidth,H=stage.offsetHeight;
  $('#modeProg').style.width=(left/WALK_SEC*100)+'%';$('#modeInfo').textContent=`のこり ${Math.ceil(left)}秒　みつけた ${walkGot.length}`;
  walkSpawn-=dt;if(walkSpawn<=0&&left>1.5){walkSpawn=rnd(.45,.85);const d=rollItem();const it=document.createElement('div');it.className='item r'+d.r;it.textContent=d.e;
    const o={el:it,d,x:W+60,y:rnd(H*.22,H*.72),v:rnd(160,260)*(PORT?.7:1)*(d.r>=3?1.3:1),ph:rnd(0,6)};it.style.top=o.y+'px';it.style.left=o.x+'px';
    it.addEventListener('pointerdown',e=>{e.stopPropagation();if(o.got)return;o.got=true;it.classList.add('got');walkGot.push(d);blip(700+d.r*200,.1,'triangle',.1);
      const p=toLogical(e);fx(p.x,p.y-30,'+'+RPT[d.r]+'pt','txt');setTimeout(()=>it.remove(),400)});
    $('#walkItems').appendChild(it);walkItems.push(o)}
  walkItems=walkItems.filter(o=>{if(o.got)return false;o.x-=o.v*dt;o.ph+=dt*3;o.el.style.left=o.x+'px';o.el.style.top=(o.y+Math.sin(o.ph)*12)+'px';if(o.x<-80){o.el.remove();return false}return true});
  if(left<=0)return endWalk();walkRaf=requestAnimationFrame(walkLoop)}
function endWalk(){walkOn=false;cancelAnimationFrame(walkRaf);$('#walk').classList.remove('on');document.body.classList.remove('mini');$('#walkItems').innerHTML='';busy=false;
  let pts=0,coins=10,fish=0,gems=0;const newOnes=[];const cnt={};
  walkGot.forEach(d=>{pts+=RPT[d.r];coins+=d.r*5;if(d.id==='fish')fish+=2;if(d.id==='gem')gems+=1;if(!S.dex[d.id]&&!newOnes.includes(d.id))newOnes.push(d.id);S.dex[d.id]=(S.dex[d.id]||0)+1;cnt[d.id]=(cnt[d.id]||0)+1});
  evCheck();const before=S.ev.pts;S.ev.pts+=pts;give({coins,fish,gems});addSt({energy:-20,hunger:-10,mood:15,clean:-15});addXP(20+walkGot.length);S.tot.walk++;task('walk');
  const got=[];EV_MILES.forEach((m,i)=>{if(S.ev.pts>=m.pts&&!S.ev.got.includes(i)){S.ev.got.push(i);sendMail('イベント報酬',`おさんぽイベント ${m.pts}pt たっせい！`,m.r);got.push(m.l)}});
  renderEvent();renderStats();save();catCls('happy',true,1800);hearts(3);meow();say('たのしかったにゃ！\nちょっとよごれたにゃ',3000);
  const list=Object.keys(cnt).map(id=>{const d=DEX.find(x=>x.id===id);return `<div class="dexc"><div class="e">${d.e}</div><div class="n">${d.n}</div><div class="n" style="color:#a08a76">×${cnt[id]}</div>${newOnes.includes(id)?'<div class="n" style="color:#ff5a6e">NEW!</div>':''}</div>`}).join('');
  const b=openModal('おさんぽから帰ったよ',`<p class="center" style="font-weight:800;font-size:22px">+${pts}pt（合計 ${S.ev.pts}pt）</p><p class="center" style="margin:6px 0 14px">🪙 +${coins}${fish?'　🐟 +'+fish:''}${gems?'　💎 +'+gems:''}</p>${list?`<div class="grid dex">${list}</div>`:'<p class="center">なにも見つからなかった…</p>'}${got.length?`<p class="center" style="margin-top:14px;color:#9a6ad8;font-weight:800">🎉 イベント報酬「${got.join('」「')}」をメールで送ったよ！</p>`:''}<div class="center" style="margin-top:16px"><button class="mbtn" id="okBtn">OK</button></div>`);
  b.querySelector('#okBtn').onclick=closeModal}

$('#statBtn').onclick=()=>{const st=S.st;const days=Math.floor((Date.now()-S.born)/864e5)+1;const row=(n,v,c)=>`<div class="stat"><span>${n}</span><div class="bar"><i style="width:${v}%;background:${c}"></i></div><b style="width:44px;text-align:right">${Math.round(v)}</b></div>`;

  `<div class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:16px;text-align:center;font-size:15px"><div>いっしょに<br><b style="font-size:22px">${days}</b>日</div><div>なでた回数<br><b style="font-size:22px">${S.tot.pet}</b></div><div>ごはん<br><b style="font-size:22px">${S.tot.feed}</b></div><div>あそんだ<br><b style="font-size:22px">${S.tot.play}</b></div><div>おさんぽ<br><b style="font-size:22px">${S.tot.walk}</b></div><div>図鑑<br><b style="font-size:22px">${DEX.filter(d=>S.dex[d.id]).length}</b>/${DEX.length}</div></div>`)};

/* ================= 起動 ================= */
renderCatAll();renderTop();renderStats();renderTodo();renderEvent();applySleep();
document.addEventListener('pointerdown',()=>ac(),{once:true});
setTimeout(()=>say(S.sleeping?'すや…すや…':(new Date().getHours()<10&&new Date().getHours()>=5?'おはようにゃ！':'おかえりにゃ！\nあそぼうかにゃ？')),700);
setInterval(renderEvent,60000);
addEventListener('beforeunload',()=>{if(S)save()});
})();
</script>
