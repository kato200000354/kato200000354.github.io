<style>
:root{
  --bg:#EFEFE6; --surface:#FFFFFF; --surface2:#F6F5EE; --line:#DCDACB;
  --ink:#1F2328; --muted:#5F6670; --faint:#8E949C;
  --name:#117743; --anc:#1F4FD1; --primary:#C8102E; --onprimary:#FFFFFF;
  --kowai:#6B4BD6; --kowai-bg:#ECE7FF; --kando:#E0457B; --kando-bg:#FFE6EF;
  --warai:#D97A00; --warai-bg:#FFF0D9; --jiken:#1E7FC2; --jiken-bg:#E2F1FB;
  --bunka:#1D9A6C; --bunka-bg:#DDF5EA; --star:#F2B300;
  --shadow:0 10px 28px -16px rgba(40,40,20,.45);
  --font:"M PLUS 1p","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --aa:"MS PGothic","ＭＳ Ｐゴシック","IPAMonaPGothic","Mona","Saitamaar",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15171A; --surface:#1E2125; --surface2:#262A2F; --line:#33383F;
    --ink:#ECEEF1; --muted:#AAB1BA; --faint:#7C848E;
    --name:#4FD08B; --anc:#7FA6FF; --primary:#FF5468; --onprimary:#1A0508;
    --kowai:#A891FF; --kowai-bg:#2A2342; --kando:#FF7EA8; --kando-bg:#3A1C28;
    --warai:#FFB648; --warai-bg:#3A2A12; --jiken:#6CC0FF; --jiken-bg:#16303F;
    --bunka:#4FD7A4; --bunka-bg:#143428; --star:#FFCC33;
    --shadow:0 10px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171A; --surface:#1E2125; --surface2:#262A2F; --line:#33383F;
  --ink:#ECEEF1; --muted:#AAB1BA; --faint:#7C848E;
  --name:#4FD08B; --anc:#7FA6FF; --primary:#FF5468; --onprimary:#1A0508;
  --kowai:#A891FF; --kowai-bg:#2A2342; --kando:#FF7EA8; --kando-bg:#3A1C28;
  --warai:#FFB648; --warai-bg:#3A2A12; --jiken:#6CC0FF; --jiken-bg:#16303F;
  --bunka:#4FD7A4; --bunka-bg:#143428; --star:#FFCC33;
  --shadow:0 10px 28px -16px rgba(0,0,0,.8);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.7;font-size:15px;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 96px}
header.top{padding:22px 0 8px;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--primary);color:var(--onprimary);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none;box-shadow:var(--shadow)}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.02em}
.top p{margin:0;color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:none}

/* today */
.today{margin:14px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
.today .lbl{font-size:12px;font-weight:800;color:var(--primary);letter-spacing:.08em}
.today h2{margin:4px 0 6px;font-size:20px;line-height:1.4}
.today p{margin:0;color:var(--muted);font-size:13.5px}
.today .big{position:absolute;right:-6px;bottom:-18px;font-size:86px;opacity:.13;pointer-events:none}
.today .row{display:flex;gap:8px;margin-top:12px}
.btn{border:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.btn.pri{background:var(--primary);color:var(--onprimary);border-color:transparent}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:none;background:transparent;color:var(--ink);font:inherit;padding:11px 0;outline:none;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:12px;color:var(--faint);margin:2px 2px 8px}

.list{display:grid;gap:10px}
.card{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;width:100%;position:relative}
.card:active{transform:scale(.99)}
.card .em{font-size:30px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.card .bd{min-width:0;flex:1}
.card h3{margin:0;font-size:16px;line-height:1.4}
.card .hook{margin:3px 0 6px;color:var(--muted);font-size:13px;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11.5px;color:var(--faint)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:700;font-size:11.5px}
.g-kowai{color:var(--kowai);background:var(--kowai-bg)}
.g-kando{color:var(--kando);background:var(--kando-bg)}
.g-warai{color:var(--warai);background:var(--warai-bg)}
.g-jiken{color:var(--jiken);background:var(--jiken-bg)}
.g-bunka{color:var(--bunka);background:var(--bunka-bg)}
.readmark{position:absolute;top:10px;right:12px;font-size:11px;color:var(--faint)}
.favmark{color:var(--star)}
.empty{text-align:center;color:var(--faint);padding:40px 0}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bottom button{flex:1;max-width:240px;background:none;border:none;padding:9px 0 8px;font-size:11.5px;font-weight:700;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.bottom button b{font-size:20px;line-height:1.2}
nav.bottom button.on{color:var(--primary)}

/* detail */
.dhead{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.dhead .t{flex:1;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{padding:18px 0 6px}
.hero .em{font-size:44px;line-height:1}
.hero h2{margin:8px 0 4px;font-size:24px;line-height:1.35}
.hero .sub{color:var(--muted);font-size:13px}
.sec{margin:20px 0}
.sec h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.sec h4 small{font-weight:400;color:var(--faint);font-size:11.5px}
.three{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:12px 14px 12px 14px;position:relative}
.three::before{content:"3行で頼む";position:absolute;top:-11px;left:12px;background:var(--bg);padding:0 6px;font-size:12px;font-weight:800}
.three ol{margin:4px 0 0;padding-left:22px}
.three li{margin:3px 0;font-weight:700}

.thread{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.post{padding:10px 0;border-bottom:1px dashed var(--line)}
.post:last-child{border-bottom:none}
.post .ph{font-size:12.5px;color:var(--muted)}
.post .ph .no{font-weight:700;color:var(--ink);margin-right:4px}
.post .ph .nm{color:var(--name);font-weight:800}
.post .ph .op{background:var(--primary);color:var(--onprimary);border-radius:4px;padding:0 5px;font-size:10.5px;margin-left:4px;font-weight:800}
.post .pb{margin:2px 0 0 12px;word-break:break-word}
.post.hl{background:var(--surface2);margin:0 -14px;padding-left:14px;padding-right:14px}
.aa{font-family:var(--aa);white-space:pre;line-height:1.15;font-size:13px;overflow-x:auto;display:block}
a.anc{color:var(--anc);text-decoration:underline;cursor:pointer}
.note{font-size:11.5px;color:var(--faint);margin:6px 2px 0}
.kai p{margin:0 0 10px}
.trivia{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.trivia li{margin:4px 0}
.trivia ul{margin:0;padding-left:20px}
.words{display:grid;gap:8px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.word b{display:block;font-size:15px}
.word span{color:var(--muted);font-size:13.5px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.pn button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;font-size:12px;color:var(--muted)}
.pn button b{display:block;color:var(--ink);font-size:14px}
.pn button.r{text-align:right}

/* popup */
.pop{position:fixed;left:16px;right:16px;bottom:84px;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px -12px rgba(0,0,0,.5);padding:4px 14px;z-index:40}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:50;white-space:nowrap}

/* glossary */
.gl-head{padding:18px 0 8px}
.gl-head h2{margin:0;font-size:22px}
.gl-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0 16px;box-shadow:var(--shadow)}
.quiz .q{font-size:24px;font-weight:800;margin:4px 0 10px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:14px}
.quiz .opts button.ok{background:var(--bunka-bg);border-color:var(--bunka);color:var(--bunka);font-weight:700}
.quiz .opts button.ng{background:var(--kando-bg);border-color:var(--kando);color:var(--kando)}
.quiz .score{font-size:12px;color:var(--faint)}
</style>
</head>

<script>

const GENRES={kowai:{label:"怖い",emoji:"👻"},kando:{label:"感動",emoji:"😭"},warai:{label:"笑える",emoji:"🤣"},jiken:{label:"事件・伝説",emoji:"⚡"},bunka:{label:"ネット文化",emoji:"🧩"}},THREADS=[{id:"densha",title:"電車男",emoji:"🚃",genre:"kando",board:"独身男性板",year:"2004年",hook:"電車で酔っ払いから女性を助けたオタク青年を、モテない住人たちが総出で応援した恋の実況。",three:["オタク青年が電車で酔っ払いに絡まれた女性を助ける","お礼に届いたのは高級ブランドのティーカップ。住人の指導でデートへ","ついに告白成功。スレは祝福の嵐→本・映画・ドラマに"],flow:[{n:1,name:"電車男",op:1,t:"電車で酔っ払いが暴れて女の人たちに絡んでた。気づいたら止めに入ってた。"},{n:2,t:">>1 やるじゃん。で、連絡先は？"},{n:3,name:"電車男",op:1,t:"お礼をしたいって住所だけ聞かれた。"},{n:4,name:"電車男",op:1,t:"今日ティーカップが届いた。「HERMES」って書いてある……"},{n:5,t:"エルメスじゃねーか！！！"},{n:6,t:">>4 今すぐお礼の電話しろ。今すぐだ"},{n:7,t:"まず髪を切れ。服は店員に全部選んでもらえ。"},{n:8,name:"電車男",op:1,t:"……食事に誘えました"},{n:9,t:"ｷﾀ━━━━(ﾟ∀ﾟ)━━━━!!",aa:1},{n:10,name:"電車男",op:1,t:"告白しました。OKもらいました。みんな、本当にありがとう。"},{n:11,t:">>10 おめでとう。なんか俺まで救われた気がする"}],kai:["2004年の春、モテない男性が集まる「独身男性板」のスレで進行した物語。投稿者「電車男」が、助けた女性（住人からは「エルメス」と呼ばれた）との仲を少しずつ進めていく様子を報告し、住人たちが服装・会話・メールの文面まで本気でアドバイスした。","嫉妬や冷やかしが多い板なのに、いつの間にか全員が彼の恋を応援していた――その一体感こそが感動の正体。まとめサイトで爆発的に広まり、2004年秋に書籍化、2005年には映画（山田孝之・中谷美紀）とドラマ（伊藤淳史・伊東美咲）が大ヒットした。","「オタク」「アキバ系」が世間で注目されるきっかけにもなった一方、「話ができすぎ。創作では？」という声も当時からあり、真相はいまも謎のまま。"],trivia:["当時の住人は彼の決戦の日を「祭り」として待機していた","ドラマ版のオープニングは、ELOの「Twilight」に乗せたアニメが話題に"],words:[["毒男","独身男性板の住人のこと"],["祭り","スレが異常に盛り上がっている状態"],["ｷﾀ━(ﾟ∀ﾟ)━!","待ってたものが来た！の喜びの顔文字"]]},{id:"kisaragi",title:"きさらぎ駅",emoji:"🚉",genre:"kowai",board:"オカルト板",year:"2004年",hook:"「いつもの電車が止まらない」――リアルタイムで書き込まれた、存在しない駅からのSOS。",three:["女性が「電車がずっと止まらない」と実況スレに書き込む","降りた先は地図にない「きさらぎ駅」。太鼓の音、消える人影","親切そうな男の車に乗った後、「隙を見て逃げます」で書き込みが途絶える"],flow:[{n:1,name:"はすみ",op:1,t:"いつもの電車に乗ってるんですが、さっきから20分以上ずっと駅に止まりません。"},{n:2,t:">>1 寝過ごして特急に乗っただけじゃね？"},{n:3,name:"はすみ",op:1,t:"他の乗客はみんな寝てます。やっと止まった駅で降りました。「きさらぎ駅」って書いてあります。"},{n:4,t:"調べたけどそんな駅ないぞ"},{n:5,name:"はすみ",op:1,t:"無人駅です。遠くから太鼓と鈴みたいな音がします。"},{n:6,t:"線路沿いに歩いて戻れ。絶対に振り返るな"},{n:7,name:"はすみ",op:1,t:"トンネルの前で「線路を歩いたら危ないよ」と声をかけられました。振り向いたら片足のおじいさんがいて、すぐ消えました。"},{n:8,name:"はすみ",op:1,t:"男の人が車で送ってくれるそうです。でも、どんどん山の方へ行きます。話しかけても返事がありません。"},{n:9,t:">>8 逃げろ！！！"},{n:10,name:"はすみ",op:1,t:"バッテリーがもうありません。様子がおかしいので、隙を見て逃げようと思います。"},{n:11,t:"はすみ？　おい、返事しろ"}],kai:["2004年1月、オカルト板の「身のまわりで変なことが起こったら実況するスレ」に、「はすみ」と名乗る女性が書き込んだ話。静岡県の私鉄に乗っていたとされ、住人とやりとりしながら刻一刻と状況が悪化していく。","リアルタイムの実況形式だったことが恐怖を何倍にもした。読んでいる側も「今まさに起きている」と感じられ、最後の書き込みの後の沈黙がいちばん怖い。","「異界駅」というジャンルを生んだ元祖で、ネット怪談の金字塔。2022年には映画化もされた。後年、本人を名乗る書き込みも現れたが、真偽は不明。"],trivia:["駅の看板には隣の駅として「かたす」「やみ」と書かれていたとされる","「伊佐貫（いさぬき）」というトンネルも登場する"],words:[["実況","起きていることをリアルタイムで書き込むこと"],["異界駅","実在しない駅に迷い込む系の怪談ジャンル"],["洒落怖","「死ぬ程洒落にならない怖い話を集めてみない？」スレの略"]]},{id:"hasshaku",title:"八尺様",emoji:"👒",genre:"kowai",board:"オカルト板（洒落怖）",year:"2008年",hook:"生け垣の向こうから「ぽぽぽ」と笑う、背丈2m40cmの女。魅入られた少年が過ごした一夜。",three:["祖父母の家で、生け垣より背の高い白い服の女を見る","祖父が青ざめる。「八尺様に魅入られた」――数日のうちに取り殺される","お札と盛り塩の部屋で一夜を越え、親族総出で村から脱出する"],flow:[{n:1,op:1,name:"語り手",t:"高校生の頃、田舎の祖父母の家に行ったときの話。"},{n:2,op:1,name:"語り手",t:"庭にいたら「ぽぽ、ぽぽぽ」って変な声。生け垣の上から白い帽子が見えて、その帽子がゆっくり横に動いていった。生け垣は2m以上ある。"},{n:3,t:"もうこの時点で嫌な予感しかしない"},{n:4,op:1,name:"語り手",t:"話したら、じいちゃんの顔色が変わった。「八尺様だ。お前、魅入られたぞ」"},{n:5,op:1,name:"語り手",t:"お札を貼って四隅に盛り塩をした部屋に一晩こもることに。夜中、じいちゃんの声で「もう出てきていいぞ」って聞こえた。でも、じいちゃんの声じゃなかった。"},{n:6,t:">>5 ここで開けたら終わりなんだよな……"},{n:7,op:1,name:"語り手",t:"朝、同じ血筋の親戚に車で囲まれて村を出た。窓の外を、あれが並んでついてきてた。"},{n:8,op:1,name:"語り手",t:"それから一度もあの村には行ってない。最近、八尺様を封じていた地蔵が壊されたと聞いた。"}],kai:["2008年に洒落怖スレに投稿された話。八尺（約2m40cm）もある長身の女で、白いワンピースと帽子、「ぽぽぽ」という不気味な声が特徴。若い男が狙われるという設定。","「声だけ家族を真似る」「同じ血を持つ者で囲んで守る」など、民俗学っぽい細部がリアリティを生んだ。結末で「封印が解けた」と示すことで、読者の日常まで不安を引きずらせる構成が見事。","のちにイラスト界隈で“美人で背の高いお姉さん”として大人気キャラ化するという、怖いのか萌えなのか分からない進化も遂げた。"],trivia:["「八尺」は約242cm","地蔵で村の境に封じられている、という設定がある"],words:[["洒落怖","オカルト板の名物スレ「死ぬ程洒落にならない怖い話を集めてみない？」"],["魅入られる","怪異に目をつけられること"]]},{id:"kunekune",title:"くねくね",emoji:"🌾",genre:"kowai",board:"オカルト板",year:"2000年代前半",hook:"田んぼの向こうで白いものがくねくね動いている。でも、正体を「理解」してはいけない。",three:["田舎の田んぼの遠くに、白くくねくね動く何かがいる","兄が双眼鏡で見た瞬間、「わかった……わからない方がいい」","兄は正気を失い、二度と元に戻らなかった"],flow:[{n:1,op:1,name:"語り手",t:"子どもの頃、兄と田舎のばあちゃん家で遊んでた。"},{n:2,op:1,name:"語り手",t:"田んぼの向こうに、白い人みたいなのがくねくね動いてる。風もないのに、人間にできない動き方。"},{n:3,op:1,name:"語り手",t:"兄が双眼鏡で見た。急に真っ青になって「わかった……わからない方がいい」って。"},{n:4,t:"怖い怖い怖い"},{n:5,op:1,name:"語り手",t:"その日から兄はおかしくなった。じいちゃんは「あれは見ても、わかってはいけないものだ」とだけ言った。"},{n:6,t:">>5 見るだけならセーフ、理解したらアウトってのが一番怖い"}],kai:["2000年代前半から語られている怪談で、真夏の田んぼに現れる白い「くねくね」動く存在。遠くから見るだけなら害はないが、正体を理解すると精神が壊れてしまうというルールが特徴。","幽霊のように襲ってくるわけでもなく、正体の説明もない。「わかってはいけないもの」という、読者自身の想像力に恐怖をゆだねる作りが秀逸。似た話がいくつも投稿され、ネット怪談の定番になった。"],trivia:["のどかな夏の田園風景で起きる、という“昼の怪談”なのが珍しい","「案山子が動いて見える現象では」という考察も多い"],words:[["ネット怪談","掲示板発祥の作者不明の怖い話"]]},{id:"kotoribako",title:"コトリバコ",emoji:"📦",genre:"kowai",board:"オカルト板（洒落怖）",year:"2005年",hook:"友人が倉庫で見つけた寄木細工の箱。それは一族の女と子どもを根絶やしにする呪物だった。",three:["友人が古い蔵から、パズルのような木の箱を見つける","神社の家系の友人が激しく取り乱す。「それはコトリバコだ」","女性と子どもだけを殺す、百年以上前に作られた呪いの箱だった"],flow:[{n:1,op:1,name:"語り手",t:"友達の家の蔵の片付けをしてたら、寄木細工みたいな箱が出てきた。"},{n:2,op:1,name:"語り手",t:"神社の息子のMに見せたら、真っ青になって吐いた。「誰も触るな。女と子どもは絶対に近づけるな」"},{n:3,t:"Mくん有能すぎる"},{n:4,op:1,name:"語り手",t:"Mの話だと、昔ある村が自分たちを守るために作った呪いの箱らしい。中身が多いほど強くて、「ハッカイ」が一番ヤバい。"},{n:5,op:1,name:"語り手",t:"その家の女と子どもを、内臓が千切れるように少しずつ弱らせて殺す。呪いが弱まるまで、何十年も代々で管理されてきたって。"},{n:6,t:">>4 段階に名前がついてる設定がリアルで嫌"}],kai:["2005年に洒落怖スレに投稿され、「洒落怖の中でもトップクラス」と言われる作品。箱の製法や階級（イッポウ、ニホウ…ハッカイ）など、設定の作り込みが圧倒的。","「女性と子どもだけを狙う」「代々の管理」「作った側にも呪いが返る」という因果の重さが、ただのホラーを越えた後味を残す。オカルトとしてだけでなく、物語としての完成度でも語り継がれている。"],trivia:["島根県の話として語られる","続編や関連とされる投稿も複数ある"],words:[["呪物","呪いの力が宿るとされる物"],["洒落怖","オカルト板の怖い話まとめスレ"]]},{id:"sarumu",title:"猿夢",emoji:"🐒",genre:"kowai",board:"オカルト板",year:"2000年頃",hook:"夢の中で乗った遊園地の電車。アナウンスのたびに、後ろの乗客が一人ずつ「処理」されていく。",three:["夢の中で、猿のアナウンスが流れる小さな電車に乗る","「次は活けづくり〜」アナウンスの通りに乗客が殺されていく","自分の番の直前で目が覚める。そして数年後、また同じ夢を見る"],flow:[{n:1,op:1,name:"語り手",t:"夢の中で、遊園地のお猿電車みたいなのに乗ってた。"},{n:2,op:1,name:"語り手",t:"アナウンス「次は〜活けづくり〜」。後ろの席の人が、小人たちに刃物で……"},{n:3,op:1,name:"語り手",t:"次のアナウンスでまたその後ろの人。順番が近づいてくる。「これは夢だ、覚めろ」って念じたら目が覚めた。"},{n:4,t:"よかった、夢オチか"},{n:5,op:1,name:"語り手",t:"数年後、また同じ電車に乗ってる夢を見た。アナウンスが言った。「逃げられませんよ〜。次に来た時が最後ですよ〜」"},{n:6,t:">>5 夢オチじゃ終わらせてくれないのかよ……"}],kai:["2000年頃、個人サイトに書かれた「夢日記」が始まりとされ、2ちゃんねるにコピペされて爆発的に広まった。","夢という“逃げ場”が、次第に逃げ場でなくなっていく恐怖。そして「次に来た時が最後」という一言で、読んだ人が「自分も見たらどうしよう」と思ってしまう感染型の怖さがある。"],trivia:["ネット怪談の古典としてテレビやマンガでもたびたび紹介される"],words:[["コピペ","コピー＆ペーストで広まる定番の文章"]]},{id:"kyotou",title:"巨頭オ",emoji:"🪧",genre:"kowai",board:"オカルト板",year:"2000年代",hook:"思い出の村を再訪すると、看板には「巨頭オ」。草むらから、頭の大きな人たちが――。",three:["昔家族で訪れた小さな村を、懐かしくなって車で探しに行く","村の入口の朽ちた看板には「巨頭オ」とだけ書かれている","草むらから頭の異様に大きい人間が大勢現れ、必死で逃げ帰る"],flow:[{n:1,op:1,name:"語り手",t:"昔、家族で行った小さな旅館のある村があって、ふと行ってみたくなった。"},{n:2,op:1,name:"語り手",t:"村の入口の看板が朽ちていて、「巨頭オ」と読めた。"},{n:3,t:"もう帰れ"},{n:4,op:1,name:"語り手",t:"車を降りたら、草むらから頭がやけに大きい人が出てきた。一人じゃない。頭を左右に揺らしながら、何人も近づいてくる。"},{n:5,op:1,name:"語り手",t:"全力で車を出した。地図で調べても、そんな村はもう載ってなかった。"},{n:6,t:">>2 たった4文字でここまで怖いの反則だろ"}],kai:["数十行しかない短編なのに、異様な印象を残すネット怪談。説明が一切ないまま終わるので、「看板は本来なんと書いてあったのか」「巨頭の人々は何者か」と読者が勝手に考え込んでしまう。","「巨頭オ」という意味不明な4文字のインパクトが強烈で、ネタとしても語られる人気作。"],trivia:["看板はもともと「この先〇〇km」などの文字が欠けたもの、という考察が定番"],words:[["考察","説明されていない部分を読者が推理すること"]]},{id:"jikuu",title:"時空のおっさん",emoji:"🕰️",genre:"kowai",board:"オカルト板",year:"2000年代",hook:"気づくと人が誰もいない世界。そこへ現れ「なんで来たんだ」と怒るおっさんの正体とは。",three:["ふと気づくと、街から人が一人残らず消えている","作業着のおっさんが現れ「なんで来た！早く帰れ」と怒る","気がつくと元の世界に戻っている。似た体験談が次々と集まる"],flow:[{n:1,op:1,name:"名無し",t:"学校帰り、急に街が静かになった。車も人もいない。信号だけ動いてる。"},{n:2,t:"それ、俺も似たことある"},{n:3,op:1,name:"名無し",t:"歩き回ってたら、作業着みたいな格好のおっさんに「なんでこんなとこにいるんだ！」って怒鳴られた。"},{n:4,t:"時空のおっさんキター"},{n:5,op:1,name:"名無し",t:"「早く戻れ」って言われて、気づいたらいつもの人混みの中に立ってた。"},{n:6,t:">>3 毎回めっちゃ怒ってるのに、ちゃんと帰してくれるの優しい"}],kai:["「誰もいない世界に迷い込んだ」体験談に、たびたび登場する謎の中年男性。いつも面倒くさそうに怒りつつ元の世界に帰してくれることから、「時空の管理人」のような存在として親しまれている。","一人の作者の作品ではなく、多くの人の体験談が積み重なって“キャラクター”になったのがネットらしい。怖いのにどこか笑える、愛されオカルト。"],trivia:["「おっさんに会えずに帰れなかった人もいるのでは…」と考えるとジワジワ怖い"],words:[["キター","待ってましたの意味"]]},{id:"hitorikakurenbo",title:"ひとりかくれんぼ",emoji:"🧸",genre:"kowai",board:"オカルト板",year:"2006年頃",hook:"ぬいぐるみを使った降霊術を、住人たちが次々と“実況しながら”試したスレ。",three:["ぬいぐるみを「鬼」にして一人でかくれんぼする降霊術が紹介される","住人が深夜に実際に試し、怪現象を実況で報告","真似する人が続出し、全国的なオカルトブームに"],flow:[{n:1,op:1,name:"名無し",t:"今からひとりかくれんぼやる。準備はできた。実況する。"},{n:2,t:"マジでやめとけ"},{n:3,t:">>1 た。","※今同じことをやると業務妨害になりかねないので、あくまで黒歴史として笑おう。"],trivia:["「祭り」という言葉が一般にも知られるきっかけの一つ"],words:[["祭り","大勢が一斉に一つのことに熱狂すること"],["〇〇砲","大量アクセス・大量投稿で攻撃すること"]]},{id:"nurupo",title:"ぬるぽ → ガッ",emoji:"🔨",genre:"warai",board:"プログラム技術板",year:"2000年代初め",hook:"「ぬるぽ」と書くと、どこからともなく誰かが「ガッ」と殴りにくる。意味不明なのに続く伝統芸。",three:["プログラムのエラー「NullPointerException」を略して「ぬるぽ」","それを見た人が「ガッ」とハンマーで殴るAAを返す","板を越えて広まり、2ch全体の挨拶のような定番ネタに"],flow:[{n:1,op:1,name:"名無し",t:"ぬるぽ"},{n:2,t:"ガッ"},{n:3,t:">>1\n　　　Λ＿Λ　＼＼\n　 （　・∀・）　　　|　|　ｶﾞｯ\n　と　　　　）　 　 |　|\n　　 Ｙ　/ノ　　　 人\n　　　 /　）　 　 < 　>__Λ∩\n　 ＿/し'　／／. Ｖ｀Д´）/\n　（＿フ彡　　　　　 　　/　←>>1",aa:1},{n:4,t:"反応はえーよ"},{n:5,t:"ぬるぽ書き込んで1分以内にガッされなかったら負けらしい"}],kai:["プログラマーなら誰もが見たことのあるエラー「NullPointerException（ぬるぽいんたーえくせぷしょん）」を略した「ぬるぽ」。これを書くと、他の住人が「ガッ」とハンマーで殴るAAを貼る――という謎のお約束が誕生した。","理由はない。ただ「ぬるぽを見たらガッする」。この無意味さと反射神経の勝負が楽しくて、プログラム板の外にも広まり、2ちゃんねるを象徴するネタの一つになった。"],trivia:["Javaのエラー名が元ネタ","「ぬるぽ」にガッが来ないと、それはそれでさみしい"],words:[["ぬるぽ","NullPointerExceptionの略。書くとガッされる"],["ガッ","ぬるぽへのツッコミ（物理）"]]},{id:"anka",title:"安価スレ",emoji:"🎲",genre:"warai",board:"ニュー速VIP",year:"2000年代中盤〜",hook:"「>>5が言ったことを実行する」――見知らぬ他人に人生を委ねる、VIPの名物遊び。",three:["スレ主が「安価（アンカー）で指定されたレスの通りに行動する」と宣言","住人は無茶ぶりを投げ、スレ主は本当に実行して写真つきで報告","料理・告白・旅行・ゲーム…何が起きるかわからないライブ感が魅力"],flow:[{n:1,op:1,name:"名無し",t:"暇だから>>5の作った料理を作って食う"},{n:2,t:"カレー"},{n:3,t:"ksk"},{n:4,t:"ksk"},{n:5,t:"プリンに醤油かけてウニ"},{n:6,t:">>5 ひでえｗｗｗｗ"},{n:7,op:1,name:"名無し",t:"作った。うp　→　意外とウニじゃない。ただのプリン醤油味"},{n:8,t:">>1 有言実行えらい"}],kai:["「安価」はアンカー（>>番号）のこと。スレ主が「>>〇〇の指示に従う」と宣言し、住人がその番号を取ろうと殺到するVIPの定番スタイル。","番号を早く進めるための「ksk（加速）」レスや、まともな意見がことごとく無視される理不尽さもお約束。実況・写真付きで報告されると一気に“祭り”になる。今の配信者の「視聴者参加企画」の原型ともいえる。"],trivia:["「安価は絶対」がルール。破ると「安価守れよ」と叩かれる"],words:[["安価","アンカー（>>番号）のこと。「安価下」なら1つ下のレス"],["ksk","加速。安価を早く進めるためのレス"],["うp","アップロード。画像を貼ること"]]},{id:"nomaneko",title:"のまネコ問題",emoji:"🐱",genre:"jiken",board:"複数板",year:"2005年",hook:"「恋のマイアヒ」のネコはモナーじゃないのか？　大手レコード会社とネット民が激突した事件。",three:["海外の曲「恋のマイアヒ」のFlashに、2chのAA「モナー」似のネコが登場","エイベックスが「のまネコ」としてキャラ化・商標出願","「ネットの共有財産を私物化するな」と大炎上し、商標出願は取り下げへ"],flow:[{n:1,op:1
