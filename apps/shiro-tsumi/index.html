<!doctype html>
<!-- © kato200000354. 無断転載・複製・再配布を禁止します。 (kato200000354-protected) -->

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>城つみ</title>
<meta name="description" content="石垣・天守・殿・招き猫…なんでも積んで天下一の城を築け！地震や突風に耐える物理積み上げゲーム。">
<meta name="theme-color" content="#1d2433">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2433;color:#2a2116;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;display:block}
button{font-family:inherit;cursor:pointer;border:0}
.dg{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#hud .box{background:rgba(255,250,240,.88);border:2px solid #2a2116;border-radius:12px;padding:4px 10px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#hH{font-size:26px;line-height:1.05}
#hH small{font-size:13px;margin-left:2px}
.lbl{font-size:10px;font-weight:800;color:#8a5a2b;letter-spacing:.05em}
#lives{font-size:16px;letter-spacing:0;white-space:nowrap}
#lives .dim{filter:grayscale(1);opacity:.3}
#nextBox{margin-left:auto;text-align:center;padding:4px 6px}
#nextCv{width:52px;height:44px;display:block}
#mute{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:rgba(255,250,240,.88);border:2px solid #2a2116;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.25)}

#ctrl{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:space-between;pointer-events:none}
#ctrl button{pointer-events:auto;height:56px;min-width:96px;padding:0 16px;border-radius:16px;border:3px solid #2a2116;font-size:17px;font-weight:800;box-shadow:0 4px 0 #2a2116}
#ctrl button:active{transform:translateY(3px);box-shadow:0 1px 0 #2a2116}
#rotBtn{background:#fff8e8}
#doneBtn{background:#d8402f;color:#fff}
#doneBtn:disabled{background:#9b8f84;color:#e8e0d6}
#tapHint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);color:#fff;font-weight:800;font-size:14px;text-shadow:0 2px 3px rgba(0,0,0,.6);pointer-events:none;animation:blink 1.2s infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.35}}

#banner{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;width:min(92vw,420px)}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .b1{display:inline-block;background:#2a2116;color:#ffe08a;font-size:30px;padding:8px 18px;border-radius:14px;border:3px solid #ffe08a}
#banner .b2{margin-top:8px;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 4px rgba(0,0,0,.7)}

#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 76px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92vw}
.toast{background:#2a2116;color:#ffe08a;border:2px solid #ffe08a;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;animation:tin .3s ease-out,tout .4s ease-in 2.6s forwards;max-width:100%}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.panel{background:#f6eedc;border:3px solid #2a2116;border-radius:20px;box-shadow:0 6px 0 #2a2116,0 0 0 6px #f6eedc inset;width:min(100%,400px);padding:20px 18px;text-align:center;position:relative;margin:auto}
.panel::before{content:"";position:absolute;inset:6px;border:2px solid #c9302c;border-radius:14px;pointer-events:none}
#title{background:radial-gradient(ellipse at 50% 30%,rgba(255,240,210,.0),rgba(20,24,40,.35))}
.logo{font-size:64px;line-height:1;color:#2a2116;margin:6px 0 2px;text-shadow:3px 3px 0 #e8b33a}
.logo span{color:#c9302c}
.sub{font-weight:800;font-size:14px;color:#8a5a2b;margin-bottom:14px}
.big{display:block;width:100%;height:56px;border-radius:16px;border:3px solid #2a2116;font-size:19px;font-weight:800;margin:10px 0;box-shadow:0 4px 0 #2a2116}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #2a2116}
.red{background:#c9302c;color:#fff}
.gold{background:#e8b33a;color:#2a2116}
.plain{background:#fffaf0;color:#2a2116}
.small{font-size:12px;color:#6b5a48;line-height:1.7}
.row2{display:flex;gap:8px}
.row2 .big{font-size:15px}
.howto{text-align:left;font-size:12.5px;line-height:1.75;background:#fffaf0;border-radius:12px;padding:10px 12px;margin-top:10px;border:2px dashed #c9b894}
.howto b{color:#c9302c}

#result .panel{padding:16px 14px}
#cardImg{width:100%;border-radius:10px;border:2px solid #2a2116;display:block;background:#ddd}
#rName{font-size:26px;margin:10px 0 2px;line-height:1.2;word-break:keep-all}
#rRank{display:inline-block;background:#2a2116;color:#ffe08a;padding:3px 12px;border-radius:999px;font-weight:800;font-size:14px}
#rCom{font-weight:800;margin:8px 0 4px;font-size:14px}
#rBest{color:#c9302c;font-weight:800;font-size:15px;animation:blink .8s infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stats div{background:#fffaf0;border-radius:10px;padding:5px 2px;border:2px solid #e4d5b5}
.stats b{display:block;font-size:17px}
.stats span{font-size:10px;color:#8a5a2b;font-weight:800}
#rAch{font-size:12px;color:#c9302c;font-weight:800;min-height:0}
.xbtn{background:#111;color:#fff}

#achList{text-align:left;max-height:56vh;overflow:auto;margin:10px 0}
#achList div{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed #d8c7a5;font-size:13px}
#achList div i{font-style:normal;font-size:22px;width:28px;text-align:center}
#achList div.lock{opacity:.45}
#achList small{display:block;color:#7a6650;font-size:11px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="box"><div class="lbl">高さ</div><div id="hH" class="dg">0.0<small>m</small></div></div>
  <div class="box"><div class="lbl">城の守り</div><div id="lives"></div></div>
  <div class="box" id="nextBox"><div class="lbl">つぎ</div><canvas id="nextCv" width="104" height="88"></canvas></div>
  <button id="mute" aria-label="音の切り替え">🔊</button>
</div>
<div id="ctrl" hidden>
  <button id="rotBtn">↻ 回す</button>
  <button id="doneBtn" disabled>🏯 完成！</button>
</div>
<div id="tapHint" hidden>画面タップで落とす</div>
<div id="banner"><div class="b1 dg" id="bn1"></div><div class="b2" id="bn2"></div></div>
<div id="toasts"></div>

<div id="title" class="ov">
  <div class="panel">
    <div class="logo dg">城<span>つみ</span></div>
    <div class="sub">― なんでも積んで、天下一の城を築け ―</div>
    <button class="big red" id="playBtn">築城をはじめる</button>
    <button class="big gold" id="dailyBtn">📅 今日のお城に挑戦</button>
    <div class="small" id="dailyInfo"></div>
    <div class="row2">
      <button class="big plain" id="achBtn">🏅 実績</button>
      <button class="big plain" id="howBtn">❓ あそび方</button>
    </div>
    <div class="small" id="bestInfo"></div>
    <div class="howto" id="howto" hidden>
      ・<b>タップ</b>で部品を落とす。<b>↻</b>で90度回せる<br>
      ・お堀に落ちると<b>城の守り</b>が1つ減る。3つ無くなると落城<br>
      ・真上にピタッと落とすと<b>「見事！」</b>連続でボーナス<br>
      ・ときどき<b>地震・突風・殿のお成り</b>などが起きる<br>
      ・好きなところで<b>「完成！」</b>を押せば城に名前がつく。画像にしてみんなに自慢しよう<br>
      ・<b>今日のお城</b>は全員同じ部品の順番。友だちと高さを競える
    </div>
  </div>
</div>

<div id="result" class="ov" hidden>
  <div class="panel">
    <img id="cardImg" alt="築いた城">
    <div id="rName" class="dg"></div>
    <div id="rRank"></div>
    <div id="rCom"></div>
    <div id="rBest" hidden>★ 自己ベスト更新！</div>
    <div class="stats">
      <div><b id="sH"></b><span>高さ</span></div>
      <div><b id="sK"></b><span>石高</span></div>
      <div><b id="sC"></b><span>最大「見事」</span></div>
    </div>
    <div id="rAch"></div>
    <div class="row2">
      <button class="big xbtn" id="xBtn">𝕏 でポスト</button>
      <button class="big gold" id="shareBtn">🖼 画像で自慢</button>
    </div>
    <div class="row2">
      <button class="big red" id="againBtn">もう一度</button>
      <button class="big plain" id="topBtn">タイトルへ</button>
    </div>
  </div>
</div>

<div id="achOv" class="ov" hidden>
  <div class="panel">
    <div class="dg" style="font-size:26px">実績</div>
    <div id="achList"></div>
    <button class="big plain" id="achClose">とじる</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
