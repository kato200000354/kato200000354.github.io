<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>無限塔クロニクル</title>
<meta name="description" content="終わりのない塔を登り続けるハクスラ冒険。装備集め・強化・ペット・モンスター図鑑・色違い・実績・転生と、やりこみ要素が山ほど。">
<meta name="theme-color" content="#120f24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#120f24; --panel:#1e1a38; --panel2:#2c2652; --line:#463d7a;
  --gold:#ffd04a; --gold-d:#c98a00; --teal:#5ee6d0; --red:#ff5a6e; --green:#5fd068;
  --text:#f4f0ff; --muted:#a99fd0;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0a0817;color:var(--text);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
select{font-family:inherit}
#app{position:fixed;inset:0;margin:0 auto;max-width:540px;display:flex;flex-direction:column;background:var(--bg)}
.hud{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:linear-gradient(#1b1636,#120f24);border-bottom:1px solid var(--line)}
.floorbox{min-width:0;flex:1}
.fl{font-size:20px;font-weight:900;color:var(--gold);line-height:1.1;white-space:nowrap}
.fl small{font-size:12px;color:var(--muted);font-weight:700;margin-left:4px}
.zn{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:13px;font-weight:800}
.cur .r1{display:flex;gap:10px}
.cur b{font-weight:900}
#stage{position:relative;height:clamp(190px,34vh,330px);flex:none;touch-action:manipulation}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#farmBtn{position:absolute;right:8px;bottom:8px;background:rgba(10,8,23,.72);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;color:#fff}
#farmBtn.farm{background:rgba(255,90,110,.85);border-color:#ffb1bc;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.skills{display:flex;gap:6px;padding:6px 8px;background:#151230;border-bottom:1px solid var(--line);flex:none}
.sk{flex:1;position:relative;height:50px;border-radius:12px;background:linear-gradient(#3a3270,#262046);border:1px solid #5a4fa0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sk .i{font-size:20px;line-height:1;font-family:var(--emoji)}
.sk .n{font-size:9px;font-weight:800;color:#d8d0ff;margin-top:2px;white-space:nowrap}
.sk .cdov{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;pointer-events:none;text-shadow:0 1px 2px #000}
.sk.lock{filter:grayscale(1);opacity:.5}
.sk.act{border-color:var(--gold);box-shadow:0 0 10px rgba(255,208,74,.6) inset}
#panel{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);background:#0d0b1c;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
.tab{padding:6px 0 7px;font-size:10px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tab .i{font-size:20px;line-height:1.1;font-family:var(--emoji);filter:grayscale(.6) opacity(.75)}
.tab.on{color:var(--gold)}
.tab.on .i{filter:none}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;font-weight:900;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.h2{font-size:14px;font-weight:900;color:var(--gold);margin:12px 2px 6px;display:flex;align-items:center;gap:6px}
.h2:first-child{margin-top:0}
.h2 .sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:11px}
.btn{background:linear-gradient(#ffdf75,#eaa61e);color:#3a2300;font-weight:900;border-radius:10px;padding:8px 10px;min-width:84px;box-shadow:0 3px 0 #9a6200;font-size:13px;line-height:1.15}
.btn small{font-size:10px;font-weight:800}
.btn.dis{filter:grayscale(.85) brightness(.6)}
.btn:active:not(.dis){transform:translateY(2px);box-shadow:0 1px 0 #9a6200}
.btn.sub{background:linear-gradient(#433a7c,#2e2858);color:var(--text);box-shadow:0 3px 0 #17132f}
.btn.red{background:linear-gradient(#ff8394,#e0435a);color:#fff;box-shadow:0 3px 0 #8a1f30}
.btn.teal{background:linear-gradient(#8ff5e3,#33c3ab);color:#06322a;box-shadow:0 3px 0 #14806e}
.btn.wide{width:100%}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;color:var(--muted)}
.chip.on{background:var(--gold);color:#3a2300;border-color:var(--gold)}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}
.stats div{display:flex;justify-content:space-between;gap:6px}
.stats b{color:var(--gold);font-weight:900}
.uic{font-size:26px;width:36px;text-align:center;font-family:var(--emoji)}
.ub{flex:1;min-width:0}
.un{font-weight:900;font-size:14px}
.un small{color:var(--teal);font-weight:800;margin-left:4px}
.ud{font-size:11px;color:var(--muted);margin-top:2px}
.gslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.gslot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;min-width:0}
.gslot .lb{font-size:10px;color:var(--muted);font-weight:800}
.gslot .nm{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.gslot .mv{font-size:10px;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.gcell{aspect-ratio:1;border:2px solid var(--rc,#888);border-radius:12px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc,#888) 35%,transparent),#18142e 75%);position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;font-family:var(--emoji);width:100%}
.gcell.big{width:62px;height:62px;margin:4px auto 0;font-size:30px}
.gcell .lv{position:absolute;bottom:1px;right:4px;font-size:10px;font-weight:900;font-family:var(--font);color:#fff;text-shadow:0 1px 2px #000}
.gcell .uparrow{position:absolute;top:1px;left:4px;font-size:11px;font-weight:900;color:var(--green);font-family:var(--font)}
.gcell .lk{position:absolute;top:1px;right:3px;font-size:10px}
.gcell.empty{border-style:dashed;border-color:var(--line);background:#18142e;color:var(--muted);font-size:20px}
.gcell.new::after{content:"NEW";position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font:900 8px var(--font);padding:1px 4px;border-radius:4px}
.dexz{margin-bottom:10px}
.dexg{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.dexc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 0 3px;text-align:center;position:relative}
.dexc .e{font-size:24px;font-family:var(--emoji);line-height:1.2}
.dexc .e.unk{filter:brightness(0) opacity(.45)}
.dexc .st{font-size:8px;color:var(--gold);letter-spacing:-1px;height:10px}
.dexc .sh{position:absolute;top:0;right:2px;font-size:10px}
.dexc.boss{border-color:#a04060}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center}
.pc .e{font-size:30px;font-family:var(--emoji)}
.pc .e.unk{filter:brightness(0) opacity(.4)}
.pc .n{font-size:11px;font-weight:900}
.pc .l{font-size:10px;color:var(--muted)}
.pc.on{border-color:var(--gold);box-shadow:0 0 10px rgba(255,208,74,.4)}
.ach{display:flex;align-items:center;gap:10px}
.ach .t{font-weight:900;font-size:13px}
.ach .d{font-size:11px;color:var(--muted)}
.bar{height:6px;background:#0e0b1e;border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#9ff7ea)}
.ach.done{opacity:.5}
.ach.ready{border-color:var(--gold)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;font-weight:700}
.tg+.tg{border-top:1px solid var(--line)}
.sw{width:46px;height:26px;border-radius:13px;background:#3a335e;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--teal)}
.sw.on::after{left:23px}
.sel{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 54px);width:min(88vw,400px);display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:30}
.toast{background:rgba(20,16,44,.9);border:1px solid var(--tc,var(--line));border-left:4px solid var(--tc,var(--gold));border-radius:9px;padding:5px 10px;font-size:11px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
#modal{position:fixed;inset:0;background:rgba(5,3,14,.72);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;width:min(100%,400px);max-height:86vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mbox h3{margin:0 0 8px;font-size:18px;font-weight:900;color:var(--gold);text-align:center}
.mbox p{font-size:13px;line-height:1.6;margin:6px 0}
.mbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mbtns .btn{flex:1}
.gd{text-align:center}
.gd .gname{font-size:17px;font-weight:900;margin-top:6px;color:var(--rc)}
.gd .grar{font-size:11px;color:var(--muted)}
.gd .gmain{font-size:16px;font-weight:900;margin:8px 0 4px}
.gd .gsub{font-size:12px;color:#d8d0ff;line-height:1.7}
.gd .cmp{font-size:11px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.up-g{color:var(--green)}.dn-g{color:var(--red)}
textarea{width:100%;height:120px;background:#0e0b1e;color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:11px;padding:8px;font-family:monospace}
.big-e{font-size:56px;text-align:center;font-family:var(--emoji);line-height:1.2}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.kv b{color:var(--gold)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shop .card{margin:0;text-align:center;padding:10px 6px}
.shop .e{font-size:28px;font-family:var(--emoji)}
.shop .n{font-weight:900;font-size:12px;margin:2px 0 6px}
.lockmsg{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px;line-height:1.8}
.lockmsg .big-e{filter:grayscale(1)}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="floorbox"><div class="fl" id="hFloor">1F</div><div class="zn" id="hZone"></div></div>
    <div class="cur">
      <div class="r1"><span>💰<b id="hGold">0</b></span><span>💎<b id="hGems">0</b></span></div>
      <div class="r1"><span>🪨<b id="hStones">0</b></span><span>🔮<b id="hSouls">0</b></span></div>
    </div>
  </header>
  <div id="stage"><canvas id="cv"></canvas><button id="farmBtn" data-act="farm"></button></div>
  <div class="skills" id="skills"></div>
  <main id="panel"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="toasts"></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
