<title>あかちゃんをまもれ！</title>
<style>
html,body{margin:0;height:100%;background:#3a2f4f;overflow:hidden;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic UI","Meiryo",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#box{position:relative}
#game{display:block;width:100%;height:100%;touch-action:none;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,25,60,.55);border-radius:14px;backdrop-filter:blur(2px)}
#ov.show{display:flex}
.panel{width:86%;max-width:360px;max-height:92%;overflow:auto;box-sizing:border-box;background:#fffaf2;border-radius:22px;padding:20px 18px;text-align:center;color:#4a3a5c;box-shadow:0 8px 0 #f3c9d8,0 14px 30px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.panel h1{margin:0 0 4px;font-size:30px;line-height:1.2;color:#ff7aa2;text-shadow:0 3px 0 #ffe0ea}
.panel h2{margin:0 0 8px;font-size:26px;color:#ff7aa2}
.panel .sub{font-size:13px;color:#8d7ba0;margin-bottom:10px}
.how{text-align:left;font-size:13.5px;line-height:1.65;background:#fff;border-radius:14px;padding:10px 12px;margin:10px 0;border:2px dashed #f6cfdc}
.how b{color:#ff6f96}
.big{font-size:40px;font-weight:bold;color:#ff7aa2;margin:4px 0}
.rank{font-size:18px;font-weight:bold;color:#6a58a0;margin-bottom:6px}
.tips{text-align:left;font-size:12.5px;line-height:1.55;background:#fff7e6;border-radius:12px;padding:8px 10px;margin:8px 0;color:#6b5330}
.tips div{margin:3px 0}
button{font-family:inherit;font-size:19px;font-weight:bold;border:none;border-radius:999px;padding:12px 30px;margin:6px 4px 0;background:#ff7aa2;color:#fff;box-shadow:0 5px 0 #d9567d;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #d9567d}
button.sm{font-size:13px;padding:7px 14px;background:#b9a6d8;box-shadow:0 4px 0 #8f7bb5}
</style>
