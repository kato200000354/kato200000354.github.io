<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>海の伝説 ～夢をつかめ～</title>
<style>
  :root {
    --bg: #060d1f;
    --panel: #0c1730;
    --panel2: #101f3f;
    --line: #22406f;
    --text: #e8f1ff;
    --dim: #8ea5c8;
    --gold: #ffd54a;
    --gold2: #ff9f1c;
    --red: #ff3b3b;
    --green: #4dffa0;
    --blue: #3da0ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 40% 0%, #12285a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic", "Meiryo", sans-serif;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }

  #app {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr) 340px;
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "side board panel" "side bottom bottom";
    gap: 10px; padding: 10px;
    height: 100vh; height: 100dvh;
    max-width: 1500px; margin: 0 auto;
  }

  /* サイドメニュー */
  #side { grid-area: side; display: flex; flex-direction: column; gap: 10px; }
  .sbtn {
    background: linear-gradient(180deg, #16284d, #0b1631);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700;
  }
  .sbtn .ic { font-size: 24px; line-height: 1; }
  .sbtn:hover { border-color: #4a7bc0; }

  /* 盤面 */
  #boardWrap {
    grid-area: board; position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 22px;
    background: linear-gradient(135deg, #8a0d18, #2a0308 40%, #1a0206 60%, #8a0d18);
    box-shadow: inset 0 0 0 3px #3a0a10, 0 0 30px rgba(255, 40, 60, .25);
    padding: 10px;
  }
  #board { display: block; touch-action: manipulation; }
  #title {
    position: absolute; left: 14px; top: 10px; pointer-events: none;
    font-weight: 900; line-height: 1.05; text-align: center;
  }
  #title .t1 {
    font-size: clamp(20px, 3.2vw, 38px); letter-spacing: 2px;
    background: linear-gradient(180deg, #fffbe0, #ffd54a 45%, #ff8a1c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(80, 30, 0, .6);
    filter: drop-shadow(0 2px 0 #1a4fb0) drop-shadow(0 0 8px rgba(80,180,255,.7));
  }
  #title .t2 {
    font-size: clamp(10px, 1.4vw, 15px); color: #fff; margin-top: 2px;
    text-shadow: 0 0 6px #1a8cff, 0 1px 0 #003;
  }
  #shootHint {
    position: absolute; right: 16px; top: 14px; padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 60, 60, .9); font-weight: 900; font-size: 14px;
    box-shadow: 0 0 14px rgba(255, 60, 60, .8); display: none;
    animation: pulse .6s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  /* 右パネル */
  #panel { grid-area: panel; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
  .card {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
  .lbl { font-size: 13px; font-weight: 700; color: #cfe0ff; }
  .big { font-size: 34px; font-weight: 900; color: #fff3c4; text-align: right; font-variant-numeric: tabular-nums;
         text-shadow: 0 0 10px rgba(255, 213, 74, .45); }
  .big small, .mid small { font-size: 13px; margin-left: 3px; color: #ffe9a0; }
  .ballIcon { display: inline-block; width: 22px; height: 22px; border-radius: 50%; vertical-align: middle;
              background: radial-gradient(circle at 35% 30%, #fff, #b9c2cf 40%, #4c5563 80%); }
  .prob { font-size: 26px; font-weight: 900; text-align: center; margin-top: 6px; background: #081126;
          border-radius: 8px; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .prob.k { color: #ff7ad9; text-shadow: 0 0 8px #ff3dc8; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stats3 > div + div { border-left: 1px solid var(--line); }
  .mid { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 4px; }
  #chartHead { display: flex; justify-content: space-between; align-items: baseline; }
  #income { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #income.plus { color: var(--green); } #income.minus { color: #ff6b6b; }
  #chart { width: 100%; height: 120px; display: block; margin-top: 4px; }

  #banner {
    position: relative; border-radius: 14px; overflow: hidden; min-height: 92px;
    border: 2px solid #ffcf5a; padding: 10px 14px;
    background: linear-gradient(120deg, #0b3a7a, #0a6bb0 50%, #0b3a7a);
    display: flex; align-items: center; gap: 8px;
  }
  #banner .bText { flex: 1; z-index: 1; }
  #banner .b1 { font-size: 30px; font-weight: 900; line-height: 1.1;
    background: linear-gradient(180deg, #fff, #ffe066 50%, #ff8a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(120, 0, 0, .5); filter: drop-shadow(0 2px 0 #600); }
  #banner .b2 { display: inline-block; margin-top: 4px; padding: 2px 14px; border-radius: 6px; font-weight: 900;
    background: linear-gradient(180deg, #ff4d4d, #b00000); border: 1px solid #ffd54a; font-size: 15px; }
  #banner .bChar { font-size: 56px; z-index: 1; filter: drop-shadow(0 0 8px rgba(255,255,255,.6)); }
  #banner.jp { background: linear-gradient(120deg, #ff3b3b, #ffb300, #ff3dc8, #3dd6ff, #ff3b3b); background-size: 300% 100%;
               animation: rainbow 2s linear infinite; }
  #banner.kaku { background: linear-gradient(120deg, #4a0b7a, #b02ad0 50%, #4a0b7a); }
  #banner.jitan { background: linear-gradient(120deg, #064f4a, #0aa58f 50%, #064f4a); }
  @keyframes rainbow { to { background-position: 300% 0; } }

  .custom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .cbtn { background: #0a1630; border: 1px solid #2c4c80; border-radius: 10px; padding: 10px 2px; font-weight: 700; font-size: 13px; }
  .cbtn.on { background: linear-gradient(180deg, #3aa0ff, #1060d0); border-color: #9fd2ff; box-shadow: 0 0 12px rgba(60, 160, 255, .7); }

  /* 下段 */
  #bottom { grid-area: bottom; display: grid; grid-template-columns: 1.15fr 1fr auto auto; gap: 10px; align-items: stretch; }
  #effect .msg { background: #081126; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0 8px;
                 font-size: 14px; font-weight: 700; min-height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #effect .msg::before { content: "◆ "; color: var(--red); }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mode { background: #0a1630; border: 1px solid #2c4c80; border-radius: 9px; text-align: center; padding: 5px 0 4px; font-size: 12px; font-weight: 700; opacity: .55; }
  .mode .ic { font-size: 20px; display: block; }
  .mode.on { opacity: 1; background: linear-gradient(180deg, #ff5a3a, #c0101a); border-color: #ffb3a0; box-shadow: 0 0 12px rgba(255, 70, 50, .7); }
  #nowSym .syms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  #nowSym canvas { width: 100%; aspect-ratio: 1.1; background: radial-gradient(circle, #1e4f9a, #0a1a3a); border-radius: 8px; border: 1px solid #2c4c80; display: block; }
  #pushBtn {
    width: 150px; height: 150px; border-radius: 50%; align-self: center;
    border: 8px solid #2b2f38;
    background: radial-gradient(circle at 50% 35%, #ff7a7a, #e00000 55%, #6a0000);
    box-shadow: 0 0 0 4px #8a919c, 0 6px 0 #1a1a1a, 0 0 18px rgba(255, 0, 0, .4), inset 0 -8px 14px rgba(0,0,0,.4);
    font-size: 34px; font-weight: 900; color: #ffe066; letter-spacing: 1px;
    text-shadow: 0 2px 0 #7a3a00, 0 0 8px rgba(255, 230, 100, .8);
    transition: transform .06s;
  }
  #pushBtn:active { transform: translateY(4px) scale(.97); }
  #pushBtn.chance { animation: pushGlow .25s infinite alternate; }
  @keyframes pushGlow { from { box-shadow: 0 0 0 4px #ffd54a, 0 0 20px #ff0, 0 0 50px #f00; } to { box-shadow: 0 0 0 4px #fff, 0 0 40px #ff0, 0 0 80px #f00; } }

  #handleBox { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 170px; }
  #knobRow { display: flex; align-items: center; gap: 10px; }
  #knob {
    width: 84px; height: 84px; border-radius: 50%; position: relative; touch-action: none; cursor: grab;
    background: radial-gradient(circle at 35% 30%, #f4f6f9, #9aa3b0 45%, #3c434e 85%);
    border: 3px solid #1d2128; box-shadow: 0 4px 10px rgba(0,0,0,.6);
  }
  #knob::after { content: ""; position: absolute; left: 50%; top: 6px; width: 6px; height: 26px; margin-left: -3px;
                 border-radius: 3px; background: #ff4040; box-shadow: 0 0 6px #f00; }
  #knob.firing { box-shadow: 0 0 0 3px #4dffa0, 0 0 16px #4dffa0; }
  #powerBar { width: 12px; height: 84px; border-radius: 6px; background: #081126; border: 1px solid var(--line); position: relative; overflow: hidden; }
  #powerFill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #3da0ff, #ffd54a, #ff3b3b); }
  .hrow { display: flex; gap: 6px; width: 100%; }
  .hbtn { flex: 1; background: #0a1630; border: 1px solid #2c4c80; border-radius: 8px; padding: 6px 0; font-size: 12px; font-weight: 700; }
  .hbtn.on { background: #1b6a3f; border-color: #4dffa0; }
  #lend { width: 100%; background: linear-gradient(180deg, #2a3550, #141b2c); border: 1px solid #4a5b80; border-radius: 10px; padding: 6px 0; font-weight: 900; font-size: 15px; }
  #lend small { display: block; font-size: 11px; color: var(--dim); font-weight: 700; }

  /* モーダル */
  #modal { position: fixed; inset: 0; background: rgba(0, 4, 16, .75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #modal.show { display: flex; }
  #modalBox { background: linear-gradient(180deg, #13254a, #0a1430); border: 2px solid #3d6bb0; border-radius: 16px;
              width: min(520px, 100%); max-height: 86vh; overflow-y: auto; padding: 18px 20px; }
  #modalBox h2 { margin: 0 0 12px; font-size: 22px; color: var(--gold); }
  #modalBox p, #modalBox li { line-height: 1.7; font-size: 14px; }
  #modalBox ul { padding-left: 1.2em; margin: 6px 0; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #2c4c80; flex-wrap: wrap; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { background: #0a1630; border: 1px solid #2c4c80; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 13px; }
  .seg button.on { background: #1060d0; border-color: #9fd2ff; }
  .mclose { margin-top: 14px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #4a7bc0; background: #16305e; font-weight: 900; font-size: 15px; }
  .danger { background: #6a1010 !important; border-color: #ff6b6b !important; }
  .ach { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed #2c4c80; }
  .ach .ai { font-size: 24px; width: 32px; text-align: center; }
  .ach.lock { opacity: .4; }
  table.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rank td, table.rank th { padding: 6px; border-bottom: 1px solid #2c4c80; text-align: center; }

  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: linear-gradient(180deg, #ffe066, #ff9f1c);
           color: #3a1a00; font-weight: 900; padding: 8px 18px; border-radius: 999px; z-index: 60; display: none; box-shadow: 0 4px 18px rgba(0,0,0,.5); }

  /* スマホ・縦長 */
  @media (max-width: 980px) {
    #app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto auto;
      grid-template-areas: "side" "board" "bottom" "panel";
      height: auto; padding: 8px 16px 20px;
    }
    #side { flex-direction: row; }
    .sbtn { flex: 1; padding: 6px 2px; }
    .sbtn .ic { font-size: 18px; }
    #boardWrap { padding: 6px; }
    #bottom { grid-template-columns: 1fr 1fr; }
    #effect { grid-column: 1 / -1; }
    #nowSym { grid-column: 1 / -1; }
    #nowSym .syms { max-width: 300px; margin: 6px auto 0; }
    #pushBtn { width: 120px; height: 120px; font-size: 28px; justify-self: center; }
    #handleBox { width: 100%; }
    #panel { overflow: visible; }
  }
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <button class="sbtn" data-m="menu"><span class="ic">☰</span>メニュー</button>
    <button class="sbtn" data-m="settings"><span class="ic">⚙️</span>設定</button>
    <button class="sbtn" data-m="howto"><span class="ic">📖</span>遊び方</button>
    <button class="sbtn" data-m="ach"><span class="ic">🏆</span>実績</button>
    <button class="sbtn" data-m="rank"><span class="ic">📊</span>ランキング</button>
  </nav>

  <section id="boardWrap">
    <canvas id="board" width="600" height="600"></canvas>
    <div id="title"><div class="t1">海の伝説</div><div class="t2">～夢をつかめ～</div></div>
    <div id="shootHint">右打ち ⇒</div>
  </section>

  <aside id="panel">
    <div class="row2">
      <div class="card">
        <div class="lbl">持ち玉</div>
        <div class="big"><span class="ballIcon" style="float:left;margin-top:12px"></span><span id="balls">0</span><small>玉</small></div>
      </div>
      <div class="card">
        <div class="lbl" style="text-align:center">大当り確率</div>
        <div class="prob" id="prob">1/99</div>
      </div>
    </div>
    <div class="card stats3">
      <div><div class="lbl">初当たり</div><div class="mid"><span id="sFirst">0</span><small>回</small></div></div>
      <div><div class="lbl">確変</div><div class="mid"><span id="sKaku">0</span><small>回</small></div></div>
      <div><div class="lbl">連チャン</div><div class="mid"><span id="sRen">0</span><small>連</small></div></div>
    </div>
    <div class="card">
      <div id="chartHead"><span class="lbl">本日の収支</span><span id="income" class="plus">±0<small>円</small></span></div>
      <canvas id="chart"></canvas>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px">
        <span>回転数 <b id="sSince" style="color:#fff">0</b></span><span>総回転 <b id="sSpins" style="color:#fff">0</b></span><span>投資 <b id="sInvest" style="color:#fff">0</b>円</span>
      </div>
    </div>
    <div id="banner">
      <div class="bText"><div class="b1" id="b1">通常モード</div><div class="b2" id="b2">ヘソを狙え！</div></div>
      <div class="bChar" id="bChar">🧜‍♀️</div>
    </div>
    <div class="card">
      <div class="lbl">演出カスタム</div>
      <div class="custom">
        <button class="cbtn" data-c="normal">ノーマル</button>
        <button class="cbtn" data-c="saki">先読みチャンス</button>
        <button class="cbtn" data-c="kokuchi">告知重視</button>
      </div>
    </div>
  </aside>

  <div id="bottom">
    <div class="card" id="effect">
      <div class="lbl">🔊 演出</div>
      <div class="msg" id="msg">図柄が揃うと大当りです！</div>
      <div class="modes">
        <div class="mode" id="mNormal"><span class="ic">🐟</span>通常</div>
        <div class="mode" id="mKaku"><span class="ic">🔥</span>確変</div>
        <div class="mode" id="mJitan"><span class="ic">⏱️</span>時短</div>
        <div class="mode" id="mSp"><span class="ic">⭐</span>スペシャル</div>
      </div>
    </div>
    <div class="card" id="nowSym">
      <div class="lbl">現在の図柄</div>
      <div class="syms"><canvas id="ns0" width="120" height="110"></canvas><canvas id="ns1" width="120" height="110"></canvas><canvas id="ns2" width="120" height="110"></canvas></div>
    </div>
    <button id="pushBtn">PUSH</button>
    <div class="card" id="handleBox">
      <div id="knobRow">
        <div id="knob" title="クリックで発射ON/OFF・上下ドラッグで強さ"></div>
        <div id="powerBar"><div id="powerFill"></div></div>
      </div>
      <div class="hrow">
        <button class="hbtn" id="fireBtn">発射</button>
        <button class="hbtn" id="leftBtn">左打ち</button>
        <button class="hbtn" id="rightBtn">右打ち</button>
      </div>
      <button id="lend">玉貸し<small>500円 / 125玉</small></button>
    </div>
  </div>
</div>

<div id="modal"><div id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
// ==PHYSICS START==
const BW = 600, CX = 300, CY = 300, RO = 288, BR = 4.5, NR = 2.2, GRAV = 720;
const LANE_IN = RO - 15;          // 発射レールの内側レール半径
const DEG = Math.PI / 180;
const LCD = { x1: 188, x2: 412, top: 134, peak: 94, bot: 362 };
const HESO = { x: 300, y: 420 };
const ATK = { x1: 412, x2: 494, y1: 469, y2: 484 };
const CHU = { x: 530, y: 443 };          // 右ルート誘導板の途中にある電チュー
const GATE = { x: 574, y: 227 };         // 外周沿いのスルーゲート
const FUZU = { x: 538, y: 262 };
const POCKETS = [{ x: 92, y: 418 }, { x: 214, y: 476 }];
const MILLS = [{ x: 112, y: 262, r: 8, dir: 1 }, { x: 512, y: 340, r: 8, dir: -1 }];
const WARP = { x: 183.5, y: 236 };
const STAGE_Y = 370;
const RUBBER_A = 24;

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildBoard() {
  const segs = [], nails = [];
  const S = (x1, y1, x2, y2, e = 0.35, tag = '') => segs.push({ x1, y1, x2, y2, e, tag });
  // 液晶枠（屋根つき）
  S(LCD.x1, LCD.bot, LCD.x1, LCD.top); S(LCD.x1, LCD.top, CX, LCD.peak); S(CX, LCD.peak, LCD.x2, LCD.top);
  S(LCD.x2, LCD.top, LCD.x2, LCD.bot); S(LCD.x1, LCD.bot, LCD.x2, LCD.bot);
  // ヘソ（スタートチャッカー）
  S(HESO.x - 11, HESO.y - 2, HESO.x - 11, HESO.y + 12, 0.3); S(HESO.x + 11, HESO.y - 2, HESO.x + 11, HESO.y + 12, 0.3);
  // 一般入賞口
  for (const p of POCKETS) { S(p.x - 11, p.y, p.x - 11, p.y + 12, 0.3); S(p.x + 11, p.y, p.x + 11, p.y + 12, 0.3); }
  // アタッカー
  S(ATK.x1 - 1, ATK.y1 + 4, ATK.x2 + 1, ATK.y1 - 1, 0.25, 'atkLid');
  // 右ルートの誘導板（外周 → 電チュー → アタッカー）。電チューは開放中に誘導板の一部が入口になる
  const ra = RUBBER_A * DEG;
  const gx1 = CX + (RO + 2) * Math.cos(ra), gy1 = CY + (RO + 2) * Math.sin(ra), gx2 = ATK.x2 + 1, gy2 = ATK.y1 - 1;
  const gl = Math.hypot(gx2 - gx1, gy2 - gy1), ux = (gx2 - gx1) / gl, uy = (gy2 - gy1) / gl;
  const ct = (CHU.x - gx1) * ux + (CHU.y - gy1) * uy;
  const ax = gx1 + ux * (ct - 12), ay = gy1 + uy * (ct - 12), bx = gx1 + ux * (ct + 12), by = gy1 + uy * (ct + 12);
  S(gx1, gy1, ax, ay, 0.05, 'guide'); S(ax, ay, bx, by, 0.05, 'chuLid'); S(bx, by, gx2, gy2, 0.05, 'guide');

  // 道釘（左からヘソへ）
  const road = [];
  for (let i = 0; ; i++) {
    const t = i * 9 / Math.hypot(276 - 128, 405 - 372);
    if (t > 1) break;
    if (i === 6 || i === 11) continue;                 // こぼし
    road.push({ x: 128 + (276 - 128) * t, y: 372 + (405 - 372) * t });
  }
  nails.push(...road);
  // ヘソ命釘
  nails.push({ x: HESO.x - 15, y: HESO.y - 9 }, { x: HESO.x + 15, y: HESO.y - 9 }, { x: HESO.x - 24, y: HESO.y - 6 }, { x: HESO.x + 24, y: HESO.y - 6 });
  // 風車まわり・入賞口上の釘
  for (const p of POCKETS) nails.push({ x: p.x - 14, y: p.y - 8 }, { x: p.x + 14, y: p.y - 8 });
  nails.push({ x: ATK.x1 - 18, y: ATK.y1 - 30 });

  const rnd = mulberry(20261005);
  const near = (x, y, px, py, r) => (x - px) ** 2 + (y - py) ** 2 < r * r;
  const segDist = (x, y, s) => { const ex = s.x2 - s.x1, ey = s.y2 - s.y1; let t = ((x - s.x1) * ex + (y - s.y1) * ey) / (ex * ex + ey * ey); t = Math.max(0, Math.min(1, t)); return Math.hypot(x - s.x1 - ex * t, y - s.y1 - ey * t); };
  for (let row = 0, y = 38; y < 540; y += 19, row++) {
    for (let x = 20 + (row % 2) * 10; x < 590; x += 20) {
      const d = Math.hypot(x - CX, y - CY);
      if (d > RO - 16) continue;
      const a = ((Math.atan2(y - CY, x - CX) / DEG) + 360) % 360;
      if (a > 112 && a < 212 && d > LANE_IN - 14) continue;
      if (x > LCD.x1 - 14 && x < LCD.x2 + 14 && y > LCD.peak - 14 && y < LCD.bot + 12) continue;
      if (x > 238 && x < 362 && y > LCD.bot && y < HESO.y + 20) continue;   // ステージ下はヘソへ素通し
      if (y > HESO.y - 30 && Math.abs(x - HESO.x) < 34) continue;
      if (near(x, y, WARP.x, WARP.y, 16)) continue;
      if (POCKETS.some(p => near(x, y, p.x, p.y + 4, 22))) continue;
      if (MILLS.some(m => near(x, y, m.x, m.y, 20))) continue;
      if (near(x, y, GATE.x, GATE.y, 22) || near(x, y, CHU.x, CHU.y, 36)) continue;
      if (x > ATK.x1 - 22 && y > ATK.y1 - 34) continue;
      if (road.some(r => near(x, y, r.x, r.y, 15))) continue;
      if (y > 372 && x < 290 && y > 372 + (x - 128) * 33 / 148 - 6 && y < 372 + (x - 128) * 33 / 148 + 12) continue;
      if (segs.some(s => segDist(x, y, s) < 11)) continue;
      const keep = x > LCD.x2 ? 0.42 : 0.62;
      if (rnd() > keep) continue;
      nails.push({ x, y });
    }
  }
  // 発射レール先端
  const ta = 208 * DEG;
  nails.push({ x: CX + LANE_IN * Math.cos(ta), y: CY + LANE_IN * Math.sin(ta), r: 3 });

  // 釘の空間グリッド
  const grid = new Map();
  for (const n of nails) {
    n.r = n.r || NR;
    const k = ((n.x / 16) | 0) + ((n.y / 16) | 0) * 64;
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(n);
  }
  return { segs, nails, grid };
}

function powerToSpeed(p) { return 640 + p * 560; }

function launchBall(power, rnd) {
  const a = 128 * DEG, r = RO - BR - 3;
  const v = powerToSpeed(power) * (1 + (rnd() - 0.5) * 0.02);
  return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a), vx: -Math.sin(a) * v, vy: Math.cos(a) * v, lane: true, still: 0, stage: null, gate: false, warped: false };
}

function radial(b, dx, dy, d, lim, e, outward) {
  const nx = dx / d, ny = dy / d;
  b.x = CX + nx * lim; b.y = CY + ny * lim;
  const vn = b.vx * nx + b.vy * ny;
  if (outward ? vn > 0 : vn < 0) { b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny; }
}

// 1ステップ進める。戻り値: null（続行）または イベント名（玉は消える）
function stepBall(b, dt, B, st, rnd) {
  if (b.stage) {
    const s = b.stage; s.t += dt;
    b.x = CX + s.amp * Math.sin(s.t * 4.2 + s.ph) * Math.max(0, 1 - s.t / s.dur * 0.6); b.y = STAGE_Y;
    if (s.t >= s.dur) { b.stage = null; b.vx = (rnd() - 0.5) * 30; b.vy = 20; }
    return null;
  }
  b.vy += GRAV * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;
  const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy);
  const ang = ((Math.atan2(dy, dx) / DEG) + 360) % 360;
  if (!b.lane && ang > 112 && ang < 208 && d > LANE_IN) b.lane = true;   // レールに戻った
  if (b.lane) {
    if (ang >= 208 || ang < 90) b.lane = false;
    else {
      if (d > RO - BR) radial(b, dx, dy, d, RO - BR, 0.1, true);
      else if (d < LANE_IN + 1.5 + BR) radial(b, dx, dy, d, LANE_IN + 1.5 + BR, 0.3, false);
      if (ang < 124 && b.vy > 0) return 'foul';
      return null;
    }
  }
  {
    const inRail = ang > 112 && ang < 208;
    const lim = inRail ? LANE_IN - 1.5 - BR : RO - BR;
    if (d > lim) radial(b, dx, dy, d, lim, 0.25, true);
  }
  // 釘
  const gx = (b.x / 16) | 0, gy = (b.y / 16) | 0;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    const cell = B.grid.get(gx + ox + (gy + oy) * 64);
    if (!cell) continue;
    for (const n of cell) {
      const ex = b.x - n.x, ey = b.y - n.y, rr = BR + n.r, d2 = ex * ex + ey * ey;
      if (d2 < rr * rr) {
        const dd = Math.sqrt(d2) || 1e-4, nx = ex / dd, ny = ey / dd;
        b.x = n.x + nx * rr; b.y = n.y + ny * rr;
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) {
          b.vx -= 1.5 * vn * nx; b.vy -= 1.5 * vn * ny;
          const j = (rnd() - 0.5) * 24; b.vx += -ny * j; b.vy += nx * j;
          b.vx *= 0.97; b.vy *= 0.97;
        }
      }
    }
  }
  // 壁
  for (const s of B.segs) {
    if (s.tag === 'atkLid' && st.atkOpen) continue;
    const ex = s.x2 - s.x1, ey = s.y2 - s.y1;
    let t = ((b.x - s.x1) * ex + (b.y - s.y1) * ey) / (ex * ex + ey * ey);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = s.x1 + ex * t, py = s.y1 + ey * t;
    const qx = b.x - px, qy = b.y - py, d2 = qx * qx + qy * qy, rr = BR + 1.5;
    if (s.tag === 'chuLid' && st.chuOpen && d2 < 18 * 18 && qy < 0) return 'chu';   // 開いた羽根が上の玉を拾う
    if (d2 < rr * rr) {
      const dd = Math.sqrt(d2) || 1e-4, nx = qx / dd, ny = qy / dd;
      b.x = px + nx * rr; b.y = py + ny * rr;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= (1 + s.e) * vn * nx; b.vy -= (1 + s.e) * vn * ny; }
    }
  }
  // 風車
  for (const m of MILLS) {
    const ex = b.x - m.x, ey = b.y - m.y, rr = BR + m.r, d2 = ex * ex + ey * ey;
    if (d2 < rr * rr) {
      const dd = Math.sqrt(d2) || 1e-4, nx = ex / dd, ny = ey / dd;
      b.x = m.x + nx * rr; b.y = m.y + ny * rr;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny; }
      b.vx += -ny * m.dir * 90 * dt * 60 * 0.08; b.vy += nx * m.dir * 90 * dt * 60 * 0.08;
    }
  }
  const sp = Math.hypot(b.vx, b.vy);
  if (sp > 1500) { b.vx *= 1500 / sp; b.vy *= 1500 / sp; }
  b.still = sp < 25 ? b.still + dt : 0;
  if (b.still > 2) { b.vx += (rnd() - 0.5) * 120; b.vy -= 40; b.still = 0; b.stuck = (b.stuck || 0) + 1; if (b.stuck > 4) return 'out'; }

  // 入賞判定
  if (b.vy > 0 && Math.abs(b.x - HESO.x) < 9.5 && b.y > HESO.y && b.y < HESO.y + 12) return 'heso';
  if (st.atkOpen && b.x > ATK.x1 && b.x < ATK.x2 && b.y > ATK.y1 - 2 && b.y < ATK.y2) return 'atk';
  for (let i = 0; i < POCKETS.length; i++) { const p = POCKETS[i]; if (b.vy > 0 && Math.abs(b.x - p.x) < 9.5 && b.y > p.y + 3 && b.y < p.y + 12) return 'pocket'; }
  const inGate = Math.abs(b.x - GATE.x) < 8.5 && Math.abs(b.y - GATE.y) < 6;
  if (inGate && !b.gate) { b.gate = true; b.ev = 'gate'; } else if (!inGate) b.gate = false;
  if (!b.warped && (b.x - WARP.x) ** 2 + (b.y - WARP.y) ** 2 < 16) {
    b.warped = true;
    b.stage = { t: 0, dur: 1.2 + rnd() * 1.6, amp: 20 + rnd() * 40, ph: rnd() * 6.28 };
    b.ev = 'warp';
  }
  if (b.y > 548) return 'out';
  return null;
}
// ==PHYSICS END==

}

function kakuProb() { return Math.max(8, Math.round(S.settings.prob / 10)); }
function curProb() { return S.mode === 'kakuhen' ? kakuProb() : S.settings.prob; }
function wpick(obj) { let t = 0; for (const k in obj) t += obj[k]; let r = rand() * t; for (const k in obj) { r -= obj[k]; if (r < 0) return k; } return Object.keys(obj)[0]; }

function lottery(fromChu) {
  const hit = rand() < 1 / curProb();
  const c = S.custom;
  const res = { hit, fromChu, kaku: false, sym: [1, 2, 3], reach: null, color: 'white', lamp: false };
  if (hit) {
    res.kaku = rand() < (fromChu ? 0.65 : 0.5);
    const s = res.kaku ? +wpick({ 1: 1, 3: 1, 5: 1, 7: 1.5 }) : +wpick({ 2: 1, 4: 1, 6: 1, 8: 1 });
    res.sym = [s, s, s];
    res.reach = (s === 7 && rand() < 0.35) ? 'all' : wpick({ normal: 15, sp: 45, legend: 40 });
    res.color = wpick(c === 'saki' ? { white: 15, blue: 25, green: 25, red: 25, rainbow: 10 } : { white: 35, blue: 20, green: 18, red: 20, rainbow: 7 });
    res.lamp = rand() < (c === 'kokuchi' ? 0.5 : 0.12);
  } else {
    const reachRate = c === 'kokuchi' ? 0.05 : 0.1;
    if (rand() < reachRate) {
      res.reach = wpick({ normal: 78, sp: 19, legend: 3 });
      const s = 1 + (rand() * 8 | 0);
      const off = rand() < 0.7 ? (rand() < 0.5 ? 1 : 7) : 1 + (rand() * 7 | 0);
      res.sym = [s, ((s - 1 + off) % 8) + 1, s];
      const tbl = res.reach === 'legend' ? { white: 50, blue: 20, green: 15, red: 15 } : res.reach === 'sp' ? { white: 70, blue: 18, green: 8, red: 4 } : { white: 92, blue: 7, green: 1 };
      res.color = c === 'kokuchi' ? 'white' : wpick(tbl);
    } else {
      const l = 1 + (rand() * 8 | 0); let r = 1 + (rand() * 8 | 0); if (r === l) r = (r % 8) + 1;
      res.sym = [l, 1 + (rand() * 8 | 0), r];
      if (c === 'saki') res.color = wpick({ white: 85, blue: 13, green: 2 });
    }
  }
  return res;
}

function addHold(fromChu) {

function updateSpin(dt) {
  const sp = S.spin; if (!sp) return;
  if (pushWait) {
    pushWait.t -= dt;
    if (pushWait.t <= 0) resolvePush(false);
    for (let i = 0; i < 3; i++) if (!sp.stopped[i]) sp.pos[i] += dt * 1.5;
    return;
  }
  sp.t += dt;
  const r = sp.res;
  const all = r.reach === 'all';
  const stopT = [sp.tl, sp.tc, sp.tr];
  for (let i = 0; i < 3; i++) {
    if (sp.stopped[i]) continue;
    let speed = 14;
    if (i === 1 && sp.t > sp.tr && r.reach) speed = sp.t > sp.tc - 1.2 ? 2.2 : 5;
    if (all && sp.t > sp.tl) speed = 3.2;
    sp.pos[i] += dt * speed;
    const st = all ? sp.tc : stopT[i];
    if (sp.t >= st) { sp.stopped[i] = true; sp.stopAt[i] = sp.t; SFX.stop(); }
  }
  if (!sp.reached && r.reach && sp.t >= (all ? sp.tl : sp.tr)) {
    sp.reached = true; SFX.reach();
    setMsg(all ? '全回転！！ 大当り確定！！' : r.reach === 'legend' ? '伝説リーチ発展！！ 激アツ！！' : r.reach === 'sp' ? 'SPリーチ「サメ襲来」発展！' : 'リーチ！');

    sp.pushed = true; pushWait = { t: 4 }; $('pushBtn').classList.add('chance'); setMsg('PUSHボタンを押せ！！');

  if (sp.t >= sp.tc && !sp.resolved) {

    S.spin = null;

    else if (S.mode === 'jitan') {
      S.jitanLeft--;
      if (S.jitanLeft <= 0) endChain('時短終了… 通常モードへ');

  }
}

  j.t += dt;
  if (j.phase === 'intro' && j.t > 3) { j.phase = 'open'; j.t = 0; j.round = 1; j.count = 0; SFX.open(); }
  else if (j.phase === 'open' && (j.count >= 10 || j.t > 25)) {
    if (j.round >= j.rounds) { j.phase = 'ending'; j.t = 0; SFX.hit(); }
    else { j.phase = 'interval'; j.t = 0; }
  } else if (j.phase === 'interval' && j.t > 1.4) {
    j.phase = 'open'; j.t = 0; j.round = Math.max(1, j.round + (j.round === 0 ? 1 : 1)); j.count = 0; SFX.open();
  } else if (j.phase === 'ending' && j.t > 3.5) {
    S.jp = null;
    if (j.kaku) { S.mode = 'kakuhen'; setMsg('確変突入！！ 次回大当りまで確率アップ！'); }
    else { S.mode = 'jitan'; S.jitanLeft = 100; setMsg('時短100回転突入！ 引き戻しを狙え！'); }
    autoAim(); save();
  }
}

/* ---------- 入賞処理 ---------- */
function gain(n) { S.balls += n; if (S.balls > S.stats.maxBalls) S.stats.maxBalls = S.balls; if (S.balls >= 3000) unlock('b3000'); if (S.balls >= 10000) unlock('b10000'); }
function onEvent(ev, b) {
  switch (ev) {
    case 'heso': gain(1); SFX.heso(); addHold(false); spark(b.x, b.y, '#ffd54a'); break;
    case 'chu': gain(1); SFX.heso(); addHold(true); spark(b.x, b.y, '#4dffa0'); break;
    case 'atk': {
      const j = S.jp; gain(15); SFX.pay(); spark(b.x, b.y, '#ff4dd2');
      if (j && j.phase === 'open') { j.count++; j.pay += 15; S.stats.chainPay += 15; }
      break;
    }
    case 'pocket': gain(3); SFX.pay(); spark(b.x, b.y, '#7ad7ff'); break;
    case 'foul': S.balls++; break;
  }
}
function onPass(ev, b) {
  if (ev === 'gate') { if (fuzuQ < 4) fuzuQ++; spark(b.x, b.y, '#ffffff'); }
  if (ev === 'warp') { SFX.warp(); spark(b.x, b.y, '#7ad7ff'); }
}
function updateFuzu(dt) {
  if (chuOpenT > 0) { chuOpenT -= dt; return; }
  if (!fuzu && fuzuQ > 0) { fuzuQ--; const ds = densapo(); fuzu = { t: ds ? 0.8 : 3, win: rand() < (ds ? 0.92 : 0.08), ds }; }
  if (fuzu) {
    fuzu.t -= dt;
    if (fuzu.t <= 0) { if (fuzu.win) { chuOpenT = fuzu.ds ? 2.6 : 0.3; SFX.open(); } fuzu = null; }
  }
}
function spark(x, y, c) { for (let i = 0; i < 8; i++) particles.push({ x, y, vx: (rand() - 0.5) * 160, vy: (rand() - 0.8) * 160, life: 0.5, c }); }

/* ---------- 発射 ---------- */
function updateFire(dt) {
  fireCD -= dt;
  if (!S.firing) return;
  if (S.balls <= 0) { S.firing = false; setMsg('持ち玉がなくなりました。玉貸しボタンで玉を借りよう'); updateUI(); return; }
  if (fireCD <= 0) {
    fireCD = 0.6;
    S.balls--;
    balls.push(launchBall(S.power, rand));
    if (S.settings.sound && rand() < 0.5) tone(180, 0.03, 'square', 0.015);
  }
}
function lend(silent) {
  S.balls += 125; S.invest += 500; if (!silent) { setMsg('玉を125玉借りました（500円）'); tone(880, 0.08, 'triangle', 0.05); }
  pushHist(); updateUI(); save();
}
const LEFT_P = 0.3, RIGHT_P = 0.88;
function wantRight() { return !!S.jp || densapo(); }
function autoAim() { if (!S.settings.autoAim) return; S.power = wantRight() ? RIGHT_P : LEFT_P; updateUI(); }

/* ---------- 収支履歴 ---------- */
function income() { return S.balls * 4 - S.invest; }
function pushHist() {
  S.hist.push(income());
  if (S.hist.length > 400) { const h = []; for (let i = 0; i < S.hist.length; i += 2) h.push(S.hist[i]); S.hist = h; }
}

function lcdPath(c, inset) {
  c.beginPath();

  c.lineTo(CX, LCD.peak + inset * 1.2);

  c.lineTo(LCD.x2 - inset, LCD.bot - inset);
  c.closePath();
}

function drawSymbol(c, n, x, y, size, alpha = 1, glow = false) {
  const s = SYM[n]; if (!s) return;
  c.save(); c.globalAlpha *= alpha;
  if (glow) { c.shadowColor = s.c; c.shadowBlur = 18; }
  const gr = c.createRadialGradient(x - size * 0.3, y - size * 0.3, 2, x, y, size);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, s.c); gr.addColorStop(1, '#1a1030');
  c.fillStyle = gr; c.beginPath(); c.arc(x, y, size, 0, Math.PI * 2); c.fill();
  c.shadowBlur = 0;

}

      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(LCD.x1 + 8, LCD.bot - 30, 110, 20);
      c.fillStyle = '#fff'; c.font = 'bold 12px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
      const t = S.mode === 'kakuhen' ? '🔥 確変中' : S.mode === 'jitan' ? `⏱ 時短 残り${S.jitanLeft}` : `🌊 ${S.stats.since}回転`;
      c.fillText(t, LCD.x1 + 14, LCD.bot - 20);
    }
  }
  // 保留
  const drawHold = (q, x0, y, n) => {
    for (let i = 0; i < 4; i++) {
      const h = q[i]; const x = x0 + i * 15;
      c.beginPath(); c.arc(x, y, 5.5, 0, Math.PI * 2);
      if (h) {
        let col = HOLD_COLORS[h.color];
        if (col === 'rainbow') col = `hsl(${(gtime * 360 + i * 40) % 360},100%,60%)`;
        c.fillStyle = col; c.shadowColor = col; c.shadowBlur = h.color === 'white' ? 0 : 10; c.fill(); c.shadowBlur = 0;
      } else { c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1.2; c.stroke(); }
    }
  };
  drawHold(S.holds, CX + 2, LCD.bot - 20, 4);
  if (densapo() || S.eholds.length) drawHold(S.eholds, CX + 66, LCD.bot - 20, 4);
  c.restore();
  // 枠
  c.save();
  lcdPath(c, 0); c.lineWidth = 9; c.strokeStyle = '#7fd6ff'; c.stroke();
  lcdPath(c, 0); c.lineWidth = 4; const fg = c.createLinearGradient(LCD.x1, 0, LCD.x2, 0); fg.addColorStop(0, '#ffe066'); fg.addColorStop(0.5, '#fff8d0'); fg.addColorStop(1, '#ffb300');
  c.strokeStyle = fg; c.stroke();
  // ワープ入口
  c.fillStyle = '#02102a'; c.beginPath(); c.arc(LCD.x1 - 1, WARP.y, 6, 0, Math.PI * 2); c.fill(); c.strokeStyle = '#7fd6ff'; c.lineWidth = 2; c.stroke();
  // 役物ランプ
  const lamp = lampT > 0;
  c.beginPath(); c.arc(CX, LCD.peak - 2, 13, 0, Math.PI * 2);
  c.fillStyle = lamp ? `hsl(${(gtime * 600) % 360},100%,60%)` : (S.jp ? '#ff4040' : '#802020');
  c.shadowColor = c.fillStyle; c.shadowBlur = lamp ? 30 : 8; c.fill(); c.shadowBlur = 0;
  c.lineWidth = 3; c.strokeStyle = '#ffd54a'; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(CX - 4, LCD.peak - 6, 4, 0, Math.PI * 2); c.fill();
  c.restore();
}

function drawDynamic() {
  // 風車
  for (const m of MILLS) {
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(millA * m.dir);
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.fillStyle = i % 2 ? '#ffd54a' : '#ff5a5a'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, -3); ctx.lineTo(10, 3); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // 電チュー
  const open = chuOpenT > 0;
  {
    const s = B.segs.find(q => q.tag === 'chuLid');
    ctx.lineCap = 'round'; ctx.lineWidth = 5;
    if (open) {
      ctx.strokeStyle = '#4dffa0'; ctx.shadowColor = '#4dffa0'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x1 + 2, s.y1 - 12); ctx.moveTo(s.x2, s.y2); ctx.lineTo(s.x2 + 6, s.y2 - 10); ctx.stroke();
      ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(77,255,160,.45)'; ctx.beginPath(); ctx.arc((s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2 + 3, 9, 0, Math.PI * 2); ctx.fill();
    } else { ctx.strokeStyle = '#2fa060'; ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke(); }
  }
  // アタッカー
  const ao = !!(S.jp && S.jp.phase === 'open');
  const lid = B.segs.find(s => s.tag === 'atkLid');
  ctx.lineWidth = 5; ctx.strokeStyle = ao ? 'rgba(255, 80, 200, .35)' : '#ff4dd2';
  ctx.beginPath(); ctx.moveTo(lid.x1, lid.y1); ctx.lineTo(lid.x2, lid.y2); ctx.stroke();
  if (ao) { ctx.fillStyle = `rgba(255, 80, 200, ${0.3 + Math.sin(gtime * 12) * 0.2})`; ctx.fillRect(ATK.x1, ATK.y1 - 2, ATK.x2 - ATK.x1, 8); }
  // 普図
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(FUZU.x - 13, FUZU.y - 6, 26, 12);
  ctx.fillStyle = fuzu ? (Math.sin(gtime * 30) > 0 ? '#4dffa0' : '#ff4040') : (chuOpenT > 0 ? '#4dffa0' : '#555');
  ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(fuzu ? '◯✕' : chuOpenT > 0 ? '◯' : '－', FUZU.x, FUZU.y + 0.5);
  ctx.textBaseline = 'alphabetic';
}

function drawBall(b) {
  const g = ctx.createRadialGradient(b.x - 1.5, b.y - 1.8, 0.5, b.x, b.y, BR);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, '#c7ced8'); g.addColorStop(1, '#3a4250');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, BR, 0, Math.PI * 2); ctx.fill();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(staticLayer, 0, 0, cv.width, cv.height);
  const k = scale * dpr; ctx.setTransform(k, 0, 0, k, 0, 0);
  drawLCD(ctx);
  drawDynamic();
  for (const b of balls) drawBall(b);
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;
  // 狙い目の矢印
  if (wantRight() && S.power < 0.6) { const a = 0.5 + Math.sin(gtime * 8) * 0.5; ctx.globalAlpha = a; bigText(ctx, '右打ち ⇒', 500, 110, 22, '#fff', '#ff6b6b', '#400'); ctx.globalAlpha = 1; }
  if (flashT > 0) { ctx.globalAlpha = Math.min(0.5, flashT * 0.3) * (Math.sin(gtime * 30) > 0 ? 1 : 0.3); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, BW, BW); ctx.globalAlpha = 1; }
}

function drawNowSym() {
  for (let i = 0; i < 3; i++) {
    const c = $('ns' + i), g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    drawSymbol(g, S.lastSym[i], 60, 58, 40);
  }
}

function drawChart() {
  const c = $('chart'), w = c.clientWidth, h = c.clientHeight; if (!w) return;
  const d = Math.min(2, devicePixelRatio || 1);
  if (c.width !== Math.round(w * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const g = c.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, w, h);
  const data = S.hist.concat([income()]);
  let m = 10000; for (const v of data) m = Math.max(m, Math.abs(v));
  m = Math.ceil(m / 5000) * 5000;
  const L = 52, T = 6, Bm = 6, H = h - T - Bm, Wd = w - L - 4;
  g.font = '10px sans-serif'; g.fillStyle = '#8ea5c8'; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let i = 0; i <= 4; i++) {
    const v = m - (m * 2 * i) / 4, y = T + H * i / 4;
    g.fillText((v > 0 ? '+' : '') + v.toLocaleString(), L - 6, y);
    g.strokeStyle = i === 2 ? '#44608f' : '#1b2c4d'; g.lineWidth = 1; g.beginPath(); g.moveTo(L, y); g.lineTo(L + Wd, y); g.stroke();
  }
  g.strokeStyle = '#ff3b4b'; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath();
  data.forEach((v, i) => { const x = L + (data.length < 2 ? 0 : Wd * i / (data.length - 1)), y = T + H * (0.5 - v / (2 * m)); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
}

/* ---------- UI更新 ---------- */
let lastUI = '';
function updateUI() {
  $('balls').textContent = S.balls.toLocaleString();
  const p = $('prob'); p.textContent = '1/' + curProb(); p.classList.toggle('k', S.mode === 'kakuhen');
  $('sFirst').textContent = S.stats.first; $('sKaku').textContent = S.stats.kaku; $('sRen').textContent = S.stats.ren;
  $('sSince').textContent = S.stats.since; $('sSpins').textContent = S.stats.spins; $('sInvest').textContent = S.invest.toLocaleString();
  const inc = income(), el = $('income');
  el.innerHTML = (inc > 0 ? '+' : inc < 0 ? '−' : '±') + Math.abs(inc).toLocaleString() + '<small>円</small>';
  el.className = inc >= 0 ? 'plus' : 'minus';
  $('powerFill').style.height = (S.power * 100) + '%';
  $('knob').style.transform = `rotate(${-120 + S.power * 240}deg)`;
  $('knob').classList.toggle('firing', S.firing);
  $('fireBtn').classList.toggle('on', S.firing); $('fireBtn').textContent = S.firing ? '発射中' : '発射';
  $('leftBtn').classList.toggle('on', Math.abs(S.power - LEFT_P) < 0.04);
  $('rightBtn').classList.toggle('on', Math.abs(S.power - RIGHT_P) < 0.04);
  const j = S.jp;
  $('mNormal').classList.toggle('on', !j && S.mode === 'normal');
  $('mKaku').classList.toggle('on', !j && S.mode === 'kakuhen');
  $('mJitan').classList.toggle('on', !j && S.mode === 'jitan');
  $('mSp').classList.toggle('on', !!j);
  $('shootHint').style.display = wantRight() && S.power < 0.6 ? 'block' : 'none';
  // バナー
  const bn = $('banner'); let cls = '', b1, b2, ch = '🧜‍♀️';
  if (j) { cls = 'jp'; b1 = '大当り中'; b2 = j.kaku ? '確変' : `${j.round}/${j.rounds}R`; ch = j.kaku ? '😉' : '🧜‍♀️'; if (j.kaku) b2 = `確変 ${j.round}/${j.rounds}R`; }
  else if (S.mode === 'kakuhen') { cls = 'kaku'; b1 = '確変中'; b2 = `${S.stats.ren}連チャン中！`; ch = '🔥'; }
  else if (S.mode === 'jitan') { cls = 'jitan'; b1 = '時短中'; b2 = `残り ${S.jitanLeft} 回転`; ch = '⏱️'; }
  else { b1 = '通常モード'; b2 = 'ヘソを狙え！'; }
  const key = cls + b1 + b2;
  if (key !== lastUI) { lastUI = key; bn.className = cls; $('b1').textContent = b1; $('b2').textContent = b2; $('bChar').textContent = ch; }
  document.querySelectorAll('.cbtn').forEach(b => b.classList.toggle('on', b.dataset.c === S.custom));
}

/* ---------- メインループ ---------- */
let last = performance.now(), saveT = 0, uiT = 0, chartT = 0;
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  dt *= S.settings.speed;
  gtime += dt;
  millA += dt * 4;
  lampT = Math.max(0, lampT - dt); flashT = Math.max(0, flashT - dt);
  updateFire(dt);
  const st = { chuOpen: chuOpenT > 0, atkOpen: !!(S.jp && S.jp.phase === 'open') };
  const steps = Math.ceil(dt / (1 / 480));
  const h = dt / steps;
  for (let s = 0; s < steps; s++) {
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      const ev = stepBall(b, h, B, st, rand);
      if (b.ev) { onPass(b.ev, b); b.ev = null; }
      if (ev) { onEvent(ev, b); balls.splice(i, 1); }
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; if (p.life <= 0) particles.splice(i, 1); }
  updateFuzu(dt);
  updateJP(dt);
  if (!S.jp) { if (!S.spin) startSpin(); updateSpin(dt); }
  render();
  uiT += dt; if (uiT > 0.1) { uiT = 0; updateUI(); }
  chartT += dt; if (chartT > 1) { chartT = 0; drawChart(); }
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}

/* ---------- 操作 ---------- */
function toggleFire(on) { ac(); S.firing = on === undefined ? !S.firing : on; if (S.firing && S.balls <= 0) { setMsg('持ち玉がありません。玉貸しボタンを押してね'); S.firing = false; } updateUI(); }
function setPower(p) { S.power = Math.max(0, Math.min(1, p)); updateUI(); }
function pressPush() {
  ac();
  if (pushWait) { resolvePush(true); return; }
  const b = $('pushBtn'); b.animate([{ filter: 'brightness(1.6)' }, { filter: 'none' }], { duration: 200 });
  tone(700, 0.06, 'square', 0.04);
  if (S.spin && S.spin.reached && !S.spin.resolved) setMsg('もうすぐだ…！');
}
$('pushBtn').addEventListener('click', pressPush);
$('fireBtn').addEventListener('click', () => toggleFire());
$('leftBtn').addEventListener('click', () => setPower(LEFT_P));
$('rightBtn').addEventListener('click', () => setPower(RIGHT_P));
$('lend').addEventListener('click', () => { ac(); lend(false); });
{
  const k = $('knob'); let drag = null;
  k.addEventListener('pointerdown', e => { drag = { y: e.clientY, x: e.clientX, p: S.power, moved: false }; k.setPointerCapture(e.pointerId); });
  k.addEventListener('pointermove', e => {
    if (!drag) return; const d = (drag.y - e.clientY) + (e.clientX - drag.x);
    if (Math.abs(d) > 4) drag.moved = true;
    if (drag.moved) setPower(drag.p + d / 160);
  });
  k.addEventListener('pointerup', () => { if (drag && !drag.moved) toggleFire(); drag = null; });
  k.addEventListener('wheel', e => { e.preventDefault(); setPower(S.power - Math.sign(e.deltaY) * 0.02); }, { passive: false });
}
cv.addEventListener('click', () => { if (pushWait) pressPush(); });
document.querySelectorAll('.cbtn').forEach(b => b.addEventListener('click', () => { S.custom = b.dataset.c; setMsg(`演出カスタム：${b.textContent}`); updateUI(); save(); }));
addEventListener('keydown', e => {
  if ($('modal').classList.contains('show')) { if (e.key === 'Escape') closeModal(); return; }
  if (e.code === 'Space') { e.preventDefault(); pressPush(); }
  else if (e.key === 'Enter' || e.key === 'f' || e.key === 'F') toggleFire();
  else if (e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); setPower(S.power + 0.02); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); setPower(S.power - 0.02); }
  else if (e.key === 'r' || e.key === 'R') setPower(RIGHT_P);
  else if (e.key === 'l' || e.key === 'L') setPower(LEFT_P);
});

/* ---------- モーダル ---------- */
function openModal(html) { $('modalBox').innerHTML = html + '<button class="mclose" data-close>閉じる</button>'; $('modal').classList.add('show'); }
function closeModal() { $('modal').classList.remove('show'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.dataset.close !== undefined) closeModal(); });
function segBtns(key, opts, cur) { return `<div class="seg">${opts.map(([v, l]) => `<button data-k="${key}" data-v="${v}" class="${String(v) === String(cur) ? 'on' : ''}">${l}</button>`).join('')}</div>`; }
const MODALS = {
  menu() {
    openModal(`<h2>☰ メニュー</h2>
      <div class="opt"><span>持ち玉 ${S.balls.toLocaleString()}玉 / 投資 ${S.invest.toLocaleString()}円</span></div>
      <div class="opt"><span>収支を記録して精算する<br><small style="color:var(--dim)">持ち玉を換金したことにして、今日の収支をリセットします</small></span><button class="seg" id="mSettle" style="padding:6px 12px;border-radius:8px;border:1px solid #4a7bc0;background:#16305e;font-weight:700">精算</button></div>
      <div class="opt"><span>データをすべて消して最初から<br><small style="color:var(--dim)">実績・ランキングも消えます</small></span><button id="mReset" class="danger" style="padding:6px 12px;border-radius:8px;border:1px solid;font-weight:700">リセット</button></div>`);
    $('mSettle').onclick = () => { const inc = income(); toast(`精算しました：${inc >= 0 ? '+' : '−'}${Math.abs(inc).toLocaleString()}円`); balls.length = 0; S.balls = 0; S.invest = 0; S.hist = [0]; S.firing = false; lend(true); closeModal(); };
    $('mReset').onclick = () => { if (!confirm('本当にすべてのデータを消しますか？')) return; try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
  },
  settings() {
    openModal(`<h2>⚙️ 設定</h2>
      <div class="opt"><span>大当り確率（通常時）</span>${segBtns('prob', [[39, '1/39 甘々'], [99, '1/99 甘デジ'], [199, '1/199 ライト'], [319, '1/319 ミドル']], S.settings.prob)}</div>
      <div class="opt"><span>ゲームスピード</span>${segBtns('speed', [[1, '等速'], [1.5, '1.5倍'], [2, '2倍']], S.settings.speed)}</div>
      <div class="opt"><span>サウンド</span>${segBtns('sound', [[true, 'ON'], [false, 'OFF']], S.settings.sound)}</div>
      <div class="opt"><span>右打ち・左打ちの自動切替</span>${segBtns('autoAim', [[true, 'ON'], [false, 'OFF']], S.settings.autoAim)}</div>
      <p style="color:var(--dim);font-size:12px">確変中の確率は通常時の約1/10になります。</p>`);
    $('modalBox').querySelectorAll('.seg button').forEach(b => b.onclick = () => {
      const k = b.dataset.k; let v = b.dataset.v; v = v === 'true' ? true : v === 'false' ? false : +v;
      S.settings[k] = v; save(); updateUI(); MODALS.settings();
    });
  },
  howto() {
    openModal(`<h2>📖 遊び方</h2>
      <ul>
        <li><b>発射</b>：ハンドル（丸いつまみ）をクリック、または「発射」ボタン／Enterキーで玉を打ち出します。</li>
        <li><b>強さ</b>：つまみを上下にドラッグ、ホイール、矢印キーで調整。弱いと左側、強いと右側へ玉が飛びます。</li>
        <li><b>ヘソ（START）</b>に入ると3玉もらえて液晶の図柄が回ります。保留は最大4個。</li>
        <li>3つの図柄が揃えば<b>大当り</b>！ 右打ちしてアタッカーに玉を入れよう（1個で15玉）。</li>
        <li><b>奇数図柄</b>で当たると確変（次の大当りまで確率アップ）。偶数なら時短100回転。7なら16ラウンド！</li>
        <li>確変・時短中は右打ちで<b>ゲート</b>を通すと<b>電チュー</b>が開き、そこからも図柄が回ります。</li>
        <li>液晶左の<b>ワープ</b>に入るとステージへ。真ん中から落ちるとヘソに入りやすい！</li>
        <li>SPリーチで<b>PUSH</b>が出たらボタン（Space）を押そう。保留の色や<b>役物ランプ</b>はチャンスの合図。</li>
        <li>演出カスタム：<b>先読みチャンス</b>は保留変化が増え、<b>告知重視</b>はガセリーチが減りランプ告知が増えます。</li>
      </ul>
      <p style="color:var(--dim);font-size:12px">※ 本作は架空のゲームです。お金は一切かかりません。</p>`);
  },
  ach() {
    const n = ACH.filter(a => S.ach[a.id]).length;
    openModal(`<h2>🏆 実績 (${n}/${ACH.length})</h2>` + ACH.map(a => `<div class="ach ${S.ach[a.id] ? '' : 'lock'}"><span class="ai">${S.ach[a.id] ? a.ic : '🔒'}</span><div><b>${a.name}</b><br><small style="color:var(--dim)">${a.desc}</small></div></div>`).join(''));
  },
  rank() {
    const rows = S.rank.map((r, i) => `<tr><td>${i + 1}</td><td>${r.ren}連</td><td>${r.pay.toLocaleString()}玉</td><td>${r.date}</td></tr>`).join('') || '<tr><td colspan="4">まだ記録がありません</td></tr>';
    openModal(`<h2>📊 連チャンランキング</h2><table class="rank"><tr><th>順位</th><th>連チャン</th><th>出玉</th><th>日付</th></tr>${rows}</table>
      <p style="font-size:13px">最大持ち玉：<b>${S.stats.maxBalls.toLocaleString()}</b>玉 ／ 総回転数：<b>${S.stats.spins.toLocaleString()}</b></p>`);
  },
};
document.querySelectorAll('.sbtn').forEach(b => b.addEventListener('click', () => MODALS[b.dataset.m]()));

/* ---------- 起動 ---------- */
load();
addEventListener('resize', () => { fitBoard(); drawChart(); });
fitBoard(); drawNowSym(); updateUI(); drawChart();
if (S.stats.spins === 0 && S.stats.first === 0) setTimeout(() => MODALS.howto(), 400);
requestAnimationFrame(frame);
</script>
