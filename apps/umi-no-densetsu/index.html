<!DOCTYPE html>
<!-- © kato200000354. 無断転載・複製・再配布を禁止します。 (kato200000354-protected) -->

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>海の伝説 ～夢をつかめ～</title>
<style>
  :root {
    --bg: #060d1f;
    --panel: #0c1730;
    --panel2: #101f3f;
    --line: #22406f;
    --text: #e8f1ff;
    --dim: #8ea5c8;
    --gold: #ffd54a;
    --gold2: #ff9f1c;
    --red: #ff3b3b;
    --green: #4dffa0;
    --blue: #3da0ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 40% 0%, #12285a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Yu Gothic", "Meiryo", sans-serif;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }

  #app {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr) 340px;
    grid-template-rows: minmax(0, 1fr) auto;
    grid-template-areas: "side board panel" "side bottom bottom";
    gap: 10px; padding: 10px;
    height: 100vh; height: 100dvh;
    max-width: 1500px; margin: 0 auto;
  }

  /* サイドメニュー */
  #side { grid-area: side; display: flex; flex-direction: column; gap: 10px; }
  .sbtn {
    background: linear-gradient(180deg, #16284d, #0b1631);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700;
  }
  .sbtn .ic { font-size: 24px; line-height: 1; }
  .sbtn:hover { border-color: #4a7bc0; }

  /* 盤面 */
  #boardWrap {
    grid-area: board; position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 22px;
    background: linear-gradient(135deg, #8a0d18, #2a0308 40%, #1a0206 60%, #8a0d18);
    box-shadow: inset 0 0 0 3px #3a0a10, 0 0 30px rgba(255, 40, 60, .25);
    padding: 10px;
  }
  #board { display: block; touch-action: manipulation; }
  #title {
    position: absolute; left: 14px; top: 10px; pointer-events: none;
    font-weight: 900; line-height: 1.05; text-align: center;
  }
  #title .t1 {
    font-size: clamp(20px, 3.2vw, 38px); letter-spacing: 2px;
    background: linear-gradient(180deg, #fffbe0, #ffd54a 45%, #ff8a1c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(80, 30, 0, .6);
    filter: drop-shadow(0 2px 0 #1a4fb0) drop-shadow(0 0 8px rgba(80,180,255,.7));
  }
  #title .t2 {
    font-size: clamp(10px, 1.4vw, 15px); color: #fff; margin-top: 2px;
    text-shadow: 0 0 6px #1a8cff, 0 1px 0 #003;
  }
  #shootHint {
    position: absolute; right: 16px; top: 14px; padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 60, 60, .9); font-weight: 900; font-size: 14px;
    box-shadow: 0 0 14px rgba(255, 60, 60, .8); display: none;
    animation: pulse .6s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  /* 右パネル */
  #panel { grid-area: panel; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
  .card {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 120px; gap: 10px; }
  .lbl { font-size: 13px; font-weight: 700; color: #cfe0ff; }
  .big { font-size: 34px; font-weight: 900; color: #fff3c4; text-align: right; font-variant-numeric: tabular-nums;
         text-shadow: 0 0 10px rgba(255, 213, 74, .45); }
  .big small, .mid small { font-size: 13px; margin-left: 3px; color: #ffe9a0; }
  .ballIcon { display: inline-block; width: 22px; height: 22px; border-radius: 50%; vertical-align: middle;
              background: radial-gradient(circle at 35% 30%, #fff, #b9c2cf 40%, #4c5563 80%); }
  .prob { font-size: 26px; font-weight: 900; text-align: center; margin-top: 6px; background: #081126;
          border-radius: 8px; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .prob.k { color: #ff7ad9; text-shadow: 0 0 8px #ff3dc8; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stats3 > div + div { border-left: 1px solid var(--line); }
  .mid { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; margin-top: 4px; }
  #chartHead { display: flex; justify-content: space-between; align-items: baseline; }
  #income { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #income.plus { color: var(--green); } #income.minus { color: #ff6b6b; }
  #chart { width: 100%; height: 120px; display: block; margin-top: 4px; }

  #banner {
    position: relative; border-radius: 14px; overflow: hidden; min-height: 92px;
    border: 2px solid #ffcf5a; padding: 10px 14px;
    background: linear-gradient(120deg, #0b3a7a, #0a6bb0 50%, #0b3a7a);
    display: flex; align-items: center; gap: 8px;
  }
  #banner .bText { flex: 1; z-index: 1; }
  #banner .b1 { font-size: 30px; font-weight: 900; line-height: 1.1;
    background: linear-gradient(180deg, #fff, #ffe066 50%, #ff8a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 1px rgba(120, 0, 0, .5); filter: drop-shadow(0 2px 0 #600); }
  #banner .b2 { display: inline-block; margin-top: 4px; padding: 2px 14px; border-radius: 6px; font-weight: 900;
    background: linear-gradient(180deg, #ff4d4d, #b00000); border: 1px solid #ffd54a; font-size: 15px; }
  #banner .bChar { font-size: 56px; z-index: 1; filter: drop-shadow(0 0 8px rgba(255,255,255,.6)); }
  #banner.jp { background: linear-gradient(120deg, #ff3b3b, #ffb300, #ff3dc8, #3dd6ff, #ff3b3b); background-size: 300% 100%;
               animation: rainbow 2s linear infinite; }
  #banner.kaku { background: linear-gradient(120deg, #4a0b7a, #b02ad0 50%, #4a0b7a); }
  #banner.jitan { background: linear-gradient(120deg, #064f4a, #0aa58f 50%, #064f4a); }
  @keyframes rainbow { to { background-position: 300% 0; } }

  .custom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .cbtn { background: #0a1630; border: 1px solid #2c4c80; border-radius: 10px; padding: 10px 2px; font-weight: 700; font-size: 13px; }
  .cbtn.on { background: linear-gradient(180deg, #3aa0ff, #1060d0); border-color: #9fd2ff; box-shadow: 0 0 12px rgba(60, 160, 255, .7); }

  /* 下段 */
  #bottom { grid-area: bottom; display: grid; grid-template-columns: 1.15fr 1fr auto auto; gap: 10px; align-items: stretch; }
  #effect .msg { background: #081126; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0 8px;
                 font-size: 14px; font-weight: 700; min-height: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #effect .msg::before { content: "◆ "; color: var(--red); }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mode { background: #0a1630; border: 1px solid #2c4c80; border-radius: 9px; text-align: center; padding: 5px 0 4px; font-size: 12px; font-weight: 700; opacity: .55; }
  .mode .ic { font-size: 20px; display: block; }
  .mode.on { opacity: 1; background: linear-gradient(180deg, #ff5a3a, #c0101a); border-color: #ffb3a0; box-shadow: 0 0 12px rgba(255, 70, 50, .7); }
  #nowSym .syms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
  #nowSym canvas { width: 100%; aspect-ratio: 1.1; background: radial-gradient(circle, #1e4f9a, #0a1a3a); border-radius: 8px; border: 1px solid #2c4c80; display: block; }
  #pushBtn {
    width: 150px; height: 150px; border-radius: 50%; align-self: center;
    border: 8px solid #2b2f38;
    background: radial-gradient(circle at 50% 35%, #ff7a7a, #e00000 55%, #6a0000);
    box-shadow: 0 0 0 4px #8a919c, 0 6px 0 #1a1a1a, 0 0 18px rgba(255, 0, 0, .4), inset 0 -8px 14px rgba(0,0,0,.4);
    font-size: 34px; font-weight: 900; color: #ffe066; letter-spacing: 1px;
    text-shadow: 0 2px 0 #7a3a00, 0 0 8px rgba(255, 230, 100, .8);
    transition: transform .06s;
  }
  #pushBtn:active { transform: translateY(4px) scale(.97); }
  #pushBtn.chance { animation: pushGlow .25s infinite alternate; }
  @keyframes pushGlow { from { box-shadow: 0 0 0 4px #ffd54a, 0 0 20px #ff0, 0 0 50px #f00; } to { box-shadow: 0 0 0 4px #fff, 0 0 40px #ff0, 0 0 80px #f00; } }

  #handleBox { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 170px; }
  #knobRow { display: flex; align-items: center; gap: 10px; }
  #knob {
    width: 84px; height: 84px; border-radius: 50%; position: relative; touch-action: none; cursor: grab;
    background: radial-gradient(circle at 35% 30%, #f4f6f9, #9aa3b0 45%, #3c434e 85%);
    border: 3px solid #1d2128; box-shadow: 0 4px 10px rgba(0,0,0,.6);
  }
  #knob::after { content: ""; position: absolute; left: 50%; top: 6px; width: 6px; height: 26px; margin-left: -3px;
                 border-radius: 3px; background: #ff4040; box-shadow: 0 0 6px #f00; }
  #knob.firing { box-shadow: 0 0 0 3px #4dffa0, 0 0 16px #4dffa0; }
  #powerBar { width: 12px; height: 84px; border-radius: 6px; background: #081126; border: 1px solid var(--line); position: relative; overflow: hidden; }
  #powerFill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #3da0ff, #ffd54a, #ff3b3b); }
  .hrow { display: flex; gap: 6px; width: 100%; }
  .hbtn { flex: 1; background: #0a1630; border: 1px solid #2c4c80; border-radius: 8px; padding: 6px 0; font-size: 12px; font-weight: 700; }
  .hbtn.on { background: #1b6a3f; border-color: #4dffa0; }
  #lend { width: 100%; background: linear-gradient(180deg, #2a3550, #141b2c); border: 1px solid #4a5b80; border-radius: 10px; padding: 6px 0; font-weight: 900; font-size: 15px; }
  #lend small { display: block; font-size: 11px; color: var(--dim); font-weight: 700; }

  /* モーダル */
  #modal { position: fixed; inset: 0; background: rgba(0, 4, 16, .75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #modal.show { display: flex; }
  #modalBox { background: linear-gradient(180deg, #13254a, #0a1430); border: 2px solid #3d6bb0; border-radius: 16px;
              width: min(520px, 100%); max-height: 86vh; overflow-y: auto; padding: 18px 20px; }
  #modalBox h2 { margin: 0 0 12px; font-size: 22px; color: var(--gold); }
  #modalBox p, #modalBox li { line-height: 1.7; font-size: 14px; }
  #modalBox ul { padding-left: 1.2em; margin: 6px 0; }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #2c4c80; flex-wrap: wrap; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { background: #0a1630; border: 1px solid #2c4c80; border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 13px; }
  .seg button.on { background: #1060d0; border-color: #9fd2ff; }
  .mclose { margin-top: 14px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #4a7bc0; background: #16305e; font-weight: 900; font-size: 15px; }
  .danger { background: #6a1010 !important; border-color: #ff6b6b !important; }
  .ach { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px dashed #2c4c80; }
  .ach .ai { font-size: 24px; width: 32px; text-align: center; }
  .ach.lock { opacity: .4; }
  table.rank { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.rank td, table.rank th { padding: 6px; border-bottom: 1px solid #2c4c80; text-align: center; }

  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: linear-gradient(180deg, #ffe066, #ff9f1c);
           color: #3a1a00; font-weight: 900; padding: 8px 18px; border-radius: 999px; z-index: 60; display: none; box-shadow: 0 4px 18px rgba(0,0,0,.5); }

  /* スマホ・縦長 */
  @media (max-width: 980px) {
    #app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto auto;
      grid-template-areas: "side" "board" "bottom" "panel";
      height: auto; padding: 8px 16px 20px;
    }
    #side { flex-direction: row; }
    .sbtn { flex: 1; padding: 6px 2px; }
    .sbtn .ic { font-size: 18px; }
    #boardWrap { padding: 6px; }
    #bottom { grid-template-columns: 1fr 1fr; }
    #effect { grid-column: 1 / -1; }
    #nowSym { grid-column: 1 / -1; }
    #nowSym .syms { max-width: 300px; margin: 6px auto 0; }
    #pushBtn { width: 120px; height: 120px; font-size: 28px; justify-self: center; }
    #handleBox { width: 100%; }
    #panel { overflow: visible; }
  }
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <button class="sbtn" data-m="menu"><span class="ic">☰</span>メニュー</button>
    <button class="sbtn" data-m="settings"><span class="ic">⚙️</span>設定</button>
    <button class="sbtn" data-m="howto"><span class="ic">📖</span>遊び方</button>
    <button class="sbtn" data-m="ach"><span class="ic">🏆</span>実績</button>
    <button class="sbtn" data-m="rank"><span class="ic">📊</span>ランキング</button>
  </nav>

  <section id="boardWrap">
    <canvas id="board" width="600" height="600"></canvas>
    <div id="title"><div class="t1">海の伝説</div><div class="t2">～夢をつかめ～</div></div>
    <div id="shootHint">右打ち ⇒</div>
  </section>

  <aside id="panel">
    <div class="row2">
      <div class="card">
        <div class="lbl">持ち玉</div>
        <div class="big"><span class="ballIcon" style="float:left;margin-top:12px"></span><span id="balls">0</span><small>玉</small></div>
      </div>
      <div class="card">
        <div class="lbl" style="text-align:center">大当り確率</div>
        <div class="prob" id="prob">1/99</div>
      </div>
    </div>
    <div class="card stats3">
      <div><div class="lbl">初当たり</div><div class="mid"><span id="sFirst">0</span><small>回</small></div></div>
      <div><div class="lbl">確変</div><div class="mid"><span id="sKaku">0</span><small>回</small></div></div>
      <div><div class="lbl">連チャン</div><div class="mid"><span id="sRen">0</span><small>連</small></div></div>
    </div>
    <div class="card">
      <div id="chartHead"><span class="lbl">本日の収支</span><span id="income" class="plus">±0<small>円</small></span></div>
      <canvas id="chart"></canvas>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px">
        <span>回転数 <b id="sSince" style="color:#fff">0</b></span><span>総回転 <b id="sSpins" style="color:#fff">0</b></span><span>投資 <b id="sInvest" style="color:#fff">0</b>円</span>
      </div>
    </div>
    <div id="banner">
      <div class="bText"><div class="b1" id="b1">通常モード</div><div class="b2" id="b2">ヘソを狙え！</div></div>
      <div class="bChar" id="bChar">🧜‍♀️</div>
    </div>
    <div class="card">
      <div class="lbl">演出カスタム</div>
      <div class="custom">
        <button class="cbtn" data-c="normal">ノーマル</button>
        <button class="cbtn" data-c="saki">先読みチャンス</button>
        <button class="cbtn" data-c="kokuchi">告知重視</button>
      </div>
    </div>
  </aside>

  <div id="bottom">
    <div class="card" id="effect">
      <div class="lbl">🔊 演出</div>
      <div class="msg" id="msg">図柄が揃うと大当りです！</div>
      <div class="modes">
        <div class="mode" id="mNormal"><span class="ic">🐟</span>通常</div>
        <div class="mode" id="mKaku"><span class="ic">🔥</span>確変</div>
        <div class="mode" id="mJitan"><span class="ic">⏱️</span>時短</div>
        <div class="mode" id="mSp"><span class="ic">⭐</span>スペシャル</div>
      </div>
    </div>
    <div class="card" id="nowSym">
      <div class="lbl">現在の図柄</div>
      <div class="syms"><canvas id="ns0" width="120" height="110"></canvas><canvas id="ns1" width="120" height="110"></canvas><canvas id="ns2" width="120" height="110"></canvas></div>
    </div>
    <button id="pushBtn">PUSH</button>
    <div class="card" id="handleBox">
      <div id="knobRow">
        <div id="knob" title="クリックで発射ON/OFF・上下ドラッグで強さ"></div>
        <div id="powerBar"><div id="powerFill"></div></div>
      </div>
      <div class="hrow">
        <button class="hbtn" id="fireBtn">発射</button>
        <button class="hbtn" id="leftBtn">左打ち</button>
        <button class="hbtn" id="rightBtn">右打ち</button>
      </div>
      <button id="lend">玉貸し<small>500円 / 125玉</small></button>
    </div>
  </div>
</div>

<div id="modal"><div id="modalBox"></div></div>
<div id="toast"></div>
