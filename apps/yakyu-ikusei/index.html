<html lang="ja">

<title>めざせ甲子園！球児育成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --navy:#16337a;--blue:#2457c9;--blue2:#3a7be8;--sky:#e9f2ff;--line:#c7d6f0;
  --yellow:#ffd23a;--ink:#1b2a4a;--sub:#5a6a8a;--white:#fff;--panel:rgba(255,255,255,.95);
}
html,body{background:#0e2457;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-weight:700}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#3b6fd8 0%,#16337a 45%,#0b1d4a 100%) fixed}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:not-allowed}
.press{transition:transform .1s,filter .15s}
.press:active:not(:disabled){transform:scale(.95)}

/* ===== title ===== */
#title{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.tbox{width:min(520px,100%);text-align:center;color:#fff}
.logo{font-size:clamp(30px,8vw,52px);font-weight:900;line-height:1.1;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff 0%,#fff2a8 55%,#ffc21a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #0b1d4a) drop-shadow(0 0 14px rgba(255,210,60,.45))}
.logo small{display:block;font-size:.42em;color:#fff;-webkit-text-fill-color:#fff;letter-spacing:.3em;margin-bottom:6px}
.tchar{width:200px;margin:10px auto 0;animation:bob 2.4s ease-in-out infinite}
.tbtns{display:grid;gap:12px;margin-top:14px}
.bigbtn{display:block;width:100%;padding:16px;border-radius:16px;font-size:20px;font-weight:900;color:#3b2a00;
  background:linear-gradient(180deg,#fff27a,#ffcf1f 55%,#ffb300);box-shadow:0 5px 0 #b97a00,0 8px 16px rgba(0,0,0,.3);border:3px solid #fff}
.bigbtn.blue{color:#fff;background:linear-gradient(180deg,#5d9bff,#2457c9);box-shadow:0 5px 0 #0f2f7a,0 8px 16px rgba(0,0,0,.3)}
.bigbtn:disabled{filter:grayscale(1) brightness(.85);opacity:.7}
.form{background:var(--panel);border-radius:18px;padding:18px;color:var(--ink);text-align:left;display:grid;gap:12px;border:3px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.form label{font-size:14px;color:var(--sub)}
.form input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);margin-top:4px;color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.seg button{padding:12px;border-radius:12px;border:3px solid var(--line);background:#fff;font-size:17px}
.seg button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.seg small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.note{font-size:12px;color:#b9c9ee;margin-top:14px;line-height:1.6;font-weight:500}

/* ===== game layout ===== */
#game{display:grid;gap:10px;padding:10px;max-width:1400px;margin:0 auto;
  grid-template-columns:210px minmax(0,1fr) 370px;
  grid-template-rows:auto minmax(380px,1fr) auto auto;
  grid-template-areas:"top top top" "cmd stage panel" "cards cards act" "info info info";min-height:100vh}
.box{background:var(--panel);border-radius:16px;border:3px solid #fff;box-shadow:0 4px 0 rgba(10,30,80,.35),0 8px 18px rgba(0,0,0,.25)}
.hd{display:inline-block;background:linear-gradient(180deg,#2d63d6,#173c97);color:#fff;font-size:14px;padding:5px 14px;border-radius:10px 10px 10px 0;letter-spacing:.05em}

.topbar{grid-area:top;display:flex;gap:8px;align-items:stretch;flex-wrap:nowrap}
.tb{background:linear-gradient(180deg,#22489f,#132f74);border:2px solid rgba(255,255,255,.55);border-radius:14px;color:#fff;padding:6px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.t-date{flex-direction:column;align-items:flex-start;gap:0;min-width:120px}
.t-date .yr{font-size:13px;background:#3b74e6;padding:1px 10px;border-radius:8px}
.t-date .md{font-size:15px}.t-date .md b{font-size:30px;margin:0 2px;line-height:1.05}
.t-season{font-size:24px;padding:6px 14px;background:linear-gradient(180deg,#ffd0e0,#ff8fb4);color:#8a1d45;font-weight:900}
.t-season.s-夏{background:linear-gradient(180deg,#bdf3ff,#36c0ff);color:#064a78}
.t-season.s-秋{background:linear-gradient(180deg,#ffe0b0,#ff9a3c);color:#7a3500}
.t-season.s-冬{background:linear-gradient(180deg,#f2f7ff,#a9c3ea);color:#26407a}
.t-sched{flex-direction:column;gap:2px;min-width:110px}
.t-sched small{font-size:12px;opacity:.85}.t-sched b{background:#fff;color:var(--ink);border-radius:8px;padding:2px 12px;font-size:16px;white-space:nowrap}
.t-sched b.ev{background:#ff5d7d;color:#fff}
.t-hp,.t-mood{flex:1;min-width:0}
.lbl{font-size:15px;white-space:nowrap}
.bar{flex:1;height:16px;border-radius:99px;background:#0a1d4a;border:2px solid rgba(255,255,255,.7);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;width:50%;border-radius:inherit;background:linear-gradient(180deg,#c6ff6a,#4cc52b);transition:width .5s}
.bar.low>i{background:linear-gradient(180deg,#ffb36a,#f0542b)}
.bar.pink>i{background:linear-gradient(180deg,#ffb3d4,#ff4f97)}
.t-hp em,.t-mood em{font-style:normal;font-size:15px;white-space:nowrap}
.face{font-size:24px;line-height:1}
.t-money{gap:8px}.t-money small{display:block;font-size:11px;opacity:.85}.t-money b{font-size:20px}
.coin{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6a0,#ffc400 60%,#c98a00);color:#7a4c00;display:grid;place-items:center;font-size:16px;font-weight:900;border:2px solid #fff3b0;flex:none}

/* commands */
.cmd{grid-area:cmd;display:flex;flex-direction:column;gap:8px}
.cbtn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;font-size:19px;color:#fff;border:3px solid rgba(255,255,255,.9);
  background:linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 4px 0 rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(0,0,0,.25);text-align:left}
.cbtn svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
.cbtn .arr{margin-left:auto;font-size:18px}
.cbtn:disabled{filter:grayscale(.85) brightness(.9);opacity:.65}
.c-train{--c1:#fff27a;--c2:#ffbf00;color:#4a3000;text-shadow:none}
.c-rest{--c1:#ffa98a;--c2:#f36a4a}
.c-out{--c1:#ff9fcf;--c2:#e8559a}
.c-up{--c1:#6fe39a;--c2:#21a85a}
.c-item{--c1:#ffd970;--c2:#e9a412;color:#4a3000;text-shadow:none}
.c-data{--c1:#a99bff;--c2:#6a55e0}
.c-sys{--c1:#b8c4d8;--c2:#72809a}
.mini-stat{margin-top:auto;padding:10px;font-size:13px;display:grid;gap:6px}
.mini-stat .row{display:flex;align-items:center;gap:6px}
.hearts{letter-spacing:-1px;font-size:15px}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;border-radius:18px;border:3px solid #fff;box-shadow:0 4px 0 rgba(10,30,80,.35);min-height:300px;background:#7cc4ff}
.stage>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.chrWrap{position:absolute;left:50%;bottom:4%;width:min(46%,300px);transform:translateX(-50%);transform-origin:50% 100%}
.chrWrap svg{width:100%;display:block;animation:bob 2.6s ease-in-out infinite}
.chrWrap.jump{animation:jump .45s ease-out 2}
.chrWrap.hurt{animation:shake .4s 2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jump{0%,100%{transform:translateX(-50%) translateY(0) scaleY(1)}30%{transform:translateX(-50%) translateY(-28px) scaleY(1.04)}60%{transform:translateX(-50%) translateY(0) scaleY(.94)}}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(-54%)}75%{transform:translateX(-46%)}}
.bubble{position:absolute;left:4%;top:7%;max-width:44%;background:#fff;border-radius:22px;padding:12px 16px;font-size:16px;line-height:1.5;box-shadow:0 4px 10px rgba(0,0,0,.18);border:2px solid #dce6f7}
.bubble:after{content:"";position:absolute;right:-14px;bottom:18px;border:10px solid transparent;border-left:18px solid #fff}
.stageTag{position:absolute;right:10px;top:10px;background:rgba(15,40,100,.82);color:#fff;font-size:13px;padding:5px 12px;border-radius:99px;border:2px solid rgba(255,255,255,.7)}
.fx{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;left:50%;font-size:22px;font-weight:900;color:#fff;-webkit-text-stroke:1px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.25);white-space:nowrap;animation:floatUp 1.5s ease-out forwards;transform:translateX(-50%)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-70px)}}
.petal{position:absolute;top:-20px;width:10px;height:8px;border-radius:60% 0;background:#ffc1d6;opacity:.85;animation:fall linear infinite}
.petal.snow{background:#fff;border-radius:50%;width:7px;height:7px}
.petal.leaf{background:#ff9d3c;border-radius:70% 0}
@keyframes fall{to{transform:translate(-60px,520px) rotate(540deg)}}

/* panel */
.panel{grid-area:panel;display:flex;flex-direction:column;overflow:hidden;padding:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(180deg,#22489f,#132f74)}
.tabs button{padding:10px 4px;color:#cfe0ff;font-size:16px;border-right:1px solid rgba(255,255,255,.15)}
.tabs button.on{background:linear-gradient(180deg,#3f86ff,#2457c9);color:#fff}
.pts{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-bottom:2px solid #e3ebf8;background:#f4f8ff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:13px;color:#fff;background:var(--pc);white-space:nowrap}
.chip b{font-size:15px}
.chip.lack{opacity:.45}
.tabBody{padding:8px 12px 12px;overflow:auto;flex:1}
.prow{display:grid;grid-template-columns:96px 66px 30px 1fr;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed #d8e2f3}
.prow .nm{font-size:14px}
.prow .vl{font-size:20px;text-align:right}.prow .vl small{font-size:11px}
.rk{font-size:22px;font-weight:900;text-align:center;line-height:1;-webkit-text-stroke:.5px rgba(0,0,0,.15);text-shadow:0 1px 0 #fff}
.pbar{height:10px;border-radius:99px;background:#e2e9f5;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3a7be8,#62b5ff);border-radius:inherit}
.total{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 0;font-size:15px}
.total .rk{font-size:34px}
.pitch{display:block;width:100%;max-width:300px;margin:4px auto 0}
.skl{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0}
.sk{padding:5px 10px;border-radius:8px;background:linear-gradient(180deg,#fff7c2,#ffd84a);border:2px solid #e6b400;font-size:13px;color:#5a3d00}
.sk.blue{background:linear-gradient(180deg,#d8e8ff,#9cc2ff);border-color:#4a7fd8;color:#14306f}
.muted{color:var(--sub);font-size:13px;font-weight:500;line-height:1.6}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;padding:6px 0}
.kv span{color:var(--sub)}

/* cards */
.cards{grid-area:cards;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tcard{position:relative;border-radius:14px;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 4px 0 rgba(10,30,80,.35);text-align:center;display:flex;flex-direction:column}
.tcard .top{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 55%,#fff),var(--tc));height:78px;display:grid;place-items:center;position:relative}
.tcard .top svg.ic{width:52px;height:52px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.tcard .nm{font-size:15px;padding:6px 4px 0;white-space:nowrap}
.tcard .cost{font-size:13px;color:#d0263f}
.tcard .gn{font-size:11px;color:var(--sub);padding:2px 4px 6px;line-height:1.35;min-height:30px}
.tcard .lv{position:absolute;left:6px;top:6px;background:rgba(10,30,80,.75);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px}
.tcard .frs{position:absolute;right:4px;top:4px;display:flex;flex-direction:column;gap:2px}
.tcard .frs svg{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tcard.sel{border-color:#ffb300;box-shadow:0 0 0 3px #ffe066,0 4px 0 rgba(10,30,80,.35);transform:translateY(-4px)}
.tcard:disabled{filter:grayscale(1);opacity:.55}
.tcard .risk{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:10px;background:#d0263f;color:#fff;padding:0 6px;border-radius:99px;white-space:nowrap}

/* act */
.act{grid-area:act;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.act .desc{font-size:14px;line-height:1.55;min-height:44px}
.go{margin-top:auto;font-size:22px;padding:14px}

/* info */
.info{grid-area:info;display:grid;grid-template-columns:2fr 1.3fr 1fr;gap:10px}
.info .box{padding:8px 10px}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.wk{border-radius:10px;background:#eaf1ff;text-align:center;padding:4px 2px;font-size:12px;color:var(--sub)}
.wk b{display:block;font-size:14px;color:var(--blue);margin-top:2px;white-space:nowrap}
.wk.now{outline:3px solid #ffd23a}
.wk.ev{background:#ffe4ea}.wk.ev b{color:#d0263f}
.nextm{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:14px}
.nextm .big{font-size:17px}
.goalbar{height:14px;border-radius:99px;background:#e2e9f5;overflow:hidden;margin:8px 0 4px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf1f,#ff8a00)}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(5,15,40,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{width:min(480px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border-radius:18px;border:3px solid #fff;box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden;animation:pop .22s ease-out}
.mbox.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.mbox h3{background:linear-gradient(180deg,#2d63d6,#173c97);color:#fff;padding:10px 16px;font-size:18px}
.mbody{padding:14px 16px;overflow:auto;font-size:15px;line-height:1.7}
.mbtns{display:flex;gap:10px;padding:0 16px 14px;flex-wrap:wrap}
.mbtns .btn{flex:1;min-width:120px;padding:12px;border-radius:12px;font-size:17px;background:linear-gradient(180deg,#5d9bff,#2457c9);color:#fff;box-shadow:0 4px 0 #0f2f7a}
.mbtns .btn.y{background:linear-gradient(180deg,#fff27a,#ffbf00);color:#4a3000;box-shadow:0 4px 0 #b97a00}
.mbtns .btn.g{background:linear-gradient(180deg,#e3e9f3,#b7c3d6);color:#2a3550;box-shadow:0 4px 0 #7d8aa3}
.talk{display:flex;gap:12px;align-items:flex-start}
.talk svg{width:76px;height:76px;flex:none;border-radius:50%;background:#e9f2ff;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.talk .who{font-size:13px;color:var(--blue)}
.res{margin-top:8px;padding:8px 10px;background:#f2f7ff;border-radius:10px;font-size:14px}
.res .up{color:#1a9a4a}.res .dn{color:#d0263f}

.urow{display:grid;grid-template-columns:110px 70px 34px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed #d8e2f3;font-size:14px}
.urow .vl{text-align:right;font-size:18px}
.urow .cs{display:flex;flex-wrap:wrap;gap:4px}
.urow .ub{display:flex;gap:4px}
.ubtn{padding:7px 10px;border-radius:10px;background:linear-gradient(180deg,#6fe39a,#21a85a);color:#fff;font-size:14px;box-shadow:0 3px 0 #127a3e;white-space:nowrap}
.ubtn:disabled{background:#c9d2e0;box-shadow:0 3px 0 #9aa6ba}
.sec{margin:12px 0 4px;font-size:15px;color:var(--blue);border-left:5px solid var(--blue);padding-left:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed #d8e2f3}
.item small{display:block;color:var(--sub);font-weight:500;font-size:12px}
.optlist{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;background:#f2f7ff;border:2px solid var(--line);font-size:15px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt small{color:var(--sub);font-weight:500;font-size:12px}
.opt:disabled{opacity:.5}

/* match */
#match{padding:10px;align-items:flex-start;overflow:auto}
.mwrap{width:min(860px,100%);margin:auto;background:linear-gradient(180deg,#1e5b2e,#123d1f);border:4px solid #fff;border-radius:18px;padding:12px;color:#fff;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mhead .ttl{font-size:18px}
.mhead .role{font-size:13px;background:#ffd23a;color:#3b2a00;padding:3px 10px;border-radius:99px}
.scorewrap{overflow-x:auto}
table.score{width:100%;border-collapse:collapse;background:#0c2615;border:3px solid #6b4a20;font-family:"Courier New",monospace}
.score th,.score td{border:1px solid #2d5a3a;text-align:center;padding:5px 2px;min-width:26px;font-size:16px}
.score th{color:#cfe8d2;font-size:12px}
.score td{color:#ffe14a;font-size:20px;font-weight:900}
.score td.tn{color:#fff;font-size:13px;text-align:left;padding-left:8px;white-space:nowrap;font-family:inherit;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.score td.tot{color:#ff8a5a;font-size:22px}
.score td.hit{animation:flash .5s}
@keyframes flash{0%{background:#ffe14a;color:#0c2615}100%{background:transparent}}
.score tr.us td.tn{color:#9fd8ff}
.mfield{position:relative;margin-top:10px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#c98f5a 0 38%,#3aa356 39% 100%);height:200px}
.mfield svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:94%}
.mbig{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(30px,7vw,52px);font-weight:900;text-align:center;pointer-events:none;
  color:#fff;-webkit-text-stroke:2px #b01030;text-shadow:0 4px 0 #6b0018,0 0 20px rgba(255,255,255,.6)}
.mbig.good{-webkit-text-stroke-color:#d08a00;text-shadow:0 4px 0 #7a4a00,0 0 20px rgba(255,240,150,.9)}
.mbig.show{animation:bigIn .5s ease-out}
@keyframes bigIn{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
.msit{margin-top:10px;background:rgba(0,0,0,.35);border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px}
.msit .tag{display:inline-block;background:#ff5d7d;padding:1px 10px;border-radius:99px;font-size:13px;margin-right:6px}
.msit .tag.ch{background:#3a7be8}
.mchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mch{padding:12px 8px;border-radius:12px;background:linear-gradient(180deg,#fff,#dfe9ff);color:var(--ink);font-size:16px;box-shadow:0 4px 0 #0b2a14}
.mch small{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.mch .pc{display:block;font-size:13px;color:#d0263f;margin-top:2px}
.mch:disabled{opacity:.5}
.mlog{margin-top:10px;font-size:13px;font-weight:500;max-height:110px;overflow:auto;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px;line-height:1.6}

#toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:80;display:grid;gap:6px;pointer-events:none;width:max-content;max-width:92vw}
.tst{background:rgba(10,30,80,.92);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;border:2px solid #fff;animation:tst 2.4s forwards;text-align:center}
@keyframes tst{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}

/* ===== responsive ===== */
@media (max-width:1100px){
  #game{grid-template-columns:180px minmax(0,1fr) 330px}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cbtn{font-size:16px}
}
@media (max-width:820px){
  #game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;padding:8px;gap:8px;
    grid-template-areas:"top" "stage" "cards" "act" "cmd" "panel" "info";min-height:0}
  .topbar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"date hp money" "date mood sched";gap:6px}
  .t-date{grid-area:date;min-width:0;justify-content:center;padding:6px 10px}
  .t-date .md b{font-size:26px}
  .t-season{display:none}
  .t-hp{grid-area:hp;padding:5px 8px}.t-mood{grid-area:mood;padding:5px 8px}
  .t-money{grid-area:money;padding:5px 8px}.t-money b{font-size:16px}.t-money small{display:none}.coin{width:24px;height:24px;font-size:13px}
  .t-sched{grid-area:sched;flex-direction:row;padding:5px 8px;min-width:0}.t-sched small{display:none}.t-sched b{font-size:13px;padding:2px 8px}
  .lbl{font-size:13px}.t-hp em,.t-mood em{font-size:13px}.face{font-size:18px}
  .bar{height:13px;min-width:30px}
  .stage{height:min(62vw,330px);min-height:240px}
  .chrWrap{width:min(48%,220px)}
  .bubble{font-size:13px;padding:8px 11px;max-width:48%;top:6%}
  .cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tcard .top{height:60px}.tcard .top svg.ic{width:40px;height:40px}
  .tcard .nm{font-size:13px}.tcard .gn{font-size:10px;min-height:26px}
  .tcard .frs svg{width:22px;height:22px}
  .cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cmd .c-train{display:none}
  .cbtn{font-size:14px;padding:8px 6px;gap:5px;justify-content:center;flex-direction:column;border-radius:12px}
  .cbtn svg{width:28px;height:28px}.cbtn .arr{display:none}
  .mini-stat{grid-column:1/-1}
  .panel{max-height:none}
  .info{grid-template-columns:1fr}
  .go{font-size:20px;padding:12px}
  .act{position:sticky;bottom:6px;z-index:5}
  .act .desc{min-height:0;font-size:13px}
  .urow{grid-template-columns:1fr 60px 30px;grid-template-areas:"n v r" "c c b"}
  .urow>:nth-child(1){grid-area:n}.urow>:nth-child(2){grid-area:v}.urow>:nth-child(3){grid-area:r}.urow>:nth-child(4){grid-area:c}.urow>:nth-child(5){grid-area:b}
  .mchoices{grid-template-columns:1fr}
  .mfield{height:150px}
  .score th,.score td{font-size:14px;min-width:20px;padding:4px 1px}.score td{font-size:16px}
}

<body>

<section id="title">
  <div class="tbox">
    <div class="logo"><small>球児育成シミュレーション</small>めざせ甲子園！</div>
    <div class="tchar" id="titleChar"></div>
    <div class="tbtns" id="titleBtns">
      <button class="bigbtn press" id="btnNew">はじめから</button>
      <button class="bigbtn blue press" id="btnCont">つづきから</button>
      <button class="bigbtn blue press" id="btnOB">OB選手名鑑</button>
    </div>
    <div class="form" id="newForm" hidden>
      <div><label>選手の名前</label><input id="inName" maxlength="8" value="たかし"></div>
      <div><label>高校の名前（帽子のマークになるよ）</label><input id="inSchool" maxlength="8" value="青空高校"></div>
      <div><label>ポジション</label>
        <div class="seg" id="posSeg">
          <button data-pos="P" class="on">投手<small>球速・制球・変化球</small></button>
          <button data-pos="B">野手<small>ミート・パワー・走力</small></button>
        </div>
      </div>
      <button class="bigbtn press" id="btnStart">入部する！</button>
      <button class="bigbtn blue press" id="btnBack" style="font-size:16px;padding:10px">もどる</button>
    </div>
    <p class="note">練習で経験点を集めて「能力アップ」で選手を育てよう。<br>3年間で甲子園出場、そしてプロ入りをめざせ！</p>
  </div>
</section>

<section id="game" hidden>
  <header class="topbar">
    <div class="tb t-date"><div class="yr" id="tYear">1年目</div><div class="md"><b id="tMon">4</b>月<b id="tWeek">1</b>週</div></div>
    <div class="tb t-season" id="tSeason">春</div>
    <div class="tb t-sched"><small>今週の予定</small><b id="tSched">練習</b></div>
    <div class="tb t-hp"><span class="lbl">体力</span><div class="bar" id="hpBarW"><i id="hpBar"></i></div><em id="hpTxt">100/100</em></div>
    <div class="tb t-mood"><span class="face" id="moodFace">😐</span><span class="lbl">やる気</span><div class="bar pink"><i id="moodBar"></i></div><em id="moodTxt">普通</em></div>
    <div class="tb t-money"><span class="coin">¥</span><div><small>所持金</small><b id="tMoney">0</b></div></div>
  </header>

  <nav class="cmd" id="cmd"></nav>

  <div class="stage" id="stage">
    <div id="bg"></div>
    <div id="petals"></div>
    <div class="bubble" id="bubble">よしっ！</div>
    <div class="stageTag" id="stageTag"></div>
    <div class="chrWrap" id="chr"></div>
    <div class="fx" id="fx"></div>
  </div>

  <aside class="panel box">
    <div class="tabs" id="tabs">
      <button data-tab="ab" class="on">能力</button>
      <button data-tab="sk">特殊能力</button>
      <button data-tab="pf">プロフィール</button>
    </div>
    <div class="pts" id="ptsBox"></div>
    <div class="tabBody" id="tabBody"></div>
  </aside>

  <div class="cards" id="cards"></div>

  <div class="act box" id="act">
    <div><span class="hd" id="actHd">今週の練習</span></div>
    <div class="desc" id="actDesc"></div>
    <button class="bigbtn go press" id="goBtn">練習する！</button>
  </div>

  <footer class="info">
    <div class="box"><span class="hd">今後の予定</span><div class="weeks" id="weeks"></div></div>
    <div class="box"><span class="hd">次の試合</span><div class="nextm" id="nextBox"></div></div>
    <div class="box"><span class="hd">目標</span><div id="goalBox"></div></div>
  </footer>
</section>

<div class="overlay" id="match" hidden>
  <div class="mwrap">
    <div class="mhead"><span class="ttl" id="mTitle"></span><span class="role" id="mRole"></span></div>
    <div class="scorewrap"><table class="score"><thead><tr id="scHead"></tr></thead><tbody><tr id="rowO"></tr><tr id="rowU" class="us"></tr></tbody></table></div>
    <div class="mfield"><div id="diamond"></div><div class="mbig" id="mBig"></div></div>
    <div class="msit" id="mSit">プレイボール！</div>
    <div class="mchoices" id="mCh"></div>
    <div class="mlog" id="mLog"></div>
  </div>
</div>

<div class="overlay" id="modal" hidden>
  <div class="mbox" id="mBox">
    <h3 id="dTitle"></h3>
    <div class="mbody" id="dBody"></div>
    <div class="mbtns" id="dBtns"></div>
  </div>
</div>
