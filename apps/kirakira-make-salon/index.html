<html lang="ja">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>きらきらメイクサロン</title>
<meta name="description" content="お客さんの注文どおりに、指でリップ・アイシャドウ・チーク・アイラインをぬるメイクゲーム。はみ出さずにきれいにぬれるかな？">
<meta name="theme-color" content="#fbe3ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdeef3;--card:#ffffff;--ink:#4a2b3a;--sub:#9b7486;--pink:#ff6f9f;--pink2:#ffd2e1;--line:#f3c6d6;--gold:#e7a92b;
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;justify-content:center}
#main{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

/* 上の注文カード */
#top{display:flex;gap:10px;align-items:center;margin:8px 10px 0;padding:8px 10px;background:var(--card);border-radius:16px;box-shadow:0 2px 0 var(--line)}
#topThumb{width:54px;height:72px;border-radius:10px;background:#fff5f8;flex:none}
#topInfo{flex:1;min-width:0}
#topName{font-size:13px;font-weight:800}
#topName small{font-weight:500;color:var(--sub);margin-left:4px}
#topReq{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.req{display:inline-flex;align-items:center;gap:3px;font-size:11px;background:#fff3f7;border:1px solid var(--line);border-radius:999px;padding:2px 7px 2px 4px;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#timeBox{flex:none;text-align:center;width:48px}
#timeNum{font-size:22px;font-weight:800;line-height:1}
#timeNum.warn{color:#e2334f}
#timeBar{height:5px;border-radius:3px;background:#f6dbe5;margin-top:5px;overflow:hidden}
#timeFill{height:100%;background:var(--pink);width:100%}

#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
#cv{display:block;border-radius:18px;box-shadow:0 3px 0 var(--line);touch-action:none;background:#fff}

/* 道具 */
#tools{padding:0 10px 8px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px}
.tool{flex:1;position:relative;background:var(--card);border-radius:12px;padding:5px 2px 4px;font-size:11px;font-weight:800;box-shadow:0 2px 0 var(--line);line-height:1.25}
.tool .ic{display:block;font-size:19px}
.tool.on{background:var(--pink);color:#fff;box-shadow:0 2px 0 #d94b7d}
.tool .badge{position:absolute;top:3px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
#palette{background:var(--card);border-radius:12px;padding:6px 4px;justify-content:space-around;box-shadow:0 2px 0 var(--line);min-height:58px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;width:52px}
.chip i{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 0 0 1px rgba(0,0,0,.12)}
.chip.on i{box-shadow:inset 0 0 0 2px #fff,0 0 0 3px var(--pink)}
.chip.on{font-weight:800}
.btn{flex:1;background:var(--card);border-radius:12px;padding:9px 2px;font-size:12px;font-weight:800;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.btn.on{background:#5f4a8b;color:#fff;box-shadow:0 2px 0 #3e2f60}
#doneBtn{flex:1.5;background:var(--pink);color:#fff;box-shadow:0 2px 0 #d94b7d;font-size:14px}

/* オーバーレイ */
.ov{position:absolute;inset:0;background:rgba(253,238,243,.92);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;overflow-y:auto}
.panel{width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:18px 16px;text-align:center;box-shadow:0 4px 0 var(--line);margin:auto}
.big{display:block;width:100%;margin-top:14px;padding:14px;border-radius:16px;background:var(--pink);color:#fff;font-size:17px;font-weight:800;box-shadow:0 3px 0 #d94b7d}
.big:active,.btn:active,.tool:active{transform:translateY(2px);box-shadow:none}
h1{font-size:26px;line-height:1.3;color:var(--pink);letter-spacing:.04em}
h2{font-size:19px}
.note{font-size:13px;color:var(--sub);line-height:1.7;margin-top:10px;text-align:left}
.best{margin-top:10px;font-size:14px;font-weight:800;color:var(--gold)}
.bubble{position:relative;display:inline-block;margin-top:8px;padding:8px 12px;background:#fff3f7;border:2px solid var(--line);border-radius:14px;font-size:14px}
.reqList{margin-top:10px;display:flex;flex-direction:column;gap:6px;text-align:left}
.reqList div{display:flex;align-items:center;gap:8px;font-size:14px;background:#fff8fa;border-radius:10px;padding:6px 10px}
.reqList .dot{width:18px;height:18px}
.thumbs{display:flex;gap:10px;justify-content:center;margin-top:10px}
.thumbs figure{flex:1;max-width:150px}
.thumbs canvas{width:100%;aspect-ratio:3/4;border-radius:12px;display:block;background:#fff5f8}
.thumbs figcaption{font-size:12px;color:var(--sub);margin-top:3px}
#introThumb{width:150px;height:200px;border-radius:14px;margin:10px auto 0;display:block;background:#fff5f8}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
td{padding:5px 3px;border-bottom:1px dashed var(--line);text-align:left}
td.n{text-align:right;white-space:nowrap}
td b{font-size:15px}
.react{font-size:15px;font-weight:800;margin-top:8px}
.react span{font-size:30px;display:block}
#rTotal,#fTotal{font-size:34px;font-weight:800;color:var(--pink);margin-top:6px}
#fRank{font-size:64px;font-weight:800;line-height:1;color:var(--gold);margin-top:6px}
.small{font-size:12px;color:var(--sub)}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(74,43,58,.88);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;font-size:15px;pointer-events:none;z-index:9;transition:opacity .3s}
</style>
</head>
<body>
<div id="app"><div id="main">
  <div id="top">
    <canvas id="topThumb"></canvas>
    <div id="topInfo">
      <div id="topName"></div>
      <div id="topReq"></div>
    </div>
    <div id="timeBox"><div id="timeNum">60</div><div id="timeBar"><div id="timeFill"></div></div></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="tools">
    <div class="row" id="toolRow"></div>
    <div class="row" id="palette"></div>
    <div class="row">
      <button class="btn" id="sizeBtn">太さ:中</button>
      <button class="btn" id="eraseBtn">🧽ふき取り</button>
      <button class="btn" id="undoBtn">↩︎もどす</button>
      <button class="btn" id="zoomBtn">🔍全体</button>
      <button class="btn" id="doneBtn">完成！</button>
    </div>
  </div>

  <div class="ov" id="titleOv">
    <div class="panel">
      <div style="font-size:40px">💄✨🌸</div>
      <h1>きらきら<br>メイクサロン</h1>
      <p class="note">
        お客さんの注文どおりにメイクしてあげよう！<br>
        ・道具と色をえらんで、顔を指でなぞってぬる<br>
        ・<b>ぬり残し</b>・<b>はみ出し</b>・<b>色ちがい</b>は減点<br>
        ・たのまれていない場所をぬるのもダメ<br>
        ・「🔍」で目元・口元をアップにできるよ<br>
        ・5人のお客さんの合計点で勝負！
      </p>
      <div class="best" id="bestTxt"></div>
      <button class="big" id="startBtn">開店する！</button>
    </div>
  </div>

  <div class="ov" id="introOv" hidden>
    <div class="panel">
      <div class="small" id="introNo"></div>
      <h2 id="introName"></h2>
      <div class="bubble" id="introLine"></div>
      <canvas id="introThumb"></canvas>
      <div class="small" style="margin-top:4px">▲ 完成イメージ</div>
      <div class="reqList" id="introReq"></div>
      <div class="small" id="introTime" style="margin-top:8px"></div>
      <button class="big" id="goBtn">メイク開始！</button>
    </div>
  </div>

  <div class="ov" id="resultOv" hidden>
    <div class="panel">
      <h2 id="rName"></h2>
      <div class="thumbs">
        <figure><canvas id="rSample"></canvas><figcaption>お手本</figcaption></figure>
        <figure><canvas id="rMine"></canvas><figcaption>あなたのメイク</figcaption></figure>
      </div>
      <div class="react" id="rReact"></div>
      <table id="rTable"></table>
      <div id="rTotal"></div>
      <button class="big" id="nextBtn">次のお客さん</button>
    </div>
  </div>

  <div class="ov" id="finalOv" hidden>
    <div class="panel">
      <h2>本日の営業おわり！</h2>
      <div class="small" style="margin-top:6px">ランク</div>
      <div id="fRank"></div>
      <div id="fTotal"></div>
      <div class="small" id="fMsg" style="margin-top:4px"></div>
      <table id="fTable"></table>
      <div class="best" id="fBest"></div>
      <button class="big" id="againBtn">もう一度あそぶ</button>
    </div>
  </div>
  <div id="toast" style="opacity:0"></div>
</div></div>
