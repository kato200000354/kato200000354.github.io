<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#4a3b35;--sub:#8a766c;--acc:#ff6f9c;--acc2:#ffb12e;--pn:#fffaf3;--line:#f0dccb;--sel:#ffe1ec}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
body{background:linear-gradient(170deg,#fff3e2 0%,#ffe6ee 55%,#e9e6ff 100%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;font-size:inherit}
select{font-family:inherit}
.scr{position:fixed;inset:0;pointer-events:none;z-index:5}
.scr>*{pointer-events:auto}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 6px;pointer-events:none}

.top button{height:38px;min-width:38px;padding:0 11px;border-radius:99px;background:#ffffffd9;box-shadow:0 2px 6px #c9a08a40;font-size:15px;font-weight:800;white-space:nowrap}

.top .tg.on{background:#5cc8ff;color:#fff}

.big{display:block;width:100%;padding:13px 10px;border-radius:16px;font-size:17px;font-weight:800;background:#fff;box-shadow:0 3px 0 #e6cdbd;color:var(--ink)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 #e6cdbd}
.big.pk{background:var(--acc);color:#fff;box-shadow:0 3px 0 #d94f7d}
.big.yl{background:#ffd34d;box-shadow:0 3px 0 #e0a92a}
.big.bl{background:#5cc8ff;color:#fff;box-shadow:0 3px 0 #3a9ccc}

.row{display:flex;gap:8px;align-items:center}

#title .logo p{margin:0;font-size:13px;font-weight:800;color:var(--sub)}

.sw{width:100%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px #0000001a;position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--sub);background:#fff}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--acc)}

.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;margin-top:8px}

.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top));background:#ffffffe6;border-radius:99px;padding:6px 13px;font-size:12px;font-weight:800;color:var(--sub);white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px #c9a08a33;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.fl{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12px;font-weight:800}
.fl span{flex:0 0 5.5em}
.fl select,.sel3 select{flex:1;min-width:0;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:800;color:var(--ink);padding:0 6px}
.sel3{display:flex;gap:6px;margin-top:8px}
.nmcard{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 2px 0 var(--line)}

.nmcard button{font-size:22px;width:44px;height:40px;border-radius:12px;background:var(--sel)}

.card{position:absolute;left:0;right:0;bottom:0;background:var(--pn);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px #c9a08a33;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.card>*{max-width:520px;margin-left:auto;margin-right:auto}
.card .dn{text-align:center}
.card .dn small{display:block;font-size:12px;font-weight:800;color:var(--sub)}
.card .dn b{display:block;font-size:25px;color:#ff5d8f;line-height:1.25}

.card .chips{justify-content:center;margin-bottom:10px}
.card .row{margin-bottom:8px}
.rec{text-align:center;font-size:14px;font-weight:800;margin-bottom:8px}
.wnav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wnav b{flex:1;text-align:center;font-size:15px;color:var(--ink)}
.wnav button{width:58px;height:40px;border-radius:12px;background:var(--sel);font-size:18px;font-weight:800;color:var(--acc)}
.wnav button:disabled{opacity:.3}
.lnote{text-align:center;font-size:11.5px;font-weight:800;color:var(--sub);margin:2px 0 8px}
/* 投票 */
.vtap{position:absolute;top:calc(52px + env(safe-area-inset-top));height:calc(58vh - 52px - env(safe-area-inset-top));width:50%}
.vtap.l{left:0}.vtap.r{right:0}
.vtap.flash{background:radial-gradient(circle,#ff6f9c40,transparent 70%)}

.vc{flex:1;min-width:0;background:var(--pn);border-radius:16px;padding:8px;text-align:center;box-shadow:0 3px 10px #c9a08a33}
.vc .vn{font-size:15px;font-weight:800;color:#ff5d8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc .vp{font-size:11px;font-weight:800;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.vc .big{padding:11px 4px;font-size:16px}
.vc .bar{height:12px;border-radius:9px;background:#f3dccf;overflow:hidden;margin:6px 0 2px}
.vc .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .6s}
.vc .vr{font-size:12px;font-weight:800;min-height:1.4em}
.vc .rep{font-size:11px;color:var(--sub);text-decoration:underline;margin-top:5px;padding:2px 6px}
.vc.win{box-shadow:0 0 0 3px var(--acc),0 3px 10px #c9a08a33}
.vfoot{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;padding:0 12px}

.vmsg{position:absolute;left:16px;right:16px;top:34vh;background:var(--pn);border-radius:18px;padding:18px;text-align:center;font-weight:800;line-height:1.7;box-shadow:0 4px 16px #c9a08a44}
.vmsg .big{margin-top:10px}
.cnt{font-size:12px;font-weight:800;background:#ffffffd9;border-radius:99px;padding:5px 10px}
/* 一覧 */
.page{background:linear-gradient(170deg,#fff3e2 0%,#ffe6ee 55%,#e9e6ff 100%)}
.page .top{position:sticky}
.lwrap{position:absolute;inset:0;display:flex;flex-direction:column}
.lwrap .top{position:relative}
.ltabs{display:flex;gap:6px;padding:0 12px 8px}
.ltabs button{flex:1;padding:9px;border-radius:99px;background:#fff;font-weight:800;font-size:14px;box-shadow:0 2px 0 var(--line)}
.ltabs button.on{background:var(--acc);color:#fff}
.lbody{flex:1;overflow-y:auto;padding:0 12px calc(20px + env(safe-area-inset-bottom));touch-action:pan-y}
.lbody>*{max-width:560px;margin-left:auto;margin-right:auto}
.rk{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:7px 10px 7px 7px;margin-bottom:7px;box-shadow:0 2px 0 var(--line);width:100%;text-align:left}
.rk .no{width:30px;text-align:center;font-weight:800;font-size:16px;color:var(--sub);flex:0 0 30px}
.rk .no.g1{color:#e0a400;font-size:20px}.rk .no.g2{color:#9aa4ad;font-size:19px}.rk .no.g3{color:#c27a45;font-size:18px}
.rk img,.rk .noimg{width:58px;height:58px;border-radius:12px;flex:0 0 58px;object-fit:cover;background:#f6ece4}
.rk .tx{flex:1;min-width:0}
.rk .tx b{display:block;font-size:15px;color:#ff5d8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .tx small{display:block;font-size:11px;font-weight:800;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmsg{text-align:center;font-weight:800;color:var(--sub);padding:30px 10px;line-height:1.7}
.sec{font-size:14px;font-weight:800;margin:14px 0 7px}
.sec small{font-weight:800;color:var(--sub);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:#fff;border-radius:14px;padding:6px;box-shadow:0 2px 0 var(--line);text-align:center}
.tile img,.tile .noimg{width:100%;aspect-ratio:1;border-radius:10px;display:block;object-fit:cover;background:#f6ece4}
.tile b{display:block;font-size:12px;margin-top:4px;color:#ff5d8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font-size:10.5px;font-weight:800;color:var(--sub)}
.slot{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:7px;margin-bottom:7px;box-shadow:0 2px 0 var(--line)}
.slot img,.slot .noimg{width:58px;height:58px;border-radius:12px;flex:0 0 58px;background:#f6ece4;object-fit:cover}
.slot .tx{flex:1;min-width:0}
.slot .tx b{display:block;font-size:14px;color:#ff5d8f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .tx small{display:block;font-size:11.5px;font-weight:800;color:var(--sub)}
.slot button{padding:8px 10px;border-radius:10px;background:#efe6df;font-size:12px;font-weight:800}
.slot.empty{justify-content:center;color:var(--sub);font-weight:800;font-size:13px;min-height:58px;background:#ffffff99;box-shadow:none;border:2px dashed var(--line)}
/* ポップ */
.ov{position:fixed;inset:0;z-index:20;background:#4a3b3555;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .box{background:var(--pn);border-radius:20px;padding:16px;width:100%;max-width:380px;box-shadow:0 8px 30px #0003;max-height:86vh;overflow-y:auto}
.ov h3{margin:0 0 8px;font-size:17px;text-align:center}
.ov .mb{font-size:14px;font-weight:800;line-height:1.65;color:var(--ink);margin-bottom:12px;text-align:center}
.ov .mbtns{display:grid;gap:8px}
#pop .pal{grid-template-columns:repeat(6,1fr)}
#toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translate(-50%,-10px);opacity:0;z-index:30;background:#4a3b35ee;color:#fff;font-size:13px;font-weight:800;padding:9px 16px;border-radius:14px;pointer-events:none;transition:.25s;text-align:center;max-width:90vw;line-height:1.5}
#toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:#fff6}
#load div{background:#4a3b35ee;color:#fff;font-weight:800;padding:12px 20px;border-radius:14px;font-size:14px}
#intro .box{text-align:left}
.card{max-height:66vh;overflow-y:auto;touch-action:pan-y}
.big.x{background:#111;color:#fff;box-shadow:0 3px 0 #000}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.row3 .big{padding:12px 4px;font-size:15px}
.more{margin-top:12px;text-align:left}
.more h3{margin:0 0 7px;font-size:13px;color:var(--sub)}
.moreList{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;touch-action:pan-x pan-y;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.moreList::-webkit-scrollbar{display:none}
.moreList a{flex:0 0 132px;text-decoration:none;color:var(--ink);background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.moreList img{display:block;width:132px;height:63px;object-fit:cover;background:#f6ece4}
.moreList.tall a{flex-basis:96px}.moreList.tall img{width:96px;height:128px}

.more .follow{display:block;margin:0 0 10px;padding:10px;border-radius:14px;background:#1d9bf0;color:#fff;text-decoration:none;text-align:center;box-shadow:0 3px 0 #0d6aa8}
.more .follow b{display:block;font-size:15px}.more .follow small{font-size:12px;opacity:.9}
.moreAll{display:block;text-align:right;font-size:12px;font-weight:800;color:var(--sub);margin-top:2px}
#tbtns .links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
#intro ol{margin:0 0 12px;padding-left:1.3em;font-size:14px;font-weight:800;line-height:1.8}
</style>

<body>
<canvas id="c"></canvas>

<!-- タイトル -->
<div id="title" class="scr">
  <div class="logo"><small>まいにちらぼ</small><h1>ゆるキャラ<br>粘土工房</h1><p>こねて・つけて・ぬって　きみだけのゆるキャラを</p></div>
  <div id="tbtns">
    <button class="big pk" id="tMake">🖐 つくる</button>
    <div class="row2"><button class="big" id="tNew">⚪ まっさらから</button><button class="big" id="tRand">🎲 おまかせ</button></div>
    <div class="row2"><button class="big yl" id="tVote">🗳 人気投票</button><button class="big yl" id="tRank">🏆 ランキング</button></div>
    <button class="big gr" id="tMy">📒 マイキャラ</button>
    <div class="links"><a class="prev" id="tMore" href="/">🎮 ほかのゲームも見る</a><a class="prev" href="https://kato200000354.github.io/apps/yurukyara-koubou/">前作「ゆるキャラ工房」</a></div>
  </div>
</div>

<!-- 編集 -->
<div id="edit" class="scr" hidden>
  <div class="top"><button id="eHome">🏠</button><button id="eUndo" disabled>↩</button><button id="eRedo" disabled>↪</button><button id="eSym" class="tg on">⇔左右</button><button id="eView">◎</button><span class="sp"></span><button id="eDone" class="go">完成！</button></div>
  <div class="hint" id="hint"></div>
  <div id="panel">
    <div class="tabs" id="tabs"><button data-t="shape" class="on">🖐<b>かたち</b></button><button data-t="parts">👀<b>パーツ</b></button><button data-t="paint">🎨<b>いろ</b></button><button data-t="pat">🔶<b>もよう</b></button><button data-t="name">📛<b>なまえ</b></button></div>
    <div class="pb" id="pb-shape">
      <div class="chips" id="toolChips">
        <button data-tool="grab" class="on">👐<b>ひっぱる</b></button><button data-tool="inflate">🎈<b>ふくらむ</b></button><button data-tool="deflate">👇<b>へこむ</b></button><button data-tool="pinch">🤏<b>つまむ</b></button><button data-tool="smooth">🧽<b>ならす</b></button><button data-tool="rot">🔄<b>まわす</b></button>
      </div>
      <div class="sls two"><label class="sl"><span>ふでの大きさ</span><input id="sSize" type="range" min="1" max="10" value="4"></label><label class="sl"><span>つよさ</span><input id="sStr" type="range" min="1" max="10" value="5"></label></div>
      <div class="sub">もとの形からやりなおす</div>
