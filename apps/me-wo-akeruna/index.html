<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">

<meta name="theme-color" content="#000000">
<title>目をあけるな</title>
<style>
  :root{--fg:#d9d2c3;--dim:#8a8070;--red:#c8322a;--gold:#e7c46a;--panel:rgba(0,0,0,.9)}
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--fg);
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;touch-action:none}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0;pointer-events:none;font-size:14px;letter-spacing:.08em;text-shadow:0 0 6px #000}
  #hud .l{display:flex;flex-direction:column;gap:6px}
  #hud .row{display:flex;gap:14px;align-items:center}
  #night{color:var(--fg);font-size:16px}
  #items b{color:var(--gold)}
  #fearWrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  #fearBar{width:110px;height:6px;border:1px solid #4a3a34;background:#120807;overflow:hidden}
  #fearFill{height:100%;width:0;background:linear-gradient(90deg,#6a1c16,#d0362c)}
  #muteBtn{pointer-events:auto;background:rgba(255,255,255,.05);border:1px solid #3a332c;color:var(--dim);
    border-radius:16px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer}
  #eyeBtn{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));
    width:104px;height:104px;border-radius:50%;border:2px solid #5a4a40;background:rgba(30,20,16,.55);color:var(--fg);
    font-family:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    touch-action:none;cursor:pointer;letter-spacing:.06em}
  #eyeBtn .ic{font-size:28px;line-height:1}
  #eyeBtn.on{background:rgba(90,16,12,.6);border-color:#a0342a}
  #eyeBtn.lock{opacity:.35}
  #msg{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));text-align:center;font-size:15px;
    line-height:1.7;pointer-events:none;text-shadow:0 0 8px #000,0 0 3px #000;transition:opacity .6s;opacity:0}
  #voice{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:26px;color:#e8d8d0;letter-spacing:.3em;
    pointer-events:none;opacity:0;transition:opacity .4s;text-shadow:0 0 14px #a02018,0 0 4px #000}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--panel);
    overflow-y:auto;touch-action:pan-y}
  .card{max-width:440px;width:100%;text-align:center;padding:24px 4px}
  .card h1{font-size:40px;letter-spacing:.25em;font-weight:600;color:#e6ddcc;text-shadow:0 0 18px #6a0e0a;margin-bottom:4px}
  .card h2{font-size:24px;letter-spacing:.2em;font-weight:500;margin-bottom:18px}
  .sub{font-size:11px;letter-spacing:.5em;color:var(--dim);margin-bottom:22px}
  .rules{text-align:left;font-size:14px;line-height:1.85;color:#cfc6b4;margin:0 auto 18px;max-width:380px}
  .rules li{list-style:none;padding-left:1em;text-indent:-1em;margin-bottom:4px}
  .rules b{color:#f0e4c8;font-weight:600}
  .rules .r{color:#e0645a}
  .ctrl{font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:20px}
  .story{font-size:16px;line-height:2.2;color:#d8d0c0;margin:0 auto 26px;max-width:360px;text-align:left;white-space:pre-line}
  .story .ln{opacity:0;animation:fin 1.4s forwards}
  @keyframes fin{to{opacity:1}}
  .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
  .bt{min-width:220px;padding:13px 22px;font-size:16px;font-family:inherit;letter-spacing:.15em;color:#eee3cf;
    background:#1b1210;border:1px solid #6a4a3c;border-radius:4px;cursor:pointer}
  .bt:active{background:#3a1a14}
  .bt.sec{color:var(--dim);border-color:#3a302a;background:transparent;font-size:14px}
  .note{font-size:12px;color:#7a6e60;margin-top:16px}
</style>
</head>

<div id="hud" hidden>
  <div class="l">
    <div class="row"><span id="night">一夜目</span><span id="items">お札 <b>0</b>/3</span></div>
    <div id="fearWrap">こわさ<div id="fearBar"><div id="fearFill"></div></div></div>

  <button id="muteBtn">音 ON</button>
</div>

<div id="msg"></div>
<div id="voice"></div>
