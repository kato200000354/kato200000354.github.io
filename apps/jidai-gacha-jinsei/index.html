<!doctype html>
<html lang="ja">
<head>
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>時代ガチャ人生</title>
<meta name="description" content="原始時代から未来まで、どの時代に誰として生まれるかは完全ランダム。事件・出会い・戦・病…ランダムに起こる出来事の中で成長し、いつか死ぬ。あなたの人生は何億分の1？">
<meta name="theme-color" content="#16131c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#16131c; --panel:#211c29; --panel2:#2b2535; --line:#3b3348; --text:#f5f0e8; --muted:#a99fb8;
  --good:#7fe0a8; --bad:#ff8f8f; --gold:#ffd36b;
  --a1:#c98b4a; --a2:#4a2f1a;
  --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overflow:hidden}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation;font-size:inherit}
#app{position:fixed;inset:0;display:flex;justify-content:center;
  background:radial-gradient(120% 70% at 50% -10%,color-mix(in srgb,var(--a1) 28%,transparent),transparent 60%),var(--bg);transition:background .6s}
.scr{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:800;font-size:17px;
  background:linear-gradient(180deg,var(--a1),color-mix(in srgb,var(--a1) 70%,#000));color:#1a1208;box-shadow:0 4px 0 color-mix(in srgb,var(--a1) 45%,#000),0 10px 24px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--a1) 45%,#000)}
.btn.sub{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 #120f17}
.btn.small{min-height:40px;font-size:14px;padding:0 14px;border-radius:12px}
.muted{color:var(--muted)}

/* タイトル */
#scr-title{justify-content:center;align-items:center;text-align:center;gap:18px}
.logo-sub{font-size:13px;letter-spacing:.3em;color:var(--muted)}
.logo{font-family:var(--serif);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:1.1;margin:0;
  background:linear-gradient(180deg,#fff3d6,#e3a85c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(227,168,92,.35))}
.lead{font-size:15px;line-height:1.9;color:#ddd3e6;margin:0}
.era-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:22px;opacity:.9;max-width:360px}
.era-strip span{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--panel)}
.era-strip span.lock{filter:grayscale(1) brightness(.5)}
.t-stats{font-size:13px;color:var(--muted)}
.t-btns{display:flex;flex-direction:column;gap:12px;width:min(300px,100%)}
.t-row{display:flex;gap:10px;justify-content:center}

/* ガチャ */
#scr-roll{justify-content:center;align-items:center;text-align:center;gap:18px}
.reel{width:100%;border-radius:22px;background:var(--panel);border:2px solid var(--line);padding:26px 12px;position:relative;overflow:hidden}
.reel-ico{font-size:64px;line-height:1}
.reel-name{font-family:var(--serif);font-size:30px;font-weight:800;margin-top:8px}
.reel-year{color:var(--muted);font-size:14px;margin-top:4px}
.reel.fin{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 25%,transparent),0 0 40px color-mix(in srgb,var(--a1) 40%,transparent)}
.reveal{width:100%;display:flex;flex-direction:column;gap:10px;animation:up .5s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv-card{background:var(--panel);border-radius:18px;padding:16px;text-align:left;border:1px solid var(--line)}
.rv-name{font-family:var(--serif);font-size:28px;font-weight:800}
.rv-line{font-size:14px;line-height:1.8;color:#e7dff0}
.odds-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.odds-row b{color:var(--gold)}

/* 人生 */
#scr-life{gap:10px;padding-bottom:0}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,var(--a2),color-mix(in srgb,var(--a2) 50%,var(--panel)));border:1px solid color-mix(in srgb,var(--a1) 40%,transparent)}
.hd-ico{font-size:30px}
.hd-era{font-family:var(--serif);font-weight:800;font-size:18px;line-height:1.2}
.hd-sub{font-size:12px;color:#e9dccb;opacity:.85}
.hd-x{margin-left:auto;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.25);font-size:16px}
.person{display:flex;gap:12px;align-items:stretch}
.p-main{flex:1;min-width:0;background:var(--panel);border-radius:16px;padding:10px 12px;border:1px solid var(--line)}
.p-name{font-family:var(--serif);font-weight:800;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-job{font-size:13px;color:var(--a1);font-weight:800;margin-top:2px}
.p-fam{font-size:12px;color:var(--muted);margin-top:4px}
.p-age{width:92px;flex:none;background:var(--panel);border-radius:16px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.p-age b{font-size:40px;line-height:1;font-weight:800}
.p-age span{font-size:12px;color:var(--muted)}
.p-age.bump b{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:var(--panel);border-radius:16px;padding:10px 12px;border:1px solid var(--line)}
.st{display:flex;align-items:center;gap:8px;font-size:12px}
.st label{width:30px;color:var(--muted);flex:none}
.st .bar{flex:1;height:8px;border-radius:5px;background:#120f17;overflow:hidden}
.st .bar i{display:block;height:100%;border-radius:5px;transition:width .35s}
.st em{font-style:normal;width:24px;text-align:right;font-weight:800;font-size:12px}
.log{flex:1;min-height:0;overflow-y:auto;list-style:none;margin:0;padding:2px 2px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.log li{background:var(--panel);border-radius:12px;padding:8px 10px 8px 54px;position:relative;font-size:14px;line-height:1.6;border:1px solid transparent;animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}}
.log li .ag{position:absolute;left:8px;top:8px;width:38px;text-align:center;font-size:12px;font-weight:800;color:var(--muted);background:#15111b;border-radius:8px;padding:2px 0}
.log li.new{box-shadow:0 0 0 2px color-mix(in srgb,var(--a1) 70%,transparent);font-size:15px}
.log li.new.quiet{box-shadow:none;font-size:13px}
.log li:not(.new){opacity:.72}
.log li.quiet{background:transparent;color:var(--muted);font-size:13px;padding-top:4px;padding-bottom:4px}
.log li.quiet .ag{top:4px;background:transparent}
.log li.sys{border-color:color-mix(in srgb,var(--a1) 35%,transparent)}
.log li.big{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,211,107,.12),var(--panel))}
.log li.rare::after{content:"レア";position:absolute;right:8px;top:-7px;font-size:10px;font-weight:800;background:var(--gold);color:#2a1d00;border-radius:6px;padding:1px 6px}
.log li.death{border-color:var(--bad);background:linear-gradient(90deg,rgba(255,120,120,.16),var(--panel))}
.log .ch{display:inline-block;font-weight:800;color:var(--a1)}
.log .dl{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.log .dl span{font-size:11px;font-weight:800;padding:0 6px;border-radius:6px;background:#15111b}
.log .dl .p{color:var(--good)}.log .dl .m{color:var(--bad)}
.ctrl{display:flex;gap:8px;align-items:center;padding:10px 0 max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.ctrl .btn{flex:1;min-height:50px;font-size:15px;padding:0 10px}
.ctrl .tg{min-height:50px;padding:0 10px;border-radius:14px;background:var(--panel2);font-size:12px;font-weight:800;line-height:1.25;min-width:64px}
.ctrl .tg.on{background:color-mix(in srgb,var(--a1) 35%,var(--panel2));color:#fff}

/* 選択肢モーダル */
#modal{position:fixed;inset:0;background:rgba(8,6,12,.62);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fadeIn .2s}
.m-box{width:100%;max-width:520px;background:var(--panel);border-radius:22px 22px 0 0;padding:20px 16px max(20px,env(safe-area-inset-bottom));border-top:3px solid var(--a1);animation:up .25s ease both}
.m-age{font-size:12px;color:var(--a1);font-weight:800}
.m-text{font-size:17px;line-height:1.75;margin:6px 0 16px;font-weight:700}
.m-btns{display:flex;flex-direction:column;gap:10px}
.m-btns .btn{width:100%}

/* 終幕 */
#scr-end{overflow-y:auto;gap:14px;align-items:stretch}
.tomb{margin-top:6px;background:linear-gradient(180deg,#3a3542,#24202b);border-radius:120px 120px 18px 18px;padding:40px 18px 20px;text-align:center;border:2px solid #4b4456;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 14px 30px rgba(0,0,0,.4);animation:up .6s ease both}
.tb-era{font-size:13px;color:var(--muted)}
.tb-name{font-family:var(--serif);font-weight:800;font-size:30px;margin:6px 0 2px}
.tb-years{font-size:13px;color:#d6cde2}
.tb-age{font-family:var(--serif);font-size:20px;margin-top:10px}
.tb-cause{font-size:13px;color:var(--bad);margin-top:4px}
.tb-title{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-weight:800;font-size:15px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.odds-big{background:var(--panel);border-radius:18px;padding:16px;text-align:center;border:1px solid var(--line)}
.odds-big .lbl{font-size:13px;color:var(--muted)}
.odds-big .val{font-family:var(--serif);font-weight:800;font-size:clamp(26px,8vw,36px);color:var(--gold);margin:4px 0}
.odds-big .cmp{font-size:12px;color:#d9cfe6;line-height:1.6}
.meter{height:10px;border-radius:6px;background:#120f17;overflow:hidden;margin-top:10px;position:relative}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--gold))}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.sum{background:var(--panel);border-radius:18px;padding:14px;border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.sum dt{color:var(--muted)}.sum dd{margin:0;font-weight:700}
.hl{background:var(--panel);border-radius:18px;padding:14px;border:1px solid var(--line)}
.hl h3,.book h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:800}
.hl ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.6}
.hl li b{color:var(--a1);margin-right:6px}
#e-ach{display:flex;flex-direction:column;gap:8px}#e-ach:empty{display:none}
.new-ach{background:color-mix(in srgb,var(--gold) 14%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);border-radius:14px;padding:10px 12px;font-size:13px}
.end-btns{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.end-btns .row{display:flex;gap:10px}.end-btns .row .btn{flex:1}

/* 図鑑 */
#scr-book{overflow-y:auto;gap:14px}
.book-hd{display:flex;align-items:center;gap:10px}
.book-hd h2{margin:0;font-family:var(--serif);font-size:24px}
.book-hd .btn{margin-left:auto}
.book{background:var(--panel);border-radius:18px;padding:14px;border:1px solid var(--line)}
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.eras div{background:var(--panel2);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;line-height:1.3}
.eras div i{display:block;font-style:normal;font-size:26px;margin-bottom:2px}
.eras div.lock{opacity:.35}
.eras div small{color:var(--muted)}
.achs{display:flex;flex-direction:column;gap:6px}
.achs>div{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:10px;background:var(--panel2)}
.achs>div.lock{opacity:.4}
.achs div i{font-style:normal;font-size:20px;width:26px;text-align:center}
.achs small{display:block;color:var(--muted);font-size:11px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.recs div{background:var(--panel2);border-radius:12px;padding:8px 10px}
.recs b{display:block;font-size:16px;color:var(--gold)}
.hist{display:flex;flex-direction:column;gap:6px;font-size:12px}
.hist div{background:var(--panel2);border-radius:10px;padding:6px 10px;line-height:1.5}
.log li.meet{border-color:#c8a6ff;background:linear-gradient(90deg,rgba(200,166,255,.2),rgba(255,211,107,.12),var(--panel))}
.log li.meet::after{content:"偉人";position:absolute;right:8px;top:-7px;font-size:10px;font-weight:800;background:#c8a6ff;color:#1d1030;border-radius:6px;padding:1px 6px}
.m-box.meet{border-top-color:#c8a6ff;background:radial-gradient(120% 90% at 50% 0%,rgba(200,166,255,.22),transparent 60%),var(--panel)}
.m-box.meet .m-age{color:#d9c4ff}
.fig-name{font-family:var(--serif);font-size:30px;font-weight:800;color:var(--gold);margin:4px 0 2px;animation:up .5s ease both}
.fig-desc{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px}
.new-ach.fig{background:rgba(200,166,255,.14);border-color:rgba(200,166,255,.5)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fg-era{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--muted);margin-top:6px}
.fg{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;border:1px solid rgba(200,166,255,.35)}
.fg b{display:block}
.fg em{font-style:normal;font-size:10px;color:#d9c4ff}
.fg small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.fg small.cnt{color:var(--gold)}
.fg.lock{opacity:.45;border-color:transparent}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:20;animation:fadeIn .2s}
</style>
</head>
<body>
<div id="app">
  <section id="scr-title" class="scr">
    <div class="logo-sub">THE LOTTERY OF BIRTH</div>
    <h1 class="logo">時代ガチャ<br>人生</h1>
    <p class="lead">いつ、どこで、誰として生まれるか。<br>それは誰にも選べない。<br>原始時代から未来まで──あなたの一生は何億分の1？</p>
    <div class="era-strip" id="t-eras"></div>
    <div class="t-stats" id="t-stats"></div>
    <div class="t-btns">
      <button class="btn" id="b-born">🎲 生まれる</button>
      <div class="t-row">
        <button class="btn sub small" id="b-book">📖 図鑑・記録</button>
        <button class="btn sub small" id="b-snd">🔊 音あり</button>
      </div>
    </div>
  </section>

  <section id="scr-roll" class="scr" hidden>
    <div class="muted" style="font-size:14px">あなたが生まれるのは…</div>
    <div class="reel" id="reel"><div class="reel-ico" id="r-ico">❓</div><div class="reel-name" id="r-name">？？？</div><div class="reel-year" id="r-year"></div></div>
    <div class="reveal" id="reveal" hidden>
      <div class="rv-card">
        <div class="rv-name" id="rv-name"></div>
        <div class="rv-line" id="rv-line"></div>
        <div class="odds-row"><span>この時代に生まれる確率</span><b id="rv-p1"></b></div>
        <div class="odds-row"><span>この家に生まれる確率</span><b id="rv-p2"></b></div>
      </div>
      <button class="btn" id="b-start">人生をはじめる</button>
      <button class="btn sub small" id="b-reroll">…いや、生まれ直す（記録されません）</button>
    </div>
  </section>

  <section id="scr-life" class="scr" hidden>
    <div class="hd">
      <div class="hd-ico" id="h-ico"></div>
      <div><div class="hd-era" id="h-era"></div><div class="hd-sub" id="h-sub"></div></div>
      <button class="hd-x" id="b-quit" aria-label="タイトルへ">✕</button>
    </div>
    <div class="person">
      <div class="p-main"><div class="p-name" id="p-name"></div><div class="p-job" id="p-job"></div><div class="p-fam" id="p-fam"></div></div>
      <div class="p-age" id="p-age"><b id="p-agen">0</b><span>歳</span></div>
    </div>
    <div class="stats" id="stats"></div>
    <ul class="log" id="log"></ul>
    <div class="ctrl" id="ctrl">
      <button class="tg" id="b-omakase">選択も<br>おまかせ</button>
      <button class="btn" id="b-auto">▶ 自動</button>
      <button class="btn sub" id="b-step">1年すすむ</button>
      <button class="tg" id="b-speed">ふつう</button>
    </div>
  </section>

  <section id="scr-end" class="scr" hidden>
    <div class="tomb">
      <div class="tb-era" id="e-era"></div>
      <div class="tb-name" id="e-name"></div>
      <div class="tb-years" id="e-years"></div>
      <div class="tb-age" id="e-age"></div>
      <div class="tb-cause" id="e-cause"></div>
      <div class="tb-title" id="e-title"></div>
    </div>
    <div class="odds-big">
      <div class="lbl">この人生が生まれる確率は</div>
      <div class="val" id="e-odds"></div>
      <div class="cmp" id="e-cmp"></div>
      <div class="meter"><i id="e-meter"></i><b id="e-mark"></b></div>
    </div>
    <div id="e-ach"></div>
    <dl class="sum" id="e-sum"></dl>
    <div class="hl"><h3>人生のハイライト</h3><ol id="e-hl"></ol></div>
    <div class="end-btns">
      <button class="btn" id="b-again">🎲 次の人生へ（生まれ変わる）</button>
      <div class="row"><button class="btn sub small" id="b-copy">結果をコピー</button><button class="btn sub small" id="b-ebook">📖 図鑑</button><button class="btn sub small" id="b-etitle">タイトル</button></div>
    </div>
  </section>

  <section id="scr-book" class="scr" hidden>
    <div class="book-hd"><h2>図鑑・記録</h2><button class="btn sub small" id="b-bback">もどる</button></div>
    <div class="book"><h3>生まれた時代</h3><div class="eras" id="bk-eras"></div></div>
    <div class="book"><h3>最高記録</h3><div class="recs" id="bk-recs"></div></div>
    <div class="book"><h3 id="bk-fh">偉人図鑑</h3><div class="figs" id="bk-figs"></div></div>
    <div class="book"><h3>実績</h3><div class="achs" id="bk-achs"></div></div>
    <div class="book"><h3>最近の人生</h3><div class="hist" id="bk-hist"></div></div>
  </section>
</div>

<div id="modal" hidden><div class="m-box"><div class="m-age" id="m-age"></div><div class="m-text" id="m-text"></div><div class="m-btns" id="m-btns"></div></div></div>

<script>
'use strict';
const R = Math.random;
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function wpick(arr, wf) { let t = 0; for (const x of arr) t += wf(x); let r = R() * t; for (const x of arr) { r -= wf(x); if (r <= 0) return x; } return arr[arr.length - 1]; }

    log: [], big: [], odds: Math.log10(1 / pEra) + Math.log10(1 / pCls) + Math.log10(2), nev: 0, rareN: 0,
    pd: [0, 1].map(() => Math.floor(E.ps[0] + R() * (E.ps[1] - E.ps[0]))), maxMoney: 0, maxFame: 0,
    dead: false, cause: '', pending: null, pEra, pCls, met: {}, metList: [], newFigs: [],
  };
  for (const k in (cls.st || {})) S[k] = clamp(S[k] + cls.st[k], 0, 100);
  S.base = clamp(S.hp + 15, 60, 98);
  // ごくまれに「歴史上の人物と出会う運命」を持って生まれる
  if (E.figs.length && R() < .08) {
    const f = pick(E.figs), my = Math.floor(f.y[0] + R() * (f.y[1] - f.y[0] + 1));
    S.by = my - Math.floor(8 + R() * 35); S.fate = { f, y: my };
  }
  return S;
}

const curYear = () => S.by + S.age;
const jobName = () => S.custom || (S.lad && S.jobLv >= 0 ? S.lad[S.jobLv] : (S.age < 6 ? (S.age < 2 ? '赤ちゃん' : '子ども') : S.age < S.E.work ? '子ども' : '働き手'));
const fill = t => t.replace(/\{tbig\}/g, () => S.talent ? TAL[S.talent].big.replace('{v}', TVENUE[tgroup()]) : '').replace(/\{opus\}/g, () => S.talent ? TAL[S.talent].o : '').replace(/\{name\}/g, S.given).replace(/\{sp\}/g, S.sp || '伴侶').replace(/\{talent\}/g, () => S.talent || pick(TALENT));

function ok(e) {
  if (!e.rep && S.done[e.id]) return false;
  const a = e.a || [0, 200];
  if (S.age < a[0] || S.age > a[1]) return false;
  if (e.ch && S.age < 6) return false;
  if (e.y) { const y = curYear(); if (y < e.y[0] || y > e.y[1]) return false; }
  if (e.g && e.g !== S.g) return false;
  if (e.c && !e.c(S)) return false;
  return true;
}

function newEntry(t, cls) { return { age: S.age, t, cls: cls || '', d: [], after: [] }; }
function pushLog(en) { S.log.push(en); if (en.big || en.rare) S.big.push(en); UI.log(en); }

function applyO(o, en, gen) {
  if (o.fx) for (const k in o.fx) {
    const b = S[k]; S[k] = clamp(S[k] + o.fx[k], 0, 100);
    const d = Math.round(S[k]) - Math.round(b); if (d) en.d.push([k, d]);
  }
  if (o.flag) S.flags[o.flag] = 1;
  if (o.rare) { S.odds += Math.log10(o.rare); S.rareN++; en.cls += ' rare'; en.rare = 1; }
  if (o.big) { en.cls += ' big'; en.big = 1; }
  if (o.setJob) { S.custom = o.setJob; S.lad = null; en.after.push(`「${o.setJob}」として生きることにした。`); }
  if (o.tpath) { S.flags.tPath = 1; S.tLad = TAL[S.talent].lad[tgroup()]; S.lad = S.tLad; S.jobLv = 0; S.custom = null; en.after.push(`「${S.lad[0]}」になった。`); }
  if (o.lad) { S.lad = o.lad; S.jobLv = 0; S.custom = null; en.after.push(`「${S.lad[0]}」になった。`); }
  if (o.jobUp) jobUp(en);
  if (o.marry && !S.married) marry(en);
  if (o.die) {
    let p = o.dp * (gen ? S.E.risk : 1);
    if (o.dp < 1) p *= (1.25 - S.hp / 200);
    if (R() < p) en.death = o.die;
    else if (o.sv) en.after.push(o.sv);
  }
}

function jobUp(en) {
  if (!S.lad) return;
  if (S.jobLv < 0) { S.jobLv = 0; en.after.push(`「${jobName()}」になった。`); return; }
  if (S.jobLv >= S.lad.length - 1) return;
  S.jobLv++;
  if (S.jobLv === S.lad.length - 1) {
    en.after.push(`ついに「${jobName()}」にのぼりつめた！`); en.cls += ' big'; en.big = 1;
    if (!S.flags.top) { S.flags.top = 1; S.odds += Math.log10(8); S.fame = clamp(S.fame + 12, 0, 100); }
  } else en.after.push(`「${jobName()}」に出世した！`);
  S.fame = clamp(S.fame + 4, 0, 100);
}

function marry(en) {
  S.married = true; S.everMarried = true; S.widow = false;
  const names = (S.cls.sur && S.E.names2) ? S.E.names2 : S.E.names;
  S.sp = pick(names[S.g === 'm' ? 'f' : 'm']);
  S.happy = clamp(S.happy + 12, 0, 100);
  en.after.push(`${S.sp}と結婚した！`);
}

function runEvent(ev) {
  S.done[ev.id] = 1;
  if (ev.talent && !S.talent) { S.talent = pick(TALENT); S.talentAge = S.age; }
  const text = fill(ev.t);
  if (ev.ch) { S.pending = { ev, text }; UI.choice(ev, text); return; }
  const en = newEntry(text);
  applyO(ev, en, ev.gen);
  finishEntry(en);
}

function finishEntry(en) {
  S.nev++; S.odds += .075;
  pushLog(en);
  if (en.death) die(en.death);
}

function choose(i) {
  if (!S || !S.pending) return;
  if (S.pending.meet) return closeMeet();
  const { ev, text } = S.pending;
  const c = ev.ch[i];
  let rs2 = c.r.map(r => r.p);
  if (c.s && rs2.length > 1) {
    const sv = c.s === 'tal' ? (S[TAL[S.talent].s] + 15) : S[c.s];
    const adj = (sv - 50) / 250 + (S.luck - 50) / 500;
    const p0 = clamp(rs2[0] + adj, .03, .97), rest = rs2.slice(1).reduce((a, b) => a + b, 0);
    rs2 = [p0, ...rs2.slice(1).map(p => p / rest * (1 - p0))];
  }
  let r = R(), res = c.r[c.r.length - 1];
  for (let k = 0; k < c.r.length; k++) { r -= rs2[k]; if (r <= 0) { res = c.r[k]; break; } }
  S.pending = null;
  const en = newEntry(`${text} <span class="ch">→ ${c.t}</span>${res.t ? ' ' + fill(res.t) : ''}`);
  applyO(res, en, ev.gen);
  finishEntry(en);
  if (!S.dead) endYear();
}

function sysYear() {
  const E = S.E;
  for (let i = 0; i < 2; i++) if (S.pd[i] === S.age && S.age > 0) {
    const en = newEntry(i === 0 ? '父が亡くなった。' : '母が亡くなった。', 'sys');
    applyO({ fx: { happy: -12 } }, en);
    if (i === 0 && S.cls.st && S.cls.st.money > 20) { applyO({ fx: { money: 10 } }, en); en.after.push('家を継いだ。'); }
    pushLog(en);
  }
  if (S.age === E.work && S.jobLv < 0 && S.lad) {
    S.jobLv = 0; pushLog(newEntry(`「${jobName()}」として働き始めた。`, 'sys'));
  } else if (S.lad && S.jobLv >= 0 && S.jobLv < S.lad.length - 1 && S.age < 70) {
    let p = .026 + (S.int + S.chr + S.luck - 150) / 3000;
    if (S.jobLv === S.lad.length - 2) p *= .25;
    if (S.E.work >= 20) p *= .6;
    if (R() < p) { const en = newEntry('', 'sys'); jobUp(en); en.t = en.after.shift(); S.nev++; S.odds += .075; pushLog(en); }
  }
  if (!S.married && S.age >= E.marry[0] && S.age <= E.marry[1] && R() < (S.widow ? .04 : .09) + S.chr / 700) {
    const en = newEntry('', 'sys'); marry(en); en.t = en.after.shift(); en.d.push(['happy', 12]); pushLog(en);
  }
  if (S.married && S.age <= (S.g === 'f' ? 44 : 55) && R() < E.kids) {
    S.kids++;
    const en = newEntry(`子どもが生まれた！（${S.kids}人目）`, 'sys');
    applyO({ fx: { happy: 10 } }, en);
    if (R() < E.mort.inf * 2) { S.kidsLost++; en.after.push('…しかし、その子は幼くして亡くなった。'); applyO({ fx: { happy: -20 } }, en); }
    pushLog(en);
  }
  if (S.married && S.age > 22 && R() < E.mort.bg + E.mort.old * Math.exp(E.mort.g * (S.age + 2)) + .002) {
    S.married = false; S.widow = true;
    const en = newEntry(`${S.sp}に先立たれた…`, 'sys'); applyO({ fx: { happy: -25 } }, en); pushLog(en);
  }
}

function hazard(age) {
  const m = S.E.mort;
  let h = m.inf * Math.exp(-age / 1.5) + m.bg + m.old * Math.exp(m.g * age);
  h *= (1.3 - S.hp / 150);
  return Math.min(h, .9);
}

function naturalCause() {
  const E = S.E, m = E.mort;
  if (S.age < 5) return pick(E.dInf);
  const old = m.old * Math.exp(m.g * S.age);
  if (S.age >= 55 && R() < old / (old + m.bg)) return pick(E.old);
  return pick(E.d);
}

function step() {
  if (!S || S.dead || S.pending) return;
  sysYear();
  const yy = curYear();
  if (S.fate && !S.met[S.fate.f.id] && yy === S.fate.y) { meet(S.fate.f); return; }
  for (const f of S.E.figs) {
    if (S.met[f.id] || yy < f.y[0] || yy > f.y[1] || S.age < 5) continue;
    if (R() < .0003 * (.6 + S.luck / 100)) { meet(f); return; }
  }
  let ev = null;
  const all = S.E.ev.concat(GEN);
  for (const f of all) if (f.force && ok(f) && R() < f.force) { ev = f; break; }
  if (!ev && R() < (S.age < 3 ? .45 : .72)) {
    const pool = all.filter(e => !e.force && ok(e));
    if (pool.length) ev = wpick(pool, e => (e.w ?? 1) * (e.gen ? 1 : 1.8));
  }
  if (ev) { runEvent(ev); if (S.pending || S.dead) return; }
  else pushLog(newEntry(pick(S.age < 4 ? QUIET_BABY : S.age >= 65 ? QUIET_OLD : QUIET), 'quiet'));
  endYear();
}

function meet(f) {
  S.met[f.id] = 1; S.metList.push(f);
  const en = newEntry(f.t, 'meet');
  applyO({ fx: f.fx, rare: 150, big: 1 }, en);
  en.after.push(`【${f.n}】`);
  S.nev++; S.odds += .075;
  pushLog(en);
  const isNew = !DB.figs[f.id];
  DB.figs[f.id] = (DB.figs[f.id] || 0) + 1; saveDB();
  if (isNew) S.newFigs.push(f);
  S.pending = { meet: f };
  UI.meet(f, isNew);
}
function closeMeet() { if (!S || !S.pending || !S.pending.meet) return; S.pending = null; endYear(); }

function endYear() {
  if (S.dead) return;
  if (S.age >= 125 || R() < hazard(S.age)) { die(S.age >= 125 ? '老衰' : naturalCause()); return; }
  // 成長と老い
  const a = S.age;
  if (a < 18) { S.hp += 1.2 + R(); S.int += R() * 2.2; S.chr += R() * 1.2; }
  else { const fit = clamp(S.base - Math.max(0, a - 30) * .9, 15, 95); S.hp += (fit - S.hp) * .12; if (a > 65) S.int -= R() * .6; }
  if (S.jobLv >= 0 || S.custom) S.money += (S.custom ? .4 : .2 + S.jobLv * .55) + (R() - .5) * 1.2;
  else if (a >= S.E.work) S.money -= .3;
  S.happy += (S.money - 35) / 80 + (S.married ? .8 : 0) - (S.hp < 30 ? 1 : 0) + (55 - S.happy) * .03;
  for (const k of stats) S[k] = clamp(S[k], 0, 100);
  S.maxMoney = Math.max(S.maxMoney, S.money); S.maxFame = Math.max(S.maxFame, S.fame);
  S.age++;
  UI.render(true);
}

function die(cause) {
  S.dead = true; S.cause = cause;
  S.maxMoney = Math.max(S.maxMoney, S.money); S.maxFame = Math.max(S.maxFame, S.fame);
  if (S.age >= 100) S.odds += 1;
  const en = newEntry(cause === 'デジタル存在への移行' ? `${S.age}歳で肉体の生涯を終え、データの海へ旅立った。` : `${S.age}歳でこの世を去った。死因：${cause}`, 'death');
  pushLog(en);
  UI.dead();
}

function lifeTitle() {
  const top = S.lad && S.jobLv === S.lad.length - 1;
  if (S.cause === 'デジタル存在への移行') return '電脳の海へ旅立った人';
  if (S.age < 1) return '生まれてすぐの、小さな命';
  if (S.age < 10) return '短い命を駆け抜けた子';
  if (top && S.fame >= 70) return `伝説の${S.lad[S.jobLv]}`;
  if (top) return `${S.lad[S.jobLv]}にのぼりつめた人`;
  if (S.flags.masterpiece) return `${S.talent}の道を極めた人`;
  if (S.flags.tPath && S.fame >= 50) return `${S.talent}に生きた人`;
  if (S.fame >= 85) return '歴史に名を残した偉人';
  if (S.money >= 90) return '巨万の富を築いた人';
  if (S.age >= 100) return '百寿の大往生';
  if (S.rareN >= 4) return '波乱万丈の人生';
  if (S.kids - S.kidsLost >= 6) return '大家族の祖';
  if (S.happy >= 80) return '幸せに満ちた人生';
  if (S.age < 20) return '若くして散った命';
  if (S.happy <= 15) return '苦難を生き抜いた人';
  if (S.fame >= 50) return '土地の名士';
  return '名もなき、けれど確かな一生';
}

function recordLife() {
  const newly = [];
  const give = id => { if (!DB.ach[id]) { DB.ach[id] = 1; newly.push(ACH.find(a => a.id === id)); } };
  DB.lives++;
  DB.eras[S.E.id] = (DB.eras[S.E.id] || 0) + 1;
  give('first');
  if (S.flags.top) give('top');
  if (S.age >= 100) give('cent');
  if (S.age < 1) give('baby');
  if (S.odds >= Math.log10(8e9)) give('oku');
  if (S.pCls <= .05) give('royal');
  if (S.maxMoney >= 100) give('rich');
  if (S.maxFame >= 100) give('fame');
  if (S.happy >= 100) give('happy');
  if (S.kids >= 8) give('big');
  if (S.log.some(l => l.t.startsWith('雷に打たれた') && !l.death)) give('thunder');
  if (S.log.some(l => l.t.startsWith('空から光る'))) give('ufo');
  if (S.cause === 'デジタル存在への移行') give('digital');
  if (ERAS.every(e => DB.eras[e.id])) give('all');
  const nf = ALLFIGS.filter(f => DB.figs[f.id]).length;
  if (S.metList.length) give('meet1');
  if (S.metList.length >= 2) give('meet2');
  if (nf >= 10) give('meet10');
  if (nf >= ALLFIGS.length) give('meetall');
  if (S.flags.masterpiece) give('master');
  if (S.tLad && S.lad === S.tLad && S.jobLv === S.lad.length - 1) give('tTop');
  DB.best.age = Math.max(DB.best.age, S.age);
  DB.best.odds = Math.max(DB.best.odds, S.odds);
  DB.best.fame = Math.max(DB.best.fame, Math.round(S.maxFame));
  DB.best.money = Math.max(DB.best.money, Math.round(S.maxMoney));
  DB.hist.unshift({ n: S.name, e: S.E.name, i: S.E.icon, a: S.age, c: S.cause, t: lifeTitle(), o: S.odds });
  DB.hist = DB.hist.slice(0, 15);
  saveDB();
  return newly;
}

// ================= 画面 =================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 1年あたりの基本の待ち時間。何もない年は短く、大事な出来事の年は長く止まる
const SPEEDS = [[2600, 'じっくり'], [1600, 'ゆっくり'], [950, 'ふつう'], [380, 'はやい'], [70, '爆速']];
let autoT = null, auto = false, speed = clamp(DB.speed ?? 1, 0, SPEEDS.length - 1), omakase = false, yearW = 0;

let AC = null;
function tone(f, d = .09, type = 'sine', v = .05, delay = 0) {
  if (DB.muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) { }
}

function show(id) { for (const s of document.querySelectorAll('.scr')) s.hidden = s.id !== id; }
function setTheme(E) { const r = document.documentElement.style; r.setProperty('--a1', E ? E.a1 : '#c98b4a'); r.setProperty('--a2', E ? E.a2 : '#4a2f1a'); }

const UI = {
  log(en) {
    const li = document.createElement('li');
    li.className = en.cls;
    let h = `<span class="ag">${en.age}歳</span>${en.t}`;
    if (en.after.length) h += ' ' + en.after.map(esc).join(' ');
    if (en.d.length) h += '<div class="dl">' + en.d.map(([k, d]) => `<span class="${d > 0 ? 'p' : 'm'}">${STAT_NAME[k]}${d > 0 ? '+' : ''}${d}</span>`).join('') + '</div>';
    li.innerHTML = h;
    li.classList.add('new');
    const L = $('log'); L.prepend(li); L.scrollTop = 0;
    const len = (en.t + en.after.join('')).replace(/<[^>]+>/g, '').length;
    yearW = Math.max(yearW, en.cls.includes('quiet') ? .4 : (en.big || en.rare || en.cls.includes('meet')) ? 2.3 : .9 + Math.min(len, 120) / 120 * .7);
    while (L.children.length > 160) L.lastChild.remove();
    if (en.cls.includes('death')) tone(196, .9, 'triangle', .07), tone(147, 1.2, 'triangle', .06, .25);
    else if (en.big) tone(660, .12, 'sine', .05), tone(990, .18, 'sine', .04, .1);
  },
  render(bump) {
    if (!S) return;
    const E = S.E;
    $('h-ico').textContent = E.icon; $('h-era').textContent = E.name;
    $('h-sub').textContent = `${yearStr(curYear())}・${S.place}`;
    $('p-name').textContent = S.name;
    $('p-job').textContent = jobName();
    $('p-fam').textContent = `${S.cls.n}／${S.g === 'm' ? '男' : '女'}／${S.married ? '配偶者：' + S.sp : S.widow ? '配偶者：死別' : '独身'}／子：${S.kids - S.kidsLost}人`;
    $('p-agen').textContent = S.age;
    if (bump) { const a = $('p-age'); a.classList.remove('bump'); void a.offsetWidth; a.classList.add('bump'); }
    $('stats').innerHTML = STAT.map(([k, n, c]) => `<div class="st"><label>${n}</label><div class="bar"><i style="width:${S[k]}%;background:${c}"></i></div><em>${Math.round(S[k])}</em></div>`).join('');
  },
  choice(ev, text) {
    stopAuto(true);
    if (omakase) { setTimeout(() => { if (S && S.pending) { yearW = 0; choose(Math.floor(R() * ev.ch.length)); afterChoice(); } }, Math.max(150, SPEEDS[speed][0] * .6)); return; }
    $('m-age').textContent = `${S.age}歳・${yearStr(curYear())}`;
    $('m-text').textContent = text;
    $('m-btns').innerHTML = '';
    ev.ch.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'btn' + (i ? ' sub' : ''); b.textContent = c.t;
      b.onclick = () => { $('modal').hidden = true; yearW = 0; choose(i); afterChoice(); };
      $('m-btns').appendChild(b);
    });
    $('modal').hidden = false;
    tone(520, .1, 'square', .03);
  },
  meet(f, isNew) {
    stopAuto(true);
    const box = $('modal').firstElementChild; box.classList.add('meet');
    $('m-age').textContent = `✨ 歴史上の人物に出会った！（${S.age}歳・${yearStr(curYear())}）`;
    $('m-text').innerHTML = `<div class="fig-name">${esc(f.n)}</div><div class="fig-desc">${esc(f.d)}</div>${esc(f.t)}`;
    $('m-btns').innerHTML = '';
    const b = document.createElement('button'); b.className = 'btn';
    b.textContent = isNew ? '📖 偉人図鑑に登録する（NEW）' : '📖 つづける（図鑑に登録ずみ）';
    let closed = false;
    const close = () => { if (closed) return; closed = true; $('modal').hidden = true; box.classList.remove('meet'); closeMeet(); afterChoice(); };
    b.onclick = close; $('m-btns').appendChild(b);
    $('modal').hidden = false;
    if (omakase) setTimeout(() => { if (!$('modal').hidden) close(); }, Math.max(1500, SPEEDS[speed][0] * 2.5));
    [784, 988, 1175, 1568].forEach((f2, i) => tone(f2, .25, 'sine', .05, i * .09));
  },
  dead() {
    stopAuto();
    $('modal').hidden = true;
    UI.render();
    $('ctrl').innerHTML = '<button class="btn" id="b-review" style="flex:1">🪦 人生をふりかえる</button>';
    $('b-review').onclick = showEnd;
  },
};

function afterChoice() { UI.render(); if (S && !S.dead && wasAuto) startAuto(true); }
let wasAuto = false;
const waitMs = () => SPEEDS[speed][0] * Math.max(yearW, .4);
function startAuto(resume) { auto = true; wasAuto = true; $('b-auto').textContent = '⏸ 止める'; clearTimeout(autoT); if (resume) autoT = setTimeout(tick, Math.max(waitMs(), 600)); else tick(); }
function doStep() { for (const li of document.querySelectorAll('#log li.new')) li.classList.remove('new'); yearW = 0; step(); }
function stopAuto(keep) { auto = false; if (!keep) wasAuto = false; clearTimeout(autoT); const b = $('b-auto'); if (b) b.textContent = '▶ 自動'; }
function tick() {
  clearTimeout(autoT);
  if (!auto || !S || S.dead || S.pending) return;
  doStep();
  if (!S.dead && !S.pending) autoT = setTimeout(tick, waitMs());
}

function resetCtrl() {
  $('ctrl').innerHTML = `<button class="tg${omakase ? ' on' : ''}" id="b-omakase">選択も<br>おまかせ</button><button class="btn" id="b-auto">▶ 自動</button><button class="btn sub" id="b-step">1年すすむ</button><button class="tg" id="b-speed">${SPEEDS[speed][1]}</button>`;
  $('b-auto').onclick = () => { if (auto) stopAuto(); else startAuto(); };
  $('b-step').onclick = () => { stopAuto(); doStep(); };
  $('b-speed').onclick = e => { speed = (speed + 1) % SPEEDS.length; e.currentTarget.textContent = SPEEDS[speed][1]; DB.speed = speed; saveDB(); };
  $('b-omakase').onclick = e => { omakase = !omakase; e.currentTarget.classList.toggle('on', omakase); };
}

function titleScreen() {
  stopAuto(); S = null; setTheme(null); show('scr-title');
  $('t-eras').innerHTML = ERAS.map(e => `<span class="${DB.eras[e.id] ? '' : 'lock'}" title="${e.name}">${e.icon}</span>`).join('');
  const n = ERAS.filter(e => DB.eras[e.id]).length;
  const nf = ALLFIGS.filter(f => DB.figs[f.id]).length;
  $('t-stats').textContent = DB.lives ? `これまで ${DB.lives} 回の人生／${n}/${ERAS.length} の時代／偉人 ${nf}/${ALLFIGS.length}人` : `全${ERAS.length}の時代。どこに生まれるかは運しだい。`;
  $('b-snd').textContent = DB.muted ? '🔇 音なし' : '🔊 音あり';
}

function roll() {
  stopAuto();
  const L = newLife();
  show('scr-roll'); setTheme(null);
  $('reveal').hidden = true; $('reel').classList.remove('fin');
  let n = 0; const total = 26;
  const spin = () => {
    n++;
    const e = n >= total ? L.E : ERAS[Math.floor(R() * ERAS.length)];
    $('r-ico').textContent = e.icon; $('r-name').textContent = e.name; $('r-year').textContent = n >= total ? `${yearStr(L.by)}・${L.place}` : '';
    if (n < total) { tone(300 + (n % 5) * 60, .04, 'square', .025); setTimeout(spin, 40 + n * n * .3); }
    else {
      setTheme(L.E); $('reel').classList.add('fin');
      tone(523, .15, 'sine', .06); tone(659, .15, 'sine', .06, .12); tone(784, .3, 'sine', .06, .24);
      setTimeout(() => {
        $('rv-name').textContent = L.name;
        $('rv-line').innerHTML = `${esc(L.cls.n)}の<b>${L.g === 'm' ? '男の子' : '女の子'}</b>として生まれる。<br>体力${L.hp}・知力${L.int}・魅力${L.chr}・運${L.luck}`;
        $('rv-p1').textContent = fmtOdds(Math.log10(1 / L.pEra));
        $('rv-p2').textContent = (L.pCls * 100).toFixed(L.pCls < .1 ? 1 : 0) + '%';
        $('reveal').hidden = false;
      }, 380);
    }
  };
  spin();
}

function beginLife() {
  show('scr-life'); resetCtrl(); setTheme(S.E);
  $('log').innerHTML = '';
  const en = newEntry(`${yearStr(S.by)}、${S.place}で、${S.cls.n}の${S.g === 'm' ? '男の子' : '女の子'}として生まれた。名前は「${S.given}」。`, 'sys big');
  pushLog(en);
  UI.render();
  startAuto();
}

function showEnd() {
  const newly = recordLife();
  show('scr-end'); $('scr-end').scrollTop = 0;
  const E = S.E;
  $('e-era').textContent = `${E.icon} ${E.name}・${S.place}`;
  $('e-name').textContent = S.name;
  $('e-years').textContent = `${yearStr(S.by)} 〜 ${yearStr(curYear())}`;
  $('e-age').textContent = `享年 ${S.age}`;
  $('e-cause').textContent = `死因：${S.cause}`;
  $('e-title').textContent = lifeTitle();
  $('e-odds').textContent = fmtOdds(S.odds);
  const oku = Math.log10(8e9);
  $('e-cmp').innerHTML = S.odds >= oku ? '地球の人口（約80億人）よりも希少な、<b>たったひとつの人生</b>。' : `80億分の1まで、あと${fmtOdds(oku - S.odds).replace('分の1', '倍')}。<br>長く、波乱に満ちた人生ほど希少になる。`;
  $('e-meter').style.width = Math.min(100, S.odds / 14 * 100) + '%';
  $('e-mark').style.left = (oku / 14 * 100) + '%';
  $('e-ach').innerHTML = S.newFigs.map(f => `<div class="new-ach fig">📖 偉人図鑑に登録：<b>${esc(f.n)}</b>（${esc(f.era.name)}）</div>`).join('') + newly.map(a => `<div class="new-ach">🏅 実績解除：<b>${a.i} ${a.n}</b> — ${a.d}</div>`).join('');
  const job = S.custom || (S.lad && S.jobLv >= 0 ? S.lad[S.jobLv] : 'なし');
  $('e-sum').innerHTML = [
    ['生まれ', `${S.cls.n}（${(S.pCls * 100).toFixed(S.pCls < .1 ? 1 : 0)}%）`], ['最後の職業', job],
    ['家族', `${S.everMarried ? '結婚した' : '生涯独身'}／子ども${S.kids}人${S.kidsLost ? `（うち${S.kidsLost}人は早世）` : ''}`],
    ['財産', `${Math.round(S.money)}（最高 ${Math.round(S.maxMoney)}）`], ['名声', `${Math.round(S.fame)}`], ['幸福', `${Math.round(S.happy)}`],
    ['出来事', `${S.nev}件（レア ${S.rareN}件）`],
    ['才能', S.talent ? `${S.talent}${S.flags.tPath ? '（その道に生きた）' : S.flags.tHobby ? '（趣味として楽しんだ）' : ''}${S.flags.masterpiece ? `・「${TAL[S.talent].o}」を成しとげた` : ''}${S.flags.disciple ? '・弟子がいた' : ''}` : '開花しなかった'],
    ['出会った偉人', S.metList.length ? S.metList.map(f => f.n).join('、') : 'なし'],
  ].map(([a, b]) => `<dt>${a}</dt><dd>${esc(b)}</dd>`).join('');
  const hl = S.big.slice(-8);
  $('e-hl').innerHTML = hl.length ? hl.map(e => `<li><b>${e.age}歳</b>${e.t.replace(/<[^>]+>/g, '')}${e.after.length ? ' ' + esc(e.after.join(' ')) : ''}</li>`).join('') : '<li class="muted">大きな事件のない、静かな一生だった。</li>';
  if (newly.length) tone(880, .15, 'sine', .05, .3), tone(1175, .25, 'sine', .05, .45);
}

function copyResult() {
  const t = `【時代ガチャ人生】\n${S.E.icon}${S.E.name}（${yearStr(S.by)}）に${S.cls.n}の${S.g === 'm' ? '男' : '女'}として生まれた「${S.name}」\n享年${S.age}・死因：${S.cause}\n称号：${lifeTitle()}\nこの人生は ${fmtOdds(S.odds)}\n${location.href}`;
  const done = () => toast('コピーしました');
  try { navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); } catch (e) { fallbackCopy(t, done); }
}
function fallbackCopy(t, done) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { } ta.remove(); }
function toast(m) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 1600); }

let bookBack = 'title';
function showBook(from) {
  bookBack = from; show('scr-book'); $('scr-book').scrollTop = 0;
  $('bk-eras').innerHTML = ERAS.map(e => DB.eras[e.id] ? `<div><i>${e.icon}</i>${e.name}<br><small>${DB.eras[e.id]}回</small></div>` : `<div class="lock"><i>❓</i>？？？<br><small>確率 ${(e.w / TOTAL_W * 100).toFixed(1)}%</small></div>`).join('');
  $('bk-recs').innerHTML = `<div>人生の回数<b>${DB.lives}回</b></div><div>最長寿<b>${DB.best.age}歳</b></div><div>最高レア度<b>${DB.best.odds ? fmtOdds(DB.best.odds) : '—'}</b></div><div>最高名声<b>${DB.best.fame}</b></div>`;
  const nf = ALLFIGS.filter(f => DB.figs[f.id]).length;
  $('bk-fh').textContent = `偉人図鑑　${nf} / ${ALLFIGS.length}人`;
  $('bk-figs').innerHTML = ERAS.map(e => `<div class="fg-era">${e.icon} ${DB.eras[e.id] ? e.name : '？？？'}</div>` + e.figs.map(f => DB.figs[f.id] ? `<div class="fg"><b>${esc(f.n)}</b>${f.k ? `<em>${f.k}</em>` : ''}<small>${esc(f.d)}</small><small class="cnt">出会った回数 ${DB.figs[f.id]}回</small></div>` : `<div class="fg lock"><b>？？？</b><small>${DB.eras[e.id] ? 'この時代のどこかにいる…' : 'まだ見ぬ時代の人物'}</small></div>`).join('')).join('');
  $('bk-achs').innerHTML = ACH.map(a => `<div class="${DB.ach[a.id] ? '' : 'lock'}"><i>${DB.ach[a.id] ? a.i : '🔒'}</i><div>${a.n}<small>${a.d}</small></div></div>`).join('');
  $('bk-hist').innerHTML = DB.hist.length ? DB.hist.map(h => `<div>${h.i} <b>${esc(h.n)}</b>（${esc(h.e)}）享年${h.a}・${esc(h.c)}<br><span class="muted">${esc(h.t)}／${fmtOdds(h.o)}</span></div>`).join('') : '<div class="muted">まだ記録がありません</div>';
}

function init() {
  $('b-born').onclick = () => { tone(440, .08); roll(); };
  $('b-start').onclick = beginLife;
  $('b-reroll').onclick = roll;
  $('b-book').onclick = () => showBook('title');
  $('b-snd').onclick = () => { DB.muted = !DB.muted; saveDB(); titleScreen(); };
  $('b-quit').onclick = () => { if (S && !S.dead && !confirm('この人生を途中でやめてタイトルに戻りますか？（記録されません）')) return; $('modal').hidden = true; titleScreen(); };
  $('b-again').onclick = roll;
  $('b-copy').onclick = copyResult;
  $('b-ebook').onclick = () => showBook('end');
  $('b-etitle').onclick = titleScreen;
  $('b-bback').onclick = () => bookBack === 'end' && S ? show('scr-end') : titleScreen();
  $('log').addEventListener('click', () => { if (auto) { stopAuto(); toast('一時停止中（▶ 自動 で再開）'); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && auto) stopAuto(true); });
  titleScreen();
}
init();
</script>
<script src="../../playtime.js" defer></script>
</body>
</html>
