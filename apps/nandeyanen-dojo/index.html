<head>
<meta name="copyright" content="© kato200000354">

<title>なんでやねん道場</title>
<meta name="description" content="相方のボケに全力でツッコめ！ボケなら「なんでやねん」、普通のことなら「せやな」。コンボが続くほど相方は遠くへ飛んでいく。月まで飛ばせ。">
<meta name="theme-color" content="#7a1f1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#3a0d0d;color:#222;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#hud{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;gap:6px;flex-wrap:wrap;font-weight:900;pointer-events:none}
.chip{background:rgba(255,255,255,.93);border-radius:999px;padding:4px 12px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.chip b{color:#c0392b}
#bubbleWrap{position:fixed;left:50%;transform:translateX(-50%);top:calc(50px + env(safe-area-inset-top));z-index:3;width:min(92vw,620px);pointer-events:none}
#bubble{position:relative;background:#fff;border:4px solid #222;border-radius:22px;padding:14px 16px;font-size:clamp(18px,5.2vw,30px);font-weight:900;text-align:center;line-height:1.35;min-height:2.9em;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.35)}
#bubble::after{content:"";position:absolute;left:28%;bottom:-22px;border:12px solid transparent;border-top:14px solid #222}
#bubble.gold{background:linear-gradient(135deg,#fff6c2,#ffd54a 60%,#fff2a0);border-color:#8a6400}
#bubble.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
#timer{height:10px;margin:12px 8px 0;background:rgba(0,0,0,.35);border-radius:9px;overflow:hidden}
#timerFill{height:100%;width:100%;background:#2ecc71;border-radius:9px}
#controls{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#2a0808,#1a0404)}
.big{flex:1;height:118px;border-radius:22px;font-size:clamp(22px,6.5vw,36px);font-weight:900;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.45);text-shadow:0 3px 0 rgba(0,0,0,.3);line-height:1.1;transition:transform .05s}
.big small{display:block;font-size:12px;font-weight:800;opacity:.85;margin-top:4px}
.big:active,.big.down{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.45)}
#btnNande{background:linear-gradient(#ff5a4a,#d42a1c)}
#btnSeyana{background:linear-gradient(#3fa4ff,#1d6fd0)}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(30,5,5,.72)}
.card{background:#fffaf0;border-radius:24px;padding:22px 20px;width:min(100%,460px);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.4);border:4px solid #222}
.card h1{font-size:clamp(30px,9vw,46px);line-height:1.1;color:#c0392b;text-shadow:3px 3px 0 #ffd54a;margin-bottom:10px}
.card h2{font-size:28px;margin-bottom:8px}
.card p{font-size:15px;line-height:1.7;margin:8px 0;font-weight:500}
.rule{text-align:left;background:#fff;border-radius:14px;padding:10px 14px;border:2px dashed #c9b28a;font-size:14px;line-height:1.75}
.rule b.r{color:#d42a1c}.rule b.b{color:#1d6fd0}
.go{display:block;width:100%;margin-top:14px;padding:16px;border-radius:16px;background:#c0392b;color:#fff;font-size:24px;font-weight:900;box-shadow:0 6px 0 #6e1a12}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #6e1a12}
.sub{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:12px;background:#eee3cf;font-weight:800;font-size:14px}
.stat{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed #d8c7a5;font-size:16px;font-weight:800}
.stat span:last-child{color:#c0392b}
.rank{font-size:26px;font-weight:900;margin:10px 0 4px;color:#8a3b00}
.best{font-size:13px;color:#7a5a3a;font-weight:800}
.new{color:#e67e22;font-weight:900;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.3}}
</style>

<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="chip">点 <b id="hScore">0</b></div>
  <div class="chip">コンボ <b id="hCombo">0</b></div>
  <div class="chip" id="hLife">客席 ❤❤❤</div>
</div>

<div id="bubbleWrap" hidden>
  <div id="bubble">…</div>
  <div id="timer"><div id="timerFill"></div></div>
</div>

<div id="controls" hidden>
  <button class="big" id="btnNande">なんでやねん！<small>ボケにツッコむ（←/F）</small></button>
  <button class="big" id="btnSeyana">せやな<small>普通の話にうなずく（→/J）</small></button>
</div>

<div class="overlay" id="titleScr">
  <div class="card">
    <h1>なんでやねん<br>道場</h1>
    <p>相方がしゃべる。<br>おかしかったら全力でツッコめ！</p>
    <div class="rule">
      ・ボケたら → <b class="r">なんでやねん！</b><br>
      ・普通の話 → <b class="b">せやな</b><br>
      ・間違える／黙る → 客席がシーンとなる（3回でスベって終了）<br>
      ・コンボが続くほど相方が<b>遠くまで飛ぶ</b>。目指せ月。<br>
      ・たまに出る<b>金のボケ</b>は10倍飛ぶ
    </div>
    <button class="go" id="startBtn">開演！</button>
    <p class="best" id="bestTxt"></p>
  </div>
</div>

<div class="overlay" id="overScr" hidden>
  <div class="card">
    <h2>スベりました…</h2>
    <div class="stat"><span>得点</span><span id="rScore">0</span></div>
    <div class="stat"><span>最大コンボ</span><span id="rCombo">0</span></div>
    <div class="stat"><span>相方の最長飛距離</span><span id="rDist">0m</span></div>
    <div class="stat"><span>到達地点</span><span id="rWhere">-</span></div>
    <div class="stat"><span>相方の合計飛行距離</span><span id="rTotal">0m</span></div>
    <div class="rank" id="rRank"></div>
    <p id="rNew" class="new" hidden>自己ベスト更新！</p>
    <p class="best" id="rBest"></p>
    <button class="go" id="retryBtn">もう一回！</button>
    <button class="sub" id="toTitleBtn">タイトルへ</button>
  </div>
</div>
