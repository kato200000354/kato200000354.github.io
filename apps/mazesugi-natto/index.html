<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>混ぜすぎ納豆</title>
<meta name="description" content="指でぐるぐる混ぜるだけ。混ぜすぎた納豆が町も地球も宇宙も糸で巻き込む、90秒の3Dバカゲー。">
<meta name="theme-color" content="#3a2410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reggae+One&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a0c;color:#fff;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas#c.tsun{filter:blur(2.5px) saturate(1.6) hue-rotate(-12deg)}
.logo{font-family:"Reggae One","M PLUS Rounded 1c",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start}
.chip{background:rgba(30,18,6,.72);border-radius:14px;padding:6px 11px;line-height:1.1}
.chip small{display:block;font-size:10px;opacity:.8;font-weight:700}
.chip b{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}
#timeChip.low b{color:#ff6a55}
#nebaChip{flex:1;min-width:0}
#muteBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:rgba(30,18,6,.72);font-size:12px;font-weight:900;flex:none}
#stageWrap{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 64px)}
#stageName{font-size:12px;font-weight:900;text-shadow:0 1px 3px #000;margin-bottom:3px}
#stageBar{height:7px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden}
#stageFill{height:100%;width:0;background:linear-gradient(90deg,#fff3c9,#ffc94a);border-radius:7px}
#combo{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 100px);font-size:42px;line-height:1;color:#ffe25a;
  text-shadow:0 3px 0 #7a3b00,0 0 12px rgba(0,0,0,.5);transform-origin:left center}
#combo small{display:block;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;font-family:"M PLUS Rounded 1c",sans-serif;margin-top:4px}
#bottom{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px)}
#talk{background:#fffbe8;color:#3a2410;font-size:14px;font-weight:700;border-radius:14px;padding:8px 12px;margin-bottom:9px;min-height:38px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.28)}
#talk i{font-style:normal;color:#b5521b;font-weight:900;margin-right:6px}
#meterLabel{display:flex;justify-content:space-between;font-size:11px;font-weight:900;text-shadow:0 1px 3px #000;margin-bottom:3px}
#meter{position:relative;height:14px;border-radius:8px;overflow:hidden;background:linear-gradient(90deg,#776a5a 0 22%,#46c35d 22% 78%,#e04a35 78%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
#needle{position:absolute;top:-1px;bottom:-1px;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 4px #000;left:0}
#heatBar{height:6px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:4px}
#heat{height:100%;width:0;background:#ff5a3a}

#banner{position:absolute;left:0;right:0;top:32%;text-align:center;padding:0 12px;font-size:38px;line-height:1.15;color:#fff;
  text-shadow:0 4px 0 #6d2f06,0 0 18px rgba(0,0,0,.65);opacity:0}
#banner small{display:block;font-size:15px;margin-top:6px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900}
#banner.show{animation:bn 1.7s ease-out both}
@keyframes bn{0%{opacity:0;transform:scale(2.2) rotate(-7deg)}14%{opacity:1;transform:scale(1) rotate(-3deg)}20%{transform:scale(1.08) rotate(-3deg)}75%{opacity:1;transform:scale(1) rotate(-3deg)}100%{opacity:0;transform:scale(.92) rotate(-3deg)}}

#evBtn{position:absolute;right:12px;top:42%;width:92px;height:112px;pointer-events:auto;border-radius:12px 12px 16px 16px;
  font-family:"Reggae One",sans-serif;font-size:21px;box-shadow:0 5px 0 rgba(0,0,0,.35);animation:wig .36s infinite alternate ease-in-out;overflow:hidden;touch-action:none}
#evBtn small{display:block;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;font-size:11px;margin-top:4px}
#evBtn u{position:absolute;left:0;bottom:0;height:6px;background:#fff;text-decoration:none}
@keyframes wig{from{transform:rotate(-5deg)}to{transform:rotate(5deg) scale(1.05)}}
.tare{background:#6c3a12;color:#ffe6bd}.kara{background:#f2c81d;color:#5f4300}
#rev{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:30px;color:#ffd9d0;text-shadow:0 3px 0 #8a1404,0 0 12px #000;animation:revp .3s infinite alternate}
#rev small{display:block;font-size:13px;color:#fff;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:900;margin-top:3px}
@keyframes revp{to{transform:scale(1.07)}}
#mark{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border:4px dashed #ff4b33;border-radius:50%;animation:spin 2s linear infinite;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
@keyframes spin{to{transform:rotate(360deg)}}
#markTxt{position:absolute;transform:translate(-50%,0);font-size:12px;font-weight:900;background:#ff4b33;padding:2px 8px;border-radius:9px;white-space:nowrap}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#2c1b0a;font-size:12.5px;font-weight:900;padding:5px 9px;border-radius:12px;max-width:148px;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.3);text-align:center}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
#hint{position:absolute;left:50%;top:50%;width:230px;height:150px;margin:-75px 0 0 -115px;border:5px dashed rgba(255,255,255,.75);border-radius:50%;animation:spin 3s linear infinite}
#hintTxt{position:absolute;left:0;right:0;top:calc(50% + 92px);text-align:center;font-size:20px;font-weight:900;text-shadow:0 2px 5px #000}
#tears{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(255,70,30,.5));display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff;text-shadow:0 4px 0 #c52900}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}

/* 画面 */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;touch-action:pan-y}
#title{background:linear-gradient(180deg,rgba(38,20,5,.72) 0,rgba(38,20,5,.08) 42%,rgba(38,20,5,.08) 62%,rgba(38,20,5,.82) 100%);justify-content:space-between;padding:calc(env(safe-area-inset-top) + 34px) 20px calc(env(safe-area-inset-bottom) + 28px)}
#title h1{margin:0;font-size:min(16vw,76px);line-height:1;font-weight:400;color:#fff4cf;text-shadow:0 5px 0 #6b3306,0 8px 18px rgba(0,0,0,.55);transform:rotate(-3deg)}
#title h1 span{display:block;font-size:.62em;color:#ffd24d;margin-bottom:6px;transform:translateX(-6%)}
#title p{margin:12px 0 0;font-size:14px;font-weight:700;text-shadow:0 1px 4px #000}
.big{background:#ffcf3f;color:#4d2a05;font-family:"Reggae One",sans-serif;font-size:25px;padding:15px 34px;border-radius:40px;box-shadow:0 6px 0 #a56a07;touch-action:manipulation}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a56a07}
#best{font-size:12.5px;font-weight:700;margin-top:10px;text-shadow:0 1px 4px #000;min-height:16px}

#story{background:#000;opacity:0;pointer-events:none;background:transparent;font-size:21px;font-weight:900;line-height:1.7;text-shadow:0 2px 6px #000}
#story.on{opacity:1}
#result{background:rgba(25,13,3,.74);overflow:auto;justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 18px)}
#card{width:100%;max-width:370px;background:#fffbe8;color:#3a2410;border-radius:20px;padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.3);margin:auto 0}
#card h2{margin:0;font-size:13px;color:#a2592a}
#rTitle{font-size:27px;line-height:1.2;margin:7px 0 7px;color:#7c3707}
#rLine{font-size:13.5px;font-weight:700;line-height:1.5;margin:0 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.stats div{background:#f6ebc6;border-radius:12px;padding:7px 2px;font-size:10px;font-weight:700}
.stats b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
#rCaughtH{font-size:12px;font-weight:900;margin-bottom:6px;text-align:left}
#rCaught{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
#rCaught span{background:#3a2410;color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:9px}
#card .big{width:100%;padding:12px;font-size:21px}
#shareBtn{width:100%;margin-top:9px;background:#e8dcb4;color:#3a2410;font-weight:900;font-size:14px;padding:11px;border-radius:30px}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;background:#2a1a0c;font-weight:700;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div class="chip" id="timeChip"><small>家を出るまで</small><b id="time">90.0</b></div>
    <div class="chip" id="nebaChip"><small>ネバ / <span id="revs">0</span>回まぜ</small><b id="neba">0</b></div>
    <button id="muteBtn" aria-label="音の切りかえ">音</button>
  </div>
  <div id="stageWrap"><div id="stageName"></div><div id="stageBar"><div id="stageFill"></div></div></div>
  <div id="combo" class="logo" hidden></div>
  <div id="hint" hidden></div><div id="hintTxt" hidden>ここを指でぐるぐる！</div>
  <div id="rev" class="logo" hidden></div>
  <div id="mark" hidden></div><div id="markTxt" hidden>なぞって捕獲！</div>
  <button id="evBtn" hidden></button>
  <div id="banner" class="logo"></div>
  <div id="bubbles"></div>
  <div id="bottom">
    <div id="talk"></div>
    <div id="meterLabel"><span>おそい</span><span>ちょうどいい</span><span>箸が死ぬ</span></div>
    <div id="meter"><div id="needle"></div></div>
    <div id="heatBar"><div id="heat"></div></div>
  </div>
</div>
<div id="tears" class="logo" hidden>ツーン！</div>
<div id="flash"></div>

<div id="title" class="screen">
  <div>
    <h1 class="logo"><span>朝食から宇宙まで</span>混ぜすぎ<br>納豆</h1>
    <p>納豆は、混ぜれば混ぜるほどおいしい。<br>ただし限度はある。あなたにはない。</p>
  </div>
  <div>
    <button id="startBtn" class="big">混ぜはじめる</button>
    <div id="best"></div>
  </div>
</div>

<div id="story" class="screen" hidden></div>

<div id="result" class="screen" hidden>
  <div id="card">
    <h2 id="rHead">本日の納豆の結果</h2>
    <div id="rTitle" class="logo"></div>
    <p id="rLine"></p>
    <div class="stats">
      <div><b id="rNeba">0</b>ネバ</div>
      <div><b id="rRevs">0</b>回まぜ</div>
      <div><b id="rCount">0</b>巻きこみ</div>
    </div>
    <div id="rCaughtH">糸に絡まったもの</div>
    <div id="rCaught"></div>
    <button id="againBtn" class="big">もう一度混ぜる</button>
    <button id="shareBtn">結果をシェア</button>
  </div>
</div>

<div id="err" hidden></div>

<script>
/*! © kato200000354. 無断転載・複製・再配布を禁止します。 */
