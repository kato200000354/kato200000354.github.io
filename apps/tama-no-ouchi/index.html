<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6eeff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="ちいさなペット「たまちゃん」をおせわする育成ゲーム。ごはん・おふろ・あそび・きせかえで、まいにち いっしょに そだてよう。">
<title>たまちゃんのおうち</title>
<style>
:root{--line:#a9d6f5;--line2:#7fc0ee;--ink:#2b3a67;--sub:#5d6f99;--blue:#3d8de0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:#d9effd}
body{min-height:100vh;background:linear-gradient(#e8f6ff,#cbe7fb);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input{user-select:text;-webkit-user-select:text}
.app{max-width:1480px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:0 4px 0 rgba(110,170,225,.25)}
.press{transition:transform .1s}
.press:active{transform:scale(.94)}
/* top */
.top{display:grid;grid-template-columns:1.25fr .95fr 1.5fr;gap:12px}
.clock{display:flex;align-items:center;gap:12px;padding:8px 18px}
.clock .ic{font-size:30px}
.ampm{font-weight:800;font-size:18px}
.time{font-size:36px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}
.sep{width:2px;align-self:stretch;background:var(--line);margin:6px 2px}
.date{font-weight:800;font-size:17px;white-space:nowrap}
.wx{display:flex;align-items:center;gap:4px;font-weight:800;white-space:nowrap}
.wx span:first-child{font-size:26px}
.petcard{display:flex;align-items:center;gap:12px;padding:8px 14px}
.ava{width:52px;height:52px;flex:0 0 auto;border-radius:14px;background:#e6f4ff;border:2px solid var(--line);image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.pinfo{flex:1;min-width:0}
.pname{font-weight:900;font-size:20px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.gm{color:#3a8ef0}.gf{color:#ff5d97}
.lvrow{display:flex;align-items:center;gap:8px;font-weight:800;margin-top:3px}
.bar{height:13px;border-radius:99px;background:#e3eef8;overflow:hidden;border:2px solid #d3e6f6;flex:1;min-width:50px}
.bar>i{display:block;height:100%;border-radius:inherit;transition:width .5s}
.b-blue>i{background:linear-gradient(90deg,#2f8ee8,#62c0ff)}
.b-pink>i{background:linear-gradient(90deg,#ff5d97,#ff9cc4)}
.b-yellow>i{background:linear-gradient(90deg,#ffc21f,#ffe066)}
.b-green>i{background:linear-gradient(90deg,#3fbf55,#7ee08b)}
.stats{display:flex;gap:16px;padding:8px 18px;align-items:center}
.stat{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.stat .ic{font-size:30px}
.stat .sl{flex:1;min-width:0}
.stat small{display:block;font-weight:800;font-size:13px;margin-bottom:3px}
.stat.low .ic{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
/* main */
.main{display:grid;grid-template-columns:190px minmax(0,1fr) 360px;gap:12px}
.nav{display:flex;flex-direction:column;gap:10px;padding:10px;background:rgba(255,255,255,.55);border-radius:22px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border:3px solid var(--line);border-radius:18px;font-weight:900;font-size:19px;box-shadow:0 3px 0 rgba(110,170,225,.3);white-space:nowrap}
.nav button .ic{font-size:26px}
.nav button.on{background:linear-gradient(#fff4a8,#ffe066);border-color:#f2c33a;box-shadow:0 3px 0 rgba(220,170,40,.4)}
.roomcard{position:relative;padding:10px;display:flex;align-items:center;justify-content:center;background:#c4e5fb}
.roomwrap{position:relative;width:min(100%,max(420px,calc((100vh - 290px) * 4 / 3)));aspect-ratio:4/3}
#room{width:100%;height:100%;display:block;border-radius:16px;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
.bubble{position:absolute;left:3%;top:4%;max-width:56%;background:#fff;border:3px solid var(--line2);border-radius:18px;padding:7px 14px;font-weight:800;font-size:clamp(13px,1.5vw,19px);line-height:1.5;box-shadow:0 3px 0 rgba(80,140,200,.25);pointer-events:none}
.bubble.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.7);opacity:.3}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.tools{position:absolute;right:2.5%;top:4%;display:flex;flex-direction:column;gap:8px}
.tools button{width:clamp(38px,4.2vw,52px);aspect-ratio:1;border-radius:50%;background:#3d8de0;border:3px solid #fff;box-shadow:0 3px 0 rgba(30,80,150,.35);font-size:clamp(16px,1.9vw,23px);display:flex;align-items:center;justify-content:center}
.tools button.off{background:#4b4f7a}
.flash{position:absolute;inset:0;background:#fff;border-radius:16px;pointer-events:none;animation:fl .5s forwards}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 4px 0 rgba(110,170,225,.2)}
.sech{display:flex;align-items:center;gap:8px;margin:-2px 0 10px}
.sech b{background:linear-gradient(#5aaef0,#3d8de0);color:#fff;padding:4px 14px;border-radius:99px;font-size:17px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.sech .coin{margin-left:auto;font-weight:900;background:#fff7d1;border:2px solid #f5d76e;border-radius:99px;padding:2px 10px}
.sic{font-size:24px}
.mini{width:36px;height:36px;image-rendering:pixelated}
.kv .row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:2px solid #eef5fb}
.kv .row:last-child{border-bottom:none}
.kv .k{flex:0 0 86px;background:#eaf5fe;border-radius:8px;padding:4px 10px;font-weight:800;font-size:14px;color:var(--sub)}
.kv .v{font-weight:900;font-size:17px;white-space:nowrap}
.kv .v small{font-size:12px;color:var(--sub);font-weight:700}
.kv .bar{max-width:130px;margin-left:auto}
.pen{margin-left:auto;font-size:18px;padding:2px 6px}
.mis{display:flex;align-items:center;gap:10px}
.mis .mt{flex:1;min-width:0}
.mis p{font-weight:800;margin-bottom:6px}
.mbar{display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.gift{font-size:40px;filter:grayscale(.6);opacity:.7}
.gift.ready{filter:none;opacity:1;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tip{font-size:13px;color:var(--sub);margin-top:8px;font-weight:700;line-height:1.5}
.items{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border:3px solid #f5d98a;border-radius:14px;background:#fffbea;font-size:12px;font-weight:800}
.item .e{font-size:28px}
.item .n{position:absolute;right:4px;top:2px;font-size:11px;color:var(--sub)}
.item.zero{opacity:.45}
.big{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:3px solid #ff9cc0;background:#ffe9f1;font-weight:900;font-size:17px;margin-bottom:10px;text-align:left}
.big .e{font-size:30px}
.big small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid #e3eef8;border-radius:14px}
.li .e{font-size:30px;width:36px;text-align:center}
.li .d{flex:1;min-width:0}
.li .d b{font-size:15px}
.li .d small{color:var(--sub);font-weight:800}
.li .d p{font-size:12px;color:var(--sub);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 12px;border-radius:12px;background:#e6f3ff;border:2px solid #9dcdf3;font-weight:900;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.pri{background:linear-gradient(#5aaef0,#3d8de0);border-color:#2f7bcc;color:#fff}
.btn.buy{background:#fff7d1;border-color:#f2cf5b}
.btn.on{background:#d9f5dc;border-color:#6ccf78}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;border:3px solid var(--line);background:#f4faff;font-weight:900;font-size:16px}
.cbtn .e{font-size:34px}
.cbtn small{font-size:12px;color:var(--sub);font-weight:700;text-align:center}
.cbtn.warn{border-color:#ff9cc0;background:#fff0f5}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:3px solid #e3eef8;background:#fff;font-weight:800;font-size:13px}
.swb.on{border-color:#f2c33a;background:#fffbe6}
.swb .dot{width:30px;height:30px;border-radius:50%;border:3px solid #1f2a5a}
.swb .e{font-size:26px;line-height:30px}
.swb small{font-size:11px;color:var(--sub)}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bk{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;padding:6px 2px;border-radius:12px;background:#f4faff;border:2px solid #e3eef8}
.bk canvas{width:48px;height:48px;image-rendering:pixelated}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-weight:800;font-size:14px}
.rec div{display:flex;justify-content:space-between;border-bottom:2px dotted #e3eef8;padding:3px 0}
.lead{font-weight:800;line-height:1.8}
.slist{display:flex;flex-direction:column;gap:8px}
.slist .btn{justify-content:flex-start;padding:12px 14px;font-size:16px}
/* bottom */
.bottom{display:grid;grid-template-columns:minmax(0,1.35fr) auto minmax(0,1fr);gap:12px}
.msg{display:flex;gap:12px;align-items:center;padding:10px 12px}
.msg .ava{width:70px;height:70px}
.msg p{background:#f1f8ff;border-radius:14px;padding:10px 14px;font-weight:800;line-height:1.6;flex:1;min-height:62px;display:flex;align-items:center}
.acts{display:flex;gap:10px}
.acts button{width:112px;padding:10px 0;border-radius:20px;border:3px solid;font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.acts .ic{font-size:36px}
.a-food{background:#ffe3ee;border-color:#ff8fb6;color:#d6336c}
.a-play{background:#e0f0ff;border-color:#6fb8f5;color:#2a6fc0}
.a-bath{background:#dff6e1;border-color:#6ccf78;color:#2b8a3e}
.a-pet{background:#efe7ff;border-color:#b096f0;color:#6d4cc2}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:linear-gradient(120deg,#ffe3f0,#e3f0ff 55%,#e9e3ff);border-color:#f5c6dd}
.banner p{font-weight:900;font-size:19px;line-height:1.5;color:#e0569a;transform:rotate(-6deg);text-shadow:2px 2px 0 #fff}
.banner .ava{width:74px;height:74px;background:transparent;border:none}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,50,90,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:#fff;border:4px solid var(--line);border-radius:26px;padding:20px 18px;max-width:420px;width:100%;text-align:center;position:relative;max-height:92vh;overflow:auto;animation:pop .25s}
.box h3{font-size:22px;margin-bottom:8px}
.box p{font-weight:700;line-height:1.7}
.box .x{position:absolute;right:10px;top:8px;font-size:22px;padding:4px 8px;color:var(--sub)}
.box input{width:100%;font-size:20px;padding:10px 12px;border:3px solid var(--line);border-radius:14px;margin:12px 0;text-align:center;font-weight:800}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.mbtns .btn{padding:11px 20px;font-size:16px}
.note{font-size:13px;color:var(--sub)}
.pix{image-rendering:crisp-edges;image-rendering:pixelated}
.gcv{width:192px;height:168px;margin:8px auto;display:block;border-radius:16px;border:3px solid var(--line)}
.gres{font-weight:900;font-size:20px;margin:4px 0 8px;min-height:30px}
.gbtns{display:flex;gap:12px;justify-content:center}
.gbtns .btn{font-size:20px;padding:14px 22px}
.dots{margin-top:10px;font-size:20px;letter-spacing:4px;min-height:28px}
.gamebar{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin:4px 6px}
.gamecv{width:min(100%,320px);aspect-ratio:4/5;display:block;margin:6px auto;border-radius:16px;border:3px solid var(--line);touch-action:none}
.photo{width:100%;border-radius:14px;border:3px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.bigemo{font-size:56px;margin:4px 0}
.evo{width:128px;height:128px;margin:6px auto;display:block}
.helpl{text-align:left;font-size:14px;line-height:1.8;font-weight:700}
.helpl li{margin-left:1.2em}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#fff;border:3px solid #f2c33a;border-radius:99px;padding:8px 20px;font-weight:900;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:tin 2.6s forwards;white-space:nowrap}
@keyframes tin{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (min-width:900px) and (min-height:720px){
  .app{height:100vh}
  .main{flex:1;min-height:0}
  .side,.nav{overflow:auto}
}
@media (max-width:1180px) and (min-width:900px){
  .main{grid-template-columns:150px minmax(0,1fr) 320px}
  .nav button{font-size:16px;padding:10px;gap:8px}
  .time{font-size:28px}
  .acts button{width:92px;font-size:16px}
  .banner p{font-size:15px}
}
@media (max-width:899px){
  .app{padding:10px;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .main,.bottom{display:contents}
  .top{grid-template-columns:1fr 1.3fr;gap:8px}
  .clock{grid-column:1/-1;padding:6px 12px;gap:8px;justify-content:center}
  .clock .ic{font-size:22px}
  .time{font-size:26px}
  .ampm,.date{font-size:14px}
  .wx span:first-child{font-size:20px}
  .petcard{padding:6px 10px;gap:8px}
  .ava{width:44px;height:44px}
  .pname{font-size:16px}
  .stats{flex-direction:column;align-items:stretch;gap:3px;padding:6px 10px}
  .stat .ic{font-size:18px;width:22px;text-align:center}
  .stat .sl{display:flex;align-items:center;gap:6px}
  .stat small{display:inline;margin:0;font-size:11px;width:44px}
  .bar{height:11px}
  .roomcard{order:1;padding:6px}
  .roomwrap{width:100%}
  .bubble{font-size:13px;padding:5px 10px;border-width:2px}
  .tools{gap:5px;right:2%;top:3%}
  .tools button{width:34px;font-size:15px;border-width:2px}
  .acts{order:2}
  .acts button{flex:1;width:auto;font-size:15px;padding:8px 0}
  .acts .ic{font-size:28px}
  .nav{order:3;flex-direction:row;overflow-x:auto;padding:6px;gap:8px;-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto;padding:7px 12px;font-size:15px;gap:6px}
  .nav button .ic{font-size:20px}
  .msg{order:3}
  .nav{order:4}
  .side{order:5}
  .msg .ava{width:52px;height:52px}
  .msg p{font-size:14px;min-height:52px}
  .banner{display:none}
  .items{grid-template-columns:repeat(5,1fr);gap:5px}
  .item .e{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="card clock">
      <span class="ic">🕒</span>
      <span class="ampm" id="ampm">AM</span><span class="time" id="time">00:00</span>
      <span class="sep"></span>
      <span class="date" id="date"></span>
      <span class="wx"><span id="wxI">☀️</span><span id="wxT">はれ</span></span>
    </div>
    <div class="card petcard">
      <canvas class="ava" id="ava1" width="48" height="48"></canvas>
      <div class="pinfo">
        <div class="pname"><span id="pname">たまご</span><span id="pg"></span></div>
        <div class="lvrow"><span id="plv">Lv.1</span><div class="bar b-blue" id="expbar"><i style="width:0"></i></div></div>
      </div>
    </div>
    <div class="card stats">
      <div class="stat" id="stMood"><span class="ic">💗</span><div class="sl"><small>ごきげん</small><div class="bar b-pink"><i></i></div></div></div>
      <div class="stat" id="stHung"><span class="ic">🍴</span><div class="sl"><small>おなか</small><div class="bar b-yellow"><i></i></div></div></div>
      <div class="stat" id="stClean"><span class="ic">✨</span><div class="sl"><small>きれいさ</small><div class="bar b-green"><i></i></div></div></div>
    </div>
  </header>

  <div class="main">
    <nav class="nav" id="nav">
      <button class="press on" data-tab="home"><span class="ic">🏠</span>おうち</button>
      <button class="press" data-tab="food"><span class="ic">🍴</span>ごはん</button>
      <button class="press" data-tab="play"><span class="ic">🎮</span>あそぶ</button>
      <button class="press" data-tab="care"><span class="ic">✨</span>おせわ</button>
      <button class="press" data-tab="dress"><span class="ic">👕</span>きせかえ</button>
      <button class="press" data-tab="book"><span class="ic">📖</span>ずかん</button>
      <button class="press" data-tab="set"><span class="ic">⚙️</span>せってい</button>
    </nav>
    <section class="card roomcard">
      <div class="roomwrap" id="roomwrap">
        <canvas id="room" width="240" height="180"></canvas>
        <div class="bubble" id="say">…</div>
        <div class="tools">
          <button class="press" data-act="photo" title="しゃしん">📷</button>
          <button class="press" data-act="pet" title="なでる">💗</button>
          <button class="press" data-act="light" id="lightBtn" title="でんき">💡</button>
          <button class="press" data-act="theme" title="もようがえ">🔄</button>
        </div>
      </div>
    </section>
    <aside class="side" id="panel"></aside>
  </div>

  <footer class="bottom">
    <div class="card msg">
      <canvas class="ava" id="ava2" width="48" height="48"></canvas>
      <p id="hint"></p>
    </div>
    <div class="acts">
      <button class="press a-food" data-act="feed"><span class="ic">🍙</span>ごはん</button>
      <button class="press a-play" data-act="playmenu"><span class="ic">🎮</span>あそぶ</button>
      <button class="press a-bath" data-act="bath"><span class="ic">🚿</span>おふろ</button>
      <button class="press a-pet" data-act="pet"><span class="ic">🤚</span>なでる</button>
    </div>
    <div class="card banner">
      <p>たまちゃんと<br>いっしょに<br>たのしい まいにちを！</p>
      <canvas class="ava" id="ava3" width="48" height="48"></canvas>
    </div>
  </footer>
</div>
<div id="modal"></div>

<script>
'use strict';
/* ========== データ ========== */
const SAVE_KEY='tama-no-ouchi-v1';
const W=240,H=180,FLOOR=112;
const ITEMS={
  onigiri:{name:'おにぎり',emoji:'🍙',price:3,desc:'おなか +35',type:'food',eff:{hunger:35,mood:3}},
  milk:{name:'ミルク',emoji:'🥛',price:2,desc:'おなか +15・げんき +15',type:'food',eff:{hunger:15,energy:15}},
  snack:{name:'おやつ',emoji:'🍬',price:4,desc:'ごきげん +20・おなか +10',type:'food',eff:{mood:20,hunger:10,bond:3}},
  cake:{name:'ケーキ',emoji:'🍰',price:8,desc:'ごきげん +30・おなか +25',type:'food',eff:{mood:30,hunger:25,bond:5}},
  toy:{name:'おもちゃ',emoji:'🧸',price:6,desc:'ごきげん +30（げんきが へらない）',type:'toy',eff:{mood:30,bond:4}},
};

function clampAll(){for(const k of ['mood','hunger','clean','energy','bond'])S[k]=clamp(S[k],0,100)}
function addPoop(live){
  if(S.poops.length>=4)return;
  let x,y,tries=0;do{x=rnd(36,182);y=rnd(128,168);tries++}while(tries<10&&Math.abs(x-P.x)<14&&Math.abs(y-P.y)<10);
  S.poops.push({x:Math.round(x),y:Math.round(y)});
  if(live){say('うんち しちゃった…');beep(180,.2,'triangle')}
}
function advance(dt,live){
  if(!S.hatched||dt<=0)return;
  const night=isNight(),sl=S.sleeping;
  let fH=sl?.4:1,fM=sl?.2:1;if(S.sick)fM*=2;if(night&&!sl)fM*=1.5;
  S.hunger-=30/3600*dt*fH;
  S.mood-=16/3600*dt*fM;
  S.clean-=(6+8*S.poops.length)/3600*dt;
  if(sl)S.energy+=70/3600*dt;else S.energy-=5/3600*dt;
  if(S.hunger<20||S.clean<20||S.mood<20)S.bond-=3/3600*dt;
  clampAll();
  const now=Date.now();
  S.digest=S.digest.filter(d=>{if(d<=now){addPoop(live);return false}return true});
  if(!sl){const e=dt/2400;let n=Math.floor(e);if(Math.random()<e-n)n++;while(n-->0)addPoop(live)}
  if(S.hunger<=0||S.clean<10||S.poops.length>=3)S.bad+=dt;else S.bad=Math.max(0,S.bad-dt*2);
  if(!S.sick&&S.bad>1200){S.sick=true;if(live){say('なんだか ぐあいが わるい…');beep(160,.4,'triangle')}}
  if(sl&&S.energy>=100&&!night){S.sleeping=false;S.light=true;if(live){say('おはよう！ よくねた〜');jingle([523,659,784,1047])}}
}
function tick(){
  const now=Date.now();let dt=(now-S.last)/1000;S.last=now;
  if(dt>5){const before={h:S.hunger,m:S.mood};advance(Math.min(dt,43200),false);if(dt>600&&S.hatched)welcome(dt,before)}
  else advance(dt,true);

  if(!S.poops.length){say('へやは ぴかぴかだよ！');return}
  while(S.poops.length)cleanOne(0);
}
function toggleLight(){
  if(!S.hatched){say('まずは たまごを タップしてね');return}
  if(S.light){
    if(S.energy>=95&&!isNight()){say('まだ ねむくないよ〜');P.emo='sweat';P.emoT=1.5;return}
    S.light=false;S.sleeping=true;P.anim=null;say('おやすみなさい…');mis('sleep');jingle([784,659,523],.15);
  }else{
    S.light=true;S.sleeping=false;
    if(S.energy<40){apply({mood:-5});say('ふわぁ… まだ ねむいよ…')}else{say('おはよう！');gainExp(2)}
    beep(880,.08);
  }
}
function medicine(){
  if(blocked())return;
  if(!S.sick){say('げんきだよ！ くすりは いらないよ');return}
  S.sick=false;S.bad=0;apply({mood:-5});gainExp(5);puff('spark',P.x,petTop(),6,20);
  say('にがい〜… でも らくに なった！');jingle([440,554,659]);
}
function canPlay(cost){
  if(blocked())return false;
  if(S.sick){say('ぐあいが わるくて あそべない…');return false}
  if(S.energy<cost){say('つかれちゃった… ねかせてあげて');P.emo='sweat';P.emoT=1.5;return false}
  return true;
}
function claim(){
  const m=MISSIONS[S.mission];if(S.mprog<m.n){toast('ミッションを がんばろう！');return}
  const it=pick(['onigiri','milk','snack','toy','cake']);
  S.stars+=m.r;S.items[it]++;S.mission=(S.mission+1)%MISSIONS.length;S.mprog=0;gainExp(5);
  jingle([659,784,1047,1319],.1);
  openModal(`<div class="bigemo">🎁</div><h3>ごほうび ゲット！</h3><p>⭐ × ${m.r} と<br>${ITEMS[it].emoji} ${ITEMS[it].name} を もらったよ！</p><div class="mbtns"><button class="btn pri" data-act="close">やったー！</button></div>`);
}
function dressColor(id){
  const c=COLORS.find(k=>k.id===id);if(!c||!S.hatched)return;
  if(!S.ownColors.includes(id)){
    if(S.lv<c.lv){toast(`Lv.${c.lv} に なると かえるよ`);return}
    if(S.stars<c.price){toast('⭐ が たりないよ');return}
    S.stars-=c.price;S.ownColors.push(id);toast(`${c.name} を かったよ！`);
  }
  if(S.color!==id){S.color=id;mis('dress');P.jump=.5;say('にあう？');beep(1047,.08);beep(1319,.1,'square',.04,.08)}
}
function dressAcc(id){
  const a=ACCS.find(k=>k.id===id);if(!a||!S.hatched)return;
  if(!S.ownAccs.includes(id)){if(S.stars<a.price){toast('⭐ が たりないよ');return}S.stars-=a.price;S.ownAccs.push(id);toast(`${a.name} を かったよ！`)}
  if(S.acc!==id){S.acc=id;if(id!=='none')mis('dress');P.jump=.5;say(id==='none'?'すっきり！':'にあう？');beep(1047,.08);beep(1319,.1,'square',.04,.08)}
}
function cycleTheme(){S.theme=(S.theme+1)%THEMES.length;say(`へやを ${THEMES[S.theme].name} に したよ`);beep(784,.08)}
function eggTap(){
  if(S.hatched)return;
  S.eggTaps++;P.wob=.5;puff('spark',P.x,P.y-24,2,16);beep(500+S.eggTaps*80,.1);
  if(S.eggTaps>=5){
    S.hatched=true;S.born=Date.now();S.last=Date.now();S.lastStage='baby';if(!S.seen.includes('baby'))S.seen.push('baby');
    puff('star',P.x,P.y-16,10,34);puff('heart',P.x,P.y-16,4,24);jingle([523,659,784,1047,1319,1568],.09);
    say('うまれた！ よろしくね！');
    setTimeout(()=>rename(true),700);
  }else say(['あ、うごいた！','ピキッ…','もうすこし…！','うまれそう！'][S.eggTaps-1]||'…');
}

/* ========== ミニゲーム：どっちかな？ ========== */
function startGuess(){
  closeModal();if(!canPlay(10))return;
  let round=0,win=0,lock=false;const marks=[];
  openModal(`<h3>↔️ どっちかな？</h3><p class="note">${esc(S.name)}が どっちを むくか あててね！</p><canvas id="gCv" width="64" height="56" class="pix gcv"></canvas><div class="gres" id="gRes">ラウンド 1 / 5</div><div class="gbtns" id="gBtns"><button class="btn press" id="gL">◀ ひだり</button><button class="btn press" id="gR">みぎ ▶</button></div><div class="dots" id="gDots">・・・・・</div><div class="mbtns"><button class="btn" data-act="close">やめる</button></div>`,{lock:true});
  const c=$('#gCv').getContext('2d');
  const draw=(look,expr)=>{c.fillStyle='#e6f4ff';c.fillRect(0,0,64,56);c.fillStyle='#f2c58f';c.fillRect(0,48,64,8);drawPet(c,32,52+(expr==='happy'?-2:0),petOpts({look,expr}));
    if(look){c.fillStyle='#e0485e';c.font='bold 12px sans-serif';c.textAlign='center';c.fillText(look<0?'◀':'▶',look<0?7:57,24)}};
  draw(0,'normal');
  const choose=d=>{
    if(lock)return;lock=true;const r=Math.random()<.5?-1:1,ok=r===d;if(ok)win++;marks.push(ok?'⭕':'❌');
    draw(r,ok?'happy':'sad');$('#gRes').textContent=ok?'あたり！🎉':'ざんねん…';$('#gDots').textContent=marks.join('')+'・'.repeat(5-marks.length);
    ok?jingle([659,880]):beep(220,.2,'triangle');round++;
    setTimeout(()=>{if(!$('#gCv'))return;if(round>=5)finish();else{lock=false;draw(0,'normal');$('#gRes').textContent=`ラウンド ${round+1} / 5`}},950);
  };
  $('#gL').onclick=()=>choose(-1);$('#gR').onclick=()=>choose(1);
  function finish(){
    const st=win*2;S.energy-=10;apply({mood:win>=3?25:10,bond:win});S.stars+=st;gainExp(8+win*2);S.rec.play++;mis('play');
    $('#gBtns').remove();$('#gRes').innerHTML=`${win}かい あたり！ ⭐ +${st}`;
    $('.box .mbtns').innerHTML='<button class="btn pri" data-act="close">おわる</button>';
    draw(0,win>=3?'happy':'normal');say(win>=3?'たのしかった！':'もういっかい あそぼ！');jingle(win>=3?[523,659,784,1047]:[523,659]);refresh();
  }
}

/* ========== ミニゲーム：ほしキャッチ ========== */
let catchStop=null;
function startCatch(){
  closeModal();if(!canPlay(15))return;
  openModal(`<h3>🌟 ほしキャッチ</h3><div class="gamebar"><span>⭐ <span id="cScore">0</span></span><span>⏱ <span id="cTime">30</span></span></div><canvas id="cCv" width="160" height="200" class="pix gamecv"></canvas><p class="note">ゆびで うごかして ほしを あつめよう！ いがいがに ちゅうい</p><div class="mbtns" id="cBtns"><button class="btn" data-act="close">やめる</button></div>`,{lock:true,onClose:()=>{if(catchStop)catchStop()}});
  const cvs=$('#cCv'),c=cvs.getContext('2d'),st=STG[stageOf()];
  let px=80,tx=80,objs=[],score=0,t=30,last=performance.now(),spawn=.5,flash=0,happy=0,run=true,keys={};
  const setX=e=>{const r=cvs.getBoundingClientRect();tx=clamp((e.clientX-r.left)/r.width*160,14,146)};
  cvs.addEventListener('pointerdown',e=>{setX(e);cvs.setPointerCapture&&cvs.setPointerCapture(e.pointerId)});
  cvs.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)setX(e)});
  const kd=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){keys[e.key]=true;e.preventDefault()}},ku=e=>{keys[e.key]=false};
  addEventListener('keydown',kd);addEventListener('keyup',ku);
  catchStop=()=>{run=false;removeEventListener('keydown',kd);removeEventListener('keyup',ku);catchStop=null};
  const stars=[];for(let i=0;i<20;i++)stars.push([Math.random()*160,Math.random()*150]);
  function loop(now){
    if(!run)return;const dt=Math.min(.05,(now-last)/1000);last=now;t-=dt;spawn-=dt;
    if(keys.ArrowLeft)tx=clamp(tx-140*dt,14,146);if(keys.ArrowRight)tx=clamp(tx+140*dt,14,146);
    if(spawn<=0){const r=Math.random();objs.push({x:rnd(10,150),y:-8,v:rnd(45,70)+(30-t)*2,k:r<.22?'spike':r<.3?'big':'star'});spawn=rnd(.3,.65)}
    px+=(tx-px)*Math.min(1,dt*12);if(flash>0)flash-=dt;if(happy>0)happy-=dt;
    for(let i=objs.length-1;i>=0;i--){const o=objs[i];o.y+=o.v*dt;
      if(Math.abs(o.x-px)<14&&o.y>192-st.h-2&&o.y<196){objs.splice(i,1);
        if(o.k==='spike'){score=Math.max(0,score-2);flash=.4;beep(160,.15,'sawtooth',.04)}
        else{const g=o.k==='big'?3:1;score+=g;happy=.3;beep(o.k==='big'?1319:1047,.06,'square',.04)}continue}
      if(o.y>210)objs.splice(i,1)}
    G=c;c.fillStyle='#24346e';c.fillRect(0,0,160,200);for(const s of stars)R(s[0],s[1],1,1,'#8fa3e0');
    R(0,192,160,8,'#5cbf5f');R(0,192,160,2,'#79d57a');
    for(const o of objs){if(o.k==='spike')SPC(SPR.spike,o.x,o.y+4,PAL.spike);else if(o.k==='big')SPC(SPR.star,o.x,o.y+7,{o:'#c43c74',Y:'#ff9fc5'},2);else SPC(SPR.star,o.x,o.y+4,PAL.star)}
    drawPet(c,px,193,petOpts({expr:flash>0?'sad':happy>0?'happy':'normal',look:tx<px-2?-1:tx>px+2?1:0}));
    if(flash>0){c.fillStyle='rgba(255,80,80,.25)';c.fillRect(0,0,160,200)}
    G=RC;
    const sc=$('#cScore'),tm=$('#cTime');if(sc)sc.textContent=score;if(tm)tm.textContent=Math.max(0,Math.ceil(t));
    if(t<=0){end();return}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  function end(){
    const rew=Math.floor(score/2);catchStop&&catchStop();
    S.energy-=15;apply({mood:Math.min(30,8+score*2),bond:2});S.stars+=rew;gainExp(8+Math.floor(score/2));S.rec.play++;S.rec.best=Math.max(S.rec.best,score);mis('play');mis('catch',score);
    const b=$('#cBtns');if(b)b.innerHTML=`<p style="width:100%"><b>${score}こ キャッチ！</b> ⭐ +${rew}${score>=S.rec.best&&score>0?'<br>🎉 じこベスト！':''}</p><button class="btn pri" data-act="close">おわる</button>`;
    say(score>=10?'すごい！ たのしかった！':'たのしかった〜！');jingle([523,659,784,1047]);refresh();
  }
}

let modalOpt=null;
function openModal(html,opt={}){
  if(modalOpt&&modalOpt.onClose)modalOpt.onClose();
  modalOpt=opt;
  $('#modal').innerHTML=`<div class="ov" id="ov"><div class="box">${opt.lock?'':'<button class="x" data-act="close">✕</button>'}${html}</div></div>`;
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!opt.lock)closeModal()});
}
function closeModal(){
  if(modalOpt&&modalOpt.onClose)modalOpt.onClose();
  modalOpt=null;$('#modal').innerHTML='';
  if(pendingModals.length)setTimeout(()=>{const f=pendingModals.shift();f&&f()},200);
}
function showModal(f){if($('#modal').innerHTML)pendingModals.push(f);else f()}

    <button class="cbtn press" data-act="bath"><span class="e">🛁</span>おふろ<small>きれいさ ${Math.round(S.clean)}</small></button>
    <button class="cbtn press ${S.poops.length?'warn':''}" data-act="clean"><span class="e">🧹</span>おそうじ<small>うんち ${S.poops.length}こ</small></button>
    <button class="cbtn press" data-act="light"><span class="e">${S.light?'🌙':'☀️'}</span>${S.light?'でんきを けす':'でんきを つける'}<small>げんき ${Math.round(S.energy)}</small></button>
    <button class="cbtn press ${S.sick?'warn':''}" data-act="med"><span class="e">💊</span>くすり<small>${S.sick?'びょうきを なおす':'いまは げんき'}</small></button>
    <button class="cbtn press" data-act="pet"><span class="e">🤚</span>なでる<small>なかよし ${Math.round(S.bond)}</small></button>
    <button class="cbtn press" data-act="feed"><span class="e">🍚</span>ごはん<small>おなか ${Math.round(S.hunger)}</small></button></div></div>`;
  case 'dress':return `<div class="sec"><div class="sech"><span class="sic">👕</span><b>フードの いろ</b><span class="coin">⭐ ${S.stars}</span></div><div class="sw">${COLORS.map(c=>{const own=S.ownColors.includes(c.id),on=S.color===c.id;
      return `<button class="swb press ${on?'on':''}" data-act="color" data-arg="${c.id}"><span class="dot" style="background:${c.c}"></span>${c.name}<small>${on?'きてる':own?'きる':S.lv<c.lv?'🔒 Lv.'+c.lv:'⭐'+c.price}</small></button>`}).join('')}</div></div>
    <div class="sec"><div class="sech"><span class="sic">🎀</span><b>アクセサリー</b></div><div class="sw">${ACCS.map(a=>{const own=S.ownAccs.includes(a.id),on=S.acc===a.id;
      return `<button class="swb press ${on?'on':''}" data-act="acc" data-arg="${a.id}"><span class="e">${a.emoji}</span>${a.name}<small>${on?'つけてる':own?'つける':'⭐'+a.price}</small></button>`}).join('')}</div>${stageOf()==='baby'?'<p class="tip">ベビーの あいだは フードが ちいさな ぼうしに なってるよ</p>':''}</div>`;
  case 'book':return `<div class="sec"><div class="sech"><span class="sic">📖</span><b>すがた ずかん</b></div><div class="book">${STAGES.map(s=>{const seen=S.seen.includes(s.id);
      return `<div class="bk"><canvas width="48" height="48" data-stage="${s.id}" data-seen="${seen?1:0}"></canvas>${seen?s.name:'？？？'}</div>`}).join('')}</div><p class="tip">Lv.3・Lv.6・Lv.10 で すがたが かわるよ</p></div>
    <div class="sec"><div class="sech"><span class="sic">📝</span><b>きろく</b></div><div class="rec">
    <div><span>🍙 たべた</span><b>${S.rec.feed}</b></div><div><span>🎮 あそんだ</span><b>${S.rec.play}</b></div>
    <div><span>🛁 おふろ</span><b>${S.rec.bath}</b></div><div><span>🤚 なでた</span><b>${S.rec.pet}</b></div>
    <div><span>🧹 おそうじ</span><b>${S.rec.clean}</b></div><div><span>🌟 ベスト</span><b>${S.rec.best}</b></div>
    <div><span>👕 いろ</span><b>${S.ownColors.length}/${COLORS.length}</b></div><div><span>🎀 こもの</span><b>${S.ownAccs.length-1}/${ACCS.length-1}</b></div>
    <div><span>📅 いっしょに</span><b>${days}にち</b></div><div><span>⭐ レベル</span><b>${S.lv}</b></div></div></div>`;
  case 'set':return setHTML();
  }
  return '';
}
function setHTML(){
  return `<div class="sec"><div class="sech"><span class="sic">⚙️</span><b>せってい</b></div><div class="slist">
    ${S.hatched?'<button class="btn press" data-act="rename">✏️ なまえを かえる</button>':''}
    <button class="btn press" data-act="sound">${S.sound?'🔊 おと：オン':'🔇 おと：オフ'}</button>
    <button class="btn press" data-act="theme">🔄 へやの いろ：${THEMES[S.theme].name}</button>
    <button class="btn press" data-act="help">📘 あそびかた</button>
    <button class="btn press" data-act="reset">🗑️ データを リセット</button></div>
    <p class="tip">データは この ブラウザに ほぞん されるよ</p></div>`;
}
function drawMini(c,stage,sil){
  const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
  drawPet(x,c.width/2,c.height-2,petOpts(stage?{stage,expr:'normal',acc:'none'}:{expr:petExpr()}));
  if(sil){x.globalCompositeOperation='source-atop';x.fillStyle='#a9bad0';x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='source-over'}
}
function refresh(){
  checkStage();
  const d=new Date(),h=d.getHours();
  $('#ampm').textContent=h<12?'AM':'PM';$('#time').textContent=`${String(h%12===0&&h>=12?12:h%12).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  $('#date').textContent=`${d.getMonth()+1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`;
  const wx=weather();$('#wxI').textContent=wx.i;$('#wxT').textContent=wx.t;
  $('#pname').textContent=S.hatched?S.name:'たまご';
  const pg=$('#pg');pg.textContent=S.hatched?(S.gender==='m'?'♂':'♀'):'';pg.className=S.gender==='m'?'gm':'gf';
  $('#plv').textContent='Lv.'+S.lv;$('#expbar i').style.width=(S.exp/expNeed(S.lv)*100)+'%';
  const st=[['#stMood',S.mood],['#stHung',S.hunger],['#stClean',S.clean]];
  for(const [id,v] of st){const el=$(id);el.querySelector('i').style.width=(S.hatched?v:0)+'%';el.classList.toggle('low',S.hatched&&v<25)}
  if(Date.now()>sayUntil){const t=defaultSay();if($('#say').textContent!==t)$('#say').textContent=t}
  $('#hint').textContent=hint();
  const lb=$('#lightBtn');lb.textContent=S.light?'💡':'🌙';lb.classList.toggle('off',!S.light);
  for(const id of ['#ava1','#ava2','#ava3'])drawMini($(id));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const html=panelHTML();
  if(html!==lastPanel){lastPanel=html;$('#panel').innerHTML=html}
  document.querySelectorAll('#panel canvas[data-pet]').forEach(c=>drawMini(c));
  document.querySelectorAll('#panel canvas[data-stage]').forEach(c=>drawMini(c,c.dataset.stage,c.dataset.seen!=='1'));
}

/* ========== そうさ ========== */
function act(a,arg){
  switch(a){
    case 'feed':feed(null);break;case 'use':useItem(arg);break;case 'buy':buy(arg);break;
    case 'bath':bath();break;case 'pet':petPet();break;case 'clean':cleanAll();break;
    case 'light':toggleLight();break;case 'med':medicine();break;
    case 'playmenu':playMenu();return;case 'guess':startGuess();break;case 'catch':startCatch();break;
    case 'claim':claim();break;case 'rename':if(S.hatched)rename(false);break;
    case 'color':dressColor(arg);break;case 'acc':dressAcc(arg);break;
    case 'theme':cycleTheme();break;case 'photo':photo();break;
    case 'sound':S.sound=!S.sound;if(S.sound)beep(880,.1);break;
    case 'help':help();break;case 'reset':resetAsk();break;case 'close':closeModal();break;
  }
  if(['use','feed','bath','pet'].includes(a)&&modalOpt&&!modalOpt.lock&&$('#modal .cbtn'))closeModal();
  save();refresh();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){tab=t.dataset.tab;beep(660,.05,'square',.03);refresh();return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg);
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(!S.hatched){if(Math.abs(x-P.x)<20&&y>P.y-34&&y<P.y+6)eggTap();refresh();save();return}
  for(let i=S.poops.length-1;i>=0;i--){const p=S.poops[i];if(Math.abs(x-p.x)<8&&y>p.y-10&&y<p.y+3){cleanOne(i);refresh();save();return}}
  if(Math.abs(x-P.x)<17&&y>petTop()-4&&y<P.y+4){petPet();refresh();save();return}
  if(S.hatched&&!S.sleeping&&!P.anim&&y>FLOOR+10){P.tx=clamp(x,30,200);P.ty=clamp(y,124,168);P.wait=3}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else tick()});
addEventListener('pagehide',save);

/* ========== スタート ========== */
load();
if(!S.hatched){S.light=true;S.sleeping=false}
tick();
if(!S.hatched)say('たまごが あるよ… タップしてみて！',4000);
setInterval(tick,1000);
setInterval(save,5000);
requestAnimationFrame(frame);
</script>
<script src="../../playtime.js" defer></script>
</body>
</html>
