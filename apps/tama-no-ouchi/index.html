<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d6eeff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="ちいさなペット「たまちゃん」をおせわする育成ゲーム。ごはん・おふろ・あそび・きせかえで、まいにち いっしょに そだてよう。">
<title>たまちゃんのおうち</title>
<style>
:root{--line:#a9d6f5;--line2:#7fc0ee;--ink:#2b3a67;--sub:#5d6f99;--blue:#3d8de0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:#d9effd}
body{min-height:100vh;background:linear-gradient(#e8f6ff,#cbe7fb);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
input{user-select:text;-webkit-user-select:text}
.app{max-width:1480px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:0 4px 0 rgba(110,170,225,.25)}
.press{transition:transform .1s}
.press:active{transform:scale(.94)}
/* top */
.top{display:grid;grid-template-columns:1.25fr .95fr 1.5fr;gap:12px}
.clock{display:flex;align-items:center;gap:12px;padding:8px 18px}
.clock .ic{font-size:30px}
.ampm{font-weight:800;font-size:18px}
.time{font-size:36px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums}
.sep{width:2px;align-self:stretch;background:var(--line);margin:6px 2px}
.date{font-weight:800;font-size:17px;white-space:nowrap}
.wx{display:flex;align-items:center;gap:4px;font-weight:800;white-space:nowrap}
.wx span:first-child{font-size:26px}
.petcard{display:flex;align-items:center;gap:12px;padding:8px 14px}
.ava{width:52px;height:52px;flex:0 0 auto;border-radius:14px;background:#e6f4ff;border:2px solid var(--line);image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
.pinfo{flex:1;min-width:0}
.pname{font-weight:900;font-size:20px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.gm{color:#3a8ef0}.gf{color:#ff5d97}
.lvrow{display:flex;align-items:center;gap:8px;font-weight:800;margin-top:3px}
.bar{height:13px;border-radius:99px;background:#e3eef8;overflow:hidden;border:2px solid #d3e6f6;flex:1;min-width:50px}
.bar>i{display:block;height:100%;border-radius:inherit;transition:width .5s}
.b-blue>i{background:linear-gradient(90deg,#2f8ee8,#62c0ff)}
.b-pink>i{background:linear-gradient(90deg,#ff5d97,#ff9cc4)}
.b-yellow>i{background:linear-gradient(90deg,#ffc21f,#ffe066)}
.b-green>i{background:linear-gradient(90deg,#3fbf55,#7ee08b)}
.stats{display:flex;gap:16px;padding:8px 18px;align-items:center}
.stat{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.stat .ic{font-size:30px}
.stat .sl{flex:1;min-width:0}
.stat small{display:block;font-weight:800;font-size:13px;margin-bottom:3px}
.stat.low .ic{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
/* main */
.main{display:grid;grid-template-columns:190px minmax(0,1fr) 360px;gap:12px}
.nav{display:flex;flex-direction:column;gap:10px;padding:10px;background:rgba(255,255,255,.55);border-radius:22px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border:3px solid var(--line);border-radius:18px;font-weight:900;font-size:19px;box-shadow:0 3px 0 rgba(110,170,225,.3);white-space:nowrap}
.nav button .ic{font-size:26px}
.nav button.on{background:linear-gradient(#fff4a8,#ffe066);border-color:#f2c33a;box-shadow:0 3px 0 rgba(220,170,40,.4)}
.roomcard{position:relative;padding:10px;display:flex;align-items:center;justify-content:center;background:#c4e5fb}
.roomwrap{position:relative;width:min(100%,max(420px,calc((100vh - 290px) * 4 / 3)));aspect-ratio:4/3}
#room{width:100%;height:100%;display:block;border-radius:16px;image-rendering:crisp-edges;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}
.bubble{position:absolute;left:3%;top:4%;max-width:56%;background:#fff;border:3px solid var(--line2);border-radius:18px;padding:7px 14px;font-weight:800;font-size:clamp(13px,1.5vw,19px);line-height:1.5;box-shadow:0 3px 0 rgba(80,140,200,.25);pointer-events:none}
.bubble.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.7);opacity:.3}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.tools{position:absolute;right:2.5%;top:4%;display:flex;flex-direction:column;gap:8px}
.tools button{width:clamp(38px,4.2vw,52px);aspect-ratio:1;border-radius:50%;background:#3d8de0;border:3px solid #fff;box-shadow:0 3px 0 rgba(30,80,150,.35);font-size:clamp(16px,1.9vw,23px);display:flex;align-items:center;justify-content:center}
.tools button.off{background:#4b4f7a}
.flash{position:absolute;inset:0;background:#fff;border-radius:16px;pointer-events:none;animation:fl .5s forwards}
@keyframes fl{from{opacity:.95}to{opacity:0}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec{background:#fff;border:3px solid var(--line);border-radius:22px;padding:12px 14px;box-shadow:0 4px 0 rgba(110,170,225,.2)}
.sech{display:flex;align-items:center;gap:8px;margin:-2px 0 10px}
.sech b{background:linear-gradient(#5aaef0,#3d8de0);color:#fff;padding:4px 14px;border-radius:99px;font-size:17px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.sech .coin{margin-left:auto;font-weight:900;background:#fff7d1;border:2px solid #f5d76e;border-radius:99px;padding:2px 10px}
.sic{font-size:24px}
.mini{width:36px;height:36px;image-rendering:pixelated}
.kv .row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:2px solid #eef5fb}
.kv .row:last-child{border-bottom:none}
.kv .k{flex:0 0 86px;background:#eaf5fe;border-radius:8px;padding:4px 10px;font-weight:800;font-size:14px;color:var(--sub)}
.kv .v{font-weight:900;font-size:17px;white-space:nowrap}
.kv .v small{font-size:12px;color:var(--sub);font-weight:700}
.kv .bar{max-width:130px;margin-left:auto}
.pen{margin-left:auto;font-size:18px;padding:2px 6px}
.mis{display:flex;align-items:center;gap:10px}
.mis .mt{flex:1;min-width:0}
.mis p{font-weight:800;margin-bottom:6px}
.mbar{display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.gift{font-size:40px;filter:grayscale(.6);opacity:.7}
.gift.ready{filter:none;opacity:1;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tip{font-size:13px;color:var(--sub);margin-top:8px;font-weight:700;line-height:1.5}
.items{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;border:3px solid #f5d98a;border-radius:14px;background:#fffbea;font-size:12px;font-weight:800}
.item .e{font-size:28px}
.item .n{position:absolute;right:4px;top:2px;font-size:11px;color:var(--sub)}
.item.zero{opacity:.45}
.big{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:3px solid #ff9cc0;background:#ffe9f1;font-weight:900;font-size:17px;margin-bottom:10px;text-align:left}
.big .e{font-size:30px}
.big small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid #e3eef8;border-radius:14px}
.li .e{font-size:30px;width:36px;text-align:center}
.li .d{flex:1;min-width:0}
.li .d b{font-size:15px}
.li .d small{color:var(--sub);font-weight:800}
.li .d p{font-size:12px;color:var(--sub);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 12px;border-radius:12px;background:#e6f3ff;border:2px solid #9dcdf3;font-weight:900;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn.pri{background:linear-gradient(#5aaef0,#3d8de0);border-color:#2f7bcc;color:#fff}
.btn.buy{background:#fff7d1;border-color:#f2cf5b}
.btn.on{background:#d9f5dc;border-color:#6ccf78}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:18px;border:3px solid var(--line);background:#f4faff;font-weight:900;font-size:16px}
.cbtn .e{font-size:34px}
.cbtn small{font-size:12px;color:var(--sub);font-weight:700;text-align:center}
.cbtn.warn{border-color:#ff9cc0;background:#fff0f5}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:3px solid #e3eef8;background:#fff;font-weight:800;font-size:13px}
.swb.on{border-color:#f2c33a;background:#fffbe6}
.swb .dot{width:30px;height:30px;border-radius:50%;border:3px solid #1f2a5a}
.swb .e{font-size:26px;line-height:30px}
.swb small{font-size:11px;color:var(--sub)}
.book{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bk{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;padding:6px 2px;border-radius:12px;background:#f4faff;border:2px solid #e3eef8}
.bk canvas{width:48px;height:48px;image-rendering:pixelated}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-weight:800;font-size:14px}
.rec div{display:flex;justify-content:space-between;border-bottom:2px dotted #e3eef8;padding:3px 0}
.lead{font-weight:800;line-height:1.8}
.slist{display:flex;flex-direction:column;gap:8px}
.slist .btn{justify-content:flex-start;padding:12px 14px;font-size:16px}
/* bottom */
.bottom{display:grid;grid-template-columns:minmax(0,1.35fr) auto minmax(0,1fr);gap:12px}
.msg{display:flex;gap:12px;align-items:center;padding:10px 12px}
.msg .ava{width:70px;height:70px}
.msg p{background:#f1f8ff;border-radius:14px;padding:10px 14px;font-weight:800;line-height:1.6;flex:1;min-height:62px;display:flex;align-items:center}
.acts{display:flex;gap:10px}
.acts button{width:112px;padding:10px 0;border-radius:20px;border:3px solid;font-weight:900;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.acts .ic{font-size:36px}
.a-food{background:#ffe3ee;border-color:#ff8fb6;color:#d6336c}
.a-play{background:#e0f0ff;border-color:#6fb8f5;color:#2a6fc0}
.a-bath{background:#dff6e1;border-color:#6ccf78;color:#2b8a3e}
.a-pet{background:#efe7ff;border-color:#b096f0;color:#6d4cc2}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;background:linear-gradient(120deg,#ffe3f0,#e3f0ff 55%,#e9e3ff);border-color:#f5c6dd}
.banner p{font-weight:900;font-size:19px;line-height:1.5;color:#e0569a;transform:rotate(-6deg);text-shadow:2px 2px 0 #fff}
.banner .ava{width:74px;height:74px;background:transparent;border:none}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,50,90,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:#fff;border:4px solid var(--line);border-radius:26px;padding:20px 18px;max-width:420px;width:100%;text-align:center;position:relative;max-height:92vh;overflow:auto;animation:pop .25s}
.box h3{font-size:22px;margin-bottom:8px}
.box p{font-weight:700;line-height:1.7}
.box .x{position:absolute;right:10px;top:8px;font-size:22px;padding:4px 8px;color:var(--sub)}
.box input{width:100%;font-size:20px;padding:10px 12px;border:3px solid var(--line);border-radius:14px;margin:12px 0;text-align:center;font-weight:800}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.mbtns .btn{padding:11px 20px;font-size:16px}
.note{font-size:13px;color:var(--sub)}
.pix{image-rendering:crisp-edges;image-rendering:pixelated}
.gcv{width:192px;height:168px;margin:8px auto;display:block;border-radius:16px;border:3px solid var(--line)}
.gres{font-weight:900;font-size:20px;margin:4px 0 8px;min-height:30px}
.gbtns{display:flex;gap:12px;justify-content:center}
.gbtns .btn{font-size:20px;padding:14px 22px}
.dots{margin-top:10px;font-size:20px;letter-spacing:4px;min-height:28px}
.gamebar{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin:4px 6px}
.gamecv{width:min(100%,320px);aspect-ratio:4/5;display:block;margin:6px auto;border-radius:16px;border:3px solid var(--line);touch-action:none}
.photo{width:100%;border-radius:14px;border:3px solid var(--line);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.bigemo{font-size:56px;margin:4px 0}
.evo{width:128px;height:128px;margin:6px auto;display:block}
.helpl{text-align:left;font-size:14px;line-height:1.8;font-weight:700}
.helpl li{margin-left:1.2em}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#fff;border:3px solid #f2c33a;border-radius:99px;padding:8px 20px;font-weight:900;z-index:60;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:tin 2.6s forwards;white-space:nowrap}
@keyframes tin{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
@media (min-width:900px) and (min-height:720px){
  .app{height:100vh}
  .main{flex:1;min-height:0}
  .side,.nav{overflow:auto}
}
@media (max-width:1180px) and (min-width:900px){
  .main{grid-template-columns:150px minmax(0,1fr) 320px}
  .nav button{font-size:16px;padding:10px;gap:8px}
  .time{font-size:28px}
  .acts button{width:92px;font-size:16px}
  .banner p{font-size:15px}
}
@media (max-width:899px){
  .app{padding:10px;gap:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .main,.bottom{display:contents}
  .top{grid-template-columns:1fr 1.3fr;gap:8px}
  .clock{grid-column:1/-1;padding:6px 12px;gap:8px;justify-content:center}
  .clock .ic{font-size:22px}
  .time{font-size:26px}
  .ampm,.date{font-size:14px}
  .wx span:first-child{font-size:20px}
  .petcard{padding:6px 10px;gap:8px}
  .ava{width:44px;height:44px}
  .pname{font-size:16px}
  .stats{flex-direction:column;align-items:stretch;gap:3px;padding:6px 10px}
  .stat .ic{font-size:18px;width:22px;text-align:center}
  .stat .sl{display:flex;align-items:center;gap:6px}
  .stat small{display:inline;margin:0;font-size:11px;width:44px}
  .bar{height:11px}
  .roomcard{order:1;padding:6px}
  .roomwrap{width:100%}
  .bubble{font-size:13px;padding:5px 10px;border-width:2px}
  .tools{gap:5px;right:2%;top:3%}
  .tools button{width:34px;font-size:15px;border-width:2px}
  .acts{order:2}
  .acts button{flex:1;width:auto;font-size:15px;padding:8px 0}
  .acts .ic{font-size:28px}
  .nav{order:3;flex-direction:row;overflow-x:auto;padding:6px;gap:8px;-webkit-overflow-scrolling:touch}
  .nav button{flex:0 0 auto;padding:7px 12px;font-size:15px;gap:6px}
  .nav button .ic{font-size:20px}
  .msg{order:3}
  .nav{order:4}
  .side{order:5}
  .msg .ava{width:52px;height:52px}
  .msg p{font-size:14px;min-height:52px}
  .banner{display:none}
  .items{grid-template-columns:repeat(5,1fr);gap:5px}
  .item .e{font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="card clock">
      <span class="ic">🕒</span>
      <span class="ampm" id="ampm">AM</span><span class="time" id="time">00:00</span>
      <span class="sep"></span>
      <span class="date" id="date"></span>
      <span class="wx"><span id="wxI">☀️</span><span id="wxT">はれ</span></span>
    </div>
    <div class="card petcard">
      <canvas class="ava" id="ava1" width="48" height="48"></canvas>
      <div class="pinfo">
        <div class="pname"><span id="pname">たまご</span><span id="pg"></span></div>
        <div class="lvrow"><span id="plv">Lv.1</span><div class="bar b-blue" id="expbar"><i style="width:0"></i></div></div>
      </div>
    </div>
    <div class="card stats">
      <div class="stat" id="stMood"><span class="ic">💗</span><div class="sl"><small>ごきげん</small><div class="bar b-pink"><i></i></div></div></div>
      <div class="stat" id="stHung"><span class="ic">🍴</span><div class="sl"><small>おなか</small><div class="bar b-yellow"><i></i></div></div></div>
      <div class="stat" id="stClean"><span class="ic">✨</span><div class="sl"><small>きれいさ</small><div class="bar b-green"><i></i></div></div></div>
    </div>
  </header>

  <div class="main">
    <nav class="nav" id="nav">
      <button class="press on" data-tab="home"><span class="ic">🏠</span>おうち</button>
      <button class="press" data-tab="food"><span class="ic">🍴</span>ごはん</button>
      <button class="press" data-tab="play"><span class="ic">🎮</span>あそぶ</button>
      <button class="press" data-tab="care"><span class="ic">✨</span>おせわ</button>
      <button class="press" data-tab="dress"><span class="ic">👕</span>きせかえ</button>
      <button class="press" data-tab="book"><span class="ic">📖</span>ずかん</button>
      <button class="press" data-tab="set"><span class="ic">⚙️</span>せってい</button>
    </nav>
    <section class="card roomcard">
      <div class="roomwrap" id="roomwrap">
        <canvas id="room" width="240" height="180"></canvas>
        <div class="bubble" id="say">…</div>
        <div class="tools">
          <button class="press" data-act="photo" title="しゃしん">📷</button>
          <button class="press" data-act="pet" title="なでる">💗</button>
          <button class="press" data-act="light" id="lightBtn" title="でんき">💡</button>
          <button class="press" data-act="theme" title="もようがえ">🔄</button>
        </div>
      </div>
    </section>
    <aside class="side" id="panel"></aside>
  </div>

  <footer class="bottom">
    <div class="card msg">
      <canvas class="ava" id="ava2" width="48" height="48"></canvas>
      <p id="hint"></p>
    </div>
    <div class="acts">
      <button class="press a-food" data-act="feed"><span class="ic">🍙</span>ごはん</button>
      <button class="press a-play" data-act="playmenu"><span class="ic">🎮</span>あそぶ</button>
      <button class="press a-bath" data-act="bath"><span class="ic">🚿</span>おふろ</button>
      <button class="press a-pet" data-act="pet"><span class="ic">🤚</span>なでる</button>
    </div>
    <div class="card banner">
      <p>たまちゃんと<br>いっしょに<br>たのしい まいにちを！</p>
      <canvas class="ava" id="ava3" width="48" height="48"></canvas>
    </div>
  </footer>
</div>
<div id="modal"></div>
