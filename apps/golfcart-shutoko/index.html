<!doctype html>

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ゴルフカート首都高爆走</title>
<meta name="description" content="ゴルフカートで夜の首都高を爆走！車をよけてボールとバッテリーを集める3Dドライブゲーム。">
<meta name="theme-color" content="#0b1024">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1024;color:#fff;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 0;pointer-events:none;z-index:5}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.chip{background:rgba(5,8,22,.6);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:4px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.chip small{font-size:11px;opacity:.7;margin-right:4px}
#speed{text-align:right;line-height:1}
#speed b{font-size:34px;font-style:italic;color:#ffe066;text-shadow:0 0 10px rgba(255,200,0,.5)}
#speed span{font-size:12px;opacity:.8}
#battWrap{margin-top:6px;display:flex;align-items:center;gap:6px}
#batt{flex:1;max-width:220px;height:14px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);overflow:hidden}
#battFill{height:100%;width:100%;background:linear-gradient(90deg,#3ddc84,#9cff57);transition:background .3s}
#battFill.low{background:linear-gradient(90deg,#ff3b3b,#ff8a3b)}
#topBtns{position:fixed;top:calc(64px + env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:6px;z-index:6}
#topBtns button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(5,8,22,.6);color:#fff;font-size:18px;padding:0}
#controls{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;z-index:5}
#controls button{border:2px solid rgba(255,255,255,.35);background:rgba(10,14,40,.55);color:#fff;font-weight:900;border-radius:20px;touch-action:none}
#controls button.on{background:rgba(255,210,60,.55);border-color:#ffe066}
.steer{width:84px;height:84px;font-size:30px}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
#bHorn{width:64px;height:44px;font-size:20px;border-radius:14px!important}
#bBoost{width:120px;height:64px;font-size:20px;letter-spacing:1px;background:rgba(255,80,40,.45)!important;border-color:rgba(255,160,90,.7)!important}
#bBoost.on{background:rgba(255,140,40,.85)!important}
#popup{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;text-align:center;pointer-events:none;z-index:7;
  text-shadow:0 0 8px #000,0 2px 0 #000;white-space:nowrap;transition:opacity .3s}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,6,20,.72);overflow-y:auto}
.card{width:100%;max-width:400px;text-align:center}
h1{margin:0 0 4px;font-size:30px;line-height:1.2;color:#ffe066;text-shadow:0 0 14px rgba(255,180,0,.6),0 3px 0 #a33}
h1 small{display:block;font-size:14px;color:#9fd8ff;text-shadow:none;letter-spacing:2px;margin-bottom:6px}
.lead{font-size:14px;opacity:.9;margin:8px 0 14px;line-height:1.6}
.guide{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.8;margin-bottom:14px}
.guide b{color:#ffe066}
.big{display:block;width:100%;padding:14px;font-size:20px;font-weight:900;border:0;border-radius:14px;background:linear-gradient(#ffd23f,#ff8c1a);color:#3a1a00;box-shadow:0 4px 0 #a34d00;margin-top:8px}
.sub{display:block;width:100%;padding:10px;font-size:15px;font-weight:700;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:transparent;color:#fff;margin-top:10px}
.best{font-size:13px;opacity:.8;margin-top:10px}
.res{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px;line-height:2}
.res div{display:flex;justify-content:space-between}
.res .tot{font-size:22px;font-weight:900;color:#ffe066;border-top:1px solid rgba(255,255,255,.2);margin-top:4px;padding-top:4px}
#newBest{color:#ff7ad9;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div id="hud" hidden>
  <div class="hrow">
    <div>
      <div class="chip"><small>距離</small><span id="dist">0</span>m</div>
      <div class="chip" style="margin-top:6px"><small>スコア</small><span id="score">0</span></div>
    </div>
    <div id="speed"><b id="spd">0</b><span> km/h</span></div>
  </div>
  <div id="battWrap"><span>🔋</span><div id="batt"><div id="battFill"></div></div></div>
</div>
<div id="topBtns" hidden><button id="bPause" aria-label="一時停止">⏸</button><button id="bMute" aria-label="音">🔊</button></div>
<div id="controls" hidden>
  <button id="bL" class="steer" aria-label="左">◀</button>
  <div class="mid"><button id="bHorn" aria-label="クラクション">📯</button><button id="bBoost">BOOST</button></div>
  <button id="bR" class="steer" aria-label="右">▶</button>
</div>
<div id="popup"></div>

<div id="title" class="ov">
  <div class="card">
    <h1><small>GOLF CART HIGHWAY</small>ゴルフカート<br>首都高爆走</h1>
    <p class="lead">打ちっぱなし帰りのおじさんが、<br>ゴルフカートのまま夜の首都高へ！</p>
    <div class="guide">
      <b>◀ ▶</b> 左右にハンドル（カーブでは外へ流される）<br>
      <b>BOOST</b> 押している間ぶっ飛ばす（電池を多く使う）<br>
      <b>📯</b> クラクションで前の車をどかす<br>
      ⛳ ボールで +100 ／ 🔋 で電池回復<br>
      車すれすれを抜けると <b>ニアミス +50</b><br>
      電池が切れたら終わり<br>
      <span style="opacity:.7">PC：← → / A D・スペースでブースト・H でクラクション</span>
    </div>
    <button class="big" id="bStart">スタート</button>
    <div class="best" id="bestT"></div>
  </div>
</div>

<div id="pauseOv" class="ov" hidden>
  <div class="card">
    <h1 style="font-size:26px">一時停止</h1>
    <button class="big" id="bResume">つづける</button>
    <button class="sub" id="bQuit">タイトルへ</button>
  </div>
</div>

<div id="result" class="ov" hidden>
  <div class="card">
    <h1 style="font-size:26px">電池切れ…</h1>
    <div id="newBest" hidden>ベスト更新！</div>
    <div class="res">
      <div><span>走った距離</span><span id="rDist"></span></div>
      <div><span>⛳ ボール</span><span id="rBall"></span></div>
      <div><span>ニアミス</span><span id="rNear"></span></div>
      <div><span>最高速度</span><span id="rTop"></span></div>
      <div class="tot"><span>スコア</span><span id="rScore"></span></div>
    </div>
    <div class="best" id="rBest"></div>
    <button class="big" id="bRetry">もう一回</button>
    <button class="sub" id="bToTitle">タイトルへ</button>
  </div>
</div>
