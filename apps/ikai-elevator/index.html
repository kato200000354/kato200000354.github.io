<!DOCTYPE html>
<!-- © kato200000354. 無断転載・複製・再配布を禁止します。 (kato200000354-protected) -->

<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">
<script src="../../audio-pause.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>異界エレベーター</title>
<meta name="description" content="深夜のマンションで10階の自宅へ。扉が開くたびに廊下とかごの中を見て、異変があれば下へ。見つめすぎると……">

<style>
  :root{
    --bg:#000; --fg:#e8e2d6; --accent:#ff9a3c; --danger:#ff4d5e; --panel:rgba(10,9,10,.9); --line:rgba(232,226,214,.2);
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.08;image-rendering:pixelated;z-index:1}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.72) 100%)}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;z-index:2;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none}
  #hFloor{font-family:"Consolas","Courier New",monospace;font-size:24px;font-weight:700;color:var(--accent);
    text-shadow:0 0 10px rgba(255,120,30,.6)}
  .dim{opacity:.5;font-size:13px;margin-left:8px}
  .hr{display:flex;gap:8px}
  .hb{pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);
    border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer}
  #ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;z-index:2;pointer-events:none;
    padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
  .dec{pointer-events:auto;flex:1;max-width:210px;padding:12px 8px;border-radius:14px;cursor:pointer;
    border:1px solid rgba(255,154,60,.5);background:rgba(22,14,8,.72);color:var(--fg);font-size:20px;font-weight:700;
    letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .3s}
  .dec small{font-size:11px;font-weight:400;opacity:.7;letter-spacing:.04em}
  .dec:disabled{opacity:.18;cursor:default}
  #downBtn{border-color:rgba(255,77,94,.55);background:rgba(26,8,10,.72)}
  #msg{position:fixed;left:16px;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));text-align:center;z-index:2;
    font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:16px;line-height:1.75;letter-spacing:.05em;
    pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 0 6px #000,0 0 14px #000,0 0 2px #000}
  #msg.on{opacity:1}
  #msg .r{color:#ff8a94}
  #hint{position:fixed;left:0;right:0;bottom:calc(178px + env(safe-area-inset-bottom));text-align:center;font-size:13px;
    opacity:0;transition:opacity .8s;pointer-events:none;z-index:2;text-shadow:0 0 6px #000}
  #hint.on{opacity:.75}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5;transition:opacity 1.6s}
  #fade.on{opacity:1}
  #scare{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;display:none}
  #scare.on{display:block;animation:shake .07s infinite}
  @keyframes shake{0%{transform:translate(6px,-4px) scale(1.04)}33%{transform:translate(-7px,5px) scale(1.06)}
    66%{transform:translate(4px,6px) scale(1.03)}100%{transform:translate(-3px,-6px) scale(1.05)}}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:7;
    background:rgba(0,0,0,.58)}
  #overlay.hide{display:none}
  .card{max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center;line-height:1.75}
  .card h1{font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:32px;letter-spacing:.18em;
    color:#efe8dc;margin-bottom:6px;text-shadow:2px 0 rgba(255,40,60,.6),-2px 0 rgba(90,200,255,.4);
    animation:glitch 3.4s infinite steps(1)}
  @keyframes glitch{0%,100%{transform:none;opacity:1}41%{transform:translate(2px,-1px) skewX(-7deg);opacity:.8}
    42%{transform:translate(-3px,1px);opacity:.35}43%{transform:none;opacity:1}77%{opacity:.25}78%{opacity:1}}
  .card h2{font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:26px;letter-spacing:.12em;margin-bottom:8px}
  .card h2.red{color:#ff6b78}
  .card p{font-size:14px;opacity:.9}
  .tagline{font-size:13px;opacity:.75;letter-spacing:.08em;margin-bottom:12px}
  .warn{display:inline-block;font-size:12px;border:1px solid rgba(255,77,94,.5);color:#ff9aa4;border-radius:12px;
    padding:2px 10px;margin-bottom:6px}
  .card ul{list-style:none;text-align:left;font-size:13.5px;margin:12px 0;opacity:.92}
  .card li{padding:3px 0 3px 1.1em;text-indent:-1.1em}
  .card li b{color:var(--accent)}
  .card li .r{color:#ff8a94;font-weight:700}
  .go{margin-top:14px;font-size:18px;padding:12px 40px;border-radius:30px;border:none;cursor:pointer;
    background:#8f1222;color:#f3e9e4;font-weight:700;letter-spacing:.14em;box-shadow:0 0 18px rgba(255,40,70,.35)}
  .sub{margin:10px 4px 0;font-size:14px;padding:8px 18px;border-radius:20px;cursor:pointer;background:transparent;
    color:var(--fg);border:1px solid var(--line)}
  .stat{font-size:13px;opacity:.7;margin-top:12px}
  .big{font-size:15px;margin:4px 0}
  .big b{color:var(--accent);font-size:18px}
  .alist{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0;text-align:left;font-size:12.5px}
  .alist div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 8px;line-height:1.45}
  .alist div.no{opacity:.4;text-align:center}
  @media (max-width:360px){.alist{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="grain" width="160" height="160"></canvas>
<div id="vig"></div>
<div id="hud">
  <div><span id="hFloor">1F</span><span class="dim">→ 10F</span></div>
  <div class="hr"><button id="turnBtn" class="hb">↻ ふりかえる</button><button id="muteBtn" class="hb">🔊</button></div>
</div>
<div id="hint">ドラッグで見回せる</div>
<div id="msg"></div>
<div id="ctrl">
  <button id="upBtn" class="dec" disabled>▲ 上へ<small>いつも通り</small></button>
  <button id="downBtn" class="dec" disabled>▼ 下へ<small>異変がある</small></button>
</div>
<div id="fade"></div>
<canvas id="scare"></canvas>
<div id="overlay"><div class="card" id="card"></div></div>
