<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>異界エレベーター</title>
<meta name="description" content="深夜のマンションで10階の自宅へ。扉が開くたびに廊下とかごの中を見て、異変があれば下へ。見つめすぎると……">

<style>
  :root{
    --bg:#000; --fg:#e8e2d6; --accent:#ff9a3c; --danger:#ff4d5e; --panel:rgba(10,9,10,.9); --line:rgba(232,226,214,.2);
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.08;image-rendering:pixelated;z-index:1}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 42%,rgba(0,0,0,.72) 100%)}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;z-index:2;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none}
  #hFloor{font-family:"Consolas","Courier New",monospace;font-size:24px;font-weight:700;color:var(--accent);
    text-shadow:0 0 10px rgba(255,120,30,.6)}
  .dim{opacity:.5;font-size:13px;margin-left:8px}
  .hr{display:flex;gap:8px}
  .hb{pointer-events:auto;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--fg);
    border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer}
  #ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;z-index:2;pointer-events:none;
    padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
  .dec{pointer-events:auto;flex:1;max-width:210px;padding:12px 8px;border-radius:14px;cursor:pointer;
    border:1px solid rgba(255,154,60,.5);background:rgba(22,14,8,.72);color:var(--fg);font-size:20px;font-weight:700;
    letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .3s}
  .dec small{font-size:11px;font-weight:400;opacity:.7;letter-spacing:.04em}
  .dec:disabled{opacity:.18;cursor:default}
  #downBtn{border-color:rgba(255,77,94,.55);background:rgba(26,8,10,.72)}
  #msg{position:fixed;left:16px;right:16px;bottom:calc(112px + env(safe-area-inset-bottom));text-align:center;z-index:2;
    font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:16px;line-height:1.75;letter-spacing:.05em;
    pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 0 6px #000,0 0 14px #000,0 0 2px #000}
  #msg.on{opacity:1}
  #msg .r{color:#ff8a94}
  #hint{position:fixed;left:0;right:0;bottom:calc(178px + env(safe-area-inset-bottom));text-align:center;font-size:13px;
    opacity:0;transition:opacity .8s;pointer-events:none;z-index:2;text-shadow:0 0 6px #000}
  #hint.on{opacity:.75}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5;transition:opacity 1.6s}
  #fade.on{opacity:1}
  #scare{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;display:none}
  #scare.on{display:block;animation:shake .07s infinite}
  @keyframes shake{0%{transform:translate(6px,-4px) scale(1.04)}33%{transform:translate(-7px,5px) scale(1.06)}
    66%{transform:translate(4px,6px) scale(1.03)}100%{transform:translate(-3px,-6px) scale(1.05)}}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:7;
    background:rgba(0,0,0,.58)}
  #overlay.hide{display:none}
  .card{max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center;line-height:1.75}
  .card h1{font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:32px;letter-spacing:.18em;
    color:#efe8dc;margin-bottom:6px;text-shadow:2px 0 rgba(255,40,60,.6),-2px 0 rgba(90,200,255,.4);
    animation:glitch 3.4s infinite steps(1)}
  @keyframes glitch{0%,100%{transform:none;opacity:1}41%{transform:translate(2px,-1px) skewX(-7deg);opacity:.8}
    42%{transform:translate(-3px,1px);opacity:.35}43%{transform:none;opacity:1}77%{opacity:.25}78%{opacity:1}}
  .card h2{font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-size:26px;letter-spacing:.12em;margin-bottom:8px}
  .card h2.red{color:#ff6b78}
  .card p{font-size:14px;opacity:.9}
  .tagline{font-size:13px;opacity:.75;letter-spacing:.08em;margin-bottom:12px}
  .warn{display:inline-block;font-size:12px;border:1px solid rgba(255,77,94,.5);color:#ff9aa4;border-radius:12px;
    padding:2px 10px;margin-bottom:6px}
  .card ul{list-style:none;text-align:left;font-size:13.5px;margin:12px 0;opacity:.92}
  .card li{padding:3px 0 3px 1.1em;text-indent:-1.1em}
  .card li b{color:var(--accent)}
  .card li .r{color:#ff8a94;font-weight:700}
  .go{margin-top:14px;font-size:18px;padding:12px 40px;border-radius:30px;border:none;cursor:pointer;
    background:#8f1222;color:#f3e9e4;font-weight:700;letter-spacing:.14em;box-shadow:0 0 18px rgba(255,40,70,.35)}
  .sub{margin:10px 4px 0;font-size:14px;padding:8px 18px;border-radius:20px;cursor:pointer;background:transparent;
    color:var(--fg);border:1px solid var(--line)}
  .stat{font-size:13px;opacity:.7;margin-top:12px}
  .big{font-size:15px;margin:4px 0}
  .big b{color:var(--accent);font-size:18px}
  .alist{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0;text-align:left;font-size:12.5px}
  .alist div{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:6px 8px;line-height:1.45}
  .alist div.no{opacity:.4;text-align:center}
  @media (max-width:360px){.alist{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="grain" width="160" height="160"></canvas>
<div id="vig"></div>
<div id="hud">
  <div><span id="hFloor">1F</span><span class="dim">→ 10F</span></div>
  <div class="hr"><button id="turnBtn" class="hb">↻ ふりかえる</button><button id="muteBtn" class="hb">🔊</button></div>
</div>
<div id="hint">ドラッグで見回せる</div>
<div id="msg"></div>
<div id="ctrl">
  <button id="upBtn" class="dec" disabled>▲ 上へ<small>いつも通り</small></button>
  <button id="downBtn" class="dec" disabled>▼ 下へ<small>異変がある</small></button>
</div>
<div id="fade"></div>
<canvas id="scare"></canvas>
<div id="overlay"><div class="card" id="card"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) {
  $('card').innerHTML = '<h2>読み込みに失敗しました</h2><p>インターネットに接続して、ページを再読み込みしてください。</p>';
  return;
}

// ===== 基本設定 =====
const GOAL = 10;              // 自宅の階
const OPEN_TIME = 1.4;        // 扉が開くのにかかる秒数
const CLOSE_TIME = 1.3;
const RIDE_TIME = 3.4;        // 1階ぶん上がる時間
const FALL_TIME = 3.2;        // 間違えて1階へ落ちる時間
const FONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
const MINCHO = '"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif';
const PI = Math.PI;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const store = {
  get(k, d) { try { const v = localStorage.getItem('ikaiElev.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ikaiElev.' + k, JSON.stringify(v)); } catch (e) {} }
};

// ===== 音（すべてその場で合成） =====
const sfx = (() => {
  let ac = null, master = null, noise = null, humG = null, muted = store.get('muted', false);
  const VOL = 0.9;
  function src() { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; return s; }
  function out(pan) {
    if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(master); return p; }
    return master;
  }
  function env(g, t0, a, peak, dec) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec);
  }
  function tone(freq, type, t0, a, peak, dec, dest) {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = ac.createGain(); env(g, t0, a, peak, dec);
    o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + a + dec + 0.05);
    return o;
  }
  function nz(t0, dur, type, freq, q, peak, a, dest) {
    const s = src(); const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
    const g = ac.createGain(); env(g, t0, a || 0.01, peak, dur);
    s.connect(f); f.connect(g); g.connect(dest || master); s.start(t0); s.stop(t0 + (a || 0.01) + dur + 0.05);
    return { f, g };
  }
  return {
    init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : VOL; master.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // かごのうなり
      humG = ac.createGain(); humG.gain.value = 0.035; humG.connect(master);
      const o1 = ac.createOscillator(); o1.frequency.value = 58; o1.connect(humG); o1.start();
      const o2 = ac.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 116.5;
      const g2 = ac.createGain(); g2.gain.value = 0.22; o2.connect(g2); g2.connect(humG); o2.start();
      const ns = src(); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170;
      const g3 = ac.createGain(); g3.gain.value = 0.7; ns.connect(lp); lp.connect(g3); g3.connect(humG); ns.start();
      // 低いドローン
      const amb = ac.createGain(); amb.gain.value = 0.03; amb.connect(master);
      [41, 43.6].forEach(f => { const o = ac.createOscillator(); o.frequency.value = f; o.connect(amb); o.start(); });
    },
    suspend(on) { if (!ac) return; if (on) ac.suspend(); else ac.resume(); },
    get muted() { return muted; },
    toggle() {
      muted = !muted; store.set('muted', muted);
      if (master) master.gain.setTargetAtTime(muted ? 0 : VOL, ac.currentTime, 0.05);
      return muted;
    },
    hum(level) { if (ac) humG.gain.setTargetAtTime(level, ac.currentTime, 0.4); },
    ding() {
      if (!ac) return; const t = ac.currentTime;
      tone(1318.5, 'sine', t, 0.005, 0.16, 1.6); tone(2637, 'sine', t, 0.005, 0.03, 0.8);
      tone(1046.5, 'sine', t + 0.45, 0.005, 0.16, 2.0);
    },
    door() {
      if (!ac) return; const t = ac.currentTime;
      const n = nz(t, 1.2, 'bandpass', 420, 2.5, 0.1, 0.15); n.f.frequency.linearRampToValueAtTime(950, t + 1.2);
      tone(72, 'sine', t + 1.25, 0.005, 0.25, 0.25);
    },
    start() { if (!ac) return; const t = ac.currentTime; tone(48, 'sine', t, 0.01, 0.4, 0.5); nz(t, 0.3, 'lowpass', 250, 1, 0.25, 0.01); },
    step(vol, pan) {
      if (!ac) return; const t = ac.currentTime; const o = out(pan);
      nz(t, 0.12, 'lowpass', 520, 1, 0.55 * vol, 0.005, o); tone(62, 'sine', t, 0.005, 0.7 * vol, 0.16, o);
    },
    whisper(pan) {
      if (!ac) return; const t = ac.currentTime; const o = out(pan);
      for (let i = 0; i < 7; i++) nz(t + i * 0.2 + Math.random() * 0.1, 0.16, 'bandpass', rand(1800, 3800), 5, 0.28, 0.04, o);
    },
    buzz() { if (!ac) return; const t = ac.currentTime; tone(100, 'square', t, 0.005, 0.04, 0.09); nz(t, 0.08, 'highpass', 3000, 1, 0.05); },
    scream() {
      if (!ac) return; const t = ac.currentTime;
      nz(t, 1.3, 'highpass', 700, 0.7, 0.9, 0.005);
      [311, 330, 466, 494, 622].forEach(f => {
        const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t);
        o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 1.3);
        const g = ac.createGain(); env(g, t, 0.01, 0.12, 1.3); o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.4);
      });
      tone(45, 'square', t, 0.005, 0.5, 0.9);
    },
    fall() {
      if (!ac) return; const t = ac.currentTime;
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(170, t);
      o.frequency.exponentialRampToValueAtTime(32, t + FALL_TIME);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
      const g = ac.createGain(); env(g, t, 0.15, 0.14, FALL_TIME - 0.1);
      o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t + FALL_TIME + 0.2);
      nz(t, FALL_TIME, 'lowpass', 450, 1, 0.35, 0.4);
    },
    thud() { if (!ac) return; const t = ac.currentTime; tone(46, 'sine', t, 0.005, 0.9, 0.7); nz(t, 0.5, 'lowpass', 300, 1, 0.7, 0.005); },
  };
})();

// ===== 描画の準備 =====
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.055);
const camera = new THREE.PerspectiveCamera(70, 1, 0.03, 80);
camera.rotation.order = 'YXZ';
const CAM = new THREE.Vector3(0, 1.55, 0.85);
scene.add(new THREE.AmbientLight(0x3a3d48, 0.55));

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  t.ctx = g;
  return t;
}

// --- 顔（窓の外・驚かし用） ---
function drawFace(g, cx, cy, s, intense) {
  g.fillStyle = '#030303';
  g.beginPath(); g.ellipse(cx, cy - s * 0.1, s * 1.35, s * 1.8, 0, 0, PI * 2); g.fill();
  const fg = g.createRadialGradient(cx, cy - s * 0.2, s * 0.1, cx, cy, s * 1.2);
  fg.addColorStop(0, '#ebe6dc'); fg.addColorStop(0.7, '#b6afa3'); fg.addColorStop(1, '#4e4943');
  g.fillStyle = fg; g.beginPath(); g.ellipse(cx, cy, s * 0.85, s * 1.15, 0, 0, PI * 2); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.88)';
  for (let i = 0; i < 18; i++) {
    const side = i % 2 ? 1 : -1;
    const x = cx + side * s * rand(0.5, 0.85);
    g.lineWidth = s * rand(0.02, 0.06);
    g.beginPath(); g.moveTo(x, cy - s * 1.25);
    g.quadraticCurveTo(x - side * s * rand(0, 0.25), cy, x - side * s * rand(0, 0.2), cy + s * rand(0.5, 1.4)); g.stroke();
  }
  for (const sx of [-1, 1]) {
    const ex = cx + sx * s * 0.33, ey = cy - s * 0.12;
    const eg = g.createRadialGradient(ex, ey, 0, ex, ey, s * 0.32);
    eg.addColorStop(0, '#000'); eg.addColorStop(0.55, 'rgba(0,0,0,.95)'); eg.addColorStop(1, 'rgba(40,30,30,0)');
    g.fillStyle = eg; g.beginPath(); g.ellipse(ex, ey, s * 0.32, s * 0.26, 0, 0, PI * 2); g.fill();
    g.fillStyle = intense ? '#ff2a2a' : '#d8d8d8';
    g.beginPath(); g.arc(ex + sx * s * 0.02, ey, s * 0.03, 0, PI * 2); g.fill();
    if (intense) {
      g.strokeStyle = 'rgba(120,0,0,.85)'; g.lineWidth = s * 0.025;
      g.beginPath(); g.moveTo(ex, ey + s * 0.15); g.lineTo(ex + rand(-1, 1) * s * 0.03, ey + s * rand(0.5, 0.8)); g.stroke();
    }
  }
  const my = cy + s * 0.55, mh = s * (intense ? 0.38 : 0.13);
  const mg = g.createRadialGradient(cx, my, 0, cx, my, s * 0.4);
  mg.addColorStop(0, '#000'); mg.addColorStop(0.6, 'rgba(0,0,0,.95)'); mg.addColorStop(1, 'rgba(30,10,10,0)');
  g.fillStyle = mg; g.beginPath(); g.ellipse(cx, my, s * 0.2, mh, 0, 0, PI * 2); g.fill();
}

// --- 共有テクスチャ ---
const tileTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#5d5850'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.08})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = '#46423c'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
});
tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
const wallTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#bdb6a8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
const metalTex = canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#9ea3a8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 320; i++) {
    g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${Math.random() * 0.07})`;
    g.fillRect(Math.random() * w, 0, 1 + Math.random() * 2, h);
  }
});
const nightTex = canvasTex(256, 170, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#02040a'); gr.addColorStop(1, '#0b1224');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,${200 + Math.random() * 40 | 0},140,${rand(0.2, 0.7)})`; g.fillRect(Math.random() * w, h * rand(0.55, 1), 2, 2); }
});
const windowFaceTex = canvasTex(256, 170, (g, w, h) => {
  g.fillStyle = '#04060c'; g.fillRect(0, 0, w, h);
  drawFace(g, w / 2, h * 0.55, h * 0.48, false);
});
const posterTex = canvasTex(250, 350, (g, w, h) => {
  g.fillStyle = '#ece6d6'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#2a5a3a'; g.fillRect(0, 0, w, 54);
  g.fillStyle = '#fff'; g.font = `bold 26px ${FONT}`; g.textAlign = 'center'; g.fillText('ゴミ出しのルール', w / 2, 37);
  g.fillStyle = '#222'; g.font = `19px ${FONT}`; g.textAlign = 'left';
  ['燃えるゴミ … 月・木', '資源ゴミ …… 水', 'ビン・缶 …… 金', '', '収集日の朝8時までに', '出してください。'].forEach((s, i) => g.fillText(s, 18, 100 + i * 34));
  g.font = `16px ${FONT}`; g.textAlign = 'right'; g.fillText('管理組合', w - 16, h - 18);
});
const posterEyesTex = canvasTex(250, 350, (g, w, h) => {
  g.fillStyle = '#e4dccb'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26; i++) {
    const x = rand(20, w - 20), y = rand(20, h - 20), s = rand(14, 30);
    g.fillStyle = '#f4f0e8'; g.beginPath(); g.ellipse(x, y, s, s * 0.5, 0, 0, PI * 2); g.fill();

let forced = null;   // 確認用（URL末尾に #debug を付けたときだけ使う）
function pickAnomaly(f) {
  if (forced) { const a = ANOMS.find(x => x.id === forced); forced = null; if (a) return a; }
  const chance = normStreak >= 2 ? 1 : anomStreak >= 3 ? 0.3 : 0.6;
  if (Math.random() >= chance) { normStreak++; anomStreak = 0; return null; }
  normStreak = 0; anomStreak++;
  const ok = a => !(a.danger && f < 3);
  let pool = ANOMS.filter(a => ok(a) && !usedIds.has(a.id));
  if (!pool.length) { usedIds.clear(); pool = ANOMS.filter(ok); }
  // まだ見つけていない異変を少し出やすくする
  const weighted = []; pool.forEach(a => { weighted.push(a); if (!found.has(a.id)) weighted.push(a); });
  const a = weighted[Math.random() * weighted.length | 0];
  usedIds.add(a.id); return a;
}

function prepareFloor(f, forceNormal) {
  resetCab();
  const a = (!forceNormal && f > 1 && f < GOAL) ? pickAnomaly(f) : null;
  anomaly = a;
  const p = hallParams(f);
  if (a && a.p) Object.assign(p, typeof a.p === 'function' ? a.p(f) : a.p);
  buildHall(p);
  if (a && a.add) a.add(p);
  if (a && a.cab) a.cab();
}

function onOpened() {
  state = 'open';

function decide(up) {
  if (state !== 'open') return;
  if (!up && floor === 1) return;
  const correct = floor === 1 ? true : (up ? !anomaly : !!anomaly);
  setButtons(false); $('hint').classList.remove('on');
  lastResult = { correct, anomaly };
  if (correct && anomaly && !found.has(anomaly.id)) { found.add(anomaly.id); store.set('found', [...found]); }
  if (!correct) mistakes++;
  state = 'closing'; sfx.door();
}

function onClosed() {
  stT = 0;
  if (lastResult.correct) {
    nextFloor = floor + 1; state = 'riding';
    setIndicator(String(floor), '▲'); sfx.start(); sfx.hum(0.09);
    prepareFloor(nextFloor);

    state = 'falling'; sfx.fall(); sfx.hum(0.12);

// ===== 操作 =====
$('upBtn').addEventListener('click', () => decide(true));
$('downBtn').addEventListener('click', () => decide(false));

let drag = null;
canvas.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId, k: e.pointerType === 'touch' ? 0.0085 : 0.005 };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

  if (!drag || e.pointerId !== drag.id) return;
  yaw -= (e.clientX - drag.x) * drag.k; pitch = clamp(pitch - (e.clientY - drag.y) * drag.k, -1.1, 1.1);
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };

const keys = {};
addEventListener('keydown', e => {

});

function resize() {

// ===== フィルムのざらつき =====
const grain = $('grain').getContext('2d'), grainImg = grain.createImageData(160, 160);
let grainT = 0;
function drawGrain() {
  const d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  grain.putImageData(grainImg, 0, 0);
}

// ===== 毎フレームの処理 =====
function update(dt) {
  time += dt;
  if (keys.ArrowLeft || keys.KeyA) yaw += 1.8 * dt;
  if (keys.ArrowRight || keys.KeyD) yaw -= 1.8 * dt;
  if (turnAnim) {
    turnAnim.t = Math.min(1, turnAnim.t + dt / 0.55);
    const e = turnAnim.t < 0.5 ? 2 * turnAnim.t * turnAnim.t : 1 - Math.pow(-2 * turnAnim.t + 2, 2) / 2;
    yaw = turnAnim.from + (turnAnim.to - turnAnim.from) * e;
    if (turnAnim.t >= 1) turnAnim = null;
  }

  switch (state) {
    case 'wait':
      stT += dt; if (stT > 1.0) startOpening(); break;
    case 'opening':
      door = Math.min(1, door + dt / OPEN_TIME); if (door >= 1) onOpened(); break;
    case 'closing':
      door = Math.max(0, door - dt / CLOSE_TIME); if (door <= 0) onClosed(); break;
    case 'riding':
      stT += dt; shake = Math.max(shake, 0.12);
      if (stT > RIDE_TIME * 0.6) setIndicator(String(nextFloor), '▲');
      if (stT >= RIDE_TIME) { floor = nextFloor; updateHUD(); setIndicator(String(floor)); sfx.hum(0.035); startOpening(); }
      break;
    case 'falling': {
      stT += dt; shake = Math.max(shake, 0.6);
      const k = Math.min(1, stT / FALL_TIME);
      setIndicator(String(Math.max(1, Math.round(floor + (1 - floor) * k * k))), '▼');
      if (stT >= FALL_TIME) { floor = 1; updateHUD(); setIndicator('1'); sfx.thud(); sfx.hum(0.035); shake = 1.2; state = 'wait'; stT = 0.2; }
      break;
    }
  }

  if (anomaly && anomaly.update) { if (anomaly.update(dt) === 'caught' && state !== 'dead') jumpscare(); }

  // 扉
  const e = door < 0.5 ? 2 * door * door : 1 - Math.pow(-2 * door + 2, 2) / 2;
  doorL.position.x = -0.2 - 0.4 * e; doorR.position.x = 0.2 + 0.4 * e;

  // かごの照明
  let ci = 1.1;
  if (cabState.dark) ci = Math.random() < 0.05 ? rand(0.3, 0.9) : 0.13;
  if (state === 'falling') ci = Math.random() < 0.45 ? 0.04 : 1.0;
  cabLight.intensity = ci; panelLightMat.color.setHex(0xfff1dc).multiplyScalar(clamp(ci / 1.1, 0.06, 1));

  // 廊下の照明
  if (hs.p) {
    hs.t += dt;
    let on = 1;
    if (hs.p.flicker) {
      hs.fl -= dt;
      if (hs.fl <= 0) {
        hs.flOn = !hs.flOn; hs.fl = hs.flOn ? rand(0.05, 0.55) : rand(0.03, 0.2);
        if (hs.flOn && door > 0.3 && Math.random() < 0.6) sfx.buzz();
      }
      on = hs.flOn ? 1 : 0.05;
    }
    if (hs.off) on = 0;
    hs.lights.forEach(l => { l.intensity = hs.p.lightI * on; });
    hs.fixMat.color.setHex(hs.p.light).multiplyScalar(on > 0.5 ? 1 : 0.06);
  }

  shake = Math.max(0, shake - dt * 1.5);
}

function render() {
  const s = shake * shake * 0.02;
  camera.position.set(CAM.x + rand(-1, 1) * s, CAM.y + Math.sin(time * 1.3) * 0.004 + rand(-1, 1) * s, CAM.z);
  camera.rotation.set(pitch, yaw, 0);
  renderer.render(scene, camera);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'title') { yaw = Math.sin(now / 4000) * 0.25; }
  update(dt); render();
  grainT += dt; if (grainT > 0.06) { grainT = 0; drawGrain(); }
  requestAnimationFrame(loop);
}
