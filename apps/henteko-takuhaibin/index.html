<html lang="ja">
<head>

<title>まがれ！へんてこ宅配便</title>
<meta name="description" content="交差点をタップして道を切り替え、自動で走る宅配トラックをお届け先へ導く交通パズル。全15ステージ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --water:#4c8ca3;--water-lo:#3d7890;
  --ink:#2f3a45;--ink-soft:#6b7783;
  --paper:#fffaf0;--paper-lo:#e9dfc8;
  --btn:#f3f3f1;--btn-lo:#a4adb5;
  --green:#6bbd45;--green-lo:#3f8a26;
  --yellow:#ffc83d;--yellow-lo:#d08f12;
  --red:#e8504a;--red-lo:#a8302b;
  --wood:#8a5a3a;--wood-lo:#5e3a22;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--water);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;color:var(--ink);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
svg{display:block}
#app{position:relative;width:100%;max-width:560px;height:100%;margin:0 auto;overflow:hidden;background:var(--water)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;z-index:5;pointer-events:none}
.screen>*{pointer-events:auto}

/* ---------- chunky round button ---------- */
.cbtn{width:62px;height:62px;border-radius:50%;background:var(--btn);box-shadow:0 6px 0 var(--btn-lo),0 9px 14px rgba(0,0,0,.25);display:grid;place-items:center;color:#3c4a57;position:relative;transition:transform .06s}
.cbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--btn-lo),0 4px 8px rgba(0,0,0,.25)}
.cbtn svg{width:28px;height:28px;fill:currentColor}
.cbtn small{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.cbtn.on{background:#ffe9a6;color:#b46b00}
.cbtn.hint{background:var(--yellow);box-shadow:0 6px 0 var(--yellow-lo),0 9px 14px rgba(0,0,0,.25);color:#fff;border-radius:18px}
.cbtn.hint:active{box-shadow:0 2px 0 var(--yellow-lo)}
.cbtn.hint b{font-size:34px;line-height:1;text-shadow:0 3px 0 var(--yellow-lo)}
.cbtn.used{filter:saturate(.4)}
.sbtn{width:46px;height:46px}
.sbtn svg{width:22px;height:22px}

.pill{border-radius:999px;padding:12px 26px;font-size:20px;font-weight:900;color:#fff;background:var(--green);box-shadow:0 6px 0 var(--green-lo),0 10px 16px rgba(0,0,0,.22);transition:transform .06s;letter-spacing:.04em}
.pill:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-lo)}
.pill.sub{background:var(--btn);color:#3c4a57;box-shadow:0 6px 0 var(--btn-lo),0 10px 16px rgba(0,0,0,.18)}
.pill.sub:active{box-shadow:0 2px 0 var(--btn-lo)}
.pill.orange{background:#f39a2f;box-shadow:0 6px 0 #b9640b,0 10px 16px rgba(0,0,0,.22)}
.pill.orange:active{box-shadow:0 2px 0 #b9640b}

/* ---------- title ---------- */
#title .logo{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 26px);text-align:center;pointer-events:none}
.logo .l1,.logo .l2{display:block;font-weight:900;color:#fff;paint-order:stroke fill;-webkit-text-stroke:9px #2f3a45;text-shadow:0 7px 0 #2f3a45}
.logo .l1{font-size:58px;color:#ffc83d;transform:rotate(-4deg);letter-spacing:.02em}
.logo .l2{font-size:36px;margin-top:4px}
.logo .tag{display:inline-block;margin-top:14px;background:rgba(255,255,255,.92);color:#3c4a57;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#title .menu{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);display:flex;flex-direction:column;align-items:center;gap:22px}
#title .menu .pill{min-width:220px;font-size:24px;padding:15px 30px}
#title .row{display:flex;gap:16px;align-items:center}
#title .note{font-size:11px;color:#fff;opacity:.85;text-shadow:0 1px 2px rgba(0,0,0,.4)}

/* ---------- stage select ---------- */
#select{background:#cfe8b4;display:flex;flex-direction:column}
#select .head{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--water);color:#fff;box-shadow:0 4px 0 var(--water-lo);z-index:2}
#select .head h2{flex:1;font-size:20px;font-weight:900;text-shadow:0 2px 0 var(--water-lo)}
#select .stars{background:rgba(0,0,0,.18);border-radius:999px;padding:6px 14px;font-size:16px;white-space:nowrap}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
#mapInner{position:relative;width:100%}
.band{position:absolute;left:0;right:0}
.ttl{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:16px;background:var(--wood);color:#fff;border-radius:14px;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--wood-lo);white-space:nowrap}
.ttl b{display:block;font-size:17px}
.ttl span{display:block;font-size:11px;opacity:.85;font-weight:500}
.deco{position:absolute;font-size:30px;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
#mapSvg{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;z-index:2;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#ffe27a,#f3b51f 70%);box-shadow:0 6px 0 #c47f0c,0 10px 14px rgba(0,0,0,.2);font-size:26px;font-weight:900;color:#fff;text-shadow:0 2px 0 #b06f06;display:grid;place-items:center;transition:transform .06s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 #c47f0c}
.node.lock{background:radial-gradient(circle at 50% 38%,#d9dde0,#a9b1b8 70%);box-shadow:0 6px 0 #7d868d;text-shadow:none;color:#6f7880;font-size:22px}
.node.cur{animation:bob 1.1s ease-in-out infinite}
.node .st{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:15px;letter-spacing:-1px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.node .st i{font-style:normal;color:#fff2a8}
.node .st i.off{color:rgba(0,0,0,.18);text-shadow:none}
.node .tk{position:absolute;top:-30px;font-size:28px;text-shadow:none;animation:none}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}

/* ---------- game hud ---------- */
#game .top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;align-items:center;gap:10px}
.stag{flex:1;min-width:0;background:var(--wood);color:#fff;border-radius:14px;padding:6px 12px;box-shadow:0 4px 0 var(--wood-lo);line-height:1.2}
.stag small{display:block;font-size:11px;opacity:.85}
.stag b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:#fff;border-radius:14px;padding:8px 12px;font-size:22px;font-weight:900;box-shadow:0 4px 0 var(--btn-lo);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.timer.warn{background:#ffdfd6;color:var(--red);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
#orders{position:absolute;left:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.ord{display:flex;align-items:center;gap:8px;background:rgba(255,250,240,.96);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 rgba(0,0,0,.15);font-size:13px;border-left:8px solid #ccc}
.ord .em{font-size:20px}
.ord .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord .tx b{font-weight:900}
.ord .pg{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.ord.done{opacity:.6}
#game .bottom{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 34px);display:flex;justify-content:space-around;align-items:center}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:20;background:rgba(25,45,60,.55);display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:400px;background:var(--paper);border-radius:22px;box-shadow:0 8px 0 var(--paper-lo),0 18px 40px rgba(0,0,0,.35);padding:22px 20px 24px;text-align:center;position:relative;animation:pop .28s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.card .rib{margin:-40px auto 12px;display:inline-block;background:#f39a2f;color:#fff;padding:9px 26px;border-radius:12px;font-size:20px;font-weight:900;box-shadow:0 5px 0 #b9640b}
.card .rib.fail{background:#8a96a3;box-shadow:0 5px 0 #5d6873}
.card h3{font-size:22px;font-weight:900;margin-bottom:8px}
.card p{font-size:14px;line-height:1.7;color:#4a5662;font-weight:500}
.card p b{color:var(--ink);font-weight:900}
.card .big{font-size:54px;line-height:1.1;margin:6px 0}
.card .btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:20px}
.card .btns .pill{font-size:17px;padding:11px 20px}
.goal{margin-top:12px;background:#fff;border-radius:14px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.8;box-shadow:inset 0 0 0 2px #efe6d2}
.goal div{display:flex;gap:8px;align-items:center}
.goal .em{font-size:20px}
.rstars{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
.rstars span{font-size:56px;line-height:1;color:#d8d3c6;transform:scale(.4);opacity:0;transition:transform .35s cubic-bezier(.3,1.8,.6,1),opacity .2s}
.rstars span.on{color:#ffc21a;text-shadow:0 4px 0 #c47f0c}
.rstars span.show{transform:scale(1);opacity:1}
.rstars span:nth-child(2){margin-top:-14px;font-size:66px}
.awards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.awards span{background:#fff1c9;color:#9a5d00;border-radius:999px;padding:4px 12px;font-size:12px;box-shadow:0 2px 0 #ecd28d}
.stats{display:flex;justify-content:center;gap:16px;font-size:13px;color:#4a5662;margin-top:8px;font-weight:500}
.stats b{color:var(--ink);font-weight:900}
.toggle{display:flex;justify-content:center;gap:10px;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- タイトル -->
  <section id="title" class="screen">
    <div class="logo" id="logo">
      <span class="l1">まがれ！</span>
      <span class="l2">へんてこ宅配便</span>
      <span class="tag">交差点を切りかえて、荷物をとどけよう</span>
    </div>
    <div class="menu" id="titleMenu">
      <button class="pill" id="btnStart">あそぶ</button>
      <div class="row">
        <button class="cbtn sbtn" id="btnSoundT" aria-label="音のオンオフ"></button>
      </div>
    </div>
  </section>

  <!-- ステージ選択 -->
  <section id="select" class="screen" hidden>
    <div class="head">
      <button class="cbtn sbtn" id="btnSelBack" aria-label="タイトルへ"><svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>配達マップ</h2>
      <div class="stars" id="selStars">★ 0</div>
    </div>
    <div id="mapScroll"><div id="mapInner"></div></div>
  </section>

  <!-- ゲーム -->
  <section id="game" class="screen" hidden>
    <div class="top" id="hudTop">
      <button class="cbtn sbtn" id="btnMenu" aria-label="メニュー"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
      <div class="stag"><small id="stNum">STAGE 1</small><b id="stName">はじめての配達</b></div>
      <div class="timer" id="timer">0:30</div>
    </div>
    <div id="orders"></div>
    <div class="bottom" id="hudBottom">
      <button class="cbtn" id="btnPause" aria-label="一時停止"><svg viewBox="0 0 24 24"><rect x="5.5" y="5" width="4.5" height="14" rx="1.2"/><rect x="14" y="5" width="4.5" height="14" rx="1.2"/></svg><small>いちじ停止</small></button>
      <button class="cbtn" id="btnRetry" aria-label="リトライ"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M20.5 3.5v6h-6z"/></svg><small>やりなおし</small></button>
      <button class="cbtn" id="btnFF" aria-label="早送り"><svg viewBox="0 0 24 24"><path d="M3 5.5v13l9-6.5zM12 5.5v13l9-6.5z"/></svg><small>はやおくり</small></button>
      <button class="cbtn hint" id="btnHint" aria-label="ヒント"><b>?</b><small>ヒント</small></button>
    </div>
  </section>

  <div id="modal" hidden><div class="card" id="card"></div></div>
</div>

<script>
