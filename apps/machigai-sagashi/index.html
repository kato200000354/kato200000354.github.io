<title>まちがいさがし</title>
<style>
[hidden]{display:none!important}
:root{
  --bg:#fff7ec;--card:#ffffff;--ink:#3b2f2a;--sub:#8a7a70;--accent:#ff6b4a;--accent2:#ffb340;
  --ok:#ff3b5c;--line:#f0dfcc;--shadow:0 4px 14px rgba(120,80,40,.12);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1916;--card:#2a241f;--ink:#f6ece2;--sub:#b5a598;--line:#3d342c;--shadow:0 4px 14px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;overflow-x:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:none}

/* タイトル */
#title{max-width:720px;margin:0 auto;padding:24px 16px 40px}
.logo{text-align:center;margin:10px 0 4px;font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:.04em;color:var(--accent);text-shadow:3px 3px 0 var(--accent2)}
.lead{text-align:center;color:var(--sub);margin:0 0 22px;font-size:15px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.stage{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:0;overflow:hidden;text-align:left;transition:transform .15s}
.stage:active{transform:scale(.97)}
.stage svg{display:block;width:100%;height:auto}
.stage .info{padding:10px 14px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage .nm{font-weight:800;font-size:17px}
.stage .meta{font-size:12px;color:var(--sub)}
.stars{color:#ffbf1f;font-size:18px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}

/* ゲーム画面 */
#game{display:flex;flex-direction:column;align-items:center;min-height:100svh;padding:8px 16px 16px}
.hud{width:100%;max-width:1100px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hud .stname{font-weight:800;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px}
.btn:disabled{opacity:.4}
.timebar{width:100%;max-width:1100px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:8px}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .2s linear}
.timebar.low i{background:#ff3b3b}
.dots{display:flex;gap:5px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.dots b{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ok);display:block}
.dots b.on{background:var(--ok)}
.boards{display:flex;flex-direction:column;gap:10px;width:min(100%,calc((100svh - 150px) / 2 * 4 / 3))}
@media (min-aspect-ratio:1/1){
  .boards{flex-direction:row;width:min(100%,calc((100svh - 140px) * 4 / 3 * 2 + 12px))}
}
.board{position:relative;flex:1;min-width:0}
.board svg{display:block;width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}
.board .tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:2px 8px;pointer-events:none}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mk{transform-box:fill-box;transform-origin:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.hint{animation:blink .3s 5 alternate}
@keyframes blink{from{opacity:1}to{opacity:.1}}
.floater{position:fixed;pointer-events:none;font-weight:900;font-size:20px;color:#ff3b3b;animation:up .8s forwards;z-index:30}
@keyframes up{to{transform:translateY(-36px);opacity:0}}

/* モーダル */
#modal{position:fixed;inset:0;background:rgba(30,20,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{background:var(--card);border-radius:22px;padding:24px 20px;max-width:360px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .35s}
.mbox h2{margin:0 0 6px;font-size:26px}
.mbox p{margin:6px 0;color:var(--sub)}
.mbox .big{font-size:40px;margin:6px 0}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mbtns button{padding:13px;border-radius:14px;font-weight:800;font-size:16px;background:var(--line)}
.mbtns button.main{background:var(--accent);color:#fff}
</style>
</head>
<body>

<section id="title">
  <div class="logo">まちがいさがし</div>
  <p class="lead">2まいの絵のちがいを見つけてタップしよう！<br>まちがえると時間が5秒へるよ。毎回ちがう問題がでるよ。</p>
  <div class="stages" id="stageList"></div>
</section>

<section id="game" hidden>
  <div class="hud">
    <button class="btn" id="backBtn" aria-label="メニューへ">◀</button>
    <div class="stname" id="stName"></div>
    <div class="pill" id="timeTxt">0</div>
    <button class="btn" id="hintBtn">💡 ヒント</button>
  </div>
  <div class="timebar" id="timebar"><i id="timefill"></i></div>
  <div class="dots" id="dots"></div>
  <div class="boards" id="boards">
    <div class="board"><svg id="svgL" viewBox="0 0 400 300"></svg><span class="tag">A</span></div>
    <div class="board"><svg id="svgR" viewBox="0 0 400 300"></svg><span class="tag">B</span></div>
  </div>
</section>

<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
