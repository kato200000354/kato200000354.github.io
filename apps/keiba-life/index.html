<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16337a">
<title>みんなの競馬ライフ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  --navy:#16337a;--blue:#2457c9;--blue2:#3a7be8;--sky:#e9f2ff;--line:#c7d6f0;
  --yellow:#ffd23a;--orange:#ff9a1f;--red:#e8433a;--green:#3cc46a;
  --ink:#1b2a4a;--sub:#5a6a8a;--white:#fff;--panel:rgba(255,255,255,.96);
  --turf:#5cbf4a;--turf2:#46a83a;
}
html,body{background:#0e2457;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-weight:700}
body{min-height:100vh;background:linear-gradient(180deg,#8fd0ff 0%,#cfeaff 40%,#e9f6ff 100%) fixed;overflow-x:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:not-allowed;opacity:.5}
.press{transition:transform .1s,filter .15s}
.press:active:not(:disabled){transform:scale(.95)}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* ===== header ===== */
.hd{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#2f6be0,#16337a);color:#fff;
  border-bottom:3px solid #ffd23a;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hd .home{width:34px;height:34px;border-radius:10px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:18px;flex:none}
.hd .ttl{font-size:18px;letter-spacing:.06em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.hd .chip{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 9px;font-size:11px;white-space:nowrap}
.hd .chip b{color:#ffe36a}

.main{flex:1;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:2px solid #fff;border-radius:14px;box-shadow:0 3px 0 #9fbbe6,0 6px 14px rgba(22,51,122,.18);overflow:hidden}
.ph{background:linear-gradient(180deg,#3a7be8,#2457c9);color:#fff;font-size:13px;padding:5px 10px;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center}
.pb{padding:10px}

/* ===== title ===== */
#scr-title{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;
  background:linear-gradient(180deg,#5db7ff 0%,#a8dcff 45%,#7ccf5f 66%,#4fa83c 100%)}
.logo{text-align:center;margin-bottom:6px}
.logo .s{font-size:18px;color:#16337a;background:#fff;display:inline-block;padding:2px 14px;border-radius:999px;border:2px solid #16337a}
.logo .m{font-size:clamp(42px,13vw,64px);font-weight:900;line-height:1.1;margin-top:6px;
  background:linear-gradient(180deg,#fff7b0 0%,#ffd23a 45%,#ff7a1a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #8a2a00;filter:drop-shadow(0 4px 0 #16337a)}
.logo .sub{color:#fff;font-size:14px;text-shadow:0 2px 0 #16337a;margin-top:4px}
.title-art{font-size:84px;margin:14px 0 10px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18));animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tmenu{width:min(320px,100%);display:flex;flex-direction:column;gap:10px}
.tbtn{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:linear-gradient(180deg,#2f6be0,#16337a);color:#fff;
  font-size:17px;border:2px solid #fff;box-shadow:0 4px 0 #0b1d4a}
.tbtn.main-b{background:linear-gradient(180deg,#ffe36a,#ffb21a);color:#5a2a00;box-shadow:0 4px 0 #b06a00}
.tbtn i{font-style:normal;font-size:22px;width:28px;text-align:center}
.tnote{margin-top:14px;font-size:12px;color:#fff;background:rgba(10,30,80,.55);padding:6px 12px;border-radius:8px}

/* ===== horse card ===== */
.hcard{display:flex;gap:10px;align-items:stretch}
.portrait{width:96px;flex:none;border-radius:12px;background:linear-gradient(180deg,#bfe6ff,#e8f7ff 60%,#9ad67e 60%,#7cc35f);
  display:grid;place-items:center;font-size:58px;border:2px solid var(--line);position:relative}
.portrait .cls{position:absolute;bottom:4px;left:4px;right:4px;font-size:10px;text-align:center;background:var(--navy);color:#fff;border-radius:6px;padding:1px 0}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hname{font-size:19px;color:var(--navy);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hname .age{font-size:11px;background:var(--sky);color:var(--blue);border-radius:999px;padding:1px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv dt{background:var(--sky);color:var(--sub);padding:2px 8px;border-bottom:1px solid var(--line)}
.kv dd{padding:2px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv dt:nth-last-child(2),.kv dd:last-child{border-bottom:none}

.cond{display:flex;gap:8px}
.cond>div{flex:1;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 8px;font-size:11px;color:var(--sub)}
.cond .face{font-size:20px;vertical-align:middle;margin-right:4px}
.cond .val{font-size:15px;color:var(--ink)}
.hp{height:12px;border-radius:999px;background:#e3e9f5;overflow:hidden;margin-top:4px;border:1px solid #c9d4ea}
.hp>i{display:block;height:100%;background:linear-gradient(90deg,#3cc46a,#9be35a);transition:width .5s}
.hp.low>i{background:linear-gradient(90deg,#e8433a,#ff9a1f)}

/* ===== stats ===== */
.stats{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:62px 28px 1fr 34px;align-items:center;gap:6px;font-size:13px}
.st .nm{color:var(--navy)}
.rank{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:17px;font-weight:900;color:#fff;-webkit-text-stroke:.5px rgba(0,0,0,.3);
  text-shadow:0 1px 0 rgba(0,0,0,.3)}
.rk-S{background:linear-gradient(180deg,#ffe36a,#ff9a1f)}.rk-A{background:linear-gradient(180deg,#ff8a8a,#e8433a)}
.rk-B{background:linear-gradient(180deg,#ff9ac4,#e0458a)}.rk-C{background:linear-gradient(180deg,#ffd76a,#e8a21a)}
.rk-D{background:linear-gradient(180deg,#9be35a,#3cc46a)}.rk-E{background:linear-gradient(180deg,#8ac8ff,#3a7be8)}
.rk-F{background:linear-gradient(180deg,#b9c2d6,#7a87a6)}.rk-G{background:linear-gradient(180deg,#c9c9c9,#8d8d8d)}
.bar{height:14px;border-radius:999px;background:#e3e9f5;overflow:hidden;border:1px solid #c9d4ea;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3cc46a,#ffd23a,#ff9a1f);transition:width .6s}
.bar>em{position:absolute;top:0;height:100%;background:rgba(255,80,80,.55);transition:all .6s}
.st .n{text-align:right;font-size:15px;color:var(--ink)}
.st .up{color:#e8433a;font-size:11px;margin-left:2px}

/* ===== goal banner ===== */
.goal{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#16337a,#2457c9);color:#fff;border-radius:12px;padding:8px 10px;font-size:13px;border:2px solid #fff;box-shadow:0 3px 0 #9fbbe6}
.goal .tag{background:var(--yellow);color:#5a2a00;border-radius:6px;padding:1px 6px;font-size:11px;flex:none}
.goal .wk{margin-left:auto;font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px;white-space:nowrap}
.goal .wk b{color:#ffe36a;font-size:15px}

/* ===== command buttons ===== */
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmd{background:linear-gradient(180deg,#3a7be8,#16337a);color:#fff;border:2px solid #fff;border-radius:12px;padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;box-shadow:0 4px 0 #0b1d4a}
.cmd i{font-style:normal;font-size:26px;line-height:1.1}
.cmd small{font-size:10px;opacity:.8}
.cmd.hot{background:linear-gradient(180deg,#ffe36a,#ffb21a);color:#5a2a00;box-shadow:0 4px 0 #b06a00}
.cmd.race{background:linear-gradient(180deg,#ff7a6a,#d02a2a);box-shadow:0 4px 0 #7a1010}

/* ===== scene / dialog ===== */
.scene{height:190px;border-radius:14px;position:relative;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 0 #9fbbe6;
  background:linear-gradient(180deg,#8fd0ff 0%,#d8f0ff 50%,#7cc35f 50%,#5cad48 100%)}
.scene .fence{position:absolute;left:0;right:0;top:46%;height:16px;background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 40px);border-top:3px solid #fff;border-bottom:3px solid #fff}
.scene .who{position:absolute;bottom:14px;font-size:72px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.scene .bubble{position:absolute;top:10px;right:10px;left:110px;background:#fff;border-radius:14px;padding:8px 12px;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.dialog{background:#fff;border:3px solid var(--navy);border-radius:14px;padding:22px 14px 14px;position:relative;font-size:15px;line-height:1.7;min-height:96px}
.dialog .spk{position:absolute;top:-12px;left:12px;background:var(--navy);color:#fff;font-size:12px;padding:2px 12px;border-radius:999px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:linear-gradient(180deg,#fff,#e9f2ff);border:2px solid var(--blue);color:var(--navy);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px;box-shadow:0 3px 0 #9fbbe6}
.choice small{display:block;font-size:11px;color:var(--sub);margin-top:2px}

/* ===== training ===== */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tcard{background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px;text-align:center;box-shadow:0 3px 0 #9fbbe6;position:relative}
.tcard.sel{border-color:var(--yellow);background:#fffbe6;box-shadow:0 3px 0 #e8a21a}
.tcard .tic{font-size:34px;height:56px;border-radius:8px;display:grid;place-items:center;margin-bottom:4px}
.tcard .tn{font-size:15px;color:var(--navy)}
.tcard .tlv{position:absolute;top:6px;left:6px;font-size:10px;background:var(--navy);color:#fff;border-radius:6px;padding:0 5px}
.tcard .gain{font-size:11px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 6px}
.tcard .gain b{color:#e8433a}
.tcard .fail{font-size:11px;margin-top:4px;padding:1px 0;border-radius:6px;background:#eef3fb;color:var(--sub)}
.tcard .fail.warn{background:#ffe3e0;color:#d02a2a}
.partner{position:absolute;top:6px;right:6px;font-size:16px}
.btnrow{display:flex;gap:8px}
.bbtn{flex:1;padding:12px;border-radius:12px;font-size:16px;color:#fff;background:linear-gradient(180deg,#3a7be8,#16337a);border:2px solid #fff;box-shadow:0 4px 0 #0b1d4a}
.bbtn.go{background:linear-gradient(180deg,#ffe36a,#ffb21a);color:#5a2a00;box-shadow:0 4px 0 #b06a00}
.bbtn.back{flex:none;width:90px;background:linear-gradient(180deg,#8a9bbd,#55627f);box-shadow:0 4px 0 #2a3350}

/* ===== race ===== */
.rhead{display:flex;align-items:center;gap:10px}
.grade{font-size:20px;font-weight:900;color:#fff;border-radius:8px;padding:2px 8px;background:linear-gradient(180deg,#ff6ab0,#c02a7a);flex:none}
.grade.g2{background:linear-gradient(180deg,#ff8a6a,#d04a2a)}.grade.g3{background:linear-gradient(180deg,#6ad0ff,#2a7ad0)}
.grade.op{background:linear-gradient(180deg,#9be35a,#3c9c3a)}
.rname{font-size:18px;color:var(--navy)}
.rmeta{font-size:12px;color:var(--sub)}
.odds{width:100%;border-collapse:collapse;font-size:13px}
.odds td{padding:5px 6px;border-bottom:1px solid var(--line)}
.odds tr.me{background:#fff7cc}
.gate{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;color:#fff;font-size:12px}
.odds .o{text-align:right;color:#d02a2a}
.odds .pop{font-size:10px;color:var(--sub)}
.tactics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tac{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 2px;font-size:13px;color:var(--navy)}
.tac small{display:block;font-size:10px;color:var(--sub)}
.tac.sel{border-color:#ff9a1f;background:#fff3dc}

.track{position:relative;height:260px;border-radius:14px;overflow:hidden;border:2px solid #fff;
  background:repeating-linear-gradient(90deg,var(--turf) 0 40px,var(--turf2) 40px 80px);box-shadow:0 3px 0 #9fbbe6}
.track .rail{position:absolute;left:0;right:0;height:4px;background:#fff}
.track .goalline{position:absolute;top:0;bottom:0;left:22px;width:6px;background:repeating-linear-gradient(180deg,#fff 0 8px,#d02a2a 8px 16px)}
.lane{position:absolute;left:0;right:0;height:28px}
.runner{position:absolute;right:0;font-size:26px;transition:right .12s linear;display:flex;align-items:center}
.runner .no{font-size:10px;color:#fff;border-radius:4px;padding:0 4px;margin-left:2px}
.runner.me .no{outline:2px solid var(--yellow)}
.rinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}
.commentary{background:#0b1d4a;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px;border:2px solid var(--yellow)}
.dist{height:8px;background:#e3e9f5;border-radius:999px;overflow:hidden}
.dist>i{display:block;height:100%;background:var(--blue2);width:0}

/* ===== result ===== */
.place-big{text-align:center;padding:14px 0 6px;background:radial-gradient(circle,#fff7b0 0%,#ffd23a 45%,transparent 70%)}
.place-big .p{font-size:64px;font-weight:900;color:#fff;-webkit-text-stroke:3px #b06a00;text-shadow:0 5px 0 #8a4a00;line-height:1}
.place-big .p small{font-size:28px}
.res{width:100%;border-collapse:collapse;font-size:13px}
.res th{background:var(--navy);color:#fff;font-size:11px;padding:4px}
.res td{padding:5px 6px;border-bottom:1px solid var(--line)}
.res tr.me{background:#fff7cc}
.res .pl{width:30px;text-align:center;font-size:15px;color:var(--navy)}
.prize{display:flex;justify-content:space-between;align-items:center;background:#fffbe6;border:2px solid var(--yellow);border-radius:10px;padding:8px 12px;font-size:14px}
.prize b{color:#d02a2a;font-size:18px}

/* ===== data ===== */
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rbox{border:2px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;background:#fff}
.rbox .h{background:var(--navy);color:#fff;font-size:11px;padding:2px 0}
.rbox .rank{margin:6px auto 0;width:34px;height:34px;font-size:22px}
.rbox .n{font-size:15px;padding:2px 0 4px}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{font-size:12px;border-radius:999px;padding:3px 10px;background:linear-gradient(180deg,#fff7b0,#ffd23a);color:#5a2a00;border:1px solid #e8a21a}
.skill.blue{background:linear-gradient(180deg,#d6e8ff,#9cc3ff);color:var(--navy);border-color:#6a9be8}
.skill.none{background:#eef3fb;color:#9aa6bf;border-color:var(--line)}
.history{font-size:12px;display:flex;flex-direction:column;gap:4px}
.history div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.chart{width:100%;height:160px}

/* ===== popup / toast ===== */
.modal{position:fixed;inset:0;background:rgba(5,15,45,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{width:min(400px,100%);background:#fff;border-radius:16px;border:3px solid var(--yellow);overflow:hidden;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.mbox .mh{background:linear-gradient(180deg,#ffe36a,#ffb21a);color:#5a2a00;text-align:center;padding:8px;font-size:18px}
.mbox .mb{padding:14px;text-align:center;font-size:14px;line-height:1.7}
.mbox .big{font-size:56px;margin:4px 0}
.gains{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0}
.gains span{background:var(--sky);border-radius:8px;padding:3px 8px;font-size:13px;color:var(--navy)}
.gains span b{color:#e8433a}
.gains span.minus b{color:var(--blue)}
.mbox .bbtn{margin:0 14px 14px;width:calc(100% - 28px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:60;border:2px solid var(--yellow);animation:pop .2s}
.footnote{font-size:12px;color:var(--sub);background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line)}
/* ===== game additions ===== */
.foals{display:flex;flex-direction:column;gap:10px}
.foal{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;text-align:left;box-shadow:0 3px 0 #9fbbe6;display:flex;gap:10px;align-items:center}
.foal.sel{border-color:var(--yellow);background:#fffbe6}
.foal .portrait{width:72px;height:72px;font-size:44px}
.foal .fi{flex:1;min-width:0;font-size:12px;color:var(--sub);line-height:1.6}
.foal .fi b{color:var(--navy);font-size:15px}
.mini{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
.mini span{font-size:10px;background:var(--sky);border-radius:5px;padding:0 5px;color:var(--navy)}
.nameinp{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--blue);color:var(--navy)}
.apt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.apt div{text-align:center;font-size:11px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.apt .rank{width:22px;height:22px;font-size:14px;margin:2px auto 0}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.item .ii{font-size:30px}
.item .in{flex:1;font-size:14px;color:var(--navy)}
.item .in small{display:block;font-size:11px;color:var(--sub)}
.item .ip{font-size:13px;color:#d02a2a;white-space:nowrap}
.spurt{width:100%;padding:16px;font-size:20px;border-radius:14px;color:#fff;background:linear-gradient(180deg,#ff7a6a,#d02a2a);border:3px solid #fff;box-shadow:0 5px 0 #7a1010}
.spurt.ready{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.04);filter:brightness(1.15)}}
.skillpop{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:linear-gradient(180deg,#fff7b0,#ffd23a);color:#5a2a00;padding:6px 14px;border-radius:999px;border:2px solid #b06a00;font-size:15px;z-index:3;animation:pop .2s;white-space:nowrap}
.calendar{display:flex;flex-direction:column;gap:4px;font-size:12px}
.calendar div{display:flex;gap:6px;align-items:center;border-bottom:1px dashed var(--line);padding:3px 0}
.calendar .grade{font-size:10px;padding:0 5px;border-radius:5px}
.calendar .gl{margin-left:auto;font-size:10px;background:#ffe3e0;color:#d02a2a;border-radius:6px;padding:0 6px;white-space:nowrap}
.calendar .done{opacity:.5}
.summer{background:linear-gradient(90deg,#ff9a1f,#ffd23a);color:#5a2a00;border-radius:10px;padding:5px 10px;font-size:12px;text-align:center}
.hof{font-size:12px;display:flex;flex-direction:column;gap:4px;width:min(320px,100%);margin-top:12px;background:rgba(255,255,255,.9);border-radius:10px;padding:8px 10px}
.hof div{display:flex;justify-content:space-between;gap:6px}
</style>
</head>
<body>
<div class="app" id="app"></div>
