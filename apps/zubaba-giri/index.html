<title>ズババ斬り！フィーバー</title>
<meta name="description" content="画面をなぞってフルーツをズババッと斬りまくれ！一筆で何個も斬るほどスコアが爆増、コインがジャラジャラ、フィーバーで画面が虹色に。コインで刀と強化を買って、ハイスコアをぶち上げよう。">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b0420;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#cv{touch-action:none}
#fx{pointer-events:none;z-index:30}
#safe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));text-align:center}
#title{pointer-events:none}
#title button{pointer-events:auto}
.logo{font-weight:900;line-height:.95;font-size:min(15vw,96px);white-space:nowrap;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff 0%,#fff6a8 35%,#ff9a3c 65%,#ff3d7f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #5a0b3d) drop-shadow(0 0 24px rgba(255,120,80,.55));animation:logo 1.6s ease-in-out infinite;transform-origin:50% 60%}
.logo small{display:block;font-size:.42em;letter-spacing:.12em;margin-top:.15em;background:linear-gradient(90deg,#ff4df0,#4dfcff,#ffe14d,#ff4df0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 2s linear infinite}
@keyframes logo{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(2deg) scale(1.05)}}
@keyframes rb{to{background-position:300% 0}}
.hint{margin-top:18px;font-weight:800;font-size:15px;opacity:.85;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.meta{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:24px;width:min(320px,100%)}
.btn{position:relative;font-weight:900;font-size:20px;padding:14px 20px;border-radius:18px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);transition:transform .08s}
.btn:active{transform:scale(.95)}
.btn.big{font-size:26px;padding:18px 20px;background:linear-gradient(180deg,#ffd84d,#ff7a2f 60%,#ff3d7f);border:0;box-shadow:0 6px 0 #8a1f3a,0 0 30px rgba(255,140,60,.55);text-shadow:0 2px 0 rgba(120,20,40,.6);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.badge{position:absolute;top:-8px;right:-6px;background:#ff2d55;color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;animation:pulse .8s infinite}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;font-size:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1)}

.dim{background:radial-gradient(ellipse at 50% 40%,rgba(30,10,60,.55),rgba(5,2,15,.88))}
.panel{width:min(400px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(60,25,110,.92),rgba(20,8,45,.95));border:2px solid rgba(255,255,255,.18);border-radius:26px;padding:22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

.rtitle{font-weight:900;letter-spacing:.3em;font-size:16px;opacity:.7}
.rscore{font-weight:900;font-size:min(15vw,62px);line-height:1.1;margin-top:6px;background:linear-gradient(180deg,#fff,#ffe14d);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.rankrow{height:110px;display:flex;align-items:center;justify-content:center}
.rank{font-weight:900;font-size:96px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
.rank.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(3.5) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.rk-C{color:#9aa}.rk-B{color:#5fd0ff}.rk-A{color:#7dff6a}.rk-S{color:#ffd84d}.rk-SS{color:#ff7a2f}
.rk-SSS{background:linear-gradient(90deg,#ff4df0,#4dfcff,#ffe14d,#ff4df0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both,rb 1.5s linear infinite}
.newrec{font-weight:900;font-size:24px;color:#ff4df0;text-shadow:0 0 16px #ff4df0;animation:pulse .6s infinite}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 6px}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:12px;opacity:.7;font-weight:800}
.rcoin{margin-top:12px;font-weight:900;font-size:26px;color:#ffd84d;min-height:36px}
.panel .btns{margin:16px auto 0}

.shophead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shophead h2{font-size:22px;font-weight:900}
.wallet{font-weight:900;font-size:20px;color:#ffd84d}
.wallet.bump{animation:wb .3s}
@keyframes wb{50%{transform:scale(1.3)}}
.sec{text-align:left;font-weight:900;font-size:14px;opacity:.7;margin:14px 0 8px}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left}
.row .ic{font-size:26px;width:34px;text-align:center}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:900;font-size:15px}
.row .ds{font-size:12px;opacity:.75;font-weight:800}
.lv{display:flex;gap:3px;margin-top:4px}
.lv i{width:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.lv i.on{background:#ffd84d}
.buy{flex:none;min-width:84px;font-weight:900;font-size:14px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.12)}
.buy.can{background:linear-gradient(180deg,#ffd84d,#ff8a2f);color:#3a1200;animation:pulse 1s infinite}
.buy.sel{background:#4dfcff;color:#002a33}
.buy:disabled{opacity:.45;animation:none}
.sw{width:34px;height:10px;border-radius:5px}

<canvas id="cv"></canvas>
<canvas id="fx"></canvas>
<div id="safe"></div>

<div id="title" class="ov">
  <div class="logo">ズババ斬り！<small>FEVER</small></div>
  <div class="hint">なぞって斬れ！ まとめて斬るほど爆増！</div>
  <div class="meta"><div class="chip">🏆 ベスト <span id="tBest">0</span></div><div class="chip">🪙 <span id="tCoin">0</span></div></div>
  <div class="btns">
    <button class="btn big" id="bStart">スタート！</button>
    <button class="btn" id="bShopT">ショップ<span class="badge" id="shopBadge" hidden>買える！</span></button>
  </div>
</div>
<button id="snd" aria-label="サウンド切り替え">🔊</button>

<div id="result" class="ov dim" hidden>
  <div class="panel" id="rPanel">
    <div class="rtitle">RESULT</div>
    <div class="rscore" id="rScore">0</div>
    <div class="rankrow"><div class="rank" id="rRank"></div></div>
    <div class="newrec" id="rNew" hidden>NEW RECORD!!</div>
    <div class="stats">
      <div class="stat"><b id="sSliced">0</b><span>斬った数</span></div>
      <div class="stat"><b id="sCombo">0</b><span>最大コンボ</span></div>
      <div class="stat"><b id="sStroke">0</b><span>最大連斬り</span></div>
      <div class="stat"><b id="sBest">0</b><span>ベスト</span></div>
    </div>
    <div class="rcoin" id="rCoin"></div>
    <div class="btns">
      <button class="btn big" id="bRetry">もう一回！</button>
      <button class="btn" id="bShopR">ショップ<span class="badge" id="shopBadge2" hidden>買える！</span></button>
      <button class="btn" id="bTitle">タイトルへ</button>
    </div>
  </div>
</div>

<div id="shop" class="ov dim" hidden>
  <div class="panel">
    <div class="shophead"><h2>ショップ</h2><div class="wallet" id="wallet">🪙 0</div></div>
    <div class="sec">強化</div>
    <div id="upList"></div>
    <div class="sec">刀の軌跡</div>
    <div id="bladeList"></div>
    <div class="btns"><button class="btn big" id="bShopPlay">これで遊ぶ！</button><button class="btn" id="bShopBack">もどる</button></div>
  </div>
</div>
