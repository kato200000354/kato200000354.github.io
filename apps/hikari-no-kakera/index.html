<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1626">
<title>光のかけらと勇者</title>
<style>
[hidden]{display:none!important}
:root{
  --panel:rgba(13,30,56,.94);--panel2:rgba(20,44,78,.92);--line:rgba(140,190,240,.55);--line2:#9fd0ff;
  --gold:#f0cf73;--txt:#eaf3ff;--sub:#a9c3e0;--accent:#3a8fe0;
  --hud:clamp(10px,2.4vmin,16px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1626;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b1626}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-size:var(--hud)}
#status{position:absolute;left:calc(env(safe-area-inset-left) + 1.2vmin);top:1.2vmin;display:flex;align-items:center;gap:.5em}
#portrait{width:5.4em;height:5.4em;border-radius:50%;border:.22em solid var(--gold);background:radial-gradient(circle at 40% 35%,#3e6fa8,#13284a);box-shadow:0 .2em .6em rgba(0,0,0,.5)}
.stbox{background:linear-gradient(180deg,rgba(18,40,72,.85),rgba(10,24,46,.85));border:1px solid var(--line);border-radius:0 2em 2em 0;padding:.35em 1.1em .35em .9em;margin-left:-1.4em;padding-left:1.6em}
#hearts{display:block;height:1.7em}
.lvrow{display:flex;align-items:center;gap:.6em;margin-top:.15em;font-weight:700}
.lvrow .lv{font-size:1.15em;text-shadow:0 1px 2px #000}
.expbar{width:8em;height:.55em;border-radius:1em;background:#0a1830;border:1px solid var(--line);overflow:hidden}
.expbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3cc6ff,#8fe9ff);transition:width .3s}
.coins{font-size:.95em;color:var(--gold);margin-left:.2em}
#quest{position:absolute;left:calc(env(safe-area-inset-left) + 1.2vmin);top:calc(1.2vmin + 6.4em);display:flex;gap:.6em;align-items:center;
  background:linear-gradient(90deg,rgba(10,24,46,.85),rgba(10,24,46,0));padding:.45em 2.2em .45em .5em;border-radius:.6em;border-left:2px solid var(--gold)}
.qmark{width:1.9em;height:1.9em;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:1.05em;flex:none}
#qtitle{font-weight:700;font-size:1.05em;text-shadow:0 1px 2px #000}
#qdesc{font-size:.9em;color:#dfeaf8;text-shadow:0 1px 2px #000}
#topright{position:absolute;right:calc(env(safe-area-inset-right) + 1.2vmin);top:1.2vmin;display:flex;align-items:flex-start;gap:.6em}
#clock{display:flex;align-items:center;gap:.4em;background:rgba(10,24,46,.85);border:1px solid var(--line);border-radius:2em;padding:.25em .9em .25em .5em;font-weight:700;font-size:1.1em;margin-top:.2em}
#clockIcon{font-size:1.1em}
#mmWrap{position:relative;width:9em;height:9em}
#minimap{width:100%;height:100%;border-radius:50%;border:.2em solid #c9d9ea;box-shadow:0 0 0 .15em #13284a,0 .2em .6em rgba(0,0,0,.5);background:#13284a}
.cmp{position:absolute;font-weight:900;font-size:.8em;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.cmp.n{top:-.2em;left:50%;transform:translateX(-50%)}.cmp.s{bottom:-.2em;left:50%;transform:translateX(-50%)}
.cmp.w{left:-.1em;top:50%;transform:translateY(-50%)}.cmp.e{right:-.1em;top:50%;transform:translateY(-50%)}
#menuBtn{pointer-events:auto;width:2.8em;height:2.8em;border-radius:.6em;border:1px solid var(--line2);background:rgba(10,24,46,.85);display:grid;place-items:center;cursor:pointer;padding:0}
#menuBtn span{display:block;width:1.4em;height:.18em;background:#fff;border-radius:1em;box-shadow:0 .42em 0 #fff,0 -.42em 0 #fff}

#joy{position:absolute;width:24vmin;height:24vmin;max-width:150px;max-height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.18));border:2px solid rgba(255,255,255,.55);box-shadow:0 0 12px rgba(0,0,0,.3);
  left:calc(env(safe-area-inset-left) + 5vmin);bottom:calc(env(safe-area-inset-bottom) + 6vmin);transform:translate(0,0);opacity:.85}
#joy::before,#joy::after{content:"";position:absolute;inset:8%;border-radius:50%}
#joy .ar{position:absolute;color:rgba(255,255,255,.75);font-size:.9em}
#joyKnob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e8eef5,#9aa8b8);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#btns{position:absolute;right:calc(env(safe-area-inset-right) + 2vmin);bottom:calc(env(safe-area-inset-bottom) + 3vmin);width:46vmin;height:44vmin;max-width:300px;max-height:290px}
.cbtn{pointer-events:auto;position:absolute;border-radius:50%;border:.18em solid rgba(255,255,255,.85);background:radial-gradient(circle at 45% 35%,rgba(60,80,100,.75),rgba(15,25,40,.8));
  display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 .2em .6em rgba(0,0,0,.45)}
.cbtn svg{width:58%;height:58%}
.cbtn.on{background:radial-gradient(circle at 45% 35%,rgba(120,170,220,.9),rgba(30,60,100,.9))}
.cbtn .cnt{position:absolute;right:-.1em;bottom:-.2em;font-weight:900;font-size:1.05em;text-shadow:0 0 3px #000,0 0 3px #000}
#bSword{width:36%;height:37%;right:0;bottom:12%}
#bRoll{width:25%;height:26%;right:39%;bottom:4%}
#bBow{width:25%;height:26%;right:30%;bottom:46%}
#bPot{width:20%;height:21%;right:2%;bottom:56%}
#bAct{width:20%;height:21%;right:63%;bottom:26%;font-size:.85em;font-weight:900}
#bAct.ready{border-color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 1.2em rgba(240,207,115,.9)}}
#actLabel{position:absolute;right:58%;bottom:48%;width:30%;text-align:center;font-weight:900;font-size:.9em;color:var(--gold);text-shadow:0 0 3px #000,0 0 3px #000}
.nokbd .kbd{display:none}

#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(8,20,40,.88);border:1px solid var(--line);padding:.6em 1.4em;border-radius:.6em;font-weight:700;font-size:1.1em;white-space:nowrap;transition:opacity .3s}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:2.4em;color:#fff;letter-spacing:.1em;
  text-shadow:0 0 .4em rgba(120,200,255,.9),0 .1em .2em #000;transition:opacity .5s}
#banner small{display:block;font-size:.45em;letter-spacing:.2em;color:var(--gold)}

/* ---------- Dialog ---------- */
#dialog{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 3vmin);transform:translateX(-50%);width:min(92vw,760px);min-height:7.5em;
  background:var(--panel);border:2px solid var(--line2);border-radius:1em;padding:1em 1.4em 1.2em;font-size:clamp(14px,3vmin,19px);line-height:1.6;box-shadow:0 .4em 1.4em rgba(0,0,0,.6);pointer-events:auto}
#dName{position:absolute;top:-1.1em;left:1.2em;background:linear-gradient(180deg,#2c63a8,#18396a);border:1px solid var(--line2);padding:.15em 1em;border-radius:.5em;font-weight:700;font-size:.9em}
#dText{white-space:pre-wrap;min-height:3.2em}
#dNext{position:absolute;right:1em;bottom:.4em;color:var(--gold);animation:bob .8s infinite}
@keyframes bob{50%{transform:translateY(.25em)}}
#dChoices{display:flex;gap:.6em;flex-wrap:wrap;margin-top:.5em}

/* ---------- Get item ---------- */
#getItem{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,240,180,.25),rgba(0,0,0,.55));pointer-events:auto}
.gi{background:var(--panel);border:2px solid var(--gold);border-radius:1em;padding:1.2em 2em;text-align:center;min-width:min(80vw,360px);font-size:clamp(14px,3vmin,19px);box-shadow:0 0 2em rgba(240,207,115,.5)}
.gi .ic{font-size:3.4em;line-height:1.2;filter:drop-shadow(0 0 .3em rgba(255,240,180,.9));animation:rise .6s ease-out}
@keyframes rise{from{transform:translateY(.6em) scale(.6);opacity:0}}
.gi h3{margin:.3em 0;color:var(--gold)}
.gi p{margin:.2em 0 0;color:var(--sub);font-size:.9em}

/* ---------- Menu panel ---------- */
#menu{position:fixed;inset:0;background:rgba(3,10,22,.55);display:grid;place-items:center;pointer-events:auto;font-size:clamp(12px,2.6vmin,16px)}
#panel{width:min(94vw,820px);height:min(90vh,520px);background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line2);border-radius:1em;
  box-shadow:0 0 0 1px #0a1a30,0 .6em 2em rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;gap:.3em;padding:.5em .6em 0;border-bottom:1px solid var(--line)}
.tab{flex:1;border:1px solid transparent;border-bottom:none;background:none;padding:.55em .3em;border-radius:.6em .6em 0 0;cursor:pointer;font-weight:700;color:var(--sub);white-space:nowrap}
.tab.on{background:rgba(80,140,210,.25);border-color:var(--line);color:#fff}
#closeMenu{flex:none;width:2.4em;background:none;border:none;font-size:1.4em;cursor:pointer;color:#cfe0f2}
#pbody{flex:1;overflow:auto;padding:.9em 1em;touch-action:pan-y}
.row{display:flex;gap:1em;height:100%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.55em;align-content:start}
.slot{aspect-ratio:1;border:1px solid var(--line);border-radius:.6em;background:rgba(5,15,32,.6);position:relative;display:grid;place-items:center;font-size:2em;cursor:pointer;padding:0}
.slot.sel{border:2px solid var(--line2);box-shadow:0 0 .6em rgba(120,190,255,.7);background:rgba(40,90,150,.45)}
.slot .n{position:absolute;right:.25em;bottom:.05em;font-size:.45em;font-weight:900;text-shadow:0 0 3px #000}
.slot.empty{cursor:default;opacity:.4}
.desc{border:1px solid var(--line);border-radius:.7em;padding:.7em .9em;background:rgba(5,15,32,.5);display:flex;gap:.8em;align-items:center;margin-top:.7em}
.desc .big{font-size:2.4em}
.desc b{display:block;margin-bottom:.15em}
.desc span{color:var(--sub);font-size:.9em}
.btn{border:2px solid var(--line2);background:linear-gradient(180deg,#2a65ad,#173c70);border-radius:2em;padding:.5em 1.4em;font-weight:700;cursor:pointer;min-width:6em}
.btn.ghost{background:rgba(10,24,46,.6);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;gap:.8em;justify-content:center;margin-top:.8em;flex-wrap:wrap}
.side{width:38%;min-width:10em;display:flex;flex-direction:column}
.kv{display:flex;justify-content:space-between;padding:.3em 0;border-bottom:1px dashed rgba(140,190,240,.25)}
.legend{list-style:none;margin:0;padding:.4em .6em;border:1px solid var(--line);border-radius:.6em;background:rgba(5,15,32,.5)}
.legend li{display:flex;align-items:center;gap:.5em;padding:.32em 0;font-size:.95em}
.legend i{display:inline-block;width:.9em;height:.9em;border-radius:50%;flex:none}
#bigmap{width:100%;height:100%;border-radius:.7em;border:1px solid var(--line);background:#0b2240;display:block;min-height:0}
.equip{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:.6em;align-items:center}
.ecol{display:flex;flex-direction:column;gap:.6em;align-items:center}
.eslot{width:2.4em;height:2.4em;border:1px solid var(--line);border-radius:.35em;background:rgba(5,15,32,.6);display:grid;place-items:center;font-size:1.8em;cursor:pointer;position:relative;padding:0;margin-bottom:.45em}
.eslot small{position:absolute;bottom:-1.25em;font-size:.36em;white-space:nowrap;color:var(--sub)}
.eslot.sel{border:2px solid var(--line2);box-shadow:0 0 .6em rgba(120,190,255,.7)}
#eqHero{width:100%;max-width:170px;aspect-ratio:3/4;display:block;margin:auto}
.equipWrap{display:flex;gap:1em;align-items:flex-start}.equipWrap>.equip{flex:1.1;min-width:0}.equipWrap>.side{flex:1;width:auto}
.elist{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.6em}
.elist button{border:1px solid var(--line);background:rgba(5,15,32,.6);border-radius:.6em;padding:.4em .7em;cursor:pointer}
.elist button.on{border-color:var(--gold);color:var(--gold)}
.pmenu{display:flex;flex-direction:column;gap:.8em;align-items:center;justify-content:center;height:100%}
.pmenu .btn{width:min(80%,320px);padding:.75em 1em;font-size:1.05em;display:flex;align-items:center;justify-content:center;gap:.6em}
.shop .it{display:flex;align-items:center;gap:.8em;padding:.5em .6em;border:1px solid var(--line);border-radius:.6em;background:rgba(5,15,32,.5);margin-bottom:.5em}
.shop .it .ic{font-size:1.8em}
.shop .it .nm{flex:1}
.shop .it .nm small{display:block;color:var(--sub)}

/* ---------- Title / end ---------- */
#title,#endScr,#deadScr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;pointer-events:auto;text-align:center;padding:1em}
#title{background:radial-gradient(ellipse at center,rgba(5,15,35,.15),rgba(5,15,35,.75))}
.logo{font-size:clamp(30px,8vmin,64px);font-weight:900;letter-spacing:.08em;color:#fff;
  text-shadow:0 0 .3em rgba(120,210,255,.9),0 .06em 0 #2a5d9a,0 .12em .2em rgba(0,0,0,.8);line-height:1.25}
.logo small{display:block;font-size:.36em;letter-spacing:.35em;color:var(--gold);text-shadow:0 .1em .2em #000}
.tbtns{display:flex;flex-direction:column;gap:.8em;font-size:clamp(14px,3vmin,19px);width:min(70vw,300px)}
.tbtns .btn{padding:.8em}
.hint{font-size:clamp(11px,2.2vmin,14px);color:#cfe0f2;text-shadow:0 1px 2px #000;line-height:1.7}
#endScr{background:rgba(2,8,20,.82)}
#deadScr{background:rgba(40,0,0,.6)}
#rotate{position:fixed;left:50%;bottom:1em;transform:translateX(-50%);font-size:12px;color:#cfe0f2;background:rgba(0,0,0,.5);padding:.4em .8em;border-radius:1em;pointer-events:none}
@media (orientation:landscape){#rotate{display:none}}
@media (orientation:portrait){
  #btns{width:56vmin;height:54vmin}
  #joy{width:30vmin;height:30vmin}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="status">
    <canvas id="portrait" width="120" height="120"></canvas>
    <div class="stbox">
      <canvas id="hearts" width="400" height="44"></canvas>
      <div class="lvrow"><span class="lv" id="lvText">Lv.1</span><span>EXP</span><div class="expbar"><i id="expFill"></i></div><span class="coins" id="coinText">🪙0</span></div>
    </div>
  </div>
  <div id="quest"><span class="qmark">!</span><div><div id="qtitle"></div><div id="qdesc"></div></div></div>
  <div id="topright">
    <div id="clock"><span id="clockIcon">☀️</span><span id="clockText">12:30</span></div>
    <div id="mmWrap"><canvas id="minimap" width="200" height="200"></canvas><span class="cmp n">N</span><span class="cmp s">S</span><span class="cmp w">W</span><span class="cmp e">E</span></div>
    <button id="menuBtn" aria-label="メニュー"><span></span></button>
  </div>
  <div id="touchUI">
    <div id="joy"><span class="ar" style="top:4%;left:50%;transform:translateX(-50%)">▲</span><span class="ar" style="bottom:4%;left:50%;transform:translateX(-50%)">▼</span><span class="ar" style="left:5%;top:50%;transform:translateY(-50%)">◀</span><span class="ar" style="right:5%;top:50%;transform:translateY(-50%)">▶</span><div id="joyKnob"></div></div>
    <div id="btns">
      <button class="cbtn" id="bSword" aria-label="剣"><svg viewBox="0 0 64 64"><path d="M50 6 58 6 58 14 26 46 18 38Z" fill="#e9eef5" stroke="#fff" stroke-width="2"/><path d="M12 36l16 16-4 4-5-5-7 7-4-4 7-7-5-5z" fill="#e9eef5" stroke="#fff" stroke-width="2"/></svg></button>
      <button class="cbtn" id="bRoll" aria-label="回避"><svg viewBox="0 0 64 64"><circle cx="38" cy="12" r="6" fill="#fff"/><path d="M34 20 22 28l-6-4-4 4 10 8 8-4-4 12-12 8 4 5 14-9 4-7 8 10v12h6V48l-8-12 3-9 7 6 8-3-2-5-6 2-11-9z" fill="#fff"/><path d="M4 30h10M2 38h10M6 46h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button>
      <button class="cbtn" id="bBow" aria-label="弓"><svg viewBox="0 0 64 64"><path d="M14 8c22 4 38 20 42 42" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M14 8 56 50" stroke="#e9eef5" stroke-width="1.5"/><path d="M8 56 46 18" stroke="#fff" stroke-width="3"/><path d="M50 14l-10 2 8 8z" fill="#fff"/><path d="M8 56l3-8M8 56l8-3" stroke="#fff" stroke-width="3"/></svg><span class="cnt" id="arrowCnt">0</span></button>
      <button class="cbtn" id="bPot" aria-label="回復"><svg viewBox="0 0 64 64"><path d="M26 6h12v6h-2v8c10 3 16 12 16 22 0 12-9 18-20 18S12 54 12 42c0-10 6-19 16-22v-8h-2z" fill="#bfe6ff" stroke="#fff" stroke-width="2"/><path d="M15 42c6-4 13 3 34-2 0 10-7 16-17 16S15 52 15 42z" fill="#36a0ff"/></svg><span class="cnt" id="potCnt">0</span></button>
      <button class="cbtn" id="bAct" aria-label="アクション"><svg viewBox="0 0 64 64"><path d="M32 10 52 34H40v20H24V34H12z" fill="#fff"/></svg></button>
      <div id="actLabel"></div>
    </div>
  </div>
  <div id="toast" hidden></div>
  <div id="banner" hidden></div>
</div>

<div id="dialog" hidden><div id="dName"></div><div id="dText"></div><div id="dChoices"></div><div id="dNext">▼</div></div>
<div id="getItem" hidden><div class="gi"><div class="ic" id="giIcon"></div><h3 id="giName"></h3><p id="giDesc"></p></div></div>

<div id="menu" hidden>
  <div id="panel">
    <div id="tabs">
      <button class="tab" data-t="item">🎒 アイテム</button>
      <button class="tab" data-t="map">🗺️ マップ</button>
      <button class="tab" data-t="equip">⚔️ 装備</button>
      <button class="tab" data-t="pause">⚙️ ポーズ</button>
      <button id="closeMenu" aria-label="閉じる">✕</button>
    </div>
    <div id="pbody"></div>
  </div>
</div>

<div id="title">
  <div class="logo"><small>THE LEGEND OF</small>光のかけらと勇者<small>〜 厄災の城 〜</small></div>
  <div class="tbtns">
    <button class="btn" id="tNew">はじめから</button>
    <button class="btn ghost" id="tCont" hidden>つづきから</button>
  </div>
  <div class="hint" id="kbdHint">移動：WASD / 矢印　剣：J / スペース（長押しで回転斬り）<br>回避：K / Shift　弓：L　回復：H　調べる：E / Enter　メニュー：Esc / I / M</div>
  <div class="hint" id="touchHint">左側をドラッグで移動・右のボタンで攻撃<br>剣ボタンを長押しして離すと回転斬り！</div>
</div>
<div id="deadScr" hidden>
  <div class="logo" style="color:#ffd0d0">力尽きた…</div>
  <div class="tbtns"><button class="btn" id="dRetry">最後の祠からやりなおす</button><button class="btn ghost" id="dTitle">タイトルへ</button></div>
</div>
<div id="endScr" hidden>
  <div class="logo"><small>THE END</small>厄災は封じられた</div>
  <div class="hint" id="endText"></div>
  <div class="tbtns"><button class="btn" id="eCont">冒険をつづける</button><button class="btn ghost" id="eTitle">タイトルへ</button></div>
</div>
<div id="rotate">📱 横向きがおすすめです</div>
