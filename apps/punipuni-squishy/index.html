<style>
[hidden]{display:none!important}
:root{--ink:#5b3a44;--pink:#f08aa8;--pink2:#ffd2df;--cream:#fffaf5;--gold:#ffd66b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 85% at 50% 32%,#fffaf5 0%,#fde6ec 55%,#f5cdda 100%);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;color:var(--ink);cursor:pointer}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.btn{border:3px solid var(--ink);border-radius:16px;background:#fff;font-weight:900;font-size:15px;padding:9px 8px;box-shadow:0 4px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{background:var(--pink);color:#fff;font-size:19px;padding:12px 8px;text-shadow:0 2px 0 #c45c7c}
.btn.x{background:#111;color:#fff;font-size:14px}
.btn:disabled{opacity:.5}

header{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
header>*{pointer-events:auto}
.pill{background:#fffc;border:2.5px solid var(--ink);border-radius:999px;padding:3px 11px;font-weight:900;font-size:15px}
.tg{display:flex;gap:6px}
.tg button,.back{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;background:#fffc;font-size:16px;padding:0}
.tg button.off{opacity:.45;filter:grayscale(1)}

/* タイトル */
.scr{position:fixed;inset:0;z-index:10;pointer-events:none}
.scr .card,.scr button,.scr a,.scr .chips{pointer-events:auto}
#logo{position:absolute;top:calc(env(safe-area-inset-top) + 56px);left:0;right:0;text-align:center;font-weight:900;font-size:40px;line-height:1.02;letter-spacing:.02em;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
#logo small{display:block;font-size:13px;-webkit-text-stroke:0;text-shadow:none;color:var(--ink);margin-top:8px;letter-spacing:.08em}
.card{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:420px;background:#fffffff0;border:3px solid var(--ink);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--ink)}
#title .card{bottom:calc(env(safe-area-inset-bottom) + 14px)}
.selrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-weight:900;font-size:15px;gap:6px}
.selrow small{font-size:11.5px;font-weight:800;opacity:.75}
.rar{display:inline-block;font-size:11px;font-weight:900;border-radius:6px;padding:1px 6px;color:#fff;vertical-align:2px;margin-left:3px}
.rar.N{background:#a99aa0}.rar.R{background:#4d9de0}.rar.SR{background:#b45ee0}.rar.S{background:linear-gradient(90deg,#f5a623,#f06292,#7c4dff)}
#btnPlay{width:100%}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}
.row3 .btn{font-size:13.5px;padding:8px 2px}
.best{text-align:center;font-size:12px;margin-top:8px;font-weight:800;opacity:.8}

/* さわるだけ */
#free .back{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:12px;z-index:21;pointer-events:auto}
#free .fhint{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 72px);text-align:center;font-size:12.5px;font-weight:800;line-height:1.55;opacity:.8}
.chips{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:6px;overflow-x:auto;padding:4px 12px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2.5px solid var(--ink);border-radius:999px;background:#fffd;padding:7px 11px;font-weight:800;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--pink);color:#fff}

/* プレイ中 */
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 56px);left:14px;right:14px;z-index:11;pointer-events:none;text-align:center}
#tbar{height:12px;border:2.5px solid var(--ink);border-radius:99px;background:#fff9;overflow:hidden}
#tfill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff9eb8,#ffcf6b)}
#score{font-weight:900;font-size:44px;line-height:1.1;margin-top:4px;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
#combo{font-weight:900;font-size:16px;height:22px}
#gauge{position:fixed;right:12px;top:34%;height:34%;width:20px;z-index:11;border:2.5px solid var(--ink);border-radius:99px;overflow:hidden;pointer-events:none;
 background:linear-gradient(to top,#e4d7dc 0%,#e4d7dc 40%,#ffe08a 40%,#ffe08a 62%,#8fe0a0 62%,#8fe0a0 88%,#ffe08a 88%,#ffe08a 96%,#ff8a8a 96%)}
#gfill{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ink);transform:translateY(0)}
#glabel{position:fixed;right:4px;top:calc(34% - 22px);font-size:10.5px;font-weight:900;z-index:11;width:36px;text-align:center;pointer-events:none}
#cd{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:64px;color:#fff;-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;pointer-events:none}
#cd.go{animation:cdpop .7s ease-out}
@keyframes cdpop{0%{transform:scale(1.8);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
#fx{position:fixed;inset:0;z-index:13;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-120%);font-weight:900;font-size:22px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:popup .8s ease-out forwards}
.pop.p{color:#7ff0a0;font-size:26px}.pop.g{color:#ffe07a}.pop.b{color:#ffb0b0;font-size:18px}
@keyframes popup{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}20%{opacity:1;transform:translate(-50%,-130%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}

/* 結果 */
#result{pointer-events:auto;overflow-y:auto;background:#fff3f6a8;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#result .card{position:relative;left:auto;transform:none;margin:calc(env(safe-area-inset-top) + 64px) auto 24px;width:calc(100% - 28px)}
.rk{text-align:center;font-size:12px;font-weight:800;opacity:.75}
#rRank{text-align:center;font-weight:900;font-size:25px;line-height:1.2}
#rScore{text-align:center;font-weight:900;font-size:48px;line-height:1.1;margin:2px 0 6px}
#rScore small{font-size:16px}
#rLines{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px;font-weight:800;background:#fff2f5;border-radius:12px;padding:8px 10px}
#rLines b{text-align:right}
#rNew{text-align:center;color:#e0457a;font-weight:900;font-size:15px;margin-top:6px}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rbtns .big{grid-column:1/-1}.rbtns .x{grid-column:1/-1}
/* ほかのゲーム */
.toMore{display:block;text-align:center;font-size:13px;font-weight:900;color:#c0306e;text-decoration:none;padding:7px 4px 0}
.more{margin-top:14px;text-align:left;border-top:3px dashed #e5b3c3;padding-top:10px}
.more h3{font-size:14px;font-weight:900;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.more h3 a{font-size:12px;color:#c0306e;text-decoration:none;white-space:nowrap}
.mrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.mrow::-webkit-scrollbar{display:none}
.mcard{flex:none;width:100px;text-decoration:none;color:var(--ink)}
.mcard .im{width:100px;height:134px;border-radius:12px;overflow:hidden;background:#f3e3e8;position:relative;border:2.5px solid var(--ink)}
.mcard img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .hot{position:absolute;left:4px;top:4px;background:#ff3d7a;color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:1px 5px}
.mrow.wide .mcard{width:168px}.mrow.wide .mcard .im{width:168px;height:80px}
.mcard b{display:block;font-size:12px;margin-top:4px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mcard i{display:block;font-style:normal;font-size:11px;color:#7d6880;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow{display:block;margin:0 0 12px;padding:12px;border-radius:14px;background:#1d9bf0;color:#fff;text-decoration:none;text-align:center;box-shadow:0 4px 0 #0d6aa8}
.follow b{display:block;font-size:16px;font-weight:800}.follow small{font-size:12px;opacity:.9}

/* ガチャ・ずかん */
.panel{position:fixed;inset:0;z-index:30;background:#5b3a4466;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:420px;max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);overflow:hidden}
.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:3px solid var(--ink);background:var(--pink2)}
.sheetHead h2{margin:0;font-size:18px;font-weight:900}
.sheetBody{padding:12px;overflow-y:auto}
.sheetFoot{padding:10px 12px;border-top:3px solid var(--ink);display:flex;gap:8px}
.sheetFoot .btn{flex:1}
#zGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.zc{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:7px 3px 6px;text-align:center;min-width:0}
.zc .e{font-size:30px;line-height:1.1}
.zc b{display:block;font-size:11px;font-weight:900;line-height:1.25;margin-top:3px;min-height:28px}
.zc.lock{background:#eee3e6;color:#9a8790}
.zc.on{background:#ffe6ee;box-shadow:0 0 0 3px var(--pink)}
.zc .cnt{font-size:10px;font-weight:800;opacity:.7}
.rates{font-size:11px;font-weight:800;opacity:.7;text-align:center;margin-top:9px;line-height:1.5}
.gbox{text-align:center}
#capsule{width:150px;height:150px;margin:0 auto;border-radius:50%;border:4px solid var(--ink);background:linear-gradient(#ff9eb8 0 50%,#fff 50%);box-shadow:inset 0 -4px 0 #0001,0 6px 0 var(--ink);position:relative}
#capsule::after{content:"";position:absolute;left:-4px;right:-4px;top:calc(50% - 4px);height:8px;background:var(--ink)}
#capsule.shake{animation:shake .25s ease-in-out infinite}
#capsule.open{animation:capopen .45s ease-in forwards}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes capopen{to{transform:scale(1.6);opacity:0}}
#gmsg{color:#fff;font-weight:900;font-size:16px;margin-top:18px;text-shadow:0 2px 0 var(--ink)}
#reveal .card{bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center}
#rvTag{font-weight:900;font-size:15px;color:#e0457a}
#rvName{font-weight:900;font-size:24px;margin:2px 0 4px}
#rvSub{font-size:12px;font-weight:800;opacity:.75;margin-bottom:8px}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 14px;border-radius:12px;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
@media (min-aspect-ratio:1/1){
 #logo{right:auto;left:0;width:calc(100% - 380px);top:calc(env(safe-area-inset-top) + 40px)}
 #title .card,#reveal .card{left:auto;right:18px;transform:none;width:350px;top:50%;bottom:auto;margin-top:-110px}
}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;pointer-events:none}
</style>

<canvas id="c"></canvas>
<div id="load">よみこみ中…</div>

<header>
  <div class="pill" id="coinPill">🪙 0</div>
  <div class="tg"><button id="bSnd" aria-label="音">🔊</button><button id="bVib" aria-label="振動">📳</button></div>
</header>

<div id="title" class="scr">
  <div id="logo">ぷにぷに<br>スクイーズ<small>さわってもいいよ</small></div>
  <div class="card">
    <div class="selrow"><span id="selName"></span><small id="selMul"></small></div>
    <button class="btn big" id="btnPlay">もみもみチャレンジ（30秒）</button>
    <div class="row3">
      <button class="btn" id="btnFree">さわるだけ</button>
      <button class="btn" id="btnGacha">ガチャ</button>
      <button class="btn" id="btnZukan">ずかん</button>
    </div>
    <div class="best" id="bestTxt"></div>
    <a class="toMore" href="https://kato200000354.github.io/">🎮 ほかのゲームも見る →</a>
  </div>
</div>

<div id="free" class="scr" hidden>
  <button class="back" id="freeBack" aria-label="もどる">◀</button>
  <div class="fhint">ゆびで押す・押したまま引っぱる<br>2本指でつまむ ／ まわりをドラッグで回転</div>
  <div class="chips" id="freeChips"></div>
</div>

<div id="hud" hidden>
  <div id="tbar"><i id="tfill"></i></div>
  <div id="score">0</div>
  <div id="combo"></div>
</div>
<div id="gauge" hidden><i id="gfill"></i></div>
<div id="glabel" hidden>つよさ</div>
<div id="cd" hidden></div>
<div id="fx"></div>

<div id="result" class="scr" hidden>
  <div class="card">
    <div class="rk">称号</div>
    <div id="rRank"></div>
    <div id="rScore"></div>
    <div id="rLines"></div>
    <div id="rNew" hidden>ベスト更新！</div>
    <div class="rbtns">
      <button class="btn big" id="rAgain">もう一回</button>
      <button class="btn" id="rGacha">ガチャ</button>
      <button class="btn" id="rTitle">タイトル</button>
      <button class="btn x" id="rShare">結果をXでポスト</button>
    </div>
    <div class="more" hidden><h3><span>🎮 ほかのゲームも遊んでみて</span><a href="https://kato200000354.github.io/">すべて見る →</a></h3><div class="mrow"></div></div>
  </div>
</div>

<div id="gacha" class="panel" hidden>
  <div class="gbox"><div id="capsule"></div><div id="gmsg">ガチャガチャ…</div></div>
</div>

<div id="reveal" class="scr" hidden>
  <div class="card">
    <div id="rvTag"></div>
    <div id="rvName"></div>
    <div id="rvSub"></div>
    <div class="row3">
      <button class="btn" id="rvTouch">さわる</button>
      <button class="btn" id="rvMore">もう1回</button>
      <button class="btn" id="rvBack">もどる</button>
    </div>
  </div>
</div>

<div id="zukan" class="panel" hidden>
  <div class="sheet">
    <div class="sheetHead"><h2>ずかん</h2><div class="pill" id="zCount"></div></div>
    <div class="sheetBody"><div id="zGrid"></div>
      <div class="rates">タップでえらぶ（チャレンジに使える）<br>レアほどスコアが高い：N×1 / R×1.2 / SR×1.5 / シークレット×2<br>出る確率：N 70% / R 24% / SR 5% / シークレット 1%</div>
      <div class="more" hidden><h3><span>🎮 ほかのゲームも遊んでみて</span><a href="https://kato200000354.github.io/">すべて見る →</a></h3><div class="mrow"></div></div></div>
    <div class="sheetFoot"><button class="btn" id="zClose">もどる</button></div>
  </div>
</div>
<div id="toast" hidden></div>
