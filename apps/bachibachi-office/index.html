<meta property="og:title" content="バチッと！静電気オフィス">

<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2440;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.chip{background:rgba(15,22,45,.72);border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px;line-height:1.2;white-space:nowrap}
.chip small{display:block;font-size:10px;opacity:.7;font-weight:600}
#combo{text-align:center;color:#ffe45c;font-size:18px;text-shadow:0 2px 0 #000;font-weight:900;opacity:0;transition:opacity .2s}
#meter{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 70px);width:58px;pointer-events:none;text-align:center}
#bar{height:170px;width:22px;margin:0 auto;border-radius:12px;background:rgba(15,22,45,.75);border:2px solid rgba(255,255,255,.5);position:relative;overflow:hidden}
#fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#fff36b,#56c8ff);border-radius:10px}
#volt{margin-top:4px;font-weight:900;font-size:13px;text-shadow:0 1px 2px #000}
#voltLbl{font-size:10px;opacity:.85;text-shadow:0 1px 2px #000}
#warn{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:26px;font-weight:900;color:#ff4b4b;text-shadow:0 0 10px #fff,0 3px 0 #000;pointer-events:none;animation:blink .25s infinite alternate}
@keyframes blink{from{opacity:1;transform:scale(1)}to{opacity:.4;transform:scale(1.08)}}
#vign{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(90,200,255,.9);opacity:0}
#flash{position:fixed;inset:0;background:#eaf8ff;pointer-events:none;opacity:0}
#suri{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 40% 35%,#ff8a5c,#d23b2a);color:#fff;font-weight:900;font-size:17px;line-height:1.1;box-shadow:0 5px 0 #7a1d12;touch-action:none}
#suri.on{transform:translateY(4px);box-shadow:0 1px 0 #7a1d12;background:radial-gradient(circle at 40% 35%,#ffd36b,#ff7a2a)}
#suri small{display:block;font-size:10px;font-weight:700;opacity:.9}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.1);pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75)}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:0;top:0;font-weight:900;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.6);will-change:transform}
#big{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;font-weight:900;font-size:40px;color:#fff;text-shadow:0 0 14px #5cd0ff,0 4px 0 #1a3a7a;opacity:0}
#big small{display:block;font-size:20px;color:#ffe45c;text-shadow:0 3px 0 #000}
#hint{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,420px);background:rgba(15,22,45,.85);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.55;text-align:center;pointer-events:none;border:2px solid #56c8ff}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(14,20,40,.82);overflow-y:auto}
.panel{width:min(100%,440px);text-align:center;margin:auto}
h1{margin:0 0 6px;font-size:34px;line-height:1.15;letter-spacing:.02em;text-shadow:0 0 16px #56c8ff,0 4px 0 #1a3a7a}
h1 span{display:block;font-size:17px;color:#ffe45c;text-shadow:0 2px 0 #000}
.how{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;text-align:left;font-size:14px;line-height:1.7;margin:14px 0}
.how b{color:#ffe45c}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:900;color:#1b2440;background:#ffe45c;box-shadow:0 5px 0 #b8901a;margin:10px 0;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8901a}
.btn.x{background:#000;color:#fff;box-shadow:0 5px 0 #444}
.btn.sub{background:#56c8ff;box-shadow:0 5px 0 #1f78a8;font-size:15px;padding:11px}
.row{display:flex;gap:8px}.row .btn{flex:1}
#challenge{background:#ff4b6e;border-radius:12px;padding:10px;font-weight:800;font-size:15px;margin:8px 0}
#best{font-size:13px;opacity:.8}
#card{width:100%;border-radius:12px;display:block;margin:6px 0 4px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#resMsg{font-size:14px;margin:4px 0;color:#ffe45c;font-weight:800}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#1b2440;font-weight:800;padding:10px 16px;border-radius:12px;font-size:14px;pointer-events:none;z-index:9}
</style>

<canvas id="c"></canvas>
<div id="vign"></div>
<div id="pops"></div>

  <div class="chip"><small>のこり</small><span id="time">60</span>秒</div>

<div id="flash"></div>
<div id="joy" hidden><div id="knob"></div></div>
<button id="suri" hidden>すり足<small>長押しで帯電UP</small></button>
<div id="hint" hidden></div>

<div id="title" class="screen">
  <div class="panel">
    <h1>バチッと！<br>静電気オフィス<span>⚡ 冬は、歩くだけで武器になる ⚡</span></h1>
    <div id="challenge" hidden></div>
    <div class="how">
      🧶 <b>カーペットを歩く</b>と帯電。<b>すり足</b>だと2倍たまる<br>
      ⚡ 同僚・猫・部長・ドアノブに<b>触れるとバチッ！</b><br>
      🔗 電圧が高いほど<b>まわりの人に連鎖</b>する<br>
      💥 100%のまま放っておくと<b>自爆してアフロ</b><br>
      💧 加湿器のそばでは電気が抜ける<br>
      <span style="opacity:.75;font-size:12px">スマホ：左側をなぞって移動／右下ボタンですり足<br>PC：WASD・矢印で移動／Shift か Space ですり足</span>

    <button class="btn" id="startBtn">出社する（60秒）</button>
    <div id="best"></div>
  </div>
</div>

<div id="result" class="screen" hidden>
  <div class="panel">
    <div style="font-size:14px;opacity:.8">定時です。おつかれさまでした</div>
    <canvas id="card" width="1200" height="675"></canvas>
    <div id="resMsg"></div>
    <button class="btn x" id="xBtn">𝕏 でバチッと自慢する</button>
    <div class="row">
      <button class="btn sub" id="imgBtn">画像を保存</button>
      <button class="btn sub" id="copyBtn">挑戦状URL</button>
    </div>
    <button class="btn" id="againBtn">もう一回出社する</button>
  </div>
</div>
<div id="toast" hidden></div>
