<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pk:#ff4f7b;--pk2:#ff8a5c;--bg:#fff6f8;--tx:#2b1d22;--sub:#8a7479;--card:#fff;--line:#f1dde2}
html,body{margin:0;height:100%;background:#2b1d22;color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
#app{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.grad{background:linear-gradient(135deg,var(--pk),var(--pk2))}
.btn{display:block;width:100%;padding:15px;border-radius:999px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--pk),var(--pk2));box-shadow:0 6px 18px #ff4f7b55}
.btn:active{transform:scale(.97)}
.btn.w{background:#fff;color:var(--pk);box-shadow:none;border:2px solid var(--pk)}
/* title */
#title{color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px}
#title h1{font-size:40px;margin:0 0 6px;line-height:1.15;text-shadow:0 3px 0 #0002}
#title p{margin:0 0 30px;opacity:.95;font-size:15px;line-height:1.6}
#title .logo{font-size:76px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
#title .btn{background:#fff;color:var(--pk);max-width:280px}
#title small{position:absolute;bottom:14px;left:0;right:0;font-size:11px;opacity:.8}
/* setup */
#setup{overflow-y:auto;padding:20px 16px 30px}
#setup h2{margin:4px 0 4px;font-size:22px}
#setup .lead{color:var(--sub);font-size:13px;margin:0 0 14px}
.q{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000d}
.q h3{margin:0 0 10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:#f6eef0;color:var(--tx);font-weight:700;font-size:14px}
.chip.on{background:var(--pk);color:#fff}
.row{display:flex;align-items:center;gap:8px;font-size:14px}
select,input[type=text]{font:inherit;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;min-width:0}
input[type=text]{width:100%}
input[type=range]{width:100%;accent-color:var(--pk)}
.mori{font-size:13px;color:var(--sub);margin-top:4px}
.icons{display:flex;gap:6px;flex-wrap:wrap}
.icons .chip{font-size:22px;padding:6px 10px}
/* main */
#main{background:var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
header .me{font-size:26px;width:38px;height:38px;border-radius:50%;background:#ffe3ea;display:flex;align-items:center;justify-content:center;flex-shrink:0}
header .info{flex:1;min-width:0}
header .rank{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;background:#f3e3e7;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--pk2));transition:width .4s}
header .likes{text-align:right;font-weight:800;color:var(--pk);font-size:15px;line-height:1.1;white-space:nowrap}
header .likes small{display:block;color:var(--sub);font-size:10px;font-weight:600}
.page{flex:1;position:relative;overflow:hidden;min-height:0}
nav{display:flex;background:#fff;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:8px 0 9px;font-size:11px;color:var(--sub);font-weight:700;position:relative}
nav button b{display:block;font-size:21px;line-height:1.2}
nav button.on{color:var(--pk)}
.badge{position:absolute;top:3px;left:55%;background:var(--pk);color:#fff;font-size:10px;border-radius:9px;padding:1px 6px;font-weight:800}
/* swipe */
#pSwipe{display:flex;flex-direction:column;padding:10px 12px 8px}
.stack{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:#ddd;box-shadow:0 8px 24px #0002;touch-action:none;user-select:none;-webkit-user-select:none}
.card .ph{position:absolute;inset:0;background-size:cover;background-position:center 25%}
.card .emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:150px}
.card .shade{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(transparent,#000c)}
.card .txt{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;color:#fff}
.card .nm{font-size:26px;font-weight:800}
.card .nm span{font-size:20px;font-weight:600;margin-left:6px}
.card .job{font-size:14px;opacity:.95;margin-top:2px}
.card .bio{font-size:13px;margin-top:8px;line-height:1.5;opacity:.95}
.card .dist{position:absolute;top:12px;left:12px;background:#0007;color:#fff;font-size:12px;padding:4px 10px;border-radius:99px}
.card .tag{position:absolute;top:12px;right:12px;background:var(--pk);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;font-weight:800}
.card .stamp{position:absolute;top:40px;font-size:34px;font-weight:900;padding:4px 12px;border:4px solid;border-radius:10px;opacity:0}
.card .st-l{left:20px;color:#4fc3ff;transform:rotate(14deg)}
.card .st-r{right:20px;color:#5ee07a;transform:rotate(-14deg)}
.card.back{transform:scale(.95) translateY(10px);filter:brightness(.92)}
.acts{display:flex;justify-content:center;gap:22px;padding:10px 0 2px;flex-shrink:0}
.acts button{width:62px;height:62px;border-radius:50%;background:#fff;box-shadow:0 4px 14px #0002;font-size:28px}
.acts .sp{width:50px;height:50px;font-size:22px;align-self:center}
.acts button:active{transform:scale(.9)}
/* messages */
#pMsg{overflow-y:auto}
.mitem{display:flex;gap:12px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid var(--line)}
.av{width:52px;height:52px;border-radius:50%;background:#eee center 25%/cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
.mitem .mt{flex:1;min-width:0}
.mitem .mn{font-weight:800;font-size:15px}
.mitem .ml{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mitem .dot{width:10px;height:10px;border-radius:50%;background:var(--pk);flex-shrink:0}
.mitem .cpl{font-size:11px;background:#ffe3ea;color:var(--pk);border-radius:9px;padding:2px 7px;font-weight:800;margin-left:4px}
.empty{padding:50px 24px;text-align:center;color:var(--sub);line-height:1.8}
/* chat */
#chat{background:var(--bg);z-index:30}
#chat header .back{background:none;font-size:24px;padding:0 6px 0 0;color:var(--pk)}
.aff{font-size:11px;color:var(--sub)}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;animation:pop .25s}
.bub.t{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 3px #0001}
.bub.m{background:var(--pk);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub.s{align-self:center;background:#0000000d;color:var(--sub);font-size:12px;border-radius:9px;max-width:92%;text-align:center}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#opts{padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;flex-shrink:0}
#opts button{padding:11px 14px;border-radius:14px;background:#fff0f4;color:var(--tx);font-weight:700;font-size:14px;text-align:left;border:1.5px solid #ffd2dd}
#opts button:active{background:#ffd2dd}
.typing{color:var(--sub);font-size:13px;padding:4px 2px}
/* my page */
#pMe{overflow-y:auto;padding:14px}
.prof{background:#fff;border-radius:18px;padding:18px;text-align:center;margin-bottom:12px}
.prof .big{font-size:64px}
.prof .nn{font-size:20px;font-weight:800}
.prof .rk{color:var(--pk);font-weight:800;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stats div{background:#fff;border-radius:14px;padding:12px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--pk)}
.stats span{font-size:12px;color:var(--sub)}
.box{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.box h4{margin:0 0 8px;font-size:14px}
.items{display:flex;flex-wrap:wrap;gap:6px}
.items span{background:#fff0f4;border-radius:10px;padding:5px 9px;font-size:13px}
/* modal */
.modal{position:absolute;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:22px;padding:22px 18px 18px;width:100%;max-width:360px;text-align:center;animation:pop .3s;max-height:90%;overflow-y:auto}
.mbox .mi{font-size:60px;line-height:1.1}
.mbox h3{margin:8px 0 6px;font-size:21px}
.mbox p{margin:0 0 16px;font-size:14px;line-height:1.6;color:#5a4a4f;white-space:pre-wrap}
.mbox .btn{margin-top:8px}
.match{background:linear-gradient(160deg,#ff4f7bee,#ff8a5cee)}
.match .mbox{background:none;color:#fff}
.match .mbox h3{font-size:34px;font-style:italic;text-shadow:0 3px 0 #0003}
.match .mbox p{color:#fff}
.pair{display:flex;justify-content:center;align-items:center;gap:6px;margin:12px 0}
.pair .av{width:100px;height:100px;border:4px solid #fff;font-size:56px;background-color:#ffe3ea}
.pair i{font-size:34px;font-style:normal}
.match .btn{background:#fff;color:var(--pk)}
.match .btn.w{background:none;color:#fff;border-color:#fff}
.tapzone{font-size:60px;width:130px;height:130px;border-radius:50%;background:#ffe3ea;margin:6px auto 10px;display:flex;align-items:center;justify-content:center}
.tapzone:active{transform:scale(.92)}
/* toast & hearts */
#toasts{position:absolute;top:62px;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.toast{background:#fffffff2;box-shadow:0 4px 14px #0002;border-radius:14px;padding:7px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;max-width:92%;animation:tin .3s}
.toast .av{width:28px;height:28px;font-size:17px}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}
.fh{position:absolute;z-index:35;font-size:34px;animation:rise 4.5s linear forwards;cursor:pointer;padding:6px}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-420px);opacity:.2}}
.plus{position:absolute;z-index:45;color:var(--pk);font-weight:900;font-size:18px;pointer-events:none;animation:up 0.9s forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.rainh{position:absolute;z-index:36;font-size:22px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(110dvh)}}
/* ending */
#ending{color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:60;overflow-y:auto}
#ending .ei{font-size:80px}
#ending h2{font-size:28px;margin:6px 0}
#ending p{line-height:1.7;font-size:15px;white-space:pre-wrap}
#ending .btn{background:#fff;color:var(--pk);max-width:300px;margin:8px auto 0}
#ending .btn.w{background:none;color:#fff;border-color:#fff}
</style>
</head>
<body>
<div id="app">

<section class="scr grad" id="title">
  <div class="logo">💘</div>
  <h1>モテンダー</h1>
  <p>モテ期、来ました。<br>登録した瞬間から、通知が止まらない。<br>人類史上もっともモテるマッチングアプリ。</p>

  <button class="btn w" id="bCont" style="max-width:280px;margin-top:10px;background:none;color:#fff;border-color:#fff" hidden>つづきから</button>
  <small>※登場する人物の写真はAIで作った、実在しない人です</small>
</section>

<section class="scr" id="setup" hidden>

  <div class="q"><h3>③ 好きな年齢</h3>

  </div>
  <div class="q"><h3>④ ニックネームとアイコン</h3>
    <input type="text" id="nick" maxlength="10" placeholder="ニックネーム（10文字まで）">

    <div style="margin-top:12px;font-size:14px;font-weight:700">写真の加工（盛り度）</div>
    <input type="range" id="mori" min="0" max="100" value="30">
    <div class="mori" id="moriTx"></div>
  </div>
  <button class="btn" id="bReg">登録してモテる</button>
</section>

<section class="scr" id="main" hidden>
  <header>
    <div class="me" id="hMe">😀</div>
    <div class="info"><div class="rank" id="hRank"></div><div class="bar"><i id="hBar"></i></div></div>
    <div class="likes"><span id="hLikes">0</span><small>もらったいいね</small></div>
  </header>
  <div class="page">
    <div class="scr" id="pSwipe">
      <div class="stack" id="stack"></div>
      <div class="acts"><button id="bNo">✖️</button><button class="sp" id="bSp">⭐</button><button id="bYes">💗</button></div>
    </div>
    <div class="scr" id="pMsg" hidden></div>
    <div class="scr" id="pMe" hidden></div>
  </div>
  <nav>
    <button data-p="pSwipe" class="on"><b>💘</b>さがす</button>
    <button data-p="pMsg"><b>💬</b>メッセージ<span class="badge" id="nBadge" hidden>0</span></button>
    <button data-p="pMe"><b>👤</b>マイページ</button>
  </nav>
  <div id="toasts"></div>
</section>

<section class="scr" id="chat" hidden>
  <header><button class="back" id="bBack">‹</button><div class="av" id="cAv" style="width:38px;height:38px;font-size:22px"></div><div class="info"><div class="rank" id="cName"></div><div class="aff" id="cAff"></div></div></header>
  <div id="log"></div>
  <div id="opts"></div>
</section>

<section class="scr grad" id="ending" hidden></section>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
</div>
