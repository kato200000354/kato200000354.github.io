<title>ラーメン制覇マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F6F3F1; --surface:#FFFFFF; --surface2:#FBF8F6; --ink:#241A16; --muted:#7C6E68; --line:#ECE4DF;
  --accent:#D63A26; --accent-ink:#FFFFFF; --accent-soft:#FBE3DE; --gold:#E4A21A; --gold-soft:#FFF2D6;
  --green:#2E9A5E; --blue:#2F6FD1; --purple:#8A55D6;
  --heat0:#EFE8E4; --heat1:#F8CFC5; --heat2:#EE8D79; --heat3:#D63A26;
  --shadow:0 1px 2px rgba(60,30,20,.06),0 6px 18px rgba(60,30,20,.06);
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15100E; --surface:#201916; --surface2:#1B1512; --ink:#F4ECE8; --muted:#A8998F; --line:#372D29;
    --accent:#EF5A43; --accent-ink:#FFFFFF; --accent-soft:#3D1D17; --gold:#F0B43A; --gold-soft:#3A2D14;
    --heat0:#2B2320; --heat1:#5A2A22; --heat2:#9C3B2C; --heat3:#EF5A43;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15100E; --surface:#201916; --surface2:#1B1512; --ink:#F4ECE8; --muted:#A8998F; --line:#372D29;
  --accent:#EF5A43; --accent-ink:#FFFFFF; --accent-soft:#3D1D17; --gold:#F0B43A; --gold-soft:#3A2D14;
  --heat0:#2B2320; --heat1:#5A2A22; --heat2:#9C3B2C; --heat3:#EF5A43;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.view-title{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;padding-block:20px 12px;display:flex;align-items:center;gap:10px}
.back{border:0;background:none;padding:4px 6px 4px 0;font-size:22px;line-height:1;color:var(--ink)}
.section-label{font-weight:700;font-size:14px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.section-label small{font-weight:500;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}

/* hero */
.hero{margin:0 -16px;padding:22px 16px 64px;background:
  radial-gradient(120% 90% at 100% 0%, rgba(255,190,120,.22), transparent 60%),
  linear-gradient(160deg,#B8261A 0%,#D63A26 55%,#E4572F 100%);color:#fff;position:relative;overflow:hidden}
.hero h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15;letter-spacing:.06em}
.hero p{margin:6px 0 0;font-size:12px;opacity:.85;letter-spacing:.08em}
.hero .bowl-big{position:absolute;right:-18px;bottom:-26px;width:170px;opacity:.95}
.hero .noren{position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 36px,transparent 36px 40px)}
.profile-card{margin-top:-44px;position:relative;box-shadow:var(--shadow)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;border:2px solid var(--surface)}
.title-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gold);font-weight:700}
.progress-big{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.progress-big b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--heat0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile span{font-size:11px;color:var(--muted);display:block}
.tile b{font-size:22px;font-weight:900}
.tile small{font-size:11px;color:var(--muted);margin-left:2px}

.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;box-shadow:0 6px 16px rgba(214,58,38,.25)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-sm{padding:8px 14px;font-size:13px}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.recent{flex:none;width:112px;border:0;background:none;padding:0;text-align:left}
.recent .thumb{width:112px;height:92px;border-radius:12px}
.recent b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent small{font-size:11px;color:var(--muted)}

.thumb{background:var(--surface2);border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:84%;height:84%}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--accent-soft);color:var(--accent)}
.pill.g-つけ麺{background:var(--gold-soft);color:var(--gold)}
.pill.g-まぜそば,.pill.g-油そば{background:rgba(47,111,209,.12);color:var(--blue)}
.pill.g-担々麺{background:rgba(138,85,214,.12);color:var(--purple)}
.pill.g-その他{background:var(--heat0);color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:3px 11px;background:var(--surface2);border:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .thumb{width:72px;height:72px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .chev{color:var(--muted);font-size:18px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px;margin-bottom:12px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}

/* map */
.jgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative}
.pref{aspect-ratio:1;border:0;border-radius:5px;background:var(--heat0);font-size:clamp(8px,2.3vw,10.5px);font-weight:700;color:var(--muted);display:grid;place-items:center;padding:0;line-height:1;max-width:100%;transition:transform .12s}
.pref.l1{background:var(--heat1);color:#7a2a1f}.pref.l2{background:var(--heat2);color:#fff}.pref.l3{background:var(--heat3);color:#fff}
.pref[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px;transform:scale(1.08);z-index:1}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.map-note{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--muted);line-height:1.5}
.map-note b{font-size:20px;color:var(--ink);font-weight:900}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.region{padding:12px}
.region b{font-size:18px;font-weight:900}
.region .bar{height:6px;margin-top:6px}

/* detail */
.detail-hero{margin:0 -16px;height:240px;position:relative;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero svg{width:190px}
.detail-hero .back-float{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
.detail-hero .fav-float{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px}
.detail-body{background:var(--bg);margin:-18px -16px 0;border-radius:20px 20px 0 0;padding:20px 16px 0;position:relative}
.detail-body h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery img{aspect-ratio:1;object-fit:cover;border-radius:10px;width:100%}
.memo{white-space:pre-wrap;font-size:14px}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.field > .lbl{font-weight:700;font-size:13px}
.field .opt{font-weight:400;color:var(--muted);font-size:12px}
.input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.star-input{display:flex;gap:4px}
.star-input button{border:0;background:none;font-size:34px;line-height:1;padding:0 2px;color:var(--line)}
.star-input button.on{color:var(--gold)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{width:72px;height:72px;border-radius:12px;overflow:hidden;position:relative;background:var(--surface2)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1}
.photos label.add{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:26px;color:var(--muted);cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:14px}

/* stats */
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:6px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.feat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:0}
.feat .nm{flex:1}
.feat .pc{font-weight:700;font-variant-numeric:tabular-nums}
.insight{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:10px}

.genre-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.genre-row .ic{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.genre-row .ic svg{width:28px}
.genre-row .bar{height:6px;margin-top:4px}
.donut-wrap{display:flex;align-items:center;gap:18px}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.badge{text-align:center;font-size:12px}
.badge .medal{width:68px;height:68px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 8px rgba(0,0,0,.12)}
.badge .medal::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.badge.locked .medal{background:var(--heat0)!important;color:var(--muted);box-shadow:none}
.badge.locked .medal::after{border-color:var(--line)}
.badge b{display:block;font-size:12px}
.badge small{color:var(--muted);font-size:11px}

.menu{padding:4px 16px}
.menu button,.menu .mi{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.menu > :last-child{border-bottom:0}
.menu .chev{margin-left:auto;color:var(--muted)}
.my-head{text-align:center;padding-top:24px}
.my-head .avatar{width:76px;height:76px;font-size:32px;margin:0 auto 8px}
.my-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:14px}
.my-stats b{font-size:22px;font-weight:900;display:block}
.my-stats span{font-size:11px;color:var(--muted)}

.banner{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:12.5px;margin:12px 0 0;display:flex;gap:8px;align-items:flex-start}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:14px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .add-btn span.circle{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 14px rgba(214,58,38,.35)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;box-shadow:var(--shadow)}
.foot{text-align:center;margin:36px 0 8px;color:var(--muted);font-size:12px;letter-spacing:.2em}
.foot b{display:block;font-family:var(--display);font-weight:400;font-size:16px;color:var(--ink);letter-spacing:.3em;margin-bottom:2px}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px;font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
