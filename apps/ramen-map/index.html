<title>ラーメン制覇マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F6F3F1; --surface:#FFFFFF; --surface2:#FBF8F6; --ink:#241A16; --muted:#7C6E68; --line:#ECE4DF;
  --accent:#D63A26; --accent-ink:#FFFFFF; --accent-soft:#FBE3DE; --gold:#E4A21A; --gold-soft:#FFF2D6;
  --green:#2E9A5E; --blue:#2F6FD1; --purple:#8A55D6;
  --heat0:#EFE8E4; --heat1:#F8CFC5; --heat2:#EE8D79; --heat3:#D63A26;
  --shadow:0 1px 2px rgba(60,30,20,.06),0 6px 18px rgba(60,30,20,.06);
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15100E; --surface:#201916; --surface2:#1B1512; --ink:#F4ECE8; --muted:#A8998F; --line:#372D29;
    --accent:#EF5A43; --accent-ink:#FFFFFF; --accent-soft:#3D1D17; --gold:#F0B43A; --gold-soft:#3A2D14;
    --heat0:#2B2320; --heat1:#5A2A22; --heat2:#9C3B2C; --heat3:#EF5A43;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15100E; --surface:#201916; --surface2:#1B1512; --ink:#F4ECE8; --muted:#A8998F; --line:#372D29;
  --accent:#EF5A43; --accent-ink:#FFFFFF; --accent-soft:#3D1D17; --gold:#F0B43A; --gold-soft:#3A2D14;
  --heat0:#2B2320; --heat1:#5A2A22; --heat2:#9C3B2C; --heat3:#EF5A43;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.view-title{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em;padding-block:20px 12px;display:flex;align-items:center;gap:10px}
.back{border:0;background:none;padding:4px 6px 4px 0;font-size:22px;line-height:1;color:var(--ink)}
.section-label{font-weight:700;font-size:14px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.section-label small{font-weight:500;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}

/* hero */
.hero{margin:0 -16px;padding:22px 16px 64px;background:
  radial-gradient(120% 90% at 100% 0%, rgba(255,190,120,.22), transparent 60%),
  linear-gradient(160deg,#B8261A 0%,#D63A26 55%,#E4572F 100%);color:#fff;position:relative;overflow:hidden}
.hero h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15;letter-spacing:.06em}
.hero p{margin:6px 0 0;font-size:12px;opacity:.85;letter-spacing:.08em}
.hero .bowl-big{position:absolute;right:-18px;bottom:-26px;width:170px;opacity:.95}
.hero .noren{position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 36px,transparent 36px 40px)}
.profile-card{margin-top:-44px;position:relative;box-shadow:var(--shadow)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;border:2px solid var(--surface)}
.title-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--gold);font-weight:700}
.progress-big{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.progress-big b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--heat0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tile span{font-size:11px;color:var(--muted);display:block}
.tile b{font-size:22px;font-weight:900}
.tile small{font-size:11px;color:var(--muted);margin-left:2px}

.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease, background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%;box-shadow:0 6px 16px rgba(214,58,38,.25)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-danger{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-sm{padding:8px 14px;font-size:13px}

.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.hscroll::-webkit-scrollbar{display:none}
.recent{flex:none;width:112px;border:0;background:none;padding:0;text-align:left}
.recent .thumb{width:112px;height:92px;border-radius:12px}
.recent b{display:block;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent small{font-size:11px;color:var(--muted)}

.thumb{background:var(--surface2);border-radius:12px;overflow:hidden;display:grid;place-items:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:84%;height:84%}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--accent-soft);color:var(--accent)}
.pill.g-つけ麺{background:var(--gold-soft);color:var(--gold)}
.pill.g-まぜそば,.pill.g-油そば{background:rgba(47,111,209,.12);color:var(--blue)}
.pill.g-担々麺{background:rgba(138,85,214,.12);color:var(--purple)}
.pill.g-その他{background:var(--heat0);color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:3px 11px;background:var(--surface2);border:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .thumb{width:72px;height:72px}
.item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .chev{color:var(--muted);font-size:18px}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px;margin-bottom:12px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}

/* map */
.jgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative}
.pref{aspect-ratio:1;border:0;border-radius:5px;background:var(--heat0);font-size:clamp(8px,2.3vw,10.5px);font-weight:700;color:var(--muted);display:grid;place-items:center;padding:0;line-height:1;max-width:100%;transition:transform .12s}
.pref.l1{background:var(--heat1);color:#7a2a1f}.pref.l2{background:var(--heat2);color:#fff}.pref.l3{background:var(--heat3);color:#fff}
.pref[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px;transform:scale(1.08);z-index:1}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.map-note{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--muted);line-height:1.5}
.map-note b{font-size:20px;color:var(--ink);font-weight:900}
.regions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.region{padding:12px}
.region b{font-size:18px;font-weight:900}
.region .bar{height:6px;margin-top:6px}

/* detail */
.detail-hero{margin:0 -16px;height:240px;position:relative;background:var(--surface2);display:grid;place-items:center;overflow:hidden}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero svg{width:190px}
.detail-hero .back-float{position:absolute;left:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
.detail-hero .fav-float{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px}
.detail-body{background:var(--bg);margin:-18px -16px 0;border-radius:20px 20px 0 0;padding:20px 16px 0;position:relative}
.detail-body h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery img{aspect-ratio:1;object-fit:cover;border-radius:10px;width:100%}
.memo{white-space:pre-wrap;font-size:14px}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label,.field > .lbl{font-weight:700;font-size:13px}
.field .opt{font-weight:400;color:var(--muted);font-size:12px}
.input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.star-input{display:flex;gap:4px}
.star-input button{border:0;background:none;font-size:34px;line-height:1;padding:0 2px;color:var(--line)}
.star-input button.on{color:var(--gold)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{width:72px;height:72px;border-radius:12px;overflow:hidden;position:relative;background:var(--surface2)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1}
.photos label.add{width:72px;height:72px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:26px;color:var(--muted);cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:14px}

/* stats */
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:6px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.feat{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.feat:last-child{border-bottom:0}
.feat .nm{flex:1}
.feat .pc{font-weight:700;font-variant-numeric:tabular-nums}
.insight{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-top:10px}

.genre-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.genre-row .ic{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.genre-row .ic svg{width:28px}
.genre-row .bar{height:6px;margin-top:4px}
.donut-wrap{display:flex;align-items:center;gap:18px}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.badge{text-align:center;font-size:12px}
.badge .medal{width:68px;height:68px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 8px rgba(0,0,0,.12)}
.badge .medal::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px solid rgba(255,255,255,.55)}
.badge.locked .medal{background:var(--heat0)!important;color:var(--muted);box-shadow:none}
.badge.locked .medal::after{border-color:var(--line)}
.badge b{display:block;font-size:12px}
.badge small{color:var(--muted);font-size:11px}

.menu{padding:4px 16px}
.menu button,.menu .mi{display:flex;width:100%;align-items:center;gap:12px;border:0;background:none;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.menu > :last-child{border-bottom:0}
.menu .chev{margin-left:auto;color:var(--muted)}
.my-head{text-align:center;padding-top:24px}
.my-head .avatar{width:76px;height:76px;font-size:32px;margin:0 auto 8px}
.my-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:14px}
.my-stats b{font-size:22px;font-weight:900;display:block}
.my-stats span{font-size:11px;color:var(--muted)}

.banner{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:12.5px;margin:12px 0 0;display:flex;gap:8px;align-items:flex-start}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:14px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
.nav .add-btn span.circle{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 14px rgba(214,58,38,.35)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;box-shadow:var(--shadow)}
.foot{text-align:center;margin:36px 0 8px;color:var(--muted);font-size:12px;letter-spacing:.2em}
.foot b{display:block;font-family:var(--display);font-weight:400;font-size:16px;color:var(--ink);letter-spacing:.3em;margin-bottom:2px}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px;font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="nav" aria-label="メインメニュー"><div class="nav-in" id="nav"></div></nav>
<div class="toast" id="toast" hidden></div>

/* ---------- state ---------- */
const S = {
  visits: [], loaded:false, profile:{name:"ラーメン好き",goal:200},
  mode:"local", db:null, assets:null, downloads:null,
  view:"home", stack:[], detailId:null, editId:null, prefSel:null,
  filter:"すべて", sort:"new", query:"", period:"all",
  form:null, confirmDel:false, saving:false
};
const LS_V="ramen-visits-v1", LS_P="ramen-profile-v1";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

const isSample = () => S.visits.length===0;
const data = () => isSample() ? SAMPLE : S.visits;

/* ---------- helpers ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtDate = s => { if(!s) return ""; const [y,m,d]=s.split("-"); return `${y}/${+m}/${+d}`; };
const fmtDateLong = s => { if(!s) return ""; const d=new Date(s+"T00:00:00"); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`; };
const stars = n => "★".repeat(n)+"<span style='color:var(--line)'>"+"★".repeat(5-n)+"</span>";
const shopKey = v => (v.name||"").replace(/\s+/g,"")+"|"+v.pref;
const photoSrc = p => p.a ? "/_blob/"+p.a : p.d;
function titleFor(n){ let t=TITLES[0][1]; for(const [k,v] of TITLES) if(n>=k) t=v; return t; }
function nextTitle(n){ return TITLES.find(([k])=>k>n); }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function mapsUrl(v){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(`${v.name} ${PREF_FULL(v.pref)} ${v.area||""}`); }

function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function bowl(v, opts={}){
  const broth = (v.flavors&&v.flavors.map(f=>BROTH[f]).find(Boolean)) || GENRE_BROTH[v.genre] || "#8B4A1F";
  const h = hash(v.id||v.name||"x"); const tsuke = v.genre==="つけ麺"; const mazesoba = v.genre==="まぜそば"||v.genre==="油そば";
  const egg = h%3!==0, nori = h%2===0;
  const bowlC = opts.white ? "#FFFFFF" : "#1F1512";
  return `<svg viewBox="0 0 120 100" aria-hidden="true">
   <ellipse cx="60" cy="92" rx="40" ry="5" fill="rgba(0,0,0,.12)"/>
   <path d="M10 44 Q12 88 60 90 Q108 88 110 44 Z" fill="${bowlC}"/>
   <path d="M16 58 Q60 66 104 58" stroke="#D63A26" stroke-width="3" fill="none"/>
   <path d="M22 70 Q60 76 98 70" stroke="#D63A26" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
   <ellipse cx="60" cy="44" rx="50" ry="14" fill="${bowlC}"/>
   <ellipse cx="60" cy="44" rx="45" ry="11" fill="${mazesoba?"#E9C77E":broth}"/>
   ${tsuke?`<path d="M28 42 q8 -6 16 0 t16 0 t16 0 t16 0" stroke="#F3DE9E" stroke-width="3" fill="none"/>`
           :`<path d="M26 46 q6 -4 12 0 t12 0 t12 0 t12 0 t12 0" stroke="#F3DE9E" stroke-width="2.4" fill="none" opacity=".9"/>`}
   ${nori?`<rect x="${78-h%6}" y="30" width="13" height="16" rx="1" fill="#1D2A1E" transform="rotate(12 84 38)"/>`:""}
   <ellipse cx="${46+h%8}" cy="41" rx="11" ry="6.5" fill="#E7B89A" stroke="#B7704C" stroke-width="1.6"/>
   ${egg?`<ellipse cx="${70-h%5}" cy="45" rx="7" ry="5" fill="#FFF7EA"/><ellipse cx="${70-h%5}" cy="45.6" rx="3.8" ry="2.9" fill="#F0A21C"/>`:""}
   <g fill="#5CA548">${[0,1,2,3,4,5].map(i=>`<circle cx="${34+((h>>i)%40)}" cy="${40+((h>>(i+2))%9)}" r="1.8"/>`).join("")}</g>
   ${mazesoba?`<circle cx="60" cy="42" r="4" fill="#F3B51C"/>`:""}
  </svg>`;
}
function thumb(v, cls=""){
  const p = v.photos && v.photos[0];
  return `<div class="thumb ${cls}">${p?`<img src="${esc(photoSrc(p))}" alt="" loading="lazy">`:bowl(v)}</div>`;
}

/* ---------- derived stats ---------- */
function stats(list=data()){
  const shops = new Map();
  for(const v of list){ const k=shopKey(v); if(!shops.has(k)) shops.set(k,[]); shops.get(k).push(v); }
  const prefCount = {}; for(const [k,arr] of shops){ const p=arr[0].pref; prefCount[p]=(prefCount[p]||0)+1; }
  const genreCount = {}; for(const [,arr] of shops){ const g=arr[0].genre; genreCount[g]=(genreCount[g]||0)+1; }
  const flavorCount = {}; for(const v of list) for(const f of (v.flavors||[])) flavorCount[f]=(flavorCount[f]||0)+1;
  const favs = new Set(list.filter(v=>v.fav).map(shopKey)).size;
  const avg = list.length? list.reduce((a,v)=>a+(+v.rating||0),0)/list.length : 0;
  const priced = list.filter(v=>+v.price>0);
  const avgPrice = priced.length? Math.round(priced.reduce((a,v)=>a+ +v.price,0)/priced.length):0;
  return {shops, shopCount:shops.size, visits:list.length, prefCount, prefs:Object.keys(prefCount).length, genreCount, flavorCount, favs, avg, avgPrice};
}

/* ---------- navigation ---------- */
function go(view, push=true){
  if(push && S.view!==view) S.stack.push(S.view);
  S.view=view; S.confirmDel=false; render(); window.scrollTo(0,0);
}
function back(){ const v=S.stack.pop()||"home"; S.view=v; S.confirmDel=false; render(); window.scrollTo(0,0); }
function tab(view){ S.stack=[]; S.view=view; S.confirmDel=false; if(view==="add") openForm(); render(); window.scrollTo(0,0); }

function genreRows(st, limit){
  const total = st.shopCount||1;
  const rows = GENRES.map(g=>({g,n:st.genreCount[g]||0})).sort((a,b)=>b.n-a.n).slice(0,limit||99);
  return `<div>${rows.map(r=>{const p=Math.round(r.n/total*100);return `
    <div class="genre-row">
      <div class="ic">${bowl({id:r.g,genre:r.g})}</div>
      <div><div class="row" style="justify-content:space-between;font-size:14px"><span>${r.g}</span><span class="muted num" style="font-size:12px">${r.n} 店・${p}%</span></div>
      <div class="bar"><i style="width:${p}%"></i></div></div>
      <span></span>
    </div>`}).join("")}</div>`;
}

function vMap(){
  const st=stats(); const max=Math.max(1,...Object.values(st.prefCount));
  const lvl = n => !n?"":n===1?"l1":n<5?"l2":"l3";
  const sel=S.prefSel;
  const cells = PREFS.map(([n,c,r])=>{
    const k=st.prefCount[n]||0;
    return `<button class="pref ${lvl(k)}" style="grid-column:${c+1};grid-row:${r+1}" data-act="pref" data-p="${n}" aria-pressed="${sel===n}" aria-label="${PREF_FULL(n)} ${k}店">${n.length>2?n.slice(0,2):n}</button>`;
  }).join("");
  const regionStats = REGIONS.map(rg=>{
    const ps=PREFS.filter(p=>p[3]===rg).map(p=>p[0]);
    const done=ps.filter(p=>st.prefCount[p]).length;
    const shops=ps.reduce((a,p)=>a+(st.prefCount[p]||0),0);
    return {rg,total:ps.length,done,shops};
  });
  let selList="";
  if(sel){
    const shops=[...st.shops.values()].filter(a=>a[0].pref===sel).map(a=>[...a].sort((x,y)=>y.date.localeCompare(x.date)));
    selList=`<div class="section-label">${PREF_FULL(sel)} <small>${shops.length} 店</small></div>
      ${shops.length?`<div class="list">${shops.map(a=>itemRow(a[0], a.length)).join("")}</div>`
        :`<div class="card empty">まだ${PREF_FULL(sel)}の記録はありません。<br><button class="btn btn-ghost btn-sm" style="margin-top:12px" data-act="add-pref" data-p="${sel}">${PREF_FULL(sel)}で記録する</button></div>`}`;
  }
  return `
  <h1 class="view-title">制覇マップ</h1>
  <div class="jgrid" style="grid-template-rows:repeat(12,auto)">
    ${cells}
    <div class="map-note" style="grid-column:1/8;grid-row:1/4;position:static;align-self:start"><b class="num">${st.prefs}</b> / 47<br>都道府県を制覇</div>
  </div>
  <div class="legend"><span><i style="background:var(--heat0)"></i>未訪問</span><span><i style="background:var(--heat1)"></i>1店</span><span><i style="background:var(--heat2)"></i>2〜4店</span><span><i style="background:var(--heat3)"></i>5店以上</span><span style="margin-left:auto">タップで店一覧</span></div>
  ${selList}
  <div class="section-label">エリア別の制覇状況</div>
  <div class="regions">${regionStats.map(r=>`
    <div class="card region"><div class="row" style="justify-content:space-between"><span style="font-size:13px;font-weight:700">${r.rg}</span><span class="muted num" style="font-size:11px">${r.shops}店</span></div>
    <div class="num"><b>${r.done}</b> <span class="muted" style="font-size:12px">/ ${r.total} 都道府県</span></div>
    <div class="bar"><i style="width:${Math.round(r.done/r.total*100)}%"></i></div></div>`).join("")}
  </div>`;
}

function itemRow(v, count){
  return `<button class="item" data-act="detail" data-id="${v.id}">
    ${thumb(v)}
    <div class="body">
      <div class="name">${esc(v.name)}${v.fav?` <span style="color:var(--accent)">♥</span>`:""}</div>
      <div class="meta num"><span class="stars">★</span> ${(+v.rating).toFixed(1)}<span>${fmtDate(v.date)}</span>${count>1?`<span>${count}回訪問</span>`:""}</div>
      <div class="meta"><span class="pill g-${esc(v.genre)}">${esc(v.genre)}</span><span>${PREF_FULL(v.pref)}${v.area?"・"+esc(v.area):""}</span></div>

    <span class="chev">›</span>
  </button>`;
}

function vCollection(){
  let list=[...data()];
  if(S.filter==="お気に入り") list=list.filter(v=>v.fav);
  else if(S.filter!=="すべて") list=list.filter(v=>v.genre===S.filter);
  const q=S.query.trim();
  if(q) list=list.filter(v=>[v.name,v.area,PREF_FULL(v.pref),v.memo,...(v.flavors||[])].join(" ").includes(q));
  list.sort(S.sort==="rating"?(a,b)=>b.rating-a.rating||b.date.localeCompare(a.date):(a,b)=>b.date.localeCompare(a.date));
  return `

function openForm(src, mode){
  if(src && mode==="edit") S.form={...structuredClone(src),newPhotos:[]};
  else if(src) S.form={...blankForm(),name:src.name,genre:src.genre,flavors:[...(src.flavors||[])],pref:src.pref,area:src.area};
  else S.form=blankForm();
}

      <div class="field"><label for="f-area">市区町村 <span class="opt">任意</span></label>

function vGenre(){
  const st=stats(); const g0=GENRES.map(g=>({g,n:st.genreCount[g]||0})).sort((a,b)=>b.n-a.n)[0];
  const pct=st.shopCount?Math.round(g0.n/st.shopCount*100):0;
  const R=42, C=2*Math.PI*R;
  return `
  <h1 class="view-title"><button class="back" data-act="back" aria-label="戻る">‹</button>ジャンル別</h1>
  <div class="card donut-wrap">
    <svg width="110" height="110" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--heat0)" stroke-width="12"/>
      <circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 55 55)"/>
      <g transform="translate(27 30) scale(.47)">${bowl({id:g0.g,genre:g0.g}).replace(/<\/?svg[^>]*>/g,"")}</g></svg>
    <div><div style="font-weight:700">いちばん多いのは ${g0.g}</div><div class="num"><b style="font-size:28px;font-weight:900">${g0.n}</b> <span class="muted">/ ${st.shopCount} 店</span></div><div style="color:var(--accent);font-weight:700" class="num">${pct}%</div></div>
  </div>
  <div class="section-label">すべてのジャンル</div>
  ${genreRows(st)}
  <div class="section-label">味・特徴の内訳 <small>杯数</small></div>
  <div class="card">${featRows(st.flavorCount, st.visits, 12)}</div>`;
}
function featRows(counts, total, limit=5){
  const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit);
  if(!rows.length) return `<div class="muted" style="font-size:13px">味・特徴をつけて記録すると、ここに傾向が出ます。</div>`;
  return rows.map(([k,n])=>`<div class="feat"><span class="thumb" style="width:28px;height:28px;border-radius:50%">${bowl({id:k,flavors:[k]})}</span><span class="nm">${esc(k)}</span><span class="muted num" style="font-size:12px">${n}杯</span><span class="pc">${Math.round(n/total*100)}%</span></div>`).join("");
}

function vBadges(){

  <div class="muted num" style="font-size:13px;margin:-4px 0 14px">${got.length} / ${bs.length} 個 獲得</div>
  <div class="badges">${bs.map(b=>`<div class="badge ${b.got?"":"locked"}"><div class="medal" style="background:${b.c}">${b.s}</div><b>${b.n}</b><small class="num">${b.got?b.d:`${Math.min(b.have,b.need)} / ${b.need}`}</small></div>`).join("")}</div>`;
}

function vStats(){
  const all=data(); const now=new Date(); const y=now.getFullYear(), m=now.getMonth()+1;
  const inPeriod = v => S.period==="all"?true : S.period==="year"? v.date.startsWith(y+"-") : v.date.startsWith(`${y}-${String(m).padStart(2,"0")}`);
  const list=all.filter(inPeriod); const st=stats(list);
  // last 12 months
  const months=[]; for(let i=11;i>=0;i--){ const d=new Date(y,m-1-i,1); months.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,l:(d.getMonth()+1)+"月"}); }
  const counts=months.map(mo=>all.filter(v=>v.date.startsWith(mo.k)).length);
  const mx=Math.max(4,...counts); const step=Math.ceil(mx/4); const top=step*4;
  const W=320,H=170,L=26,B=22,T=10,cw=(W-L-6)/12;
  const yS=v=>T+(H-T-B)*(1-v/top);
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="過去12か月の訪問数">
    ${[0,1,2,3,4].map(i=>`<line x1="${L}" x2="${W-4}" y1="${yS(i*step)}" y2="${yS(i*step)}" stroke="var(--line)"/><text x="${L-6}" y="${yS(i*step)+3.5}" text-anchor="end" font-size="9" fill="var(--muted)">${i*step}</text>`).join("")}
    ${counts.map((c,i)=>{const x=L+i*cw+cw*.22,w=cw*.56,yy=yS(c);return `<rect x="${x}" y="${yy}" width="${w}" height="${Math.max(0,H-B-yy)}" rx="3" fill="${i===11?"var(--accent)":"var(--heat2)"}"><title>${months[i].l} ${c}杯</title></rect>${c?`<text x="${x+w/2}" y="${yy-3}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">${c}</text>`:""}<text x="${x+w/2}" y="${H-7}" text-anchor="middle" font-size="9" fill="var(--muted)">${months[i].l}</text>`}).join("")}
  </svg>`;
  const topFlavor=Object.entries(st.flavorCount).sort((a,b)=>b[1]-a[1])[0];
  const topPref=Object.entries(st.prefCount).sort((a,b)=>b[1]-a[1])[0];
  const dow=[0,0,0,0,0,0,0]; list.forEach(v=>dow[new Date(v.date+"T00:00:00").getDay()]++);
  const weekend=list.length?Math.round((dow[0]+dow[6])/list.length*100):0;
  return `
  <h1 class="view-title"><button class="back" data-act="back" aria-label="戻る">‹</button>統計・分析</h1>
  <div class="seg">${[["all","全期間"],["year","今年"],["month","今月"]].map(([k,l])=>`<button data-act="period" data-v="${k}" aria-pressed="${S.period===k}">${l}</button>`).join("")}</div>
  <div class="tiles num">
    <div class="tile"><span>訪問数</span><b>${st.visits}</b><small>杯</small></div>
    <div class="tile"><span>平均評価</span><b>${st.avg?st.avg.toFixed(1):"—"}</b></div>
    <div class="tile"><span>平均価格</span><b style="font-size:18px">${st.avgPrice?"¥"+st.avgPrice.toLocaleString():"—"}</b></div>
  </div>
  <div class="section-label">訪問数の推移 <small>過去12か月・杯</small></div>
  <div class="card chart">${svg}</div>
  <div class="section-label">よく行くお店の特徴</div>
  <div class="card">
    ${featRows(st.flavorCount, st.visits||1, 4)}
    ${topPref?`<div class="feat"><span class="thumb" style="width:28px;height:28px;border-radius:50%">📍</span><span class="nm">${PREF_FULL(topPref[0])}</span><span class="muted num" style="font-size:12px">${topPref[1]}店</span><span class="pc">${Math.round(topPref[1]/st.shopCount*100)}%</span></div>`:""}
    ${list.length?`<div class="feat"><span class="thumb" style="width:28px;height:28px;border-radius:50%">📅</span><span class="nm">土日の訪問</span><span class="pc">${weekend}%</span></div>`:""}
    ${topFlavor?`<div class="insight">💡 あなたは<b>${esc(topFlavor[0])}</b>の一杯が好きなようです。</div>`:""}
  </div>`;
}

  </div>`;

/* ---------- persistence ---------- */
function persistLocal(){ if(S.mode==="local") lsSet(LS_V,S.visits); }
async function saveVisit(v){
  const clean={...v}; delete clean.newPhotos; clean.updatedAt=Date.now();
  if(S.mode==="db"){ await S.db.collection("visits").doc(v.id).set(clean); }
  const i=S.visits.findIndex(x=>x.id===v.id); if(i>=0) S.visits[i]=clean; else S.visits.push(clean);
  if(S.mode==="local" && !lsSet(LS_V,S.visits)) throw {code:"local_full"};
}
async function deleteVisit(id){
  const v=S.visits.find(x=>x.id===id); if(!v) return;
  if(S.mode==="db"){
    await S.db.collection("visits").doc(id).delete();
    if(S.assets) for(const p of v.photos||[]) if(p.a) S.assets.delete(p.a).catch(()=>{});
  }
  S.visits=S.visits.filter(x=>x.id!==id); persistLocal();
}
async function saveProfile(){
  if(S.mode==="db") await S.db.doc("settings/profile").set({...S.profile});
  else lsSet(LS_P,S.profile);
}

/* ---------- photos ---------- */
function resize(file, max, q){
  return new Promise((res,rej)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res({blob:b,dataUrl:null,canvas:c}):rej(),"image/jpeg",q); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej()}; img.src=url;
  });
}
async function storePhoto(file){
  if(S.assets){
    const {blob}=await resize(file,1400,.84);
    const r=await S.assets.upload(blob,{type:"image/jpeg"}); return {a:r.id};
  }
  const {canvas}=await resize(file,560,.7); return {d:canvas.toDataURL("image/jpeg",.7)};
}

/* ---------- events ---------- */
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, id=el.dataset.id;
  switch(a){
    case "tab": tab(v); break;
    case "go": go(v); break;
    case "back": back(); break;
    case "detail": S.detailId=id; go("detail"); break;
    case "pref": S.prefSel = S.prefSel===el.dataset.p?null:el.dataset.p; render(); break;
    case "add-pref": openForm(); S.form.pref=el.dataset.p; go("add"); break;
    case "filter": S.filter=v; render(); break;
    case "sort": S.sort=v; render(); break;
    case "favs": S.filter="お気に入り"; tab("collection"); break;
    case "period": S.period=v; render(); break;
    case "f-genre": syncForm(); S.form.genre=v; render(); break;
    case "f-rate": syncForm(); S.form.rating=+v; render(); break;
    case "f-flavor": { syncForm(); const fl=S.form.flavors; const i=fl.indexOf(v); i>=0?fl.splice(i,1):fl.push(v); render(); break; }
    case "f-rmph": { syncForm(); const k=el.dataset.k; const i=+k.slice(1); if(k[0]==="o") S.form.photos.splice(i,1); else { URL.revokeObjectURL(S.form.newPhotos[i].url); S.form.newPhotos.splice(i,1);} render(); break; }
    case "edit": openForm(S.visits.find(x=>x.id===id),"edit"); go("add"); break;
    case "again": openForm(S.visits.find(x=>x.id===id)); go("add"); break;
    case "fav": { const x=S.visits.find(q=>q.id===id); if(!x) break; try{ await saveVisit({...x,fav:!x.fav}); render(); toast(!x.fav?"お気に入りに追加しました":"お気に入りから外しました"); }catch(err){ toast("保存できませんでした。通信状態を確認してください"); } break; }
    case "del-ask": S.confirmDel=true; render(); break;
    case "del-cancel": S.confirmDel=false; render(); break;
    case "del": try{ await deleteVisit(id); S.confirmDel=false; toast("記録を削除しました"); back(); }catch(err){ toast("削除できませんでした。もう一度お試しください"); } break;
    case "export": {
      const json=JSON.stringify({exportedAt:new Date().toISOString(),profile:S.profile,visits:S.visits},null,2);
      if(S.downloads){ try{ await S.downloads.save({filename:`ramen-map-${today()}.json`,data:json}); toast("書き出しました"); }catch(err){ if(err?.code!=="declined") toast("書き出せませんでした"); } }
      else { try{ await navigator.clipboard.writeText(json); toast("JSONをクリップボードにコピーしました"); }catch(err){ toast("この環境では書き出せません"); } }
      break;
    }
  }
});
function syncForm(){
  const f=S.form; if(!f||!$("#form")) return;
  f.name=$("#f-name").value; f.pref=$("#f-pref").value; f.area=$("#f-area").value; f.date=$("#f-date").value;
  f.price=$("#f-price").value; f.memo=$("#f-memo").value; f.fav=$("#f-fav").checked;
}
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ S.query=e.target.value; if(e.isComposing) return; rerenderSearch(e.target); }
});
document.addEventListener("compositionend", e=>{ if(e.target.id==="q"){ S.query=e.target.value; rerenderSearch(e.target); } });
function rerenderSearch(t){
  const pos=t.selectionStart; render(); const q=$("#q"); q.focus(); try{q.setSelectionRange(pos,pos)}catch(_){}
}
document.addEventListener("change", e=>{
  if(e.target.id==="f-photo"){
    syncForm(); const f=S.form; const room=5-f.photos.length-f.newPhotos.length;
    [...e.target.files].slice(0,room).forEach(file=>f.newPhotos.push({file,url:URL.createObjectURL(file)}));
    if(e.target.files.length>room) toast("写真は5枚までです");
    render();
  }
});
document.addEventListener("submit", async e=>{
  e.preventDefault();
  if(e.target.id==="pform"){
    S.profile={name:$("#p-name").value.trim()||"ラーメン好き",goal:Math.max(1,+$("#p-goal").value||200)};
    try{ await saveProfile(); toast("プロフィールを保存しました"); render(); }catch(err){ toast("保存できませんでした"); }
    return;
  }
  if(e.target.id!=="form"||S.saving) return;
  syncForm(); const f=S.form;
  if(!f.name.trim()){ toast("店名を入力してください"); $("#f-name").focus(); return; }
  if(!f.date){ toast("訪問日を入力してください"); return; }
  S.saving=true; render();
  try{
    const photos=[...f.photos];
    for(const np of f.newPhotos){
      try{ photos.push(await storePhoto(np.file)); }
      catch(err){ toast(err?.code==="too_large"?"写真が大きすぎます":"写真を1枚保存できませんでした"); }
    }
    const rec={id:f.id||("v"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:f.name.trim(),genre:f.genre,flavors:f.flavors,
      pref:f.pref,area:f.area.trim(),date:f.date,rating:f.rating,price:f.price===""?"":+f.price,memo:f.memo.trim(),fav:f.fav,photos,
      createdAt:f.createdAt||Date.now()};
    const firstShop=!S.visits.some(x=>shopKey(x)===shopKey(rec)&&x.id!==rec.id);
    const before=badgeList(stats(S.visits)).filter(b=>b.got).length;
    await saveVisit(rec);
    f.newPhotos.forEach(p=>URL.revokeObjectURL(p.url));
    const after=badgeList(stats(S.visits)).filter(b=>b.got);
    S.saving=false; S.form=null; S.detailId=rec.id; S.stack=[S.view==="add"?"collection":S.view]; S.view="detail"; render(); window.scrollTo(0,0);
    toast(after.length>before?`🏅 バッジ「${after[after.length-1].n}」を獲得！`: f.id?"変更を保存しました": firstShop?`🍜 ${stats(S.visits).shopCount}店目を制覇！`:"記録しました");
  }catch(err){
    S.saving=false; render();
    toast(err?.code==="quota_exceeded"?"保存できる件数の上限に達しました":err?.code==="local_full"?"ブラウザの保存容量がいっぱいです。写真を減らしてください":"保存できませんでした。通信状態を確認してもう一度お試しください");
  }
});

/* ---------- boot ---------- */
S.visits=lsGet(LS_V)||[]; const lp=lsGet(LS_P); if(lp) S.profile=lp;
render();
(async()=>{
  const C=window.claude; if(!C||!C.use) return;
  const [db,assets,downloads]=await Promise.all([C.use("db"),C.use("assets").catch(()=>null),C.use("downloads").catch(()=>null)]);
  S.assets=assets; S.downloads=downloads;
  if(!db){ render(); return; }
  S.db=db; S.mode="db";
  db.collection("visits").onSnapshot(snap=>{
    S.visits=snap.docs.map(d=>({...d.data(),id:d.id}));
    if(S.view!=="add") render();
  },()=>{});
  db.doc("settings/profile").onSnapshot(snap=>{
    if(snap.exists){ S.profile={...S.profile,...snap.data()}; if(S.view!=="add") render(); }
  },()=>{});
})();
})();
</script>
