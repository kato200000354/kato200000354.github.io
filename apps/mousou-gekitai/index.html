<title>妄想げきたい！3年2組</title>
<meta name="description" content="教室に入ってきた不審者を、100種類のおバカな撃退法で追い返す3Dゲーム。選ぶだけで結果がすぐ出る、1回1〜2分の小学生の妄想。全部見つけて撃退ずかんを埋めよう！">

<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#20352b;color:#2b2622;font-family:"Yomogi","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:fixed;inset:0;transition:filter .25s}
#stage canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 12px)}
#hud{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000}
#hud b{font-family:"Dela Gothic One",sans-serif;font-weight:400}
#mute{pointer-events:auto;background:#0006;border:1px solid #fff8;color:#fff;border-radius:8px;width:36px;height:32px;font-size:15px}
#hint{margin-top:8px;max-width:520px;width:100%;text-align:center;background:#fffdf0ee;border:2.5px solid #2b2622;border-radius:10px;padding:6px 10px;font-size:17px;font-weight:700;line-height:1.3}
#hint .nm{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:18px;color:#c9302c}
#hint .nm small{font-family:"Yomogi",sans-serif;font-size:13px;color:#6a5f52;margin-left:6px;font-weight:700}
#hint .hn{font-size:15px;color:#1f6a44;margin-top:2px}
#tele{margin-top:6px;text-align:center;color:#fff;text-shadow:3px 3px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;animation:tele .3s ease-out}
#tele small{display:block;font-size:17px;margin-bottom:4px}
#tele strong{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(23px,7.2vw,40px);line-height:1.15}
#tele em{display:block;font-style:normal;font-size:16px;margin-top:4px;color:#ffd23f}
@keyframes tele{from{transform:translateX(-30px) skewX(-12deg);opacity:0}}
#spacer{flex:1}
#say{pointer-events:auto;width:100%;max-width:520px;background:#fffdf0;border:3px solid #2b2622;border-radius:14px;box-shadow:4px 4px 0 #2b2622;padding:10px 14px 24px;font-size:19px;line-height:1.45;min-height:92px;position:relative;animation:pop .14s ease-out}
#say b{display:inline-block;background:#2b2622;color:#fffdf0;border-radius:6px;padding:0 8px;font-size:14px;margin-bottom:3px;font-weight:400}
#say u{position:absolute;right:10px;bottom:4px;text-decoration:none;font-size:13px;color:#8a7f70;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes pop{from{transform:scale(.9)}}
#btns{pointer-events:auto;width:100%;max-width:520px;display:flex;gap:8px}
#btns.col{flex-direction:column}
#btns button{flex:1;font-family:inherit;color:#2b2622;background:#fffdf0;border:3px solid #2b2622;border-radius:12px;box-shadow:3px 3px 0 #2b2622;font-size:18px;padding:10px;font-weight:700;line-height:1.3;touch-action:manipulation;min-height:54px}
#btns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2b2622}
#btns button.big{font-size:42px;padding:8px 2px;min-height:78px}
#btns button.card{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px}
#btns button.card span{font-size:32px;line-height:1}
#btns button.card div{flex:1}
#btns button.card small{display:block;font-size:14px;color:#6a5f52;font-weight:400}
#btns button.go{background:#ffd23f}
#btns button.undo{background:#ffb4a8}
#btns button.card.lg{background:linear-gradient(100deg,#ffe98a,#ffc6e4,#b8ecff)}
#btns button.card small b{color:#c9302c}
#res{pointer-events:auto;width:100%;max-width:520px;background:#fffdf0;border:3px solid #2b2622;border-radius:14px;box-shadow:4px 4px 0 #2b2622;padding:10px 14px 24px;position:relative;animation:pop .14s ease-out}
#res .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
#res .stamp{font-family:"Dela Gothic One",sans-serif;font-size:27px;line-height:1.1;transform:rotate(-3deg)}
#res .great{color:#c9302c}#res .ok{color:#2a55c0}#res .ng{color:#6a5f52}#res .legend{color:#c07a00}
#res .new{background:#c9302c;color:#fff;font-size:13px;border-radius:5px;padding:1px 6px}
#res .mn{font-size:15px;color:#4a4238}
#res p{font-size:20px;line-height:1.45}
#res u{position:absolute;right:10px;bottom:4px;text-decoration:none;font-size:13px;color:#8a7f70;animation:blink 1s infinite}
#pops{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;top:38%;font-family:"Dela Gothic One",sans-serif;white-space:nowrap;-webkit-text-stroke:2px #000;paint-order:stroke;text-shadow:4px 4px 0 #000;animation:bigpop .95s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes bigpop{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.2)}18%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.1)}75%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) rotate(var(--r)) scale(1)}}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;background:#fff;opacity:0}
.panel{pointer-events:auto;position:fixed;inset:0;z-index:5;display:flex;align-items:flex-start;justify-content:center;padding:14px;background:#0007;overflow:auto;touch-action:pan-y}
.paper{margin:auto;width:100%;max-width:440px;background:#f4eedd;color:#221d18;border:2px solid #221d18;box-shadow:6px 6px 0 #0008;padding:12px 14px;transform:rotate(-1.2deg);animation:spin-in .4s cubic-bezier(.2,1.3,.5,1);font-family:"Yomogi",serif}
@keyframes spin-in{from{transform:rotate(-400deg) scale(.1)}}
.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #221d18;padding-bottom:3px;margin-bottom:8px}
.mast b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:22px}
.mast small{font-size:12px}
.hl{font-family:"Dela Gothic One",sans-serif;font-size:clamp(21px,6.6vw,29px);line-height:1.25;margin-bottom:8px}
.bonus{display:inline-block;background:#c9302c;color:#fff;font-size:14px;padding:1px 8px;margin-bottom:6px}
.paper p{font-size:16px;line-height:1.5;margin-bottom:6px}
.rw{border:2px dashed #221d18;padding:5px 8px;font-size:16px;margin:8px 0}
.next{display:block;width:100%;font-family:inherit;font-weight:700;font-size:18px;background:#ffd23f;color:#221d18;border:3px solid #221d18;border-radius:10px;padding:10px;margin-top:8px;box-shadow:3px 3px 0 #221d18;touch-action:manipulation}
.next.sub{background:#fff;font-size:16px}
#title{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;pointer-events:auto;background:linear-gradient(#0000 0 30%,#0005)}
#title h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:#ffd23f;font-size:clamp(34px,11.4vw,72px);line-height:1.05;text-align:center;white-space:nowrap;-webkit-text-stroke:2px #000;paint-order:stroke;text-shadow:5px 5px 0 #000;transform:rotate(-3deg)}
#title h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;color:#fff;font-size:clamp(20px,7vw,34px);-webkit-text-stroke:1.5px #000;paint-order:stroke;text-shadow:3px 3px 0 #000;margin:8px 0 12px;transform:rotate(-3deg)}
.note{width:100%;max-width:400px;background:#fffdf0 repeating-linear-gradient(#0000 0 29px,#9fc2e0 29px 30px);border:3px solid #2b2622;border-radius:6px;box-shadow:5px 5px 0 #2b2622;padding:10px 14px;font-size:17px;line-height:30px;transform:rotate(.8deg)}
.note label{display:flex;align-items:center;gap:6px;margin-top:4px}
.note input{flex:1;min-width:0;font-family:inherit;font-size:18px;padding:2px 8px;border:2px solid #2b2622;border-radius:6px;background:#fff;color:#2b2622;touch-action:manipulation;user-select:text;-webkit-user-select:text}
.note .next{line-height:1.3}
#best{margin-top:8px;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
.rank{font-family:"Dela Gothic One",sans-serif;font-size:clamp(25px,7.5vw,34px);color:#c9302c;line-height:1.2;margin:4px 0}
.logs{font-size:14px;line-height:1.5;margin:6px 0;padding-left:1.7em;max-height:26vh;overflow:auto;touch-action:pan-y}
#zukan{z-index:7;background:#20352bf2}
.zk{margin:auto;width:100%;max-width:560px;background:#f4eedd;border:2px solid #221d18;padding:10px 12px;color:#221d18}
.zh{display:flex;align-items:center;gap:10px;border-bottom:3px double #221d18;padding-bottom:6px}
.zh b{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:22px}
.zh span{flex:1;font-size:17px}
.zh button{font-family:inherit;font-size:15px;font-weight:700;color:#221d18;background:#ffd23f;border:2px solid #221d18;border-radius:8px;padding:6px 12px}
#zkInfo{position:sticky;top:-14px;background:#fffdf0;border:2px solid #221d18;border-radius:8px;padding:6px 10px;margin:8px 0;font-size:15px;line-height:1.45;min-height:74px;z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.grid button{font-family:inherit;color:#221d18;background:#fffdf0;border:2px solid #221d18;border-radius:8px;padding:5px 3px;font-size:13px;font-weight:700;line-height:1.25;min-height:70px;touch-action:pan-y}
.grid button span{display:block;font-size:24px;line-height:1.2}
.grid button.un{background:#d8d0ba;color:#7a7264;border-color:#9a917f}
.grid button.lg{background:linear-gradient(120deg,#ffe98a,#ffc6e4,#b8ecff)}
#err{position:fixed;inset:0;z-index:9;background:#20352b;color:#fff;padding:24px;font-size:18px;line-height:1.6}
</style>

<div id="stage"></div>
<div id="flash"></div>
<div id="ui">
  <div id="hud" hidden><div><span id="prins"></span></div><div><span id="wv"></span>　<b id="sc">0</b>点</div><button id="mute" aria-label="音の切り替え">♪</button></div>
  <div id="hint" hidden></div>
  <div id="tele" hidden></div>
  <div id="spacer"></div>
  <div id="res" hidden></div>
  <div id="say" hidden></div>
  <div id="btns" hidden></div>
</div>
<div id="pops"></div>
<div id="paperWrap" class="panel" hidden></div>
<div id="zukan" class="panel" hidden></div>
<div id="title">
  <h1>妄想げきたい！</h1>
  <h2>3年2組</h2>
  <div class="note">
    もし今、教室に不審者が来たら……？<br>100種類の撃退法で 追い返せ！
    <label>きみの名前 <input id="nameIn" maxlength="6" value="たろう" aria-label="きみの名前"></label>
    <button class="next" id="startBtn">妄想をはじめる</button>
    <button class="next sub" id="zukanBtn">撃退ずかん</button>
  </div>
  <div id="best"></div>
</div>
<div id="err" hidden>ゲームを読み込めませんでした。通信のよい場所でページを開き直してください。</div>
