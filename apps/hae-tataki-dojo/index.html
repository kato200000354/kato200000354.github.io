<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ハエたたき道場｜30秒で反射神経年齢がわかる</title>
<meta name="description" content="30秒でハエをたたきまくれ！ハチはたたくな！結果で「反射神経年齢」と段位がわかる、ハエたたきゲーム。友だちに挑戦状を送ろう。">
<meta property="og:title" content="ハエたたき道場｜30秒で反射神経年齢がわかる">
<meta property="og:description" content="ハエをたたけ。ハチはたたくな。あなたの反射神経は何歳？">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#3b2a1a">
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2a1a;color:#2a1c10;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","HGS明朝E",serif;font-weight:900}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;pointer-events:none;z-index:5}
#hudRow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;color:#fff;text-shadow:0 2px 0 #3b2a1a,0 0 6px #3b2a1a}
#score{font-size:28px;font-weight:900;line-height:1}
#score small{font-size:12px;margin-left:2px}
#time{font-size:28px;font-weight:900;line-height:1;min-width:64px;text-align:right}
#time.low{color:#ff5a3c}
#pauseBtn{pointer-events:auto;flex:none;width:40px;height:40px;border-radius:50%;border:2px solid #f4ead0;
  background:rgba(59,42,26,.8);color:#fff;font-size:16px;font-weight:900;line-height:1;padding:0;margin-left:2px;align-self:center;font-family:inherit}
#pauseBtn:disabled{opacity:.4}
#pause .panel{text-align:center}
#pause h2{margin:0 0 6px;font-size:34px;color:#3b2a1a}
#pauseInfo{font-size:14px;font-weight:700;color:#6b5234;margin-bottom:6px}
#combo{font-size:15px;font-weight:900;color:#ffe45c;min-height:20px;text-align:center;flex:1}
#bar{height:8px;border-radius:4px;background:rgba(59,42,26,.55);margin-top:5px;overflow:hidden}
#barIn{height:100%;width:100%;background:linear-gradient(90deg,#ffb52e,#ff5a3c);transform-origin:left}
#big{position:fixed;left:0;right:0;top:38%;text-align:center;font-size:72px;color:#fff;
  text-shadow:0 4px 0 #b3261e,0 0 18px rgba(0,0,0,.6);pointer-events:none;z-index:6}

/* 画面 */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
  overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));
  background:rgba(40,27,15,.78);-webkit-overflow-scrolling:touch}
.panel{width:100%;max-width:400px;background:#f4ead0;border:4px solid #3b2a1a;border-radius:14px;
  padding:18px 16px;box-shadow:0 8px 0 rgba(0,0,0,.35);margin:auto 0}
h1{margin:0;text-align:center;font-size:clamp(28px,9vw,40px);line-height:1.1;color:#3b2a1a;letter-spacing:0;white-space:nowrap}
h1 span{display:block;font-size:15px;color:#b3261e;letter-spacing:.2em;margin-bottom:4px}
.lead{text-align:center;font-size:14px;font-weight:700;margin:10px 0 12px;line-height:1.6}
.rules{display:grid;gap:6px;margin:0 0 14px}
.rule{display:flex;align-items:center;gap:10px;background:#fff8e3;border:2px solid #d8c592;border-radius:10px;padding:4px 10px 4px 4px;font-size:14px;font-weight:700;line-height:1.35}
.rule canvas{width:48px;height:48px;flex:none}
.rule b{color:#b3261e}
.rule.ng{background:#ffe3dc;border-color:#e08a78}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 10px;font-size:19px;font-weight:900;
  font-family:inherit;color:#fff;background:#b3261e;box-shadow:0 5px 0 #6e130e;cursor:pointer;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6e130e}
.btn.sub{background:#3b2a1a;box-shadow:0 5px 0 #17100a;font-size:16px;padding:13px 10px}
.btn.x{background:#111;box-shadow:0 5px 0 #000;font-size:16px;padding:13px 10px}
.btn.ghost{background:#fff8e3;color:#3b2a1a;box-shadow:0 5px 0 #d8c592;font-size:15px;padding:12px 10px}
.row{display:flex;gap:8px}.row .btn{flex:1}
#vsBanner,#vsResult{background:#3b2a1a;color:#ffe45c;border-radius:10px;padding:9px 10px;text-align:center;font-size:14px;font-weight:900;margin-bottom:12px;line-height:1.5}
#best{text-align:center;font-size:13px;font-weight:700;margin-top:12px;color:#6b5234}
#sound{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;width:44px;height:44px;border-radius:50%;
  border:2px solid #f4ead0;background:rgba(59,42,26,.8);color:#fff;font-size:20px;line-height:1;padding:0}

/* 結果 */
.ageLabel{text-align:center;font-size:15px;font-weight:900;letter-spacing:.2em;color:#6b5234}
#age{text-align:center;font-size:84px;line-height:1;color:#b3261e;margin:2px 0 4px}
#age small{font-size:30px;margin-left:2px}
#ageMsg{text-align:center;font-size:14px;font-weight:700;line-height:1.5;margin-bottom:10px}
#rankBox{text-align:center;margin-bottom:10px}
#rank{display:inline-block;border:3px solid #b3261e;color:#b3261e;border-radius:8px;padding:4px 14px;font-size:24px;transform:rotate(-3deg);background:#fff8e3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.stat{background:#fff8e3;border:2px solid #d8c592;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;color:#6b5234}
.stat b{display:block;font-size:20px;color:#2a1c10;line-height:1.2}
#newBest{text-align:center;color:#b3261e;font-weight:900;font-size:14px;margin-bottom:8px}
#card{display:block;width:100%;border-radius:8px;border:2px solid #3b2a1a;margin-top:12px}
.note{font-size:11px;color:#6b5234;text-align:center;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div id="hudRow">
    <div id="score">0<small>点</small></div>
    <div id="combo"></div>
    <div id="time">30.0</div>
    <button id="pauseBtn" aria-label="一時停止">Ⅱ</button>
  </div>
  <div id="bar"><div id="barIn"></div></div>
</div>
<div id="big" class="mincho" hidden></div>

<!-- タイトル -->
<div id="title" class="screen">
  <div class="panel">
    <div id="vsBanner" hidden></div>
    <h1 class="mincho"><span>反射神経年齢がわかる</span>ハエたたき道場</h1>
    <p class="lead">制限時間は30秒。<br>画面をタップして、ハエをたたきまくれ！</p>
    <div class="rules">
      <div class="rule"><canvas id="icFly" width="96" height="96"></canvas><div><b>ハエ</b>をたたく。続けて当てるとコンボで点が増える</div></div>
      <div class="rule"><canvas id="icGold" width="96" height="96"></canvas><div><b>金バエ</b>は1000点＋時間が2秒ふえる</div></div>
      <div class="rule ng"><canvas id="icBee" width="96" height="96"></canvas><div><b>ハチはたたくな！</b>刺されて3秒へる</div></div>
    </div>
    <button id="startBtn" class="btn">稽古をはじめる</button>
    <div id="best"></div>
  </div>
</div>

<!-- 一時停止 -->
<div id="pause" class="screen" hidden>
  <div class="panel">
    <h2 class="mincho">一時停止</h2>
    <div id="pauseInfo"></div>
    <button id="resumeBtn" class="btn">つづける</button>
    <button id="restartBtn" class="btn sub">最初からやりなおす</button>
    <button id="pauseTitleBtn" class="btn ghost">タイトルへ戻る</button>
  </div>
</div>

<!-- 結果 -->
<div id="result" class="screen" hidden>
  <div class="panel">
    <div id="vsResult" hidden></div>
    <div class="ageLabel">あなたの反射神経年齢</div>
    <div id="age" class="mincho">--<small>歳</small></div>
    <div id="ageMsg"></div>
    <div id="rankBox"><span id="rank" class="mincho"></span></div>
    <div id="newBest" hidden>自己ベスト更新！</div>
    <div class="stats">
      <div class="stat">スコア<b id="stScore">0</b></div>
      <div class="stat">たたいた数<b id="stKills">0</b></div>
      <div class="stat">命中率<b id="stAcc">0%</b></div>
      <div class="stat">最大コンボ<b id="stCombo">0</b></div>
    </div>
    <button id="shareBtn" class="btn" hidden>結果を画像つきでシェア</button>
    <div class="row">
      <button id="xBtn" class="btn x">Xにポスト</button>
      <button id="copyBtn" class="btn sub">挑戦状をコピー</button>
    </div>
    <button id="retryBtn" class="btn">もう一回</button>
    <button id="titleBtn" class="btn sub">タイトルへ戻る</button>
    <img id="card" alt="結果カード">
    <button id="saveBtn" class="btn ghost">この画像を保存</button>
    <div class="note">挑戦状のリンクを開いた人には、あなたの点数が「こえる目標」として表示されます。</div>
  </div>
</div>

<button id="sound" aria-label="音の切りかえ">🔊</button>
