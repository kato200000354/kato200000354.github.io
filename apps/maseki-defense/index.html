<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#140f26">
<title>まぜまぜ魔石ディフェンス</title>
<meta name="description" content="同じ魔石を重ねて合成！パーク・ボス・永久強化・デイリーミッションでやめ時がなくなるタワーディフェンス">
<style>[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#140f26;--panel:#221a3d;--panel2:#2e2452;--txt:#f4efff;--sub:#b3a8d6;--acc:#a46bff;--gold:#ffd25a;--ok:#5be39a;--ng:#ff5a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,calc(100dvh*4/7));aspect-ratio:4/7;max-height:100dvh;overflow:hidden;background:#0d0a1a}
canvas{width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:16px;background:rgba(14,10,28,.94);touch-action:pan-y}
.screen.on{display:flex}
.logo{margin-top:6%;text-align:center;line-height:1.05}
.logo .a{font-size:20px;color:var(--sub);letter-spacing:.2em}
.logo .b{font-size:40px;font-weight:800;background:linear-gradient(90deg,#ff7a5a,#ffd25a,#7dff9a,#5ad1ff,#c08bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000)}
.gemrow{display:flex;gap:6px;justify-content:center;margin:14px 0}
.gm{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.4)}
.float{animation:fl 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.info{display:flex;gap:10px;margin:8px 0 14px}
.chip{background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.btn{position:relative;width:100%;max-width:300px;margin:6px 0;padding:13px;border:none;border-radius:14px;background:var(--panel2);color:var(--txt);font:inherit;font-size:17px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.4);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.main{background:linear-gradient(180deg,#b57dff,#7a3cf0);font-size:22px;padding:16px}
.btn.gold{background:linear-gradient(180deg,#ffd25a,#e89a1c);color:#3a2300}
.btn.sm{font-size:14px;padding:9px;max-width:140px}
.btn:disabled{opacity:.45}
.badge{position:absolute;top:-6px;right:-6px;background:var(--ng);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:13px;line-height:22px;padding:0 6px}
.row{display:flex;gap:8px;width:100%;max-width:300px}
.row .btn{flex:1}
h2{margin:6px 0 4px;font-size:22px}
.subt{color:var(--sub);font-size:13px;margin-bottom:10px;text-align:center}
.list{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px}
.item .ic{font-size:26px;width:36px;text-align:center}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:15px}
.item .ds{font-size:12px;color:var(--sub)}
.item .btn{width:auto;margin:0;padding:8px 10px;font-size:13px;white-space:nowrap}
.bar{height:6px;background:#0006;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.done{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:360px;margin-bottom:12px}
.card{background:var(--panel);border-radius:12px;padding:10px;text-align:center;border:3px solid transparent;cursor:pointer}
.card.sel{border-color:var(--gold);background:#3a2e14}
.card.lock{opacity:.75}
.card .gm{margin:0 auto 6px;width:44px;height:44px;font-size:22px}
.card .nm{font-weight:800}
.card .ds{font-size:11px;color:var(--sub);min-height:28px}
.card .st{font-size:12px;color:var(--gold)}
.slots{display:flex;gap:8px;margin:4px 0 12px}
.slots .gm{width:46px;height:46px;font-size:22px}
.slots .empty{width:46px;height:46px;border-radius:9px;border:2px dashed #fff4}
.coins{font-size:16px;color:var(--gold);font-weight:800;margin-bottom:8px}
#perk .cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin:10px 0}
.pk{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:12px;border:3px solid #6c6a80;cursor:pointer;animation:pin .35s backwards}
.pk:nth-child(2){animation-delay:.08s}.pk:nth-child(3){animation-delay:.16s}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.pk.R{border-color:#4aa0ff;background:#17284a}
.pk.E{border-color:#ffb02e;background:#3a2a10;box-shadow:0 0 18px #ffb02e66}
.pk .ic{font-size:30px;width:44px;text-align:center}
.pk .nm{font-weight:800;font-size:16px}
.pk .ds{font-size:13px;color:var(--sub)}
.pk .rr{font-size:11px;font-weight:800}
.big{font-size:52px;font-weight:800;margin:4px 0;color:var(--gold);text-shadow:0 3px 0 #000}
.rec{color:#ff5af0;font-weight:800;font-size:20px;animation:fl 1s infinite}
.stats{width:100%;max-width:300px;background:var(--panel);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14px}
.stats div{display:flex;justify-content:space-between;padding:3px 0}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;z-index:9}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0009;z-index:8}
#modal.on{display:flex}
#modal .box{background:var(--panel);border-radius:18px;padding:20px;width:84%;max-width:320px;text-align:center;animation:pin .3s}
.help{font-size:13px;line-height:1.7;text-align:left;width:100%;max-width:340px;background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.help b{color:var(--gold)}
</style>
</head>
<body>
<div id="app">
<canvas id="cv"></canvas>

<div id="title" class="screen on">
  <div class="logo"><div class="a">まぜまぜ</div><div class="b">魔石<br>ディフェンス</div></div>
  <div class="gemrow" id="tgems"></div>
  <div class="info"><span class="chip">🏆 ベスト WAVE <b id="tbest">0</b></span><span class="chip">🪙 <b id="tcoin">0</b></span></div>
  <button class="btn main" id="bStart">▶ スタート</button>
  <div class="row"><button class="btn" id="bDeck">🎴 デッキ</button><button class="btn" id="bShop">⚒️ 強化</button></div>
  <div class="row"><button class="btn" id="bMis">📜 ミッション<span class="badge" id="bdM"></span></button><button class="btn" id="bAch">🏆 実績<span class="badge" id="bdA"></span></button></div>
  <div class="row"><button class="btn" id="bHelp">❓ 遊び方</button><button class="btn" id="bSnd">🔊 音 ON</button></div>
</div>

<div id="sub" class="screen"></div>

<div id="perk" class="screen">
  <h2 id="pkTitle">パークを選ぼう！</h2>
  <div class="subt" id="pkSub">ひとつ選ぶとこのランの間ずっと効果がある</div>
  <div class="cards" id="pkCards"></div>
  <button class="btn sm" id="pkReroll">🔄 リロール</button>
</div>

<div id="pause" class="screen">
  <h2 style="margin-top:20%">一時停止</h2>
  <div class="subt">取得したパーク</div>
  <div class="list" id="pzPerks"></div>
  <button class="btn main" id="pzResume">▶ 再開</button>
  <button class="btn" id="pzQuit">🏳️ あきらめる</button>
</div>

<div id="result" class="screen"></div>

<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
</div>
