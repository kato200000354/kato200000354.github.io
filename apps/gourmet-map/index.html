<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>飲食店制覇マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E9F0EC;--surface:#FFFFFF;--surface-2:#F2F6F4;--surface-3:#E6EEEA;
  --ink:#16261E;--ink-2:#56675F;--ink-3:#8A9892;--line:#DCE5E0;
  --accent:#1B8456;--accent-2:#136A44;--accent-soft:#DFF1E7;--on-accent:#FFFFFF;
  --star:#F2AE17;--danger:#CC3B31;--danger-soft:#FBE7E5;
  --shadow:0 8px 24px rgba(18,58,38,.14);--shadow-s:0 2px 8px rgba(18,58,38,.10);
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0A;--surface:#111916;--surface-2:#18221E;--surface-3:#202C27;
  --ink:#E4EDE8;--ink-2:#9DAEA6;--ink-3:#6F817A;--line:#26332D;
  --accent:#38B47A;--accent-2:#5CCB95;--accent-soft:#16352A;--on-accent:#06120C;
  --star:#F5BD3A;--danger:#EE6A5F;--danger-soft:#3A1B18;
  --shadow:0 8px 24px rgba(0,0,0,.5);--shadow-s:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C0A;--surface:#111916;--surface-2:#18221E;--surface-3:#202C27;
  --ink:#E4EDE8;--ink-2:#9DAEA6;--ink-3:#6F817A;--line:#26332D;
  --accent:#38B47A;--accent-2:#5CCB95;--accent-soft:#16352A;--on-accent:#06120C;
  --star:#F5BD3A;--danger:#EE6A5F;--danger-soft:#3A1B18;
  --shadow:0 8px 24px rgba(0,0,0,.5);--shadow-s:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}

#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.08)}
.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column}
.view.on{display:flex}
.pad{padding-inline:16px}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--ink-3);font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.2}

/* header */
.hd{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:21px;letter-spacing:.02em}
.hd .sub{font-size:11.5px;color:var(--ink-2)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;fill:none;stroke:var(--on-accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd-title{flex:1;min-width:0}
.hd-center{justify-content:center;text-align:center}

.searchrow{display:flex;gap:8px;padding:0 16px 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}

/* maps */
.mapbox{position:relative;z-index:0;flex:1;min-height:260px}
.mapbox .leaflet-container{position:absolute;inset:0;background:var(--surface-3);font-family:var(--body)}
@media (prefers-color-scheme: dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
.leaflet-control-attribution{font-size:9px!important;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink-3)!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.pin-wrap{background:none;border:0}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.28);border:2.5px solid #fff}
.pin span{transform:rotate(45deg);font-size:17px;line-height:1}
.pin.want{background:#fff;border:2.5px dashed var(--c)}
.pin.hl{outline:3px solid var(--accent);outline-offset:2px}
.map-fab{position:absolute;z-index:500;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-s);display:grid;place-items:center}
.map-fab svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.progress-card{position:absolute;z-index:500;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:26px;flex:none;background-size:cover;background-position:center;overflow:hidden}
.pc-body{flex:1;min-width:0}
.pc-label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.pc-count{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}
.pc-count small{font-size:13px;color:var(--ink-2);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.barrow{display:flex;align-items:center;gap:8px;margin-top:5px}
.barrow b{font-size:12px;color:var(--accent);min-width:34px;text-align:right}

.add-fab{position:absolute;z-index:600;right:14px;bottom:104px;height:48px;padding:0 18px 0 14px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.add-fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.sample-note{position:absolute;z-index:500;top:10px;left:12px;right:60px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-s);padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:8px}
.sample-note span{flex:1;color:var(--ink-2)}
.linkbtn{color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:99px;padding:3px;gap:3px}
.seg button{height:32px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--on-accent)}

.tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs2 button{padding:12px 0 10px;font-weight:700;color:var(--ink-3);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--accent);border-color:var(--accent)}

/* list */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.thumb{width:74px;height:74px;border-radius:12px;background-size:cover;background-position:center;flex:none}
.ph{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--surface)),color-mix(in srgb,var(--c) 70%,var(--surface)));display:grid;place-items:center}
.ph span{font-size:32px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:11.5px;color:var(--ink-2)}
.row-foot{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-2)}
.row-foot .rt{margin-left:auto;font-weight:700;color:var(--ink)}
.chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.star{color:var(--star)}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface-3);color:var(--ink-2)}
.tag.want{background:color-mix(in srgb,var(--star) 22%,var(--surface));color:var(--ink)}
.empty{padding:40px 24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:4px}

/* carousel */
.carousel{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 14px;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--surface)}
.carousel::-webkit-scrollbar{display:none}
.ccard{flex:0 0 150px;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left}
.ccard.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ccard .thumb{width:100%;height:84px;border-radius:0}
.ccard div.cb{padding:7px 10px 9px}
.ccard .row-name{font-size:13px}

/* pages */
.page{position:absolute;inset:0;z-index:2000;background:var(--surface);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s;visibility:hidden;display:flex;flex-direction:column}
.page.on{transform:none;visibility:visible}
.page.up{transform:translateY(100%)}
.page.up.on{transform:none}
.phd{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.phd h2{flex:1;font-size:17px;text-align:center}
.phd .sp{width:38px}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{background:var(--surface-2)}

.hero{position:relative;height:230px;flex:none;background-size:cover;background-position:center}
.hero .ph-in{position:absolute;inset:0}
.hero .ph-in span{font-size:84px}
.hero-btn{position:absolute;top:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.42);display:grid;place-items:center;backdrop-filter:blur(4px)}
.hero-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sec{padding:16px}
.sec+.sec{border-top:8px solid var(--surface-2)}
.sec-title{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.d-name{font-size:23px;line-height:1.3}
.d-meta{color:var(--ink-2);font-size:12.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-rate{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.d-rate b{font-size:18px;color:var(--ink);font-family:var(--display)}
.d-memo{margin:10px 0 0;color:var(--ink);font-size:13.5px;white-space:pre-wrap;max-width:65ch}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{height:48px;border-radius:14px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.sec2{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.grow{flex:1}
.btn.fav-on{border-color:var(--danger);color:var(--danger)}
.btn.fav-on svg{fill:var(--danger)}
.info{display:grid;grid-template-columns:auto auto 1fr;gap:10px 10px;align-items:start;font-size:13px}
.info svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:1.9;margin-top:1px}
.info .k{color:var(--ink-2);white-space:nowrap}
.info .v{word-break:break-all}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery .g{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;position:relative;max-width:100%}
.gallery .g button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1}
.gallery label.g{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:12px;cursor:pointer;text-align:center}
.gallery label.g svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;display:block;margin:0 auto 2px}

/* record */
.celebrate{position:relative;overflow:hidden;padding:28px 16px 18px;text-align:center;background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.celebrate h2{font-size:20px;margin-bottom:14px}
.cel-img{width:130px;height:130px;border-radius:50%;margin:0 auto 12px;background-size:cover;background-position:center;border:5px solid var(--surface);box-shadow:var(--shadow)}
.cel-img.ph span{font-size:60px}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;animation:fall 1.8s ease-out forwards}
@keyframes fall{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(260px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.page{transition:none}}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field .opt{font-weight:400;color:var(--ink-3)}
.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;width:100%;outline:none}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--accent);background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;gap:6px}
.stars button{font-size:32px;line-height:1;color:var(--surface-3);transition:transform .1s}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(1.2)}
.pickmap{height:220px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pickmap .leaflet-container{border-radius:14px}
.hint{font-size:11.5px;color:var(--ink-3)}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.results button{text-align:left;padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface-2)}
.req{color:var(--danger)}

/* genre grid (filter / form) */
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);font-weight:500}
.gbtn .gi{width:50px;height:50px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:grid;place-items:center;font-size:23px;transition:.15s}
.gbtn.on{color:var(--accent);font-weight:700}
.gbtn.on .gi{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* sheet */
.backdrop{position:absolute;inset:0;z-index:3000;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:.25s}
.backdrop.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3001;background:var(--surface);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s;visibility:hidden;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none;visibility:visible}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px;position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-hd h2{font-size:18px}
.sheet .flabel{display:block;margin:14px 0 8px;font-family:var(--display);font-size:14.5px;color:var(--ink)}
.sheet-foot{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* modal confirm */
.modal{position:absolute;z-index:4001;left:24px;right:24px;top:50%;transform:translateY(-50%) scale(.96);background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:.18s}
.modal.on{opacity:1;visibility:visible;transform:translateY(-50%)}
.modal p{margin:0 0 16px;font-size:14px}
.modal .btnrow{margin:0}

.toast{position:absolute;z-index:5000;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* stats */
.bignum{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.1}
.bignum small{font-size:15px;font-weight:700;margin-left:2px}
.bignum .of{font-size:12px;color:var(--ink-2);font-weight:500;margin-left:6px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.stack{display:flex;flex-direction:column;gap:12px;padding:0 16px 20px}
.donut-wrap{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
.donut{width:140px;height:140px;max-width:100%}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-weight:700}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:62px 1fr 30px;gap:8px;align-items:center;font-size:12.5px;text-align:left;width:100%}
.hbar .bar{height:10px}
.hbar b{text-align:right}
.hbar:disabled{cursor:default}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:120px}
.months .m{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--ink-3)}
.months .m i{display:block;width:100%;max-width:18px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.months .m i.zero{background:var(--surface-3)}
.months .m em{font-style:normal;font-size:10px;color:var(--ink-2);font-weight:700}

  radial-gradient(circle at 20% 30%,rgba(255,255,255,.18) 0 18px,transparent 19px),

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
/* ---------- 定数 ---------- */
const GENRES=[
  {k:'ramen',name:'ラーメン',emoji:'🍜',color:'#E0533D'},
  {k:'cafe',name:'カフェ',emoji:'☕',color:'#9A6B4A'},
  {k:'izakaya',name:'居酒屋',emoji:'🏮',color:'#E08A2B'},
  {k:'washoku',name:'和食',emoji:'🍱',color:'#2E8B6E'},
  {k:'yoshoku',name:'洋食',emoji:'🍝',color:'#D4A019'},
  {k:'chuka',name:'中華',emoji:'🥟',color:'#B83B5E'},
  {k:'sushi',name:'寿司',emoji:'🍣',color:'#3F7CC4'},
  {k:'yakiniku',name:'焼肉',emoji:'🥩',color:'#7C4A9E'},
  {k:'sweets',name:'甘味',emoji:'🍰',color:'#E07AA8'},
  {k:'other',name:'その他',emoji:'🍴',color:'#6F7E78'}
];
const GM=Object.fromEntries(GENRES.map(g=>[g.k,g]));
const PREFS=['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];

const DEF={name:'グルメ旅人',bio:'食べることが好きな旅人です。',avatar:'🧑‍🍳',avatarImg:null,goal:500,areaGoal:50,seeded:false};

/* ---------- 保存（IndexedDB） ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('inshokuten-seiha-map',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('shops',{keyPath:'id'});d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));
    t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx('shops','readonly',s=>s.getAll())},
  put(v){return this.tx('shops','readwrite',s=>s.put(v))},
  del(id){return this.tx('shops','readwrite',s=>s.delete(id))},
  get(k){return this.tx('kv','readonly',s=>s.get(k))},
  set(k,v){return this.tx('kv','readwrite',s=>s.put(v,k))}
};
let shops=[],settings={...DEF};
async function saveShop(s){try{if(DB.db)await DB.put(s)}catch(e){toast('保存できませんでした（'+e.message+'）')}}
async function removeShop(id){shops=shops.filter(s=>s.id!==id);try{if(DB.db)await DB.del(id)}catch(e){}}
async function saveSettings(){try{if(DB.db)await DB.set('settings',settings)}catch(e){}}

/* ---------- ユーティリティ ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=d=>d?d.replace(/-/g,'/'):'';
const fmtDateJa=d=>{if(!d)return'';const x=new Date(d+'T00:00');return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日（${'日月火水木金土'[x.getDay()]}）`};
const shortPref=p=>p==='北海道'?p:(p||'').replace(/[都府県]$/,'');
const visited=()=>shops.filter(s=>s.status==='visited');
const byId=id=>shops.find(s=>s.id===id);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function thumb(s,cls='thumb'){const g=GM[s.genre]||GM.other;
  if(s.photos&&s.photos.length)return `<div class="${cls}" style="background-image:url('${s.photos[0]}')"></div>`;
  return `<div class="${cls} ph" style="--c:${g.color}"><span>${g.emoji}</span></div>`}
function place(s){return [shortPref(s.pref),s.area].filter(Boolean).join('・')}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function resizeImg(file,max=900){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=()=>rej(new Error('画像を読み込めませんでした'));im.src=fr.result};
  fr.onerror=()=>rej(fr.error);fr.readAsDataURL(file)})}
function confirmBox(msg,yes='削除する'){return new Promise(res=>{const m=$('#modal');$('#modalMsg').textContent=msg;$('#modalYes').textContent=yes;
  m.classList.add('on');$('#backdrop').classList.add('on');$('#backdrop').dataset.modal='1';
  const done=v=>{m.classList.remove('on');delete $('#backdrop').dataset.modal;if(!$('#sFilter').classList.contains('on'))$('#backdrop').classList.remove('on');res(v)};
  $('#modalYes').onclick=()=>done(true);$('#modalNo').onclick=()=>done(false)})}

  return [
    S('麺や ひなた','ramen','東京都','渋谷',35.6595,139.7005,'visited','2026-09-20',4.5,'濃厚な豚骨スープとコシのある麺。行列ができるけど待つ価値あり。',{price:'¥1,000〜¥1,999',hours:'11:00〜23:00',holiday:'なし',address:'東京都渋谷区道玄坂',fav:true,count:3}),

    S('cafe ことり','cafe','東京都','下北沢',35.6616,139.6680,'visited','2026-08-30',4.3,'窓際の席が落ち着く。自家製プリン。',{price:'〜¥999',hours:'10:00〜19:00',holiday:'水曜',fav:true}),

function pinIcon(s,hl){const g=GM[s.genre]||GM.other;return L.divIcon({className:'pin-wrap',html:`<div class="pin ${s.status}${hl?' hl':''}" style="--c:${g.color}"><span>${g.emoji}</span></div>`,iconSize:[34,40],iconAnchor:[17,38]})}

function fit(m,list){const pts=list.filter(s=>s.lat!=null).map(s=>[s.lat,s.lng]);

      ${rest?`<button class="hbar" disabled><span>その他</span><div class="bar"><i style="width:${rest/pmax*100}%;background:var(--ink-3)"></i></div><b class="num">${rest}</b></button>`:''}${pl.length?'':'<div class="hint">まだ記録がありません</div>'}</div></div>

    <div class="field"><label for="pf-agoal">エリア目標（店）</label><input class="inp num" id="pf-agoal" type="number" min="1" max="9999" value="${settings.areaGoal}"></div></div>
    <button class="btn pri block" id="pf-save">保存する</button></div>`;
    p.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{keep();av=b.dataset.av;img=null;draw()});
    p.querySelector('#pf-img').onchange=async e=>{const f=e.target.files[0];if(!f)return;keep();try{img=await resizeImg(f,300)}catch(err){toast(err.message)}draw()};
    p.querySelector('#pf-save').onclick=async()=>{keep();Object.assign(settings,tmp,{avatar:av,avatarImg:img});await saveSettings();closePage();renderAll();toast('プロフィールを保存しました')}};
  let tmp={name:settings.name,bio:settings.bio,goal:settings.goal,areaGoal:settings.areaGoal};
  const keep=()=>{const n=p.querySelector('#pf-name');if(!n)return;tmp={name:n.value.trim()||DEF.name,bio:p.querySelector('#pf-bio').value.trim(),goal:Math.max(1,+p.querySelector('#pf-goal').value||500),areaGoal:Math.max(1,+p.querySelector('#pf-agoal').value||50)};settings={...settings,...tmp}};
  draw();openPage(p)}

/* ---------- ページ管理 ---------- */
const stack=[];
function openPage(p){if(!stack.includes(p))stack.push(p);p.scrollTop=0;requestAnimationFrame(()=>p.classList.add('on'))}
function closePage(){const p=stack.pop();if(p)p.classList.remove('on')}

/* ---------- 詳細 ---------- */
let curDetail=null;
function openDetail(id){const s=byId(id);if(!s)return;curDetail=id;const g=GM[s.genre]||GM.other;const p=$('#pDetail');

  const ic={clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

    yen:'<svg viewBox="0 0 24 24"><path d="m6 4 6 8 6-8M12 12v8M7 13h10M7 17h10"/></svg>',off:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></svg>'};
  p.innerHTML=`${hero}<button class="hero-btn" style="left:12px" data-act="back" aria-label="戻る"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
    <button class="hero-btn" style="right:12px" data-act="edit" data-id="${s.id}" aria-label="編集"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button></div>
  <div class="sec">
    <h2 class="d-name">${esc(s.name)}</h2>
    <div class="d-meta"><span>${g.name}</span><span>/</span><span>${esc(place(s))}</span>${s.status==='want'?'<span class="tag want">行きたい</span>':''}${s.sample?'<span class="tag">サンプル</span>':''}</div>
    ${s.status==='visited'?`<div class="d-rate">${s.rating?`<span class="star" style="font-size:18px">★</span><b class="num">${s.rating.toFixed(1)}</b>`:'<span>評価なし</span>'}<span class="num">来店 ${s.visitCount||1}回</span>${s.price?`<span>${esc(s.price)}</span>`:''}</div>`:''}
    ${s.memo?`<p class="d-memo">${esc(s.memo)}</p>`:''}
    <div class="btnrow">${s.status==='visited'
      ?`<button class="btn pri grow" data-act="record" data-id="${s.id}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>また行った！</button>`
      :`<button class="btn pri grow" data-act="record" data-id="${s.id}"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>行ったよ！（記録する）</button>`}
      <button class="btn sec2${s.favorite?' fav-on':''}" data-act="fav" data-id="${s.id}" aria-pressed="${!!s.favorite}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>お気に入り</button></div>
  </div>
  <div class="sec"><div class="sec-title">基本情報</div><div class="info">
    ${I(ic.cal,'来店日',s.status==='visited'?fmtDateJa(s.visitedDate):'')}${I(ic.clock,'営業時間',s.hours)}${I(ic.off,'定休日',s.holiday)}${I(ic.pin,'住所',s.address||(s.pref+(s.area?' '+s.area:'')))}${I(ic.tag,'ジャンル',g.name)}${I(ic.yen,'予算',s.price)}
  </div>${s.lat!=null?`<button class="btn sec2 block" style="margin-top:14px" data-act="showOnMap" data-id="${s.id}">地図で見る</button>`:''}</div>
  <div class="sec"><div class="sec-title">写真 <span class="hint num">${(s.photos||[]).length}枚</span></div><div class="gallery">
    ${(s.photos||[]).map((ph,i)=>`<div class="g" style="background-image:url('${ph}')"><button data-act="delPhoto" data-id="${s.id}" data-v="${i}" aria-label="写真を削除">×</button></div>`).join('')}

    try{for(const f of files){s.photos=(s.photos||[]).concat(await resizeImg(f))}await saveShop(s);openDetail(s.id);renderAll();toast(`写真を${files.length}枚追加しました`)}catch(err){toast(err.message)}};
  openPage(p)}

/* ---------- 記録（行った！） ---------- */
async function openRecord(id){const s=byId(id);if(!s)return;const before=earned();const wasWant=s.status!=='visited';
  s.status='visited';s.visitedDate=todayStr();s.visitCount=(s.visitCount||0)+1;s.sample=false;await saveShop(s);renderAll();
  const newly=BADGES.filter(b=>earned().has(b.id)&&!before.has(b.id));
  let rating=s.rating?Math.round(s.rating):0;const p=$('#pRecord');const g=GM[s.genre]||GM.other;
  const cols=['#E0533D','#F2AE17','#1B8456','#3F7CC4','#E07AA8','#7C4A9E'];
  const conf=Array.from({length:36},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%6]};animation-delay:${Math.random()*.5}s;transform:rotate(${Math.random()*180}deg)"></i>`).join('');
  const img=s.photos&&s.photos.length?`<div class="cel-img" style="background-image:url('${s.photos[0]}')"></div>`:`<div class="cel-img ph" style="--c:${g.color}"><span>${g.emoji}</span></div>`;
  p.innerHTML=`<div class="phd"><button class="back" data-act="back" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><h2>記録</h2><span class="sp"></span></div>
  <div class="celebrate"><div class="confetti">${conf}</div><h2>${wasWant?'このお店を記録しました！':`${s.visitCount}回目の来店を記録しました！`}</h2>${img}
    <h3 style="font-size:19px">${esc(s.name)}</h3><div class="hint">${g.name} / ${esc(place(s))}</div>
    ${newly.length?`<div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${newly.map(b=>`<span class="tag want">🏅 ${b.name} を獲得</span>`).join('')}</div>`:''}</div>
  <div class="sec">
    <div class="field"><label for="r-date">来店日</label><input class="inp" type="date" id="r-date" value="${s.visitedDate}" max="${todayStr()}"></div>
    <div class="field"><label for="r-memo">メモ <span class="opt">（任意）</span></label><textarea class="inp" id="r-memo" placeholder="とんこつが濃厚で最高でした！また行きたい。">${esc(s.memo)}</textarea></div>
    <div class="field"><span class="flabel">評価 <span class="opt">（任意）</span></span><div class="stars" id="r-stars"></div></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px"><button class="btn pri block" id="r-save">保存する</button><button class="btn sec2 block" id="r-more">続けて他のお店を探す</button></div>
  </div>`;
  starWidget(p.querySelector('#r-stars'),rating,v=>rating=v);
  const commit=async()=>{s.visitedDate=p.querySelector('#r-date').value||todayStr();s.memo=p.querySelector('#r-memo').value.trim();s.rating=rating;await saveShop(s);renderAll()};
  p.querySelector('#r-save').onclick=async()=>{await commit();closePage();openDetail(s.id);toast('記録を保存しました')};
  p.querySelector('#r-more').onclick=async()=>{await commit();while(stack.length)closePage();switchTab('home');toast('記録を保存しました')};
  openPage(p)}
function starWidget(el,val,onChange){const draw=()=>{el.innerHTML=[1,2,3,4,5].map(i=>`<button type="button" class="${i<=val?'on':''}" data-v="${i}" aria-label="${i}つ星">★</button>`).join('')};
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=+b.dataset.v;val=val===v?0:v;onChange(val);draw()};draw()}

/* ---------- 追加・編集フォーム ---------- */
function openForm(id){const s=id?byId(id):null;const p=$('#pForm');
  const d=s?{...s}:{name:'',genre:'ramen',pref:'東京都',area:'',address:'',lat:null,lng:null,status:'visited',visitedDate:todayStr(),rating:0,memo:'',price:'',hours:'',holiday:'',photos:[]};

  p.innerHTML=`<div class="phd"><button class="back" data-act="back" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><h2>${s?'お店を編集':'お店を追加'}</h2><span class="sp"></span></div>

    <div class="field"><span class="flabel">ジャンル</span><div class="ggrid" id="f-genre">${GENRES.map(g=>`<button type="button" class="gbtn${d.genre===g.k?' on':''}" data-v="${g.k}"><span class="gi">${g.emoji}</span>${g.name}</button>`).join('')}</div></div>
    <div class="field"><span class="flabel">状態</span><div class="seg" id="f-status"><button type="button" data-v="visited" class="${d.status==='visited'?'on':''}">行った</button><button type="button" data-v="want" class="${d.status==='want'?'on':''}">行きたい</button></div></div>
    <div class="grid2"><div class="field"><label for="f-pref">都道府県</label><select class="inp" id="f-pref">${PREFS.map(x=>`<option${x===d.pref?' selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="f-area">エリア <span class="opt">（駅・街）</span></label><input class="inp" id="f-area" maxlength="30" value="${esc(d.area)}" placeholder="例：渋谷"></div></div>
    <div class="field"><span class="flabel">場所 <span class="opt">（地図をタップしてピンを置く）</span></span>
      <div style="display:flex;gap:8px"><input class="inp" id="f-q" placeholder="店名や住所で場所を検索" autocomplete="off"><button type="button" class="btn sec2" id="f-search" style="height:44px">検索</button></div>
      <div class="results" id="f-results" hidden></div>
      <div class="pickmap" id="pickMap"></div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span class="hint" id="f-pos">${d.lat!=null?'ピン設置済み':'まだピンが置かれていません'}</span><button type="button" class="linkbtn" id="f-here">現在地を使う</button></div></div>
    <div class="field"><label for="f-address">住所 <span class="opt">（任意）</span></label><input class="inp" id="f-address" maxlength="120" value="${esc(d.address)}"></div>
    <div id="f-visited" ${d.status==='visited'?'':'hidden'}>
      <div class="grid2"><div class="field"><label for="f-date">来店日</label><input class="inp" type="date" id="f-date" value="${d.visitedDate||todayStr()}" max="${todayStr()}"></div>
      <div class="field"><span class="flabel">評価</span><div class="stars" id="f-stars" style="gap:2px"></div></div></div></div>
    <div class="field"><label for="f-memo">メモ <span class="opt">（任意）</span></label><textarea class="inp" id="f-memo" placeholder="味の感想、おすすめメニューなど">${esc(d.memo)}</textarea></div>
    <div class="grid2"><div class="field"><label for="f-price">予算</label><select class="inp" id="f-price"><option value="">未設定</option>${PRICES.map(x=>`<option${x===d.price?' selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label for="f-hours">営業時間</label><input class="inp" id="f-hours" maxlength="40" value="${esc(d.hours)}" placeholder="11:00〜23:00"></div></div>
    <div class="field"><label for="f-holiday">定休日</label><input class="inp" id="f-holiday" maxlength="30" value="${esc(d.holiday)}" placeholder="例：月曜"></div>

    <button class="btn pri block" type="submit">${s?'変更を保存':'登録する'}</button>

  p.querySelector('#f-status').onclick=e=>{const b=e.target.closest('button');if(!b)return;status=b.dataset.v;p.querySelectorAll('#f-status button').forEach(x=>x.classList.toggle('on',x===b));p.querySelector('#f-visited').hidden=status!=='visited'};
  starWidget(p.querySelector('#f-stars'),rating,v=>rating=v);
  openPage(p);
  // 地図
  setTimeout(()=>{if(maps.pick){maps.pick.remove();maps.pick=null}
    const m=maps.pick=makeMap(p.querySelector('#pickMap'));let mk=null;
    const setPos=(la,ln,zoom)=>{lat=+la.toFixed(6);lng=+ln.toFixed(6);if(mk)mk.setLatLng([lat,lng]);else mk=L.marker([lat,lng],{icon:pinIcon({genre,status}),draggable:true}).on('dragend',e=>{const q=e.target.getLatLng();lat=+q.lat.toFixed(6);lng=+q.lng.toFixed(6)}).addTo(m);
      mk.setIcon(pinIcon({genre,status}));p.querySelector('#f-pos').textContent='ピン設置済み（ドラッグで微調整できます）';if(zoom)m.setView([lat,lng],zoom)};
    if(lat!=null)setPos(lat,lng,16);else if(d._center)m.setView(d._center,13);
    m.on('click',e=>setPos(e.latlng.lat,e.latlng.lng));
    p.querySelector('#f-here').onclick=()=>locate(pos=>setPos(pos[0],pos[1],16));
    const doSearch=async()=>{const q=p.querySelector('#f-q').value.trim()||p.querySelector('#f-name').value.trim();if(!q){toast('検索する言葉を入れてください');return}
      const box=p.querySelector('#f-results');box.hidden=false;box.innerHTML='<button type="button" disabled>検索中…</button>';

        box.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const x=js[+b.dataset.i];setPos(+x.lat,+x.lon,17);box.hidden=true;
          const addr=p.querySelector('#f-address');if(!addr.value)addr.value=x.display_name.split(',').map(t=>t.trim()).reverse().filter(t=>t!=='日本'&&!/^\d{3}-?\d{4}$/.test(t)).join('');
          const pr=PREFS.find(pf=>x.display_name.includes(pf));if(pr)p.querySelector('#f-pref').value=pr}}
      catch(err){box.innerHTML='<button type="button" disabled>検索できませんでした。通信状況を確認するか、地図をタップしてピンを置いてください</button>'}};
    p.querySelector('#f-search').onclick=doSearch;
    p.querySelector('#f-q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doSearch()}};
    p.querySelector('#f-genre').addEventListener('click',()=>mk&&mk.setIcon(pinIcon({genre,status})));
    p.querySelector('#f-status').addEventListener('click',()=>mk&&mk.setIcon(pinIcon({genre,status})));
  },300);
  p.querySelector('#f').onsubmit=async e=>{e.preventDefault();const name=p.querySelector('#f-name').value.trim();
    if(!name){toast('お店の名前を入れてください');p.querySelector('#f-name').focus();return}
    const before=earned();

    if(!s)shops.push(o);await saveShop(o);closePage();renderAll();
    if(s){openDetail(o.id);toast('変更を保存しました')}else{if(o.lat!=null&&cur==='home')maps.home.setView([o.lat,o.lng],15);
      const nb=BADGES.filter(b=>earned().has(b.id)&&!before.has(b.id));toast(nb.length?`登録しました。バッジ「${nb[0].name}」を獲得！`:(o.lat==null?'登録しました（地図のピンは編集から追加できます）':'登録しました'))}};
}

/* ---------- 現在地 ---------- */
function locate(cb){if(!navigator.geolocation){toast('このブラウザでは現在地を取得できません');return}
  toast('現在地を取得しています…');
  navigator.geolocation.getCurrentPosition(p=>cb([p.coords.latitude,p.coords.longitude]),e=>toast(e.code===1?'位置情報の利用が許可されていません':'現在地を取得できませんでした'),{enableHighAccuracy:true,timeout:10000})}
let hereMk={};
function showHere(key){const m=maps[key];if(!m)return;locate(pos=>{if(hereMk[key])hereMk[key].setLatLng(pos);else hereMk[key]=L.circleMarker(pos,{radius:8,color:'#fff',weight:3,fillColor:'#2F7BEA',fillOpacity:1}).addTo(m);m.setView(pos,15)})}

/* ---------- タブ ---------- */
let cur='home';
function switchTab(t){cur=t;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  if(t==='home')setTimeout(()=>maps.home.invalidateSize(),0);
  if(t==='map'){if(!maps.genre){maps.genre=makeMap('genreMap');renderGenreMap(true)}else{renderGenreMap(false);setTimeout(()=>maps.genre.invalidateSize(),0)}}
  if(t==='list')renderList();if(t==='stats')renderStats();if(t==='me')renderMe()}
function renderAll(){renderHome(false);if(cur==='map')renderGenreMap(false);if(cur==='list')renderList();if(cur==='stats')renderStats();if(cur==='me')renderMe()}

/* ---------- イベント ---------- */
const A={
  tab:t=>{while(stack.length)closePage();switchTab(t.dataset.tab)},
  open:(t,id)=>openDetail(id),
  back:()=>closePage(),
  add:()=>openForm(),
  edit:(t,id)=>openForm(id),
  record:(t,id)=>openRecord(id),
  fav:async(t,id)=>{const s=byId(id);s.favorite=!s.favorite;await saveShop(s);openDetail(id);renderAll();toast(s.favorite?'お気に入りに追加しました':'お気に入りから外しました')},
  del:async(t,id)=>{const s=byId(id);if(!await confirmBox(`「${s.name}」を削除しますか？記録と写真は元に戻せません。`))return;await removeShop(id);closePage();renderAll();toast('削除しました')},
  delPhoto:async(t,id)=>{const s=byId(id);if(!await confirmBox('この写真を削除しますか？'))return;s.photos.splice(+t.dataset.v,1);await saveShop(s);openDetail(id);renderAll()},
  showOnMap:(t,id)=>{const s=byId(id);while(stack.length)closePage();switchTab('home');setTimeout(()=>{maps.home.setView([s.lat,s.lng],17);const mk=maps.home._markers&&maps.home._markers[id];if(mk)mk.setIcon(pinIcon(s,true))},50)},
  filter:()=>openFilter(),
  closeSheet:()=>{if(!$('#backdrop').dataset.modal)closeSheet()},
  fGenre:t=>{const v=t.dataset.v;if(v==='all')Ft.genres.clear();else Ft.genres.has(v)?Ft.genres.delete(v):Ft.genres.add(v);renderFilter()},
  fPref:t=>{Ft.pref=t.dataset.v;renderFilter()},
  fMin:t=>{Ft.min=+t.dataset.v;renderFilter()},
  fStatus:t=>{Ft.status=t.dataset.v;renderFilter()},
  fApply:()=>{Object.assign(F,{genres:Ft.genres,pref:Ft.pref,min:Ft.min,status:Ft.status});closeSheet();renderHome(true);if(cur==='list')renderList()},
  fReset:()=>{Ft={genres:new Set(),pref:'all',min:0,status:'all'};renderFilter()},
  gmGenre:t=>{gmGenre=t.dataset.v;renderGenreMap(true)},
  listTab:t=>{listTab=t.dataset.v;renderList()},
  statSeg:t=>{statSeg=t.dataset.v;renderStats()},
  area:t=>openArea(t.dataset.v),
  areaSeg:t=>{areaSeg=t.dataset.v;closePage();setTimeout(()=>openArea(curArea),10)},
  badges:()=>openBadges(),
  badgeCat:t=>{badgeCat=t.dataset.v;openBadges()},
  editProfile:()=>openProfile(),
  locate:t=>showHere(t.dataset.map),
  clearSamples:async()=>{if(!await confirmBox('サンプルのお店をすべて削除しますか？','サンプルを削除'))return;for(const s of shops.filter(s=>s.sample))await removeShop(s.id);renderAll();renderHome(true);toast('サンプルを削除しました')},
  wipe:async()=>{if(!await confirmBox('すべての記録を削除しますか？この操作は元に戻せません。','すべて削除'))return;for(const s of [...shops])await removeShop(s.id);renderAll();toast('すべての記録を削除しました')},
  export:()=>{const blob=new Blob([JSON.stringify({app:'inshokuten-seiha-map',version:1,exportedAt:new Date().toISOString(),settings,shops},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`飲食店制覇マップ_${todayStr()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('バックアップを書き出しました')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t,t.dataset.id,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sFilter').classList.contains('on'))closeSheet();else if(stack.length)closePage()}});
$('#homeSearch').addEventListener('input',()=>renderHome(false));
$('#homeSearch').addEventListener('keydown',e=>{if(e.key==='Enter')renderHome(true)});
$('#listSearch').addEventListener('input',renderList);
$('#listSort').addEventListener('change',renderList);
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const js=JSON.parse(await f.text());if(!Array.isArray(js.shops))throw new Error();
    let n=0;for(const s of js.shops){if(!s.id||!s.name)continue;const i=shops.findIndex(x=>x.id===s.id);if(i>=0)shops[i]=s;else shops.push(s);await saveShop(s);n++}
    if(js.settings){settings={...settings,...js.settings,seeded:true};await saveSettings()}renderAll();renderHome(true);toast(`${n}件のお店を読み込みました`)}
  catch(err){toast('読み込めませんでした。このアプリで書き出したJSONファイルを選んでください')}});

/* ---------- 起動 ---------- */
(async function init(){
  if(typeof L==='undefined'){document.body.innerHTML='<p style="padding:24px">地図ライブラリを読み込めませんでした。インターネット接続を確認して再読み込みしてください。</p>';return}
  try{await DB.open();shops=await DB.all();const st=await DB.get('settings');if(st)settings={...DEF,...st}}
  catch(e){DB.db=null;setTimeout(()=>toast('保存領域を開けませんでした。記録はページを閉じると消えます'),500)}
  if(!settings.seeded){for(const s of samples()){shops.push(s);await saveShop(s)}settings.seeded=true;await saveSettings()}
  maps.home=makeMap('homeMap');renderHome(true);
})();
</script>
</body>
</html>
