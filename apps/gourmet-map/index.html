<html lang="ja">
<head>
<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>飲食店制覇マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E9F0EC;--surface:#FFFFFF;--surface-2:#F2F6F4;--surface-3:#E6EEEA;
  --ink:#16261E;--ink-2:#56675F;--ink-3:#8A9892;--line:#DCE5E0;
  --accent:#1B8456;--accent-2:#136A44;--accent-soft:#DFF1E7;--on-accent:#FFFFFF;
  --star:#F2AE17;--danger:#CC3B31;--danger-soft:#FBE7E5;
  --shadow:0 8px 24px rgba(18,58,38,.14);--shadow-s:0 2px 8px rgba(18,58,38,.10);
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0A;--surface:#111916;--surface-2:#18221E;--surface-3:#202C27;
  --ink:#E4EDE8;--ink-2:#9DAEA6;--ink-3:#6F817A;--line:#26332D;
  --accent:#38B47A;--accent-2:#5CCB95;--accent-soft:#16352A;--on-accent:#06120C;
  --star:#F5BD3A;--danger:#EE6A5F;--danger-soft:#3A1B18;
  --shadow:0 8px 24px rgba(0,0,0,.5);--shadow-s:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C0A;--surface:#111916;--surface-2:#18221E;--surface-3:#202C27;
  --ink:#E4EDE8;--ink-2:#9DAEA6;--ink-3:#6F817A;--line:#26332D;
  --accent:#38B47A;--accent-2:#5CCB95;--accent-soft:#16352A;--on-accent:#06120C;
  --star:#F5BD3A;--danger:#EE6A5F;--danger-soft:#3A1B18;
  --shadow:0 8px 24px rgba(0,0,0,.5);--shadow-s:0 2px 8px rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}

#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.08)}
.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column}
.view.on{display:flex}
.pad{padding-inline:16px}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:10.5px;color:var(--ink-3);font-weight:500}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.2}

/* header */
.hd{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:21px;letter-spacing:.02em}
.hd .sub{font-size:11.5px;color:var(--ink-2)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;fill:none;stroke:var(--on-accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd-title{flex:1;min-width:0}
.hd-center{justify-content:center;text-align:center}

.searchrow{display:flex;gap:8px;padding:0 16px 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}

/* maps */
.mapbox{position:relative;z-index:0;flex:1;min-height:260px}
.mapbox .leaflet-container{position:absolute;inset:0;background:var(--surface-3);font-family:var(--body)}
@media (prefers-color-scheme: dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
.leaflet-control-attribution{font-size:9px!important;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink-3)!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.pin-wrap{background:none;border:0}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.28);border:2.5px solid #fff}
.pin span{transform:rotate(45deg);font-size:17px;line-height:1}
.pin.want{background:#fff;border:2.5px dashed var(--c)}
.pin.hl{outline:3px solid var(--accent);outline-offset:2px}
.map-fab{position:absolute;z-index:500;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-s);display:grid;place-items:center}
.map-fab svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.progress-card{position:absolute;z-index:500;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:26px;flex:none;background-size:cover;background-position:center;overflow:hidden}
.pc-body{flex:1;min-width:0}
.pc-label{font-size:11.5px;color:var(--ink-2);font-weight:500}
.pc-count{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}
.pc-count small{font-size:13px;color:var(--ink-2);font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.barrow{display:flex;align-items:center;gap:8px;margin-top:5px}
.barrow b{font-size:12px;color:var(--accent);min-width:34px;text-align:right}

.add-fab{position:absolute;z-index:600;right:14px;bottom:104px;height:48px;padding:0 18px 0 14px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.add-fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
.sample-note{position:absolute;z-index:500;top:10px;left:12px;right:60px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow-s);padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:8px}
.sample-note span{flex:1;color:var(--ink-2)}
.linkbtn{color:var(--accent);font-weight:700;font-size:12px;white-space:nowrap}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:99px;padding:3px;gap:3px}
.seg button{height:32px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--on-accent)}

.tabs2{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs2 button{padding:12px 0 10px;font-weight:700;color:var(--ink-3);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--accent);border-color:var(--accent)}

/* list */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-2)}
.thumb{width:74px;height:74px;border-radius:12px;background-size:cover;background-position:center;flex:none}
.ph{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--surface)),color-mix(in srgb,var(--c) 70%,var(--surface)));display:grid;place-items:center}
.ph span{font-size:32px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{font-size:11.5px;color:var(--ink-2)}
.row-foot{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--ink-2)}
.row-foot .rt{margin-left:auto;font-weight:700;color:var(--ink)}
.chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.star{color:var(--star)}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface-3);color:var(--ink-2)}
.tag.want{background:color-mix(in srgb,var(--star) 22%,var(--surface));color:var(--ink)}
.empty{padding:40px 24px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);margin-bottom:4px}

/* carousel */
.carousel{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 14px;scroll-snap-type:x mandatory;scrollbar-width:none;background:var(--surface)}
.carousel::-webkit-scrollbar{display:none}
.ccard{flex:0 0 150px;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left}
.ccard.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ccard .thumb{width:100%;height:84px;border-radius:0}
.ccard div.cb{padding:7px 10px 9px}
.ccard .row-name{font-size:13px}

/* pages */
.page{position:absolute;inset:0;z-index:2000;background:var(--surface);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s;visibility:hidden;display:flex;flex-direction:column}
.page.on{transform:none;visibility:visible}
.page.up{transform:translateY(100%)}
.page.up.on{transform:none}
.phd{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.phd h2{flex:1;font-size:17px;text-align:center}
.phd .sp{width:38px}
.back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.back svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back:hover{background:var(--surface-2)}

.hero{position:relative;height:230px;flex:none;background-size:cover;background-position:center}
.hero .ph-in{position:absolute;inset:0}
.hero .ph-in span{font-size:84px}
.hero-btn{position:absolute;top:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.42);display:grid;place-items:center;backdrop-filter:blur(4px)}
.hero-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sec{padding:16px}
.sec+.sec{border-top:8px solid var(--surface-2)}
.sec-title{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.d-name{font-size:23px;line-height:1.3}
.d-meta{color:var(--ink-2);font-size:12.5px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-rate{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.d-rate b{font-size:18px;color:var(--ink);font-family:var(--display)}
.d-memo{margin:10px 0 0;color:var(--ink);font-size:13.5px;white-space:pre-wrap;max-width:65ch}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{height:48px;border-radius:14px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.sec2{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.grow{flex:1}
.btn.fav-on{border-color:var(--danger);color:var(--danger)}
.btn.fav-on svg{fill:var(--danger)}
.info{display:grid;grid-template-columns:auto auto 1fr;gap:10px 10px;align-items:start;font-size:13px}
.info svg{width:17px;height:17px;stroke:var(--ink-3);fill:none;stroke-width:1.9;margin-top:1px}
.info .k{color:var(--ink-2);white-space:nowrap}
.info .v{word-break:break-all}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery .g{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;position:relative;max-width:100%}
.gallery .g button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:1}
.gallery label.g{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-3);font-size:12px;cursor:pointer;text-align:center}
.gallery label.g svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;display:block;margin:0 auto 2px}

/* record */
.celebrate{position:relative;overflow:hidden;padding:28px 16px 18px;text-align:center;background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.celebrate h2{font-size:20px;margin-bottom:14px}
.cel-img{width:130px;height:130px;border-radius:50%;margin:0 auto 12px;background-size:cover;background-position:center;border:5px solid var(--surface);box-shadow:var(--shadow)}
.cel-img.ph span{font-size:60px}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-10px;width:7px;height:12px;border-radius:2px;animation:fall 1.8s ease-out forwards}
@keyframes fall{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(260px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}.page{transition:none}}

/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.flabel{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field .opt{font-weight:400;color:var(--ink-3)}
.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;width:100%;outline:none}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--accent);background:var(--surface)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;gap:6px}
.stars button{font-size:32px;line-height:1;color:var(--surface-3);transition:transform .1s}
.stars button.on{color:var(--star)}
.stars button:active{transform:scale(1.2)}
.pickmap{height:220px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pickmap .leaflet-container{border-radius:14px}
.hint{font-size:11.5px;color:var(--ink-3)}
.results{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.results button{text-align:left;padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface-2)}
.req{color:var(--danger)}

/* genre grid (filter / form) */
.ggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink-2);font-weight:500}
.gbtn .gi{width:50px;height:50px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);display:grid;place-items:center;font-size:23px;transition:.15s}
.gbtn.on{color:var(--accent);font-weight:700}
.gbtn.on .gi{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* sheet */
.backdrop{position:absolute;inset:0;z-index:3000;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:.25s}
.backdrop.on{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3001;background:var(--surface);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility .28s;visibility:hidden;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none;visibility:visible}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px;position:sticky;top:0;background:var(--surface);z-index:2}
.sheet-hd h2{font-size:18px}
.sheet .flabel{display:block;margin:14px 0 8px;font-family:var(--display);font-size:14.5px;color:var(--ink)}
.sheet-foot{display:flex;flex-direction:column;gap:8px;margin-top:20px}

/* modal confirm */
.modal{position:absolute;z-index:4001;left:24px;right:24px;top:50%;transform:translateY(-50%) scale(.96);background:var(--surface);border-radius:18px;padding:20px;box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:.18s}
.modal.on{opacity:1;visibility:visible;transform:translateY(-50%)}
.modal p{margin:0 0 16px;font-size:14px}
.modal .btnrow{margin:0}

.toast{position:absolute;z-index:5000;left:50%;bottom:86px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* stats */
.bignum{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.1}
.bignum small{font-size:15px;font-weight:700;margin-left:2px}
.bignum .of{font-size:12px;color:var(--ink-2);font-weight:500;margin-left:6px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.stack{display:flex;flex-direction:column;gap:12px;padding:0 16px 20px}
.donut-wrap{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
.donut{width:140px;height:140px;max-width:100%}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{margin-left:auto;font-weight:700}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:62px 1fr 30px;gap:8px;align-items:center;font-size:12.5px;text-align:left;width:100%}
.hbar .bar{height:10px}
.hbar b{text-align:right}
.hbar:disabled{cursor:default}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:120px}
.months .m{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10px;color:var(--ink-3)}
.months .m i{display:block;width:100%;max-width:18px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.months .m i.zero{background:var(--surface-3)}
.months .m em{font-style:normal;font-size:10px;color:var(--ink-2);font-weight:700}
.rank{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.rank:last-child{border-bottom:0}
.rank .no{width:24px;font-family:var(--display);font-weight:900;font-size:16px;color:var(--ink-3);text-align:center}
.rank .no.top{color:var(--star)}
.rank .thumb{width:50px;height:50px;border-radius:10px}
.rank .ph span{font-size:22px}

/* area */
.area-hero{padding:22px 16px 16px;background:linear-gradient(160deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.area-hero h2{font-size:24px}
.area-hero .bar{background:rgba(255,255,255,.3)}
.area-hero .bar i{background:var(--on-accent)}
.area-hero .barrow b{color:var(--on-accent)}
.areamap{height:340px;position:relative;z-index:0}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.medal{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle at 35% 30%,#FFE6A6,#E7A43A 70%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 8px rgba(160,100,20,.3);border:3px solid #fff3d2}
.medal.genre{background:radial-gradient(circle at 35% 30%,#FFC9B8,#D9573F 70%);border-color:#ffe1d8;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 8px rgba(180,60,40,.3)}
.medal.area{background:radial-gradient(circle at 35% 30%,#BFE9D4,#1E8A5A 70%);border-color:#d9f3e6;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15),0 3px 8px rgba(20,110,70,.3)}
.badge.lock .medal{filter:grayscale(1);opacity:.35}
.badge .bn{font-size:11.5px;font-weight:700;line-height:1.3}
.badge .bp{font-size:11px;color:var(--ink-2)}
.badge.lock .bn{color:var(--ink-3)}

/* profile */
.cover{height:130px;flex:none;background:
  radial-gradient(circle at 20% 30%,rgba(255,255,255,.18) 0 18px,transparent 19px),
  radial-gradient(circle at 80% 60%,rgba(255,255,255,.14) 0 26px,transparent 27px),
  radial-gradient(circle at 55% 15%,rgba(255,255,255,.12) 0 10px,transparent 11px),
  linear-gradient(135deg,var(--accent),#0E5234)}
.prof{text-align:center;margin-top:-50px;padding:0 16px 8px;position:relative}
.prof .avatar{width:96px;height:96px;font-size:50px;margin:0 auto 8px;border:4px solid var(--surface);box-shadow:var(--shadow-s)}
.prof h2{font-size:20px}
.prof p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.prof .edit{position:absolute;right:16px;top:58px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 16px 0;border:1px solid var(--line);border-radius:16px}
.pstats div{padding:12px 4px;text-align:center}
.pstats div+div{border-left:1px solid var(--line)}
.pstats span{display:block;font-size:11px;color:var(--ink-2)}
.pstats b{font-family:var(--display);font-size:22px;font-weight:900}
.pstats b small{font-size:11px;font-weight:700}
.badge-strip{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;width:100%;text-align:left}
.badge-strip .medal{width:44px;height:44px;font-size:20px;border-width:2px}
.badge-strip div{flex:1}
.menu{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.menu button,.menu label{display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.menu>*:last-child{border-bottom:0}
.menu .danger-t{color:var(--danger)}
.foot-copy{text-align:center;color:var(--ink-3);font-size:11.5px;padding:10px 16px 24px;font-family:var(--display)}
.avatar-pick{display:flex;gap:8px;flex-wrap:wrap}
.avatar-pick button{width:44px;height:44px;border-radius:50%;background:var(--surface-2);font-size:22px;border:2px solid transparent}
.avatar-pick button.on{border-color:var(--accent)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
