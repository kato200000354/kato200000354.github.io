<title>ばくはつめくり</title>
<style>
:root{
  --bg:#1a1030;--bg2:#2a1748;--panel:#2c1d4d;--line:#4a3577;--text:#fff6ea;--muted:#c6b6e6;
  --accent:#ffd54f;--danger:#ff4d4d;--good:#5ee08a;
  --cw:min(13.5vw,60px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg) 70%);min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:10px 16px 18px;display:flex;flex-direction:column;gap:10px;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;border-radius:14px;font-weight:700}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;cursor:default;transform:none}
header{display:flex;align-items:center;gap:8px}
header h1{flex:1;margin:0;font-size:19px;letter-spacing:.06em}
header h1 span{color:var(--accent)}
.iconbtn{background:var(--panel);border:1px solid var(--line);padding:6px 10px;font-size:13px;font-weight:600}

.side{background:rgba(44,29,77,.85);border:2px solid var(--line);border-radius:16px;padding:8px 10px;transition:border-color .3s,box-shadow .3s}
.side.active{border-color:var(--accent);box-shadow:0 0 18px rgba(255,213,79,.25)}
.sidehead{display:flex;align-items:center;gap:8px;font-size:14px}
.sidehead .name{font-weight:800}
.sidehead .chips{flex:1;display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:#3b2866;border:1px solid var(--line)}
.chip.shield{background:#1f4f7a;border-color:#4aa3ff}
.chip.push{background:#6a2350;border-color:#ff6fb5}
.score{font-size:22px;font-weight:900;color:var(--accent);min-width:3ch;text-align:right}
.score small{font-size:11px;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:9px;background:#170d2b;margin:6px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb300,#ffd54f);transition:width .6s}
.linewrap{display:flex;align-items:center;gap:8px}
.lineval{min-width:56px;text-align:center;font-size:12px;color:var(--muted);line-height:1.1}
.lineval b{display:block;font-size:22px;color:var(--text)}
.row{flex:1;display:flex;flex-wrap:wrap;gap:5px;min-height:calc(var(--cw)*1.4);align-content:flex-start}

.card{width:var(--cw);height:calc(var(--cw)*1.4);perspective:600px;flex:none}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.card.new .in{animation:flip .5s cubic-bezier(.3,1.3,.5,1)}
@keyframes flip{from{transform:rotateY(180deg) translateY(-30px) scale(1.2)}to{transform:rotateY(0)}}
.card .f,.card .b{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.card .f{background:var(--c,#fff);color:#fff;border:2px solid rgba(255,255,255,.7);box-shadow:0 3px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.card .f .v{font-size:calc(var(--cw)*.55);font-weight:900;line-height:1}
.card .f .s{font-size:calc(var(--cw)*.17);font-weight:800;margin-top:2px}
.card .f .e{font-size:calc(var(--cw)*.45);line-height:1}
.card .b{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#ff5d73 0 6px,#e8405a 6px 12px);border:2px solid #fff}
.card.dup .f{outline:4px solid var(--danger);animation:shake .4s}
.card.used{opacity:.4}
.card.dim .f{filter:grayscale(.8) brightness(.6)}

.center{display:flex;align-items:center;gap:12px;justify-content:center;padding:4px 0}
.deck{position:relative;width:calc(var(--cw)*1.15);height:calc(var(--cw)*1.6)}
.deck .b{position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(45deg,#ff5d73 0 6px,#e8405a 6px 12px);border:2px solid #fff;box-shadow:3px 3px 0 #a52a45,6px 6px 0 #6e1c30}
.deck .cnt{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.meter{flex:1;max-width:260px}
.meter .lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.meter .lbl b{font-size:20px;color:var(--text)}
.meter .track{height:14px;border-radius:9px;background:#170d2b;overflow:hidden;border:1px solid var(--line);margin-top:3px}
.meter .track i{display:block;height:100%;width:0;transition:width .4s,background .4s}
.meter .note{font-size:11px;color:var(--muted);margin-top:4px;min-height:1.3em}

.msg{text-align:center;font-weight:800;font-size:16px;min-height:1.5em}
.controls{display:flex;gap:10px;margin-top:auto}
.controls button{flex:1;padding:16px 8px;font-size:19px}
#btnFlip{background:linear-gradient(#ff7a8c,#e8405a);box-shadow:0 5px 0 #8f1f35}
#btnStop{background:linear-gradient(#ffe27a,#f4b400);color:#4a2a00;box-shadow:0 5px 0 #9a6b00}
.controls button small{display:block;font-size:11px;font-weight:600;opacity:.85}

.big{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:min(16vw,84px);font-weight:900;pointer-events:none;z-index:50;white-space:nowrap;
  text-shadow:0 4px 0 rgba(0,0,0,.4);animation:pop 1.1s forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1.2);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;animation:fl .5s forwards}
@keyframes fl{from{opacity:.7}to{opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
.pt{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:45;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

.overlay{position:fixed;inset:0;background:rgba(10,5,20,.82);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px 18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.modal h2{margin:0 0 6px;text-align:center;font-size:28px}
.modal h2 span{color:var(--accent)}
.modal p{font-size:14px;line-height:1.6;margin:6px 0}
.rules{background:#20143a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65}
.rules ul{margin:4px 0;padding-left:1.2em}
.sp{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-top:6px}
.sp .card{--cw:34px}
.lv{display:flex;gap:8px;margin:14px 0 8px}
.lv button{flex:1;padding:10px 4px;background:#3b2866;border:2px solid var(--line);font-size:14px}
.lv button.on{border-color:var(--accent);background:#4f3488}
.go{width:100%;padding:15px;font-size:20px;background:linear-gradient(#ff7a8c,#e8405a);box-shadow:0 5px 0 #8f1f35;margin-top:6px}
.rec{text-align:center;font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>💣 ばくはつ<span>めくり</span></h1>
    <button class="iconbtn" id="btnSound">🔊</button>
    <button class="iconbtn" id="btnMenu">ルール</button>
  </header>

  <section class="side" id="side1">
    <div class="sidehead"><span class="name">🤖 CPU</span><span class="chips" id="chips1"></span><span class="score" id="score1">0</span></div>
    <div class="bar"><i id="bar1"></i></div>
    <div class="linewrap"><div class="lineval">この場<b id="val1">0</b></div><div class="row" id="row1"></div></div>
  </section>

  <div class="center">
    <div class="deck"><div class="b"></div><div class="cnt" id="deckCnt">山札 0</div></div>
    <div class="meter">
      <div class="lbl"><span>💥 ばくはつ確率</span><b id="probTxt">0%</b></div>
      <div class="track"><i id="probBar"></i></div>
      <div class="note" id="probNote"></div>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <section class="side" id="side0">
    <div class="sidehead"><span class="name">😀 あなた</span><span class="chips" id="chips0"></span><span class="score" id="score0">0</span></div>
    <div class="bar"><i id="bar0"></i></div>
    <div class="linewrap"><div class="lineval">この場<b id="val0">0</b></div><div class="row" id="row0"></div></div>
  </section>

  <div class="controls">
    <button id="btnFlip">めくる！<small>欲ばる</small></button>
    <button id="btnStop">ストップ<small>点を確定</small></button>
  </div>
</div>

<div class="overlay" id="titleOv">
  <div class="modal">
    <h2>💣 ばくはつ<span>めくり</span></h2>
    <div class="rules">
      <b>先に 100点 取ったら勝ち！</b>
      <ul>
        <li>自分の番は山札を1枚ずつ<b>めくる</b>。数字の合計がこの場の点。</li>
        <li><b>同じ数字</b>が出たら <b style="color:#ff6b6b">ばくはつ！</b> この場の点は0。</li>
        <li>好きなときに<b>ストップ</b>すれば点が確定。</li>
        <li>違う数字を<b>6種類</b>そろえると <b style="color:#ffd54f">パーフェクト +15点</b>！</li>
        <li>大きい数字ほど枚数が多い（9は9枚、1は1枚）。</li>
      </ul>
      <div class="sp" id="spList"></div>
    </div>
    <div class="lv" id="lvBtns">
      <button data-lv="0">やさしい</button>
      <button data-lv="1">ふつう</button>
      <button data-lv="2">つよい</button>
    </div>
    <button class="go" id="btnStart">スタート！</button>
    <div class="rec" id="recTxt"></div>
  </div>
</div>

<div class="overlay" id="endOv" hidden>
  <div class="modal" style="text-align:center">
    <h2 id="endTitle"></h2>
    <p id="endSub"></p>
    <button class="go" id="btnAgain">もう一回！</button>
    <button class="iconbtn" id="btnToTitle" style="margin-top:12px;width:100%;padding:10px">タイトルへ</button>
  </div>
</div>
