<meta name="copyright" content="© kato200000354">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ゆうしゃピンボール</title>
<meta name="description" content="ボールで魔物をたおせ！スライム、ゴーレム、ドラゴン、そしてまおう。宝箱・けんパワー・マルチボールで戦うRPGピンボール。">
<meta name="theme-color" content="#0b1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#070a1a;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,22,.78);backdrop-filter:blur(3px)}
.card{width:100%;max-width:340px;text-align:center;background:linear-gradient(#1b2350,#10163a);border:2px solid #f5c84c;border-radius:18px;padding:22px 18px;box-shadow:0 0 0 4px #10163a,0 10px 40px rgba(0,0,0,.6)}
.card h1{font-size:30px;font-weight:900;line-height:1.15;color:#ffe08a;text-shadow:0 3px 0 #a55a12,0 0 18px rgba(255,200,80,.5)}
.card h2{font-size:26px;font-weight:900;color:#ffe08a;margin-bottom:6px}
.sub{font-size:13px;color:#c9d2ff;margin:8px 0 14px;line-height:1.6}
.rules{text-align:left;font-size:12.5px;line-height:1.75;color:#e6e9ff;background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.rules b{color:#ffe08a}
.big{display:block;width:100%;font-size:20px;font-weight:900;padding:14px;border-radius:12px;background:linear-gradient(#ffd45c,#f09a1c);color:#3a1d00;box-shadow:0 4px 0 #9c5a0c}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #9c5a0c}
.best{margin-top:12px;font-size:13px;color:#9fb0ff}
.res{font-size:15px;line-height:1.9;margin:10px 0 16px;color:#e6e9ff}
.res .sc{font-size:34px;font-weight:900;color:#fff}
.new{color:#ff8ad8;font-weight:900}
#mute{position:fixed;z-index:5;top:max(8px,env(safe-area-inset-top));right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:16px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="mute" aria-label="音のオンオフ">🔊</button>

<div class="ov" id="title">
  <div class="card">
    <h1>⚔️ ゆうしゃ<br>ピンボール</h1>
    <p class="sub">ボールは きみの けん。<br>魔物に ぶつけて たおせ！</p>
    <div class="rules">
      👆 <b>画面の左/右</b>をタッチでフリッパー<br>
      🚀 右はしの玉は<b>右を長押し→はなす</b>で発射<br>
      👾 魔物に当てると<b>ダメージ</b>。たおすと次の敵へ<br>
      🎁 左の<b>宝箱</b>に入るとアイテム！<br>
      🗡️ 右の<b>け・ん・!</b>を全部たおすと攻撃2倍<br>
      ⭐ 上の<b>3つの星</b>を通ると得点倍率UP<br>
      🔥 敵の火の玉がフリッパーに当たると しびれる！
    </div>
    <button class="big" id="startBtn">ぼうけんに でる</button>
    <div class="best" id="bestT"></div>
  </div>
</div>

<div class="ov" id="over" hidden>
  <div class="card">
    <h2>ゲームオーバー</h2>
    <div class="res" id="resT"></div>
    <button class="big" id="againBtn">もういちど</button>
  </div>
</div>
