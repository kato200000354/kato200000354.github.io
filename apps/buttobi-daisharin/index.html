<title>ぶっとび大車輪</title>
<meta name="description" content="鉄棒でグルグル回って、手を離して空へぶっとべ！回転・飛距離・着地で勝負する3D鉄棒ゲーム。">
<meta name="theme-color" content="#1b2a6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b1340;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.dg{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-weight:400}
#speed{position:fixed;inset:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.0) 0deg 4deg,rgba(255,255,255,.55) 4deg 5deg);-webkit-mask:radial-gradient(circle at 50% 50%,transparent 32%,#000 75%);mask:radial-gradient(circle at 50% 50%,transparent 32%,#000 75%);transition:opacity .2s}
#hud{position:fixed;inset:0;pointer-events:none}
#topL{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top));text-shadow:0 2px 0 #0008;line-height:1.1}
#topL .big{font-size:30px}
#topL .lab{font-size:11px;opacity:.85;font-weight:800}
#rpm{font-size:14px;font-weight:800;margin-top:2px}
#mission{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));max-width:52%;background:#0007;border:2px solid #ffd84a;border-radius:10px;padding:5px 8px;font-size:11px;font-weight:800;line-height:1.35;text-align:right}
#mission b{color:#ffd84a;display:block;font-size:10px}
#mission.ok{background:#1d8a3ccc;border-color:#9dffb4}
#gripWrap{position:absolute;left:10px;top:calc(92px + env(safe-area-inset-top));width:120px}
#gripWrap .lab{font-size:10px;font-weight:800;text-shadow:0 1px 0 #000a}
#gripBar{height:10px;border-radius:6px;background:#0008;border:2px solid #fff;overflow:hidden}
#gripFill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#ffd84a 40%,#59e36c);transition:width .1s linear}
#gripWrap.danger #gripBar{animation:blink .25s infinite alternate}
@keyframes blink{to{border-color:#ff3b3b;box-shadow:0 0 12px #f00}}
#gauge{position:absolute;left:10px;bottom:calc(14px + env(safe-area-inset-bottom));width:96px;height:96px}
#fever{position:absolute;left:112px;bottom:calc(20px + env(safe-area-inset-bottom));font-size:20px;color:#ffb22b;text-shadow:0 0 10px #f60,0 2px 0 #000;animation:fv .3s infinite alternate}
@keyframes fv{to{transform:scale(1.15) rotate(-4deg)}}
#relBtn{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ff8a5c,#e8283c 60%,#9d0f22);color:#fff;font-size:26px;pointer-events:auto;box-shadow:0 6px 0 #6b0614,0 10px 20px #0008;touch-action:none}
#relBtn:active{transform:translateY(4px);box-shadow:0 2px 0 #6b0614}
#relBtn small{display:block;font-size:10px;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;opacity:.9}
#hint{position:absolute;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000a;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:800;white-space:nowrap;animation:hb 1s infinite alternate}
@keyframes hb{to{transform:translateX(-50%) scale(1.05)}}
#flightInfo{position:absolute;left:0;right:0;top:calc(64px + env(safe-area-inset-top));text-align:center;text-shadow:0 3px 0 #000a}
#flightInfo .d{font-size:44px;line-height:1}
#flightInfo .h{font-size:14px;font-weight:800}
#pred{position:absolute;right:10px;top:calc(76px + env(safe-area-inset-top));font-size:12px;font-weight:800;text-shadow:0 1px 0 #000;text-align:right}
#pops{position:absolute;inset:0;overflow:hidden}
.pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:30px;white-space:nowrap;text-shadow:0 3px 0 #000,0 0 14px currentColor;animation:popA .9s ease-out forwards}
@keyframes popA{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
.banner{position:absolute;left:0;right:0;top:24%;text-align:center;font-size:clamp(28px,9vw,54px);line-height:1.1;padding:0 10px;background:linear-gradient(180deg,#fff 20%,#ffd84a 55%,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 10px #f80);animation:bn 1.6s ease-out forwards}
.banner small{display:block;font-size:.38em;filter:none}
@keyframes bn{0%{transform:scale(3);opacity:0}12%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(1.1);opacity:0}}
#replayTag{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));font-size:18px;color:#fff;background:#000a;padding:4px 10px;border-radius:8px}
#replayTag i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#f33;margin-right:6px;animation:blink2 .6s infinite alternate}
@keyframes blink2{to{opacity:.2}}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 30%,#1b2a6bcc,#060a24ee);overflow-y:auto}
.card{width:min(100%,420px);text-align:center}
#title h1{font-size:clamp(40px,13vw,64px);line-height:1;background:linear-gradient(180deg,#fff,#ffd84a 50%,#ff6a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b0614);transform:rotate(-4deg);margin:8px 0 4px}
#title .sub{font-size:13px;font-weight:800;opacity:.9;margin-bottom:14px}
.how{background:#ffffff14;border:2px solid #ffffff33;border-radius:14px;padding:10px 12px;text-align:left;font-size:13px;line-height:1.55;font-weight:500}
.how div{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.how b{flex:none;width:22px;height:22px;border-radius:50%;background:#ffd84a;color:#1b2a6b;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.how em{font-style:normal;color:#ffd84a;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;margin-top:10px;font-size:20px;color:#fff;background:linear-gradient(180deg,#ff6a4a,#e8283c);box-shadow:0 5px 0 #8a0a1c;cursor:pointer;font-family:"Dela Gothic One",sans-serif}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a0a1c}
.btn.sub2{background:linear-gradient(180deg,#4a7bff,#2546c9);box-shadow:0 5px 0 #13256e;font-size:16px}
.btn.x{background:linear-gradient(180deg,#333,#000);box-shadow:0 5px 0 #444;font-size:16px}
.row{display:flex;gap:8px}.row .btn{flex:1}
#best{margin-top:10px;font-size:12px;font-weight:800;opacity:.85}
#result .rank{font-size:13px;font-weight:800;opacity:.9}
#result .ttl{font-size:clamp(22px,7.5vw,38px);line-height:1.15;color:#ffd84a;text-shadow:0 3px 0 #6b0614;margin:2px 0 6px}
#result .score{font-size:46px;line-height:1}
#result .score small{font-size:16px}
#result .newrec{display:inline-block;background:#ff2a6a;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:800;animation:fv .4s infinite alternate;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0;font-size:10px;font-weight:800}
.stats div{background:#ffffff14;border-radius:8px;padding:6px 2px}
.stats span{display:block;font-size:17px;font-family:"Dela Gothic One",sans-serif;font-weight:400}
.judges{display:flex;justify-content:center;gap:8px;margin:8px 0}
.jd{width:30%;max-width:90px;background:#fff;color:#111;border-radius:8px;padding:4px 2px 6px;font-size:10px;font-weight:800;transform:rotateX(90deg);transition:transform .35s cubic-bezier(.3,1.6,.6,1)}
.jd.show{transform:none}
.jd .f{font-size:24px;line-height:1.2}
.jd .n{font-size:24px;font-family:"Dela Gothic One",sans-serif;font-weight:400;color:#e8283c}
.comment{background:#00000055;border-radius:10px;padding:8px;font-size:13px;font-weight:800;margin:6px 0}
#mres{font-size:12px;font-weight:800;margin:4px 0}
</style>

<canvas id="c"></canvas>
<div id="speed"></div>
<div id="hud">
  <div id="topL" hidden><div class="lab">大車輪</div><div class="big dg"><span id="loops">0</span><small style="font-size:14px">回転</small></div><div id="rpm">0 rpm</div></div>
  <div id="mission" hidden><b>ミッション</b><span id="mtext"></span></div>
  <div id="gripWrap" hidden><div class="lab">にぎる力</div><div id="gripBar"><div id="gripFill"></div></div></div>
  <div id="pred" hidden></div>
  <canvas id="gauge" width="192" height="192" hidden></canvas>
  <div id="fever" class="dg" hidden>FEVER!!</div>
  <div id="hint" hidden></div>
  <div id="flightInfo" hidden><div class="d dg"><span id="fdist">0.0</span><small style="font-size:18px">m</small></div><div class="h">高さ <span id="fh">0</span>m ・ 宙返り <span id="fflip">0</span>回</div></div>
  <div id="replayTag" class="dg" hidden><i></i>REPLAY</div>
  <div id="pops"></div>
  <button id="relBtn" class="dg" hidden>とぶ！<small>手をはなす</small></button>
</div>

<div id="title" class="ov">
  <div class="card">
    <h1 class="dg">ぶっとび<br>大車輪</h1>
    <div class="sub">鉄棒でまわって、まわって、空までぶっとべ！</div>
    <div class="how">
      <div><b>1</b><span>体が<em>いちばん下</em>に来たときに<em>タップ</em>。<br>ゾーンの真ん中ほど加速して、ぐるぐる回り始める</span></div>
      <div><b>2</b><span>好きなタイミングで<em>「とぶ！」</em>。<br>黄色い点線が飛んでいく道すじ</span></div>
      <div><b>3</b><span>空中では<em>長押しで丸まって高速回転</em>、離すと減速。<br><em>足から</em>着地できたら大成功！</span></div>
    </div>
    <button class="btn" id="startBtn">スタート！</button>
    <div id="best"></div>
  </div>
</div>

<div id="result" class="ov" hidden>
  <div class="card">
    <div class="rank" id="rLand"></div>
    <div class="ttl dg" id="rTitle"></div>
    <div class="score dg"><span id="rScore">0</span><small>点</small></div>
    <div id="rNew" class="newrec" hidden>自己ベスト更新！</div>
    <div class="judges">
      <div class="jd"><div class="f">🧔</div>審査員A<div class="n" id="j0">-</div></div>
      <div class="jd"><div class="f">👵</div>審査員B<div class="n" id="j1">-</div></div>
      <div class="jd"><div class="f">🐶</div>審査員C<div class="n" id="j2">-</div></div>
    </div>
    <div class="comment" id="rComment"></div>
    <div id="mres"></div>
    <div class="stats">
      <div>大車輪<span id="sLoops">0</span></div>
      <div>宙返り<span id="sFlips">0</span></div>
      <div>飛距離<span id="sDist">0</span></div>
      <div>最高点<span id="sH">0</span></div>
    </div>
    <button class="btn" id="againBtn">もう一回！</button>
    <div class="row"><button class="btn sub2" id="replayBtn">スロー再生</button><button class="btn x" id="shareBtn">𝕏 でポスト</button></div>
  </div>
</div>
