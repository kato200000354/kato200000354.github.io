<meta name="description" content="七十になった親は、山へ送る――。母を背負い、夜の山を登る。姨捨伝説をもとにした一人称3Dホラー短編。">
<meta name="theme-color" content="#000000">
<title>姨捨</title>
<style>
  [hidden] { display:none !important; }
  .hidden { display:none !important; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; color:#d8d2c6;
    font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #grain { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; opacity:.08; mix-blend-mode:screen; }
  #vig,#dark,#redv,#black { position:fixed; inset:0; pointer-events:none; }
  #vig { background:radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(0,0,0,.92) 100%); }
  #dark { opacity:0; background:radial-gradient(ellipse at center, rgba(0,0,0,.3) 0%, rgba(0,0,0,.98) 60%); }
  #redv { opacity:0; background:radial-gradient(ellipse at center, rgba(90,0,0,0) 30%, rgba(140,0,0,.8) 100%); }
  #black { opacity:0; background:#000; transition:opacity 1.2s; }

  #hud { position:fixed; inset:0; pointer-events:none; text-shadow:0 0 4px #000,0 0 10px #000; }
  #chapS { position:absolute; left:calc(14px + env(safe-area-inset-left)); top:calc(12px + env(safe-area-inset-top)); font-size:13px; color:#9d958a; letter-spacing:.15em; }
  #oilW { position:absolute; right:calc(14px + env(safe-area-inset-right)); top:calc(12px + env(safe-area-inset-top)); text-align:right; font-size:12px; color:#a59d90; }
  #oilbar { width:84px; height:5px; border:1px solid #6f6658; margin-top:4px; margin-left:auto; }
  #oilbar i { display:block; height:100%; width:100%; background:#d9a55a; }
  #cross { position:absolute; left:50%; top:50%; width:3px; height:3px; margin:-1.5px 0 0 -1.5px; border-radius:50%; background:rgba(230,220,200,.45); }
  #prompt { position:absolute; left:0; right:0; top:calc(50% + 24px); text-align:center; font-size:15px; color:#efe4cf; letter-spacing:.1em; }
  #stam { position:absolute; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); width:140px; height:3px; margin-left:-70px; background:rgba(255,255,255,.1); transition:opacity .4s; }
  #stam i { display:block; height:100%; width:100%; background:#c9bea4; }
  #sub { position:absolute; left:16px; right:16px; bottom:calc(92px + env(safe-area-inset-bottom)); text-align:center; font-size:17px; line-height:1.7; color:#eee4d0; letter-spacing:.08em; opacity:0; transition:opacity .5s; }
  #sub .who { font-size:12px; color:#9d958a; display:block; letter-spacing:.3em; }
  #sub.fake { color:#d48a7c; }
  #sub.fake .who { color:#8a4a40; }
  body.touch #sub { bottom:calc(205px + env(safe-area-inset-bottom)); }
  #hint { position:absolute; left:16px; right:16px; top:calc(48px + env(safe-area-inset-top)); text-align:center; font-size:13px; line-height:1.8; color:#bdb3a2; white-space:pre-line; opacity:0; transition:opacity .6s; }
  #chap { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity 1.4s; text-shadow:0 0 14px #000; }
  #chap .n { font-size:15px; color:#8f2a22; letter-spacing:.5em; padding-left:.5em; }
  #chap .t { font-size:clamp(28px,8vw,44px); letter-spacing:.4em; padding-left:.4em; color:#ddd3c1; margin-top:6px; }
  #msg { position:fixed; left:16px; right:16px; top:30%; text-align:center; pointer-events:none; font-size:18px; letter-spacing:.12em; line-height:2; color:#ebe2d0; text-shadow:0 0 6px #000,0 0 14px #000; opacity:0; transition:opacity .8s; white-space:pre-line; z-index:6; }

  .ov { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px 16px; box-sizing:border-box; overflow-y:auto; z-index:8; }
  .btn { pointer-events:auto; font:inherit; font-size:17px; letter-spacing:.2em; color:#e6dccb; background:rgba(16,10,8,.6); border:1px solid #5d3a2c; padding:12px 30px; margin:6px; cursor:pointer; }
  .btn:hover { background:rgba(80,30,16,.6); border-color:#a0462e; }
  .btn:disabled { opacity:.4; }
  #title { background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,.05), rgba(0,0,0,.85)); }
  #title h1 { margin:0; font-size:clamp(64px,20vw,120px); letter-spacing:.3em; padding-left:.3em; font-weight:700; color:#ddd2bf; text-shadow:0 0 30px #000, 2px 0 rgba(150,30,20,.5); }
  #title .kana { font-size:14px; letter-spacing:1em; padding-left:1em; color:#857b6e; margin-top:-4px; }
  #title .tag { font-size:15px; letter-spacing:.25em; color:#9e2e22; margin:18px 0 22px; padding-left:.25em; }
  .howto { font-size:13px; line-height:1.9; color:#a0978a; max-width:520px; margin-top:16px; }
  .howto b { color:#d9cfbe; font-weight:normal; }
  .warn { font-size:12px; color:#756c60; margin-top:10px; }
  #ends { font-size:13px; color:#b3a487; margin-top:10px; letter-spacing:.15em; }
  #choice, #pause, #dead, #endv { background:rgba(0,0,0,.8); }
  #choice .q { font-size:17px; line-height:2; letter-spacing:.1em; margin-bottom:22px; white-space:pre-line; }
  #choice .btn { display:block; width:min(300px,90vw); }
  h2 { font-size:clamp(28px,8vw,46px); letter-spacing:.3em; padding-left:.3em; margin:0 0 14px; font-weight:700; }
  #dead h2 { color:#a3150f; text-shadow:0 0 20px rgba(160,0,0,.6); }
  #endv .en { font-size:14px; color:#9e2e22; letter-spacing:.5em; padding-left:.5em; margin-bottom:6px; }
  .tip { font-size:14px; color:#a59c8f; margin-bottom:18px; line-height:1.9; max-width:480px; white-space:pre-line; }
  .row { display:flex; flex-wrap:wrap; justify-content:center; }
  label.sens { font-size:13px; color:#a0978a; margin:12px 0; display:flex; align-items:center; gap:10px; }

  #touch { position:fixed; inset:0; touch-action:none; }
  #joy { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.04); display:none; pointer-events:none; }
  #joy i { position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(230,220,200,.2); }
  .tb { position:absolute; width:62px; height:62px; border-radius:50%; border:1px solid rgba(230,220,200,.3); background:rgba(10,10,10,.35); color:#d8d0c2; font:inherit; font-size:12px; display:flex; align-items:center; justify-content:center; touch-action:none; padding:0; }
  .tb.on { background:rgba(150,60,20,.45); border-color:rgba(230,150,100,.6); }
  .tb.big { width:76px; height:76px; font-size:13px; }
  .tb.call { animation:call 1s infinite; border-color:#e0b070; }
  @keyframes call { 0%,100% { box-shadow:0 0 0 rgba(230,170,90,0); } 50% { box-shadow:0 0 18px rgba(230,170,90,.8); } }
  #tLook { right:calc(22px + env(safe-area-inset-right)); bottom:calc(108px + env(safe-area-inset-bottom)); }
  #tRun { right:calc(108px + env(safe-area-inset-right)); bottom:calc(36px + env(safe-area-inset-bottom)); }
  #tUse { right:calc(22px + env(safe-area-inset-right)); bottom:calc(28px + env(safe-area-inset-bottom)); }
  #tLamp { right:calc(110px + env(safe-area-inset-right)); bottom:calc(124px + env(safe-area-inset-bottom)); width:52px; height:52px; }
  #tPause { right:calc(22px + env(safe-area-inset-right)); top:calc(52px + env(safe-area-inset-top)); width:44px; height:44px; }
  #guide { position:absolute; inset:0; pointer-events:none; transition:opacity .8s; }
  #guide.off { opacity:0; }
  #guide .gL, #guide .gR { position:absolute; top:36%; width:42%; text-align:center; font-size:15px; line-height:1.6; color:rgba(240,230,210,.85); text-shadow:0 0 6px #000; }
  #guide .gL { left:2%; border-right:1px dashed rgba(240,230,210,.25); }
  #guide .gR { right:2%; }
  #guide b { font-size:20px; letter-spacing:.2em; }
  #guide .gU { position:absolute; right:calc(16px + env(safe-area-inset-right)); bottom:calc(192px + env(safe-area-inset-bottom)); font-size:12px; line-height:1.6; text-align:right; color:rgba(240,230,210,.85); text-shadow:0 0 6px #000; }
  #pcguide { position:fixed; left:50%; bottom:calc(40px + env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:13px; line-height:1.9; color:#cfc5b3; background:rgba(0,0,0,.5); border:1px solid #3d352d; padding:10px 18px; pointer-events:none; transition:opacity .8s; white-space:nowrap; }
  #pcguide.off { opacity:0; }
  #pcguide b { color:#f0e3c8; font-weight:normal; }

</head>
<body>
<canvas id="c"></canvas>
<canvas id="grain" width="320" height="200"></canvas>
<div id="vig"></div><div id="dark"></div><div id="redv"></div>

<div id="hud" class="hidden">
  <div id="chapS"></div>
  <div id="oilW">提灯の油<div id="oilbar"><i></i></div></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="hint"></div>
  <div id="sub"></div>
  <div id="stam"><i></i></div>
</div>
<div id="chap"><div class="n"></div><div class="t"></div></div>
<div id="msg"></div>
<div id="pcguide" class="hidden off"><b>WASD</b> 移動　<b>マウス</b> 見回す　<b>Shift</b> 走る<br><b>Space（長押し）</b> 振り返る　<b>F</b> 提灯　<b>E</b> 調べる　<b>Esc</b> 一時停止</div>

<div id="touch" class="hidden">
  <div id="joy"><i></i></div>
  <div id="guide" class="off"><div class="gL">左側をなぞって<br><b>歩く</b></div><div class="gR">右側をなぞって<br><b>見回す</b></div><div class="gU">母の声がしたら<br><b>［振り返る］</b>を長押し</div></div>
  <button class="tb big" id="tLook">振り返る</button>
  <button class="tb big" id="tRun">走る</button>
  <button class="tb" id="tUse">調べる</button>
  <button class="tb on" id="tLamp">提灯</button>
  <button class="tb" id="tPause">Ⅱ</button>
</div>

<div id="title" class="ov">
  <h1>姨捨</h1>
  <div class="kana">おばすて</div>
  <div class="tag">七十になった親は、山へ送る。</div>
  <button class="btn" id="startBtn">山へ向かう</button>
  <button class="btn hidden" id="contBtn">続きから</button>
  <div id="ends"></div>
  <div class="howto" id="howto"></div>
  <div class="warn">ヘッドホン推奨 ／ 突然大きな音が出ます ／ 約15〜20分</div>
</div>
<div id="choice" class="ov hidden">
  <div class="q">背中の母が、小さく言った。<br>「……ここで、いいよ」</div>
  <button class="btn" id="chDown">母を下ろす</button>
  <button class="btn" id="chCarry">背負ったまま、引き返す</button>
</div>
<div id="pause" class="ov hidden">
  <h2>一時停止</h2>
  <label class="sens">視点の感度 <input type="range" id="sens" min="0.3" max="2.5" step="0.1" value="1"></label>
  <div class="row"><button class="btn" id="resumeBtn">つづける</button><button class="btn" id="quitBtn">タイトルへ</button></div>
</div>
<div id="dead" class="ov hidden">
  <h2 id="deadH">山に、とられた</h2>
  <div class="tip" id="deadTip"></div>
  <div class="row"><button class="btn" id="retryBtn">少し前から</button><button class="btn" id="quit2Btn">タイトルへ</button></div>
</div>
<div id="endv" class="ov hidden">
  <div class="en" id="endN"></div>
  <h2 id="endH"></h2>
  <div class="tip" id="endT"></div>
  <div class="row"><button class="btn" id="quit3Btn">タイトルへ</button></div>
</div>
<div id="black"></div>
