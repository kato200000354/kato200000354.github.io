<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つくったもの置き場</title>
<meta name="description" content="自分でつくったゲームとアプリをまとめて公開しています。ブラウザですぐに遊べます。">
<meta property="og:title" content="つくったもの置き場">
<meta property="og:description" content="自分でつくったゲームとアプリをまとめて公開しています。ブラウザですぐに遊べます。">
<meta property="og:image" content="https://kato200000354.github.io/thumbs/chanbara.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --ink:#26221d; --muted:#6f675c; --line:#ebe3d6;
  --accent:#ff6b3d; --accent-ink:#fff; --chip:#f3ece1; --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17150f; --card:#221f18; --ink:#f3eee6; --muted:#b0a797; --line:#35302566;
    --accent:#ff8a5f; --accent-ink:#1b120c; --chip:#2d2920; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

header{padding:56px 0 28px}
.hello{display:inline-block;background:var(--chip);color:var(--muted);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
h1{font-size:clamp(30px,6vw,48px);line-height:1.2;margin:14px 0 10px;font-weight:800;letter-spacing:.01em}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:0;max-width:36em}
.line-add{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:10px 18px 10px 12px;border-radius:999px;background:#06c755;color:#fff;text-decoration:none;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.line-add:hover{filter:brightness(1.05)}
.line-add:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.line-add .ic{width:28px;height:28px;border-radius:8px;background:#fff;color:#06c755;display:grid;place-items:center;font-size:11px;font-weight:900;letter-spacing:-.02em}
.stats-h{margin:22px 0 8px;font-size:13px;font-weight:800;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:400px;margin-bottom:4px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .num{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .num small{font-size:14px;margin-left:2px}
.stat .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.stat.total .num{color:var(--accent)}
.meta{flex-wrap:wrap}
.meta .r{display:flex;flex-wrap:wrap;gap:2px 8px;margin-left:auto;justify-content:flex-end}
.total-time{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.total-time b{color:var(--ink);font-size:15px}
.line-note{display:block;margin-top:6px;font-size:12px;color:var(--muted)}

.tabs{margin:28px 0 20px;position:sticky;top:0;padding:10px 0;background:var(--bg);z-index:5}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.6;margin-left:4px;font-size:12px}
.bar{display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.tab{white-space:nowrap;flex:none}
.sort{align-self:flex-end}
@media (max-width:720px){
  /* スマホではジャンルを横スクロールで選ぶ */
  .filters{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .tab{font-size:13px;padding:7px 13px}
}
.sort{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.sort select{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background-color:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 30px 7px 14px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding-bottom:56px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{aspect-ratio:3/4;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.kind{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.05em}
.name{font-size:16px;font-weight:800;line-height:1.35;margin:0}
.desc{font-size:13px;color:var(--muted);margin:0}
.thumb{position:relative}
.new{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.meta{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:480px){.name{font-size:14px}.desc{font-size:12px}.meta{font-size:11px}.body{padding:10px 11px 12px}}

/* あなたへのおすすめ */
.rec{margin:8px 0 4px}
.rec h2{font-size:20px;font-weight:800;margin:0}
.rec .sub{margin:2px 0 12px;font-size:13px;color:var(--muted)}
.rec-list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.rec-card{display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease}
.rec-card:hover{transform:translateY(-3px)}
.rec-card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.rec-card .thumb{aspect-ratio:3/4}
.rec-body{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.why{font-size:10.5px;font-weight:800;color:var(--accent);line-height:1.3}
.rec-name{font-size:13px;font-weight:800;line-height:1.35}
@media (max-width:900px){
  .rec-list{display:flex;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-padding-inline:16px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .rec-list::-webkit-scrollbar{display:none}
  .rec-card{flex:0 0 140px;scroll-snap-align:start}
}
/* ランキング */
.rank{margin:30px 0 4px;background:var(--card);border-radius:20px;padding:16px 16px 10px;box-shadow:var(--shadow);max-width:720px}
.rank-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.rank h2{font-size:20px;font-weight:800;margin:0}
.rank .sub{margin:6px 0 8px;font-size:12px;color:var(--muted)}
.rank-tabs{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.rank-tabs button{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:800;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.rank-tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rank-list{list-style:none;margin:0;padding:0}
.rank-item{display:flex;align-items:center;gap:10px;padding:8px 4px;text-decoration:none;border-top:1px solid var(--line);border-radius:8px}
.rank-list li:first-child .rank-item{border-top:0}
.rank-item:hover{background:var(--chip)}
.rank-item:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.rank-item .no{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-item.top .no{color:#fff}
.rank-item.top1 .no{background:#e8a317}
.rank-item.top2 .no{background:#9aa3ad}
.rank-item.top3 .no{background:#c27a45}
.rank-item img{flex:none;width:42px;height:56px;object-fit:cover;object-position:top;border-radius:8px;background:var(--chip)}
.rank-item .info{flex:1;min-width:0;display:flex;flex-direction:column}
.rank-item .info b{font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-item .info small{font-size:11px;color:var(--muted);font-weight:700}
.rank-item .val{flex:none;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.rank-empty{padding:18px 4px;color:var(--muted);font-size:13px;text-align:center}
#rank-more{display:block;margin:6px auto 2px;appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:800;color:var(--accent);cursor:pointer;padding:6px 10px}
@media (max-width:480px){.rank-tabs button{font-size:11.5px;padding:6px 8px}}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="hello">ようこそ</span>
    <h1>つくったもの<span>置き場</span></h1>
    <p class="lead">自分でつくったゲームとアプリをまとめています。インストール不要で、スマホでもパソコンでもそのまま遊べます。</p>
    <p class="stats-h">これまでに作った数</p>
    <div class="stats">
      <div class="stat total"><div class="lbl">ぜんぶ</div><div class="num"><span id="s-all">–</span><small>個</small></div></div>
      <div class="stat"><div class="lbl">ゲーム</div><div class="num"><span id="s-game">–</span><small>個</small></div></div>
      <div class="stat"><div class="lbl">アプリ</div><div class="num"><span id="s-app">–</span><small>個</small></div></div>
    </div>
    <p class="total-time" id="total-time" hidden>累計プレイ時間（みんなの合計）：<b id="total-time-v"></b></p>
    <a class="line-add" href="https://line.me/R/ti/p/@744txljx" target="_blank" rel="noopener"><span class="ic">LINE</span>まいにちらぼを友だち追加</a>
    <span class="line-note">新しいゲームができたら LINE でお知らせします</span>
  </header>

  <section class="rec" id="rec" hidden aria-labelledby="rec-h">
    <h2 id="rec-h">あなたへのおすすめ</h2>
    <p class="sub" id="rec-sub"></p>
    <div class="rec-list" id="rec-list"></div>
  </section>

  <section class="rank" id="rank" aria-labelledby="rank-h">
    <div class="rank-head"><h2 id="rank-h">🏆 ランキング</h2><div class="rank-tabs" id="rank-tabs" role="tablist" aria-label="ランキングの種類"></div></div>
    <p class="sub" id="rank-sub"></p>
    <ol class="rank-list" id="rank-list"></ol>
    <button id="rank-more" hidden></button>
  </section>

  <nav class="tabs bar" aria-label="絞り込みと並べ替え">
    <div class="filters" id="filters" role="group" aria-label="ジャンル"></div>
    <label class="sort">並べ替え
      <select id="sort">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="pop">人気順</option>
        <option value="time">累計プレイ時間順</option>
        <option value="name">名前順</option>
      </select>
    </label>
  </nav>

  <main class="grid" id="grid"></main>
</div>
<footer><div class="wrap">© kato200000354 ・ 作品はブラウザ上で動きます。記録などのデータはお使いの端末の中だけに保存されます。</div></footer>

<script>
// 作品リストは works.json（自動公開スクリプトが追記する）
// 「人気順」は各作品が開かれた回数、「プレイ時間」は作品ページを表示していた時間（playtime.js が30秒ごとに記録）。どちらも無料カウンター Abacus で集計
(async () => {
const WORKS = (await (await fetch("works.json", {cache: "no-cache"})).json())
  .map(w => ({...w, made: new Date(w.made.replace(" ", "T") + ":00+09:00"), plays: null, secs: null}));

const COUNTER = 'https://abacus.jasoncameron.dev';
const NS = 'kato200000354-works';
const NEW_DAYS = 2;
const grid = document.getElementById('grid');
const sortSel = document.getElementById('sort');
let filter = 'all';
// ジャンル（works.json の genre）。並びはタブの順番
const GENRES = {
  action: '⚔️ アクション', sports: '⚽ スポーツ', race: '🏎️ レース', puzzle: '🧩 パズル・クイズ',
  rpg: '🗡️ RPG・冒険', sim: '🌱 育成・シミュレーション', party: '🎉 パーティー', music: '🎵 リズム・音楽',
  story: '📖 ストーリー', app: '📱 アプリ',
};
const genreOf = w => GENRES[w.genre] ? w.genre : (w.kind === 'app' ? 'app' : 'action');
const genreName = g => GENRES[g].replace(/^\S+\s/, '');

const fmtDate = d => `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
const isNew = d => Date.now() - d < NEW_DAYS * 864e5;

grid.innerHTML = WORKS.map(w => `
  <a class="card" href="${w.href}" data-id="${w.id}" data-kind="${w.kind}">
    <div class="thumb"><img src="thumbs/${w.id}.jpg" alt="" loading="lazy" width="420" height="560">${isNew(w.made) ? '<span class="new">NEW</span>' : ''}</div>
    <div class="body">
      <span class="kind">${genreName(genreOf(w))}</span>
      <h2 class="name">${w.name}</h2>
      <p class="desc">${w.desc}</p>
      <div class="meta"><time datetime="${w.made.toISOString()}">${fmtDate(w.made)}</time><span class="r"><span class="plays" hidden></span><span class="secs" hidden></span></span></div>
    </div>
  </a>`).join('');
const cardOf = id => grid.querySelector(`.card[data-id="${id}"]`);

const SORTS = {
  new: (a,b) => b.made - a.made,
  old: (a,b) => a.made - b.made,
  pop: (a,b) => (b.plays ?? -1) - (a.plays ?? -1) || b.made - a.made,
  time: (a,b) => (b.secs ?? -1) - (a.secs ?? -1) || b.made - a.made,
  name: (a,b) => a.name.localeCompare(b.name, 'ja'),
};
function render(){
  [...WORKS].sort(SORTS[sortSel.value]).forEach(w => {
    const c = cardOf(w.id);
    c.hidden = filter !== 'all' && genreOf(w) !== filter;
    grid.appendChild(c);
  });
}

const count = k => WORKS.filter(w => k === 'all' || w.kind === k).length;
['all','game','app'].forEach(k => document.getElementById('s-'+k).textContent = count(k));

// ジャンルのタブ（作品があるジャンルだけ）
const filters = document.getElementById('filters');
const tabs = [['all', 'すべて', WORKS.length], ...Object.entries(GENRES).map(([g, label]) => [g, label, WORKS.filter(w => genreOf(w) === g).length]).filter(t => t[2])];
filters.innerHTML = tabs.map(([g, label, n]) => `<button class="tab" data-f="${g}" aria-pressed="${g === 'all'}">${label}<span class="n">${n}</span></button>`).join('');
try { const saved = localStorage.getItem('works-genre'); if (tabs.some(t => t[0] === saved)) filter = saved; } catch {}
const markTabs = () => filters.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filter));
markTabs();
filters.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  filter = btn.dataset.f;
  try { localStorage.setItem('works-genre', filter); } catch {}
  markTabs();
  btn.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: 'smooth'});
  render();
});
try { const saved = localStorage.getItem('works-sort'); if (saved in SORTS) sortSel.value = saved; } catch {}
sortSel.addEventListener('change', () => {
  try { localStorage.setItem('works-sort', sortSel.value); } catch {}
  render();
});
render();

// 遊ばれた回数とプレイ時間（30秒単位で記録）を読み込む。
// まず1時間ごとの集計（counts.json）と、前回ブラウザに覚えた値を表示する。
// そのあと最新の値をカウンターに問い合わせる（「10秒間に30回まで」なので順番にゆっくり）
const fmtTime = s => s < 60 ? '1分未満' : s < 3600 ? `${Math.floor(s / 60)}分` : `${Math.floor(s / 3600)}時間${Math.floor(s % 3600 / 60) ? Math.floor(s % 3600 / 60) + '分' : ''}`;
let cache = {};
try { cache = JSON.parse(localStorage.getItem('works-counts')) || {}; } catch {}
try {
  const snap = (await (await fetch('counts.json', {cache: 'no-cache'})).json()).counts || {};
  for (const [k, v] of Object.entries(snap)) cache[k] = Math.max(v, cache[k] ?? 0); // 数は減らないので大きいほうを使う
} catch {}
const saveCache = () => { try { localStorage.setItem('works-counts', JSON.stringify(cache)); } catch {} };

function show(w) {
  if (w.plays != null) {
    const el = cardOf(w.id).querySelector('.plays');
    el.textContent = `▶ ${w.plays.toLocaleString()}回`;
    el.hidden = false;
  }
  if (w.secs != null) {
    const el = cardOf(w.id).querySelector('.secs');
    el.textContent = `⏱ 累計${fmtTime(w.secs)}`;
    el.title = 'これまでにみんなが遊んだ時間の合計';
    el.hidden = false;
  }
}
function showTotal() {
  const known = WORKS.filter(x => x.secs != null);
  if (!known.length) return;
  document.getElementById('total-time-v').textContent = fmtTime(known.reduce((t, x) => t + x.secs, 0));
  document.getElementById('total-time').hidden = false;
}
const timed = w => w.href.startsWith('apps/'); // プレイ時間はこのサイト内の作品だけ

WORKS.forEach(w => {
  if (cache[w.id] != null) w.plays = cache[w.id];
  if (timed(w) && cache[w.id + '-t30'] != null) w.secs = cache[w.id + '-t30'] * 30;
  show(w);
});
showTotal();
if (['pop', 'time'].includes(sortSel.value)) render();

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function getCount(key) {
  for (let tries = 0; tries < 4; tries++) {
    try {
      const res = await fetch(`${COUNTER}/get/${NS}/${key}`);
      if (res.status === 429) { await sleep(10000); continue; }
      return res.ok ? (await res.json()).value : res.status === 404 ? 0 : null;
    } catch { return null; }
  }
  return null;
}
(async () => {
  await sleep(1500);
  const jobs = WORKS.flatMap(w => [[w, w.id, 'plays'], ...(timed(w) ? [[w, w.id + '-t30', 'secs']] : [])]);
  for (const [w, key, field] of jobs) {
    const v = await getCount(key);
    if (v != null && v >= (cache[key] ?? 0)) {
      cache[key] = v;
      w[field] = field === 'secs' ? v * 30 : v;
      show(w);
      if (field === 'secs') showTotal();
      if ((field === 'plays' && sortSel.value === 'pop') || (field === 'secs' && sortSel.value === 'time')) render();
    }
    await sleep(450); // 10秒に22回程度（作品を開いたときの記録のぶんを残しておく）
  }
  saveCache();
  showTotal();
})();
// ---------- あなたへのおすすめ ----------
// この端末で開いた作品・遊んだ時間（my-history）から好きなジャンルを推定し、まだ遊んでいない作品を選ぶ。
// 記録がない人には、人気と新作から選ぶ。日替わりで少し入れ替わる。
const REC_COUNT = 6;
const SHORT = { puzzle: 'パズル', rpg: 'RPG', sim: '育成', music: 'リズム' }; // おすすめの理由に使う短い呼び方
const shortName = g => SHORT[g] || genreName(g);
let history = {};
try { history = JSON.parse(localStorage.getItem('my-history')) || {}; } catch {}
const saveHistory = () => { try { localStorage.setItem('my-history', JSON.stringify(history)); } catch {} };

function recommend() {
  const byId = Object.fromEntries(WORKS.map(w => [w.id, w]));
  // 好きなジャンル: 開いた回数 + 遊んだ分数（最近ほど重く）
  const like = {};
  for (const [id, h] of Object.entries(history)) {
    const w = byId[id]; if (!w) continue;
    const recent = h.last ? Math.max(0.3, 1 - (Date.now() - h.last) / (30 * 864e5)) : 0.5;
    like[genreOf(w)] = (like[genreOf(w)] || 0) + (h.opens + Math.min(h.secs / 60, 30)) * recent;
  }
  const maxLike = Math.max(0, ...Object.values(like));
  const maxPlays = Math.max(1, ...WORKS.map(w => w.plays || 0));
  const maxSecs = Math.max(1, ...WORKS.map(w => w.secs || 0));
  const day = new Date().toISOString().slice(0, 10);
  const jitter = id => { let h = 0; for (const c of day + id) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0) / 4294967296; }; // 日替わりの揺らぎ

  const scored = WORKS.filter(w => !history[w.id]).map(w => {
    const g = genreOf(w);
    const fan = maxLike ? (like[g] || 0) / maxLike : 0;
    const pop = Math.sqrt((w.plays || 0) / maxPlays) * 0.6 + Math.sqrt((w.secs || 0) / maxSecs) * 0.4;
    const fresh = isNew(w.made) ? 1 : Date.now() - w.made < 7 * 864e5 ? 0.5 : 0;
    const score = fan * 2 + pop * 1.2 + fresh * 0.6 + jitter(w.id) * 0.5;
    const reason = fan >= 0.5 ? `${shortName(g)}好きのあなたに` : fresh === 1 ? '新作' : pop > 0.35 ? 'みんなに人気' : fan > 0 ? `${shortName(g)}好きのあなたに` : 'ピックアップ';
    return { w, score, reason, g };
  }).sort((a, b) => b.score - a.score);

  // いちばん好きなジャンルは3つまで、ほかのジャンルは2つまで（足りなければ解除）
  const fav = maxLike ? Object.keys(like).find(g => like[g] === maxLike) : null;
  const picked = [], perGenre = {};
  for (const s of scored) {
    if (picked.length >= REC_COUNT) break;
    if ((perGenre[s.g] || 0) >= (s.g === fav ? 3 : 2)) continue;
    picked.push(s); perGenre[s.g] = (perGenre[s.g] || 0) + 1;
  }
  for (const s of scored) { if (picked.length >= REC_COUNT) break; if (!picked.includes(s)) picked.push(s); }
  return { picked, personal: maxLike > 0 };
}

function renderRec() {
  const { picked, personal } = recommend();
  const sec = document.getElementById('rec');
  if (!picked.length) { sec.hidden = true; return; }
  document.getElementById('rec-sub').textContent = personal ? 'あなたがよく遊ぶジャンルから、まだ遊んでいない作品を選びました' : 'まずはこのあたりから遊んでみて！遊ぶほどあなた好みになっていきます';
  document.getElementById('rec-list').innerHTML = picked.map(({ w, reason }) => `
    <a class="rec-card" href="${w.href}" data-id="${w.id}">
      <div class="thumb"><img src="thumbs/${w.id}.jpg" alt="" loading="lazy" width="420" height="560"></div>
      <div class="rec-body"><span class="why">${reason}</span><span class="rec-name">${w.name}</span></div>
    </a>`).join('');
  sec.hidden = false;
}

// カードを開いたら1回として数え、この端末の記録にも残す
const onOpen = e => {
  const c = e.target.closest('.card, .rec-card, .rank-item');
  if (!c) return;
  const h = history[c.dataset.id] ||= { opens: 0, secs: 0 };
  h.last = Date.now(); saveHistory(); // 回数は作品ページ側（playtime.js）で数える
  fetch(`${COUNTER}/hit/${NS}/${c.dataset.id}`, {keepalive: true}).catch(() => {});
};
grid.addEventListener('click', onOpen);
document.getElementById('rec-list').addEventListener('click', onOpen);
renderRec(); // 集計ファイルとブラウザの記憶から回数を読み終えたあとに作る

// ---------- ランキング ----------
// 今週の人気（7日前からの増え方）／累計プレイ時間／累計の人気。日ごとの記録は counts-history.json（1時間ごとの自動集計が保存）
const RANKS = {
  week: { label: '今週の人気', unit: w => `▶ ${w.v.toLocaleString()}回` },
  time: { label: '累計プレイ時間', unit: w => `⏱ ${fmtTime(w.v)}` },
  plays: { label: '累計の人気', unit: w => `▶ ${w.v.toLocaleString()}回` },
};
let rankKind = 'week', rankAll = false, weekBase = null;
const fmtMD = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;

async function loadWeekBase() {
  try {
    const h = await (await fetch('counts-history.json', {cache: 'no-cache'})).json();
    const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    const weekAgo = new Date(Date.now() + 9 * 3600e3 - 7 * 864e5).toISOString().slice(0, 10);
    const days = Object.keys(h).sort().filter(d => d < today);
    const date = days.filter(d => d <= weekAgo).pop() || days[0]; // 7日前（なければいちばん古い日）
    if (date) weekBase = { date, counts: h[date] };
  } catch {}
}

function renderRank() {
  const tabsEl = document.getElementById('rank-tabs');
  tabsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.r === rankKind));
  let rows, sub;
  if (rankKind === 'week') {
    if (!weekBase) {
      sub = '今週のランキングは、毎日の記録がたまる明日から表示されます';
      rows = [];
    } else {
      sub = `${fmtMD(weekBase.date)} から今日までに開かれた回数`;
      rows = WORKS.map(w => ({ w, v: Math.max(0, (w.plays ?? 0) - (weekBase.counts[w.id] ?? 0)) }));
    }
  } else if (rankKind === 'time') {
    sub = 'これまでにみんなが遊んだ時間';
    rows = WORKS.filter(timed).map(w => ({ w, v: w.secs ?? 0 }));
  } else {
    sub = 'これまでに開かれた回数';
    rows = WORKS.map(w => ({ w, v: w.plays ?? 0 }));
  }
  rows = rows.filter(r => r.v > 0).sort((a, b) => b.v - a.v || b.w.made - a.w.made).slice(0, 10);
  document.getElementById('rank-sub').textContent = sub;
  const shown = rankAll ? rows : rows.slice(0, 5);
  let prev = null, no = 0;
  document.getElementById('rank-list').innerHTML = shown.length ? shown.map((r, i) => {
    if (r.v !== prev) { no = i + 1; prev = r.v; } // 同じ数なら同じ順位
    return `<li><a class="rank-item${no <= 3 ? ' top top' + no : ''}" href="${r.w.href}" data-id="${r.w.id}">
      <span class="no">${no}</span>
      <img src="thumbs/${r.w.id}.jpg" alt="" loading="lazy" width="42" height="56">
      <span class="info"><b>${r.w.name}</b><small>${genreName(genreOf(r.w))}</small></span>
      <span class="val">${RANKS[rankKind].unit(r)}</span></a></li>`;
  }).join('') : `<li class="rank-empty">${rankKind === 'week' && !weekBase ? 'もうすぐ集計がはじまります' : 'まだデータがありません'}</li>`;
  const more = document.getElementById('rank-more');
  more.hidden = rows.length <= 5;
  more.textContent = rankAll ? '閉じる' : `もっと見る（${rows.length}位まで）`;
}

document.getElementById('rank-tabs').innerHTML = Object.entries(RANKS).map(([k, r]) => `<button role="tab" data-r="${k}">${r.label}</button>`).join('');
document.getElementById('rank-tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  rankKind = b.dataset.r; rankAll = false; renderRank();
});
document.getElementById('rank-more').addEventListener('click', () => { rankAll = !rankAll; renderRank(); });
document.getElementById('rank-list').addEventListener('click', onOpen);
await loadWeekBase();
if (!weekBase) rankKind = 'time'; // 今週の記録がまだなければ累計から見せる
renderRank();

})();
</script>
</body>
