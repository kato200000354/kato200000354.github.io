<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つくったもの置き場</title>
<meta name="description" content="自分でつくったゲームとアプリをまとめて公開しています。ブラウザですぐに遊べます。">
<meta property="og:title" content="つくったもの置き場">
<meta property="og:description" content="自分でつくったゲームとアプリをまとめて公開しています。ブラウザですぐに遊べます。">
<meta property="og:image" content="https://kato200000354.github.io/thumbs/chanbara.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f0; --card:#ffffff; --ink:#26221d; --muted:#6f675c; --line:#ebe3d6;
  --accent:#ff6b3d; --accent-ink:#fff; --chip:#f3ece1; --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px rgba(60,40,10,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17150f; --card:#221f18; --ink:#f3eee6; --muted:#b0a797; --line:#35302566;
    --accent:#ff8a5f; --accent-ink:#1b120c; --chip:#2d2920; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.6}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

header{padding:56px 0 28px}
.hello{display:inline-block;background:var(--chip);color:var(--muted);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
h1{font-size:clamp(30px,6vw,48px);line-height:1.2;margin:14px 0 10px;font-weight:800;letter-spacing:.01em}
h1 span{color:var(--accent)}
.lead{color:var(--muted);margin:0;max-width:36em}
.line-add{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:10px 18px 10px 12px;border-radius:999px;background:#06c755;color:#fff;text-decoration:none;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.line-add:hover{filter:brightness(1.05)}
.line-add:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.line-add .ic{width:28px;height:28px;border-radius:8px;background:#fff;color:#06c755;display:grid;place-items:center;font-size:11px;font-weight:900;letter-spacing:-.02em}
.stats-h{margin:22px 0 8px;font-size:13px;font-weight:800;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:400px;margin-bottom:4px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .num{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .num small{font-size:14px;margin-left:2px}
.stat .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.stat.total .num{color:var(--accent)}
.meta .r{display:flex;gap:8px}
.total-time{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.total-time b{color:var(--ink);font-size:15px}
.line-note{display:block;margin-top:6px;font-size:12px;color:var(--muted)}

.tabs{margin:28px 0 20px;position:sticky;top:0;padding:10px 0;background:var(--bg);z-index:5}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.6;margin-left:4px;font-size:12px}
.bar{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.sort{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.sort select{font:inherit;font-weight:700;font-size:14px;color:var(--ink);background-color:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 30px 7px 14px;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding-bottom:56px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-3px)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.thumb{aspect-ratio:3/4;background:var(--chip);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.kind{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.05em}
.name{font-size:16px;font-weight:800;line-height:1.35;margin:0}
.desc{font-size:13px;color:var(--muted);margin:0}
.thumb{position:relative}
.new{position:absolute;top:8px;left:8px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.meta{margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:480px){.name{font-size:14px}.desc{font-size:12px}.meta{font-size:11px}.body{padding:10px 11px 12px}}

footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="hello">ようこそ</span>
    <h1>つくったもの<span>置き場</span></h1>
    <p class="lead">自分でつくったゲームとアプリをまとめています。インストール不要で、スマホでもパソコンでもそのまま遊べます。</p>
    <p class="stats-h">これまでに作った数</p>
    <div class="stats">
      <div class="stat total"><div class="lbl">ぜんぶ</div><div class="num"><span id="s-all">–</span><small>個</small></div></div>
      <div class="stat"><div class="lbl">ゲーム</div><div class="num"><span id="s-game">–</span><small>個</small></div></div>
      <div class="stat"><div class="lbl">アプリ</div><div class="num"><span id="s-app">–</span><small>個</small></div></div>
    </div>
    <p class="total-time" id="total-time" hidden>みんなが遊んだ時間：合計 <b id="total-time-v"></b></p>
    <a class="line-add" href="https://line.me/R/ti/p/@744txljx" target="_blank" rel="noopener"><span class="ic">LINE</span>まいにちらぼを友だち追加</a>
    <span class="line-note">新しいゲームができたら LINE でお知らせします</span>
  </header>

  <nav class="tabs bar" aria-label="絞り込みと並べ替え">
    <div class="filters">
      <button class="tab" data-f="all" aria-pressed="true">すべて<span class="n" id="n-all"></span></button>
      <button class="tab" data-f="game" aria-pressed="false">ゲーム<span class="n" id="n-game"></span></button>
      <button class="tab" data-f="app" aria-pressed="false">アプリ<span class="n" id="n-app"></span></button>
    </div>
    <label class="sort">並べ替え
      <select id="sort">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="pop">人気順</option>
        <option value="time">プレイ時間順</option>
        <option value="name">名前順</option>
      </select>
    </label>
  </nav>

  <main class="grid" id="grid"></main>
</div>
<footer><div class="wrap">© kato200000354 ・ 作品はブラウザ上で動きます。記録などのデータはお使いの端末の中だけに保存されます。</div></footer>

<script>
// 作品リストは works.json（自動公開スクリプトが追記する）
// 「人気順」は各作品が開かれた回数、「プレイ時間」は作品ページを表示していた時間（playtime.js が30秒ごとに記録）。どちらも無料カウンター Abacus で集計
(async () => {
const WORKS = (await (await fetch("works.json", {cache: "no-cache"})).json())
  .map(w => ({...w, made: new Date(w.made.replace(" ", "T") + ":00+09:00"), plays: null, secs: null}));

const COUNTER = 'https://abacus.jasoncameron.dev';
const NS = 'kato200000354-works';
const NEW_DAYS = 2;
const grid = document.getElementById('grid');
const sortSel = document.getElementById('sort');
let filter = 'all';

const fmtDate = d => `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;
const isNew = d => Date.now() - d < NEW_DAYS * 864e5;

grid.innerHTML = WORKS.map(w => `
  <a class="card" href="${w.href}" data-id="${w.id}" data-kind="${w.kind}">
    <div class="thumb"><img src="thumbs/${w.id}.jpg" alt="" loading="lazy" width="420" height="560">${isNew(w.made) ? '<span class="new">NEW</span>' : ''}</div>
    <div class="body">
      <span class="kind">${w.kind === 'game' ? 'GAME' : 'APP'}</span>
      <h2 class="name">${w.name}</h2>
      <p class="desc">${w.desc}</p>
      <div class="meta"><time datetime="${w.made.toISOString()}">${fmtDate(w.made)}</time><span class="r"><span class="plays" hidden></span><span class="secs" hidden></span></span></div>
    </div>
  </a>`).join('');
const cardOf = id => grid.querySelector(`.card[data-id="${id}"]`);

const SORTS = {
  new: (a,b) => b.made - a.made,
  old: (a,b) => a.made - b.made,
  pop: (a,b) => (b.plays ?? -1) - (a.plays ?? -1) || b.made - a.made,
  time: (a,b) => (b.secs ?? -1) - (a.secs ?? -1) || b.made - a.made,
  name: (a,b) => a.name.localeCompare(b.name, 'ja'),
};
function render(){
  [...WORKS].sort(SORTS[sortSel.value]).forEach(w => {
    const c = cardOf(w.id);
    c.hidden = filter !== 'all' && w.kind !== filter;
    grid.appendChild(c);
  });
}

const count = k => WORKS.filter(w => k === 'all' || w.kind === k).length;
['all','game','app'].forEach(k => document.getElementById('n-'+k).textContent = document.getElementById('s-'+k).textContent = count(k));
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b === btn));
  render();
}));
try { const saved = localStorage.getItem('works-sort'); if (saved in SORTS) sortSel.value = saved; } catch {}
sortSel.addEventListener('change', () => {
  try { localStorage.setItem('works-sort', sortSel.value); } catch {}
  render();
});
render();

// 遊ばれた回数を読み込む（取れなかった作品は回数を表示しない）
WORKS.forEach(async w => {
  try {
    const res = await fetch(`${COUNTER}/get/${NS}/${w.id}`);
    w.plays = res.ok ? (await res.json()).value : res.status === 404 ? 0 : null;
  } catch { w.plays = null; }
  if (w.plays == null) return;
  const el = cardOf(w.id).querySelector('.plays');
  el.textContent = `▶ ${w.plays.toLocaleString()}回`;
  el.hidden = false;
  if (sortSel.value === 'pop') render();
});
// プレイ時間を読み込む（このサイト内の作品だけ。30秒単位で記録されている）
const fmtTime = s => s < 60 ? '1分未満' : s < 3600 ? `${Math.floor(s / 60)}分` : `${Math.floor(s / 3600)}時間${Math.floor(s % 3600 / 60) ? Math.floor(s % 3600 / 60) + '分' : ''}`;
const timed = WORKS.filter(w => w.href.startsWith('apps/'));
let pending = timed.length;
timed.forEach(async w => {
  try {
    const res = await fetch(`${COUNTER}/get/${NS}/${w.id}-t30`);
    w.secs = res.ok ? (await res.json()).value * 30 : res.status === 404 ? 0 : null;
  } catch { w.secs = null; }
  if (w.secs != null) {
    const el = cardOf(w.id).querySelector('.secs');
    el.textContent = `⏱ ${fmtTime(w.secs)}`;
    el.hidden = false;
    if (sortSel.value === 'time') render();
  }
  if (--pending === 0) {
    const known = timed.filter(x => x.secs != null);
    if (known.length) {
      document.getElementById('total-time-v').textContent = fmtTime(known.reduce((t, x) => t + x.secs, 0));
      document.getElementById('total-time').hidden = false;
    }
  }
});
// カードを開いたら1回として数える
grid.addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) fetch(`${COUNTER}/hit/${NS}/${c.dataset.id}`, {keepalive: true}).catch(() => {});
});
})();
</script>
</body>
</html>
